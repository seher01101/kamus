const $ = s => document.querySelector(s);
const list = $("#list"), q = $("#q");
let filter = "all", sfilter = "", letter = "A", limit = 120;

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
DATA.forEach((e, i) => { e.i = i; e.key = norm(e.w); e.hay = norm(e.m + " " + (e.note || "")); });
const byKey = new Map(DATA.map(e => [e.key, e]));
$("#total").textContent = DATA.filter(e => e.type === "word" || e.type === "phrase").length;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// wrap each Indonesian word so it can be clicked to look up
function linkify(text, hit) {
  return esc(text).replace(/[A-Za-z]+(?:-[A-Za-z]+)*/g, w => {
    const k = w.toLowerCase();
    const inner = hit && k === hit ? `<mark>${w}</mark>` : w;
    return byKey.has(k) ? `<span class="w" tabindex="0" data-look="${k}">${inner}</span>` : inner;
  });
}
function markPhrase(htmlStr, phrase) {
  if (!phrase || !phrase.includes(" ")) return htmlStr;
  return htmlStr; // phrase shown via header; keep sentence clean
}

// --- speech
let idVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  idVoice = vs.find(v => /^id|in[-_]ID/i.test(v.lang)) || vs.find(v => /indones/i.test(v.name)) || null;
  $("#voiceNote").textContent = vs.length && !idVoice ? " 你的浏览器没有印尼语语音，发音可能不准，建议用 Edge 浏览器打开。" : "";
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/-/g, " "));
  u.lang = "id-ID"; u.rate = 0.8;
  if (idVoice) u.voice = idVoice;
  speechSynthesis.speak(u);
}

function entryHTML(e, hitWord) {
  const tag = e.type === "phrase" ? '<span class="tag">词组</span>'
    : e.type === "affix" ? '<span class="tag">' + esc(e.m) + '</span>'
    : e.type === "typo" ? '<span class="tag typo">错拼</span>' : "";
  const freq = e.type === "word" || e.type === "phrase"
    ? `<span class="freq">${e.n ? "资料中 " + e.n + " 句用到" : "见于词表 / 注释"}</span>` : "";
  const srcs = e.srcs && e.srcs.length ? `<div class="srcs">出现在${e.srcs.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : "";
  const sayBtn = (e.type === "word" || e.type === "phrase") ? `<button class="say" type="button" data-say="${esc(e.w)}" aria-label="朗读 ${esc(e.w)}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>` : "";
  let body = "";
  if (e.type === "typo") body = `<div class="mean">${esc(e.m)} → <span class="w" tabindex="0" data-look="${esc(e.to)}">${esc(e.to)}</span></div>`;
  else if (e.type === "affix") body = `<div class="note">${linkify(e.note)}</div>`;
  else body = `<div class="mean">${esc(e.m)}</div>` + (e.note ? `<div class="note">${linkify(e.note)}</div>` : "");
  const phr = e.ph && e.ph.length ? `<div class="phr">${e.ph.map(p => `<button type="button" data-look="${esc(p[0].toLowerCase())}">${esc(p[0])}<span>${esc(p[1])}</span></button>`).join("")}</div>` : "";
  const exs = e.ex || [];
  const exItem = x => `<li><div class="id">${linkify(x[0], e.type === "word" ? e.key : null)}<span class="sec">${esc(x[2])}</span></div>${x[1] ? `<div class="zh">${esc(x[1])}</div>` : ""}</li>`;
  const ex = exs.length ? `<ul class="ex">${exItem(exs[0])}${exs.slice(1).map(x => exItem(x).replace("<li>", '<li hidden>')).join("")}</ul>` + (exs.length > 1 ? `<button class="more" type="button">更多例句（${exs.length - 1}）</button>` : "") : "";
  return `<article class="entry" id="e${e.i}"><div class="head"><span class="hw">${esc(e.w)}</span>${e.ipa ? `<span class="ipa">[${esc(e.ipa)}]</span>` : ""}${sayBtn}${tag}${freq}</div>${body}${srcs}${phr}${ex}</article>`;
}

// --- search
const STRIP = [
  [/^meny/, "s"], [/^meng/, ""], [/^meng/, "k"], [/^mem/, "p"], [/^mem/, ""], [/^men/, "t"], [/^men/, ""], [/^me/, ""],
  [/^memper/, ""], [/^ber/, ""], [/^be/, ""], [/^di/, ""], [/^ter/, ""], [/^ke/, ""], [/^pe/, ""], [/^per/, ""], [/^se/, ""],
];
function rootGuesses(w) {
  const out = new Set();
  const suf = [w, w.replace(/(kan|an|i|nya|lah|kah)$/, "")];
  for (const s of suf) { out.add(s); for (const [re, add] of STRIP) if (re.test(s)) out.add(add + s.replace(re, "")); }
  out.delete(w);
  return [...out].filter(x => x.length > 2 && byKey.has(x));
}

function score(e, t) {
  if (e.key === t) return 100;
  if (e.key.startsWith(t)) return 80 - Math.min(e.key.length - t.length, 20);
  if (e.key.includes(t)) return 50;
  if (e.hay.includes(t)) return e.m.toLowerCase().includes(t) ? 40 : 25;
  return 0;
}

function render(keepLimit) {
  if (!keepLimit) limit = 120;
  const t = norm(q.value);
  $("#clear").hidden = !t;
  let rows;
  const typeOk = e => (filter === "all" || filter === "freq" ? true : e.type === filter) && (!sfilter || (e.srcs || []).includes(sfilter));
  const first = e => (e.key.replace(/^[^a-z]+/, "")[0] || "#").toUpperCase();
  document.querySelectorAll("#az button").forEach(b => b.setAttribute("aria-pressed", !t && filter !== "freq" && b.dataset.az === letter));
  if (t) {
    rows = DATA.filter(typeOk).map(e => [e, score(e, t)]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1] || a[0].key.localeCompare(b[0].key)).map(r => r[0]);
    if (!rows.length) {
      const roots = rootGuesses(t);
      if (roots.length) rows = roots.map(r => byKey.get(r));
      list.innerHTML = rows.length
        ? `<p class="empty">词典里没有 <b>${esc(q.value)}</b> 这个形式，它可能是下面这个词加了前后缀：</p>` + rows.map(e => entryHTML(e)).join("")
        : `<p class="empty">没有找到 <b>${esc(q.value)}</b>。试试少打几个字母，或者直接输入中文意思。</p>`;
      $("#count").textContent = rows.length ? "可能的词根" : "0 条";
      return;
    }
  } else if (filter === "freq") {
    rows = DATA.filter(e => typeOk(e) && e.type === "word").sort((a, b) => b.n - a.n || a.key.localeCompare(b.key));
  } else {
    rows = DATA.filter(e => typeOk(e) && e.type !== "typo" && (filter === "affix" || first(e) === letter))
      .sort((a, b) => a.key.replace(/^[^a-z]+/, "").localeCompare(b.key.replace(/^[^a-z]+/, "")));
  }
  $("#count").textContent = (!t && filter !== "freq" && filter !== "affix" ? letter + " 开头 · " : "") + rows.length + " 条";
  let html = rows.slice(0, limit).map(e => entryHTML(e)).join("");
  if (rows.length > limit) html += `<button class="loadmore" type="button">再显示 ${Math.min(120, rows.length - limit)} 条（还有 ${rows.length - limit} 条）</button>`;
  list.innerHTML = html || '<p class="empty">这个字母下没有符合条件的词。</p>';
}

function lookUp(word) {
  q.value = word; render();
  window.scrollTo({ top: 0 });
  q.focus({ preventScroll: true });
}

// alphabet
$("#az").innerHTML = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(L => `<button type="button" data-az="${L}">${L}</button>`).join("");
$("#az").addEventListener("click", ev => {
  const L = ev.target.dataset.az; if (!L) return;
  letter = L; q.value = "";
  if (filter === "freq" || filter === "affix") filter = "all";
  setChips(); render(); window.scrollTo({ top: 0 });
});

function setChips() {
  document.querySelectorAll(".chip[data-f]").forEach(c => c.setAttribute("aria-pressed", c.dataset.f === filter));
  document.querySelectorAll(".chip[data-s]").forEach(c => c.setAttribute("aria-pressed", c.dataset.s === sfilter));
}
document.querySelector(".srcf").addEventListener("click", ev => {
  const b = ev.target.closest("[data-s]"); if (!b) return;
  sfilter = b.dataset.s; setChips(); render();
});
document.querySelector(".filters").addEventListener("click", ev => {
  const f = ev.target.dataset.f; if (!f) return;
  filter = f; setChips(); render();
});

let timer;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 90); });
$("#clear").addEventListener("click", () => { q.value = ""; render(); q.focus(); });

list.addEventListener("click", ev => {
  const s = ev.target.closest("[data-say]"); if (s) return say(s.dataset.say);
  const l = ev.target.closest("[data-look]"); if (l) return lookUp(l.dataset.look);
  if (ev.target.closest(".loadmore")) { limit += 120; return render(true); }
  const m = ev.target.closest(".more");
  if (m) { m.previousElementSibling.querySelectorAll("li[hidden]").forEach(li => li.hidden = false); m.remove(); }
});
list.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.dataset.look) lookUp(ev.target.dataset.look);
});

const start = (location.hash || "").slice(1);
if (start && /^[a-z-]+$/i.test(start)) q.value = start;
render();
</script>
