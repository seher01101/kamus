:root{--prac:#5856d6;--prac-soft:#ecebfc;--learn:#0071e3;--learn-soft:#e4f0fd;--navh:62px}

:root{
  --ground:#f2f2f7; --surface:#ffffff; --surface-2:#e5e5ea;
  --ink:#1c1c1e; --ink-soft:#3a3a3c; --muted:#8e8e93; --line:#d1d1d6;
  --accent:#0071e3; --accent-soft:#e4f0fd; --on-accent:#ffffff;
  --good:#248a3d; --good-soft:#e3f5e8; --gold:#5856d6; --gold-soft:#ecebfc;
  --purple:#8944ab; --purple-soft:#f1e5f8;
  --font-display:"Newsreader","Microsoft YaHei","PingFang SC",Georgia,serif;
  --font-body:"IBM Plex Sans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --cjk:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --glass:color-mix(in srgb,var(--surface) 72%,transparent);
  --glass-border:color-mix(in srgb,var(--ink) 11%,transparent);
  --glass-hi:color-mix(in srgb,white 30%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --accent:#0a84ff;--accent-soft:#0a2e4d;--good:#30d158;--good-soft:#123320;--gold:#7d7aff;--gold-soft:#24234d;--purple:#bf5af2;--purple-soft:#33143d;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(620px 500px at 6% -6%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%),
  radial-gradient(700px 600px at 106% 12%,color-mix(in srgb,var(--purple) 18%,transparent),transparent 60%),
  radial-gradient(560px 520px at 46% 118%,color-mix(in srgb,var(--good) 14%,transparent),transparent 62%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px 0}
.bar{border-radius:20px;padding:14px 16px 12px}
h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--font-body);font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.seg{display:flex;gap:4px;margin-top:10px;padding:3px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--ink-soft);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 2px 0}
.tools .seg{margin-top:0;flex:1;min-width:230px}
.tbtn{font:inherit;font-size:12.5px;font-weight:500;border:0;border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--accent);background:var(--accent-soft);white-space:nowrap}
.sub{font-size:13px;color:var(--muted);margin:10px 4px 0}
.sub b{color:var(--ink-soft)}
#list{display:grid;gap:12px;padding-block:8px 110px}
.card{border-radius:20px;padding:14px 16px 12px}
.card.done{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{font-family:var(--font-display);font-weight:700;font-size:18px;min-width:26px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:1px 9px;line-height:18px}
.c-zi{color:var(--accent);background:var(--accent-soft)}
.c-iz{color:var(--gold);background:var(--gold-soft)}
.c-both{color:var(--good);background:var(--good-soft)}
.c-ref{color:var(--muted);background:color-mix(in srgb,var(--surface-2) 70%,transparent);font-weight:500}
.ok{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:3px 10px;cursor:pointer}
.ok[aria-pressed="true"]{color:var(--good);background:var(--good-soft);border-color:transparent}
.ln{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.ln .tag{flex:none;width:22px;height:22px;border-radius:7px;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:3px;color:var(--muted);background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.ln .tx{flex:1;min-width:0;position:relative;border-radius:10px;cursor:default}
.ln.id .tx{font-family:var(--font-display);font-size:19px;font-weight:500;line-height:1.45;color:var(--ink)}
.ln.zh .tx{font-family:var(--cjk);font-size:16px;color:var(--ink-soft)}
.ln .tx.hid{cursor:pointer;filter:blur(9px);user-select:none;-webkit-user-select:none;transition:filter .2s}
.ln .tx.hid::after{content:"";position:absolute;inset:-4px}
.pl{flex:none;border:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--accent);background:var(--accent-soft);margin-top:1px}
.pl svg{width:14px;height:14px}
.pl.busy{background:var(--accent);color:var(--on-accent)}
details.ana{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
details.ana summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px;padding:4px 0}
details.ana summary::-webkit-details-marker{display:none}
details.ana summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:2px;transition:transform .2s;margin-top:-3px}
details.ana[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.w{border-radius:11px;padding:6px 10px;background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.w b{display:block;font-family:var(--font-display);font-size:15px;font-weight:500;color:var(--ink)}
.w span{display:block;font-family:var(--cjk);font-size:12.5px;color:var(--ink-soft)}
.bld{margin-top:10px;font-size:12.5px;color:var(--muted)}
.bld b{color:var(--gold);font-weight:600}
.gram{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);background:var(--gold-soft)}
.gram b{color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

body::before{background:
  radial-gradient(900px 720px at -5% -8%,rgba(91,141,255,.10),transparent 62%),
  radial-gradient(900px 720px at 105% 4%,rgba(155,108,255,.09),transparent 62%),
  radial-gradient(1000px 800px at 50% 115%,rgba(122,132,255,.06),transparent 66%),
  linear-gradient(160deg,rgba(91,141,255,.02),rgba(155,108,255,.03))!important}
:root{--glass:color-mix(in srgb,var(--surface) 52%,transparent)!important;--glass-border:rgba(255,255,255,.65)!important;
  --glass-hi:rgba(255,255,255,.75)!important;--shadow:0 1px 2px rgba(40,50,120,.05),0 10px 30px rgba(60,70,160,.08)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:color-mix(in srgb,var(--surface) 50%,transparent)!important;--glass-border:rgba(255,255,255,.10)!important;--glass-hi:rgba(255,255,255,.08)!important;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)!important}
  body::before{background:radial-gradient(900px 720px at -5% -8%,rgba(70,110,255,.12),transparent 62%),radial-gradient(900px 720px at 105% 4%,rgba(140,90,255,.11),transparent 62%),radial-gradient(1000px 800px at 50% 115%,rgba(100,110,255,.07),transparent 66%)!important}}
:root[data-theme="dark"]{--glass:color-mix(in srgb,var(--surface) 50%,transparent)!important;--glass-border:rgba(255,255,255,.10)!important;--glass-hi:rgba(255,255,255,.08)!important}
.glass,.bar,.entry,.panel{backdrop-filter:blur(40px) saturate(200%)!important;-webkit-backdrop-filter:blur(40px) saturate(200%)!important}
.nav{background:color-mix(in srgb,var(--surface) 55%,transparent)!important;backdrop-filter:blur(40px) saturate(200%)!important;-webkit-backdrop-filter:blur(40px) saturate(200%)!important;border-color:var(--glass-border)!important}
.hero{background:var(--glass)!important}
</style>

<script>
const D = {"days": [{"title": "第1天", "sub": "武功秘籍 · 第 1–12 句", "items": [{"n": 1, "id": "Tolong kirim email ini kepada semua manajer di perusahaan.", "zh": "请把这封邮件发给公司所有的经理。", "dir": "中↔印", "aud": [{"t": "Tolong kirim email ini kepada semua manajer di perusahaan.", "a": "1faddb9828f1", "za": "c7e6849b7ef9"}], "parts": [["Tolong", "请（请求帮忙）"], ["kirim", "发送、寄"], ["email ini", "这封邮件"], ["kepada", "给（接人）"], ["semua manajer", "所有经理"], ["di perusahaan", "在公司里"]], "build": "perusahaan = per- + usaha（事业）+ -an", "gram": "Tolong + 动词词根 = 礼貌的请求，动词不加 meN-（kirim 不写成 mengirim）。ini 放在名词后：email ini。kirim A kepada B = 把 A 发给 B。semua + 名词 = 所有的……。", "ref": ""}, {"n": 2, "id": "Saya butuh bantuan Anda untuk menyelesaikan laporan ini.", "zh": "我需要你的帮助来完成这份报告。", "dir": "中↔印", "aud": [{"t": "Saya butuh bantuan Anda untuk menyelesaikan laporan ini.", "a": "045f0bf30dd2", "za": "253ce3026810"}], "parts": [["Saya", "我"], ["butuh", "需要（= perlu）"], ["bantuan Anda", "您的帮助"], ["untuk", "为了、来（表目的）"], ["menyelesaikan", "完成"], ["laporan ini", "这份报告"]], "build": "bantuan = bantu 帮 + -an；menyelesaikan = selesai 完 + meN-…-kan；laporan = lapor + -an", "gram": "名词 + 人称 = “谁的……”：bantuan Anda = 您的帮助（所属者放后面）。untuk + 动词 = “来做……”，表目的。meN-…-kan 常表“使……完成”。", "ref": ""}, {"n": 3, "id": "Di mana saya bisa menemukan kamar mandi / toilet dan kantin?", "zh": "我在哪里可以找到洗手间和食堂？", "dir": "中↔印", "aud": [{"t": "Di mana saya bisa menemukan kamar mandi", "a": "ede9d05f0272", "za": "acb78e51054b"}, {"t": "toilet dan kantin?", "a": "c91ac407b899", "za": "acb78e51054b"}], "parts": [["Di mana", "在哪里"], ["saya bisa", "我能"], ["menemukan", "找到"], ["kamar mandi / toilet", "洗手间"], ["dan", "和"], ["kantin", "食堂"]], "build": "menemukan = temu 遇见 + meN-…-kan", "gram": "疑问词 Di mana 放句首。bisa + 动词 = 能做……。menemukan 是“找到（结果）”，mencari 是“寻找（过程）”。kamar mandi 字面“洗澡间”，toilet 是厕所，都可用。", "ref": ""}, {"n": 4, "id": "Saya mulai bekerja pukul delapan pagi dan pulang kerja pukul lima sore.", "zh": "我早上八点开始上班，下午五点下班。", "dir": "中↔印", "aud": [{"t": "Saya mulai bekerja pukul delapan pagi dan pulang kerja pukul lima sore.", "a": "7a10d7d71cb4", "za": "94d8fdca0858"}], "parts": [["mulai", "开始"], ["bekerja", "工作"], ["pukul delapan", "八点"], ["pagi", "早上"], ["pulang kerja", "下班"], ["pukul lima", "五点"], ["sore", "下午"]], "build": "bekerja = ber- + kerja", "gram": "pukul（或 jam）+ 数字 = 几点。时段词 pagi/siang/sore/malam 放在数字后面。mulai + 动词 = 开始做某事。pulang = 回去，pulang kerja = 下班回家。", "ref": ""}, {"n": 5, "id": "Nama saya Deni, saya adalah karyawan baru di perusahaan ini.", "zh": "我叫 Deni，我是这家公司的新员工。", "dir": "中↔印", "aud": [{"t": "Nama saya Deni, saya adalah karyawan baru di perusahaan ini.", "a": "9d30ae787693", "za": "1652fbed5297"}], "parts": [["Nama saya", "我的名字"], ["saya", "我"], ["adalah", "是"], ["karyawan", "员工"], ["baru", "新的"], ["di perusahaan ini", "在这家公司"]], "build": "karyawan = karya 作品、工作 + -wan（……的人）", "gram": "名词 + saya = “我的……”。形容词放在名词后：karyawan baru = 新员工。adalah 连接主语和名词（“是”），口语里常省略；形容词前不用 adalah。", "ref": ""}, {"n": 6, "id": "Telepon di meja Anda berbunyi, silakan diangkat.", "zh": "你桌上的电话在响，请接一下。", "dir": "中→印", "aud": [{"t": "Telepon di meja Anda berbunyi, silakan diangkat.", "a": "3c7843b6b5ac", "za": "a26079922e0a"}], "parts": [["Telepon", "电话"], ["di meja Anda", "在您的桌上"], ["berbunyi", "响"], ["silakan", "请"], ["diangkat", "被接起"]], "build": "berbunyi = ber- + bunyi 声音；diangkat = di- + angkat 抬、拿起", "gram": "di- + 动词词根 = 被动（省略动作者）：diangkat = 被拿起（接电话）。silakan = “请便”，请对方做某事；tolong 则是请对方帮忙。di meja Anda 修饰 telepon。", "ref": ""}, {"n": 7, "id": "Tolong fotokopi dokumen ini sebanyak 5 rangkap.", "zh": "请把这份文件复印 5 份。", "dir": "中→印", "aud": [{"t": "Tolong fotokopi dokumen ini sebanyak 5 rangkap.", "a": "4f33473a716f", "za": "1f5a90abd876"}], "parts": [["Tolong", "请"], ["fotokopi", "复印"], ["dokumen ini", "这份文件"], ["sebanyak", "共计"], ["5 rangkap", "5 份"]], "build": "sebanyak = se- + banyak 多", "gram": "fotokopi 可以直接当动词用（祈使句）。sebanyak + 数字 = “共……”（数量）。rangkap = 份（复本），不是“双面”。", "ref": ""}, {"n": 8, "id": "Saya masih belum paham, bisakah Anda mengulangi penjelasannya?", "zh": "我还不明白，您能再解释一遍吗？", "dir": "中↔印", "aud": [{"t": "Saya masih belum paham, bisakah Anda mengulangi penjelasannya?", "a": "f18695e7f72d", "za": "df25e5cdbdca"}], "parts": [["masih belum", "还是没有"], ["paham", "明白"], ["bisakah", "能否"], ["Anda", "您"], ["mengulangi", "重复"], ["penjelasannya", "它的解释"]], "build": "mengulangi = ulang + meN-…-i；penjelasan = jelas 清楚 + pe-…-an；-nya = 它的", "gram": "masih belum = 仍然还没（强调一直没懂）。-kah 加在句首助动词后，构成较正式的疑问：bisakah …? = 能不能……？-nya 指代前面说过的那件事。", "ref": ""}, {"n": 9, "id": "Bos saya sangat baik, dia sering membantu karyawan baru di perusahaan.", "zh": "我的老板很好，经常帮助公司的新员工。", "dir": "中↔印", "aud": [{"t": "Bos saya sangat baik, dia sering membantu karyawan baru di perusahaan.", "a": "33f8d9f462f1", "za": "ec3730aec228"}], "parts": [["Bos saya", "我的老板"], ["sangat baik", "非常好"], ["dia", "他/她"], ["sering", "经常"], ["membantu", "帮助"], ["karyawan baru", "新员工"], ["di perusahaan", "在公司"]], "build": "membantu = bantu + meN-", "gram": "sangat + 形容词 = 非常……。频率副词 sering 放在动词前。dia 不分男女。逗号后面接第二个分句，不需要连词。", "ref": ""}, {"n": 10, "id": "Selamat pagi, Pak Budi, apa kabar Anda hari ini?", "zh": "早上好，Budi 先生，您今天好吗？", "dir": "中↔印", "aud": [{"t": "Selamat pagi, Pak Budi, apa kabar Anda hari ini?", "a": "7d1b3505ff11", "za": "51a272ff4967"}], "parts": [["Selamat pagi", "早上好"], ["Pak", "先生"], ["Budi", "人名"], ["apa kabar", "近况如何"], ["Anda", "您"], ["hari ini", "今天"]], "build": "Pak（Bapak）对男士，Ibu 对女士", "gram": "问候：Selamat pagi/siang/sore/malam。apa kabar 直译“什么消息”，即“你好吗”。Anda 放在 kabar 后，指“您的近况”。", "ref": ""}, {"n": 11, "id": "Ini meja kerja saya, dekat dengan jendela. / Tempat kerja saya sangat dekat dengan jendela.", "zh": "这是我的办公桌 / 工位，离窗户很近。", "dir": "中↔印", "aud": [{"t": "Ini meja kerja saya, dekat dengan jendela.", "a": "905af4c2f773", "za": "fe747d5acfb1"}, {"t": "Tempat kerja saya sangat dekat dengan jendela.", "a": "f19a484bc645", "za": "fe747d5acfb1"}], "parts": [["Ini", "这是"], ["meja kerja", "办公桌"], ["saya", "我的"], ["dekat dengan", "靠近"], ["jendela", "窗户"], ["tempat kerja", "工位"]], "build": "meja = 桌子，kerja = 工作", "gram": "名词 + 名词，核心词在前：meja kerja = 工作用的桌子。Ini 开头的判断句不需要 adalah。dekat dengan + 名词 = 靠近……。", "ref": ""}, {"n": 12, "id": "Besok saya akan pergi ke pabrik / lokasi bersama tim produksi.", "zh": "我明天将和生产团队一起去工厂 / 现场。", "dir": "中→印", "aud": [{"t": "Besok saya akan pergi ke pabrik", "a": "179bb8fbdde0", "za": "0b451c8f669d"}, {"t": "lokasi bersama tim produksi.", "a": "d468d544cbb2", "za": "0b451c8f669d"}], "parts": [["Besok", "明天"], ["saya", "我"], ["akan", "将要"], ["pergi", "去"], ["ke pabrik", "到工厂"], ["lokasi", "现场"], ["bersama", "和……一起"], ["tim produksi", "生产团队"]], "build": "produksi = 生产", "gram": "时间词可放句首。akan + 动词 = 将要。ke + 地点 = 去某处。bersama + 人 = 和某人一起。", "ref": ""}]}, {"title": "第2天", "sub": "武功秘籍 · 第 13–24 句", "items": [{"n": 13, "id": "Komputer saya rusak, tolong panggilkan teknisi ke sini.", "zh": "我的电脑坏了，请叫技术员过来。", "dir": "中↔印", "aud": [{"t": "Komputer saya rusak, tolong panggilkan teknisi ke sini.", "a": "131934a7812d", "za": "279ea2064f77"}], "parts": [["Komputer saya", "我的电脑"], ["rusak", "坏了"], ["tolong", "请"], ["panggilkan", "帮忙叫"], ["teknisi", "技术员"], ["ke sini", "到这里来"]], "build": "panggilkan = panggil 叫 + -kan（为某人做）", "gram": "-kan 可表示“替别人做”：panggilkan = 帮（我）叫。祈使句动词用词根或词根+kan。ke sini = 到这里（方向），di sini = 在这里（位置）。", "ref": ""}, {"n": 14, "id": "Ini adalah jadwal rapat untuk minggu depan.", "zh": "这是下周的会议时间表。", "dir": "中→印", "aud": [{"t": "Ini adalah jadwal rapat untuk minggu depan.", "a": "69827c891896", "za": "9b12044f5d9a"}], "parts": [["Ini adalah", "这是"], ["jadwal", "时间表"], ["rapat", "会议"], ["untuk", "用于、为了"], ["minggu depan", "下周"]], "build": "jadwal 时间表", "gram": "jadwal rapat = 会议的时间表（名词 + 名词）。depan 放在时间词后表示“下一个”：minggu depan 下周，bulan depan 下个月。", "ref": ""}, {"n": 15, "id": "Ini hasil kerja saya, apakah sudah sesuai dengan permintaan?", "zh": "这是我的工作成果，是否已经符合要求？", "dir": "印→中", "aud": [{"t": "Ini hasil kerja saya, apakah sudah sesuai dengan permintaan?", "a": "603b943a589c", "za": "08eb839f22d9"}], "parts": [["Ini", "这是"], ["hasil kerja", "工作成果"], ["apakah", "是否"], ["sudah", "已经"], ["sesuai dengan", "符合"], ["permintaan", "要求"]], "build": "permintaan = per- + minta 要 + -an", "gram": "apakah 引导是非问句，较书面。sudah = 已经（完成）。sesuai dengan + 名词 = 符合……。", "ref": ""}, {"n": 16, "id": "Kami ada acara perusahaan Jumat sore ini.", "zh": "我们这周五下午有公司活动。", "dir": "印→中", "aud": [{"t": "Kami ada acara perusahaan Jumat sore ini.", "a": "9453709f7009", "za": "8b7ef3ae3ff2"}], "parts": [["Kami", "我们"], ["ada", "有"], ["acara perusahaan", "公司活动"], ["Jumat", "星期五"], ["sore ini", "今天下午"]], "build": "kami 不含听话人，kita 含听话人", "gram": "ada + 名词 = 有（某安排/某物）。时间顺序：星期 + 时段 + ini。注意 kami（我们）≠ kamu（你）。", "ref": ""}, {"n": 17, "id": "Saya butuh tanda tangan Anda di kontrak ini.", "zh": "我需要您在这份合同上签字。", "dir": "中↔印", "aud": [{"t": "Saya butuh tanda tangan Anda di kontrak ini.", "a": "cd39deaad102", "za": "b06db94e2a4c"}], "parts": [["Saya butuh", "我需要"], ["tanda tangan Anda", "您的签名"], ["di kontrak ini", "在这份合同上"]], "build": "tanda tangan = 记号 + 手；动词是 menandatangani", "gram": "butuh 后可直接接名词。di + 名词 = 在……上面（这里指文件上）。tanda tangan 是名词“签名”。", "ref": ""}, {"n": 18, "id": "Saya bekerja di bagian pemasaran sebagai staf administrasi.", "zh": "我在市场部工作，职位是行政专员（文员）。", "dir": "中↔印", "aud": [{"t": "Saya bekerja di bagian pemasaran sebagai staf administrasi.", "a": "89e3efdb206f", "za": "5c127fa29553"}], "parts": [["bekerja", "工作"], ["di bagian", "在……部门"], ["pemasaran", "市场营销"], ["sebagai", "作为"], ["staf administrasi", "行政职员"]], "build": "pemasaran = pe-…-an + pasar 市场；sebagai = se- + bagai", "gram": "sebagai + 职位 = “作为/担任”。di bagian + 部门名 = 在某部门。", "ref": ""}, {"n": 19, "id": "Saya akan cuti tiga hari minggu depan.", "zh": "我下周将休假三天。", "dir": "中→印", "aud": [{"t": "Saya akan cuti tiga hari minggu depan.", "a": "3681e356c1f4", "za": "e307c8b3773c"}], "parts": [["akan", "将要"], ["cuti", "休假"], ["tiga hari", "三天"], ["minggu depan", "下周"]], "build": "cuti 休假（借自荷兰语）", "gram": "数字 + hari = 几天：tiga hari。cuti 可直接当动词。时间词可放句尾。", "ref": ""}, {"n": 20, "id": "Silakan pergi ke lobi pukul sepuluh untuk menemui tamu dari Singapura.", "zh": "请十点去大堂接见来自新加坡的客人。", "dir": "中→印", "aud": [{"t": "Silakan pergi ke lobi pukul sepuluh untuk menemui tamu dari Singapura.", "a": "266e7787e4d8", "za": "f937d173383b"}], "parts": [["Silakan", "请"], ["pergi ke lobi", "去大堂"], ["pukul sepuluh", "十点"], ["untuk", "为了"], ["menemui", "会见"], ["tamu", "客人"], ["dari Singapura", "来自新加坡"]], "build": "menemui = temu 遇见 + meN-…-i", "gram": "untuk + 动词 = “为了（去）做……”。menemui 后面直接接人（会见某人）。dari + 地名 = 来自某地。", "ref": ""}, {"n": 21, "id": "Maaf saya terlambat, karena di jalan terjadi kemacetan.", "zh": "抱歉我迟到了，因为路上堵车。", "dir": "印→中", "aud": [{"t": "Maaf saya terlambat, karena di jalan terjadi kemacetan.", "a": "ab27f48858ac", "za": "b340f5da74b7"}], "parts": [["Maaf", "抱歉"], ["terlambat", "迟到"], ["karena", "因为"], ["di jalan", "在路上"], ["terjadi", "发生"], ["kemacetan", "堵车"]], "build": "terlambat = ter- + lambat 慢；kemacetan = ke-…-an + macet 堵", "gram": "ter- + 形容词 = 到了某种状态（terlambat 来得太晚）。karena 引出原因。terjadi + 名词 = 发生了……。", "ref": ""}, {"n": 22, "id": "Kapan batas waktu akhir proyek ini? Saya membutuhkan informasinya.", "zh": "这个项目的截止日期是什么时候？我需要这个信息。", "dir": "印→中", "aud": [{"t": "Kapan batas waktu akhir proyek ini? Saya membutuhkan informasinya.", "a": "145ab732390e", "za": "d2ddcbf2dd8c"}], "parts": [["Kapan", "什么时候"], ["batas waktu akhir", "截止期限"], ["proyek ini", "这个项目"], ["membutuhkan", "需要"], ["informasinya", "那个信息"]], "build": "batas 界限 + waktu 时间 + akhir 最后；-nya = 那个", "gram": "Kapan 疑问词放句首。membutuhkan 是 butuh 的正式说法。-nya 指代前面提到的项目的信息。", "ref": ""}, {"n": 23, "id": "Saya akan mengantar tamu bisnis ini ke hotel.", "zh": "我会把这位商务客人送到酒店。", "dir": "印→中", "aud": [{"t": "Saya akan mengantar tamu bisnis ini ke hotel.", "a": "cbd0d434d16a", "za": "f9b9a03a8f1c"}], "parts": [["akan", "将要"], ["mengantar", "送（陪同送到）"], ["tamu bisnis", "商务客人"], ["ke hotel", "到酒店"]], "build": "mengantar = antar + meN-", "gram": "mengantar 是把人送到某处，ke + 地点表示目的地。tamu bisnis = 客人 + 商务（名词 + 名词）。", "ref": ""}, {"n": 24, "id": "Kantor kami perlu lebih banyak kertas dan pulpen.", "zh": "我们办公室需要更多的纸和笔。", "dir": "中→印", "aud": [{"t": "Kantor kami perlu lebih banyak kertas dan pulpen.", "a": "092641913277", "za": "e3466cac57c3"}], "parts": [["Kantor kami", "我们的办公室"], ["perlu", "需要"], ["lebih banyak", "更多"], ["kertas", "纸"], ["pulpen", "笔"]], "build": "pulpen = 钢笔/圆珠笔", "gram": "lebih + 形容词 = 更……：lebih banyak = 更多。perlu 后可接名词，也可接动词。", "ref": ""}]}, {"title": "第3天", "sub": "武功秘籍 · 第 25–36 句", "items": [{"n": 25, "id": "Mika memakai kemeja putih dan jam tangan hitam, sangat tampan.", "zh": "Mika 穿着白衬衫、戴着黑色手表，非常帅。", "dir": "中→印", "aud": [{"t": "Mika memakai kemeja putih dan jam tangan hitam, sangat tampan.", "a": "56a71a343175", "za": "acd536469c0b"}], "parts": [["Mika", "人名"], ["memakai", "穿、戴"], ["kemeja putih", "白衬衫"], ["jam tangan", "手表"], ["hitam", "黑色"], ["sangat tampan", "非常帅"]], "build": "memakai = pakai + meN-；jam tangan = 钟 + 手", "gram": "颜色放在名词后：kemeja putih。memakai 对衣服、手表、帽子都可用。tampan 形容男士帅，口语也说 ganteng。", "ref": ""}, {"n": 26, "id": "Saya suka bekerja di sini karena lingkungan kerjanya sangat ramah.", "zh": "我喜欢在这里工作，因为工作环境很友好。", "dir": "中→印", "aud": [{"t": "Saya suka bekerja di sini karena lingkungan kerjanya sangat ramah.", "a": "6b7e4ab0ca4e", "za": "6f4d6129b875"}], "parts": [["suka", "喜欢"], ["bekerja", "工作"], ["di sini", "在这里"], ["karena", "因为"], ["lingkungan kerja", "工作环境"], ["ramah", "友好"]], "build": "lingkungan = lingkung + -an", "gram": "suka + 动词 = 喜欢做……。-nya 这里表示“这里的”。lingkungan kerja = 环境 + 工作。", "ref": ""}, {"n": 27, "id": "Terima kasih atas bantuan dan kerja sama Anda hari ini.", "zh": "感谢您今天的帮助和合作。", "dir": "中→印", "aud": [{"t": "Terima kasih atas bantuan dan kerja sama Anda hari ini.", "a": "97a7a8398538", "za": "d151ca652370"}], "parts": [["Terima kasih", "谢谢"], ["atas", "为了、对于"], ["bantuan", "帮助"], ["kerja sama", "合作"], ["Anda", "您"], ["hari ini", "今天"]], "build": "terima = 接受，kasih = 爱、情分", "gram": "terima kasih atas + 名词 = 为……而感谢。kerja sama 是两个词（合作）。", "ref": ""}, {"n": 28, "id": "Sekarang saya harus pergi ke ruang rapat di lantai tiga untuk rapat.", "zh": "我现在必须去三楼的会议室开会。", "dir": "中→印", "aud": [{"t": "Sekarang saya harus pergi ke ruang rapat di lantai tiga untuk rapat.", "a": "b84ad6cb5b56", "za": "475b719fe1e0"}], "parts": [["Sekarang", "现在"], ["harus", "必须"], ["ruang rapat", "会议室"], ["di lantai tiga", "在三楼"], ["untuk rapat", "去开会"]], "build": "ruang = 房间；lantai = 楼层", "gram": "harus + 动词 = 必须。lantai + 数字 = 第几层（数字放后）。untuk rapat = 为了开会。", "ref": ""}, {"n": 29, "id": "Saya sering belajar bersama teman di perpustakaan pada sore hari.", "zh": "我经常下午和朋友一起在图书馆学习。", "dir": "中→印", "aud": [{"t": "Saya sering belajar bersama teman di perpustakaan pada sore hari.", "a": "1da4fea69275", "za": "811ddfcbaf2b"}], "parts": [["sering", "经常"], ["belajar", "学习"], ["bersama teman", "和朋友一起"], ["di perpustakaan", "在图书馆"], ["pada sore hari", "在下午"]], "build": "belajar = ber- + ajar；perpustakaan = per-…-an + pustaka 书", "gram": "pada + 时间 = 在……的时候。bersama + 人 = 和某人一起。副词 sering 在动词前。", "ref": ""}, {"n": 30, "id": "Kami makan malam bersama keluarga setiap hari.", "zh": "我们每天和家人一起吃晚饭。", "dir": "中→印", "aud": [{"t": "Kami makan malam bersama keluarga setiap hari.", "a": "0a467ccd98b4", "za": "8117f661d0b7"}], "parts": [["Kami", "我们"], ["makan malam", "吃晚饭"], ["bersama keluarga", "和家人一起"], ["setiap hari", "每天"]], "build": "makan malam = 吃 + 夜晚", "gram": "makan malam 既是动词“吃晚饭”，也是名词“晚饭”。setiap + 名词 = 每一个……。", "ref": ""}, {"n": 31, "id": "Teman saya sangat rajin dan suka belajar.", "zh": "我的朋友很勤奋，喜欢学习。", "dir": "中→印", "aud": [{"t": "Teman saya sangat rajin dan suka belajar.", "a": "c3dc711f7102", "za": "a2fda0d82598"}], "parts": [["Teman saya", "我的朋友"], ["sangat rajin", "非常勤奋"], ["dan", "并且"], ["suka belajar", "喜欢学习"]], "build": "rajin 勤奋", "gram": "形容词可直接做谓语，不需要 adalah。dan 连接两个谓语，共用同一个主语。", "ref": ""}, {"n": 32, "id": "Guru menjelaskan pelajaran dengan sangat jelas.", "zh": "老师讲课讲得非常清楚。", "dir": "中→印", "aud": [{"t": "Guru menjelaskan pelajaran dengan sangat jelas.", "a": "08f76eb1ca8a", "za": "04c2a4d0a246"}], "parts": [["Guru", "老师"], ["menjelaskan", "讲解"], ["pelajaran", "课程"], ["dengan sangat jelas", "非常清楚地"]], "build": "menjelaskan = jelas + meN-…-kan；pelajaran = ajar + pe-…-an", "gram": "dengan + 形容词 = ……地（把形容词变成副词）。meN-…-kan = 使……清楚，即“讲解”。", "ref": ""}, {"n": 33, "id": "Karena sakit, saya tidak pergi ke sekolah.", "zh": "因为生病，我没有去学校。", "dir": "中↔印", "aud": [{"t": "Karena sakit, saya tidak pergi ke sekolah.", "a": "bf5f4ae2719e", "za": "2ac5d82a5c7e"}], "parts": [["Karena", "因为"], ["sakit", "生病"], ["saya", "我"], ["tidak", "不、没"], ["pergi", "去"], ["ke sekolah", "到学校"]], "build": "", "gram": "Karena 引导原因，放句首，后面逗号再接结果。tidak 否定动词和形容词（否定名词用 bukan）。", "ref": ""}, {"n": 34, "id": "Dia ingin bekerja di Indonesia setelah lulus.", "zh": "他毕业后想在印度尼西亚工作。", "dir": "印→中", "aud": [{"t": "Dia ingin bekerja di Indonesia setelah lulus.", "a": "67ef216b9a5c", "za": "78699218257e"}], "parts": [["Dia", "他"], ["ingin", "想"], ["bekerja", "工作"], ["di Indonesia", "在印度尼西亚"], ["setelah", "之后"], ["lulus", "毕业"]], "build": "lulus 毕业 / 通过", "gram": "ingin + 动词 = 想做……。setelah + 动词 = ……之后。lulus 单独使用就是“毕业”。", "ref": ""}, {"n": 35, "id": "Saya suka makan nasi goreng karena sangat enak.", "zh": "我喜欢吃炒饭，因为很好吃。", "dir": "印→中", "aud": [{"t": "Saya suka makan nasi goreng karena sangat enak.", "a": "106ad930d3cf", "za": "3fd6e3bf53c3"}], "parts": [["suka makan", "喜欢吃"], ["nasi goreng", "炒饭"], ["karena", "因为"], ["sangat enak", "非常好吃"]], "build": "nasi 饭，goreng 炒、炸", "gram": "食物名：nasi goreng（炒饭）、mie goreng（炒面）、ayam goreng（炸鸡）。enak 指味道好。", "ref": ""}, {"n": 36, "id": "Saya suka makan nasi goreng karena enak dan tidak mahal.", "zh": "我喜欢吃炒饭，因为好吃又便宜。", "dir": "中↔印", "aud": [{"t": "Saya suka makan nasi goreng karena enak dan tidak mahal.", "a": "14e9415c510c", "za": "b3ced88569bd"}], "parts": [["nasi goreng", "炒饭"], ["enak", "好吃"], ["dan", "又"], ["tidak mahal", "不贵"], ["mahal", "贵"], ["murah", "便宜"]], "build": "", "gram": "tidak + 形容词 = 不……。“好吃又便宜”可以说 enak dan murah，也可以说 enak dan tidak mahal。", "ref": ""}]}, {"title": "第4天", "sub": "武功秘籍 · 第 37–48 句", "items": [{"n": 37, "id": "Di kelas kami belajar mendengar, berbicara, membaca, dan menulis.", "zh": "我们在课堂上学习听、说、读、写。", "dir": "印→中", "aud": [{"t": "Di kelas kami belajar mendengar, berbicara, membaca, dan menulis.", "a": "101918d1cc9b", "za": "a026fc56e0ce"}], "parts": [["Di kelas", "在课堂上"], ["kami", "我们"], ["belajar", "学习"], ["mendengar", "听"], ["berbicara", "说"], ["membaca", "读"], ["menulis", "写"]], "build": "mendengar（dengar）、membaca（baca）、menulis（tulis）；berbicara = ber- + bicara", "gram": "地点短语可放句首。多个并列动词：A, B, C, dan D（最后一个前加 dan）。听说读写是基础动词，要整组记。", "ref": ""}, {"n": 38, "id": "Karena hari ini hujan, saya tidak pergi ke sekolah.", "zh": "因为今天下雨，所以我没有去学校。", "dir": "印→中", "aud": [{"t": "Karena hari ini hujan, saya tidak pergi ke sekolah.", "a": "c56c2b055b06", "za": "0b672f859992"}], "parts": [["Karena", "因为"], ["hari ini", "今天"], ["hujan", "下雨"], ["saya tidak pergi", "我不去"], ["ke sekolah", "到学校"]], "build": "", "gram": "hujan 既是名词“雨”也是动词“下雨”，不需要再加其他动词。从句 + 逗号 + 主句。", "ref": ""}, {"n": 39, "id": "Saya biasanya bermain basket bersama teman-teman di akhir pekan.", "zh": "我通常和朋友在周末一起打篮球。", "dir": "中↔印", "aud": [{"t": "Saya biasanya bermain basket bersama teman-teman di akhir pekan.", "a": "bbb59b59fd0d", "za": "097f56085ef4"}], "parts": [["biasanya", "通常"], ["bermain basket", "打篮球"], ["bersama", "和……一起"], ["teman-teman", "朋友们"], ["di akhir pekan", "在周末"]], "build": "biasanya = biasa 习惯 + -nya；bermain = ber- + main", "gram": "重叠表示复数：teman-teman = 朋友们。打球类用 bermain + 球名。akhir pekan = 周末（结尾 + 周）。", "ref": ""}, {"n": 40, "id": "Saya tinggal di tempat yang sangat tenang dan nyaman (dan tidak jauh dari sekolah).", "zh": "我住在一个非常安静舒适的地方（离学校不远）。", "dir": "中↔印", "aud": [{"t": "Saya tinggal di tempat yang sangat tenang dan nyaman (dan tidak jauh dari sekolah).", "a": "34017e7faa4a", "za": "257112eb9221"}], "parts": [["tinggal", "住"], ["di tempat", "在地方"], ["yang", "……的"], ["sangat", "非常"], ["tenang", "安静"], ["nyaman", "舒适"], ["tidak jauh dari", "离……不远"]], "build": "tempat 地方；jauh 远", "gram": "yang 引出修饰成分：tempat yang tenang = 安静的地方。tidak jauh dari + 地点 = 离……不远。tinggal = 居住。", "ref": ""}, {"n": 41, "id": "Pagi ini saya membuat sarapan di dapur, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "dir": "中↔印", "aud": [{"t": "Pagi ini saya membuat sarapan di dapur, lalu pergi ke sekolah.", "a": "990111dbe5bd", "za": "19569032fe8a"}], "parts": [["Pagi ini", "今天早上"], ["membuat", "做、制作"], ["sarapan", "早餐"], ["di dapur", "在厨房"], ["lalu", "然后"], ["pergi ke sekolah", "去学校"]], "build": "membuat = buat + meN-", "gram": "时间词放句首。lalu 连接先后发生的两个动作。membuat sarapan = 做早餐（也可说 memasak）。", "ref": ""}, {"n": 42, "id": "Kami berencana berlibur ke Indonesia bulan depan.", "zh": "我们计划下个月去印尼旅游。", "dir": "中↔印", "aud": [{"t": "Kami berencana berlibur ke Indonesia bulan depan.", "a": "c1c02c8362d2", "za": "1978164732db"}], "parts": [["berencana", "计划"], ["berlibur", "度假"], ["ke Indonesia", "去印度尼西亚"], ["bulan depan", "下个月"]], "build": "berencana = ber- + rencana 计划；berlibur = ber- + libur 假期", "gram": "ber- + 名词 = 做与该名词相关的事。berencana + 动词 = 计划做……。", "ref": ""}, {"n": 43, "id": "Saya pergi ke pasar bersama teman untuk membeli buah.", "zh": "我和朋友去市场买水果。", "dir": "中→印", "aud": [{"t": "Saya pergi ke pasar bersama teman untuk membeli buah.", "a": "d2a20804ad32", "za": "82d80ab46629"}], "parts": [["pergi ke pasar", "去市场"], ["bersama teman", "和朋友一起"], ["untuk", "为了"], ["membeli", "买"], ["buah", "水果"]], "build": "membeli = beli + meN-", "gram": "pergi ke + 地点 + untuk + 动词 = 去某地做某事。buah 既是“水果”也是“果实”。", "ref": ""}, {"n": 44, "id": "Kami sering belajar bersama di kelas dan sering saling membantu.", "zh": "我们经常在教室一起学习，经常互相帮助。", "dir": "中↔印", "aud": [{"t": "Kami sering belajar bersama di kelas dan sering saling membantu.", "a": "167e82102d52", "za": "c510b9ae5ae7"}], "parts": [["sering", "经常"], ["belajar bersama", "一起学习"], ["di kelas", "在教室"], ["saling", "互相"], ["membantu", "帮助"]], "build": "saling 互相", "gram": "saling + 动词 = 互相……：saling membantu 互相帮助。sering 在两个谓语前各用一次，更清楚。", "ref": ""}, {"n": 45, "id": "Kadang-kadang saya membersihkan kamar agar nyaman untuk belajar.", "zh": "有时候我打扫房间，让学习的环境舒适。", "dir": "中↔印", "aud": [{"t": "Kadang-kadang saya membersihkan kamar agar nyaman untuk belajar.", "a": "c4e850f4f202", "za": "744b9e73b27f"}], "parts": [["Kadang-kadang", "有时"], ["membersihkan", "打扫"], ["kamar", "房间"], ["agar", "为了让"], ["nyaman", "舒适"], ["untuk belajar", "用来学习"]], "build": "membersihkan = bersih 干净 + meN-…-kan", "gram": "agar + 形容词/从句 = 为了让……。kadang-kadang 是重叠词，意为“有时”。", "ref": ""}, {"n": 46, "id": "Dia belajar di perpustakaan karena perpustakaan sangat tenang.", "zh": "他在图书馆学习，因为图书馆很安静。", "dir": "中↔印", "aud": [{"t": "Dia belajar di perpustakaan karena perpustakaan sangat tenang.", "a": "498fa53810eb", "za": "88920e252528"}], "parts": [["Dia", "他"], ["belajar", "学习"], ["di perpustakaan", "在图书馆"], ["karena", "因为"], ["sangat tenang", "非常安静"]], "build": "", "gram": "原因从句里重复名词 perpustakaan，印尼语不爱用代词回指（也可用 -nya）。", "ref": ""}, {"n": 47, "id": "Karena sangat lelah, saya tidur lebih awal dari biasanya.", "zh": "因为身体很累，我比平常睡得早。", "dir": "中↔印", "aud": [{"t": "Karena sangat lelah, saya tidur lebih awal dari biasanya.", "a": "009d88d684aa", "za": "9f302a226ba4"}], "parts": [["Karena", "因为"], ["sangat lelah", "非常累"], ["tidur", "睡觉"], ["lebih awal", "更早"], ["dari biasanya", "比平常"]], "build": "lelah 累；awal 开始、早", "gram": "比较：lebih + 形容词 + dari + 比较对象 = 比……更……。dari biasanya = 比平常。", "ref": ""}, {"n": 48, "id": "Pada malam hari saya duduk bersama keluarga menonton televisi.", "zh": "晚上我和家人坐在一起看电视。", "dir": "中↔印", "aud": [{"t": "Pada malam hari saya duduk bersama keluarga menonton televisi.", "a": "1ff209f2dbd5", "za": "55f0a3de0680"}], "parts": [["Pada malam hari", "在晚上"], ["duduk", "坐"], ["bersama keluarga", "和家人一起"], ["menonton", "观看"], ["televisi", "电视"]], "build": "menonton = tonton + meN-", "gram": "两个动作可连用：duduk … menonton（坐着看）。menonton 用于看电视、电影、比赛；melihat 是“看见”。", "ref": ""}]}, {"title": "第5天", "sub": "武功秘籍 · 第 49–60 句", "items": [{"n": 49, "id": "Saya langsung minum kopi setelah bangun pagi.", "zh": "我早上起床后立即喝咖啡。", "dir": "中→印", "aud": [{"t": "Saya langsung minum kopi setelah bangun pagi.", "a": "ca66633c8745", "za": "60075f894222"}], "parts": [["langsung", "立即"], ["minum kopi", "喝咖啡"], ["setelah", "之后"], ["bangun pagi", "早上起床"]], "build": "bangun 起床、醒来", "gram": "setelah 从句可放后面。bangun pagi = 早上起床（也有“早起”之意）。", "ref": ""}, {"n": 50, "id": "Sore ini kami belajar bahasa Indonesia di perpustakaan.", "zh": "今天下午我们在图书馆学习印尼语。", "dir": "中→印", "aud": [{"t": "Sore ini kami belajar bahasa Indonesia di perpustakaan.", "a": "553cdef32567", "za": "46a54211a9b0"}], "parts": [["Sore ini", "今天下午"], ["kami", "我们"], ["belajar", "学习"], ["bahasa Indonesia", "印尼语"], ["di perpustakaan", "在图书馆"]], "build": "bahasa = 语言", "gram": "bahasa + 国名 = 某国语言：bahasa Inggris 英语，bahasa Mandarin 汉语。", "ref": ""}, {"n": 51, "id": "Besok saya pergi ke sekolah naik sepeda. / Saya bersepeda ke sekolah setiap hari.", "zh": "我明天骑自行车去学校。/ 我每天骑自行车去上学。", "dir": "中→印", "aud": [{"t": "Besok saya pergi ke sekolah naik sepeda.", "a": "b9e0afee6876", "za": "2c5480307b1c"}, {"t": "Saya bersepeda ke sekolah setiap hari.", "a": "6aad103116f7", "za": "2c5480307b1c"}], "parts": [["Besok", "明天"], ["naik", "乘、骑"], ["sepeda", "自行车"], ["bersepeda", "骑自行车"], ["setiap hari", "每天"]], "build": "bersepeda = ber- + sepeda", "gram": "naik + 交通工具 = 乘/骑：naik bus、naik motor、naik sepeda。ber- + 名词 = 做与它有关的事：bersepeda。", "ref": ""}, {"n": 52, "id": "Saya bangun jam enam setiap pagi untuk pergi ke sekolah.", "zh": "我每天早上六点起床，为了去上学。", "dir": "中→印", "aud": [{"t": "Saya bangun jam enam setiap pagi untuk pergi ke sekolah.", "a": "162b8b316a07", "za": "fa15c1a91d94"}], "parts": [["bangun", "起床"], ["jam enam", "六点"], ["setiap pagi", "每天早上"], ["untuk", "为了"], ["pergi ke sekolah", "去学校"]], "build": "", "gram": "jam + 数字 = 几点（和 pukul 同义）。untuk + 动词 = 为了……。", "ref": ""}, {"n": 53, "id": "Setiap akhir pekan saya pergi ke perpustakaan untuk meminjam buku.", "zh": "我每个周末去图书馆借书。", "dir": "中→印", "aud": [{"t": "Setiap akhir pekan saya pergi ke perpustakaan untuk meminjam buku.", "a": "885eb825e4ec", "za": "69e9a2a1cb98"}], "parts": [["Setiap akhir pekan", "每个周末"], ["pergi ke", "去"], ["perpustakaan", "图书馆"], ["meminjam", "借入"], ["buku", "书"]], "build": "meminjam = pinjam + meN-", "gram": "meminjam = 借入，meminjamkan = 借出。时间状语放句首。", "ref": ""}, {"n": 54, "id": "Saya minum air setiap kali selesai berolahraga demi kesehatan tubuh.", "zh": "我每次运动后喝水，是为了身体健康。", "dir": "中→印", "aud": [{"t": "Saya minum air setiap kali selesai berolahraga demi kesehatan tubuh.", "a": "322e8a9fd26b", "za": "dd36013792e7"}], "parts": [["minum air", "喝水"], ["setiap kali", "每次"], ["selesai", "结束、完成"], ["berolahraga", "做运动"], ["demi", "为了"], ["kesehatan", "健康"], ["tubuh", "身体"]], "build": "kesehatan = ke-…-an + sehat；berolahraga = ber- + olahraga", "gram": "selesai + 动词 = 做完……。demi + 名词 = 为了（重要的目的）。setiap kali = 每次。", "ref": ""}, {"n": 55, "id": "Setiap minggu saya pergi ke kafe bersama teman pada sore hari untuk minum kopi dan mengobrol.", "zh": "我每周下午和朋友去咖啡馆喝咖啡聊天。", "dir": "中→印", "aud": [{"t": "Setiap minggu saya pergi ke kafe bersama teman pada sore hari untuk minum kopi dan mengobrol.", "a": "101de27f5b24", "za": "e2d0018bfac4"}], "parts": [["Setiap minggu", "每周"], ["pergi ke kafe", "去咖啡馆"], ["bersama teman", "和朋友"], ["pada sore hari", "在下午"], ["untuk", "为了"], ["minum kopi", "喝咖啡"], ["mengobrol", "聊天"]], "build": "mengobrol = obrol + meN-", "gram": "一个句子里可以连续写：谁、何时、去哪、和谁、做什么，顺序灵活。untuk 后面并列两个动作用 dan 连接。", "ref": ""}, {"n": 56, "id": "Ayah saya adalah guru sekolah menengah.", "zh": "我的父亲是一名中学老师。", "dir": "中→印", "aud": [{"t": "Ayah saya adalah guru sekolah menengah.", "a": "1d1ab83f9aef", "za": "7cb7698b943b"}], "parts": [["Ayah saya", "我的父亲"], ["adalah", "是"], ["guru", "老师"], ["sekolah menengah", "中学"]], "build": "menengah = 中等的", "gram": "adalah 连接主语和职业名词。sekolah menengah pertama (SMP) 初中，sekolah menengah atas (SMA) 高中。", "ref": ""}, {"n": 57, "id": "Setiap minggu saya pergi ke perpustakaan untuk membaca buku.", "zh": "我每周都去图书馆看书。", "dir": "中→印", "aud": [{"t": "Setiap minggu saya pergi ke perpustakaan untuk membaca buku.", "a": "4454cbf20100", "za": "53bef4123bdb"}], "parts": [["Setiap minggu", "每周"], ["pergi ke perpustakaan", "去图书馆"], ["untuk membaca buku", "为了看书"]], "build": "membaca = baca + meN-", "gram": "membaca buku = 看书、读书。注意 menulis（写）和 membaca（读）都是 meN- 动词。", "ref": ""}, {"n": 58, "id": "Setelah masuk universitas, saya kenal banyak teman baru.", "zh": "我上大学后认识了很多新朋友。", "dir": "中→印", "aud": [{"t": "Setelah masuk universitas, saya kenal banyak teman baru.", "a": "3cd5a3d3a9e1", "za": "ee2bfce3c1dd"}], "parts": [["Setelah", "之后"], ["masuk universitas", "进入大学"], ["kenal", "认识"], ["banyak", "很多"], ["teman baru", "新朋友"]], "build": "masuk 进入；kenal 熟识（人）", "gram": "kenal = 认识某人（熟悉），tahu = 知道（事实）。banyak + 名词 = 很多……，不需要量词。", "ref": ""}, {"n": 59, "id": "Kadang-kadang saya mendengarkan musik untuk menghilangkan stres.", "zh": "我有时听音乐来消除烦恼。", "dir": "中→印", "aud": [{"t": "Kadang-kadang saya mendengarkan musik untuk menghilangkan stres.", "a": "d3f01ccc9647", "za": "2013563b1219"}], "parts": [["Kadang-kadang", "有时"], ["mendengarkan musik", "听音乐"], ["untuk", "为了"], ["menghilangkan", "消除"], ["stres", "压力、烦恼"]], "build": "menghilangkan = hilang 消失 + meN-…-kan", "gram": "mendengarkan = 专心听。menghilangkan = 使……消失。stres 借自英语。", "ref": ""}, {"n": 60, "id": "Saya selalu membawa kamera untuk memotret pemandangan yang indah.", "zh": "我总是带着相机拍摄美丽的风景。", "dir": "中→印", "aud": [{"t": "Saya selalu membawa kamera untuk memotret pemandangan yang indah.", "a": "3c009669b7cf", "za": "28571218c5ec"}], "parts": [["selalu", "总是"], ["membawa", "带"], ["kamera", "相机"], ["memotret", "拍摄"], ["pemandangan", "风景"], ["yang indah", "美丽的"]], "build": "memotret = potret + meN-；pemandangan = pandang 看 + pe-…-an", "gram": "selalu 放在动词前。yang indah 修饰前面的名词。memotret = 拍照。", "ref": ""}]}, {"title": "第6天", "sub": "武功秘籍 · 第 61–72 句", "items": [{"n": 61, "id": "Saat liburan, saya suka pergi ke pantai dan bermain pasir di pantai.", "zh": "旅游时我喜欢去沙滩，在沙滩上玩。", "dir": "中→印", "aud": [{"t": "Saat liburan, saya suka pergi ke pantai dan bermain pasir di pantai.", "a": "d08cd3709438", "za": "584876a32d84"}], "parts": [["Saat", "当……的时候"], ["liburan", "假期"], ["suka pergi ke pantai", "喜欢去海边"], ["bermain pasir", "玩沙子"], ["pasir", "沙子"]], "build": "liburan = libur + -an", "gram": "Saat + 名词/从句 = 当……时。bermain + 名词 = 玩某物。", "ref": ""}, {"n": 62, "id": "Ibu saya adalah dokter, dia melayani pasien di klinik.", "zh": "我妈妈是医生，在诊所看病人。", "dir": "中→印", "aud": [{"t": "Ibu saya adalah dokter, dia melayani pasien di klinik.", "a": "50cea9ee1ac0", "za": "17e21304d935"}], "parts": [["Ibu saya", "我的母亲"], ["adalah dokter", "是医生"], ["dia", "她"], ["melayani", "接待、服务"], ["pasien", "病人"], ["di klinik", "在诊所"]], "build": "melayani = layan + meN-…-i", "gram": "逗号后用 dia 代替主语。melayani 后直接接对象（pasien）。", "ref": ""}, {"n": 63, "id": "Saya tidak bisa pergi bersama mereka karena hari ini saya masih harus bekerja.", "zh": "我不能和他们一起去，因为我今天还要工作。", "dir": "中↔印", "aud": [{"t": "Saya tidak bisa pergi bersama mereka karena hari ini saya masih harus bekerja.", "a": "c03b13873d1d", "za": "92f05a2371be"}], "parts": [["tidak bisa", "不能"], ["pergi", "去"], ["bersama mereka", "和他们一起"], ["karena", "因为"], ["hari ini", "今天"], ["masih harus", "还得"], ["bekerja", "工作"]], "build": "", "gram": "tidak bisa + 动词 = 不能……。masih harus 把“仍然”和“必须”叠加。", "ref": ""}, {"n": 64, "id": "Saya biasanya membawa botol minum sendiri karena tidak mau membeli air di luar.", "zh": "我通常自己带水杯，因为不想在外面买水。", "dir": "中→印", "aud": [{"t": "Saya biasanya membawa botol minum sendiri karena tidak mau membeli air di luar.", "a": "a91b39e83b56", "za": "0d0ff4867d4f"}], "parts": [["biasanya", "通常"], ["membawa", "带"], ["botol minum", "水杯"], ["s const $ = (s) => document.querySelector(s);
