window.addEventListener("hashchange", route);
const lvSeg = () => `<div class="seg" role="group" aria-label="等级"><a href="javascript:void 0" class="${LV === 1 ? "on" : ""}" data-lv="1">一级</a><a href="javascript:void 0" class="${LV === 2 ? "on" : ""}" data-lv="2">二级</a></div>`;
const tabs = on => (on === "home" ? lvSeg() + " " : "") + `<div class="seg"><a href="#" class="${on === "home" ? "on" : ""}">练习</a><a href="#review" class="${on === "review" ? "on" : ""}">复盘</a><a href="#sent" class="${on === "sent" ? "on" : ""}">我的句子</a></div>`;

function loginCard() {
  if (KSync.user()) return "";
  return `<div class="card glass"><b style="font-family:var(--cjk)">先登录</b><p class="note" style="margin:4px 0 0">登录以后，答案会自动保存到云端，批改结果也会显示在「复盘」里。用「今日」页的同一个账号。</p>
  <form class="login" id="lg"><input id="lu" placeholder="用户名" autocomplete="username"><input id="lp" type="password" placeholder="密码" autocomplete="current-password">
  <button class="btn" type="submit">登录</button></form><div class="err" id="le"></div></div>`;
}
function bindLogin() {
  const f = $("#lg"); if (!f) return;
  f.onsubmit = async e => { e.preventDefault(); $("#le").textContent = "";
    try { await KSync.enter($("#lu").value, $("#lp").value, false); await pullAll(); } catch (err) { $("#le").textContent = err.message; } };
}

function home() {
  const d = today(), set = daySet(d);
  const card = sec => {
    const n = set[sec].length, c = count(d, sec), done = n && c >= n;
    if (!n) return `<div class="task glass done"><span class="ic">${SEC[sec].ic}</span><span><b>${SEC[sec].name}</b><small>今天不用做</small></span><span class="go">✓</span></div>`;
    const first = set[sec].findIndex(id => !ansOf(d, sec, id));
    return `<a class="task glass${done ? " done" : ""}" href="#do/${sec}/${first < 0 ? 0 : first}"><span class="ic">${SEC[sec].ic}</span>
      <span><b>${SEC[sec].name}</b><small>${SEC[sec].sub}</small><span class="mini"><i style="width:${n ? c / n * 100 : 0}%"></i></span></span>
      <span class="go">${done ? "✓ " + c + "/" + n : c ? "继续 " + c + "/" + n : "开始 ›"}</span></a>`;
  };
  const all = ["qa", "z", "i"].every(s => count(d, s) >= set[s].length);
  $("#app").innerHTML = `<div class="top"><div><h1>口语练习</h1><p class="sub">${DOV ? `正在提前做 <b>${DOV}</b> 的题 · <a href="oral.html">回到今天</a>` : "全程听和说，做完以后在「复盘」看文字和批改"}</p></div>${tabs("home")}</div>
  ${loginCard()}
  ${SR ? "" : `<div class="card glass note">这个浏览器不能语音识别。iPad 请用 <b>Safari</b>，安卓请用 <b>Chrome</b>。也可以点「打字」，用键盘上的麦克风说。</div>`}
  <div class="tasks">${card("qa")}${card("z")}${card("i")}${favCard()}</div>
  <div class="row2"><button class="btn ghost" type="button" id="more">再来 10 道问答新题</button></div>
  ${all ? `<div class="card glass note">今天的都做完了 ✓ 批改好以后会出现在「复盘」里。</div>` : ""}`;
  bindLogin();
  $("#more").onclick = () => {
    const s = daySet(d), add = freshQA(d + "+" + s.qa.length, 10, new Set(s.qa));
    const fk = LV === 2 ? "2:" + d : d;
    S.more = S.more || {}; S.more[fk] = [...((S.more[fk]) || []), ...add]; save();
    location.hash = "#do/qa/" + s.qa.length;
  };
}

function doPage(sec, i) {
  const d = today(), set = daySet(d), list = set[sec];
  if (!SEC[sec] || !list) return home();
  if (i >= list.length) return secDone(sec);
  const id = list[i], key = itemId(sec, id), isRev = (set.rv || []).includes(key);
  let txt = ansOf(d, sec, id), shown = false, editing = false;
  // 一道题只有三块：①题（听；没听清就看文字）②你的回答（说；识别结果就在下面，重说/改字紧挨着它）③上一题/下一题
  $("#app").innerHTML = `<div class="top"><div><a href="#" class="sub" style="text-decoration:none">‹ 口语练习</a><h1>${SEC[sec].name}</h1></div></div>
  <div class="card glass">
    <div class="prog"><span>${i + 1} / ${list.length}</span><div class="bar"><i style="width:${i / list.length * 100}%"></i></div>${isRev ? '<span class="tag">复习</span>' : ""}</div>
    <div class="stage"><button class="play" id="pl" type="button" aria-label="听">${IC.play}</button><div class="lab">${sec === "z" ? "听中文" : sec === "i" ? "听印尼语" : "听考官提问"}</div>
      <button class="hintbtn" id="sh" type="button">没听清？看文字</button><div id="rv"></div>
      <button class="mic" id="mc" type="button" aria-label="开始说">${IC.mic}</button><div class="lab" id="ml"></div></div>
    <div class="said" id="sd"></div>
    <div class="sact" id="sa"></div>
    <div class="navr"><button class="btn ghost" id="pv" type="button" ${i ? "" : "disabled"}>‹ 上一题</button><button class="btn" id="nx" type="button">${i + 1 < list.length ? "下一题 ›" : "完成"}</button></div>
  </div>`;
  const ph = sec === "i" ? "说中文" : "说印尼语";
  const hint = () => { $("#ml").textContent = !SR ? "这个浏览器不能语音识别，请直接在下面打字" : txt ? "说错了点「重说」；想补充，再点一下话筒接着说" : "点一下话筒，等它变红再开口"; };
  const show = (fin, im) => {
    if (editing) return;
    $("#sd").innerHTML = fin || im ? `${esc(fin)} <span class="im">${esc(im || "")}</span>` : `<span class="ph">${SR ? ph + "。识别出的文字会显示在这里，点文字可以直接改" : ph + "：点这里打字，或用键盘上的麦克风说"}</span>`;
  };
  const commit = t => {
    txt = t.trim();
    const a = (S.ans[d] = S.ans[d] || {}), old = a[key] || {};
    if (txt) a[key] = { t: txt, ts: Date.now(), pk: old.pk || (shown ? 1 : 0), n: (old.n || 0) + 1 }; else delete a[key];
    save();
  };
  const acts = () => {
    $("#sa").innerHTML = txt && !editing && !rec ? `<button class="sbtn" id="rs" type="button">${IC.redo}重说</button><button class="sbtn" id="ed" type="button">${IC.edit}改字</button>` : "";
    if ($("#rs")) $("#rs").onclick = () => { commit(""); show(""); acts(); hint(); listen(); };
    if ($("#ed")) $("#ed").onclick = edit;
  };
  function edit() {                                     // 识别错了 / 不能识别：文字框就在原处，直接改
    stopRec(); editing = true; stopAudio();
    $("#sd").innerHTML = `<textarea id="ta" rows="2" placeholder="${ph}">${esc(txt)}</textarea>`;
    const ta = $("#ta"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }; fit();
    ta.oninput = () => { fit(); commit(ta.value); };
    const done = () => { editing = false; show(txt); acts(); hint(); };
    ta.onblur = () => { if (SR) done(); };
    $("#sa").innerHTML = SR ? `<button class="sbtn" id="ok" type="button">完成</button>` : "";
    if ($("#ok")) { $("#ok").onmousedown = e => e.preventDefault(); $("#ok").onclick = done; }
  }
  // ---- 听写：非连续模式（说完一句自动停，不会出现 buku buku 这种重复）；停下时还没转成正式结果的“临时结果”也要收下
  function listen() {
    if (!SR) return edit();
    if (rec) return stopRec();
    stopAudio(); editing = false;
    const base = txt; let fin = "", im = "", err = "", live = false;
    const r = rec = new SR(); r.lang = SEC[sec].lang; r.continuous = false; r.interimResults = true; r.maxAlternatives = 1;
    const mc = $("#mc");
    mc.classList.add("wait"); mc.innerHTML = IC.stop; $("#ml").textContent = "准备中……（先别说，等话筒变红）"; $("#sa").innerHTML = "";
    const go = () => { if (live || rec !== r) return; live = true; mc.classList.remove("wait"); mc.classList.add("on"); $("#ml").textContent = "请说！说完会自动停，也可以点一下停"; };
    r.onaudiostart = go; r.onspeechstart = go; r.onstart = () => setTimeout(go, 700);
    r.onresult = e => {
      im = "";
      for (let k = e.resultIndex; k < e.results.length; k++) {
        const x = e.results[k];
        if (x.isFinal) fin = (fin + " " + x[0].transcript).trim(); else im += x[0].transcript;
      }
      go(); show((base + " " + fin).trim(), im);
    };
    r.onerror = e => { err = e.error; };
    r.onend = () => {
      if (rec !== r) return; rec = null;
      mc.classList.remove("on", "wait"); mc.innerHTML = IC.mic;
      const got = (fin || im).trim();                     // 没来得及转正的临时结果也收下
      if (got) commit((base + " " + got).trim());
      show(txt); acts(); hint();
      const msg = {
        "not-allowed": "麦克风没有权限：请在浏览器设置里允许使用麦克风（iPad：设置 → Safari → 麦克风）",
        "service-not-allowed": "这个浏览器不让用语音识别（iPad：设置 → 通用 → 键盘，打开「启用听写」）",
        "no-speech": "没听到声音。靠近一点，等话筒变红再说",
        "audio-capture": "没找到麦克风",
        "network": "语音识别要联网（是在苹果/谷歌的服务器上识别的），网络不好会失败，再点一次",
        "language-not-supported": "这台设备没有印尼语听写：iPad 在 设置 → 通用 → 键盘 → 听写语言 里加上 Bahasa Indonesia，或者点「改字」打字",
      }[err];
      if (!got) $("#ml").textContent = msg || (err === "aborted" ? "已停止" : "没识别出来。等话筒变红再说，或者点文字框直接打字");
    };
    try { r.start(); } catch (e) { rec = null; mc.classList.remove("wait"); mc.innerHTML = IC.mic; $("#ml").textContent = "启动不了语音识别，请点文字框直接打字"; }
  }
  hint(); show(txt); acts();
  if (!SR) edit();
  $("#pl").onclick = () => playItem(sec, id, $("#pl"));
  $("#mc").onclick = () => { if (rec) return stopRec(); if (editing && $("#ta")) $("#ta").blur(); stopAudio(); setTimeout(listen, 150); };   // 先停掉题目的声音，留一点时间让音频设备让出来
  $("#sd").onclick = e => { if (!editing && !rec && !e.target.closest("textarea")) edit(); };
  $("#sh").onclick = () => {
    shown = !shown;
    $("#rv").innerHTML = shown ? `<div class="reveal">${esc(textOf(sec, id))}</div>` : "";
    $("#sh").textContent = shown ? "收起文字" : "没听清？看文字";
    if (shown && S.ans[d] && S.ans[d][key]) { S.ans[d][key].pk = 1; save(); }
  };
  $("#pv").onclick = () => { stopRec(); location.hash = `#do/${sec}/${i - 1}`; };
  $("#nx").onclick = () => { stopRec(); location.hash = `#do/${sec}/${i + 1}`; };
  setTimeout(() => playItem(sec, id, $("#pl")), 250);
}

function secDone(sec) {
  const d = today(), set = daySet(d), c = count(d, sec), n = set[sec].length;
  const next = ["qa", "z", "i"].find(s => count(d, s) < set[s].length);
  $("#app").innerHTML = `<div class="top"><h1>${SEC[sec].name}</h1>${tabs("")}</div><div class="card glass" style="text-align:center">
    <div style="font-family:var(--font-display);font-size:46px;font-weight:700;color:var(--prac)">${c}/${n}</div>
    <p class="note">${c < n ? "还有 " + (n - c) + " 题没答，可以回去补上。" : "这一部分做完了。"}</p>
    <div class="row2" style="justify-content:center">${next ? `<a class="btn" href="#do/${next}/${Math.max(0, set[next].findIndex(id => !ansOf(d, next, id)))}">下一部分：${SEC[next].name}</a>` : ""}<a class="btn ghost" href="#">回首页</a></div></div>`;
  syncUp();
}

// ---------- 复盘
function reviewList() {
  const days = [...new Set([...Object.keys(S.ans), ...Object.keys(K.corr || {})])].sort().reverse();
  $("#app").innerHTML = `<div class="top"><div><h1>复盘</h1><p class="sub">看自己说了什么、哪里要改</p></div>${tabs("review")}</div>
  ${days.length ? days.map(d => {
    const C = (K.corr || {})[d] || {}, ok = Object.keys(C).length;
    const n = new Set([...Object.keys(S.ans[d] || {}), ...Object.keys(C).filter(k => C[k].ans)]).size;   // Excel 做的那天，答案在批改里
    return `<a class="day glass" href="#review/${d}"><span><b>${d}</b><br><small class="sub">答了 ${n} 题</small></span><span class="badge ${ok ? "ok" : "wait"}">${ok ? "已批改" : "等批改"}</span></a>`;
  }).join("") : '<p class="empty">还没有练习记录。</p>'}`;
}
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const POS = new Set("n vt vi v adj adv prep num conj pron part int aux art".split(" "));
// 把文字里的印尼语单词变成指向词典的链接（只处理标签之外的字母串）
const lk = h => h.replace(/(<[^>]+>|&[a-z]+;|&#\d+;)|([A-Za-z][A-Za-z]*(?:-[A-Za-z]+)*)/g, (m, tag, w) => tag || (w.length < 2 || POS.has(w.toLowerCase()) ? m : `<a class="w" href="dict.html#${encodeURIComponent(w.toLowerCase())}">${w}</a>`));
function reviewDay(d) {
  const C = (K.corr || {})[d] || {}, A = S.ans[d] || {}, ck = Object.keys(C);
  const set = { qa: [], z: [], i: [] };                       // 按实际答过的顺序列；再补批改里有的（比如 Excel 做的那天）
  const keys = [...Object.keys(A).sort((x, y) => (A[x].ts || 0) - (A[y].ts || 0)), ...ck];
  for (const key of keys) { const sec = key[0] === "q" ? "qa" : key.slice(-1), id = sec === "qa" ? key : key.slice(0, -1); if (set[sec] && !set[sec].includes(id)) set[sec].push(id); }
  const GN = { A: "全对", B: "小错", C: "再练" };
  const item = (sec, id, k) => {
    const key = itemId(sec, id), a = A[key], c = C[key];
    const fixLang = sec === "i" ? "zh-CN" : "id-ID";
    return `<div class="it glass"><div class="q"><span class="n">${k + 1}</span><button class="sp" type="button" data-p="${sec}|${id}" aria-label="听题目">${IC.play}</button><span>${lk(esc(textOf(sec, id)))}${c && c.g ? `<span class="g ${c.g}">${GN[c.g]}</span>` : ""}</span></div>
      <div class="kv"><span class="k">你说的</span>${a ? esc(a.t) + (a.pk ? ' <small class="sub">（看过文字）</small>' : "") : c && c.ans ? esc(c.ans) : '<span class="sub">没答</span>'}</div>
      ${c ? `<div class="kv"><span class="k">改好的</span><span class="fix">${lk(rich(c.fix))}</span> <button class="sp" style="display:inline-grid;vertical-align:middle" type="button" data-t="${esc(c.fix.replace(/\*\*/g, ""))}" data-l="${fixLang}" aria-label="读改好的句子">${IC.play}</button></div>
        ${c.note ? `<div class="kv"><span class="k">改了什么</span>${lk(esc(c.note))}</div>` : ""}${c.words ? `<div class="kv"><span class="k">生词</span>${lk(esc(c.words))}</div>` : ""}${c.pat ? `<div class="kv"><span class="k">句型</span>${lk(esc(c.pat))}</div>` : ""}${c.up ? `<div class="kv"><span class="k">升级版</span>${lk(esc(c.up))}</div>` : ""}${c.ext ? `<div class="kv"><span class="k">扩充</span>${lk(esc(c.ext))}</div>` : ""}` : ""}
    </div>`;
  };
  const com = (K.common || {})[d];
  $("#app").innerHTML = `<div class="top"><div><a href="#review" class="sub" style="text-decoration:none">‹ 复盘</a><h1>${d}</h1></div>${tabs("review")}</div>
  ${com ? `<div class="card glass common"><b style="font-family:var(--cjk)">这次的共性问题</b><ul>${com.map(x => `<li>${lk(rich(x))}</li>`).join("")}</ul></div>` : Object.keys(C).length ? "" : '<div class="card glass note">还没批改。做完以后告诉 cc「做完了」。</div>'}
  ${["qa", "z", "i"].map(sec => {
    const ids = [...(set[sec] || [])];                         // 加上批改里有、但不在当天题单里的（Excel 做的那天）
    ck.forEach(k => { const id = sec === "qa" ? (k[0] === "q" ? k : "") : (k.endsWith(sec) && k[0] === "t" ? k.slice(0, -1) : ""); if (id && !ids.includes(id)) ids.push(id); });
    const show = ids.filter(id => (A[itemId(sec, id)] || C[itemId(sec, id)]) && (sec === "qa" ? QA[id] : TR[id]));   // 只列答过或批改过的（题库里还在的）
    return show.length ? `<div class="sect">${SEC[sec].name}</div>` + show.map((id, k) => item(sec, id, k)).join("") : "";
  }).join("")}`;
}

// ---------- 我的句子（背这个）
function sentPage() {
  const L = (K.sent || []).filter(x => (x.lv || 1) === LV);
  const groups = {};
  L.forEach(x => (groups[x.topic || "其他"] = groups[x.topic || "其他"] || []).push(x));
  $("#app").innerHTML = `<div class="top"><div><h1>我的句子</h1><p class="sub">批改过的回答。先听题、自己说，再点开答案对一下</p></div>${tabs("sent")}</div>
  ${L.length ? Object.entries(groups).map(([t, xs]) => `<div class="sect">${esc(t)}</div>` + xs.map(x => {
    const q = Object.values(QA).find(y => y.q === x.q);
    return `<div class="it glass"><div class="q">${q ? `<button class="sp" type="button" data-p="qa|${q.id}" aria-label="听题目">${IC.play}</button>` : ""}<span>${lk(esc(x.q))}</span></div>
    <div class="kv"><span class="hid fix" data-un>${lk(esc(x.a))}</span> <button class="sp" style="display:inline-grid;vertical-align:middle" type="button" data-t="${esc(x.a)}" data-l="id-ID" aria-label="读答案">${IC.play}</button></div>
    ${x.zh ? `<div class="kv sub">${esc(x.zh)}</div>` : ""}</div>`;
  }).join("")).join("") : '<p class="empty">批改以后，改好的句子会出现在这里。</p>'}`;
}

document.addEventListener("click", e => {
  const lv = e.target.closest("[data-lv]"); if (lv) { e.preventDefault(); if (+lv.dataset.lv !== LV) setLV(lv.dataset.lv); return; }
  const p = e.target.closest("[data-p]"); if (p) { const [s, id] = p.dataset.p.split("|"); return playItem(s, id, p); }
  const t = e.target.closest("[data-t]"); if (t) return tts(t.dataset.t, t.dataset.l, t);
  const u = e.target.closest("[data-un]"); if (u) u.classList.toggle("hid");
});
if (window.speechSynthesis) speechSynthesis.getVoices();
route();
pullAll();
</script>
</html>
