<style>[hidden]{display:none!important}
:root{--prac:#5856d6;--prac-soft:#ecebfc;--learn:#0071e3;--learn-soft:#e4f0fd;--navh:62px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--prac:#7d7aff;--prac-soft:#24234d;--learn:#0a84ff;--learn-soft:#0a2e4d}}
:root[data-theme="dark"]{--prac:#7d7aff;--prac-soft:#24234d;--learn:#0a84ff;--learn-soft:#0a2e4d}
body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:stretch;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-top:1px solid var(--glass-border)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:12px;padding:5px 0;min-height:52px}
.nav a svg{width:23px;height:23px}
.nav a.p.on{color:var(--prac)} .nav a.l.on{color:var(--learn)}
.nav .sep{width:1px;background:var(--line);margin:10px 3px}
.nav .lbl,.nav .nb{display:none}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:210px}
  .nav{top:0;right:auto;width:210px;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;padding:22px 14px;border-top:0;border-right:1px solid var(--glass-border)}
  .nav .nb{display:block;font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 10px 10px}
  .nav .nb small{display:block;font-family:var(--font-body);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .nav .lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:16px 10px 4px}
  .nav .sep{display:none}
  .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;font-size:14.5px;padding:9px 12px;min-height:0;color:var(--ink-soft)}
  .nav a svg{width:20px;height:20px}
  .nav a:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
  .nav a.p.on{background:var(--prac-soft)} .nav a.l.on{background:var(--learn-soft)}
}

:root{
  --ground:#f2f2f7; --surface:#ffffff; --surface-2:#e5e5ea;
  --ink:#1c1c1e; --ink-soft:#3a3a3c; --muted:#8e8e93; --line:#d1d1d6;
  --good:#248a3d; --good-soft:#e3f5e8; --bad:#d70015; --bad-soft:#fde4e6;
  --blue:#0071e3; --blue-soft:#e4f0fd; --purple:#8944ab;
  --font-display:"Newsreader","Microsoft YaHei","PingFang SC",Georgia,serif;
  --font-body:"IBM Plex Sans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --cjk:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --glass:color-mix(in srgb,var(--surface) 74%,transparent);
  --glass-border:color-mix(in srgb,var(--ink) 11%,transparent);
  --glass-hi:color-mix(in srgb,white 30%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --good:#30d158;--good-soft:#123320;--bad:#ff453a;--bad-soft:#3d1414;--blue:#0a84ff;--blue-soft:#0a2e4d;--purple:#bf5af2;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --good:#30d158;--good-soft:#123320;--bad:#ff453a;--bad-soft:#3d1414;--blue:#0a84ff;--blue-soft:#0a2e4d;--purple:#bf5af2;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 30px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
h1{font-family:var(--font-display);font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-family:var(--cjk);font-size:16px;margin:22px 4px 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;gap:3px;padding:3px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:10px}
.seg a{font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:6px 14px;border-radius:8px;text-decoration:none}
.seg a.on{background:var(--surface);color:var(--prac);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--prac);outline-offset:2px}
.card{border-radius:24px;padding:20px;margin-top:14px}
.tasks{display:grid;gap:10px;margin-top:14px}
.task{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px;text-decoration:none;color:inherit}
.task .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--prac-soft);color:var(--prac);flex-shrink:0;font-weight:700;font-size:14px;font-family:var(--font-display)}
.task b{display:block;font-family:var(--cjk);font-size:16px}
.task small{color:var(--muted);font-size:12.5px}
.task .go{margin-left:auto;font-weight:600;color:var(--prac);white-space:nowrap}
.task.done .go{color:var(--good)}
.mini{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:6px;width:160px;max-width:100%}
.mini i{display:block;height:100%;background:var(--prac)}
.task.done .mini i{background:var(--good)}
.btn{font:inherit;font-size:15px;font-weight:600;border:0;background:var(--prac);color:#fff;border-radius:14px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-border)}
.btn.no{background:var(--bad-soft);color:var(--bad)}
.btn.okb{background:var(--good-soft);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.note{font-size:13.5px;color:var(--ink-soft);font-family:var(--cjk)}
.login{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin-top:10px}
@media (max-width:600px){.login{grid-template-columns:1fr 1fr}}
.login input{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);min-width:0}
.err{color:var(--bad);font-size:13px;margin-top:6px}
/* 练习页 */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--prac)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--prac-soft);color:var(--prac)}
.stage{display:grid;justify-items:center;gap:6px;margin:22px 0 6px}
.play{width:92px;height:92px;border-radius:99px;border:0;background:var(--prac-soft);color:var(--prac);display:grid;place-items:center;cursor:pointer}
.play svg{width:40px;height:40px}
.play.on{animation:pulse 1.2s ease-in-out infinite}
.lab{font-size:13px;color:var(--muted);font-family:var(--cjk)}
.mic{width:112px;height:112px;border-radius:99px;border:0;background:var(--prac);color:#fff;display:grid;place-items:center;cursor:pointer;margin-top:18px;box-shadow:0 8px 24px color-mix(in srgb,var(--prac) 35%,transparent)}
.mic svg{width:46px;height:46px}
.mic.on{background:var(--bad);box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent);animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@keyframes pulse{50%{transform:scale(1.06)}}
.said{min-height:52px;margin-top:16px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--surface-2) 45%,transparent);font-size:15.5px;color:var(--ink-soft)}
.said .im{color:var(--muted)}
.said .ph{color:var(--muted);font-family:var(--cjk);font-size:13.5px}
.hintbtn{font:inherit;font-size:13px;border:0;background:none;color:var(--prac);cursor:pointer;font-family:var(--cjk);padding:4px 8px;border-radius:8px}
.reveal{margin-top:8px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);font-size:16px;text-align:center;max-width:100%}
.mic.wait{background:var(--muted);box-shadow:none}
.said textarea{display:block;width:100%;font:inherit;font-size:15.5px;border:0;outline:0;background:transparent;color:var(--ink);min-height:44px;resize:none;padding:0}
.sact{display:flex;justify-content:flex-end;gap:6px;margin-top:6px;min-height:30px}
.sbtn{font:inherit;font-size:14.5px;border:0;background:none;color:var(--ink-soft);cursor:pointer;font-family:var(--cjk);padding:9px 14px;border-radius:10px;display:inline-flex;align-items:center;gap:5px}
.sbtn svg{width:16px;height:16px}
.sbtn:active{background:var(--surface-2)}
.w{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.hid .w{pointer-events:none}
.navr{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* 复盘 */
.day{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;margin-top:8px}
.badge{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.badge.wait{background:var(--surface-2);color:var(--ink-soft)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.it{border-radius:18px;padding:14px 16px;margin-top:10px}
.it .q{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.it .q .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:22px}
.sp{border:0;background:var(--prac-soft);color:var(--prac);width:30px;height:30px;border-radius:99px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.sp svg{width:15px;height:15px}
.kv{margin-top:8px;font-size:14.5px}
.kv .k{display:inline-block;min-width:58px;color:var(--muted);font-size:12.5px;font-family:var(--cjk)}
.fix{font-size:16px}
.fix b{color:var(--bad)}
.g{font-size:12px;font-weight:700;border-radius:6px;padding:0 7px;margin-left:6px}
.g.A{background:var(--good-soft);color:var(--good)} .g.B{background:var(--blue-soft);color:var(--blue)} .g.C{background:var(--bad-soft);color:var(--bad)}
.common li{margin:4px 0;font-family:var(--cjk);font-size:14px}
.sect{font-family:var(--cjk);font-weight:600;margin:20px 4px 2px;color:var(--ink-soft)}
.hid{filter:blur(6px);cursor:pointer;user-select:none}
.empty{color:var(--muted);text-align:center;padding:20px;font-family:var(--cjk)}

body::before{background:
  radial-gradient(900px 720px at -5% -8%,rgba(91,141,255,.10),transparent 62%),
  radial-gradient(900px 720px at 105% 4%,rgba(155,108,255,.09),transparent 62%),
  radial-gradient(1000px 800px at 50% 115%,rgba(122,132,255,.06),transparent 66%),

:root[data-theme="dark"]{--glass:color-mix(in srgb,var(--surface) 50%,transparent)!important;--glass-border:rgba(255,255,255,.10)!important;--glass-hi:rgba(255,255,255,.08)!important}
.glass,.bar,.entry,.panel{backdrop-filter:blur(40px) saturate(200%)!important;-webkit-backdrop-filter:blur(40px) saturate(200%)!important}
.nav{background:color-mix(in srgb,var(--surface) 55%,transparent)!important;backdrop-filter:blur(40px) saturate(200%)!important;-webkit-backdrop-filter:blur(40px) saturate(200%)!important;border-color:var(--glass-border)!important}
.hero{background:var(--glass)!important}
</style>

: "q154", "q": "Anda suka makanan pedas?", "au": "d54e6ccb3a0b", "src": 1, "zt": 0}, {"id": "q155", "q": "Berapa kali sehari Anda makan?", "au": "ce6b12e8aa80", "src": 1, "zt": 0}, {"id": "q156", "q": "Apa yang Anda beli di pasar?", "au": "a8ffd6019483", "src": 1, "zt": 0}, {"id": "q157", "q": "Apakah Anda suka berbelanja online?", "au": "7fe07b87472e", "src": 1, "zt": 0}, {"id": "q158", "q": "Berapa harga satu kilogram apel?", "au": "854602239e4e", "src": 1, "zt": 0}, {"id": "q159", "q": "Apa pekerjaan orang tua Anda?", "au": "f984ef3c462f", "src": 1, "zt": 0}, {"id": "q160", "q": "Apakah Anda punya saudara?", "au": "8505fc2e41bf", "src": 1, "zt": 0}, {"id": "q161", "q": "Berapa kali Anda menelepon keluarga?", "au": "8797edc1eb2b", "src": 1, "zt": 0}, {"id": "q162", "q": "Ada berapa kamar di tempat tinggal Anda?", "au": "909e07bef777", "src": 1, "zt": 0}, {"id": "q163", "q": "Dengan siapa Anda tinggal?", "au": "2b3d9e94262b", "src": 1, "zt": 0}, {"id": "q164", "q": "Apa yang Anda lakukan pada akhir pekan?", "au": "4142be3f8b5e", "src": 1, "zt": 0}, {"id": "q165", "q": "Apakah Anda suka menonton film?", "au": "78e36e27e11e", "src": 1, "zt": 0}, {"id": "q166", "q": "Musik apa yang Anda sukai?", "au": "1c71ffa634e6", "src": 1, "zt": 0}, {"id": "q167", "q": "Sejak kapan Anda suka hobi itu?", "au": "241b7552c429", "src": 1, "zt": 0}, {"id": "q168", "q": "Apakah Anda suka membaca buku?", "au": "dc521b7478a9", "src": 1, "zt": 0}, {"id": "q169", "q": "Apa yang ingin Anda pelajari?", "au": "74f0b973e787", "src": 1, "zt": 0}, {"id": "q170", "q": "Sudah berapa lama kamu bekerja di sini?", "au": "6752b963b433", "src": 0, "zt": 1}, {"id": "q171", "q": "Barang apa yang sering Anda beli?", "au": "78ade5b0e83f", "src": 0, "zt": 1}, {"id": "q172", "q": "Apakah Anda suka membeli buah?", "au": "898c76fd463b", "src": 0, "zt": 1}, {"id": "q173", "q": "Apa makanan favorit Anda?", "au": "18f6affae596", "src": 0, "zt": 1}, {"id": "q174", "q": "Apakah anda bisa melahirkan?", "au": "4348e3f8c538", "src": 0, "zt": 1}, {"id": "q175", "q": "Dengan siapa biasanya anda menghabiskan waktu luang?", "au": "725577f9618c", "src": 0, "zt": 1}, {"id": "q176", "q": "Apakah anda suka mendengarkan musik? Musik Tiongkok apa?", "au": "9918f642b18c", "src": 0, "zt": 1}, {"id": "q177", "q": "Apa makanan kesukaan atau favorit anda?", "au": "340b549c901b", "src": 0, "zt": 1}, {"id": "q178", "q": "Anda lebih suka makan di restoran atau di kantin?", "au": "00351084407a", "src": 0, "zt": 1}, {"id": "q179", "q": "Anda biasanya minum teh atau kopi?", "au": "a9760c70a792", "src": 0, "zt": 1}, {"id": "q180", "q": "Malam ini ada acara apa? Kami ada acara perusahaan Jumat sore ini.", "au": "ab6a1e6ffca0", "src": 0, "zt": 1}, {"id": "q181", "q": "Apakah temanmu akan membantumu saat kamu kesulitan?", "au": "5ef7158e757b", "src": 0, "zt": 1}, {"id": "q182", "q": "Apakah temanmu suka berkomunikasi dengan orang lain?", "au": "511177347962", "src": 0, "zt": 1}, {"id": "q183", "q": "Apakah beban kerja temanmu berat?", "au": "0f7430bc16a3", "src": 0, "zt": 1}, {"id": "q184", "q": "Apa yang paling kamu sukai dari temanmu?", "au": "86c28f135e71", "src": 0, "zt": 1}, {"id": "q185", "q": "Jam berapa temanmu biasanya mulai bekerja?", "au": "84b3ab3b8829", "src": 0, "zt": 1}, {"id": "q186", "q": "Apakah temanmu bekerja dengan teliti?", "au": "ba9e6f3aa1b0", "src": 0, "zt": 1}, {"id": "q187", "q": "Apa yang temanmu suka lakukan di waktu luang?", "au": "112b6c16f9b3", "src": 0, "zt": 1}, {"id": "q188", "q": "Apakah temanmu mudah marah?", "au": "32fe4e2f5ffd", "src": 0, "zt": 1}, {"id": "q189", "q": "Apakah temanmu perlu bekerja di akhir pekan?", "au": "a9ff263ccef9", "src": 0, "zt": 1}], "tr": [{"id": "t001", "s": "Tolong kirim email ini kepada semua manajer di perusahaan.", "zh": "请把这封邮件发给公司所有的经理。", "au": "e5edbbf272ab", "za": "c7e6849b7ef9", "src": 0, "zt": 0}, {"id": "t002", "s": "Saya butuh bantuan Anda untuk menyelesaikan laporan ini.", "zh": "我需要你的帮助来完成这份报告。", "au": "045f0bf30dd2", "za": "253ce3026810", "src": 0, "zt": 0}, {"id": "t003", "s": "Di mana saya bisa menemukan kamar mandi dan kantin?", "zh": "我在哪里可以找到洗手间和食堂？", "au": "23bceda13b41", "za": "acb78e51054b", "src": 0, "zt": 0}, {"id": "t004", "s": "Di mana saya bisa menemukan toilet dan kantin?", "zh": "我在哪里可以找到洗手间和食堂？", "au": "201bc3cb2420", "za": "acb78e51054b", "src": 0, "zt": 0}, {"id": "t005", "s": "Saya mulai bekerja pukul delapan pagi dan pulang kerja pukul lima sore.", "zh": "我早上八点开始上班，下午五点下班。", "au": "7a10d7d71cb4", "za": "94d8fdca0858", "src": 0, "zt": 0}, {"id": "t006", "s": "Nama saya Deni, saya adalah karyawan baru di perusahaan ini.", "zh": "我叫 Deni，我是这家公司的新员工。", "au": "d3ce18638509", "za": "1652fbed5297", "src": 0, "zt": 0}, {"id": "t007", "s": "Telepon di meja Anda berbunyi, silakan diangkat.", "zh": "你桌上的电话在响，请接一下。", "au": "3c7843b6b5ac", "za": "a26079922e0a", "src": 0, "zt": 0}, {"id": "t008", "s": "Tolong fotokopi dokumen ini sebanyak 5 rangkap.", "zh": "请把这份文件复印 5 份。", "au": "5f0e295f1b55", "za": "1f5a90abd876", "src": 0, "zt": 0}, {"id": "t009", "s": "Saya masih belum paham, bisakah Anda mengulangi penjelasannya?", "zh": "我还不明白，您能再解释一遍吗？", "au": "f18695e7f72d", "za": "df25e5cdbdca", "src": 0, "zt": 0}, {"id": "t010", "s": "Bos saya sangat baik, dia sering membantu karyawan baru di perusahaan.", "zh": "我的老板很好，经常帮助公司的新员工。", "au": "ffcbb0f971a4", "za": "ec3730aec228", "src": 0, "zt": 0}, {"id": "t011", "s": "Selamat pagi, Pak Budi, apa kabar Anda hari ini?", "zh": "早上好，Budi 先生，您今天好吗？", "au": "7d1b3505ff11", "za": "51a272ff4967", "src": 0, "zt": 0}, {"id": "t012", "s": "Ini meja kerja saya, dekat dengan jendela.", "zh": "这是我的办公桌，离窗户很近。", "au": "c37732f8b09a", "za": "fe747d5acfb1", "src": 0, "zt": 0}, {"id": "t013", "s": "Tempat kerja saya sangat dekat dengan jendela.", "zh": "我的工位离窗户很近。", "au": "d6fb5f57cf6a", "za": "fe747d5acfb1", "src": 0, "zt": 0}, {"id": "t014", "s": "Besok saya akan pergi ke pabrik bersama tim produksi.", "zh": "我明天将和生产团队一起去工厂。", "au": "eb3a48eb4a85", "za": "aa2c7450144e", "src": 0, "zt": 0}, {"id": "t015", "s": "Besok saya akan pergi ke lokasi bersama tim produksi.", "zh": "我明天将和生产团队一起去现场。", "au": "dcc4ffeff24c", "za": "a8275f46cc2b", "src": 0, "zt": 0}, {"id": "t016", "s": "Komputer saya rusak, tolong panggilkan teknisi ke sini.", "zh": "我的电脑坏了，请叫技术员过来。", "au": "f0f5996398a4", "za": "279ea2064f77", "src": 0, "zt": 0}, {"id": "t017", "s": "Ini adalah jadwal rapat untuk minggu depan.", "zh": "这是下周的会议时间表。", "au": "69827c891896", "za": "9b12044f5d9a", "src": 0, "zt": 0}, {"id": "t018", "s": "Ini hasil kerja saya, apakah sudah sesuai dengan permintaan?", "zh": "这是我的工作成果，是否已经符合要求？", "au": "6cf450453d5a", "za": "08eb839f22d9", "src": 0, "zt": 0}, {"id": "t019", "s": "Kami ada acara perusahaan Jumat sore ini.", "zh": "我们这周五下午有公司活动。", "au": "9453709f7009", "za": "8b7ef3ae3ff2", "src": 0, "zt": 0}, {"id": "t020", "s": "Saya butuh tanda tangan Anda di kontrak ini.", "zh": "我需要您在这份合同上签字。", "au": "ec450a859eb8", "za": "b06db94e2a4c", "src": 0, "zt": 0}, {"id": "t021", "s": "Saya bekerja di bagian pemasaran sebagai staf administrasi.", "zh": "我在市场部工作，职位是行政专员（文员）。", "au": "89e3efdb206f", "za": "5c127fa29553", "src": 0, "zt": 0}, {"id": "t022", "s": "Saya akan cuti tiga hari minggu depan.", "zh": "我下周将休假三天。", "au": "e89d6e2f87dd", "za": "e307c8b3773c", "src": 0, "zt": 0}, {"id": "t023", "s": "Silakan pergi ke lobi pukul sepuluh untuk menemui tamu dari Singapura.", "zh": "请十点去大堂接见来自新加坡的客人。", "au": "266e7787e4d8", "za": "f937d173383b", "src": 0, "zt": 0}, {"id": "t024", "s": "Maaf saya terlambat, karena di jalan terjadi kemacetan.", "zh": "抱歉我迟到了，因为路上堵车。", "au": "9efa7d727bc3", "za": "b340f5da74b7", "src": 0, "zt": 0}, {"id": "t025", "s": "Kapan batas waktu akhir proyek ini? Saya membutuhkan informasinya.", "zh": "这个项目的截止日期是什么时候？我需要这个信息。", "au": "145ab732390e", "za": "d2ddcbf2dd8c", "src": 0, "zt": 0}, {"id": "t026", "s": "Saya akan mengantar tamu bisnis ini ke hotel.", "zh": "我会把这位商务客人送到酒店。", "au": "e7e45f90d513", "za": "f9b9a03a8f1c", "src": 0, "zt": 0}, {"id": "t027", "s": "Kantor kami perlu lebih banyak kertas dan pulpen.", "zh": "我们办公室需要更多的纸和笔。", "au": "092641913277", "za": "e3466cac57c3", "src": 0, "zt": 0}, {"id": "t028", "s": "Mika memakai kemeja putih dan jam tangan hitam, sangat tampan.", "zh": "Mika 穿着白衬衫、戴着黑色手表，非常帅。", "au": "bb6e58e94261", "za": "acd536469c0b", "src": 0, "zt": 0}, {"id": "t029", "s": "Saya suka bekerja di sini karena lingkungan kerjanya sangat ramah.", "zh": "我喜欢在这里工作，因为工作环境很友好。", "au": "6b7e4ab0ca4e", "za": "6f4d6129b875", "src": 0, "zt": 0}, {"id": "t030", "s": "Terima kasih atas bantuan dan kerja sama Anda hari ini.", "zh": "感谢您今天的帮助和合作。", "au": "c6ad43d1e3f7", "za": "d151ca652370", "src": 0, "zt": 0}, {"id": "t031", "s": "Sekarang saya harus pergi ke ruang rapat di lantai tiga untuk rapat.", "zh": "我现在必须去三楼的会议室开会。", "au": "b84ad6cb5b56", "za": "475b719fe1e0", "src": 0, "zt": 0}, {"id": "t032", "s": "Kami makan malam bersama keluarga setiap hari.", "zh": "我们每天和家人一起吃晚饭。", "au": "0a467ccd98b4", "za": "8117f661d0b7", "src": 0, "zt": 0}, {"id": "t033", "s": "Guru menjelaskan pelajaran dengan sangat jelas.", "zh": "老师讲课讲得非常清楚。", "au": "08f76eb1ca8a", "za": "04c2a4d0a246", "src": 0, "zt": 0}, {"id": "t034", "s": "Karena sakit, saya tidak pergi ke sekolah.", "zh": "因为生病，我没有去学校。", "au": "2ca6c95d900d", "za": "2ac5d82a5c7e", "src": 0, "zt": 0}, {"id": "t035", "s": "Saya suka makan nasi goreng karena sangat enak.", "zh": "我喜欢吃炒饭，因为很好吃。", "au": "e1e9a9b72d65", "za": "3fd6e3bf53c3", "src": 0, "zt": 0}, {"id": "t036", "s": "Saya suka makan nasi goreng karena enak dan tidak mahal.", "zh": "我喜欢吃炒饭，因为好吃又便宜。", "au": "14e9415c510c", "za": "b3ced88569bd", "src": 0, "zt": 0}, {"id": "t037", "s": "Saya biasanya bermain basket bersama teman-teman di akhir pekan.", "zh": "我通常和朋友在周末一起打篮球。", "au": "761e85646b15", "za": "097f56085ef4", "src": 0, "zt": 0}, {"id": "t038", "s": "Saya tinggal di tempat yang sangat tenang dan nyaman (dan tidak jauh dari sekolah).", "zh": "我住在一个非常安静舒适的地方（离学校不远）。", "au": "34017e7faa4a", "za": "257112eb9221", "src": 0, "zt": 0}, {"id": "t039", "s": "Pagi ini saya membuat sarapan di dapur, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "au": "8dc053ebff3b", "za": "19569032fe8a", "src": 0, "zt": 0}, {"id": "t040", "s": "Kami berencana berlibur ke Indonesia bulan depan.", "zh": "我们计划下个月去印尼旅游。", "au": "c1c02c8362d2", "za": "1978164732db", "src": 0, "zt": 0}, {"id": "t041", "s": "Kami sering belajar bersama di kelas dan sering saling membantu.", "zh": "我们经常在教室一起学习，经常互相帮助。", "au": "167e82102d52", "za": "c510b9ae5ae7", "src": 0, "zt": 0}, {"id": "t042", "s": "Kadang-kadang saya membersihkan kamar agar nyaman untuk belajar.", "zh": "有时候我打扫房间，让学习的环境舒适。", "au": "f2c181998587", "za": "744b9e73b27f", "src": 0, "zt": 0}, {"id": "t043", "s": "Dia belajar di perpustakaan karena perpustakaan sangat tenang.", "zh": "他在图书馆学习，因为图书馆很安静。", "au": "498fa53810eb", "za": "88920e252528", "src": 0, "zt": 0}, {"id": "t044", "s": "Pada malam hari saya duduk bersama keluarga menonton televisi.", "zh": "晚上我和家人坐在一起看电视。", "au": "1ff209f2dbd5", "za": "55f0a3de0680", "src": 0, "zt": 0}, {"id": "t045", "s": "Saya langsung minum kopi setelah bangun pagi.", "zh": "我早上起床后立即喝咖啡。", "au": "90b012be586c", "za": "60075f894222", "src": 0, "zt": 0}, {"id": "t046", "s": "Sore ini kami belajar bahasa Indonesia di perpustakaan.", "zh": "今天下午我们在图书馆学习印尼语。", "au": "553cdef32567", "za": "46a54211a9b0", "src": 0, "zt": 0}, {"id": "t047", "s": "Besok saya pergi ke sekolah naik sepeda.", "zh": "我明天骑自行车去学校。", "au": "98519fa57ea2", "za": "2c5480307b1c", "src": 0, "zt": 0}, {"id": "t048", "s": "Saya bersepeda ke sekolah setiap hari.", "zh": "我每天骑自行车去上学。", "au": "aa03ace8daf9", "za": "2c5480307b1c", "src": 0, "zt": 0}, {"id": "t049", "s": "Saya bangun jam enam setiap pagi untuk pergi ke sekolah.", "zh": "我每天早上六点起床，为了去上学。", "au": "162b8b316a07", "za": "fa15c1a91d94", "src": 0, "zt": 0}, {"id": "t050", "s": "Saya minum air setiap kali selesai berolahraga demi kesehatan tubuh.", "zh": "我每次运动后喝水，是为了身体健康。", "au": "322e8a9fd26b", "za": "dd36013792e7", "src": 0, "zt": 0}, {"id": "t051", "s": "Setiap minggu saya pergi ke kafe bersama teman pada sore hari untuk minum kopi dan mengobrol.", "zh": "我每周下午和朋友去咖啡馆喝咖啡聊天。", "au": "0a6397214b1c", "za": "e2d0018bfac4", "src": 0, "zt": 0}, {"id": "t052", "s": "Ayah saya adalah guru sekolah menengah.", "zh": "我的父亲是一名中学老师。", "au": "1d1ab83f9aef", "za": "7cb7698b943b", "src": 0, "zt": 0}, {"id": "t053", "s": "Setiap minggu saya pergi ke perpustakaan untuk membaca buku.", "zh": "我每周都去图书馆看书。", "au": "97209d50f2cd", "za": "53bef4123bdb", "src": 0, "zt": 0}, {"id": "t054", "s": "Setelah masuk universitas, saya kenal banyak teman baru.", "zh": "我上大学后认识了很多新朋友。", "au": "3cd5a3d3a9e1", "za": "ee2bfce3c1dd", "src": 0, "zt": 0}, {"id": "t055", "s": "Kadang-kadang saya mendengarkan musik untuk menghilangkan stres.", "zh": "我有时听音乐来消除烦恼。", "au": "a3b517b2e886", "za": "2013563b1219", "src": 0, "zt": 0}, {"id": "t056", "s": "Saya selalu membawa kamera untuk memotret pemandangan yang indah.", "zh": "我总是带着相机拍摄美丽的风景。", "au": "3c009669b7cf", "za": "28571218c5ec", "src": 0, "zt": 0}, {"id": "t057", "s": "Saat liburan, saya suka pergi ke pantai dan bermain pasir di pantai.", "zh": "旅游时我喜欢去沙滩，在沙滩上玩。", "au": "c4ccce925590", "za": "584876a32d84", "src": 0, "zt": 0}, {"id": "t058", "s": "Ibu saya adalah dokter, dia melayani pasien di klinik.", "zh": "我妈妈是医生，在诊所看病人。", "au": "50cea9ee1ac0", "za": "17e21304d935", "src": 0, "zt": 0}, {"id": "t059", "s": "Setiap pagi saya bangun pukul enam dan langsung mandi.", "zh": "我每天早上六点起床，然后马上洗澡。", "au": "b9c314a16c81", "za": "0aabe1be1ca3", "src": 1, "zt": 0}, {"id": "t060", "s": "Saya biasanya sarapan roti dan minum kopi.", "zh": "我早餐通常吃面包、喝咖啡。", "au": "c4bc8234c469", "za": "0ec61307e848", "src": 1, "zt": 0}, {"id": "t061", "s": "Malam ini saya mau mencuci baju dan membersihkan kamar.", "zh": "今晚我要洗衣服、打扫房间。", "au": "ff69b251e7b1", "za": "c01dfb6ed13d", "src": 1, "zt": 0}, {"id": "t062", "s": "Kamar saya kecil, tetapi bersih dan nyaman.", "zh": "我的房间很小，但是干净又舒适。", "au": "36b4d475aed8", "za": "e056ed0ed7e0", "src": 1, "zt": 0}, {"id": "t063", "s": "Saya tidak suka tidur terlalu malam.", "zh": "我不喜欢睡得太晚。", "au": "8fe2a08e6b1c", "za": "35201c96f1dd", "src": 1, "zt": 0}, {"id": "t064", "s": "Sebelum tidur saya biasanya membaca buku.", "zh": "睡觉前我通常看书。", "au": "571090deb0c8", "za": "7e65836dcf88", "src": 1, "zt": 0}, {"id": "t065", "s": "Hari Minggu saya istirahat di rumah.", "zh": "星期天我在家休息。", "au": "cb55ce26a7a0", "za": "e8cb603d2baa", "src": 1, "zt": 0}, {"id": "t066", "s": "Saya lupa membawa kunci kamar.", "zh": "我忘了带房间钥匙。", "au": "0f9826595701", "za": "6b6b25882db7", "src": 1, "zt": 0}, {"id": "t067", "s": "Tolong matikan lampu kalau keluar dari kamar.", "zh": "出房间的时候请关灯。", "au": "9ec7140a78f7", "za": "f0ab65fea8cb", "src": 1, "zt": 0}, {"id": "t068", "s": "Air di kamar mandi tidak keluar.", "zh": "卫生间没有水了。", "au": "1b7228fba21d", "za": "121543bb4eb9", "src": 1, "zt": 0}, {"id": "t069", "s": "Saya perlu membeli sabun dan sampo.", "zh": "我需要买香皂和洗发水。", "au": "8bde98811e69", "za": "832cc1201f86", "src": 1, "zt": 0}, {"id": "t070", "s": "Ponsel saya rusak, jadi saya tidak bisa menelepon.", "zh": "我的手机坏了，所以没法打电话。", "au": "aa0eb5eaa772", "za": "2720bf3db00e", "src": 1, "zt": 0}, {"id": "t071", "s": "Saya sering menelepon orang tua saya pada malam hari.", "zh": "我经常晚上给父母打电话。", "au": "0697ebae97fb", "za": "08a54de131c0", "src": 1, "zt": 0}, {"id": "t072", "s": "Akhir pekan ini saya ingin pergi ke pantai.", "zh": "这个周末我想去海边。", "au": "5fc705b048f7", "za": "fa6aaabef71a", "src": 1, "zt": 0}, {"id": "t073", "s": "Saya sedang menunggu teman saya di depan toko.", "zh": "我正在商店门口等朋友。", "au": "969539073710", "za": "f25f9e1d011f", "src": 1, "zt": 0}, {"id": "t074", "s": "Saya mau pesan nasi goreng dan es teh manis.", "zh": "我要点一份炒饭和一杯甜冰茶。", "au": "dffe461779a5", "za": "05a9c472c1cf", "src": 1, "zt": 0}, {"id": "t075", "s": "Makanan ini terlalu pedas untuk saya.", "zh": "这个菜对我来说太辣了。", "au": "2a4dadc96e90", "za": "ecbe6243df87", "src": 1, "zt": 0}, {"id": "t076", "s": "Berapa harga baju ini?", "zh": "这件衣服多少钱？", "au": "00dff2b7908d", "za": "faf0326b0572", "src": 1, "zt": 0}, {"id": "t077", "s": "Bisa kurang sedikit harganya?", "zh": "能便宜一点吗？", "au": "0f128259ca20", "za": "0599d0a8b14a", "src": 1, "zt": 0}, {"id": "t078", "s": "Saya mau membayar dengan kartu.", "zh": "我想刷卡付钱。", "au": "89ae756391df", "za": "e384ab9f7727", "src": 1, "zt": 0}, {"id": "t079", "s": "Toko itu buka dari pukul sembilan pagi sampai pukul sembilan malam.", "zh": "那家店从早上九点开到晚上九点。", "au": "af5db42d0a3d", "za": "f4ba28597c23", "src": 1, "zt": 0}, {"id": "t080", "s": "Saya membeli buah-buahan segar di pasar.", "zh": "我在市场买新鲜水果。", "au": "0fde5a9b74a4", "za": "793ca56b17f0", "src": 1, "zt": 0}, {"id": "t081", "s": "Kami makan siang di kantin karena murah dan enak.", "zh": "我们在食堂吃午饭，因为便宜又好吃。", "au": "d8e635954d28", "za": "cb73b19672c4", "src": 1, "zt": 0}, {"id": "t082", "s": "Tolong jangan pakai cabai.", "zh": "请不要放辣椒。", "au": "a2c5177704d8", "za": "a538b312790c", "src": 1, "zt": 0}, {"id": "t083", "s": "Apakah ada ukuran yang lebih besar?", "zh": "有大一点的尺码吗？", "au": "7b8eb141f5d4", "za": "75cceb97e366", "src": 1, "zt": 0}, {"id": "t084", "s": "Saya tidak makan daging babi.", "zh": "我不吃猪肉。", "au": "14d238cffa4a", "za": "d459ab5b0f73", "src": 1, "zt": 0}, {"id": "t085", "s": "Kopi Indonesia sangat terkenal dan enak.", "zh": "印尼咖啡非常有名，也很好喝。", "au": "c8b50b63160e", "za": "6377dcfd9075", "src": 1, "zt": 0}, {"id": "t086", "s": "Saya lapar, ayo kita makan dulu.", "zh": "我饿了，我们先去吃饭吧。", "au": "2de3eb600821", "za": "c3f8e6cd8ab5", "src": 1, "zt": 0}, {"id": "t087", "s": "Supermarket itu menjual banyak barang dari Tiongkok.", "zh": "那家超市卖很多中国来的东西。", "au": "73b58e5324f2", "za": "b154a69148e6", "src": 1, "zt": 0}, {"id": "t088", "s": "Minta bonnya, ya.", "zh": "请给我小票。", "au": "95573afa5f4a", "za": "1a1600a25f64", "src": 1, "zt": 0}, {"id": "t089", "s": "Saya pergi ke kantor naik bus perusahaan setiap hari.", "zh": "我每天坐公司班车去上班。", "au": "ba0e4bb3da1c", "za": "ef194352f86d", "src": 1, "zt": 0}, {"id": "t090", "s": "Jalan ini sangat macet pada sore hari.", "zh": "这条路傍晚非常堵。", "au": "ced73ca9812b", "za": "0d08b00cb6c3", "src": 1, "zt": 0}, {"id": "t091", "s": "Berapa ongkos naik taksi ke bandara?", "zh": "坐出租车去机场要多少钱？", "au": "73447e4f38ef", "za": "a8b3211030a9", "src": 1, "zt": 0}, {"id": "t092", "s": "Tolong berhenti di depan hotel itu.", "zh": "请在那家酒店门口停一下。", "au": "e28f93eb46a6", "za": "5b77d053ecc6", "src": 1, "zt": 0}, {"id": "t093", "s": "Bandara jauh dari sini, kira-kira dua jam naik mobil.", "zh": "机场离这里很远，开车大约两个小时。", "au": "f9eeb7761784", "za": "16114a528984", "src": 1, "zt": 0}, {"id": "t094", "s": "Saya akan pulang ke Tiongkok naik pesawat minggu depan.", "zh": "下周我要坐飞机回中国。", "au": "fc49563b5f7e", "za": "64d93736e4b3", "src": 1, "zt": 0}, {"id": "t095", "s": "Pesawat saya berangkat pukul tujuh pagi.", "zh": "我的飞机早上七点起飞。", "au": "3d4b1bcde468", "za": "c43364051dd0", "src": 1, "zt": 0}, {"id": "t096", "s": "Belok kanan di lampu merah, lalu jalan lurus.", "zh": "在红绿灯右转，然后直走。", "au": "31f9d8f3e5b6", "za": "55618960ab09", "src": 1, "zt": 0}, {"id": "t097", "s": "Kantor pos ada di seberang bank.", "zh": "邮局在银行对面。", "au": "9836649129b3", "za": "5b4afc049308", "src": 1, "zt": 0}, {"id": "t098", "s": "Hati-hati di jalan!", "zh": "路上小心！", "au": "a66a2a3a8f84", "za": "6d9f76fa40fd", "src": 1, "zt": 0}, {"id": "t099", "s": "Saya terlambat karena busnya datang terlambat.", "zh": "我迟到了，因为班车来晚了。", "au": "0da0b1b9f459", "za": "257cb70021a9", "src": 1, "zt": 0}, {"id": "t100", "s": "Apakah bus ini pergi ke pasar?", "zh": "这辆车去市场吗？", "au": "66627338fed3", "za": "e7df46591075", "src": 1, "zt": 0}, {"id": "t101", "s": "Saya belum bisa mengendarai motor.", "zh": "我还不会骑摩托车。", "au": "ba1271e8c9dd", "za": "d6af481791e6", "src": 1, "zt": 0}, {"id": "t102", "s": "Kami naik kapal ke pulau itu.", "zh": "我们坐船去那个岛。", "au": "a593f68c6770", "za": "516150584f1f", "src": 1, "zt": 0}, {"id": "t103", "s": "Tolong pesan taksi untuk saya.", "zh": "请帮我叫一辆出租车。", "au": "2ba5d5489a0d", "za": "f2b9b615fb39", "src": 1, "zt": 0}, {"id": "t104", "s": "Hari ini cuacanya sangat panas.", "zh": "今天天气非常热。", "au": "86e658d6792a", "za": "58c86337dcbf", "src": 1, "zt": 0}, {"id": "t105", "s": "Tadi malam hujan deras sekali.", "zh": "昨晚雨下得非常大。", "au": "3aab10945df9", "za": "f4ada434c156", "src": 1, "zt": 0}, {"id": "t106", "s": "Jangan lupa membawa payung karena mau hujan.", "zh": "别忘了带伞，因为要下雨了。", "au": "3e8c42c35cfb", "za": "67d80ca0278a", "src": 1, "zt": 0}, {"id": "t107", "s": "Di Indonesia hanya ada musim hujan dan musim kemarau.", "zh": "印尼只有雨季和旱季。", "au": "f3b83f5927f7", "za": "36d4523121d8", "src": 1, "zt": 0}, {"id": "t108", "s": "Rapat dimulai pukul sembilan tepat.", "zh": "会议九点整开始。", "au": "ef3b7f118de9", "za": "225afd49b537", "src": 1, "zt": 0}, {"id": "t109", "s": "Saya akan kembali dalam lima belas menit.", "zh": "我十五分钟后回来。", "au": "92f4bec92b75", "za": "a55dc072798e", "src": 1, "zt": 0}, {"id": "t110", "s": "Kemarin saya bekerja sampai pukul delapan malam.", "zh": "昨天我工作到晚上八点。", "au": "ea54485a6f23", "za": "2df08e98dce5", "src": 1, "zt": 0}, {"id": "t111", "s": "Besok lusa adalah hari ulang tahun ibu saya.", "zh": "后天是我妈妈的生日。", "au": "c6e2b6f5d800", "za": "bd61d7b050a3", "src": 1, "zt": 0}, {"id": "t112", "s": "Saya sudah tinggal di sini selama dua tahun.", "zh": "我已经在这里住了两年了。", "au": "9ddea3332bae", "za": "47a16e9bef94", "src": 1, "zt": 0}, {"id": "t113", "s": "Bulan depan kami akan libur selama satu minggu.", "zh": "下个月我们放假一周。", "au": "8f3491d3fb24", "za": "7ab9e735f3bf", "src": 1, "zt": 0}, {"id": "t114", "s": "Sekarang sudah pukul dua belas, waktunya makan siang.", "zh": "现在已经十二点了，该吃午饭了。", "au": "ef5376d2bbd1", "za": "9e391a5c0233", "src": 1, "zt": 0}, {"id": "t115", "s": "Setiap hari Senin kami ada rapat pagi.", "zh": "每个星期一我们都有晨会。", "au": "3fec4abd4da8", "za": "0e31afe242e1", "src": 1, "zt": 0}, {"id": "t116", "s": "Cuaca di kampung halaman saya sekarang sudah dingin.", "zh": "我家乡现在已经冷了。", "au": "d624558b5fc7", "za": "406bed818ecf", "src": 1, "zt": 0}, {"id": "t117", "s": "Matahari terbit pukul enam pagi.", "zh": "太阳早上六点升起。", "au": "8cbfbecb0371", "za": "4fdeaee7109f", "src": 1, "zt": 0}, {"id": "t118", "s": "Tahun lalu saya belum bisa berbahasa Indonesia.", "zh": "去年我还不会说印尼语。", "au": "48797bba0740", "za": "04fd2f805756", "src": 1, "zt": 0}, {"id": "t119", "s": "Keluarga saya tinggal di Tiongkok.", "zh": "我的家人住在中国。", "au": "3b08b86cf6e1", "za": "fd9b5dabb197", "src": 1, "zt": 0}, {"id": "t120", "s": "Saya anak pertama dari dua bersaudara.", "zh": "我是家里两个孩子中的老大。", "au": "a98c6c1ce15b", "za": "3a0950403aef", "src": 1, "zt": 0}, {"id": "t121", "s": "Adik saya masih sekolah di SMA.", "zh": "我的弟弟/妹妹还在上高中。", "au": "c26d5e270609", "za": "a0264e3dfc65", "src": 1, "zt": 0}, {"id": "t122", "s": "Orang tua saya sudah pensiun.", "zh": "我的父母已经退休了。", "au": "f9115b84b41f", "za": "c71500d88b55", "src": 1, "zt": 0}, {"id": "t123", "s": "Saya sangat rindu kepada keluarga saya.", "zh": "我非常想念我的家人。", "au": "b0a4009e36e1", "za": "de858e814265", "src": 1, "zt": 0}, {"id": "t124", "s": "Teman saya orang Indonesia, namanya Budi.", "zh": "我的朋友是印尼人，他叫 Budi。", "au": "8f3eb51d4cc1", "za": "b182cc416e96", "src": 1, "zt": 0}, {"id": "t125", "s": "Dia orang yang ramah dan suka bercanda.", "zh": "他是个友善、爱开玩笑的人。", "au": "6d76d75d1fd8", "za": "7ee7cb2b7b3e", "src": 1, "zt": 0}, {"id": "t126", "s": "Kami sudah berteman selama lima tahun.", "zh": "我们已经做了五年朋友了。", "au": "58d81cd335c7", "za": "f1f6c4dc1137", "src": 1, "zt": 0}, {"id": "t127", "s": "Akhir pekan ini saya diundang ke pesta pernikahan teman.", "zh": "这个周末我被邀请去参加朋友的婚礼。", "au": "ffa0ce88cf16", "za": "91730d24b2e5", "src": 1, "zt": 0}, {"id": "t128", "s": "Kakak saya sudah menikah dan punya satu anak.", "zh": "我哥哥/姐姐已经结婚了，有一个孩子。", "au": "ef7d100541b1", "za": "a577207a6963", "src": 1, "zt": 0}, {"id": "t129", "s": "Saya sering mengobrol dengan teman lewat video.", "zh": "我经常和朋友视频聊天。", "au": "1c2f94a6d776", "za": "5c01078bd590", "src": 1, "zt": 0}, {"id": "t130", "s": "Ibu saya pandai memasak.", "zh": "我妈妈很会做饭。", "au": "b84d050194c7", "za": "34638593a2dc", "src": 1, "zt": 0}, {"id": "t131", "s": "Kami merayakan ulang tahun ayah di restoran.", "zh": "我们在餐厅给爸爸过生日。", "au": "f44933bc4a17", "za": "072d374102e7", "src": 1, "zt": 0}, {"id": "t132", "s": "Teman sekamar saya sangat rajin.", "zh": "我的室友非常勤快。", "au": "18c73f1204c4", "za": "7971f97b2370", "src": 1, "zt": 0}, {"id": "t133", "s": "Saya ingin mengajak keluarga saya berlibur ke Bali.", "zh": "我想带家人去巴厘岛度假。", "au": "d40b9ed51508", "za": "9693f6486fb5", "src": 1, "zt": 0}, {"id": "t134", "s": "Saya sakit kepala dan demam sejak kemarin.", "zh": "我从昨天开始头疼发烧。", "au": "54d5db46315a", "za": "18a72c21a215", "src": 1, "zt": 0}, {"id": "t135", "s": "Saya mau izin tidak masuk kerja hari ini karena sakit.", "zh": "我今天生病了，想请假不去上班。", "au": "c59c27174c48", "za": "c66e5e3d9593", "src": 1, "zt": 0}, {"id": "t136", "s": "Minum obat ini tiga kali sehari setelah makan.", "zh": "这个药一天三次，饭后吃。", "au": "c35076c48562", "za": "3a3f96131651", "src": 1, "zt": 0}, {"id": "t137", "s": "Di mana klinik terdekat?", "zh": "最近的诊所在哪里？", "au": "eb43c934b3c1", "za": "de21520e84e1", "src": 1, "zt": 0}, {"id": "t138", "s": "Dokter bilang saya harus banyak istirahat.", "zh": "医生说我要多休息。", "au": "a698b41b5ce7", "za": "7a0444c22dac", "src": 1, "zt": 0}, {"id": "t139", "s": "Perut saya sakit setelah makan makanan pedas.", "zh": "吃了辣的东西以后我肚子疼。", "au": "dcca7a014b65", "za": "a0100c0194a8", "src": 1, "zt": 0}, {"id": "t140", "s": "Saya alergi udang.", "zh": "我对虾过敏。", "au": "d3df01303652", "za": "69f77bdee0c3", "src": 1, "zt": 0}, {"id": "t141", "s": "Jangan lupa minum air putih yang banyak.", "zh": "别忘了多喝白开水。", "au": "676729b97c47", "za": "256bc0f4fc02", "src": 1, "zt": 0}, {"id": "t142", "s": "Saya berolahraga setiap pagi supaya sehat.", "zh": "我每天早上运动，为了保持健康。", "au": "43e9b3949de3", "za": "63d04b85fa63", "src": 1, "zt": 0}, {"id": "t143", "s": "Semoga cepat sembuh!", "zh": "祝你早日康复！", "au": "ef1bd4f0a951", "za": "c1c6600d9872", "src": 1, "zt": 0}, {"id": "t144", "s": "Saya sudah merasa lebih baik sekarang.", "zh": "我现在感觉好多了。", "au": "eb297a05f65c", "za": "0f91df7f2bf5", "src": 1, "zt": 0}, {"id": "t145", "s": "Tolong panggilkan dokter.", "zh": "请帮我叫医生。", "au": "b2fea78b951a", "za": "b5a92b87d029", "src": 1, "zt": 0}, {"id": "t146", "s": "Gigi saya sakit, saya perlu ke dokter gigi.", "zh": "我牙疼，需要去看牙医。", "au": "94ec13d94ddf", "za": "1fc24bad168f", "src": 1, "zt": 0}, {"id": "t147", "s": "Saya kurang tidur karena banyak pekerjaan.", "zh": "因为工作多，我睡眠不足。", "au": "82530070dd1b", "za": "467f24c2f797", "src": 1, "zt": 0}, {"id": "t148", "s": "Pakai masker kalau sedang batuk.", "zh": "咳嗽的时候要戴口罩。", "au": "dc31c5178121", "za": "5ecc507ecfd1", "src": 1, "zt": 0}, {"id": "t149", "s": "Saya sedang membuat laporan bulanan.", "zh": "我正在做月报。", "au": "ef9ae97d870a", "za": "76211cc27208", "src": 1, "zt": 0}, {"id": "t150", "s": "Rapat hari ini diundur ke besok pagi.", "zh": "今天的会推迟到明天早上。", "au": "8d64315b3dff", "za": "6cce433d6d6f", "src": 1, "zt": 0}, {"id": "t151", "s": "Tolong cetak dokumen ini dua lembar.", "zh": "请把这份文件打印两份。", "au": "91940fee4866", "za": "562149d78de3", "src": 1, "zt": 0}, {"id": "t152", "s": "Saya akan mengirim data itu sebelum pukul lima sore.", "zh": "我会在下午五点前把数据发过去。", "au": "234a01dcd518", "za": "b1e29da38cbd", "src": 1, "zt": 0}, {"id": "t153", "s": "Atasan saya sedang dinas ke Jakarta.", "zh": "我的上司正在雅加达出差。", "au": "4f98f1ca49bc", "za": "85562a1f0fac", "src": 1, "zt": 0}, {"id": "t154", "s": "Kontrak ini harus ditandatangani oleh direktur.", "zh": "这份合同必须由总经理签字。", "au": "b1e0c4ea0e73", "za": "2f686acdaf5b", "src": 1, "zt": 0}, {"id": "t155", "s": "Apakah Anda sudah memeriksa faktur ini?", "zh": "你检查过这张发票了吗？", "au": "211b1d18488e", "za": "8fefe499bf92", "src": 1, "zt": 0}, {"id": "t156", "s": "Saya tidak mengerti, bisa tolong jelaskan sekali lagi?", "zh": "我没听懂，能请你再解释一遍吗？", "au": "abf0d5c0670e", "za": "5e77639b9341", "src": 1, "zt": 0}, {"id": "t157", "s": "Bulan ini kami harus menyelesaikan banyak pekerjaan.", "zh": "这个月我们要完成很多工作。", "au": "53bb0729831a", "za": "ab96ea59982e", "src": 1, "zt": 0}, {"id": "t158", "s": "Komputer saya tidak bisa menyala.", "zh": "我的电脑开不了机。", "au": "685571384eb0", "za": "c9df846ab468", "src": 1, "zt": 0}, {"id": "t159", "s": "Tolong hubungi saya kalau ada masalah.", "zh": "有问题的话请联系我。", "au": "ca8a8678ba15", "za": "4d9c8bfb9d18", "src": 1, "zt": 0}, {"id": "t160", "s": "Saya minta maaf karena terlambat.", "zh": "抱歉，我迟到了。", "au": "7a5e9ab588d0", "za": "780856c57445", "src": 1, "zt": 0}, {"id": "t161", "s": "Kantor kami pindah ke gedung baru.", "zh": "我们办公室搬到了新大楼。", "au": "1cdba74e4af9", "za": "85121683ba60", "src": 1, "zt": 0}, {"id": "t162", "s": "Gaji dibayar setiap akhir bulan.", "zh": "工资每个月底发。", "au": "b6e12abc0147", "za": "328fd362fd1d", "src": 1, "zt": 0}, {"id": "t163", "s": "Hari Jumat saya pulang lebih awal.", "zh": "星期五我早点下班。", "au": "a38a7bfd243b", "za": "03c106617400", "src": 1, "zt": 0}, {"id": "t164", "s": "Saya belajar bahasa Indonesia setiap hari Selasa dan Kamis.", "zh": "我每周二和周四学印尼语。", "au": "7b2052e9fc31", "za": "45e8cd64fc31", "src": 1, "zt": 0}, {"id": "t165", "s": "Guru kami sangat sabar dan baik.", "zh": "我们的老师非常有耐心，人也很好。", "au": "fd3b76e1f310", "za": "3367f21dd925", "src": 1, "zt": 0}, {"id": "t166", "s": "Ujian bahasa Indonesia akan diadakan akhir bulan ini.", "zh": "印尼语考试将在这个月底举行。", "au": "08032058576a", "za": "9abe97c990d7", "src": 1, "zt": 0}, {"id": "t167", "s": "Saya harus menghafal banyak kosakata baru.", "zh": "我得背很多新单词。", "au": "fde12c25fc12", "za": "46ec30bc44e4", "src": 1, "zt": 0}, {"id": "t168", "s": "Tolong ulangi pertanyaannya pelan-pelan.", "zh": "请慢慢地再说一遍问题。", "au": "808a5c6c87c4", "za": "65b596ca0630", "src": 1, "zt": 0}, {"id": "t169", "s": "Apa arti kata ini dalam bahasa Mandarin?", "zh": "这个词用中文是什么意思？", "au": "85bf116e918d", "za": "c8f24dfcefc0", "src": 1, "zt": 0}, {"id": "t170", "s": "Saya lupa mengerjakan pekerjaan rumah.", "zh": "我忘了做作业。", "au": "aa51d8ab45dd", "za": "38bc9eb4bd98", "src": 1, "zt": 0}, {"id": "t171", "s": "Perpustakaan tutup pada hari Minggu.", "zh": "图书馆星期天关门。", "au": "0b783757fe74", "za": "83fca088bfa7", "src": 1, "zt": 0}, {"id": "t172", "s": "Kami belajar berkelompok di ruang kelas.", "zh": "我们在教室分组学习。", "au": "6ed440990643", "za": "2bdf3c6c12cf", "src": 1, "zt": 0}, {"id": "t173", "s": "Saya ingin lulus ujian dengan nilai yang baik.", "zh": "我想以好成绩通过考试。", "au": "1313e492eef7", "za": "6dc0a42911a9", "src": 1, "zt": 0}, {"id": "t174", "s": "Pelajaran hari ini tentang keluarga.", "zh": "今天的课讲的是家庭。", "au": "65cc77ef733e", "za": "9b14ba238140", "src": 1, "zt": 0}, {"id": "t175", "s": "Boleh saya bertanya?", "zh": "我可以问个问题吗？", "au": "423e66318dfd", "za": "19cb28c934bd", "src": 1, "zt": 0}, {"id": "t176", "s": "Saya belum mengerti tata bahasa ini.", "zh": "我还没弄懂这个语法。", "au": "3a06f90dd4e8", "za": "a7ba191dd5ae", "src": 1, "zt": 0}, {"id": "t177", "s": "Teman sekelas saya berasal dari berbagai kota.", "zh": "我的同学来自不同的城市。", "au": "c7a55d34a83c", "za": "0b264c31c15e", "src": 1, "zt": 0}, {"id": "t178", "s": "Setiap pagi saya membaca teks bahasa Indonesia dengan suara keras.", "zh": "我每天早上大声朗读印尼语课文。", "au": "0b916f7e7f57", "za": "74fe7cbf51ef", "src": 1, "zt": 0}, {"id": "t179", "s": "Kami belajar bersama di kelas dan saling membantu.", "zh": "我们在课堂上一起学习并互相帮助。", "au": "17194067c83b", "za": "dfb06e2b071d", "src": 0, "zt": 1}, {"id": "t180", "s": "Kadang-kadang saya membersihkan kamar agar lingkungan belajar nyaman.", "zh": "有时候我打扫房间，让学习环境舒适。", "au": "eed9f96f7c46", "za": "512305ae5ede", "src": 0, "zt": 1}, {"id": "t181", "s": "Dia belajar di perpustakaan karena di sana sangat tenang.", "zh": "他在图书馆学习，因为那里很安静。", "au": "cbb485e2b659", "za": "fe53b4065acc", "src": 0, "zt": 1}, {"id": "t182", "s": "Karena sangat lelah, saya tidur lebih awal dari biasanya.", "zh": "因为身体很累，我比平常睡得早。", "au": "e291a514ffba", "za": "9f302a226ba4", "src": 0, "zt": 1}, {"id": "t183", "s": "Pada malam hari kami sekeluarga duduk bersama menonton televisi.", "zh": "晚上我们一家人坐在一起看电视。", "au": "9cd41709d323", "za": "dcb5a749380a", "src": 0, "zt": 1}, {"id": "t184", "s": "Saya membuat sarapan di dapur pagi ini, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "au": "4dcdbbb18c1b", "za": "19569032fe8a", "src": 0, "zt": 1}, {"id": "t185", "s": "Kami berencana liburan ke Indonesia bulan depan.", "zh": "我们计划下个月去印尼度假。", "au": "a470b8db26aa", "za": "42f19b16bbaf", "src": 0, "zt": 1}, {"id": "t186", "s": "Saya biasanya bermain basket dengan teman pada akhir pekan.", "zh": "我通常周末和朋友打篮球。", "au": "8d9c5a694875", "za": "a9a6aa82eb9c", "src": 0, "zt": 1}, {"id": "t187", "s": "Saya tidak bisa pergi bersama mereka karena hari ini saya masih harus bekerja.", "zh": "我不能和他们一起去，因为我今天还要工作。", "au": "081e7b8457ab", "za": "92f05a2371be", "src": 0, "zt": 1}, {"id": "t188", "s": "Saya tinggal di tempat yang sangat tenang dan nyaman.", "zh": "我住在一个非常安静、舒适的地方。", "au": "5969a7a423e0", "za": "8f9ef201e49b", "src": 0, "zt": 1}, {"id": "t189", "s": "Saya sering belajar bersama teman di perpustakaan pada sore hari.", "zh": "我经常下午和朋友一起在图书馆学习。", "au": "8215f59ee272", "za": "811ddfcbaf2b", "src": 0, "zt": 1}, {"id": "t190", "s": "Saya biasanya membawa botol minum sendiri karena tidak mau membeli air di luar.", "zh": "我通常自己带水杯，因为不想在外面买水。", "au": "a91b39e83b56", "za": "0d0ff4867d4f", "src": 0, "zt": 1}, {"id": "t191", "s": "Teman saya sangat rajin dan suka belajar.", "zh": "我的朋友很勤奋，喜欢学习。", "au": "e37624dc09d2", "za": "a2fda0d82598", "src": 0, "zt": 1}, {"id": "t192", "s": "Setiap hari sebelum keluar rumah, saya memeriksa ponsel dan kunci.", "zh": "我每天出门前都会检查手机和钥匙。", "au": "5029704adf6f", "za": "275b3c83b873", "src": 0, "zt": 1}, {"id": "t193", "s": "Dia ingin bekerja di Indonesia setelah lulus.", "zh": "他想毕业以后在印尼工作。", "au": "67ef216b9a5c", "za": "78699218257e", "src": 0, "zt": 1}, {"id": "t194", "s": "Saya biasanya mematikan lampu sebelum meninggalkan kamar.", "zh": "我通常离开房间前关灯。", "au": "b5bbbaf993d3", "za": "4be15885946c", "src": 0, "zt": 1}, {"id": "t195", "s": "Di kelas, kami belajar mendengar, berbicara, membaca, dan menulis.", "zh": "在课堂上，我们学习听、说、读、写。", "au": "a37a597d7132", "za": "53129aba41ae", "src": 0, "zt": 1}, {"id": "t196", "s": "Karena hari ini hujan, saya tidak pergi ke sekolah.", "zh": "因为今天下雨，我没去学校。", "au": "c56c2b055b06", "za": "a0361e9e94c5", "src": 0, "zt": 1}, {"id": "t197", "s": "Saya sedang mencari dokumen yang diperlukan untuk pekerjaan hari ini.", "zh": "我正在找今天工作需要的文件。", "au": "b8b64daf835c", "za": "5358390bbabc", "src": 0, "zt": 1}, {"id": "t198", "s": "Saya pergi ke pasar bersama teman untuk membeli buah.", "zh": "我和朋友去市场买水果。", "au": "83488a28af4e", "za": "82d80ab46629", "src": 0, "zt": 1}, {"id": "t199", "s": "Kakak perempuan saya sedang memasak di dapur.", "zh": "我姐姐正在厨房做饭。", "au": "8fa8cb1e9193", "za": "cf7f7029701f", "src": 0, "zt": 1}, {"id": "t200", "s": "Karena saya sakit, saya tidak pergi ke sekolah hari ini.", "zh": "因为我生病了，所以今天没有去学校。", "au": "349c4ecdcfa9", "za": "ecd0012e2c2b", "src": 0, "zt": 1}, {"id": "t201", "s": "Saya bangun pagi jam enam setiap hari, lalu mandi dan sarapan.", "zh": "我每天早上六点起床，然后洗澡、吃早饭。", "au": "254afa346ada", "za": "aa3fa7d1a02b", "src": 0, "zt": 1}, {"id": "t202", "s": "Dia tinggal di Jakarta, dekat dengan sekolah dan kantor.", "zh": "他住在雅加达，离学校和办公室很近。", "au": "3cc0153c7a41", "za": "7d9fcf1dad42", "src": 0, "zt": 1}, {"id": "t203", "s": "Saya suka mendengarkan musik karena membuat saya senang.", "zh": "我喜欢听音乐，因为它让我开心。", "au": "099815f291ba", "za": "618b34a65764", "src": 0, "zt": 1}, {"id": "t204", "s": "Guru mengajar kami dengan sangat sabar di kelas.", "zh": "老师在课堂上非常耐心地教我们。", "au": "982842757af2", "za": "423fe3c22296", "src": 0, "zt": 1}, {"id": "t205", "s": "Apa yang kamu lakukan untuk rasa bosan?", "zh": "你无聊的时候做什么？", "au": "656480752863", "za": "ae84d1126569", "src": 0, "zt": 1}, {"id": "t206", "s": "Saya suka membaca cerita tentang budaya dan wisata ke luar negeri.", "zh": "我喜欢读关于文化和出国旅行的故事。", "au": "eab985dcf99d", "za": "17a5d8714bc0", "src": 0, "zt": 1}, {"id": "t207", "s": "Kamu sering membeli makanan apa dengan keluargamu?", "zh": "你经常和你家人买什么食物？", "au": "2dfe2df20be4", "za": "28d3b6081a65", "src": 0, "zt": 1}, {"id": "t208", "s": "Saat liburan saya suka ke pantai untuk bermain pasir.", "zh": "旅行时我喜欢去海滩玩沙子。", "au": "2fb70bb84680", "za": "6e724ee6af5d", "src": 0, "zt": 1}, {"id": "t209", "s": "Setiap setelah berolahraga saya minum air putih untuk menjaga tubuh yang sehat.", "zh": "每次锻炼完以后，喝白开水保持身体健康。", "au": "eb6e8c35a593", "za": "a5bf8fbb34cd", "src": 0, "zt": 1}, {"id": "t210", "s": "Saya setiap akhir pekan pergi ke perpustakaan meminjam buku.", "zh": "我每个周末都去图书馆借书。", "au": "c9f9779985ed", "za": "c3a87b333726", "src": 0, "zt": 1}, {"id": "t292", "s": "Saya selalu mencatat di kelas agar saya lebih mudah paham.", "zh": "我总是在课堂上记笔记，让我更容易明白。", "au": "8a7b046ebb4d", "za": "c51c53e59098", "src": 1, "zt": 0}, {"id": "t232", "s": "Toilet umum ada di sebelah kiri koperasi.", "zh": "公共厕所在合作社左边。", "au": "7e37ab538857", "za": "d62419b1f1c4", "src": 2, "zt": 0}, {"id": "t236", "s": "Aku suka rumah yang besar dan luas.", "zh": "我喜欢又大又宽敞的房子。", "au": "1f6c785bf240", "za": "9e4d3cbd11c5", "src": 2, "zt": 0}, {"id": "t237", "s": "Saya sudah bekerja di sini selama tiga tahun.", "zh": "我在这里工作三年了。", "au": "b0a845064715", "za": "70b90e7d6a91", "src": 2, "zt": 0}, {"id": "t238", "s": "Hal pertama yang saya lakukan adalah minum air putih.", "zh": "我做的第一件事是喝白开水。", "au": "4b1f8f914c14", "za": "327d9258fc0a", "src": 2, "zt": 0}, {"id": "t239", "s": "Saya biasanya membaca buku pada malam hari sebelum tidur.", "zh": "我通常晚上睡前读书。", "au": "c23e0cece549", "za": "43599850ddc1", "src": 2, "zt": 0}, {"id": "t240", "s": "Biasanya saya main bulutangkis di lapangan dekat kantor.", "zh": "我通常在公司附近的球场打。", "au": "2138b12618f0", "za": "c5576c2bb35d", "src": 2, "zt": 0}, {"id": "t241", "s": "Kegiatan di luar ruangan sangat disukai siswa.", "zh": "户外活动很受学生欢迎。", "au": "b3ea81981abb", "za": "3f12beea0bf3", "src": 2, "zt": 0}, {"id": "t242", "s": "Akhir pekan ini saya mau istirahat di rumah.", "zh": "这周末我想在家休息。", "au": "7d928cc9df2d", "za": "802d1e1c9a15", "src": 2, "zt": 0}, {"id": "t243", "s": "Gitar adalah alat musik yang saya sukai.", "zh": "吉他是我喜欢的乐器。", "au": "75063e13eae4", "za": "45003285ba42", "src": 2, "zt": 0}, {"id": "t244", "s": "Saya makan bersama dan jalan-jalan ke taman bersama keluarga.", "zh": "我和家人一起吃饭，去公园散步。", "au": "118372c498c0", "za": "341b94b78c4d", "src": 2, "zt": 0}, {"id": "t245", "s": "Setiap hari saya membuat laporan keuangan di kantor.", "zh": "我每天在办公室做财务报表。", "au": "03d92c1e19fc", "za": "41a60b05569b", "src": 2, "zt": 0}, {"id": "t246", "s": "Tugas guru adalah mengajar siswa di sekolah.", "zh": "老师的职责是在学校教学生。", "au": "3f6ac906b15c", "za": "64881d35802c", "src": 2, "zt": 0}, {"id": "t247", "s": "Karpet ada di antara kasur dan televisi.", "zh": "地毯在床和电视之间。", "au": "543debb8304a", "za": "3de288221d1f", "src": 2, "zt": 0}, {"id": "t248", "s": "Saya biasanya menghabiskan waktu luang bersama teman-teman.", "zh": "我通常和朋友们一起度过空闲时间。", "au": "fcdccaea95a8", "za": "a839f5795fad", "src": 2, "zt": 0}, {"id": "t249", "s": "Belajar gitar secara otodidak dapat dilakukan melalui buku atau internet.", "zh": "可以通过书或网络自学吉他。", "au": "9917f2f20493", "za": "f936190f2ce6", "src": 2, "zt": 0}, {"id": "t250", "s": "Makanan favorit saya nasi goreng dan sate ayam.", "zh": "我最喜欢的食物是炒饭和鸡肉沙爹。", "au": "e5a5c332ca87", "za": "e5d6dab6f691", "src": 2, "zt": 0}, {"id": "t251", "s": "Potongan harga sering kami berikan pada setiap akhir bulan.", "zh": "我们常在每月底打折。", "au": "979f919f23d9", "za": "0f6ef5752fb3", "src": 2, "zt": 0}, {"id": "t252", "s": "Spidol dan penghapus ada di bawah papan tulis.", "zh": "马克笔和板擦在黑板下面。", "au": "5357510bdb09", "za": "77772138fc06", "src": 2, "zt": 0}, {"id": "t253", "s": "Ayah saya bekerja di sebuah pabrik di 【……】.", "zh": "我爸爸在【……】的一家工厂工作。", "au": "532750a089d3", "za": "830b148e3cb5", "src": 2, "zt": 0}, {"id": "t254", "s": "Biasanya toko musik menjual berbagai jenis gitar.", "zh": "乐器店通常卖各种吉他。", "au": "aad76420857a", "za": "fcca6bf162bb", "src": 2, "zt": 0}, {"id": "t255", "s": "Saya lebih suka makan di rumah karena lebih sehat dan murah.", "zh": "我更喜欢在家吃，因为更健康也更便宜。", "au": "db7b870a1a6a", "za": "4b06f15e3c25", "src": 2, "zt": 0}, {"id": "t256", "s": "Saya akan pergi ke pesta malam ini.", "zh": "今晚我要去参加派对。", "au": "5ed49a7f896a", "za": "397a9c90e89a", "src": 2, "zt": 0}, {"id": "t257", "s": "Biasanya saya bicara tentang pekerjaan dan makanan dengan teman.", "zh": "我平时和朋友聊工作和吃的。", "au": "5eaf2776b22e", "za": "3999e11af55a", "src": 2, "zt": 0}, {"id": "t258", "s": "Saya biasanya makan malam bersama keluarga pukul tujuh malam.", "zh": "我通常晚上七点和家人吃晚饭。", "au": "0ea0a473d7f7", "za": "023717b85451", "src": 2, "zt": 0}, {"id": "t259", "s": "Kamar mandi di rumah saya sangat bersih.", "zh": "我家浴室很干净。", "au": "802fb4a9c9d6", "za": "dd3a581c2ab9", "src": 2, "zt": 0}, {"id": "t260", "s": "Hari ulang tahun itu kami makan kue bersama.", "zh": "生日那天我们一起吃蛋糕。", "au": "a3e5d0c64729", "za": "6df9ff14d841", "src": 2, "zt": 0}, {"id": "t261", "s": "Kami berpakaian rapi untuk pergi ke sekolah.", "zh": "我们穿戴整齐去上学。", "au": "69dabdce2d0b", "za": "c30947db1ca9", "src": 2, "zt": 0}, {"id": "t263", "s": "Tahun ini adalah tahun yang penting bagi saya.", "zh": "今年对我来说很重要。", "au": "f85068d73336", "za": "5e18f9eec997", "src": 2, "zt": 0}, {"id": "t264", "s": "Gedung pernikahan tepat berada di ujung jalan.", "zh": "婚礼礼堂就在路的尽头。", "au": "c757a08dd88b", "za": "bd0189e2bfa8", "src": 2, "zt": 0}, {"id": "t265", "s": "Banyak orang gemar berbelanja melalui aplikasi daring.", "zh": "很多人喜欢用线上应用购物。", "au": "b27a27735e59", "za": "e71fd82f5d22", "src": 2, "zt": 0}, {"id": "t266", "s": "Saya memberi ucapan selamat ulang tahun kepadanya.", "zh": "我祝他生日快乐。", "au": "289ce1f58edd", "za": "490eebf6d0ec", "src": 2, "zt": 0}, {"id": "t267", "s": "Saya mau pesan makanan melalui aplikasi daring.", "zh": " : 1}, {"id": "t2007", "s": "Setiap akhir pekan, saya merapikan kamar sendiri dan juga mencuci pakaian sendiri.", "zh": "在每个周末，我自己整理房间，还自己洗衣服。", "au": "781b60adc0ed", "za": "3bd283bf6787", "src": 0, "zt": 1}, {"id": "t2008", "s": "Saya sangat senang belajar bahasa Indonesia karena gurunya baik dan sabar.", "zh": "我非常喜欢学习印尼语，因为老师人很好又有耐心。", "au": "0a191655043e", "za": "8c08530443ec", "src": 0, "zt": 1}, {"id": "t2009", "s": "Setiap malam, saya makan malam bersama orang tua di rumah.", "zh": "每天晚上，我都和父母在家吃晚饭。", "au": "a53dfc0e17ca", "za": "b8617f0ea8dd", "src": 0, "zt": 1}, {"id": "t2010", "s": "Adik laki-laki saya suka mendengarkan musik di kamar.", "zh": "我的弟弟喜欢在房间里听音乐。", "au": "2d7c08cd3195", "za": "0792cb080b6f", "src": 0, "zt": 1}, {"id": "t2011", "s": "Di hari Minggu, saya biasanya bangun tidur agak siang.", "zh": "周日的时候，我通常会起得比较晚。", "au": "d911f0d15b3f", "za": "1feb7ed2eed7", "src": 0, "zt": 1}, {"id": "t2012", "s": "Ada banyak pohon buah-buahan di dekat rumah saya, dan udaranya sangat segar.", "zh": "我家附近有很多果树，空气很好。", "au": "ca9b163d722c", "za": "fa47f14d38f6", "src": 0, "zt": 1}, {"id": "t2013", "s": "Ibu saya bekerja dari rumah, tetapi ayah saya bekerja di kantor.", "zh": "我的妈妈在家里工作，但是我的爸爸在办公室工作。", "au": "2c5f03a3e9cb", "za": "826d8f73aa50", "src": 0, "zt": 1}, {"id": "t2014", "s": "Ibu saya sering memasak makan siang di rumah.", "zh": "我的妈妈经常在家做午饭。", "au": "190ab9456a4f", "za": "6d913719336a", "src": 0, "zt": 1}, {"id": "t2015", "s": "Kakek saya suka minum kopi sambil membaca koran.", "zh": "爷爷喜欢一边看报纸一边喝咖啡。", "au": "89148c4f4b3a", "za": "920b6fa505c3", "src": 0, "zt": 1}, {"id": "t2016", "s": "Tugas guru adalah mengajar siswa di sekolah.", "zh": "老师的职责是在学校教学生。", "au": "3f6ac906b15c", "za": "64881d35802c", "src": 2, "zt": 0}, {"id": "t2017", "s": "Guru adalah pekerjaan yang luar biasa dan bermanfaat.", "zh": "老师是了不起又有意义的职业。", "au": "c7e9b5afe1cc", "za": "55a69cf94cce", "src": 2, "zt": 0}, {"id": "t2018", "s": "Kita bisa memberi ilmu yang berguna untuk siswa.", "zh": "我们可以给学生传授有用的知识。", "au": "36f138fc79a8", "za": "6ec66a390ed5", "src": 2, "zt": 0}, {"id": "t2019", "s": "Saya ingin membeli satu blus dan satu rok panjang.", "zh": "我想买一件女衬衫和一条长裙。", "au": "4c79f20dd9b1", "za": "597fb7027dd2", "src": 2, "zt": 0}, {"id": "t2020", "s": "Kalau saya paling suka nasi goreng.", "zh": "我最喜欢炒饭。", "au": "6b578b83e1dd", "za": "a83ae74aad55", "src": 2, "zt": 0}, {"id": "t2021", "s": "Makanan khas negara saya adalah gado-gado.", "zh": "我们国家的特色菜是加多加多。", "au": "d3951a686acb", "za": "cba5d0da05e1", "src": 2, "zt": 0}, {"id": "t2022", "s": "Aku dan keluargaku naik pesawat ke sana.", "zh": "我和家人坐飞机去的。", "au": "aa04b1aa7788", "za": "2039aefb8712", "src": 2, "zt": 0}, {"id": "t2023", "s": "Alasannya adalah belajar gitar itu cukup mudah.", "zh": "原因是学吉他比较容易。", "au": "dab72c9ad1cd", "za": "aaad5056db24", "src": 2, "zt": 0}, {"id": "t2024", "s": "Kita juga bisa belajar gitar sendiri tanpa guru (otodidak).", "zh": "我们也可以不找老师自学吉他。", "au": "626c6d36378f", "za": "bd7290bbbf0e", "src": 2, "zt": 0}, {"id": "t2025", "s": "Belajar gitar secara otodidak dapat dilakukan melalui buku atau internet.", "zh": "自学吉他可以通过书本或网络。", "au": "880b071f0642", "za": "992b666c8501", "src": 2, "zt": 0}, {"id": "t2026", "s": "Biasanya toko musik menjual berbagai jenis gitar.", "zh": "乐器店通常卖各种各样的吉他。", "au": "06d055589bb4", "za": "f8c02d1def1c", "src": 2, "zt": 0}, {"id": "t2027", "s": "Saya seorang resepsionis di sebuah hotel.", "zh": "我是一家酒店的前台。", "au": "7e8204f62865", "za": "393d2b99cf02", "src": 2, "zt": 0}, {"id": "t2028", "s": "Saya sudah 2 tahun bekerja di sini.", "zh": "我在这里工作两年了。", "au": "5957cdd1719c", "za": "27ac4641c5e0", "src": 2, "zt": 0}, {"id": "t2029", "s": "Salah satu tugas saya adalah memeriksa pesanan kamar dari tamu hotel.", "zh": "我的工作之一是核对酒店客人的订房。", "au": "3948f23986cf", "za": "8a55685d216f", "src": 2, "zt": 0}, {"id": "t2030", "s": "Saya bisa bertemu banyak orang baru.", "zh": "我能认识很多新朋友。", "au": "1cc9ef0a5841", "za": "c0777886c553", "src": 2, "zt": 0}, {"id": "t2031", "s": "Potongan harga sering kami berikan pada setiap akhir bulan.", "zh": "我们每个月底经常打折。", "au": "39cc0175a35c", "za": "579fe3144220", "src": 2, "zt": 0}, {"id": "t2032", "s": "Pasar tradisional sekarang tidak lagi seperti yang dahulu.", "zh": "传统市场现在已经跟以前不一样了。", "au": "82777dd1727c", "za": "ef60f5f5733b", "src": 2, "zt": 0}, {"id": "t2033", "s": "Dahulu pasar tradisional sangat tidak tertata rapi dan kotor.", "zh": "以前的传统市场又乱又脏。", "au": "413af3f9b6fd", "za": "0a7ecd1f8b57", "src": 2, "zt": 0}, {"id": "t2034", "s": "Sekarang bangunan pasar tradisional sudah banyak yang permanen.", "zh": "现在很多传统市场都已经是固定建筑了。", "au": "b582eaeb63a7", "za": "9df3d73a761a", "src": 2, "zt": 0}, {"id": "t2035", "s": "Pasar tradisional sekarang juga lebih bersih.", "zh": "传统市场现在也更干净了。", "au": "1626b0997ba7", "za": "40266b3d5a24", "src": 2, "zt": 0}, {"id": "t2036", "s": "Penjual dan pembeli sudah sangat mengerti tentang kebersihan pasar.", "zh": "卖家和买家都很懂得保持市场卫生。", "au": "1b87b1c39b1c", "za": "970e54086b94", "src": 2, "zt": 0}, {"id": "t2037", "s": "Banyak pasar tradisional membuat aturan jangan buang sampah sembarangan.", "zh": "很多传统市场规定不准乱扔垃圾。", "au": "d65b6959e00f", "za": "7679a859fa7b", "src": 2, "zt": 0}, {"id": "t2038", "s": "Semua itu dilakukan agar pembeli merasa nyaman saat berbelanja di pasar tradisional.", "zh": "这一切都是为了让买家在传统市场买东西时感到舒适。", "au": "e55b5c753367", "za": "a2d68e34bef1", "src": 2, "zt": 0}, {"id": "t2039", "s": "Tambahkan ayam yang telah dicincang halus.", "zh": "加入剁碎的鸡肉。", "au": "fb0eb5748907", "za": "494e00ad0860", "src": 2, "zt": 0}, {"id": "t2040", "s": "Aduk rata hingga aroma sedap atau harum tercium.", "zh": "翻炒均匀，直到闻到香味。", "au": "ddc6c1dfc1ad", "za": "0810f64b5ebd", "src": 2, "zt": 0}, {"id": "t2041", "s": "Anda bisa menaburkan bawang merah goreng sebagai tambahan.", "zh": "还可以撒些炸红葱头。", "au": "1ee415c3d0f9", "za": "2e3061d76f15", "src": 2, "zt": 0}, {"id": "t2042", "s": "Di seberang rumah saya ada masjid.", "zh": "我家对面有一座清真寺。", "au": "11831a44d9bf", "za": "cc825cb81c82", "src": 2, "zt": 0}, {"id": "t2043", "s": "Di sebelah kiri masjid ada taman kanak-kanak.", "zh": "清真寺左边有一所幼儿园。", "au": "21706298e98c", "za": "9889608784fb", "src": 2, "zt": 0}, {"id": "t2044", "s": "Di sebelah kiri rumah saya ada kantor pos.", "zh": "我家左边是邮局。", "au": "4127467dbeb8", "za": "c74b4a368aa9", "src": 2, "zt": 0}, {"id": "t2045", "s": "Di belakang rumah saya ada toko kelontong.", "zh": "我家后面有一家杂货店。", "au": "089f31e80145", "za": "35dfc2e7e5c8", "src": 2, "zt": 0}, {"id": "t2046", "s": "Rumah saya adalah rumah dua lantai.", "zh": "我家是两层楼的房子。", "au": "14c7615c345d", "za": "f856ffe47bf2", "src": 2, "zt": 0}, {"id": "t2047", "s": "Di depan rumah saya ada halaman.", "zh": "我家前面有个院子。", "au": "8f44fedfb6cb", "za": "66c58d5c0a7f", "src": 2, "zt": 0}, {"id": "t2048", "s": "Di sebelah kiri rumah saya ada toko kelontong.", "zh": "我家左边有一家杂货店。", "au": "5499abc80cab", "za": "da324c6c9941", "src": 2, "zt": 0}, {"id": "t2049", "s": "Di seberang rumah saya ada taman bermain.", "zh": "我家对面有一个游乐场。", "au": "0a4a6103d460", "za": "df1c695d6a90", "src": 2, "zt": 0}, {"id": "t2050", "s": "Di sebelah kanan masjid ada kebun cabai.", "zh": "清真寺右边有一片辣椒园。", "au": "c0b93fabfc1b", "za": "0d2fcda366ff", "src": 2, "zt": 0}, {"id": "t2051", "s": "Di sebelah kiri rumah saya ada toko yang menjual gas dan minyak tanah.", "zh": "我家左边有一家卖煤气和煤油的店。", "au": "98bcd495ca1c", "za": "33ea96fde02d", "src": 2, "zt": 0}, {"id": "t2052", "s": "Di seberang toko gas ada toko air minum.", "zh": "煤气店对面有一家饮用水店。", "au": "4925737b81f5", "za": "25ac72aeb222", "src": 2, "zt": 0}, {"id": "t2053", "s": "Di sebelah kiri supermarket ada tempat pangkas rambut.", "zh": "超市左边有一家理发店。", "au": "5efbe3630d15", "za": "71c5a4bba47b", "src": 2, "zt": 0}, {"id": "t2054", "s": "Di seberang rumah saya ada taman bermain anak.", "zh": "我家对面有一个儿童游乐场。", "au": "5a3e02da4681", "za": "771640e2109d", "src": 2, "zt": 0}, {"id": "t2055", "s": "Lakukan tiap gerakan selama delapan detik.", "zh": "每个动作做八秒。", "au": "523283b23704", "za": "21f76a1f27c3", "src": 2, "zt": 0}, {"id": "t2056", "s": "Olahraga adalah aktivitas yang baik bagi tubuh.", "zh": "运动对身体有好处。", "au": "1c919f7b4fd7", "za": "34aeab63a7f4", "src": 2, "zt": 0}, {"id": "t2057", "s": "Ada banyak cara untuk melakukan pendinginan.", "zh": "放松运动有很多种做法。", "au": "aef35b6aafd1", "za": "f9708dbf44d2", "src": 2, "zt": 0}, {"id": "t2058", "s": "Setelah itu gerakkan tangan kanan ke atas dan ke bawah.", "zh": "然后右手向上、向下摆动。", "au": "d1995b1e61dd", "za": "736418bf4a3e", "src": 2, "zt": 0}, {"id": "t2059", "s": "Lakukan hal yang sama dengan tangan kiri.", "zh": "左手也做同样的动作。", "au": "4a69cd03a2c5", "za": "4fa3a1f1c91f", "src": 2, "zt": 0}, {"id": "t2060", "s": "Lakukan hal yang sama dengan kaki kiri.", "zh": "左腿也做同样的动作。", "au": "1d050603045f", "za": "9a204e2ed1d1", "src": 2, "zt": 0}, {"id": "t2061", "s": "Tahan tiap gerakan selama 8 detik.", "zh": "每个动作保持8秒。", "au": "086cc936cdc7", "za": "1e2c56a28f59", "src": 2, "zt": 0}, {"id": "t2062", "s": "Setelah selesai pendinginan hindari meminum minuman bersoda.", "zh": "放松运动做完后，避免喝碳酸饮料。", "au": "2211a2a5fbe4", "za": "658537322fcc", "src": 2, "zt": 0}, {"id": "t2063", "s": "Minuman bersoda dapat membuat perut menjadi kembung.", "zh": "碳酸饮料会让肚子胀气。", "au": "5ccc70968c95", "za": "e53e39af0e93", "src": 2, "zt": 0}, {"id": "t2064", "s": "Saya mencoba naik kereta rel listrik (KRL) minggu lalu.", "zh": "上周我试着坐了电气列车（KRL）。", "au": "5bb2373cf0a5", "za": "d060a278d210", "src": 2, "zt": 0}, {"id": "t2065", "s": "Pertama saya memesan tiket di loket yang ada.", "zh": "首先，我在售票窗口买票。", "au": "1a4dfeb5fc37", "za": "55ffa67763d6", "src": 2, "zt": 0}, {"id": "t2066", "s": "Saya harus menyebutkan stasiun yang ingin saya tuju.", "zh": "我得说出要去的车站。", "au": "11147e66e2c4", "za": "0dcca0ba5c37", "src": 2, "zt": 0}, {"id": "t2067", "s": "Keadaan di dalam kereta cukup sesak.", "zh": "车厢里挺挤的。", "au": "2debad9ffbb7", "za": "c411b3246a60", "src": 2, "zt": 0}, {"id": "t2068", "s": "Saya harus menempelkan kembali tiket di gerbang yang telah disediakan.", "zh": "我得在指定的闸机上再刷一次票。", "au": "2e7e57cc21cd", "za": "6a366d837443", "src": 2, "zt": 0}, {"id": "t2069", "s": "Penumpang memang harus bersabar ketika berada dalam kereta.", "zh": "乘客在车上确实要有耐心。", "au": "02195c06d099", "za": "041157621893", "src": 2, "zt": 0}, {"id": "t2070", "s": "Kami pergi ke sana dengan pesawat.", "zh": "我们坐飞机去的。", "au": "a4353ee8b006", "za": "9f7c3934ec67", "src": 2, "zt": 0}, {"id": "t2071", "s": "Sesampainya di sana kami langsung masuk ke hotel.", "zh": "到了那里，我们直接入住酒店。", "au": "1a2a2e55fdd6", "za": "7ec83d4478ec", "src": 2, "zt": 0}, {"id": "t2072", "s": "Kami juga tidak lupa untuk snorkeling.", "zh": "我们当然也去浮潜了。", "au": "eb281418ab14", "za": "dd020dd9d6b5", "src": 2, "zt": 0}, {"id": "t2073", "s": "Saya melihat banyak ikan yang berwarna-warni.", "zh": "我看到很多五颜六色的鱼。", "au": "5ffa3d840beb", "za": "5831e3057f5a", "src": 2, "zt": 0}, {"id": "t2074", "s": "Setelah itu kami mengunjungi pantai yang berpasir putih.", "zh": "之后我们去了白沙滩。", "au": "9b1e97b4b79d", "za": "94db8b715d72", "src": 2, "zt": 0}, {"id": "t2075", "s": "Saya dan keluarga tidak lupa untuk berfoto bersama.", "zh": "我和家人还一起拍了合照。", "au": "13ef814812b2", "za": "299b3a3ac74a", "src": 2, "zt": 0}, {"id": "t2076", "s": "Airnya bersih dan jernih seperti di pantai.", "zh": "瀑布的水像海水一样干净清澈。", "au": "d645214159f9", "za": "b87c377d293c", "src": 2, "zt": 0}, {"id": "t2077", "s": "Pada hari ketiga kami pulang ke rumah.", "zh": "第三天我们回家了。", "au": "cb9c74d6fe9a", "za": "8652ec515f7c", "src": 2, "zt": 0}, {"id": "t2078", "s": "Saya ingin kembali ke sana pada lain waktu.", "zh": "我想以后再去那里。", "au": "a26d01ab5b46", "za": "6c3d4407295b", "src": 2, "zt": 0}, {"id": "t2079", "s": "Pada suatu hari saya tiba-tiba merasa sangat mual.", "zh": "有一天，我突然觉得非常恶心。", "au": "cfb5b3972022", "za": "ef66a7564faf", "src": 2, "zt": 0}, {"id": "t2080", "s": "Wali kelas mengantar saya ke rumah sakit.", "zh": "班主任送我去了医院。", "au": "04ecc029e6dd", "za": "c06bd9672bad", "src": 2, "zt": 0}, {"id": "t2081", "s": "Saya langsung dimasukkan ke ruang rawat inap.", "zh": "我马上被送进了住院病房。", "au": "6feba15cd5e8", "za": "92144430bd11", "src": 2, "zt": 0}, {"id": "t2082", "s": "Perawat memasang infus di lengan saya.", "zh": "护士在我胳膊上打了点滴。", "au": "929cfb971557", "za": "a3e9989275b2", "src": 2, "zt": 0}, {"id": "t2083", "s": "Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat.", "zh": "住院期间我不能吃医院外面的食物。", "au": "7bf8776737ce", "za": "1cd1c8c82888", "src": 2, "zt": 0}, {"id": "t2084", "s": "Saya pun dianjurkan untuk sering meminum air.", "zh": "医生还建议我多喝水。", "au": "0165139fc14a", "za": "19d683bb178a", "src": 2, "zt": 0}, {"id": "t2085", "s": "Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit.", "zh": "住院期间我只能躺在床上。", "au": "3161d5d43020", "za": "cd25eb24dddc", "src": 2, "zt": 0}, {"id": "t2086", "s": "Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "zh": "我这样做是为了不再有蚊子。", "au": "1f4fb864e0e0", "za": "df4aa993ab82", "src": 2, "zt": 0}, {"id": "t2087", "s": "Aturan pakai: 5—7 tablet per dosis.", "zh": "用法：每次5—7片。", "au": "29217e97f010", "za": "c19ff11e23bd", "src": 2, "zt": 0}, {"id": "t2088", "s": "Tohpati merupakan salah satu gitaris jazz yang terkenal.", "zh": "Tohpati 是著名的爵士吉他手之一。", "au": "b387b8a6e6d6", "za": "8955eeb81d68", "src": 2, "zt": 0}, {"id": "t2089", "s": "Banyak karyanya memadukan elemen kebudayaan tradisional.", "zh": "他的很多作品融合了传统文化元素。", "au": "bf9b8a2df915", "za": "84b0ce6e43a5", "src": 2, "zt": 0}, {"id": "t2090", "s": "Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "zh": "这和他努力在音乐中融合现代与传统元素是一致的。", "au": "a5ac7094c566", "za": "1b87912cb2b7", "src": 2, "zt": 0}, {"id": "t2091", "s": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari.", "zh": "工作是每个人满足日常生活需要的必需。", "au": "293cfc5078f4", "za": "77ccc4857ab9", "src": 2, "zt": 0}, {"id": "t2092", "s": "Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul.", "zh": "木梆的作用是吸引大家的注意，让人们聚过来。", "au": "5fdc8e0d0006", "za": "812e77ca4008", "src": 2, "zt": 0}, {"id": "t2093", "s": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring).", "zh": "现在很多人喜欢用网购 App 买东西。", "au": "e95fd37e4ee6", "za": "bfdf8d01b5c9", "src": 2, "zt": 0}, {"id": "t2094", "s": "Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah.", "zh": "他们觉得用网购 App 买东西更方便。", "au": "935299d84d04", "za": "e594d74ef0b5", "src": 2, "zt": 0}, {"id": "t2095", "s": "Mereka hanya menunggu barang datang melalui jasa kurir.", "zh": "他们只要等快递把东西送来就行。", "au": "ee8b6f3429ba", "za": "4ef58f23a697", "src": 2, "zt": 0}, {"id": "t2096", "s": "Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu.", "zh": "互助活动通常在周末进行。", "au": "8813b40cfef1", "za": "d5261826f807", "src": 2, "zt": 0}, {"id": "t2097", "s": "Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "zh": "人们通常一起打扫环境、修建公共设施。", "au": "6b1aad8165f4", "za": "900990a5426e", "src": 2, "zt": 0}, {"id": "t2098", "s": "Di beberapa jalan tertentu kendaraan bermotor dilarang melintas.", "zh": "在某些路段禁止机动车通行。", "au": "d2605b418c91", "za": "c729b07780e4", "src": 2, "zt": 0}, {"id": "t2099", "s": "Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda.", "zh": "这个活动上大家最喜欢的事之一是骑自行车。", "au": "06e344605f72", "za": "f22010c7f699", "src": 2, "zt": 0}, {"id": "t2100", "s": "Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "zh": "因为没有机动车，他们可以悠闲地骑车。", "au": "dba6a7b91e9f", "za": "a8d14ee80552", "src": 2, "zt": 0}, {"id": "t2101", "s": "Becak biasanya ada di depan kompleks perumahan atau di depan pasar.", "zh": "becak 通常停在住宅区门口或市场门口。", "au": "b23a4c3dc27c", "za": "d129434e0f68", "src": 2, "zt": 0}, {"id": "t2102", "s": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida.", "zh": "在旅游景点常举办的活动之一是户外拓展训练（mancakrida）。", "au": "ba132c43e6ed", "za": "31a6a747416f", "src": 2, "zt": 0}, {"id": "t2103", "s": "Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi.", "zh": "参加这种活动的通常是家庭，或者某个公司、机构的员工。", "au": "136073c65777", "za": "9e7ca7a960f8", "src": 2, "zt": 0}, {"id": "t2104", "s": "Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan.", "zh": "这个活动是为了训练各种技能。", "au": "fc5e084cebda", "za": "50640cc0ed55", "src": 2, "zt": 0}, {"id": "t2105", "s": "Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama.", "zh": "活动的重点是团队合作能力。", "au": "9a308a80d7a7", "za": "d79628ff5df9", "src": 2, "zt": 0}, {"id": "t2106", "s": "Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh.", "zh": "刮痧是一种用钝的东西在身上刮的治疗方法。", "au": "cb362f0fc433", "za": "ff892ea0caad", "src": 2, "zt": 0}, {"id": "t2107", "s": "Ibu membawa saya ke apotek untuk membeli obat flu.", "zh": "妈妈带我去药店买感冒药。", "au": "a004d6bae523", "za": "b39434912082", "src": 2, "zt": 0}, {"id": "t2108", "s": "Saya minum obat sesuai petunjuk pada kemasan.", "zh": "我按照包装上的说明吃药。", "au": "b453b5d207e6", "za": "cb12bf4933b9", "src": 2, "zt": 0}, {"id": "t2109", "s": "Ibu membuat bubur ayam yang enak untuk saya.", "zh": "妈妈给我煮了好吃的鸡肉粥。", "au": "68d4145f3d35", "za": "d2d86680423d", "src": 2, "zt": 0}, {"id": "t2110", "s": "Saya berharap cepat sembuh dan bisa segera kembali bekerja.", "zh": "我希望快点好起来，可以早点回去上班。", "au": "119ae4e249b5", "za": "2edab98bffe0", "src": 2, "zt": 0}, {"id": "t2111", "s": "Ibu suka menawar harga karena barang di pasar bisa ditawar.", "zh": "妈妈喜欢砍价，因为市场里的东西可以讲价。", "au": "82a2f1b49993", "za": "e20edb5c8a4e", "src": 2, "zt": 0}, {"id": "t2112", "s": "Saya membantu ibu membawa belanjaan yang sudah dimasukkan ke dalam kantong plastik.", "zh": "我帮妈妈拿装在塑料袋里的东西。", "au": "d03262e7849f", "za": "3423f9a5f265", "src": 2, "zt": 0}, {"id": "t2113", "s": "Saya sangat senang karena bisa menghabiskan waktu bersama ibu.", "zh": "我很开心，因为可以陪妈妈。", "au": "a6173e2b1143", "za": "be5e59f095c9", "src": 2, "zt": 0}, {"id": "t2114", "s": "Saya boleh pulang setelah dirawat selama 5 hari.", "zh": "住院五天后我可以回家了。", "au": "0f7ee66484c7", "za": "", "src": 2, "zt": 0}, {"id": "t2115", "s": "Kita bisa belajar gitar sendiri tanpa guru (otodidak).", "zh": "我们可以不用老师自学吉他。", "au": "16283477c03a", "za": "47b3e64be3d9", "src": 2, "zt": 0}, {"id": "t2116", "s": "Regangkan tangan ke atas dan ke bawah.", "zh": "手向上、向下伸展。", "au": "7e8e5f3e7ed1", "za": "", "src": 2, "zt": 0}, {"id": "t2117", "s": "Seduh larutan oralit dengan air hangat.", "zh": "用温水冲泡补液盐。", "au": "0e32be760841", "za": "", "src": 2, "zt": 0}, {"id": "t2118", "s": "Gitar menjadi alat musik terfavorit di dunia.", "zh": "吉他成了世界上最受欢迎的乐器。", "au": "85fdb1af9810", "za": "fe79d8d5687e", "src": 2, "zt": 0}, {"id": "t2119", "s": "Kamu harus punya kartu uang elektronik dulu.", "zh": "你得先有一张电子钱包卡。", "au": "3c0ef238890f", "za": "6153f8341ad5", "src": 2, "zt": 0}, {"id": "t2120", "s": "Nanti akan kubawakan oleh-oleh dari sana.", "zh": "我会给你带那边的特产。", "au": "fd181eb30a44", "za": "", "src": 2, "zt": 0}, {"id": "t2121", "s": "Pertama saya memesan tiket di loket.", "zh": "我先在售票窗口买票。", "au": "cfb8413423f9", "za": "", "src": 2, "zt": 0}, {"id": "t2122", "s": "Bangunan pasar tradisional sudah banyak yang permanen.", "zh": "很多传统市场的建筑已是永久性的。", "au": "beda5c013c7c", "za": "f43629ee55d4", "src": 2, "zt": 0}, {"id": "t2123", "s": "Saya sudah ada janji ke dokter malam ini.", "zh": "我今晚已经约了看医生。", "au": "0a4551d52ad7", "za": "", "src": 2, "zt": 0}]};

function hashStr(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const answered = () => { const s = new Set(); for (const d in S.ans) for (const id in S.ans[d]) s.add(id); return s; };
function dueOf(ids, d, cap) {
  const P = K.prog || {}, rank = { C: 0, B: 1, A: 2 };
  return ids.filter(id => P[id] && P[id].due <= d).sort((a, b) => rank[P[a].g] - rank[P[b].g] || P[a].due.localeCompare(P[b].due)).slice(0, cap);
}
function freshQA(d, n, skip) {
  const P = K.prog || {}, done = answered();
  return DQ.filter(x => !P[x.id] && !done.has(x.id) && !skip.has(x.id))
    .sort((a, b) => a.src - b.src || b.zt - a.zt || hashStr(a.id + d) - hashStr(b.id + d)).slice(0, n).map(x => x.id);
}
// 考前（EXAM 前一天为止）：精选/模拟平均分到每一天，保证考前全部过一遍；复习、课本例句只占剩下的位置
const EXAM = LV === 2 ? "2026-11-25" : "2026-10-28";   // 二级考试大概 11-25（还没定）
const daysLeft = d => Math.max(0, Math.round((new Date(EXAM) - new Date(d)) / 864e5));
function compute(d) {
  const P = K.prog || {}, done = answered(), left = daysLeft(d);
  const qaLeft = DQ.filter(x => x.src === 0 && !P[x.id] && !done.has(x.id)).length;
  const qaRev = dueOf(DQ.map(x => x.id), d, left ? Math.max(0, Math.min(10, 20 - Math.ceil(qaLeft / left))) : 10);
  const qa = [...qaRev, ...freshQA(d, 20 - qaRev.length, new Set(qaRev))];
  const used = new Set(), out = { qa, rv: qaRev };
  const seen = id => P[id + "z"] || P[id + "i"] || done.has(id + "z") || done.has(id + "i");   // 互译：哪个方向做过都算
  const ord = dir => (a, b) => b.zt - a.zt || hashStr(a.id + d + dir) - hashStr(b.id + d + dir);
  const core = DT.filter(x => x.src === 0 && !seen(x.id)).sort(ord(""));
  const need = left ? Math.min(core.length, Math.ceil(core.length / left), 20) : 0;   // 前几天没做也最多一天 20 句
  const share = { z: Math.ceil(need / 2), i: Math.floor(need / 2) };
  for (const dir of ["z", "i"]) {
    const rev = dueOf(DT.map(x => x.id + dir), d, Math.min(3, 10 - share[dir])).map(x => x.slice(0, -1));
    rev.forEach(x => used.add(x));
    const mine = core.filter(x => !used.has(x.id)).slice(0, share[dir]).map(x => x.id);
    mine.forEach(x => used.add(x));
    const n = Math.max(0, 10 - rev.length - mine.length);
    const ok = x => !seen(x.id) && !used.has(x.id);
    const fill = left
      ? DT.filter(x => x.src !== 0 && ok(x)).sort((a, b) => (a.src === 2 ? 0 : 1) - (b.src === 2 ? 0 : 1) || ord(dir)(a, b)).slice(0, n).map(x => x.id)
      : [...DT.filter(x => x.src < 2 && !P[x.id + dir] && !done.has(x.id + dir) && !used.has(x.id)).sort((a, b) => a.src - b.src || ord(dir)(a, b)).slice(0, n - 2),
         ...DT.filter(x => x.src === 2 && ok(x)).sort(ord(dir)).slice(0, 2)].map(x => x.id);
    fill.forEach(x => used.add(x));
    out[dir] = [...rev, ...mine, ...fill];
    out.rv = out.rv.concat(rev.map(x => x + dir));
  }
  return out;
}
