", "a": "Berenang, berolahraga, dan memasak.", "qa": "763d9a5e9979", "aa": "55d349f7f244"}, {"q": "Kegiatan apa yang disukai Sarah?", "a": "Bermain badminton.", "qa": "3129ac18de9f", "aa": "5e488b8f86ea"}, {"q": "Kegiatan apa yang kurang disukai Sarah?", "a": "Joging.", "qa": "0fe1685a3046", "aa": "7f0b27f8aaa5"}, {"q": "Kegiatan apa yang tidak disukai Sarah?", "a": "Tidur atau diam di rumah pada akhir pekan.", "qa": "79dccdedb1fd", "aa": "fc1914c68141"}, {"q": "Kegiatan apa yang lebih disukai Sarah?", "a": "Berolahraga dan memasak.", "qa": "44c16e679091", "aa": "b491f0e23a5b"}]}, {"id": "t68", "kind": "text", "book": "BIPA 1", "title": "我的爱好（课文 7）", "lines": [{"sp": "", "role": "r", "id": "Hobi saya memasak.", "zh": "", "a": "be52d6da38b3"}, {"sp": "", "role": "r", "id": "Saya sangat suka memasak aneka hidangan.", "zh": "", "a": "b3f9456ba0d9"}, {"sp": "", "role": "r", "id": "Setiap hari saya menghabiskan banyak waktu di dapur.", "zh": "", "a": "3cc60ff37149"}, {"sp": "", "role": "r", "id": "Masakan kesukaan saya adalah rendang.", "zh": "", "a": "57a025a5fdca"}, {"sp": "", "role": "r", "id": "Saya juga suka memasak gorengan dan panggangan.", "zh": "", "a": "2e0274179c18"}, {"sp": "", "role": "r", "id": "Selain hobi masak, saya juga hobi mengoleksi peralatan masak.", "zh": "", "a": "793eca899fd5"}, {"sp": "", "role": "r", "id": "Saya senang jika peralatan masak saya lengkap.", "zh": "", "a": "0ac741ad8115"}, {"sp": "", "role": "r", "id": "Saya punya kompor, wajan, dan panci.", "zh": "", "a": "26ca21199549"}, {"sp": "", "role": "r", "id": "Saya juga punya spatula, pisau, dan talenan.", "zh": "", "a": "174b716df46d"}, {"sp": "", "role": "r", "id": "Jadi, saya bisa masak apa saja dengan alat lengkap.", "zh": "", "a": "dfbdafe5828b"}], "zh": "我的爱好是做饭，我非常喜欢做各种菜，每天都在厨房待很久。我最爱的菜是仁当，也喜欢做油炸和烤制的食物。除了做饭，我还喜欢收集厨具，厨具齐全我就很开心。我有炉灶、炒锅和汤锅，还有锅铲、刀和切菜板。所以，有了齐全的工具，我什么菜都能做。", "note": "", "qa": [{"q": "Apa kegemaran Septi?", "a": "Memasak dan mengoleksi peralatan masak.", "qa": "14227b4db42e", "aa": "8fe99d2da06e"}, {"q": "Septi sangat suka memasak apa?", "a": "Rendang.", "qa": "810117e2c141", "aa": "da6066d061a6"}, {"q": "Apa saja perlengkapan memasaknya?", "a": "Kompor, wajan, panci, spatula, pisau, dan talenan.", "qa": "160692ea0367", "aa": "ed99c160530d"}, {"q": "Mengapa peralatan memasaknya lengkap?", "a": "Supaya dia bisa masak apa saja.", "qa": "afcfc8748d75", "aa": "0ac02d4269a4"}]}, {"id": "t69", "kind": "text", "book": "BIPA 1", "title": "我的新朋友 Sarah（音频 8.1）", "lines": [{"sp": "", "role": "r", "id": "Saya punya teman baru.", "zh": "", "a": "f8f60be05097"}, {"sp": "", "role": "r", "id": "Namanya Sarah.", "zh": "", "a": "e7e530778d89"}, {"sp": "", "role": "r", "id": "Sarah berasal dari Inggris.", "zh": "", "a": "b6a5b9e7a1fe"}, {"sp": "", "role": "r", "id": "Dia baik, ramah, dan suka menolong.", "zh": "", "a": "757ad3eacb56"}, {"sp": "", "role": "r", "id": "Dia selalu menyapa kami.", "zh": "", "a": "24bfb375d4eb"}, {"sp": "", "role": "r", "id": "Di kelas dia juga suka membantu temannya belajar.", "zh": "", "a": "68f6331eb390"}, {"sp": "", "role": "r", "id": "Namun, Sarah agak cerewet.", "zh": "", "a": "d6548fe40e13"}, {"sp": "", "role": "r", "id": "Di pesta ulang tahunnya Sarah menelepon semua orang agar datang tepat waktu.", "zh": "", "a": "9b80cc1c8a68"}, {"sp": "", "role": "r", "id": "Dia juga perfeksionis.", "zh": "", "a": "8e32f22ddd32"}, {"sp": "", "role": "r", "id": "Dia mengatur sendiri dekorasi, makanan, dan minuman.", "zh": "", "a": "47f5a3137c56"}, {"sp": "", "role": "r", "id": "Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "", "a": "25fb6b989a7c"}], "zh": "我有一个新朋友，叫 Sarah，来自英国。她人很好，友善又乐于助人，总是主动跟我们打招呼，在课堂上也喜欢帮同学学习。不过 Sarah 有点爱操心：她的生日派对，她给每个人打电话让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排，希望活动完美、不出任何差错。", "note": "", "qa": [{"q": "Sarah berasal dari mana?", "a": "Dari Inggris.", "qa": "df1210a9937d", "aa": "5f58e3c933a8"}, {"q": "Bagaimana sifat Sarah?", "a": "Baik, ramah, suka menolong, agak cerewet, dan perfeksionis.", "qa": "794b03353972", "aa": "6e1e979ecefd"}]}, {"id": "t70", "kind": "text", "book": "BIPA 1", "title": "Beni 和 Toni（音频 8.2）", "lines": [{"sp": "", "role": "r", "id": "Beni adalah temanku.", "zh": "", "a": "59913a1f54d0"}, {"sp": "", "role": "r", "id": "Dia sangat pendiam.", "zh": "", "a": "3d21b8fb4e4e"}, {"sp": "", "role": "r", "id": "Dia suka menyendiri di kantor.", "zh": "", "a": "8d1882829232"}, {"sp": "", "role": "r", "id": "Dia jarang menyapa orang lain.", "zh": "", "a": "e423dbc9acd1"}, {"sp": "", "role": "r", "id": "Dia juga jarang berkumpul dengan teman-teman lain.", "zh": "", "a": "ff1295162c0a"}, {"sp": "", "role": "r", "id": "Dia punya teman dekat.", "zh": "", "a": "1c58311ac4de"}, {"sp": "", "role": "r", "id": "Namanya Toni.", "zh": "", "a": "e1f97964bbc9"}, {"sp": "", "role": "r", "id": "Toni berbeda dengan Beni.", "zh": "", "a": "3a2835042e17"}, {"sp": "", "role": "r", "id": "Toni sangat periang.", "zh": "", "a": "f09f2ee207ca"}, {"sp": "", "role": "r", "id": "Toni selalu ramah kepada siapa pun.", "zh": "", "a": "458b17fee935"}, {"sp": "", "role": "r", "id": "Toni sangat sabar menghadapi Beni.", "zh": "", "a": "19cc15711699"}, {"sp": "", "role": "r", "id": "Namun, Toni agak pemarah.", "zh": "", "a": "1dba0eed9d27"}, {"sp": "", "role": "r", "id": "Dia sangat perfeksionis.", "zh": "", "a": "156c64f8b207"}, {"sp": "", "role": "r", "id": "Dia akan marah melihat orang malas.", "zh": "", "a": "a51e484ce082"}], "zh": "Beni 是我的朋友。他非常沉默，在办公室喜欢独处，很少跟别人打招呼，也很少和其他朋友聚在一起。他有一个好朋友叫 Toni。Toni 和 Beni 不一样，Toni 很开朗，对谁都很友好，对 Beni 也很有耐心。不过 Toni 有点爱发火，他是个完美主义者，看到别人偷懒就会生气。", "note": "", "qa": [{"q": "Bagaimana sifat Beni?", "a": "Sangat pendiam dan suka menyendiri.", "qa": "541a105b673d", "aa": "2af365e3648d"}, {"q": "Apa contoh sifat buruk Beni?", "a": "Jarang menyapa orang lain dan jarang berkumpul dengan teman.", "qa": "74d1a5486b74", "aa": "870b02bcce78"}, {"q": "Bagaimana sifat Toni?", "a": "Periang, ramah, sabar, tetapi agak pemarah dan perfeksionis.", "qa": "59a2d79a0bf7", "aa": "c3da5ecefc39"}, {"q": "Apa contoh sifat baik Toni?", "a": "Selalu ramah kepada siapa pun dan sabar menghadapi Beni.", "qa": "e8511e3e2f4f", "aa": "eb8e76cdafa2"}, {"q": "Kira-kira di mana mereka saling mengenal?", "a": "Di kantor.", "qa": "ee8a21c3887a", "aa": "abe3099bb3fd"}]}, {"id": "t71", "kind": "text", "book": "BIPA 1", "title": "Fauzi 的性格（课文 8.1）", "lines": [{"sp": "", "role": "r", "id": "Fauzi adalah orang yang teratur.", "zh": "", "a": "03e9da21649e"}, {"sp": "", "role": "r", "id": "Dia tidak pintar, tetapi tekun.", "zh": "", "a": "3b9de7ef70a6"}, {"sp": "", "role": "r", "id": "Dia bukan pemalas.", "zh": "", "a": "0418c81b7158"}, {"sp": "", "role": "r", "id": "Dia juga rajin merapikan lemari pakaiannya.", "zh": "", "a": "7cf26ef2c2d5"}, {"sp": "", "role": "r", "id": "Dia tidak tidur jika tugas belum selesai.", "zh": "", "a": "1f60f46174a9"}, {"sp": "", "role": "r", "id": "Semua orang tahu hal itu.", "zh": "", "a": "aabc5fc526ed"}, {"sp": "", "role": "r", "id": "Di kantor dia sangat rajin.", "zh": "", "a": "30ca62a16e89"}, {"sp": "", "role": "r", "id": "Setiap bekerja bersama Fauzi, ia akan mengerjakan semua pekerjaan sendirian.", "zh": "", "a": "e4dee6242102"}, {"sp": "", "role": "r", "id": "Namun, ia bermaksud baik.", "zh": "", "a": "2c6f77823ce2"}, {"sp": "", "role": "r", "id": "Dia ingin membantu temannya.", "zh": "", "a": "2fda9664cd9a"}, {"sp": "", "role": "r", "id": "Rekan kantornya senang berteman dengan Fauzi.", "zh": "", "a": "e1300c1db2af"}], "zh": "Fauzi 是个有条理的人。他不聪明，但很勤勉，他不是懒人。他也经常整理自己的衣柜。作业没做完他就不睡觉。大家都知道这一点。在办公室他非常勤奋，每次和 Fauzi 一起工作，他都会一个人把所有活儿干完。不过他是出于好意，他想帮助朋友。办公室的同事都很乐意和 Fauzi 交朋友。", "note": "", "qa": []}, {"id": "t72", "kind": "text", "book": "BIPA 1", "title": "我的同事们（课文 8.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Yoyo.", "zh": "", "a": "4f2eba8aa2c8"}, {"sp": "", "role": "r", "id": "Saya sedang berada di kantor.", "zh": "", "a": "f1d226c8e853"}, {"sp": "", "role": "r", "id": "Saat ini di kantor ada Datil, Doni, Didik, dan Fadil.", "zh": "", "a": "e658894f5506"}, {"sp": "", "role": "r", "id": "Datil baik hati dan tenang.", "zh": "", "a": "8aa96ffe8ba0"}, {"sp": "", "role": "r", "id": "Doni rajin dan cekatan.", "zh": "", "a": "8d6ff1ab7c91"}, {"sp": "", "role": "r", "id": "Didik pendiam, tetapi ramah.", "zh": "", "a": "eca220fca42f"}, {"sp": "", "role": "r", "id": "Fadil periang dan lucu.", "zh": "", "a": "1c12f9994da7"}, {"sp": "", "role": "r", "id": "Beberapa teman lain tidak ada di kantor.", "zh": "", "a": "11f0acdb8ded"}, {"sp": "", "role": "r", "id": "Sebenarnya, ada Laras, Ayu, Putri, dan Roslia.", "zh": "", "a": "6de804521489"}, {"sp": "", "role": "r", "id": "Laras cerdas dan perfeksionis.", "zh": "", "a": "3f879e5455b0"}, {"sp": "", "role": "r", "id": "Ayu sabar dan pintar.", "zh": "", "a": "ab4b10b660d6"}, {"sp": "", "role": "r", "id": "Putri perhatian dan cekatan.", "zh": "", "a": "7c3f9f4b0a05"}, {"sp": "", "role": "r", "id": "Roslia tekun dan tegas.", "zh": "", "a": "67b965d6897b"}], "zh": "嗨，我叫 Yoyo，我现在在办公室。现在办公室里有 Datil、Doni、Didik 和 Fadil。Datil 心地好又沉稳，Doni 勤奋又麻利，Didik 话少但友好，Fadil 开朗又风趣。还有几位同事不在办公室，她们是 Laras、Ayu、Putri 和 Roslia。Laras 聪明，是完美主义者；Ayu 耐心又聪明；Putri 体贴又麻利；Roslia 勤勉又果断。", "note": "", "qa": [{"q": "Apa ide utama paragraf 1?", "a": "Teman-teman Yoyo yang ada di kantor dan sifat mereka.", "qa": "57cdcb3d085d", "aa": "6ab95b69e33b"}, {"q": "Apa ide utama paragraf 2?", "a": "Teman-teman Yoyo yang tidak ada di kantor dan sifat mereka.", "qa": "26f4ec97759c", "aa": "38a26cfe6d64"}, {"q": "Ada berapa orang teman Yoyo di kantor?", "a": "Ada empat orang: Datil, Doni, Didik, dan Fadil.", "qa": "52b11c108b2a", "aa": "9eac4764b5a2"}, {"q": "Bagaimana sifat Laras dan Roslia?", "a": "Laras cerdas dan perfeksionis; Roslia tekun dan tegas.", "qa": "61f0fcbcbdae", "aa": "6c75da5cd31d"}, {"q": "Bagaimana sifat Fadil dan Didik?", "a": "Fadil periang dan lucu; Didik pendiam tetapi ramah.", "qa": "af546e8bced1", "aa": "e5ac226d619a"}]}, {"id": "t73", "kind": "text", "book": "BIPA 1", "title": "Santi 的卧室（音频 9.1）", "lines": [{"sp": "", "role": "r", "id": "Ini gambar kamar tidur saya.", "zh": "", "a": "ac73c582ebe5"}, {"sp": "", "role": "r", "id": "Di kamar saya ada banyak benda.", "zh": "", "a": "3747fcb6654f"}, {"sp": "", "role": "r", "id": "Di samping pintu kamar ada lampu.", "zh": "", "a": "50688b5c85e9"}, {"sp": "", "role": "r", "id": "Di dekat lampu ada televisi.", "zh": "", "a": "c1bac7b3c494"}, {"sp": "", "role": "r", "id": "Di seberang televisi ada tempat tidur.", "zh": "", "a": "8c3f3a7051cb"}, {"sp": "", "role": "r", "id": "Tempat tidur saya berada di tengah kamar.", "zh": "", "a": "0d9f1d6183d7"}, {"sp": "", "role": "r", "id": "Karpet ada di antara kasur dan televisi.", "zh": "", "a": "abd816c10105"}, {"sp": "", "role": "r", "id": "Lemari ada di pojok kamar.", "zh": "", "a": "02f7d8887e7f"}, {"sp": "", "role": "r", "id": "Di dalam lemari ada baju saya.", "zh": "", "a": "d29d6a44b8d6"}, {"sp": "", "role": "r", "id": "Di samping kanan dan kiri tempat tidur saya ada meja kecil.", "zh": "", "a": "e493439d8ac7"}, {"sp": "", "role": "r", "id": "Radio ada di atas meja kecil.", "zh": "", "a": "b9dfe9af5234"}, {"sp": "", "role": "r", "id": "Ada sofa kecil di bawah AC.", "zh": "", "a": "cc6b83000893"}], "zh": "这是我卧室的图。我的房间里有很多东西。房门旁边有一盏灯，灯旁边有一台电视，电视对面是床。我的床在房间中央。地毯在床和电视之间。衣柜在房间的角落，衣柜里是我的衣服。床的左右两边各有一张小桌子，收音机放在小桌子上。空调下面有一张小沙发。", "note": "", "qa": [{"q": "Di mana letak lemari?", "a": "Di pojok kamar.", "qa": "09d26c66918f", "aa": "97581e45e68a"}, {"q": "Ada benda apa di sebelah kiri dan kanan tempat tidur?", "a": "Meja kecil.", "qa": "56ed1f3519e0", "aa": "171db4b0d240"}, {"q": "Ada benda apa di atas meja kecil?", "a": "Radio.", "qa": "6f262e220d47", "aa": "df2b38d528de"}, {"q": "Di mana letak karpet?", "a": "Di antara kasur dan televisi.", "qa": "f6cdde24b421", "aa": "1f7bbca0072e"}, {"q": "Lampu ada di sebelah mana?", "a": "Di samping pintu kamar.", "qa": "e5ac08bfec05", "aa": "16e6104772aa"}]}, {"id": "t74", "kind": "text", "book": "BIPA 1", "title": "去参加婚礼（音频 9.2）", "lines": [{"sp": "", "role": "r", "id": "Teman saya, Wina, menikah hari Sabtu lalu.", "zh": "", "a": "27e1db50fd05"}, {"sp": "", "role": "r", "id": "Saya pergi ke gedung pernikahannya.", "zh": "", "a": "dfdf34bdc17a"}, {"sp": "", "role": "r", "id": "Saya berangkat dari Gerung.", "zh": "", "a": "19757e38d2bc"}, {"sp": "", "role": "r", "id": "Dari Gerung saya ke Barat sampai bertemu pertigaan.", "zh": "", "a": "4968951112f4"}, {"sp": "", "role": "r", "id": "Di ujung pertigaan ada Balai Desa Sekotong.", "zh": "", "a": "255e18ffc804"}, {"sp": "", "role": "r", "id": "Dari Balai Desa Sekotong, saya ke arah Selatan.", "zh": "", "a": "d5125f05fc67"}, {"sp": "", "role": "r", "id": "Saya melewati SD Sekotong II di kanan jalan.", "zh": "", "a": "496419ea486b"}, {"sp": "", "role": "r", "id": "Saya belok kanan masuk ke gang yang ada di antara SD Sekotong II dan sawah.", "zh": "", "a": "42d53e020471"}, {"sp": "", "role": "r", "id": "Di pertigaan kedua saya belok kanan.", "zh": "", "a": "777c0265ea1c"}, {"sp": "", "role": "r", "id": "Gedung pernikahan tepat berada di ujung jalan, menghadap ke Selatan.", "zh": "", "a": "06e8f973575d"}], "zh": "我的朋友 Wina 上周六结婚了，我去了她的婚礼礼堂。我从 Gerung 出发，往西走到一个三岔路口，路口尽头是 Sekotong 村委会。从村委会我往南走，经过路右边的 Sekotong 第二小学。我右转进入 Sekotong 第二小学和稻田之间的小巷，在第二个三岔路口再右转。婚礼礼堂就在路的尽头，朝南。", "note": "", "qa": []}, {"id": "t75", "kind": "text", "book": "BIPA 1", "title": "楠榜游记（课文 9.1）", "lines": [{"sp": "", "role": "r", "id": "Pada akhir tahun lalu saya berkunjung ke Lampung.", "zh": "", "a": "cdb7250dbf01"}, {"sp": "", "role": "r", "id": "Kami berjalan-jalan ke beberapa tempat di Lampung.", "zh": "", "a": "15957e34c0a7"}, {"sp": "", "role": "r", "id": "Di sana ada mal, universitas, dan tempat makan.", "zh": "", "a": "393b01044fcf"}, {"sp": "", "role": "r", "id": "Kami memulai perjalanan dari pompa bensin.", "zh": "", "a": "bfce17147ede"}, {"sp": "", "role": "r", "id": "Di sebelah kiri pompa bensin ada sebuah universitas.", "zh": "", "a": "868d540641fe"}, {"sp": "", "role": "r", "id": "Kampusnya besar sekali.", "zh": "", "a": "2018ee1f0a9a"}, {"sp": "", "role": "r", "id": "Di seberang pompa bensin ada beberapa universitas lain.", "zh": "", "a": "07f75ba6b402"}, {"sp": "", "role": "r", "id": "Ada IBI Darmajaya, Universitas Bandar Lampung, dan IAIN Lampung.", "zh": "", "a": "9ea370d4c4f4"}, {"sp": "", "role": "r", "id": "Setelah mengisi bensin, saya dan keluarga pergi makan di Restoran Padang.", "zh": "", "a": "31902fbf903f"}, {"sp": "", "role": "r", "id": "Restoran itu ada di antara Warung Gudeg Jogja dan Warung Penyet Idola.", "zh": "", "a": "dba0f5641948"}, {"sp": "", "role": "r", "id": "Di seberang restoran ada toko kelontong.", "zh": "", "a": "81a9852d5f84"}, {"sp": "", "role": "r", "id": "Selesai makan, kami pergi ke mal.", "zh": "", "a": "f43c8627c137"}, {"sp": "", "role": "r", "id": "Mal itu terletak di persimpangan jalan ke arah Way Halim.", "zh": "", "a": "529a0f1b6110"}, {"sp": "", "role": "r", "id": "Dari mal kami pergi ke rumah saudara.", "zh": "", "a": "eda6acaa90a4"}, {"sp": "", "role": "r", "id": "Rumahnya ada di belakang Warung Gudeg Jogja.", "zh": "", "a": "c8685f327df6"}], "zh": "去年年底我去了楠榜，我们在楠榜逛了几个地方，那里有商场、大学和餐馆。我们从加油站出发。加油站左边有一所大学，校园非常大；加油站对面还有几所大学：IBI Darmajaya、楠榜港大学和楠榜国立伊斯兰学院。加完油后，我和家人去巴东餐馆吃饭，那家餐馆在日惹菠萝蜜炖菜馆和 Idola 压扁炸鸡馆之间，餐馆对面有一家杂货店。吃完饭我们去了商场，商场位于通往 Way Halim 方向的路口。离开商场后我们去了亲戚家，他们家在日惹菠萝蜜炖菜馆后面。", "note": "", "qa": [{"q": "Apa topik Teks 9.1?", "a": "Jalan-jalan di Bandar Lampung.", "qa": "edd4463334e5", "aa": "9983b02633fa"}, {"q": "Ada tempat apa saja di Kota Bandar Lampung?", "a": "Mal, universitas, dan tempat makan.", "qa": "be94e534312b", "aa": "f091bd5b1ec5"}, {"q": "Di mana letak universitas yang besar?", "a": "Di sebelah kiri pompa bensin.", "qa": "0647a48dc829", "aa": "dd0706976150"}, {"q": "Restoran Padang berada di antara apa?", "a": "Di antara Warung Gudeg Jogja dan Warung Penyet Idola.", "qa": "946b89910ece", "aa": "6d7bdf777f2f"}]}, {"id": "t76", "kind": "text", "book": "BIPA 1", "title": "Sari 的新教室（课文 9.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Sari.", "zh": "", "a": "e373352c6383"}, {"sp": "", "role": "r", "id": "Hari ini saya masuk kelas baru.", "zh": "", "a": "b076de40d1a6"}, {"sp": "", "role": "r", "id": "Ada papan tulis besar di dalam kelas.", "zh": "", "a": "54312b5aa970"}, {"sp": "", "role": "r", "id": "Spidol dan penghapus ada di bawah papan tulis.", "zh": "", "a": "5357510bdb09"}, {"sp": "", "role": "r", "id": "Di sebelah kiri papan tulis ada lemari.", "zh": "", "a": "40860f74f86a"}, {"sp": "", "role": "r", "id": "Di dalam lemari ada banyak buku.", "zh": "", "a": "018bf2512df4"}, {"sp": "", "role": "r", "id": "Meja dan kursi Bu Sinta ada di depan lemari.", "zh": "", "a": "d538f92d3853"}, {"sp": "", "role": "r", "id": "Di seberang meja Bu Sinta ada meja dan kursi saya.", "zh": "", "a": "c001bcfdb455"}, {"sp": "", "role": "r", "id": "Tempat duduk saya berhadapan dengan tempat duduk Bu Sinta.", "zh": "", "a": "d763dd848c15"}, {"sp": "", "role": "r", "id": "Di sebelah kanan saya ada banyak bangku dan meja.", "zh": "", "a": "7926e3e6cd60"}, {"sp": "", "role": "r", "id": "Pintu ada di sisi kanan ruang kelas.", "zh": "", "a": "58b3c21de13d"}, {"sp": "", "role": "r", "id": "Peta ada di antara gambar pahlawan dan jam dinding.", "zh": "", "a": "d9a41b71d1f1"}, {"sp": "", "role": "r", "id": "Siswa di sebelahku bernama Anton.", "zh": "", "a": "0468b69d6e7c"}, {"sp": "", "role": "r", "id": "Di belakang Anton ada Novi dan Putri.", "zh": "", "a": "d7167f3c3b77"}], "zh": "大家好，我叫 Sari，今天我进了新班级。教室里有一块大黑板，马克笔和板擦在黑板下面。黑板左边有一个柜子，柜子里有很多书。Sinta 老师的桌椅在柜子前面，老师桌子对面是我的桌椅，我的座位正对着老师的座位。我右边有很多长凳和桌子。门在教室右侧。地图挂在英雄像和挂钟之间。坐我旁边的同学叫 Anton，Anton 后面是 Novi 和 Putri。", "note": "", "qa": []}, {"id": "t77", "kind": "text", "book": "BIPA 1", "title": "Mila 的家（音频 10.1）", "lines": [{"sp": "", "role": "r", "id": "Rumah Mila sangat bagus.", "zh": "", "a": "f2153c7e8b60"}, {"sp": "", "role": "r", "id": "Ukurannya tidak terlalu besar.", "zh": "", "a": "f76bc2da7deb"}, {"sp": "", "role": "r", "id": "Di depan rumah ada tempat parkir mobil.", "zh": "", "a": "481fec63f1b8"}, {"sp": "", "role": "r", "id": "Rumahnya bercat hijau dan putih.", "zh": "", "a": "3e1f2b26cbdc"}, {"sp": "", "role": "r", "id": "Genting rumahnya berwarna abu-abu.", "zh": "", "a": "446e6ed3a6a3"}, {"sp": "", "role": "r", "id": "Rumahnya ber-AC.", "zh": "", "a": "ce175d696cb8"}, {"sp": "", "role": "r", "id": "Di depan rumah ada lahan untuk menanam tanaman.", "zh": "", "a": "bef589458ae8"}, {"sp": "", "role": "r", "id": "Pintunya berwarna cokelat tua.", "zh": "", "a": "d59da16e6183"}], "zh": "Mila 的家很漂亮，不算太大。房子前面有停车位，房子刷成绿白两色，屋顶瓦片是灰色的，屋里有空调。房子前面有一块种植物的空地，门是深棕色的。", "note": "背景：Meli 去了 Mila 在勿加泗（Bekasi）的家，然后讲给朋友 Ben 听。", "qa": []}, {"id": "t78", "kind": "text", "book": "BIPA 1", "title": "Meli 要带的东西（音频 10.2）", "lines": [{"sp": "", "role": "r", "id": "Besok saya akan merantau ke Jakarta untuk bekerja.", "zh": "", "a": "8f044bb06b6a"}, {"sp": "", "role": "r", "id": "Saya akan membawa banyak barang.", "zh": "", "a": "b342f4f9fcc9"}, {"sp": "", "role": "r", "id": "Namun, beberapa barang tidak saya bawa.", "zh": "", "a": "9444d8746dc5"}, {"sp": "", "role": "r", "id": "Saya akan membawa sepatu pantofel hitam, kaus kaki cokelat, rok berwarna hitam, dan kemeja putih.", "zh": "", "a": "7b06d2d0fedf"}, {"sp": "", "role": "r", "id": "Saya juga perlu membawa blazer ungu dan jaket merah.", "zh": "", "a": "9c7620e13792"}, {"sp": "", "role": "r", "id": "Saya juga membawa jam tangan berwarna biru dan gelang berwarna merah.", "zh": "", "a": "fa70e980e750"}, {"sp": "", "role": "r", "id": "Saya tidak membawa topi, baju olahraga, celana panjang, dan syal.", "zh": "", "a": "0ca3335e51e4"}, {"sp": "", "role": "r", "id": "Saya juga tidak membawa boneka kesayangan saya.", "zh": "", "a": "842003066f76"}, {"sp": "", "role": "r", "id": "Saya tidak membawa semua barang.", "zh": "", "a": "fe5e73699965"}], "zh": "明天我要去雅加达打拼工作，我会带很多东西，不过有些东西我不带。我会带黑色皮鞋、棕色袜子、黑色裙子和白衬衫，还要带紫色西装外套和红色夹克，还有蓝色手表和红色手链。我不带帽子、运动服、长裤和围巾，也不带我心爱的玩偶。我不会把所有东西都带上。", "note": "", "qa": [{"q": "Barang apa saja yang dibawa Meli?", "a": "Sepatu pantofel, kaus kaki, rok, kemeja putih, blazer, jaket, jam tangan, dan gelang.", "qa": "c6526a730c7a", "aa": "f5ea2b523d05"}, {"q": "Barang apa yang tidak dibawa Meli?", "a": "Topi, baju olahraga, celana panjang, syal, dan boneka.", "qa": "ed4ebb06e1f2", "aa": "815938509134"}]}, {"id": "t79", "kind": "text", "book": "BIPA 1", "title": "出租屋广告（课文 10.1）", "lines": [{"sp": "", "role": "r", "id": "Hunian Sewa Eksklusif di Jakarta Selatan.", "zh": "", "a": "df8ffffbfb0a"}, {"sp": "", "role": "r", "id": "Lingkungan nyaman dengan fasilitas lengkap.", "zh": "", "a": "009fe48fb7e5"}, {"sp": "", "role": "r", "id": "Dekat dengan Kawasan Bisnis TB Simatupang.", "zh": "", "a": "5572f92209b0"}, {"sp": "", "role": "r", "id": "Cocok untuk corporate housing dan keluarga muda.", "zh": "", "a": "9caa298d6d82"}, {"sp": "", "role": "r", "id": "— Hunian 2 lantai dengan ruang makan + duduk, kamar tidur, dapur, dan kamar mandi.", "zh": "", "a": "b0d0f1f1d218"}, {"sp": "", "role": "r", "id": "Fully furnished; termasuk AC, double bed, 1 set meja makan kayu, kompor, dispenser, dll.", "zh": "", "a": "d12fde89da6f"}, {"sp": "", "role": "r", "id": "Akses internet.", "zh": "", "a": "fe67dd9efc09"}, {"sp": "", "role": "r", "id": "Laundry service.", "zh": "", "a": "38c17bcaf24e"}, {"sp": "", "role": "r", "id": "Cleaning service.", "zh": "", "a": "f846cfd87c5d"}, {"sp": "", "role": "r", "id": "Penjaga keamanan 24 jam.", "zh": "", "a": "0c887306f38c"}, {"sp": "", "role": "r", "id": "Parkir motor dan mobil.", "zh": "", "a": "7cad256149ff"}, {"sp": "", "role": "r", "id": "— Ketentuan harga: 1 kamar (45 m², 12 unit): Rp1.750.000/bulan.", "zh": "", "a": "f17bf6420660"}, {"sp": "", "role": "r", "id": "2 kamar (56 m², 2 unit): Rp2.200.000/bulan.", "zh": "", "a": "dfb8f3c8832a"}, {"sp": "", "role": "r", "id": "Minimal sewa 3 bulan (deposit 1 bulan).", "zh": "", "a": "89b053354a70"}, {"sp": "", "role": "r", "id": "— GRIYA SELARAS BENDA.", "zh": "", "a": "b81f10bb0852"}, {"sp": "", "role": "r", "id": "Lokasi: Jl.", "zh": "", "a": "d03099c170a5"}, {"sp": "", "role": "r", "id": "Makmur Ceria RT 03/RW 010, Ciganjur, Jagakarsa, Jakarta 12630.", "zh": "", "a": "273f0f318a49"}], "zh": "南雅加达高档出租公寓。环境舒适，设施齐全，靠近 TB Simatupang 商务区，适合企业员工宿舍和年轻家庭。——两层住宅，含餐厅兼客厅、卧室、厨房和浴室。全套家具：空调、双人床、一套木制餐桌、炉灶、饮水机等。有网络、洗衣服务、保洁服务、24 小时保安，可停摩托车和汽车。——价格：一室（45 平方米，共 12 套）每月 175 万盾；两室（56 平方米，共 2 套）每月 220 万盾。最短租期 3 个月（押金 1 个月）。——Griya Selaras Benda，地址：Jagakarsa 区 Ciganjur，Makmur Ceria 路 RT 03/RW 010，雅加达 12630。", "note": "原书为广告图片，已转成文字。", "qa": [{"q": "Kos itu bernama apa?", "a": "Griya Selaras.", "qa": "6261c943389a", "aa": "db18c4d98897"}, {"q": "Kos itu dekat dengan apa?", "a": "Dekat dengan Kawasan Bisnis TB Simatupang.", "qa": "0efcab857b10", "aa": "5572f92209b0"}, {"q": "Kos itu berlokasi di jalan apa?", "a": "Jalan Makmur Ceria.", "qa": "73f59b675e10", "aa": "6d49adc95c38"}, {"q": "Berapa lama minimal sewa di sana?", "a": "Tiga bulan.", "qa": "c204e156152b", "aa": "581661e3fd32"}, {"q": "Berapa biaya sewa dua kamar per tahun?", "a": "Rp26.400.000,00 (Rp2.200.000 × 12).", "qa": "a9f5aac96e39", "aa": "fdce31ac7960"}]}, {"id": "t80", "kind": "text", "book": "BIPA 1", "title": "Meli 的出租屋（课文 10.2）", "lines": [{"sp": "", "role": "r", "id": "Rumah indekos Meli besar dan cantik.", "zh": "", "a": "4ea94f288a62"}, {"sp": "", "role": "r", "id": "Di sana ada sepuluh kamar tidur.", "zh": "", "a": "c75ecfedddbd"}, {"sp": "", "role": "r", "id": "Satu kamar tidur berkamar mandi satu.", "zh": "", "a": "3ec715df39dd"}, {"sp": "", "role": "r", "id": "Rumah indekosnya bercat warna-warni.", "zh": "", "a": "93a51d1f9de2"}, {"sp": "", "role": "r", "id": "Ada warna putih, biru, hitam, merah, dan abu-abu.", "zh": "", "a": "76a6e783af87"}, {"sp": "", "role": "r", "id": "Rumahnya berbentuk persegi panjang.", "zh": "", "a": "06fd5a074753"}, {"sp": "", "role": "r", "id": "Di sisi kiri dan kanan rumahnya ada pohon tinggi berdaun hijau.", "zh": "", "a": "dcdec5e9ae5b"}, {"sp": "", "role": "r", "id": "Ada juga bunga berwarna merah muda dan ungu.", "zh": "", "a": "7235eb79a1d4"}, {"sp": "", "role": "r", "id": "Di belakang rumah indekos Meli ada taman.", "zh": "", "a": "da455e47124f"}, {"sp": "", "role": "r", "id": "Taman itu ada kolam ikannya.", "zh": "", "a": "d6e5fc2ff37e"}, {"sp": "", "role": "r", "id": "Ada ikan yang berwarna hitam dan emas.", "zh": "", "a": "e78b2e8204a4"}, {"sp": "", "role": "r", "id": "Di taman juga ada bangku panjang berwarna hitam.", "zh": "", "a": "3f07882886f7"}, {"sp": "", "role": "r", "id": "Di depan bangku ada meja berbentuk bulat dan berwarna cokelat.", "zh": "", "a": "c35163de6881"}, {"sp": "", "role": "r", "id": "Di taman juga ada banyak batu besar berwarna abu-abu.", "zh": "", "a": "d81b28a4a1f1"}], "zh": "Meli 住的出租屋又大又漂亮，有十间卧室，每间卧室带一个浴室。出租屋刷得五颜六色：白、蓝、黑、红和灰。房子是长方形的，左右两边种着绿叶高树，还有粉色和紫色的花。出租屋后面有一个花园，花园里有个鱼池，池里有黑色和金色的鱼。花园里还有一张黑色长椅，长椅前面有一张棕色圆桌。花园里还有很多灰色的大石头。", "note": "", "qa": [{"q": "Ada berapa kamar tidur di sana?", "a": "Ada sepuluh kamar tidur.", "qa": "4981e0115bab", "aa": "5450bd5bcfc8"}, {"q": "Apa bentuk rumahnya?", "a": "Persegi panjang.", "qa": "df06d8f26fa4", "aa": "a852089c698d"}, {"q": "Ada apa di depan bangku?", "a": "Meja berbentuk bulat berwarna cokelat.", "qa": "4765bd389af0", "aa": "ab3db2cfb9c3"}, {"q": "Ada apa di taman?", "a": "Kolam ikan, bangku panjang, meja bulat, dan batu besar.", "qa": "25641a537bae", "aa": "958f5d56baa0"}, {"q": "Ada apa di sisi kiri dan kanan rumahnya?", "a": "Pohon tinggi berdaun hijau.", "qa": "810657f547d9", "aa": "c19c4f6188f5"}]}, {"id": "t81", "kind": "text", "book": "BIPA 2", "title": "吉他为什么最受欢迎（课文 1）", "lines": [{"sp": "", "role": "r", "id": "Gitar menjadi alat musik terfavorit di dunia, termasuk di Indonesia.", "zh": "", "a": "de09b52bc9c9"}, {"sp": "", "role": "r", "id": "Mengapa gitar menjadi favorit?", "zh": "", "a": "4758375b3d5b"}, {"sp": "", "role": "r", "id": "Alasannya adalah belajar gitar itu cukup mudah.", "zh": "", "a": "dab72c9ad1cd"}, {"sp": "", "role": "r", "id": "Hanya dengan mengenal kunci-kunci dasar seperti C, D, Dm, E, Em, F, A, dan Am, kita bisa memainkan beberapa lagu.", "zh": "", "a": "573c64b76033"}, {"sp": "", "role": "r", "id": "Kita juga bisa belajar gitar sendiri tanpa guru (otodidak).", "zh": "", "a": "626c6d36378f"}, {"sp": "", "role": "r", "id": "Belajar gitar secara otodidak dapat dilakukan melalui buku atau internet.", "zh": "", "a": "880b071f0642"}, {"sp": "", "role": "r", "id": "Kita juga dapat dengan mudah membeli gitar karena ada banyak penjual gitar di berbagai tempat.", "zh": "", "a": "e583501c5e56"}, {"sp": "", "role": "r", "id": "Saat kita mengunjungi toko musik, gitar adalah alat musik yang paling banyak dijual.", "zh": "", "a": "7cd5bb98bd5d"}, {"sp": "", "role": "r", "id": "Biasanya toko musik menjual berbagai jenis gitar.", "zh": "", "a": "06d055589bb4"}], "zh": "吉他是全世界最受欢迎的乐器，在印尼也一样。为什么吉他这么受欢迎？原因是学吉他比较容易。只要认识 C、D、Dm、E、Em、F、A、Am 这些基本和弦，就能弹好几首歌。我们还可以不用老师，自己学（自学）。自学吉他可以通过书或网络。买吉他也很容易，因为很多地方都有卖。去乐器店时，吉他是卖得最多的乐器，乐器店通常卖各种各样的吉他。", "note": "", "qa": [{"q": "Mengapa gitar bisa menjadi alat musik terfavorit?", "a": "Karena belajar gitar itu cukup mudah.", "qa": "bb76fc11fad9", "aa": "8b75f56395bc"}, {"q": "Apa saja kunci-kunci dasar untuk bermain gitar?", "a": "C, D, Dm, E, Em, F, A, dan Am.", "qa": "c806777a108c", "aa": "144072a63cb2"}, {"q": "Apa itu otodidak?", "a": "Belajar sendiri tanpa diajarkan orang lain.", "qa": "2dc1daeb3fef", "aa": "de1b4ad1e5c2"}, {"q": "Bagaimana cara belajar gitar secara otodidak?", "a": "Melalui buku atau internet.", "qa": "58e6819dc563", "aa": "f3a5cbf095be"}, {"q": "Mengapa kita bisa mudah membeli gitar?", "a": "Karena ada banyak penjual gitar di berbagai tempat.", "qa": "39cabfea47e9", "aa": "5ff2b669ec13"}]}, {"id": "t82", "kind": "text", "book": "BIPA 2", "title": "酒店前台 Siu（课文 2）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Siu.", "zh": "", "a": "072c34da0222"}, {"sp": "", "role": "r", "id": "Saya seorang resepsionis di sebuah hotel.", "zh": "", "a": "7e8204f62865"}, {"sp": "", "role": "r", "id": "Saya sudah 2 tahun bekerja di sini.", "zh": "", "a": "5957cdd1719c"}, {"sp": "", "role": "r", "id": "Saya bekerja 8 jam sehari.", "zh": "", "a": "eb3a1583c694"}, {"sp": "", "role": "r", "id": "Salah satu tugas saya adalah memeriksa pesanan kamar dari tamu hotel.", "zh": "", "a": "3948f23986cf"}, {"sp": "", "role": "r", "id": "Setelah pesanan kamar benar, saya memberikan kunci kamar kepada tamu hotel.", "zh": "", "a": "6b6bbf4cf5e5"}, {"sp": "", "role": "r", "id": "Setelah tamu hotel selesai menginap, saya menerima kembali kunci kamar dari tamu hotel.", "zh": "", "a": "ac2ca10a0640"}, {"sp": "", "role": "r", "id": "Pekerjaan saya cukup menyenangkan.", "zh": "", "a": "785953d78cba"}, {"sp": "", "role": "r", "id": "Saya bisa bertemu banyak orang baru.", "zh": "", "a": "1cc9ef0a5841"}], "zh": "我叫 Siu，是一家酒店的前台接待员，在这里工作两年了，每天工作八小时。我的一项职责是核对客人的订房。确认无误后，我把房间钥匙交给客人；客人退房后，我再把钥匙收回来。我的工作挺愉快的，可以认识很多新朋友。", "note": "", "qa": [{"q": "Sudah berapa lama Siu bekerja?", "a": "Siu sudah bekerja selama dua tahun.", "qa": "c7d6d29340c6", "aa": "8ef5ae423ece"}, {"q": "Apa pekerjaan Siu?", "a": "Resepsionis di sebuah hotel.", "qa": "20ade7980369", "aa": "3b294e8a5a4e"}, {"q": "Berapa lama Siu bekerja dalam sehari?", "a": "Delapan jam.", "qa": "df8fc4a23686", "aa": "40a8d3468064"}, {"q": "Apa yang Siu lakukan dalam pekerjaannya?", "a": "Memeriksa pesanan kamar, memberikan dan menerima kembali kunci kamar.", "qa": "1abb4b265b27", "aa": "e712ab14b40d"}, {"q": "Mengapa pekerjaan Siu menyenangkan?", "a": "Karena dia bisa bertemu banyak orang baru.", "qa": "66081d1891d4", "aa": "012cf4c987b3"}]}, {"id": "t83", "kind": "text", "book": "BIPA 2", "title": "市场打折广播（音频 3）", "lines": [{"sp": "", "role": "r", "id": "Bapak dan Ibu yang kami hormati: Sekarang Pasar Raya Sentosa memberi potongan harga untuk beberapa bahan pokok.", "zh": "", "a": "92b92c033506"}, {"sp": "", "role": "r", "id": "Potongan harga sering kami berikan pada setiap akhir bulan.", "zh": "", "a": "39cc0175a35c"}, {"sp": "", "role": "r", "id": "Potongan harga yang ada antara lain: satu kilogram cabai sekarang seharga Rp18.000.", "zh": "", "a": "418e3bc57e5b"}, {"sp": "", "role": "r", "id": "Satu kilogram bawang sekarang seharga Rp16.000.", "zh": "", "a": "0e2948b77bb1"}, {"sp": "", "role": "r", "id": "Terakhir, harga 1 kilogram tomat adalah Rp6.000.", "zh": "", "a": "069e2a985bc7"}, {"sp": "", "role": "r", "id": "Demikian pengumuman ini kami sampaikan.", "zh": "", "a": "be8c3f2993d8"}, {"sp": "", "role": "r", "id": "Kami tunggu kehadiran Bapak dan Ibu di pasar kami.", "zh": "", "a": "1f31fc064c20"}], "zh": "尊敬的先生们、女士们：现在 Sentosa 大市场对部分基本生活物资打折。我们通常在每个月底推出优惠。本次优惠包括：辣椒每公斤一万八千盾，洋葱每公斤一万六千盾，最后，西红柿每公斤六千盾。以上就是本次公告，欢迎各位光临我们的市场。", "note": "", "qa": [{"q": "Dari mana pengumuman itu terdengar?", "a": "Dari radio.", "qa": "1cc32f5e9458", "aa": "3009ceeabb33"}, {"q": "Di mana tempat yang ada potongan harga itu?", "a": "Di Pasar Raya Sentosa.", "qa": "5d59c32e18a4", "aa": "7011ecfa592f"}, {"q": "Kapan tempat tersebut sering membuat potongan harga?", "a": "Setiap akhir bulan.", "qa": "6f47a6995d42", "aa": "5c0a88f9888c"}, {"q": "Berapa harga satu kilogram tomat?", "a": "Rp6.000.", "qa": "137570a3ef16", "aa": "8301e0ea3c7a"}, {"q": "Berapa harga satu kilogram cabai?", "a": "Rp18.000.", "qa": "fcf44055aa03", "aa": "f23dad960040"}, {"q": "Berapa harga satu kilogram bawang?", "a": "Rp16.000.", "qa": "2dd78335eb48", "aa": "d7eb4610cd0d"}]}, {"id": "t84", "kind": "text", "book": "BIPA 2", "title": "交作业通知（课文 3）", "lines": [{"sp": "", "role": "r", "id": "PENGUMUMAN PENTING.", "zh": "", "a": "dbc4bab949a2"}, {"sp": "", "role": "r", "id": "Tolong kumpulkan tugas menulis teks bahasa Indonesia kepada Ibu Reni.", "zh": "", "a": "ef2b096ddd2b"}, {"sp": "", "role": "r", "id": "Tugas tersebut harus dikumpulkan pada hari Selasa sebelum pukul 12.00 di ruang kelas.", "zh": "", "a": "2e2530f64b6c"}, {"sp": "", "role": "r", "id": "Atas perhatian Anda, kami ucapkan terima kasih.", "zh": "", "a": "04c662c4ac45"}], "zh": "重要通知：请把印尼语写作作业交给 Reni 老师。作业必须在星期二中午 12 点前交到教室。感谢您的配合。", "note": "另一个例子：“Hari ini Toko Ronald tidak buka. Terima kasih.” Ronald 店今天不营业，谢谢。", "qa": [{"q": "Apa judul pengumuman itu?", "a": "Pengumuman penting.", "qa": "a5621c9e0ee9", "aa": "cab36d41ab13"}, {"q": "Kepada siapa pengumuman itu ditujukan?", "a": "Kepada para pelajar/siswa.", "qa": "8df72fc80191", "aa": "ba888ff0abf4"}, {"q": "Tugas apa yang harus dikumpulkan?", "a": "Tugas menulis teks bahasa Indonesia.", "qa": "49077f4334c8", "aa": "0e4467a7fb38"}, {"q": "Kepada siapa tugas itu dikumpulkan?", "a": "Kepada Ibu Reni.", "qa": "5f221568af29", "aa": "95cbb672a67f"}, {"q": "Kapan dan di mana tugas itu harus dikumpulkan?", "a": "Hari Selasa sebelum pukul 12.00, di ruang kelas.", "qa": "78e460d4aa7f", "aa": "a15ddc0a5bcf"}]}, {"id": "t85", "kind": "text", "book": "BIPA 2", "title": "传统市场（课文 4）", "lines": [{"sp": "", "role": "r", "id": "Pasar tradisional sekarang tidak lagi seperti yang dahulu.", "zh": "", "a": "82777dd1727c"}, {"sp": "", "role": "r", "id": "Dahulu pasar tradisional sangat tidak tertata rapi dan kotor.", "zh": "", "a": "413af3f9b6fd"}, {"sp": "", "role": "r", "id": "Saat ini pemerintah daerah di banyak wilayah Indonesia sudah menata pasar tradisional dengan lebih baik.", "zh": "", "a": "ed6e58149fc0"}, {"sp": "", "role": "r", "id": "Sekarang bangunan pasar tradisional sudah banyak yang permanen.", "zh": "", "a": "b582eaeb63a7"}, {"sp": "", "role": "r", "id": "Pasar tradisional sekarang juga lebih bersih.", "zh": "", "a": "1626b0997ba7"}, {"sp": "", "role": "r", "id": "Penjual dan pembeli sudah sangat mengerti tentang kebersihan pasar.", "zh": "", "a": "1b87b1c39b1c"}, {"sp": "", "role": "r", "id": "Banyak pasar tradisional membuat aturan jangan buang sampah sembarangan.", "zh": "", "a": "d65b6959e00f"}, {"sp": "", "role": "r", "id": "Semua itu dilakukan agar pembeli merasa nyaman saat berbelanja di pasar tradisional.", "zh": "", "a": "e55b5c753367"}], "zh": "现在的传统市场已经和以前不一样了。以前传统市场很乱、很脏。现在印尼许多地区的地方政府把传统市场整顿得更好了。如今很多传统市场的建筑都是永久性的，也更干净了。卖家和买家都很重视市场卫生，很多市场规定不准乱扔垃圾。这一切都是为了让顾客在传统市场购物时感到舒适。", "note": "", "qa": [{"q": "Bagaimana pasar tradisional dahulu?", "a": "Tidak tertata rapi dan kotor.", "qa": "746ab473b56c", "aa": "7ff35e38bbf6"}, {"q": "Siapa yang menata pasar tradisional?", "a": "Pemerintah daerah.", "qa": "736b24e19b7f", "aa": "9d24940b87d5"}, {"q": "Aturan apa yang dibuat banyak pasar tradisional?", "a": "Jangan buang sampah sembarangan.", "qa": "a4f54a6e3127", "aa": "53f2dc780858"}, {"q": "Untuk apa semua itu dilakukan?", "a": "Agar pembeli merasa nyaman saat berbelanja.", "qa": "06331f5a9306", "aa": "fb55c3204375"}]}, {"id": "t86", "kind": "text", "book": "BIPA 2", "title": "简单炒饭（课文 5）", "lines": [{"sp": "", "role": "r", "id": "Bahan: sosis ayam satu buah; bawang putih 3 siung, iris halus; garam; nasi 600 gram; penyedap rasa; kecap ikan; merica; telur ayam 1 butir; daun bawang 1 batang, iris halus; daging ayam 125 gram, cincang halus.", "zh": "", "a": "5e2b10a042cb"}, {"sp": "", "role": "r", "id": "Cara membuat: 1.", "zh": "", "a": "32c7117b6695"}, {"sp": "", "role": "r", "id": "Tumis bawang putih hingga harum.", "zh": "", "a": "2422b70a9cc1"}, {"sp": "", "role": "r", "id": "Tambahkan telur lalu orak-arik.", "zh": "", "a": "a99548a80616"}, {"sp": "", "role": "r", "id": "2.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Tambahkan ayam yang telah dicincang halus.", "zh": "", "a": "fb0eb5748907"}, {"sp": "", "role": "r", "id": "3.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Tambahkan sosis.", "zh": "", "a": "f6131aa6b266"}, {"sp": "", "role": "r", "id": "4.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Masukkan daun bawang, kemudian tumis lagi.", "zh": "", "a": "208a6c24995e"}, {"sp": "", "role": "r", "id": "5.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Masukkan nasi, kemudian aduk hingga rata.", "zh": "", "a": "d90caa8234ef"}, {"sp": "", "role": "r", "id": "6.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Tambahkan kecap ikan, garam, merica, dan penyedap rasa secara bersamaan.", "zh": "", "a": "b8a0402bfa04"}, {"sp": "", "role": "r", "id": "Aduk rata hingga aroma sedap atau harum tercium.", "zh": "", "a": "ddc6c1dfc1ad"}, {"sp": "", "role": "r", "id": "7.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Pindahkan nasi goreng pada piring.", "zh": "", "a": "dc8ec23b3441"}, {"sp": "", "role": "r", "id": "Anda bisa menaburkan bawang merah goreng sebagai tambahan.", "zh": "", "a": "1ee415c3d0f9"}], "zh": "材料：鸡肉香肠一根；大蒜三瓣，切薄片；盐；米饭 600 克；味精；鱼露；胡椒；鸡蛋一个；葱一根，切细；鸡肉 125 克，剁碎。做法：1. 把蒜炒香，加入鸡蛋炒散。2. 加入剁碎的鸡肉。3. 加入香肠。4. 放入葱，再炒一下。5. 放入米饭，翻炒均匀。6. 同时加入鱼露、盐、胡椒和味精，翻炒均匀直到闻到香味。7. 把炒饭盛到盘子里，可以撒些炸红葱头作配料。", "note": "", "qa": [{"q": "Berapa banyak sosis yang dibutuhkan?", "a": "Satu buah.", "qa": "f6c1435d5e16", "aa": "b9d9788134b1"}, {"q": "Berapa gram nasi yang dibutuhkan?", "a": "600 gram.", "qa": "ce808a9271a3", "aa": "15a8e51e8abb"}, {"q": "Berapa butir telur ayam yang dibutuhkan?", "a": "Satu butir.", "qa": "b50bd917f29d", "aa": "6f38789eefb1"}, {"q": "Apa saja bahan yang diaduk rata hingga aroma sedap muncul?", "a": "Kecap ikan, garam, merica, dan penyedap rasa.", "qa": "9268372e717c", "aa": "66c7fc1038b0"}, {"q": "Apa bahan yang dicincang halus?", "a": "Daging ayam.", "qa": "b6c9fcf8c318", "aa": "4bccdf406b49"}, {"q": "Apa yang bisa ditabur sebagai tambahan?", "a": "Bawang merah goreng.", "qa": "5f760b12e6a1", "aa": "d4e242302430"}]}, {"id": "t87", "kind": "text", "book": "BIPA 2", "title": "Budi 家周围（音频 6）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Budi.", "zh": "", "a": "dff39b3c900f"}, {"sp": "", "role": "r", "id": "Saya tinggal di Jalan Supratman.", "zh": "", "a": "bb6c736ac792"}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada masjid.", "zh": "", "a": "11831a44d9bf"}, {"sp": "", "role": "r", "id": "Di sebelah kiri masjid ada taman kanak-kanak.", "zh": "", "a": "21706298e98c"}, {"sp": "", "role": "r", "id": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Salim.", "zh": "", "a": "6923a255d1c5"}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada kantor pos.", "zh": "", "a": "4127467dbeb8"}, {"sp": "", "role": "r", "id": "Di belakang rumah saya ada toko kelontong.", "zh": "", "a": "089f31e80145"}], "zh": "我叫 Budi，住在 Supratman 路。我家对面有一座清真寺，清真寺左边是一所幼儿园。我家右边是邻居 Salim 先生家，左边是邮局，后面是一家杂货店。", "note": "", "qa": [{"q": "Siapa Pak Salim?", "a": "Tetangga Budi.", "qa": "13e8eb901719", "aa": "6bc41c83fd7b"}, {"q": "Ada apa di seberang rumah Budi?", "a": "Masjid.", "qa": "76a20da20048", "aa": "2f07071ed18b"}, {"q": "Ada apa di sebelah kiri rumah Budi?", "a": "Kantor pos.", "qa": "0c86b63763eb", "aa": "dba7a93761eb"}, {"q": "Ada apa di belakang rumah Budi?", "a": "Toko kelontong.", "qa": "44edac7e6867", "aa": "ccc87e2beb07"}]}, {"id": "t88", "kind": "text", "book": "BIPA 2", "title": "Raisa 的家（课文 6）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Raisa.", "zh": "", "a": "93a3100953bf"}, {"sp": "", "role": "r", "id": "Saya tinggal di Jalan Sukasenang.", "zh": "", "a": "4b8d9fdd3e24"}, {"sp": "", "role": "r", "id": "Rumah saya adalah rumah dua lantai.", "zh": "", "a": "14c7615c345d"}, {"sp": "", "role": "r", "id": "Rumah saya berwarna putih.", "zh": "", "a": "43aea247dc57"}, {"sp": "", "role": "r", "id": "Di depan rumah saya ada halaman.", "zh": "", "a": "8f44fedfb6cb"}, {"sp": "", "role": "r", "id": "Di sana ada pohon mangga.", "zh": "", "a": "d1b189c1171b"}, {"sp": "", "role": "r", "id": "Di belakang rumah saya ada warung Ibu Yayan.", "zh": "", "a": "309f634e85f2"}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada toko kelontong.", "zh": "", "a": "5499abc80cab"}, {"sp": "", "role": "r", "id": "Di samping kanan rumah saya ada rumah seorang tetangga saya, Pak Bandi.", "zh": "", "a": "d497f81d567c"}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada taman bermain.", "zh": "", "a": "0a4a6103d460"}], "zh": "我叫 Raisa，住在 Sukasenang 路。我家是两层楼，白色的。房前有个院子，院子里有棵芒果树。房后是 Yayan 阿姨的小店，左边是一家杂货店，右边是邻居 Bandi 先生家，对面是一个游乐场。", "note": "", "qa": [{"q": "Di mana Raisa tinggal?", "a": "Di Jalan Sukasenang.", "qa": "88350aef70da", "aa": "97412599fd02"}, {"q": "Apa warna rumah Raisa?", "a": "Putih.", "qa": "75ba4ec6bbff", "aa": "6c31feb40754"}, {"q": "Ada pohon apa di halaman rumah Raisa?", "a": "Pohon mangga.", "qa": "31c353e1b6c5", "aa": "2cefc7270c73"}, {"q": "Siapa pemilik warung di belakang rumah Raisa?", "a": "Ibu Yayan.", "qa": "d681ab253c05", "aa": "c3dd98bf02f1"}, {"q": "Di mana letak taman bermain?", "a": "Di seberang rumah Raisa.", "qa": "d783f3db2716", "aa": "fe9b69506d5d"}, {"q": "Siapakah Pak Bandi?", "a": "Tetangga Raisa.", "qa": "3d02a7bb6999", "aa": "1693d2ea30b3"}]}, {"id": "t89", "kind": "text", "book": "BIPA 2", "title": "画平面图练习", "lines": [{"sp": "", "role": "r", "id": "Rumah saya ada di Jalan Bambu.", "zh": "", "a": "bc23ed5b507b"}, {"sp": "", "role": "r", "id": "Rumah saya ada di belakang Masjid Al-Furqon.", "zh": "", "a": "9836e645a3fd"}, {"sp": "", "role": "r", "id": "Di sebelah kanan masjid ada kebun cabai.", "zh": "", "a": "c0b93fabfc1b"}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada toko yang menjual gas dan minyak tanah.", "zh": "", "a": "98bcd495ca1c"}, {"sp": "", "role": "r", "id": "Di seberang toko gas ada toko air minum.", "zh": "", "a": "4925737b81f5"}, {"sp": "", "role": "r", "id": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Resa.", "zh": "", "a": "032006be3294"}, {"sp": "", "role": "r", "id": "Di seberang rumah Pak Resa ada supermarket.", "zh": "", "a": "5f70e9a452f7"}, {"sp": "", "role": "r", "id": "Di sebelah kiri supermarket ada tempat pangkas rambut.", "zh": "", "a": "5efbe3630d15"}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada taman bermain anak.", "zh": "", "a": "5a3e02da4681"}, {"sp": "", "role": "r", "id": "Di belakang taman bermain anak ada sekolah, yaitu SDN Ajitunggal.", "zh": "", "a": "f072cddbc1fa"}], "zh": "我家在竹子路，在 Al-Furqon 清真寺后面。清真寺右边有一块辣椒地。我家左边是一家卖煤气和煤油的店，煤气店对面是一家饮用水店。我家右边是邻居 Resa 先生家，他家对面是一家超市，超市左边是理发店。我家对面是儿童游乐场，游乐场后面是一所学校——Ajitunggal 国立小学。", "note": "练习：根据这段描述画出平面图。", "qa": []}, {"id": "t90", "kind": "text", "book": "BIPA 2", "title": "热身运动（音频 7）", "lines": [{"sp": "", "role": "r", "id": "Sebelum berolahraga, kita harus melakukan pemanasan.", "zh": "", "a": "89b9eec63d84"}, {"sp": "", "role": "r", "id": "Contoh pemanasan adalah sebagai berikut.", "zh": "", "a": "7393b827a0a1"}, {"sp": "", "role": "r", "id": "Langkah pertama, gerakkan kepala ke kanan dan ke kiri.", "zh": "", "a": "437c6e934d77"}, {"sp": "", "role": "r", "id": "Setelah itu, regangkan tangan ke atas dan ke bawah.", "zh": "", "a": "28713acea5de"}, {"sp": "", "role": "r", "id": "Terakhir, angkat kaki secara bergantian.", "zh": "", "a": "90655aced2c5"}, {"sp": "", "role": "r", "id": "Lakukan tiap gerakan selama delapan detik.", "zh": "", "a": "523283b23704"}], "zh": "运动前我们要先热身。热身的例子如下：第一步，把头向右、向左转动；然后，把手向上、向下伸展；最后，轮流抬腿。每个动作做八秒。", "note": "", "qa": [{"q": "Apa yang harus kita lakukan sebelum berolahraga?", "a": "Pemanasan.", "qa": "c26fbccd1e2d", "aa": "884682e8d5cc"}, {"q": "Apa langkah pertama ketika melakukan pemanasan?", "a": "Menggerakkan kepala ke kanan dan ke kiri.", "qa": "c292ee66ea17", "aa": "8bb4aa1a36c9"}, {"q": "Ke arah mana kita harus meregangkan tangan?", "a": "Ke atas dan ke bawah.", "qa": "b1e1310bdf5d", "aa": "5a92541fbefa"}, {"q": "Berapa lama waktu untuk tiap gerakan?", "a": "Delapan detik.", "qa": "d13bf8f16990", "aa": "5f273fa78b58"}, {"q": "Apa langkah ketiga dalam pemanasan?", "a": "Mengangkat kaki secara bergantian.", "qa": "14d955f3b69c", "aa": "3b49e6a7b457"}]}, {"id": "t91", "kind": "text", "book": "BIPA 2", "title": "放松运动的做法（课文 7）", "lines": [{"sp": "", "role": "r", "id": "Olahraga adalah aktivitas yang baik bagi tubuh.", "zh": "", "a": "1c919f7b4fd7"}, {"sp": "", "role": "r", "id": "Setelah melakukan kegiatan inti Anda harus melakukan pendinginan.", "zh": "", "a": "d2df4e132608"}, {"sp": "", "role": "r", "id": "Ada banyak cara untuk melakukan pendinginan.", "zh": "", "a": "aef35b6aafd1"}, {"sp": "", "role": "r", "id": "Berikut adalah salah satu caranya.", "zh": "", "a": "c75d6a968a4b"}, {"sp": "", "role": "r", "id": "Pertama, buka kaki selebar bahu.", "zh": "", "a": "f9f2f733de38"}, {"sp": "", "role": "r", "id": "Kedua, pegang pinggang dengan tangan kiri.", "zh": "", "a": "b3a2351cc607"}, {"sp": "", "role": "r", "id": "Setelah itu gerakkan tangan kanan ke atas dan ke bawah.", "zh": "", "a": "d1995b1e61dd"}, {"sp": "", "role": "r", "id": "Lakukan hal yang sama dengan tangan kiri.", "zh": "", "a": "4a69cd03a2c5"}, {"sp": "", "role": "r", "id": "Lalu, condongkan badan ke arah kiri bawah sampai hampir jongkok kemudian regangkan kaki ke kanan.", "zh": "", "a": "fb80827ce861"}, {"sp": "", "role": "r", "id": "Lakukan hal yang sama dengan kaki kiri.", "zh": "", "a": "1d050603045f"}, {"sp": "", "role": "r", "id": "Tahan tiap gerakan selama 8 detik.", "zh": "", "a": "086cc936cdc7"}, {"sp": "", "role": "r", "id": "Setelah selesai pendinginan hindari meminum minuman bersoda.", "zh": "", "a": "2211a2a5fbe4"}, {"sp": "", "role": "r", "id": "Minuman bersoda dapat membuat perut menjadi kembung.", "zh": "", "a": "5ccc70968c95"}], "zh": "运动对身体有益。做完主要运动后，要做放松运动。放松的方法很多，下面是其中一种：第一，双脚分开与肩同宽；第二，左手扶腰；然后右手上下摆动，左手也做同样的动作。接着，身体向左下方倾斜，几乎蹲下，然后把右腿伸直，左腿也同样做。每个动作保持 8 秒。放松结束后，避免喝汽水，因为汽水会让肚子胀。", "note": "", "qa": [{"q": "Apa tema teks di atas?", "a": "Cara melakukan pendinginan.", "qa": "4278f23b0947", "aa": "ab1ee7211526"}, {"q": "Apa yang harus Anda lakukan setelah kegiatan inti?", "a": "Pendinginan.", "qa": "bb2d66c9dad4", "aa": "a11ddb8859a8"}, {"q": "Mengapa setelah berolahraga tidak boleh meminum minuman bersoda?", "a": "Karena dapat membuat perut kembung.", "qa": "dc102e08d76a", "aa": "2381013d2a83"}, {"q": "Apa langkah pertama dalam pendinginan?", "a": "Membuka kaki selebar bahu.", "qa": "3d70b19afa40", "aa": "0ed9a1c56a01"}, {"q": "Berapa lama tiap gerakan dilakukan?", "a": "Delapan detik.", "qa": "228df3d8f895", "aa": "5f273fa78b58"}]}, {"id": "t92", "kind": "text", "book": "BIPA 2", "title": "坐通勤列车（课文 8）", "lines": [{"sp": "", "role": "r", "id": "Saya mencoba naik kereta rel listrik (KRL) minggu lalu.", "zh": "", "a": "5bb2373cf0a5"}, {"sp": "", "role": "r", "id": "Saya berangkat dari Bogor ke Jakarta.", "zh": "", "a": "cf821f779a9a"}, {"sp": "", "role": "r", "id": "Banyak hal yang baru saya temui ketika mencoba naik KRL.", "zh": "", "a": "babde601ee7c"}, {"sp": "", "role": "r", "id": "Pertama saya memesan tiket di loket yang ada.", "zh": "", "a": "1a4dfeb5fc37"}, {"sp": "", "role": "r", "id": "Saya harus menyebutkan stasiun yang ingin saya tuju.", "zh": "", "a": "11147e66e2c4"}, {"sp": "", "role": "r", "id": "Harganya cukup murah, hanya 10.000 rupiah.", "zh": "", "a": "2fd854fe66f5"}, {"sp": "", "role": "r", "id": "Setelah itu, saya menempelkan tiket di gerbang dan berjalan ke peron untuk menunggu kereta.", "zh": "", "a": "2bac56f29379"}, {"sp": "", "role": "r", "id": "Ketika kereta tiba, saya langsung naik.", "zh": "", "a": "b244513943af"}, {"sp": "", "role": "r", "id": "Keadaan di dalam kereta cukup sesak.", "zh": "", "a": "2debad9ffbb7"}, {"sp": "", "role": "r", "id": "Kereta pun tiba di Jakarta.", "zh": "", "a": "c32f0d2e309f"}, {"sp": "", "role": "r", "id": "Saya turun, lalu berjalan keluar stasiun.", "zh": "", "a": "297ca52516ed"}, {"sp": "", "role": "r", "id": "Saya harus menempelkan kembali tiket di gerbang yang telah disediakan.", "zh": "", "a": "2e7e57cc21cd"}, {"sp": "", "role": "r", "id": "Pengalaman naik KRL cukup mengasyikkan.", "zh": "", "a": "2c05a1adb0f4"}, {"sp": "", "role": "r", "id": "Penumpang memang harus bersabar ketika berada dalam kereta.", "zh": "", "a": "02195c06d099"}, {"sp": "", "role": "r", "id": "Namun, tempat tujuan bisa dicapai tepat waktu.", "zh": "", "a": "d2e1d40e98e4"}], "zh": "上周我第一次试着坐通勤列车，从茂物去雅加达，遇到了很多新鲜事。首先我在售票窗口买票，要说出想去的车站，票价挺便宜，只要一万盾。然后我在闸机刷票，走到站台等车。车一到我就上去了，车厢里相当挤。列车到了雅加达，我下车走出车站，出站时还要在闸机再刷一次票。坐通勤列车的经历挺有意思，在车上确实要有耐心，不过能准时到达目的地。", "note": "", "qa": [{"q": "Kapan penulis mencoba naik KRL?", "a": "Minggu lalu.", "qa": "07ad3a9d4dd1", "aa": "a56fe91cc4e4"}, {"q": "Apa tujuan teks tersebut?", "a": "Menceritakan pengalaman naik KRL.", "qa": "77d2a2be0043", "aa": "1654083b03c4"}, {"q": "Seperti apa suasana di dalam kereta?", "a": "Cukup sesak.", "qa": "ba6bae8d531d", "aa": "f0c6a579cc90"}, {"q": "Apa yang harus dilakukan agar penumpang bisa keluar dari stasiun?", "a": "Menempelkan kembali tiket di gerbang.", "qa": "7954d599e3b5", "aa": "3ac6aa925570"}, {"q": "Apa yang dirasakan penulis setelah naik KRL?", "a": "Cukup mengasyikkan.", "qa": "09dd77cabe37", "aa": "3b57cc7df5fe"}]}, {"id": "t93", "kind": "text", "book": "BIPA 2", "title": "四王群岛的假期（课文 9）", "lines": [{"sp": "", "role": "r", "id": "Tahun lalu, saya dan keluarga pergi ke Raja Ampat.", "zh": "", "a": "7595eea47caa"}, {"sp": "", "role": "r", "id": "Kami pergi ke sana dengan pesawat.", "zh": "", "a": "a4353ee8b006"}, {"sp": "", "role": "r", "id": "Sesampainya di sana kami langsung masuk ke hotel.", "zh": "", "a": "1a2a2e55fdd6"}, {"sp": "", "role": "r", "id": "Setelah menyimpan barang-barang, kami memulai beragam aktivitas.", "zh": "", "a": "553f5e385821"}, {"sp": "", "role": "r", "id": "Pada hari pertama, kami bermain di pantai.", "zh": "", "a": "3389eff94700"}, {"sp": "", "role": "r", "id": "Pantai di Raja Ampat sangat indah.", "zh": "", "a": "4808128823f7"}, {"sp": "", "role": "r", "id": "Lautnya jernih dan bersih.", "zh": "", "a": "476247ffd179"}, {"sp": "", "role": "r", "id": "Kami juga tidak lupa untuk snorkeling.", "zh": "", "a": "eb281418ab14"}, {"sp": "", "role": "r", "id": "Saya melihat banyak ikan yang berwarna-warni.", "zh": "", "a": "5ffa3d840beb"}, {"sp": "", "role": "r", "id": "Setelah itu kami mengunjungi pantai yang berpasir putih.", "zh": "", "a": "9b1e97b4b79d"}, {"sp": "", "role": "r", "id": "Saya dan keluarga tidak lupa untuk berfoto bersama.", "zh": "", "a": "13ef814812b2"}, {"sp": "", "role": "r", "id": "Pada hari kedua kami pergi ke Air Terjun Batanta.", "zh": "", "a": "903a78d7dbc9"}, {"sp": "", "role": "r", "id": "Airnya bersih dan jernih seperti di pantai.", "zh": "", "a": "d645214159f9"}, {"sp": "", "role": "r", "id": "Pada hari ketiga kami pulang ke rumah.", "zh": "", "a": "cb9c74d6fe9a"}, {"sp": "", "role": "r", "id": "Liburan kami terasa amat singkat.", "zh": "", "a": "cbb8df51a94d"}, {"sp": "", "role": "r", "id": "Akan tetapi, saya dan keluarga merasa sangat bahagia.", "zh": "", "a": "6a85134686da"}, {"sp": "", "role": "r", "id": "Saya ingin kembali ke sana pada lain waktu.", "zh": "", "a": "a26d01ab5b46"}], "zh": "去年我和家人去了四王群岛，是坐飞机去的。一到那里我们就直接进了酒店，放好行李后开始了各种活动。第一天我们在海滩玩，四王群岛的海滩非常美，海水清澈干净。我们还去浮潜，我看到很多五颜六色的鱼。之后我们去了白沙滩，全家一起拍照。第二天我们去了巴坦塔瀑布，那里的水和海水一样干净清澈。第三天我们回家了。假期感觉太短了，不过我和家人都非常开心，我希望以后还能再去。", "note": "", "qa": [{"q": "Ke mana penulis berlibur?", "a": "Ke Raja Ampat.", "qa": "2c5288d98c52", "aa": "8c4f10f950ac"}, {"q": "Transportasi apa yang digunakan penulis dan keluarganya?", "a": "Pesawat.", "qa": "2404d58d85f7", "aa": "31550135a5de"}, {"q": "Berapa lama mereka berlibur di Raja Ampat?", "a": "Tiga hari.", "qa": "01316f377dc4", "aa": "c02b7095ddb5"}, {"q": "Apa kesamaan antara pantai dan air terjun di Raja Ampat?", "a": "Airnya sama-sama bersih dan jernih.", "qa": "6c9246c676bb", "aa": "be02c6e393bb"}, {"q": "Apa yang dirasakan penulis setelah berlibur?", "a": "Sangat bahagia.", "qa": "8164f548533c", "aa": "8de1ee33b5f1"}]}, {"id": "t94", "kind": "text", "book": "BIPA 2", "title": "得了登革热（课文 10）", "lines": [{"sp": "", "role": "r", "id": "Pada suatu hari saya tiba-tiba merasa sangat mual.", "zh": "", "a": "cfb5b3972022"}, {"sp": "", "role": "r", "id": "Badan saya terasa demam.", "zh": "", "a": "55c27dbf15d3"}, {"sp": "", "role": "r", "id": "Otot saya sangat sakit.", "zh": "", "a": "4b53563ed59a"}, {"sp": "", "role": "r", "id": "Muka saya menjadi sangat pucat.", "zh": "", "a": "32f4539448b2"}, {"sp": "", "role": "r", "id": "Wali kelas mengantar saya ke rumah sakit.", "zh": "", "a": "04ecc029e6dd"}, {"sp": "", "role": "r", "id": "Setelah diperiksa, saya mengalami gejala demam berdarah.", "zh": "", "a": "09f89520f6ac"}, {"sp": "", "role": "r", "id": "Penyakit ini disebabkan virus yang dibawa oleh nyamuk Aedes aegypti.", "zh": "", "a": "4aca6bf0e80a"}, {"sp": "", "role": "r", "id": "Saya langsung dimasukkan ke ruang rawat inap.", "zh": "", "a": "6feba15cd5e8"}, {"sp": "", "role": "r", "id": "Perawat memasang infus di lengan saya.", "zh": "", "a": "929cfb971557"}, {"sp": "", "role": "r", "id": "Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat.", "zh": "", "a": "7bf8776737ce"}, {"sp": "", "role": "r", "id": "Saya pun dianjurkan untuk sering meminum air.", "zh": "", "a": "0165139fc14a"}, {"sp": "", "role": "r", "id": "Selain itu, saya diminta untuk memakan buah-buahan yang mengandung vitamin C.", "zh": "", "a": "ffdea84b4de3"}, {"sp": "", "role": "r", "id": "Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit.", "zh": "", "a": "3161d5d43020"}, {"sp": "", "role": "r", "id": "Akhirnya, saya boleh pulang setelah dirawat selama 5 hari.", "zh": "", "a": "26a3d3e3d31e"}, {"sp": "", "role": "r", "id": "Mulai saat itu, saya menjaga kebersihan rumah saya.", "zh": "", "a": "90e719e24d7b"}, {"sp": "", "role": "r", "id": "Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "zh": "", "a": "1f4fb864e0e0"}], "zh": "有一天我突然觉得非常恶心，身体发烧，肌肉很疼，脸色变得非常苍白。班主任送我去了医院。检查后发现我有登革热的症状，这种病是由埃及伊蚊携带的病毒引起的。我马上被送进住院病房，护士在我手臂上打了点滴。住院期间我不能吃医院外面的食物，医生建议我多喝水，还要多吃含维生素 C 的水果。住院时我只能躺在床上。住了五天后我终于可以回家了。从那以后我注意保持家里清洁，这样就不会再有蚊子了。", "note": "", "qa": [{"q": "Di mana penulis dirawat di rumah sakit?", "a": "Di ruang rawat inap.", "qa": "ac0e41b12ca7", "aa": "c6de1fb58929"}, {"q": "Apa gejala yang dialami oleh penulis?", "a": "Mual, demam, otot sakit, dan muka pucat.", "qa": "1fd5121ab97e", "aa": "6b53ddba8f97"}, {"q": "Nyamuk apa yang membawa virus demam berdarah?", "a": "Nyamuk Aedes aegypti.", "qa": "3c2ff2635a93", "aa": "e60b515fd080"}, {"q": "Apa yang dianjurkan kepada penulis agar cepat sembuh?", "a": "Sering minum air dan makan buah-buahan yang mengandung vitamin C.", "qa": "c6f3c9ca89cd", "aa": "6cb7e12d3ba9"}, {"q": "Berapa lama penulis dirawat di rumah sakit?", "a": "Lima hari.", "qa": "a64ecf40368a", "aa": "3b6a2149a16c"}, {"q": "Apa yang dilakukan penulis agar tidak sakit demam berdarah lagi?", "a": "Menjaga kebersihan rumah supaya tidak ada nyamuk.", "qa": "924b7cafa725", "aa": "985a712a419b"}]}, {"id": "t95", "kind": "text", "book": "BIPA 2", "title": "止泻药说明书", "lines": [{"sp": "", "role": "r", "id": "Obat Diare.", "zh": "", "a": "07b647bd63d1"}, {"sp": "", "role": "r", "id": "Khasiat: 1.", "zh": "", "a": "de1ce389f10d"}, {"sp": "", "role": "r", "id": "Mengurangi frekuensi buang air besar.", "zh": "", "a": "1151414bddd9"}, {"sp": "", "role": "r", "id": "2.", "zh": "", "a": null}, {"sp": "", "role": "r", "id": "Menyerap racun penyebab diare.", "zh": "", "a": "3e22c5551836"}, {"sp": "", "role": "r", "id": "Komposisi: Tiap tablet (325 mg) mengandung activated charcoal (125 mg).", "zh": "", "a": "2d76f80b4f28"}, {"sp": "", "role": "r", "id": "Aturan pakai: 5—7 tablet per dosis.", "zh": "", "a": "29217e97f010"}, {"sp": "", "role": "r", "id": "Maksimum 20 tablet/hari.", "zh": "", "a": "9d86f67b8b66"}, {"sp": "", "role": "r", "id": "Produksi: P.T.", "zh": "", "a": "1ac4d49ab1a4"}, {"sp": "", "role": "r", "id": "Eagle Indo Pharma.", "zh": "", "a": "f0705cb2900c"}], "zh": "止泻药。功效：1. 减少排便次数；2. 吸附引起腹泻的毒素。成分：每片（325 毫克）含活性炭 125 毫克。用法：每次 5—7 片，每天最多 20 片。生产商：P.T. Eagle Indo Pharma。", "note": "药品说明常用词：khasiat 功效 · komposisi 成分 · aturan pakai 用法 · dosis 剂量 · maksimum 最多。", "qa": []}, {"id": "c96", "kind": "culture", "book": "BIPA 1", "title": "认识印度尼西亚", "lines": [{"sp": "", "role": "r", "id": "Indonesia adalah negara kepulauan yang besar di Asia Tenggara.", "zh": "", "a": "b82c961cdb06"}, {"sp": "", "role": "r", "id": "Indonesia memiliki banyak pulau dan penduduk yang berasal dari berbagai suku dan budaya.", "zh": "", "a": "aaeee105fa67"}, {"sp": "", "role": "r", "id": "Masyarakat Indonesia dikenal ramah dan terbuka.", "zh": "", "a": "b9e9944113fe"}, {"sp": "", "role": "r", "id": "Mengenal Indonesia akan membantu kita lebih mudah beradaptasi dalam kehidupan dan pekerjaan sehari-hari.", "zh": "", "a": "6edf3df5ac32"}, {"sp": "", "role": "r", "id": "Bahasa Indonesia adalah bahasa resmi di Indonesia.", "zh": "", "a": "e7a3ef1813bd"}, {"sp": "", "role": "r", "id": "Bahasa ini digunakan di tempat kerja, sekolah, dan dalam kehidupan sehari-hari.", "zh": "", "a": "1c62a8ea6799"}, {"sp": "", "role": "r", "id": "Bahasa Indonesia tidak memiliki nada dan tata bahasanya relatif sederhana.", "zh": "", "a": "0e2590532abf"}, {"sp": "", "role": "r", "id": "Oleh karena itu, bahasa Indonesia mudah dipelajari oleh orang asing.", "zh": "", "a": "c6cbc5a6f5c8"}], "zh": "印度尼西亚是东南亚的群岛大国，有众多岛屿，居民来自不同的民族和文化，当地人以友好、开放著称。了解印尼能帮助我们更快适应生活和工作。印尼语是印尼的官方语言，用于工作、学校和日常生活。印尼语没有声调，语法相对简单，所以外国人比较容易学。", "note": "", "qa": []}, {"id": "c97", "kind": "culture", "book": "BIPA 1", "title": "城市、饮食与景点", "lines": [{"sp": "", "role": "r", "id": "Kota-kota di Indonesia, seperti di negara lain, sebagian besar didominasi oleh bangunan modern, sementara di daerah pedesaan banyak terdapat bangunan dengan ciri khas etnis.", "zh": "", "a": "8718c3337b4c"}, {"sp": "", "role": "r", "id": "Karena cuaca yang panas, masyarakat biasanya mandi setidaknya dua hingga tiga kali sehari.", "zh": "", "a": "f30d804fe165"}, {"sp": "", "role": "r", "id": "Penduduk lokal Indonesia terbiasa makan dengan tangan dan mahir dalam memasak.", "zh": "", "a": "0e8447ee01b2"}, {"sp": "", "role": "r", "id": "Setiap daerah memiliki beragam jajanan khas, seperti pisang goreng, bola ketan, kue ketan, dan bakpia.", "zh": "", "a": "400fdcd69726"}, {"sp": "", "role": "r", "id": "Masyarakat pada umumnya menyukai makanan pedas; cabai dan sambal merupakan bumbu yang umum dijumpai di meja makan.", "zh": "", "a": "02bf9e7730cd"}], "zh": "印尼的城市和其他国家一样以现代建筑为主，农村则有许多带民族特色的建筑。因为天气炎热，人们每天通常洗两到三次澡。印尼人习惯用手吃饭，也很会做饭，各地都有丰富的特色小吃，比如炸香蕉、糯米团、糯米糕和馅饼。人们普遍爱吃辣，辣椒和辣椒酱是餐桌上常见的调料。著名景点：四王群岛（巴布亚）、托拉查的 Kete Kesu、粉红沙滩和科莫多岛（东努沙登加拉）、多巴湖（北苏门答腊）、婆罗浮屠（中爪哇）、布罗莫火山（东爪哇）、巴厘岛、布纳肯（北苏拉威西）、山口洋（西加里曼丹）。", "note": "", "qa": []}, {"id": "c98", "kind": "culture", "book": "BIPA 1", "title": "印尼的宗教问候语", "lines": [{"sp": "", "role": "r", "id": "Ada beberapa ujaran salam keagamaan saat berpidato atau berbicara di forum umum.", "zh": "", "a": "85ac53319c2a"}, {"sp": "", "role": "r", "id": "Ujaran salam itu adalah assalamualaikum, salam sejahtera, om swastiastu, dan namo buddhaya.", "zh": "", "a": "449a284336ae"}, {"sp": "", "role": "r", "id": "Ujaran salam itu diucapkan untuk menyapa orang Indonesia dari berbagai latar belakang agama.", "zh": "", "a": "5af6e3af3525"}], "zh": "在演讲或公开场合发言时，有几种宗教问候语：assalamualaikum（伊斯兰）、salam sejahtera（基督教等）、om swastiastu（巴厘印度教）和 namo buddhaya（佛教）。说这些问候语是为了向不同宗教背景的印尼人问好。", "note": "", "qa": []}, {"id": "c99", "kind": "culture", "book": "BIPA 1", "title": "印尼人的相识礼节", "lines": [{"sp": "", "role": "r", "id": "Orang Indonesia biasanya berkenalan dengan berjabat tangan.", "zh": "", "a": "3578de46fdd5"}, {"sp": "", "role": "r", "id": "Umumnya jabat tangan dilakukan dengan tangan kanan.", "zh": "", "a": "1d6bf9338f48"}, {"sp": "", "role": "r", "id": "Ada beberapa orang berjabat tangan dengan dua tangan.", "zh": "", "a": "1b8123353fe2"}, {"sp": "", "role": "r", "id": "Perbedaan jabat tangan itu ada pada ujung jari yang bersentuhan dan tidak bersentuhan.", "zh": "", "a": "a989227c48cb"}, {"sp": "", "role": "r", "id": "Ada juga budaya cium tangan (salim).", "zh": "", "a": "bff238196822"}, {"sp": "", "role": "r", "id": "Budaya cium tangan biasanya untuk menghormati orang yang lebih tua, misalnya murid kepada guru atau anak kepada orang tua.", "zh": "", "a": "a964bc299b14"}], "zh": "印尼人认识时通常握手，一般用右手。也有人用双手握手，区别在于指尖是否相碰。还有一种吻手礼（salim），通常用来表示对长辈的尊敬，比如学生对老师、孩子对父母。", "note": "", "qa": []}, {"id": "c100", "kind": "culture", "book": "BIPA 1", "title": "礼貌的称呼", "lines": [{"sp": "", "role": "r", "id": "Orang Indonesia biasa memanggil orang yang lebih tua dengan bapak (Pak) dan ibu (Bu).", "zh": "", "a": "e6cd43e17829"}, {"sp": "", "role": "r", "id": "Sapaan bapak untuk laki-laki dan sapaan ibu untuk perempuan.", "zh": "", "a": "6a706046e201"}, {"sp": "", "role": "r", "id": "Di Pulau Jawa, orang biasa menggunakan sapaan mas untuk laki-laki yang lebih tua dan mbak untuk perempuan yang lebih tua.", "zh": "", "a": "e75065da2a5e"}, {"sp": "", "role": "r", "id": "Berbeda daerah bisa berbeda sapaan.", "zh": "", "a": "c51fae49e135"}, {"sp": "", "role": "r", "id": "Orang Batak di Sumatra biasa menggunakan sapaan ito, kakak, dan abang.", "zh": "", "a": "1b1879ce75b1"}, {"sp": "", "role": "r", "id": "Orang Minang biasa menggunakan sapaan uda dan uni.", "zh": "", "a": "edbd3ace9854"}, {"sp": "", "role": "r", "id": "Orang Sunda biasa menggunakan sapaan teteh dan aa.", "zh": "", "a": "c25963d3b201"}, {"sp": "", "role": "r", "id": "Orang Bali biasa menggunakan sapaan bli dan mbok.", "zh": "", "a": "fb9ce1125b05"}], "zh": "印尼人通常称呼年长的男性为 bapak（Pak），女性为 ibu（Bu）。在爪哇岛，人们称呼年长男性为 mas、年长女性为 mbak。不同地区称呼不同：苏门答腊的巴塔克人用 ito、kakak、abang；米南人用 uda（哥）和 uni（姐）；巽他人用 aa（哥）和 teteh（姐）；巴厘人用 bli（哥）和 mbok（姐）。", "note": "", "qa": []}, {"id": "c101", "kind": "culture", "book": "BIPA 1", "title": "为什么印尼人会问年龄", "lines": [{"sp": "", "role": "r", "id": "Dalam etika berkenalan di Indonesia, orang kadang-kadang bertanya usia untuk mengenal lebih dekat.", "zh": "", "a": "9234e18c9edc"}, {"sp": "", "role": "r", "id": "Di lingkungan kantor, atasan atau senior kerja biasanya akan bertanya usia jika mereka ingin mengetahui pengalaman kerja seseorang.", "zh": "", "a": "1dd34e30eaed"}, {"sp": "", "role": "r", "id": "Terkadang kerabat keluarga yang jarang bertemu juga bertanya usia, misalnya kakek kepada cucunya, paman kepada keponakannya.", "zh": "", "a": "80e36175607f"}, {"sp": "", "role": "r", "id": "Dalam pertemanan, seseorang akan bertanya usia sebagai cara untuk lebih akrab dengan teman yang dikenalnya.", "zh": "", "a": "15a27f629e73"}], "zh": "在印尼的交往礼节中，人们有时会问年龄，以便更了解对方。在办公室，上司或前辈想了解一个人的工作经验时常会问年龄；不常见面的亲戚也会问，比如爷爷问孙子、叔叔问侄子。朋友之间问年龄，是拉近关系的一种方式。", "note": "", "qa": []}, {"id": "c102", "kind": "culture", "book": "BIPA 1", "title": "印尼的旅游类型", "lines": [{"sp": "", "role": "r", "id": "Ada beberapa jenis wisata yang digemari masyarakat Indonesia, antara lain wisata alam, wisata religi dan budaya, wisata belanja, dan wisata edukasi.", "zh": "", "a": "e6cbc088c634"}, {"sp": "", "role": "r", "id": "Beberapa tempat wisata alam yang menarik antara lain Kepulauan Raja Ampat (Papua), Gunung Rinjani (Pulau Lombok), Kepulauan Belitung, Gunung Bromo (Jawa Timur), Taman Laut Bunaken (Sulawesi Utara), dan Danau Toba (Sumatra Utara).", "zh": "", "a": "f4a455a04b61"}, {"sp": "", "role": "r", "id": "Tempat wisata religi antara lain Masjid Istiqlal (Jakarta), Pura Tanah Lot (Bali), Candi Borobudur (Jawa Tengah), Candi Prambanan (Yogyakarta), Gereja Blenduk (Jawa Tengah), dan Patung Yesus (Toraja).", "zh": "", "a": "78d0d91e2a75"}, {"sp": "", "role": "r", "id": "Untuk wisata belanja ada Pasar Tanah Abang (Jakarta), Pasar Cibaduyut (Bandung), Pasar Seni Sukawati (Bali), dan Pasar Beringharjo (Yogyakarta).", "zh": "", "a": "f7217205bb39"}, {"sp": "", "role": "r", "id": "Untuk wisata edukasi ada Taman Mini Indonesia Indah (Jakarta), Taman Pintar (Yogyakarta), Jatim Park 2 (Jawa Timur), dan Kota Tua (Jakarta).", "zh": "", "a": "b0cb6e3748c9"}], "zh": "印尼人喜爱的旅游类型有：自然游、宗教文化游、购物游和教育游。自然景点：四王群岛（巴布亚）、林贾尼火山（龙目岛）、勿里洞群岛、布罗莫火山（东爪哇）、布纳肯海洋公园（北苏拉威西）、多巴湖（北苏门答腊）。宗教景点：独立清真寺（雅加达）、海神庙（巴厘）、婆罗浮屠（中爪哇）、普兰巴南（日惹）、布伦杜克教堂（中爪哇）、耶稣像（托拉查）。购物：丹那阿邦市场（雅加达）、奇巴杜尤特市场（万隆）、苏卡瓦蒂艺术市场（巴厘）、贝林哈佐市场（日惹）。教育休闲：迷你印尼公园（雅加达）、智慧公园（日惹）、东爪哇公园 2 号、雅加达老城。", "note": "", "qa": []}, {"id": "c103", "kind": "culture", "book": "BIPA 1", "title": "万丹的巴杜伊传统村落", "lines": [{"sp": "", "role": "r", "id": "Suku Baduy di Kabupaten Lebak, Banten, terkenal dengan kearifan lokalnya.", "zh": "", "a": "21651629e67d"}, {"sp": "", "role": "r", "id": "Penduduk laki-laki Suku Baduy bermatapencaharian sebagai petani.", "zh": "", "a": "981a26c507fb"}, {"sp": "", "role": "r", "id": "Sementara itu, penduduk perempuan berada di rumah untuk menenun kain dan memasak.", "zh": "", "a": "c099bc1976ff"}, {"sp": "", "role": "r", "id": "Aktivitas harian tersebut dilakukan tanpa teknologi sedikit pun, semuanya bergantung pada alam.", "zh": "", "a": "07d8e54c7f39"}, {"sp": "", "role": "r", "id": "Penduduk perempuan sejak pagi sudah mandi, mencuci pakaian, dan mencuci piring.", "zh": "", "a": "4e677a73c0b4"}, {"sp": "", "role": "r", "id": "Setelah mandi mereka bersiap untuk memasak.", "zh": "", "a": "f4d7452f913f"}, {"sp": "", "role": "r", "id": "Alat masak yang digunakan masih sangat tradisional, yakni menggunakan kayu bakar dan gerabah.", "zh": "", "a": "e3c217a2eb96"}, {"sp": "", "role": "r", "id": "Usai memasak beberapa perempuan melanjutkan kegiatan dengan menenun kain atau menganyam tas dari rotan.", "zh": "", "a": "7bc7dc846f4f"}, {"sp": "", "role": "r", "id": "Anak-anak Baduy Luar bermain seperti anak-anak pada umumnya.", "zh": "", "a": "54ec8f4b8f36"}, {"sp": "", "role": "r", "id": "Sementara itu, penduduk laki-laki menuju ladang untuk bertani.", "zh": "", "a": "993d39bf6402"}, {"sp": "", "role": "r", "id": "Terkadang penduduk Baduy Dalam dengan kostum serbaputih juga turun ke Baduy Luar.", "zh": "", "a": "7dc9c6a45113"}, {"sp": "", "role": "r", "id": "Jika berkunjung ke Indonesia, jangan lupa singgah di desa adat itu, ya!", "zh": "", "a": "fb87c6a9a7f7"}], "zh": "万丹省勒巴克县的巴杜伊族以本土智慧闻名。男人以务农为生，女人在家织布、做饭，日常生活完全不用科技，一切依靠大自然。妇女们一早就洗澡、洗衣、洗碗，然后准备做饭，用的仍是柴火和陶器这些传统炊具。做完饭，有些妇女接着织布或用藤条编包。外巴杜伊的孩子们像普通孩子一样玩耍，男人们去田里耕作。有时穿着全白服装的内巴杜伊人也会来到外巴杜伊。来印尼的话，别忘了顺路去这个传统村落看看！", "note": "", "qa": []}, {"id": "c104", "kind": "culture", "book": "BIPA 1", "title": "疯狂竹子——马鲁古的传统游戏", "lines": [{"sp": "", "role": "r", "id": "Zaman dahulu masyarakat Indonesia punya hobi berkumpul dan bermain bersama.", "zh": "", "a": "94d603b670f3"}, {"sp": "", "role": "r", "id": "Ada permainan tradisional unik di Maluku yang punya nuansa mistis.", "zh": "", "a": "17df98aa9412"}, {"sp": "", "role": "r", "id": "Namanya bambu gila (baramasuwel).", "zh": "", "a": "cef57223e707"}, {"sp": "", "role": "r", "id": "Pada permainan ini para pemain hanya memeluk dan menahan laju bambu.", "zh": "", "a": "e1dbb232f24c"}, {"sp": "", "role": "r", "id": "Bambu ini bergerak melonjak sesuai kemauan sang pawang.", "zh": "", "a": "8a18dd3d906d"}, {"sp": "", "role": "r", "id": "Pawang bisa menggerakkan bambu dengan kekuatan gaib.", "zh": "", "a": "eb7429590d71"}, {"sp": "", "role": "r", "id": "Sang pawang membakar kemenyan sebelum permainan dimulai.", "zh": "", "a": "180c55be28ca"}, {"sp": "", "role": "r", "id": "Asapnya lalu 'dimasukkan' ke dalam bilah bambu.", "zh": "", "a": "776c433cfd80"}, {"sp": "", "role": "r", "id": "Lalu, secara gaib bambu akan bergerak sendiri.", "zh": "", "a": "5b0c612de51f"}, {"sp": "", "role": "r", "id": "Sang pawang terus mengendalikan bambu dengan mantra, “Hei baramasuwel!” Permainan bambu gila merupakan bentuk kekayaan nusantara.", "zh": "", "a": "eaf2c189bf7b"}], "zh": "过去的印尼人喜欢聚在一起玩。马鲁古有一种带神秘色彩的独特传统游戏，叫“疯狂竹子”（baramasuwel）。玩家只需抱住竹子、挡住它的冲劲，竹子会按巫师的意愿跳动，巫师能用神秘的力量驱动竹子。游戏开始前巫师点燃安息香，把烟“送进”竹片里，竹子就会神奇地自己动起来，玩家必须抱住它。巫师一直念着咒语“嘿，baramasuwel！”来控制竹子。疯狂竹子是印尼群岛丰富文化的一部分。", "note": "", "qa": []}, {"id": "c105", "kind": "culture", "book": "BIPA 1", "title": "古邦人的碰鼻礼", "lines": [{"sp": "", "role": "r", "id": "Di berbagai belahan dunia tradisi penyambutan atau tata cara bersalaman ternyata tidak sama.", "zh": "", "a": "d954b9ddb4ea"}, {"sp": "", "role": "r", "id": "Di Tibet orang-orang bersalaman dengan menjulurkan lidah.", "zh": "", "a": "81598ddcb974"}, {"sp": "", "role": "r", "id": "Di Eropa umumnya orang bersalaman sambil menyentuhkan pipi.", "zh": "", "a": "5af5fb54724b"}, {"sp": "", "role": "r", "id": "Di Nusa Tenggara Timur (NTT) juga ada cara unik bersalaman, yaitu cium hidung.", "zh": "", "a": "c79832ebe353"}, {"sp": "", "role": "r", "id": "Cium hidung umumnya dilakukan oleh masyarakat Sabu.", "zh": "", "a": "ce96e2bddaa7"}, {"sp": "", "role": "r", "id": "Cium hidung dapat dimaknai sebagai ungkapan kasih sayang.", "zh": "", "a": "8780aebd917b"}, {"sp": "", "role": "r", "id": "Tradisi ini konon sudah berlangsung sejak zaman dahulu dan masih terjaga hingga hari ini.", "zh": "", "a": "de18bb2c9572"}, {"sp": "", "role": "r", "id": "Di luar negeri ada beberapa negara yang juga melakukan cium hidung, seperti Alaska, Arab Saudi, dan Selandia Baru.", "zh": "", "a": "bff9ecf6db2e"}], "zh": "世界各地的迎客和问候方式各不相同：西藏人伸舌头问候，欧洲人通常贴脸问候。东努沙登加拉也有一种独特的问候方式——碰鼻礼，主要流行于萨武人。碰鼻表示亲爱之情，据说这一传统自古就有，至今仍保留着。国外也有地方行碰鼻礼，比如阿拉斯加、沙特阿拉伯和新西兰。", "note": "", "qa": []}, {"id": "c106", "kind": "culture", "book": "BIPA 1", "title": "雅加达地铁 MRT", "lines": [{"sp": "", "role": "r", "id": "Moda raya terpadu (MRT) adalah sebuah kereta rel listrik.", "zh": "", "a": "98026e1ccceb"}, {"sp": "", "role": "r", "id": "MRT ada di bawah tanah.", "zh": "", "a": "e4a1fa9a6863"}, {"sp": "", "role": "r", "id": "Transportasi transit cepat ini menghubungkan tempat-tempat di Jakarta.", "zh": "", "a": "90c8e416d3c0"}, {"sp": "", "role": "r", "id": "Fasilitas di sini juga ramah bagi kaum disabilitas.", "zh": "", "a": "ffc0b7fab62e"}, {"sp": "", "role": "r", "id": "Sebab, tempat ini dilengkapi eskalator dan lift.", "zh": "", "a": "247354a12807"}, {"sp": "", "role": "r", "id": "Petugas juga selalu siap sedia untuk membantu para penumpang.", "zh": "", "a": "2da83f37ac19"}, {"sp": "", "role": "r", "id": "Hendak berkunjung ke Jakarta?", "zh": "", "a": "915ebbc3a997"}, {"sp": "", "role": "r", "id": "Jangan lupa naik MRT, ya!", "zh": "", "a": "6627a44ebf27"}], "zh": "综合捷运（MRT）是一种电动轨道列车，在地下运行，这种快速交通工具连接着雅加达各处。这里的设施对残障人士也很友好，配有自动扶梯和电梯，工作人员也随时准备帮助乘客。要去雅加达吗？别忘了坐 MRT 哦！", "note": "", "qa": []}, {"id": "c107", "kind": "culture", "book": "BIPA 1", "title": "蓝眼睛的印尼原住民", "lines": [{"sp": "", "role": "r", "id": "Ternyata ada penduduk asli Indonesia dengan mata biru.", "zh": "", "a": "5314294024a0"}, {"sp": "", "role": "r", "id": "Mereka ada di Sulawesi Tenggara, Maluku Utara, dan Aceh Jaya.", "zh": "", "a": "8668b5ab10e2"}, {"sp": "", "role": "r", "id": "Di Pulau Siompu, Sulawesi Tenggara: pada abad ke-16 Portugis datang ke Indonesia untuk berdagang rempah.", "zh": "", "a": "de9c942156f8"}, {"sp": "", "role": "r", "id": "Bangsa Portugis menikah dengan keturunan bangsawan Wolio.", "zh": "", "a": "40ef5250ea54"}, {"sp": "", "role": "r", "id": "Dari sana lahirlah keturunan bermata biru dan berambut agak pirang.", "zh": "", "a": "8cc1391a395a"}, {"sp": "", "role": "r", "id": "Di Halmahera Timur, Maluku Utara: Suku Lingon adalah salah satu suku minoritas di pulau ini.", "zh": "", "a": "05e33ad9eced"}, {"sp": "", "role": "r", "id": "Keberadaan Suku Lingon terancam akibat konflik dengan suku lain.", "zh": "", "a": "924420e211e4"}, {"sp": "", "role": "r", "id": "Di Lamno, Aceh Jaya: keturunan bermata biru ini awalnya merupakan hasil pernikahan antara tentara Portugis dan warga setempat.", "zh": "", "a": "9565b1516799"}, {"sp": "", "role": "r", "id": "Saat itu, banyak tentara Portugis yang menjadi tawanan Kerajaan Daya.", "zh": "", "a": "cdeb4f363cda"}, {"sp": "", "role": "r", "id": "Mereka tidak bisa kembali pulang ke Eropa, lalu menikah dengan warga lokal setempat.", "zh": "", "a": "e373bec8e31e"}], "zh": "原来印尼也有蓝眼睛的原住民，分布在东南苏拉威西、北马鲁古和亚齐查亚。东南苏拉威西的西翁普岛：16 世纪葡萄牙人来印尼做香料贸易，与沃里奥贵族后代通婚，于是诞生了蓝眼睛、头发略带金色的后代。北马鲁古的东哈马黑拉：林贡族是岛上的少数民族之一，因与其他部族冲突，生存受到威胁。亚齐查亚的拉姆诺：这些蓝眼睛后代最初是葡萄牙士兵与当地人通婚的结果，当时许多葡萄牙士兵成了达亚王国的俘虏，回不了欧洲，就与当地人结了婚。", "note": "", "qa": []}, {"id": "c108", "kind": "culture", "book": "BIPA 2", "title": "Tohpati——印尼著名爵士吉他手", "lines": [{"sp": "", "role": "r", "id": "Tohpati Ario Hutomo atau yang lebih dikenal dengan Tohpati adalah seorang gitaris dan penulis lagu Indonesia.", "zh": "", "a": "b304a590af2e"}, {"sp": "", "role": "r", "id": "Dia lahir di Jakarta, 25 Juli 1971.", "zh": "", "a": "c3113c87eb52"}, {"sp": "", "role": "r", "id": "Tohpati merupakan salah satu gitaris jazz yang terkenal.", "zh": "", "a": "b387b8a6e6d6"}, {"sp": "", "role": "r", "id": "Banyak karyanya memadukan elemen kebudayaan tradisional.", "zh": "", "a": "bf9b8a2df915"}, {"sp": "", "role": "r", "id": "Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "zh": "", "a": "a5ac7094c566"}], "zh": "Tohpati Ario Hutomo，更为人熟知的名字是 Tohpati，是印尼吉他手和词曲作者，1971 年 7 月 25 日生于雅加达。他是著名的爵士吉他手之一，很多作品融合了传统文化元素，这和他在音乐中融合现代与传统的追求是一致的。", "note": "", "qa": []}, {"id": "c109", "kind": "culture", "book": "BIPA 2", "title": "印尼最热门的十种职业", "lines": [{"sp": "", "role": "r", "id": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari.", "zh": "", "a": "293cfc5078f4"}, {"sp": "", "role": "r", "id": "Banyak orang mendapatkan pekerjaan sesuai dengan keinginannya, tetapi banyak juga yang memilih pekerjaan karena populer.", "zh": "", "a": "40d6f33a6b4c"}, {"sp": "", "role": "r", "id": "Berikut sepuluh pekerjaan yang paling populer di Indonesia berdasarkan survei tahun 2018: guru, pegawai bank, pegawai negeri sipil (PNS), tenaga pemasaran (marketing), tenaga kerja Indonesia (TKI), tenaga di bidang teknologi informasi, tenaga di bidang kesehatan seperti dokter atau apoteker, wartawan, akuntan, dan karyawan Badan Usaha Milik Negara (BUMN).", "zh": "", "a": "1cd0e1a76625"}], "zh": "工作是每个人满足日常生活需要的方式。很多人找到了自己想做的工作，也有很多人因为某些职业热门而选择它。根据 2018 年的一项调查，印尼最热门的十种职业是：教师、银行职员、公务员、营销人员、海外劳工、信息技术人员、医疗人员（如医生、药剂师）、记者、会计师和国企员工。", "note": "", "qa": []}, {"id": "c110", "kind": "culture", "book": "BIPA 2", "title": "木梆 Kentongan", "lines": [{"sp": "", "role": "r", "id": "Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan.", "zh": "", "a": "7d0960354893"}, {"sp": "", "role": "r", "id": "Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul.", "zh": "", "a": "d0604ac32707"}, {"sp": "", "role": "r", "id": "Setelah orang-orang berkumpul, pengumuman disampaikan.", "zh": "", "a": "1488763912fb"}, {"sp": "", "role": "r", "id": "Saat ini, kentongan masih dipakai di beberapa daerah di Indonesia.", "zh": "", "a": "843accb79ddf"}], "zh": "古时候，印尼人宣读公告之前会先敲木梆，用来吸引大家注意、召集人们。人们聚齐后再宣布公告。现在印尼一些地区仍在使用木梆。", "note": "", "qa": []}, {"id": "c111", "kind": "culture", "book": "BIPA 2", "title": "网上购物", "lines": [{"sp": "", "role": "r", "id": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring).", "zh": "", "a": "e95fd37e4ee6"}, {"sp": "", "role": "r", "id": "Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah.", "zh": "", "a": "935299d84d04"}, {"sp": "", "role": "r", "id": "Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar.", "zh": "", "a": "f6e8b7592905"}, {"sp": "", "role": "r", "id": "Mereka hanya menunggu barang datang melalui jasa kurir.", "zh": "", "a": "ee8b6f3429ba"}], "zh": "现在很多人喜欢用线上购物应用买东西，他们觉得网购更方便：买家不用去商店或市场，只要等快递把东西送来就行。", "note": "", "qa": []}, {"id": "c112", "kind": "culture", "book": "BIPA 2", "title": "仁当和炒饭", "lines": [{"sp": "", "role": "r", "id": "Cable News Network (CNN) telah merilis daftar lima puluh makanan terenak sedunia lewat 35.000 pilihan makanan di media sosial Facebook.", "zh": "", "a": "ef240a3f70e2"}, {"sp": "", "role": "r", "id": "Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama.", "zh": "", "a": "601c7c23dfc8"}, {"sp": "", "role": "r", "id": "Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "zh": "", "a": "3ba0ce3aa190"}], "zh": "美国有线电视新闻网（CNN）根据脸书上 35,000 个美食投票，发布了全球 50 种最美味食物榜单。结果，西苏门答腊的仁当再次名列第一。有意思的是，除了仁当，炒饭也排在了第二名。", "note": "", "qa": []}, {"id": "c113", "kind": "culture", "book": "BIPA 2", "title": "互助合作 Gotong Royong", "lines": [{"sp": "", "role": "r", "id": "Salah satu budaya masyarakat Indonesia adalah gotong royong.", "zh": "", "a": "244f3fb3511d"}, {"sp": "", "role": "r", "id": "Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu.", "zh": "", "a": "4945e5397f78"}, {"sp": "", "role": "r", "id": "Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu.", "zh": "", "a": "8813b40cfef1"}, {"sp": "", "role": "r", "id": "Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "zh": "", "a": "6b1aad8165f4"}], "zh": "互助合作是印尼社会的一种文化，意思是大家一起干活、互相帮助。这类活动通常在周末进行，人们一起清扫环境、修建公共设施。", "note": "", "qa": []}, {"id": "c114", "kind": "culture", "book": "BIPA 2", "title": "无车日", "lines": [{"sp": "", "role": "r", "id": "Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day).", "zh": "", "a": "27e71171f0c7"}, {"sp": "", "role": "r", "id": "Acara itu biasanya dilaksanakan setiap hari Minggu pagi.", "zh": "", "a": "d7f6ffd0fd29"}, {"sp": "", "role": "r", "id": "Di beberapa jalan tertentu kendaraan bermotor dilarang melintas.", "zh": "", "a": "d2605b418c91"}, {"sp": "", "role": "r", "id": "Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga.", "zh": "", "a": "2c883c5e3b96"}, {"sp": "", "role": "r", "id": "Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda.", "zh": "", "a": "06e344605f72"}, {"sp": "", "role": "r", "id": "Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "zh": "", "a": "dba6a7b91e9f"}], "zh": "印尼有“无车日”（Car Free Day），通常在每个星期天上午。一些特定道路禁止机动车通行，人们在那里聊天、摆摊、散步或运动。最受欢迎的活动之一是骑自行车，因为没有机动车，大家可以悠闲地骑车。", "note": "", "qa": []}, {"id": "c115", "kind": "culture", "book": "BIPA 2", "title": "人力三轮车 Becak", "lines": [{"sp": "", "role": "r", "id": "Becak adalah salah satu sarana transportasi unik di Indonesia.", "zh": "", "a": "4478a128a4e7"}, {"sp": "", "role": "r", "id": "Becak adalah kendaraan roda tiga.", "zh": "", "a": "654ab46560ff"}, {"sp": "", "role": "r", "id": "Pengayuh duduk di belakang, sedangkan penumpang duduk di depan.", "zh": "", "a": "450ea1d6b508"}, {"sp": "", "role": "r", "id": "Becak biasanya ada di depan kompleks perumahan atau di depan pasar.", "zh": "", "a": "b23a4c3dc27c"}, {"sp": "", "role": "r", "id": "Ongkos naik becak berbeda-beda.", "zh": "", "a": "10345a1d436e"}, {"sp": "", "role": "r", "id": "Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "zh": "", "a": "4e5653b9afdd"}], "zh": "Becak 是印尼一种独特的交通工具，是三轮车：车夫坐在后面蹬车，乘客坐在前面。Becak 通常停在住宅小区或市场门口。车费不固定，所以乘客和车夫要先讲好价钱。", "note": "", "qa": []}, {"id": "c116", "kind": "culture", "book": "BIPA 2", "title": "户外拓展 Mancakrida", "lines": [{"sp": "", "role": "r", "id": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida.", "zh": "", "a": "ba132c43e6ed"}, {"sp": "", "role": "r", "id": "Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi.", "zh": "", "a": "136073c65777"}, {"sp": "", "role": "r", "id": "Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan.", "zh": "", "a": "fc5e084cebda"}, {"sp": "", "role": "r", "id": "Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama.", "zh": "", "a": "9a308a80d7a7"}, {"sp": "", "role": "r", "id": "Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "zh": "", "a": "315bb84f232d"}], "zh": "在旅游景点常举办的一种活动是户外拓展，参加者通常是家庭或某单位的员工，目的是锻炼各种能力，重点是团队合作能力。参加者可以边练边玩。", "note": "", "qa": []}, {"id": "c117", "kind": "culture", "book": "BIPA 2", "title": "刮痧 Kerokan", "lines": [{"sp": "", "role": "r", "id": "Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan.", "zh": "", "a": "f212b0955e16"}, {"sp": "", "role": "r", "id": "Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh.", "zh": "", "a": "cb362f0fc433"}, {"sp": "", "role": "r", "id": "Cara itu dipercaya dapat menyembuhkan masuk angin, nyeri otot, perut kembung, mual, sakit kepala, dan meriang.", "zh": "", "a": "bdaad17ba981"}], "zh": "刮痧是印尼的一种传统疗法，用钝器在身上刮擦。人们相信它能治着凉、肌肉酸痛、腹胀、恶心、头痛和发冷发热。", "
