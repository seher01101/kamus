孩子一样玩耍，男人们去田里耕作。有时穿着全白服装的内巴杜伊人也会来到外巴杜伊。来印尼的话，别忘了顺路去这个传统村落看看！", "note": "", "qa": []}, {"id": "c104", "kind": "culture", "book": "BIPA 1", "title": "疯狂竹子——马鲁古的传统游戏", "lines": [{"sp": "", "role": "r", "id": "Zaman dahulu masyarakat Indonesia punya hobi berkumpul dan bermain bersama.", "zh": "以前印尼人喜欢聚在一起玩。", "a": "94d603b670f3"}, {"sp": "", "role": "r", "id": "Ada permainan tradisional unik di Maluku yang punya nuansa mistis.", "zh": "马鲁古有一种独特的传统游戏，带有神秘色彩。", "a": "17df98aa9412"}, {"sp": "", "role": "r", "id": "Namanya bambu gila (baramasuwel).", "zh": "它叫\"疯竹子\"（baramasuwel）。", "a": "cef57223e707"}, {"sp": "", "role": "r", "id": "Pada permainan ini para pemain hanya memeluk dan menahan laju bambu.", "zh": "在这个游戏里，玩家只是抱住竹子、阻止它往前冲。", "a": "e1dbb232f24c"}, {"sp": "", "role": "r", "id": "Bambu ini bergerak melonjak sesuai kemauan sang pawang.", "zh": "竹子会按照法师的意愿跳动。", "a": "8a18dd3d906d"}, {"sp": "", "role": "r", "id": "Pawang bisa menggerakkan bambu dengan kekuatan gaib.", "zh": "法师能用神秘的力量让竹子动起来。", "a": "eb7429590d71"}, {"sp": "", "role": "r", "id": "Sang pawang membakar kemenyan sebelum permainan dimulai.", "zh": "游戏开始前，法师会烧安息香。", "a": "180c55be28ca"}, {"sp": "", "role": "r", "id": "Asapnya lalu 'dimasukkan' ke dalam bilah bambu.", "zh": "然后把烟\"放进\"竹子里。", "a": "776c433cfd80"}, {"sp": "", "role": "r", "id": "Lalu, secara gaib bambu akan bergerak sendiri.", "zh": "接着，竹子就会神秘地自己动起来。", "a": "5b0c612de51f"}, {"sp": "", "role": "r", "id": "Sang pawang terus mengendalikan bambu dengan mantra, “Hei baramasuwel!” Permainan bambu gila merupakan bentuk kekayaan nusantara.", "zh": "法师一边念咒\"嘿，baramasuwel！\"一边控制竹子。疯竹子游戏是印尼文化宝藏的一种。", "a": "eaf2c189bf7b"}], "zh": "过去的印尼人喜欢聚在一起玩。马鲁古有一种带神秘色彩的独特传统游戏，叫“疯狂竹子”（baramasuwel）。玩家只需抱住竹子、挡住它的冲劲，竹子会按巫师的意愿跳动，巫师能用神秘的力量驱动竹子。游戏开始前巫师点燃安息香，把烟“送进”竹片里，竹子就会神奇地自己动起来，玩家必须抱住它。巫师一直念着咒语“嘿，baramasuwel！”来控制竹子。疯狂竹子是印尼群岛丰富文化的一部分。", "note": "", "qa": []}, {"id": "c105", "kind": "culture", "book": "BIPA 1", "title": "古邦人的碰鼻礼", "lines": [{"sp": "", "role": "r", "id": "Di berbagai belahan dunia tradisi penyambutan atau tata cara bersalaman ternyata tidak sama.", "zh": "原来在世界各地，迎接客人的传统和握手的方式都不一样。", "a": "d954b9ddb4ea"}, {"sp": "", "role": "r", "id": "Di Tibet orang-orang bersalaman dengan menjulurkan lidah.", "zh": "在西藏，人们打招呼时会伸出舌头。", "a": "81598ddcb974"}, {"sp": "", "role": "r", "id": "Di Eropa umumnya orang bersalaman sambil menyentuhkan pipi.", "zh": "在欧洲，人们一般贴脸打招呼。", "a": "5af5fb54724b"}, {"sp": "", "role": "r", "id": "Di Nusa Tenggara Timur (NTT) juga ada cara unik bersalaman, yaitu cium hidung.", "zh": "在东努沙登加拉也有独特的打招呼方式，就是碰鼻子。", "a": "c79832ebe353"}, {"sp": "", "role": "r", "id": "Cium hidung umumnya dilakukan oleh masyarakat Sabu.", "zh": "碰鼻礼一般是萨武人的习俗。", "a": "ce96e2bddaa7"}, {"sp": "", "role": "r", "id": "Cium hidung dapat dimaknai sebagai ungkapan kasih sayang.", "zh": "碰鼻子可以理解为表达爱意。", "a": "8780aebd917b"}, {"sp": "", "role": "r", "id": "Tradisi ini konon sudah berlangsung sejak zaman dahulu dan masih terjaga hingga hari ini.", "zh": "据说这个传统从古代就有，一直保留到今天。", "a": "de18bb2c9572"}, {"sp": "", "role": "r", "id": "Di luar negeri ada beberapa negara yang juga melakukan cium hidung, seperti Alaska, Arab Saudi, dan Selandia Baru.", "zh": "国外也有一些地方行碰鼻礼，比如阿拉斯加、沙特阿拉伯和新西兰。", "a": "bff9ecf6db2e"}], "zh": "世界各地的迎客和问候方式各不相同：西藏人伸舌头问候，欧洲人通常贴脸问候。东努沙登加拉也有一种独特的问候方式——碰鼻礼，主要流行于萨武人。碰鼻表示亲爱之情，据说这一传统自古就有，至今仍保留着。国外也有地方行碰鼻礼，比如阿拉斯加、沙特阿拉伯和新西兰。", "note": "", "qa": []}, {"id": "c106", "kind": "culture", "book": "BIPA 1", "title": "雅加达地铁 MRT", "lines": [{"sp": "", "role": "r", "id": "Moda raya terpadu (MRT) adalah sebuah kereta rel listrik.", "zh": "大众捷运（MRT）是一种电气列车。", "a": "98026e1ccceb"}, {"sp": "", "role": "r", "id": "MRT ada di bawah tanah.", "zh": "MRT 在地下。", "a": "e4a1fa9a6863"}, {"sp": "", "role": "r", "id": "Transportasi transit cepat ini menghubungkan tempat-tempat di Jakarta.", "zh": "这种快速交通连接着雅加达的各个地方。", "a": "90c8e416d3c0"}, {"sp": "", "role": "r", "id": "Fasilitas di sini juga ramah bagi kaum disabilitas.", "zh": "这里的设施对残障人士也很友好。", "a": "ffc0b7fab62e"}, {"sp": "", "role": "r", "id": "Sebab, tempat ini dilengkapi eskalator dan lift.", "zh": "因为这里配有自动扶梯和电梯。", "a": "247354a12807"}, {"sp": "", "role": "r", "id": "Petugas juga selalu siap sedia untuk membantu para penumpang.", "zh": "工作人员也随时准备帮助乘客。", "a": "2da83f37ac19"}, {"sp": "", "role": "r", "id": "Hendak berkunjung ke Jakarta?", "zh": "想去雅加达玩吗？", "a": "915ebbc3a997"}, {"sp": "", "role": "r", "id": "Jangan lupa naik MRT, ya!", "zh": "别忘了坐 MRT 哦！", "a": "6627a44ebf27"}], "zh": "综合捷运（MRT）是一种电动轨道列车，在地下运行，这种快速交通工具连接着雅加达各处。这里的设施对残障人士也很友好，配有自动扶梯和电梯，工作人员也随时准备帮助乘客。要去雅加达吗？别忘了坐 MRT 哦！", "note": "", "qa": []}, {"id": "c107", "kind": "culture", "book": "BIPA 1", "title": "蓝眼睛的印尼原住民", "lines": [{"sp": "", "role": "r", "id": "Ternyata ada penduduk asli Indonesia dengan mata biru.", "zh": "原来印尼有蓝眼睛的原住民。", "a": "5314294024a0"}, {"sp": "", "role": "r", "id": "Mereka ada di Sulawesi Tenggara, Maluku Utara, dan Aceh Jaya.", "zh": "他们在东南苏拉威西、北马鲁古和亚齐查亚。", "a": "8668b5ab10e2"}, {"sp": "", "role": "r", "id": "Di Pulau Siompu, Sulawesi Tenggara: pada abad ke-16 Portugis datang ke Indonesia untuk berdagang rempah.", "zh": "在东南苏拉威西的 Siompu 岛：16世纪葡萄牙人来到印尼做香料生意。", "a": "de9c942156f8"}, {"sp": "", "role": "r", "id": "Bangsa Portugis menikah dengan keturunan bangsawan Wolio.", "zh": "葡萄牙人和 Wolio 贵族的后代通婚。", "a": "40ef5250ea54"}, {"sp": "", "role": "r", "id": "Dari sana lahirlah keturunan bermata biru dan berambut agak pirang.", "zh": "由此诞生了蓝眼睛、头发略带金色的后代。", "a": "8cc1391a395a"}, {"sp": "", "role": "r", "id": "Di Halmahera Timur, Maluku Utara: Suku Lingon adalah salah satu suku minoritas di pulau ini.", "zh": "在北马鲁古的东哈马黑拉：Lingon 族是这个岛上的少数民族之一。", "a": "05e33ad9eced"}, {"sp": "", "role": "r", "id": "Keberadaan Suku Lingon terancam akibat konflik dengan suku lain.", "zh": "由于和其他民族发生冲突，Lingon 族的生存受到威胁。", "a": "924420e211e4"}, {"sp": "", "role": "r", "id": "Di Lamno, Aceh Jaya: keturunan bermata biru ini awalnya merupakan hasil pernikahan antara tentara Portugis dan warga setempat.", "zh": "在亚齐查亚的 Lamno：这些蓝眼睛的后代最初是葡萄牙士兵和当地居民通婚的结果。", "a": "9565b1516799"}, {"sp": "", "role": "r", "id": "Saat itu, banyak tentara Portugis yang menjadi tawanan Kerajaan Daya.", "zh": "当时，很多葡萄牙士兵成了 Daya 王国的俘虏。", "a": "cdeb4f363cda"}, {"sp": "", "role": "r", "id": "Mereka tidak bisa kembali pulang ke Eropa, lalu menikah dengan warga lokal setempat.", "zh": "他们回不了欧洲，于是和当地人结了婚。", "a": "e373bec8e31e"}], "zh": "原来印尼也有蓝眼睛的原住民，分布在东南苏拉威西、北马鲁古和亚齐查亚。东南苏拉威西的西翁普岛：16 世纪葡萄牙人来印尼做香料贸易，与沃里奥贵族后代通婚，于是诞生了蓝眼睛、头发略带金色的后代。北马鲁古的东哈马黑拉：林贡族是岛上的少数民族之一，因与其他部族冲突，生存受到威胁。亚齐查亚的拉姆诺：这些蓝眼睛后代最初是葡萄牙士兵与当地人通婚的结果，当时许多葡萄牙士兵成了达亚王国的俘虏，回不了欧洲，就与当地人结了婚。", "note": "", "qa": []}, {"id": "c108", "kind": "culture", "book": "BIPA 2", "title": "Tohpati——印尼著名爵士吉他手", "lines": [{"sp": "", "role": "r", "id": "Tohpati Ario Hutomo atau yang lebih dikenal dengan Tohpati adalah seorang gitaris dan penulis lagu Indonesia.", "zh": "Tohpati Ario Hutomo，大家更熟悉的名字是 Tohpati，是一位印尼吉他手和词曲作者。", "a": "b304a590af2e"}, {"sp": "", "role": "r", "id": "Dia lahir di Jakarta, 25 Juli 1971.", "zh": "他1971年7月25日出生于雅加达。", "a": "c3113c87eb52"}, {"sp": "", "role": "r", "id": "Tohpati merupakan salah satu gitaris jazz yang terkenal.", "zh": "Tohpati 是著名的爵士吉他手之一。", "a": "b387b8a6e6d6"}, {"sp": "", "role": "r", "id": "Banyak karyanya memadukan elemen kebudayaan tradisional.", "zh": "他的很多作品融合了传统文化元素。", "a": "bf9b8a2df915"}, {"sp": "", "role": "r", "id": "Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "zh": "这和他努力在音乐中融合现代与传统元素是一致的。", "a": "a5ac7094c566"}], "zh": "Tohpati Ario Hutomo，更为人熟知的名字是 Tohpati，是印尼吉他手和词曲作者，1971 年 7 月 25 日生于雅加达。他是著名的爵士吉他手之一，很多作品融合了传统文化元素，这和他在音乐中融合现代与传统的追求是一致的。", "note": "", "qa": []}, {"id": "c109", "kind": "culture", "book": "BIPA 2", "title": "印尼最热门的十种职业", "lines": [{"sp": "", "role": "r", "id": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari.", "zh": "工作是每个人满足日常生活需要的必需。", "a": "293cfc5078f4"}, {"sp": "", "role": "r", "id": "Banyak orang mendapatkan pekerjaan sesuai dengan keinginannya, tetapi banyak juga yang memilih pekerjaan karena populer.", "zh": "很多人找到了自己想做的工作，但也有很多人因为热门才选择某个职业。", "a": "40d6f33a6b4c"}, {"sp": "", "role": "r", "id": "Berikut sepuluh pekerjaan yang paling populer di Indonesia berdasarkan survei tahun 2018: guru, pegawai bank, pegawai negeri sipil (PNS), tenaga pemasaran (marketing), tenaga kerja Indonesia (TKI), tenaga di bidang teknologi informasi, tenaga di bidang kesehatan seperti dokter atau apoteker, wartawan, akuntan, dan karyawan Badan Usaha Milik Negara (BUMN).", "zh": "根据2018年的调查，印尼最热门的十种职业是：教师、银行职员、公务员、市场营销人员、印尼海外劳工、信息技术人员、医疗人员（如医生或药剂师）、记者、会计和国企员工。", "a": "1cd0e1a76625"}], "zh": "工作是每个人满足日常生活需要的方式。很多人找到了自己想做的工作，也有很多人因为某些职业热门而选择它。根据 2018 年的一项调查，印尼最热门的十种职业是：教师、银行职员、公务员、营销人员、海外劳工、信息技术人员、医疗人员（如医生、药剂师）、记者、会计师和国企员工。", "note": "", "qa": []}, {"id": "c110", "kind": "culture", "book": "BIPA 2", "title": "木梆 Kentongan", "lines": [{"sp": "", "role": "r", "id": "Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan.", "zh": "以前，在宣读通知之前，印尼人会先敲木梆。", "a": "7d0960354893"}, {"sp": "", "role": "r", "id": "Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul.", "zh": "木梆的作用是吸引大家的注意，让人们聚过来。", "a": "d0604ac32707"}, {"sp": "", "role": "r", "id": "Setelah orang-orang berkumpul, pengumuman disampaikan.", "zh": "大家聚齐后，再宣布通知。", "a": "1488763912fb"}, {"sp": "", "role": "r", "id": "Saat ini, kentongan masih dipakai di beberapa daerah di Indonesia.", "zh": "现在，印尼一些地区还在用木梆。", "a": "843accb79ddf"}], "zh": "古时候，印尼人宣读公告之前会先敲木梆，用来吸引大家注意、召集人们。人们聚齐后再宣布公告。现在印尼一些地区仍在使用木梆。", "note": "", "qa": []}, {"id": "c111", "kind": "culture", "book": "BIPA 2", "title": "网上购物", "lines": [{"sp": "", "role": "r", "id": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring).", "zh": "现在很多人喜欢用网购 App 买东西。", "a": "e95fd37e4ee6"}, {"sp": "", "role": "r", "id": "Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah.", "zh": "他们觉得用网购 App 买东西更方便。", "a": "935299d84d04"}, {"sp": "", "role": "r", "id": "Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar.", "zh": "有了这种 App，买家不用去商店或市场。", "a": "f6e8b7592905"}, {"sp": "", "role": "r", "id": "Mereka hanya menunggu barang datang melalui jasa kurir.", "zh": "他们只要等快递把东西送来就行。", "a": "ee8b6f3429ba"}], "zh": "现在很多人喜欢用线上购物应用买东西，他们觉得网购更方便：买家不用去商店或市场，只要等快递把东西送来就行。", "note": "", "qa": []}, {"id": "c112", "kind": "culture", "book": "BIPA 2", "title": "仁当和炒饭", "lines": [{"sp": "", "role": "r", "id": "Cable News Network (CNN) telah merilis daftar lima puluh makanan terenak sedunia lewat 35.000 pilihan makanan di media sosial Facebook.", "zh": "美国有线电视新闻网（CNN）通过脸书上35000份美食投票，发布了世界最美味的五十种食物榜单。", "a": "ef240a3f70e2"}, {"sp": "", "role": "r", "id": "Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama.", "zh": "结果，西苏门答腊的仁当再次排名第一。", "a": "601c7c23dfc8"}, {"sp": "", "role": "r", "id": "Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "zh": "有意思的是，CNN 公布的不只有仁当，炒饭也排在了第二名。", "a": "3ba0ce3aa190"}], "zh": "美国有线电视新闻网（CNN）根据脸书上 35,000 个美食投票，发布了全球 50 种最美味食物榜单。结果，西苏门答腊的仁当再次名列第一。有意思的是，除了仁当，炒饭也排在了第二名。", "note": "", "qa": []}, {"id": "c113", "kind": "culture", "book": "BIPA 2", "title": "互助合作 Gotong Royong", "lines": [{"sp": "", "role": "r", "id": "Salah satu budaya masyarakat Indonesia adalah gotong royong.", "zh": "印尼人的文化之一是互助合作（gotong royong）。", "a": "244f3fb3511d"}, {"sp": "", "role": "r", "id": "Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu.", "zh": "gotong royong 的意思是一起干活、互相帮助。", "a": "4945e5397f78"}, {"sp": "", "role": "r", "id": "Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu.", "zh": "互助活动通常在周末进行。", "a": "8813b40cfef1"}, {"sp": "", "role": "r", "id": "Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "zh": "人们通常一起打扫环境、修建公共设施。", "a": "6b1aad8165f4"}], "zh": "互助合作是印尼社会的一种文化，意思是大家一起干活、互相帮助。这类活动通常在周末进行，人们一起清扫环境、修建公共设施。", "note": "", "qa": []}, {"id": "c114", "kind": "culture", "book": "BIPA 2", "title": "无车日", "lines": [{"sp": "", "role": "r", "id": "Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day).", "zh": "印尼有无车日（Car Free Day）。", "a": "27e71171f0c7"}, {"sp": "", "role": "r", "id": "Acara itu biasanya dilaksanakan setiap hari Minggu pagi.", "zh": "这个活动通常在每个星期天早上举行。", "a": "d7f6ffd0fd29"}, {"sp": "", "role": "r", "id": "Di beberapa jalan tertentu kendaraan bermotor dilarang melintas.", "zh": "在某些路段禁止机动车通行。", "a": "d2605b418c91"}, {"sp": "", "role": "r", "id": "Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga.", "zh": "在那里，有人聊天、摆摊、散步或者运动。", "a": "2c883c5e3b96"}, {"sp": "", "role": "r", "id": "Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda.", "zh": "这个活动上大家最喜欢的事之一是骑自行车。", "a": "06e344605f72"}, {"sp": "", "role": "r", "id": "Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "zh": "因为没有机动车，他们可以悠闲地骑车。", "a": "dba6a7b91e9f"}], "zh": "印尼有“无车日”（Car Free Day），通常在每个星期天上午。一些特定道路禁止机动车通行，人们在那里聊天、摆摊、散步或运动。最受欢迎的活动之一是骑自行车，因为没有机动车，大家可以悠闲地骑车。", "note": "", "qa": []}, {"id": "c115", "kind": "culture", "book": "BIPA 2", "title": "人力三轮车 Becak", "lines": [{"sp": "", "role": "r", "id": "Becak adalah salah satu sarana transportasi unik di Indonesia.", "zh": "三轮车（becak）是印尼一种独特的交通工具。", "a": "4478a128a4e7"}, {"sp": "", "role": "r", "id": "Becak adalah kendaraan roda tiga.", "zh": "becak 是三个轮子的车。", "a": "654ab46560ff"}, {"sp": "", "role": "r", "id": "Pengayuh duduk di belakang, sedangkan penumpang duduk di depan.", "zh": "车夫坐在后面，乘客坐在前面。", "a": "450ea1d6b508"}, {"sp": "", "role": "r", "id": "Becak biasanya ada di depan kompleks perumahan atau di depan pasar.", "zh": "becak 通常停在住宅区门口或市场门口。", "a": "b23a4c3dc27c"}, {"sp": "", "role": "r", "id": "Ongkos naik becak berbeda-beda.", "zh": "坐三轮车的价钱不一样。", "a": "10345a1d436e"}, {"sp": "", "role": "r", "id": "Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "zh": "所以，乘客和车夫要先讲好价。", "a": "4e5653b9afdd"}], "zh": "Becak 是印尼一种独特的交通工具，是三轮车：车夫坐在后面蹬车，乘客坐在前面。Becak 通常停在住宅小区或市场门口。车费不固定，所以乘客和车夫要先讲好价钱。", "note": "", "qa": []}, {"id": "c116", "kind": "culture", "book": "BIPA 2", "title": "户外拓展 Mancakrida", "lines": [{"sp": "", "role": "r", "id": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida.", "zh": "在旅游景点常举办的活动之一是户外拓展训练（mancakrida）。", "a": "ba132c43e6ed"}, {"sp": "", "role": "r", "id": "Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi.", "zh": "参加这种活动的通常是家庭，或者某个公司、机构的员工。", "a": "136073c65777"}, {"sp": "", "role": "r", "id": "Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan.", "zh": "这个活动是为了训练各种技能。", "a": "fc5e084cebda"}, {"sp": "", "role": "r", "id": "Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama.", "zh": "活动的重点是团队合作能力。", "a": "9a308a80d7a7"}, {"sp": "", "role": "r", "id": "Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "zh": "在活动中，参加者可以边玩边练。", "a": "315bb84f232d"}], "zh": "在旅游景点常举办的一种活动是户外拓展，参加者通常是家庭或某单位的员工，目的是锻炼各种能力，重点是团队合作能力。参加者可以边练边玩。", "note": "", "qa": []}, {"id": "c117", "kind": "culture", "book": "BIPA 2", "title": "刮痧 Kerokan", "lines": [{"sp": "", "role": "r", "id": "Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan.", "zh": "印尼的传统疗法之一是刮痧（kerokan）。", "a": "f212b0955e16"}, {"sp": "", "role": "r", "id": "Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh.", "zh": "刮痧是一种用钝的东西在身上刮的治疗方法。", "a": "cb362f0fc433"}, {"sp": "", "role": "r", "id": "Cara itu dipercaya dapat menyembuhkan masuk angin, nyeri otot, perut kembung, mual, sakit kepala, dan meriang.", "zh": "人们相信这种方法能治伤风、肌肉酸痛、肚子胀、恶心、头疼和发冷。", "a": "bdaad17ba981"}], "zh": "刮痧是印尼的一种传统疗法，用钝器在身上刮擦。人们相信它能治着凉、肌肉酸痛、腹胀、恶心、头痛和发冷发热。", "note": "", "qa": []}, {"id": "e118", "kind": "exam", "book": "扩充题库", "title": "口语对答 · 工作 Pekerjaan", "lines": [{"sp": "考官", "role": "q", "id": "Apa pekerjaan Anda?", "zh": "你是做什么工作的？", "a": "961a38e07431"}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai staf keuangan di perusahaan.", "zh": "我在公司做财务。", "a": "27e45e47d4a8"}, {"sp": "考官", "role": "q", "id": "Di mana Anda bekerja?", "zh": "你在哪里工作？", "a": "67f6175476b0"}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja di kawasan industri di Morowali.", "zh": "我在莫罗瓦利的工业园区工作。", "a": "73bbdfdc3d6b"}, {"sp": "考官", "role": "q", "id": "Pukul berapa Anda mulai bekerja?", "zh": "你几点开始上班？", "a": "8ba3b0a01cf3"}, {"sp": "参考回答", "role": "a", "id": "Saya mulai bekerja pukul delapan pagi.", "zh": "我早上八点开始上班。", "a": "10810e28654a"}, {"sp": "考官", "role": "q", "id": "Apakah pekerjaan Anda sibuk?", "zh": "你的工作忙吗？", "a": "732a1e9e06f3"}, {"sp": "参考回答", "role": "a", "id": "Ya, cukup sibuk, terutama pada awal bulan.", "zh": "是的，挺忙的，尤其是月初。", "a": "fb70f09e0858"}, {"sp": "考官", "role": "q", "id": "Apakah Anda suka pekerjaan Anda?", "zh": "你喜欢你的工作吗？", "a": "8f095eaf772b"}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka karena saya bisa belajar banyak hal.", "zh": "喜欢，因为我能学到很多东西。", "a": "afbed9c27cc4"}, {"sp": "考官", "role": "q", "id": "Bagaimana rekan kerja Anda?", "zh": "你的同事怎么样？", "a": "9b08f0633ff8"}, {"sp": "参考回答", "role": "a", "id": "Rekan kerja saya baik dan suka membantu.", "zh": "我的同事人很好，也乐于帮忙。", "a": "aef86cd405ad"}], "zh": "", "note": "", "qa": []}, {"id": "e119", "kind": "exam", "book": "扩充题库", "title": "口语对答 · 学印尼语 Belajar Bahasa Indonesia", "lines": [{"sp": "考官", "role": "q", "id": "Sudah berapa lama Anda belajar bahasa Indonesia?", "zh": "你学印尼语多久了？", "a": "f1419cd08f58"}, {"sp": "参考回答", "role": "a", "id": "Saya sudah belajar bahasa Indonesia selama tiga bulan.", "zh": "我学印尼语三个月了。", "a": "457bbc362dd0"}, {"sp": "考官", "role": "q", "id": "Mengapa Anda belajar bahasa Indonesia?", "zh": "你为什么学印尼语？", "a": "5ce06bbd7d60"}, {"sp": "参考回答", "role": "a", "id": "Karena saya bekerja di Indonesia dan ingin berbicara dengan rekan kerja.", "zh": "因为我在印尼工作，想和同事交流。", "a": "37d77809980e"}, {"sp": "考官", "role": "q", "id": "Di mana Anda belajar bahasa Indonesia?", "zh": "你在哪里学印尼语？", "a": "86af33267394"}, {"sp": "参考回答", "role": "a", "id": "Saya belajar di kelas perusahaan dan juga belajar sendiri di rumah.", "zh": "我在公司的课上学，也在家自学。", "a": "8d0d4bda7605"}, {"sp": "考官", "role": "q", "id": "Menurut Anda, bahasa Indonesia sulit atau mudah?", "zh": "你觉得印尼语难还是容易？", "a": "f147106ff08b"}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, bahasa Indonesia tidak terlalu sulit, tetapi kosakatanya banyak.", "zh": "我觉得印尼语不太难，但是词汇很多。", "a": "b5c5551dc831"}, {"sp": "考官", "role": "q", "id": "Bagaimana cara Anda belajar bahasa Indonesia?", "zh": "你怎么学印尼语？", "a": "0b14f6c012b2"}, {"sp": "参考回答", "role": "a", "id": "Saya menghafal kosakata setiap pagi dan mendengarkan percakapan.", "zh": "我每天早上背单词，还听对话。", "a": "8ad2d1e6e71d"}, {"sp": "考官", "role": "q", "id": "Apakah Anda sering berbicara bahasa Indonesia?", "zh": "你经常说印尼语吗？", "a": "8cc73ea227ff"}, {"sp": "参考回答", "role": "a", "id": "Ya, saya sering berbicara dengan teman kantor saya.", "zh": "是的，我经常和办公室的同事说。", "a": "d743f9e96fd4"}], "zh": "", "note": "", "qa": []}, {"id": "e120", "kind": "exam", "book": "扩充题库", "title": "口语对答 · 在印尼生活 Tinggal di Indonesia", "lines": [{"sp": "考官", "role": "q", "id": "Sudah berapa lama Anda tinggal di Indonesia?", "zh": "你在印尼住了多久了？", "a": "978c27bf1e23"}, {"sp": "参考回答", "role": "a", "id": "Saya sudah tinggal di Indonesia selama satu tahun.", "zh": "我在印尼住了一年了。", "a": "516f152a4aca"}, {"sp": "考官", "role": "q", "id": "Apakah Anda suka tinggal di Indonesia?", "zh": "你喜欢住在印尼吗？", "a": "c1e02062b89f"}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka karena orang Indonesia ramah.", "zh": "喜欢，因为印尼人很友善。", "a": "5741692f1cd1"}, {"sp": "考官", "role": "q", "id": "Apa perbedaan Indonesia dan Tiongkok?", "zh": "印尼和中国有什么不同？", "a": "fb9b6bc7d062"}, {"sp": "参考回答", "role": "a", "id": "Cuaca di Indonesia lebih panas dan makanannya lebih pedas.", "zh": "印尼天气更热，食 function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800);
}
function drawMode(anim) {
  const b = $("#mode");
  b.innerHTML = `<span class="${anim ? "pop" : ""}">${MODES[mode][2]}</span>`;
  b.setAttribute("aria-pressed", mode !== "seq"); b.setAttribute("aria-label", "播放模式：" + MODES[mode][0]);
  $("#menu").innerHTML = `<div class="h">播放模式</div>` + Object.entries(MODES).map(([k, m], i) =>
    `<button class="mi" type="button" role="menuitemradio" style="--i:${i}" data-mode="${k}" aria-checked="${k === mode}"><span class="ic">${m[2]}</span><span><b>${m[0]}</b><small>${m[1]}</small></span><svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`).join("");
}
function menu(open) { $("#menu").classList.toggle("open", open); $("#scrim").hidden = !open; $("#mode").setAttribute("aria-expanded", open); }
$("#mode").addEventListener("click", () => menu(!$("#menu").classList.contains("open")));
$("#scrim").addEventListener("click", () => menu(false));
$("#menu").addEventListener("click", e => {
  const b = e.target.closest("[data-mode]"); if (!b) return;
  mode = b.dataset.mode; store.mode = mode; save();
  $("#menu").querySelectorAll(".mi").forEach(x => x.setAttribute("aria-checked", x === b));
  setTimeout(() => { menu(false); drawMode(true); toast(MODES[mode][0]); }, 180);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") menu(false); });
drawMode(false);
const SPEEDS = [[0.6, "很慢"], [0.72, "慢"], [0.85, "正常"], [1, "快"]];
let spI = SPEEDS.findIndex(x => String(x[0]) === String(store.speed2)); if (spI < 0) spI = 2;
$("#speed").textContent = SPEEDS[spI][1];
$("#speed").addEventListener("click", () => { spI = (spI + 1) % SPEEDS.length; $("#speed").innerHTML = `<span class="pop">${SPEEDS[spI][1]}</span>`; au.playbackRate = SPEEDS[spI][0]; store.speed2 = SPEEDS[spI][0]; save(); });
au.preservesPitch = true;

const start = location.hash.slice(1);
renderList();
if (start && DATA.some(x => x.id === start)) openItem(start, false);
listenSync();
</script>
</html>
