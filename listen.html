ini?", "zh": "你在这里工作多久了？", "a": "6752b963b433", "za": "10b62411cac3", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya sudah bekerja di sini selama dua tahun.", "zh": "我在这里工作两年了。", "a": "fe79bde8a1e2", "za": "27ac4641c5e0"}, {"sp": "考官", "role": "q", "id": "Apa pekerjaan kamu setiap hari?", "zh": "你每天的工作是什么？", "a": "283de85af29b", "za": "de0c7974ce99", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Setiap hari saya membuat laporan keuangan di kantor.", "zh": "我每天在办公室做财务报表。", "a": "03d92c1e19fc", "za": "41a60b05569b"}, {"sp": "考官", "role": "q", "id": "Apa pekerjaan Anda?", "zh": "你的职业是什么？", "a": "961a38e07431", "za": "2e16304018a8", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai staf keuangan.", "zh": "我是财务人员。", "a": "190dfb43d749", "za": "885326965c97"}, {"sp": "考官", "role": "q", "id": "Apa yang biasanya Anda lakukan di tempat kerja?", "zh": "你在工作的地方通常做什么？", "a": "3111bd152676", "za": "7526d9cd39e6", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Di tempat kerja, saya biasanya membuat laporan dan memeriksa dokumen.", "zh": "在单位我通常做报表、检查文件。", "a": "bce3bf1a06e3", "za": "a1c165de89e2"}, {"sp": "考官", "role": "q", "id": "Malam ini ada acara apa? Kami ada acara perusahaan Jumat sore ini.", "zh": "今晚有什么活动？我们周五下午有公司活动。", "a": "ab6a1e6ffca0", "an": {"p": [["Malam ini", "今晚"], ["ada", "有"], ["acara", "活动"], ["apa", "什么"], ["Kami", "我们"], ["acara perusahaan", "公司活动"], ["Jumat", "星期五"], ["sore", "下午"], ["ini", "这个"]], "b": "", "g": "结构：问句 Malam ini ada acara apa?（今晚有什么活动？）；陈述句 Kami ada acara perusahaan Jumat sore ini（我们这周五下午有公司活动）。ada 在这里 = 有。Jumat sore ini = 这个周五的下午。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Malam ini saya tidak ada acara. Acara perusahaan kalian pasti seru.", "zh": "今晚我没有活动。你们的公司活动一定很有趣。", "a": "def840432e49", "an": {"p": [["Malam ini", "今晚"], ["saya", "我"], ["tidak ada", "没有"], ["acara", "活动"], ["Acara perusahaan", "公司活动"], ["kalian", "你们"], ["pasti", "一定"], ["seru", "精彩有趣"]], "b": "", "g": "结构：时间 + 主语 + tidak ada + 名词；名词短语 + pasti + 形容词。tidak ada = 没有。kalian = 你们，比 Anda 更随意。seru 是口语“有趣、热闹”。"}}, {"sp": "考官", "role": "q", "id": "Pertama, bolehkah Anda menyebutkan nama lengkap Anda?", "zh": "首先，你可以说一下你的全名吗？", "a": "5c27a74a6218", "an": {"p": [["Pertama", "首先"], ["bolehkah", "可以……吗"], ["Anda", "您"], ["menyebutkan", "说出"], ["nama lengkap", "全名"], ["Anda", "您的"]], "b": "bolehkah = boleh + -kah（疑问）；menyebutkan = meN- + sebut + -kan（vt. 说出）；pertama = per- + tama", "g": "结构：顺序词 + bolehkah + 主语 + 动词 + 宾语？bolehkah……是礼貌的请求，“可以……吗？”。nama lengkap = 完整的名字（全名）。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Boleh. Nama lengkap saya 【……】.", "zh": "可以。我的全名是【……】。", "a": "1ef7ce8a6f0e", "an": {"p": [["Boleh", "可以"], ["Nama lengkap", "全名"], ["saya", "我的"]], "b": "", "g": "结构：Boleh（可以）+ 名词短语 + 名字。【……】换成你自己的全名。Nama lengkap saya + 名字 = 我的全名是……，不需要 adalah。"}}, {"sp": "考官", "role": "q", "id": "Dari mana asal Anda?", "zh": "你来自哪里？", "a": "4285ee178545", "an": {"p": [["Dari mana", "从哪里"], ["asal", "来源、籍贯"], ["Anda", "您的"]], "b": "asal = n. 起源、籍贯", "g": "结构：Dari mana + asal + 人？问“来自哪里”。Dari mana asal Anda? ≈ Anda berasal dari mana?"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya berasal dari Beijing.", "zh": "我来自北京。", "a": "3989999e6d73", "an": {"p": [["Saya", "我"], ["berasal", "来自"], ["dari", "从"], ["Beijing", "北京"]], "b": "berasal = ber- + asal（vi. 来自）", "g": "结构：主语 + berasal dari + 地名。berasal dari = 来自、出生于。也可说 Asal saya dari Beijing。"}}, {"sp": "考官", "role": "q", "id": "Apa pekerjaan atau profesi Anda?", "zh": "你的工作或职业是什么？", "a": "cd58403370e2", "an": {"p": [["Apa", "什么"], ["pekerjaan", "工作"], ["atau", "或者"], ["profesi", "职业"], ["Anda", "您的"]], "b": "pekerjaan = pe- + kerja + -an（n. 工作）", "g": "结构：Apa + 名词（pekerjaan atau profesi）+ 人？atau 连接两个近义词，意思都是“职业”。回答：Saya bekerja sebagai……（我的职业是……）。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai karyawan di sebuah perusahaan.", "zh": "我在一家公司当职员。", "a": "231422390e7d", "an": {"p": [["Saya", "我"], ["bekerja", "工作"], ["sebagai", "作为"], ["karyawan", "职员"], ["di", "在"], ["sebuah", "一家"], ["perusahaan", "公司"]], "b": "bekerja = ber- + kerja（vi. 工作）；perusahaan = pe- + usaha + -an（n. 公司）；karyawan = kar- + yawan", "g": "结构：主语 + bekerja sebagai + 职业 + di + 单位。sebagai = 作为；sebuah + 名词 = 一个/一家。"}}, {"sp": "考官", "role": "q", "id": "Kamu sudah berapa lama bekerja di sini?", "zh": "你在这里工作多久了？", "a": "2a9cd1440921", "za": "10b62411cac3", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya sudah bekerja di sini selama tiga tahun.", "zh": "我在这里工作三年了。", "a": "b0a845064715", "za": "70b90e7d6a91"}, {"sp": "考官", "role": "q", "id": "Kamu bekerja di departemen mana? / Apa pekerjaan kamu?", "zh": "你在哪个部门工作？/ 你的岗位是什么？", "a": "70c3baa14a8f", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja di departemen keuangan, saya staf akuntansi.", "zh": "我在财务部工作，是会计。", "a": "52cd169fca8d", "za": "cc78339ba09d"}, {"sp": "考官", "role": "q", "id": "Kapan kamu cuti?", "zh": "你什么时候休假？", "a": "8817ed5b5682", "za": "b8abffd2da2d", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya akan cuti bulan depan.", "zh": "我下个月休假。", "a": "e010e02db744", "za": "6ec350d645f3"}, {"sp": "考官", "role": "q", "id": "Anda berasal dari mana?", "zh": "你来自哪里？", "a": "e062b94fb0bb", "za": "005a1e130e56", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya berasal dari 【……】, Tiongkok.", "zh": "我来自中国【……】。", "a": "a5ed3c4ba592"}, {"sp": "考官", "role": "q", "id": "Sebutkan nama lengkap kamu!", "zh": "请说出你的全名。", "a": "10a46180344a", "za": "efe2e01e90cf", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Nama lengkap saya 【……】.", "zh": "我的全名是【……】。", "a": "d214789b5636"}, {"sp": "考官", "role": "q", "id": "Apakah Anda pergi ke kampus atau kantor setiap hari?", "zh": "你每天去学校或办公室吗？", "a": "9ab3c0f11900", "za": "2cc034365033", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Ya, saya pergi ke kantor setiap hari kecuali hari Minggu.", "zh": "是的，除了星期天我每天都去办公室。", "a": "02e2722907db", "za": "8fa718d0cbaa"}, {"sp": "考官", "role": "q", "id": "Bagaimana kamu pergi ke tempat kerja?", "zh": "你怎么去上班？", "a": "f2a4d4e8940e", "za": "73d80b8461fe", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya pergi ke tempat kerja naik mobil kantor. / Saya jalan kaki.", "zh": "我坐公司的车去上班。/ 我走路去。", "a": "ee13b7d2a4d3"}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "gt0", "kind": "trans", "book": "武功秘籍", "title": "职场办公室 Kantor", "lines": [{"sp": "", "role": "t", "id": "Saya tidak bisa pergi bersama mereka karena hari ini saya masih harus bekerja.", "zh": "我不能和他们一起去，因为我今天还要工作。", "a": "c03b13873d1d", "za": "92f05a2371be", "an": {"p": [["tidak bisa", "不能"], ["pergi", "去"], ["bersama mereka", "和他们一起"], ["karena", "因为"], ["hari ini", "今天"], ["masih harus", "还得"], ["bekerja", "工作"]], "b": "", "g": "tidak bisa + 动词 = 不能……。masih harus 把“仍然”和“必须”叠加。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Dia ingin bekerja di Indonesia setelah lulus.", "zh": "他想毕业以后在印尼工作。", "a": "67ef216b9a5c", "za": "78699218257e", "an": {"p": [["Dia", "他"], ["ingin", "想"], ["bekerja", "工作"], ["di Indonesia", "在印度尼西亚"], ["setelah", "之后"], ["lulus", "毕业"]], "b": "lulus 毕业 / 通过", "g": "ingin + 动词 = 想做……。setelah + 动词 = ……之后。lulus 单独使用就是“毕业”。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Saya sedang mencari dokumen yang diperlukan untuk pekerjaan hari ini.", "zh": "我正在找今天工作需要的文件。", "a": "b8b64daf835c", "za": "5358390bbabc", "an": {"p": [["sedang", "正在"], ["mencari", "寻找"], ["dokumen", "文件"], ["yang diperlukan", "需要的"], ["untuk pekerjaan hari ini", "用于今天的工作"]], "b": "mencari = cari + meN-；pekerjaan = kerja + pe-…-an", "g": "sedang + 动词 = 正在做……。yang + 被动 = “被需要的”，修饰 dokumen。pekerjaan = 工作（名词），bekerja = 工作（动词）。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Dia tinggal di Jakarta, dekat dengan sekolah dan kantor.", "zh": "他住在雅加达，离学校和办公室很近。", "a": "3cc0153c7a41", "za": "7d9fcf1dad42", "an": {"p": [["Dia", "他"], ["tinggal", "住"], ["di Jakarta", "在雅加达"], ["dekat dengan", "靠近"], ["sekolah", "学校"], ["kantor", "办公室"]], "b": "", "g": "dekat dengan + 名词 = 靠近……，后接并列的两个名词用 dan。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Tolong kirim email ini kepada semua manajer di perusahaan.", "zh": "请把这封邮件发给公司所有的经理。", "a": "1faddb9828f1", "za": "c7e6849b7ef9", "an": {"p": [["Tolong", "请（请求帮忙）"], ["kirim", "发送、寄"], ["email ini", "这封邮件"], ["kepada", "给（接人）"], ["semua manajer", "所有经理"], ["di perusahaan", "在公司里"]], "b": "perusahaan = per- + usaha（事业）+ -an", "g": "Tolong + 动词词根 = 礼貌的请求，动词不加 meN-（kirim 不写成 mengirim）。ini 放在名词后：email ini。kirim A kepada B = 把 A 发给 B。semua + 名词 = 所有的……。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya butuh bantuan Anda untuk menyelesaikan laporan ini.", "zh": "我需要你的帮助来完成这份报告。", "a": "045f0bf30dd2", "za": "253ce3026810", "an": {"p": [["Saya", "我"], ["butuh", "需要（= perlu）"], ["bantuan Anda", "您的帮助"], ["untuk", "为了、来（表目的）"], ["menyelesaikan", "完成"], ["laporan ini", "这份报告"]], "b": "bantuan = bantu 帮 + -an；menyelesaikan = selesai 完 + meN-…-kan；laporan = lapor + -an", "g": "名词 + 人称 = “谁的……”：bantuan Anda = 您的帮助（所属者放后面）。untuk + 动词 = “来做……”，表目的。meN-…-kan 常表“使……完成”。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya mulai bekerja pukul delapan pagi dan pulang kerja pukul lima sore.", "zh": "我早上八点开始上班，下午五点下班。", "a": "7a10d7d71cb4", "za": "94d8fdca0858", "an": {"p": [["mulai", "开始"], ["bekerja", "工作"], ["pukul delapan", "八点"], ["pagi", "早上"], ["pulang kerja", "下班"], ["pukul lima", "五点"], ["sore", "下午"]], "b": "bekerja = ber- + kerja", "g": "pukul（或 jam）+ 数字 = 几点。时段词 pagi/siang/sore/malam 放在数字后面。mulai + 动词 = 开始做某事。pulang = 回去，pulang kerja = 下班回家。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Nama saya Deni, saya adalah karyawan baru di perusahaan ini.", "zh": "我叫 Deni，我是这家公司的新员工。", "a": "9d30ae787693", "za": "1652fbed5297", "an": {"p": [["Nama saya", "我的名字"], ["saya", "我"], ["adalah", "是"], ["karyawan", "员工"], ["baru", "新的"], ["di perusahaan ini", "在这家公司"]], "b": "karyawan = karya 作品、工作 + -wan（……的人）", "g": "名词 + saya = “我的……”。形容词放在名词后：karyawan baru = 新员工。adalah 连接主语和名词（“是”），口语里常省略；形容词前不用 adalah。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Telepon di meja Anda berbunyi, silakan diangkat.", "zh": "你桌上的电话在响，请接一下。", "a": "3c7843b6b5ac", "za": "a26079922e0a", "an": {"p": [["Telepon", "电话"], ["di meja Anda", "在您的桌上"], ["berbunyi", "响"], ["silakan", "请"], ["diangkat", "被接起"]], "b": "berbunyi = ber- + bunyi 声音；diangkat = di- + angkat 抬、拿起", "g": "di- + 动词词根 = 被动（省略动作者）：diangkat = 被拿起（接电话）。silakan = “请便”，请对方做某事；tolong 则是请对方帮忙。di meja Anda 修饰 telepon。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Tolong fotokopi dokumen ini sebanyak 5 rangkap.", "zh": "请把这份文件复印 5 份。", "a": "4f33473a716f", "za": "1f5a90abd876", "an": {"p": [["Tolong", "请"], ["fotokopi", "复印"], ["dokumen ini", "这份文件"], ["sebanyak", "共计"], ["5 rangkap", "5 份"]], "b": "sebanyak = se- + banyak 多", "g": "fotokopi 可以直接当动词用（祈使句）。sebanyak + 数字 = “共……”（数量）。rangkap = 份（复本），不是“双面”。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Bos saya sangat baik, dia sering membantu karyawan baru di perusahaan.", "zh": "我的老板很好，经常帮助公司的新员工。", "a": "33f8d9f462f1", "za": "ec3730aec228", "an": {"p": [["Bos saya", "我的老板"], ["sangat baik", "非常好"], ["dia", "他/她"], ["sering", "经常"], ["membantu", "帮助"], ["karyawan baru", "新员工"], ["di perusahaan", "在公司"]], "b": "membantu = bantu + meN-", "g": "sangat + 形容词 = 非常……。频率副词 sering 放在动词前。dia 不分男女。逗号后面接第二个分句，不需要连词。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Ini meja kerja saya, dekat dengan jendela.", "zh": "这是我的办公桌，离窗户很近。", "a": "905af4c2f773", "za": "fe747d5acfb1", "an": {"p": [["Ini", "这是"], ["meja kerja", "办公桌"], ["saya", "我的"], ["dekat dengan", "靠近"], ["jendela", "窗户"], ["tempat kerja", "工位"]], "b": "meja = 桌子，kerja = 工作", "g": "名词 + 名词，核心词在前：meja kerja = 工作用的桌子。Ini 开头的判断句不需要 adalah。dekat dengan + 名词 = 靠近……。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Tempat kerja saya sangat dekat dengan jendela.", "zh": "我的工位离窗户很近。", "a": "f19a484bc645", "za": "fe747d5acfb1", "an": {"p": [["Ini", "这是"], ["meja kerja", "办公桌"], ["saya", "我的"], ["dekat dengan", "靠近"], ["jendela", "窗户"], ["tempat kerja", "工位"]], "b": "meja = 桌子，kerja = 工作", "g": "名词 + 名词，核心词在前：meja kerja = 工作用的桌子。Ini 开头的判断句不需要 adalah。dekat dengan + 名词 = 靠近……。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Besok saya akan pergi ke pabrik bersama tim produksi.", "zh": "我明天将和生产团队一起去工厂。", "a": "eb3a48eb4a85", "za": "aa2c7450144e", "zt": 0}, {"sp": "", "role": "t", "id": "Besok saya akan pergi ke lokasi bersama tim produksi.", "zh": "我明天将和生产团队一起去现场。", "a": "dcc4ffeff24c", "za": "a8275f46cc2b", "zt": 0}, {"sp": "", "role": "t", "id": "Komputer saya rusak, tolong panggilkan teknisi ke sini.", "zh": "我的电脑坏了，请叫技术员过来。", "a": "131934a7812d", "za": "279ea2064f77", "an": {"p": [["Komputer saya", "我的电脑"], ["rusak", "坏了"], ["tolong", "请"], ["panggilkan", "帮忙叫"], ["teknisi", "技术员"], ["ke sini", "到这里来"]], "b": "panggilkan = panggil 叫 + -kan（为某人做）", "g": "-kan 可表示“替别人做”：panggilkan = 帮（我）叫。祈使句动词用词根或词根+kan。ke sini = 到这里（方向），di sini = 在这里（位置）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Ini adalah jadwal rapat untuk minggu depan.", "zh": "这是下周的会议时间表。", "a": "69827c891896", "za": "9b12044f5d9a", "an": {"p": [["Ini adalah", "这是"], ["jadwal", "时间表"], ["rapat", "会议"], ["untuk", "用于、为了"], ["minggu depan", "下周"]], "b": "jadwal 时间表", "g": "jadwal rapat = 会议的时间表（名词 + 名词）。depan 放在时间词后表示“下一个”：minggu depan 下周，bulan depan 下个月。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Ini hasil kerja saya, apakah sudah sesuai dengan permintaan?", "zh": "这是我的工作成果，是否已经符合要求？", "a": "603b943a589c", "za": "08eb839f22d9", "an": {"p": [["Ini", "这是"], ["hasil kerja", "工作成果"], ["apakah", "是否"], ["sudah", "已经"], ["sesuai dengan", "符合"], ["permintaan", "要求"]], "b": "permintaan = per- + minta 要 + -an", "g": "apakah 引导是非问句，较书面。sudah = 已经（完成）。sesuai dengan + 名词 = 符合……。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Kami ada acara perusahaan Jumat sore ini.", "zh": "我们这周五下午有公司活动。", "a": "9453709f7009", "za": "8b7ef3ae3ff2", "an": {"p": [["Kami", "我们"], ["ada", "有"], ["acara perusahaan", "公司活动"], ["Jumat", "星期五"], ["sore ini", "今天下午"]], "b": "kami 不含听话人，kita 含听话人", "g": "ada + 名词 = 有（某安排/某物）。时间顺序：星期 + 时段 + ini。注意 kami（我们）≠ kamu（你）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya butuh tanda tangan Anda di kontrak ini.", "zh": "我需要您在这份合同上签字。", "a": "cd39deaad102", "za": "b06db94e2a4c", "an": {"p": [["Saya butuh", "我需要"], ["tanda tangan Anda", "您的签名"], ["di kontrak ini", "在这份合同上"]], "b": "tanda tangan = 记号 + 手；动词是 menandatangani", "g": "butuh 后可直接接名词。di + 名词 = 在……上面（这里指文件上）。tanda tangan 是名词“签名”。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya bekerja di bagian pemasaran sebagai staf administrasi.", "zh": "我在市场部工作，职位是行政专员（文员）。", "a": "89e3efdb206f", "za": "5c127fa29553", "an": {"p": [["bekerja", "工作"], ["di bagian", "在……部门"], ["pemasaran", "市场营销"], ["sebagai", "作为"], ["staf administrasi", "行政职员"]], "b": "pemasaran = pe-…-an + pasar 市场；sebagai = se- + bagai", "g": "sebagai + 职位 = “作为/担任”。di bagian + 部门名 = 在某部门。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya akan cuti tiga hari minggu depan.", "zh": "我下周将休假三天。", "a": "3681e356c1f4", "za": "e307c8b3773c", "an": {"p": [["akan", "将要"], ["cuti", "休假"], ["tiga hari", "三天"], ["minggu depan", "下周"]], "b": "cuti 休假（借自荷兰语）", "g": "数字 + hari = 几天：tiga hari。cuti 可直接当动词。时间词可放句尾。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Silakan pergi ke lobi pukul sepuluh untuk menemui tamu dari Singapura.", "zh": "请十点去大堂接见来自新加坡的客人。", "a": "266e7787e4d8", "za": "f937d173383b", "an": {"p": [["Silakan", "请"], ["pergi ke lobi", "去大堂"], ["pukul sepuluh", "十点"], ["untuk", "为了"], ["menemui", "会见"], ["tamu", "客人"], ["dari Singapura", "来自新加坡"]], "b": "menemui = temu 遇见 + meN-…-i", "g": "untuk + 动词 = “为了（去）做……”。menemui 后面直接接人（会见某人）。dari + 地名 = 来自某地。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Kapan batas waktu akhir proyek ini? Saya membutuhkan informasinya.", "zh": "这个项目的截止日期是什么时候？我需要这个信息。", "a": "145ab732390e", "za": "d2ddcbf2dd8c", "an": {"p": [["Kapan", "什么时候"], ["batas waktu akhir", "截止期限"], ["proyek ini", "这个项目"], ["membutuhkan", "需要"], ["informasinya", "那个信息"]], "b": "batas 界限 + waktu 时间 + akhir 最后；-nya = 那个", "g": "Kapan 疑问词放句首。membutuhkan 是 butuh 的正式说法。-nya 指代前面提到的项目的信息。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya akan mengantar tamu bisnis ini ke hotel.", "zh": "我会把这位商务客人送到酒店。", "a": "cbd0d434d16a", "za": "f9b9a03a8f1c", "an": {"p": [["akan", "将要"], ["mengantar", "送（陪同送到）"], ["tamu bisnis", "商务客人"], ["ke hotel", "到酒店"]], "b": "mengantar = antar + meN-", "g": "mengantar 是把人送到某处，ke + 地点表示目的地。tamu bisnis = 客人 + 商务（名词 + 名词）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Kantor kami perlu lebih banyak kertas dan pulpen.", "zh": "我们办公室需要更多的纸和笔。", "a": "092641913277", "za": "e3466cac57c3", "an": {"p": [["Kantor kami", "我们的办公室"], ["perlu", "需要"], ["lebih banyak", "更多"], ["kertas", "纸"], ["pulpen", "笔"]], "b": "pulpen = 钢笔/圆珠笔", "g": "lebih + 形容词 = 更……：lebih banyak = 更多。perlu 后可接名词，也可接动词。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya suka bekerja di sini karena lingkungan kerjanya sangat ramah.", "zh": "我喜欢在这里工作，因为工作环境很友好。", "a": "6b7e4ab0ca4e", "za": "6f4d6129b875", "an": {"p": [["suka", "喜欢"], ["bekerja", "工作"], ["di sini", "在这里"], ["karena", "因为"], ["lingkungan kerja", "工作环境"], ["ramah", "友好"]], "b": "lingkungan = lingkung + -an", "g": "suka + 动词 = 喜欢做……。-nya 这里表示“这里的”。lingkungan kerja = 环境 + 工作。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Terima kasih atas bantuan dan kerja sama Anda hari ini.", "zh": "感谢您今天的帮助和合作。", "a": "97a7a8398538", "za": "d151ca652370", "an": {"p": [["Terima kasih", "谢谢"], ["atas", "为了、对于"], ["bantuan", "帮助"], ["kerja sama", "合作"], ["Anda", "您"], ["hari ini", "今天"]], "b": "terima = 接受，kasih = 爱、情分", "g": "terima kasih atas + 名词 = 为……而感谢。kerja sama 是两个词（合作）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Sekarang saya harus pergi ke ruang rapat di lantai tiga untuk rapat.", "zh": "我现在必须去三楼的会议室开会。", "a": "b84ad6cb5b56", "za": "475b719fe1e0", "an": {"p": [["Sekarang", "现在"], ["harus", "必须"], ["ruang rapat", "会议室"], ["di lantai tiga", "在三楼"], ["untuk rapat", "去开会"]], "b": "ruang = 房间；lantai = 楼层", "g": "harus + 动词 = 必须。lantai + 数字 = 第几层（数字放后）。untuk rapat = 为了开会。"}, "zt": 0}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "gt1", "kind": "trans", "book": "武功秘籍", "title": "健康运动 Kesehatan & Olahraga", "lines": [{"sp": "", "role": "t", "id": "Karena sangat lelah, saya tidur lebih awal dari biasanya.", "zh": "因为身体很累，我比平常睡得早。", "a": "e291a514ffba", "za": "9f302a226ba4", "an": {"p": [["Karena", "因为"], ["sangat lelah", "非常累"], ["tidur", "睡觉"], ["lebih awal", "更早"], ["dari biasanya", "比平常"]], "b": "lelah 累；awal 开始、早", "g": "比较：lebih + 形容词 + dari + 比较对象 = 比……更……。dari biasanya = 比平常。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Karena saya sakit, saya tidak pergi ke sekolah hari ini.", "zh": "因为我生病了，所以今天没有去学校。", "a": "349c4ecdcfa9", "za": "ecd0012e2c2b", "an": {"p": [["Karena", "因为"], ["saya sakit", "我生病"], ["saya tidak pergi", "我没去"], ["ke sekolah", "到学校"], ["hari ini", "今天"]], "b": "sakit 病、痛", "g": "原因从句有完整的主语和谓语：saya sakit。时间词 hari ini 放句尾也可以。tidak 否定动词。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Setiap setelah berolahraga saya minum air putih untuk menjaga tubuh yang sehat.", "zh": "每次锻炼完以后，喝白开水保持身体健康。", "a": "725d42a50f04", "za": "a5bf8fbb34cd", "an": {"p": [["Setiap", "每次"], ["setelah", "在……之后"], ["berolahraga", "做运动"], ["saya", "我"], ["minum", "喝"], ["air putih", "白开水"], ["untuk", "为了"], ["menjaga", "保持"], ["tubuh", "身体"], ["yang sehat", "健康的"]], "b": "berolahraga = ber- + olahraga；menjaga = meN- + jaga（vt. 守护 → 保持）", "g": "结构：Setiap + setelah + 动作, 主语 + 动词 + 宾语 + untuk + 动词 + 宾语 + yang 形容词。air putih = 白色的水 = 白开水。tubuh yang sehat = 健康的身体，yang 修饰 tubuh。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Dia tidak pergi ke sekolah karena sedang sakit.", "zh": "她没有去学校，因为她正在生病。", "a": "2184e20ff844", "za": "2bb134c39966", "an": {"p": [["Dia", "她"], ["tidak", "不"], ["pergi", "去"], ["ke sekolah", "到学校"], ["karena", "因为"], ["sedang", "正在"], ["sakit", "生病"]], "b": "", "g": "结构：主句（否定）+ karena + 从句。tidak pergi = 没去；sedang + 动词/形容词 = 正在……。karena 引出原因，放在后面。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Karena sakit, saya tidak pergi ke sekolah.", "zh": "因为生病，我没有去学校。", "a": "bf5f4ae2719e", "za": "2ac5d82a5c7e", "an": {"p": [["Karena", "因为"], ["sakit", "生病"], ["saya", "我"], ["tidak", "不、没"], ["pergi", "去"], ["ke sekolah", "到学校"]], "b": "", "g": "Karena 引导原因，放句首，后面逗号再接结果。tidak 否定动词和形容词（否定名词用 bukan）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya minum air setiap kali selesai berolahraga demi kesehatan tubuh.", "zh": "我每次运动后喝水，是为了身体健康。", "a": "322e8a9fd26b", "za": "dd36013792e7", "an": {"p": [["minum air", "喝水"], ["setiap kali", "每次"], ["selesai", "结束、完成"], ["berolahraga", "做运动"], ["demi", "为了"], ["kesehatan", "健康"], ["tubuh", "身体"]], "b": "kesehatan = ke-…-an + sehat；berolahraga = ber- + olahraga", "g": "selesai + 动词 = 做完……。demi + 名词 = 为了（重要的目的）。setiap kali = 每次。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Ibu saya adalah dokter, dia melayani pasien di klinik.", "zh": "我妈妈是医生，在诊所看病人。", "a": "50cea9ee1ac0", "za": "17e21304d935", "an": {"p": [["Ibu saya", "我的母亲"], ["adalah dokter", "是医生"], ["dia", "她"], ["melayani", "接待、服务"], ["pasien", "病人"], ["di klinik", "在诊所"]], "b": "melayani = layan + meN-…-i", "g": "逗号后用 dia 代替主语。melayani 后直接接对象（pasien）。"}, "zt": 0}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "gt2", "kind": "trans", "book": "武功秘籍", "title": "学校学习 Sekolah", "lines": [{"sp": "", "role": "t", "id": "Kami belajar bersama di kelas dan saling membantu.", "zh": "我们在课堂上一起学习并互相帮助。", "a": "6d70bc39aa70", "za": "dfb06e2b071d", "an": {"p": [["Kami", "我们"], ["belajar bersama", "一起学习"], ["di kelas", "在课堂上"], ["dan", "并且"], ["saling membantu", "互相帮助"]], "b": "saling 互相；membantu = bantu + meN-", "g": "saling + 动词 = 互相……。dan 连接两个并列的动作。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Kadang-kadang saya membersihkan kamar agar lingkungan belajar nyaman.", "zh": "有时候我打扫房间，让学习环境舒适。", "a": "eed9f96f7c46", "za": "512305ae5ede", "an": {"p": [["Kadang-kadang", "有时"], ["membersihkan", "打扫"], ["kamar", "房间"], ["agar", "为了让"], ["lingkungan belajar", "学习环境"], ["nyaman", "舒适"]], "b": "membersihkan = bersih + meN-…-kan；lingkungan = lingkung + -an", "g": "agar + 主语 + 形容词 = 为了让……怎么样。lingkungan belajar = 环境 + 学习（名词 + 动词做修饰）。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Dia belajar di perpustakaan karena di sana sangat tenang.", "zh": "他在图书馆学习，因为那里很安静。", "a": "1b1b66be053d", "za": "fe53b4065acc", "an": {"p": [["Dia", "他"], ["belajar", "学习"], ["di perpustakaan", "在图书馆"], ["karena", "因为"], ["di sana", "在那里"], ["sangat tenang", "非常安静"]], "b": "sana 那边（远指），sini 这边，situ 那边（近指）", "g": "di sana = 在那里，用来回指前面提到的地点，避免重复名词。karena 后接完整的小句。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Saya membuat sarapan di dapur pagi ini, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "a": "4dcdbbb18c1b", "za": "19569032fe8a", "an": {"p": [["Saya", "我"], ["membuat sarapan", "做早餐"], ["di dapur", "在厨房"], ["pagi ini", "今天早上"], ["lalu", "然后"], ["pergi ke sekolah", "去学校"]], "b": "membuat = buat + meN-", "g": "时间词 pagi ini 也可以放句尾。lalu 连接先后发生的两个动作。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Saya sering belajar bersama teman di perpustakaan pada sore hari.", "zh": "我经常下午和朋友一起在图书馆学习。", "a": "1da4fea69275", "za": "811ddfcbaf2b", "an": {"p": [["sering", "经常"], ["belajar", "学习"], ["bersama teman", "和朋友一起"], ["di perpustakaan", "在图书馆"], ["pada sore hari", "在下午"]], "b": "belajar = ber- + ajar；perpustakaan = per-…-an + pustaka 书", "g": "pada + 时间 = 在……的时候。bersama + 人 = 和某人一起。副词 sering 在动词前。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Teman saya sangat rajin dan suka belajar.", "zh": "我的朋友很勤奋，喜欢学习。", "a": "c3dc711f7102", "za": "a2fda0d82598", "an": {"p": [["Teman saya", "我的朋友"], ["sangat rajin", "非常勤奋"], ["dan", "并且"], ["suka belajar", "喜欢学习"]], "b": "rajin 勤奋", "g": "形容词可直接做谓语，不需要 adalah。dan 连接两个谓语，共用同一个主语。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Di kelas, kami belajar mendengar, berbicara, membaca, dan menulis.", "zh": "在课堂上，我们学习听、说、读、写。", "a": "a37a597d7132", "za": "53129aba41ae", "an": {"p": [["Di kelas", "在课堂上"], ["kami", "我们"], ["belajar", "学习"], ["mendengar", "听"], ["berbicara", "说"], ["membaca", "读"], ["menulis", "写"]], "b": "mendengar（dengar）、membaca（baca）、menulis（tulis）；berbicara = ber- + bicara", "g": "地点短语放句首后用逗号。并列动词：A, B, C, dan D（最后一个前加 dan）。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Karena hari ini hujan, saya tidak pergi ke sekolah.", "zh": "因为今天下雨，我没去学校。", "a": "e798a8d1908d", "za": "a0361e9e94c5", "an": {"p": [["Karena", "因为"], ["hari ini", "今天"], ["hujan", "下雨"], ["saya tidak pergi", "我不去"], ["ke sekolah", "到学校"]], "b": "", "g": "hujan 既是名词“雨”也是动词“下雨”，不需要再加其他动词。从句 + 逗号 + 主句。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Guru mengajar kami dengan sangat sabar di kelas.", "zh": "老师在课堂上非常耐心地教我们。", "a": "982842757af2", "za": "423fe3c22296", "an": {"p": [["Guru", "老师"], ["mengajar", "教"], ["kami", "我们"], ["dengan sangat sabar", "非常耐心地"], ["di kelas", "在课堂上"]], "b": "mengajar = ajar + meN-；sabar 耐心", "g": "mengajar 后面直接接对象（kami）。dengan + 形容词 = ……地。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Saya setiap akhir pekan pergi ke perpustakaan meminjam buku.", "zh": "我每个周末都去图书馆借书。", "a": "c9f9779985ed", "za": "c3a87b333726", "an": {"p": [["Saya", "我"], ["setiap akhir pekan", "每个周末"], ["pergi", "去"], ["ke perpustakaan", "到图书馆"], ["meminjam", "借"], ["buku", "书"]], "b": "perpustakaan = per- + pustaka + -an（n. 图书馆）；meminjam = meN- + pinjam（vt. 借入）", "g": "结构：主语 + 时间 + pergi ke + 地点 + 动词 + 宾语。两个动词连用：去图书馆 + 借书，meminjam 说明去的目的，untuk 可以省略。pinjam（借入）vs meminjamkan（借出）要分清。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Saya pergi ke sekolah setiap hari dengan sepeda.", "zh": "我每天骑自行车去学校。", "a": "3df10ee0b9cb", "za": "e08b5179e019", "an": {"p": [["Saya", "我"], ["pergi", "去"], ["ke sekolah", "到学校"], ["setiap hari", "每天"], ["dengan sepeda", "骑自行车"]], "b": "sepeda = n. 自行车", "g": "结构：主语 + pergi + ke + 地点 + 频率 + dengan + 交通工具。dengan + 交通工具 = 乘/骑……。骑车也可以说 bersepeda。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Guru menjelaskan pelajaran dengan sangat jelas.", "zh": "老师讲课讲得非常清楚。", "a": "08f76eb1ca8a", "za": "04c2a4d0a246", "an": {"p": [["Guru", "老师"], ["menjelaskan", "讲解"], ["pelajaran", "课程"], ["dengan sangat jelas", "非常清楚地"]], "b": "menjelaskan = jelas + meN-…-kan；pelajaran = ajar + pe-…-an", "g": "dengan + 形容词 = ……地（把形容词变成副词）。meN-…-kan = 使……清楚，即“讲解”。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya tinggal di tempat yang sangat tenang dan nyaman (dan tidak jauh dari sekolah).", "zh": "我住在一个非常安静舒适的地方（离学校不远）。", "a": "34017e7faa4a", "za": "257112eb9221", "an": {"p": [["tinggal", "住"], ["di tempat", "在地方"], ["yang", "……的"], ["sangat", "非常"], ["tenang", "安静"], ["nyaman", "舒适"], ["tidak jauh dari", "离……不远"]], "b": "tempat 地方；jauh 远", "g": "yang 引出修饰成分：tempat yang tenang = 安静的地方。tidak jauh dari + 地点 = 离……不远。tinggal = 居住。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Pagi ini saya membuat sarapan di dapur, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "a": "990111dbe5bd", "za": "19569032fe8a", "an": {"p": [["Pagi ini", "今天早上"], ["membuat", "做、制作"], ["sarapan", "早餐"], ["di dapur", "在厨房"], ["lalu", "然后"], ["pergi ke sekolah", "去学校"]], "b": "membuat = buat + meN-", "g": "时间词放句首。lalu 连接先后发生的两个动作。membuat sarapan = 做早餐（也可说 memasak）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Kami sering belajar bersama di kelas dan sering saling membantu.", "zh": "我们经常在教室一起学习，经常互相帮助。", "a": "167e82102d52", "za": "c510b9ae5ae7", "an": {"p": [["sering", "经常"], ["belajar bersama", "一起学习"], ["di kelas", "在教室"], ["saling", "互相"], ["membantu", "帮助"]], "b": "saling 互相", "g": "saling + 动词 = 互相……：saling membantu 互相帮助。sering 在两个谓语前各用一次，更清楚。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Kadang-kadang saya membersihkan kamar agar nyaman untuk belajar.", "zh": "有时候我打扫房间，让学习的环境舒适。", "a": "c4e850f4f202", "za": "744b9e73b27f", "an": {"p": [["Kadang-kadang", "有时"], ["membersihkan", "打扫"], ["kamar", "房间"], ["agar", "为了让"], ["nyaman", "舒适"], ["untuk belajar", "用来学习"]], "b": "membersihkan = bersih 干净 + meN-…-kan", "g": "agar + 形容词/从句 = 为了让……。kadang-kadang 是重叠词，意为“有时”。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Dia belajar di perpustakaan karena perpustakaan sangat tenang.", "zh": "他在图书馆学习，因为图书馆很安静。", "a": "498fa53810eb", "za": "88920e252528", "an": {"p": [["Dia", "他"], ["belajar", "学习"], ["di perpustakaan", "在图书馆"], ["karena", "因为"], ["sangat tenang", "非常安静"]], "b": "", "g": "原因从句里重复名词 perpustakaan，印尼语不爱用代词回指（也可用 -nya）。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Sore ini kami belajar bahasa Indonesia di perpustakaan.", "zh": "今天下午我们在图书馆学习印尼语。", "a": "553cdef32567", "za": "46a54211a9b0", "an": {"p": [["Sore ini", "今天下午"], ["kami", "我们"], ["belajar", "学习"], ["bahasa Indonesia", "印尼语"], ["di perpustakaan", "在图书馆"]], "b": "bahasa = 语言", "g": "bahasa + 国名 = 某国语言：bahasa Inggris 英语，bahasa Mandarin 汉语。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Besok saya pergi ke sekolah naik sepeda.", "zh": "我明天骑自行车去学校。", "a": "b9e0afee6876", "za": "2c5480307b1c", "an": {"p": [["Besok", "明天"], ["naik", "乘、骑"], ["sepeda", "自行车"], ["bersepeda", "骑自行车"], ["setiap hari", "每天"]], "b": "bersepeda = ber- + sepeda", "g": "naik + 交通工具 = 乘/骑：naik bus、naik motor、naik sepeda。ber- + 名词 = 做与它有关的事：bersepeda。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya bersepeda ke sekolah setiap hari.", "zh": "我每天骑自行车去上学。", "a": "6aad103116f7", "za": "2c5480307b1c", "an": {"p": [["Besok", "明天"], ["naik", "乘、骑"], ["sepeda", "自行车"], ["bersepeda", "骑自行车"], ["setiap hari", "每天"]], "b": "bersepeda = ber- + sepeda", "g": "naik + 交通工具 = 乘/骑：naik bus、naik motor、naik sepeda。ber- + 名词 = 做与它有关的事：bersepeda。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Saya bangun jam enam setiap pagi untuk pergi ke sekolah.", "zh": "我每天早上六点起床，为了去上学。", "a": "162b8b316a07", "za": "fa15c1a91d94", "an": {"p": [["bangun", "起床"], ["jam enam", "六点"], ["setiap pagi", "每天早上"], ["untuk", "为了"], ["pergi ke sekolah", "去学校"]], "b": "", "g": "jam + 数字 = 几点（和 pukul 同义）。untuk + 动词 = 为了……。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Ayah saya adalah guru sekolah menengah.", "zh": "我的父亲是一名中学老师。", "a": "1d1ab83f9aef", "za": "7cb7698b943b", "an": {"p": [["Ayah saya", "我的父亲"], ["adalah", "是"], ["guru", "老师"], ["sekolah menengah", "中学"]], "b": "menengah = 中等的", "g": "adalah 连接主语和职业名词。sekolah menengah pertama (SMP) 初中，sekolah menengah atas (SMA) 高中。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Setiap minggu saya pergi ke perpustakaan untuk membaca buku.", "zh": "我每周都去图书馆看书。", "a": "4454cbf20100", "za": "53bef4123bdb", "an": {"p": [["Setiap minggu", "每周"], ["pergi ke perpustakaan", "去图书馆"], ["untuk membaca buku", "为了看书"]], "b": "membaca = baca + meN-", "g": "membaca buku = 看书、读书。注意 menulis（写）和 membaca（读）都是 meN- 动词。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Setelah masuk universitas, saya kenal banyak teman baru.", "zh": "我上大学后认识了很多新朋友。", "a": "3cd5a3d3a9e1", "za": "ee2bfce3c1dd", "an": {"p": [["Setelah", "之后"], ["masuk universitas", "进入大学"], ["kenal", "认识"], ["banyak", "很多"], ["teman baru", "新朋友"]], "b": "masuk 进入；kenal 熟识（人）", "g": "kenal = 认识某人（熟悉），tahu = 知道（事实）。banyak + 名词 = 很多……，不需要量词。"}, "zt": 0}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "gt3", "kind": "trans", "book": "武功秘籍", "title": "家庭 Keluarga", "lines": [{"sp": "", "role": "t", "id": "Pada malam hari kami sekeluarga duduk bersama menonton televisi.", "zh": "晚上我们一家人坐在一起看电视。", "a": "cc057b54f889", "za": "dcb5a749380a", "an": {"p": [["Pada malam hari", "在晚上"], ["kami", "我们"], ["sekeluarga", "一家人"], ["duduk bersama", "坐在一起"], ["menonton televisi", "看电视"]], "b": "sekeluarga = se- + keluarga（同一个家）", "g": "se- + 名词 = 同一个……：sekeluarga 一家人，sekelas 同班。duduk bersama menonton = 坐在一起看。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Kakak perempuan saya sedang memasak di dapur.", "zh": "我姐姐正在厨房做饭。", "a": "b0e944732121", "za": "cf7f7029701f", "an": {"p": [["Kakak perempuan", "姐姐"], ["saya", "我的"], ["sedang", "正在"], ["memasak", "做饭"], ["di dapur", "在厨房"]], "b": "memasak = masak + meN-", "g": "kakak = 哥哥/姐姐，加 perempuan（女）或 laki-laki（男）说明性别。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Kamu sering membeli makanan apa dengan keluargamu?", "zh": "你经常和你家人买什么食物？", "a": "8a149b78ed12", "za": "28d3b6081a65", "an": {"p": [["Kamu", "你"], ["sering", "经常"], ["membeli", "买"], ["makanan", "食物"], ["apa", "什么"], ["dengan", "和"], ["keluargamu", "你的家人"]], "b": "membeli = meN- + beli；keluargamu = keluarga + -mu（你的）", "g": "结构：主语 + sering + 动词 + 宾语 + apa + dengan + 人？apa 放在被问名词（makanan）后，问“买什么食物”。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Setiap sore saya berjalan-jalan dengan ayah di sekitar rumah.", "zh": "每天下午我和爸爸在家附近散步。", "a": "faa647da811f", "za": "66822bcef3d5", "an": {"p": [["Setiap sore", "每天下午"], ["saya", "我"], ["berjalan-jalan", "散步"], ["dengan ayah", "和爸爸"], ["di sekitar rumah", "在家附近"]], "b": "berjalan-jalan = ber- + jalan 重叠（vi. 散步、逛）；sekitar = n. 周围", "g": "结构：时间 + 主语 + 动词 + dengan + 人 + 地点。di sekitar + 地点 = 在……附近。注意：sore 泛指“下午”，setiap sore = 每天下午。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Kami makan malam bersama keluarga setiap hari.", "zh": "我们每天和家人一起吃晚饭。", "a": "0a467ccd98b4", "za": "8117f661d0b7", "an": {"p": [["Kami", "我们"], ["makan malam", "吃晚饭"], ["bersama keluarga", "和家人一起"], ["setiap hari", "每天"]], "b": "makan malam = 吃 + 夜晚", "g": "makan malam 既是动词“吃晚饭”，也是名词“晚饭”。setiap + 名词 = 每一个……。"}, "zt": 0}, {"sp": "", "role": "t", "id": "Pada malam hari saya duduk bersama keluarga menonton televisi.", "zh": "晚上我和家人坐在一起看电视。", "a": "1ff209f2dbd5", "za": "55f0a3de0680", "an": {"p": [["Pada malam hari", "在晚上"], ["duduk", "坐"], ["bersama keluarga", "和家人一起"], ["menonton", "观看"], ["televisi", "电视"]], "b": "menonton = tonton + meN-", "g": "两个动作可连用：duduk … menonton（坐着看）。menonton 用于看电视、电影、比赛；melihat 是“看见”。"}, "zt": 0}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "gt4", "kind": "trans", "book": "武功秘籍", "title": "饮食购物 Makan & Belanja", "lines": [{"sp": "", "role": "t", "id": "Saya biasanya membawa botol minum sendiri karena tidak mau membeli air di luar.", "zh": "我通常自己带水杯，因为不想在外面买水。", "a": "a91b39e83b56", "za": "0d0ff4867d4f", "an": {"p": [["biasanya", "通常"], ["membawa", "带"], ["botol minum", "水杯"], ["sendiri", "自己"], ["tidak mau", "不想"], ["membeli air", "买水"], ["di luar", "在外面"]], "b": "botol 瓶，minum 喝", "g": "botol minum = 喝水的瓶子（名词 + 动词做修饰）。sendiri 放在句中表示“自己（独自）”。mau = 想要/愿意。"}, "zt": 1}, {"sp": "", "role": "t", "id": "Saya pergi ke pasa
