 "考官", "role": "q", "id": "Apakah menurutmu memasak sulit? Makanan apa yang bisa kamu masak?", "zh": "你觉得做饭难吗？你会做什么菜？", "a": "89f45794e0e2", "an": {"p": [["Apakah", "是否"], ["menurutmu", "依你看"], ["memasak", "做饭"], ["sulit", "难"], ["Makanan apa", "什么食物"], ["yang bisa kamu masak", "你会做的"]], "b": "masak = 词根（yang 从句里用原形）", "g": "结构：Apakah menurutmu + 从句？；Makanan apa yang bisa + 主语 + 动词原形？"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya memasak tidak sulit. Saya bisa memasak tumis sayur dan sup ayam.", "zh": "我觉得做饭不难，我会做炒青菜和鸡汤。", "a": "c90a792d98da", "an": {"p": [["Menurut saya", "依我看"], ["memasak", "做饭"], ["tidak sulit", "不难"], ["Saya bisa", "我会"], ["memasak", "做"], ["tumis sayur", "炒蔬菜"], ["dan", "和"], ["sup ayam", "鸡汤"]], "b": "tumis = n./vt. 炒", "g": "结构：Menurut saya + 动词短语 + tidak + 形容词。bisa + 动词 = 会做。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, hal apa yang kamu lakukan untuk menjaga kesehatan?", "zh": "你自己会做哪些事来保持健康？", "a": "7de6ec657f34", "an": {"p": [["Menurutmu", "依你看"], ["hal apa", "什么事"], ["yang kamu lakukan", "你做的"], ["untuk", "为了"], ["menjaga", "保持"], ["kesehatan", "健康"]], "b": "", "g": "结构：hal apa yang + 主语 + 动词原形 + untuk + 目的？“做什么来……”的问法。"}}, {"sp": "参考回答", "role": "a", "id": "Untuk menjaga kesehatan, saya tidur tepat waktu, berolahraga setiap pagi, dan makan makanan sehat.", "zh": "为了保持健康，我按时睡觉、每天早上运动、吃健康的食物。", "a": "bea849ef3209", "an": {"p": [["Untuk menjaga kesehatan", "为了保持健康"], ["saya", "我"], ["tidur tepat waktu", "按时睡觉"], ["berolahraga", "运动"], ["setiap pagi", "每天早上"], ["dan", "和"], ["makan makanan sehat", "吃健康食物"]], "b": "", "g": "结构：Untuk + 动词短语, 主语 + 并列动作。三个动作用逗号和 dan 并列。tepat waktu = 准时。"}}, {"sp": "考官", "role": "q", "id": "Kamu lebih suka tempat yang sejuk atau ramai? Mengapa?", "zh": "你更喜欢凉爽的地方还是热闹的地方？为什么？", "a": "f3cd3a4fc88a", "an": {"p": [["Kamu", "你"], ["lebih suka", "更喜欢"], ["tempat", "地方"], ["yang sejuk", "凉爽的"], ["atau", "还是"], ["ramai", "热闹"], ["Mengapa", "为什么"]], "b": "", "g": "结构：主语 + lebih suka + 名词 + yang + A atau B？Mengapa? = 为什么？"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka tempat yang sejuk, karena nyaman untuk istirahat.", "zh": "我更喜欢凉爽的地方，因为适合休息。", "a": "c6408549eae7", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["tempat yang sejuk", "凉爽的地方"], ["karena", "因为"], ["nyaman", "舒适"], ["untuk istirahat", "适合休息"]], "b": "", "g": "结构：主语 + lebih suka + 名词短语, karena + 形容词 + untuk + 动词。nyaman untuk + 动词 = 适合做……。"}}, {"sp": "考官", "role": "q", "id": "Kapan terakhir kali kamu sakit, dan sakit apa?", "zh": "你上次生病是什么时候，得了什么病？", "a": "52615241b97a", "an": {"p": [["Kapan", "什么时候"], ["terakhir kali", "上一次"], ["kamu", "你"], ["sakit", "生病"], ["dan", "并且"], ["sakit apa", "什么病"]], "b": "terakhir = ter- + akhir", "g": "结构：Kapan terakhir kali + 主语 + 动词, dan + 问句？sakit apa = 得了什么病。"}}, {"sp": "参考回答", "role": "a", "id": "Terakhir kali saya sakit minggu lalu. Saya demam, jadi saya banyak istirahat dan minum obat.", "zh": "我上次生病是上周，发烧了，所以多休息、吃了药。", "a": "5639d3f76927", "an": {"p": [["Terakhir kali", "上一次"], ["saya sakit", "我生病"], ["minggu lalu", "上周"], ["demam", "发烧"], ["jadi", "所以"], ["banyak istirahat", "多休息"], ["dan", "并"], ["minum obat", "吃药"]], "b": "", "g": "结构：Terakhir kali + 主语 + 动词 + 时间。jadi 引出结果。banyak + 动词 = 多做……。"}}, {"sp": "考官", "role": "q", "id": "Menurut Anda, bagaimana lingkungan pasar tradisional dan supermarket?", "zh": "你觉得传统市场和超市的环境怎么样？", "a": "1eab734da787", "an": {"p": [["Menurut Anda", "依您看"], ["bagaimana", "怎样"], ["lingkungan", "环境"], ["pasar tradisional", "传统市场"], ["dan", "和"], ["supermarket", "超市"]], "b": "lingkungan = lingkung + -an", "g": "结构：Menurut Anda, bagaimana + 名词？问“……环境怎么样”。"}}, {"sp": "参考回答", "role": "a", "id": "Pasar tradisional ramai dan penuh suara pedagang, sedangkan supermarket lebih bersih, rapi, dan tenang.", "zh": "传统市场很热闹，到处是商贩的声音；超市更干净、整齐、安静。", "a": "84cd47663a2f", "an": {"p": [["Pasar tradisional", "传统市场"], ["ramai", "热闹"], ["dan", "并且"], ["penuh", "充满"], ["suara pedagang", "小贩的声音"], ["sedangkan", "而"], ["supermarket", "超市"], ["lebih", "更"], ["bersih", "干净"], ["rapi", "整齐"], ["tenang", "安静"]], "b": "pedagang = pe- + dagang（n. 商贩）", "g": "结构：A + 形容词, sedangkan B + lebih + 形容词。对比句。penuh + 名词 = 充满……。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, apa yang akan kamu rekomendasikan untuk teman yang baru datang ke Indonesia?", "zh": "如果朋友刚来印尼，你会推荐什么？", "a": "d5b0c12c4359", "an": {"p": [["Menurutmu", "依你看"], ["apa", "什么"], ["yang akan kamu rekomendasikan", "你会推荐的"], ["untuk", "给"], ["teman", "朋友"], ["yang baru datang", "刚来的"], ["ke Indonesia", "到印尼"]], "b": "rekomendasikan = rekomendasi + -kan（推荐）", "g": "结构：apa yang akan + 主语 + 动词原形 + untuk + 人？yang baru datang 修饰 teman：刚到的。"}}, {"sp": "参考回答", "role": "a", "id": "Saya akan merekomendasikan makanan khas Indonesia, tempat wisata yang indah, dan kata sapaan orang Indonesia.", "zh": "我会推荐印尼特色美食、漂亮的景点，还有印尼人的问候语。", "a": "9ac97ff2f5eb", "an": {"p": [["Saya", "我"], ["akan", "将"], ["merekomendasikan", "推荐"], ["makanan khas", "特色食物"], ["tempat wisata", "旅游景点"], ["yang indah", "美丽的"], ["kata sapaan", "称呼语"], ["orang Indonesia", "印尼人"]], "b": "merekomendasikan = meN- + rekomendasi + -kan；sapaan = sapa + -an", "g": "结构：主语 + akan + 动词 + 三个并列宾语。kata sapaan = 打招呼的称呼用语。"}}, {"sp": "考官", "role": "q", "id": "Jika kamu punya liburan satu bulan, kamu akan pergi ke mana?", "zh": "如果你有一个月的假期，你会去哪里？", "a": "980a94a0ce82", "an": {"p": [["Jika", "如果"], ["kamu", "你"], ["punya", "有"], ["liburan satu bulan", "一个月的假"], ["akan pergi", "会去"], ["ke mana", "去哪里"]], "b": "", "g": "结构：Jika + 条件, 主语 + akan + 动词 + ke mana？"}}, {"sp": "参考回答", "role": "a", "id": "Saya akan pergi ke Bali dan Yogyakarta untuk melihat pemandangan dan candi.", "zh": "我会去巴厘岛和日惹，看风景和寺庙。", "a": "34a4ea84588a", "an": {"p": [["Saya", "我"], ["akan pergi", "会去"], ["ke Bali", "到巴厘"], ["dan", "和"], ["Yogyakarta", "日惹"], ["untuk melihat", "为了看"], ["pemandangan", "风景"], ["dan", "和"], ["candi", "古庙"]], "b": "pemandangan = pe- + pandang + -an", "g": "结构：主语 + akan + 动词 + 地点 + untuk + 动词短语。candi = 印尼古代的石庙（如婆罗浮屠）。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah melewatkan hal penting karena tidak melihat pengumuman?", "zh": "你有没有因为没看通知错过重要的事？", "a": "f4bcc61ecfb7", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["melewatkan", "错过"], ["hal penting", "重要的事"], ["karena", "因为"], ["tidak melihat", "没看"], ["pengumuman", "通知"]], "b": "melewatkan = meN- + lewat + -kan；pengumuman = pe- + umum + -kan 的名词形", "g": "结构：Apakah + 主语 + pernah + 动词 + 宾语 + karena + 原因？melewatkan = 错过。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Saya pernah ketinggalan rapat penting karena tidak melihat pengumuman.", "zh": "有过。我有一次没看通知，错过了重要的会议。", "a": "6a6609a8cef4", "an": {"p": [["Pernah", "曾经"], ["Saya", "我"], ["ketinggalan", "错过、落下"], ["rapat penting", "重要会议"], ["karena", "因为"], ["tidak melihat", "没看"], ["pengumuman", "通知"]], "b": "ketinggalan = ke- + tinggal + -an（遭遇落下）", "g": "结构：Pernah. 主语 + pernah + 动词 + 宾语 + karena + 原因。ke-……-an 表示遭遇到某种不愿发生的事：ketinggalan 落下、错过。"}}, {"sp": "考官", "role": "q", "id": "Apa pengalaman kerja yang kamu dapatkan selama bekerja?", "zh": "工作期间你得到了哪些工作经验？", "a": "5d865b783da5", "an": {"p": [["Apa", "什么"], ["pengalaman kerja", "工作经验"], ["yang kamu dapatkan", "你得到的"], ["selama", "在……期间"], ["bekerja", "工作"]], "b": "pengalaman = pe- + alam + -an；dapatkan = dapat + -kan（动词原形）", "g": "结构：Apa + 名词 + yang + 主语 + 动词原形 + selama + 动词？yang 从句里动词不加 meN-。"}}, {"sp": "参考回答", "role": "a", "id": "Saya mendapat pengalaman berkomunikasi dengan orang lain dan bekerja sama dalam tim.", "zh": "我学到了和别人沟通、团队合作的经验。", "a": "685750621dd5", "an": {"p": [["Saya", "我"], ["mendapat", "得到"], ["pengalaman", "经验"], ["berkomunikasi", "沟通"], ["dengan orang lain", "与别人"], ["dan", "和"], ["bekerja sama", "合作"], ["dalam tim", "在团队里"]], "b": "berkomunikasi = ber- + komunikasi；bekerja sama = ber- + kerja + sama", "g": "结构：主语 + mendapat + 名词 + 动词短语 + dan + 动词短语。pengalaman + 动词 = 做……的经验。bekerja sama = 合作。"}}, {"sp": "考官", "role": "q", "id": "Apa manfaat bekerja dalam tim menurut Anda?", "zh": "你认为团队合作有什么好处？", "a": "73ad9552e67d", "an": {"p": [["Apa", "什么"], ["manfaat", "好处"], ["bekerja dalam tim", "在团队里工作"], ["menurut Anda", "依您看"]], "b": "", "g": "结构：Apa + 名词（manfaat）+ 动词短语 + menurut Anda？manfaat = 益处。"}}, {"sp": "参考回答", "role": "a", "id": "Pekerjaan lebih cepat selesai, kita bisa saling membantu, dan lebih mudah menyelesaikan masalah.", "zh": "工作完成得更快，大家可以互相帮助，也更容易解决问题。", "a": "84cf5918e79d", "an": {"p": [["Pekerjaan", "工作"], ["lebih cepat", "更快"], ["selesai", "完成"], ["kita bisa", "我们能"], ["saling membantu", "互相帮助"], ["dan", "并且"], ["lebih mudah", "更容易"], ["menyelesaikan", "解决"], ["masalah", "问题"]], "b": "menyelesaikan = meN- + selesai + -kan（vt. 完成、解决）", "g": "结构：三个并列分句，每个都是“好处”。saling + 动词 = 互相……。lebih + 形容词 + 动词 = 更容易做……。"}}, {"sp": "考官", "role": "q", "id": "Lebih suka menulis di papan tulis atau menggunakan komputer? Mengapa?", "zh": "你更喜欢在黑板上写字还是用电脑？为什么？", "a": "057f3917aee0", "an": {"p": [["Lebih suka", "更喜欢"], ["menulis", "写"], ["di papan tulis", "在黑板上"], ["atau", "还是"], ["menggunakan komputer", "用电脑"], ["Mengapa", "为什么"]], "b": "menggunakan = meN- + guna + -kan", "g": "结构：Lebih suka + A atau B？省略主语。Mengapa? = 为什么？"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka menggunakan komputer, karena mengetik lebih cepat dan tulisannya lebih rapi.", "zh": "我更喜欢用电脑，因为打字更快，字也更整齐。", "a": "cc35978a84b3", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["menggunakan komputer", "用电脑"], ["karena", "因为"], ["mengetik", "打字"], ["lebih cepat", "更快"], ["dan", "并且"], ["tulisannya", "字迹"], ["lebih rapi", "更整齐"]], "b": "mengetik = meN- + ketik；tulisannya = tulis + -an + -nya", "g": "结构：主语 + lebih suka + 动词短语, karena + 动词 + lebih + 形容词 + dan + 名词 + lebih + 形容词。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-28"}, {"id": "e160", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 练习卷 · 口语对答（搬家 / 市场 / 家庭）", "lines": [{"sp": "考官", "role": "q", "id": "Kalau kamu mau pindah rumah, kamu mau ke desa atau kota? Mengapa?", "zh": "如果你要搬家，你想去乡村还是城市？为什么？", "a": "eefba22e525f", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["mau", "想"], ["pindah rumah", "搬家"], ["ke desa", "去农村"], ["atau", "还是"], ["kota", "城市"], ["Mengapa", "为什么"]], "b": "", "g": "结构：Kalau + 条件, 主语 + mau + 动词 + ke + A atau B？"}}, {"sp": "参考回答", "role": "a", "id": "Saya mau pindah ke desa, karena udaranya segar dan suasananya tenang.", "zh": "我想搬到乡村，因为空气清新，环境安静。", "a": "1c7ef6572b29", "an": {"p": [["Saya", "我"], ["mau", "想"], ["pindah", "搬"], ["ke desa", "到农村"], ["karena", "因为"], ["udaranya", "空气"], ["segar", "清新"], ["dan", "并且"], ["suasananya", "氛围"], ["tenang", "安静"]], "b": "udaranya = udara + -nya", "g": "结构：主语 + mau + 动词 + ke + 地点, karena + 名词-nya + 形容词。-nya 指“那里的”。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu pergi ke pasar tradisional, apa saja yang biasanya kamu beli? Mengapa kamu memilih membeli itu?", "zh": "你去传统市场通常买什么？为什么买这些？", "a": "34049c679750", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["pergi ke pasar tradisional", "去传统市场"], ["apa saja", "都有什么"], ["yang biasanya kamu beli", "你通常买的"], ["Mengapa", "为什么"], ["memilih", "选择"], ["membeli itu", "买那些"]], "b": "memilih = meN- + pilih", "g": "结构：Kalau + 条件, apa saja yang + 副词 + 主语 + 动词原形？Mengapa + 主语 + memilih + 动词短语？"}}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya membeli sayur dan buah, karena di pasar lebih segar dan lebih murah.", "zh": "我通常买蔬菜和水果，因为市场里的更新鲜、更便宜。", "a": "c2559c98f9f4", "an": {"p": [["Biasanya", "通常"], ["saya", "我"], ["membeli", "买"], ["sayur dan buah", "蔬菜和水果"], ["karena", "因为"], ["di pasar", "在市场"], ["lebih segar", "更新鲜"], ["dan", "并且"], ["lebih murah", "更便宜"]], "b": "", "g": "结构：副词 + 主语 + 动词 + 宾语, karena + 地点 + lebih + 形容词。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, apa perbedaan antara berbelanja di pasar tradisional dan di supermarket? Kamu lebih suka yang mana? Jelaskan alasannya.", "zh": "你认为在传统市场和超市买东西有什么区别？你更喜欢哪个？说明理由。", "a": "ec469de803b2", "an": {"p": [["Menurutmu", "依你看"], ["apa perbedaan", "有什么不同"], ["antara", "在……之间"], ["berbelanja", "购物"], ["di pasar tradisional", "在传统市场"], ["dan", "和"], ["di supermarket", "在超市"], ["lebih suka", "更喜欢"], ["yang mana", "哪一个"], ["Jelaskan", "请解释"], ["alasannya", "理由"]], "b": "Jelaskan = jelas + -kan（祈使）", "g": "结构：三个问句。perbedaan antara A dan B = A 与 B 的区别。yang mana = 哪一个。Jelaskan + 宾语 = 请说明……。"}}, {"sp": "参考回答", "role": "a", "id": "Di pasar tradisional kita bisa menawar harga, tetapi di supermarket harganya tetap. Saya lebih suka pasar tradisional karena lebih murah.", "zh": "在传统市场可以砍价，超市是固定价格。我更喜欢传统市场，因为更便宜。", "a": "92b198a1d8ee", "an": {"p": [["Di pasar tradisional", "在传统市场"], ["kita bisa", "我们可以"], ["menawar harga", "砍价"], ["tetapi", "但是"], ["di supermarket", "在超市"], ["harganya", "价格"], ["tetap", "固定"], ["Saya", "我"], ["lebih suka", "更喜欢"], ["karena", "因为"], ["lebih murah", "更便宜"]], "b": "", "g": "结构：A 地点 + 主语 + bisa + 动词, tetapi + B 地点 + 价格 + tetap。tetap = 固定不变。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah menawar harga saat berbelanja? Ceritakan pengalamanmu, dan bagaimana cara menawar yang baik menurutmu.", "zh": "你买东西时砍过价吗？讲讲你的经历，你觉得怎样砍价比较好？", "a": "16db4bea1e4c", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["menawar harga", "砍价"], ["saat", "当……时"], ["berbelanja", "购物"], ["Ceritakan", "请讲述"], ["pengalamanmu", "你的经历"], ["dan", "并"], ["bagaimana cara menawar yang baik", "好的砍价方法是怎样"], ["menurutmu", "依你看"]], "b": "Ceritakan = cerita + -kan（祈使）", "g": "结构：问句 + 祈使句 + 间接问句。cara + 动词 + yang baik = 好的……方法。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Saya pernah menawar harga buah di pasar. Menurut saya, kita harus bicara dengan sopan dan jangan menawar terlalu murah.", "zh": "砍过。我在市场砍过水果的价。我觉得要礼貌地说，不要砍得太低。", "a": "72d69a16d4e3", "an": {"p": [["Pernah", "曾经"], ["Saya", "我"], ["menawar harga buah", "砍水果价"], ["di pasar", "在市场"], ["Menurut saya", "依我看"], ["kita harus", "我们必须"], ["bicara", "说话"], ["dengan sopan", "礼貌地"], ["dan", "并且"], ["jangan", "不要"], ["menawar", "砍价"], ["terlalu murah", "太便宜"]], "b": "sopan = adj. 礼貌", "g": "结构：Menurut saya, 主语 + harus + 动词 + dengan + 形容词, dan jangan + 动词。jangan + 动词 = 别做……。terlalu + 形容词 = 太……。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, mengapa banyak orang masih suka berbelanja di pasar tradisional meskipun sudah ada supermarket dan toko online?", "zh": "已经有超市和网店了，为什么很多人还是喜欢去传统市场？", "a": "9c9e90eba48e", "an": {"p": [["Menurutmu", "依你看"], ["mengapa", "为什么"], ["banyak orang", "很多人"], ["masih suka", "仍然喜欢"], ["berbelanja", "购物"], ["di pasar tradisional", "在传统市场"], ["meskipun", "尽管"], ["sudah ada", "已经有"], ["supermarket", "超市"], ["dan", "和"], ["toko online", "网店"]], "b": "", "g": "结构：Mengapa + 主语 + masih + 动词 + meskipun + 从句？meskipun = 尽管。masih = 仍然。"}}, {"sp": "参考回答", "role": "a", "id": "Karena barang di pasar tradisional lebih segar, harganya lebih murah, dan kita bisa menawar.", "zh": "因为传统市场的东西更新鲜、更便宜，还可以砍价。", "a": "de4cce951080", "an": {"p": [["Karena", "因为"], ["barang", "东西"], ["di pasar tradisional", "在传统市场"], ["lebih segar", "更新鲜"], ["harganya", "价格"], ["lebih murah", "更便宜"], ["dan", "并且"], ["kita bisa", "我们能"], ["menawar", "砍价"]], "b": "", "g": "结构：Karena + 三个并列原因。回答 Mengapa 问句时，直接用 Karena 开头。"}}, {"sp": "考官", "role": "q", "id": "Jika akhir pekan nanti kamu punya waktu luang seharian, rencana kegiatan apa yang akan kamu lakukan bersama keluarga? Jelaskan rencanamu secara singkat.", "zh": "如果这个周末你有一整天空闲，你打算和家人做什么？简单说说你的计划。", "a": "185dc0b717c2", "an": {"p": [["Jika", "如果"], ["akhir pekan nanti", "这个周末"], ["kamu", "你"], ["punya", "有"], ["waktu luang", "空闲时间"], ["seharian", "一整天"], ["rencana kegiatan apa", "什么样的活动计划"], ["yang akan kamu lakukan", "你会做的"], ["bersama keluarga", "和家人一起"], ["Jelaskan", "请说明"], ["rencanamu", "你的计划"], ["secara singkat", "简要地"]], "b": "seharian = se- + hari + -an（整整一天）；secara = 以……方式", "g": "结构：Jika + 条件, 问句；Jelaskan + 宾语 + secara + 形容词（简要地）。secara + 形容词 = 副词用法。"}}, {"sp": "参考回答", "role": "a", "id": "Pagi hari kami berbelanja di pasar, siang hari kami memasak bersama, dan sore hari kami jalan-jalan ke taman.", "zh": "早上我们去市场买东西，中午一起做饭，下午去公园散步。", "a": "a63e5320fdd2", "an": {"p": [["Pagi hari", "早上"], ["kami", "我们"], ["berbelanja", "购物"], ["di pasar", "在市场"], ["siang hari", "中午"], ["memasak bersama", "一起做饭"], ["dan", "和"], ["sore hari", "下午"], ["jalan-jalan", "散步"], ["ke taman", "去公园"]], "b": "", "g": "结构：三个并列分句：时间 + 主语 + 动词短语。按时间顺序描述计划。"}}, {"sp": "考官", "role": "q", "id": "Pernahkah kamu membantu orang tuamu membersihkan rumah atau memasak? Apa yang kamu bantu dan bagaimana perasaanmu setelah membantu?", "zh": "你帮父母打扫过房子或做过饭吗？帮了什么，帮完感觉怎么样？", "a": "46210977511e", "an": {"p": [["Pernahkah", "曾经……吗"], ["kamu", "你"], ["membantu", "帮助"], ["orang tuamu", "你的父母"], ["membersihkan rumah", "打扫房子"], ["atau", "或"], ["memasak", "做饭"], ["Apa yang kamu bantu", "你帮了什么"], ["bagaimana", "怎样"], ["perasaanmu", "你的感受"], ["setelah", "之后"]], "b": "pernahkah = pernah + -kah；perasaanmu = perasaan + -mu", "g": "结构：Pernahkah + 主语 + 动词 + 人 + 动词短语？membantu + 人 + 做某事 = 帮某人做……。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Saya pernah membantu ibu memasak. Saya merasa senang karena bisa membantu.", "zh": "帮过。我帮妈妈做过饭，能帮上忙我很开心。", "a": "a10aec4f2711", "an": {"p": [["Pernah", "曾经"], ["Saya", "我"], ["membantu ibu memasak", "帮妈妈做饭"], ["merasa senang", "觉得开心"], ["karena", "因为"], ["bisa membantu", "能帮上忙"]], "b": "", "g": "结构：主语 + pernah + 动词 + 人 + 动词。merasa + 形容词 + karena + 原因。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-28"}, {"id": "t161", "kind": "trans", "book": "BIPA 2", "title": "BIPA 2 练习 · 互译补充 4 句", "lines": [{"sp": "", "role": "t", "id": "Ada banyak pohon buah-buahan di dekat rumah saya, dan udaranya sangat segar.", "zh": "我家附近有很多果树，空气很好。", "a": "ca9b163d722c", "za": "fa47f14d38f6", "an": {"p": [["Ada", "有"], ["banyak pohon buah-buahan", "很多果树"], ["di dekat rumah saya", "在我家附近"], ["dan", "并且"], ["udaranya", "空气"], ["sangat segar", "很清新"]], "b": "", "g": "结构：Ada + 数量 + 名词 + 地点, dan + 主语 + 形容词。pohon buah-buahan = 果树。"}}, {"sp": "", "role": "t", "id": "Ibu saya bekerja dari rumah, tetapi ayah saya bekerja di kantor.", "zh": "我的妈妈在家里工作，但是我的爸爸在办公室工作。", "a": "2c5f03a3e9cb", "za": "826d8f73aa50", "an": {"p": [["Ibu saya", "我妈妈"], ["bekerja", "工作"], ["dari rumah", "在家（从家里）"], ["tetapi", "但是"], ["ayah saya", "我爸爸"], ["di kantor", "在办公室"]], "b": "", "g": "结构：A 主语 + 动词 + 地点, tetapi B 主语 + 动词 + 地点。bekerja dari rumah = 居家办公。"}}, {"sp": "", "role": "t", "id": "Ibu saya sering memasak makan siang di rumah.", "zh": "我的妈妈经常在家做午饭。", "a": "190ab9456a4f", "za": "6d913719336a", "an": {"p": [["Ibu saya", "我妈妈"], ["sering", "经常"], ["memasak", "做"], ["makan siang", "午饭"], ["di rumah", "在家"]], "b": "", "g": "结构：主语 + 频率 + 动词 + 宾语 + 地点。"}}, {"sp": "", "role": "t", "id": "Kakek saya suka minum kopi sambil membaca koran.", "zh": "爷爷喜欢一边看报纸一边喝咖啡。", "a": "89148c4f4b3a", "za": "920b6fa505c3", "an": {"p": [["Kakek saya", "我爷爷"], ["suka", "喜欢"], ["minum kopi", "喝咖啡"], ["sambil", "一边"], ["membaca koran", "看报纸"]], "b": "", "g": "结构：主语 + suka + 动词 1 + 宾语 + sambil + 动词 2 + 宾语。sambil 连接同时进行的动作。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-28"}, {"id": "t162", "kind": "text", "book": "BIPA 2", "title": "BIPA 2 练习 · 去传统市场 Ke Pasar Tradisional", "lines": [{"sp": "", "role": "r", "id": "Hari Minggu pagi, saya pergi ke pasar tradisional bersama ibu saya.", "zh": "周日早上，我和妈妈去传统市场。", "a": "a7837be92ed6", "za": "00fbce554208", "an": {"p": [["Hari Minggu pagi", "星期天早上"], ["saya", "我"], ["pergi", "去"], ["ke pasar tradisional", "到传统市场"], ["bersama ibu saya", "和我妈妈一起"]], "b": "", "g": "结构：时间 + 主语 + pergi + ke + 地点 + bersama + 人。"}}, {"sp": "", "role": "r", "id": "Kami pergi naik sepeda motor.", "zh": "我们骑摩托车去。", "a": "8feebc451286", "za": "efa098f8186b", "an": {"p": [["Kami", "我们"], ["pergi", "去"], ["naik", "乘"], ["sepeda motor", "摩托车"]], "b": "", "g": "结构：主语 + pergi + naik + 交通工具。pergi naik + 工具 = 乘……去。"}}, {"sp": "", "role": "r", "id": "Di pasar, ibu membeli wortel, kangkung, cabai, tomat, apel, dan pisang.", "zh": "在市场，妈妈买了胡萝卜、空心菜、辣椒、番茄、苹果和香蕉。", "a": "4dbc6cdc2c2f", "za": "b3a0a67daed6", "an": {"p": [["Di pasar", "在市场"], ["ibu", "妈妈"], ["membeli", "买"], ["wortel", "胡萝卜"], ["kangkung", "空心菜"], ["cabai", "辣椒"], ["tomat", "番茄"], ["apel", "苹果"], ["dan", "和"], ["pisang", "香蕉"]], "b": "", "g": "结构：地点, 主语 + 动词 + 并列宾语。蔬菜水果名词列表，最后一项前加 dan。"}}, {"sp": "", "role": "r", "id": "Ibu suka menawar harga karena barang di pasar bisa ditawar.", "zh": "妈妈喜欢砍价，因为市场里的东西可以讲价。", "a": "82a2f1b49993", "za": "e20edb5c8a4e", "an": {"p": [["Ibu", "妈妈"], ["suka", "喜欢"], ["menawar harga", "砍价"], ["karena", "因为"], ["barang di pasar", "市场的东西"], ["bisa ditawar", "可以砍价"]], "b": "ditawar = di- + tawar（被讨价）", "g": "结构：主语 + suka + 动词短语 + karena + 名词 + bisa + 被动。bisa ditawar = 能被砍价，即“可以还价”。"}}, {"sp": "", "role": "r", "id": "Saya membantu ibu membawa belanjaan yang sudah dimasukkan ke dalam kantong plastik.", "zh": "我帮妈妈拿装在塑料袋里的东西。", "a": "d03262e7849f", "za": "3423f9a5f265", "an": {"p": [["Saya", "我"], ["membantu", "帮"], ["ibu", "妈妈"], ["membawa", "拿"], ["belanjaan", "买的东西"], ["yang sudah dimasukkan", "已经被装进去的"], ["ke dalam", "到……里"], ["kantong plastik", "塑料袋"]], "b": "belanjaan = belanja + -an；dimasukkan = di- + masuk + -kan（被放入）", "g": "结构：主语 + membantu + 人 + 动词 + 宾语 + yang + 被动从句。yang 从句用被动：已经装进塑料袋的东西。"}}, {"sp": "", "role": "r", "id": "Setelah selesai belanja, kami makan bakso di warung dekat pasar.", "zh": "买完东西后，我们在市场旁边的小店吃肉丸。", "a": "03c69b2afd17", "za": "70948e0680f8", "an": {"p": [["Setelah selesai belanja", "买完东西之后"], ["kami", "我们"], ["makan bakso", "吃肉丸"], ["di warung", "在小店"], ["dekat pasar", "靠近市场"]], "b": "", "g": "结构：Setelah + selesai + 动词, 主语 + 动词 + 宾语 + 地点。selesai belanja = 买完东西。"}}, {"sp": "", "role": "r", "id": "Saya sangat senang karena bisa menghabiskan waktu bersama ibu.", "zh": "我很开心，因为可以陪妈妈。", "a": "a6173e2b1143", "za": "be5e59f095c9", "an": {"p": [["Saya", "我"], ["sangat senang", "很开心"], ["karena", "因为"], ["bisa", "能"], ["menghabiskan waktu", "度过时间"], ["bersama ibu", "和妈妈一起"]], "b": "menghabiskan = meN- + habis + -kan", "g": "结构：主语 + sangat senang + karena + bisa + 动词短语。menghabiskan waktu bersama + 人 = 和某人共度时光。"}}], "zh": "周日早上，我和妈妈去传统市场。我们骑摩托车去。在市场，妈妈买了胡萝卜、空心菜、辣椒、番茄、苹果和香蕉。妈妈喜欢砍价，因为市场里的东西可以讲价。我帮妈妈拿装在塑料袋里的东西。买完东西后，我们在市场旁边的小店吃肉丸。我很开心，因为可以陪妈妈。", "note": "同一场考试的阅读主题还有：乐器、成为一名老师。笔记里的词：kantong belanja 购物袋 · pedagang berteriak menawarkan dagangan 商贩大声叫卖 · menikmati udara sore hari 享受傍晚的空气 · bawang 洋葱 · suasana 氛围 · warung 小吃店。", "qa": [], "new": "2026-10-28"}, {"id": "e163", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 1 单元 音乐 Musik", "lines": [{"sp": "考官", "role": "q", "id": "Alat musik apa yang paling kamu sukai? Mengapa?", "zh": "你最喜欢什么乐器？为什么？", "a": "74dda98886f9", "an": {"p": [["Alat musik apa", "什么乐器"], ["yang paling kamu sukai", "你最喜欢的"], ["Mengapa", "为什么"]], "b": "sukai = suka + -i（动词原形）", "g": "结构：名词 + apa + yang + paling + 主语 + 动词原形？yang paling kamu sukai = 你最喜爱的。"}}, {"sp": "参考回答", "role": "a", "id": "Saya paling suka gitar, karena suaranya indah dan gitar mudah dipelajari.", "zh": "我最喜欢吉他，因为声音好听，而且容易学。", "a": "671eeef1ba74", "an": {"p": [["Saya", "我"], ["paling suka", "最喜欢"], ["gitar", "吉他"], ["karena", "因为"], ["suaranya", "它的声音"], ["indah", "好听"], ["dan", "并且"], ["gitar", "吉他"], ["mudah dipelajari", "容易学"]], "b": "dipelajari = di- + pelajar + -i（被学习）", "g": "结构：主语 + paling suka + 名词, karena + 主语 + 形容词 + dan + 主语 + mudah + 被动。mudah dipelajari = 容易被学会。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu bisa bermain alat musik? Sejak kapan kamu belajar?", "zh": "你会演奏乐器吗？从什么时候开始学的？", "a": "95320ca22c2d", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["bisa", "会"], ["bermain alat musik", "演奏乐器"], ["Sejak kapan", "从什么时候起"], ["kamu", "你"], ["belajar", "学"]], "b": "sejak = prep. 自从", "g": "结构：Apakah + 主语 + bisa + 动词短语？Sejak kapan + 主语 + 动词？问起点时间。"}}, {"sp": "参考回答", "role": "a", "id": "Saya belum bisa bermain alat musik, tetapi saya ingin belajar gitar tahun depan.", "zh": "我还不会演奏乐器，但我想明年学吉他。", "a": "6d0da52984ac", "an": {"p": [["Saya", "我"], ["belum bisa", "还不会"], ["bermain alat musik", "演奏乐器"], ["tetapi", "但是"], ["ingin belajar", "想学"], ["gitar", "吉他"], ["tahun depan", "明年"]], "b": "", "g": "结构：主语 + belum bisa + 动词短语, tetapi + 主语 + ingin + 动词 + 时间。belum bisa = 还不会。"}}, {"sp": "考官", "role": "q", "id": "Musik apa yang biasanya kamu dengarkan? Kapan kamu mendengarkannya?", "zh": "你平时听什么音乐？什么时候听？", "a": "3f73f6e9751d", "an": {"p": [["Musik apa", "什么音乐"], ["yang biasanya kamu dengarkan", "你通常听的"], ["Kapan", "什么时候"], ["kamu", "你"], ["mendengarkannya", "听它"]], "b": "dengarkan = dengar + -kan（动词原形）；mendengarkannya = mendengarkan + -nya", "g": "结构：名词 + apa + yang + 副词 + 主语 + 动词原形？；Kapan + 主语 + 动词 + -nya？-nya 指前面的“音乐”。"}}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya mendengarkan musik pop Mandarin. Saya mendengarkannya sebelum tidur atau di jalan ke kantor.", "zh": "我平时听中文流行歌，睡觉前或者去上班的路上听。", "a": "bdb6d8c1b495", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["mendengarkan musik pop Mandarin", "听华语流行音乐"], ["mendengarkannya", "听它"], ["sebelum tidur", "睡前"], ["atau", "或"], ["di jalan ke kantor", "在去办公室的路上"]], "b": "", "g": "结构：主语 + 副词 + 动词 + 宾语；第二句 -nya 指代上句宾语。sebelum + 动词 = ……之前。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah menonton konser musik? Ceritakan pengalamanmu.", "zh": "你看过音乐会吗？讲讲你的经历。", "a": "710c414058d5", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["menonton", "看"], ["konser musik", "音乐会"], ["Ceritakan", "请讲述"], ["pengalamanmu", "你的经历"]], "b": "", "g": "结构：Apakah + 主语 + pernah + 动词 + 宾语？Ceritakan + 宾语 = 请讲讲……。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Dua tahun yang lalu saya menonton konser bersama teman. Suasananya sangat ramai dan seru.", "zh": "看过。两年前我和朋友去看过一场音乐会，气氛很热闹，很好玩。", "a": "994dc79e5256", "an": {"p": [["Pernah", "曾经"], ["Dua tahun yang lalu", "两年前"], ["saya", "我"], ["menonton konser", "看音乐会"], ["bersama teman", "和朋友一起"], ["Suasananya", "气氛"], ["sangat", "很"], ["ramai", "热闹"], ["dan", "并且"], ["seru", "精彩"]], "b": "", "g": "结构：时间（yang lalu = 以前）+ 主语 + 动词 + 宾语；Suasananya + 形容词。dua tahun yang lalu = 两年前。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, apa manfaat mendengarkan musik?", "zh": "你觉得听音乐有什么好处？", "a": "4f639f3fa74a", "an": {"p": [["Menurutmu", "依你看"], ["apa", "什么"], ["manfaat", "好处"], ["mendengarkan musik", "听音乐"]], "b": "", "g": "结构：Apa + manfaat + 动词短语？问“……有什么好处”。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, musik bisa membuat kita senang dan menghilangkan stres setelah bekerja.", "zh": "我觉得音乐能让人开心，下班后还能减压。", "a": "1b4f3a909ad1", "an": {"p": [["Menurut saya", "依我看"], ["musik", "音乐"], ["bisa", "能"], ["membuat kita senang", "让我们开心"], ["dan", "并且"], ["menghilangkan stres", "消除压力"], ["setelah bekerja", "工作之后"]], "b": "menghilangkan = meN- + hilang + -kan（vt. 使消失）", "g": "结构：主语 + bisa + membuat + 人 + 形容词 + dan + 动词短语。membuat + 人 + 形容词 = 使某人……。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu mau belajar alat musik, kamu lebih suka belajar sendiri atau di kursus? Mengapa?", "zh": "如果你想学乐器，你更喜欢自学还是上培训班？为什么？", "a": "a6221057a77f", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["mau", "想"], ["belajar alat musik", "学乐器"], ["lebih suka", "更喜欢"], ["belajar sendiri", "自学"], ["atau", "还是"], ["di kursus", "在培训班"], ["Mengapa", "为什么"]], "b": "", "g": "结构：Kalau + 条件, 主语 + lebih suka + A atau B？sendiri = 自己。"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka belajar di kursus, karena ada guru yang bisa membantu kalau saya salah.", "zh": "我更喜欢上培训班，因为我弹错的时候有老师帮忙。", "a": "7eacbf965211", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["belajar di kursus", "在培训班学"], ["karena", "因为"], ["ada guru", "有老师"], ["yang bisa membantu", "能帮助的"], ["kalau saya salah", "如果我错了"]], "b": "", "g": "结构：主语 + lebih suka + 动词短语, karena + ada + 名词 + yang 从句 + kalau + 条件。"}}], "zh": "", "note": "本单元生词：alat musik n. 乐器 · gitar n. 吉他 · piano n. 钢琴 · biola n. 小提琴 · drum n. 鼓 · menyanyi vi. 唱歌 · lagu n. 歌 · konser n. 音乐会 · panggung n. 舞台 · tampil vi. 表演 · kursus n. 培训班", "qa": [], "new": "2026-10-28", "u": 1}, {"id": "e164", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 2 单元 工作 Pekerjaan", "lines": [{"sp": "考官", "role": "q", "id": "Apa pekerjaanmu sekarang? Apa yang kamu lakukan setiap hari di kantor?", "zh": "你现在做什么工作？每天在办公室做什么？", "a": "551aa34018f7", "an": {"p": [["Apa", "什么"], ["pekerjaanmu", "你的工作"], ["sekarang", "现在"], ["yang kamu lakukan", "你做的"], ["setiap hari", "每天"], ["di kantor", "在办公室"]], "b": "", "g": "结构：Apa + 名词-mu + 时间？Apa yang + 主语 + 动词原形 + 频率 + 地点？"}}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai akuntan di departemen keuangan. Setiap hari saya membuat laporan keuangan dan memeriksa kontrak.", "zh": "我在财务部当会计，每天做财务报表、审核合同。", "a": "4a492e693a67", "an": {"p": [["Saya", "我"], ["bekerja", "工作"], ["sebagai", "作为"], ["akuntan", "会计"], ["di departemen keuangan", "在财务部"], ["Setiap hari", "每天"], ["membuat", "做"], ["laporan keuangan", "财务报告"], ["dan", "和"], ["memeriksa", "审查"], ["kontrak", "合同"]], "b": "laporan = lapor + -an；keuangan = ke- + uang + -an", "g": "结构：主语 + bekerja sebagai + 职业 + 部门；频率 + 主语 + 动词 1 + 宾语 + dan + 动词 2 + 宾语。sebagai = 作为。"}}, {"sp": "考官", "role": "q", "id": "Apa yang kamu sukai dan tidak sukai dari pekerjaanmu?", "zh": "你的工作有什么你喜欢和不喜欢的地方？", "a": "e4cdc6fb8724", "an": {"p": [["Apa", "什么"], ["yang kamu sukai", "你喜欢的"], ["dan", "和"], ["tidak sukai", "不喜欢"], ["dari pekerjaanmu", "关于你的工作"]], "b": "sukai = suka + -i", "g": "结构：Apa + yang + 主语 + 动词原形 + dan tidak + 动词原形 + dari + 名词？yang kamu sukai dan tidak sukai = 你喜欢的和不喜欢的。"}}, {"sp": "参考回答", "role": "a", "id": "Saya suka pekerjaan saya karena rekan kerja saya ramah. Tetapi kadang-kadang pekerjaannya terlalu banyak.", "zh": "我喜欢我的工作，因为同事很友好。但有时候工作太多。", "a": "e64a15e0700f", "an": {"p": [["Saya", "我"], ["suka", "喜欢"], ["pekerjaan saya", "我的工作"], ["karena", "因为"], ["rekan kerja saya", "我的同事"], ["ramah", "友好"], ["Tetapi", "但是"], ["kadang-kadang", "有时"], ["pekerjaannya", "工作量"], ["terlalu banyak", "太多"]], "b": "rekan = n. 同伴；pekerjaannya = pekerjaan + -nya", "g": "结构：主语 + suka + 名词, karena + 从句。Tetapi + 副词 + 主语 + terlalu + 形容词。terlalu banyak = 太多。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, pekerjaan apa yang paling populer di negaramu? Mengapa?", "zh": "你觉得在你的国家什么工作最受欢迎？为什么？", "a": "1856050cfe0d", "an": {"p": [["Menurutmu", "依你看"], ["pekerjaan apa", "什么职业"], ["yang paling populer", "最热门的"], ["di negaramu", "在你的国家"], ["Mengapa", "为什么"]], "b": "negaramu = negara + -mu", "g": "结构：名词 + apa + yang + paling + 形容词 + 地点？paling populer = 最受欢迎。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, guru dan dokter adalah pekerjaan yang populer di Tiongkok, karena pekerjaannya stabil dan dihormati orang.", "zh": "我觉得在中国老师和医生很受欢迎，因为工作稳定，也受人尊重。", "a": "6ac2bc9390b7", "an": {"p": [["Menurut saya", "依我看"], ["guru dan dokter", "老师和医生"], ["adalah", "是"], ["pekerjaan yang populer", "热门的职业"], ["di Tiongkok", "在中国"], ["karena", "因为"], ["pekerjaannya", "这些工作"], ["stabil", "稳定"], ["dan", "并且"], ["dihormati orang", "被人尊敬"]], "b": "dihormati = di- + hormat + -i（被尊敬）", "g": "结构：主语（并列）+ adalah + 名词 + yang + 形容词, karena + 主语 + 形容词 + dan + 被动。被动句：dihormati orang = 受人尊敬。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu bisa memilih, kamu ingin bekerja di kantor atau di rumah? Mengapa?", "zh": "如果可以选，你想在办公室工作还是在家工作？为什么？", "a": "a84b8ddddb73", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["bisa memilih", "能选择"], ["ingin", "想"], ["bekerja", "工作"], ["di kantor", "在办公室"], ["atau", "还是"], ["di rumah", "在家"], ["Mengapa", "为什么"]], "b": "", "g": "结构：Kalau + 条件, 主语 + ingin + 动词 + A atau B？"}}, {"sp": "参考回答", "role": "a", "id": "Saya ingin bekerja di kantor, karena saya bisa bertemu dengan rekan kerja dan lebih fokus.", "zh": "我想在办公室工作，因为能见到同事，也更专心。", "a": "768078266921", "an": {"p": [["Saya", "我"], ["ingin", "想"], ["bekerja di kantor", "在办公室工作"], ["karena", "因为"], ["saya bisa", "我能"], ["bertemu dengan", "见到"], ["rekan kerja", "同事"], ["dan", "并且"], ["lebih fokus", "更专注"]], "b": "bertemu = ber- + temu（vi. 见面）", "g": "结构：主语 + ingin + 动词短语, karena + 主语 + bisa + 动词 + dengan + 人 + dan + 形容词。bertemu dengan + 人 = 和某人见面。"}}, {"sp": "考官", "role": "q", "id": "Apa yang kamu lakukan kalau pekerjaanmu terlalu banyak?", "zh": "如果工作太多，你会怎么做？", "a": "fb49c49f173a", "an": {"p": [["Apa", "什么"], ["yang kamu lakukan", "你做的"], ["kalau", "如果"], ["pekerjaanmu", "你的工作"], ["terlalu banyak", "太多"]], "b": "", "g": "结构：Apa yang + 主语 + 动词原形 + kalau + 条件？"}}, {"sp": "参考回答", "role": "a", "id": "Kalau pekerjaan saya terlalu banyak, saya membuat daftar pekerjaan dan menyelesaikan yang paling penting dulu.", "zh": "如果工作太多，我会列个清单，先做最重要的。", "a": "6a9238ac24b0", "an": {"p": [["Kalau", "如果"], ["pekerjaan saya", "我的工作"], ["terlalu banyak", "太多"], ["saya membuat", "我做"], ["daftar pekerjaan", "工作清单"], ["dan", "并且"], ["menyelesaikan", "完成"], ["yang paling penting", "最重要的"], ["dulu", "先"]], "b": "", "g": "结构：Kalau + 条件, 主语 + 动词 1 + 宾语 + dan + 动词 2 + yang paling + 形容词 + dulu。yang paling penting = 最重要的那件（yang 指代名词）。"}}, {"sp": "考官", "role": "q", "id": "Apa cita-citamu waktu kecil? Mengapa?", "zh": "你小时候的理想是什么？为什么？", "a": "7747a4bb4644", "an": {"p": [["Apa", "什么"], ["cita-citamu", "你的理想"], ["waktu kecil", "小时候"], ["Mengapa", "为什么"]], "b": "cita-cita = n. 理想（重叠）", "g": "结构：Apa + 名词-mu + 时间？cita-cita = 梦想、志向。waktu kecil = 小时候。"}}, {"sp": "参考回答", "role": "a", "id": "Waktu kecil saya ingin menjadi guru, karena saya suka membantu orang belajar.", "zh": "小时候我想当老师，因为我喜欢帮助别人学习。", "a": "3b4cf6fea1a5", "an": {"p": [["Waktu kecil", "小时候"], ["saya", "我"], ["ingin", "想"], ["menjadi guru", "成为老师"], ["karena", "因为"], ["saya suka", "我喜欢"], ["membantu", "帮助"], ["orang belajar", "人们学习"]], "b": "", "g": "结构：时间 + 主语 + ingin + menjadi + 职业, karena + 主语 + suka + 动词 + 人 + 动词。membantu + 人 + 动词 = 帮人做……。"}}], "zh": "", "note": "本单元生词：pekerjaan n. 工作 · akuntan n. 会计 · departemen keuangan n. 财务部 · gaji n. 工资 · rapat n. 会议 · atasan n. 上司 · rekan kerja n. 同事 · lembur vi. 加班 · pengalaman n. 经验 · cita-cita n. 理想", "qa": [], "new": "2026-10-28", "u": 2}, {"id": "e165", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 3 单元 通知 Pengumuman", "lines": [{"sp": "考官", "role": "q", "id": "Di mana biasanya kamu melihat pengumuman di kantor?", "zh": "你平时在公司哪里看通知？", "a": "3cf1e8a35d92", "an": {"p": [["Di mana", "在哪里"], ["biasanya", "通常"], ["kamu", "你"], ["melihat", "看"], ["pengumuman", "通知"], ["di kantor", "在办公室"]], "b": "pengumuman = pe- + umum + -an（n. 通知、公告）", "g": "结构：Di mana + 副词 + 主语 + 动词 + 宾语 + 地点？问“通常在哪里看”。pengumuman = 公告。"}}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya melihat pengumuman di papan pengumuman dan di grup WeChat kantor.", "zh": "我一般在公告栏和公司的微信群里看通知。", "a": "596cc90ae44c", "an": {"p": [["Biasanya", "通常"], ["saya", "我"], ["melihat", "看"], ["pengumuman", "通知"], ["di papan pengumuman", "在公告栏"], ["dan", "和"], ["di grup WeChat kantor", "在公司微信群"]], "b": "papan = n. 板；grup = 群", "g": "结构：副词 + 主语 + 动词 + 宾语 + 地点 1 + dan + 地点 2。papan pengumuman = 公告栏。"}}, {"sp": "考官", "role": "q", "id": "Kamu lebih suka menerima pengumuman lewat telepon genggam atau lewat kertas? Mengapa?", "zh": "你更喜欢通过手机还是纸质收到通知？为什么？", "a": "5f56c9495a16", "an": {"p": [["Kamu", "你"], ["lebih suka", "更喜欢"], ["menerima", "接收"], ["pengumuman", "通知"], ["lewat", "通过"], ["telepon genggam", "手机"], ["atau", "还是"], ["kertas", "纸"], ["Mengapa", "为什么"]], "b": "menerima = meN- + terima（vt. 接收）", "g": "结构：主语 + lebih suka + 动词 + 宾语 + lewat + A atau lewat + B？lewat = 通过（方式）。telepon genggam = 手机（正式说法，口语 HP）。"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka lewat telepon genggam, karena lebih cepat dan saya selalu membawanya.", "zh": "我更喜欢手机，因为更快，而且我总是带着手机。", "a": "7b45a5b760a2", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["lewat telepon genggam", "通过手机"], ["karena", "因为"], ["lebih cepat", "更快"], ["dan", "并且"], ["saya selalu", "我总是"], ["membawanya", "带着它"]], "b": "membawanya = membawa + -nya", "g": "结构：主语 + lebih suka + lewat + 工具, karena + 形容词 + dan + 主语 + selalu + 动词 + -nya。selalu = 总是。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah terlambat mengumpulkan tugas? Apa yang terjadi?", "zh": "你有没有晚交过作业或任务？发生了什么？", "a": "8dd829568a40", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["terlambat", "迟"], ["mengumpulkan", "交"], ["tugas", "作业、任务"], ["Apa yang terjadi", "发生了什么"]], "b": "mengumpulkan = meN- + kumpul + -kan（交上）；terjadi = ter- + jadi（vi. 发生）", "g": "结构：Apakah + 主语 + pernah + terlambat + 动词 + 宾语？terlambat + 动词 = 做某事迟了。terjadi = 发生。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Saya pernah terlambat mengumpulkan laporan, jadi atasan saya meminta saya lebih hati-hati.", "zh": "有过。我有一次晚交了报告，所以领导让我以后更小心。", "a": "76da45f0489d", "an": {"p": [["Pernah", "曾经"], ["Saya", "我"], ["terlambat", "迟"], ["mengumpulkan laporan", "交报告"], ["jadi", "所以"], ["atasan saya", "我的上司"], ["meminta", "要求"], ["saya", "我"], ["lebih hati-hati", "更小心"]], "b": "atasan = atas + -an（n. 上司）；hati-hati = hati 重叠（小心）", "g": "结构：Pernah. 主语 + pernah + 动词, jadi + 主语 + meminta + 人 + 形容词。meminta + 人 + lebih + 形容词 = 要求某人更……。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, mengapa pengumuman itu penting?", "zh": "你觉得为什么通知很重要？", "a": "7886721b1076", "an": {"p": [["Menurutmu", "依你看"], ["mengapa", "为什么"], ["pengumuman itu", "那些通知"], ["penting", "重要"]], "b": "", "g": "结构：Mengapa + 主语 + 形容词？问理由。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, pengumuman penting karena kita bisa tahu jadwal dan informasi baru.", "zh": "我觉得通知很重要，因为我们能知道时间安排和新信息。", "a": "2927e219f57f", "an": {"p": [["Menurut saya", "依我看"], ["pengumuman", "通知"], ["penting", "重要"], ["karena", "因为"], ["kita bisa tahu", "我们能知道"], ["jadwal", "日程"], ["dan", "和"], ["informasi baru", "新信息"]], "b": "jadwal = n. 时间表", "g": "结构：Menurut saya, 主语 + 形容词 + karena + kita bisa + 动词 + 宾语。bisa tahu = 能够知道。"}}, {"sp": "考官", "role": "q", "id": "Kalau ada diskon di supermarket, bagaimana biasanya kamu tahu?", "zh": "超市打折的时候，你一般怎么知道？", "a": "f846053c8ca7", "an": {"p": [["Kalau", "如果"], ["ada diskon", "有折扣"], ["di supermarket", "在超市"], ["bagaimana", "怎样"], ["biasanya", "通常"], ["kamu tahu", "你知道"]], "b": "diskon = n. 折扣", "g": "结构：Kalau + 条件, bagaimana + 副词 + 主语 + 动词？问“通常怎么知道”。"}}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya tahu dari pengumuman di supermarket atau dari aplikasi di telepon genggam.", "zh": "我一般是看超市里的广播通知，或者手机上的应用。", "a": "9e7da0bc3430", "an": {"p": [["Biasanya", "通常"], ["saya tahu", "我知道"], ["dari", "从"], ["pengumuman di supermarket", "超市里的通知"], ["atau", "或"], ["dari aplikasi", "从应用"], ["di telepon genggam", "在手机上"]], "b": "", "g": "结构：副词 + 主语 + tahu + dari + 来源 1 + atau + dari + 来源 2。tahu dari = 从……得知。"}}, {"sp": "考官", "role": "q", "id": "Apa yang kamu lakukan agar tidak lupa jadwal penting?", "zh": "你怎么做才不会忘记重要的安排？", "a": "30f4b9032be7", "an": {"p": [["Apa", "什么"], ["yang kamu lakukan", "你做的"], ["agar", "为了"], ["tidak lupa", "不忘"], ["jadwal penting", "重要日程"]], "b": "", "g": "结构：Apa yang + 主语 + 动词原形 + agar tidak + 动词 + 宾语？问“你怎么做才不会忘”。"}}, {"sp": "参考回答", "role": "a", "id": "Agar tidak lupa, saya menulis jadwal di kalender telepon genggam dan memasang pengingat.", "zh": "为了不忘记，我把安排写进手机日历，还设了提醒。", "a": "d08449cf1b92", "an": {"p": [["Agar tidak lupa", "为了不忘"], ["saya", "我"], ["menulis jadwal", "记下日程"], ["di kalender telepon genggam", "在手机日历里"], ["dan", "并且"], ["memasang", "设置"], ["pengingat", "提醒"]], "b": "memasang = meN- + pasang；pengingat = peN- + ingat（n. 提醒功能）", "g": "结构：Agar tidak + 动词, 主语 + 动词 1 + 宾语 + 地点 + dan + 动词 2 + 宾语。memasang pengingat = 设置提醒。"}}], "zh": "", "note": "本单元生词：pengumuman n. 通知、公告 · papan pengumuman n. 公告栏 · jadwal n. 时间表 · tugas n. 作业、任务 · mengumpulkan vt. 交、收集 · batas waktu n. 截止时间 · diskon n. 打折 · pengingat n. 提醒 · terlambat vi. 晚了、迟到 · informasi n. 信息", "qa": [], "new": "2026-10-28", "u": 3}, {"id": "e166", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 4 单元 购物 Belanja", "lines": [{"sp": "考官", "role": "q", "id": "Kamu lebih suka belanja online atau langsung di toko? Mengapa?", "zh": "你更喜欢网购还是去商店买？为什么？", "a": "5557cd987f07", "an": {"p": [["Kamu", "你"], ["lebih suka", "更喜欢"], ["belanja online", "网购"], ["atau", "还是"], ["langsung di toko", "直接在店里"], ["Mengapa", "为什么"]], "b": "belanja = vi. 购物（词根作动词）", "g": "结构：主语 + lebih suka + A atau B？belanja online = 网购；langsung = 直接。"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka belanja langsung di toko, karena saya bisa melihat dan mencoba barangnya dulu.", "zh": "我更喜欢去商店买，因为可以先看看、试一试。", "a": "d6a29618df1d", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["belanja langsung di toko", "直接在店里买"], ["karena", "因为"], ["saya bisa", "我能"], ["melihat", "看"], ["dan", "和"], ["mencoba", "试"], ["barangnya", "那件东西"], ["dulu", "先"]], "b": "mencoba = meN- + coba（vt. 试）", "g": "结构：主语 + lebih suka + 动词短语, karena + 主语 + bisa + 动词 1 + dan + 动词 2 + 宾语 + dulu。dulu = 先（购买前）。"}}, {"sp": "考官", "role": "q", "id": "Barang apa yang terakhir kamu beli secara online?", "zh": "你上次网购买了什么？", "a": "fcb217e890e6", "an": {"p": [["Barang apa", "什么东西"], ["yang terakhir kamu beli", "你最近买的"], ["secara online", "以网购方式"]], "b": "", "g": "结构：名词 + apa + yang + terakhir + 主语 + 动词原形 + secara + 方式？terakhir = 最近一次。"}}, {"sp": "参考回答", "role": "a", "id": "Terakhir saya membeli sepatu olahraga secara online. Harganya lebih murah daripada di toko.", "zh": "我上次在网上买了运动鞋，比店里便宜。", "a": "9fdeddada06a", "an": {"p": [["Terakhir", "最近一次"], ["saya", "我"], ["membeli", "买"], ["sepatu olahraga", "运动鞋"], ["secara online", "网购"], ["Harganya", "价格"], ["lebih murah", "更便宜"], ["daripada", "比"], ["di toko", "在店里"]], "b": "", "g": "结构：Terakhir + 主语 + 动词 + 宾语。Harganya + lebih + 形容词 + daripada + 比较对象。daripada = 比。"}}, {"sp": "考官", "role": "q", "id": "Kalau baju yang kamu beli terlalu kecil, apa yang akan kamu lakukan?", "zh": "如果你买的衣服太小了，你会怎么办？", "a": "57787e973484", "an": {"p": [["Kalau", "如果"], ["baju", "衣服"], ["yang kamu beli", "你买的"], ["terlalu kecil", "太小"], ["apa yang akan kamu lakukan", "你会怎么做"]], "b": "", "g": "结构：Kalau + 名词 + yang + 主语 + 动词原形 + 形容词, 问句。terlalu + 形容词 = 太……。"}}, {"sp": "参考回答", "role": "a", "id": "Kalau bajunya terlalu kecil, saya akan menukarnya dengan ukuran yang lebih besar.", "zh": "如果衣服太小，我会去换大一号的。", "a": "a2dafd198f9e", "an": {"p": [["Kalau", "如果"], ["bajunya", "那件衣服"], ["terlalu kecil", "太小"], ["saya akan", "我会"], ["menukarnya", "换它"], ["dengan", "换成"], ["ukuran", "尺码"], ["yang lebih besar", "更大的"]], "b": "menukarnya = menukar + -nya；ukuran = ukur + -an（n. 尺码）", "g": "结构：Kalau + 条件, 主语 + akan + 动词-nya + dengan + 名词 + yang + 比较级。menukar A dengan B = 把 A 换成 B。"}}, {"sp": "考官", "role": "q", "id": "Apa yang kamu perhatikan sebelum membeli baju?", "zh": "买衣服之前你会注意什么？", "a": "1a54a2c1af38", "an": {"p": [["Apa", "什么"], ["yang kamu perhatikan", "你注意的"], ["sebelum", "在……之前"], ["membeli baju", "买衣服"]], "b": "perhatikan = perhati + -kan（动词原形）", "g": "结构：Apa yang + 主语 + 动词原形 + sebelum + 动词短语？memperhatikan = 注意。"}}, {"sp": "参考回答", "role": "a", "id": "Sebelum membeli baju, saya memperhatikan ukuran, warna, dan harganya.", "zh": "买衣服前，我会看尺码、颜色和价格。", "a": "61db99863c47", "an": {"p": [["Sebelum membeli baju", "买衣服之前"], ["saya", "我"], ["memperhatikan", "注意"], ["ukuran", "尺码"], ["warna", "颜色"], ["dan", "和"], ["harganya", "价格"]], "b": "memperhatikan = memper- + hati + -kan", "g": "结构：Sebelum + 动词短语, 主语 + 动词 + 并列宾语。三个宾语：ukuran, warna, harga。"}}, {"sp": "考官", "role": "q", "id": "Berapa kali dalam sebulan kamu pergi berbelanja?", "zh": "你一个月去买几次东西？", "a": "92dae36e768e", "an": {"p": [["Berapa kali", "几次"], ["dalam sebulan", "一个月内"], ["kamu", "你"], ["pergi berbelanja", "去购物"]], "b": "sebulan = se- + bulan", "g": "结构：Berapa kali + dalam + 时间 + 主语 + 动词？问频率。dalam sebulan = 在一个月里。"}}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya pergi berbelanja dua atau tiga kali dalam sebulan, biasanya pada akhir pekan.", "zh": "我一般一个月去两三次，通常是周末。", "a": "0bee1cbf0d47", "an": {"p": [["Biasanya", "通常"], ["saya", "我"], ["pergi berbelanja", "去购物"], ["dua atau tiga kali", "两三次"], ["dalam sebulan", "一个月"], ["pada akhir pekan", "在周末"]], "b": "", "g": "结构：副词 + 主语 + 动词 + 次数 + dalam + 时间 + 补充。dua atau tiga = 两三（atau 表约数）。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, apa kelebihan dan kekurangan belanja online?", "zh": "你觉得网购有什么优点和缺点？", "a": "87c4a51095f9", "an": {"p": [["Menurutmu", "依你看"], ["apa", "什么"], ["kelebihan", "优点"], ["dan", "和"], ["kekurangan", "缺点"], ["belanja online", "网购"]], "b": "kelebihan = ke- + lebih + -an；kekurangan = ke- + kurang + -an", "g": "结构：Apa + kelebihan dan kekurangan + 名词？kelebihan = 优点，kekurangan = 缺点。"}}, {"sp": "参考回答", "role": "a", "id": "Kelebihannya, belanja online cepat dan mudah. Kekurangannya, kita tidak bisa mencoba barangnya dulu.", "zh": "优点是网购又快又方便；缺点是不能先试。", "a": "1880fa38299b", "an": {"p": [["Kelebihannya", "优点是"], ["belanja online", "网购"], ["cepat", "快"], ["dan", "并且"], ["mudah", "方便"], ["Kekurangannya", "缺点是"], ["kita", "我们"], ["tidak bisa", "不能"], ["mencoba", "试"], ["barangnya", "东西"], ["dulu", "先"]], "b": "kelebihannya = kelebihan + -nya", "g": "结构：Kelebihannya, 主语 + 形容词。Kekurangannya, 主语 + tidak bisa + 动词。-nya 指代“网购的”。"}}], "zh": "", "note": "本单元生词：belanja online 网购 · toko n. 商店 · ukuran n. 尺码 · mencoba vt. 试 · menukar vt. 换 · harga n. 价格 · diskon n. 打折 · menawar vt. 砍价 · murah adj. 便宜 · mahal adj. 贵 · kelebihan n. 优点 · kekurangan n. 缺点", "qa": [], "new": "2026-10-28", "u": 4}, {"id": "e167", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 5 单元 饮食 Makanan", "lines": [{"sp": "考官", "role": "q", "id": "Makanan Indonesia apa yang paling kamu sukai? Mengapa?", "zh": "你最喜欢什么印尼菜？为什么？", "a": "d2d16527f660", "an": {"p": [["Makanan Indonesia apa", "什么印尼食物"], ["yang paling kamu sukai", "你最喜欢的"], ["Mengapa", "为什么"]], "b": "", "g": "结构：名词 + apa + yang + paling + 主语 + 动词原形？"}}, {"sp": "参考回答", "role": "a", "id": "Saya paling suka nasi goreng, karena rasanya enak dan harganya tidak mahal.", "zh": "我最喜欢炒饭，因为好吃又不贵。", "a": "b43e977c9f3d", "an": {"p": [["Saya", "我"], ["paling suka", "最喜欢"], ["nasi goreng", "炒饭"], ["karena", "因为"], ["rasanya", "味道"], ["enak", "好吃"], ["dan", "并且"], ["harganya", "价格"], ["tidak mahal", "不贵"]], "b": "rasanya = rasa + -nya", "g": "结构：主语 + paling suka + 名词, karena + 名词-nya + 形容词 + dan + 名词-nya + 形容词。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu suka makanan pedas?", "zh": "你喜欢吃辣吗？", "a": "2ebeca0a4796", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["suka", "喜欢"], ["makanan pedas", "辣的食物"]], "b": "pedas = adj. 辣", "g": "结构：Apakah + 主语 + suka + 名词短语？"}}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka makanan pedas, tetapi tidak terlalu pedas.", "zh": "喜欢，但不能太辣。", "a": "0894ea1250c1", "an": {"p": [["Ya", "是的"], ["saya", "我"], ["suka", "喜欢"], ["makanan pedas", "辣的食物"], ["tetapi", "但是"], ["tidak terlalu pedas", "不太辣"]], "b": "", "g": "结构：Ya, 主语 + suka + 宾语, tetapi + tidak terlalu + 形容词。tidak terlalu = 不太。"}}, {"sp": "考官", "role": "q", "id": "Bisakah kamu menjelaskan cara membuat makanan kesukaanmu?", "zh": "你能说说你最喜欢的菜怎么做吗？", "a": "d8963a46c3f4", "an": {"p": [["Bisakah", "能不能"], ["kamu", "你"], ["menjelaskan", "说明"], ["cara membuat", "做法"], ["makanan kesukaanmu", "你喜欢的食物"]], "b": "menjelaskan = meN- + jelas + -kan（vt. 解释）", "g": "结构：Bisakah + 主语 + 动词 + 宾语？cara + 动词 = ……的方法。礼貌地请对方说明。"}}, {"sp": "参考回答", "role": "a", "id": "Bisa. Pertama, saya memanaskan minyak. Lalu saya memasukkan bawang dan nasi. Terakhir, saya menambahkan telur dan garam.", "zh": "可以。先把油烧热，然后放葱和米饭，最后加鸡蛋和盐。", "a": "33cae2cf4858", "an": {"p": [["Bisa", "可以"], ["Pertama", "首先"], ["saya memanaskan", "我加热"], ["minyak", "油"], ["Lalu", "然后"], ["memasukkan", "放入"], ["bawang", "洋葱"], ["dan", "和"], ["nasi", "米饭"], ["Terakhir", "最后"], ["menambahkan", "加入"], ["telur", "鸡蛋"], ["garam", "盐"]], "b": "memanaskan = meN- + panas + -kan；memasukkan = meN- + masuk + -kan；menambahkan = meN- + tambah + -kan", "g": "结构：Pertama / Lalu / Terakhir 按顺序说步骤，每步：主语 + 动词-kan + 宾语。meN-……-kan 表示“使……”：使热（加热）、使进入（放入）。"}}, {"sp": "考官", "role": "q", "id": "Kamu lebih suka memasak sendiri atau memesan makanan lewat aplikasi? Mengapa?", "zh": "你更喜欢自己做饭还是用应用点外卖？为什么？", "a": "32f94360d199", "an": {"p": [["Kamu", "你"], ["lebih suka", "更喜欢"], ["memasak sendiri", "自己做饭"], ["atau", "还是"], ["memesan makanan", "订餐"], ["lewat aplikasi", "通过应用"], ["Mengapa", "为什么"]], "b": "memesan = meN- + pesan（vt. 订）", "g": "结构：主语 + lebih suka + A atau B？lewat + 工具 = 通过……。"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka memasak sendiri, karena lebih sehat dan lebih hemat.", "zh": "我更喜欢自己做，因为更健康、更省钱。", "a": "3330fe3cbdc5", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["memasak sendiri", "自己做饭"], ["karena", "因为"], ["lebih sehat", "更健康"], ["dan", "并且"], ["lebih hemat", "更省钱"]], "b": "hemat = adj. 节省", "g": "结构：主语 + lebih suka + 动词短语, karena + lebih + 形容词 + dan + lebih + 形容词。"}}, {"sp": "考官", "role": "q", "id": "Apa perbedaan makanan Indonesia dan makanan Tiongkok?", "zh": "印尼菜和中国菜有什么区别？", "a": "ff3b34b40239", "an": {"p": [["Apa", "什么"], ["perbedaan", "不同"], ["makanan Indonesia", "印尼食物"], ["dan", "和"], ["makanan Tiongkok", "中国食物"]], "b": "", "g": "结构：Apa + perbedaan + A + dan + B？问“A 和 B 有什么不同”。"}}, {"sp": "参考回答", "role": "a", "id": "Makanan Indonesia lebih pedas dan banyak memakai santan, sedangkan makanan Tiongkok lebih banyak memakai kecap dan cuka.", "zh": "印尼菜更辣，常用椰浆；中国菜更多用酱油和醋。", "a": "d319686cfc4f", "an": {"p": [["Makanan Indonesia", "印尼食物"], ["lebih pedas", "更辣"], ["dan", "并且"], ["banyak memakai", "常用"], ["santan", "椰浆"], ["sedangkan", "而"], ["makanan Tiongkok", "中国食物"], ["lebih banyak memakai", "更多使用"], ["kecap", "酱油"], ["dan", "和"], ["cuka", "醋"]], "b": "memakai = meN- + pakai（vt. 使用）", "g": "结构：A + 形容词 + dan + banyak + 动词 + 宾语, sedangkan B + lebih banyak + 动词 + 宾语。sedangkan 引出对比。"}}, {"sp": "考官", "role": "q", "id": "Kalau temanmu datang dari Tiongkok, makanan Indonesia apa yang akan kamu rekomendasikan?", "zh": "如果有朋友从中国来，你会推荐什么印尼菜？", "a": "b578675bd68b", "an": {"p": [["Kalau", "如果"], ["temanmu", "你的朋友"], ["datang dari Tiongkok", "从中国来"], ["makanan Indonesia apa", "什么印尼食物"], ["yang akan kamu rekomendasikan", "你会推荐的"]], "b": "", "g": "结构：Kalau + 条件, 名词 + apa + yang + akan + 主语 + 动词原形？rekomendasikan = 推荐。"}}, {"sp": "参考回答", "role": "a", "id": "Saya akan merekomendasikan rendang dan sate, karena keduanya sangat terkenal dan enak.", "zh": "我会推荐仁当和沙爹，因为都很有名也很好吃。", "a": "c9b7e2b9b6de", "an": {"p": [["Saya", "我"], ["akan", "将"], ["merekomendasikan", "推荐"], ["rendang", " p": [["Menurutmu", "依你看"], ["apa", "什么"], ["pentingnya", "……的重要性"], ["gotong royong", "互助合作"], ["di lingkungan rumah", "在居住社区"]], "b": "pentingnya = penting + -nya（重要性）", "g": "结构：Apa + 形容词-nya + 名词 + 地点？形容词 + -nya = 名词化：pentingnya = 重要性。gotong royong = 印尼传统的互助精神。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, gotong royong penting karena tetangga bisa saling membantu dan lingkungan menjadi bersih.", "zh": "我觉得互助合作很重要，因为邻居可以互相帮忙，环境也会变干净。", "a": "73c17011fb48", "an": {"p": [["Menurut saya", "依我看"], ["gotong royong", "互助"], ["penting", "重要"], ["karena", "因为"], ["tetangga", "邻居"], ["bisa saling membantu", "能互相帮助"], ["dan", "并且"], ["lingkungan", "环境"], ["menjadi bersih", "变得干净"]], "b": "menjadi = meN- + jadi", "g": "结构：Menurut saya, 主语 + 形容词 + karena + 主语 + bisa + saling + 动词 + dan + 主语 + menjadi + 形容词。menjadi + 形容词 = 变得……。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu mengundang teman ke rumah, apa yang akan kamu siapkan?", "zh": "如果你请朋友来家里，你会准备什么？", "a": "1e0aa5d8159d", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["mengundang", "邀请"], ["teman", "朋友"], ["ke rumah", "到家里"], ["apa yang akan kamu siapkan", "你会准备什么"]], "b": "siapkan = siap + -kan（动词原形）", "g": "结构：Kalau + 主语 + mengundang + 人 + ke + 地点, apa yang akan + 主语 + 动词原形？"}}, {"sp": "参考回答", "role": "a", "id": "Kalau saya mengundang teman, saya akan membersihkan kamar dan menyiapkan makanan dan minuman.", "zh": "如果请朋友来，我会打扫房间，准备吃的和喝的。", "a": "a176dd22bace", "an": {"p": [["Kalau", "如果"], ["saya mengundang teman", "我邀请朋友"], ["saya akan", "我会"], ["membersihkan", "打扫"], ["kamar", "房间"], ["dan", "并"], ["menyiapkan", "准备"], ["makanan", "食物"], ["dan", "和"], ["minuman", "饮料"]], "b": "membersihkan = meN- + bersih + -kan；menyiapkan = meN- + siap + -kan", "g": "结构：Kalau + 条件, 主语 + akan + 动词 1 + 宾语 + dan + 动词 2 + 宾语。meN-……-kan 表示使成为：使干净（打扫）、使就绪（准备）。"}}], "zh": "", "note": "本单元生词：tempat tinggal n. 住处 · tetangga n. 邻居 · pindah rumah 搬家 · sekitar 周围 · desa n. 乡村 · kota n. 城市 · gotong royong n. 互助合作 · mengundang vt. 邀请 · men
