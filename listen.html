 perlu + 动词 + 宾语。perlu + 动词 = 需要做某事。"}}, {"sp": "", "role": "r", "id": "Saya juga membawa jam tangan berwarna biru dan gelang berwarna merah.", "zh": "我还带一块蓝色手表和一条红色手链。", "a": "fa70e980e750", "za": "34e26cfcb143", "an": {"p": [["Saya", "我"], ["juga", "也"], ["membawa", "带"], ["jam tangan", "手表"], ["berwarna biru", "蓝色的"], ["dan", "和"], ["gelang", "手镯"], ["berwarna merah", "红色的"]], "b": "", "g": "结构：主语 + juga + 动词 + 宾语 + berwarna + 颜色（修饰）。"}}, {"sp": "", "role": "r", "id": "Saya tidak membawa topi, baju olahraga, celana panjang, dan syal.", "zh": "我不带帽子、运动服、长裤和围巾。", "a": "0ca3335e51e4", "za": "bc9bf1b306ec", "an": {"p": [["Saya", "我"], ["tidak membawa", "不带"], ["topi", "帽子"], ["baju olahraga", "运动服"], ["celana panjang", "长裤"], ["dan", "和"], ["syal", "围巾"]], "b": "", "g": "结构：主语 + tidak + 动词 + 并列宾语。"}}, {"sp": "", "role": "r", "id": "Saya juga tidak membawa boneka kesayangan saya.", "zh": "我也不带我最心爱的玩偶。", "a": "842003066f76", "za": "4da9b6a779b4", "an": {"p": [["Saya", "我"], ["juga", "也"], ["tidak membawa", "不带"], ["boneka", "玩偶"], ["kesayangan", "心爱的"], ["saya", "我的"]], "b": "kesayangan = ke- + sayang + -an", "g": "结构：主语 + juga tidak + 动词 + 宾语。kesayangan = 最爱的，放在名词后。"}}, {"sp": "", "role": "r", "id": "Saya tidak membawa semua barang.", "zh": "我不会把所有东西都带上。", "a": "fe5e73699965", "za": "47c9654b6329", "an": {"p": [["Saya", "我"], ["tidak membawa", "不带"], ["semua barang", "所有东西"]], "b": "", "g": "结构：主语 + tidak + 动词 + semua + 名词。部分否定：不是全部都带。"}}], "zh": "明天我要去雅加达打拼工作，我会带很多东西，不过有些东西我不带。我会带黑色皮鞋、棕色袜子、黑色裙子和白衬衫，还要带紫色西装外套和红色夹克，还有蓝色手表和红色手链。我不带帽子、运动服、长裤和围巾，也不带我心爱的玩偶。我不会把所有东西都带上。", "note": "", "qa": [{"q": "Barang apa saja yang dibawa Meli?", "a": "Sepatu pantofel, kaus kaki, rok, kemeja putih, blazer, jaket, jam tangan, dan gelang.", "qa": "c6526a730c7a", "aa": "f5ea2b523d05", "qz": "Meli 带了哪些东西？", "az": "皮鞋、袜子、裙子、白衬衫、西装外套、夹克、手表和手链。"}, {"q": "Barang apa yang tidak dibawa Meli?", "a": "Topi, baju olahraga, celana panjang, syal, dan boneka.", "qa": "ed4ebb06e1f2", "aa": "815938509134", "qz": "Meli 没带哪些东西？", "az": "帽子、运动服、长裤、围巾和玩偶。"}], "u": 10}, {"id": "t79", "kind": "text", "book": "BIPA 1", "title": "出租屋广告（课文 10.1）", "lines": [{"sp": "", "role": "r", "id": "Hunian Sewa Eksklusif di Jakarta Selatan.", "zh": "南雅加达高档出租公寓。", "a": "df8ffffbfb0a", "za": "588b69c343d9", "an": {"p": [["Hunian", "住所"], ["Sewa", "出租"], ["Eksklusif", "高端"], ["di", "在"], ["Jakarta Selatan", "南雅加达"]], "b": "hunian = huni 居住 + -an", "g": "广告标题：名词短语，没有谓语。hunian sewa = 出租住宅。"}}, {"sp": "", "role": "r", "id": "Lingkungan nyaman dengan fasilitas lengkap.", "zh": "环境舒适，设施齐全。", "a": "009fe48fb7e5", "za": "07187d285a1a", "an": {"p": [["Lingkungan", "环境"], ["nyaman", "舒适"], ["dengan", "具备"], ["fasilitas", "设施"], ["lengkap", "齐全"]], "b": "lingkungan = lingkung 围绕 + -an", "g": "广告句：名词 + 形容词 + dengan + 名词短语。dengan 这里 = 配有。"}}, {"sp": "", "role": "r", "id": "Dekat dengan Kawasan Bisnis TB Simatupang.", "zh": "靠近 TB Simatupang 商务区。", "a": "5572f92209b0", "za": "099302c7b463", "an": {"p": [["Dekat", "靠近"], ["dengan", "和"], ["Kawasan", "区域"], ["Bisnis", "商业"], ["TB Simatupang", "TB 西马图庞（雅加达路名）"]], "b": "kawasan = ka- + wasa", "g": "广告句：形容词 + dengan + 地点。dekat dengan = 靠近……。"}}, {"sp": "", "role": "r", "id": "Cocok untuk corporate housing dan keluarga muda.", "zh": "适合企业员工宿舍和年轻家庭。", "a": "9caa298d6d82", "za": "196a757ed2c3", "an": {"p": [["Cocok", "适合"], ["untuk", "给"], ["corporate housing", "企业员工住房"], ["dan", "和"], ["keluarga muda", "年轻家庭"]], "b": "", "g": "结构：Cocok + untuk + 对象。untuk 后接适用人群。"}}, {"sp": "", "role": "r", "id": "— Hunian 2 lantai dengan ruang makan + duduk, kamar tidur, dapur, dan kamar mandi.", "zh": "两层住宅，带餐厅兼客厅、卧室、厨房和卫生间。", "a": "b0d0f1f1d218", "za": "223566659d06", "an": {"p": [["Hunian", "住所"], ["2 lantai", "两层"], ["dengan", "配有"], ["ruang makan", "餐厅"], ["duduk", "起居空间"], ["kamar tidur", "卧室"], ["dapur", "厨房"], ["kamar mandi", "浴室"]], "b": "ruang = 空间；lantai = 楼层、地板", "g": "结构：名词 + 数量 + dengan + 并列设施。ruang makan + duduk = 餐厅兼起居室。"}}, {"sp": "", "role": "r", "id": "Fully furnished; termasuk AC, double bed, 1 set meja makan kayu, kompor, dispenser, dll.", "zh": "家具齐全：包括空调、双人床、一套木餐桌、炉灶、饮水机等。", "a": "d12fde89da6f", "za": "877b23085f35", "an": {"p": [["Fully furnished", "家具齐全"], ["termasuk", "包括"], ["AC", "空调"], ["double bed", "双人床"], ["1 set", "一套"], ["meja makan kayu", "木质餐桌"], ["kompor", "炉灶"], ["dispenser", "饮水机"], ["dll.", "等等（dan lain-lain）"]], "b": "termasuk = ter- + masuk", "g": "结构：状态 + termasuk + 并列设施。dll. 读作 dan lain-lain。termasuk = 包含在内。"}}, {"sp": "", "role": "r", "id": "Akses internet.", "zh": "有网络。", "a": "fe67dd9efc09", "za": "1251c23b7d77", "an": {"p": [["Akses", "接入"], ["internet", "网络"]], "b": "", "g": "广告条目，名词短语。"}}, {"sp": "", "role": "r", "id": "Laundry service.", "zh": "洗衣服务。", "a": "38c17bcaf24e", "za": "9f65772f1b7e", "an": {"p": [["Laundry", "洗衣"], ["service", "服务"]], "b": "", "g": "广告条目，外来词，读音近英语。"}}, {"sp": "", "role": "r", "id": "Cleaning service.", "zh": "保洁服务。", "a": "f846cfd87c5d", "za": "8ae453443c54", "an": {"p": [["Cleaning", "清洁"], ["service", "服务"]], "b": "", "g": "广告条目，外来词：清洁服务。"}}, {"sp": "", "role": "r", "id": "Penjaga keamanan 24 jam.", "zh": "24小时保安。", "a": "0c887306f38c", "za": "288e4eb20b4f", "an": {"p": [["Penjaga", "守卫"], ["keamanan", "安全"], ["24 jam", "二十四小时"]], "b": "penjaga = pen- + jaga；keamanan = ke- + aman + -an", "g": "广告条目：名词短语。penjaga keamanan = 保安，24 jam 读 dua puluh empat jam。"}}, {"sp": "", "role": "r", "id": "Parkir motor dan mobil.", "zh": "摩托车和汽车停车位。", "a": "7cad256149ff", "za": "f60711f0ab62", "an": {"p": [["Parkir", "停车"], ["motor", "摩托车"], ["dan", "和"], ["mobil", "汽车"]], "b": "", "g": "广告条目：parkir（停车位）+ 并列车型。"}}, {"sp": "", "role": "r", "id": "— Ketentuan harga: 1 kamar (45 m², 12 unit): Rp1.750.000/bulan.", "zh": "价格：一室（45平方米，12套）每月175万印尼盾。", "a": "f17bf6420660", "za": "b4c5779eaca7", "an": {"p": [["Ketentuan", "规定"], ["harga", "价格"], ["1 kamar", "一居室"], ["45 m²", "四十五平方米"], ["12 unit", "十二套"], ["Rp1.750.000", "一百七十五万盾"], ["bulan", "月"]], "b": "ketentuan = ke- + tentu + -an", "g": "广告条目：价格说明。印尼盾千位用点分隔：Rp1.750.000 读 satu juta tujuh ratus lima puluh ribu rupiah。/bulan = 每月。"}}, {"sp": "", "role": "r", "id": "2 kamar (56 m², 2 unit): Rp2.200.000/bulan.", "zh": "两室（56平方米，2套）每月220万印尼盾。", "a": "dfb8f3c8832a", "za": "80101f3f0871", "an": {"p": [["2 kamar", "两居室"], ["56 m²", "五十六平方米"], ["2 unit", "两套"], ["Rp2.200.000", "二百二十万盾"], ["bulan", "月"]], "b": "", "g": "条目同上。两居室月租 Rp2.200.000 = dua juta dua ratus ribu rupiah。"}}, {"sp": "", "role": "r", "id": "Minimal sewa 3 bulan (deposit 1 bulan).", "zh": "最少租3个月（押一个月）。", "a": "89b053354a70", "za": "1faac0482145", "an": {"p": [["Minimal", "至少"], ["sewa", "租期"], ["3 bulan", "三个月"], ["deposit", "押金"], ["1 bulan", "一个月"]], "b": "", "g": "结构：Minimal + 名词 + 数量。deposit 1 bulan = 押一个月租金。"}}, {"sp": "", "role": "r", "id": "— GRIYA SELARAS BENDA.", "zh": "GRIYA SELARAS BENDA 公寓。", "a": "b81f10bb0852", "za": "9a5419dd2188", "an": {"p": [["GRIYA", "住宅（古雅语）"], ["SELARAS", "协调"], ["BENDA", "物品"]], "b": "", "g": "楼盘名称，名词短语。griya 是文雅说法的“房子”，常用于地产名。"}}, {"sp": "", "role": "r", "id": "Lokasi: Jl.", "zh": "地址：", "a": "d03099c170a5", "za": "966dac9e300b", "an": {"p": [["Lokasi", "位置"], ["Jl.", "路（Jalan 的缩写）"]], "b": "lokasi = 外来词，来自 location", "g": "广告开头：栏目名。Jl. 读作 jalan（和下一句连读）。"}}, {"sp": "", "role": "r", "id": "Makmur Ceria RT 03/RW 010, Ciganjur, Jagakarsa, Jakarta 12630.", "zh": "雅加达 Jagakarsa 区 Ciganjur，Makmur Ceria 路 RT 03/RW 010，邮编 12630。", "a": "273f0f318a49", "za": "c64131c3b872", "an": {"p": [["Makmur Ceria", "昌盛欢乐（路名）"], ["RT 03/RW 010", "第3居民小组／第10居民区"], ["Ciganjur", "奇干朱尔（街道）"], ["Jagakarsa", "查加卡尔萨（区）"], ["Jakarta", "雅加达"], ["12630", "邮政编码"]], "b": "", "g": "地址：路 > RT/RW > 街道 > 区 > 城市 > 邮编。由小到大排列。"}}], "zh": "南雅加达高档出租公寓。环境舒适，设施齐全，靠近 TB Simatupang 商务区，适合企业员工宿舍和年轻家庭。——两层住宅，含餐厅兼客厅、卧室、厨房和浴室。全套家具：空调、双人床、一套木制餐桌、炉灶、饮水机等。有网络、洗衣服务、保洁服务、24 小时保安，可停摩托车和汽车。——价格：一室（45 平方米，共 12 套）每月 175 万盾；两室（56 平方米，共 2 套）每月 220 万盾。最短租期 3 个月（押金 1 个月）。——Griya Selaras Benda，地址：Jagakarsa 区 Ciganjur，Makmur Ceria 路 RT 03/RW 010，雅加达 12630。", "note": "原书为广告图片，已转成文字。", "qa": [{"q": "Kos itu bernama apa?", "a": "Griya Selaras.", "qa": "6261c943389a", "aa": "db18c4d98897", "qz": "那个公寓叫什么名字？", "az": "Griya Selaras。"}, {"q": "Kos itu dekat dengan apa?", "a": "Dekat dengan Kawasan Bisnis TB Simatupang.", "qa": "0efcab857b10", "aa": "5572f92209b0", "qz": "那个公寓靠近哪里？", "az": "靠近 TB Simatupang 商务区。"}, {"q": "Kos itu berlokasi di jalan apa?", "a": "Jalan Makmur Ceria.", "qa": "73f59b675e10", "aa": "6d49adc95c38", "qz": "那个公寓在哪条路上？", "az": "Makmur Ceria 路。"}, {"q": "Berapa lama minimal sewa di sana?", "a": "Tiga bulan.", "qa": "c204e156152b", "aa": "581661e3fd32", "qz": "那里最少要租多久？", "az": "三个月。"}, {"q": "Berapa biaya sewa dua kamar per tahun?", "a": "Rp26.400.000,00 (Rp2.200.000 × 12).", "qa": "a9f5aac96e39", "aa": "fdce31ac7960", "qz": "两室的房子一年租金多少？", "az": "2640万印尼盾（220万 × 12）。"}], "u": 10}, {"id": "t80", "kind": "text", "book": "BIPA 1", "title": "Meli 的出租屋（课文 10.2）", "lines": [{"sp": "", "role": "r", "id": "Rumah indekos Meli besar dan cantik.", "zh": "Meli 的寄宿屋又大又漂亮。", "a": "4ea94f288a62", "za": "34f0c4b0e85b", "an": {"p": [["Rumah indekos", "出租公寓"], ["Meli", "梅莉"], ["besar", "大"], ["dan", "和"], ["cantik", "漂亮"]], "b": "indekos = 外来词（in de kost），租房住宿", "g": "结构：主语（rumah indekos Meli = 梅莉的出租屋）+ 形容词 + dan + 形容词。"}}, {"sp": "", "role": "r", "id": "Di sana ada sepuluh kamar tidur.", "zh": "那里有十间卧室。", "a": "c75ecfedddbd", "za": "df882f432c47", "an": {"p": [["Di sana", "在那里"], ["ada", "有"], ["sepuluh", "十"], ["kamar tidur", "卧室"]], "b": "sepuluh = se- + puluh", "g": "结构：地点 + ada + 数量 + 名词。"}}, {"sp": "", "role": "r", "id": "Satu kamar tidur berkamar mandi satu.", "zh": "每间卧室带一个卫生间。", "a": "3ec715df39dd", "za": "90e164760db8", "an": {"p": [["Satu kamar tidur", "一间卧室"], ["berkamar mandi", "带有浴室"], ["satu", "一个"]], "b": "berkamar mandi = ber- + kamar mandi", "g": "结构：主语 + ber- + 名词 + 数量。ber- + 名词 = 具有……：每间卧室带一个浴室。"}}, {"sp": "", "role": "r", "id": "Rumah indekosnya bercat warna-warni.", "zh": "她的寄宿屋刷得五颜六色。", "a": "93a51d1f9de2", "za": "0a21a2755f93", "an": {"p": [["Rumah indekosnya", "她的出租屋"], ["bercat", "涂着漆"], ["warna-warni", "五颜六色"]], "b": "indekosnya = indekos + -nya；bercat = ber- + cat（漆）；warna-warni = warna 重叠", "g": "结构：主语 + ber-名词 + 形容词。bercat warna-warni = 漆成各种颜色。"}}, {"sp": "", "role": "r", "id": "Ada warna putih, biru, hitam, merah, dan abu-abu.", "zh": "有白色、蓝色、黑色、红色和灰色。", "a": "76a6e783af87", "za": "8b95fa467313", "an": {"p": [["Ada", "有"], ["warna", "颜色"], ["putih", "白"], ["biru", "蓝"], ["hitam", "黑"], ["merah", "红"], ["dan", "和"], ["abu-abu", "灰色"]], "b": "abu-abu = abu 灰烬 重叠", "g": "结构：Ada + 名词 + 并列颜色。"}}, {"sp": "", "role": "r", "id": "Rumahnya berbentuk persegi panjang.", "zh": "房子是长方形的。", "a": "06fd5a074753", "za": "5e354a169712", "an": {"p": [["Rumahnya", "她的房子"], ["berbentuk", "呈……形"], ["persegi panjang", "长方形"]], "b": "berbentuk = ber- + bentuk；persegi = per- + segi 边", "g": "结构：主语 + berbentuk + 形状。persegi panjang = 长方形，persegi = 正方形。"}}, {"sp": "", "role": "r", "id": "Di sisi kiri dan kanan rumahnya ada pohon tinggi berdaun hijau.", "zh": "房子左右两边有绿叶高树。", "a": "dcdec5e9ae5b", "za": "d864296b32a9", "an": {"p": [["Di sisi kiri dan kanan", "在左右两侧"], ["rumahnya", "她的房子"], ["ada", "有"], ["pohon", "树"], ["tinggi", "高"], ["berdaun hijau", "叶子是绿的"]], "b": "berdaun = ber- + daun", "g": "结构：方位 + ada + 名词 + 形容词 + berdaun + 颜色。berdaun hijau = 有绿叶的。"}}, {"sp": "", "role": "r", "id": "Ada juga bunga berwarna merah muda dan ungu.", "zh": "还有粉色和紫色的花。", "a": "7235eb79a1d4", "za": "dc3d89079245", "an": {"p": [["Ada", "有"], ["juga", "也"], ["bunga", "花"], ["berwarna", "颜色是"], ["merah muda", "粉红色"], ["dan", "和"], ["ungu", "紫色"]], "b": "", "g": "结构：Ada juga + 名词 + berwarna + 颜色。merah muda = 红 + 嫩 = 粉红。"}}, {"sp": "", "role": "r", "id": "Di belakang rumah indekos Meli ada taman.", "zh": "Meli 的寄宿屋后面有一个花园。", "a": "da455e47124f", "za": "e964568f9446", "an": {"p": [["Di belakang", "在后面"], ["rumah indekos Meli", "梅莉的出租屋"], ["ada", "有"], ["taman", "花园"]], "b": "", "g": "结构：方位 + ada + 名词。"}}, {"sp": "", "role": "r", "id": "Taman itu ada kolam ikannya.", "zh": "花园里有一个鱼池。", "a": "d6e5fc2ff37e", "za": "fa05b7291f5b", "an": {"p": [["Taman itu", "那个花园"], ["ada", "有"], ["kolam ikannya", "它的鱼池"]], "b": "kolam ikan = 池塘 + 鱼", "g": "结构：主语 + ada + 名词 + -nya。-nya 指代 taman，属于它的鱼池。"}}, {"sp": "", "role": "r", "id": "Ada ikan yang berwarna hitam dan emas.", "zh": "有黑色和金色的鱼。", "a": "e78b2e8204a4", "za": "c5f6d9b4bf8e", "an": {"p": [["Ada", "有"], ["ikan", "鱼"], ["yang berwarna", "颜色是……的"], ["hitam", "黑"], ["dan", "和"], ["emas", "金色"]], "b": "", "g": "结构：Ada + 名词 + yang + berwarna + 颜色。yang 从句修饰 ikan。"}}, {"sp": "", "role": "r", "id": "Di taman juga ada bangku panjang berwarna hitam.", "zh": "花园里还有一张黑色长椅。", "a": "3f07882886f7", "za": "903738e1851c", "an": {"p": [["Di taman", "在花园里"], ["juga", "也"], ["ada", "有"], ["bangku panjang", "长椅"], ["berwarna hitam", "黑色的"]], "b": "", "g": "结构：地点 + juga ada + 名词 + 颜色修饰。"}}, {"sp": "", "role": "r", "id": "Di depan bangku ada meja berbentuk bulat dan berwarna cokelat.", "zh": "长椅前面有一张棕色的圆桌。", "a": "c35163de6881", "za": "4f0468266917", "an": {"p": [["Di depan", "在前面"], ["bangku", "长椅"], ["ada", "有"], ["meja", "桌子"], ["berbentuk bulat", "圆形的"], ["dan", "并且"], ["berwarna cokelat", "棕色的"]], "b": "", "g": "结构：方位 + ada + 名词 + berbentuk + 形状 + dan + berwarna + 颜色。"}}, {"sp": "", "role": "r", "id": "Di taman juga ada banyak batu besar berwarna abu-abu.", "zh": "花园里还有很多灰色的大石头。", "a": "d81b28a4a1f1", "za": "4cd3f49a6d86", "an": {"p": [["Di taman", "在花园里"], ["juga", "也"], ["ada", "有"], ["banyak", "很多"], ["batu besar", "大石头"], ["berwarna abu-abu", "灰色的"]], "b": "", "g": "结构：地点 + juga ada + 数量 + 名词 + 形容词 + 颜色。"}}], "zh": "Meli 住的出租屋又大又漂亮，有十间卧室，每间卧室带一个浴室。出租屋刷得五颜六色：白、蓝、黑、红和灰。房子是长方形的，左右两边种着绿叶高树，还有粉色和紫色的花。出租屋后面有一个花园，花园里有个鱼池，池里有黑色和金色的鱼。花园里还有一张黑色长椅，长椅前面有一张棕色圆桌。花园里还有很多灰色的大石头。", "note": "", "qa": [{"q": "Ada berapa kamar tidur di sana?", "a": "Ada sepuluh kamar tidur.", "qa": "4981e0115bab", "aa": "5450bd5bcfc8", "qz": "那里有几间卧室？", "az": "有十间卧室。"}, {"q": "Apa bentuk rumahnya?", "a": "Persegi panjang.", "qa": "df06d8f26fa4", "aa": "a852089c698d", "qz": "房子是什么形状的？", "az": "长方形。"}, {"q": "Ada apa di depan bangku?", "a": "Meja berbentuk bulat berwarna cokelat.", "qa": "4765bd389af0", "aa": "ab3db2cfb9c3", "qz": "长椅前面有什么？", "az": "一张棕色的圆桌。"}, {"q": "Ada apa di taman?", "a": "Kolam ikan, bangku panjang, meja bulat, dan batu besar.", "qa": "25641a537bae", "aa": "958f5d56baa0", "qz": "花园里有什么？", "az": "鱼池、长椅、圆桌和大石头。"}, {"q": "Ada apa di sisi kiri dan kanan rumahnya?", "a": "Pohon tinggi berdaun hijau.", "qa": "810657f547d9", "aa": "c19c4f6188f5", "qz": "房子左右两边有什么？", "az": "绿叶高树。"}], "u": 10}, {"id": "t81", "kind": "text", "book": "BIPA 2", "title": "吉他为什么最受欢迎（课文 1）", "lines": [{"sp": "", "role": "r", "id": "Gitar menjadi alat musik terfavorit di dunia, termasuk di Indonesia.", "zh": "吉他是世界上最受欢迎的乐器，在印度尼西亚也一样。", "a": "de09b52bc9c9", "za": "45567c928093", "an": {"p": [["Gitar", "吉他"], ["menjadi", "成为"], ["alat musik", "乐器"], ["terfavorit", "最受欢迎"], ["di dunia", "在世界上"], ["termasuk", "包括"], ["di Indonesia", "在印尼"]], "b": "menjadi = meN- + jadi；terfavorit = ter- + favorit（最……）", "g": "结构：主语 + menjadi + 名词短语 + 地点, termasuk + 地点。ter- + 形容词 = 最……。termasuk = 包括在内。"}}, {"sp": "", "role": "r", "id": "Mengapa gitar menjadi favorit?", "zh": "为什么吉他最受欢迎？", "a": "4758375b3d5b", "za": "5e0c4f9fe0fc", "an": {"p": [["Mengapa", "为什么"], ["gitar", "吉他"], ["menjadi", "成为"], ["favorit", "最爱"]], "b": "mengapa = meN- + apa", "g": "结构：Mengapa + 句子？mengapa = 为什么，同 kenapa（口语）。"}}, {"sp": "", "role": "r", "id": "Alasannya adalah belajar gitar itu cukup mudah.", "zh": "原因是学吉他比较容易。", "a": "dab72c9ad1cd", "za": "aaad5056db24", "an": {"p": [["Alasannya", "原因"], ["adalah", "是"], ["belajar gitar", "学吉他"], ["itu", "（话题标记）"], ["cukup", "相当"], ["mudah", "容易"]], "b": "alasannya = alasan + -nya", "g": "结构：主语 + adalah + 从句（belajar gitar itu cukup mudah）。itu 放在话题后起停顿、强调作用。"}}, {"sp": "", "role": "r", "id": "Hanya dengan mengenal kunci-kunci dasar seperti C, D, Dm, E, Em, F, A, dan Am, kita bisa memainkan beberapa lagu.", "zh": "只要认识几个基本和弦，比如 C、D、Dm、E、Em、F、A 和 Am，就能弹几首歌了。", "a": "573c64b76033", "za": "8b094c2f814f", "an": {"p": [["Hanya", "只要"], ["dengan", "通过"], ["mengenal", "认识"], ["kunci-kunci dasar", "基本和弦"], ["seperti", "例如"], ["kita", "我们"], ["bisa", "能"], ["memainkan", "演奏"], ["beberapa lagu", "几首歌"]], "b": "mengenal = meN- + kenal；memainkan = meN- + main + -kan", "g": "结构：Hanya dengan + 动词短语（条件）, 主语 + bisa + 动词 + 宾语。hanya dengan…… = 仅凭……。kunci 既是钥匙也是和弦。"}}, {"sp": "", "role": "r", "id": "Kita juga bisa belajar gitar sendiri tanpa guru (otodidak).", "zh": "我们也可以不找老师自学吉他。", "a": "626c6d36378f", "za": "bd7290bbbf0e", "an": {"p": [["Kita", "我们"], ["juga", "也"], ["bisa", "能"], ["belajar", "学"], ["gitar", "吉他"], ["sendiri", "自己"], ["tanpa", "没有"], ["guru", "老师"], ["otodidak", "自学"]], "b": "", "g": "结构：主语 + juga bisa + 动词 + 宾语 + sendiri + tanpa + 名词。tanpa = 没有……。otodidak = 自学（括号里的同义词）。"}}, {"sp": "", "role": "r", "id": "Belajar gitar secara otodidak dapat dilakukan melalui buku atau internet.", "zh": "自学吉他可以通过书本或网络。", "a": "880b071f0642", "za": "992b666c8501", "an": {"p": [["Belajar gitar", "学吉他"], ["secara otodidak", "以自学方式"], ["dapat", "可以"], ["dilakukan", "被进行"], ["melalui", "通过"], ["buku", "书"], ["atau", "或者"], ["internet", "网络"]], "b": "dilakukan = di- + laku + -kan；melalui = meN- + lalu + -i", "g": "结构：被动句：主语（Belajar gitar secara otodidak）+ dapat + di-动词 + melalui + 方式。secara + 名词 = 以……方式；melalui = 通过。"}}, {"sp": "", "role": "r", "id": "Kita juga dapat dengan mudah membeli gitar karena ada banyak penjual gitar di berbagai tempat.", "zh": "买吉他也很方便，因为很多地方都有卖吉他的。", "a": "e583501c5e56", "za": "eeec93392b7d", "an": {"p": [["Kita", "我们"], ["juga", "也"], ["dapat", "能"], ["dengan mudah", "轻易地"], ["membeli", "买"], ["gitar", "吉他"], ["karena", "因为"], ["ada", "有"], ["banyak", "很多"], ["penjual", "卖家"], ["di berbagai tempat", "在各个地方"]], "b": "penjual = pen- + jual", "g": "结构：主句 + karena + 原因从句。dengan mudah = 容易地（dengan + 形容词 = 副词）。berbagai = 各种。"}}, {"sp": "", "role": "r", "id": "Saat kita mengunjungi toko musik, gitar adalah alat musik yang paling banyak dijual.", "zh": "我们去乐器店时，吉他是卖得最多的乐器。", "a": "7cd5bb98bd5d", "za": "f7fcfabd2f40", "an": {"p": [["Saat", "当……时"], ["kita", "我们"], ["mengunjungi", "拜访"], ["toko musik", "乐器店"], ["gitar", "吉他"], ["adalah", "是"], ["alat musik", "乐器"], ["yang paling banyak", "最多的"], ["dijual", "被卖"]], "b": "mengunjungi = meN- + kunjung + -i；dijual = di- + jual", "g": "结构：Saat + 从句, 主语 + adalah + 名词 + yang paling banyak dijual。yang 从句含被动：最多被卖的 = 卖得最多的。paling = 最。"}}, {"sp": "", "role": "r", "id": "Biasanya toko musik menjual berbagai jenis gitar.", "zh": "乐器店通常卖各种各样的吉他。", "a": "06d055589bb4", "za": "f8c02d1def1c", "an": {"p": [["Biasanya", "通常"], ["toko musik", "乐器店"], ["menjual", "卖"], ["berbagai jenis", "各种"], ["gitar", "吉他"]], "b": "menjual = meN- + jual", "g": "结构：副词 + 主语 + 动词 + 宾语。berbagai jenis = 各种类型。"}}], "zh": "吉他是全世界最受欢迎的乐器，在印尼也一样。为什么吉他这么受欢迎？原因是学吉他比较容易。只要认识 C、D、Dm、E、Em、F、A、Am 这些基本和弦，就能弹好几首歌。我们还可以不用老师，自己学（自学）。自学吉他可以通过书或网络。买吉他也很容易，因为很多地方都有卖。去乐器店时，吉他是卖得最多的乐器，乐器店通常卖各种各样的吉他。", "note": "", "qa": [{"q": "Mengapa gitar bisa menjadi alat musik terfavorit?", "a": "Karena belajar gitar itu cukup mudah.", "qa": "bb76fc11fad9", "aa": "8b75f56395bc", "qz": "为什么吉他能成为最受欢迎的乐器？", "az": "因为学吉他比较容易。"}, {"q": "Apa saja kunci-kunci dasar untuk bermain gitar?", "a": "C, D, Dm, E, Em, F, A, dan Am.", "qa": "c806777a108c", "aa": "144072a63cb2", "qz": "弹吉他的基本和弦有哪些？", "az": "C、D、Dm、E、Em、F、A 和 Am。"}, {"q": "Apa itu otodidak?", "a": "Belajar sendiri tanpa diajarkan orang lain.", "qa": "2dc1daeb3fef", "aa": "de1b4ad1e5c2", "qz": "什么是自学？", "az": "不靠别人教，自己学。"}, {"q": "Bagaimana cara belajar gitar secara otodidak?", "a": "Melalui buku atau internet.", "qa": "58e6819dc563", "aa": "f3a5cbf095be", "qz": "怎样自学吉他？", "az": "通过书本或网络。"}, {"q": "Mengapa kita bisa mudah membeli gitar?", "a": "Karena ada banyak penjual gitar di berbagai tempat.", "qa": "39cabfea47e9", "aa": "5ff2b669ec13", "qz": "为什么买吉他很方便？", "az": "因为很多地方都有卖吉他的。"}], "u": 1}, {"id": "t82", "kind": "text", "book": "BIPA 2", "title": "酒店前台 Siu（课文 2）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Siu.", "zh": "我叫 Siu。", "a": "072c34da0222", "za": "9f234b84363f", "an": {"p": [["Nama saya", "我的名字"], ["Siu", "小（人名）"]], "b": "", "g": "结构：Nama saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya seorang resepsionis di sebuah hotel.", "zh": "我是一家酒店的前台。", "a": "7e8204f62865", "za": "393d2b99cf02", "an": {"p": [["Saya", "我"], ["seorang", "一位"], ["resepsionis", "前台接待"], ["di", "在"], ["sebuah hotel", "一家酒店"]], "b": "", "g": "结构：主语 + seorang + 职业 + di + 地点。seorang 是人的量词（se- + orang），sebuah 用于物。"}}, {"sp": "", "role": "r", "id": "Saya sudah 2 tahun bekerja di sini.", "zh": "我在这里工作两年了。", "a": "5957cdd1719c", "za": "27ac4641c5e0", "an": {"p": [["Saya", "我"], ["sudah", "已经"], ["2 tahun", "两年"], ["bekerja", "工作"], ["di sini", "在这里"]], "b": "", "g": "结构：主语 + sudah + 时长 + 动词 + 地点。sudah + 时间 + 动词 = 已经做……多久。"}}, {"sp": "", "role": "r", "id": "Saya bekerja 8 jam sehari.", "zh": "我每天工作8小时。", "a": "eb3a1583c694", "za": "b02cac4ba4c2", "an": {"p": [["Saya", "我"], ["bekerja", "工作"], ["8 jam", "八小时"], ["sehari", "每天"]], "b": "sehari = se- + hari", "g": "结构：主语 + 动词 + 时长 + se- + 单位。sehari = 一天里、每天。"}}, {"sp": "", "role": "r", "id": "Salah satu tugas saya adalah memeriksa pesanan kamar dari tamu hotel.", "zh": "我的工作之一是核对酒店客人的订房。", "a": "3948f23986cf", "za": "8a55685d216f", "an": {"p": [["Salah satu", "其中之一"], ["tugas", "任务"], ["saya", "我的"], ["adalah", "是"], ["memeriksa", "检查"], ["pesanan kamar", "订房"], ["dari", "来自"], ["tamu hotel", "酒店客人"]], "b": "memeriksa = meN- + periksa；pesanan = pesan 订 + -an", "g": "结构：Salah satu + 名词 + adalah + 动词短语。salah satu = 其中一个。pesanan = 被订的东西（订单）。"}}, {"sp": "", "role": "r", "id": "Setelah pesanan kamar benar, saya memberikan kunci kamar kepada tamu hotel.", "zh": "订房确认无误后，我把房卡交给客人。", "a": "6b6bbf4cf5e5", "za": "c310354e4524", "an": {"p": [["Setelah", "之后"], ["pesanan kamar", "订房信息"], ["benar", "正确"], ["saya", "我"], ["memberikan", "交给"], ["kunci kamar", "房卡／钥匙"], ["kepada", "给"], ["tamu hotel", "酒店客人"]], "b": "memberikan = meN- + beri + -kan", "g": "结构：Setelah + 条件, 主语 + memberikan + 宾语 + kepada + 对象。memberikan A kepada B = 把 A 给 B。"}}, {"sp": "", "role": "r", "id": "Setelah tamu hotel selesai menginap, saya menerima kembali kunci kamar dari tamu hotel.", "zh": "客人住完后，我从客人那里收回房卡。", "a": "ac2ca10a0640", "za": "9a22e5a1d45f", "an": {"p": [["Setelah", "之后"], ["tamu hotel", "酒店客人"], ["selesai", "结束"], ["menginap", "住宿"], ["saya", "我"], ["menerima", "接收"], ["kembali", "回来"], ["kunci kamar", "房卡"], ["dari", "从"]], "b": "", "g": "结构：Setelah + 从句（selesai + 动词）, 主语 + menerima + 宾语 + dari + 人。menerima kembali = 收回。"}}, {"sp": "", "role": "r", "id": "Pekerjaan saya cukup menyenangkan.", "zh": "我的工作挺开心的。", "a": "785953d78cba", "za": "38faca69b618", "an": {"p": [["Pekerjaan", "工作"], ["saya", "我的"], ["cukup", "相当"], ["menyenangkan", "令人愉快"]], "b": "pekerjaan = pe- + kerja + -an；menyenangkan = meN- + senang + -kan", "g": "结构：主语 + cukup + 形容词。meN-……-kan 表“使人感到……”：menyenangkan = 让人愉快。"}}, {"sp": "", "role": "r", "id": "Saya bisa bertemu banyak orang baru.", "zh": "我能认识很多新朋友。", "a": "1cc9ef0a5841", "za": "c0777886c553", "an": {"p": [["Saya", "我"], ["bisa", "能"], ["bertemu", "遇见"], ["banyak orang baru", "很多新的人"]], "b": "bertemu = ber- + temu", "g": "结构：主语 + bisa + 动词 + 宾语。orang baru = 新认识的人。"}}], "zh": "我叫 Siu，是一家酒店的前台接待员，在这里工作两年了，每天工作八小时。我的一项职责是核对客人的订房。确认无误后，我把房间钥匙交给客人；客人退房后，我再把钥匙收回来。我的工作挺愉快的，可以认识很多新朋友。", "note": "", "qa": [{"q": "Sudah berapa lama Siu bekerja?", "a": "Siu sudah bekerja selama dua tahun.", "qa": "c7d6d29340c6", "aa": "8ef5ae423ece", "qz": "Siu 工作多久了？", "az": "Siu 已经工作两年了。"}, {"q": "Apa pekerjaan Siu?", "a": "Resepsionis di sebuah hotel.", "qa": "20ade7980369", "aa": "3b294e8a5a4e", "qz": "Siu 是做什么工作的？", "az": "酒店前台。"}, {"q": "Berapa lama Siu bekerja dalam sehari?", "a": "Delapan jam.", "qa": "df8fc4a23686", "aa": "40a8d3468064", "qz": "Siu 一天工作多长时间？", "az": "八个小时。"}, {"q": "Apa yang Siu lakukan dalam pekerjaannya?", "a": "Memeriksa pesanan kamar, memberikan dan menerima kembali kunci kamar.", "qa": "1abb4b265b27", "aa": "e712ab14b40d", "qz": "Siu 的工作内容是什么？", "az": "核对订房，发放和收回房卡。"}, {"q": "Mengapa pekerjaan Siu menyenangkan?", "a": "Karena dia bisa bertemu banyak orang baru.", "qa": "66081d1891d4", "aa": "012cf4c987b3", "qz": "为什么 Siu 的工作很开心？", "az": "因为她能认识很多新朋友。"}], "u": 2}, {"id": "t83", "kind": "text", "book": "BIPA 2", "title": "市场打折广播（音频 3）", "lines": [{"sp": "", "role": "r", "id": "Bapak dan Ibu yang kami hormati: Sekarang Pasar Raya Sentosa memberi potongan harga untuk beberapa bahan pokok.", "zh": "尊敬的各位先生女士：Sentosa 大市场现在对部分基本食材打折。", "a": "92b92c033506", "za": "aa90f686df69", "an": {"p": [["Bapak dan Ibu", "先生女士们"], ["yang kami hormati", "我们尊敬的"], ["Sekarang", "现在"], ["Pasar Raya Sentosa", "桑托萨大超市"], ["memberi", "提供"], ["potongan harga", "折扣"], ["untuk", "针对"], ["beberapa", "几种"], ["bahan pokok", "生活必需品"]], "b": "hormati = hormat + -i；potongan = potong 切 + -an", "g": "结构：称呼（yang kami hormati）+ 时间 + 主语 + memberi + 宾语 + untuk + 对象。yang kami hormati 是广播开头的客套语。bahan pokok = 主要物资（米、油、糖等）。"}}, {"sp": "", "role": "r", "id": "Potongan harga sering kami berikan pada setiap akhir bulan.", "zh": "我们每个月底经常打折。", "a": "39cc0175a35c", "za": "579fe3144220", "an": {"p": [["Potongan harga", "折扣"], ["sering", "经常"], ["kami", "我们"], ["berikan", "给予"], ["pada setiap akhir bulan", "在每个月底"]], "b": "berikan = beri + -kan", "g": "结构：宾语前置：宾语 + 副词 + kami + 动词原形 + 时间。把宾语放在最前面强调，动词不带 meN-，这是印尼语常见的“第一人称被动”结构。"}}, {"sp": "", "role": "r", "id": "Potongan harga yang ada antara lain: satu kilogram cabai sekarang seharga Rp18.000.", "zh": "这次的折扣包括：辣椒现在每公斤18000印尼盾。", "a": "418e3bc57e5b", "za": "26de6e975836", "an": {"p": [["Potongan harga", "折扣"], ["yang ada", "现有的"], ["antara lain", "其中包括"], ["satu kilogram", "一公斤"], ["cabai", "辣椒"], ["sekarang", "现在"], ["seharga", "价格为"], ["Rp18.000", "一万八千盾"]], "b": "seharga = se- + harga", "g": "结构：名词 + yang ada + antara lain: 项目。seharga + 价格 = 价格是……。Rp18.000 = delapan belas ribu rupiah。"}}, {"sp": "", "role": "r", "id": "Satu kilogram bawang sekarang seharga Rp16.000.", "zh": "洋葱现在每公斤16000印尼盾。", "a": "0e2948b77bb1", "za": "f54b5f164488", "an": {"p": [["Satu kilogram", "一公斤"], ["bawang", "洋葱"], ["sekarang", "现在"], ["seharga", "价格为"], ["Rp16.000", "一万六千盾"]], "b": "", "g": "结构：数量 + 名词 + 时间 + seharga + 价格。Rp16.000 = enam belas ribu rupiah。"}}, {"sp": "", "role": "r", "id": "Terakhir, harga 1 kilogram tomat adalah Rp6.000.", "zh": "最后，西红柿每公斤6000印尼盾。", "a": "069e2a985bc7", "za": "0a882d933574", "an": {"p": [["Terakhir", "最后"], ["harga", "价格"], ["1 kilogram", "一公斤"], ["tomat", "番茄"], ["adalah", "是"], ["Rp6.000", "六千盾"]], "b": "terakhir = ter- + akhir", "g": "结构：顺序词 + harga + 数量 + 名词 + adalah + 价格。Terakhir 用来列举最后一项。"}}, {"sp": "", "role": "r", "id": "Demikian pengumuman ini kami sampaikan.", "zh": "以上是本次通知。", "a": "be8c3f2993d8", "za": "2db3f5995a3c", "an": {"p": [["Demikian", "如此"], ["pengumuman", "通知"], ["ini", "这个"], ["kami", "我们"], ["sampaikan", "传达"]], "b": "pengumuman = peN- + umum + -kan 加 -an；sampaikan = sampai + -kan", "g": "结构：宾语前置：Demikian + 宾语 + kami + 动词。Demikian……kami sampaikan 是公告结尾的固定套语：“特此通知”。"}}, {"sp": "", "role": "r", "id": "Kami tunggu kehadiran Bapak dan Ibu di pasar kami.", "zh": "欢迎各位光临我们的市场。", "a": "1f31fc064c20", "za": "87067dd31c8d", "an": {"p": [["Kami", "我们"], ["tunggu", "等候"], ["kehadiran", "光临"], ["Bapak dan Ibu", "先生女士们"], ["di pasar kami", "在我们的市场"]], "b": "kehadiran = ke- + hadir + -an", "g": "结构：主语 + 动词原形 + 宾语。省略 meN-，常见于公告与书面礼貌语：Kami menunggu → Kami tunggu。"}}], "zh": "尊敬的先生们、女士们：现在 Sentosa 大市场对部分基本生活物资打折。我们通常在每个月底推出优惠。本次优惠包括：辣椒每公斤一万八千盾，洋葱每公斤一万六千盾，最后，西红柿每公斤六千盾。以上就是本次公告，欢迎各位光临我们的市场。", "note": "", "qa": [{"q": "Dari mana pengumuman itu terdengar?", "a": "Dari radio.", "qa": "1cc32f5e9458", "aa": "3009ceeabb33", "qz": "这个通知是从哪里听到的？", "az": "从收音机里。"}, {"q": "Di mana tempat yang ada potongan harga itu?", "a": "Di Pasar Raya Sentosa.", "qa": "5d59c32e18a4", "aa": "7011ecfa592f", "qz": "打折的地方在哪里？", "az": "在 Sentosa 大市场。"}, {"q": "Kapan tempat tersebut sering membuat potongan harga?", "a": "Setiap akhir bulan.", "qa": "6f47a6995d42", "aa": "5c0a88f9888c", "qz": "那里经常什么时候打折？", "az": "每个月底。"}, {"q": "Berapa harga satu kilogram tomat?", "a": "Rp6.000.", "qa": "137570a3ef16", "aa": "8301e0ea3c7a", "qz": "西红柿一公斤多少钱？", "az": "6000印尼盾。"}, {"q": "Berapa harga satu kilogram cabai?", "a": "Rp18.000.", "qa": "fcf44055aa03", "aa": "f23dad960040", "qz": "辣椒一公斤多少钱？", "az": "18000印尼盾。"}, {"q": "Berapa harga satu kilogram bawang?", "a": "Rp16.000.", "qa": "2dd78335eb48", "aa": "d7eb4610cd0d", "qz": "洋葱一公斤多少钱？", "az": "16000印尼盾。"}], "u": 3}, {"id": "t84", "kind": "text", "book": "BIPA 2", "title": "交作业通知（课文 3）", "lines": [{"sp": "", "role": "r", "id": "PENGUMUMAN PENTING.", "zh": "重要通知。", "a": "dbc4bab949a2", "za": "541c8c00cb75", "an": {"p": [["PENGUMUMAN", "通知"], ["PENTING", "重要"]], "b": "pengumuman = peN- + umum + -an", "g": "标题：名词 + 形容词。大写表示醒目的通告标题。"}}, {"sp": "", "role": "r", "id": "Tolong kumpulkan tugas menulis teks bahasa Indonesia kepada Ibu Reni.", "zh": "请把印尼语写作作业交给 Reni 老师。", "a": "ef2b096ddd2b", "za": "fd6f4c911e8e", "an": {"p": [["Tolong", "请"], ["kumpulkan", "交上"], ["tugas", "作业"], ["menulis teks", "写文章"], ["bahasa Indonesia", "印尼语"], ["kepada", "给"], ["Ibu Reni", "雷妮老师"]], "b": "kumpulkan = kumpul + -kan（祈使）；menulis = meN- + tulis", "g": "结构：Tolong + 祈使动词（-kan）+ 宾语 + kepada + 人。祈使句用动词原形 + -kan，tolong 使语气礼貌。tugas menulis teks = 写作作业。"}}, {"sp": "", "role": "r", "id": "Tugas tersebut harus dikumpulkan pada hari Selasa sebelum pukul 12.00 di ruang kelas.", "zh": "作业必须在星期二中午12点前交到教室。", "a": "2e2530f64b6c", "za": "c4f303f33b3d", "an": {"p": [["Tugas tersebut", "该作业"], ["harus", "必须"], ["dikumpulkan", "被交"], ["pada hari Selasa", "在星期二"], ["sebelum pukul 12.00", "十二点以前"], ["di ruang kelas", "在教室"]], "b": "dikumpulkan = di- + kumpul + -kan；tersebut = ter- + sebut", "g": "结构：被动句：主语 + harus + di-动词 + 时间 + 地点。tersebut = 上述的，书面常用。"}}, {"sp": "", "role": "r", "id": "Atas perhatian Anda, kami ucapkan terima kasih.", "zh": "感谢您的关注。", "a": "04c662c4ac45", "za": "e70978ad4b5f", "an": {"p": [["Atas", "对于"], ["perhatian", "关注"], ["Anda", "您"], ["kami", "我们"], ["ucapkan", "说出"], ["terima kasih", "谢谢"]], "b": "perhatian = per- + hati + -an；ucapkan = ucap + -kan", "g": "结构：宾语前置：Atas + 名词, kami + 动词原形 + 宾语。结尾套语：对您的关注，我们表示感谢。"}}], "zh": "重要通知：请把印尼语写作作业交给 Reni 老师。作业必须在星期二中午 12 点前交到教室。感谢您的配合。", "note": "另一个例子：“Hari ini Toko Ronald tidak buka. Terima kasih.” Ronald 店今天不营业，谢谢。", "qa": [{"q": "Apa judul pengumuman itu?", "a": "Pengumuman penting.", "qa": "a5621c9e0ee9", "aa": "cab36d41ab13", "qz": "这个通知的标题是什么？", "az": "重要通知。"}, {"q": "Kepada siapa pengumuman itu ditujukan?", "a": "Kepada para pelajar/siswa.", "qa": "8df72fc80191", "aa": "ba888ff0abf4", "qz": "这个通知是发给谁的？", "az": "发给学生们。"}, {"q": "Tugas apa yang harus dikumpulkan?", "a": "Tugas menulis teks bahasa Indonesia.", "qa": "49077f4334c8", "aa": "0e4467a7fb38", "qz": "要交什么作业？", "az": "印尼语写作作业。"}, {"q": "Kepada siapa tugas itu dikumpulkan?", "a": "Kepada Ibu Reni.", "qa": "5f221568af29", "aa": "95cbb672a67f", "qz": "作业交给谁？", "az": "交给 Reni 老师。"}, {"q": "Kapan dan di mana tugas itu harus dikumpulkan?", "a": "Hari Selasa sebelum pukul 12.00, di ruang kelas.", "qa": "78e460d4aa7f", "aa": "a15ddc0a5bcf", "qz": "作业什么时候、在哪里交？", "az": "星期二中午12点前，交到教室。"}], "u": 3}, {"id": "t85", "kind": "text", "book": "BIPA 2", "title": "传统市场（课文 4）", "lines": [{"sp": "", "role": "r", "id": "Pasar tradisional sekarang tidak lagi seperti yang dahulu.", "zh": "传统市场现在已经跟以前不一样了。", "a": "82777dd1727c", "za": "ef60f5f5733b", "an": {"p": [["Pasar tradisional", "传统市场"], ["sekarang", "现在"], ["tidak lagi", "不再"], ["seperti", "像"], ["yang dahulu", "以前那样"]], "b": "dahulu = 从前", "g": "结构：主语 + 时间 + tidak lagi + seperti + yang dahulu。yang dahulu = 以前的（那个）。tidak lagi = 不再。"}}, {"sp": "", "role": "r", "id": "Dahulu pasar tradisional sangat tidak tertata rapi dan kotor.", "zh": "以前的传统市场又乱又脏。", "a": "413af3f9b6fd", "za": "0a7ecd1f8b57", "an": {"p": [["Dahulu", "从前"], ["pasar tradisional", "传统市场"], ["sangat", "很"], ["tidak tertata rapi", "没有整理好"], ["dan", "而且"], ["kotor", "脏"]], "b": "tertata = ter- + tata 整理；rapi=整齐", "g": "结构：时间 + 主语 + sangat tidak + 形容词。ter- 表示状态：tertata = 被整理（的状态）。sangat tidak ... = 非常不……。"}}, {"sp": "", "role": "r", "id": "Saat ini pemerintah daerah di banyak wilayah Indonesia sudah menata pasar tradisional dengan lebih baik.", "zh": "现在印度尼西亚很多地区的地方政府已经把传统市场整顿得更好了。", "a": "ed6e58149fc0", "za": "4a35cb5b3e85", "an": {"p": [["Saat ini", "现在"], ["pemerintah daerah", "地方政府"], ["di banyak wilayah", "在很多地区"], ["Indonesia", "印尼"], ["sudah", "已经"], ["menata", "整治"], ["pasar tradisional", "传统市场"], ["dengan lebih baik", "更好地"]], "b": "pemerintah = pe- + perintah；wilayah=区域；menata = meN- + tata", "g": "结构：时间 + 主语（pemerintah daerah）+ 地点 + sudah + 动词 + 宾语 + dengan + 比较级。dengan lebih baik = 以更好的方式。"}}, {"sp": "", "role": "r", "id": "Sekarang bangunan pasar tradisional sudah banyak yang permanen.", "zh": "现在很多传统市场都已经是固定建筑了。", "a": "b582eaeb63a7", "za": "9df3d73a761a", "an": {"p": [["Sekarang", "现在"], ["bangunan", "建筑"], ["pasar tradisional", "传统市场"], ["sudah", "已经"], ["banyak yang permanen", "很多是永久性的"]], "b": "bangunan = bangun 建 + -an", "g": "结构：时间 + 主语 + sudah + banyak yang + 形容词。banyak yang permanen = 很多是永久性的（指建筑）。"}}, {"sp": "", "role": "r", "id": "Pasar tradisional sekarang juga lebih bersih.", "zh": "传统市场现在也更干净了。", "a": "1626b0997ba7", "za": "40266b3d5a24", "an": {"p": [["Pasar tradisional", "传统市场"], ["sekarang", "现在"], ["juga", "也"], ["lebih", "更"], ["bersih", "干净"]], "b": "", "g": "结构：主语 + 时间 + juga + lebih + 形容词。lebih + 形容词 = 比较级。"}}, {"sp": "", "role": "r", "id": "Penjual dan pembeli sudah sangat mengerti tentang kebersihan pasar.", "zh": "卖家和买家都很懂得保持市场卫生。", "a": "1b87b1c39b1c", "za": "970e54086b94", "an": {"p": [["Penjual", "卖家"], ["dan", "和"], ["pembeli", "买家"], ["sudah", "已经"], ["sangat", "很"], ["mengerti", "懂得"], ["tentang", "关于"], ["kebersihan", "清洁"], ["pasar", "市场"]], "b": "penjual = pen- + jual；pembeli = pem- + beli；kebersihan = ke- + bersih + -an", "g": "结构：主语（并列）+ sudah sangat + 动词 + tentang + 话题。ke-……-an 把形容词变名词：bersih → kebersihan。"}}, {"sp": "", "role": "r", "id": "Banyak pasar tradisional membuat aturan jangan buang sampah sembarangan.", "zh": "很多传统市场规定不准乱扔垃圾。", "a": "d65b6959e00f", "za": "7679a859fa7b", "an": {"p": [["Banyak", "很多"], ["pasar tradisional", "传统市场"], ["membuat", "制定"], ["aturan", "规定"], ["jangan", "不要"], ["buang sampah", "丢垃圾"], ["sembarangan", "随便地"]], "b": "membuat = meN- + buat；sembarangan = se- + barang + -an", "g": "结构：主语 + membuat aturan + 内容。jangan + 动词 = 禁止。aturan 后直接接规定的内容。"}}, {"sp": "", "role": "r", "id": "Semua itu dilakukan agar pembeli merasa nyaman saat berbelanja di pasar tradisional.", "zh": "这一切都是为了让买家在传统市场买东西时感到舒适。", "a": "e55b5c753367", "za": "a2d68e34bef1", "an": {"p": [["Semua itu", "这一切"], ["dilakukan", "被做"], ["agar", "以便"], ["pembeli", "买家"], ["merasa", "觉得"], ["nyaman", "舒适"], ["saat", "当……时"], ["berbelanja", "购物"], ["di pasar tradisional", "在传统市场"]], "b": "dilakukan = di- + laku + -kan；merasa = meN- + rasa", "g": "结构：被动句：主语 + di-动词 + agar + 目的从句（含 saat + 从句）。agar = 为了、以便。"}}], "zh": "现在的传统市场已经和以前不一样了。以前传统市场很乱、很脏。现在印尼许多地区的地方政府把传统市场整顿得更好了。如今很多传统市场的建筑都是永久性的，也更干净了。卖家和买家都很重视市场卫生，很多市场规定不准乱扔垃圾。这一切都是为了让顾客在传统市场购物时感到舒适。", "note": "", "qa": [{"q": "Bagaimana pasar tradisional dahulu?", "a": "Tidak tertata rapi dan kotor.", "qa": "746ab473b56c", "aa": "7ff35e38bbf6", "qz": "以前的传统市场是什么样的？", "az": "又乱又脏。"}, {"q": "Siapa yang menata pasar tradisional?", "a": "Pemerintah daerah.", "qa": "736b24e19b7f", "aa": "9d24940b87d5", "qz": "是谁整顿了传统市场？", "az": "地方政府。"}, {"q": "Aturan apa yang dibuat banyak pasar tradisional?", "a": "Jangan buang sampah sembarangan.", "qa": "a4f54a6e3127", "aa": "53f2dc780858", "qz": "很多传统市场定了什么规矩？", "az": "不准乱扔垃圾。"}, {"q": "Untuk apa semua itu dilakukan?", "a": "Agar pembeli merasa nyaman saat berbelanja.", "qa": "06331f5a9306", "aa": "fb55c3204375", "qz": "这些都是为了什么？", "az": "为了让买家买东西时感到舒适。"}], "u": 4}, {"id": "t86", "kind": "text", "book": "BIPA 2", "title": "简单炒饭（课文 5）", "lines": [{"sp": "", "role": "r", "id": "Bahan: sosis ayam satu buah; bawang putih 3 siung, iris halus; garam; nasi 600 gram; penyedap rasa; kecap ikan; merica; telur ayam 1 butir; daun bawang 1 batang, iris halus; daging ayam 125 gram, cincang halus.", "zh": "材料：鸡肉肠一根；蒜三瓣，切碎；盐；米饭600克；调味料；鱼露；胡椒；鸡蛋一个；葱一根，切碎；鸡肉125克，剁碎。", "a": "5e2b10a042cb", "za": "ca2f821f0f80", "an": {"p": [["Bahan", "材料"], ["sosis ayam", "鸡肉肠"], ["satu buah", "一根"], ["bawang putih", "大蒜"], ["3 siung", "三瓣"], ["iris halus", "切细"], ["garam", "盐"], ["nasi", "米饭"], ["600 gram", "六百克"], ["penyedap rasa", "调味料"], ["kecap ikan", "鱼露"], ["merica", "胡椒"], ["telur ayam", "鸡蛋"], ["1 butir", "一颗"], ["daun bawang", "葱"], ["1 batang", "一根"], ["daging ayam", "鸡肉"], ["125 gram", "一百二十五克"], ["cincang halus", "剁碎"]], "b": "penyedap = peN- + sedap；kecap=酱油类调味品", "g": "结构：材料清单：名词 + 数量 + 量词, 处理方式。量词：buah 个，siung 瓣，butir 颗，batang 根。食谱里的“iris halus、cincang halus”是切法，位于名词后。"}}, {"sp": "", "role": "r", "id": "Cara membuat: 1.", "zh": "做法：第一步。", "a": "32c7117b6695", "za": "57d3c5270d70", "an": {"p": [["Cara", "方法"], ["membuat", "做"]], "b": "membuat = meN- + buat", "g": "食谱小标题：cara membuat = 做法。数字“1.”读 satu，是步骤序号。"}}, {"sp": "", "role": "r", "id": "Tumis bawang putih hingga harum.", "zh": "把蒜炒香。", "a": "2422b70a9cc1", "za": "afa2a24864e1", "an": {"p": [["Tumis", "炒"], ["bawang putih", "大蒜"], ["hingga", "直到"], ["harum", "香"]], "b": "", "g": "结构：祈使句（动词原形）+ 宾语 + hingga + 形容词。食谱用动词原形做命令。hingga = 直到。"}}, {"sp": "", "role": "r", "id": "Tambahkan telur lalu orak-arik.", "zh": "加入鸡蛋炒散。", "a": "a99548a80616", "za": "67486d6ed55a", "an": {"p": [["Tambahkan", "加入"], ["telur", "鸡蛋"], ["lalu", "然后"], ["orak-arik", "炒散（搅碎）"]], "b": "tambahkan = tambah + -kan", "g": "结构：祈使动词 + 宾语 + lalu + 动词。orak-arik 是重叠词，“炒散”的意思，也是炒蛋的做法。"}}, {"sp": "", "role": "r", "id": "2.", "zh": "第二步。", "a": null, "an": {"p": [["2.", "第二步"]], "b": "", "g": "序号“2.”读作 dua（步骤 2），与前后句连读。"}}, {"sp": "", "role": "r", "id": "Tambahkan ayam yang telah dicincang halus.", "zh": "加入剁碎的鸡肉。", "a": "fb0eb5748907", "za": "494e00ad0860", "an": {"p": [["Tambahkan", "加入"], ["ayam", "鸡肉"], ["yang telah dicincang halus", "已经剁碎的"]], "b": "dicincang = di- + cincang", "g": "结构：祈使动词 + 宾语 + yang 从句。yang telah di-动词 = 已经被……的。telah = sudah（书面）。"}}, {"sp": "", "role": "r", "id": "3.", "zh": "第三步。", "a": null, "an": {"p": [["3.", "第三步"]], "b": "", "g": "序号 3 读作 tiga。"}}, {"sp": "", "role": "r", "id": "Tambahkan sosis.", "zh": "加入香肠。", "a": "f6131aa6b266", "za": "4f66bca56558", "an": {"p": [["Tambahkan", "加入"], ["sosis", "香肠"]], "b": "", "g": "结构：祈使动词 + 宾语。"}}, {"sp": "", "role": "r", "id": "4.", "zh": "第四步。", "a": null, "an": {"p": [["4.", "第四步"]], "b": "", "g": "序号 4 读作 empat。"}}, {"sp": "", "role": "r", "id": "Masukkan daun bawang, kemudian tumis lagi.", "zh": "放入葱花，再翻炒一下。", "a": "208a6c24995e", "za": "95cf5552da71", "an": {"p": [["Masukkan", "放入"], ["daun bawang", "葱"], ["kemudian", "然后"], ["tumis", "炒"], ["lagi", "再"]], "b": "masukkan = masuk + -kan", "g": "结构：祈使动词 + 宾语, kemudian + 祈使动词 + lagi。lagi 在这里是“再一次”。"}}, {"sp": "", "role": "r", "id": "5.", "zh": "第五步。", "a": null, "an": {"p": [["5.", "第五步"]], "b": "", "g": "序号 5 读作 lima。"}}, {"sp": "", "role": "r", "id": "Masukkan nasi, kemudian aduk hingga rata.", "zh": "放入米饭，翻炒均匀。", "a": "d90caa8234ef", "za": "3814da2595da", "an": {"p": [["Masukkan", "放入"], ["nasi", "米饭"], ["kemudian", "然后"], ["aduk", "搅拌"], ["hingga", "直到"], ["rata", "均匀"]], "b": "", "g": "结构：祈使动词 + 宾语, kemudian + 动词 + hingga + 形容词。rata = 平均、均匀。"}}, {"sp": "", "role": "r", "id": "6.", "zh": "第六步。", "a": null, "an": {"p": [["6.", "第六步"]], "b": "", "g": "序号 6 读作 enam。"}}, {"sp": "", "role": "r", "id": "Tambahkan kecap ikan, garam, merica, dan penyedap rasa secara bersamaan.", "zh": "同时加入鱼露、盐、胡椒和调味料。", "a": "b8a0402bfa04", "za": "ced8d67d7181", "an": {"p": [["Tambahkan", "加入"], ["kecap ikan", "鱼露"], ["garam", "盐"], ["merica", "胡椒"], ["dan", "和"], ["penyedap rasa", "调味料"], ["secara", "以……方式"], ["bersamaan", "同时"]], "b": "bersamaan = ber- + sama + -an", "g": "结构：祈使动词 + 并列宾语 + secara bersamaan。secara bersamaan = 同时一起。"}}, {"sp": "", "role": "r", "id": "Aduk rata hingga aroma sedap atau harum tercium.", "zh": "翻炒均匀，直到闻到香味。", "a": "ddc6c1dfc1ad", "za": "0810f64b5ebd", "an": {"p": [["Aduk", "搅拌"], ["rata", "均匀"], ["hingga", "直到"], ["aroma", "香气"], ["sedap", "好闻"], ["atau", "或者"], ["harum", "香"], ["tercium", "被闻到"]], "b": "tercium = ter- + cium", "g": "结构：祈使动词 + rata + hingga + 主语 + ter-动词。tercium = 闻得到（无意中）。hingga 后面可接完整从句。"}}, {"sp": "", "role": "r", "id": "7.", "zh": "第七步。", "a": null, "an": {"p": [["7.", "第七步"]], "b": "", "g": "序号 7 读作 tujuh。"}}, {"sp": "", "role": "r", "id": "Pindahkan nasi goreng pada piring.", "zh": "把炒饭盛到盘子里。", "a": "dc8ec23b3441", "za": "b3db019e447a", "an": {"p": [["Pindahkan", "转移"], ["nasi goreng", "炒饭"], ["pada", "到"], ["piring", "盘子"]], "b": "pindahkan = pindah + -kan", "g": "结构：祈使动词 + 宾语 + pada + 容器。pindah 搬动，加 -kan 变及物：把……移到。"}}, {"sp": "", "role": "r", "id": "Anda bisa menaburkan bawang merah goreng sebagai tambahan.", "zh": "还可以撒些炸红葱头。", "a": "1ee415c3d0f9", "za": "2e3061d76f15", "an": {"p": [["Anda", "您"], ["bisa", "可以"], ["menaburkan", "撒上"], ["bawang merah goreng", "炸红葱"], ["sebagai", "作为"], ["tambahan", "额外添加"]], "b": "menaburkan = meN- + tabur + -kan；tambahan = tambah + -an", "g": "结构：主语 + bisa + 动词 + 宾语 + sebagai + 名词。sebagai = 作为。"}}], "zh": "材料：鸡肉香肠一根；大蒜三瓣，切薄片；盐；米饭 600 克；味精；鱼露；胡椒；鸡蛋一个；葱一根，切细；鸡肉 125 克，剁碎。做法：1. 把蒜炒香，加入鸡蛋炒散。2. 加入剁碎的鸡肉。3. 加入香肠。4. 放入葱，再炒一下。5. 放入米饭，翻炒均匀。6. 同时加入鱼露、盐、胡椒和味精，翻炒均匀直到闻到香味。7. 把炒饭盛到盘子里，可以撒些炸红葱头作配料。", "note": "", "qa": [{"q": "Berapa banyak sosis yang dibutuhkan?", "a": "Satu buah.", "qa": "f6c1435d5e16", "aa": "b9d9788134b1", "qz": "需要几根香肠？", "az": "一根。"}, {"q": "Berapa gram nasi yang dibutuhkan?", "a": "600 gram.", "qa": "ce808a9271a3", "aa": "15a8e51e8abb", "qz": "需要多少克米饭？", "az": "600克。"}, {"q": "Berapa butir telur ayam yang dibutuhkan?", "a": "Satu butir.", "qa": "b50bd917f29d", "aa": "6f38789eefb1", "qz": "需要几个鸡蛋？", "az": "一个。"}, {"q": "Apa saja bahan yang diaduk rata hingga aroma sedap muncul?", "a": "Kecap ikan, garam, merica, dan penyedap rasa.", "qa": "9268372e717c", "aa": "66c7fc1038b0", "qz": "哪些材料要翻炒均匀直到出香味？", "az": "鱼露、盐、胡椒和调味料。"}, {"q": "Apa bahan yang dicincang halus?", "a": "Daging ayam.", "qa": "b6c9fcf8c318", "aa": "4bccdf406b49", "qz": "哪种材料要剁碎？", "az": "鸡肉。"}, {"q": "Apa yang bisa ditabur sebagai tambahan?", "a": "Bawang merah goreng.", "qa": "5f760b12e6a1", "aa": "d4e242302430", "qz": "可以额外撒点什么？", "az": "炸红葱头。"}], "u": 5}, {"id": "t87", "kind": "text", "book": "BIPA 2", "title": "Budi 家周围（音频 6）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Budi.", "zh": "我叫 Budi。", "a": "dff39b3c900f", "za": "bfba69167aa2", "an": {"p": [["Nama saya", "我的名字"], ["Budi", "布迪"]], "b": "", "g": "结构：Nama saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya tinggal di Jalan Supratman.", "zh": "我住在 Supratman 路。", "a": "bb6c736ac792", "za": "8d5d4b23f725", "an": {"p": [["Saya", "我"], ["tinggal", "居住"], ["di", "在"], ["Jalan Supratman", "苏普拉特曼路"]], "b": "", "g": "结构：主语 + tinggal di + 地点。Jalan + 路名。"}}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada masjid.", "zh": "我家对面有一座清真寺。", "a": "11831a44d9bf", "za": "cc825cb81c82", "an": {"p": [["Di seberang", "在对面"], ["rumah saya", "我的房子"], ["ada", "有"], ["masjid", "清真寺"]], "b": "", "g": "结构：方位 + ada + 物。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri masjid ada taman kanak-kanak.", "zh": "清真寺左边有一所幼儿园。", "a": "21706298e98c", "za": "9889608784fb", "an": {"p": [["Di sebelah kiri", "在左边"], ["masjid", "清真寺"], ["ada", "有"], ["taman kanak-kanak", "幼儿园"]], "b": "kanak-kanak = 孩童（重叠）", "g": "结构：方位 + ada + 名词。taman kanak-kanak（TK）= 幼儿园，直译“孩子的花园”。"}}, {"sp": "", "role": "r", "id": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Salim.", "zh": "我家右边是邻居 Salim 先生的家。", "a": "6923a255d1c5", "za": "3f9bfb43a60c", "an": {"p": [["Di sebelah kanan", "在右边"], ["rumah saya", "我的房子"], ["ada", "有"], ["rumah", "房子"], ["tetangga", "邻居"], ["saya", "我的"], ["Pak Salim", "萨利姆先生"]], "b": "", "g": "结构：方位 + ada + 名词 + 同位语（Pak Salim）。Pak = Bapak 的简称。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada kantor pos.", "zh": "我家左边是邮局。", "a": "4127467dbeb8", "za": "c74b4a368aa9", "an": {"p": [["Di sebelah kiri", "在左边"], ["rumah saya", "我的房子"], ["ada", "有"], ["kantor pos", "邮局"]], "b": "", "g": "结构：方位 + ada + 名词。kantor pos = 邮局。"}}, {"sp": "", "role": "r", "id": "Di belakang rumah saya ada toko kelontong.", "zh": "我家后面有一家杂货店。", "a": "089f31e80145", "za": "35dfc2e7e5c8", "an": {"p": [["Di belakang", "在后面"], ["rumah saya", "我的房子"], ["ada", "有"], ["toko kelontong", "杂货店"]], "b": "", "g": "结构：方位 + ada + 名词。"}}], "zh": "我叫 Budi，住在 Supratman 路。我家对面有一座清真寺，清真寺左边是一所幼儿园。我家右边是邻居 Salim 先生家，左边是邮局，后面是一家杂货店。", "note": "", "qa": [{"q": "Siapa Pak Salim?", "a": "Tetangga Budi.", "qa": "13e8eb901719", "aa": "6bc41c83fd7b", "qz": "Salim 先生是谁？", "az": "Budi 的邻居。"}, {"q": "Ada apa di seberang rumah Budi?", "a": "Masjid.", "qa": "76a20da20048", "aa": "2f07071ed18b", "qz": "Budi 家对面有什么？", "az": "清真寺。"}, {"q": "Ada apa di sebelah kiri rumah Budi?", "a": "Kantor pos.", "qa": "0c86b63763eb", "aa": "dba7a93761eb", "qz": "Budi 家左边有什么？", "az": "邮局。"}, {"q": "Ada apa di belakang rumah Budi?", "a": "Toko kelontong.", "qa": "44edac7e6867", "aa": "ccc87e2beb07", "qz": "Budi 家后面有什么？", "az": "杂货店。"}], "u": 6}, {"id": "t88", "kind": "text", "book": "BIPA 2", "title": "Raisa 的家（课文 6）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Raisa.", "zh": "我叫 Raisa。", "a": "93a3100953bf", "za": "062c3afe506e", "an": {"p": [["Nama saya", "我的名字"], ["Raisa", "莱莎"]], "b": "", "g": "结构：Nama saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya tinggal di Jalan Sukasenang.", "zh": "我住在 Sukasenang 路。", "a": "4b8d9fdd3e24", "za": "fdd8aa57cf2e", "an": {"p": [["Saya", "我"], ["tinggal", "居住"], ["di", "在"], ["Jalan Sukasenang", "苏卡色囊路"]], "b": "", "g": "结构：主语 + tinggal di + 地点。"}}, {"sp": "", "role": "r", "id": "Rumah saya adalah rumah dua lantai.", "zh": "我家是两层楼的房子。", "a": "14c7615c345d", "za": "f856ffe47bf2", "an": {"p": [["Rumah saya", "我的房子"], ["adalah", "是"], ["rumah dua lantai", "两层楼的房子"]], "b": "lantai = 楼层", "g": "结构：主语 + adalah + 名词短语。dua lantai = 两层。"}}, {"sp": "", "role": "r", "id": "Rumah saya berwarna putih.", "zh": "我家是白色的。", "a": "43aea247dc57", "za": "cc122d0d442c", "an": {"p": [["Rumah saya", "我的房子"], ["berwarna", "颜色是"], ["putih", "白色"]], "b": "berwarna = ber- + warna", "g": "结构：主语 + berwarna + 颜色。"}}, {"sp": "", "role": "r", "id": "Di depan rumah saya ada halaman.", "zh": "我家前面有个院子。", "a": "8f44fedfb6cb", "za": "66c58d5c0a7f", "an": {"p": [["Di depan", "在前面"], ["rumah saya", "我的房子"], ["ada", "有"], ["halaman", "院子"]], "b": "", "g": "结构：方位 + ada + 名词。"}}, {"sp": "", "role": "r", "id": "Di sana ada pohon mangga.", "zh": "那里有一棵芒果树。", "a": "d1b189c1171b", "za": "b6594db146eb", "an": {"p": [["Di sana", "在那里"], ["ada", "有"], ["pohon mangga", "芒果树"]], "b": "", "g": "结构：地点 + ada + 名词。pohon + 果名 = ……树。"}}, {"sp": "", "role": "r", "id": "Di belakang rumah saya ada warung Ibu Yayan.", "zh": "我家后面是 Yayan 阿姨的小店。", "a": "309f634e85f2", "za": "4260a593aeff", "an": {"p": [["Di belakang", "在后面"], ["rumah saya", "我的房子"], ["ada", "有"], ["warung", "小店"], ["Ibu Yayan", "雅彦女士"]], "b": "", "g": "结构：方位 + ada + 名词 + 所有者。warung Ibu Yayan = 雅彦女士的小店。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada toko kelontong.", "zh": "我家左边有一家杂货店。", "a": "5499abc80cab", "za": "da324c6c9941", "an": {"p": [["Di sebelah kiri", "在左边"], ["rumah saya", "我的房子"], ["ada", "有"], ["toko kelontong", "杂货店"]], "b": "", "g": "结构：方位 + ada + 名词。"}}, {"sp": "", "role": "r", "id": "Di samping kanan rumah saya ada rumah seorang tetangga saya, Pak Bandi.", "zh": "我家右边是邻居 Bandi 先生的家。", "a": "d497f81d567c", "za": "3925885450d8", "an": {"p": [["Di samping kanan", "在右边"], ["rumah saya", "我的房子"], ["ada", "有"], ["rumah", "房子"], ["seorang tetangga saya", "我的一位邻居"], ["Pak Bandi", "班迪先生"]], "b": "", "g": "结构：方位 + ada + 名词 + 所有者 + 同位语。seorang = 一位。"}}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada taman bermain.", "zh": "我家对面有一个游乐场。", "a": "0a4a6103d460", "za": "df1c695d6a90", "an": {"p": [["Di seberang", "在对面"], ["rumah saya", "我的房子"], ["ada", "有"], ["taman bermain", "游乐场"]], "b": "bermain = ber- + main", "g": "结构：方位 + ada + 名词。taman bermain = 玩耍的公园。"}}], "zh": "我叫 Raisa，住在 Sukasenang 路。我家是两层楼，白色的。房前有个院子，院子里有棵芒果树。房后是 Yayan 阿姨的小店，左边是一家杂货店，右边是邻居 Bandi 先生家，对面是一个游乐场。", "note": "", "qa": [{"q": "Di mana Raisa tinggal?", "a": "Di Jalan Sukasenang.", "qa": "88350aef70da", "aa": "97412599fd02", "qz": "Raisa 住在哪里？", "az": "在 Sukasenang 路。"}, {"q": "Apa warna rumah Raisa?", "a": "Putih.", "qa": "75ba4ec6bbff", "aa": "6c31feb40754", "qz": "Raisa 家是什么颜色？", "az": "白色。"}, {"q": "Ada pohon apa di halaman rumah Raisa?", "a": "Pohon mangga.", "qa": "31c353e1b6c5", "aa": "2cefc7270c73", "qz": "Raisa 家院子里有什么树？", "az": "芒果树。"}, {"q": "Siapa pemilik warung di belakang rumah Raisa?", "a": "Ibu Yayan.", "qa": "d681ab253c05", "aa": "c3dd98bf02f1", "qz": "Raisa 家后面的小店是谁开的？", "az": "Yayan 阿姨。"}, {"q": "Di mana letak taman bermain?", "a": "Di seberang rumah Raisa.", "qa": "d783f3db2716", "aa": "fe9b69506d5d", "qz": "游乐场在哪里？", "az": "在 Raisa 家对面。"}, {"q": "Siapakah Pak Bandi?", "a": "Tetangga Raisa.", "qa": "3d02a7bb6999", "aa": "1693d2ea30b3", "qz": "Bandi 先生是谁？", "az": "Raisa 的邻居。"}], "u": 6}, {"id": "t89", "kind": "text", "book": "BIPA 2", "title": "画平面图练习", "lines": [{"sp": "", "role": "r", "id": "Rumah saya ada di Jalan Bambu.", "zh": "我家在 Bambu 路。", "a": "bc23ed5b507b", "za": "352dc0bad627", "an": {"p": [["Rumah saya", "我的房子"], ["ada di", "在"], ["Jalan Bambu", "竹子路"]], "b": "", "g": "结构：主语 + ada di + 地点。"}}, {"sp": "", "role": "r", "id": "Rumah saya ada di belakang Masjid Al-Furqon.", "zh": "我家在 Al-Furqon 清真寺后面。", "a": "9836e645a3fd", "za": "ed449d1d4a87", "an": {"p": [["Rumah saya", "我的房子"], ["ada di belakang", "在……后面"], ["Masjid Al-Furqon", "法尔贡清真寺"]], "b": "", "g": "结构：主语 + ada di + 方位 + 参照物。"}}, {"sp": "", "role": "r", "id": "Di sebelah kanan masjid ada kebun cabai.", "zh": "清真寺右边有一片辣椒园。", "a": "c0b93fabfc1b", "za": "0d2fcda366ff", "an": {"p": [["Di sebelah kanan", "在右边"], ["masjid", "清真寺"], ["ada", "有"], ["kebun cabai", "辣椒园"]], "b": "kebun = 园子", "g": "结构：方位 + ada + 名词。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada toko yang menjual gas dan minyak tanah.", "zh": "我家左边有一家卖煤气和煤油的店。", "a": "98bcd495ca1c", "za": "33ea96fde02d", "an": {"p": [["Di sebelah kiri", "在左边"], ["rumah saya", "我的房子"], ["ada", "有"], ["toko", "店"], ["yang menjual", "卖……的"], ["gas", "煤气"], ["dan", "和"], ["minyak tanah", "煤油"]], "b": "menjual = meN- + jual", "g": "结构：方位 + ada + 名词 + yang 从句。yang menjual gas dan minyak tanah 修饰 toko。"}}, {"sp": "", "role": "r", "id": "Di seberang toko gas ada toko air minum.", "zh": "煤气店对面有一家饮用水店。", "a": "4925737b81f5", "za": "25ac72aeb222", "an": {"p": [["Di seberang", "在对面"], ["toko gas", "煤气店"], ["ada", "有"], ["toko air minum", "饮用水店"]], "b": "", "g": "结构：方位 + ada + 名词。air minum = 饮用水。"}}, {"sp": "", "role": "r", "id": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Resa.", "zh": "我家右边是邻居 Resa 先生的家。", "a": "032006be3294", "za": "39353c456df3", "an": {"p": [["Di sebelah kanan", "在右边"], ["rumah saya", "我的房子"], ["ada", "有"], ["rumah tetangga saya", "我邻居的房子"], ["Pak Resa", "雷萨先生"]], "b": "", "g": "结构：方位 + ada + 名词 + 同位语。"}}, {"sp": "", "role": "r", "id": "Di seberang rumah Pak Resa ada supermarket.", "zh": "Resa 先生家对面有一家超市。", "a": "5f70e9a452f7", "za": "bd981d4f29ab", "an": {"p": [["Di seberang", "在对面"], ["rumah Pak Resa", "雷萨先生的家"], ["ada", "有"], ["supermarket", "超市"]], "b": "", "g": "结构：方位 + ada + 名词。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri supermarket ada tempat pangkas rambut.", "zh": "超市左边有一家理发店。", "a": "5efbe3630d15", "za": "71c5a4bba47b", "an": {"p": [["Di sebelah kiri", "在左边"], ["supermarket", "超市"], ["ada", "有"], ["tempat pangkas rambut", "理发店"]], "b": "pangkas = 剪", "g": "结构：方位 + ada + 名词短语。tempat + 动作 = 做某事的地方。"}}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada taman bermain anak.", "zh": "我家对面有一个儿童游乐场。", "a": "5a3e02da4681", "za": "771640e2109d", "an": {"p": [["Di seberang", "在对面"], ["rumah saya", "我的房子"], ["ada", "有"], ["taman bermain anak", "儿童游乐场"]], "b": "", "g": "结构：方位 + ada + 名词。"}}, {"sp": "", "role": "r", "id": "Di belakang taman bermain anak ada sekolah, yaitu SDN Ajitunggal.", "zh": "儿童游乐场后面有一所学校，叫 Ajitunggal 国立小学。", "a": "f072cddbc1fa", "za": "ab29d599a178", "an": {"p": [["Di belakang", "在后面"], ["taman bermain anak", "儿童游乐场"], ["ada", "有"], ["sekolah", "学校"], ["yaitu", "即"], ["SDN", "公立小学（Sekolah Dasar Negeri）"], ["Ajitunggal", "阿吉东加尔"]], "b": "", "g": "结构：方位 + ada + 名词, yaitu + 具体名称。yaitu = 也就是、即。SDN = Sekolah Dasar Negeri。"}}], "zh": "我家在竹子路，在 Al-Furqon 清真寺后面。清真寺右边有一块辣椒地。我家左边是一家卖煤气和煤油的店，煤气店对面是一家饮用水店。我家右边是邻居 Resa 先生家，他家对面是一家超市，超市左边是理发店。我家对面是儿童游乐场，游乐场后面是一所学校——Ajitunggal 国立小学。", "note": "练习：根据这段描述画出平面图。", "qa": [], "u": 6}, {"id": "t90", "kind": "text", "book": "BIPA 2", "title": "热身运动（音频 7）", "lines": [{"sp": "", "role": "r", "id": "Sebelum berolahraga, kita harus melakukan pemanasan.", "zh": "运动前，我们必须先热身。", "a": "89b9eec63d84", "za": "0bb90d0e931a", "an": {"p": [["Sebelum", "在……之前"], ["berolahraga", "做运动"], ["kita", "我们"], ["harus", "必须"], ["melakukan", "进行"], ["pemanasan", "热身"]], "b": "berolahraga = ber- + olahraga；melakukan = meN- + laku + -kan；pemanasan = pe- + panas + -an", "g": "结构：Sebelum + 动词, 主语 + harus + 动词 + 宾语。pemanasan = 热身（使变热的过程）。"}}, {"sp": "", "role": "r", "id": "Contoh pemanasan adalah sebagai berikut.", "zh": "热身动作举例如下。", "a": "7393b827a0a1", "za": "f0dadc4f5067", "an": {"p": [["Contoh", "例子"], ["pemanasan", "热身"], ["adalah", "是"], ["sebagai berikut", "如下"]], "b": "berikut = ber- + ikut", "g": "结构：主语 + adalah + sebagai berikut。sebagai berikut = 如下，用来引出后面的内容。"}}, {"sp": "", "role": "r", "id": "Langkah pertama, gerakkan kepala ke kanan dan ke kiri.", "zh": "第一步，头向右、向左转动。", "a": "437c6e934d77", "za": "52c8923accc0", "an": {"p": [["Langkah", "步骤"], ["pertama", "第一"], ["gerakkan", "活动、转动"], ["kepala", "头"], ["ke kanan", "向右"], ["dan", "和"], ["ke kiri", "向左"]], "b": "gerakkan = gerak + -kan（祈使）", "g": "结构：顺序词 + 祈使动词 + 宾语 + 方向。Langkah pertama = 第一步。祈使句动词加 -kan，不用主语。"}}, {"sp": "", "role": "r", "id": "Setelah itu, regangkan tangan ke atas dan ke bawah.", "zh": "然后，双手向上、向下伸展。", "a": "28713acea5de", "za": "ce42eaaed02f", "an": {"p": [["Setelah itu", "之后"], ["regangkan", "伸展"], ["tangan", "手臂"], ["ke atas", "向上"], ["dan", "和"], ["ke bawah", "向下"]], "b": "regangkan = regang + -kan", "g": "结构：连接词 + 祈使动词 + 宾语 + 方向。"}}, {"sp": "", "role": "r", "id": "Terakhir, angkat kaki secara bergantian.", "zh": "最后，两腿轮流抬起。", "a": "90655aced2c5", "za": "e45ffe9a02ac", "an": {"p": [["Terakhir", "最后"], ["angkat", "抬起"], ["kaki", "脚"], ["secara", "以……方式"], ["bergantian", "轮流"]], "b": "bergantian = ber- + ganti + -an", "g": "结构：顺序词 + 祈使动词 + 宾语 + secara bergantian。bergantian = 轮流、交替。"}}, {"sp": "", "role": "r", "id": "Lakukan tiap gerakan selama delapan detik.", "zh": "每个动作做八秒。", "a": "523283b23704", "za": "21f76a1f27c3", "an": {"p": [["Lakukan", "做"], ["tiap", "每个"], ["gerakan", "动作"], ["selama", "持续"], ["delapan detik", "八秒"]], "b": "lakukan = laku + -kan；gerakan = gerak + -an", "g": "结构：祈使动词 + 宾语 + selama + 时长。tiap = setiap 每个。selama 表示持续时间。"}}], "zh": "运动前我们要先热身。热身的例子如下：第一步，把头向右、向左转动；然后，把手向上、向下伸展；最后，轮流抬腿。每个动作做八秒。", "note": "", "qa": [{"q": "Apa yang harus kita lakukan sebelum berolahraga?", "a": "Pemanasan.", "qa": "c26fbccd1e2d", "aa": "884682e8d5cc", "qz": "运动前我们必须做什么？", "az": "热身。"}, {"q": "Apa langkah pertama ketika melakukan pemanasan?", "a": "Menggerakkan kepala ke kanan dan ke kiri.", "qa": "c292ee66ea17", "aa": "8bb4aa1a36c9", "qz": "热身的第一步是什么？", "az": "头向右、向左转动。"}, {"q": "Ke arah mana kita harus meregangkan tangan?", "a": "Ke atas dan ke bawah.", "qa": "b1e1310bdf5d", "aa": "5a92541fbefa", "qz": "手要往哪个方向伸展？", "az": "向上和向下。"}, {"q": "Berapa lama waktu untuk tiap gerakan?", "a": "Delapan detik.", "qa": "d13bf8f16990", "aa": "5f273fa78b58", "qz": "每个动作做多长时间？", "az": "八秒。"}, {"q": "Apa langkah ketiga dalam pemanasan?", "a": "Mengangkat kaki secara bergantian.", "qa": "14d955f3b69c", "aa": "3b49e6a7b457", "qz": "热身的第三步是什么？", "az": "两腿轮流抬起。"}], "u": 7}, {"id": "t91", "kind": "text", "book": "BIPA 2", "title": "放松运动的做法（课文 7）", "lines": [{"sp": "", "role": "r", "id": "Olahraga adalah aktivitas yang baik bagi tubuh.", "zh": "运动对身体有好处。", "a": "1c919f7b4fd7", "za": "34aeab63a7f4", "an": {"p": [["Olahraga", "运动"], ["adalah", "是"], ["aktivitas", "活动"], ["yang baik", "好的"], ["bagi", "对于"], ["tubuh", "身体"]], "b": "", "g": "结构：主语 + adalah + 名词 + yang 从句 + bagi + 对象。bagi = 对……来说（同 untuk）。"}}, {"sp": "", "role": "r", "id": "Setelah melakukan kegiatan inti Anda harus melakukan pendinginan.", "zh": "做完主要运动后，你必须做放松运动。", "a": "d2df4e132608", "za": "0521289f3fa2", "an": {"p": [["Setelah", "在……之后"], ["melakukan", "进行"], ["kegiatan inti", "主要活动"], ["Anda", "您"], ["harus", "必须"], ["pendinginan", "放松（冷身）"]], "b": "pendinginan = pen- + dingin + -an", "g": "结构：Setelah + 动词短语, 主语 + harus + 动词 + 宾语。pendinginan = 使变冷（恢复）的过程，即整理运动。"}}, {"sp": "", "role": "r", "id": "Ada banyak cara untuk melakukan pendinginan.", "zh": "放松运动有很多种做法。", "a": "aef35b6aafd1", "za": "f9708dbf44d2", "an": {"p": [["Ada", "有"], ["banyak", "很多"], ["cara", "方法"], ["untuk", "用来"], ["melakukan", "进行"], ["pendinginan", "放松"]], "b": "", "g": "结构：Ada + 数量 + 名词 + untuk + 动词短语。untuk 说明用途。"}}, {"sp": "", "role": "r", "id": "Berikut adalah salah satu caranya.", "zh": "下面是其中一种。", "a": "c75d6a968a4b", "za": "a107895dcb08", "an": {"p": [["Berikut", "以下"], ["adalah", "是"], ["salah satu", "其中之一"], ["caranya", "它的方法"]], "b": "caranya = cara + -nya", "g": "结构：Berikut adalah + 名词。salah satu caranya = 方法之一。"}}, {"sp": "", "role": "r", "id": "Pertama, buka kaki selebar bahu.", "zh": "第一，两脚分开与肩同宽。", "a": "f9f2f733de38", "za": "b314067b63d5", "an": {"p": [["Pertama", "首先"], ["buka", "张开"], ["kaki", "脚"], ["selebar", "和……一样宽"], ["bahu", "肩膀"]], "b": "selebar = se- + lebar", "g": "结构：顺序词 + 祈使动词 + 宾语 + se-形容词 + 名词。se- + 形容词 + 名词 = 与……一样 ……：selebar bahu = 与肩同宽。"}}, {"sp": "", "role": "r", "id": "Kedua, pegang pinggang dengan tangan kiri.", "zh": "第二，左手叉腰。", "a": "b3a2351cc607", "za": "9c24a6b6780f", "an": {"p": [["Kedua", "第二"], ["pegang", "握住"], ["pinggang", "腰"], ["dengan", "用"], ["tangan kiri", "左手"]], "b": "kedua = ke- + dua", "g": "结构：序数词 + 祈使动词 + 宾语 + dengan + 工具。dengan 这里表示用什么（工具／部位）。"}}, {"sp": "", "role": "r", "id": "Setelah itu gerakkan tangan kanan ke atas dan ke bawah.", "zh": "然后右手向上、向下摆动。", "a": "d1995b1e61dd", "za": "736418bf4a3e", "an": {"p": [["Setelah itu", "之后"], ["gerakkan", "活动"], ["tangan kanan", "右手"], ["ke atas", "向上"], ["dan", "和"], ["ke bawah", "向下"]], "b": "", "g": "结构：连接词 + 祈使动词 + 宾语 + 方向。"}}, {"sp": "", "role": "r", "id": "Lakukan hal yang sama dengan tangan kiri.", "zh": "左手也做同样的动作。", "a": "4a69cd03a2c5", "za": "4fa3a1f1c91f", "an": {"p": [["Lakukan", "做"], ["hal yang sama", "同样的事"], ["dengan", "用"], ["tangan kiri", "左手"]], "b": "", "g": "结构：祈使动词 + 宾语（hal yang sama）+ dengan + 部位。hal yang sama = 同样的事。"}}, {"sp": "", "role": "r", "id": "Lalu, condongkan badan ke arah kiri bawah sampai hampir jongkok kemudian regangkan kaki ke kanan.", "zh": "接着，身体向左下方倾斜，几乎蹲下，然后把右腿伸直。", "a": "fb80827ce861", "za": "dc8eec893e07", "an": {"p": [["Lalu", "然后"], ["condongkan", "倾斜"], ["badan", "身体"], ["ke arah", "朝向"], ["kiri bawah", "左下方"], ["sampai", "直到"], ["hampir", "几乎"], ["jongkok", "蹲下"], ["kemudian", "接着"], ["regangkan", "伸展"], ["kaki", "腿"], ["ke kanan", "向右"]], "b": "condongkan = condong + -kan", "g": "结构：连接词 + 祈使动词 + 宾语 + 方向 + sampai + 状态, kemudian + 祈使动词 + 宾语 + 方向。长句分两步动作：先侧倾到几乎蹲下，再把腿向右伸展。"}}, {"sp": "", "role": "r", "id": "Lakukan hal yang sama dengan kaki kiri.", "zh": "左腿也做同样的动作。", "a": "1d050603045f", "za": "9a204e2ed1d1", "an": {"p": [["Lakukan", "做"], ["hal yang sama", "同样的事"], ["dengan", "用"], ["kaki kiri", "左脚／左腿"]], "b": "", "g": "结构同前：祈使动词 + hal yang sama + dengan + 部位。"}}, {"sp": "", "role": "r", "id": "Tahan tiap gerakan selama 8 detik.", "zh": "每个动作保持8秒。", "a": "086cc936cdc7", "za": "1e2c56a28f59", "an": {"p": [["Tahan", "保持"], ["tiap", "每个"], ["gerakan", "动作"], ["selama", "持续"], ["8 detik", "八秒"]], "b": "gerakan = gerak + -an", "g": "结构：祈使动词 + 宾语 + selama + 时长。tahan = 屏住、保持。"}}, {"sp": "", "role": "r", "id": "Setelah selesai pendinginan hindari meminum minuman bersoda.", "zh": "放松运动做完后，避免喝碳酸饮料。", "a": "2211a2a5fbe4", "za": "658537322fcc", "an": {"p": [["Setelah", "之后"], ["selesai", "结束"], ["pendinginan", "放松"], ["hindari", "避免"], ["meminum", "喝"], ["minuman bersoda", "碳酸饮料"]], "b": "hindari = hindar + -i（祈使）；meminum = meN- + minum；bersoda = ber- + soda", "g": "结构：Setelah + 动作, 祈使动词 + 动词短语。hindari = 请避免，-i 使动词及物。minuman bersoda = 带汽的饮料。"}}, {"sp": "", "role": "r", "id": "Minuman bersoda dapat membuat perut menjadi kembung.", "zh": "碳酸饮料会让肚子胀气。", "a": "5ccc70968c95", "za": "e53e39af0e93", "an": {"p": [["Minuman bersoda", "碳酸饮料"], ["dapat", "可能"], ["membuat", "使"], ["perut", "肚子"], ["menjadi", "变得"], ["kembung", "胀气"]], "b": "membuat = meN- + buat", "g": "结构：主语 + dapat + membuat + 宾语 + menjadi + 形容词。membuat A menjadi B = 使 A 变成 B。"}}], "zh": "运动对身体有益。做完主要运动后，要做放松运动。放松的方法很多，下面是其中一种：第一，双脚分开与肩同宽；第二，左手扶腰；然后右手上下摆动，左手也做同样的动作。接着，身体向左下方倾斜，几乎蹲下，然后把右腿伸直，左腿也同样做。每个动作保持 8 秒。放松结束后，避免喝汽水，因为汽水会让肚子胀。", "note": "", "qa": [{"q": "Apa tema teks di atas?", "a": "Cara melakukan pendinginan.", "qa": "4278f23b0947", "aa": "ab1ee7211526", "qz": "上面这篇文章的主题是什么？", "az": "怎样做放松运动。"}, {"q": "Apa yang harus Anda lakukan setelah kegiatan inti?", "a": "Pendinginan.", "qa": "bb2d66c9dad4", "aa": "a11ddb8859a8", "qz": "做完主要运动后你应该做什么？", "az": "放松运动。"}, {"q": "Mengapa setelah berolahraga tidak boleh meminum minuman bersoda?", "a": "Karena dapat membuat perut kembung.", "qa": "dc102e08d76a", "aa": "2381013d2a83", "qz": "为什么运动后不能喝碳酸饮料？", "az": "因为会让肚子胀气。"}, {"q": "Apa langkah pertama dalam pendinginan?", "a": "Membuka kaki selebar bahu.", "qa": "3d70b19afa40", "aa": "0ed9a1c56a01", "qz": "放松运动的第一步是什么？", "az": "两脚分开与肩同宽。"}, {"q": "Berapa lama tiap gerakan dilakukan?", "a": "Delapan detik.", "qa": "228df3d8f895", "aa": "5f273fa78b58", "qz": "每个动作做多长时间？", "az": "八秒。"}], "u": 7}, {"id": "t92", "kind": "text", "book": "BIPA 2", "title": "坐通勤列车（课文 8）", "lines": [{"sp": "", "role": "r", "id": "Saya mencoba naik kereta rel listrik (KRL) minggu lalu.", "zh": "上周我试着坐了电气列车（KRL）。", "a": "5bb2373cf0a5", "za": "d060a278d210", "an": {"p": [["Saya", "我"], ["mencoba", "尝试"], ["naik", "乘坐"], ["kereta rel listrik", "电力火车"], ["KRL", "电动通勤列车"], ["minggu lalu", "上周"]], "b": "mencoba = meN- + coba", "g": "结构：主语 + mencoba + 动词 + 宾语 + 时间。naik + 交通工具 = 乘……。KRL = Kereta Rel Listrik。"}}, {"sp": "", "role": "r", "id": "Saya berangkat dari Bogor ke Jakarta.", "zh": "我从茂物出发去雅加达。", "a": "cf821f779a9a", "za": "56829e90a87a", "an": {"p": [["Saya", "我"], ["berangkat", "出发"], ["dari", "从"], ["Bogor", "茂物"], ["ke", "到"], ["Jakarta", "雅加达"]], "b": "berangkat = ber- + angkat", "g": "结构：主语 + berangkat + dari + 起点 + ke + 终点。"}}, {"sp": "", "role": "r", "id": "Banyak hal yang baru saya temui ketika mencoba naik KRL.", "zh": "第一次坐 KRL，我遇到了很多新鲜事。", "a": "babde601ee7c", "za": "716cd68aa5bb", "an": {"p": [["Banyak hal", "很多事"], ["yang baru saya temui", "我刚遇到的"], ["ketika", "当……时"], ["mencoba", "尝试"], ["naik KRL", "乘坐 KRL"]], "b": "temui = temu + -i", "g": "结构：主语（Banyak hal）+ yang 从句 + ketika + 从句。yang baru saya temui：yang 从句里用 “saya + 动词原形” 的被动结构，修饰 hal。baru = 刚刚。"}}, {"sp": "", "role": "r", "id": "Pertama saya memesan tiket di loket yang ada.", "zh": "首先，我在售票窗口买票。", "a": "1a4dfeb5fc37", "za": "55ffa67763d6", "an": {"p": [["Pertama", "首先"], ["saya", "我"], ["memesan", "订购"], ["tiket", "票"], ["di loket", "在售票窗口"], ["yang ada", "现有的"]], "b": "memesan = meN- + pesan；loket 窗口", "g": "结构：顺序词 + 主语 + 动词 + 宾语 + 地点。yang ada = 现有的（售票窗口）。"}}, {"sp": "", "role": "r", "id": "Saya harus menyebutkan stasiun yang ingin saya tuju.", "zh": "我得说出要去的车站。", "a": "11147e66e2c4", "za": "0dcca0ba5c37", "an": {"p": [["Saya", "我"], ["harus", "必须"], ["menyebutkan", "说出"], ["stasiun", "车站"], ["yang ingin saya tuju", "我想去的"]], "b": "menyebutkan = meN- + sebut + -kan；tuju = 前往", "g": "结构：主语 + harus + 动词 + 宾语 + yang 从句。yang ingin saya tuju：yang 从句内是 “saya + 动词原形”结构，修饰 stasiun。"}}, {"sp": "", "role": "r", "id": "Harganya cukup murah, hanya 10.000 rupiah.", "zh": "票价挺便宜的，只要一万印尼盾。", "a": "2fd854fe66f5", "za": "f88c9a303e61", "an": {"p": [["Harganya", "它的价格"], ["cukup", "相当"], ["murah", "便宜"], ["hanya", "只"], ["10.000 rupiah", "一万盾"]], "b": "harganya = harga + -nya", "g": "结构：主语 + cukup + 形容词, hanya + 数额。10.000 读作 sepuluh ribu。"}}, {"sp": "", "role": "r", "id": "Setelah itu, saya menempelkan tiket di gerbang dan berjalan ke peron untuk menunggu kereta.", "zh": "然后，我在闸机上刷票，走到站台等车。", "a": "2bac56f29379", "za": "20959a7faa2c", "an": {"p": [["Setelah itu", "之后"], ["saya", "我"], ["menempelkan", "贴上（刷）"], ["tiket", "票"], ["di gerbang", "在闸机"], ["dan", "并"], ["berjalan", "走"], ["ke peron", "到站台"], ["untuk", "为了"], ["menunggu", "等"], ["kereta", "火车"]], "b": "menempelkan = meN- + tempel + -kan；menunggu = meN- + tunggu", "g": "结构：连接词 + 主语 + 动词 1 + 宾语 + 地点 + dan + 动词 2 + 地点 + untuk + 目的。untuk menunggu kereta 表目的：为了等车。"}}, {"sp": "", "role": "r", "id": "Ketika kereta tiba, saya langsung naik.", "zh": "列车一到，我马上上车。", "a": "b244513943af", "za": "008d17f59570", "an": {"p": [["Ketika", "当……时"], ["kereta", "火车"], ["tiba", "到达"], ["saya", "我"], ["langsung", "马上"], ["naik", "上车"]], "b": "", "g": "结构：Ketika + 从句, 主语 + langsung + 动词。"}}, {"sp": "", "role": "r", "id": "Keadaan di dalam kereta cukup sesak.", "zh": "车厢里挺挤的。", "a": "2debad9ffbb7", "za": "c411b3246a60", "an": {"p": [["Keadaan", "状况"], ["di dalam", "在里面"], ["kereta", "火车"], ["cukup", "相当"], ["sesak", "拥挤"]], "b": "keadaan = ke- + ada + -an", "g": "结构：主语（Keadaan + 地点）+ cukup + 形容词。keadaan = 情况、状态。"}}, {"sp": "", "role": "r", "id": "Kereta pun tiba di Jakarta.", "zh": "列车到了雅加达。", "a": "c32f0d2e309f", "za": "9872463c29b6", "an": {"p": [["Kereta", "火车"], ["pun", "也、就"], ["tiba", "到达"], ["di Jakarta", "到雅加达"]], "b": "", "g": "结构：主语 + pun + 动词 + 地点。pun 放在主语后，表示“随之”，语气柔和。"}}, {"sp": "", "role": "r", "id": "Saya turun, lalu berjalan keluar stasiun.", "zh": "我下车后走出车站。", "a": "297ca52516ed", "za": "b3e505b126c2", "an": {"p": [["Saya", "我"], ["turun", "下车"], ["lalu", "然后"], ["berjalan", "走"], ["keluar", "出"], ["stasiun", "车站"]], "b": "", "g": "结构：主语 + 动词 1, lalu + 动词 2 + 方向 + 地点。turun = 下（车）。"}}, {"sp": "", "role": "r", "id": "Saya harus menempelkan kembali tiket di gerbang yang telah disediakan.", "zh": "我得在指定的闸机上再刷一次票。", "a": "2e7e57cc21cd", "za": "6a366d837443", "an": {"p": [["Saya", "我"], ["harus", "必须"], ["menempelkan", "贴（刷）"], ["kembali", "再次"], ["tiket", "票"], ["di gerbang", "在闸机"], ["yang telah disediakan", "已经设置好的"]], "b": "disediakan = di- + sedia + -kan", "g": "结构：主语 + harus + 动词 + kembali + 宾语 + 地点 + yang 从句。yang telah disediakan 是被动式从句：已被提供的。kembali 这里是“再次”。"}}, {"sp": "", "role": "r", "id": "Pengalaman naik KRL cukup mengasyikkan.", "zh": "坐 KRL 的经历挺有意思的。", "a": "2c05a1adb0f4", "za": "ef672eb92ddb", "an": {"p": [["Pengalaman", "经历"], ["naik KRL", "乘坐 KRL"], ["cukup", "相当"], ["mengasyikkan", "令人着迷"]], "b": "pengalaman = peN- + alam + -an；mengasyikkan = meN- + asyik + -kan", "g": "结构：主语（Pengalaman + 动词短语）+ cukup + 形容词。mengasyikkan = 让人入迷。"}}, {"sp": "", "role": "r", "id": "Penumpang memang harus bersabar ketika berada dalam kereta.", "zh": "乘客在车上确实要有耐心。", "a": "02195c06d099", "za": "041157621893", "an": {"p": [["Penumpang", "乘客"], ["memang", "的确"], ["harus", "必须"], ["bersabar", "忍耐"], ["ketika", "当……时"], ["berada", "处在"], ["dalam kereta", "火车里"]], "b": "penumpang = pe- + tumpang；bersabar = ber- + sabar；berada = ber- + ada", "g": "结构：主语 + memang harus + 动词 + ketika + 从句。memang = 的确，肯定前述事实。"}}, {"sp": "", "role": "r", "id": "Namun, tempat tujuan bisa dicapai tepat waktu.", "zh": "不过，能准时到达目的地。", "a": "d2e1d40e98e4", "za": "58a2c9744d44", "an": {"p": [["Namun", "然而"], ["tempat tujuan", "目的地"], ["bisa", "能"], ["dicapai", "被到达"], ["tepat waktu", "准时"]], "b": "dicapai = di- + capai", "g": "结构：被动句：转折词 + 主语 + bisa + di-动词 + 状语。tempat tujuan = 去往的地方，目的地。"}}], "zh": "上周我第一次试着坐通勤列车，从茂物去雅加达，遇到了很多新鲜事。首先我在售票窗口买票，要说出想去的车站，票价挺便宜，只要一万盾。然后我在闸机刷票，走到站台等车。车一到我就上去了，车厢里相当挤。列车到了雅加达，我下车走出车站，出站时还要在闸机再刷一次票。坐通勤列车的经历挺有意思，在车上确实要有耐心，不过能准时到达目的地。", "note": "", "qa": [{"q": "Kapan penulis mencoba naik KRL?", "a": "Minggu lalu.", "qa": "07ad3a9d4dd1", "aa": "a56fe91cc4e4", "qz": "作者什么时候试着坐 KRL？", "az": "上周。"}, {"q": "Apa tujuan teks tersebut?", "a": "Menceritakan pengalaman naik KRL.", "qa": "77d2a2be0043", "aa": "1654083b03c4", "qz": "这篇文章的目的是什么？", "az": "讲述坐 KRL 的经历。"}, {"q": "Seperti apa suasana di dalam kereta?", "a": "Cukup sesak.", "qa": "ba6bae8d531d", "aa": "f0c6a579cc90", "qz": "车厢里是什么情况？", "az": "挺挤的。"}, {"q": "Apa yang harus dilakukan agar penumpang bisa keluar dari stasiun?", "a": "Menempelkan kembali tiket di gerbang.", "qa": "7954d599e3b5", "aa": "3ac6aa925570", "qz": "乘客要怎么做才能出站？", "az": "在闸机上再刷一次票。"}, {"q": "Apa yang dirasakan penulis setelah naik KRL?", "a": "Cukup mengasyikkan.", "qa": "09dd77cabe37", "aa": "3b57cc7df5fe", "qz": "作者坐完 KRL 后感觉怎么样？", "az": "挺有意思的。"}], "u": 8}, {"id": "t93", "kind": "text", "book": "BIPA 2", "title": "四王群岛的假期（课文 9）", "lines": [{"sp": "", "role": "r", "id": "Tahun lalu, saya dan keluarga pergi ke Raja Ampat.", "zh": "去年，我和家人去了四王群岛。", "a": "7595eea47caa", "za": "5d26d6546a20", "an": {"p": [["Tahun lalu", "去年"], ["saya dan keluarga", "我和家人"], ["pergi", "去"], ["ke Raja Ampat", "到拉贾安帕"]], "b": "", "g": "结构：时间 + 主语 + pergi ke + 地点。Raja Ampat = 西巴布亚的潜水胜地，意为“四王”。"}}, {"sp": "", "role": "r", "id": "Kami pergi ke sana dengan pesawat.", "zh": "我们坐飞机去的。", "a": "a4353ee8b006", "za": "9f7c3934ec67", "an": {"p": [["Kami", "我们"], ["pergi", "去"], ["ke sana", "到那里"], ["dengan pesawat", "乘飞机"]], "b": "", "g": "结构：主语 + pergi + 地点 + dengan + 交通工具。dengan + 交通工具 = 乘……。"}}, {"sp": "", "role": "r", "id": "Sesampainya di sana kami langsung masuk ke hotel.", "zh": "到了那里，我们直接入住酒店。", "a": "1a2a2e55fdd6", "za": "7ec83d4478ec", "an": {"p": [["Sesampainya", "一到达"], ["di sana", "在那里"], ["kami", "我们"], ["langsung", "直接"], ["masuk ke", "进入"], ["hotel", "酒店"]], "b": "sesampainya = se- + sampai + -nya", "g": "结构：Sesampainya di + 地点, 主语 + langsung + 动词。sesampainya = 一到……就，se-……-nya 表示动作刚刚完成。"}}, {"sp": "", "role": "r", "id": "Setelah menyimpan barang-barang, kami memulai beragam aktivitas.", "zh": "放好行李后，我们开始了各种活动。", "a": "553f5e385821", "za": "718f3c89f60f", "an": {"p": [["Setelah", "之后"], ["menyimpan", "存放"], ["barang-barang", "行李物品"], ["kami", "我们"], ["memulai", "开始"], ["beragam", "各种"], ["aktivitas", "活动"]], "b": "menyimpan = meN- + simpan；memulai = meN- + mulai；beragam = ber- + ragam", "g": "结构：Setelah + 动词短语, 主语 + 动词 + 宾语。beragam + 名词 = 各种各样的。"}}, {"sp": "", "role": "r", "id": "Pada hari pertama, kami bermain di pantai.", "zh": "第一天，我们在海滩玩。", "a": "3389eff94700", "za": "22be2773b8ef", "an": {"p": [["Pada hari pertama", "在第一天"], ["kami", "我们"], ["bermain", "玩"], ["di pantai", "在海滩"]], "b": "bermain = ber- + main", "g": "结构：时间 + 主语 + 动词 + 地点。hari pertama = 第一天。"}}, {"sp": "", "role": "r", "id": "Pantai di Raja Ampat sangat indah.", "zh": "四王群岛的海滩非常美。", "a": "4808128823f7", "za": "f02be5c32986", "an": {"p": [["Pantai", "海滩"], ["di Raja Ampat", "在拉贾安帕"], ["sangat", "很"], ["indah", "美丽"]], "b": "", "g": "结构：主语（名词 + 地点）+ sangat + 形容词。"}}, {"sp": "", "role": "r", "id": "Lautnya jernih dan bersih.", "zh": "海水清澈干净。", "a": "476247ffd179", "za": "09be0d75014a", "an": {"p": [["Lautnya", "那里的海水"], ["jernih", "清澈"], ["dan", "和"], ["bersih", "干净"]], "b": "lautnya = laut + -nya", "g": "结构：主语 + 形容词 + dan + 形容词。-nya 指前面的 Raja Ampat。"}}, {"sp": "", "role": "r", "id": "Kami juga tidak lupa untuk snorkeling.", "zh": "我们当然也去浮潜了。", "a": "eb281418ab14", "za": "dd020dd9d6b5", "an": {"p": [["Kami", "我们"], ["juga", "也"], ["tidak lupa", "没忘记"], ["untuk", "去"], ["snorkeling", "浮潜"]], "b": "", "g": "结构：主语 + juga tidak lupa + untuk + 动词。tidak lupa untuk…… = 当然要做……。"}}, {"sp": "", "role": "r", "id": "Saya melihat banyak ikan yang berwarna-warni.", "zh": "我看到很多五颜六色的鱼。", "a": "5ffa3d840beb", "za": "5831e3057f5a", "an": {"p": [["Saya", "我"], ["melihat", "看见"], ["banyak ikan", "很多鱼"], ["yang berwarna-warni", "五彩缤纷的"]], "b": "melihat = meN- + lihat；berwarna-warni = ber- + warna 重叠", "g": "结构：主语 + 动词 + 宾语 + yang 从句。yang 从句修饰 ikan。"}}, {"sp": "", "role": "r", "id": "Setelah itu kami mengunjungi pantai yang berpasir putih.", "zh": "之后我们去了白沙滩。", "a": "9b1e97b4b79d", "za": "94db8b715d72", "an": {"p": [["Setelah itu", "之后"], ["kami", "我们"], ["mengunjungi", "拜访"], ["pantai", "海滩"], ["yang berpasir putih", "沙子是白色的"]], "b": "mengunjungi = meN- + kunjung + -i；berpasir = ber- + pasir", "g": "结构：连接词 + 主语 + 动词 + 宾语 + yang 从句。berpasir putih = 有白沙的。"}}, {"sp": "", "role": "r", "id": "Saya dan keluarga tidak lupa untuk berfoto bersama.", "zh": "我和家人还一起拍了合照。", "a": "13ef814812b2", "za": "299b3a3ac74a", "an": {"p": [["Saya dan keluarga", "我和家人"], ["tidak lupa", "没忘记"], ["untuk", "去"], ["berfoto", "拍照"], ["bersama", "一起"]], "b": "berfoto = ber- + foto；bersama = ber- + sama", "g": "结构：主语 + tidak lupa untuk + 动词 + bersama。bersama = 一起。"}}, {"sp": "", "role": "r", "id": "Pada hari kedua kami pergi ke Air Terjun Batanta.", "zh": "第二天我们去了 Batanta 瀑布。", "a": "903a78d7dbc9", "za": "b4307aa7cd3f", "an": {"p": [["Pada hari kedua", "在第二天"], ["kami", "我们"], ["pergi ke", "去"], ["Air Terjun", "瀑布"], ["Batanta", "巴坦塔岛"]], "b": "kedua = ke- + dua；air terjun = 水 + 落下", "g": "结构：时间 + 主语 + pergi ke + 地点。air terjun = 瀑布。"}}, {"sp": "", "role": "r", "id": "Airnya bersih dan jernih seperti di pantai.", "zh": "瀑布的水像海水一样干净清澈。", "a": "d645214159f9", "za": "b87c377d293c", "an": {"p": [["Airnya", "那里的水"], ["bersih", "干净"], ["dan", "和"], ["jernih", "清澈"], ["seperti", "像"], ["di pantai", "在海滩"]], "b": "airnya = air + -nya", "g": "结构：主语 + 形容词 + dan + 形容词 + seperti + 比较对象。"}}, {"sp": "", "role": "r", "id": "Pada hari ketiga kami pulang ke rumah.", "zh": "第三天我们回家了。", "a": "cb9c74d6fe9a", "za": "8652ec515f7c", "an": {"p": [["Pada hari ketiga", "在第三天"], ["kami", "我们"], ["pulang ke rumah", "回家"]], "b": "ketiga = ke- + tiga", "g": "结构：时间 + 主语 + 动词 + 地点。"}}, {"sp": "", "role": "r", "id": "Liburan kami terasa amat singkat.", "zh": "我们的假期感觉太短了。", "a": "cbb8df51a94d", "za": "b78cb7d605a1", "an": {"p": [["Liburan", "假期"], ["kami", "我们的"], ["terasa", "感觉"], ["amat", "非常"], ["singkat", "短暂"]], "b": "liburan = libur + -an；terasa = ter- + rasa", "g": "结构：主语 + terasa + amat + 形容词。terasa = 感觉起来。"}}, {"sp": "", "role": "r", "id": "Akan tetapi, saya dan keluarga merasa sangat bahagia.", "zh": "不过，我和家人都非常开心。", "a": "6a85134686da", "za": "97e485216158", "an": {"p": [["Akan tetapi", "但是"], ["saya dan keluarga", "我和家人"], ["merasa", "觉得"], ["sangat", "很"], ["bahagia", "幸福"]], "b": "merasa = meN- + rasa", "g": "结构：转折连接词 + 主语 + merasa + 形容词。akan tetapi = 但是（书面，比 tetapi 更正式）。"}}, {"sp": "", "role": "r", "id": "Saya ingin kembali ke sana pada lain waktu.", "zh": "我想以后再去那里。", "a": "a26d01ab5b46", "za": "6c3d4407295b", "an": {"p": [["Saya", "我"], ["ingin", "想"], ["kembali ke sana", "回到那里"], ["pada lain waktu", "在其他时候"]], "b": "", "g": "结构：主语 + ingin + 动词 + 地点 + 时间。pada lain waktu = 改日、以后找机会。"}}], "zh": "去年我和家人去了四王群岛，是坐飞机去的。一到那里我们就直接进了酒店，放好行李后开始了各种活动。第一天我们在海滩玩，四王群岛的海滩非常美，海水清澈干净。我们还去浮潜，我看到很多五颜六色的鱼。之后我们去了白沙滩，全家一起拍照。第二天我们去了巴坦塔瀑布，那里的水和海水一样干净清澈。第三天我们回家了。假期感觉太短了，不过我和家人都非常开心，我希望以后还能再去。", "note": "", "qa": [{"q": "Ke mana penulis berlibur?", "a": "Ke Raja Ampat.", "qa": "2c5288d98c52", "aa": "8c4f10f950ac", "qz": "作者去哪里度假？", "az": "去四王群岛。"}, {"q": "Transportasi apa yang digunakan penulis dan keluarganya?", "a": "Pesawat.", "qa": "2404d58d85f7", "aa": "31550135a5de", "qz": "作者和家人坐什么交通工具？", "az": "飞机。"}, {"q": "Berapa lama mereka berlibur di Raja Ampat?", "a": "Tiga hari.", "qa": "01316f377dc4", "aa": "c02b7095ddb5", "qz": "他们在四王群岛玩了多久？", "az": "三天。"}, {"q": "Apa kesamaan antara pantai dan air terjun di Raja Ampat?", "a": "Airnya sama-sama bersih dan jernih.", "qa": "6c9246c676bb", "aa": "be02c6e393bb", "qz": "四王群岛的海滩和瀑布有什么共同点？", "az": "水都很干净清澈。"}, {"q": "Apa yang dirasakan penulis setelah berlibur?", "a": "Sangat bahagia.", "qa": "8164f548533c", "aa": "8de1ee33b5f1", "qz": "作者度假后感觉怎么样？", "az": "非常开心。"}], "u": 9}, {"id": "t94", "kind": "text", "book": "BIPA 2", "title": "得了登革热（课文 10）", "lines": [{"sp": "", "role": "r", "id": "Pada suatu hari saya tiba-tiba merasa sangat mual.", "zh": "有一天，我突然觉得非常恶心。", "a": "cfb5b3972022", "za": "ef66a7564faf", "an": {"p": [["Pada suatu hari", "有一天"], ["saya", "我"], ["tiba-tiba", "突然"], ["merasa", "觉得"], ["sangat", "很"], ["mual", "恶心"]], "b": "", "g": "结构：时间 + 主语 + tiba-tiba + merasa + 形容词。Pada suatu hari 是讲故事的开场。"}}, {"sp": "", "role": "r", "id": "Badan saya terasa demam.", "zh": "我身体发烧。", "a": "55c27dbf15d3", "za": "d1c1bc12e60f", "an": {"p": [["Badan saya", "我的身体"], ["terasa", "感觉"], ["demam", "发烧"]], "b": "", "g": "结构：主语 + terasa + 形容词。terasa 表示身体的感受。"}}, {"sp": "", "role": "r", "id": "Otot saya sangat sakit.", "zh": "我的肌肉很疼。", "a": "4b53563ed59a", "za": "bd1e7fd16b28", "an": {"p": [["Otot saya", "我的肌肉"], ["sangat", "很"], ["sakit", "痛"]], "b": "", "g": "结构：主语 + sangat + 形容词。sakit = 病、痛。"}}, {"sp": "", "role": "r", "id": "Muka saya menjadi sangat pucat.", "zh": "我的脸变得非常苍白。", "a": "32f4539448b2", "za": "a494239b58ac", "an": {"p": [["Muka saya", "我的脸"], ["menjadi", "变得"], ["sangat", "很"], ["pucat", "苍白"]], "b": "menjadi = meN- + jadi", "g": "结构：主语 + menjadi + 形容词。menjadi + 形容词 = 变得……。"}}, {"sp": "", "role": "r", "id": "Wali kelas mengantar saya ke rumah sakit.", "zh": "班主任送我去了医院。", "a": "04ecc029e6dd", "za": "c06bd9672bad", "an": {"p": [["Wali kelas", "班主任"], ["mengantar", "送"], ["saya", "我"], ["ke rumah sakit", "去医院"]], "b": "mengantar = meN- + antar", "g": "结构：主语 + 动词 + 宾语 + ke + 地点。rumah sakit = 病人的房子 = 医院。"}}, {"sp": "", "role": "r", "id": "Setelah diperiksa, saya mengalami gejala demam berdarah.", "zh": "检查后，发现我有登革热的症状。", "a": "09f89520f6ac", "za": "9a8e2c07390c", "an": {"p": [["Setelah", "之后"], ["diperiksa", "被检查"], ["saya", "我"], ["mengalami", "经历"], ["gejala", "症状"], ["demam berdarah", "登革热"]], "b": "diperiksa = di- + periksa；mengalami = meN- + alami", "g": "结构：Setelah + 被动短语, 主语 + 动词 + 宾语。diperiksa 省略施动者（医生）。demam berdarah = 发烧 + 出血 = 登革热。"}}, {"sp": "", "role": "r", "id": "Penyakit ini disebabkan virus yang dibawa oleh nyamuk Aedes aegypti.", "zh": "这种病是由埃及伊蚊携带的病毒引起的。", "a": "4aca6bf0e80a", "za": "335a39811a7f", "an": {"p": [["Penyakit ini", "这种病"], ["disebabkan", "由……引起"], ["virus", "病毒"], ["yang dibawa", "被带来的"], ["oleh", "由"], ["nyamuk", "蚊子"], ["Aedes aegypti", "埃及伊蚊"]], "b": "penyakit = pe- + sakit + -an；disebabkan = di- + sebab + -kan", "g": "结构：被动句：主语 + disebabkan + 原因（virus）+ yang 被动从句（dibawa oleh 蚊子）。oleh 引出被动句的施动者。"}}, {"sp": "", "role": "r", "id": "Saya langsung dimasukkan ke ruang rawat inap.", "zh": "我马上被送进了住院病房。", "a": "6feba15cd5e8", "za": "92144430bd11", "an": {"p": [["Saya", "我"], ["langsung", "马上"], ["dimasukkan", "被送进"], ["ke", "到"], ["ruang rawat inap", "住院病房"]], "b": "dimasukkan = di- + masuk + -kan", "g": "结构：被动句：主语 + langsung + di-动词 + 地点。rawat inap = 住院（rawat 照护 + inap 过夜）。"}}, {"sp": "", "role": "r", "id": "Perawat memasang infus di lengan saya.", "zh": "护士在我胳膊上打了点滴。", "a": "929cfb971557", "za": "a3e9989275b2", "an": {"p": [["Perawat", "护士"], ["memasang", "安装、扎上"], ["infus", "输液"], ["di lengan saya", "在我的手臂上"]], "b": "perawat = pe- + rawat；memasang = meN- + pasang", "g": "结构：主语 + 动词 + 宾语 + 地点。pasang 装上，memasang infus = 扎输液。"}}, {"sp": "", "role": "r", "id": "Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat.", "zh": "住院期间我不能吃医院外面的食物。", "a": "7bf8776737ce", "za": "1cd1c8c82888", "an": {"p": [["Saya", "我"], ["tidak boleh", "不被允许"], ["memakan", "吃"], ["makanan", "食物"], ["dari luar", "从外面"], ["rumah sakit", "医院"], ["selama", "在……期间"], ["dirawat", "被照护（住院）"]], "b": "memakan = meN- + makan；dirawat = di- + rawat", "g": "结构：主语 + tidak
