 boleh + 动词 + 宾语 + selama + 被动动词。boleh = 允许，tidak boleh = 不许。selama dirawat = 住院期间。"}}, {"sp": "", "role": "r", "id": "Saya pun dianjurkan untuk sering meminum air.", "zh": "医生还建议我多喝水。", "a": "0165139fc14a", "za": "19d683bb178a", "an": {"p": [["Saya", "我"], ["pun", "也"], ["dianjurkan", "被建议"], ["untuk", "去"], ["sering", "经常"], ["meminum", "喝"], ["air", "水"]], "b": "dianjurkan = di- + anjur + -kan", "g": "结构：被动句：主语 + pun + di-动词 + untuk + 动作。dianjurkan = 被建议，untuk 引出建议内容。"}}, {"sp": "", "role": "r", "id": "Selain itu, saya diminta untuk memakan buah-buahan yang mengandung vitamin C.", "zh": "另外，医生让我多吃含维生素C的水果。", "a": "ffdea84b4de3", "za": "51206afe4b74", "an": {"p": [["Selain itu", "除此之外"], ["saya", "我"], ["diminta", "被要求"], ["untuk", "去"], ["memakan", "吃"], ["buah-buahan", "各种水果"], ["yang mengandung", "含有……的"], ["vitamin C", "维生素C"]], "b": "diminta = di- + minta；mengandung = meN- + kandung", "g": "结构：连接语 + 被动：主语 + di-动词 + untuk + 动词 + 宾语 + yang 从句。buah-buahan = 各种水果（重叠 + -an）。"}}, {"sp": "", "role": "r", "id": "Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit.", "zh": "住院期间我只能躺在床上。", "a": "3161d5d43020", "za": "cd25eb24dddc", "an": {"p": [["Saya", "我"], ["hanya bisa", "只能"], ["berbaring", "躺"], ["di tempat tidur", "在床上"], ["selama", "在……期间"], ["dirawat", "住院"], ["di rumah sakit", "在医院"]], "b": "berbaring = ber- + baring", "g": "结构：主语 + hanya bisa + 动词 + 地点 + selama + 被动短语。"}}, {"sp": "", "role": "r", "id": "Akhirnya, saya boleh pulang setelah dirawat selama 5 hari.", "zh": "住了5天院以后，我终于可以回家了。", "a": "26a3d3e3d31e", "za": "2d70a82caa3b", "an": {"p": [["Akhirnya", "最后"], ["saya", "我"], ["boleh", "被允许"], ["pulang", "回家"], ["setelah", "在……之后"], ["dirawat", "住院"], ["selama 5 hari", "持续五天"]], "b": "akhirnya = akhir + -nya", "g": "结构：副词 + 主语 + boleh + 动词 + setelah + 被动短语 + 时长。boleh = 获准。"}}, {"sp": "", "role": "r", "id": "Mulai saat itu, saya menjaga kebersihan rumah saya.", "zh": "从那时起，我注意保持家里的卫生。", "a": "90e719e24d7b", "za": "4aa12fb86bed", "an": {"p": [["Mulai saat itu", "从那时起"], ["saya", "我"], ["menjaga", "保持"], ["kebersihan", "清洁"], ["rumah saya", "我的家"]], "b": "menjaga = meN- + jaga；kebersihan = ke- + bersih + -an", "g": "结构：时间起点 + 主语 + 动词 + 宾语。mulai = 开始，mulai saat itu = 从那时起。"}}, {"sp": "", "role": "r", "id": "Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "zh": "我这样做是为了不再有蚊子。", "a": "1f4fb864e0e0", "za": "df4aa993ab82", "an": {"p": [["Hal itu", "这件事"], ["saya", "我"], ["lakukan", "做"], ["supaya", "为了"], ["tidak ada", "没有"], ["nyamuk", "蚊子"], ["lagi", "再"]], "b": "lakukan = laku + -kan", "g": "结构：宾语前置：Hal itu + saya + 动词原形 + supaya + 目的从句。宾语前置强调“这件事”。supaya = agar，为了、以便。"}}], "zh": "有一天我突然觉得非常恶心，身体发烧，肌肉很疼，脸色变得非常苍白。班主任送我去了医院。检查后发现我有登革热的症状，这种病是由埃及伊蚊携带的病毒引起的。我马上被送进住院病房，护士在我手臂上打了点滴。住院期间我不能吃医院外面的食物，医生建议我多喝水，还要多吃含维生素 C 的水果。住院时我只能躺在床上。住了五天后我终于可以回家了。从那以后我注意保持家里清洁，这样就不会再有蚊子了。", "note": "", "qa": [{"q": "Di mana penulis dirawat di rumah sakit?", "a": "Di ruang rawat inap.", "qa": "ac0e41b12ca7", "aa": "c6de1fb58929", "qz": "作者住在医院的哪里？", "az": "在住院病房。"}, {"q": "Apa gejala yang dialami oleh penulis?", "a": "Mual, demam, otot sakit, dan muka pucat.", "qa": "1fd5121ab97e", "aa": "6b53ddba8f97", "qz": "作者有哪些症状？", "az": "恶心、发烧、肌肉疼、脸色苍白。"}, {"q": "Nyamuk apa yang membawa virus demam berdarah?", "a": "Nyamuk Aedes aegypti.", "qa": "3c2ff2635a93", "aa": "e60b515fd080", "qz": "哪种蚊子携带登革热病毒？", "az": "埃及伊蚊。"}, {"q": "Apa yang dianjurkan kepada penulis agar cepat sembuh?", "a": "Sering minum air dan makan buah-buahan yang mengandung vitamin C.", "qa": "c6f3c9ca89cd", "aa": "6cb7e12d3ba9", "qz": "医生建议作者怎样才能快点好？", "az": "多喝水，多吃含维生素C的水果。"}, {"q": "Berapa lama penulis dirawat di rumah sakit?", "a": "Lima hari.", "qa": "a64ecf40368a", "aa": "3b6a2149a16c", "qz": "作者住了多久的院？", "az": "五天。"}, {"q": "Apa yang dilakukan penulis agar tidak sakit demam berdarah lagi?", "a": "Menjaga kebersihan rumah supaya tidak ada nyamuk.", "qa": "924b7cafa725", "aa": "985a712a419b", "qz": "作者做了什么来避免再得登革热？", "az": "保持家里干净，不让蚊子滋生。"}], "u": 10}, {"id": "t95", "kind": "text", "book": "BIPA 2", "title": "止泻药说明书", "lines": [{"sp": "", "role": "r", "id": "Obat Diare.", "zh": "止泻药。", "a": "07b647bd63d1", "za": "ba3365be5378", "an": {"p": [["Obat", "药"], ["Diare", "腹泻"]], "b": "", "g": "药品标签标题：名词短语。obat + 病 = 治……的药。"}}, {"sp": "", "role": "r", "id": "Khasiat: 1.", "zh": "功效：第一。", "a": "de1ce389f10d", "za": "76083800663c", "an": {"p": [["Khasiat", "功效"], ["1.", "第一条"]], "b": "khasiat 来自阿拉伯语", "g": "药品栏目：功效。数字 1. 读 satu，是第一点的序号。"}}, {"sp": "", "role": "r", "id": "Mengurangi frekuensi buang air besar.", "zh": "减少排便次数。", "a": "1151414bddd9", "za": "36ccb0ec4b84", "an": {"p": [["Mengurangi", "减少"], ["frekuensi", "频率"], ["buang air besar", "排便"]], "b": "mengurangi = meN- + kurang + -i", "g": "结构：动词 + 宾语。buang air besar（BAB）= 大便，字面“排大量的水”，是礼貌说法。"}}, {"sp": "", "role": "r", "id": "2.", "zh": "第二步。", "a": null, "an": {"p": [["2.", "第二步"]], "b": "", "g": "序号“2.”读作 dua（步骤 2），与前后句连读。"}}, {"sp": "", "role": "r", "id": "Menyerap racun penyebab diare.", "zh": "吸附引起腹泻的毒素。", "a": "3e22c5551836", "za": "bd0d0d276dd1", "an": {"p": [["Menyerap", "吸收"], ["racun", "毒素"], ["penyebab", "引起……的"], ["diare", "腹泻"]], "b": "menyerap = meN- + serap；penyebab = peN- + sebab", "g": "结构：动词 + 宾语 + 修饰语。penyebab diare = 腹泻的原因。药品功效的第二条，省略主语。"}}, {"sp": "", "role": "r", "id": "Komposisi: Tiap tablet (325 mg) mengandung activated charcoal (125 mg).", "zh": "成分：每片（325毫克）含活性炭（125毫克）。", "a": "2d76f80b4f28", "za": "3f63a9b0e2c2", "an": {"p": [["Komposisi", "成分"], ["Tiap tablet", "每片药"], ["325 mg", "325毫克"], ["mengandung", "含有"], ["activated charcoal", "活性炭"], ["125 mg", "125毫克"]], "b": "mengandung = meN- + kandung", "g": "药品栏目：成分。结构：Tiap + 名词 + mengandung + 成分。tiap = 每个。"}}, {"sp": "", "role": "r", "id": "Aturan pakai: 5—7 tablet per dosis.", "zh": "用法：每次5—7片。", "a": "29217e97f010", "za": "c19ff11e23bd", "an": {"p": [["Aturan pakai", "用法"], ["5—7 tablet", "五到七片"], ["per dosis", "每次剂量"]], "b": "aturan = atur + -an；pakai = 用", "g": "药品栏目：用法。破折号表示范围“5 到 7”。per = 每。"}}, {"sp": "", "role": "r", "id": "Maksimum 20 tablet/hari.", "zh": "每天最多20片。", "a": "9d86f67b8b66", "za": "f5573ba6864e", "an": {"p": [["Maksimum", "最多"], ["20 tablet", "二十片"], ["hari", "天"]], "b": "", "g": "药品标签：最大用量。斜线 / 读作 per：每天。"}}, {"sp": "", "role": "r", "id": "Produksi: P.T.", "zh": "生产厂家：", "a": "1ac4d49ab1a4", "za": "ac9f3c5ee250", "an": {"p": [["Produksi", "生产"], ["P.T.", "有限公司（Perseroan Terbatas）"]], "b": "produksi = 外来词", "g": "药品栏目：生产商。P.T. 读 pe té，是印尼公司名前缀，相当于“有限公司”。和下一句连读。"}}, {"sp": "", "role": "r", "id": "Eagle Indo Pharma.", "zh": "Eagle Indo Pharma 公司。", "a": "f0705cb2900c", "za": "7d9d9925cfa1", "an": {"p": [["Eagle", "老鹰"], ["Indo", "印度尼西亚"], ["Pharma", "制药"]], "b": "", "g": "接上一句：PT Eagle Indo Pharma，一家药厂的名字。"}}], "zh": "止泻药。功效：1. 减少排便次数；2. 吸附引起腹泻的毒素。成分：每片（325 毫克）含活性炭 125 毫克。用法：每次 5—7 片，每天最多 20 片。生产商：P.T. Eagle Indo Pharma。", "note": "药品说明常用词：khasiat 功效 · komposisi 成分 · aturan pakai 用法 · dosis 剂量 · maksimum 最多。", "qa": [], "u": 10}, {"id": "c96", "kind": "culture", "book": "BIPA 1", "title": "认识印度尼西亚", "lines": [{"sp": "", "role": "r", "id": "Indonesia adalah negara kepulauan yang besar di Asia Tenggara.", "zh": "印度尼西亚是东南亚的一个大型群岛国家。", "a": "b82c961cdb06", "za": "6821fe9b52f5", "an": {"p": [["Indonesia", "印度尼西亚"], ["adalah", "是"], ["negara", "国家"], ["kepulauan", "群岛"], ["yang besar", "大的"], ["di Asia Tenggara", "在东南亚"]], "b": "kepulauan = ke- + pulau 岛 + -an", "g": "结构：主语 + adalah + 名词短语（negara kepulauan）+ yang + 形容词 + 地点。negara kepulauan = 国家 + 群岛（群岛国家）。yang besar 修饰 negara kepulauan。Asia Tenggara = 亚洲 + 东南。"}}, {"sp": "", "role": "r", "id": "Indonesia memiliki banyak pulau dan penduduk yang berasal dari berbagai suku dan budaya.", "zh": "印度尼西亚有很多岛屿，居民来自不同的民族和文化。", "a": "aaeee105fa67", "za": "00fcae836dd4", "an": {"p": [["memiliki", "拥有"], ["banyak pulau", "很多岛"], ["dan", "和"], ["penduduk", "居民"], ["yang berasal dari", "来自……的"], ["berbagai suku dan budaya", "各个民族和文化"]], "b": "penduduk = duduk + pen-", "g": "结构：主语 + memiliki + 宾语 1（banyak pulau）+ dan + 宾语 2（penduduk + yang 从句）。yang berasal dari… 修饰 penduduk。berbagai + 名词 = 各种……。suku = 民族、部族。"}}, {"sp": "", "role": "r", "id": "Masyarakat Indonesia dikenal ramah dan terbuka.", "zh": "印度尼西亚人以友善、开放著称。", "a": "b9e9944113fe", "za": "c9e3f68bf5bb", "an": {"p": [["Masyarakat", "社会、民众"], ["dikenal", "被认为、以……著称"], ["ramah", "友好"], ["terbuka", "开放"]], "b": "dikenal = di- + kenal；terbuka = ter- + buka 开", "g": "结构：主语 + dikenal + 形容词。dikenal + 形容词 = 以……闻名（被人认识为……）。terbuka = 开放的。"}}, {"sp": "", "role": "r", "id": "Mengenal Indonesia akan membantu kita lebih mudah beradaptasi dalam kehidupan dan pekerjaan sehari-hari.", "zh": "了解印度尼西亚，能帮助我们更容易适应日常生活和工作。", "a": "6edf3df5ac32", "za": "9e43d04f9d8e", "an": {"p": [["Mengenal", "了解"], ["Indonesia", "印尼"], ["akan membantu", "将会帮助"], ["kita", "我们"], ["lebih mudah", "更容易"], ["beradaptasi", "适应"], ["dalam kehidupan dan pekerjaan sehari-hari", "在日常生活和工作中"]], "b": "adaptasi = 适应；sehari-hari = 每天的", "g": "结构：动词做主语（Mengenal Indonesia = 了解印尼）+ akan membantu + 人 + 动词短语。membantu + 人 + lebih mudah + 动词 = 帮助某人更容易……。sehari-hari = 日常的。kita 包括听话人。"}}, {"sp": "", "role": "r", "id": "Bahasa Indonesia adalah bahasa resmi di Indonesia.", "zh": "印尼语是印度尼西亚的官方语言。", "a": "e7a3ef1813bd", "za": "03e4ed3cacf3", "an": {"p": [["Bahasa Indonesia", "印尼语"], ["adalah", "是"], ["bahasa resmi", "官方语言"], ["di Indonesia", "在印尼"]], "b": "", "g": "结构：主语 + adalah + 名词短语。resmi = 正式、官方的。"}}, {"sp": "", "role": "r", "id": "Bahasa ini digunakan di tempat kerja, sekolah, dan dalam kehidupan sehari-hari.", "zh": "这种语言用于工作场所、学校和日常生活。", "a": "1c62a8ea6799", "za": "f59084549b84", "an": {"p": [["Bahasa ini", "这种语言"], ["digunakan", "被使用"], ["di tempat kerja", "在工作场所"], ["sekolah", "学校"], ["dalam kehidupan sehari-hari", "在日常生活中"]], "b": "digunakan = di- + guna + -kan", "g": "结构：主语 + di- 被动 + 并列地点。digunakan = 被使用（menggunakan 的被动）。并列地点时，后面的 di 可以省略：di tempat kerja, (di) sekolah。"}}, {"sp": "", "role": "r", "id": "Bahasa Indonesia tidak memiliki nada dan tata bahasanya relatif sederhana.", "zh": "印尼语没有声调，语法也比较简单。", "a": "0e2590532abf", "za": "dcc63f0f3922", "an": {"p": [["Bahasa Indonesia", "印尼语"], ["tidak memiliki", "没有"], ["nada", "声调"], ["dan", "而且"], ["tata bahasanya", "它的语法"], ["relatif", "相对"], ["sederhana", "简单"]], "b": "tata bahasa = 语法", "g": "结构：两个并列小句：A tidak memiliki B，dan C relatif D。tata bahasanya：-nya = 它的（印尼语的）。relatif + 形容词 = 相对……。"}}, {"sp": "", "role": "r", "id": "Oleh karena itu, bahasa Indonesia mudah dipelajari oleh orang asing.", "zh": "因此，外国人学印尼语很容易。", "a": "c6cbc5a6f5c8", "za": "11e62a3b78c9", "an": {"p": [["Oleh karena itu", "因此"], ["bahasa Indonesia", "印尼语"], ["mudah", "容易"], ["dipelajari", "被学习"], ["oleh orang asing", "被外国人"]], "b": "dipelajari = di- + pelajar + -i（belajar 的被动）", "g": "结构：Oleh karena itu（因此）+ 主语 + mudah + 被动动词 + oleh + 施事。mudah dipelajari = 容易被学（好学）。oleh + 人 = 由……（被动句里的动作者）。orang asing = 外国人。"}}], "zh": "印度尼西亚是东南亚的群岛大国，有众多岛屿，居民来自不同的民族和文化，当地人以友好、开放著称。了解印尼能帮助我们更快适应生活和工作。印尼语是印尼的官方语言，用于工作、学校和日常生活。印尼语没有声调，语法相对简单，所以外国人比较容易学。", "note": "", "qa": []}, {"id": "c97", "kind": "culture", "book": "BIPA 1", "title": "城市、饮食与景点", "lines": [{"sp": "", "role": "r", "id": "Kota-kota di Indonesia, seperti di negara lain, sebagian besar didominasi oleh bangunan modern, sementara di daerah pedesaan banyak terdapat bangunan dengan ciri khas etnis.", "zh": "和其他国家一样，印尼的城市大多是现代建筑，而农村地区有很多带民族特色的建筑。", "a": "8718c3337b4c", "za": "3f3999c721f3", "an": {"p": [["Kota-kota", "城市（复数）"], ["di Indonesia", "在印尼"], ["seperti di negara lain", "像在其他国家一样"], ["sebagian besar", "大部分"], ["didominasi oleh", "被……主导"], ["bangunan modern", "现代建筑"], ["sementara", "而"], ["di daerah pedesaan", "在乡村地区"], ["banyak terdapat", "有很多"], ["bangunan", "建筑"], ["dengan ciri khas etnis", "带有民族特色"]], "b": "didominasi = di- + dominasi（主导）；pedesaan = pe-…-an + desa 村；ciri khas = 特征 + 特有", "g": "结构：主句 1（Kota-kota … didominasi oleh …）+ sementara（而、与此同时）+ 主句 2（di daerah pedesaan banyak terdapat …）。逗号夹着的 seperti di negara lain 是插入语。terdapat = 存在有（地点 + terdapat + 事物）。dengan ciri khas etnis = 带有民族特色的。"}}, {"sp": "", "role": "r", "id": "Karena cuaca yang panas, masyarakat biasanya mandi setidaknya dua hingga tiga kali sehari.", "zh": "因为天气炎热，人们通常每天至少洗两到三次澡。", "a": "f30d804fe165", "za": "4ba985f21cda", "an": {"p": [["Karena", "因为"], ["cuaca yang panas", "炎热的天气"], ["masyarakat", "人们"], ["biasanya", "通常"], ["mandi", "洗澡"], ["setidaknya", "至少"], ["dua hingga tiga kali", "两到三次"], ["sehari", "一天"]], "b": "setidaknya = se- + tidak + -nya；hingga = 直到；sehari = se- + hari", "g": "结构：Karena + 名词短语（cuaca yang panas），主句。次数：数字 + kali = 几次；dua hingga tiga kali = 二到三次；sehari = 每天（一天内）。setidaknya = 至少。"}}, {"sp": "", "role": "r", "id": "Penduduk lokal Indonesia terbiasa makan dengan tangan dan mahir dalam memasak.", "zh": "印尼本地人习惯用手吃饭，而且很擅长做饭。", "a": "0e8447ee01b2", "za": "9324d5d887a2", "an": {"p": [["Penduduk lokal", "当地居民"], ["Indonesia", "印尼"], ["terbiasa", "习惯于"], ["makan dengan tangan", "用手吃饭"], ["mahir", "熟练"], ["dalam memasak", "在烹饪方面"]], "b": "terbiasa = ter- + biasa", "g": "terbiasa + 动词 = 习惯于做……。dengan tangan = 用手（dengan 表示工具）。mahir dalam + 动词 = 擅长……。"}}, {"sp": "", "role": "r", "id": "Setiap daerah memiliki beragam jajanan khas, seperti pisang goreng, bola ketan, kue ketan, dan bakpia.", "zh": "每个地区都有各种特色小吃，比如炸香蕉、糯米球、糯米糕和馅饼。", "a": "400fdcd69726", "za": "b79ed94f4b0c", "an": {"p": [["Setiap daerah", "每个地区"], ["memiliki", "拥有"], ["beragam", "各种各样的"], ["jajanan khas", "特色小吃"], ["seperti", "例如"], ["pisang goreng", "炸香蕉"], ["bola ketan", "糯米球"], ["kue ketan", "糯米糕"], ["bakpia", "（一种）小饼"]], "b": "beragam = ber- + ragam；jajanan = jajan 零食 + -an", "g": "结构：主语 + memiliki + 宾语，seperti + 列举。beragam + 名词 = 各种的……。khas = 特有的。seperti 后面列举例子。"}}, {"sp": "", "role": "r", "id": "Masyarakat pada umumnya menyukai makanan pedas; cabai dan sambal merupakan bumbu yang umum dijumpai di meja makan.", "zh": "人们普遍喜欢吃辣，辣椒和参巴酱是餐桌上常见的调料。", "a": "02bf9e7730cd", "za": "12e52fac3e08", "an": {"p": [["Masyarakat", "人们"], ["pada umumnya", "一般来说"], ["menyukai", "喜欢"], ["makanan pedas", "辣的食物"], ["cabai", "辣椒"], ["sambal", "参巴酱"], ["merupakan", "是"], ["bumbu", "调味料"], ["yang umum dijumpai", "常见的"], ["di meja makan", "在餐桌上"]], "b": "menyukai = suka + meN-…-i；dijumpai = di- + jumpa + -i", "g": "结构：两个分句用分号隔开。merupakan = adalah（是，书面）。yang umum dijumpai = 常被见到的（yang + 被动），修饰 bumbu。pada umumnya = 一般来说。"}}], "zh": "印尼的城市和其他国家一样以现代建筑为主，农村则有许多带民族特色的建筑。因为天气炎热，人们每天通常洗两到三次澡。印尼人习惯用手吃饭，也很会做饭，各地都有丰富的特色小吃，比如炸香蕉、糯米团、糯米糕和馅饼。人们普遍爱吃辣，辣椒和辣椒酱是餐桌上常见的调料。著名景点：四王群岛（巴布亚）、托拉查的 Kete Kesu、粉红沙滩和科莫多岛（东努沙登加拉）、多巴湖（北苏门答腊）、婆罗浮屠（中爪哇）、布罗莫火山（东爪哇）、巴厘岛、布纳肯（北苏拉威西）、山口洋（西加里曼丹）。", "note": "", "qa": []}, {"id": "c98", "kind": "culture", "book": "BIPA 1", "title": "印尼的宗教问候语", "lines": [{"sp": "", "role": "r", "id": "Ada beberapa ujaran salam keagamaan saat berpidato atau berbicara di forum umum.", "zh": "在演讲或在公开场合讲话时，有几种宗教问候语。", "a": "85ac53319c2a", "za": "2abfa54d6d67", "an": {"p": [["Ada", "有"], ["beberapa", "几种"], ["ujaran salam", "问候语"], ["keagamaan", "宗教的"], ["saat", "当……时"], ["berpidato", "演讲"], ["atau", "或"], ["berbicara", "讲话"], ["di forum umum", "在公开场合"]], "b": "keagamaan = ke- + agama 宗教 + -an；pidato = 演讲", "g": "结构：Ada + 名词短语 + saat + 动词（并列）。saat + 动词 = 在……的时候。ujaran salam = 话语 + 问候。forum umum = 公共场合。"}}, {"sp": "", "role": "r", "id": "Ujaran salam itu adalah assalamualaikum, salam sejahtera, om swastiastu, dan namo buddhaya.", "zh": "这些问候语是 assalamualaikum、salam sejahtera、om swastiastu 和 namo buddhaya。", "a": "449a284336ae", "za": "6f63a34396e9", "an": {"p": [["Ujaran salam itu", "那些问候语"], ["adalah", "是"], ["assalamualaikum", "伊斯兰教问候语"], ["salam sejahtera", "基督教问候语（愿平安）"], ["om swastiastu", "印度教问候语"], ["namo buddhaya", "佛教问候语"]], "b": "", "g": "结构：主语 + adalah + 并列项（A, B, C, dan D）。四种问候语分别对应伊斯兰教、基督教、印度教、佛教。"}}, {"sp": "", "role": "r", "id": "Ujaran salam itu diucapkan untuk menyapa orang Indonesia dari berbagai latar belakang agama.", "zh": "说这些问候语是为了问候不同宗教背景的印尼人。", "a": "5af6e3af3525", "za": "ff5fda8523ee", "an": {"p": [["Ujaran salam itu", "那些问候语"], ["diucapkan", "被说出"], ["untuk menyapa", "为了问候"], ["orang Indonesia", "印尼人"], ["dari berbagai latar belakang agama", "来自各种宗教背景"]], "b": "diucapkan = di- + ucap + -kan；latar belakang = 背景", "g": "结构：主语 + 被动 + untuk + 动词 + 宾语 + dari + 背景。untuk menyapa = 为了向……打招呼。dari berbagai latar belakang agama = 来自不同宗教背景的（修饰 orang Indonesia）。"}}], "zh": "在演讲或公开场合发言时，有几种宗教问候语：assalamualaikum（伊斯兰）、salam sejahtera（基督教等）、om swastiastu（巴厘印度教）和 namo buddhaya（佛教）。说这些问候语是为了向不同宗教背景的印尼人问好。", "note": "", "qa": [], "u": 1}, {"id": "c99", "kind": "culture", "book": "BIPA 1", "title": "印尼人的相识礼节", "lines": [{"sp": "", "role": "r", "id": "Orang Indonesia biasanya berkenalan dengan berjabat tangan.", "zh": "印尼人通常握手认识对方。", "a": "3578de46fdd5", "za": "15b614ef36ad", "an": {"p": [["Orang Indonesia", "印尼人"], ["biasanya", "通常"], ["berkenalan", "相识"], ["dengan berjabat tangan", "通过握手"]], "b": "berjabat tangan = 握手", "g": "dengan + 动词 = 用……的方式、通过……。berjabat tangan = 握手（ber- + jabat tangan）。"}}, {"sp": "", "role": "r", "id": "Umumnya jabat tangan dilakukan dengan tangan kanan.", "zh": "一般用右手握手。", "a": "1d6bf9338f48", "za": "145c57ad530e", "an": {"p": [["Umumnya", "一般"], ["jabat tangan", "握手"], ["dilakukan", "被进行"], ["dengan tangan kanan", "用右手"]], "b": "dilakukan = di- + laku + -kan", "g": "结构：主语（jabat tangan）+ di- 被动（dilakukan）+ dengan + 工具。dilakukan = 被做、被进行。tangan kanan = 右手，tangan kiri = 左手。"}}, {"sp": "", "role": "r", "id": "Ada beberapa orang berjabat tangan dengan dua tangan.", "zh": "有些人用两只手握手。", "a": "1b8123353fe2", "za": "e1ec292888fe", "an": {"p": [["Ada beberapa orang", "有些人"], ["berjabat tangan", "握手"], ["dengan dua tangan", "用双手"]], "b": "", "g": "Ada + beberapa + 名词 + 动词 = 有些……做……。dengan dua tangan = 用两只手。"}}, {"sp": "", "role": "r", "id": "Perbedaan jabat tangan itu ada pada ujung jari yang bersentuhan dan tidak bersentuhan.", "zh": "握手的区别在于指尖是否相碰。", "a": "a989227c48cb", "za": "d24dc5466d26", "an": {"p": [["Perbedaan", "区别"], ["jabat tangan itu", "那种握手"], ["ada pada", "在于"], ["ujung jari", "指尖"], ["yang bersentuhan", "相碰的"], ["dan", "和"], ["tidak bersentuhan", "不相碰"]], "b": "perbedaan = per- + beda + -an；bersentuhan = ber- + sentuh + -an", "g": "结构：Perbedaan … ada pada + 名词 = 区别在于……。yang bersentuhan dan tidak bersentuhan = 接触的和不接触的（yang + 动词，并列两种情况）。ujung jari = 指尖。"}}, {"sp": "", "role": "r", "id": "Ada juga budaya cium tangan (salim).", "zh": "还有吻手礼（salim）的文化。", "a": "bff238196822", "za": "76b855f547e8", "an": {"p": [["Ada juga", "还有"], ["budaya", "文化"], ["cium tangan", "吻手礼"], ["salim", "吻手礼（印尼语常说法）"]], "b": "", "g": "Ada juga + 名词 = 还有……。cium tangan = 亲吻手（晚辈对长辈的礼节）。括号里是同义词。"}}, {"sp": "", "role": "r", "id": "Budaya cium tangan biasanya untuk menghormati orang yang lebih tua, misalnya murid kepada guru atau anak kepada orang tua.", "zh": "吻手礼通常是为了尊敬长辈，比如学生对老师、孩子对父母。", "a": "a964bc299b14", "za": "e28e297e2e94", "an": {"p": [["Budaya cium tangan", "吻手礼文化"], ["biasanya", "通常"], ["untuk menghormati", "为了尊敬"], ["orang yang lebih tua", "年长的人"], ["misalnya", "例如"], ["murid kepada guru", "学生对老师"], ["anak kepada orang tua", "孩子对父母"]], "b": "menghormati = hormat + meN-…-i", "g": "结构：主语 + untuk + 动词 + 宾语（orang yang lebih tua），misalnya + 举例。orang yang lebih tua = 比较年长的人（lebih tua = 更老）。misalnya A kepada B = 例如 A 对 B。orang tua 既是“年长的人”，也是“父母”。"}}], "zh": "印尼人认识时通常握手，一般用右手。也有人用双手握手，区别在于指尖是否相碰。还有一种吻手礼（salim），通常用来表示对长辈的尊敬，比如学生对老师、孩子对父母。", "note": "", "qa": [], "u": 2}, {"id": "c100", "kind": "culture", "book": "BIPA 1", "title": "礼貌的称呼", "lines": [{"sp": "", "role": "r", "id": "Orang Indonesia biasa memanggil orang yang lebih tua dengan bapak (Pak) dan ibu (Bu).", "zh": "印尼人通常称呼年长的人为 bapak（Pak）和 ibu（Bu）。", "a": "e6cd43e17829", "za": "e8afe6609489", "an": {"p": [["Orang Indonesia", "印尼人"], ["biasa", "习惯"], ["memanggil", "称呼"], ["orang yang lebih tua", "年长的人"], ["dengan bapak (Pak) dan ibu (Bu)", "用 bapak 和 ibu"]], "b": "memanggil = panggil + meN-", "g": "biasa + 动词 = 习惯于……（不加 -nya，和 biasanya 不同）。memanggil + 人 + dengan + 称呼 = 用某称呼叫某人。Pak = bapak 的缩写，Bu = ibu 的缩写。"}}, {"sp": "", "role": "r", "id": "Sapaan bapak untuk laki-laki dan sapaan ibu untuk perempuan.", "zh": "bapak 用来称呼男性，ibu 用来称呼女性。", "a": "6a706046e201", "za": "13630d90b9ed", "an": {"p": [["Sapaan bapak", "bapak 这个称呼"], ["untuk laki-laki", "用于男性"], ["dan", "而"], ["sapaan ibu", "ibu 这个称呼"], ["untuk perempuan", "用于女性"]], "b": "sapaan = sapa + -an", "g": "结构：A untuk B, dan C untuk D（省略动词）。untuk + 对象 = 用于……。sapaan = 称呼语，sapa 是“打招呼”。"}}, {"sp": "", "role": "r", "id": "Di Pulau Jawa, orang biasa menggunakan sapaan mas untuk laki-laki yang lebih tua dan mbak untuk perempuan yang lebih tua.", "zh": "在爪哇岛，人们常用 mas 称呼年长的男性，用 mbak 称呼年长的女性。", "a": "e75065da2a5e", "za": "49bc1c849bd9", "an": {"p": [["Di Pulau Jawa", "在爪哇岛"], ["orang", "人们"], ["biasa menggunakan", "习惯使用"], ["sapaan", "称呼"], ["mas", "（对年长男性的称呼）"], ["untuk laki-laki yang lebih tua", "用于较年长的男性"], ["mbak", "（对年长女性的称呼）"], ["untuk perempuan yang lebih tua", "用于较年长的女性"]], "b": "menggunakan = guna + meN-…-kan", "g": "结构：地点 + 主语 + biasa + menggunakan + sapaan + A + untuk + 对象 + dan + B + untuk + 对象。laki-laki yang lebih tua = 比较年长的男性。mas / mbak 是爪哇语称呼。"}}, {"sp": "", "role": "r", "id": "Berbeda daerah bisa berbeda sapaan.", "zh": "不同地区的称呼可能不同。", "a": "c51fae49e135", "za": "2a8660951c93", "an": {"p": [["Berbeda daerah", "地区不同"], ["bisa", "可能"], ["berbeda sapaan", "称呼不同"]], "b": "berbeda = ber- + beda", "g": "结构：A + 动词，B + 动词，前后对称：“不同的地区，称呼可能也不同”。"}}, {"sp": "", "role": "r", "id": "Orang Batak di Sumatra biasa menggunakan sapaan ito, kakak, dan abang.", "zh": "苏门答腊的巴塔克人常用 ito、kakak 和 abang 来称呼。", "a": "1b1879ce75b1", "za": "066a388d1d9e", "an": {"p": [["Orang Batak", "巴塔克人"], ["di Sumatra", "在苏门答腊"], ["biasa menggunakan", "习惯使用"], ["sapaan", "称呼"], ["ito, kakak, abang", "ito、kakak、abang（几种称呼）"]], "b": "", "g": "Orang + 族名 = 某族的人。di Sumatra 修饰 Orang Batak。三个称呼并列：A, B, dan C。abang = 哥哥（常用于苏门答腊）。"}}, {"sp": "", "role": "r", "id": "Orang Minang biasa menggunakan sapaan uda dan uni.", "zh": "米南人常用 uda 和 uni 来称呼。", "a": "edbd3ace9854", "za": "981295f57143", "an": {"p": [["Orang Minang", "米南加保人"], ["biasa menggunakan sapaan", "习惯使用称呼"], ["uda", "（哥哥）"], ["dan", "和"], ["uni", "（姐姐）"]], "b": "", "g": "句型同上：Orang X biasa menggunakan sapaan A dan B。uda 称男性年长者，uni 称女性年长者。"}}, {"sp": "", "role": "r", "id": "Orang Sunda biasa menggunakan sapaan teteh dan aa.", "zh": "巽他人常用 teteh 和 aa 来称呼。", "a": "c25963d3b201", "za": "9a6d4ed633c0", "an": {"p": [["Orang Sunda", "巽他人"], ["biasa menggunakan sapaan", "习惯使用称呼"], ["teteh", "（姐姐）"], ["dan", "和"], ["aa", "（哥哥）"]], "b": "", "g": "句型同上。teteh 称姐姐，aa 称哥哥。"}}, {"sp": "", "role": "r", "id": "Orang Bali biasa menggunakan sapaan bli dan mbok.", "zh": "巴厘人常用 bli 和 mbok 来称呼。", "a": "fb9ce1125b05", "za": "56e994ea72d1", "an": {"p": [["Orang Bali", "巴厘人"], ["biasa menggunakan sapaan", "习惯使用称呼"], ["bli", "（哥哥）"], ["dan", "和"], ["mbok", "（姐姐）"]], "b": "", "g": "句型同上。巴厘人称哥哥 bli，称姐姐 mbok。"}}], "zh": "印尼人通常称呼年长的男性为 bapak（Pak），女性为 ibu（Bu）。在爪哇岛，人们称呼年长男性为 mas、年长女性为 mbak。不同地区称呼不同：苏门答腊的巴塔克人用 ito、kakak、abang；米南人用 uda（哥）和 uni（姐）；巽他人用 aa（哥）和 teteh（姐）；巴厘人用 bli（哥）和 mbok（姐）。", "note": "", "qa": [], "u": 3}, {"id": "c101", "kind": "culture", "book": "BIPA 1", "title": "为什么印尼人会问年龄", "lines": [{"sp": "", "role": "r", "id": "Dalam etika berkenalan di Indonesia, orang kadang-kadang bertanya usia untuk mengenal lebih dekat.", "zh": "在印尼的社交礼仪中，人们有时会问年龄来拉近关系。", "a": "9234e18c9edc", "za": "cef5b171ce04", "an": {"p": [["Dalam etika berkenalan", "在相识的礼仪中"], ["di Indonesia", "在印尼"], ["orang", "人们"], ["kadang-kadang", "有时"], ["bertanya usia", "问年龄"], ["untuk mengenal lebih dekat", "为了更深入地了解"]], "b": "etika = 礼仪；usia = 年龄", "g": "结构：dalam + 名词短语（范围），主语 + 动词 + 宾语 + untuk + 动词 + 副词。dalam etika berkenalan = 在相识礼仪方面。mengenal lebih dekat = 更近地认识，即“多了解一些”。orang 在这里指“人们”（泛指）。"}}, {"sp": "", "role": "r", "id": "Di lingkungan kantor, atasan atau senior kerja biasanya akan bertanya usia jika mereka ingin mengetahui pengalaman kerja seseorang.", "zh": "在办公室里，上司或资深同事想了解某人的工作经验时，通常会问年龄。", "a": "1dd34e30eaed", "za": "28d88b60f484", "an": {"p": [["Di lingkungan kantor", "在办公室环境中"], ["atasan", "上司"], ["atau", "或"], ["senior kerja", "工作上的前辈"], ["biasanya akan bertanya", "通常会问"], ["usia", "年龄"], ["jika", "如果"], ["mereka ingin mengetahui", "他们想了解"], ["pengalaman kerja", "工作经验"], ["seseorang", "某人"]], "b": "mengetahui = tahu + meN-…-i；pengalaman = 经验；seseorang = se- + orang", "g": "结构：地点状语 + 主语（A atau B）+ akan bertanya usia + jika + 从句（mereka ingin mengetahui …）。jika = 如果，引出条件。seseorang = 某个人。"}}, {"sp": "", "role": "r", "id": "Terkadang kerabat keluarga yang jarang bertemu juga bertanya usia, misalnya kakek kepada cucunya, paman kepada keponakannya.", "zh": "有时候不常见面的亲戚也会问年龄，比如爷爷问孙子、叔叔问侄子。", "a": "80e36175607f", "za": "e68ab8cd1ab9", "an": {"p": [["Terkadang", "有时"], ["kerabat keluarga", "家族亲戚"], ["yang jarang bertemu", "不常见面的"], ["juga bertanya usia", "也会问年龄"], ["misalnya", "例如"], ["kakek", "爷爷"], ["cucunya", "他的孙辈"], ["paman", "叔叔"], ["keponakannya", "他的侄子或外甥"]], "b": "terkadang = kadang 的变体；jarang = 很少", "g": "结构：主语（名词 + yang + 从句）+ 谓语，misalnya + 举例（A kepada B, C kepada D）。yang jarang bertemu 修饰 kerabat keluarga。kakek kepada cucunya = 爷爷问孙辈。cucunya、keponakannya 的 -nya 指前面说的那位长辈。"}}, {"sp": "", "role": "r", "id": "Dalam pertemanan, seseorang akan bertanya usia sebagai cara untuk lebih akrab dengan teman yang dikenalnya.", "zh": "交朋友时，人们会问年龄，以此和新认识的朋友更亲近。", "a": "15a27f629e73", "za": "bbef04abcac5", "an": {"p": [["Dalam pertemanan", "在朋友关系中"], ["seseorang", "某人"], ["akan bertanya usia", "会问年龄"], ["sebagai cara", "作为一种方式"], ["untuk lebih akrab", "为了更亲近"], ["dengan teman yang dikenalnya", "和他认识的朋友"]], "b": "pertemanan = per- + teman + -an；akrab = 亲近；dikenalnya = dikenal + -nya", "g": "结构：范围 + 主语 + 谓语 + sebagai cara + untuk + 形容词 + dengan + 人。sebagai cara untuk… = 作为……的一种方式。teman yang dikenalnya = 他所认识的朋友（yang + 被动 + -nya 表示施事“他”）。"}}], "zh": "在印尼的交往礼节中，人们有时会问年龄，以便更了解对方。在办公室，上司或前辈想了解一个人的工作经验时常会问年龄；不常见面的亲戚也会问，比如爷爷问孙子、叔叔问侄子。朋友之间问年龄，是拉近关系的一种方式。", "note": "", "qa": [], "u": 4}, {"id": "c102", "kind": "culture", "book": "BIPA 1", "title": "印尼的旅游类型", "lines": [{"sp": "", "role": "r", "id": "Ada beberapa jenis wisata yang digemari masyarakat Indonesia, antara lain wisata alam, wisata religi dan budaya, wisata belanja, dan wisata edukasi.", "zh": "印尼人喜欢的旅游有好几种，包括自然游、宗教文化游、购物游和教育游。", "a": "e6cbc088c634", "za": "aeb7501b556f", "an": {"p": [["Ada", "有"], ["beberapa jenis", "几种"], ["wisata", "旅游"], ["yang digemari", "被喜爱的"], ["masyarakat Indonesia", "印尼民众"], ["antara lain", "其中包括"], ["wisata alam", "自然旅游"], ["wisata religi dan budaya", "宗教文化旅游"], ["wisata belanja", "购物旅游"], ["wisata edukasi", "教育旅游"]], "b": "digemari = di- + gemar 喜爱 + -i；edukasi = 教育", "g": "结构：Ada + 名词 + yang + 被动动词 + 施事（masyarakat Indonesia），antara lain + 列举。yang digemari masyarakat Indonesia = 被印尼人喜爱的（被动句里施事可直接放在动词后，不用 oleh）。antara lain = 其中包括、例如。"}}, {"sp": "", "role": "r", "id": "Beberapa tempat wisata alam yang menarik antara lain Kepulauan Raja Ampat (Papua), Gunung Rinjani (Pulau Lombok), Kepulauan Belitung, Gunung Bromo (Jawa Timur), Taman Laut Bunaken (Sulawesi Utara), dan Danau Toba (Sumatra Utara).", "zh": "一些有吸引力的自然景点有：四王群岛（巴布亚）、林贾尼火山（龙目岛）、勿里洞群岛、布罗莫火山（东爪哇）、布纳肯海洋公园（北苏拉威西）和多巴湖（北苏门答腊）。", "a": "f4a455a04b61", "za": "b16c67043ac2", "an": {"p": [["Beberapa tempat wisata alam", "几处自然景点"], ["yang menarik", "有吸引力的"], ["antara lain", "包括"], ["Kepulauan Raja Ampat", "拉贾安帕特群岛"], ["Gunung Rinjani", "林贾尼火山"], ["Kepulauan Belitung", "勿里洞群岛"], ["Gunung Bromo", "布罗莫火山"], ["Taman Laut Bunaken", "布纳肯海洋公园"], ["Danau Toba", "多巴湖"]], "b": "menarik = tarik + meN-；gunung = 山；danau = 湖；laut = 海", "g": "结构：名词短语 + yang menarik + antara lain + 一串地名（括号里是所在地区）。地名结构：通名 + 专名，如 Gunung Bromo（山 + 名）、Danau Toba（湖 + 名）。Utara = 北，Timur = 东。"}}, {"sp": "", "role": "r", "id": "Tempat wisata religi antara lain Masjid Istiqlal (Jakarta), Pura Tanah Lot (Bali), Candi Borobudur (Jawa Tengah), Candi Prambanan (Yogyakarta), Gereja Blenduk (Jawa Tengah), dan Patung Yesus (Toraja).", "zh": "宗教景点有：伊斯蒂克拉尔清真寺（雅加达）、海神庙（巴厘岛）、婆罗浮屠（中爪哇）、普兰巴南神庙（日惹）、Blenduk 教堂（中爪哇）和耶稣像（托拉查）。", "a": "78d0d91e2a75", "za": "089988b27192", "an": {"p": [["Tempat wisata religi", "宗教旅游景点"], ["antara lain", "包括"], ["Masjid", "清真寺"], ["Pura", "印度教寺庙"], ["Candi", "古庙塔"], ["Gereja", "教堂"], ["Patung", "雕像"], ["Jawa Tengah", "中爪哇"]], "b": "", "g": "结构：主语 + antara lain + 并列专名，省略动词。Masjid Istiqlal（独立清真寺）、Pura Tanah Lot（海神庙）、Candi Borobudur（婆罗浮屠）、Candi Prambanan（普兰巴南）。Tengah = 中部。"}}, {"sp": "", "role": "r", "id": "Untuk wisata belanja ada Pasar Tanah Abang (Jakarta), Pasar Cibaduyut (Bandung), Pasar Seni Sukawati (Bali), dan Pasar Beringharjo (Yogyakarta).", "zh": "购物游有：丹那阿邦市场（雅加达）、Cibaduyut 市场（万隆）、苏卡瓦蒂艺术市场（巴厘岛）和 Beringharjo 市场（日惹）。", "a": "f7217205bb39", "za": "89af35938750", "an": {"p": [["Untuk wisata belanja", "至于购物旅游"], ["ada", "有"], ["Pasar", "市场"], ["Pasar Seni", "艺术市场"]], "b": "", "g": "结构：Untuk + 类别 + ada + 并列地名（untuk 引出话题：至于购物旅游，有……）。Pasar Tanah Abang 是雅加达的大型布料市场。pasar seni = 市场 + 艺术。"}}, {"sp": "", "role": "r", "id": "Untuk wisata edukasi ada Taman Mini Indonesia Indah (Jakarta), Taman Pintar (Yogyakarta), Jatim Park 2 (Jawa Timur), dan Kota Tua (Jakarta).", "zh": "教育游有：缩影公园（雅加达）、智慧公园（日惹）、东爪哇公园2号（东爪哇）和老城区（雅加达）。", "a": "b0cb6e3748c9", "za": "f97a97e9eaa4", "an": {"p": [["Untuk wisata edukasi", "至于教育旅游"], ["ada", "有"], ["Taman", "公园"], ["Indah", "美丽"], ["Taman Pintar", "智慧公园"], ["Kota Tua", "老城"]], "b": "", "g": "句型同上。Taman Mini Indonesia Indah = 美丽印尼缩影公园。pintar = 聪明，tua = 老，kota = 城市。"}}], "zh": "印尼人喜爱的旅游类型有：自然游、宗教文化游、购物游和教育游。自然景点：四王群岛（巴布亚）、林贾尼火山（龙目岛）、勿里洞群岛、布罗莫火山（东爪哇）、布纳肯海洋公园（北苏拉威西）、多巴湖（北苏门答腊）。宗教景点：独立清真寺（雅加达）、海神庙（巴厘）、婆罗浮屠（中爪哇）、普兰巴南（日惹）、布伦杜克教堂（中爪哇）、耶稣像（托拉查）。购物：丹那阿邦市场（雅加达）、奇巴杜尤特市场（万隆）、苏卡瓦蒂艺术市场（巴厘）、贝林哈佐市场（日惹）。教育休闲：迷你印尼公园（雅加达）、智慧公园（日惹）、东爪哇公园 2 号、雅加达老城。", "note": "", "qa": [], "u": 5}, {"id": "c103", "kind": "culture", "book": "BIPA 1", "title": "万丹的巴杜伊传统村落", "lines": [{"sp": "", "role": "r", "id": "Suku Baduy di Kabupaten Lebak, Banten, terkenal dengan kearifan lokalnya.", "zh": "万丹省 Lebak 县的巴杜伊族以其本土智慧闻名。", "a": "21651629e67d", "za": "b70a404f3fe1", "an": {"p": [["Suku Baduy", "巴杜伊族"], ["di Kabupaten Lebak, Banten", "在万丹省勒巴克县"], ["terkenal dengan", "以……闻名"], ["kearifan lokalnya", "它的本地智慧"]], "b": "terkenal = ter- + kenal；kearifan = arif 智慧 + ke-…-an", "g": "结构：主语（名词 + 地点）+ terkenal dengan + 名词。terkenal dengan = 以……而出名。kearifan lokal = 地方智慧（传统生活智慧）。-nya = 它（该族）的。"}}, {"sp": "", "role": "r", "id": "Penduduk laki-laki Suku Baduy bermatapencaharian sebagai petani.", "zh": "巴杜伊族的男人以务农为生。", "a": "981a26c507fb", "za": "5d3098d29913", "an": {"p": [["Penduduk laki-laki", "男性居民"], ["Suku Baduy", "巴杜伊族"], ["bermatapencaharian", "以……为生计"], ["sebagai petani", "作为农民"]], "b": "mata pencaharian = 谋生之道；petani = tani + pe-", "g": "ber + matapencaharian = 以……为谋生手段，sebagai + 职业。意思：男性以务农为生。"}}, {"sp": "", "role": "r", "id": "Sementara itu, penduduk perempuan berada di rumah untuk menenun kain dan memasak.", "zh": "而女人在家织布、做饭。", "a": "c099bc1976ff", "za": "e96ddb9840af", "an": {"p": [["Sementara itu", "与此同时"], ["penduduk perempuan", "女性居民"], ["berada di rumah", "待在家"], ["untuk menenun kain", "织布"], ["dan", "和"], ["memasak", "做饭"]], "b": "menenun = tenun + meN-；kain = 布", "g": "Sementara itu = 与此同时（表示对比）。berada di = 位于、处在。untuk + 动词 = 为了（做）……，这里表示“待在家做的事”。"}}, {"sp": "", "role": "r", "id": "Aktivitas harian tersebut dilakukan tanpa teknologi sedikit pun, semuanya bergantung pada alam.", "zh": "这些日常活动完全不用任何科技，一切都依靠大自然。", "a": "07d8e54c7f39", "za": "4265e8b95c6e", "an": {"p": [["Aktivitas harian", "日常活动"], ["tersebut", "上述的"], ["dilakukan", "被进行"], ["tanpa", "没有"], ["teknologi", "技术"], ["sedikit pun", "一点也"], ["semuanya", "全部"], ["bergantung pada", "依赖"], ["alam", "自然"]], "b": "harian = hari + -an；tanpa = 没有", "g": "结构：主句 + 逗号 + 补充说明（semuanya bergantung pada alam）。tanpa + 名词 + sedikit pun = 完全没有……。tersebut = 上述的（书面）。bergantung pada = 依靠。"}}, {"sp": "", "role": "r", "id": "Penduduk perempuan sejak pagi sudah mandi, mencuci pakaian, dan mencuci piring.", "zh": "女人们一早就洗澡、洗衣服、洗碗。", "a": "4e677a73c0b4", "za": "23057936f6f1", "an": {"p": [["Penduduk perempuan", "女性居民"], ["sejak pagi", "从早上起"], ["sudah", "已经"], ["mandi", "洗澡"], ["mencuci pakaian", "洗衣服"], ["mencuci piring", "洗盘子"]], "b": "", "g": "sejak + 时间 = 自……以来。sudah 放在动词前，三个动作并列：A, B, dan C。"}}, {"sp": "", "role": "r", "id": "Setelah mandi mereka bersiap untuk memasak.", "zh": "洗完澡后她们准备做饭。", "a": "f4d7452f913f", "za": "1e8bd74c1264", "an": {"p": [["Setelah mandi", "洗完澡后"], ["mereka", "她们"], ["bersiap", "准备"], ["untuk memasak", "去做饭"]], "b": "bersiap = ber- + siap", "g": "bersiap untuk + 动词 = 准备去做……。setelah + 动词 = ……之后。"}}, {"sp": "", "role": "r", "id": "Alat masak yang digunakan masih sangat tradisional, yakni menggunakan kayu bakar dan gerabah.", "zh": "用的厨具还非常传统，就是柴火和陶器。", "a": "e3c217a2eb96", "za": "230457b2208f", "an": {"p": [["Alat masak", "炊具"], ["yang digunakan", "所使用的"], ["masih", "仍然"], ["sangat tradisional", "非常传统"], ["yakni", "即"], ["menggunakan", "使用"], ["kayu bakar", "柴火"], ["dan", "和"], ["gerabah", "陶器"]], "b": "", "g": "结构：主语（名词 + yang + 被动）+ 谓语 + yakni + 说明。yakni = 也就是（等于 yaitu）。yang digunakan 修饰 alat masak。kayu bakar = 木头 + 烧 = 柴火。"}}, {"sp": "", "role": "r", "id": "Usai memasak beberapa perempuan melanjutkan kegiatan dengan menenun kain atau menganyam tas dari rotan.", "zh": "做完饭后，有些女人接着织布或用藤编包。", "a": "7bc7dc846f4f", "za": "fa4179f5a361", "an": {"p": [["Usai memasak", "做完饭后"], ["beberapa perempuan", "一些女性"], ["melanjutkan", "继续"], ["kegiatan", "活动"], ["dengan menenun kain", "通过织布"], ["atau", "或"], ["menganyam tas", "编包"], ["dari rotan", "用藤条"]], "b": "usai = 完毕；melanjutkan = lanjut + meN-…-kan；menganyam = anyam + meN-", "g": "结构：Usai + 动词 + 主语 + 动词 + dengan + 动词 1 atau 动词 2。usai = setelah（书面）。dengan + 动词 = 通过做……。dari + 材料 = 用……做成：tas dari rotan = 藤条包。"}}, {"sp": "", "role": "r", "id": "Anak-anak Baduy Luar bermain seperti anak-anak pada umumnya.", "zh": "外巴杜伊的孩子们和普通孩子一样玩耍。", "a": "54ec8f4b8f36", "za": "8e87ec5d7d82", "an": {"p": [["Anak-anak", "孩子们"], ["Baduy Luar", "外巴杜伊"], ["bermain", "玩耍"], ["seperti", "像"], ["anak-anak pada umumnya", "一般的孩子"]], "b": "", "g": "seperti + 名词 + pada umumnya = 像一般的……。anak-anak 重叠表复数。Luar = 外，Dalam = 内：Baduy Luar（外巴杜伊）、Baduy Dalam（内巴杜伊）。"}}, {"sp": "", "role": "r", "id": "Sementara itu, penduduk laki-laki menuju ladang untuk bertani.", "zh": "而男人们去田里干农活。", "a": "993d39bf6402", "za": "b3c32e317ec8", "an": {"p": [["Sementara itu", "与此同时"], ["penduduk laki-laki", "男性居民"], ["menuju", "前往"], ["ladang", "田地"], ["untuk bertani", "去务农"]], "b": "bertani = ber- + tani", "g": "menuju + 地点 = 前往某处。untuk + 动词 = 为了做……（目的）。"}}, {"sp": "", "role": "r", "id": "Terkadang penduduk Baduy Dalam dengan kostum serbaputih juga turun ke Baduy Luar.", "zh": "有时候穿一身白衣的内巴杜伊人也会下山到外巴杜伊来。", "a": "7dc9c6a45113", "za": "1f9b0a48ff2c", "an": {"p": [["Terkadang", "有时"], ["penduduk Baduy Dalam", "内巴杜伊居民"], ["dengan kostum serbaputih", "穿着全白服装"], ["juga", "也"], ["turun", "下来"], ["ke Baduy Luar", "到外巴杜伊"]], "b": "serbaputih = serba 全部 + putih", "g": "dengan + 名词 = 带着、穿着……。serba + 形容词 = 全都是……的：serbaputih = 一身白。turun ke = 下到某地。"}}, {"sp": "", "role": "r", "id": "Jika berkunjung ke Indonesia, jangan lupa singgah di desa adat itu, ya!", "zh": "如果来印尼，别忘了去这个传统村落看看哦！", "a": "fb87c6a9a7f7", "za": "39aa2d74ff7e", "an": {"p": [["Jika", "如果"], ["berkunjung ke", "访问"], ["Indonesia", "印尼"], ["jangan lupa", "别忘了"], ["singgah", "顺道去"], ["di desa adat itu", "在那个传统村落"], ["ya", "哦"]], "b": "singgah = 顺道停留；desa adat = 村 + 习俗（传统村落）", "g": "结构：Jika + 动词（省略主语），jangan + 动词 = 别……。jangan lupa + 动词 = 别忘记做……。ya 放句尾，口语语气词，表示亲切提醒。"}}], "zh": "万丹省勒巴克县的巴杜伊族以本土智慧闻名。男人以务农为生，女人在家织布、做饭，日常生活完全不用科技，一切依靠大自然。妇女们一早就洗澡、洗衣、洗碗，然后准备做饭，用的仍是柴火和陶器这些传统炊具。做完饭，有些妇女接着织布或用藤条编包。外巴杜伊的孩子们像普通孩子一样玩耍，男人们去田里耕作。有时穿着全白服装的内巴杜伊人也会来到外巴杜伊。来印尼的话，别忘了顺路去这个传统村落看看！", "note": "", "qa": [], "u": 6}, {"id": "c104", "kind": "culture", "book": "BIPA 1", "title": "疯狂竹子——马鲁古的传统游戏", "lines": [{"sp": "", "role": "r", "id": "Zaman dahulu masyarakat Indonesia punya hobi berkumpul dan bermain bersama.", "zh": "以前印尼人喜欢聚在一起玩。", "a": "94d603b670f3", "za": "c0d0168aa669", "an": {"p": [["Zaman dahulu", "古时候"], ["masyarakat Indonesia", "印尼人"], ["punya hobi", "有爱好"], ["berkumpul", "聚在一起"], ["dan", "和"], ["bermain bersama", "一起玩"]], "b": "dahulu = 从前", "g": "punya hobi + 动词 = 有……的爱好（爱好是做某事）。zaman dahulu = 从前的时代。"}}, {"sp": "", "role": "r", "id": "Ada permainan tradisional unik di Maluku yang punya nuansa mistis.", "zh": "马鲁古有一种独特的传统游戏，带有神秘色彩。", "a": "17df98aa9412", "za": "0a12cc00f83d", "an": {"p": [["Ada", "有"], ["permainan tradisional", "传统游戏"], ["unik", "独特"], ["di Maluku", "在马鲁古"], ["yang punya", "具有"], ["nuansa mistis", "神秘色彩"]], "b": "permainan = main + per-…-an", "g": "结构：Ada + 名词短语 + 地点 + yang + 谓语 = 有一种……，它具有……。yang punya nuansa mistis 修饰 permainan tradisional unik。"}}, {"sp": "", "role": "r", "id": "Namanya bambu gila (baramasuwel).", "zh": "它叫\"疯竹子\"（baramasuwel）。", "a": "cef57223e707", "za": "44d12164dac9", "an": {"p": [["Namanya", "它的名字叫"], ["bambu", "竹子"], ["gila", "疯狂"], ["baramasuwel", "当地名称"]], "b": "", "g": "Namanya + 名字 = 它叫做……。bambu gila = 竹子 + 疯狂。"}}, {"sp": "", "role": "r", "id": "Pada permainan ini para pemain hanya memeluk dan menahan laju bambu.", "zh": "在这个游戏里，玩家只是抱住竹子、阻止它往前冲。", "a": "e1dbb232f24c", "za": "940e1795232c", "an": {"p": [["Pada permainan ini", "在这个游戏中"], ["para pemain", "玩家们"], ["hanya", "只"], ["memeluk", "抱住"], ["dan", "和"], ["menahan", "顶住"], ["laju", "速度、冲劲"], ["bambu", "竹子"]], "b": "para = 表示人的复数；pemain = main + pe-", "g": "para + 人 = 一群……（用于人的复数）：para pemain。hanya + 动词 = 只是……。menahan laju bambu = 顶住竹子的冲势。"}}, {"sp": "", "role": "r", "id": "Bambu ini bergerak melonjak sesuai kemauan sang pawang.", "zh": "竹子会按照法师的意愿跳动。", "a": "8a18dd3d906d", "za": "83bc4ebd2bb7", "an": {"p": [["Bambu ini", "这根竹子"], ["bergerak", "移动"], ["melonjak", "跳起"], ["sesuai", "按照"], ["kemauan", "意愿"], ["sang pawang", "那位巫师"]], "b": "kemauan = mau + ke-…-an；pawang = 巫师、驯兽师", "g": "结构：主语 + 动词 + 动词 + sesuai + 名词。bergerak melonjak = 蹦跳着移动。sesuai + 名词 = 符合……、按照……。sang = 对特定人物的冠词（带敬意）。"}}, {"sp": "", "role": "r", "id": "Pawang bisa menggerakkan bambu dengan kekuatan gaib.", "zh": "法师能用神秘的力量让竹子动起来。", "a": "eb7429590d71", "za": "49a457e95ebd", "an": {"p": [["Pawang", "巫师"], ["bisa", "能"], ["menggerakkan", "使移动"], ["bambu", "竹子"], ["dengan kekuatan gaib", "凭借神秘的力量"]], "b": "menggerakkan = gerak + meN-…-kan；kekuatan = kuat + ke-…-an；gaib = 神秘的", "g": "menggerakkan = 使……动起来（meN-…-kan 表使动）。dengan + 名词 = 凭借……。kekuatan gaib = 力量 + 神秘。"}}, {"sp": "", "role": "r", "id": "Sang pawang membakar kemenyan sebelum permainan dimulai.", "zh": "游戏开始前，法师会烧安息香。", "a": "180c55be28ca", "za": "e2c02dbab613", "an": {"p": [["Sang pawang", "那位巫师"], ["membakar", "烧"], ["kemenyan", "乳香"], ["sebelum", "在……之前"], ["permainan dimulai", "游戏开始"]], "b": "dimulai = di- + mulai", "g": "结构：主句 + sebelum + 完整小句（permainan dimulai）。sebelum 后面可接“主语 + 被动动词”。dimulai = 被开始（游戏开始）。"}}, {"sp": "", "role": "r", "id": "Asapnya lalu 'dimasukkan' ke dalam bilah bambu.", "zh": "然后把烟\"放进\"竹子里。", "a": "776c433cfd80", "za": "ca737b3ba8b2", "an": {"p": [["Asapnya", "它的烟"], ["lalu", "然后"], ["dimasukkan", "被放入"], ["ke dalam", "到……里面"], ["bilah bambu", "竹片"]], "b": "asap = 烟；dimasukkan = di- + masuk + -kan", "g": "di-…-kan 被动：被放进去。ke dalam + 名词 = 进入……里面。引号表示“象征意义的放入”。"}}, {"sp": "", "role": "r", "id": "Lalu, secara gaib bambu akan bergerak sendiri.", "zh": "接着，竹子就会神秘地自己动起来。", "a": "5b0c612de51f", "za": "3c6e630cbb8e", "an": {"p": [["Lalu", "然后"], ["secara gaib", "神秘地"], ["bambu", "竹子"], ["akan bergerak", "将会移动"], ["sendiri", "自己"]], "b": "secara = 以……方式", "g": "secara + 形容词 = ……地（副词，较书面）：secara gaib = 神秘地。sendiri 放在动词后 = 自己（自行）。"}}, {"sp": "", "role": "r", "id": "Sang pawang terus mengendalikan bambu dengan mantra, “Hei baramasuwel!” Permainan bambu gila merupakan bentuk kekayaan nusantara.", "zh": "法师一边念咒\"嘿，baramasuwel！\"一边控制竹子。疯竹子游戏是印尼文化宝藏的一种。", "a": "eaf2c189bf7b", "za": "523495afec4e", "an": {"p": [["Sang pawang", "那位巫师"], ["terus", "不断"], ["mengendalikan", "控制"], ["bambu", "竹子"], ["dengan mantra", "用咒语"], ["Hei", "嘿"], ["Permainan bambu gila", "疯狂竹子游戏"], ["merupakan", "是"], ["bentuk", "形式"], ["kekayaan nusantara", "印尼群岛的财富"]], "b": "mengendalikan = kendali + meN-…-kan；kekayaan = kaya 富 + ke-…-an", "g": "结构：两句连在一起：句 1（terus + 动词 + dengan 咒语）；句 2（主语 + merupakan + 名词短语）。terus + 动词 = 持续地……。merupakan = 是（书面）。kekayaan nusantara = 群岛的财富（指丰富的文化）。"}}], "zh": "过去的印尼人喜欢聚在一起玩。马鲁古有一种带神秘色彩的独特传统游戏，叫“疯狂竹子”（baramasuwel）。玩家只需抱住竹子、挡住它的冲劲，竹子会按巫师的意愿跳动，巫师能用神秘的力量驱动竹子。游戏开始前巫师点燃安息香，把烟“送进”竹片里，竹子就会神奇地自己动起来，玩家必须抱住它。巫师一直念着咒语“嘿，baramasuwel！”来控制竹子。疯狂竹子是印尼群岛丰富文化的一部分。", "note": "", "qa": [], "u": 7}, {"id": "c105", "kind": "culture", "book": "BIPA 1", "title": "古邦人的碰鼻礼", "lines": [{"sp": "", "role": "r", "id": "Di berbagai belahan dunia tradisi penyambutan atau tata cara bersalaman ternyata tidak sama.", "zh": "原来在世界各地，迎接客人的传统和握手的方式都不一样。", "a": "d954b9ddb4ea", "za": "621ab73353e7", "an": {"p": [["Di berbagai belahan dunia", "在世界各地"], ["tradisi penyambutan", "欢迎的传统"], ["atau", "或"], ["tata cara bersalaman", "握手的方式"], ["ternyata", "原来"], ["tidak sama", "不一样"]], "b": "belahan = belah 劈 + -an；penyambutan = sambut + pe-…-an；bersalaman = ber- + salam + -an", "g": "结构：地点状语 + 主语（A atau B）+ ternyata + 否定形容词。ternyata = 原来、结果是（出乎意料）。tata cara = 方式、规矩。bersalaman = 互相握手问候。"}}, {"sp": "", "role": "r", "id": "Di Tibet orang-orang bersalaman dengan menjulurkan lidah.", "zh": "在西藏，人们打招呼时会伸出舌头。", "a": "81598ddcb974", "za": "954fbd6f69cb", "an": {"p": [["Di Tibet", "在西藏"], ["orang-orang", "人们"], ["bersalaman", "互相问候"], ["dengan menjulurkan lidah", "通过伸出舌头"]], "b": "menjulurkan = julur + meN-…-kan；lidah = 舌头", "g": "dengan + 动词 = 以……的方式。menjulurkan = 使伸出。orang-orang = 人们（重叠复数）。"}}, {"sp": "", "role": "r", "id": "Di Eropa umumnya orang bersalaman sambil menyentuhkan pipi.", "zh": "在欧洲，人们一般贴脸打招呼。", "a": "5af5fb54724b", "za": "998d2ffc5bbe", "an": {"p": [["Di Eropa", "在欧洲"], ["umumnya", "一般"], ["orang", "人们"], ["bersalaman", "互相问候"], ["sambil", "一边"], ["menyentuhkan pipi", "让脸颊相碰"], ["pipi", "脸颊"]], "b": "menyentuhkan = sentuh + meN-…-kan", "g": "sambil + 动词 = 一边……一边……。menyentuhkan = 使接触。pipi = 脸颊（贴面礼）。"}}, {"sp": "", "role": "r", "id": "Di Nusa Tenggara Timur (NTT) juga ada cara unik bersalaman, yaitu cium hidung.", "zh": "在东努沙登加拉也有独特的打招呼方式，就是碰鼻子。", "a": "c79832ebe353", "za": "3e9f19dccdb4", "an": {"p": [["Di Nusa Tenggara Timur", "在东努沙登加拉"], ["juga ada", "也有"], ["cara unik", "独特的方式"], ["bersalaman", "握手问候"], ["yaitu", "即"], ["cium hidung", "碰鼻子（亲鼻）"]], "b": "cium = 亲吻；hidung = 鼻子", "g": "结构：地点 + juga ada + 名词 + 动词（说明），yaitu + 具体内容。cara unik bersalaman = 独特的问候方式。yaitu = 也就是（引出具体说明）。"}}, {"sp": "", "role": "r", "id": "Cium hidung umumnya dilakukan oleh masyarakat Sabu.", "zh": "碰鼻礼一般是萨武人的习俗。", "a": "ce96e2bddaa7", "za": "6510c7f1329f", "an": {"p": [["Cium hidung", "碰鼻礼"], ["umumnya", "一般"], ["dilakukan oleh", "由……进行"], ["masyarakat Sabu", "萨武人"]], "b": "dilakukan = di- + laku + -kan", "g": "结构：主语 + 被动 + oleh + 施事。dilakukan oleh = 被……实行。masyarakat + 族名 = 某族人。"}}, {"sp": "", "role": "r", "id": "Cium hidung dapat dimaknai sebagai ungkapan kasih sayang.", "zh": "碰鼻子可以理解为表达爱意。", "a": "8780aebd917b", "za": "ae25e57331f5", "an": {"p": [["Cium hidung", "碰鼻礼"], ["dapat", "可以"], ["dimaknai", "被理解为"], ["sebagai", "作为"], ["ungkapan", "表达"], ["kasih sayang", "关爱、爱意"]], "b": "dimaknai = di- + makna + -i；ungkapan = ungkap + -an", "g": "dapat = bisa（书面的“能、可以”）。dimaknai sebagai + 名词 = 被理解为……。ungkapan = 表达。"}}, {"sp": "", "role": "r", "id": "Tradisi ini konon sudah berlangsung sejak zaman dahulu dan masih terjaga hingga hari ini.", "zh": "据说这个传统从古代就有，一直保留到今天。", "a": "de18bb2c9572", "za": "8d8633645de5", "an": {"p": [["Tradisi ini", "这个传统"], ["konon", "据说"], ["sudah berlangsung", "已经进行"], ["sejak zaman dahulu", "自古以来"], ["dan", "并且"], ["masih terjaga", "仍被保存"], ["hingga hari ini", "直到今天"]], "b": "berlangsung = ber- + langsung；terjaga = ter- + jaga", "g": "结构：主语 + konon + sudah + 动词 + sejak…，dan masih + 动词 + hingga…。konon = 据说（插入语）。sejak … hingga … = 从……到……。terjaga = 被保持着（ter- 表示状态）。"}}, {"sp": "", "role": "r", "id": "Di luar negeri ada beberapa negara yang juga melakukan cium hidung, seperti Alaska, Arab Saudi, dan Selandia Baru.", "zh": "国外也有一些地方行碰鼻礼，比如阿拉斯加、沙特阿拉伯和新西兰。", "a": "bff9ecf6db2e", "za": "54e3a0c7c265", "an": {"p": [["Di luar negeri", "在国外"], ["ada beberapa negara", "有几个国家"], ["yang juga melakukan", "也进行"], ["cium hidung", "碰鼻礼"], ["seperti", "例如"], ["Alaska", "阿拉斯加"], ["Arab Saudi", "沙特阿拉伯"], ["Selandia Baru", "新西兰"]], "b": "", "g": "结构：地点 + Ada + 名词 + yang + 动词 + 宾语，seperti + 列举。Selandia Baru = 新西兰（Baru“新”）。"}}], "zh": "世界各地的迎客和问候方式各不相同：西藏人伸舌头问候，欧洲人通常贴脸问候。东努沙登加拉也有一种独特的问候方式——碰鼻礼，主要流行于萨武人。碰鼻表示亲爱之情，据说这一传统自古就有，至今仍保留着。国外也有地方行碰鼻礼，比如阿拉斯加、沙特阿拉伯和新西兰。", "note": "", "qa": [], "u": 8}, {"id": "c106", "kind": "culture", "book": "BIPA 1", "title": "雅加达地铁 MRT", "lines": [{"sp": "", "role": "r", "id": "Moda raya terpadu (MRT) adalah sebuah kereta rel listrik.", "zh": "大众捷运（MRT）是一种电气列车。", "a": "98026e1ccceb", "za": "cddc568f8472", "an": {"p": [["Moda raya terpadu", "大众快速交通（MRT）"], ["adalah", "是"], ["sebuah", "一个"], ["kereta rel listrik", "电动轨道列车"]], "b": "moda = 交通方式；terpadu = 综合的；rel = 轨道；listrik = 电", "g": "结构：专有名词（缩写）+ adalah + 名词短语。sebuah + 名词 = 一个……（se- + buah）。kereta rel listrik = 火车 + 轨道 + 电。"}}, {"sp": "", "role": "r", "id": "MRT ada di bawah tanah.", "zh": "MRT 在地下。", "a": "e4a1fa9a6863", "za": "4fcadd5b04b0", "an": {"p": [["MRT", "地铁"], ["ada", "在"], ["di bawah tanah", "在地下"]], "b": "", "g": "ada + 地点 = 位于某处。di bawah = 在……下面，tanah = 土地。"}}, {"sp": "", "role": "r", "id": "Transportasi transit cepat ini menghubungkan tempat-tempat di Jakarta.", "zh": "这种快速交通连接着雅加达的各个地方。", "a": "90c8e416d3c0", "za": "14bd63ce20f1", "an": {"p": [["Transportasi transit cepat", "快速公共交通"], ["ini", "这个"], ["menghubungkan", "连接"], ["tempat-tempat", "各个地方"], ["di Jakarta", "在雅加达"]], "b": "menghubungkan = hubung + meN-…-kan", "g": "结构：主语（名词 + ini）+ menghubungkan + 宾语。menghubungkan = 连接。tempat-tempat = 各处（重叠复数）。"}}, {"sp": "", "role": "r", "id": "Fasilitas di sini juga ramah bagi kaum disabilitas.", "zh": "这里的设施对残障人士也很友好。", "a": "ffc0b7fab62e", "za": "1866e3c5fd86", "an": {"p": [["Fasilitas", "设施"], ["di sini", "在这里"], ["juga", "也"], ["ramah", "友好"], ["bagi", "对"], ["kaum disabilitas", "残障人士"]], "b": "kaum = 群体；disabilitas = 残障", "g": "ramah bagi + 人群 = 对……友好。kaum + 形容词/名词 = 某类人群。"}}, {"sp": "", "role": "r", "id": "Sebab, tempat ini dilengkapi eskalator dan lift.", "zh": "因为这里配有自动扶梯和电梯。", "a": "247354a12807", "za": "6de2e3d29e0f", "an": {"p": [["Sebab", "因为"], ["tempat ini", "这个地方"], ["dilengkapi", "配备有"], ["eskalator", "扶梯"], ["dan", "和"], ["lift", "电梯"]], "b": "dilengkapi = di- + lengkap + -i", "g": "Sebab 放句首引出原因（= karena）。dilengkapi + 名词 = 配备有……（被动）。"}}, {"sp": "", "role": "r", "id": "Petugas juga selalu siap sedia untuk membantu para penumpang.", "zh": "工作人员也随时准备帮助乘客。", "a": "2da83f37ac19", "za": "ccb0c35d312d", "an": {"p": [["Petugas", "工作人员"], ["juga selalu", "也总是"], ["siap sedia", "随时准备好"], ["untuk membantu", "去帮助"], ["para penumpang", "乘客们"]], "b": "petugas = tugas + pe-；penumpang = tumpang + pe-", "g": "siap sedia = 时刻准备着。siap + untuk + 动词 = 准备好做……。para + 人 = 一群……。"}}, {"sp": "", "role": "r", "id": "Hendak berkunjung ke Jakarta?", "zh": "想去雅加达玩吗？", "a": "915ebbc3a997", "za": "de295a51dde7", "an": {"p": [["Hendak", "打算"], ["berkunjung ke", "访问"], ["Jakarta", "雅加达"]], "b": "", "g": "hendak = ingin / akan（书面的“想要、打算”）。问句没有疑问词，靠语调和问号。"}}, {"sp": "", "role": "r", "id": "Jangan lupa naik MRT, ya!", "zh": "别忘了坐 MRT 哦！", "a": "6627a44ebf27", "za": "a4dfa4816655", "an": {"p": [["Jangan lupa", "别忘了"], ["naik", "乘坐"], ["MRT", "地铁"], ["ya", "哦"]], "b": "", "g": "jangan + 动词 = 不要……（祈使否定）。naik + 交通工具 = 乘……。ya 加在句尾使语气亲切。"}}], "zh": "综合捷运（MRT）是一种电动轨道列车，在地下运行，这种快速交通工具连接着雅加达各处。这里的设施对残障人士也很友好，配有自动扶梯和电梯，工作人员也随时准备帮助乘客。要去雅加达吗？别忘了坐 MRT 哦！", "note": "", "qa": [], "u": 9}, {"id": "c107", "kind": "culture", "book": "BIPA 1", "title": "蓝眼睛的印尼原住民", "lines": [{"sp": "", "role": "r", "id": "Ternyata ada penduduk asli Indonesia dengan mata biru.", "zh": "原来印尼有蓝眼睛的原住民。", "a": "5314294024a0", "za": "84a22303879e", "an": {"p": [["Ternyata", "原来"], ["ada", "有"], ["penduduk asli", "原住民"], ["Indonesia", "印尼"], ["dengan mata biru", "长着蓝眼睛"]], "b": "asli = 原来的、本土的", "g": "Ternyata + 句子 = 原来……（出乎意料）。dengan + 名词 + 形容词 = 带着……的：dengan mata biru = 蓝眼睛的。mata biru = 眼睛 + 蓝。"}}, {"sp": "", "role": "r", "id": "Mereka ada di Sulawesi Tenggara, Maluku Utara, dan Aceh Jaya.", "zh": "他们在东南苏拉威西、北马鲁古和亚齐查亚。", "a": "8668b5ab10e2", "za": "11e204247e5a", "an": {"p": [["Mereka", "他们"], ["ada di", "在（某地）"], ["Sulawesi Tenggara", "苏拉威西东南部"], ["Maluku Utara", "北马鲁古"], ["Aceh Jaya", "亚齐查亚"]], "b": "", "g": "ada + di + 地点 = 位于、生活在某地。三个地点并列：A, B, dan C。"}}, {"sp": "", "role": "r", "id": "Di Pulau Siompu, Sulawesi Tenggara: pada abad ke-16 Portugis datang ke Indonesia untuk berdagang rempah.", "zh": "在东南苏拉威西的 Siompu 岛：16世纪葡萄牙人来到印尼做香料生意。", "a": "de9c942156f8", "za": "d08d6fb68017", "an": {"p": [["Di Pulau Siompu", "在西奥姆普岛"], ["Sulawesi Tenggara", "苏拉威西东南部"], ["pada abad ke-16", "在 16 世纪"], ["Portugis", "葡萄牙人"], ["datang ke", "来到"], ["untuk berdagang", "为了做贸易"], ["rempah", "香料"]], "b": "abad = 世纪；berdagang = ber- + dagang", "g": "结构：地点：时间 + 主语 + 动词 + untuk + 动词。abad ke-16 = 第 16 世纪（ke- + 数字 = 第几）。冒号后面是对该地方的说明。"}}, {"sp": "", "role": "r", "id": "Bangsa Portugis menikah dengan keturunan bangsawan Wolio.", "zh": "葡萄牙人和 Wolio 贵族的后代通婚。", "a": "40ef5250ea54", "za": "732a8d89e30e", "an": {"p": [["Bangsa Portugis", "葡萄牙人"], ["menikah dengan", "和……结婚"], ["keturunan", "后代"], ["bangsawan", "贵族"], ["Wolio", "沃里奥（当地王国）"]], "b": "keturunan = turun + ke-…-an", "g": "menikah dengan + 人 = 和某人结婚。bangsa = 民族、国家的人民。keturunan bangsawan Wolio = 沃里奥贵族的后裔。"}}, {"sp": "", "role": "r", "id": "Dari sana lahirlah keturunan bermata biru dan berambut agak pirang.", "zh": "由此诞生了蓝眼睛、头发略带金色的后代。", "a": "8cc1391a395a", "za": "d619a1242569", "an": {"p": [["Dari sana", "从那里"], ["lahirlah", "诞生了"], ["keturunan", "后代"], ["bermata biru", "蓝眼睛的"], ["dan", "和"], ["berambut agak pirang", "头发略带金色"]], "b": "lahirlah = lahir + -lah；bermata = ber- + mata；berambut = ber- + rambut", "g": "倒装句：谓语 + -lah 在前，主语在后（lahirlah keturunan…），强调“诞生了……”。ber- + 身体部位 + 颜色 = 具有……的：bermata biru（蓝眼睛的），berambut pirang（金发的）。agak = 略微。"}}, {"sp": "", "role": "r", "id": "Di Halmahera Timur, Maluku Utara: Suku Lingon adalah salah satu suku minoritas di pulau ini.", "zh": "在北马鲁古的东哈马黑拉：Lingon 族是这个岛上的少数民族之一。", "a": "05e33ad9eced", "za": "17f2f130f8a6", "an": {"p": [["Di Halmahera Timur", "在东哈马黑拉"], ["Maluku Utara", "北马鲁古"], ["Suku Lingon", "林贡族"], ["adalah", "是"], ["salah satu", "其中之一"], ["suku minoritas", "少数民族"], ["di pulau ini", "在这个岛上"]], "b": "", "g": "salah satu + 名词 = ……之一。suku minoritas = 民族 + 少数。冒号引出对该地的说明。"}}, {"sp": "", "role": "r", "id": "Keberadaan Suku Lingon terancam akibat konflik dengan suku lain.", "zh": "由于和其他民族发生冲突，Lingon 族的生存受到威胁。", "a": "924420e211e4", "za": "6e9cb5e7fb74", "an": {"p": [["Keberadaan", "存在"], ["Suku Lingon", "林贡族"], ["terancam", "受到威胁"], ["akibat", "由于"], ["konflik", "冲突"], ["dengan suku lain", "和其他民族"]], "b": "keberadaan = ada + ke-…-an；terancam = ter- + ancam", "g": "结构：主语（名词化）+ terancam + akibat + 名词。keberadaan = 存在（ada 的名词形式）。terancam = 受到威胁。akibat + 名词 = 由于……造成。dengan + 对象 = 与……。"}}, {"sp": "", "role": "r", "id": "Di Lamno, Aceh Jaya: keturunan bermata biru ini awalnya merupakan hasil pernikahan antara tentara Portugis dan warga setempat.", "zh": "在亚齐查亚的 Lamno：这些蓝眼睛的后代最初是葡萄牙士兵和当地居民通婚的结果。", "a": "9565b1516799", "za": "88420109ded6", "an": {"p": [["Di Lamno, Aceh Jaya", "在亚齐查亚的拉姆诺"], ["keturunan bermata biru ini", "这些蓝眼睛的后裔"], ["awalnya", "最初"], ["merupakan", "是"], ["hasil pernikahan", "婚姻的结果"], ["antara … dan …", "……之间"], ["tentara Portugis", "葡萄牙士兵"], ["warga setempat", "当地居民"]], "b": "awalnya = awal + -nya；pernikahan = nikah + per-…-an；setempat = se- + tempat", "g": "结构：主语 + awalnya + merupakan + 名词短语。hasil pernikahan antara A dan B = A 和 B 婚姻的结果。antara A dan B = A 和 B 之间。awalnya = 起初、最初。"}}, {"sp": "", "role": "r", "id": "Saat itu, banyak tentara Portugis yang menjadi tawanan Kerajaan Daya.", "zh": "当时，很多葡萄牙士兵成了 Daya 王国的俘虏。", "a": "cdeb4f363cda", "za": "778aceb53886", "an": {"p": [["Saat itu", "那时"], ["banyak tentara Portugis", "很多葡萄牙士兵"], ["yang menjadi", "成为"], ["tawanan", "俘虏"], ["Kerajaan Daya", "达亚王国"]], "b": "tawanan = tawan + -an；kerajaan = raja 王 + ke-…-an", "g": "结构：时间 + banyak + 名词 + yang + 动词 + 宾语。banyak X yang + 动词 = 很多……（他们）……。menjadi + 名词 = 成为……。kerajaan = 王国。"}}, {"sp": "", "role": "r", "id": "Mereka tidak bisa kembali pulang ke Eropa, lalu menikah dengan warga lokal setempat.", "zh": "他们回不了欧洲，于是和当地人结了婚。", "a": "e373bec8e31e", "za": "dc1d1d3201f2", "an": {"p": [["Mereka", "他们"], ["tidak bisa", "不能"], ["kembali pulang", "返回"], ["ke Eropa", "到欧洲"], ["lalu", "然后"], ["menikah dengan", "和……结婚"], ["warga lokal setempat", "当地居民"]], "b": "", "g": "结构：主语 + tidak bisa + 动词 + 地点，lalu + 动词（省略主语）。kembali pulang = 回去（kembali 与 pulang 同义，叠用强调）。lalu 连接前后动作。"}}], "zh": "原来印尼也有蓝眼睛的原住民，分布在东南苏拉威西、北马鲁古和亚齐查亚。东南苏拉威西的西翁普岛：16 世纪葡萄牙人来印尼做香料贸易，与沃里奥贵族后代通婚，于是诞生了蓝眼睛、头发略带金色的后代。北马鲁古的东哈马黑拉：林贡族是岛上的少数民族之一，因与其他部族冲突，生存受到威胁。亚齐查亚的拉姆诺：这些蓝眼睛后代最初是葡萄牙士兵与当地人通婚的结果，当时许多葡萄牙士兵成了达亚王国的俘虏，回不了欧洲，就与当地人结了婚。", "note": "", "qa": [], "u": 10}, {"id": "c108", "kind": "culture", "book": "BIPA 2", "title": "Tohpati——印尼著名爵士吉他手", "lines": [{"sp": "", "role": "r", "id": "Tohpati Ario Hutomo atau yang lebih dikenal dengan Tohpati adalah seorang gitaris dan penulis lagu Indonesia.", "zh": "Tohpati Ario Hutomo，大家更熟悉的名字是 Tohpati，是一位印尼吉他手和词曲作者。", "a": "b304a590af2e", "za": "9141e316a278", "an": {"p": [["Tohpati Ario Hutomo", "人名（全名）"], ["atau", "或者"], ["yang lebih dikenal dengan Tohpati", "更为人所知的名字 Tohpati"], ["adalah", "是"], ["seorang", "一位"], ["gitaris", "吉他手"], ["dan", "和"], ["penulis lagu", "作曲家"], ["Indonesia", "印尼的"]], "b": "dikenal = di- + kenal；gitaris = gitar + -is；penulis = tulis + pen-", "g": "结构：主语（全名 + atau + yang 从句）+ adalah + seorang + 职业。atau yang lebih dikenal dengan … = 或者更常被称为……（插入的同位语）。seorang + 职业 = 一位……（se- + orang，用于人）。penulis lagu = 写歌的人。"}}, {"sp": "", "role": "r", "id": "Dia lahir di Jakarta, 25 Juli 1971.", "zh": "他1971年7月25日出生于雅加达。", "a": "c3113c87eb52", "za": "0a59211c1d68", "an": {"p": [["Dia", "他"], ["lahir", "出生"], ["di Jakarta", "在雅加达"], ["25 Juli 1971", "1971 年 7 月 25 日"]], "b": "", "g": "lahir di + 地点，日期。日期顺序：日 + 月 + 年（25 Juli 1971）。月份：Januari… Desember。"}}, {"sp": "", "role": "r", "id": "Tohpati merupakan salah satu gitaris jazz yang terkenal.", "zh": "Tohpati 是著名的爵士吉他手之一。", "a": "b387b8a6e6d6", "za": "8955eeb81d68", "an": {"p": [["Tohpati", "人名"], ["merupakan", "是"], ["salah satu", "其中之一"], ["gitaris jazz", "爵士吉他手"], ["yang terkenal", "有名的"]], "b": "terkenal = ter- + kenal", "g": "salah satu + 名词 + yang + 形容词 = 有名的……之一。merupakan = adalah（书面）。"}}, {"sp": "", "role": "r", "id": "Banyak karyanya memadukan elemen kebudayaan tradisional.", "zh": "他的很多作品融合了传统文化元素。", "a": "bf9b8a2df915", "za": "84b0ce6e43a5", "an": {"p": [["Banyak karyanya", "他的很多作品"], ["memadukan", "融合"], ["elemen", "元素"], ["kebudayaan tradisional", "传统文化"]], "b": "karyanya = karya + -nya；memadukan = padu + meN-…-kan；kebudayaan = budaya + ke-…-an", "g": "结构：Banyak + 名词-nya（他的很多……）作主语 + 动词 + 宾语。memadukan = 使融合、结合。karya = 作品。"}}, {"sp": "", "role": "r", "id": "Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "zh": "这和他努力在音乐中融合现代与传统元素是一致的。", "a": "a5ac7094c566", "za": "1b87912cb2b7", "an": {"p": [["Hal itu", "那件事"], ["sejalan dengan", "与……一致"], ["usahanya", "他的努力"], ["untuk memadukan", "为了融合"], ["unsur modern", "现代元素"], ["dan", "和"], ["unsur tradisional", "传统元素"], ["dalam musiknya", "在他的音乐中"]], "b": "sejalan = se- + jalan；usahanya = usaha + -nya；unsur = 元素", "g": "结构：Hal itu（指上一句）+ sejalan dengan + 名词（usahanya untuk + 动词…）。sejalan dengan = 与……一致、符合。usaha untuk + 动词 = 为……所做的努力。dalam musiknya = 在他的音乐里。"}}], "zh": "Tohpati Ario Hutomo，更为人熟知的名字是 Tohpati，是印尼吉他手和词曲作者，1971 年 7 月 25 日生于雅加达。他是著名的爵士吉他手之一，很多作品融合了传统文化元素，这和他在音乐中融合现代与传统的追求是一致的。", "note": "", "qa": [], "u": 1}, {"id": "c109", "kind": "culture", "book": "BIPA 2", "title": "印尼最热门的十种职业", "lines": [{"sp": "", "role": "r", "id": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari.", "zh": "工作是每个人满足日常生活需要的必需。", "a": "293cfc5078f4", "za": "77ccc4857ab9", "an": {"p": [["Bekerja", "工作"], ["merupakan", "是"], ["kebutuhan", "需要"], ["setiap orang", "每个人"], ["untuk memenuhi", "为了满足"], ["kebutuhan sehari-hari", "日常所需"]], "b": "memenuhi = penuh + meN-…-i；kebutuhan = butuh + ke-…-an", "g": "结构：动词做主语（Bekerja）+ merupakan + 名词 + untuk + 动词 + 宾语。memenuhi = 使……充足，满足。kebutuhan setiap orang = 每个人的需要。"}}, {"sp": "", "role": "r", "id": "Banyak orang mendapatkan pekerjaan sesuai dengan keinginannya, tetapi banyak juga yang memilih pekerjaan karena populer.", "zh": "很多人找到了自己想做的工作，但也有很多人因为热门才选择某个职业。", "a": "40d6f33a6b4c", "za": "2add3051af4f", "an": {"p": [["Banyak orang", "很多人"], ["mendapatkan", "得到"], ["pekerjaan", "工作"], ["sesuai dengan", "符合"], ["keinginannya", "他们的愿望"], ["tetapi", "但是"], ["banyak juga yang memilih", "也有很多人选择"], ["karena populer", "因为热门"]], "b": "keinginan = ingin + ke-…-an；mendapatkan = dapat + meN-…-kan", "g": "结构：句 1（主语 + 动词 + 宾语 + sesuai dengan + 名词）, tetapi 句 2（banyak juga yang + 动词 + 宾语 + karena + 形容词）。banyak (orang) yang + 动词 = 有很多人……。sesuai dengan keinginannya = 按照自己的愿望。"}}, {"sp": "", "role": "r", "id": "Berikut sepuluh pekerjaan yang paling populer di Indonesia berdasarkan survei tahun 2018: guru, pegawai bank, pegawai negeri sipil (PNS), tenaga pemasaran (marketing), tenaga kerja Indonesia (TKI), tenaga di bidang teknologi informasi, tenaga di bidang kesehatan seperti dokter atau apoteker, wartawan, akuntan, dan karyawan Badan Usaha Milik Negara (BUMN).", "zh": "根据2018年的调查，印尼最热门的十种职业是：教师、银行职员、公务员、市场营销人员、印尼海外劳工、信息技术人员、医疗人员（如医生或药剂师）、记者、会计和国企员工。", "a": "1cd0e1a76625", "za": "f01a776d09d0", "an": {"p": [["Berikut", "以下是"], ["sepuluh pekerjaan", "十种职业"], ["yang paling populer", "最热门的"], ["berdasarkan survei tahun 2018", "根据 2018 年的调查"], ["guru", "老师"], ["pegawai bank", "银行职员"], ["pegawai negeri sipil", "公务员"], ["tenaga pemasaran", "营销人员"], ["tenaga kerja Indonesia", "印尼劳务人员"], ["di bidang", "在……领域"], ["kesehatan", "健康、医疗"], ["dokter", "医生"], ["apoteker", "药剂师"], ["wartawan", "记者"], ["akuntan", "会计"], ["karyawan BUMN", "国有企业员工"]], "b": "berikut = ber- + ikut 跟随（“接下来的”）；berdasarkan = ber- + dasar 基础 + -kan；tenaga = 人力；bidang = 领域", "g": "结构：Berikut + 数量 + 名词 + yang paling + 形容词 + 地点 + berdasarkan + 依据：冒号 + 并列列举（A, B, C, … dan Z）。yang paling populer = 最热门的。berdasarkan + 名词 = 根据……。di bidang + 领域 = 在……方面。seperti dokter atau apoteker = 例如医生或药剂师。缩写：PNS、TKI、BUMN。"}}], "zh": "工作是每个人满足日常生活需要的方式。很多人找到了自己想做的工作，也有很多人因为某些职业热门而选择它。根据 2018 年的一项调查，印尼最热门的十种职业是：教师、银行职员、公务员、营销人员、海外劳工、信息技术人员、医疗人员（如医生、药剂师）、记者、会计师和国企员工。", "note": "", "qa": [], "u": 2}, {"id": "c110", "kind": "culture", "book": "BIPA 2", "title": "木梆 Kentongan", "lines": [{"sp": "", "role": "r", "id": "Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan.", "zh": "以前，在宣读通知之前，印尼人会先敲木梆。", "a": "e4db8afac134", "za": "42a09fa7e137", "an": {"p": [["Pada zaman dahulu", "在古时候"], ["sebelum", "在……之前"], ["membacakan", "宣读"], ["pengumuman", "通告"], ["masyarakat Indonesia", "印尼人"], ["lebih dahulu", "先"], ["memukul", "敲"], ["kentongan", "木梆"]], "b": "membacakan = baca + meN-…-kan；pengumuman = umum + pe-…-an；memukul = pukul + meN-", "g": "结构：时间状语 + sebelum + 动词短语，主句。sebelum + 动词 = 在做……之前。lebih dahulu = 先（提前做）。membacakan pengumuman = 宣读通告。"}}, {"sp": "", "role": "r", "id": "Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul.", "zh": "木梆的作用是吸引大家的注意，让人们聚过来。", "a": "5fdc8e0d0006", "za": "812e77ca4008", "an": {"p": [["Fungsi", "功能"], ["kentongan ini", "这个木梆"], ["adalah untuk", "是为了"], ["menarik perhatian", "吸引注意"], ["orang-orang", "人们"], ["supaya", "为了让"], ["berkumpul", "聚集"]], "b": "menarik = tarik + meN-；perhatian = hati…（注意）", "g": "结构：Fungsi + 名词 + adalah untuk + 动词 + 宾语 + supaya + 动词。Fungsi … adalah untuk … = ……的作用是为了……。supaya = agar，为了让。menarik perhatian = 吸引注意（字面“拉注意力”）。"}}, {"sp": "", "role": "r", "id": "Setelah orang-orang berkumpul, pengumuman disampaikan.", "zh": "大家聚齐后，再宣布通知。", "a": "1488763912fb", "za": "e0495fd3b372", "an": {"p": [["Setelah", "之后"], ["orang-orang berkumpul", "人们聚集"], ["pengumuman", "通告"], ["disampaikan", "被传达"]], "b": "disampaikan = di- + sampai + -kan", "g": "结构：Setelah + 完整小句，主句（被动）。disampaikan = 被传达、被告知（di-…-kan 被动，省略施事）。"}}, {"sp": "", "role": "r", "id": "Saat ini, kentongan masih dipakai di beberapa daerah di Indonesia.", "zh": "现在，印尼一些地区还在用木梆。", "a": "d13f61e0f624", "za": "dddb2548170f", "an": {"p": [["Saat ini", "现在"], ["kentongan", "木梆"], ["masih", "仍然"], ["dipakai", "被使用"], ["di beberapa daerah", "在一些地区"], ["di Indonesia", "在印尼"]], "b": "dipakai = di- + pakai", "g": "Saat ini = 此刻、现在。masih + 被动 = 仍被……。两个 di 短语连用：di beberapa daerah di Indonesia = 在印尼的一些地区。"}}], "zh": "古时候，印尼人宣读公告之前会先敲木梆，用来吸引大家注意、召集人们。人们聚齐后再宣布公告。现在印尼一些地区仍在使用木梆。", "note": "", "qa": [], "u": 3}, {"id": "c111", "kind": "culture", "book": "BIPA 2", "title": "网上购物", "lines": [{"sp": "", "role": "r", "id": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring).", "zh": "现在很多人喜欢用网购 App 买东西。", "a": "e95fd37e4ee6", "za": "bfdf8d01b5c9", "an": {"p": [["Pada zaman sekarang", "现在这个时代"], ["banyak orang", "很多人"], ["gemar", "喜欢"], ["berbelanja", "购物"], ["melalui", "通过"], ["aplikasi belanja", "购物应用"], ["dalam jaringan", "在线"], ["daring", "在线（缩写）"]], "b": "gemar = 爱好；berbelanja = ber- + belanja；daring = dalam jaringan 的缩写", "g": "结构：时间 + banyak orang + gemar + 动词 + melalui + 名词。gemar + 动词 = 喜欢做……（书面）。melalui + 名词 = 通过……（工具、渠道）。daring（dalam jaringan）= 在线，luring = 线下。"}}, {"sp": "", "role": "r", "id": "Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah.", "zh": "他们觉得用网购 App 买东西更方便。", "a": "935299d84d04", "za": "e594d74ef0b5", "an": {"p": [["Mereka", "他们"], ["menilai", "认为、评价"], ["bahwa", "（引出内容的连词）"], ["berbelanja", "购物"], ["melalui aplikasi daring", "通过在线应用"], ["lebih mudah", "更容易"]], "b": "menilai = nilai + meN-", "g": "结构：主语 + menilai + bahwa + 从句（berbelanja … lebih mudah）。bahwa = 引出宾语从句，相当于“……这件事”。动词做主语：berbelanja melalui aplikasi daring = 通过在线应用购物。"}}, {"sp": "", "role": "r", "id": "Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar.", "zh": "有了这种 App，买家不用去商店或市场。", "a": "f6e8b7592905", "za": "43fa676378e0", "an": {"p": [["Dengan aplikasi itu", "借助那个应用"], ["para pembeli", "买家们"], ["tidak perlu", "不需要"], ["datang ke", "来到"], ["toko", "商店"], ["atau", "或"], ["pasar", "市场"]], "b": "pembeli = beli + pem-", "g": "结构：Dengan + 名词（手段），主语 + tidak perlu + 动词。Dengan + 名词 = 借助、凭借……。tidak perlu + 动词 = 不需要做……。pembeli = 买的人。"}}, {"sp": "", "role": "r", "id": "Mereka hanya menunggu barang datang melalui jasa kurir.", "zh": "他们只要等快递把东西送来就行。", "a": "ee8b6f3429ba", "za": "4ef58f23a697", "an": {"p": [["Mereka", "他们"], ["hanya", "只"], ["menunggu", "等待"], ["barang", "东西、货物"], ["datang", "到来"], ["melalui jasa kurir", "通过快递服务"]], "b": "menunggu = tunggu + meN-；jasa = 服务；kurir = 快递员", "g": "结构：主语 + hanya + menunggu + 宾语 + 动词（barang datang，宾语 + 动作）。menunggu barang datang = 等货送来。melalui jasa kurir = 通过快递员的服务。"}}], "zh": "现在很多人喜欢用线上购物应用买东西，他们觉得网购更方便：买家不用去商店或市场，只要等快递把东西送来就行。", "note": "", "qa": [], "u": 4}, {"id": "c112", "kind": "culture", "book": "BIPA 2", "title": "仁当和炒饭", "lines": [{"sp": "", "role": "r", "id": "Cable News Network (CNN) telah merilis daftar lima puluh makanan terenak sedunia lewat 35.000 pilihan makanan di media sosial Facebook.", "zh": "美国有线电视新闻网（CNN）通过脸书上35000份美食投票，发布了世界最美味的五十种食物榜单。", "a": "730a07f64a18", "za": "42695402c681", "an": {"p": [["Cable News Network (CNN)", "有线电视新闻网"], ["telah", "已经"], ["merilis", "发布"], ["daftar", "名单"], ["lima puluh", "五十"], ["makanan terenak", "最好吃的食物"], ["sedunia", "全世界"], ["lewat", "通过"], ["35.000 pilihan makanan", "三万五千个美食选项"], ["di media sosial Facebook", "在社交媒体脸书上"]], "b": "merilis = rilis + meN-；terenak = ter- + enak；sedunia = se- + dunia", "g": "结构：主语 + telah + 动词 + 宾语（daftar + 数量 + 名词）+ lewat + 名词 + 地点。telah = sudah（已经，书面）。ter- + 形容词 = 最……：terenak = 最好吃的。se- + 名词 = 整个……：sedunia = 全世界。35.000 印尼语数字用句点分隔千位。lewat = 通过（= melalui）。"}}, {"sp": "", "role": "r", "id": "Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama.", "zh": "结果，西苏门答腊的仁当再次排名第一。", "a": "601c7c23dfc8", "za": "dafd6c5af431", "an": {"p": [["Hasilnya", "结果是"], ["rendang", "仁当（牛肉咖喱）"], ["khas Sumatera Barat", "西苏门答腊特色的"], ["kembali", "再次"], ["menduduki", "占据"], ["peringkat pertama", "第一名"]], "b": "hasilnya = hasil + -nya；menduduki = duduk + meN-…-i；peringkat = 名次", "g": "结构：Hasilnya（插入语，“结果”）+ 主语（名词 + khas + 地名）+ kembali + 动词 + 宾语。khas + 地名 = 某地特有的。menduduki = 坐上、占据（meN-…-i）。peringkat pertama = 第一名。"}}, {"sp": "", "role": "r", "id": "Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "zh": "有意思的是，CNN 公布的不只有仁当，炒饭也排在了第二名。", "a": "3ba0ce3aa190", "za": "c88ef508c889", "an": {"p": [["Menariknya", "有趣的是"], ["CNN", "（有线电视新闻网）"], ["melansir", "发布"], ["bukan hanya", "不仅"], ["rendang", "仁当"], ["tetapi juga", "而且"], ["nasi goreng", "炒饭"], ["menempati", "占据"], ["peringkat kedua", "第二名"]], "b": "menariknya = menarik + -nya；melansir = lansir + meN-；menempati = tempat + meN-…-i", "g": "结构：Menariknya（插入语）+ 主语 + 动词 + bukan hanya A, tetapi juga B + 动词短语。bukan hanya A, tetapi juga B = 不仅 A，而且 B。menariknya = 有趣的是（形容词 + -nya 做句首评论语）。kedua = 第二（ke- + 数字）。"}}], "zh": "美国有线电视新闻网（CNN）根据脸书上 35,000 个美食投票，发布了全球 50 种最美味食物榜单。结果，西苏门答腊的仁当再次名列第一。有意思的是，除了仁当，炒饭也排在了第二名。", "note": "", "qa": [], "u": 5}, {"id": "c113", "kind": "culture", "book": "BIPA 2", "title": "互助合作 Gotong Royong", "lines": [{"sp": "", "role": "r", "id": "Salah satu budaya masyarakat Indonesia adalah gotong royong.", "zh": "印尼人的文化之一是互助合作（gotong royong）。", "a": "244f3fb3511d", "za": "b8621f987c7f", "an": {"p": [["Salah satu budaya", "其中一种文化"], ["masyarakat Indonesia", "印尼社会"], ["adalah", "是"], ["gotong royong", "互助合作"]], "b": "", "g": "结构：Salah satu + 名词 + 修饰 + adalah + 名词。salah satu … adalah … = ……之一是……。gotong royong = 互助合作（共同出力）。"}}, {"sp": "", "role": "r", "id": "Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu.", "zh": "gotong royong 的意思是一起干活、互相帮助。", "a": "4945e5397f78", "za": "e44ec204f247", "an": {"p": [["Gotong royong", "互助合作"], ["berarti", "意思是"], ["bekerja bersama-sama", "一起工作"], ["tolong-menolong", "互相帮助"], ["bantu-membantu", "互相帮忙"]], "b": "bersama-sama = 一起（重叠）；tolong-menolong = 互相帮助", "g": "berarti + 解释 = 意思是……。重叠表示相互：tolong-menolong、bantu-membantu 都是“互相帮助”。三项并列：A, B, dan C。"}}, {"sp": "", "role": "r", "id": "Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu.", "zh": "互助活动通常在周末进行。", "a": "8813b40cfef1", "za": "d5261826f807", "an": {"p": [["Kegiatan gotong royong", "互助活动"], ["biasanya", "通常"], ["dilaksanakan", "被举行"], ["pada akhir minggu", "在周末"]], "b": "dilaksanakan = di- + laksana + -kan", "g": "结构：主语 + biasanya + 被动 + pada + 时间。dilaksanakan = 被执行、被举行。akhir minggu = 周末（= akhir pekan）。"}}, {"sp": "", "role": "r", "id": "Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "zh": "人们通常一起打扫环境、修建公共设施。", "a": "6b1aad8165f4", "za": "900990a5426e", "an": {"p": [["Masyarakat", "民众"], ["biasanya", "通常"], ["bergotong royong", "互助合作"], ["untuk membersihkan", "为了打扫"], ["lingkungan", "环境"], ["membangun", "建造"], ["fasilitas umum", "公共设施"]], "b": "bergotong royong = ber- + gotong royong；membangun = bangun + meN-", "g": "结构：主语 + 动词 + untuk + 动词 1 + 宾语 1 + dan + 动词 2 + 宾语 2。bergotong royong = 做互助（ber- + 名词）。fasilitas umum = 公共设施。"}}], "zh": "互助合作是印尼社会的一种文化，意思是大家一起干活、互相帮助。这类活动通常在周末进行，人们一起清扫环境、修建公共设施。", "note": "", "qa": [], "u": 6}, {"id": "c114", "kind": "culture", "book": "BIPA 2", "title": "无车日", "lines": [{"sp": "", "role": "r", "id": "Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day).", "zh": "印尼有无车日（Car Free Day）。", "a": "27e71171f0c7", "za": "c9ed3a4c744b", "an": {"p": [["Di Indonesia", "在印尼"], ["ada", "有"], ["hari bebas", "自由日、无……日"], ["kendaraan bermotor", "机动车"], ["Car Free Day", "无车日"]], "b": "bebas = 自由、免于；bermotor = ber- + motor", "g": "结构：地点 + ada + 名词。hari bebas + 名词 = 无……日。kendaraan bermotor = 机动车（ber- + motor，带发动机的）。"}}, {"sp": "", "role": "r", "id": "Acara itu biasanya dilaksanakan setiap hari Minggu pagi.", "zh": "这个活动通常在每个星期天早上举行。", "a": "d7f6ffd0fd29", "za": "83e79db0c461", "an": {"p": [["Acara itu", "那个活动"], ["biasanya", "通常"], ["dilaksanakan", "被举行"], ["setiap hari Minggu pagi", "每个星期天早上"]], "b": "", "g": "结构：主语 + biasanya + 被动 + setiap + 时间。setiap hari Minggu = 每个星期天（不是“每天”）。"}}, {"sp": "", "role": "r", "id": "Di beberapa jalan tertentu kendaraan bermotor dilarang melintas.", "zh": "在某些路段禁止机动车通行。", "a": "d2605b418c91", "za": "c729b07780e4", "an": {"p": [["Di beberapa jalan tertentu", "在某几条特定道路"], ["kendaraan bermotor", "机动车"], ["dilarang", "被禁止"], ["melintas", "通过"]], "b": "tertentu = ter- + tentu；dilarang = di- + larang；melintas = lintas + meN-", "g": "结构：地点 + 主语 + dilarang + 动词。dilarang + 动词 = 禁止做……（被禁止）。tertentu = 特定的。"}}, {"sp": "", "role": "r", "id": "Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga.", "zh": "在那里，有人聊天、摆摊、散步或者运动。", "a": "2c883c5e3b96", "za": "9dddb4df849f", "an": {"p": [["Di sana", "在那里"], ["orang-orang", "人们"], ["ada yang", "有的人"], ["mengobrol", "聊天"], ["berdagang", "做买卖"], ["berjalan-jalan", "散步"], ["atau", "或"], ["berolahraga", "运动"]], "b": "", "g": "ada yang + 动词 = 有的人（做）……。并列几个动作：A, B, C, atau D（“有的人……，有的人……”）。berjalan-jalan = 随便走走、逛。"}}, {"sp": "", "role": "r", "id": "Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda.", "zh": "这个活动上大家最喜欢的事之一是骑自行车。", "a": "06e344605f72", "za": "f22010c7f699", "an": {"p": [["Salah satu", "其中一个"], ["kegiatan favorit", "最喜欢的活动"], ["orang-orang", "人们"], ["pada acara itu", "在那个活动上"], ["adalah", "是"], ["bersepeda", "骑自行车"]], "b": "", "g": "结构：Salah satu + 名词 + 修饰（orang-orang）+ pada + 场合 + adalah + 动词。kegiatan favorit orang-orang = 人们最喜爱的活动。adalah 后面可以接动词（bersepeda）。"}}, {"sp": "", "role": "r", "id": "Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "zh": "因为没有机动车，他们可以悠闲地骑车。", "a": "dba6a7b91e9f", "za": "a8d14ee80552", "an": {"p": [["Mereka", "他们"], ["dapat", "能"], ["bersepeda", "骑自行车"], ["dengan santai", "悠闲地"], ["karena", "因为"], ["tidak ada", "没有"], ["kendaraan bermotor", "机动车"]], "b": "santai = 悠闲", "g": "结构：主句 + karena + tidak ada + 名词。dengan + 形容词 = ……地：dengan santai = 悠闲地。tidak ada + 名词 = 没有……。dapat = bisa（能）。"}}], "zh": "印尼有“无车日”（Car Free Day），通常在每个星期天上午。一些特定道路禁止机动车通行，人们在那里聊天、摆摊、散步或运动。最受欢迎的活动之一是骑自行车，因为没有机动车，大家可以悠闲地骑车。", "note": "", "qa": [], "u": 7}, {"id": "c115", "kind": "culture", "book": "BIPA 2", "title": "人力三轮车 Becak", "lines": [{"sp": "", "role": "r", "id": "Becak adalah salah satu sarana transportasi unik di Indonesia.", "zh": "三轮车（becak）是印尼一种独特的交通工具。", "a": "4478a128a4e7", "za": "2419a2bed131", "an": {"p": [["Becak", "人力三轮车"], ["adalah", "是"], ["salah satu", "其中之一"], ["sarana transportasi", "交通工具"], ["unik", "独特"], ["di Indonesia", "在印尼"]], "b": "sarana = 设施、工具；transportasi = 交通", "g": "结构：主语 + adalah + salah satu + 名词短语 + 形容词 + 地点。sarana transportasi = 交通工具（书面）。"}}, {"sp": "", "role": "r", "id": "Becak adalah kendaraan roda tiga.", "zh": "becak 是三个轮子的车。", "a": "654ab46560ff", "za": "d82b8544c8e5", "an": {"p": [["Becak", "人力三轮车"], ["adalah", "是"], ["kendaraan", "车辆"], ["roda", "轮子"], ["tiga", "三"]], "b": "", "g": "kendaraan roda tiga = 车 + 轮 + 三 = 三轮车。名词 + 名词 + 数字，核心词在前。"}}, {"sp": "", "role": "r", "id": "Pengayuh duduk di belakang, sedangkan penumpang duduk di depan.", "zh": "车夫坐在后面，乘客坐在前面。", "a": "450ea1d6b508", "za": "0824659888ff", "an": {"p": [["Pengayuh", "蹬车的人"], ["duduk", "坐"], ["di belakang", "在后面"], ["sedangkan", "而"], ["penumpang", "乘客"], ["di depan", "在前面"]], "b": "pengayuh = kayuh 蹬 + pe-；penumpang = tumpang + pe-", "g": "结构：A + 动词 + 地点，sedangkan B + 动词 + 地点。sedangkan = 而、然而（表示对比）。pe- + 动词 = 做该动作的人：pengayuh（蹬车的）、penumpang（乘车的）。"}}, {"sp": "", "role": "r", "id": "Becak biasanya ada di depan kompleks perumahan atau di depan pasar.", "zh": "becak 通常停在住宅区门口或市场门口。", "a": "b23a4c3dc27c", "za": "d129434e0f68", "an": {"p": [["Becak", "人力三轮车"], ["biasanya ada", "通常有"], ["di depan", "在……前面"], ["kompleks perumahan", "住宅小区"], ["atau", "或"], ["pasar", "市场"]], "b": "perumahan = rumah + per-…-an", "g": "结构：主语 + biasanya + ada + 地点 1 + atau + 地点 2。kompleks perumahan = 住宅区。atau 并列两个地点。"}}, {"sp": "", "role": "r", "id": "Ongkos naik becak berbeda-beda.", "zh": "坐三轮车的价钱不一样。", "a": "10345a1d436e", "za": "9b9153d4ad00", "an": {"p": [["Ongkos", "费用"], ["naik becak", "乘人力三轮车"], ["berbeda-beda", "各不相同"]], "b": "berbeda-beda = ber- + beda 重叠", "g": "结构：主语（名词 + 动词短语）+ 形容词。ongkos naik becak = 乘三轮车的费用。重叠 berbeda-beda = 各不相同、不固定。"}}, {"sp": "", "role": "r", "id": "Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "zh": "所以，乘客和车夫要先讲好价。", "a": "4e5653b9afdd", "za": "211296e2a5bc", "an": {"p": [["Oleh karena itu", "因此"], ["penumpang", "乘客"], ["dan", "和"], ["tukang becak", "三轮车夫"], ["harus", "必须"], ["membuat", "做出"], ["kesepakatan", "协议"]], "b": "tukang = 匠人；kesepakatan = sepakat 同意 + ke-…-an", "g": "结构：Oleh karena itu，主语（A dan B）+ harus + membuat + 名词。membuat kesepakatan = 达成协议（字面“做协议”）。tukang + 职业 = 做……的人：tukang becak。"}}], "zh": "Becak 是印尼一种独特的交通工具，是三轮车：车夫坐在后面蹬车，乘客坐在前面。Becak 通常停在住宅小区或市场门口。车费不固定，所以乘客和车夫要先讲好价钱。", "note": "", "qa": [], "u": 8}, {"id": "c116", "kind": "culture", "book": "BIPA 2", "title": "户外拓展 Mancakrida", "lines": [{"sp": "", "role": "r", "id": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida.", "zh": "在旅游景点常举办的活动之一是户外拓展训练（mancakrida）。", "a": "ba132c43e6ed", "za": "31a6a747416f", "an": {"p": [["Salah satu acara", "其中一种活动"], ["yang biasanya dilaksanakan", "通常会举办的"], ["di tempat wisata", "在旅游景点"], ["adalah", "是"], ["mancakrida", "户外拓展训练"]], "b": "", "g": "结构：Salah satu + 名词 + yang + 副词 + 被动 + 地点 + adalah + 名词。yang biasanya dilaksanakan di tempat wisata 修饰 acara：在景区通常举办的活动。mancakrida = 户外拓展（一种团队体验活动）。"}}, {"sp": "", "role": "r", "id": "Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi.", "zh": "参加这种活动的通常是家庭，或者某个公司、机构的员工。", "a": "136073c65777", "za": "9e7ca7a960f8", "an": {"p": [["Acara itu", "那种活动"], ["biasanya", "通常"], ["diikuti oleh", "由……参加"], ["keluarga", "家庭"], ["dan", "和"], ["pegawai", "职员"], ["di suatu kantor", "在某个单位"], ["atau", "或"], ["institusi", "机构"]], "b": "diikuti = di- + ikut + -i；suatu = 某一个", "g": "结构：主语 + 被动（diikuti）+ oleh + 施事。diikuti oleh = 被……参加（由……参加）。suatu + 名词 = 某一个……。"}}, {"sp": "", "role": "r", "id": "Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan.", "zh": "这个活动是为了训练各种技能。", "a": "fc5e084cebda", "za": "50640cc0ed55", "an": {"p": [["Kegiatan itu", "那个活动"], ["dilakukan", "被进行"], ["untuk melatih", "为了训练"], ["berbagai macam", "各种各样"], ["keterampilan", "技能"]], "b": "melatih = latih + meN-；keterampilan = terampil 熟练 + ke-…-an", "g": "结构：主语 + 被动 + untuk + 动词 + 宾语。dilakukan untuk + 动词 = 为了……而举行。berbagai macam + 名词 = 各种各样的……。"}}, {"sp": "", "role": "r", "id": "Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama.", "zh": "活动的重点是团队合作能力。", "a": "9a308a80d7a7", "za": "d79628ff5df9", "an": {"p": [["Keterampilan", "技能"], ["yang menjadi fokus", "成为重点的"], ["kegiatan itu", "那个活动"], ["adalah", "是"], ["keterampilan dalam bekerja sama", "合作方面的技能"]], "b": "", "g": "结构：名词 + yang + 动词短语（menjadi fokus kegiatan itu）+ adalah + 名词短语。yang menjadi fokus = 成为重点的。dalam + 动词 = 在……方面：keterampilan dalam bekerja sama = 合作方面的技能。"}}, {"sp": "", "role": "r", "id": "Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "zh": "在活动中，参加者可以边玩边练。", "a": "315bb84f232d", "za": "8c8fb93233e5", "an": {"p": [["Dalam kegiatan itu", "在那个活动中"], ["peserta", "参加者"], ["dapat", "能"], ["berlatih", "练习"], ["sambil", "一边"], ["bersenang-senang", "玩得开心"]], "b": "peserta = 参加者；berlatih = ber- + latih；bersenang-senang = ber- + senang 重叠", "g": "结构：dalam + 名词，主语 + dapat + 动词 + sambil + 动词。sambil bersenang-senang = 一边玩得开心。berlatih = 练习（不及物）。"}}], "zh": "在旅游景点常举办的一种活动是户外拓展，参加者通常是家庭或某单位的员工，目的是锻炼各种能力，重点是团队合作能力。参加者可以边练边玩。", "note": "", "qa": [], "u": 9}, {"id": "c117", "kind": "culture", "book": "BIPA 2", "title": "刮痧 Kerokan", "lines": [{"sp": "", "role": "r", "id": "Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan.", "zh": "印尼的传统疗法之一是刮痧（kerokan）。", "a": "f212b0955e16", "za": "a721202d7816", "an": {"p": [["Salah satu", "其中之一"], ["pengobatan tradisional", "传统疗法"], ["yang ada di Indonesia", "存在于印尼的"], ["adalah", "是"], ["kerokan", "刮痧（印尼式）"]], "b": "pengobatan = obat 药 + peng-…-an", "g": "结构：Salah satu + 名词 + yang ada di + 地点 + adalah + 名词。yang ada di Indonesia = 在印尼有的。pengobatan = 治疗方法。kerokan（刮痧）用硬币等刮背部。"}}, {"sp": "", "role": "r", "id": "Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh.", "zh": "刮痧是一种用钝的东西在身上刮的治疗方法。", "a": "cb362f0fc433", "za": "ff892ea0caad", "an": {"p": [["Kerokan", "刮痧"], ["adalah", "是"], ["suatu metode", "一种方法"], ["pengobatan", "治疗"], ["dengan cara", "用……的方式"], ["menggesekkan", "摩擦、刮"], ["benda tumpul", "钝的物体"], ["pada tubuh", "在身体上"]], "b": "menggesekkan = gesek + meN-…-kan；tumpul = 钝；tubuh = 身体", "g": "结构：主语 + adalah + suatu + 名词 + dengan cara + 动词 + 宾语 + pada + 部位。dengan cara + 动词 = 通过……的方式。menggesekkan A pada B = 把 A 在 B 上摩擦。suatu metode = 一种方法。"}}, {"sp": "", "role": "r", "id": "Cara itu dipercaya dapat menyembuhkan masuk angin, nyeri otot, perut kembung, mual, sakit kepala, dan meriang.", "zh": "人们相信这种方法能治伤风、肌肉酸痛、肚子胀、恶心、头疼和发冷。", "a": "bdaad17ba981", "za": "8e011594ca19", "an": {"p": [["Cara itu", "那种方法"], ["dipercaya", "被相信"], ["dapat menyembuhkan", "能治愈"], ["masuk angin", "着凉"], ["nyeri otot", "肌肉痛"], ["perut kembung", "腹胀"], ["mual", "恶心"], ["sakit kepala", "头痛"], ["meriang", "发冷发热"]], "b": "dipercaya = di- + percaya；menyembuhkan = sembuh 痊愈 + meN-…-kan", "g": "结构：主语 + dipercaya + dapat + 动词 + 一串宾语。dipercaya + 动词短语 = 被认为（人们相信）能……。menyembuhkan = 使痊愈（治好）。症状并列：A, B, C, D, E, dan F。masuk angin 字面“风进入”，指着凉不适。"}}], "zh": "刮痧是印尼的一种传统疗法，用钝器在身上刮擦。人们相信它能治着凉、肌肉酸痛、腹胀、恶心、头痛和发冷发热。", "note": "", "qa": [], "u": 10}, {"id": "e118", "kind": "exam", "book": "扩充题库", "title": "口语对答 · 工作 Pekerjaan", "lines": [{"sp": "考官", "role": "q", "id": "Apa pekerjaan Anda?", "zh": "你是做什么工作的？", "a": "961a38e07431", "za": "2e16304018a8"}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai staf keuangan di perusahaan.", "zh": "我在公司做财务。", "a": "27e45e47d4a8", "za": "bbe262a0e96b"}, {"sp": "考官", "role": "q", "id": "Di mana Anda bekerja?", "zh": "你在哪里工作？", "a": "67f6175476b0", "za": "29bc966aa41d"}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja di kawasan industri di Morowali.", "zh": "我在莫罗瓦利的工业园区工作。", "a": "73bbdfdc3d6b", "za": "268836c6aba5"}, {"sp": "考官", "role": "q", "id": "Pukul berapa Anda mulai bekerja?", "zh": "你几点开始上班？", "a": "8ba3b0a01cf3", "za": "1c7a0f9e7fed"}, {"sp": "参考回答", "role": "a", "id": "Saya mulai bekerja pukul delapan pagi.", "zh": "我早上八点开始上班。", "a": "10810e28654a", "za": "40f613eafaf1"}, {"sp": "考官", "role": "q", "id": "Apakah pekerjaan Anda sibuk?", "zh": "你的工作忙吗？", "a": "732a1e9e06f3", "za": "bc3941c49027"}, {"sp": "参考回答", "role": "a", "id": "Ya, cukup sibuk, terutama pada awal bulan.", "zh": "是的，挺忙的，尤其是月初。", "a": "fb70f09e0858", "za": "50856680d94c"}, {"sp": "考官", "role": "q", "id": "Apakah Anda suka pekerjaan Anda?", "zh": "你喜欢你的工作吗？", "a": "8f095eaf772b", "za": "2cd1f522e9fc"}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka karena saya bisa belajar banyak hal.", "zh": "喜欢，因为我能学到很多东西。", "a": "afbed9c27cc4", "za": "ec0f4bc87f9b"}, {"sp": "考官", "role": "q", "id": "Bagaimana rekan kerja Anda?", "zh": "你的同事怎么样？", "a": "9b08f0633ff8", "za": "3f6145a53be1"}, {"sp": "参考回答", "role": "a", "id": "Rekan kerja saya baik dan suka membantu.", "zh": "我的同事人很好，也乐于帮忙。", "a": "aef86cd405ad", "za": "e9d1ac7174e6"}], "zh": "", "note": "", "qa": []}, {"id": "e119", "kind": "exam", "book": "扩充题库", "title": "口语对答 · 学印尼语 Belajar Bahasa Indonesia", "lines": [{"sp": "考官",
