note": "", "qa": []}];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IC = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  spk: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
const HINT = {
  exam: "考官（男声）问，参考回答（女声）答。点 <b>▶</b> 后每个问题之间会停几秒，<b>请你先开口回答</b>，再听参考答案。",
  trans: "听一句印尼语，<b>自己说出中文意思</b>，再点开文字核对。对应考试的“印尼语翻译中文”。",
  dlg: "课本里的对话，男女角色分别用男声、女声。建议先不看文字听两遍，再逐句对照。",
  text: "课文朗读。先听全文，再点开印尼语和中文；下面还有问答可以练。",
  culture: "印尼文化短文，适合泛听。"
};
const bookCls = b => b === "武功秘籍" ? "wg" : b === "BIPA 2" ? "b2" : b === "Daring" ? "dr" : "";

let store = {};
try { store = JSON.parse(localStorage.getItem("listen-v1") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("listen-v1", JSON.stringify(store)); } catch (e) {} };
store.done = store.done || {};
let kind = store.kind || "exam", book = store.book || "", showId = !!store.showId, showZh = !!store.showZh, pause = store.pause || 6;

function setSeg(sel, attr, val) { document.querySelectorAll(sel + " button").forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === val)); }

const GROUPS = [["武功秘籍", "武功秘籍", "考试回忆原题"], ["BIPA 1", "BIPA 1 课本", "含 Daring 原版"], ["BIPA 2", "BIPA 2 课本", ""]];
const grpOf = b => b === "Daring" ? "BIPA 1" : b;
function renderList() {
  setSeg("#kinds", "k", kind);
  $("#kindHint").innerHTML = HINT[kind];
  let html = "";
  for (const [key, name, sub] of GROUPS) {
    const rows = DATA.filter(it => it.kind === kind && grpOf(it.book) === key);
    if (!rows.length) continue;
    html += `<h2 class="grp">${name}<small>${sub ? sub + " · " : ""}${rows.length} 段</small></h2>`;
    html += rows.map(it => {
      const n = it.kind === "exam" ? it.lines.length / 2 + " 问" : it.lines.length + " 句";
      return `<button class="card glass" type="button" data-open="${it.id}"><div><div class="t">${esc(it.title)}</div><div class="m">${n}${it.qa.length ? " · 带问答 " + it.qa.length + " 题" : ""}</div></div><div class="go">${store.done[it.id] ? '<span class="done">✓ 听过</span>' : ""}<span class="pbtn">${IC.play}</span></div></button>`;
    }).join("");
  }
  $("#list").innerHTML = html;
}

// ---------- player state
const au = $("#au");
let cur = null, queue = [], qi = -1, playing = false, loop = false, timer = null;

function wordLinks(t) {
  return esc(t).replace(/[A-Za-z]+(?:-[A-Za-z]+)*/g, w => `<a href="dict.html#${w.toLowerCase()}" target="_blank" rel="noopener">${w}</a>`);
}
function lineHTML(l, k) {
  const spCls = l.role === "q" ? "q" : l.role === "a" ? "a" : "";
  const sp = l.sp ? `<div class="sp ${spCls}">${esc(l.sp)}</div>` : "";
  return `<div class="ln glass" data-k="${k}"><button class="lp" type="button" data-one="${k}" aria-label="播放这一句">${IC.spk}</button>${sp}<div class="id ${showId ? "" : "hid"}" data-rev>${wordLinks(l.id)}</div>${l.zh ? `<div class="zh ${showZh ? "" : "hid"}" data-rev>${esc(l.zh)}</div>` : ""}</div>`;
}

function openItem(id, autoplay) {
  cur = DATA.find(x => x.id === id); if (!cur) return;
  stop();
  queue = cur.lines.map((l, i) => ({ a: l.a, k: "L" + i, role: l.role }));
  let html = `<button class="back" type="button" data-back>‹ 返回列表</button>
  <div class="dh"><span class="book ${bookCls(cur.book)}">${esc(cur.book)}</span><h2>${esc(cur.title)}</h2><div class="m">${HINT[cur.kind].replace(/<[^>]+>/g, "")}</div></div>
  <div class="opts">
    <button class="tog" type="button" data-opt="id" aria-pressed="${showId}">显示印尼语</button>
    <button class="tog" type="button" data-opt="zh" aria-pressed="${showZh}">显示中文</button>
    ${cur.kind === "exam" ? `<button class="tog" type="button" data-opt="pause" aria-pressed="true">答题停顿 ${pause} 秒</button>` : ""}
  </div>
  <div class="lines">${cur.lines.map((l, i) => lineHTML(l, "L" + i)).join("")}</div>`;
  if (cur.zh) html += `<div class="para glass"><b>中文翻译</b><div class="zh ${showZh ? "" : "hid"}" data-rev>${esc(cur.zh)}</div></div>`;
  if (cur.note) html += `<p class="note">${esc(cur.note)}</p>`;
  if (cur.qa.length) {
    html += `<div class="qa"><h3>听问题，开口回答</h3><div class="lines">` + cur.qa.map((q, i) =>
      lineHTML({ sp: "问题", role: "q", id: q.q, zh: "", a: q.qa }, "Q" + i) + lineHTML({ sp: "参考回答", role: "a", id: q.a, zh: "", a: q.aa }, "A" + i)).join("") + `</div></div>`;
    cur.qa.forEach((q, i) => { queue.push({ a: q.qa, k: "Q" + i, role: "q" }); queue.push({ a: q.aa, k: "A" + i, role: "a" }); });
  }
  $("#detail").innerHTML = html;
  $("#home").hidden = true; $("#detail").hidden = false; $("#player").hidden = false;
  document.querySelectorAll(".seg").forEach(x => x.hidden = true);
  $("#nowTitle").textContent = cur.title;
  window.scrollTo({ top: 0 });
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  updPos();
  if (autoplay) playFrom(0);
}
function back() {
  stop(); cur = null;
  $("#detail").hidden = true; $("#home").hidden = false; $("#player").hidden = true;
  document.querySelectorAll(".seg").forEach(x => x.hidden = false);
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  renderList();
}

function mark(k) {
  document.querySelectorAll(".ln.cur").forEach(e => e.classList.remove("cur"));
  const el = document.querySelector(`.ln[data-k="${k}"]`);
  if (el) { el.classList.add("cur"); el.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function updPos() {
  $("#play").innerHTML = playing ? IC.pause : IC.play;
  $("#nowPos").textContent = qi >= 0 ? `第 ${Math.min(qi + 1, queue.length)} / ${queue.length} 句` : `共 ${queue.length} 句`;
}
function playClip(i) {
  clearTimeout(timer);
  qi = i; const q = queue[i]; if (!q) return finish();
  mark(q.k); updPos();
  au.src = "audio/" + q.a + ".mp3";
  au.playbackRate = SPEEDS[spI][0];
  au.play().catch(() => { playing = false; updPos(); });
}
function playFrom(i) { playing = true; playClip(i); }
function stop() { playing = false; clearTimeout(timer); au.pause(); document.querySelectorAll(".count").forEach(c => c.remove()); updPos(); }
function finish() {
  playing = false; updPos();
  if (cur) { store.done[cur.id] = 1; save(); }
}
au.addEventListener("ended", () => {
  if (!playing) return;
  if (loop) { timer = setTimeout(() => playClip(qi), 900); return; }
  const q = queue[qi], nx = queue[qi + 1];
  if (!nx) return finish();
  let gap = cur.kind === "dlg" ? 500 : 700;
  if (q.role === "q" && nx.role === "a") gap = pause * 1000;
  if (cur.kind === "trans") gap = 4000;
  if (gap >= 3000) countdown(q.k, gap);
  timer = setTimeout(() => { document.querySelectorAll(".count").forEach(c => c.remove()); playClip(qi + 1); }, gap);
});
function countdown(k, ms) {
  const el = document.querySelector(`.ln[data-k="${k}"] .sp`) || document.querySelector(`.ln[data-k="${k}"] .id`);
  if (!el) return;
  const c = document.createElement("span"); c.className = "count"; el.appendChild(c);
  let s = Math.round(ms / 1000);
  const tick = () => { if (!c.isConnected) return; c.textContent = " " + s + "s"; if (s-- > 0) setTimeout(tick, 1000); };
  tick();
}

// ---------- events
document.addEventListener("click", ev => {
  const t = ev.target;
  const k = t.closest("[data-k]:not(.ln)")?.dataset.k;
  if (t.closest("#kinds") && k) { kind = k; store.kind = k; save(); return renderList(); }
  const o = t.closest("[data-open]"); if (o) return openItem(o.dataset.open, true);
  if (t.closest("[data-back]")) return back();
  const one = t.closest("[data-one]");
  if (one) { const i = queue.findIndex(q => q.k === one.dataset.one); if (i >= 0) { playing = true; playClip(i); } return; }
  const opt = t.closest("[data-opt]");
  if (opt) {
    const v = opt.dataset.opt;
    if (v === "id") { showId = !showId; store.showId = showId; opt.setAttribute("aria-pressed", showId); document.querySelectorAll(".id").forEach(e => e.classList.toggle("hid", !showId)); }
    if (v === "zh") { showZh = !showZh; store.showZh = showZh; opt.setAttribute("aria-pressed", showZh); document.querySelectorAll(".zh").forEach(e => e.classList.toggle("hid", !showZh)); }
    if (v === "pause") { pause = pause >= 12 ? 3 : pause + 3; store.pause = pause; opt.textContent = `答题停顿 ${pause} 秒`; }
    save(); return;
  }
  const rev = t.closest("[data-rev].hid");
  if (rev) { ev.preventDefault(); rev.classList.remove("hid"); }
});
$("#play").addEventListener("click", () => { if (playing) stop(); else playFrom(qi >= 0 && qi < queue.length ? qi : 0); });
$("#prev").addEventListener("click", () => { playing = true; playClip(Math.max(0, qi - 1)); });
$("#next").addEventListener("click", () => { playing = true; playClip(Math.min(queue.length - 1, qi + 1)); });
$("#loop").addEventListener("click", e => { loop = !loop; e.currentTarget.setAttribute("aria-pressed", loop); });
const SPEEDS = [[0.6, "很慢"], [0.72, "慢"], [0.85, "正常"], [1, "快"]];
let spI = SPEEDS.findIndex(x => String(x[0]) === String(store.speed2)); if (spI < 0) spI = 2;
$("#speed").textContent = SPEEDS[spI][1];
$("#speed").addEventListener("click", () => { spI = (spI + 1) % SPEEDS.length; $("#speed").textContent = SPEEDS[spI][1]; au.playbackRate = SPEEDS[spI][0]; store.speed2 = SPEEDS[spI][0]; save(); });
au.preservesPitch = true;

const start = location.hash.slice(1);
renderList();
if (start && DATA.some(x => x.id === start)) openItem(start, false);
</script>
</html>
