"zh": "你早上通常做什么？", "a": "432fcb753b92", "za": "d858da4d6a6d"}, {"sp": "参考回答", "role": "a", "id": "Pada pagi hari saya biasanya mandi, sarapan, lalu pergi ke kantor.", "zh": "早上我通常洗澡、吃早饭，然后去办公室。", "a": "ae5c94359c8e", "za": "4da10ca780aa"}, {"sp": "考官", "role": "q", "id": "Apa yang Anda lakukan jika teman kerja Anda tidak mengerti perkataan Anda?", "zh": "如果同事听不懂你说的话，你会怎么做？", "a": "09b6c9694e4b", "za": "8ba47054d571"}, {"sp": "参考回答", "role": "a", "id": "Saya akan menjelaskan lagi dengan pelan-pelan, atau memakai aplikasi terjemahan.", "zh": "我会慢慢再解释一遍，或者用翻译软件。", "a": "3b7cdf39bf15", "za": "e94499c4e8d7"}, {"sp": "考官", "role": "q", "id": "Apa pekerjaan Anda?", "zh": "你的职业是什么？", "a": "961a38e07431", "za": "2e16304018a8"}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai staf keuangan.", "zh": "我是财务人员。", "a": "190dfb43d749", "za": "885326965c97"}, {"sp": "考官", "role": "q", "id": "Bisakah Anda menyebutkan satu hobi Anda?", "zh": "你能说一个你的爱好吗？", "a": "aa738473e629", "za": "04843a03b6ec"}, {"sp": "参考回答", "role": "a", "id": "Salah satu hobi saya adalah main bulu tangkis.", "zh": "我的爱好之一是打羽毛球。", "a": "06617ec11f91", "za": "a782f25c33ae"}, {"sp": "考官", "role": "q", "id": "Apa yang biasanya Anda lakukan di tempat kerja?", "zh": "你在工作的地方通常做什么？", "a": "3111bd152676", "za": "7526d9cd39e6"}, {"sp": "参考回答", "role": "a", "id": "Di tempat kerja, saya biasanya membuat laporan dan memeriksa dokumen.", "zh": "在单位我通常做报表、检查文件。", "a": "bce3bf1a06e3", "za": "a1c165de89e2"}, {"sp": "考官", "role": "q", "id": "Apa yang biasanya Anda lakukan setelah bangun tidur?", "zh": "你起床后通常做什么？", "a": "381d97a2a6e2", "za": "d4be86a92b88"}, {"sp": "参考回答", "role": "a", "id": "Setelah bangun tidur, saya minum air putih lalu mandi.", "zh": "起床后我先喝白开水，然后洗澡。", "a": "2883e207a8da", "za": "2480970ab3d7"}, {"sp": "考官", "role": "q", "id": "Apakah Anda suka menonton televisi? Acara apa yang Anda suka?", "zh": "你喜欢看电视吗？喜欢什么节目？", "a": "7471d804d111", "za": "41b0977e6cf8"}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka menonton televisi. Saya suka menonton berita dan film.", "zh": "喜欢，我喜欢看新闻和电影。", "a": "6c7143fcb25b", "za": "b0e671b3b724"}, {"sp": "考官", "role": "q", "id": "Apa yang Anda lakukan untuk belajar bahasa Indonesia dengan lebih baik?", "zh": "为了把印尼语学得更好，你会做什么？", "a": "b5ee14bbb944", "za": "7cfc312f741d"}, {"sp": "参考回答", "role": "a", "id": "Saya sering berbicara dengan teman kerja orang Indonesia dan mendengarkan lagu Indonesia.", "zh": "我常和印尼同事说话，听印尼歌。", "a": "2a2008e635ce", "za": "caa2a704887d"}, {"sp": "考官", "role": "q", "id": "Apakah Anda sering membantu membersihkan rumah?", "zh": "你经常帮忙打扫房子吗？", "a": "1809b53936fa", "za": "ee2cabd3b63b"}, {"sp": "参考回答", "role": "a", "id": "Ya, saya sering membantu membersihkan rumah pada akhir pekan.", "zh": "是的，我周末经常帮忙打扫。", "a": "975060babcdc", "za": "e9b3dd8c60b3"}, {"sp": "考官", "role": "q", "id": "Pukul berapa Anda biasanya makan malam bersama keluarga?", "zh": "你通常几点和家人一起吃晚饭？", "a": "eb48be6de26f", "za": "c69a38053f53"}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya makan malam bersama keluarga pukul tujuh malam.", "zh": "我通常晚上七点和家人一起吃晚饭。", "a": "0ea0a473d7f7", "za": "023717b85451"}], "zh": "", "note": "", "qa": [], "hide": 1}, {"id": "t144", "kind": "trans", "book": "模拟练习", "title": "互译 10 句 1", "lines": [{"sp": "", "role": "t", "id": "Kami belajar bersama di kelas dan saling membantu.", "zh": "我们在课堂上一起学习并互相帮助。", "a": "6d70bc39aa70", "za": "dfb06e2b071d", "an": {"p": [["Kami", "我们"], ["belajar bersama", "一起学习"], ["di kelas", "在课堂上"], ["dan", "并且"], ["saling membantu", "互相帮助"]], "b": "saling 互相；membantu = bantu + meN-", "g": "saling + 动词 = 互相……。dan 连接两个并列的动作。"}}, {"sp": "", "role": "t", "id": "Kadang-kadang saya membersihkan kamar agar lingkungan belajar nyaman.", "zh": "有时候我打扫房间，让学习环境舒适。", "a": "eed9f96f7c46", "za": "512305ae5ede", "an": {"p": [["Kadang-kadang", "有时"], ["membersihkan", "打扫"], ["kamar", "房间"], ["agar", "为了让"], ["lingkungan belajar", "学习环境"], ["nyaman", "舒适"]], "b": "membersihkan = bersih + meN-…-kan；lingkungan = lingkung + -an", "g": "agar + 主语 + 形容词 = 为了让……怎么样。lingkungan belajar = 环境 + 学习（名词 + 动词做修饰）。"}}, {"sp": "", "role": "t", "id": "Dia belajar di perpustakaan karena di sana sangat tenang.", "zh": "他在图书馆学习，因为那里很安静。", "a": "1b1b66be053d", "za": "fe53b4065acc", "an": {"p": [["Dia", "他"], ["belajar", "学习"], ["di perpustakaan", "在图书馆"], ["karena", "因为"], ["di sana", "在那里"], ["sangat tenang", "非常安静"]], "b": "sana 那边（远指），sini 这边，situ 那边（近指）", "g": "di sana = 在那里，用来回指前面提到的地点，避免重复名词。karena 后接完整的小句。"}}, {"sp": "", "role": "t", "id": "Karena sangat lelah, saya tidur lebih awal dari biasanya.", "zh": "因为身体很累，我比平常睡得早。", "a": "e291a514ffba", "za": "9f302a226ba4", "an": {"p": [["Karena", "因为"], ["sangat lelah", "非常累"], ["tidur", "睡觉"], ["lebih awal", "更早"], ["dari biasanya", "比平常"]], "b": "lelah 累；awal 开始、早", "g": "比较：lebih + 形容词 + dari + 比较对象 = 比……更……。dari biasanya = 比平常。"}}, {"sp": "", "role": "t", "id": "Pada malam hari kami sekeluarga duduk bersama menonton televisi.", "zh": "晚上我们一家人坐在一起看电视。", "a": "cc057b54f889", "za": "dcb5a749380a", "an": {"p": [["Pada malam hari", "在晚上"], ["kami", "我们"], ["sekeluarga", "一家人"], ["duduk bersama", "坐在一起"], ["menonton televisi", "看电视"]], "b": "sekeluarga = se- + keluarga（同一个家）", "g": "se- + 名词 = 同一个……：sekeluarga 一家人，sekelas 同班。duduk bersama menonton = 坐在一起看。"}}, {"sp": "", "role": "t", "id": "Saya membuat sarapan di dapur pagi ini, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "a": "4dcdbbb18c1b", "za": "19569032fe8a", "an": {"p": [["Saya", "我"], ["membuat sarapan", "做早餐"], ["di dapur", "在厨房"], ["pagi ini", "今天早上"], ["lalu", "然后"], ["pergi ke sekolah", "去学校"]], "b": "membuat = buat + meN-", "g": "时间词 pagi ini 也可以放句尾。lalu 连接先后发生的两个动作。"}}, {"sp": "", "role": "t", "id": "Kami berencana liburan ke Indonesia bulan depan.", "zh": "我们计划下个月去印尼度假。", "a": "d957e33375fb", "za": "42f19b16bbaf", "an": {"p": [["Kami", "我们"], ["berencana", "计划"], ["liburan", "度假"], ["ke Indonesia", "去印度尼西亚"], ["bulan depan", "下个月"]], "b": "berencana = ber- + rencana；liburan = libur 假期 + -an", "g": "liburan 在这里作动词用，口语常说“去度假”。berencana + 动词 = 计划做……。"}}, {"sp": "", "role": "t", "id": "Saya biasanya bermain basket dengan teman pada akhir pekan.", "zh": "我通常周末和朋友打篮球。", "a": "8d9c5a694875", "za": "a9a6aa82eb9c", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["bermain basket", "打篮球"], ["dengan teman", "和朋友"], ["pada akhir pekan", "在周末"]], "b": "biasanya = biasa 习惯 + -nya", "g": "dengan + 人 = 和某人（同 bersama）。pada + 时间 = 在……时候。"}}, {"sp": "", "role": "t", "id": "Saya tidak bisa pergi bersama mereka karena hari ini saya masih harus bekerja.", "zh": "我不能和他们一起去，因为我今天还要工作。", "a": "c03b13873d1d", "za": "92f05a2371be", "an": {"p": [["tidak bisa", "不能"], ["pergi", "去"], ["bersama mereka", "和他们一起"], ["karena", "因为"], ["hari ini", "今天"], ["masih harus", "还得"], ["bekerja", "工作"]], "b": "", "g": "tidak bisa + 动词 = 不能……。masih harus 把“仍然”和“必须”叠加。"}}, {"sp": "", "role": "t", "id": "Saya tinggal di tempat yang sangat tenang dan nyaman.", "zh": "我住在一个非常安静、舒适的地方。", "a": "5969a7a423e0", "za": "8f9ef201e49b", "an": {"p": [["tinggal", "住"], ["di tempat", "在地方"], ["yang", "……的"], ["sangat tenang", "非常安静"], ["dan", "和"], ["nyaman", "舒适"]], "b": "tempat 地方", "g": "yang 引出修饰成分：tempat yang tenang = 安静的地方。tenang dan nyaman 两个形容词并列，共用 sangat。"}}], "zh": "", "note": "", "qa": [], "hide": 1}, {"id": "t145", "kind": "trans", "book": "模拟练习", "title": "互译 10 句 2", "lines": [{"sp": "", "role": "t", "id": "Saya sering belajar bersama teman di perpustakaan pada sore hari.", "zh": "我经常下午和朋友一起在图书馆学习。", "a": "1da4fea69275", "za": "811ddfcbaf2b", "an": {"p": [["sering", "经常"], ["belajar", "学习"], ["bersama teman", "和朋友一起"], ["di perpustakaan", "在图书馆"], ["pada sore hari", "在下午"]], "b": "belajar = ber- + ajar；perpustakaan = per-…-an + pustaka 书", "g": "pada + 时间 = 在……的时候。bersama + 人 = 和某人一起。副词 sering 在动词前。"}}, {"sp": "", "role": "t", "id": "Saya biasanya membawa botol minum sendiri karena tidak mau membeli air di luar.", "zh": "我通常自己带水杯，因为不想在外面买水。", "a": "a91b39e83b56", "za": "0d0ff4867d4f", "an": {"p": [["biasanya", "通常"], ["membawa", "带"], ["botol minum", "水杯"], ["sendiri", "自己"], ["tidak mau", "不想"], ["membeli air", "买水"], ["di luar", "在外面"]], "b": "botol 瓶，minum 喝", "g": "botol minum = 喝水的瓶子（名词 + 动词做修饰）。sendiri 放在句中表示“自己（独自）”。mau = 想要/愿意。"}}, {"sp": "", "role": "t", "id": "Teman saya sangat rajin dan suka belajar.", "zh": "我的朋友很勤奋，喜欢学习。", "a": "c3dc711f7102", "za": "a2fda0d82598", "an": {"p": [["Teman saya", "我的朋友"], ["sangat rajin", "非常勤奋"], ["dan", "并且"], ["suka belajar", "喜欢学习"]], "b": "rajin 勤奋", "g": "形容词可直接做谓语，不需要 adalah。dan 连接两个谓语，共用同一个主语。"}}, {"sp": "", "role": "t", "id": "Saya tidak bisa pergi bersama mereka karena hari ini saya masih harus bekerja.", "zh": "我不能和他们一起去，因为我今天还要工作。", "a": "081e7b8457ab", "za": "92f05a2371be", "an": {"p": [["tidak bisa", "不能"], ["pergi", "去"], ["bersama mereka", "和他们一起"], ["karena", "因为"], ["hari ini", "今天"], ["masih harus", "还得"], ["bekerja", "工作"]], "b": "", "g": "tidak bisa + 动词 = 不能……。masih harus 把“仍然”和“必须”叠加。"}}, {"sp": "", "role": "t", "id": "Setiap hari sebelum keluar rumah, saya memeriksa ponsel dan kunci.", "zh": "我每天出门前都会检查手机和钥匙。", "a": "3ed76ab53510", "za": "275b3c83b873", "an": {"p": [["Setiap hari", "每天"], ["sebelum", "在……之前"], ["keluar rumah", "出门"], ["memeriksa", "检查"], ["ponsel", "手机"], ["kunci", "钥匙"]], "b": "memeriksa = periksa + meN-", "g": "sebelum + 动词 = ……之前。keluar rumah = 出门（不是 keluar pintu）。"}}, {"sp": "", "role": "t", "id": "Dia ingin bekerja di Indonesia setelah lulus.", "zh": "他想毕业以后在印尼工作。", "a": "67ef216b9a5c", "za": "78699218257e", "an": {"p": [["Dia", "他"], ["ingin", "想"], ["bekerja", "工作"], ["di Indonesia", "在印度尼西亚"], ["setelah", "之后"], ["lulus", "毕业"]], "b": "lulus 毕业 / 通过", "g": "ingin + 动词 = 想做……。setelah + 动词 = ……之后。lulus 单独使用就是“毕业”。"}}, {"sp": "", "role": "t", "id": "Saya biasanya mematikan lampu sebelum meninggalkan kamar.", "zh": "我通常离开房间前关灯。", "a": "5352a784aa05", "za": "4be15885946c", "an": {"p": [["biasanya", "通常"], ["mematikan", "关掉"], ["lampu", "灯"], ["sebelum", "在……之前"], ["meninggalkan", "离开"], ["kamar", "房间"]], "b": "mematikan = mati + meN-…-kan；meninggalkan = tinggal + meN-…-kan", "g": "mematikan = 使熄灭（关）。meninggalkan = 留下、离开某处。关灯是 mematikan lampu，开灯是 menyalakan lampu。"}}, {"sp": "", "role": "t", "id": "Di kelas, kami belajar mendengar, berbicara, membaca, dan menulis.", "zh": "在课堂上，我们学习听、说、读、写。", "a": "a37a597d7132", "za": "53129aba41ae", "an": {"p": [["Di kelas", "在课堂上"], ["kami", "我们"], ["belajar", "学习"], ["mendengar", "听"], ["berbicara", "说"], ["membaca", "读"], ["menulis", "写"]], "b": "mendengar（dengar）、membaca（baca）、menulis（tulis）；berbicara = ber- + bicara", "g": "地点短语放句首后用逗号。并列动词：A, B, C, dan D（最后一个前加 dan）。"}}, {"sp": "", "role": "t", "id": "Karena hari ini hujan, saya tidak pergi ke sekolah.", "zh": "因为今天下雨，我没去学校。", "a": "e798a8d1908d", "za": "a0361e9e94c5", "an": {"p": [["Karena", "因为"], ["hari ini", "今天"], ["hujan", "下雨"], ["saya tidak pergi", "我不去"], ["ke sekolah", "到学校"]], "b": "", "g": "hujan 既是名词“雨”也是动词“下雨”，不需要再加其他动词。从句 + 逗号 + 主句。"}}, {"sp": "", "role": "t", "id": "Saya sedang mencari dokumen yang diperlukan untuk pekerjaan hari ini.", "zh": "我正在找今天工作需要的文件。", "a": "b8b64daf835c", "za": "5358390bbabc", "an": {"p": [["sedang", "正在"], ["mencari", "寻找"], ["dokumen", "文件"], ["yang diperlukan", "需要的"], ["untuk pekerjaan hari ini", "用于今天的工作"]], "b": "mencari = cari + meN-；pekerjaan = kerja + pe-…-an", "g": "sedang + 动词 = 正在做……。yang + 被动 = “被需要的”，修饰 dokumen。pekerjaan = 工作（名词），bekerja = 工作（动词）。"}}], "zh": "", "note": "", "qa": [], "hide": 1}, {"id": "t146", "kind": "trans", "book": "模拟练习", "title": "互译 10 句 3", "lines": [{"sp": "", "role": "t", "id": "Saya pergi ke pasar bersama teman untuk membeli buah.", "zh": "我和朋友去市场买水果。", "a": "d2a20804ad32", "za": "82d80ab46629", "an": {"p": [["pergi ke pasar", "去市场"], ["bersama teman", "和朋友一起"], ["untuk", "为了"], ["membeli", "买"], ["buah", "水果"]], "b": "membeli = beli + meN-", "g": "pergi ke + 地点 + untuk + 动词 = 去某地做某事。buah 既是“水果”也是“果实”。"}}, {"sp": "", "role": "t", "id": "Saya tinggal di tempat yang sangat tenang dan nyaman.", "zh": "我住在一个非常安静和舒适的地方。", "a": "5969a7a423e0", "za": "8f9ef201e49b", "an": {"p": [["tinggal", "住"], ["di tempat", "在地方"], ["yang", "……的"], ["sangat tenang", "非常安静"], ["dan", "和"], ["nyaman", "舒适"]], "b": "tempat 地方", "g": "yang 引出修饰成分：tempat yang tenang = 安静的地方。tenang dan nyaman 两个形容词并列，共用 sangat。"}}, {"sp": "", "role": "t", "id": "Kami belajar bersama di kelas dan saling membantu.", "zh": "我们在课堂上一起学习并互相帮助。", "a": "6d70bc39aa70", "za": "dfb06e2b071d", "an": {"p": [["Kami", "我们"], ["belajar bersama", "一起学习"], ["di kelas", "在课堂上"], ["dan", "并且"], ["saling membantu", "互相帮助"]], "b": "saling 互相；membantu = bantu + meN-", "g": "saling + 动词 = 互相……。dan 连接两个并列的动作。"}}, {"sp": "", "role": "t", "id": "Setiap hari sebelum keluar rumah, saya memeriksa ponsel dan kunci.", "zh": "我每天出门前都会检查手机和钥匙。", "a": "5029704adf6f", "za": "275b3c83b873", "an": {"p": [["Setiap hari", "每天"], ["sebelum", "在……之前"], ["keluar rumah", "出门"], ["memeriksa", "检查"], ["ponsel", "手机"], ["kunci", "钥匙"]], "b": "memeriksa = periksa + meN-", "g": "sebelum + 动词 = ……之前。keluar rumah = 出门（不是 keluar pintu）。"}}, {"sp": "", "role": "t", "id": "Kakak perempuan saya sedang memasak di dapur.", "zh": "我姐姐正在厨房做饭。", "a": "b0e944732121", "za": "cf7f7029701f", "an": {"p": [["Kakak perempuan", "姐姐"], ["saya", "我的"], ["sedang", "正在"], ["memasak", "做饭"], ["di dapur", "在厨房"]], "b": "memasak = masak + meN-", "g": "kakak = 哥哥/姐姐，加 perempuan（女）或 laki-laki（男）说明性别。"}}, {"sp": "", "role": "t", "id": "Karena saya sakit, saya tidak pergi ke sekolah hari ini.", "zh": "因为我生病了，所以今天没有去学校。", "a": "349c4ecdcfa9", "za": "ecd0012e2c2b", "an": {"p": [["Karena", "因为"], ["saya sakit", "我生病"], ["saya tidak pergi", "我没去"], ["ke sekolah", "到学校"], ["hari ini", "今天"]], "b": "sakit 病、痛", "g": "原因从句有完整的主语和谓语：saya sakit。时间词 hari ini 放句尾也可以。tidak 否定动词。"}}, {"sp": "", "role": "t", "id": "Saya bangun pagi jam enam setiap hari, lalu mandi dan sarapan.", "zh": "我每天早上六点起床，然后洗澡、吃早饭。", "a": "7efeb2a61f83", "za": "aa3fa7d1a02b", "an": {"p": [["bangun pagi", "早上起床"], ["jam enam", "六点"], ["setiap hari", "每天"], ["lalu", "然后"], ["mandi", "洗澡"], ["sarapan", "吃早饭"]], "b": "sarapan 早饭（动词/名词）", "g": "连续动作：A, lalu B dan C。sarapan 既是名词“早饭”，也是动词“吃早饭”。"}}, {"sp": "", "role": "t", "id": "Dia tinggal di Jakarta, dekat dengan sekolah dan kantor.", "zh": "他住在雅加达，离学校和办公室很近。", "a": "3cc0153c7a41", "za": "7d9fcf1dad42", "an": {"p": [["Dia", "他"], ["tinggal", "住"], ["di Jakarta", "在雅加达"], ["dekat dengan", "靠近"], ["sekolah", "学校"], ["kantor", "办公室"]], "b": "", "g": "dekat dengan + 名词 = 靠近……，后接并列的两个名词用 dan。"}}, {"sp": "", "role": "t", "id": "Saya suka mendengarkan musik karena membuat saya senang.", "zh": "我喜欢听音乐，因为它让我开心。", "a": "48a65ce1d95d", "za": "618b34a65764", "an": {"p": [["suka", "喜欢"], ["mendengarkan musik", "听音乐"], ["karena", "因为"], ["membuat saya senang", "让我开心"], ["senang", "开心"]], "b": "membuat = buat + meN-", "g": "membuat + 人 + 形容词 = 使某人……：membuat saya senang。senang 也有“喜欢”的意思（senang makan）。"}}, {"sp": "", "role": "t", "id": "Guru mengajar kami dengan sangat sabar di kelas.", "zh": "老师在课堂上非常耐心地教我们。", "a": "982842757af2", "za": "423fe3c22296", "an": {"p": [["Guru", "老师"], ["mengajar", "教"], ["kami", "我们"], ["dengan sangat sabar", "非常耐心地"], ["di kelas", "在课堂上"]], "b": "mengajar = ajar + meN-；sabar 耐心", "g": "mengajar 后面直接接对象（kami）。dengan + 形容词 = ……地。"}}], "zh": "", "note": "", "qa": [], "hide": 1}, {"id": "e147", "kind": "exam", "book": "模拟练习", "title": "新题 · 面试题 1–10（做饭 / 爱好 / 食物）", "lines": [{"sp": "考官", "role": "q", "id": "Apakah anda bisa memasak?", "zh": "你会做饭吗？", "a": "82212ebf2cbd", "an": {"p": [["Apakah", "是否（疑问词）"], ["anda", "您"], ["bisa", "会、能"], ["memasak", "做饭"]], "b": "memasak = meN- + masak（vi. 煮、做饭）", "g": "结构：Apakah + 主语 + bisa + 动词？Apakah 放句首把陈述句变成是非问句，答“Ya / Tidak”。bisa = 能、会（有能力）。"}}, {"sp": "参考回答", "role": "a", "id": "Ya, saya bisa memasak. Tidak, saya tidak bisa memasak.", "zh": "是的，我会做饭。/ 不，我不会做饭。", "a": "d41e5be747fb", "an": {"p": [["Ya", "是"], ["saya", "我"], ["bisa", "会"], ["memasak", "做饭"], ["Tidak", "不"], ["tidak bisa", "不会"]], "b": "memasak = meN- + masak", "g": "结构：两种答法：肯定 Ya, 主语 + bisa + 动词；否定 Tidak, 主语 + tidak bisa + 动词。否定动词、助动词用 tidak。"}}, {"sp": "考官", "role": "q", "id": "Apakah anda bisa melahirkan?", "zh": "你会生孩子吗？", "a": "4348e3f8c538", "an": {"p": [["Apakah", "是否"], ["anda", "您"], ["bisa", "能"], ["melahirkan", "生（孩子）"]], "b": "melahirkan = meN- + lahir + -kan（vt. 使出生 → 生孩子）", "g": "结构：Apakah + 主语 + bisa + 动词？lahir（vi. 出生）+ -kan 变成及物：使出生，即“生孩子”。这是考官的玩笑题，答案要明确说不能。"}}, {"sp": "参考回答", "role": "a", "id": "Tidak, saya tidak bisa melahirkan.", "zh": "不，我不能生孩子。", "a": "b176de446e2d", "an": {"p": [["Tidak", "不"], ["saya", "我"], ["tidak bisa", "不能"], ["melahirkan", "生孩子"]], "b": "", "g": "结构：Tidak, 主语 + tidak bisa + 动词。回答里第一个 Tidak 是“不”，第二个 tidak 是否定助动词 bisa。"}}, {"sp": "考官", "role": "q", "id": "Biasanya di rumah kamu siapa yang masak?", "zh": "在家里一般是谁做饭？", "a": "7355cbbbfbec", "za": "6cf424b826b8", "an": {"p": [["Biasanya", "通常"], ["di rumah kamu", "在你家"], ["siapa", "谁"], ["yang masak", "做饭的"]], "b": "biasanya = biasa（adj. 通常）+ -nya", "g": "结构：Biasanya + 地点 + siapa yang + 动词？“siapa yang + 动词” = 谁……（问做动作的人），回答用 yang 强调：Ibu saya yang memasak。"}}, {"sp": "参考回答", "role": "a", "id": "Biasanya ibu saya yang memasak di rumah.", "zh": "一般是我妈妈在家做饭。", "a": "ec551636dafd", "an": {"p": [["Biasanya", "通常"], ["ibu saya", "我妈妈"], ["yang memasak", "是做饭的"], ["di rumah", "在家"]], "b": "memasak = meN- + masak", "g": "结构：Biasanya + 人 + yang + 动词 + 地点。“人 + yang + 动词” 是强调做动作的人：是妈妈在做饭（而不是别人）。"}}, {"sp": "考官", "role": "q", "id": "Dengan siapa biasanya anda menghabiskan waktu luang?", "zh": "你空闲时间通常和谁一起度过？", "a": "725577f9618c", "an": {"p": [["Dengan siapa", "和谁"], ["biasanya", "通常"], ["anda", "您"], ["menghabiskan", "度过、花掉"], ["waktu luang", "空闲时间"]], "b": "menghabiskan = meN- + habis + -kan（vt. 使用完 → 度过）；luang = adj. 空闲", "g": "结构：Dengan siapa + 副词 + 主语 + 动词 + 宾语？疑问短语 dengan siapa 提到句首。waktu luang = 空闲时间。"}}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya menghabiskan waktu luang bersama teman saya.", "zh": "我空闲时间一般和我的朋友一起度过。", "a": "cdd1fcf7ffa0", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["menghabiskan", "度过"], ["waktu luang", "空闲时间"], ["bersama", "一起"], ["teman saya", "我的朋友"]], "b": "bersama = ber- + sama（adv. 一起）", "g": "结构：主语 + 副词 + 动词 + 宾语 + bersama + 人。bersama + 人 = 和某人一起，与 dengan 同义但更书面。"}}, {"sp": "考官", "role": "q", "id": "Apakah anda suka mendengarkan musik? Musik Tiongkok apa?", "zh": "你喜欢听音乐吗？喜欢什么中文音乐？", "a": "9918f642b18c", "an": {"p": [["Apakah", "是否"], ["anda", "您"], ["suka", "喜欢"], ["mendengarkan", "听"], ["musik", "音乐"], ["Tiongkok", "中国"], ["apa", "什么"]], "b": "mendengarkan = meN- + dengar + -kan（vt. 认真听）", "g": "结构：两个问题。第一问：Apakah + 主语 + suka + 动词 + 宾语？第二问：Musik + 国家 + apa? = 什么（国家的）音乐，apa 放在被问名词后。mendengarkan 指“听某物”，dengar 只是“听见”。"}}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka mendengarkan musik. Saya suka lagu Mandarin yang lembut.", "zh": "是的，我喜欢听音乐。我喜欢柔和的中文歌。", "a": "7490839572ce", "an": {"p": [["Ya", "是"], ["saya", "我"], ["suka", "喜欢"], ["mendengarkan", "听"], ["musik", "音乐"], ["lagu", "歌"], ["Mandarin", "普通话"], ["yang lembut", "柔和的"]], "b": "mendengarkan = meN- + dengar + -kan；lembut = adj. 柔和", "g": "结构：Ya, 主语 + suka + 动词 + 宾语。第二句：主语 + suka + 名词 + yang + 形容词。yang lembut 修饰 lagu Mandarin，意为“柔和的中文歌”。"}}, {"sp": "考官", "role": "q", "id": "Apa makanan kesukaan atau favorit anda?", "zh": "你最喜欢什么食物？（炒饭、炒面、肉丸、炸豆腐）", "a": "340b549c901b", "an": {"p": [["Apa", "什么"], ["makanan", "食物"], ["kesukaan", "喜好"], ["atau", "或"], ["favorit", "最爱"], ["anda", "您"]], "b": "makanan = makan + -an（n. 食物）；kesukaan = ke- + suka + -an（n. 喜好）", "g": "结构：Apa + 名词 + 修饰词 + anda？kesukaan 和 favorit 同义，二选一说明。makanan kesukaan = 喜爱的食物。"}}, {"sp": "参考回答", "role": "a", "id": "Makanan favorit saya adalah nasi goreng.", "zh": "我最喜欢的食物是炒饭。", "a": "ade6c3c3055a", "za": "896fd2ba8348", "an": {"p": [["Makanan", "食物"], ["favorit", "最爱"], ["saya", "我"], ["adalah", "是"], ["nasi goreng", "炒饭"]], "b": "makanan = makan + -an", "g": "结构：主语（Makanan favorit saya）+ adalah + 名词。adalah 连接两个名词。其他答案可换成 mi goreng 炒面、bakso 肉丸、tahu goreng 炸豆腐。"}}, {"sp": "考官", "role": "q", "id": "Anda lebih suka makan di restoran atau di kantin?", "zh": "你更喜欢在餐厅吃饭还是食堂？", "a": "00351084407a", "an": {"p": [["Anda", "您"], ["lebih", "更"], ["suka", "喜欢"], ["makan", "吃"], ["di restoran", "在餐厅"], ["atau", "还是"], ["di kantin", "在食堂"]], "b": "", "g": "结构：主语 + lebih + 动词 + A atau B？lebih suka = 更喜欢（比较），atau 在问句里表示“还是”，让对方二选一。"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka makan di kantin, harganya lebih murah.", "zh": "我更喜欢在食堂吃，价格更便宜。", "a": "aeb821233518", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["makan", "吃"], ["di kantin", "在食堂"], ["harganya", "它的价格"], ["lebih murah", "更便宜"]], "b": "harganya = harga（n. 价格）+ -nya", "g": "结构：主语 + lebih suka + 动词 + 地点, 原因（harganya lebih murah）。第二个分句直接说明理由，不用 karena。-nya 指“食堂的”。"}}, {"sp": "考官", "role": "q", "id": "Anda biasanya minum teh atau kopi?", "zh": "你平时喝茶还是咖啡？", "a": "a9760c70a792", "an": {"p": [["Anda", "您"], ["biasanya", "通常"], ["minum", "喝"], ["teh", "茶"], ["atau", "还是"], ["kopi", "咖啡"]], "b": "", "g": "结构：主语 + biasanya + 动词 + A atau B？二选一问句，也可以不加 Apakah，靠语调表示疑问。"}}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya minum teh.", "zh": "我平时喝茶。", "a": "8945f66dd75f", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["minum", "喝"], ["teh", "茶"]], "b": "", "g": "结构：主语 + biasanya + 动词 + 宾语。选一个回答即可。"}}, {"sp": "考官", "role": "q", "id": "Saya belum paham, bisakah anda mengulangi penjelasannya?", "zh": "还不明白，你可以重复一遍说明吗？", "a": "221c9e3029e7", "an": {"p": [["Saya", "我"], ["belum", "尚未"], ["paham", "明白"], ["bisakah", "能不能"], ["anda", "您"], ["mengulangi", "重复"], ["penjelasannya", "它的说明"]], "b": "bisakah = bisa + -kah（疑问）；mengulangi = meN- + ulang + -i（vt. 重复）；penjelasan = pe- + jelas + -an（n. 说明）", "g": "结构：Saya belum paham, + bisakah + 主语 + 动词 + 宾语？-kah 加在助动词后，把句子变成礼貌的请求。belum paham = 还没听懂，是课堂常用句。"}}, {"sp": "参考回答", "role": "a", "id": "Baik, saya akan mengulanginya lagi.", "zh": "好的，我再重复一次。", "a": "3cc0bc7d7637", "an": {"p": [["Baik", "好的"], ["saya", "我"], ["akan", "将"], ["mengulanginya", "重复它"], ["lagi", "再"]], "b": "mengulanginya = meN- + ulang + -i + -nya（-nya = 它，指那段说明）", "g": "结构：Baik, 主语 + akan + 动词 + 宾语（-nya）+ lagi。-nya 作宾语，代替前面提到的 penjelasan。lagi = 再一次。"}}, {"sp": "考官", "role": "q", "id": "Malam ini ada acara apa? Kami ada acara perusahaan Jumat sore ini.", "zh": "今晚有什么活动？我们周五下午有公司活动。", "a": "ab6a1e6ffca0", "an": {"p": [["Malam ini", "今晚"], ["ada", "有"], ["acara", "活动"], ["apa", "什么"], ["Kami", "我们"], ["acara perusahaan", "公司活动"], ["Jumat", "星期五"], ["sore", "下午"], ["ini", "这个"]], "b": "", "g": "结构：问句 Malam ini ada acara apa?（今晚有什么活动？）；陈述句 Kami ada acara perusahaan Jumat sore ini（我们这周五下午有公司活动）。ada 在这里 = 有。Jumat sore ini = 这个周五的下午。"}}, {"sp": "参考回答", "role": "a", "id": "Malam ini saya tidak ada acara. Acara perusahaan kalian pasti seru.", "zh": "今晚我没有活动。你们的公司活动一定很有趣。", "a": "def840432e49", "an": {"p": [["Malam ini", "今晚"], ["saya", "我"], ["tidak ada", "没有"], ["acara", "活动"], ["Acara perusahaan", "公司活动"], ["kalian", "你们"], ["pasti", "一定"], ["seru", "精彩有趣"]], "b": "", "g": "结构：时间 + 主语 + tidak ada + 名词；名词短语 + pasti + 形容词。tidak ada = 没有。kalian = 你们，比 Anda 更随意。seru 是口语“有趣、热闹”。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-23", "hide": 1}, {"id": "e148", "kind": "exam", "book": "模拟练习", "title": "新题 · TEST 3 朋友 1–10", "lines": [{"sp": "考官", "role": "q", "id": "Apakah temanmu akan membantumu saat kamu kesulitan?", "zh": "遇到困难的时候，你的朋友会帮助你吗？", "a": "5ef7158e757b", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["akan", "会"], ["membantumu", "帮助你"], ["saat", "当……时"], ["kamu", "你"], ["kesulitan", "困难"]], "b": "temanmu = teman + -mu（你的）；membantumu = meN- + bantu + -mu（-mu = 你，作宾语）；kesulitan = ke- + sulit + -an（n. 困难）", "g": "结构：Apakah + 主语 + akan + 动词 + 宾语 + saat + 从句？-mu 是 kamu 的缩写后缀：名词后表“你的”，动词后表“你”。saat + 主语 + kesulitan = 在你遇到困难时。"}}, {"sp": "参考回答", "role": "a", "id": "Ya, dia selalu bersedia membantu saya.", "zh": "会的，他总是愿意帮助我。", "a": "c027a1f6b63c", "an": {"p": [["Ya", "是的"], ["dia", "他"], ["selalu", "总是"], ["bersedia", "愿意"], ["membantu", "帮助"], ["saya", "我"]], "b": "bersedia = ber- + sedia（adj. 愿意）；membantu = meN- + bantu", "g": "结构：Ya, 主语 + selalu + bersedia + 动词 + 宾语。bersedia + 动词 = 愿意做某事。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu suka berkomunikasi dengan orang lain?", "zh": "你的朋友喜欢和别人交流吗？", "a": "511177347962", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["suka", "喜欢"], ["berkomunikasi", "交流"], ["dengan", "与"], ["orang lain", "别人"]], "b": "berkomunikasi = ber- + komunikasi（vi. 沟通）", "g": "结构：Apakah + 主语 + suka + 动词 + dengan + 对象？berkomunikasi dengan = 与……沟通。orang lain = 别人（其他的人）。"}}, {"sp": "参考回答", "role": "a", "id": "Dia ekstrovert, suka berbicara dengan semua orang.", "zh": "他很外向，喜欢和大家交流。", "a": "402560f9eb1c", "an": {"p": [["Dia", "他"], ["ekstrovert", "外向"], ["suka", "喜欢"], ["berbicara", "说话"], ["dengan", "和"], ["semua orang", "所有人"]], "b": "berbicara = ber- + bicara（vi. 说话）", "g": "结构：主语 + 形容词, suka + 动词 + dengan + 对象。逗号后面补充说明：外向的表现。ekstrovert 的反义词是 introvert 内向。"}}, {"sp": "考官", "role": "q", "id": "Apakah beban kerja temanmu berat?", "zh": "你的朋友工作压力大吗？", "a": "0f7430bc16a3", "an": {"p": [["Apakah", "是否"], ["beban kerja", "工作负担"], ["temanmu", "你的朋友"], ["berat", "重、大"]], "b": "beban = n. 负担；berat = adj. 重", "g": "结构：Apakah + 主语 + 形容词？beban kerja temanmu = 你朋友的工作负担。berat 本意“重”，这里引申为“压力大”。"}}, {"sp": "参考回答", "role": "a", "id": "Beban kerjanya agak berat, tapi dia tidak takut lelah.", "zh": "他的工作压力有点大，但是他不怕辛苦。", "a": "c43d4a82c310", "an": {"p": [["Beban kerjanya", "他的工作负担"], ["agak", "有点"], ["berat", "重"], ["tapi", "但是"], ["dia", "他"], ["tidak takut", "不怕"], ["lelah", "累"]], "b": "beban kerjanya = beban kerja + -nya", "g": "结构：主语 + agak + 形容词, tapi + 主语 + tidak + 动词 + 宾语。agak = 有点、稍微。tapi 是 tetapi 的口语形式。takut + 形容词 = 怕……（累）。"}}, {"sp": "考官", "role": "q", "id": "Apa yang paling kamu sukai dari temanmu?", "zh": "你最喜欢朋友身上哪一点？", "a": "86c28f135e71", "an": {"p": [["Apa", "什么"], ["yang", "……的"], ["paling", "最"], ["kamu", "你"], ["sukai", "喜欢"], ["dari", "从"], ["temanmu", "你的朋友"]], "b": "sukai = suka + -i（vt. 喜欢某物）", "g": "结构：Apa yang + paling + 主语 + 动词原形 + dari + 对象？“Apa yang + 主语 + 动词” = 什么是你……的。yang 从句里动词不加 meN-（kamu sukai）。dari temanmu = 在你朋友身上。"}}, {"sp": "参考回答", "role": "a", "id": "Saya paling suka dia jujur dan tepat waktu.", "zh": "我最喜欢他诚实、守时。", "a": "733f68033708", "an": {"p": [["Saya", "我"], ["paling", "最"], ["suka", "喜欢"], ["dia", "他"], ["jujur", "诚实"], ["dan", "和"], ["tepat waktu", "守时"]], "b": "tepat = adj. 准确；waktu = n. 时间", "g": "结构：主语 + paling suka + 从句（dia jujur dan tepat waktu）。suka 后面可以直接接一个小句：喜欢他诚实又守时。tepat waktu = 准时。"}}, {"sp": "考官", "role": "q", "id": "Bagaimana sifat temanmu?", "zh": "你的朋友性格怎么样？", "a": "6bbe8cf16a91", "an": {"p": [["Bagaimana", "怎么样"], ["sifat", "性格"], ["temanmu", "你的朋友"]], "b": "sifat = n. 性格", "g": "结构：Bagaimana + 名词？问“……怎么样”。sifat = 性格、特点。"}}, {"sp": "参考回答", "role": "a", "id": "Teman saya sabar dan suka membantu orang lain.", "zh": "我的朋友很耐心，乐于助人。", "a": "9730ec3e131a", "an": {"p": [["Teman saya", "我的朋友"], ["sabar", "有耐心"], ["dan", "和"], ["suka", "喜欢"], ["membantu", "帮助"], ["orang lain", "别人"]], "b": "membantu = meN- + bantu", "g": "结构：主语 + 形容词 + dan + suka + 动词 + 宾语。suka membantu = 乐于助人。形容词作谓语，不用 adalah。"}}, {"sp": "考官", "role": "q", "id": "Jam berapa temanmu biasanya mulai bekerja?", "zh": "你的朋友平时几点上班？", "a": "84b3ab3b8829", "an": {"p": [["Jam berapa", "几点"], ["temanmu", "你的朋友"], ["biasanya", "通常"], ["mulai", "开始"], ["bekerja", "工作"]], "b": "bekerja = ber- + kerja（vi. 工作）", "g": "结构：Jam berapa + 主语 + 副词 + mulai + 动词？问钟点用 Jam berapa / Pukul berapa。mulai + 动词 = 开始做某事。"}}, {"sp": "参考回答", "role": "a", "id": "Dia mulai bekerja jam delapan pagi setiap hari.", "zh": "他每天早上八点上班。", "a": "4461bd5d32c1", "an": {"p": [["Dia", "他"], ["mulai", "开始"], ["bekerja", "工作"], ["jam delapan", "八点"], ["pagi", "早上"], ["setiap hari", "每天"]], "b": "bekerja = ber- + kerja", "g": "结构：主语 + mulai + 动词 + jam + 数字 + 时段 + 频率。jam delapan pagi = 早上八点。setiap hari 放句尾表示每天。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu bekerja dengan teliti?", "zh": "你的朋友工作认真吗？", "a": "ba9e6f3aa1b0", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["bekerja", "工作"], ["dengan teliti", "认真地"]], "b": "teliti = adj. 仔细认真", "g": "结构：Apakah + 主语 + 动词 + dengan + 形容词？dengan + 形容词 = 副词，修饰方式：认真地。"}}, {"sp": "参考回答", "role": "a", "id": "Ya, dia bekerja sangat teliti.", "zh": "是的，他做事非常认真。", "a": "8d9b2b7e8544", "an": {"p": [["Ya", "是的"], ["dia", "他"], ["bekerja", "工作"], ["sangat", "很"], ["teliti", "认真仔细"]], "b": "bekerja = ber- + kerja", "g": "结构：Ya, 主语 + 动词 + sangat + 形容词。bekerja teliti = 做事认真，副词可直接放在动词后。"}}, {"sp": "考官", "role": "q", "id": "Apa yang temanmu suka lakukan di waktu luang?", "zh": "你的朋友空闲的时候喜欢做什么？", "a": "112b6c16f9b3", "an": {"p": [["Apa", "什么"], ["yang", "……的"], ["temanmu", "你的朋友"], ["suka", "喜欢"], ["lakukan", "做"], ["di waktu luang", "在空闲时间"]], "b": "lakukan = laku + -kan（vt. 做、进行）", "g": "结构：Apa yang + 主语 + suka + 动词原形？“Apa yang + 主语 + suka lakukan” = 他喜欢做什么，yang 从句里动词不加 meN-。di waktu luang = 在空闲时间。"}}, {"sp": "参考回答", "role": "a", "id": "Di waktu luang dia suka membaca buku dan berolahraga.", "zh": "空闲时他喜欢看书和运动。", "a": "0e3edae4c68d", "an": {"p": [["Di waktu luang", "在空闲时间"], ["dia", "他"], ["suka", "喜欢"], ["membaca", "读"], ["buku", "书"], ["dan", "和"], ["berolahraga", "做运动"]], "b": "membaca = meN- + baca；berolahraga = ber- + olahraga（vi. 做运动）", "g": "结构：时间 + 主语 + suka + 动词 1 + 宾语 + dan + 动词 2。两个动作用 dan 并列。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu mudah marah?", "zh": "你的朋友容易生气吗？", "a": "32fe4e2f5ffd", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["mudah", "容易"], ["marah", "生气"]], "b": "", "g": "结构：Apakah + 主语 + mudah + 动词／形容词？mudah + 动词 = 容易做某事：mudah marah = 易怒。反义：sulit marah。"}}, {"sp": "参考回答", "role": "a", "id": "Tidak, sifatnya sangat lembut.", "zh": "不会，他性格很温和。", "a": "313d97bf28b4", "an": {"p": [["Tidak", "不"], ["sifatnya", "他的性格"], ["sangat", "很"], ["lembut", "温和"]], "b": "sifatnya = sifat + -nya", "g": "结构：Tidak, 主语（带 -nya）+ sangat + 形容词。lembut 可形容人温和，也可形容音乐柔和、布料柔软。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu perlu bekerja di akhir pekan?", "zh": "你的朋友周末需要工作吗？", "a": "a9ff263ccef9", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["perlu", "需要"], ["bekerja", "工作"], ["di akhir pekan", "在周末"]], "b": "akhir pekan = 周的末尾", "g": "结构：Apakah + 主语 + perlu + 动词 + 时间？perlu + 动词 = 需要做某事。否定 tidak perlu = 不必。"}}, {"sp": "参考回答", "role": "a", "id": "Dia tidak perlu bekerja akhir pekan, bisa istirahat dengan baik.", "zh": "周末他不用上班，可以好好休息。", "a": "58fc3abe3b7b", "an": {"p": [["Dia", "他"], ["tidak perlu", "不必"], ["bekerja", "工作"], ["akhir pekan", "周末"], ["bisa", "可以"], ["istirahat", "休息"], ["dengan baik", "好好地"]], "b": "", "g": "结构：主语 + tidak perlu + 动词 + 时间, bisa + 动词 + dengan baik。akhir pekan 前可省略 di。dengan baik = 好好地。第二个分句省略主语 dia。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-23", "hide": 1}, {"id": "t149", "kind": "trans", "book": "模拟练习", "title": "新题 · 互译 6 句", "lines": [{"sp": "", "role": "t", "id": "Apa yang kamu lakukan untuk rasa bosan?", "zh": "你无聊的时候做什么？", "a": "6af5cdcb2954", "za": "ae84d1126569", "an": {"p": [["Apa", "什么"], ["yang", "……的"], ["kamu", "你"], ["lakukan", "做"], ["untuk", "为了"], ["rasa", "感觉"], ["bosan", "无聊"]], "b": "lakukan = laku + -kan；bosan = adj. 腻烦、无聊", "g": "结构：Apa yang + 主语 + 动词原形 + untuk + 名词？untuk rasa bosan = 为了应付无聊的感觉，意思是“无聊时你做什么”。"}}, {"sp": "", "role": "t", "id": "Saya suka membaca cerita tentang budaya dan wisata ke luar negeri.", "zh": "我喜欢读关于文化和出国旅行的故事。", "a": "eab985dcf99d", "za": "17a5d8714bc0", "an": {"p": [["Saya", "我"], ["suka", "喜欢"], ["membaca", "读"], ["cerita", "故事"], ["tentang", "关于"], ["budaya", "文化"], ["dan", "和"], ["wisata", "旅游"], ["ke luar negeri", "到国外"]], "b": "membaca = meN- + baca；wisata = n. 旅游；luar negeri = 国外", "g": "结构：主语 + suka + 动词 + 宾语（cerita）+ tentang + 话题。tentang 后面并列两个话题：budaya 和 wisata ke luar negeri。luar negeri 的标准拼写是 negeri。"}}, {"sp": "", "role": "t", "id": "Kamu sering membeli makanan apa dengan keluargamu?", "zh": "你经常和你家人买什么食物？", "a": "8a149b78ed12", "za": "28d3b6081a65", "an": {"p": [["Kamu", "你"], ["sering", "经常"], ["membeli", "买"], ["makanan", "食物"], ["apa", "什么"], ["dengan", "和"], ["keluargamu", "你的家人"]], "b": "membeli = meN- + beli；keluargamu = keluarga + -mu（你的）", "g": "结构：主语 + sering + 动词 + 宾语 + apa + dengan + 人？apa 放在被问名词（makanan）后，问“买什么食物”。"}}, {"sp": "", "role": "t", "id": "Saat liburan saya suka ke pantai untuk bermain pasir.", "zh": "旅行时我喜欢去海滩玩沙子。", "a": "2fb70bb84680", "za": "6e724ee6af5d", "an": {"p": [["Saat", "当……时"], ["liburan", "假期"], ["saya", "我"], ["suka", "喜欢"], ["ke pantai", "去海滩"], ["untuk", "为了"], ["bermain", "玩"], ["pasir", "沙子"]], "b": "liburan = libur + -an（n. 假期）；bermain = ber- + main（vi. 玩）", "g": "结构：Saat + 名词, 主语 + suka + ke + 地点 + untuk + 动词。untuk 引出目的：去海滩是为了玩沙子。ke pantai 前省略了 pergi。"}}, {"sp": "", "role": "t", "id": "Setiap setelah berolahraga saya minum air putih untuk menjaga tubuh yang sehat.", "zh": "每次锻炼完以后，喝白开水保持身体健康。", "a": "725d42a50f04", "za": "a5bf8fbb34cd", "an": {"p": [["Setiap", "每次"], ["setelah", "在……之后"], ["berolahraga", "做运动"], ["saya", "我"], ["minum", "喝"], ["air putih", "白开水"], ["untuk", "为了"], ["menjaga", "保持"], ["tubuh", "身体"], ["yang sehat", "健康的"]], "b": "berolahraga = ber- + olahraga；menjaga = meN- + jaga（vt. 守护 → 保持）", "g": "结构：Setiap + setelah + 动作, 主语 + 动词 + 宾语 + untuk + 动词 + 宾语 + yang 形容词。air putih = 白色的水 = 白开水。tubuh yang sehat = 健康的身体，yang 修饰 tubuh。"}}, {"sp": "", "role": "t", "id": "Saya setiap akhir pekan pergi ke perpustakaan meminjam buku.", "zh": "我每个周末都去图书馆借书。", "a": "c9f9779985ed", "za": "c3a87b333726", "an": {"p": [["Saya", "我"], ["setiap akhir pekan", "每个周末"], ["pergi", "去"], ["ke perpustakaan", "到图书馆"], ["meminjam", "借"], ["buku", "书"]], "b": "perpustakaan = per- + pustaka + -an（n. 图书馆）；meminjam = meN- + pinjam（vt. 借入）", "g": "结构：主语 + 时间 + pergi ke + 地点 + 动词 + 宾语。两个动词连用：去图书馆 + 借书，meminjam 说明去的目的，untuk 可以省略。pinjam（借入）vs meminjamkan（借出）要分清。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-23", "hide": 1}, {"id": "t150", "kind": "text", "book": "模拟练习", "title": "新题 · Andi 的大学生活 Andi Mahasiswa Baru", "lines": [{"sp": "", "role": "r", "id": "Andi adalah mahasiswa baru di Universitas Jakarta.", "zh": "Andi 是雅加达大学的新生。", "a": "221bf1eafe01", "za": "26521ffbb480", "an": {"p": [["Andi", "人名"], ["adalah", "是"], ["mahasiswa baru", "新生"], ["di", "在"], ["Universitas Jakarta", "雅加达大学"]], "b": "mahasiswa = 大学生；baru = 新的", "g": "结构：主语 + adalah + 名词短语 + 地点。mahasiswa baru = 大学生 + 新（名词 + 形容词，核心词在前）。di + 学校名 = 在某学校。"}}, {"sp": "", "role": "r", "id": "Dia belajar bahasa Indonesia di universitas ini.", "zh": "他在这所大学学习印尼语。", "a": "39c015a87f90", "za": "70b63c3c6440", "an": {"p": [["Dia", "他"], ["belajar", "学习"], ["bahasa Indonesia", "印尼语"], ["di universitas ini", "在这所大学"]], "b": "belajar = ber- + ajar", "g": "结构：主语 + 动词 + 宾语 + 地点。universitas ini = 这所大学（ini 放在名词后）。bahasa + 国名 = 某国语言。"}}, {"sp": "", "role": "r", "id": "Pagi hari dia berangkat dengan bus.", "zh": "早上他乘公交车出发。", "a": "fcb58ae287f8", "za": "41ae0e38b4b7", "an": {"p": [["Pagi hari", "早上"], ["dia", "他"], ["berangkat", "出发"], ["dengan bus", "乘公交车"]], "b": "berangkat = ber- + angkat", "g": "结构：时间 + 主语 + 动词 + dengan + 交通工具。dengan bus = 乘公交车（也可以说 naik bus）。pagi hari = 早上（hari 在这里只是补充，Pagi hari 和 Pagi 意思差不多）。"}}, {"sp": "", "role": "r", "id": "Dia sangat suka kampus ini.", "zh": "他非常喜欢这所校园。", "a": "66567b9272ee", "za": "d4554d66c0a4", "an": {"p": [["Dia", "他"], ["sangat", "非常"], ["suka", "喜欢"], ["kampus ini", "这所校园"]], "b": "", "g": "sangat + 动词/形容词 = 非常……。suka + 名词 = 喜欢某物（suka 后面既可接名词，也可接动词）。注意：suka = 喜欢，不是“高兴”。"}}, {"sp": "", "role": "r", "id": "Dosen-dosennya ramah dan menarik.", "zh": "老师们友好又有趣。", "a": "f3c060bb2edc", "za": "9411d1e1bca3", "an": {"p": [["Dosen-dosennya", "（他们的）老师们"], ["ramah", "友好"], ["dan", "而且"], ["menarik", "有趣、吸引人"]], "b": "dosen-dosen = 重叠表复数；-nya = 他们的；menarik = tarik + meN-", "g": "结构：主语（重叠 + -nya）+ 形容词 + dan + 形容词。重叠表示复数：dosen-dosen = 许多老师。-nya 指“那所大学的”。menarik = 有吸引力的、有趣的。"}}, {"sp": "", "role": "r", "id": "Andi makan siang di kantin kampus.", "zh": "Andi 在学校食堂吃午饭。", "a": "a360ab056f38", "za": "4c2ed721d7e0", "an": {"p": [["Andi", "人名"], ["makan siang", "吃午饭"], ["di kantin kampus", "在学校食堂"]], "b": "kantin = 食堂；kampus = 校园", "g": "结构：主语 + 动词 + 地点。makan siang = 吃午饭（动词短语）。kantin kampus = 食堂 + 校园（学校食堂）。"}}, {"sp": "", "role": "r", "id": "Sore hari dia pulang ke rumah dan belajar di kamar.", "zh": "下午他回家，在房间里学习。", "a": "8dd4ef5fcbc5", "za": "77a2cf6e72b6", "an": {"p": [["Sore hari", "下午"], ["dia", "他"], ["pulang", "回去"], ["ke rumah", "回家"], ["dan", "然后、并且"], ["belajar", "学习"], ["di kamar", "在房间里"]], "b": "", "g": "结构：时间 + 主语 + 动作 1 + ke + 地点 + dan + 动作 2 + di + 地点。pulang ke rumah = 回家。同一主语的两个动作用 dan 连接，第二个不再写 dia。"}}, {"sp": "", "role": "r", "id": "Dia ingin menggunakan bahasa Indonesia dengan lancar dan mahir.", "zh": "他想把印尼语用得流利又熟练。", "a": "c44757ceda5e", "za": "cd3bc7010f29", "an": {"p": [["Dia", "他"], ["ingin", "想"], ["menggunakan", "使用"], ["bahasa Indonesia", "印尼语"], ["dengan lancar dan mahir", "流利而熟练地"]], "b": "menggunakan = guna + meN-…-kan；lancar = 流利；mahir = 熟练", "g": "结构：主语 + ingin + 动词 + 宾语 + dengan + 形容词 1 + dan + 形容词 2。dengan + 形容词 = ……地（把形容词变成副词），两个形容词共用一个 dengan：dengan lancar dan mahir = 流利又熟练地。"}}], "zh": "Andi 是雅加达大学的新生。他在这所大学学习印尼语。早上他乘公交车出发。他非常喜欢这所校园。老师们友好又有趣。Andi 在学校食堂吃午饭。下午他回家，在房间里学习。他想把印尼语用得流利又熟练。", "note": "", "qa": [], "new": "2026-10-25"}, {"id": "t151", "kind": "text", "book": "模拟练习", "title": "新增 · 周六去市图书馆（另一版） Ke Perpustakaan Kota", "lines": [{"sp": "", "role": "r", "id": "Pada hari Sabtu, Rudi pergi ke perpustakaan kota bersama temannya.", "zh": "星期六，Rudi 和朋友一起去了市图书馆。", "a": "37bae1327ebb", "za": "4d7b44dd09ee", "an": {"p": [["Pada hari Sabtu", "在星期六"], ["Rudi", "人名"], ["pergi ke", "去"], ["perpustakaan kota", "市图书馆"], ["bersama temannya", "和他的朋友一起"]], "b": "", "g": "perpustakaan kota = 图书馆 + 城市（市图书馆）。bersama + 人 = 和……一起。temannya = 他的朋友。"}}, {"sp": "", "role": "r", "id": "Mereka tiba pada pukul sembilan pagi.", "zh": "他们早上九点到。", "a": "f48b4c575002", "za": "83108a10581f", "an": {"p": [["Mereka", "他们"], ["tiba", "到达"], ["pada pukul sembilan", "在九点"], ["pagi", "早上"]], "b": "", "g": "结构：主语 + tiba + pada + 钟点 + 时段。tiba（vi. 到达）。pukul sembilan pagi = 早上九点。"}}, {"sp": "", "role": "r", "id": "Di perpustakaan, Rudi mencari buku tentang sejarah Indonesia.", "zh": "在图书馆里，Rudi 找关于印尼历史的书。", "a": "4195538cfe25", "za": "d0c8ed3be548", "an": {"p": [["Di perpustakaan", "在图书馆"], ["Rudi", "人名"], ["mencari", "寻找"], ["buku tentang sejarah", "关于历史的书"], ["Indonesia", "印尼"]], "b": "mencari = cari + meN-；sejarah = 历史", "g": "buku tentang + 主题 = 关于……的书。sejarah Indonesia = 历史 + 印尼 = 印尼的历史。"}}, {"sp": "", "role": "r", "id": "Temannya mencari buku cerita dan majalah.", "zh": "他的朋友找故事书和杂志。", "a": "65bcf434356a", "za": "c442d05e837f", "an": {"p": [["Temannya", "他的朋友"], ["mencari", "寻找"], ["buku cerita", "故事书"], ["dan", "和"], ["majalah", "杂志"]], "b": "", "g": "并列两个宾语：buku cerita dan majalah。buku cerita = 书 + 故事 = 故事书。"}}, {"sp": "", "role": "r", "id": "Suasana perpustakaan sangat tenang sehingga mereka bisa membaca dengan nyaman.", "zh": "图书馆里非常安静，所以他们可以舒舒服服地看书。", "a": "f005c0f9179d", "za": "c2865d99a3af", "an": {"p": [["Suasana perpustakaan", "图书馆的气氛"], ["sangat tenang", "非常安静"], ["sehingga", "所以、以至于"], ["mereka", "他们"], ["bisa membaca", "能阅读"], ["dengan nyaman", "舒适地"]], "b": "suasana = 气氛", "g": "结构：原因（Suasana… sangat tenang）+ sehingga + 结果（mereka bisa membaca…）。sehingga 连接结果，= 所以、以至于。dengan nyaman = 舒适地。"}}, {"sp": "", "role": "r", "id": "Setelah membaca selama dua jam, mereka meminjam beberapa buku untuk dibawa pulang.", "zh": "看了两个小时后，他们借了几本书带回家。", "a": "263c0fc8a60c", "za": "6610784f79f3", "an": {"p": [["Setelah membaca", "读完之后"], ["selama dua jam", "持续两小时"], ["mereka", "他们"], ["meminjam", "借"], ["beberapa buku", "几本书"], ["untuk dibawa pulang", "为了带回家"]], "b": "dibawa = di- + bawa；meminjam = pinjam + meN-", "g": "selama + 时间长度 = 持续……。untuk dibawa pulang = 为了被带回家（untuk + 被动），即“带回家去”。beberapa + 名词 = 几个……。"}}, {"sp": "", "role": "r", "id": "Sebelum pulang, mereka membeli minuman di toko di sebelah perpustakaan.", "zh": "回家之前，他们在图书馆旁边的商店买了饮料。", "a": "78cbef0f40a1", "za": "44ef9941adae", "an": {"p": [["Sebelum pulang", "回家之前"], ["mereka", "他们"], ["membeli", "买"], ["minuman", "饮料"], ["di toko", "在商店"], ["di sebelah perpustakaan", "在图书馆旁边"]], "b": "membeli = meN- + beli（vt. 买）；minuman = minum + -an（n. 饮料）", "g": "结构：Sebelum + 动词, 主语 + 动词 + 宾语 + 地点 + 方位短语。di sebelah = 在……旁边（注意：旁边是 sebelah，不是 dekat）。"}}, {"sp": "", "role": "r", "id": "Rudi sangat senang karena mendapat banyak pengetahuan dan informasi baru dari buku.", "zh": "Rudi 很开心，因为他从书里获得了很多新知识和新信息。", "a": "206632286af3", "za": "a8ca0bdd9f43", "an": {"p": [["Rudi", "鲁迪"], ["sangat", "很"], ["senang", "开心"], ["karena", "因为"], ["mendapat", "得到"], ["banyak", "很多"], ["pengetahuan", "知识"], ["dan", "和"], ["informasi baru", "新信息"], ["dari buku", "从书里"]], "b": "mendapat = meN- + dapat（vt. 得到）；pengetahuan = peN- + tahu + -an（n. 知识）", "g": "结构：主句 + karena + 原因从句。mendapat = 获得（不是“学到”，学到是 belajar）。dari buku 说明来源。"}}], "zh": "星期六，Rudi 和朋友一起去了市图书馆。他们早上九点到。在图书馆里，Rudi 找关于印尼历史的书。他的朋友找故事书和杂志。图书馆里非常安静，所以他们可以舒舒服服地看书。看了两个小时后，他们借了几本书带回家。回家之前，他们在图书馆旁边的商店买了饮料。Rudi 很开心，因为他从书里获得了很多新知识和新信息。", "note": "", "qa": [], "new": "2026-10-29"}, {"id": "t152", "kind": "text", "book": "模拟练习", "title": "新增 · Andi 的大学生活（另一版） Andi Mahasiswa Baru", "lines": [{"sp": "", "role": "r", "id": "Andi adalah mahasiswa baru di Jakarta.", "zh": "Andi 是雅加达的新生。", "a": "33ef8ceca4dc", "za": "a5a738066841", "an": {"p": [["Andi", "安迪"], ["adalah", "是"], ["mahasiswa baru", "大学新生"], ["di Jakarta", "在雅加达"]], "b": "", "g": "结构：主语 + adalah + 名词短语 + 地点。mahasiswa baru = 新的大学生（形容词 baru 放名词后）。"}}, {"sp": "", "role": "r", "id": "Setiap pagi, dia pergi ke kampus dengan naik bus.", "zh": "每天早上，他坐公交车去学校。", "a": "f4517542ddd7", "za": "0bf408809348", "an": {"p": [["Setiap pagi", "每天早上"], ["dia", "他"], ["pergi", "去"], ["ke kampus", "到学校"], ["dengan naik bus", "坐公交车"]], "b": "", "g": "结构：时间 + 主语 + pergi + ke + 地点 + dengan + 动词短语。dengan naik bus = 靠乘公交车（方式）。"}}, {"sp": "", "role": "r", "id": "Di kampus, Andi belajar bahasa Indonesia dan mendapat banyak teman baru.", "zh": "在学校，Andi 学习印尼语，还认识了很多新朋友。", "a": "d8670b27eba0", "za": "234da1401aef", "an": {"p": [["Di kampus", "在学校"], ["Andi", "安迪"], ["belajar", "学习"], ["bahasa Indonesia", "印尼语"], ["dan", "并且"], ["mendapat", "得到"], ["banyak teman baru", "很多新朋友"]], "b": "belajar = ber- + ajar（vt. 学习）", "g": "结构：地点 + 主语 + 动词 1 + 宾语 + dan + 动词 2 + 宾语。mendapat teman baru = 交到新朋友。"}}, {"sp": "", "role": "r", "id": "Dia senang belajar karena guru-gurunya ramah dan kelasnya menyenangkan.", "zh": "他喜欢学习，因为老师们很友好，课也很有趣。", "a": "eceede32dcbf", "za": "89c5af8d0874", "an": {"p": [["Dia", "他"], ["senang", "喜欢"], ["belajar", "学习"], ["karena", "因为"], ["guru-gurunya", "他的老师们"], ["ramah", "友好"], ["dan", "和"], ["kelasnya", "他的课"], ["menyenangkan", "令人愉快的"]], "b": "guru-guru = guru 重叠（老师们）；menyenangkan = meN- + senang + -kan（adj. 令人愉快）", "g": "结构：主语 + senang + 动词 + karena + 原因（两个分句）。senang + 动词 = 喜欢做某事。menyenangkan 的 ny 读 /ɲ/。"}}, {"sp": "", "role": "r", "id": "Setelah belajar, Andi biasanya makan siang di kantin kampus.", "zh": "学完以后，Andi 通常在学校食堂吃午饭。", "a": "c0a5a7cbe65c", "za": "b7d42e63dd57", "an": {"p": [["Setelah belajar", "学习之后"], ["Andi", "安迪"], ["biasanya", "通常"], ["makan siang", "吃午饭"], ["di kantin kampus", "在学校食堂"]], "b": "", "g": "结构：Setelah + 动词, 主语 + 副词 + 动词短语 + 地点。kantin = 食堂；restoran 才是餐厅。"}}, {"sp": "", "role": "r", "id": "Pada sore hari, Andi pulang ke rumah dan belajar di kamar.", "zh": "下午，Andi 回家，在房间里学习。", "a": "b666a39cd859", "za": "18b3cd8f4552", "an": {"p": [["Pada sore hari", "在下午"], ["Andi", "安迪"], ["pulang", "回家"], ["ke rumah", "到家"], ["dan", "并且"], ["belajar", "学习"], ["di kamar", "在房间里"]], "b": "", "g": "结构：时间 + 主语 + 动词 1 + 地点 + dan + 动词 2 + 地点。sore hari = 下午（泛指）。pulang ke rumah = 回家。"}}, {"sp": "", "role": "r", "id": "Dia ingin pintar berbahasa Indonesia.", "zh": "他想把印尼语学好。", "a": "257c9d96645f", "za": "d5c91948329e", "an": {"p": [["Dia", "他"], ["ingin", "想"], ["pintar", "擅长、熟练"], ["berbahasa", "说（某种语言）"], ["Indonesia", "印尼语"]], "b": "berbahasa = ber- + bahasa（vi. 说某种语言）", "g": "结构：主语 + ingin + 形容词 + 动词短语。pintar berbahasa Indonesia = 擅长说印尼语。pintar 这里是“熟练”，不是单纯的“聪明”。"}}], "zh": "Andi 是雅加达的新生。每天早上，他坐公交车去学校。在学校，Andi 学习印尼语，还认识了很多新朋友。他喜欢学习，因为老师们很友好，课也很有趣。学完以后，Andi 通常在学校食堂吃午饭。下午，Andi 回家，在房间里学习。他想把印尼语学好。", "note": "", "qa": [], "new": "2026-10-29"}, {"id": "e153", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 练习 · 口语对答 10 题", "lines": [{"sp": "考官", "role": "q", "id": "Apa hal yang paling berkesan bagimu selama liburan?", "zh": "假期期间，对你来说印象最深刻的事情是什么？", "a": "1ce65a198c56", "an": {"p": [["Apa", "什么"], ["hal", "事情"], ["yang paling berkesan", "最难忘的"], ["bagimu", "对你来说"], ["selama", "在……期间"], ["liburan", "假期"]], "b": "berkesan = ber- + kesan（adj. 有印象的）；bagimu = bagi + -mu", "g": "结构：Apa + 名词 + yang + paling + 形容词 + bagimu + 时间？“paling + 形容词” = 最……。bagi + 人 = 对……来说。"}}, {"sp": "参考回答", "role": "a", "id": "Hal yang paling berkesan bagi saya adalah pergi ke pantai bersama teman-teman.", "zh": "对我来说印象最深的是和朋友们去海边。", "a": "e831efddd2c2", "an": {"p": [["Hal yang paling berkesan", "最难忘的事"], ["bagi saya", "对我来说"], ["adalah", "是"], ["pergi ke pantai", "去海滩"], ["bersama teman-teman", "和朋友们一起"]], "b": "", "g": "结构：主语（名词 + yang 从句）+ adalah + 动词短语。回答提问时先重复问题里的名词短语，再用 adalah 接答案。"}}, {"sp": "考官", "role": "q", "id": "Bagaimana kondisi transportasi di sekitar rumahmu?", "zh": "你家周边的交通状况怎么样？", "a": "8099b0dcbfcf", "an": {"p": [["Bagaimana", "怎么样"], ["kondisi", "状况"], ["transportasi", "交通"], ["di sekitar", "在……周围"], ["rumahmu", "你家"]], "b": "rumahmu = rumah + -mu", "g": "结构：Bagaimana + 名词 + 地点？问“……的情况怎样”。di sekitar + 地点 = 在……附近。"}}, {"sp": "参考回答", "role": "a", "id": "Transportasi di sekitar rumah saya cukup baik, tetapi kadang-kadang macet.", "zh": "我家附近的交通还不错，但有时候会堵车。", "a": "7b5cc6f0580a", "an": {"p": [["Transportasi", "交通"], ["di sekitar rumah saya", "在我家附近"], ["cukup", "相当"], ["baik", "好"], ["tetapi", "但是"], ["kadang-kadang", "有时"], ["macet", "堵车"]], "b": "macet = adj. 堵塞", "g": "结构：主语 + cukup + 形容词, tetapi + 副词 + 形容词。cukup baik = 还不错（程度适中）。tetapi 表转折。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu sakit biasanya apa yang kamu lakukan?", "zh": "你生病的时候一般会怎么做？", "a": "7693846614b9", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["sakit", "生病"], ["biasanya", "通常"], ["apa yang kamu lakukan", "你做什么"]], "b": "lakukan = laku + -kan（动词原形）", "g": "结构：Kalau + 条件, 副词 + apa + yang + 主语 + 动词原形？yang 从句里动词用原形（kamu lakukan）。"}}, {"sp": "参考回答", "role": "a", "id": "Kalau saya sakit, saya pergi ke apotek untuk membeli obat, lalu istirahat di rumah.", "zh": "我生病的时候，会去药店买药，然后在家休息。", "a": "725ffedd6386", "an": {"p": [["Kalau", "如果"], ["saya sakit", "我生病"], ["pergi ke apotek", "去药店"], ["untuk", "为了"], ["membeli obat", "买药"], ["lalu", "然后"], ["istirahat", "休息"], ["di rumah", "在家"]], "b": "", "g": "结构：Kalau + 条件, 主句 + untuk + 目的 + lalu + 动词。untuk + 动词 = 为了做……。"}}, {"sp": "考官", "role": "q", "id": "Bagaimana menurutmu cara anak muda dan orang tua menjaga kesehatan?", "zh": "你认为年轻人和老年人应该如何保持健康？", "a": "735f67a82e83", "an": {"p": [["Bagaimana", "怎样"], ["menurutmu", "依你看"], ["cara", "方法"], ["anak muda", "年轻人"], ["dan", "和"], ["orang tua", "老年人"], ["menjaga", "保持"], ["kesehatan", "健康"]], "b": "menjaga = meN- + jaga；kesehatan = ke- + sehat + -an", "g": "结构：Bagaimana menurutmu + 名词短语？cara + 人 + 动词 = ……做某事的方法。orang tua 这里指“老人”（也可指父母）。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, anak muda harus rajin berolahraga, dan orang tua harus makan makanan sehat dan cukup istirahat.", "zh": "我觉得年轻人要经常运动，老年人要吃健康的食物、好好休息。", "a": "5d86d08a2963", "an": {"p": [["Menurut saya", "依我看"], ["anak muda", "年轻人"], ["harus", "必须"], ["rajin", "勤快"], ["berolahraga", "运动"], ["orang tua", "老年人"], ["makan makanan sehat", "吃健康食物"], ["cukup istirahat", "充分休息"]], "b": "berolahraga = ber- + olahraga", "g": "结构：Menurut saya, 主语 + harus + 动词短语, dan 主语 + harus + 动词短语。harus + rajin + 动词 = 必须勤于做……。cukup = 足够。"}}, {"sp": "考官", "role": "q", "id": "Apakah Anda pernah mengalami hal lucu atau menarik saat berbelanja di supermarket?", "zh": "你在超市购物时遇到过有趣的事吗？", "a": "156d5dc450ca", "an": {"p": [["Apakah", "是否"], ["Anda", "您"], ["pernah", "曾经"], ["mengalami", "经历"], ["hal lucu", "好笑的事"], ["atau", "或"], ["menarik", "有趣"], ["saat", "当……时"], ["berbelanja", "购物"], ["di supermarket", "在超市"]], "b": "mengalami = meN- + alami（vt. 经历）", "g": "结构：Apakah + 主语 + pernah + 动词 + 宾语 + saat + 动作？saat + 动词 = 在……的时候。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Saya pernah lupa membawa dompet, jadi saya harus pulang dulu.", "zh": "有过。我有一次忘了带钱包，只好先回家拿。", "a": "89a8e415dbfa", "an": {"p": [["Pernah", "曾经"], ["Saya", "我"], ["lupa", "忘记"], ["membawa", "带"], ["dompet", "钱包"], ["jadi", "所以"], ["harus", "必须"], ["pulang", "回家"], ["dulu", "先"]], "b": "membawa = meN- + bawa（vt. 带）", "g": "结构：Pernah + 主语 + pernah + 动词。lupa + 动词 = 忘了做……。jadi 引出结果。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, makanan apa yang sehat? Berikan contohnya.", "zh": "你认为哪些食物是健康食品？举例说明。", "a": "ef0f23b71d24", "an": {"p": [["Menurutmu", "依你看"], ["makanan apa", "什么食物"], ["yang sehat", "健康的"], ["Berikan", "请给出"], ["contohnya", "例子"]], "b": "Berikan = beri + -kan（祈使）；contohnya = contoh + -nya", "g": "结构：问句 + 祈使句。Berikan + 宾语 = 请给出……。contoh = 例子。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, sayur dan buah adalah makanan yang sehat, misalnya bayam, wortel, dan apel.", "zh": "我觉得蔬菜和水果是健康的食物，比如菠菜、胡萝卜和苹果。", "a": "5929de59ec35", "an": {"p": [["Menurut saya", "依我看"], ["sayur", "蔬菜"], ["dan", "和"], ["buah", "水果"], ["adalah", "是"], ["makanan yang sehat", "健康的食物"], ["misalnya", "比如"], ["bayam", "菠菜"], ["wortel", "胡萝卜"], ["apel", "苹果"]], "b": "", "g": "结构：主语（并列）+ adalah + 名词 + yang + 形容词；misalnya + 举例。"}}, {"sp": "考官", "role": "q", "id": "Jika ibu kamu memintamu pergi ke pasar sendirian untuk membeli sayur dan buah, apakah kamu bisa? Apa yang akan kamu lakukan agar tidak salah beli?", "zh": "如果妈妈让你独自去市场买蔬果，你可以做到吗？你会怎么做避免买错？", "a": "1ba34d0c2229", "an": {"p": [["Jika", "如果"], ["ibu kamu", "你妈妈"], ["memintamu", "要求你"], ["pergi ke pasar", "去市场"], ["sendirian", "独自"], ["untuk membeli", "为了买"], ["apakah kamu bisa", "你能吗"], ["Apa yang akan kamu lakukan", "你会怎么做"], ["agar tidak salah beli", "以免买错"]], "b": "memintamu = meminta + -mu；salah = adj. 错", "g": "结构：Jika + 条件, 问句 1；问句 2：Apa yang akan + 主语 + 动词原形 + agar + 目的？agar tidak + 动词 = 为了不……。meminta + 人 + 动词 = 要求某人做……。"}}, {"sp": "参考回答", "role": "a", "id": "Bisa. Saya akan menulis daftar belanja dulu agar tidak salah beli.", "zh": "可以。我会先写一张购物清单，这样就不会买错。", "a": "9161e46890de", "an": {"p": [["Bisa", "可以"], ["Saya", "我"], ["akan", "会"], ["menulis", "写"], ["daftar belanja", "购物清单"], ["dulu", "先"], ["agar tidak salah beli", "以免买错"]], "b": "daftar = n. 清单", "g": "结构：Bisa. + 主语 + akan + 动词 + 宾语 + agar + 目的。agar = 为了、以便。"}}, {"sp": "考官", "role": "q", "id": "Selain menonton TV, apa kegiatan lain yang biasa kamu lakukan bersama keluarga di rumah? Mengapa kegiatan itu penting menurutmu?", "zh": "除了看电视，你在家还会和家人一起做什么活动？为什么这件事很重要？", "a": "6732f836e2cd", "an": {"p": [["Selain", "除了"], ["menonton TV", "看电视"], ["apa kegiatan lain", "还有什么活动"], ["yang biasa kamu lakukan", "你常做的"], ["bersama keluarga", "和家人一起"], ["Mengapa", "为什么"], ["kegiatan itu", "这件事"], ["penting", "重要"], ["menurutmu", "依你看"]], "b": "kegiatan = ke- + giat + -an（n. 活动）", "g": "结构：Selain + 动作, 问句。yang 从句：yang biasa kamu lakukan（动词原形）。Mengapa + 主语 + penting + menurutmu？"}}, {"sp": "参考回答", "role": "a", "id": "Selain menonton TV, saya suka memasak bersama keluarga. Kegiatan itu penting karena kami bisa mengobrol dan menjadi lebih dekat.", "zh": "除了看电视，我喜欢和家人一起做饭。这很重要，因为我们可以聊天，关系也更亲近。", "a": "e723ce0814d2", "an": {"p": [["Selain menonton TV", "除了看电视"], ["saya suka memasak", "我喜欢做饭"], ["bersama keluarga", "和家人一起"], ["Kegiatan itu", "这项活动"], ["penting", "重要"], ["karena", "因为"], ["kami bisa mengobrol", "我们能聊天"], ["dan", "并且"], ["menjadi lebih dekat", "变得更亲近"]], "b": "mengobrol = meN- + obrol（vi. 聊天）", "g": "结构：Selain + 动作, 主语 + suka + 动词。第二句：主语 + 形容词 + karena + 从句。menjadi + 形容词比较级 = 变得更……。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, apakah lebih baik makan malam bersama keluarga setiap hari atau kadang-kadang saja? Berikan alasanmu.", "zh": "你觉得每天和家人共进晚餐好，还是偶尔一起吃就好？说明理由。", "a": "754cef94356a", "an": {"p": [["Menurutmu", "依你看"], ["apakah", "是否"], ["lebih baik", "更好"], ["makan malam", "吃晚饭"], ["bersama keluarga", "和家人一起"], ["setiap hari", "每天"], ["atau", "还是"], ["kadang-kadang saja", "偶尔就好"], ["Berikan", "请给出"], ["alasanmu", "你的理由"]], "b": "alasanmu = alasan + -mu", "g": "结构：Apakah lebih baik + 动词短语 + A atau B？二选一。Berikan alasanmu = 请说明理由。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, lebih baik makan malam bersama keluarga setiap hari, karena kami bisa bercerita tentang kegiatan hari itu.", "zh": "我觉得每天和家人一起吃晚饭更好，因为我们可以聊聊当天做了什么。", "a": "36cdc27f0055", "an": {"p": [["Menurut saya", "依我看"], ["lebih baik", "更好"], ["makan malam bersama keluarga", "和家人吃晚饭"], ["setiap hari", "每天"], ["karena", "因为"], ["kami bisa", "我们能"], ["bercerita", "讲述"], ["tentang", "关于"], ["kegiatan hari itu", "当天的活动"]], "b": "bercerita = ber- + cerita（vi. 讲故事、聊起）", "g": "结构：Menurut saya, lebih baik + 动词短语, karena + 从句。bercerita tentang + 话题 = 聊……。"}}, {"sp": "考官", "role": "q", "id": "Apakah di negara asalmu, kebiasaan berkumpul dengan keluarga sama seperti di Indonesia? Sebutkan satu persamaan dan satu perbedaan.", "zh": "在你的国家，家庭团聚的习俗和印尼一样吗？请说出一个相同点和一个不同点。", "a": "523169cd5039", "an": {"p": [["Apakah", "是否"], ["di negara asalmu", "在你的祖国"], ["kebiasaan", "习惯"], ["berkumpul", "团聚"], ["dengan keluarga", "和家人"], ["sama seperti", "和……一样"], ["di Indonesia", "在印尼"], ["Sebutkan", "请说出"], ["satu persamaan", "一个相同点"], ["satu perbedaan", "一个不同点"]], "b": "kebiasaan = ke- + biasa + -an；persamaan = per- + sama + -an；perbedaan = per- + beda + -an", "g": "结构：Apakah + 名词短语 + sama seperti + 比较对象？Sebutkan + 数量 + 名词 = 请说出……。persamaan 相同点，perbedaan 不同点。"}}, {"sp": "参考回答", "role": "a", "id": "Hampir sama. Persamaannya, kami juga suka berkumpul saat hari raya. Perbedaannya, di Tiongkok kami berkumpul saat Imlek, di Indonesia saat Lebaran.", "zh": "差不多。相同点是我们也喜欢在节日团聚。不同点是中国在春节团聚，印尼在开斋节团聚。", "a": "1fa4a0cfa53c", "an": {"p": [["Hampir sama", "几乎一样"], ["Persamaannya", "相同点是"], ["kami", "我们"], ["juga", "也"], ["suka", "喜欢"], ["berkumpul", "团聚"], ["saat hari raya", "在节日"], ["Perbedaannya", "不同点是"], ["di Tiongkok", "在中国"], ["saat Imlek", "在春节"], ["di Indonesia", "在印尼"], ["saat Lebaran", "在开斋节"]], "b": "persamaannya = persamaan + -nya", "g": "结构：Hampir sama. + Persamaannya + 从句. + Perbedaannya + 从句。-nya 把“相同点”变成“……的相同点是”。saat + 节日 = 在……的时候。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-26"}, {"id": "t154", "kind": "trans", "book": "BIPA 2", "title": "BIPA 2 练习 · 互译 11 句", "lines": [{"sp": "", "role": "t", "id": "Saya sangat suka belajar bahasa Indonesia karena guru saya baik dan teliti.", "zh": "我非常喜欢学习印尼语，因为我的老师又好又细心。", "a": "a00d1ffb4c3d", "za": "4d65d8581319", "an": {"p": [["Saya", "我"], ["sangat", "很"], ["suka", "喜欢"], ["belajar", "学"], ["bahasa Indonesia", "印尼语"], ["karena", "因为"], ["guru saya", "我的老师"], ["baik", "好"], ["dan", "并且"], ["teliti", "细心"]], "b": "teliti = adj. 仔细", "g": "结构：主语 + sangat suka + 动词短语 + karena + 从句。guru saya baik dan teliti = 我的老师人好又细心。"}}, {"sp": "", "role": "t", "id": "Saya pergi ke pasar bersama ibu saya untuk membeli sayur dan buah-buahan.", "zh": "我和我的妈妈一起去市场买蔬菜和水果。", "a": "60f74297946c", "za": "4073947ce4a9", "an": {"p": [["Saya", "我"], ["pergi ke pasar", "去市场"], ["bersama ibu saya", "和我妈妈一起"], ["untuk membeli", "为了买"], ["sayur", "蔬菜"], ["dan", "和"], ["buah-buahan", "各种水果"]], "b": "buah-buahan = buah 重叠 + -an（各种水果）", "g": "结构：主语 + pergi + ke + 地点 + bersama + 人 + untuk + 动词短语。buah-buahan 指水果的统称。"}}, {"sp": "", "role": "t", "id": "Biasanya saya duduk bersama keluarga sambil menonton televisi.", "zh": "我平时和家人坐在一起看电视。", "a": "379b7e99d3cf", "za": "3cac1b53089f", "an": {"p": [["Biasanya", "通常"], ["saya", "我"], ["duduk", "坐"], ["bersama keluarga", "和家人一起"], ["sambil", "一边"], ["menonton televisi", "看电视"]], "b": "sambil = conj. 一边……一边……", "g": "结构：副词 + 主语 + 动词 + 一起的人 + sambil + 动词短语。sambil 连接同时进行的两个动作，主语相同。"}}, {"sp": "", "role": "t", "id": "Ayah membantu memasak makan malam setelah pulang kerja setiap hari.", "zh": "爸爸每天下班后帮忙做晚饭。", "a": "08a24d615ee4", "za": "00a3e9653499", "an": {"p": [["Ayah", "爸爸"], ["membantu", "帮忙"], ["memasak", "做"], ["makan malam", "晚饭"], ["setelah", "之后"], ["pulang kerja", "下班"], ["setiap hari", "每天"]], "b": "membantu = meN- + bantu（vt. 帮助）；pulang kerja = 下班（回家工作后）", "g": "结构：主语 + membantu + 动词短语 + setelah + 动作 + 频率。membantu + 动词 = 帮忙做……。"}}, {"sp": "", "role": "t", "id": "Adik laki-laki saya suka mendengarkan musik dan bermain game di kamar.", "zh": "弟弟喜欢在房间里听音乐和玩游戏。", "a": "8944af68ec6c", "za": "55fe138eab5a", "an": {"p": [["Adik laki-laki saya", "我弟弟"], ["suka", "喜欢"], ["mendengarkan musik", "听音乐"], ["dan", "和"], ["bermain game", "玩游戏"], ["di kamar", "在房间里"]], "b": "mendengarkan = meN- + dengar + -kan", "g": "结构：主语 + suka + 动词 1 + 宾语 + dan + 动词 2 + 宾语 + 地点。bermain game = 玩游戏。"}}, {"sp": "", "role": "t", "id": "Ayah bekerja di kantor, sedangkan ibu bekerja di rumah.", "zh": "爸爸在办公室工作，妈妈在家里工作。", "a": "01105241fbc1", "za": "85ff14d32dcb", "an": {"p": [["Ayah", "爸爸"], ["bekerja", "工作"], ["di kantor", "在办公室"], ["sedangkan", "而"], ["ibu", "妈妈"], ["di rumah", "在家"]], "b": "sedangkan = conj. 而、然而", "g": "结构：主句 A, sedangkan + 主句 B。sedangkan 表示对比：爸爸……而妈妈……。"}}, {"sp": "", "role": "t", "id": "Setiap akhir pekan, saya merapikan kamar sendiri dan juga mencuci pakaian sendiri.", "zh": "在每个周末，我自己整理房间，还自己洗衣服。", "a": "781b60adc0ed", "za": "3bd283bf6787", "an": {"p": [["Setiap akhir pekan", "每个周末"], ["saya", "我"], ["merapikan", "整理"], ["kamar", "房间"], ["sendiri", "自己"], ["dan juga", "并且还"], ["mencuci", "洗"], ["pakaian", "衣服"]], "b": "merapikan = meN- + rapi + -kan（使整齐）；mencuci = meN- + cuci", "g": "结构：时间, 主语 + 动词 1 + 宾语 + sendiri + dan juga + 动词 2 + 宾语 + sendiri。sendiri 放在宾语后 = 自己（亲自）。"}}, {"sp": "", "role": "t", "id": "Saya sangat senang belajar bahasa Indonesia karena gurunya baik dan sabar.", "zh": "我非常喜欢学习印尼语，因为老师人很好又有耐心。", "a": "0a191655043e", "za": "8c08530443ec", "an": {"p": [["Saya", "我"], ["sangat senang", "很喜欢"], ["belajar", "学"], ["bahasa Indonesia", "印尼语"], ["karena", "因为"], ["gurunya", "老师"], ["baik", "好"], ["dan", "并且"], ["sabar", "耐心"]], "b": "gurunya = guru + -nya", "g": "结构：主语 + sangat senang + 动词短语 + karena + 从句。senang + 动词 = 喜欢做某事（课堂上“senang”的这个用法很重要）。"}}, {"sp": "", "role": "t", "id": "Setiap malam, saya makan malam bersama orang tua di rumah.", "zh": "每天晚上，我都和父母在家吃晚饭。", "a": "a53dfc0e17ca", "za": "b8617f0ea8dd", "an": {"p": [["Setiap malam", "每天晚上"], ["saya", "我"], ["makan malam", "吃晚饭"], ["bersama orang tua", "和父母一起"], ["di rumah", "在家"]], "b": "", "g": "结构：时间, 主语 + 动词 + bersama + 人 + 地点。orang tua 在这里是“父母”。"}}, {"sp": "", "role": "t", "id": "Adik laki-laki saya suka mendengarkan musik di kamar.", "zh": "我的弟弟喜欢在房间里听音乐。", "a": "2d7c08cd3195", "za": "0792cb080b6f", "an": {"p": [["Adik laki-laki saya", "我弟弟"], ["suka", "喜欢"], ["mendengarkan musik", "听音乐"], ["di kamar", "在房间里"]], "b": "", "g": "结构：主语 + suka + 动词短语 + 地点。"}}, {"sp": "", "role": "t", "id": "Di hari Minggu, saya biasanya bangun tidur agak siang.", "zh": "周日的时候，我通常会起得比较晚。", "a": "d911f0d15b3f", "za": "1feb7ed2eed7", "an": {"p": [["Di hari Minggu", "在星期天"], ["saya", "我"], ["biasanya", "通常"], ["bangun tidur", "起床"], ["agak siang", "有点晚（接近中午）"]], "b": "bangun tidur = 睡醒起床", "g": "结构：时间, 主语 + 副词 + 动词 + 修饰语。agak + 形容词 = 有点……。bangun siang = 起得晚。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-26"}, {"id": "t155", "kind": "text", "book": "BIPA 2", "title": "BIPA 2 练习 · 感冒去药店 Sakit Flu", "lines": [{"sp": "", "role": "r", "id": "Saat bangun pagi, saya sakit kepala, flu, dan tenggorokan saya sakit.", "zh": "早上起床，我头疼、感冒，喉咙也疼。", "a": "0226a83d9191", "za": "15ab95b8f19e", "an": {"p": [["Saat", "当……时"], ["bangun pagi", "早上起床"], ["saya", "我"], ["sakit kepala", "头疼"], ["flu", "感冒"], ["dan", "并且"], ["tenggorokan saya sakit", "我的喉咙痛"]], "b": "", "g": "结构：Saat + 动作, 主语 + 并列症状。sakit + 部位 = 哪里痛：sakit kepala / tenggorokan sakit。"}}, {"sp": "", "role": "r", "id": "Ibu membawa saya ke apotek untuk membeli obat flu.", "zh": "妈妈带我去药店买感冒药。", "a": "a004d6bae523", "za": "b39434912082", "an": {"p": [["Ibu", "妈妈"], ["membawa", "带"], ["saya", "我"], ["ke apotek", "去药店"], ["untuk membeli", "为了买"], ["obat flu", "感冒药"]], "b": "membawa = meN- + bawa（vt. 带、带领）", "g": "结构：主语 + membawa + 人 + ke + 地点 + untuk + 动词短语。membawa + 人 = 带某人去。"}}, {"sp": "", "role": "r", "id": "Saya minum obat sesuai petunjuk pada kemasan.", "zh": "我按照包装上的说明吃药。", "a": "b453b5d207e6", "za": "cb12bf4933b9", "an": {"p": [["Saya", "我"], ["minum obat", "吃药"], ["sesuai", "按照"], ["petunjuk", "说明"], ["pada kemasan", "在包装上"]], "b": "sesuai = se- + suai（adj. 相符）；kemasan = kemas + -an（n. 包装）", "g": "结构：主语 + 动词 + 宾语 + sesuai + 名词 + pada + 地方。sesuai + 名词 = 按照……。"}}, {"sp": "", "role": "r", "id": "Saya dan ibu pulang ke rumah, lalu kami beristirahat lebih awal.", "zh": "我和妈妈回到家，然后早早休息。", "a": "190c37b639d7", "za": "e0a96afe378e", "an": {"p": [["Saya dan ibu", "我和妈妈"], ["pulang ke rumah", "回家"], ["lalu", "然后"], ["kami", "我们"], ["beristirahat", "休息"], ["lebih awal", "更早"]], "b": "beristirahat = ber- + istirahat（vi. 休息）", "g": "结构：主语（并列）+ 动词 + 地点, lalu + 主语 + 动词 + 副词。lebih awal = 比平时早。"}}, {"sp": "", "role": "r", "id": "Ibu membuat bubur ayam yang enak untuk saya.", "zh": "妈妈给我煮了好吃的鸡肉粥。", "a": "68d4145f3d35", "za": "d2d86680423d", "an": {"p": [["Ibu", "妈妈"], ["membuat", "做"], ["bubur ayam", "鸡肉粥"], ["yang enak", "好吃的"], ["untuk saya", "给我"]], "b": "membuat = meN- + buat（vt. 做）", "g": "结构：主语 + 动词 + 宾语 + yang + 形容词 + untuk + 人。untuk + 人 = 为某人。"}}, {"sp": "", "role": "r", "id": "Setelah makan, saya merasa enak dan badan saya hangat.", "zh": "吃完以后，我觉得很舒服，身体暖暖的。", "a": "97f707eb339c", "za": "aa87d9da2589", "an": {"p": [["Setelah makan", "吃完以后"], ["saya", "我"], ["merasa", "觉得"], ["enak", "舒服"], ["dan", "并且"], ["badan saya hangat", "我的身体暖和"]], "b": "merasa = meN- + rasa", "g": "结构：Setelah + 动词, 主语 + merasa + 形容词 + dan + 主语 + 形容词。enak 既指“好吃”，也指“舒服”。"}}, {"sp": "", "role": "r", "id": "Saya berharap cepat sembuh dan bisa segera kembali bekerja.", "zh": "我希望快点好起来，可以早点回去上班。", "a": "119ae4e249b5", "za": "2edab98bffe0", "an": {"p": [["Saya", "我"], ["berharap", "希望"], ["cepat", "快"], ["sembuh", "痊愈"], ["dan", "并且"], ["bisa", "能"], ["segera", "尽快"], ["kembali bekerja", "回去工作"]], "b": "berharap = ber- + harap（vi. 希望）", "g": "结构：主语 + berharap + 从句（省略主语）。cepat + 动词 = 快点……；segera + 动词 = 尽快……。"}}], "zh": "早上起床我头疼、感冒，喉咙也疼。妈妈带我去药店买感冒药。我按照包装上的说明吃药。我和妈妈回到家，然后早早休息。妈妈给我煮了好吃的鸡肉粥。吃完以后，我觉得很舒服，身体暖暖的。我希望快点好起来，可以早点回去上班。", "note": "", "qa": [], "new": "2026-10-26"}, {"id": "t156", "kind": "text", "book": "扩充题库", "title": "扩充阅读 · 陪妈妈看病买药 Ke Klinik dan Apotek", "lines": [{"sp": "", "role": "r", "id": "Kemarin ibu saya sakit.", "zh": "昨天我妈妈生病了。", "a": "7a3fa34be00e", "za": "6f1d93c522e1", "an": {"p": [["Kemarin", "昨天"], ["ibu saya", "我妈妈"], ["sakit", "生病"]], "b": "", "g": "结构：时间 + 主语 + 形容词。sakit（adj. 病的）作谓语，不需要 adalah。印尼语动词不变时态，靠 kemarin 表示过去。"}}, {"sp": "", "role": "r", "id": "Dia demam, batuk, dan sakit kepala.", "zh": "她发烧、咳嗽，还头疼。", "a": "2a2441a41db3", "za": "c5c82d0ac986", "an": {"p": [["Dia", "她"], ["demam", "发烧"], ["batuk", "咳嗽"], ["dan", "和"], ["sakit kepala", "头痛"]], "b": "", "g": "结构：主语 + 并列症状。demam（n./vi. 发烧）、batuk（vi. 咳嗽）、sakit kepala（头痛，sakit + 部位 = 哪里痛）。"}}, {"sp": "", "role": "r", "id": "Saya mengantar ibu ke klinik dekat rumah.", "zh": "我送妈妈去家附近的诊所。", "a": "a9938f593ac4", "za": "845ca48176c3", "an": {"p": [["Saya", "我"], ["mengantar", "送"], ["ibu", "妈妈"], ["ke", "到"], ["klinik", "诊所"], ["dekat", "靠近"], ["rumah", "家"]], "b": "mengantar = meN- + antar（vt. 送、陪同）", "g": "结构：主语 + mengantar + 宾语 + ke + 地点。dekat rumah 修饰 klinik，意为“离家近的诊所”。"}}, {"sp": "", "role": "r", "id": "Di klinik, kami mendaftar dulu di meja pendaftaran.", "zh": "在诊所，我们先在就诊台（挂号台）登记。", "a": "6a0d2478905b", "za": "415a78080e95", "an": {"p": [["Di klinik", "在诊所"], ["kami", "我们"], ["mendaftar", "登记、挂号"], ["dulu", "先"], ["di", "在"], ["meja pendaftaran", "就诊台、挂号台"]], "b": "mendaftar = meN- + daftar（vi. 登记）；pendaftaran = pe- + daftar + -an（n. 登记处/登记）；meja = n. 桌子、台", "g": "结构：地点 + 主语 + mendaftar + dulu + di + 地点。meja pendaftaran 就是“挂号台、就诊台”，医院、诊所里先去的地方。dulu 放动词后 = 先做这件事。"}}, {"sp": "", "role": "r", "id": "Petugas memberi kami nomor antrean.", "zh": "工作人员给了我们一个排队号。", "a": "e60e9c5b5b18", "za": "c0a8c715f572", "an": {"p": [["Petugas", "工作人员"], ["memberi", "给"], ["kami", "我们"], ["nomor", "号码"], ["antrean", "排队（的号）"]], "b": "petugas = pe- + tugas（n. 任务 → 做任务的人）；memberi = meN- + beri（vt. 给）；antrean = antre + -an（n. 队伍）", "g": "结构：主语 + memberi + 间接宾语（kami）+ 直接宾语（nomor antrean）。memberi + 人 + 物 = 给某人某物。nomor antrean = 排队号。"}}, {"sp": "", "role": "r", "id": "Setelah menunggu di ruang tunggu, kami masuk ke ruang periksa.", "zh": "在候诊室等了一会儿，我们进了诊室。", "a": "b173576d77fd", "za": "bbda9ca28ea3", "an": {"p": [["Setelah", "在……之后"], ["menunggu", "等待"], ["di ruang tunggu", "在候诊室"], ["kami", "我们"], ["masuk", "进入"], ["ke ruang periksa", "到诊室"]], "b": "menunggu = meN- + tunggu（vt. 等）；ruang = n. 房间、空间；periksa = vt. 检查", "g": "结构：Setelah + 动作, 主语 + 动词 + ke + 地点。ruang tunggu = 等候的房间 = 候诊室；ruang periksa = 检查的房间 = 诊室。"}}, {"sp": "", "role": "r", "id": "Dokter memeriksa ibu dan menulis resep.", "zh": "医生给妈妈做了检查，开了处方。", "a": "41b41b29fe35", "za": "20f8dcfb4907", "an": {"p": [["Dokter", "医生"], ["memeriksa", "检查"], ["ibu", "妈妈"], ["dan", "并且"], ["menulis", "写"], ["resep", "处方"]], "b": "memeriksa = meN- + periksa（vt. 检查）；menulis = meN- + tulis（vt. 写）", "g": "结构：主语 + 动词 1 + 宾语 + dan + 动词 2 + 宾语。两个动作用 dan 连接，主语只写一次。resep（n.）= 处方，也指食谱。"}}, {"sp": "", "role": "r", "id": "Lalu saya mengantar ibu ke apotek di sebelah klinik.", "zh": "然后我陪妈妈去诊所旁边的药店。", "a": "b42186bedf45", "za": "5b9c1b813aeb", "an": {"p": [["Lalu", "然后"], ["saya", "我"], ["mengantar", "陪送"], ["ibu", "妈妈"], ["ke apotek", "到药店"], ["di sebelah", "在……旁边"], ["klinik", "诊所"]], "b": "", "g": "结构：连接词 + 主语 + 动词 + 宾语 + ke + 地点 + 方位短语。di sebelah klinik 说明药店的位置，修饰 apotek。"}}, {"sp": "", "role": "r", "id": "Apoteker memberi kami obat demam dan obat batuk.", "zh": "药剂师给了我们退烧药和止咳药。", "a": "4d3b95f73954", "za": "6b559f3f0523", "an": {"p": [["Apoteker", "药剂师"], ["memberi", "给"], ["kami", "我们"], ["obat demam", "退烧药"], ["dan", "和"], ["obat batuk", "止咳药"]], "b": "apoteker = 外来词（n. 药剂师）", "g": "结构：主语 + memberi + 对象 + 物品。obat + 症状 = 治……的药：obat demam 退烧药，obat batuk 止咳药。"}}, {"sp": "", "role": "r", "id": "Dia berkata, \"Minum obat ini tiga kali sehari setelah makan.\"", "zh": "他说：“这个药一天吃三次，饭后吃。”", "a": "a9efb936f923", "za": "0c16badd4e55", "an": {"p": [["Dia", "他"], ["berkata", "说"], ["Minum", "服（喝）"], ["obat", "药"], ["ini", "这个"], ["tiga kali", "三次"], ["sehari", "每天"], ["setelah makan", "饭后"]], "b": "berkata = ber- + kata（vi. 说）；sehari = se- + hari", "g": "结构：主语 + berkata, “引语”。引语里是祈使句：Minum obat ini……（请服用这个药）。tiga kali sehari = 一天三次；setelah makan = 饭后。"}}, {"sp": "", "role": "r", "id": "Harga obatnya lima puluh ribu rupiah.", "zh": "药一共五万印尼盾。", "a": "983663253e2d", "za": "d1bed5345d33", "an": {"p": [["Harga", "价格"], ["obatnya", "那些药（的）"], ["lima puluh ribu", "五万"], ["rupiah", "印尼盾"]], "b": "obatnya = obat + -nya（-nya 指前面提到的药）", "g": "结构：名词短语 + 数额。Harga obatnya……= 药的价格是……；lima puluh ribu = 50,000（lima 五 + puluh 十 + ribu 千）。口语里省略 adalah。"}}, {"sp": "", "role": "r", "id": "Kalau dua hari belum sembuh, ibu harus kembali ke dokter.", "zh": "如果两天还没好，妈妈就要回去找医生。", "a": "577c34102be2", "za": "2199f58f5f44", "an": {"p": [["Kalau", "如果"], ["dua hari", "两天"], ["belum", "还没"], ["sembuh", "痊愈"], ["ibu", "妈妈"], ["harus", "必须"], ["kembali", "回来"], ["ke dokter", "到医生那里"]], "b": "", "g": "结构：Kalau + 条件, 主句。belum + 动词 = 还没……；sembuh（vi. 痊愈）。harus + 动词 = 必须做。kembali ke dokter = 回去找医生（复诊）。"}}, {"sp": "", "role": "r", "id": "Di rumah, ibu minum obat dan banyak minum air putih.", "zh": "回到家，妈妈吃了药，还喝了很多白开水。", "a": "a1b469aa7855", "za": "4b7f88f38d3f", "an": {"p": [["Di rumah", "在家"], ["ibu", "妈妈"], ["minum", "喝、服"], ["obat", "药"], ["dan", "并且"], ["banyak", "很多"], ["air putih", "白开水"]], "b": "minum = vt. 喝（minum obat 吃药，印尼语“药”也用“喝”）", "g": "结构：地点 + 主语 + 动词 + 宾语 + dan + banyak + 动词 + 宾语。注意：吃药说 minum obat（喝药），不说 makan obat。banyak minum = 多喝。air putih = 白开水。"}}, {"sp": "", "role": "r", "id": "Saya memasak bubur untuk ibu.", "zh": "我给妈妈煮了粥。", "a": "2a838f05568a", "za": "9241f5ee5391", "an": {"p": [["Saya", "我"], ["memasak", "煮、做饭"], ["bubur", "粥"], ["untuk", "为了、给"], ["ibu", "妈妈"]], "b": "memasak = meN- + masak（vt. 煮）", "g": "结构：主语 + 动词 + 宾语 + untuk + 对象。untuk + 人 = 为某人、给某人。"}}, {"sp": "", "role": "r", "id": "Sekarang ibu sudah merasa lebih baik.", "zh": "现在妈妈感觉好多了。", "a": "f2d7a44e5605", "za": "c6b8a4740b9a", "an": {"p": [["Sekarang", "现在"], ["ibu", "妈妈"], ["sudah", "已经"], ["merasa", "觉得"], ["lebih baik", "好多了"]], "b": "merasa = meN- + rasa（vt./vi. 感觉）", "g": "结构：时间 + 主语 + sudah + merasa + 形容词。lebih baik = 更好（比较级），这里指“好多了”。sudah 表示状态已经变化。"}}], "zh": "昨天我妈妈生病了。她发烧、咳嗽，还头疼。我送妈妈去家附近的诊所。在诊所，我们先在就诊台（挂号台）登记。工作人员给了我们一个排队号。在候诊室等了一会儿，我们进了诊室。医生给妈妈做了检查，开了处方。然后我陪妈妈去诊所旁边的药店。药剂师给了我们退烧药和止咳药。他说：“这个药一天吃三次，饭后吃。”药一共五万印尼盾。如果两天还没好，妈妈就要回去找医生。回到家，妈妈吃了药，还喝了很多白开水。我给妈妈煮了粥。现在妈妈感觉好多了。", "note": "扩充阅读：陪妈妈去诊所看病、买药。要点：就诊台 = meja pendaftaran（挂号台）。", "qa": [], "new": "2026-10-27"}, {"id": "t157", "kind": "text", "book": "扩充题库", "title": "扩充阅读 · 去医院看病 Ke Rumah Sakit", "lines": [{"sp": "", "role": "r", "id": "Sejak pagi perut saya sakit sekali.", "zh": "从早上起我的肚子就疼得厉害。", "a": "4b7c3dfdc835", "za": "cd1c0d8554c6", "an": {"p": [["Sejak", "自从"], ["pagi", "早上"], ["perut", "肚子"], ["saya", "我的"], ["sakit", "疼"], ["sekali", "非常"]], "b": "", "g": "结构：Sejak + 时间, 主语 + 形容词 + sekali。sejak pagi = 从早上起（一直到现在）；sakit sekali = 疼得厉害，sekali 放形容词后表“非常”。perut saya = 我的肚子。"}}, {"sp": "", "role": "r", "id": "Siang itu saya pergi ke rumah sakit dengan taksi.", "zh": "那天中午我坐出租车去了医院。", "a": "0d6f7e576c7a", "za": "18a08bdaf6af", "an": {"p": [["Siang itu", "那天中午"], ["saya", "我"], ["pergi", "去"], ["ke rumah sakit", "到医院"], ["dengan taksi", "乘出租车"]], "b": "", "g": "结构：时间 + 主语 + pergi + ke + 地点 + dengan + 交通工具。dengan + 交通工具 = 乘某种车。rumah sakit = 病人的房子 = 医院。"}}, {"sp": "", "role": "r", "id": "Di lobi, saya bertanya kepada petugas di meja informasi, \"Di mana saya harus mendaftar?\"", "zh": "在大厅，我向问询台的工作人员问：“我应该在哪里挂号？”", "a": "f87d22dcc3e2", "za": "c14578211933", "an": {"p": [["Di lobi", "在大厅"], ["saya", "我"], ["bertanya", "问"], ["kepada", "向"], ["petugas", "工作人员"], ["di meja informasi", "在问询台"], ["Di mana", "在哪里"], ["harus", "必须"], ["mendaftar", "登记、挂号"]], "b": "bertanya = ber- + tanya（vi. 问）；mendaftar = meN- + daftar（vi. 登记）", "g": "结构：地点 + 主语 + bertanya + kepada + 人, “引语”。bertanya kepada + 人 = 向某人提问。引语：Di mana + 主语 + harus + 动词？= 我应该在哪里……？"}}, {"sp": "", "role": "r", "id": "Petugas menjawab, \"Silakan ke meja pendaftaran di sebelah kiri.\"", "zh": "工作人员回答：“请到左边的就诊台（挂号台）。”", "a": "239b6a7a8444", "za": "4bb2d1eac06f", "an": {"p": [["Petugas", "工作人员"], ["menjawab", "回答"], ["Silakan", "请"], ["ke", "到"], ["meja pendaftaran", "就诊台、挂号台"], ["di sebelah kiri", "在左边"]], "b": "menjawab = meN- + jawab（vt. 回答）", "g": "结构：主语 + menjawab, “引语”。引语：Silakan + ke + 地点 = 请到……。meja pendaftaran = 挂号台（就诊台），di sebelah kiri 修饰它，说明位置。"}}, {"sp": "", "role": "r", "id": "Di meja pendaftaran, saya menunjukkan kartu identitas dan mengisi formulir.", "zh": "在就诊台，我出示了身份证件，并填了表格。", "a": "3bd3f2ac6d8e", "za": "4dcb37c9849a", "an": {"p": [["Di meja pendaftaran", "在就诊台"], ["saya", "我"], ["menunjukkan", "出示"], ["kartu identitas", "身份证件"], ["dan", "并且"], ["mengisi", "填写"], ["formulir", "表格"]], "b": "menunjukkan = meN- + tunjuk + -kan（vt. 出示）；mengisi = meN- + isi（vt. 填）", "g": "结构：地点 + 主语 + 动词 1 + 宾语 1 + dan + 动词 2 + 宾语 2。mengisi formulir = 填表（填写 isi，也有“装满”的意思）。"}}, {"sp": "", "role": "r", "id": "Lalu saya mendapat nomor antrean dan menunggu di ruang tunggu.", "zh": "然后我拿到了排队号，在候诊室等候。", "a": "0dc27d0e429c", "za": "937bd0be3b75", "an": {"p": [["Lalu", "然后"], ["saya", "我"], ["mendapat", "得到"], ["nomor antrean", "排队号"], ["dan", "并且"], ["menunggu", "等待"], ["di ruang tunggu", "在候诊室"]], "b": "mendapat = meN- + dapat（vt. 得到）", "g": "结构：连接词 + 主语 + 动词 1 + 宾语 + dan + 动词 2 + 地点。mendapat 是 mendapatkan 的简略说法，意为“得到、拿到”。"}}, {"sp": "", "role": "r", "id": "Setelah dua puluh menit, nama saya dipanggil.", "zh": "二十分钟后，叫到了我的名字。", "a": "5b27e0c042ed", "za": "bee3c83ec406", "an": {"p": [["Setelah", "在……之后"], ["dua puluh menit", "二十分钟"], ["nama saya", "我的名字"], ["dipanggil", "被叫"]], "b": "dipanggil = di- + panggil（vt. 叫 → 被叫）", "g": "结构：Setelah + 时间段, 被动句。被动：主语（nama saya）+ di-动词。直译“我的名字被叫”，实际表示叫到我了。"}}, {"sp": "", "role": "r", "id": "Saya masuk ke ruang periksa dokter umum.", "zh": "我走进了全科医生的诊室。", "a": "788deb3d1d27", "za": "8f83924c461e", "an": {"p": [["Saya", "我"], ["masuk", "进入"], ["ke ruang periksa", "到诊室"], ["dokter umum", "全科医生"]], "b": "", "g": "结构：主语 + masuk + ke + 地点。dokter umum = 普通医生（全科）；dokter spesialis = 专科医生。ruang periksa dokter umum = 全科医生的诊室。"}}, {"sp": "", "role": "r", "id": "Dokter bertanya, \"Apa keluhan Anda?\"", "zh": "医生问：“您哪里不舒服？”", "a": "ef2d9038af32", "za": "ce15be4ebd7e", "an": {"p": [["Dokter", "医生"], ["bertanya", "问"], ["Apa", "什么"], ["keluhan", "不适、主诉"], ["Anda", "您"]], "b": "keluhan = ke- + keluh + -an（n. 主诉、抱怨）", "g": "结构：主语 + bertanya, “引语”。Apa keluhan Anda? 是医生问诊的固定问法：您哪里不舒服？"}}, {"sp": "", "role": "r", "id": "Saya menjawab, \"Perut saya sakit dan saya mual sejak tadi pagi.\"", "zh": "我回答：“我肚子疼，今天早上起就一直恶心。”", "a": "3757120a5ebb", "za": "aaa5d87ed6cc", "an": {"p": [["Saya", "我"], ["menjawab", "回答"], ["Perut saya", "我的肚子"], ["sakit", "疼"], ["dan", "并且"], ["mual", "恶心"], ["sejak", "自从"], ["tadi pagi", "今天早上"]], "b": "tadi = 刚才（今天早些时候）", "g": "结构：主语 + menjawab, “引语”。引语：主语 + 形容词 + dan + 主语 + 形容词 + sejak + 时间。tadi pagi = 今天早上（已经过去的那个早上）。"}}, {"sp": "", "role": "r", "id": "Dokter memeriksa perut saya, lalu menulis resep.", "zh": "医生检查了我的肚子，然后开了处方。", "a": "bd317ed1af69", "za": "0f4cf3fd34c7", "an": {"p": [["Dokter", "医生"], ["memeriksa", "检查"], ["perut saya", "我的肚子"], ["lalu", "然后"], ["menulis", "写"], ["resep", "处方"]], "b": "memeriksa = meN- + periksa（vt. 检查）；menulis = meN- + tulis（vt. 写）", "g": "结构：主语 + 动词 1 + 宾语, lalu + 动词 2 + 宾语。menulis resep = 开处方（写处方）。"}}, {"sp": "", "role": "r", "id": "Saya mengambil obat di apotek rumah sakit dan membayar di kasir.", "zh": "我在医院药房拿了药，并在收银台付了钱。", "a": "c8258cc7c202", "za": "e6cde0670453", "an": {"p": [["Saya", "我"], ["mengambil", "拿"], ["obat", "药"], ["di apotek rumah sakit", "在医院药房"], ["dan", "并且"], ["membayar", "付钱"], ["di kasir", "在收银台"]], "b": "mengambil = meN- + ambil（vt. 拿）；membayar = meN- + bayar（vt./vi. 付）", "g": "结构：主语 + 动词 1 + 宾语 + 地点 + dan + 动词 2 + 地点。apotek rumah sakit = 医院里的药房；kasir = 收银台。"}}, {"sp": "", "role": "r", "id": "Dokter berpesan agar saya makan teratur dan banyak beristirahat.", "zh": "医生嘱咐我要按时吃饭、多休息。", "a": "88feae45b0bf", "za": "f6a27a559007", "an": {"p": [["Dokter", "医生"], ["berpesan", "嘱咐"], ["agar", "以便"], ["saya", "我"], ["makan", "吃饭"], ["teratur", "有规律"], ["dan", "并且"], ["banyak", "多"], ["beristirahat", "休息"]], "b": "berpesan = ber- + pesan（vi. 留话、嘱咐）；teratur = ter- + atur（adj. 有条理的）；beristirahat = ber- + istirahat（vi. 休息）", "g": "结构：主语 + berpesan + agar + 从句。berpesan agar…… = 嘱咐……（要……）。makan teratur = 按时吃饭；banyak beristirahat = 多休息。"}}], "zh": "从早上起我的肚子就疼得厉害。那天中午我坐出租车去了医院。在大厅，我向问询台的工作人员问：“我应该在哪里挂号？”工作人员回答：“请到左边的就诊台（挂号台）。”在就诊台，我出示了身份证件，并填了表格。然后我拿到了排队号，在候诊室等候。二十分钟后，叫到了我的名字。我走进了全科医生的诊室。医生问：“您哪里不舒服？”我回答：“我肚子疼，今天早上起就一直恶心。”医生检查了我的肚子，然后开了处方。我在医院药房拿了药，并在收银台付了钱。医生嘱咐我要按时吃饭、多休息。", "note": "扩充阅读（扩充内容）：去大医院看病的流程。就诊台 = meja pendaftaran（挂号台）；问询台 = meja informasi。", "qa": [], "new": "2026-10-27"}, {"id": "t158", "kind": "trans", "book": "扩充题库", "title": "我的句子", "lines": [{"sp": "", "role": "t", "id": "Saya selalu mencatat di kelas agar saya lebih mudah paham.", "zh": "我总是在课堂上记笔记，让我更容易明白。", "a": "8a7b046ebb4d", "za": "c51c53e59098", "an": {"p": [["Saya", "我（代词）"], ["selalu", "总是（副词）"], ["mencatat", "记笔记、记下（及物动词）"], ["di kelas", "在课堂上（介词 + 名词）"], ["agar", "为了让、以便（连词）"], ["saya", "我"], ["lebih mudah", "更容易（副词 + 形容词）"], ["paham", "明白、理解（形容词）"]], "b": "mencatat = catat 记录 + meN-（词根加 meN- 变成主动的及物动词）；paham 是形容词，不加词缀，意思是“（对我来说）是明白的”", "g": "结构：主句（Saya selalu mencatat di kelas）+ agar + 目的从句（saya lebih mudah paham）。agar 后面接带主语的完整小句，表示目的“为了让……”，和 supaya 同义。lebih + 形容词 = 更……：lebih mudah = 更容易。mudah paham = 容易明白（形容词 + 形容词）。selalu 放在动词前。"}}], "zh": "", "note": "", "qa": []}, {"id": "e159", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 练习 · 口语问答 15 题（市场 / 健康 / 工作）", "lines": [{"sp": "考官", "role": "q", "id": "Kalau kamu punya kesempatan tampil di panggung, kamu ingin membeli alat musik apa?", "zh": "如果有机会上台表演，你想买什么乐器？", "a": "1398212544c0", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["punya kesempatan", "有机会"], ["tampil", "登台表演"], ["di panggung", "在舞台上"], ["ingin", "想"], ["membeli", "买"], ["alat musik apa", "什么乐器"]], "b": "kesempatan = ke- + sempat + -an；panggung = n. 舞台", "g": "结构：Kalau + 条件, 主语 + ingin + 动词 + 宾语 + apa？punya kesempatan + 动词 = 有机会做……。"}}, {"sp": "参考回答", "role": "a", "id": "Saya ingin membeli gitar, karena suaranya bagus dan mudah dibawa.", "zh": "我想买吉他，因为声音好听，而且方便带。", "a": "5e14fe1b4f5c", "an": {"p": [["Saya", "我"], ["ingin", "想"], ["membeli gitar", "买吉他"], ["karena", "因为"], ["suaranya", "它的声音"], ["bagus", "好听"], ["dan", "并且"], ["mudah dibawa", "容易携带"]], "b": "dibawa = di- + bawa（被带）", "g": "结构：主语 + ingin + 动词短语, karena + 主语 + 形容词 + dan + mudah + 被动。mudah + di-动词 = 容易被……。"}}, {"sp": "考官", "role": "q", "id": "Kamu bekerja berapa jam setiap hari? Apakah kamu merasa lelah?", "zh": "你每天工作几小时？会觉得累吗？", "a": "5d2d81d4337f", "an": {"p": [["Kamu", "你"], ["bekerja", "工作"], ["berapa jam", "几个小时"], ["setiap hari", "每天"], ["Apakah", "是否"], ["merasa", "觉得"], ["lelah", "累"]], "b": "", "g": "结构：主语 + 动词 + berapa + 时间单位 + 频率？berapa jam = 几小时。Apakah + 主语 + merasa + 形容词？"}}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja delapan jam setiap hari. Saya merasa sedikit lelah setelah bekerja lama.", "zh": "我每天工作八小时，工作久了会有点累。", "a": "672967aca6ea", "an": {"p": [["Saya", "我"], ["bekerja", "工作"], ["delapan jam", "八小时"], ["setiap hari", "每天"], ["merasa", "觉得"], ["sedikit", "有点"], ["lelah", "累"], ["setelah", "之后"], ["bekerja lama", "工作很久"]], "b": "", "g": "结构：主语 + 动词 + 数字 + 单位；主语 + merasa + sedikit + 形容词 + setelah + 动词短语。sedikit + 形容词 = 有点……。"}}, {"sp": "考官", "role": "q", "id": "Terakhir kali kamu ke pasar beli apa? Mahal tidak?", "zh": "你上次去市场买了什么？贵不贵？", "a": "f2433ee915be", "an": {"p": [["Terakhir kali", "上一次"], ["kamu", "你"], ["ke pasar", "去市场"], ["beli", "买"], ["apa", "什么"], ["Mahal tidak", "贵不贵"]], "b": "", "g": "结构：Terakhir kali + 主语 + 动词 + 宾语？口语省略 meN-（beli）。Mahal tidak? = 贵吗？（形容词 + tidak 口语问法）。"}}, {"sp": "参考回答", "role": "a", "id": "Terakhir kali saya ke pasar, saya membeli durian dan susu. Harganya tidak mahal.", "zh": "上次我去市场买了榴莲和牛奶，价格不贵。", "a": "73369b8c5edb", "an": {"p": [["Terakhir kali", "上一次"], ["saya ke pasar", "我去市场"], ["saya membeli", "我买了"], ["durian", "榴莲"], ["dan", "和"], ["susu", "牛奶"], ["Harganya", "价格"], ["tidak mahal", "不贵"]], "b": "harganya = harga + -nya", "g": "结构：Terakhir kali + 从句, 主语 + 动词 + 宾语。Harganya tidak mahal = 价格不贵。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu suka menawar harga sebelum membeli sesuatu?", "zh": "买东西之前你喜欢砍价吗？", "a": "6372e1168e25", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["suka", "喜欢"], ["menawar", "砍价"], ["harga", "价格"], ["sebelum", "在……之前"], ["membeli", "买"], ["sesuatu", "东西"]], "b": "menawar = meN- + tawar（vt. 讨价还价）", "g": "结构：Apakah + 主语 + suka + 动词 + 宾语 + sebelum + 动作？menawar harga = 砍价。sesuatu = 某样东西。"}}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka menawar harga di pasar tradisional agar lebih murah.", "zh": "是的，我喜欢在传统市场砍价，这样更便宜。", "a": "f12aa2ae6806", "an": {"p": [["Ya", "是的"], ["saya", "我"], ["suka", "喜欢"], ["menawar harga", "砍价"], ["di pasar tradisional", "在传统市场"], ["agar", "以便"], ["lebih murah", "更便宜"]], "b": "", "g": "结构：Ya, 主语 + suka + 动词短语 + agar + 比较级。agar lebih + 形容词 = 为了更……。"}}, {"sp":
