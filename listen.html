eca0c", "aa": "d5eeb790a759", "qz": "Lia 昨天做了什么？", "az": "发生日邀请。"}, {"q": "Apa yang akan Lia lakukan besok?", "a": "Membeli baju ulang tahun.", "qa": "2a79e159e783", "aa": "94b79ea97ba2", "qz": "Lia 明天要做什么？", "az": "买生日穿的衣服。"}, {"q": "Lusa Lia akan pergi ke mana?", "a": "Ke toko kue.", "qa": "aa87f5f1d269", "aa": "dd9f562c77d9", "qz": "Lia 后天要去哪里？", "az": "去蛋糕店。"}], "u": 4}, {"id": "t62", "kind": "text", "book": "BIPA 1", "title": "去瓦埃雷博村旅游（课文 5.1）", "lines": [{"sp": "", "role": "r", "id": "Bulan lalu, saya dan Anjani berwisata ke Wae Rebo, Nusa Tenggara Timur.", "zh": "上个月，我和 Anjani 去东努沙登加拉的 Wae Rebo 旅游。", "a": "fd8fce4d3ad6", "za": "c60c6090acd4", "an": {"p": [["Bulan lalu", "上个月"], ["saya dan Anjani", "我和安佳妮"], ["berwisata", "旅游"], ["ke", "到"], ["Wae Rebo", "瓦埃雷博（村）"], ["Nusa Tenggara Timur", "东努沙登加拉"]], "b": "berwisata = ber- + wisata", "g": "结构：时间 + 主语（saya dan Anjani）+ berwisata ke + 地点。wisata 旅游，berwisata 做旅游这件事。"}}, {"sp": "", "role": "r", "id": "Kami berdua tiba di Nusa Tenggara Timur pada malam hari.", "zh": "我们俩晚上到达东努沙登加拉。", "a": "e504b015a481", "za": "7199de4de6b2", "an": {"p": [["Kami berdua", "我们两个"], ["tiba", "到达"], ["di", "在"], ["Nusa Tenggara Timur", "东努沙登加拉"], ["pada malam hari", "在夜间"]], "b": "", "g": "结构：主语 + tiba di + 地点 + pada + 时段。kami 排除听话人的“我们”；berdua = 两人一起（ber- + dua）。"}}, {"sp": "", "role": "r", "id": "Esoknya, kami berjalan kaki menuju desa Wae Rebo selama empat jam.", "zh": "第二天，我们步行四个小时去 Wae Rebo 村。", "a": "5a56dd9b1d12", "za": "9010ca0642e3", "an": {"p": [["Esoknya", "第二天"], ["kami", "我们"], ["berjalan kaki", "步行"], ["menuju", "前往"], ["desa", "村子"], ["Wae Rebo", "瓦埃雷博"], ["selama", "持续"], ["empat jam", "四小时"]], "b": "esoknya = esok + -nya；berjalan = ber- + jalan；menuju = meN- + tuju", "g": "结构：时间 + 主语 + berjalan kaki + menuju + 目的地 + selama + 时长。esoknya = 过去叙述里的“次日”；selama 后面接持续时间。"}}, {"sp": "", "role": "r", "id": "Di sana ada tujuh rumah adat berbentuk kerucut.", "zh": "那里有七座圆锥形的传统房屋。", "a": "222bd3348c6b", "za": "f9305589b0a0", "an": {"p": [["Di sana", "在那里"], ["ada", "有"], ["tujuh", "七"], ["rumah adat", "传统民居"], ["berbentuk", "呈……形状"], ["kerucut", "圆锥"]], "b": "berbentuk = ber- + bentuk", "g": "结构：Di sana ada + 数量 + 名词 + 修饰语。berbentuk + 形状 = 形状是……的，直接跟在名词后做定语。"}}, {"sp": "", "role": "r", "id": "Kami menginap di rumah adat itu.", "zh": "我们住在那种传统房屋里。", "a": "ffb7a4b4b420", "za": "93086e5953eb", "an": {"p": [["Kami", "我们"], ["menginap", "住宿、过夜"], ["di", "在"], ["rumah adat", "传统民居"], ["itu", "那个"]], "b": "menginap = meN- + inap", "g": "结构：主语 + menginap di + 地点。itu 放在名词后，表示“那个”。"}}, {"sp": "", "role": "r", "id": "Hari berikutnya, kami berkeliling di desa Wae Rebo.", "zh": "第三天，我们在 Wae Rebo 村里四处逛。", "a": "528af45dbf0a", "za": "ff9a24deca99", "an": {"p": [["Hari berikutnya", "接下来的一天"], ["kami", "我们"], ["berkeliling", "四处转"], ["di", "在"], ["desa", "村子"], ["Wae Rebo", "瓦埃雷博"]], "b": "berikutnya = ber- + ikut + -nya；berkeliling = ber- + keliling", "g": "结构：时间 + 主语 + berkeliling di + 地点。berkeliling = 转一圈、到处逛。"}}, {"sp": "", "role": "r", "id": "Desa ini bercuaca dingin.", "zh": "这个村子天气很冷。", "a": "82a6689919be", "za": "b3af1cf849a4", "an": {"p": [["Desa", "村子"], ["ini", "这个"], ["bercuaca", "天气是……"], ["dingin", "冷"]], "b": "bercuaca = ber- + cuaca", "g": "结构：主语 + bercuaca + 形容词。ber- + 名词表示“具有……”：bercuaca dingin = 天气冷。"}}, {"sp": "", "role": "r", "id": "Kami berbaju tebal.", "zh": "我们穿着厚衣服。", "a": "ac970f35d5b5", "za": "ae39dd59d40d", "an": {"p": [["Kami", "我们"], ["berbaju", "穿着衣服"], ["tebal", "厚"]], "b": "berbaju = ber- + baju", "g": "结构：主语 + ber-衣物 + 形容词。ber- + 衣物名词表示穿着：berbaju tebal = 穿着厚衣服。"}}, {"sp": "", "role": "r", "id": "Kami juga berfoto dengan penduduk desa Wae Rebo.", "zh": "我们还和 Wae Rebo 村的村民合了影。", "a": "b1e69522bbd9", "za": "ed183e6a1c97", "an": {"p": [["Kami", "我们"], ["juga", "也"], ["berfoto", "拍照"], ["dengan", "和"], ["penduduk desa", "村民"], ["Wae Rebo", "瓦埃雷博"]], "b": "berfoto = ber- + foto；penduduk = pen- + duduk", "g": "结构：主语 + juga + berfoto dengan + 人。berfoto = 拍照（做拍照这件事）。"}}, {"sp": "", "role": "r", "id": "Sebelum pulang, kami berbelanja oleh-oleh.", "zh": "回去之前，我们买了伴手礼。", "a": "e0d2e04c8c7d", "za": "234c9d65f08b", "an": {"p": [["Sebelum", "在……之前"], ["pulang", "回去"], ["kami", "我们"], ["berbelanja", "购物"], ["oleh-oleh", "伴手礼"]], "b": "berbelanja = ber- + belanja", "g": "结构：Sebelum + 动词, 主语 + 动词 + 宾语。sebelum pulang = 回去之前。oleh-oleh = 旅行带回的特产。"}}, {"sp": "", "role": "r", "id": "Kami membeli roti kompiang dan kopi Flores.", "zh": "我们买了 kompiang 面包和弗洛勒斯咖啡。", "a": "40cdf8555bb4", "za": "f18937e9b375", "an": {"p": [["Kami", "我们"], ["membeli", "买"], ["roti kompiang", "孔皮昂饼（巴厘烤饼）"], ["dan", "和"], ["kopi Flores", "弗洛雷斯咖啡"]], "b": "membeli = meN- + beli", "g": "结构：主语 + membeli + 宾语 1 + dan + 宾语 2。Flores 是东努沙登加拉的岛，以咖啡闻名。"}}, {"sp": "", "role": "r", "id": "Roti kompiang bertabur wijen dan berasa gurih.", "zh": "kompiang 面包撒着芝麻，味道咸香。", "a": "bdf66b0ec85c", "za": "a68b3b51a5bf", "an": {"p": [["Roti kompiang", "孔皮昂饼"], ["bertabur", "撒有"], ["wijen", "芝麻"], ["dan", "并且"], ["berasa", "味道"], ["gurih", "咸香"]], "b": "bertabur = ber- + tabur；berasa = ber- + rasa", "g": "结构：主语 + bertabur + 宾语 + dan + berasa + 形容词。bertabur = 被撒上（ber- 表示带有）；gurih = 咸鲜香。"}}, {"sp": "", "role": "r", "id": "Sementara itu, kopi Flores beraroma sedap dan wangi.", "zh": "而弗洛勒斯咖啡闻起来又香又浓。", "a": "b1ccb82fe66a", "za": "9a70ceb6f247", "an": {"p": [["Sementara itu", "与此同时（另一方面）"], ["kopi Flores", "弗洛雷斯咖啡"], ["beraroma", "有……香气"], ["sedap", "好闻（好吃）"], ["dan", "和"], ["wangi", "芳香"]], "b": "beraroma = ber- + aroma", "g": "结构：连接词（Sementara itu）+ 主语 + beraroma + 形容词。Sementara itu 引出对比或并行的另一件事。"}}, {"sp": "", "role": "r", "id": "Malam harinya, kami pulang ke Jakarta.", "zh": "当天晚上，我们回到了雅加达。", "a": "1cf498822e59", "za": "949878815ace", "an": {"p": [["Malam harinya", "当天夜里"], ["kami", "我们"], ["pulang", "回去"], ["ke", "到"], ["Jakarta", "雅加达"]], "b": "harinya = hari + -nya（那一天的）", "g": "结构：时间 + 主语 + pulang ke + 地点。-nya 使“夜里”指前面所说的那一天。"}}], "zh": "上个月，我和 Anjani 去东努沙登加拉的瓦埃雷博村旅游。我们俩晚上到达东努沙登加拉。第二天，我们步行四个小时前往瓦埃雷博村。那里有七座圆锥形的传统房屋，我们就住在里面。再下一天，我们在村里四处转了转。这个村子天气很冷，我们穿着厚衣服，还和村民合了影。回家前我们买了特产：馄饨饼和弗洛勒斯咖啡。馄饨饼上撒着芝麻，味道香脆；弗洛勒斯咖啡则香气浓郁。当天晚上，我们回到了雅加达。", "note": "", "qa": [{"q": "Kapan mereka pergi ke desa Wae Rebo?", "a": "Bulan lalu.", "qa": "d80b78fc08c7", "aa": "1d4866050258", "qz": "他们什么时候去的 Wae Rebo 村？", "az": "上个月。"}, {"q": "Bagaimana mereka sampai ke desa Wae Rebo?", "a": "Berjalan kaki selama empat jam.", "qa": "76d6a782db96", "aa": "abf1e73323fd", "qz": "他们是怎么到 Wae Rebo 村的？", "az": "步行了四个小时。"}, {"q": "Ada berapa rumah adat di desa Wae Rebo?", "a": "Tujuh rumah adat.", "qa": "85bc00dfe352", "aa": "a1b75458a57d", "qz": "Wae Rebo 村有几座传统房屋？", "az": "七座。"}, {"q": "Bagaimana cuaca di desa Wae Rebo?", "a": "Dingin.", "qa": "7f6af5fce409", "aa": "dfa1e7815317", "qz": "Wae Rebo 村天气怎么样？", "az": "很冷。"}, {"q": "Apa yang mereka lakukan sebelum pulang?", "a": "Berbelanja oleh-oleh: roti kompiang dan kopi Flores.", "qa": "3abfaf73aa65", "aa": "7de5b3c0a52c", "qz": "他们回去前做了什么？", "az": "买伴手礼：kompiang 面包和弗洛勒斯咖啡。"}], "u": 5}, {"id": "t63", "kind": "text", "book": "BIPA 1", "title": "Rani 的星期天（音频 6）", "lines": [{"sp": "", "role": "r", "id": "Setiap hari Minggu saya bangun siang.", "zh": "每个星期天我都睡到中午才起。", "a": "9ec621d55df1", "za": "63a3351607cf", "an": {"p": [["Setiap", "每个"], ["hari Minggu", "星期日"], ["saya", "我"], ["bangun", "起床"], ["siang", "中午、白天"]], "b": "", "g": "结构：时间 + 主语 + 动词 + 修饰语。bangun siang = 起得晚（一直睡到白天）。"}}, {"sp": "", "role": "r", "id": "Setelah itu, saya mandi.", "zh": "然后我洗澡。", "a": "2beb156dd853", "za": "3f662e22aa5a", "an": {"p": [["Setelah itu", "之后"], ["saya", "我"], ["mandi", "洗澡"]], "b": "", "g": "结构：连接词 + 主语 + 动词。Setelah itu = 然后，用来按顺序叙述。"}}, {"sp": "", "role": "r", "id": "Saya lalu membaca buku.", "zh": "接着我看书。", "a": "57df5231ab5c", "za": "f20ed42989b2", "an": {"p": [["Saya", "我"], ["lalu", "然后"], ["membaca", "读"], ["buku", "书"]], "b": "membaca = meN- + baca", "g": "结构：主语 + lalu + 动词 + 宾语。lalu 放在主语后，表示接着发生。"}}, {"sp": "", "role": "r", "id": "Saya juga makan camilan.", "zh": "我还吃零食。", "a": "0900b0ddb6cf", "za": "eed9287bb57a", "an": {"p": [["Saya", "我"], ["juga", "也"], ["makan", "吃"], ["camilan", "零食"]], "b": "", "g": "结构：主语 + juga + 动词 + 宾语。juga 紧跟主语，表示“也”。"}}, {"sp": "", "role": "r", "id": "Saya mencuci baju.", "zh": "我洗衣服。", "a": "af3f27353e19", "za": "2ea92195becd", "an": {"p": [["Saya", "我"], ["mencuci", "洗"], ["baju", "衣服"]], "b": "mencuci = meN- + cuci（meN- 遇 c 变 men-）", "g": "结构：主语 + 动词 + 宾语。"}}, {"sp": "", "role": "r", "id": "Sebelum itu, saya berbelanja di pasar.", "zh": "在那之前，我去市场买东西。", "a": "98b28e2f6d54", "za": "8947e12a2202", "an": {"p": [["Sebelum itu", "在那之前"], ["saya", "我"], ["berbelanja", "购物"], ["di", "在"], ["pasar", "市场"]], "b": "berbelanja = ber- + belanja", "g": "结构：Sebelum itu 是连接语，表示时间在前面所述动作之前。"}}, {"sp": "", "role": "r", "id": "Setelah itu, saya masak.", "zh": "之后，我做饭。", "a": "3ded1789a16c", "za": "0fa3c0a3ea7a", "an": {"p": [["Setelah itu", "之后"], ["saya", "我"], ["masak", "做饭"]], "b": "", "g": "结构：连接词 + 主语 + 动词。masak 是不及物动词（口语），正式为 memasak。"}}, {"sp": "", "role": "r", "id": "Kemudian, saya makan siang.", "zh": "然后，我吃午饭。", "a": "83b1180ea4a7", "za": "9566fd60f23b", "an": {"p": [["Kemudian", "然后"], ["saya", "我"], ["makan siang", "吃午饭"]], "b": "", "g": "结构：连接词 + 主语 + 动词短语。Kemudian 是书面常用顺序词。"}}, {"sp": "", "role": "r", "id": "Saya juga tidur siang.", "zh": "我还睡午觉。", "a": "334a00d0ecd6", "za": "743622c7264d", "an": {"p": [["Saya", "我"], ["juga", "也"], ["tidur siang", "午睡"]], "b": "", "g": "结构：主语 + juga + 动词短语。tidur siang = 睡午觉。"}}, {"sp": "", "role": "r", "id": "Sore hari saya bersepeda berkeliling kampung.", "zh": "傍晚我骑自行车在村子里转一圈。", "a": "9cb733266dc8", "za": "7be1907a59da", "an": {"p": [["Sore hari", "下午"], ["saya", "我"], ["bersepeda", "骑自行车"], ["berkeliling", "绕一圈"], ["kampung", "村子"]], "b": "bersepeda = ber- + sepeda；berkeliling = ber- + keliling", "g": "结构：时间 + 主语 + 动词 + 动词 + 地点。两个动词连用：骑车 + 绕着村子转。"}}], "zh": "每个星期天我都起得很晚。之后我洗澡，接着看书，还吃点零食。我洗衣服，在那之前我先去市场买东西。之后我做饭，然后吃午饭，还睡午觉。下午我骑自行车在村子里转一圈。", "note": "", "qa": [{"q": "Rani bangun pagi atau siang?", "a": "Rani bangun siang.", "qa": "90a966ad5e67", "aa": "84baf06a86dd", "qz": "Rani 是早上起床还是中午起床？", "az": "Rani 中午才起床。"}, {"q": "Apakah Rani makan malam?", "a": "Tidak disebutkan; Rani makan siang.", "qa": "5d006538a89a", "aa": "35cc753c287f", "qz": "Rani 吃晚饭了吗？", "az": "文中没说；Rani 吃了午饭。"}, {"q": "Sore hari Rani melakukan apa?", "a": "Bersepeda berkeliling kampung.", "qa": "a6f570cf496e", "aa": "4cead6e615bf", "qz": "Rani 下午做什么？", "az": "骑自行车在村子里转一圈。"}], "u": 6}, {"id": "t64", "kind": "text", "book": "BIPA 1", "title": "Dina 的一天（课文 6.1）", "lines": [{"sp": "", "role": "r", "id": "Hai, saya Dina.", "zh": "嗨，我是 Dina。", "a": "29b130df579e", "za": "76996d42994d", "an": {"p": [["Hai", "嗨"], ["saya", "我"], ["Dina", "迪娜"]], "b": "", "g": "结构：问候 + saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya akan bercerita tentang kegiatan harian saya.", "zh": "我来讲讲我每天的活动。", "a": "c6d5c943b73c", "za": "8a1f9f8df0a1", "an": {"p": [["Saya", "我"], ["akan", "将要"], ["bercerita", "讲述"], ["tentang", "关于"], ["kegiatan harian", "日常活动"], ["saya", "我的"]], "b": "bercerita = ber- + cerita；kegiatan = ke- + giat + -an；harian = hari + -an", "g": "结构：主语 + akan + bercerita tentang + 主题。tentang 后面接话题；harian = 每日的。"}}, {"sp": "", "role": "r", "id": "Pada pagi hari biasanya saya bangun pukul 05.00.", "zh": "早上我一般五点起床。", "a": "afd86a6d47d0", "za": "f01153aa6dd3", "an": {"p": [["Pada pagi hari", "在早晨"], ["biasanya", "通常"], ["saya", "我"], ["bangun", "起床"], ["pukul 05.00", "五点钟"]], "b": "biasanya = biasa + -nya", "g": "结构：时间 + biasanya + 主语 + 动词 + pukul + 钟点。pukul + 数字 = ……点钟。"}}, {"sp": "", "role": "r", "id": "Setelah salat subuh, saya mandi dan berpakaian kerja.", "zh": "做完晨礼后，我洗澡、换上上班的衣服。", "a": "ea957dfdd3f9", "za": "3ab65b242578", "an": {"p": [["Setelah", "在……之后"], ["salat subuh", "晨祷"], ["saya", "我"], ["mandi", "洗澡"], ["dan", "和"], ["berpakaian", "穿衣"], ["kerja", "工作"]], "b": "berpakaian = ber- + pakaian；pakaian = pakai 穿 + -an", "g": "结构：Setelah + 动作, 主语 + 动词 1 + dan + 动词 2。berpakaian kerja = 穿上工作服。subuh = 黎明的祷告时间。"}}, {"sp": "", "role": "r", "id": "Saya tidak pernah lupa untuk salat.", "zh": "我从来不会忘记做礼拜。", "a": "f34fbf020d63", "za": "e6d2d4a94c22", "an": {"p": [["Saya", "我"], ["tidak", "不"], ["pernah", "曾经"], ["lupa", "忘记"], ["untuk", "去（做）"], ["salat", "礼拜"]], "b": "", "g": "结构：主语 + tidak pernah + 动词 + untuk + 动作。tidak pernah = 从不，强调“从来不”。"}}, {"sp": "", "role": "r", "id": "Saya sarapan sekitar pukul 06.00.", "zh": "我大约六点吃早饭。", "a": "075245a8fbe5", "za": "ba51ce2c7674", "an": {"p": [["Saya", "我"], ["sarapan", "吃早餐"], ["sekitar", "大约"], ["pukul 06.00", "六点钟"]], "b": "sekitar = se- + kitar", "g": "结构：主语 + 动词 + sekitar + pukul + 钟点。sekitar = 大约，用于时间或数量。"}}, {"sp": "", "role": "r", "id": "Saya bekerja pada pukul 08.00—16.00.", "zh": "我的工作时间是八点到十六点。", "a": "5488bf067d40", "za": "346aed168c6c", "an": {"p": [["Saya", "我"], ["bekerja", "工作"], ["pada pukul", "在……点"], ["08.00—16.00", "八点到十六点"]], "b": "bekerja = ber- + kerja", "g": "结构：主语 + bekerja + pada pukul + 起止时间。破折号表示“从……到”。"}}, {"sp": "", "role": "r", "id": "Saya selalu makan siang di kantin pukul 12.00—13.00.", "zh": "我总是十二点到十三点在食堂吃午饭。", "a": "9785f31566f5", "za": "ac46f724ec0b", "an": {"p": [["Saya", "我"], ["selalu", "总是"], ["makan siang", "吃午饭"], ["di", "在"], ["kantin", "食堂"], ["pukul 12.00—13.00", "十二点到十三点"]], "b": "", "g": "结构：主语 + selalu + 动词短语 + 地点 + 时间。频率副词 selalu 放在动词前。"}}, {"sp": "", "role": "r", "id": "Selesai bekerja, saya langsung pulang ke rumah.", "zh": "下班后，我直接回家。", "a": "1ef4fc67eef9", "za": "1d78eda1313b", "an": {"p": [["Selesai", "结束"], ["bekerja", "工作"], ["saya", "我"], ["langsung", "直接"], ["pulang", "回"], ["ke rumah", "到家"]], "b": "selesai = se- + lesai", "g": "结构：Selesai + 动词, 主语 + langsung + 动词。Selesai bekerja = 下班后；langsung = 马上、直接。"}}, {"sp": "", "role": "r", "id": "Saya biasanya sampai rumah pukul 17.00.", "zh": "我一般十七点到家。", "a": "ff8a322c7eba", "za": "4d8c3084f0d3", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["sampai", "到达"], ["rumah", "家"], ["pukul 17.00", "十七点"]], "b": "", "g": "结构：主语 + biasanya + sampai + 地点 + 时间。sampai 后可直接接地点（不需要 di）。"}}, {"sp": "", "role": "r", "id": "Jika jalanan macet, kadang-kadang saya sampai di rumah pukul 18.00.", "zh": "如果路上堵车，有时候十八点才到家。", "a": "88a96ea9f500", "za": "197e7577df9c", "an": {"p": [["Jika", "如果"], ["jalanan", "路面"], ["macet", "堵车"], ["kadang-kadang", "有时候"], ["saya", "我"], ["sampai di rumah", "到家"], ["pukul 18.00", "十八点"]], "b": "jalanan = jalan + -an", "g": "结构：Jika + 条件, 主句。jika/kalau = 如果。kadang-kadang 重叠，表示“偶尔、有时”。"}}, {"sp": "", "role": "r", "id": "Saya agak malas makan malam.", "zh": "我不太想吃晚饭。", "a": "10d0709c5afc", "za": "0011a3d381fb", "an": {"p": [["Saya", "我"], ["agak", "有点"], ["malas", "懒得"], ["makan malam", "吃晚饭"]], "b": "", "g": "结构：主语 + agak + 形容词 + 动词短语。agak 减弱程度：有点。"}}, {"sp": "", "role": "r", "id": "Jadi, saya menonton televisi atau membaca buku.", "zh": "所以，我看电视或者看书。", "a": "a2d6f5dc3907", "za": "98d4507e8128", "an": {"p": [["Jadi", "所以"], ["saya", "我"], ["menonton", "观看"], ["televisi", "电视"], ["atau", "或者"], ["membaca", "读"], ["buku", "书"]], "b": "menonton = meN- + tonton；membaca = meN- + baca", "g": "结构：Jadi + 主语 + 动词 1 + atau + 动词 2。atau = 或者，连接选择。"}}, {"sp": "", "role": "r", "id": "Lalu, saya tidur sekitar pukul 22.00.", "zh": "然后，我大约二十二点睡觉。", "a": "3324668f9b56", "za": "c1178add504c", "an": {"p": [["Lalu", "然后"], ["saya", "我"], ["tidur", "睡觉"], ["sekitar", "大约"], ["pukul 22.00", "二十二点"]], "b": "", "g": "结构：连接词 + 主语 + 动词 + sekitar + 时间。"}}, {"sp": "", "role": "r", "id": "Pada akhir pekan saya sering pergi menonton film di bioskop dengan teman-teman.", "zh": "周末我常和朋友去电影院看电影。", "a": "9b1a3c2fcdc1", "za": "5d948c07fe13", "an": {"p": [["Pada akhir pekan", "在周末"], ["saya", "我"], ["sering", "经常"], ["pergi", "去"], ["menonton film", "看电影"], ["di bioskop", "在电影院"], ["dengan teman-teman", "和朋友们"]], "b": "menonton = meN- + tonton；akhir pekan = 结尾 + 周", "g": "结构：时间 + 主语 + sering + pergi + 动词短语 + 地点 + dengan + 人。pergi + 动词 = 去做某事。"}}, {"sp": "", "role": "r", "id": "Saya jarang ada di rumah.", "zh": "我很少待在家里。", "a": "7ad08b28ac9a", "za": "8a67410abc41", "an": {"p": [["Saya", "我"], ["jarang", "很少"], ["ada", "在"], ["di rumah", "在家"]], "b": "", "g": "结构：主语 + jarang + ada di + 地点。ada 表示“在（某处）”。jarang = 很少。"}}], "zh": "你好，我是 Dina，我来讲讲我的日常。早上我通常五点起床，做完晨礼后洗澡、换上工作服。我从不忘记礼拜。我大约六点吃早饭。我的工作时间是八点到十六点，总是在十二点到十三点之间在食堂吃午饭。下班后我直接回家，通常十七点到家；如果路上堵车，有时十八点才到。我有点懒得吃晚饭，所以就看电视或看书，然后大约二十二点睡觉。周末我常和朋友们去电影院看电影，很少待在家里。", "note": "", "qa": [{"q": "Pukul berapa biasanya Dina tidur?", "a": "Sekitar pukul 22.00.", "qa": "8550bdfa7426", "aa": "c9121bd2ca31", "qz": "Dina 一般几点睡觉？", "az": "大约二十二点。"}, {"q": "Pukul berapa Dina bekerja?", "a": "Pukul 08.00—16.00.", "qa": "3ad354c5d96b", "aa": "57d6918e6328", "qz": "Dina 几点上班？", "az": "八点到十六点。"}, {"q": "Di mana Dina makan siang?", "a": "Di kantin.", "qa": "5a4dcad785c2", "aa": "ee5202f4e8a3", "qz": "Dina 在哪里吃午饭？", "az": "在食堂。"}, {"q": "Apa yang biasa dilakukan Dina setelah pulang kerja?", "a": "Menonton televisi atau membaca buku.", "qa": "b794bafbd163", "aa": "20f0cbea08bf", "qz": "Dina 下班后通常做什么？", "az": "看电视或者看书。"}, {"q": "Apa yang Dina lakukan pada akhir pekan?", "a": "Menonton film di bioskop dengan teman-teman.", "qa": "22922705dc3b", "aa": "067c0debe311", "qz": "Dina 周末做什么？", "az": "和朋友去电影院看电影。"}], "u": 6}, {"id": "t65", "kind": "text", "book": "BIPA 1", "title": "勤奋的 Lisa（课文 6.2）", "lines": [{"sp": "", "role": "r", "id": "Adik Santi sangat rajin.", "zh": "Santi 的妹妹很勤快。", "a": "9b94b362fbe3", "za": "41f8b2635108", "an": {"p": [["Adik", "弟弟／妹妹"], ["Santi", "桑蒂"], ["sangat", "很"], ["rajin", "勤奋"]], "b": "", "g": "结构：主语（Adik Santi，桑蒂的妹妹）+ sangat + 形容词。形容词作谓语不需要 adalah。"}}, {"sp": "", "role": "r", "id": "Namanya Lisa.", "zh": "她叫 Lisa。", "a": "6dddbd40aa94", "za": "08b32c590b45", "an": {"p": [["Namanya", "她的名字"], ["Lisa", "丽莎"]], "b": "namanya = nama + -nya", "g": "结构：-nya 指前一句的人（桑蒂的妹妹）。"}}, {"sp": "", "role": "r", "id": "Ia sudah bangun pada pukul 04.00.", "zh": "她四点就起床了。", "a": "60b36c72b10e", "za": "07e2e84825d0", "an": {"p": [["Ia", "她"], ["sudah", "已经"], ["bangun", "起床"], ["pada pukul 04.00", "在四点钟"]], "b": "Ia = 第三人称，比 dia 书面", "g": "结构：主语 + sudah + 动词 + pada pukul + 时间。sudah 表示已经完成。"}}, {"sp": "", "role": "r", "id": "Setiap pukul 04.30 pagi dia akan membangunkan Santi.", "zh": "每天早上四点半她都会叫醒 Santi。", "a": "e818faef48e7", "za": "b5482b0ecbf1", "an": {"p": [["Setiap", "每次"], ["pukul 04.30", "四点半"], ["pagi", "早上"], ["dia", "她"], ["akan", "会"], ["membangunkan", "叫醒"], ["Santi", "桑蒂"]], "b": "membangunkan = meN- + bangun + -kan（使……起来）", "g": "结构：时间 + 主语 + akan + 动词 + 宾语。-kan 表使役：bangun 起床 → membangunkan 叫（别人）起床。"}}, {"sp": "", "role": "r", "id": "Pada pukul 06.30 Lisa sudah sampai di kampus.", "zh": "六点半 Lisa 已经到学校了。", "a": "a1dadc7782e2", "za": "b3b520083a8b", "an": {"p": [["Pada pukul 06.30", "在六点半"], ["Lisa", "丽莎"], ["sudah", "已经"], ["sampai di", "到达"], ["kampus", "校园"]], "b": "", "g": "结构：时间 + 主语 + sudah sampai di + 地点。sudah 强调“早就到了”。"}}, {"sp": "", "role": "r", "id": "Semua tugas sudah dikerjakan Lisa setiap hari pada pukul 19.00—21.00.", "zh": "Lisa 每天晚上七点到九点就把所有作业都做完。", "a": "ba51b787d010", "za": "006395e574ce", "an": {"p": [["Semua tugas", "所有作业"], ["sudah", "已经"], ["dikerjakan", "被做"], ["Lisa", "丽莎"], ["setiap hari", "每天"], ["pada pukul 19.00—21.00", "在十九点到二十一点"]], "b": "dikerjakan = di- + kerja + -kan", "g": "结构：被动句：宾语（Semua tugas）+ sudah + di-动词 + 施动者（Lisa）+ 时间。主动式为 Lisa mengerjakan semua tugas。"}}, {"sp": "", "role": "r", "id": "Ketika dosen sedang menerangkan pelajaran, Lisa akan mendengarkan dengan cermat.", "zh": "老师讲课的时候，Lisa 会认真听。", "a": "e7ca0d82e8fc", "za": "20e94959ef12", "an": {"p": [["Ketika", "当……时"], ["dosen", "大学老师"], ["sedang", "正在"], ["menerangkan", "讲解"], ["pelajaran", "课程"], ["Lisa", "丽莎"], ["akan", "会"], ["mendengarkan", "认真听"], ["dengan cermat", "仔细地"]], "b": "menerangkan = meN- + terang + -kan；pelajaran = pe- + ajar + -an；mendengarkan = meN- + dengar + -kan", "g": "结构：Ketika + 从句（sedang 表进行）, 主句 + dengan + 形容词（方式状语）。dengan cermat = 仔细地。"}}, {"sp": "", "role": "r", "id": "Begitulah aktivitas Lisa setiap hari.", "zh": "这就是 Lisa 每天的生活。", "a": "fd4d6b0b77e7", "za": "616100f2f2d5", "an": {"p": [["Begitulah", "就是这样"], ["aktivitas", "活动"], ["Lisa", "丽莎"], ["setiap hari", "每天"]], "b": "begitulah = begitu + -lah（强调）", "g": "结构：Begitulah + 名词。收尾句，总结前面所述。-lah 加强语气。"}}], "zh": "Santi 的妹妹很勤奋，她叫 Lisa。她四点就起床了，每天早上四点半叫醒 Santi。六点半 Lisa 已经到了学校。每天晚上七点到九点，她把所有作业都做完。老师讲课时，Lisa 会认真听讲。这就是 Lisa 每天的生活。", "note": "语法练习：用 belum / akan / sudah / sedang 填空，见语法部分。", "qa": [], "u": 6}, {"id": "t66", "kind": "text", "book": "BIPA 1", "title": "在市场购物（音频 7.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Yoyo.", "zh": "嗨，我叫 Yoyo。", "a": "8fba95704f76", "za": "2ec9859994a8", "an": {"p": [["Hai", "嗨"], ["nama saya", "我的名字"], ["Yoyo", "尤尤"]], "b": "", "g": "结构：问候 + Nama saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya koki.", "zh": "我是厨师。", "a": "96df968890d7", "za": "aaf3767ac6e3", "an": {"p": [["Saya", "我"], ["koki", "厨师"]], "b": "", "g": "结构：名词谓语，主语 + 职业。"}}, {"sp": "", "role": "r", "id": "Saya hobi berbelanja ke pasar.", "zh": "我的爱好是去市场买东西。", "a": "04d0433b90ec", "za": "61a4b24f173d", "an": {"p": [["Saya", "我"], ["hobi", "爱好"], ["berbelanja", "购物"], ["ke pasar", "去市场"]], "b": "berbelanja = ber- + belanja", "g": "结构：主语 + hobi + 动词短语。hobi 在这里作动词用：我爱好去市场买东西。"}}, {"sp": "", "role": "r", "id": "Hari ini saya dan teman saya pergi ke pasar.", "zh": "今天我和朋友去了市场。", "a": "5c485eb6c73c", "za": "a3117ba39790", "an": {"p": [["Hari ini", "今天"], ["saya dan teman saya", "我和我的朋友"], ["pergi", "去"], ["ke pasar", "到市场"]], "b": "", "g": "结构：时间 + 主语（两人）+ pergi ke + 地点。"}}, {"sp": "", "role": "r", "id": "Biasanya kami membeli banyak bahan makanan.", "zh": "我们通常会买很多食材。", "a": "ae437b058afe", "za": "9dbf31c6a814", "an": {"p": [["Biasanya", "通常"], ["kami", "我们"], ["membeli", "买"], ["banyak", "很多"], ["bahan makanan", "食材"]], "b": "biasanya = biasa + -nya；membeli = meN- + beli", "g": "结构：副词 + 主语 + 动词 + 宾语。bahan makanan = 食物原料（食材）。"}}, {"sp": "", "role": "r", "id": "Di pasar ada gula, jeruk, garam, kopi, dan lombok.", "zh": "市场上有糖、橘子、盐、咖啡和辣椒。", "a": "529aec3b41a9", "za": "db298e1732a5", "an": {"p": [["Di pasar", "在市场"], ["ada", "有"], ["gula", "糖"], ["jeruk", "橙子"], ["garam", "盐"], ["kopi", "咖啡"], ["dan", "和"], ["lombok", "辣椒"]], "b": "", "g": "结构：Di + 地点 + ada + 并列名词。lombok 是爪哇语来源词，标准词是 cabai。"}}, {"sp": "", "role": "r", "id": "Gula rasanya manis.", "zh": "糖是甜的。", "a": "afcfb645d32c", "za": "5b1772588552", "an": {"p": [["Gula", "糖"], ["rasanya", "味道"], ["manis", "甜"]], "b": "rasanya = rasa + -nya", "g": "结构：主语 + rasanya + 形容词。rasanya = 它的味道。"}}, {"sp": "", "role": "r", "id": "Jeruk rasanya asam.", "zh": "橘子是酸的。", "a": "8d91c394eac1", "za": "9b78b7c3d792", "an": {"p": [["Jeruk", "橙子"], ["rasanya", "味道"], ["asam", "酸"]], "b": "", "g": "结构同上：Jeruk rasanya asam。"}}, {"sp": "", "role": "r", "id": "Garam rasanya asin.", "zh": "盐是咸的。", "a": "4341f32a4d72", "za": "aa4a742a2d1b", "an": {"p": [["Garam", "盐"], ["rasanya", "味道"], ["asin", "咸"]], "b": "", "g": "结构同上。asin = 咸。"}}, {"sp": "", "role": "r", "id": "Kopi rasanya pahit.", "zh": "咖啡是苦的。", "a": "e771a4613624", "za": "fe343b99f42d", "an": {"p": [["Kopi", "咖啡"], ["rasanya", "味道"], ["pahit", "苦"]], "b": "", "g": "结构同上。pahit = 苦。"}}, {"sp": "", "role": "r", "id": "Lombok rasanya pedas.", "zh": "辣椒是辣的。", "a": "ee50fc4ca67b", "za": "72b40e43990b", "an": {"p": [["Lombok", "辣椒"], ["rasanya", "味道"], ["pedas", "辣"]], "b": "", "g": "结构同上。pedas = 辣。"}}, {"sp": "", "role": "r", "id": "Kami juga pergi ke pujasera (pusat jajanan serba ada).", "zh": "我们还去了美食广场（各种小吃都有的地方）。", "a": "41c6b5a5c742", "za": "bd23e59caf21", "an": {"p": [["Kami", "我们"], ["juga", "也"], ["pergi ke", "去"], ["pujasera", "小吃广场"], ["pusat", "中心"], ["jajanan", "小吃"], ["serba ada", "应有尽有"]], "b": "pujasera 是缩写：pu(sat) ja(janan) se(rba) a(da)；jajanan = jajan + -an", "g": "结构：主语 + juga + pergi ke + 地点，括号里解释缩写。serba ada = 什么都有。"}}, {"sp": "", "role": "r", "id": "Di situ ada banyak makanan.", "zh": "那里有很多吃的。", "a": "f85b29519816", "za": "5d15048e562b", "an": {"p": [["Di situ", "在那里"], ["ada", "有"], ["banyak", "很多"], ["makanan", "食物"]], "b": "makanan = makan + -an", "g": "结构：Di + 地点 + ada + 数量 + 名词。-an 把动词变成名词：makan 吃 → makanan 食物。"}}, {"sp": "", "role": "r", "id": "Ada soto, bakso, mi ayam, rendang, opor ayam, gado-gado, satai, dan ayam goreng.", "zh": "有 soto 汤、肉丸、鸡肉面、仁当、椰汁鸡、加多加多沙拉、沙爹和炸鸡。", "a": "35cf44df36d0", "za": "eeac2b2c35ff", "an": {"p": [["Ada", "有"], ["soto", "肉汤"], ["bakso", "肉丸"], ["mi ayam", "鸡肉面"], ["rendang", "仁当"], ["opor ayam", "椰奶炖鸡"], ["gado-gado", "花生酱蔬菜沙拉"], ["satai", "沙嗲"], ["ayam goreng", "炸鸡"]], "b": "", "g": "结构：Ada + 并列名词。全是印尼国民美食。satai 也写 sate。"}}, {"sp": "", "role": "r", "id": "Kamu suka bakso?", "zh": "你喜欢肉丸吗？", "a": "20ca253ab70f", "za": "49043bf2d3e6", "an": {"p": [["Kamu", "你"], ["suka", "喜欢"], ["bakso", "肉丸"]], "b": "", "g": "结构：主语 + suka + 宾语？口语疑问句靠语调。"}}, {"sp": "", "role": "r", "id": "Bakso dari daging sapi, ayam, atau ikan.", "zh": "肉丸是用牛肉、鸡肉或鱼肉做的。", "a": "1e16a6ecda03", "za": "3fc336c63518", "an": {"p": [["Bakso", "肉丸"], ["dari", "用……做"], ["daging sapi", "牛肉"], ["ayam", "鸡肉"], ["atau", "或者"], ["ikan", "鱼"]], "b": "", "g": "结构：主语 + dari + 原料。dari 在这里表示原料。"}}, {"sp": "", "role": "r", "id": "Teksturnya kenyal dan berserat.", "zh": "口感弹牙有嚼劲。", "a": "ace10ca9739a", "za": "d768b0c20386", "an": {"p": [["Teksturnya", "它的口感"], ["kenyal", "有嚼劲"], ["dan", "并且"], ["berserat", "有纤维"]], "b": "teksturnya = tekstur + -nya；berserat = ber- + serat", "g": "结构：主语（带 -nya）+ 形容词 + dan + 形容词。-nya 指 bakso。"}}, {"sp": "", "role": "r", "id": "Kami juga pesan minuman.", "zh": "我们还点了饮料。", "a": "889149b49893", "za": "eff007b5c013", "an": {"p": [["Kami", "我们"], ["juga", "也"], ["pesan", "点"], ["minuman", "饮料"]], "b": "minuman = minum + -an", "g": "结构：主语 + juga + 动词 + 宾语。pesan = 订、点（餐）。"}}, {"sp": "", "role": "r", "id": "Ada es teh, kopi, es jeruk di pujasera.", "zh": "美食广场有冰茶、咖啡和冰橘子水。", "a": "a442fb0e74b7", "za": "0be61ac6b19d", "an": {"p": [["Ada", "有"], ["es teh", "冰茶"], ["kopi", "咖啡"], ["es jeruk", "冰橙汁"], ["di pujasera", "在小吃广场"]], "b": "", "g": "结构：Ada + 并列名词 + 地点。地点放在句尾也可以。es = 冰。"}}, {"sp": "", "role": "r", "id": "Es teh rasanya manis.", "zh": "冰茶是甜的。", "a": "32c468a01255", "za": "29aa3e6f0717", "an": {"p": [["Es teh", "冰茶"], ["rasanya", "味道"], ["manis", "甜"]], "b": "", "g": "结构：主语 + rasanya + 形容词。"}}, {"sp": "", "role": "r", "id": "Kopi rasanya pahit.", "zh": "咖啡是苦的。", "a": "e771a4613624", "za": "fe343b99f42d", "an": {"p": [["Kopi", "咖啡"], ["rasanya", "味道"], ["pahit", "苦"]], "b": "", "g": "结构同上。pahit = 苦。"}}, {"sp": "", "role": "r", "id": "Es jeruk rasanya masam.", "zh": "冰橘子水是酸的。", "a": "114acf594164", "za": "20b9db63a03d", "an": {"p": [["Es jeruk", "冰橙汁"], ["rasanya", "味道"], ["masam", "酸"]], "b": "", "g": "结构同上。masam 与 asam 同义（酸）。"}}], "zh": "嗨，我叫 Yoyo，是个厨师。我的爱好是去市场买东西。今天我和朋友去了市场，我们通常会买很多食材。市场里有糖、橘子、盐、咖啡和辣椒。糖是甜的，橘子是酸的，盐是咸的，咖啡是苦的，辣椒是辣的。我们还去了美食广场，那里有很多吃的：索托汤、肉丸、鸡肉面、仁当、椰奶炖鸡、加多加多、沙爹和炸鸡。你喜欢肉丸吗？肉丸是用牛肉、鸡肉或鱼肉做的，口感有嚼劲、有纤维感。我们还点了饮料，美食广场有冰茶、咖啡和冰橙汁。冰茶是甜的，咖啡是苦的，冰橙汁是酸的。", "note": "", "qa": [{"q": "Apa hobi Yoyo?", "a": "Berbelanja ke pasar.", "qa": "7c56c461f00b", "aa": "d280fc7ab499", "qz": "Yoyo 的爱好是什么？", "az": "去市场买东西。"}, {"q": "Apa yang Yoyo beli di pasar?", "a": "Gula, jeruk, garam, kopi, dan lombok.", "qa": "8992543b5643", "aa": "d653786f765f", "qz": "Yoyo 在市场买了什么？", "az": "糖、橘子、盐、咖啡和辣椒。"}, {"q": "Bagaimana tekstur bakso?", "a": "Kenyal dan berserat.", "qa": "b865e1afb333", "aa": "45eea4f50967", "qz": "肉丸的口感怎么样？", "az": "弹牙有嚼劲。"}], "u": 7}, {"id": "t67", "kind": "text", "book": "BIPA 1", "title": "我的周末（音频 7.3）", "lines": [{"sp": "", "role": "r", "id": "Hai, saya Sarah.", "zh": "嗨，我是 Sarah。", "a": "7499f1c1620a", "za": "a70a78bb445a", "an": {"p": [["Hai", "嗨"], ["saya", "我"], ["Sarah", "萨拉"]], "b": "", "g": "结构：问候 + saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya sangat suka berenang.", "zh": "我非常喜欢游泳。", "a": "cce3f7f2e6da", "za": "d06f7139ec35", "an": {"p": [["Saya", "我"], ["sangat", "很"], ["suka", "喜欢"], ["berenang", "游泳"]], "b": "berenang = ber- + renang", "g": "结构：主语 + sangat suka + 动词。suka 后直接接动词。"}}, {"sp": "", "role": "r", "id": "Saya biasanya berenang di akhir pekan.", "zh": "我通常周末去游泳。", "a": "86743ce34b84", "za": "2cdaa66d355a", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["berenang", "游泳"], ["di akhir pekan", "在周末"]], "b": "", "g": "结构：主语 + biasanya + 动词 + 时间。"}}, {"sp": "", "role": "r", "id": "Kadang-kadang selain berenang, saya joging.", "zh": "有时候除了游泳，我还会慢跑。", "a": "5891e90464fc", "za": "1a8ddec0acdd", "an": {"p": [["Kadang-kadang", "有时"], ["selain", "除了"], ["berenang", "游泳"], ["saya", "我"], ["joging", "慢跑"]], "b": "selain = se- + lain", "g": "结构：副词 + Selain + 动词, 主语 + 动词。selain A, B = 除了 A 还有 B。"}}, {"sp": "", "role": "r", "id": "Namun, saya kurang suka joging.", "zh": "不过，我不太喜欢慢跑。", "a": "bc10f1692648", "za": "e0f9b750914a", "an": {"p": [["Namun", "然而"], ["saya", "我"], ["kurang", "不太"], ["suka", "喜欢"], ["joging", "慢跑"]], "b": "", "g": "结构：转折词 + 主语 + kurang + 动词。kurang + suka = 不太喜欢（委婉否定）。"}}, {"sp": "", "role": "r", "id": "Selain joging, saya kadang-kadang bermain badminton.", "zh": "除了慢跑，我有时候也打羽毛球。", "a": "3eb549541c14", "za": "3dd09911c883", "an": {"p": [["Selain", "除了"], ["joging", "慢跑"], ["saya", "我"], ["kadang-kadang", "有时"], ["bermain", "玩"], ["badminton", "羽毛球"]], "b": "bermain = ber- + main", "g": "结构：Selain + 名词, 主语 + 副词 + 动词。bermain badminton = 打羽毛球。"}}, {"sp": "", "role": "r", "id": "Saya suka bermain badminton.", "zh": "我喜欢打羽毛球。", "a": "544ed83ebb75", "za": "4b234e4d55b9", "an": {"p": [["Saya", "我"], ["suka", "喜欢"], ["bermain", "玩、打"], ["badminton", "羽毛球"]], "b": "", "g": "结构：主语 + suka + 动词 + 宾语。"}}, {"sp": "", "role": "r", "id": "Namun, bermain badminton tidak bisa sendiri.", "zh": "不过，羽毛球没法一个人打。", "a": "c65d2891bd32", "za": "4ca19daa7de2", "an": {"p": [["Namun", "然而"], ["bermain badminton", "打羽毛球"], ["tidak bisa", "不能"], ["sendiri", "独自"]], "b": "", "g": "结构：转折词 + 动词短语作主语 + tidak bisa + sendiri。动词短语可以直接作主语。"}}, {"sp": "", "role": "r", "id": "Pokoknya saya sangat suka berolahraga.", "zh": "总之我非常喜欢运动。", "a": "ad4335caebed", "za": "8042a6a0d3c0", "an": {"p": [["Pokoknya", "总之"], ["saya", "我"], ["sangat suka", "很喜欢"], ["berolahraga", "做运动"]], "b": "pokoknya = pokok 要点 + -nya；berolahraga = ber- + olahraga", "g": "结构：Pokoknya（总结）+ 主语 + 动词。ber- + 名词 = 做……。"}}, {"sp": "", "role": "r", "id": "Saya tidak suka tidur atau diam di rumah pada akhir pekan.", "zh": "我不喜欢周末在家睡觉或者待着不动。", "a": "ab22f81769c2", "za": "f6800ab83966", "an": {"p": [["Saya", "我"], ["tidak suka", "不喜欢"], ["tidur", "睡觉"], ["atau", "或者"], ["diam", "待着不动"], ["di rumah", "在家"], ["pada akhir pekan", "在周末"]], "b": "", "g": "结构：主语 + tidak suka + 动词 1 + atau + 动词 2 + 地点 + 时间。否定词 tidak 管到后面两个动作。"}}, {"sp": "", "role": "r", "id": "Saya juga sangat suka memasak di akhir pekan.", "zh": "我周末也很喜欢做饭。", "a": "c9a01dfa6e5e", "za": "c763fd3a6ab3", "an": {"p": [["Saya", "我"], ["juga", "也"], ["sangat suka", "很喜欢"], ["memasak", "做饭"], ["di akhir pekan", "在周末"]], "b": "memasak = meN- + masak", "g": "结构：主语 + juga + sangat suka + 动词 + 时间。"}}, {"sp": "", "role": "r", "id": "Saya senang mencoba resep baru.", "zh": "我喜欢尝试新菜谱。", "a": "6f893eefc38d", "za": "65d3cef08117", "an": {"p": [["Saya", "我"], ["senang", "喜欢"], ["mencoba", "尝试"], ["resep", "食谱"], ["baru", "新"]], "b": "mencoba = meN- + coba", "g": "结构：主语 + senang + 动词 + 宾语（resep baru）。形容词 baru 放在名词后。"}}, {"sp": "", "role": "r", "id": "Selain memasak, kadang-kadang saya pergi ke mal dengan teman.", "zh": "除了做饭，有时候我和朋友去商场。", "a": "c7f8e1653745", "za": "384545175d06", "an": {"p": [["Selain", "除了"], ["memasak", "做饭"], ["kadang-kadang", "有时"], ["saya", "我"], ["pergi ke mal", "去商场"], ["dengan teman", "和朋友"]], "b": "", "g": "结构：Selain + 动词, 副词 + 主语 + 动词 + 地点 + dengan + 人。"}}, {"sp": "", "role": "r", "id": "Kami ke mal untuk berjalan-jalan atau menonton film di bioskop.", "zh": "我们去商场逛逛或者在电影院看电影。", "a": "b1f35cf2414e", "za": "4b1cb8a795a3", "an": {"p": [["Kami", "我们"], ["ke mal", "去商场"], ["untuk", "为了"], ["berjalan-jalan", "逛街"], ["atau", "或者"], ["menonton film", "看电影"], ["di bioskop", "在电影院"]], "b": "berjalan-jalan = ber- + jalan 重叠", "g": "结构：主语 + ke + 地点 + untuk + 动作 1 + atau + 动作 2。untuk 引出目的。berjalan-jalan = 随意逛。"}}, {"sp": "", "role": "r", "id": "Namun, saya lebih suka berolahraga dan memasak.", "zh": "不过，我更喜欢运动和做饭。", "a": "e645c0c7654a", "za": "8593637f06b1", "an": {"p": [["Namun", "然而"], ["saya", "我"], ["lebih suka", "更喜欢"], ["berolahraga", "运动"], ["dan", "和"], ["memasak", "做饭"]], "b": "", "g": "结构：转折词 + 主语 + lebih + 动词 + 并列宾语。lebih = 更。"}}], "zh": "嗨，我是 Sarah。我非常喜欢游泳，通常周末去游泳。除了游泳，有时我也慢跑，不过我不太喜欢慢跑。除了慢跑，我有时打羽毛球，我喜欢打羽毛球，但羽毛球一个人打不了。总之我非常喜欢运动，周末不喜欢睡觉或待在家里。周末我也很喜欢做饭，喜欢尝试新菜谱。除了做饭，有时我和朋友去商场逛逛或去电影院看电影。不过，我还是更喜欢运动和做饭。", "note": "", "qa": [{"q": "Kegiatan apa yang sangat disukai Sarah?", "a": "Berenang, berolahraga, dan memasak.", "qa": "763d9a5e9979", "aa": "55d349f7f244", "qz": "Sarah 非常喜欢什么活动？", "az": "游泳、运动和做饭。"}, {"q": "Kegiatan apa yang disukai Sarah?", "a": "Bermain badminton.", "qa": "3129ac18de9f", "aa": "5e488b8f86ea", "qz": "Sarah 喜欢什么活动？", "az": "打羽毛球。"}, {"q": "Kegiatan apa yang kurang disukai Sarah?", "a": "Joging.", "qa": "0fe1685a3046", "aa": "7f0b27f8aaa5", "qz": "Sarah 不太喜欢什么活动？", "az": "慢跑。"}, {"q": "Kegiatan apa yang tidak disukai Sarah?", "a": "Tidur atau diam di rumah pada akhir pekan.", "qa": "79dccdedb1fd", "aa": "fc1914c68141", "qz": "Sarah 不喜欢什么活动？", "az": "周末在家睡觉或者待着不动。"}, {"q": "Kegiatan apa yang lebih disukai Sarah?", "a": "Berolahraga dan memasak.", "qa": "44c16e679091", "aa": "b491f0e23a5b", "qz": "Sarah 更喜欢什么活动？", "az": "运动和做饭。"}], "u": 7}, {"id": "t68", "kind": "text", "book": "BIPA 1", "title": "我的爱好（课文 7）", "lines": [{"sp": "", "role": "r", "id": "Hobi saya memasak.", "zh": "我的爱好是做饭。", "a": "be52d6da38b3", "za": "64ce793233c5", "an": {"p": [["Hobi", "爱好"], ["saya", "我的"], ["memasak", "做饭"]], "b": "", "g": "结构：Hobi saya + 动词。“爱好”后直接接动词。"}}, {"sp": "", "role": "r", "id": "Saya sangat suka memasak aneka hidangan.", "zh": "我非常喜欢做各种各样的菜。", "a": "b3f9456ba0d9", "za": "48a31b3d1b35", "an": {"p": [["Saya", "我"], ["sangat suka", "很喜欢"], ["memasak", "烹饪"], ["aneka", "各种"], ["hidangan", "菜肴"]], "b": "hidangan = hidang 端上 + -an", "g": "结构：主语 + 动词 + 宾语。aneka + 名词 = 各种……，类似 berbagai。"}}, {"sp": "", "role": "r", "id": "Setiap hari saya menghabiskan banyak waktu di dapur.", "zh": "我每天花很多时间待在厨房里。", "a": "3cc60ff37149", "za": "abcf71b1a468", "an": {"p": [["Setiap hari", "每天"], ["saya", "我"], ["menghabiskan", "花费"], ["banyak waktu", "很多时间"], ["di dapur", "在厨房"]], "b": "menghabiskan = meN- + habis + -kan（用完）", "g": "结构：时间 + 主语 + menghabiskan + 宾语 + 地点。menghabiskan waktu = 消磨时间。"}}, {"sp": "", "role": "r", "id": "Masakan kesukaan saya adalah rendang.", "zh": "我最喜欢的菜是仁当。", "a": "57a025a5fdca", "za": "264b47e3e7fd", "an": {"p": [["Masakan", "菜"], ["kesukaan", "偏爱"], ["saya", "我"], ["adalah", "是"], ["rendang", "仁当"]], "b": "masakan = masak + -an；kesukaan = ke- + suka + -an", "g": "结构：主语（Masakan kesukaan saya）+ adalah + 名词。kesukaan = 喜好，masakan kesukaan = 最爱的菜。"}}, {"sp": "", "role": "r", "id": "Saya juga suka memasak gorengan dan panggangan.", "zh": "我也喜欢做油炸和烧烤类的菜。", "a": "2e0274179c18", "za": "9665577e0a4f", "an": {"p": [["Saya", "我"], ["juga", "也"], ["suka", "喜欢"], ["memasak", "做"], ["gorengan", "油炸食品"], ["dan", "和"], ["panggangan", "烧烤食品"]], "b": "gorengan = goreng + -an；panggangan = panggang + -an", "g": "结构：主语 + juga + suka + 动词 + 宾语。-an 把动作变成结果物：goreng 炸 → gorengan 炸物。"}}, {"sp": "", "role": "r", "id": "Selain hobi masak, saya juga hobi mengoleksi peralatan masak.", "zh": "除了做饭，我还喜欢收集厨具。", "a": "793eca899fd5", "za": "5bae0273504e", "an": {"p": [["Selain", "除了"], ["hobi masak", "爱好做饭"], ["saya", "我"], ["juga hobi", "也爱好"], ["mengoleksi", "收集"], ["peralatan masak", "厨具"]], "b": "mengoleksi = meN- + koleksi；peralatan = per- + alat + -an", "g": "结构：Selain + 名词短语, 主语 + juga + hobi + 动词 + 宾语。"}}, {"sp": "", "role": "r", "id": "Saya senang jika peralatan masak saya lengkap.", "zh": "我的厨具齐全的话我就很开心。", "a": "0ac741ad8115", "za": "4a0771eff713", "an": {"p": [["Saya", "我"], ["senang", "高兴"], ["jika", "如果"], ["peralatan masak", "厨具"], ["saya", "我的"], ["lengkap", "齐全"]], "b": "", "g": "结构：主语 + senang + jika + 从句。jika 引导条件，这里表示“当……时我很开心”。"}}, {"sp": "", "role": "r", "id": "Saya punya kompor, wajan, dan panci.", "zh": "我有炉子、炒锅和汤锅。", "a": "26ca21199549", "za": "860104515299", "an": {"p": [["Saya", "我"], ["punya", "有"], ["kompor", "炉灶"], ["wajan", "炒锅"], ["dan", "和"], ["panci", "汤锅"]], "b": "", "g": "结构：主语 + punya + 并列名词。"}}, {"sp": "", "role": "r", "id": "Saya juga punya spatula, pisau, dan talenan.", "zh": "我还有锅铲、刀和砧板。", "a": "174b716df46d", "za": "dfc75618382d", "an": {"p": [["Saya", "我"], ["juga", "也"], ["punya", "有"], ["spatula", "锅铲"], ["pisau", "刀"], ["dan", "和"], ["talenan", "砧板"]], "b": "", "g": "结构同上。"}}, {"sp": "", "role": "r", "id": "Jadi, saya bisa masak apa saja dengan alat lengkap.", "zh": "所以，工具齐全，我什么都能做。", "a": "dfbdafe5828b", "za": "ae819bc746af", "an": {"p": [["Jadi", "所以"], ["saya", "我"], ["bisa", "能"], ["masak", "做饭"], ["apa saja", "任何东西"], ["dengan", "用"], ["alat lengkap", "齐全的器具"]], "b": "", "g": "结构：Jadi + 主语 + bisa + 动词 + apa saja + dengan + 工具。apa saja = 任何东西。"}}], "zh": "我的爱好是做饭，我非常喜欢做各种菜，每天都在厨房待很久。我最爱的菜是仁当，也喜欢做油炸和烤制的食物。除了做饭，我还喜欢收集厨具，厨具齐全我就很开心。我有炉灶、炒锅和汤锅，还有锅铲、刀和切菜板。所以，有了齐全的工具，我什么菜都能做。", "note": "", "qa": [{"q": "Apa kegemaran Septi?", "a": "Memasak dan mengoleksi peralatan masak.", "qa": "14227b4db42e", "aa": "8fe99d2da06e", "qz": "Septi 的爱好是什么？", "az": "做饭和收集厨具。"}, {"q": "Septi sangat suka memasak apa?", "a": "Rendang.", "qa": "810117e2c141", "aa": "da6066d061a6", "qz": "Septi 特别喜欢做什么菜？", "az": "仁当。"}, {"q": "Apa saja perlengkapan memasaknya?", "a": "Kompor, wajan, panci, spatula, pisau, dan talenan.", "qa": "160692ea0367", "aa": "ed99c160530d", "qz": "她的厨具有哪些？", "az": "炉子、炒锅、汤锅、锅铲、刀和砧板。"}, {"q": "Mengapa peralatan memasaknya lengkap?", "a": "Supaya dia bisa masak apa saja.", "qa": "afcfc8748d75", "aa": "0ac02d4269a4", "qz": "为什么她的厨具这么齐全？", "az": "这样她什么都能做。"}], "u": 7}, {"id": "t69", "kind": "text", "book": "BIPA 1", "title": "我的新朋友 Sarah（音频 8.1）", "lines": [{"sp": "", "role": "r", "id": "Saya punya teman baru.", "zh": "我有一个新朋友。", "a": "f8f60be05097", "za": "119a76d3497a", "an": {"p": [["Saya", "我"], ["punya", "有"], ["teman baru", "新朋友"]], "b": "", "g": "punya + 名词 = 有……。teman baru = 新朋友（形容词放在名词后面）。"}}, {"sp": "", "role": "r", "id": "Namanya Sarah.", "zh": "她叫 Sarah。", "a": "e7e530778d89", "za": "d308a629da89", "an": {"p": [["Namanya", "她的名字"], ["Sarah", "人名"]], "b": "", "g": "Namanya + 名字 = 她的名字叫……（-nya = 她的）。"}}, {"sp": "", "role": "r", "id": "Sarah berasal dari Inggris.", "zh": "Sarah 来自英国。", "a": "b6a5b9e7a1fe", "za": "d55b6bc16b70", "an": {"p": [["Sarah", "人名"], ["berasal dari", "来自"], ["Inggris", "英国"]], "b": "", "g": "berasal dari + 国家 = 来自某国。"}}, {"sp": "", "role": "r", "id": "Dia baik, ramah, dan suka menolong.", "zh": "她人很好，很友善，也乐于助人。", "a": "757ad3eacb56", "za": "e7afe08283da", "an": {"p": [["Dia", "她"], ["baik", "善良"], ["ramah", "友好"], ["dan", "并且"], ["suka menolong", "乐于助人"]], "b": "menolong = tolong + meN-", "g": "并列：形容词, 形容词, dan 动词短语。suka + 动词 = 喜欢（乐于）做……。"}}, {"sp": "", "role": "r", "id": "Dia selalu menyapa kami.", "zh": "她总是跟我们打招呼。", "a": "24bfb375d4eb", "za": "88e32f898749", "an": {"p": [["Dia", "她"], ["selalu", "总是"], ["menyapa", "打招呼"], ["kami", "我们"]], "b": "menyapa = sapa + meN-", "g": "selalu 放在动词前。menyapa + 人 = 向某人打招呼。"}}, {"sp": "", "role": "r", "id": "Di kelas dia juga suka membantu temannya belajar.", "zh": "在课堂上她也喜欢帮同学学习。", "a": "68f6331eb390", "za": "603bc84431e2", "an": {"p": [["Di kelas", "在课堂上"], ["dia", "她"], ["juga", "也"], ["suka membantu", "乐于帮助"], ["temannya", "她的同学"], ["belajar", "学习"]], "b": "", "g": "结构：membantu + 人 + 动词 = 帮某人做某事。temannya = 她的朋友（同学）。"}}, {"sp": "", "role": "r", "id": "Namun, Sarah agak cerewet.", "zh": "不过，Sarah 有点唠叨。", "a": "d6548fe40e13", "za": "ce53900c09b8", "an": {"p": [["Namun", "然而"], ["Sarah", "人名"], ["agak", "有点"], ["cerewet", "唠叨、爱管事"]], "b": "", "g": "Namun 放句首引出转折（比 tetapi 更书面）。agak + 形容词 = 有点……。"}}, {"sp": "", "role": "r", "id": "Di pesta ulang tahunnya Sarah menelepon semua orang agar datang tepat waktu.", "zh": "在她的生日派对上，Sarah 给每个人打电话，让大家准时到。", "a": "9b80cc1c8a68", "za": "b2d4b610c1f6", "an": {"p": [["Di pesta ulang tahunnya", "在她的生日派对上"], ["Sarah", "萨拉"], ["menelepon", "打电话给"], ["semua orang", "所有人"], ["agar", "以便"], ["datang", "来"], ["tepat waktu", "准时"]], "b": "menelepon = meN- + telepon；ulang tahunnya = ulang tahun + -nya", "g": "结构：地点／场合 + 主语 + 动词 + 宾语 + agar + 从句。agar 引出目的：为了让……。tepat waktu = 准时。"}}, {"sp": "", "role": "r", "id": "Dia juga perfeksionis.", "zh": "她还是个完美主义者。", "a": "8e32f22ddd32", "za": "7531a884e3c5", "an": {"p": [["Dia", "她"], ["juga", "也"], ["perfeksionis", "完美主义者"]], "b": "", "g": "juga + 名词谓语：她也是完美主义者。来自英语 perfectionist，-is 表示“……主义者”。"}}, {"sp": "", "role": "r", "id": "Dia mengatur sendiri dekorasi, makanan, dan minuman.", "zh": "她亲自安排装饰、食物和饮料。", "a": "47f5a3137c56", "za": "7d03c3f72791", "an": {"p": [["Dia", "她"], ["mengatur", "安排"], ["sendiri", "亲自"], ["dekorasi", "装饰"], ["makanan", "食物"], ["dan", "和"], ["minuman", "饮料"]], "b": "mengatur = atur + meN-", "g": "sendiri 放在动词后表示“亲自、自己”。三个宾语并列：A, B, dan C。"}}, {"sp": "", "role": "r", "id": "Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "她希望派对完美，一点差错都没有。", "a": "25fb6b989a7c", "za": "cb5980dd8252", "an": {"p": [["Dia", "她"], ["ingin", "想"], ["acaranya", "她的活动"], ["sempurna", "完美"], ["dan", "而且"], ["tidak ada yang salah", "没有任何出错的"]], "b": "acara = 活动；salah = 错", "g": "结构：ingin + 完整小句（acaranya sempurna）。tidak ada yang + 形容词/动词 = 没有什么是……的：tidak ada yang salah = 没有任何错误。"}}], "zh": "我有一个新朋友，叫 Sarah，来自英国。她人很好，友善又乐于助人，总是主动跟我们打招呼，在课堂上也喜欢帮同学学习。不过 Sarah 有点爱操心：她的生日派对，她给每个人打电话让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排，希望活动完美、不出任何差错。", "note": "", "qa": [{"q": "Sarah berasal dari mana?", "a": "Dari Inggris.", "qa": "df1210a9937d", "aa": "5f58e3c933a8", "qz": "Sarah 来自哪里？", "az": "来自英国。"}, {"q": "Bagaimana sifat Sarah?", "a": "Baik, ramah, suka menolong, agak cerewet, dan perfeksionis.", "qa": "794b03353972", "aa": "6e1e979ecefd", "qz": "Sarah 的性格怎么样？", "az": "善良、友好、乐于助人，有点唠叨，还是个完美主义者。"}], "u": 8}, {"id": "t70", "kind": "text", "book": "BIPA 1", "title": "Beni 和 Toni（音频 8.2）", "lines": [{"sp": "", "role": "r", "id": "Beni adalah temanku.", "zh": "Beni 是我的朋友。", "a": "59913a1f54d0", "za": "aa644e9c00eb", "an": {"p": [["Beni", "贝尼"], ["adalah", "是"], ["temanku", "我的朋友"]], "b": "temanku = teman + -ku（我的）", "g": "结构：主语 + adalah + 名词。-ku 是 saya 的所有格后缀。"}}, {"sp": "", "role": "r", "id": "Dia sangat pendiam.", "zh": "他非常安静。", "a": "3d21b8fb4e4e", "za": "7473fd0608c7", "an": {"p": [["Dia", "他"], ["sangat", "很"], ["pendiam", "沉默寡言"]], "b": "pendiam = pe- + diam", "g": "结构：主语 + sangat + 形容词。pe- + 动词/形容词表示“习惯于……的人”。"}}, {"sp": "", "role": "r", "id": "Dia suka menyendiri di kantor.", "zh": "他在办公室喜欢独处。", "a": "8d1882829232", "za": "15ed95a930be", "an": {"p": [["Dia", "他"], ["suka", "喜欢"], ["menyendiri", "独处"], ["di kantor", "在办公室"]], "b": "menyendiri = meN- + sendiri", "g": "结构：主语 + suka + 动词 + 地点。"}}, {"sp": "", "role": "r", "id": "Dia jarang menyapa orang lain.", "zh": "他很少跟别人打招呼。", "a": "e423dbc9acd1", "za": "e165aa24b4d5", "an": {"p": [["Dia", "他"], ["jarang", "很少"], ["menyapa", "打招呼"], ["orang lain", "别人"]], "b": "menyapa = meN- + sapa", "g": "结构：主语 + jarang + 动词 + 宾语。orang lain = 别人。"}}, {"sp": "", "role": "r", "id": "Dia juga jarang berkumpul dengan teman-teman lain.", "zh": "他也很少和其他朋友聚在一起。", "a": "ff1295162c0a", "za": "acd7c1c2376d", "an": {"p": [["Dia", "他"], ["juga", "也"], ["jarang", "很少"], ["berkumpul", "聚会"], ["dengan", "和"], ["teman-teman lain", "其他朋友们"]], "b": "berkumpul = ber- + kumpul", "g": "结构：主语 + juga jarang + 动词 + dengan + 人。"}}, {"sp": "", "role": "r", "id": "Dia punya teman dekat.", "zh": "他有一个好朋友。", "a": "1c58311ac4de", "za": "97e1374b8982", "an": {"p": [["Dia", "他"], ["punya", "有"], ["teman dekat", "亲密的朋友"]], "b": "", "g": "结构：主语 + punya + 名词。teman dekat = 好朋友。"}}, {"sp": "", "role": "r", "id": "Namanya Toni.", "zh": "他叫 Toni。", "a": "e1f97964bbc9", "za": "60c308eeb258", "an": {"p": [["Namanya", "他的名字"], ["Toni", "托尼"]], "b": "namanya = nama + -nya", "g": "结构：-nya 指代前一句的朋友。"}}, {"sp": "", "role": "r", "id": "Toni berbeda dengan Beni.", "zh": "Toni 和 Beni 不一样。", "a": "3a2835042e17", "za": "288cdc04734c", "an": {"p": [["Toni", "托尼"], ["berbeda", "不同"], ["dengan", "和"], ["Beni", "贝尼"]], "b": "berbeda = ber- + beda", "g": "结构：主语 + berbeda dengan + 对象。= 与……不同。"}}, {"sp": "", "role": "r", "id": "Toni sangat periang.", "zh": "Toni 非常开朗。", "a": "f09f2ee207ca", "za": "96236044f88c", "an": {"p": [["Toni", "托尼"], ["sangat", "很"], ["periang", "开朗"]], "b": "periang = peri- + riang", "g": "结构：主语 + sangat + 形容词。periang = 性格开朗。"}}, {"sp": "", "role": "r", "id": "Toni selalu ramah kepada siapa pun.", "zh": "Toni 对谁都很友善。", "a": "458b17fee935", "za": "b9854490da70", "an": {"p": [["Toni", "托尼"], ["selalu", "总是"], ["ramah", "友好"], ["kepada", "对"], ["siapa pun", "任何人"]], "b": "", "g": "结构：主语 + selalu + 形容词 + kepada + 对象。siapa pun = 无论谁。"}}, {"sp": "", "role": "r", "id": "Toni sangat sabar menghadapi Beni.", "zh": "Toni 对 Beni 很有耐心。", "a": "19cc15711699", "za": "6fde9969722a", "an": {"p": [["Toni", "托尼"], ["sangat", "很"], ["sabar", "耐心"], ["menghadapi", "应对"], ["Beni", "贝尼"]], "b": "menghadapi = meN- + hadap + -i", "g": "结构：主语 + sangat sabar + 动词 + 宾语。menghadapi = 面对、应对（人或问题）。"}}, {"sp": "", "role": "r", "id": "Namun, Toni agak pemarah.", "zh": "不过，Toni 脾气有点急。", "a": "1dba0eed9d27", "za": "d290f2271302", "an": {"p": [["Namun", "然而"], ["Toni", "托尼"], ["agak", "有点"], ["pemarah", "爱发脾气"]], "b": "pemarah = pe- + marah", "g": "结构：转折词 + 主语 + agak + 形容词。pemarah = 容易发火的人。"}}, {"sp": "", "role": "r", "id": "Dia sangat perfeksionis.", "zh": "他是个完美主义者。", "a": "156c64f8b207", "za": "a94e10c55254", "an": {"p": [["Dia", "他"], ["sangat", "很"], ["perfeksionis", "完美主义者"]], "b": "", "g": "结构：主语 + sangat + 名词／形容词。"}}, {"sp": "", "role": "r", "id": "Dia akan marah melihat orang malas.", "zh": "他看到别人偷懒就会生气。", "a": "a51e484ce082", "za": "acf528e1a4c6", "an": {"p": [["Dia", "他"], ["akan", "会"], ["marah", "生气"], ["melihat", "看到"], ["orang malas", "懒人"]], "b": "melihat = meN- + lihat", "g": "结构：主语 + akan + 形容词 + 动词短语。marah melihat…… = 一看到……就生气。"}}], "zh": "Beni 是我的朋友。他非常沉默，在办公室喜欢独处，很少跟别人打招呼，也很少和其他朋友聚在一起。他有一个好朋友叫 Toni。Toni 和 Beni 不一样，Toni 很开朗，对谁都很友好，对 Beni 也很有耐心。不过 Toni 有点爱发火，他是个完美主义者，看到别人偷懒就会生气。", "note": "", "qa": [{"q": "Bagaimana sifat Beni?", "a": "Sangat pendiam dan suka menyendiri.", "qa": "541a105b673d", "aa": "2af365e3648d", "qz": "Beni 的性格怎么样？", "az": "非常安静，喜欢独处。"}, {"q": "Apa contoh sifat buruk Beni?", "a": "Jarang menyapa orang lain dan jarang berkumpul dengan teman.", "qa": "74d1a5486b74", "aa": "870b02bcce78", "qz": "Beni 有什么缺点？", "az": "很少跟别人打招呼，也很少和朋友聚。"}, {"q": "Bagaimana sifat Toni?", "a": "Periang, ramah, sabar, tetapi agak pemarah dan perfeksionis.", "qa": "59a2d79a0bf7", "aa": "c3da5ecefc39", "qz": "Toni 的性格怎么样？", "az": "开朗、友善、有耐心，但脾气有点急，是个完美主义者。"}, {"q": "Apa contoh sifat baik Toni?", "a": "Selalu ramah kepada siapa pun dan sabar menghadapi Beni.", "qa": "e8511e3e2f4f", "aa": "eb8e76cdafa2", "qz": "Toni 有什么优点？", "az": "对谁都很友善，对 Beni 很有耐心。"}, {"q": "Kira-kira di mana mereka saling mengenal?", "a": "Di kantor.", "qa": "ee8a21c3887a", "aa": "abe3099bb3fd", "qz": "他们大概是在哪里认识的？", "az": "在办公室。"}], "u": 8}, {"id": "t71", "kind": "text", "book": "BIPA 1", "title": "Fauzi 的性格（课文 8.1）", "lines": [{"sp": "", "role": "r", "id": "Fauzi adalah orang yang teratur.", "zh": "Fauzi 是个做事有条理的人。", "a": "03e9da21649e", "za": "bc4d92ab7789", "an": {"p": [["Fauzi", "法乌兹"], ["adalah", "是"], ["orang", "人"], ["yang teratur", "有条理的"]], "b": "teratur = ter- + atur", "g": "结构：主语 + adalah + 名词 + yang + 形容词。yang teratur 修饰 orang，意为“有条理的人”。"}}, {"sp": "", "role": "r", "id": "Dia tidak pintar, tetapi tekun.", "zh": "他不聪明，但很勤奋。", "a": "3b9de7ef70a6", "za": "0e53b1b6a4f2", "an": {"p": [["Dia", "他"], ["tidak", "不"], ["pintar", "聪明"], ["tetapi", "但是"], ["tekun", "勤奋踏实"]], "b": "", "g": "结构：主语 + tidak + 形容词 1, tetapi + 形容词 2。tetapi 表转折。"}}, {"sp": "", "role": "r", "id": "Dia bukan pemalas.", "zh": "他不是懒人。", "a": "0418c81b7158", "za": "07cebce85e67", "an": {"p": [["Dia", "他"], ["bukan", "不是"], ["pemalas", "懒鬼"]], "b": "pemalas = pe- + malas", "g": "结构：主语 + bukan + 名词。否定名词用 bukan，否定形容词和动词用 tidak。"}}, {"sp": "", "role": "r", "id": "Dia juga rajin merapikan lemari pakaiannya.", "zh": "他还经常整理自己的衣柜。", "a": "7cf26ef2c2d5", "za": "cb8e69d6adf9", "an": {"p": [["Dia", "他"], ["juga", "也"], ["rajin", "勤快"], ["merapikan", "整理"], ["lemari pakaian", "衣柜"], ["-nya", "他的"]], "b": "merapikan = meN- + rapi + -kan；pakaiannya = pakaian + -nya", "g": "结构：主语 + juga + rajin + 动词 + 宾语。rajin + 动词 = 勤快地做某事。"}}, {"sp": "", "role": "r", "id": "Dia tidak tidur jika tugas belum selesai.", "zh": "任务没做完他就不睡觉。", "a": "1f60f46174a9", "za": "ef366b026cce", "an": {"p": [["Dia", "他"], ["tidak tidur", "不睡"], ["jika", "如果"], ["tugas", "任务"], ["belum", "尚未"], ["selesai", "完成"]], "b": "", "g": "结构：主句 + jika + 从句。belum selesai = 还没完成。"}}, {"sp": "", "role": "r", "id": "Semua orang tahu hal itu.", "zh": "大家都知道这一点。", "a": "aabc5fc526ed", "za": "cc4d36496387", "an": {"p": [["Semua orang", "所有人"], ["tahu", "知道"], ["hal itu", "那件事"]], "b": "", "g": "结构：主语 + tahu + 宾语。hal = 事情。"}}, {"sp": "", "role": "r", "id": "Di kantor dia sangat rajin.", "zh": "在办公室他非常勤快。", "a": "30ca62a16e89", "za": "e98921135321", "an": {"p": [["Di kantor", "在办公室"], ["dia", "他"], ["sangat rajin", "很勤快"]], "b": "", "g": "结构：地点 + 主语 + sangat + 形容词。"}}, {"sp": "", "role": "r", "id": "Setiap bekerja bersama Fauzi, ia akan mengerjakan semua pekerjaan sendirian.", "zh": "每次和 Fauzi 一起工作，他都会一个人把所有活儿干完。", "a": "e4dee6242102", "za": "7e56474b4451", "an": {"p": [["Setiap", "每当"], ["bekerja", "工作"], ["bersama", "一起"], ["Fauzi", "法乌兹"], ["ia", "他（指同事）"], ["akan", "会"], ["mengerjakan", "完成"], ["semua pekerjaan", "所有工作"], ["sendirian", "独自一人"]], "b": "mengerjakan = meN- + kerja + -kan；sendirian = sendiri + -an", "g": "结构：Setiap + 动作 + bersama + 人, 主语 + akan + 动词 + 宾语 + sendirian。这里 ia 指 Fauzi。"}}, {"sp": "", "role": "r", "id": "Namun, ia bermaksud baik.", "zh": "不过，他是出于好意。", "a": "2c6f77823ce2", "za": "3db159137750", "an": {"p": [["Namun", "然而"], ["ia", "他"], ["bermaksud", "有意图"], ["baik", "好"]], "b": "bermaksud = ber- + maksud", "g": "结构：转折词 + 主语 + bermaksud + 形容词。bermaksud baik = 出于好意。"}}, {"sp": "", "role": "r", "id": "Dia ingin membantu temannya.", "zh": "他想帮朋友。", "a": "2fda9664cd9a", "za": "8e3574bdd0eb", "an": {"p": [["Dia", "他"], ["ingin", "想"], ["membantu", "帮助"], ["temannya", "他的朋友"]], "b": "membantu = meN- + bantu；temannya = teman + -nya", "g": "结构：主语 + ingin + 动词 + 宾语。"}}, {"sp": "", "role": "r", "id": "Rekan kantornya senang berteman dengan Fauzi.", "zh": "同事们都喜欢和 Fauzi 交朋友。", "a": "e1300c1db2af", "za": "eb0144c78a17", "an": {"p": [["Rekan kantornya", "他的同事"], ["senang", "喜欢"], ["berteman", "交朋友"], ["dengan", "和"], ["Fauzi", "法乌兹"]], "b": "rekan = 同行伙伴；berteman = ber- + teman", "g": "结构：主语 + senang + 动词 + dengan + 人。berteman dengan = 与……做朋友。"}}], "zh": "Fauzi 是个有条理的人。他不聪明，但很勤勉，他不是懒人。他也经常整理自己的衣柜。作业没做完他就不睡觉。大家都知道这一点。在办公室他非常勤奋，每次和 Fauzi 一起工作，他都会一个人把所有活儿干完。不过他是出于好意，他想帮助朋友。办公室的同事都很乐意和 Fauzi 交朋友。", "note": "", "qa": [], "u": 8}, {"id": "t72", "kind": "text", "book": "BIPA 1", "title": "我的同事们（课文 8.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Yoyo.", "zh": "嗨，我叫 Yoyo。", "a": "4f2eba8aa2c8", "za": "2ec9859994a8", "an": {"p": [["Hai", "嗨"], ["nama saya", "我的名字"], ["Yoyo", "尤尤"]], "b": "", "g": "结构：问候 + Nama saya + 名字。"}}, {"sp": "", "role": "r", "id": "Saya sedang berada di kantor.", "zh": "我现在在办公室。", "a": "f1d226c8e853", "za": "2e6fc63afa31", "an": {"p": [["Saya", "我"], ["sedang", "正在"], ["berada", "处在"], ["di kantor", "办公室里"]], "b": "berada = ber- + ada", "g": "结构：主语 + sedang + berada di + 地点。sedang 表进行。"}}, {"sp": "", "role": "r", "id": "Saat ini di kantor ada Datil, Doni, Didik, dan Fadil.", "zh": "现在办公室里有 Datil、Doni、Didik 和 Fadil。", "a": "e658894f5506", "za": "eedd034aaeed", "an": {"p": [["Saat ini", "此刻"], ["di kantor", "在办公室"], ["ada", "有"], ["Datil, Doni, Didik, dan Fadil", "四位同事的名字"]], "b": "", "g": "结构：时间 + 地点 + ada + 并列人名。"}}, {"sp": "", "role": "r", "id": "Datil baik hati dan tenang.", "zh": "Datil 心地善良，性格沉稳。", "a": "8aa96ffe8ba0", "za": "d6c81ec00573", "an": {"p": [["Datil", "达蒂尔"], ["baik hati", "心地善良"], ["dan", "和"], ["tenang", "沉稳"]], "b": "", "g": "结构：主语 + 形容词 + dan + 形容词。baik hati = 好心肠。"}}, {"sp": "", "role": "r", "id": "Doni rajin dan cekatan.", "zh": "Doni 勤快又麻利。", "a": "8d6ff1ab7c91", "za": "569d876252b3", "an": {"p": [["Doni", "多尼"], ["rajin", "勤奋"], ["dan", "和"], ["cekatan", "手脚麻利"]], "b": "cekatan = cekat + -an", "g": "结构：主语 + 形容词 + dan + 形容词。"}}, {"sp": "", "role": "r", "id": "Didik pendiam, tetapi ramah.", "zh": "Didik 话不多，但很友善。", "a": "eca220fca42f", "za": "3388fedd431a", "an": {"p": [["Didik", "迪迪克"], ["pendiam", "沉默寡言"], ["tetapi", "但是"], ["ramah", "友好"]], "b": "pendiam = pe- + diam", "g": "结构：主语 + 形容词, tetapi + 形容词。转折。"}}, {"sp": "", "role": "r", "id": "Fadil periang dan lucu.", "zh": "Fadil 开朗又风趣。", "a": "1c12f9994da7", "za": "c6dd8fefca10", "an": {"p": [["Fadil", "法迪尔"], ["periang", "开朗"], ["dan", "和"], ["lucu", "有趣"]], "b": "", "g": "结构：主语 + 形容词 + dan + 形容词。"}}, {"sp": "", "role": "r", "id": "Beberapa teman lain tidak ada di kantor.", "zh": "其他几个同事不在办公室。", "a": "11f0acdb8ded", "za": "3c7c1fe0f553", "an": {"p": [["Beberapa", "几个"], ["teman lain", "其他朋友"], ["tidak ada", "不在"], ["di kantor", "办公室里"]], "b": "", "g": "结构：主语 + tidak ada + 地点。tidak ada = 不在（那里）。"}}, {"sp": "", "role": "r", "id": "Sebenarnya, ada Laras, Ayu, Putri, dan Roslia.", "zh": "其实还有 Laras、Ayu、Putri 和 Roslia。", "a": "6de804521489", "za": "c12891b994e1", "an": {"p": [["Sebenarnya", "其实"], ["ada", "有"], ["Laras, Ayu, Putri, dan Roslia", "四位同事的名字"]], "b": "sebenarnya = se- + benar + -nya", "g": "结构：副词 + ada + 并列人名。Sebenarnya = 其实。"}}, {"sp": "", "role": "r", "id": "Laras cerdas dan perfeksionis.", "zh": "Laras 聪明，是个完美主义者。", "a": "3f879e5455b0", "za": "9c9c73a06506", "an": {"p": [["Laras", "拉拉斯"], ["cerdas", "聪明"], ["dan", "和"], ["perfeksionis", "完美主义"]], "b": "", "g": "结构：主语 + 形容词 + dan + 形容词。"}}, {"sp": "", "role": "r", "id": "Ayu sabar dan pintar.", "zh": "Ayu 有耐心又聪明。", "a": "ab4b10b660d6", "za": "49b995a22c36", "an": {"p": [["Ayu", "阿尤"], ["sabar", "耐心"], ["dan", "和"], ["pintar", "聪明"]], "b": "", "g": "结构：主语 + 形容词 + dan + 形容词。"}}, {"sp": "", "role": "r", "id": "Putri perhatian dan cekatan.", "zh": "Putri 体贴又麻利。", "a": "7c3f9f4b0a05", "za": "0839e3a801c2", "an": {"p": [["Putri", "普特丽"], ["perhatian", "体贴"], ["dan", "和"], ["cekatan", "手脚麻利"]], "b": "perhatian = per- + hati + -an", "g": "结构：主语 + 形容词 + dan + 形容词。perhatian 作形容词是“体贴关心”。"}}, {"sp": "", "role": "r", "id": "Roslia tekun dan tegas.", "zh": "Roslia 勤奋又果断。", "a": "67b965d6897b", "za": "e550ac667ff1", "an": {"p": [["Roslia", "罗丝莉娅"], ["tekun", "踏实努力"], ["dan", "和"], ["tegas", "果断严格"]], "b": "", "g": "结构：主语 + 形容词 + dan + 形容词。"}}], "zh": "嗨，我叫 Yoyo，我现在在办公室。现在办公室里有 Datil、Doni、Didik 和 Fadil。Datil 心地好又沉稳，Doni 勤奋又麻利，Didik 话少但友好，Fadil 开朗又风趣。还有几位同事不在办公室，她们是 Laras、Ayu、Putri 和 Roslia。Laras 聪明，是完美主义者；Ayu 耐心又聪明；Putri 体贴又麻利；Roslia 勤勉又果断。", "note": "", "qa": [{"q": "Apa ide utama paragraf 1?", "a": "Teman-teman Yoyo yang ada di kantor dan sifat mereka.", "qa": "57cdcb3d085d", "aa": "6ab95b69e33b", "qz": "第一段的主要内容是什么？", "az": "Yoyo 在办公室的同事和他们的性格。"}, {"q": "Apa ide utama paragraf 2?", "a": "Teman-teman Yoyo yang tidak ada di kantor dan sifat mereka.", "qa": "26f4ec97759c", "aa": "38a26cfe6d64", "qz": "第二段的主要内容是什么？", "az": "Yoyo 不在办公室的同事和他们的性格。"}, {"q": "Ada berapa orang teman Yoyo di kantor?", "a": "Ada empat orang: Datil, Doni, Didik, dan Fadil.", "qa": "52b11c108b2a", "aa": "9eac4764b5a2", "qz": "Yoyo 在办公室的同事有几个？", "az": "四个：Datil、Doni、Didik 和 Fadil。"}, {"q": "Bagaimana sifat Laras dan Roslia?", "a": "Laras cerdas dan perfeksionis; Roslia tekun dan tegas.", "qa": "61f0fcbcbdae", "aa": "6c75da5cd31d", "qz": "Laras 和 Roslia 的性格怎么样？", "az": "Laras 聪明、完美主义；Roslia 勤奋、果断。"}, {"q": "Bagaimana sifat Fadil dan Didik?", "a": "Fadil periang dan lucu; Didik pendiam tetapi ramah.", "qa": "af546e8bced1", "aa": "e5ac226d619a", "qz": "Fadil 和 Didik 的性格怎么样？", "az": "Fadil 开朗风趣；Didik 话不多但很友善。"}], "u": 8}, {"id": "t73", "kind": "text", "book": "BIPA 1", "title": "Santi 的卧室（音频 9.1）", "lines": [{"sp": "", "role": "r", "id": "Ini gambar kamar tidur saya.", "zh": "这是我卧室的图。", "a": "ac73c582ebe5", "za": "808dc7dcbd68", "an": {"p": [["Ini", "这是"], ["gambar", "图画"], ["kamar tidur", "卧室"], ["saya", "我的"]], "b": "", "g": "结构：Ini + 名词短语。kamar tidur = 房间 + 睡觉 = 卧室。"}}, {"sp": "", "role": "r", "id": "Di kamar saya ada banyak benda.", "zh": "我的房间里有很多东西。", "a": "3747fcb6654f", "za": "676c15f59be6", "an": {"p": [["Di kamar saya", "在我的房间里"], ["ada", "有"], ["banyak", "很多"], ["benda", "物品"]], "b": "", "g": "结构：地点 + ada + 数量 + 名词（存在句）。"}}, {"sp": "", "role": "r", "id": "Di samping pintu kamar ada lampu.", "zh": "房门旁边有一盏灯。", "a": "50688b5c85e9", "za": "a7286eaafb5e", "an": {"p": [["Di samping", "在……旁边"], ["pintu kamar", "房门"], ["ada", "有"], ["lampu", "灯"]], "b": "", "g": "结构：方位词短语 + ada + 物品。di samping = 在旁边。"}}, {"sp": "", "role": "r", "id": "Di dekat lampu ada televisi.", "zh": "灯旁边有一台电视。", "a": "c1bac7b3c494", "za": "5285cec6f153", "an": {"p": [["Di dekat", "在……附近"], ["lampu", "灯"], ["ada", "有"], ["televisi", "电视"]], "b": "", "g": "结构：方位 + ada + 物品。"}}, {"sp": "", "role": "r", "id": "Di seberang televisi ada tempat tidur.", "zh": "电视对面是床。", "a": "8c3f3a7051cb", "za": "dfe698a9a59a", "an": {"p": [["Di seberang", "在……对面"], ["televisi", "电视"], ["ada", "有"], ["tempat tidur", "床"]], "b": "seberang = 对面、对岸", "g": "结构：方位 + ada + 物品。tempat tidur = 睡觉的地方 = 床。"}}, {"sp": "", "role": "r", "id": "Tempat tidur saya berada di tengah kamar.", "zh": "我的床在房间中间。", "a": "0d9f1d6183d7", "za": "8e63a9caf977", "an": {"p": [["Tempat tidur saya", "我的床"], ["berada", "位于"], ["di tengah", "在中间"], ["kamar", "房间"]], "b": "berada = ber- + ada", "g": "结构：主语 + berada di + 位置。tengah = 中间。"}}, {"sp": "", "role": "r", "id": "Karpet ada di antara kasur dan televisi.", "zh": "地毯在床和电视之间。", "a": "abd816c10105", "za": "3de288221d1f", "an": {"p": [["Karpet", "地毯"], ["ada", "在"], ["di antara", "在……之间"], ["kasur", "床垫"], ["dan", "和"], ["televisi", "电视"]], "b": "", "g": "结构：主语 + ada di antara + A + dan + B。ada 这里是“在”。"}}, {"sp": "", "role": "r", "id": "Lemari ada di pojok kamar.", "zh": "衣柜在房间角落。", "a": "02f7d8887e7f", "za": "b5a7410b5c1b", "an": {"p": [["Lemari", "柜子"], ["ada", "在"], ["di pojok", "在角落"], ["kamar", "房间"]], "b": "", "g": "结构：物品 + ada di + 方位。pojok = 角落。"}}, {"sp": "", "role": "r", "id": "Di dalam lemari ada baju saya.", "zh": "衣柜里有我的衣服。", "a": "d29d6a44b8d6", "za": "b8c06713f111", "an": {"p": [["Di dalam", "在里面"], ["lemari", "柜子"], ["ada", "有"], ["baju saya", "我的衣服"]], "b": "", "g": "结构：方位 + ada + 物品。dalam = 里面。"}}, {"sp": "", "role": "r", "id": "Di samping kanan dan kiri tempat tidur saya ada meja kecil.", "zh": "我的床左右两边各有一张小桌子。", "a": "e493439d8ac7", "za": "0d097a5852f3", "an": {"p": [["Di samping kanan dan kiri", "在右边和左边"], ["tempat tidur saya", "我的床"], ["ada", "有"], ["meja kecil", "小桌子"]], "b": "", "g": "结构：方位（两个并列）+ ada + 物品。kanan 右，kiri 左。"}}, {"sp": "", "role": "r", "id": "Radio ada di atas meja kecil.", "zh": "收音机在小桌子上。", "a": "b9dfe9af5234", "za": "8db41eea8cbd", "an": {"p": [["Radio", "收音机"], ["ada", "在"], ["di atas", "在……上面"], ["meja kecil", "小桌子"]], "b": "", "g": "结构：物品 + ada di atas + 地点。atas 上，bawah 下。"}}, {"sp": "", "role": "r", "id": "Ada sofa kecil di bawah AC.", "zh": "空调下面有一张小沙发。", "a": "cc6b83000893", "za": "3972c65b41e2", "an": {"p": [["Ada", "有"], ["sofa kecil", "小沙发"], ["di bawah", "在……下面"], ["AC", "空调"]], "b": "", "g": "结构：Ada + 物品 + 方位。方位也可放在句尾。"}}], "zh": "这是我卧室的图。我的房间里有很多东西。房门旁边有一盏灯，灯旁边有一台电视，电视对面是床。我的床在房间中央。地毯在床和电视之间。衣柜在房间的角落，衣柜里是我的衣服。床的左右两边各有一张小桌子，收音机放在小桌子上。空调下面有一张小沙发。", "note": "", "qa": [{"q": "Di mana letak lemari?", "a": "Di pojok kamar.", "qa": "09d26c66918f", "aa": "97581e45e68a", "qz": "衣柜在哪里？", "az": "在房间角落。"}, {"q": "Ada benda apa di sebelah kiri dan kanan tempat tidur?", "a": "Meja kecil.", "qa": "56ed1f3519e0", "aa": "171db4b0d240", "qz": "床的左右两边有什么？", "az": "小桌子。"}, {"q": "Ada benda apa di atas meja kecil?", "a": "Radio.", "qa": "6f262e220d47", "aa": "df2b38d528de", "qz": "小桌子上有什么？", "az": "收音机。"}, {"q": "Di mana letak karpet?", "a": "Di antara kasur dan televisi.", "qa": "f6cdde24b421", "aa": "1f7bbca0072e", "qz": "地毯在哪里？", "az": "在床和电视之间。"}, {"q": "Lampu ada di sebelah mana?", "a": "Di samping pintu kamar.", "qa": "e5ac08bfec05", "aa": "16e6104772aa", "qz": "灯在哪边？", "az": "在房门旁边。"}], "u": 9}, {"id": "t74", "kind": "text", "book": "BIPA 1", "title": "去参加婚礼（音频 9.2）", "lines": [{"sp": "", "role": "r", "id": "Teman saya, Wina, menikah hari Sabtu lalu.", "zh": "我的朋友 Wina 上星期六结婚了。", "a": "27e1db50fd05", "za": "b4f0b9ab5234", "an": {"p": [["Teman saya", "我的朋友"], ["Wina", "维娜"], ["menikah", "结婚"], ["hari Sabtu lalu", "上周六"]], "b": "menikah = meN- + nikah", "g": "结构：主语 + 同位语（Wina）+ 动词 + 时间。lalu 放在时间词后表示“上一个”：hari Sabtu lalu = 上周六。"}}, {"sp": "", "role": "r", "id": "Saya pergi ke gedung pernikahannya.", "zh": "我去了她的婚礼礼堂。", "a": "dfdf34bdc17a", "za": "34e4a316206e", "an": {"p": [["Saya", "我"], ["pergi", "去"], ["ke", "到"], ["gedung", "大厅"], ["pernikahannya", "她的婚礼"]], "b": "pernikahan = per- + nikah + -an", "g": "结构：主语 + pergi ke + 地点。gedung pernikahan = 婚礼场馆。"}}, {"sp": "", "role": "r", "id": "Saya berangkat dari Gerung.", "zh": "我从 Gerung 出发。", "a": "19757e38d2bc", "za": "1e744272e28b", "an": {"p": [["Saya", "我"], ["berangkat", "出发"], ["dari", "从"], ["Gerung", "格龙（龙目岛地名）"]], "b": "berangkat = ber- + angkat", "g": "结构：主语 + berangkat dari + 起点。"}}, {"sp": "", "role": "r", "id": "Dari Gerung saya ke Barat sampai bertemu pertigaan.", "zh": "从 Gerung 我往西走，一直走到三岔路口。", "a": "4968951112f4", "za": "994ffe46b3f1", "an": {"p": [["Dari Gerung", "从格龙"], ["saya", "我"], ["ke Barat", "往西"], ["sampai", "直到"], ["bertemu", "遇到"], ["pertigaan", "三岔路口"]], "b": "bertemu = ber- + temu；pertigaan = per- + tiga + -an", "g": "结构：起点 + 主语 + 方向 + sampai + 动词 + 地标。sampai = 直到。pertigaan = 三岔路口，perempatan = 十字路口。"}}, {"sp": "", "role": "r", "id": "Di ujung pertigaan ada Balai Desa Sekotong.", "zh": "三岔路口尽头是 Sekotong 村公所。", "a": "255e18ffc804", "za": "dc2739df42db", "an": {"p": [["Di ujung", "在尽头"], ["pertigaan", "三岔路口"], ["ada", "有"], ["Balai Desa", "村公所"], ["Sekotong", "塞科通（地名）"]], "b": "", "g": "结构：方位 + ada + 地标。ujung = 尽头、末端。"}}, {"sp": "", "role": "r", "id": "Dari Balai Desa Sekotong, saya ke arah Selatan.", "zh": "从 Sekotong 村公所，我往南走。", "a": "d5125f05fc67", "za": "8bbf85eaf6c3", "an": {"p": [["Dari", "从"], ["Balai Desa Sekotong", "塞科通村公所"], ["saya", "我"], ["ke arah", "朝……方向"], ["Selatan", "南"]], "b": "", "g": "结构：起点 + 主语 + ke arah + 方向。四个方向：Utara 北、Selatan 南、Timur 东、Barat 西。"}}, {"sp": "", "role": "r", "id": "Saya melewati SD Sekotong II di kanan jalan.", "zh": "我经过路右边的 Sekotong 第二小学。", "a": "496419ea486b", "za": "e355ad9a318c", "an": {"p": [["Saya", "我"], ["melewati", "经过"], ["SD Sekotong II", "塞科通第二小学"], ["di kanan jalan", "在路的右边"]], "b": "melewati = meN- + lewat + -i", "g": "结构：主语 + melewati + 地标 + 位置。SD = Sekolah Dasar 小学。lewat 经过，+ -i 变及物。"}}, {"sp": "", "role": "r", "id": "Saya belok kanan masuk ke gang yang ada di antara SD Sekotong II dan sawah.", "zh": "我右转进了 Sekotong 第二小学和稻田之间的小巷。", "a": "42d53e020471", "za": "af7b24aa13fc", "an": {"p": [["Saya", "我"], ["belok kanan", "右转"], ["masuk", "进入"], ["ke gang", "到小巷"], ["yang ada di antara", "位于……之间的"], ["SD Sekotong II", "塞科通第二小学"], ["dan", "和"], ["sawah", "稻田"]], "b": "", "g": "结构：主语 + belok kanan + masuk ke + 地点 + yang 从句。yang ada di antara A dan B 修饰 gang。"}}, {"sp": "", "role": "r", "id": "Di pertigaan kedua saya belok kanan.", "zh": "在第二个三岔路口我右转。", "a": "777c0265ea1c", "za": "d3340f332e06", "an": {"p": [["Di pertigaan kedua", "在第二个三岔路口"], ["saya", "我"], ["belok kanan", "右转"]], "b": "kedua = ke- + dua", "g": "结构：地点 + 主语 + 动作。ke-dua = 第二。"}}, {"sp": "", "role": "r", "id": "Gedung pernikahan tepat berada di ujung jalan, menghadap ke Selatan.", "zh": "婚礼礼堂就在路的尽头，朝南。", "a": "06e8f973575d", "za": "18a072ae4f4b", "an": {"p": [["Gedung pernikahan", "婚礼场馆"], ["tepat", "正好"], ["berada di", "位于"], ["ujung jalan", "路的尽头"], ["menghadap", "朝向"], ["ke Selatan", "南边"]], "b": "menghadap = meN- + hadap", "g": "结构：主语 + tepat berada di + 位置, 动词短语（描述朝向）。后半句省略主语，补充说明朝向。"}}], "zh": "我的朋友 Wina 上周六结婚了，我去了她的婚礼礼堂。我从 Gerung 出发，往西走到一个三岔路口，路口尽头是 Sekotong 村委会。从村委会我往南走，经过路右边的 Sekotong 第二小学。我右转进入 Sekotong 第二小学和稻田之间的小巷，在第二个三岔路口再右转。婚礼礼堂就在路的尽头，朝南。", "note": "", "qa": [], "u": 9}, {"id": "t75", "kind": "text", "book": "BIPA 1", "title": "楠榜游记（课文 9.1）", "lines": [{"sp": "", "role": "r", "id": "Pada akhir tahun lalu saya berkunjung ke Lampung.", "zh": "去年年底我去了楠榜。", "a": "cdb7250dbf01", "za": "0b47a6e376b3", "an": {"p": [["Pada akhir tahun lalu", "去年年底"], ["saya", "我"], ["berkunjung", "拜访"], ["ke Lampung", "到楠榜"]], "b": "berkunjung = ber- + kunjung", "g": "结构：时间 + 主语 + berkunjung ke + 地点。"}}, {"sp": "", "role": "r", "id": "Kami berjalan-jalan ke beberapa tempat di Lampung.", "zh": "我们在楠榜逛了几个地方。", "a": "15957e34c0a7", "za": "2418be1ad9da", "an": {"p": [["Kami", "我们"], ["berjalan-jalan", "逛"], ["ke beberapa tempat", "到几个地方"], ["di Lampung", "在楠榜"]], "b": "", "g": "结构：主语 + 动词 + ke + 地点 + 范围。beberapa = 几个。"}}, {"sp": "", "role": "r", "id": "Di sana ada mal, universitas, dan tempat makan.", "zh": "那里有商场、大学和餐馆。", "a": "393b01044fcf", "za": "70eeb777e683", "an": {"p": [["Di sana", "在那里"], ["ada", "有"], ["mal", "商场"], ["universitas", "大学"], ["dan", "和"], ["tempat makan", "餐馆"]], "b": "", "g": "结构：地点 + ada + 并列名词。tempat makan = 吃饭的地方。"}}, {"sp": "", "role": "r", "id": "Kami memulai perjalanan dari pompa bensin.", "zh": "我们从加油站出发。", "a": "bfce17147ede", "za": "31df6757539b", "an": {"p": [["Kami", "我们"], ["memulai", "开始"], ["perjalanan", "旅程"], ["dari", "从"], ["pompa bensin", "加油站"]], "b": "memulai = meN- + mulai；perjalanan = per- + jalan + -an", "g": "结构：主语 + memulai + 宾语 + dari + 起点。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri pompa bensin ada sebuah universitas.", "zh": "加油站左边有一所大学。", "a": "868d540641fe", "za": "6549e8893eb1", "an": {"p": [["Di sebelah kiri", "在左边"], ["pompa bensin", "加油站"], ["ada", "有"], ["sebuah", "一所"], ["universitas", "大学"]], "b": "", "g": "结构：方位 + ada + 数量 + 名词。"}}, {"sp": "", "role": "r", "id": "Kampusnya besar sekali.", "zh": "校园非常大。", "a": "2018ee1f0a9a", "za": "5c21f9b84440", "an": {"p": [["Kampusnya", "它的校园"], ["besar", "大"], ["sekali", "非常"]], "b": "kampusnya = kampus + -nya", "g": "结构：主语 + 形容词 + sekali。sekali 放在形容词后表示“非常”。"}}, {"sp": "", "role": "r", "id": "Di seberang pompa bensin ada beberapa universitas lain.", "zh": "加油站对面还有几所大学。", "a": "07f75ba6b402", "za": "424b04859842", "an": {"p": [["Di seberang", "在对面"], ["pompa bensin", "加油站"], ["ada", "有"], ["beberapa", "几所"], ["universitas lain", "其他大学"]], "b": "", "g": "结构：方位 + ada + 数量 + 名词。"}}, {"sp": "", "role": "r", "id": "Ada IBI Darmajaya, Universitas Bandar Lampung, dan IAIN Lampung.", "zh": "有 IBI Darmajaya、楠榜大学和楠榜国立伊斯兰学院。", "a": "9ea370d4c4f4", "za": "81138bcbd2b4", "an": {"p": [["Ada", "有"], ["IBI Darmajaya", "达尔玛贾亚商业学院"], ["Universitas Bandar Lampung", "班达楠榜大学"], ["dan", "和"], ["IAIN Lampung", "楠榜国立伊斯兰学院"]], "b": "", "g": "结构：Ada + 并列专有名词。IAIN = Institut Agama Islam Negeri。"}}, {"sp": "", "role": "r", "id": "Setelah mengisi bensin, saya dan keluarga pergi makan di Restoran Padang.", "zh": "加完油后，我和家人去巴东餐馆吃饭。", "a": "31902fbf903f", "za": "231767c183e2", "an": {"p": [["Setelah", "之后"], ["mengisi bensin", "加油"], ["saya dan keluarga", "我和家人"], ["pergi makan", "去吃饭"], ["di", "在"], ["Restoran Padang", "巴东餐厅"]], "b": "mengisi = meN- + isi", "g": "结构：Setelah + 动作, 主语 + pergi + 动词 + 地点。Restoran Padang 即巴东菜餐厅。"}}, {"sp": "", "role": "r", "id": "Restoran itu ada di antara Warung Gudeg Jogja dan Warung Penyet Idola.", "zh": "那家餐馆在日惹 Gudeg 小店和 Idola Penyet 小店之间。", "a": "dba0f5641948", "za": "2541f4f5a67d", "an": {"p": [["Restoran itu", "那家餐厅"], ["ada di antara", "位于……之间"], ["Warung Gudeg Jogja", "日惹菠萝蜜饭小店"], ["dan", "和"], ["Warung Penyet Idola", "偶像压炸小店"]], "b": "", "g": "结构：主语 + ada di antara A dan B。warung = 小餐馆。"}}, {"sp": "", "role": "r", "id": "Di seberang restoran ada toko kelontong.", "zh": "餐馆对面有一家杂货店。", "a": "81a9852d5f84", "za": "12e5851d5d84", "an": {"p": [["Di seberang", "在对面"], ["restoran", "餐厅"], ["ada", "有"], ["toko kelontong", "杂货店"]], "b": "", "g": "结构：方位 + ada + 名词。toko kelontong = 杂货店。"}}, {"sp": "", "role": "r", "id": "Selesai makan, kami pergi ke mal.", "zh": "吃完饭，我们去了商场。", "a": "f43c8627c137", "za": "d588524b8994", "an": {"p": [["Selesai", "结束"], ["makan", "吃"], ["kami", "我们"], ["pergi ke", "去"], ["mal", "商场"]], "b": "", "g": "结构：Selesai + 动词, 主语 + 动词。Selesai makan = 吃完饭后。"}}, {"sp": "", "role": "r", "id": "Mal itu terletak di persimpangan jalan ke arah Way Halim.", "zh": "那家商场位于去 Way Halim 方向的十字路口。", "a": "529a0f1b6110", "za": "e0504fcdda1a", "an": {"p": [["Mal itu", "那座商场"], ["terletak", "坐落"], ["di persimpangan", "在路口"], ["jalan", "路"], ["ke arah", "朝向"], ["Way Halim", "威哈林（地名）"]], "b": "terletak = ter- + letak；persimpangan = per- + simpang + -an", "g": "结构：主语 + terletak di + 地点 + ke arah + 方向。ter- 表示状态：terletak = 位于。"}}, {"sp": "", "role": "r", "id": "Dari mal kami pergi ke rumah saudara.", "zh": "从商场出来，我们去了亲戚家。", "a": "eda6acaa90a4", "za": "9e8b2df5e29e", "an": {"p": [["Dari mal", "从商场"], ["kami", "我们"], ["pergi ke", "去"], ["rumah saudara", "亲戚家"]], "b": "", "g": "结构：起点 + 主语 + 动词 + 终点。saudara = 亲属。"}}, {"sp": "", "role": "r", "id": "Rumahnya ada di belakang Warung Gudeg Jogja.", "zh": "他家在日惹 Gudeg 小店后面。", "a": "c8685f327df6", "za": "02a5596d3d0b", "an": {"p": [["Rumahnya", "他们的房子"], ["ada", "在"], ["di belakang", "在……后面"], ["Warung Gudeg Jogja", "日惹菠萝蜜饭小店"]], "b": "rumahnya = rumah + -nya", "g": "结构：主语 + ada di + 方位。belakang 后，depan 前。"}}], "zh": "去年年底我去了楠榜，我们在楠榜逛了几个地方，那里有商场、大学和餐馆。我们从加油站出发。加油站左边有一所大学，校园非常大；加油站对面还有几所大学：IBI Darmajaya、楠榜港大学和楠榜国立伊斯兰学院。加完油后，我和家人去巴东餐馆吃饭，那家餐馆在日惹菠萝蜜炖菜馆和 Idola 压扁炸鸡馆之间，餐馆对面有一家杂货店。吃完饭我们去了商场，商场位于通往 Way Halim 方向的路口。离开商场后我们去了亲戚家，他们家在日惹菠萝蜜炖菜馆后面。", "note": "", "qa": [{"q": "Apa topik Teks 9.1?", "a": "Jalan-jalan di Bandar Lampung.", "qa": "edd4463334e5", "aa": "9983b02633fa", "qz": "课文 9.1 的主题是什么？", "az": "在楠榜市游玩。"}, {"q": "Ada tempat apa saja di Kota Bandar Lampung?", "a": "Mal, universitas, dan tempat makan.", "qa": "be94e534312b", "aa": "f091bd5b1ec5", "qz": "楠榜市有哪些地方？", "az": "商场、大学和餐馆。"}, {"q": "Di mana letak universitas yang besar?", "a": "Di sebelah kiri pompa bensin.", "qa": "0647a48dc829", "aa": "dd0706976150", "qz": "那所大大学在哪里？", "az": "在加油站左边。"}, {"q": "Restoran Padang berada di antara apa?", "a": "Di antara Warung Gudeg Jogja dan Warung Penyet Idola.", "qa": "946b89910ece", "aa": "6d7bdf777f2f", "qz": "巴东餐馆在哪两个地方之间？", "az": "在日惹 Gudeg 小店和 Idola Penyet 小店之间。"}], "u": 9}, {"id": "t76", "kind": "text", "book": "BIPA 1", "title": "Sari 的新教室（课文 9.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Sari.", "zh": "嗨，我叫 Sari。", "a": "e373352c6383", "za": "cd0561f43fb4", "an": {"p": [["Hai", "嗨"], ["nama saya", "我的名字"], ["Sari", "萨莉"]], "b": "", "g": "结构：问候 + Nama saya + 名字。"}}, {"sp": "", "role": "r", "id": "Hari ini saya masuk kelas baru.", "zh": "今天我进了新班级。", "a": "b076de40d1a6", "za": "7c432f5a3eef", "an": {"p": [["Hari ini", "今天"], ["saya", "我"], ["masuk", "进入"], ["kelas baru", "新教室（新班级）"]], "b": "", "g": "结构：时间 + 主语 + masuk + 地点。masuk kelas = 进教室／进班。"}}, {"sp": "", "role": "r", "id": "Ada papan tulis besar di dalam kelas.", "zh": "教室里有一块大黑板。", "a": "54312b5aa970", "za": "254bd648cc17", "an": {"p": [["Ada", "有"], ["papan tulis", "黑板"], ["besar", "大"], ["di dalam", "在里面"], ["kelas", "教室"]], "b": "", "g": "结构：Ada + 名词 + 形容词 + 地点。papan tulis = 写字的板。"}}, {"sp": "", "role": "r", "id": "Spidol dan penghapus ada di bawah papan tulis.", "zh": "记号笔和板擦在黑板下面。", "a": "5357510bdb09", "za": "77772138fc06", "an": {"p": [["Spidol", "马克笔"], ["dan", "和"], ["penghapus", "板擦"], ["ada", "在"], ["di bawah", "在……下面"], ["papan tulis", "黑板"]], "b": "penghapus = peN- + hapus（擦除的东西）", "g": "结构：主语（并列）+ ada di + 方位。pe- 表工具：hapus 擦 → penghapus 橡皮／板擦。"}}, {"sp": "", "role": "r", "id": "Di sebelah kiri papan tulis ada lemari.", "zh": "黑板左边有一个柜子。", "a": "40860f74f86a", "za": "87c30e0ed413", "an": {"p": [["Di sebelah kiri", "在左边"], ["papan tulis", "黑板"], ["ada", "有"], ["lemari", "柜子"]], "b": "", "g": "结构：方位 + ada + 物品。"}}, {"sp": "", "role": "r", "id": "Di dalam lemari ada banyak buku.", "zh": "柜子里有很多书。", "a": "018bf2512df4", "za": "eddeeba66fca", "an": {"p": [["Di dalam", "在里面"], ["lemari", "柜子"], ["ada", "有"], ["banyak buku", "很多书"]], "b": "", "g": "结构：方位 + ada + 数量 + 名词。"}}, {"sp": "", "role": "r", "id": "Meja dan kursi Bu Sinta ada di depan lemari.", "zh": "Sinta 老师的桌椅在柜子前面。", "a": "d538f92d3853", "za": "35f83647c99f", "an": {"p": [["Meja dan kursi", "桌子和椅子"], ["Bu Sinta", "辛塔老师"], ["ada di depan", "在前面"], ["lemari", "柜子"]], "b": "", "g": "结构：主语（并列）+ ada di depan + 参照物。Bu = Ibu 的简称，对女性的尊称。"}}, {"sp": "", "role": "r", "id": "Di seberang meja Bu Sinta ada meja dan kursi saya.", "zh": "Sinta 老师的桌子对面是我的桌椅。", "a": "c001bcfdb455", "za": "0d84f5b00574", "an": {"p": [["Di seberang", "在对面"], ["meja Bu Sinta", "辛塔老师的桌子"], ["ada", "有"], ["meja dan kursi saya", "我的桌椅"]], "b": "", "g": "结构：方位 + ada + 物品。"}}, {"sp": "", "role": "r", "id": "Tempat duduk saya berhadapan dengan tempat duduk Bu Sinta.", "zh": "我的座位和 Sinta 老师的座位面对面。", "a": "d763dd848c15", "za": "c91ab87b150b", "an": {"p": [["Tempat duduk saya", "我的座位"], ["berhadapan", "面对面"], ["dengan", "和"], ["tempat duduk Bu Sinta", "辛塔老师的座位"]], "b": "berhadapan = ber- + hadap + -an（互相面对）", "g": "结构：主语 + berhadapan dengan + 对象。ber-……-an 表示互相。"}}, {"sp": "", "role": "r", "id": "Di sebelah kanan saya ada banyak bangku dan meja.", "zh": "我右边有很多凳子和桌子。", "a": "7926e3e6cd60", "za": "f9e84dcb5208", "an": {"p": [["Di sebelah kanan saya", "在我右边"], ["ada", "有"], ["banyak", "很多"], ["bangku dan meja", "长凳和桌子"]], "b": "", "g": "结构：方位 + ada + 数量 + 名词。"}}, {"sp": "", "role": "r", "id": "Pintu ada di sisi kanan ruang kelas.", "zh": "门在教室右侧。", "a": "58b3c21de13d", "za": "23b748d88242", "an": {"p": [["Pintu", "门"], ["ada", "在"], ["di sisi kanan", "在右侧"], ["ruang kelas", "教室"]], "b": "", "g": "结构：主语 + ada di + 方位。sisi = 侧。"}}, {"sp": "", "role": "r", "id": "Peta ada di antara gambar pahlawan dan jam dinding.", "zh": "地图在英雄画像和挂钟之间。", "a": "d9a41b71d1f1", "za": "8cdf216e7868", "an": {"p": [["Peta", "地图"], ["ada di antara", "位于……之间"], ["gambar pahlawan", "英雄画像"], ["dan", "和"], ["jam dinding", "挂钟"]], "b": "", "g": "结构：主语 + ada di antara A dan B。jam dinding = 墙上的钟。"}}, {"sp": "", "role": "r", "id": "Siswa di sebelahku bernama Anton.", "zh": "坐在我旁边的同学叫 Anton。", "a": "0468b69d6e7c", "za": "5012eeed4c56", "an": {"p": [["Siswa", "学生"], ["di sebelahku", "在我旁边"], ["bernama", "名叫"], ["Anton", "安东"]], "b": "sebelahku = sebelah + -ku；bernama = ber- + nama", "g": "结构：主语（Siswa + 方位）+ bernama + 名字。bernama = 名叫。"}}, {"sp": "", "role": "r", "id": "Di belakang Anton ada Novi dan Putri.", "zh": "Anton 后面是 Novi 和 Putri。", "a": "d7167f3c3b77", "za": "e6e14bd3dcf5", "an": {"p": [["Di belakang", "在……后面"], ["Anton", "安东"], ["ada", "有"], ["Novi dan Putri", "诺维和普特丽"]], "b": "", "g": "结构：方位 + ada + 人名。"}}], "zh": "大家好，我叫 Sari，今天我进了新班级。教室里有一块大黑板，马克笔和板擦在黑板下面。黑板左边有一个柜子，柜子里有很多书。Sinta 老师的桌椅在柜子前面，老师桌子对面是我的桌椅，我的座位正对着老师的座位。我右边有很多长凳和桌子。门在教室右侧。地图挂在英雄像和挂钟之间。坐我旁边的同学叫 Anton，Anton 后面是 Novi 和 Putri。", "note": "", "qa": [], "u": 9}, {"id": "t77", "kind": "text", "book": "BIPA 1", "title": "Mila 的家（音频 10.1）", "lines": [{"sp": "", "role": "r", "id": "Rumah Mila sangat bagus.", "zh": "Mila 的家非常漂亮。", "a": "f2153c7e8b60", "za": "747e5f1b5ad8", "an": {"p": [["Rumah Mila", "Mila 的家"], ["sangat", "非常"], ["bagus", "好、漂亮"]], "b": "", "g": "sangat + 形容词。形容词直接做谓语，不需要 adalah。"}}, {"sp": "", "role": "r", "id": "Ukurannya tidak terlalu besar.", "zh": "房子不算太大。", "a": "f76bc2da7deb", "za": "142efc9789ad", "an": {"p": [["Ukurannya", "它的大小"], ["tidak terlalu", "不太"], ["besar", "大"]], "b": "", "g": "-nya 指代前一句的 rumah Mila。tidak terlalu + 形容词 = 不太……。"}}, {"sp": "", "role": "r", "id": "Di depan rumah ada tempat parkir mobil.", "zh": "房子前面有停车位。", "a": "481fec63f1b8", "za": "561f51deacf7", "an": {"p": [["Di depan rumah", "在房子前面"], ["ada", "有"], ["tempat parkir mobil", "停车处"]], "b": "parkir = 停车；tempat = 地方", "g": "结构：地点 + ada + 事物（存在句）。tempat parkir mobil = 地方 + 停车 + 汽车，核心词 tempat 在前，后面逐层修饰：停汽车的地方。"}}, {"sp": "", "role": "r", "id": "Rumahnya bercat hijau dan putih.", "zh": "房子刷成绿色和白色。", "a": "3e1f2b26cbdc", "za": "9a366dafa110", "an": {"p": [["Rumahnya", "她家的房子"], ["bercat", "刷着漆"], ["hijau", "绿"], ["dan", "和"], ["putih", "白"]], "b": "bercat = ber- + cat 油漆", "g": "ber- + 名词 = 有、带着……：bercat = 刷了漆。bercat hijau dan putih = 漆成绿白两色。"}}, {"sp": "", "role": "r", "id": "Genting rumahnya berwarna abu-abu.", "zh": "屋顶的瓦是灰色的。", "a": "446e6ed3a6a3", "za": "63d669651a58", "an": {"p": [["Genting", "瓦片、屋顶"], ["rumahnya", "她家的"], ["berwarna", "是……色"], ["abu-abu", "灰色"]], "b": "", "g": "Genting rumahnya = 名词 + 名词-nya（她家房子的屋顶）。abu-abu 重叠表示“灰色（的）”。"}}, {"sp": "", "role": "r", "id": "Rumahnya ber-AC.", "zh": "房子里有空调。", "a": "ce175d696cb8", "za": "675f824a96a6", "an": {"p": [["Rumahnya", "她家的房子"], ["ber-AC", "有空调"]], "b": "AC = 空调（读 a-ce）", "g": "ber- + 缩写 = 带有……：ber-AC = 装有空调。缩写前加连字符。"}}, {"sp": "", "role": "r", "id": "Di depan rumah ada lahan untuk menanam tanaman.", "zh": "房子前面有一块种植物的空地。", "a": "bef589458ae8", "za": "0dc59b5b2638", "an": {"p": [["Di depan rumah", "在房子前面"], ["ada", "有"], ["lahan", "空地"], ["untuk menanam", "用来种"], ["tanaman", "植物"]], "b": "menanam = tanam + meN-；tanaman = tanam + -an", "g": "结构：地点 + ada + 名词 + untuk + 动词。lahan untuk menanam tanaman = 用来种植物的空地。tanam 种，tanaman = 种出来的东西（植物）。"}}, {"sp": "", "role": "r", "id": "Pintunya berwarna cokelat tua.", "zh": "门是深棕色的。", "a": "d59da16e6183", "za": "0eb2f2b07eed", "an": {"p": [["Pintunya", "它的门"], ["berwarna", "是……色"], ["cokelat tua", "深棕色"]], "b": "", "g": "-nya 指代前面说的房子。cokelat = 巧克力色（棕），tua 本义“老”，放在颜色后表示深。"}}], "zh": "Mila 的家很漂亮，不算太大。房子前面有停车位，房子刷成绿白两色，屋顶瓦片是灰色的，屋里有空调。房子前面有一块种植物的空地，门是深棕色的。", "note": "背景：Meli 去了 Mila 在勿加泗（Bekasi）的家，然后讲给朋友 Ben 听。", "qa": [], "u": 10}, {"id": "t78", "kind": "text", "book": "BIPA 1", "title": "Meli 要带的东西（音频 10.2）", "lines": [{"sp": "", "role": "r", "id": "Besok saya akan merantau ke Jakarta untuk bekerja.", "zh": "明天我要去雅加达外出打工。", "a": "8f044bb06b6a", "za": "5d7e2162e5d3", "an": {"p": [["Besok", "明天"], ["saya", "我"], ["akan", "将要"], ["merantau", "外出闯荡"], ["ke Jakarta", "到雅加达"], ["untuk", "为了"], ["bekerja", "工作"]], "b": "merantau = meN- + rantau", "g": "结构：时间 + 主语 + akan + 动词 + 地点 + untuk + 目的。merantau = 离开家乡到外地谋生。"}}, {"sp": "", "role": "r", "id": "Saya akan membawa banyak barang.", "zh": "我要带很多东西。", "a": "b342f4f9fcc9", "za": "c0eff04c78d4", "an": {"p": [["Saya", "我"], ["akan", "将要"], ["membawa", "带"], ["banyak barang", "很多东西"]], "b": "membawa = meN- + bawa", "g": "结构：主语 + akan + 动词 + 宾语。"}}, {"sp": "", "role": "r", "id": "Namun, beberapa barang tidak saya bawa.", "zh": "不过，有些东西我不带。", "a": "9444d8746dc5", "za": "62de403db081", "an": {"p": [["Namun", "然而"], ["beberapa barang", "一些东西"], ["tidak", "不"], ["saya", "我"], ["bawa", "带"]], "b": "", "g": "结构：宾语前置：宾语 + tidak + saya + 动词原形。把宾语放到句首强调，动词用无前缀形式。"}}, {"sp": "", "role": "r", "id": "Saya akan membawa sepatu pantofel hitam, kaus kaki cokelat, rok berwarna hitam, dan kemeja putih.", "zh": "我要带黑色皮鞋、棕色袜子、黑色裙子和白衬衫。", "a": "7b06d2d0fedf", "za": "91af3f3e7fe4", "an": {"p": [["Saya", "我"], ["akan membawa", "将带"], ["sepatu pantofel", "皮鞋"], ["hitam", "黑色"], ["kaus kaki", "袜子"], ["cokelat", "棕色"], ["rok", "裙子"], ["berwarna", "有颜色的"], ["dan", "和"], ["kemeja putih", "白衬衫"]], "b": "berwarna = ber- + warna", "g": "结构：主语 + akan membawa + 并列宾语。颜色放在名词后：sepatu hitam 黑鞋；berwarna hitam = 黑色的。"}}, {"sp": "", "role": "r", "id": "Saya juga perlu membawa blazer ungu dan jaket merah.", "zh": "我还需要带紫色西装外套和红色夹克。", "a": "9c7620e13792", "za": "146a1e48fc4a", "an": {"p": [["Saya", "我"], ["juga", "也"], ["perlu", "需要"], ["membawa", "带"], ["blazer ungu", "紫色西装外套"], ["dan", "和"], ["jaket merah", "红夹克"]], "b": "", "g": "结构：主语 + juga +
