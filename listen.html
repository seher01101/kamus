": "1d9a9ec3faf6", "an": {"p": [["Kamu", "你"], ["lebih suka", "更喜欢"], ["berolahraga", "运动"], ["sendiri", "独自"], ["atau", "还是"], ["bersama teman", "和朋友一起"], ["Mengapa", "为什么"]], "b": "", "g": "结构：主语 + lebih suka + 动词 + A atau B？"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka berolahraga bersama teman, karena lebih seru dan kami bisa saling menyemangati.", "zh": "我更喜欢和朋友一起，因为更有意思，还能互相打气。", "a": "9dbf007ff18e", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["berolahraga bersama teman", "和朋友一起运动"], ["karena", "因为"], ["lebih seru", "更有趣"], ["dan", "并且"], ["kami bisa", "我们能"], ["saling menyemangati", "互相鼓励"]], "b": "menyemangati = meN- + semangat + -i（vt. 鼓励）", "g": "结构：主语 + lebih suka + 动词短语, karena + 形容词 + dan + 主语 + bisa + saling + 动词。saling menyemangati = 互相鼓励。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu terlalu sibuk, bagaimana caramu tetap berolahraga?", "zh": "如果你太忙，你怎么坚持运动？", "a": "07b1d1976b6a", "an": {"p": [["Kalau", "如果"], ["kamu", "你"], ["terlalu sibuk", "太忙"], ["bagaimana caramu", "你的办法是怎样"], ["tetap", "仍然"], ["berolahraga", "运动"]], "b": "caramu = cara + -mu", "g": "结构：Kalau + 条件, bagaimana cara + 主语 + tetap + 动词？tetap + 动词 = 仍然做……。"}}, {"sp": "参考回答", "role": "a", "id": "Kalau sibuk, saya berjalan kaki ke kantor dan naik tangga, bukan naik lift.", "zh": "忙的时候，我走路去上班，爬楼梯不坐电梯。", "a": "a01889167869", "an": {"p": [["Kalau sibuk", "如果忙"], ["saya", "我"], ["berjalan kaki", "步行"], ["ke kantor", "去办公室"], ["dan", "并"], ["naik tangga", "爬楼梯"], ["bukan", "而不是"], ["naik lift", "坐电梯"]], "b": "", "g": "结构：Kalau + 形容词, 主语 + 动词 1 + dan + 动词 2, bukan + 动词。bukan 用来否定名词或动词短语，表示“而不是”。"}}, {"sp": "考官", "role": "q", "id": "Apakah di kotamu ada Hari Bebas Kendaraan? Menurutmu, kegiatan itu bagus atau tidak?", "zh": "你的城市有无车日吗？你觉得这个活动好不好？", "a": "a8112882b853", "an": {"p": [["Apakah", "是否"], ["di kotamu", "在你的城市"], ["ada", "有"], ["Hari Bebas Kendaraan", "无车日"], ["Menurutmu", "依你看"], ["kegiatan itu", "这个活动"], ["bagus", "好"], ["atau tidak", "还是不好"]], "b": "kendaraan = kendara + -an（n. 交通工具）", "g": "结构：Apakah + 地点 + ada + 名词？A atau tidak？问“好还是不好”。Hari Bebas Kendaraan = 无车日（周日有的城市封路让人运动）。"}}, {"sp": "参考回答", "role": "a", "id": "Di kota saya tidak ada, tetapi menurut saya kegiatan itu bagus karena udaranya menjadi lebih bersih dan orang bisa berolahraga.", "zh": "我的城市没有，但我觉得这个活动很好，因为空气会变干净，大家也能运动。", "a": "7b4c8459b71f", "an": {"p": [["Di kota saya", "在我的城市"], ["tidak ada", "没有"], ["tetapi", "但是"], ["menurut saya", "依我看"], ["kegiatan itu", "这个活动"], ["bagus", "好"], ["karena", "因为"], ["udaranya", "空气"], ["menjadi lebih bersih", "变得更干净"], ["dan", "并且"], ["orang bisa berolahraga", "人们能运动"]], "b": "", "g": "结构：地点 + tidak ada, tetapi + menurut saya + 评价 + karena + 两个原因。menjadi + lebih + 形容词 = 变得更……。"}}, {"sp": "考官", "role": "q", "id": "Apa yang kamu rasakan setelah berolahraga?", "zh": "运动完你有什么感觉？", "a": "7f9f038fb340", "an": {"p": [["Apa", "什么"], ["yang kamu rasakan", "你感觉到的"], ["setelah", "之后"], ["berolahraga", "运动"]], "b": "rasakan = rasa + -kan（动词原形）", "g": "结构：Apa yang + 主语 + 动词原形 + setelah + 动词？问“运动后有什么感觉”。"}}, {"sp": "参考回答", "role": "a", "id": "Setelah berolahraga, badan saya terasa segar dan saya bisa tidur lebih nyenyak.", "zh": "运动完身体很轻松，睡得也更香。", "a": "d6ec610f915b", "an": {"p": [["Setelah berolahraga", "运动之后"], ["badan saya", "我的身体"], ["terasa", "感觉"], ["segar", "清爽"], ["dan", "并且"], ["saya bisa", "我能"], ["tidur", "睡"], ["lebih nyenyak", "更香"]], "b": "terasa = ter- + rasa（vi. 感觉起来）；nyenyak = adj. 睡得香", "g": "结构：Setelah + 动词, 名词 + terasa + 形容词 + dan + 主语 + bisa + 动词 + lebih + 形容词。terasa = 感觉起来。"}}], "zh": "", "note": "本单元生词：olahraga n. 运动 · berolahraga vi. 运动 · pemanasan n. 热身 · pendinginan n. 放松运动 · cedera n./vi. 受伤 · seminggu 一周 · berjalan kaki 走路 · naik tangga 爬楼梯 · segar adj. 清爽、有精神 · nyenyak adj. 睡得香 · Hari Bebas Kendaraan 无车日", "qa": [], "new": "2026-10-28", "u": 7}, {"id": "e170", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 8 单元 交通 Transportasi", "lines": [{"sp": "考官", "role": "q", "id": "Transportasi apa yang biasanya kamu pakai setiap hari?", "zh": "你每天一般用什么交通工具？", "a": "b9f5e0dc0e35", "an": {"p": [["Transportasi apa", "什么交通工具"], ["yang biasanya kamu pakai", "你通常用的"], ["setiap hari", "每天"]], "b": "pakai = vt. 使用（动词原形）", "g": "结构：名词 + apa + yang + 副词 + 主语 + 动词原形 + 频率？pakai 在这里 = 乘坐、使用。"}}, {"sp": "参考回答", "role": "a", "id": "Setiap hari saya naik bus kantor ke tempat kerja, kira-kira lima belas menit.", "zh": "我每天坐公司的班车去上班，大概十五分钟。", "a": "c0b693e42dfa", "an": {"p": [["Setiap hari", "每天"], ["saya", "我"], ["naik", "乘"], ["bus kantor", "公司班车"], ["ke tempat kerja", "去上班地点"], ["kira-kira", "大约"], ["lima belas menit", "十五分钟"]], "b": "kira-kira = kira 重叠", "g": "结构：频率 + 主语 + naik + 交通工具 + ke + 地点, kira-kira + 时间。kira-kira = 大约。lima belas = 十五。"}}, {"sp": "考官", "role": "q", "id": "Apa kelebihan naik kereta dibandingkan naik mobil?", "zh": "坐火车比开车有什么好处？", "a": "f3b1a0d441f8", "an": {"p": [["Apa", "什么"], ["kelebihan", "优点"], ["naik kereta", "乘火车"], ["dibandingkan", "相比"], ["naik mobil", "坐汽车"]], "b": "dibandingkan = di- + banding + -kan（被比较）", "g": "结构：Apa + kelebihan + A + dibandingkan + B？dibandingkan = 与……相比。"}}, {"sp": "参考回答", "role": "a", "id": "Naik kereta lebih cepat karena tidak ada macet, dan harganya juga lebih murah.", "zh": "坐火车更快，因为不堵车，价格也更便宜。", "a": "852a9ae68b53", "an": {"p": [["Naik kereta", "乘火车"], ["lebih cepat", "更快"], ["karena", "因为"], ["tidak ada macet", "没有堵车"], ["dan", "并且"], ["harganya", "价格"], ["juga", "也"], ["lebih murah", "更便宜"]], "b": "", "g": "结构：动词短语 + lebih + 形容词 + karena + tidak ada + 名词, dan + 名词-nya + juga + 比较级。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah terlambat karena macet? Ceritakan.", "zh": "你有没有因为堵车迟到过？讲讲。", "a": "bdf861a64e13", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["terlambat", "迟到"], ["karena macet", "因为堵车"], ["Ceritakan", "请讲讲"]], "b": "", "g": "结构：Apakah + 主语 + pernah + 动词 + karena + 原因？Ceritakan. = 请讲述。"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Waktu itu jalannya macet sekali, jadi saya terlambat tiga puluh menit ke rapat.", "zh": "有过。那次路上特别堵，我开会迟到了三十分钟。", "a": "ef67b0a1f179", "an": {"p": [["Pernah", "曾经"], ["Waktu itu", "那时"], ["jalannya", "路"], ["macet sekali", "堵得厉害"], ["jadi", "所以"], ["saya terlambat", "我迟到"], ["tiga puluh menit", "三十分钟"], ["ke rapat", "去开会"]], "b": "", "g": "结构：Waktu itu + 主语 + 形容词 + sekali, jadi + 主语 + terlambat + 时长 + ke + 地点。terlambat + 时长 = 迟到多久。"}}, {"sp": "考官", "role": "q", "id": "Kalau kamu pergi ke tempat yang baru, bagaimana caramu mencari jalan?", "zh": "去一个新地方，你怎么找路？", "a": "aa1adf0337bf", "an": {"p": [["Kalau", "如果"], ["kamu pergi", "你去"], ["ke tempat yang baru", "新的地方"], ["bagaimana caramu", "你的办法"], ["mencari jalan", "找路"]], "b": "mencari = meN- + cari", "g": "结构：Kalau + 从句, bagaimana cara + 主语 + 动词？mencari jalan = 找路。"}}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya memakai aplikasi peta di telepon genggam, atau saya bertanya kepada orang di sekitar.", "zh": "我一般用手机上的地图软件，或者问问旁边的人。", "a": "4b5a08f9dfb5", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["memakai", "使用"], ["aplikasi peta", "地图应用"], ["di telepon genggam", "在手机上"], ["atau", "或者"], ["saya bertanya", "我问"], ["kepada orang di sekitar", "向周围的人"]], "b": "bertanya = ber- + tanya（vi. 问）", "g": "结构：主语 + 副词 + 动词 + 宾语, atau + 主语 + bertanya + kepada + 人。bertanya kepada + 人 = 向某人提问。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, apa perbedaan transportasi umum di Indonesia dan di Tiongkok?", "zh": "你觉得印尼和中国的公共交通有什么不同？", "a": "5a24297bf97c", "an": {"p": [["Menurutmu", "依你看"], ["apa perbedaan", "有什么不同"], ["transportasi umum", "公共交通"], ["di Indonesia", "在印尼"], ["dan", "和"], ["di Tiongkok", "在中国"]], "b": "", "g": "结构：Apa + perbedaan + 名词 + 地点 A + dan + 地点 B？"}}, {"sp": "参考回答", "role": "a", "id": "Di Tiongkok ada banyak kereta cepat dan kereta bawah tanah, sedangkan di sini orang lebih sering naik sepeda motor.", "zh": "中国有很多高铁和地铁，而这里的人更常骑摩托车。", "a": "66ba0621f825", "an": {"p": [["Di Tiongkok", "在中国"], ["ada", "有"], ["banyak", "很多"], ["kereta cepat", "高铁"], ["dan", "和"], ["kereta bawah tanah", "地铁"], ["sedangkan", "而"], ["di sini", "在这里"], ["orang", "人们"], ["lebih sering", "更常"], ["naik sepeda motor", "骑摩托车"]], "b": "", "g": "结构：A 地点 + ada + 名词, sedangkan + B 地点 + 主语 + lebih sering + 动词。对比：中国多高铁地铁，这里多摩托。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah naik ojek? Bagaimana rasanya?", "zh": "你坐过摩托出租吗？感觉怎么样？", "a": "d7b79be9bcca", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["naik ojek", "坐摩托车出租"], ["Bagaimana", "怎么样"], ["rasanya", "感觉"]], "b": "ojek = n. 摩托车载客；rasanya = rasa + -nya", "g": "结构：Apakah + 主语 + pernah + 动词？Bagaimana rasanya? = 感觉怎样？"}}, {"sp": "参考回答", "role": "a", "id": "Pernah. Rasanya cepat dan murah, tetapi sedikit takut karena jalannya ramai.", "zh": "坐过。又快又便宜，但路上车多，有点害怕。", "a": "b6c369a5c3b7", "an": {"p": [["Pernah", "曾经"], ["Rasanya", "感觉"], ["cepat", "快"], ["dan", "并且"], ["murah", "便宜"], ["tetapi", "但是"], ["sedikit takut", "有点怕"], ["karena", "因为"], ["jalannya", "路上"], ["ramai", "车多"]], "b": "", "g": "结构：Rasanya + 形容词, tetapi + sedikit + 形容词 + karena + 原因。jalannya ramai = 路上车多人多。"}}], "zh": "", "note": "本单元生词：transportasi umum n. 公共交通 · kereta n. 火车 · kereta bawah tanah n. 地铁 · bus n. 公交车 · ojek n. 摩托出租 · becak n. 人力三轮车 · macet adj. 堵车 · tiket n. 票 · stasiun n. 车站 · aplikasi peta 地图软件 · sepeda motor n. 摩托车", "qa": [], "new": "2026-10-28", "u": 8}, {"id": "e171", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 9 单元 假期 Liburan", "lines": [{"sp": "考官", "role": "q", "id": "Ke mana kamu pergi pada liburan terakhir? Dengan siapa?", "zh": "你上次放假去了哪里？和谁一起？", "a": "50e8c5047ccb", "an": {"p": [["Ke mana", "去哪里"], ["kamu", "你"], ["pergi", "去"], ["pada liburan terakhir", "在上次假期"], ["Dengan siapa", "和谁"]], "b": "", "g": "结构：Ke mana + 主语 + pergi + 时间？Dengan siapa? = 和谁一起？"}}, {"sp": "参考回答", "role": "a", "id": "Pada liburan terakhir saya pergi ke Bali bersama teman-teman kantor.", "zh": "上次放假我和公司的同事去了巴厘岛。", "a": "c878a8efcc52", "an": {"p": [["Pada liburan terakhir", "在上次假期"], ["saya pergi", "我去"], ["ke Bali", "到巴厘"], ["bersama", "一起"], ["teman-teman kantor", "公司同事们"]], "b": "", "g": "结构：时间 + 主语 + pergi + ke + 地点 + bersama + 人。"}}, {"sp": "考官", "role": "q", "id": "Apa yang kamu siapkan sebelum pergi berlibur?", "zh": "去度假之前你会准备什么？", "a": "d8db862ae3aa", "an": {"p": [["Apa yang kamu siapkan", "你准备的是什么"], ["sebelum", "在……之前"], ["pergi berlibur", "去度假"]], "b": "", "g": "结构：Apa yang + 主语 + 动词原形 + sebelum + 动作？问“出发前准备什么”。"}}, {"sp": "参考回答", "role": "a", "id": "Sebelum berlibur, saya menyiapkan tiket, paspor, baju, dan obat.", "zh": "度假前我会准备好机票、护照、衣服和药。", "a": "e0f7b7738502", "an": {"p": [["Sebelum berlibur", "度假之前"], ["saya menyiapkan", "我准备"], ["tiket", "票"], ["paspor", "护照"], ["baju", "衣服"], ["dan", "和"], ["obat", "药"]], "b": "", "g": "结构：Sebelum + 动词, 主语 + 动词 + 并列宾语。"}}, {"sp": "考官", "role": "q", "id": "Kamu lebih suka berlibur ke pantai atau ke gunung? Mengapa?", "zh": "你更喜欢去海边还是去山里度假？为什么？", "a": "939b0f07095c", "an": {"p": [["Kamu", "你"], ["lebih suka", "更喜欢"], ["berlibur", "度假"], ["ke pantai", "去海边"], ["atau", "还是"], ["ke gunung", "去山里"], ["Mengapa", "为什么"]], "b": "", "g": "结构：主语 + lebih suka + 动词 + ke + A atau ke + B？"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka ke pantai, karena saya bisa berenang dan melihat matahari terbenam.", "zh": "我更喜欢海边，因为可以游泳、看日落。", "a": "73f217da4bcc", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["ke pantai", "去海边"], ["karena", "因为"], ["saya bisa", "我能"], ["berenang", "游泳"], ["dan", "并"], ["melihat", "看"], ["matahari terbenam", "日落"]], "b": "terbenam = ter- + benam（adj. 沉下的）", "g": "结构：主语 + lebih suka + ke + 地点, karena + 主语 + bisa + 动词 1 + dan + 动词 2。matahari terbenam = 日落。"}}, {"sp": "考官", "role": "q", "id": "Apa rencanamu untuk liburan akhir tahun ini?", "zh": "今年年底放假你有什么计划？", "a": "8ac035eb9dfa", "an": {"p": [["Apa", "什么"], ["rencanamu", "你的计划"], ["untuk", "对于"], ["liburan akhir tahun ini", "今年的年底假期"]], "b": "", "g": "结构：Apa + rencana-mu + untuk + 名词？"}}, {"sp": "参考回答", "role": "a", "id": "Akhir tahun ini saya berencana pulang ke Tiongkok untuk bertemu keluarga.", "zh": "今年年底我打算回中国看家人。", "a": "b3b8e1c0cca3", "an": {"p": [["Akhir tahun ini", "今年年底"], ["saya berencana", "我打算"], ["pulang ke Tiongkok", "回中国"], ["untuk", "为了"], ["bertemu keluarga", "见家人"]], "b": "berencana = ber- + rencana（vi. 打算）", "g": "结构：时间 + 主语 + berencana + 动词 + 地点 + untuk + 目的。berencana + 动词 = 计划做……。"}}, {"sp": "考官", "role": "q", "id": "Tempat wisata apa di negaramu yang kamu rekomendasikan? Mengapa?", "zh": "你会推荐你们国家的哪个景点？为什么？", "a": "595e14b3d56e", "an": {"p": [["Tempat wisata apa", "什么旅游景点"], ["di negaramu", "在你的国家"], ["yang kamu rekomendasikan", "你推荐的"], ["Mengapa", "为什么"]], "b": "", "g": "结构：名词 + apa + 地点 + yang + 主语 + 动词原形？"}}, {"sp": "参考回答", "role": "a", "id": "Saya merekomendasikan Xinjiang, karena pemandangannya indah dan makanannya enak.", "zh": "我推荐新疆，因为风景很美，吃的也好吃。", "a": "8967213af57b", "an": {"p": [["Saya", "我"], ["merekomendasikan", "推荐"], ["Xinjiang", "新疆"], ["karena", "因为"], ["pemandangannya", "风景"], ["indah", "美"], ["dan", "并且"], ["makanannya", "食物"], ["enak", "好吃"]], "b": "", "g": "结构：主语 + 动词 + 宾语, karena + 名词-nya + 形容词 + dan + 名词-nya + 形容词。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu lebih suka berlibur sendiri atau bersama keluarga? Mengapa?", "zh": "你更喜欢一个人度假还是和家人一起？为什么？", "a": "2ffa3216833b", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["lebih suka", "更喜欢"], ["berlibur", "度假"], ["sendiri", "独自"], ["atau", "还是"], ["bersama keluarga", "和家人"], ["Mengapa", "为什么"]], "b": "", "g": "结构：Apakah + 主语 + lebih suka + 动词 + A atau B？"}}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka berlibur bersama keluarga, karena kami bisa menghabiskan waktu bersama.", "zh": "我更喜欢和家人一起，因为可以一起度过时间。", "a": "dd1fee2c238c", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["berlibur", "度假"], ["bersama keluarga", "和家人一起"], ["karena", "因为"], ["kami bisa", "我们能"], ["menghabiskan waktu bersama", "一起度过时光"]], "b": "", "g": "结构：主语 + lebih suka + 动词短语, karena + 主语 + bisa + 动词短语。"}}], "zh": "", "note": "本单元生词：liburan n. 假期 · berlibur vi. 度假 · tempat wisata n. 景点 · pemandangan n. 风景 · pantai n. 海滩 · gunung n. 山 · paspor n. 护照 · oleh-oleh n. 伴手礼 · matahari terbenam 日落 · berencana vi. 计划", "qa": [], "new": "2026-10-28", "u": 9}, {"id": "e172", "kind": "exam", "book": "BIPA 2", "title": "BIPA 2 预测题 · 第 10 单元 健康 Kesehatan", "lines": [{"sp": "考官", "role": "q", "id": "Apa yang biasanya kamu lakukan kalau kepalamu pusing?", "zh": "你头晕的时候一般怎么办？", "a": "a814dd9330b0", "an": {"p": [["Apa yang", "什么"], ["biasanya", "通常"], ["kamu lakukan", "你做"], ["kalau", "如果"], ["kepalamu", "你的头"], ["pusing", "晕"]], "b": "kepalamu = kepala + -mu", "g": "结构：Apa yang + 副词 + 主语 + 动词原形 + kalau + 条件？"}}, {"sp": "参考回答", "role": "a", "id": "Kalau kepala saya pusing, saya beristirahat sebentar dan minum air putih.", "zh": "头晕的时候，我会休息一会儿，喝点白开水。", "a": "c3b5fca27b3c", "an": {"p": [["Kalau", "如果"], ["kepala saya", "我的头"], ["pusing", "晕"], ["saya beristirahat", "我休息"], ["sebentar", "一会儿"], ["dan", "并"], ["minum air putih", "喝白开水"]], "b": "", "g": "结构：Kalau + 名词 + 形容词, 主语 + 动词 + sebentar + dan + 动词。sebentar = 一会儿。"}}, {"sp": "考官", "role": "q", "id": "Kalau sakit, kamu lebih suka minum obat atau pergi ke dokter? Mengapa?", "zh": "生病的时候你更愿意吃药还是去看医生？为什么？", "a": "b4e265c8e3a9", "an": {"p": [["Kalau sakit", "如果生病"], ["kamu", "你"], ["lebih suka", "更喜欢"], ["minum obat", "吃药"], ["atau", "还是"], ["pergi ke dokter", "去看医生"], ["Mengapa", "为什么"]], "b": "", "g": "结构：Kalau + 形容词, 主语 + lebih suka + A atau B？"}}, {"sp": "参考回答", "role": "a", "id": "Kalau sakitnya ringan, saya minum obat saja. Kalau sakitnya berat, saya pergi ke dokter.", "zh": "小病我就吃药，病得重就去看医生。", "a": "de08e5adfbc3", "an": {"p": [["Kalau", "如果"], ["sakitnya", "病情"], ["ringan", "轻"], ["saya minum obat", "我吃药"], ["saja", "就"], ["berat", "重"], ["saya pergi ke dokter", "我去看医生"]], "b": "sakitnya = sakit + -nya（名词化：病）", "g": "结构：Kalau + 名词-nya + 形容词, 主语 + 动词。两个 Kalau 句并列对比：轻的……重的……。"}}, {"sp": "考官", "role": "q", "id": "Apa yang harus kita perhatikan sebelum minum obat?", "zh": "吃药之前要注意什么？", "a": "a636ee90e9c5", "an": {"p": [["Apa yang", "什么"], ["harus", "必须"], ["kita", "我们"], ["perhatikan", "注意"], ["sebelum", "在……之前"], ["minum obat", "吃药"]], "b": "", "g": "结构：Apa yang + harus + 主语 + 动词原形 + sebelum + 动作？问“吃药前要注意什么”。"}}, {"sp": "参考回答", "role": "a", "id": "Sebelum minum obat, kita harus membaca petunjuk pada kemasan, misalnya berapa kali sehari dan sebelum atau sesudah makan.", "zh": "吃药前要看包装上的说明，比如一天几次、饭前还是饭后。", "a": "974f922252ef", "an": {"p": [["Sebelum minum obat", "吃药之前"], ["kita harus", "我们必须"], ["membaca", "读"], ["petunjuk", "说明"], ["pada kemasan", "在包装上"], ["misalnya", "比如"], ["berapa kali sehari", "一天几次"], ["dan", "和"], ["sebelum atau sesudah makan", "饭前或饭后"]], "b": "sesudah = prep. 在……之后（= setelah）", "g": "结构：Sebelum + 动词, 主语 + harus + 动词 + 宾语 + 地点, misalnya + 举例。berapa kali sehari = 一天几次。"}}, {"sp": "考官", "role": "q", "id": "Apakah kamu pernah dirawat di rumah sakit?", "zh": "你住过院吗？", "a": "8c4c7c76bd8a", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["pernah", "曾经"], ["dirawat", "住院"], ["di rumah sakit", "在医院"]], "b": "dirawat = di- + rawat（被照护 → 住院）", "g": "结构：Apakah + 主语 + pernah + di-动词 + 地点？dirawat = 被治疗照护，即住院。"}}, {"sp": "参考回答", "role": "a", "id": "Belum pernah. Saya hanya pernah ke klinik karena demam.", "zh": "没住过。我只因为发烧去过诊所。", "a": "adc72d6959ee", "an": {"p": [["Belum pernah", "从未"], ["Saya", "我"], ["hanya", "只"], ["pernah", "曾"], ["ke klinik", "去诊所"], ["karena demam", "因为发烧"]], "b": "", "g": "结构：Belum pernah = 还从来没有。hanya pernah + 动词 = 只曾经……。"}}, {"sp": "考官", "role": "q", "id": "Bagaimana cara orang Tiongkok mengobati masuk angin?", "zh": "中国人着凉了一般怎么治？", "a": "c5accc4ea893", "an": {"p": [["Bagaimana cara", "……的办法是怎样"], ["orang Tiongkok", "中国人"], ["mengobati", "治疗"], ["masuk angin", "受凉感冒（风寒）"]], "b": "mengobati = meN- + obat + -i（vt. 治疗）", "g": "结构：Bagaimana cara + 人 + 动词 + 宾语？mengobati + 病 = 治疗……。masuk angin 是印尼语特有说法：身体不适、受寒。"}}, {"sp": "参考回答", "role": "a", "id": "Orang Tiongkok biasanya minum air jahe yang hangat dan tidur lebih awal.", "zh": "中国人一般喝热姜水，然后早点睡。", "a": "d00442f402d9", "an": {"p": [["Orang Tiongkok", "中国人"], ["biasanya", "通常"], ["minum", "喝"], ["air jahe", "姜水"], ["yang hangat", "温热的"], ["dan", "并"], ["tidur", "睡"], ["lebih awal", "更早"]], "b": "", "g": "结构：主语 + 副词 + 动词 + 宾语 + yang + 形容词 + dan + 动词 + 副词。"}}, {"sp": "考官", "role": "q", "id": "Menurutmu, mengapa orang sering sakit saat musim hujan?", "zh": "你觉得为什么雨季的时候人容易生病？", "a": "92a3d5f36f7c", "an": {"p": [["Menurutmu", "依你看"], ["mengapa", "为什么"], ["orang", "人们"], ["sering", "经常"], ["sakit", "生病"], ["saat musim hujan", "在雨季"]], "b": "musim = n. 季节", "g": "结构：Mengapa + 主语 + sering + 动词 + saat + 时间？saat musim hujan = 在雨季的时候。"}}, {"sp": "参考回答", "role": "a", "id": "Menurut saya, karena cuacanya dingin dan basah, jadi badan kita mudah lelah dan masuk angin.", "zh": "我觉得是因为天气又冷又湿，身体容易累、容易着凉。", "a": "4db0472a4ccb", "an": {"p": [["Menurut saya", "依我看"], ["karena", "因为"], ["cuacanya", "天气"], ["dingin", "冷"], ["dan", "并且"], ["basah", "潮湿"], ["jadi", "所以"], ["badan kita", "我们的身体"], ["mudah", "容易"], ["lelah", "累"], ["dan", "和"], ["masuk angin", "受凉"]], "b": "cuacanya = cuaca + -nya", "g": "结构：Menurut saya, karena + 名词 + 形容词 + dan + 形容词, jadi + 主语 + mudah + 动词。karena……jadi…… 并用：因为……所以……。"}}], "zh": "", "note": "本单元生词：sakit kepala 头疼 · pusing adj. 头晕 · demam n./vi. 发烧 · batuk n./vi. 咳嗽 · flu n. 感冒 · masuk angin 着凉 · obat n. 药 · apotek n. 药店 · klinik n. 诊所 · rumah sakit n. 医院 · dirawat v.被动 住院治疗 · petunjuk n. 说明 · kemasan n. 包装 · sembuh vi. 痊愈 · jahe n. 姜", "qa": [], "new": "2026-10-28", "u": 10}, {"id": "e173", "kind": "exam", "book": "模拟练习", "title": "新增 · 追问与口语对答（自我介绍相关）", "lines": [{"sp": "考官", "role": "q", "id": "Kapan biasanya kamu bermain bulu tangkis?", "zh": "你通常什么时候打羽毛球？", "a": "b82605dc558c", "an": {"p": [["Kapan", "什么时候"], ["biasanya", "通常"], ["kamu", "你"], ["bermain", "玩、打"], ["bulu tangkis", "羽毛球"]], "b": "bermain = ber- + main（vi. 玩 → 打球）；biasanya = biasa + -nya", "g": "结构：疑问词 + 副词 + 主语 + 动词 + 宾语？Kapan 问时间点，要答具体时间（pada akhir pekan 周末、pada malam hari 晚上）。bermain + 球类 = 打某种球。"}}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya bermain bulu tangkis pada akhir pekan.", "zh": "我通常周末打羽毛球。", "a": "a2224337c3f8", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["bermain", "打"], ["bulu tangkis", "羽毛球"], ["pada", "在"], ["akhir pekan", "周末"]], "b": "", "g": "结构：主语 + 频率副词 + 动词 + 宾语 + pada + 时间。pada + 时间词 = 在……（时候）。biasanya 放主语后，表示习惯。"}}, {"sp": "考官", "role": "q", "id": "Bersama siapa kamu bermain bulu tangkis?", "zh": "你和谁一起打羽毛球？", "a": "a9a2da7319cb", "an": {"p": [["Bersama siapa", "和谁一起"], ["kamu", "你"], ["bermain", "打"], ["bulu tangkis", "羽毛球"]], "b": "bersama = ber- + sama（adv. 一起）", "g": "结构：Bersama siapa + 主语 + 动词 + 宾语？bersama siapa 提到句首，是“和谁一起”。回答：bersama + 人 或 dengan + 人。"}}, {"sp": "参考回答", "role": "a", "id": "Saya bermain bersama teman-teman saya.", "zh": "我和朋友们一起打。", "a": "5baac5bfeb77", "an": {"p": [["Saya", "我"], ["bermain", "打（球）"], ["bersama", "一起"], ["teman-teman saya", "我的朋友们"]], "b": "", "g": "结构：主语 + 动词 + bersama + 人。teman-teman 是重叠，表示复数“朋友们”。bermain bersama = 一起玩／一起打球。"}}, {"sp": "考官", "role": "q", "id": "Sudah berapa lama kamu bermain bulu tangkis?", "zh": "你打羽毛球多久了？", "a": "177d0446b3e1", "an": {"p": [["Sudah", "已经"], ["berapa lama", "多久"], ["kamu", "你"], ["bermain", "打"], ["bulu tangkis", "羽毛球"]], "b": "", "g": "结构：Sudah berapa lama + 主语 + 动词？问“已经做了多久”。回答：Sudah + 动词 + selama + 时长。berapa lama = 多长时间。"}}, {"sp": "参考回答", "role": "a", "id": "Saya sudah bermain bulu tangkis selama dua tahun.", "zh": "我打羽毛球两年了。", "a": "baaaa7de7912", "an": {"p": [["Saya", "我"], ["sudah", "已经"], ["bermain", "打"], ["bulu tangkis", "羽毛球"], ["selama", "持续"], ["dua tahun", "两年"]], "b": "", "g": "结构：主语 + sudah + 动词 + 宾语 + selama + 时长。selama + 时间段 = 持续……（多久）。"}}, {"sp": "考官", "role": "q", "id": "Berapa usia adik laki-laki Anda?", "zh": "你弟弟多大？", "a": "e4b523170e72", "an": {"p": [["Berapa", "多少"], ["usia", "年龄"], ["adik laki-laki", "弟弟"], ["Anda", "您的"]], "b": "adik laki-laki = 弟弟（adik 弟妹 + laki-laki 男）", "g": "结构：Berapa + usia + 人？问年龄。usia = 年龄（书面），也可说 umur。adik laki-laki = 弟弟，adik perempuan = 妹妹。"}}, {"sp": "参考回答", "role": "a", "id": "Adik laki-laki saya berusia dua puluh delapan tahun.", "zh": "我弟弟二十八岁。", "a": "d418e3550d58", "an": {"p": [["Adik laki-laki saya", "我的弟弟"], ["berusia", "年龄是"], ["dua puluh delapan", "二十八"], ["tahun", "岁"]], "b": "berusia = ber- + usia（vi. 有……年龄）", "g": "结构：主语 + berusia + 数字 + tahun。berusia + 数字 + tahun = ……岁。dua puluh delapan = 20 + 8。"}}, {"sp": "考官", "role": "q", "id": "Pertama, bolehkah Anda menyebutkan nama lengkap Anda?", "zh": "首先，你可以说一下你的全名吗？", "a": "5c27a74a6218", "an": {"p": [["Pertama", "首先"], ["bolehkah", "可以……吗"], ["Anda", "您"], ["menyebutkan", "说出"], ["nama lengkap", "全名"], ["Anda", "您的"]], "b": "bolehkah = boleh + -kah（疑问）；menyebutkan = meN- + sebut + -kan（vt. 说出）；pertama = per- + tama", "g": "结构：顺序词 + bolehkah + 主语 + 动词 + 宾语？bolehkah……是礼貌的请求，“可以……吗？”。nama lengkap = 完整的名字（全名）。"}}, {"sp": "参考回答", "role": "a", "id": "Boleh. Nama lengkap saya 【……】.", "zh": "可以。我的全名是【……】。", "a": "1ef7ce8a6f0e", "an": {"p": [["Boleh", "可以"], ["Nama lengkap", "全名"], ["saya", "我的"]], "b": "", "g": "结构：Boleh（可以）+ 名词短语 + 名字。【……】换成你自己的全名。Nama lengkap saya + 名字 = 我的全名是……，不需要 adalah。"}}, {"sp": "考官", "role": "q", "id": "Dari mana asal Anda?", "zh": "你来自哪里？", "a": "4285ee178545", "an": {"p": [["Dari mana", "从哪里"], ["asal", "来源、籍贯"], ["Anda", "您的"]], "b": "asal = n. 起源、籍贯", "g": "结构：Dari mana + asal + 人？问“来自哪里”。Dari mana asal Anda? ≈ Anda berasal dari mana?"}}, {"sp": "参考回答", "role": "a", "id": "Saya berasal dari Beijing.", "zh": "我来自北京。", "a": "3989999e6d73", "an": {"p": [["Saya", "我"], ["berasal", "来自"], ["dari", "从"], ["Beijing", "北京"]], "b": "berasal = ber- + asal（vi. 来自）", "g": "结构：主语 + berasal dari + 地名。berasal dari = 来自、出生于。也可说 Asal saya dari Beijing。"}}, {"sp": "考官", "role": "q", "id": "Apa pekerjaan atau profesi Anda?", "zh": "你的工作或职业是什么？", "a": "cd58403370e2", "an": {"p": [["Apa", "什么"], ["pekerjaan", "工作"], ["atau", "或者"], ["profesi", "职业"], ["Anda", "您的"]], "b": "pekerjaan = pe- + kerja + -an（n. 工作）", "g": "结构：Apa + 名词（pekerjaan atau profesi）+ 人？atau 连接两个近义词，意思都是“职业”。回答：Saya bekerja sebagai……（我的职业是……）。"}}, {"sp": "参考回答", "role": "a", "id": "Saya bekerja sebagai karyawan di sebuah perusahaan.", "zh": "我在一家公司当职员。", "a": "231422390e7d", "an": {"p": [["Saya", "我"], ["bekerja", "工作"], ["sebagai", "作为"], ["karyawan", "职员"], ["di", "在"], ["sebuah", "一家"], ["perusahaan", "公司"]], "b": "bekerja = ber- + kerja（vi. 工作）；perusahaan = pe- + usaha + -an（n. 公司）；karyawan = kar- + yawan", "g": "结构：主语 + bekerja sebagai + 职业 + di + 单位。sebagai = 作为；sebuah + 名词 = 一个/一家。"}}, {"sp": "考官", "role": "q", "id": "Selanjutnya, apakah Anda punya saudara?", "zh": "接下来，你有兄弟姐妹吗？", "a": "694704f78837", "an": {"p": [["Selanjutnya", "接下来"], ["apakah", "是否"], ["Anda", "您"], ["punya", "有"], ["saudara", "兄弟姐妹"]], "b": "selanjutnya = se- + lanjut + -nya；saudara = n. 兄弟姐妹、亲属", "g": "结构：连接词 + apakah + 主语 + punya + 宾语？punya = 有（口语常用）。saudara 指兄弟姐妹。回答：Ya, saya punya…… / Tidak, saya anak tunggal。"}}, {"sp": "参考回答", "role": "a", "id": "Tidak, saya anak tunggal.", "zh": "没有，我是独生子女。", "a": "94bc342271fd", "an": {"p": [["Tidak", "不"], ["saya", "我"], ["anak", "孩子"], ["tunggal", "唯一的"]], "b": "", "g": "结构：Tidak, + 主语 + 名词短语。anak tunggal = 独生子（女）。tunggal = 单一、唯一。名词谓语不需要 adalah。"}}, {"sp": "考官", "role": "q", "id": "Buku apa yang biasanya Anda baca?", "zh": "你通常看什么书？", "a": "938b3aa15e8b", "an": {"p": [["Buku apa", "什么书"], ["yang", "……的"], ["biasanya", "通常"], ["Anda", "您"], ["baca", "读"]], "b": "baca = 动词原形（在 yang 从句里，主语是第二人称时动词原形不加 meN-）", "g": "结构：名词 + apa + yang + 副词 + 主语 + 动词原形？“Buku apa yang……” = 您通常看的是什么书。yang 从句里的动词原形（baca），不是 membaca。"}}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya membaca buku cerita.", "zh": "我通常看故事书。", "a": "429467e3d044", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["membaca", "读"], ["buku cerita", "故事书"]], "b": "membaca = meN- + baca（vt. 读）；cerita = n. 故事", "g": "结构：主语 + 副词 + 动词 + 宾语。buku cerita = 故事书；其他：buku sejarah 历史书、majalah 杂志、novel 小说。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-29", "hide": 1}, {"id": "t174", "kind": "trans", "book": "模拟练习", "title": "新增 · 互译补充 3 句", "lines": [{"sp": "", "role": "t", "id": "Dia tidak pergi ke sekolah karena sedang sakit.", "zh": "她没有去学校，因为她正在生病。", "a": "2184e20ff844", "za": "2bb134c39966", "an": {"p": [["Dia", "她"], ["tidak", "不"], ["pergi", "去"], ["ke sekolah", "到学校"], ["karena", "因为"], ["sedang", "正在"], ["sakit", "生病"]], "b": "", "g": "结构：主句（否定）+ karena + 从句。tidak pergi = 没去；sedang + 动词/形容词 = 正在……。karena 引出原因，放在后面。"}}, {"sp": "", "role": "t", "id": "Saya pergi ke sekolah setiap hari dengan sepeda.", "zh": "我每天骑自行车去学校。", "a": "3df10ee0b9cb", "za": "e08b5179e019", "an": {"p": [["Saya", "我"], ["pergi", "去"], ["ke sekolah", "到学校"], ["setiap hari", "每天"], ["dengan sepeda", "骑自行车"]], "b": "sepeda = n. 自行车", "g": "结构：主语 + pergi + ke + 地点 + 频率 + dengan + 交通工具。dengan + 交通工具 = 乘/骑……。骑车也可以说 bersepeda。"}}, {"sp": "", "role": "t", "id": "Setiap sore saya berjalan-jalan dengan ayah di sekitar rumah.", "zh": "每天下午我和爸爸在家附近散步。", "a": "faa647da811f", "za": "66822bcef3d5", "an": {"p": [["Setiap sore", "每天下午"], ["saya", "我"], ["berjalan-jalan", "散步"], ["dengan ayah", "和爸爸"], ["di sekitar rumah", "在家附近"]], "b": "berjalan-jalan = ber- + jalan 重叠（vi. 散步、逛）；sekitar = n. 周围", "g": "结构：时间 + 主语 + 动词 + dengan + 人 + 地点。di sekitar + 地点 = 在……附近。注意：sore 泛指“下午”，setiap sore = 每天下午。"}}], "zh": "", "note": "", "qa": [], "new": "2026-10-29", "hide": 1}, {"id": "ge0", "kind": "exam", "book": "武功秘籍", "title": "学印尼语 · 沟通 Belajar & Komunikasi", "lines": [{"sp": "考官", "role": "q", "id": "Apa yang Anda lakukan jika teman kerja Anda tidak mengerti perkataan Anda?", "zh": "如果同事听不懂你说的话，你会怎么做？", "a": "09b6c9694e4b", "za": "8ba47054d571", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya akan menjelaskan lagi dengan pelan-pelan, atau memakai aplikasi terjemahan.", "zh": "我会慢慢再解释一遍，或者用翻译软件。", "a": "3b7cdf39bf15", "za": "e94499c4e8d7"}, {"sp": "考官", "role": "q", "id": "Apa yang paling sulit ketika belajar bahasa Mandarin?", "zh": "学中文的时候什么最难？", "a": "ce01eacb2c4a", "za": "aabb124d9c5b", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Yang paling sulit adalah menulis huruf Mandarin.", "zh": "最难的是写汉字。", "a": "c8b6637d3c5d", "za": "b224746d5255"}, {"sp": "考官", "role": "q", "id": "Apa yang Anda lakukan untuk belajar bahasa Indonesia dengan lebih baik?", "zh": "为了把印尼语学得更好，你会做什么？", "a": "b5ee14bbb944", "za": "7cfc312f741d", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya sering berbicara dengan teman kerja orang Indonesia dan mendengarkan lagu Indonesia.", "zh": "我常和印尼同事说话，听印尼歌。", "a": "2a2008e635ce", "za": "caa2a704887d"}, {"sp": "考官", "role": "q", "id": "Saya belum paham, bisakah anda mengulangi penjelasannya?", "zh": "还不明白，你可以重复一遍说明吗？", "a": "221c9e3029e7", "an": {"p": [["Saya", "我"], ["belum", "尚未"], ["paham", "明白"], ["bisakah", "能不能"], ["anda", "您"], ["mengulangi", "重复"], ["penjelasannya", "它的说明"]], "b": "bisakah = bisa + -kah（疑问）；mengulangi = meN- + ulang + -i（vt. 重复）；penjelasan = pe- + jelas + -an（n. 说明）", "g": "结构：Saya belum paham, + bisakah + 主语 + 动词 + 宾语？-kah 加在助动词后，把句子变成礼貌的请求。belum paham = 还没听懂，是课堂常用句。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Baik, saya akan mengulanginya lagi.", "zh": "好的，我再重复一次。", "a": "3cc0bc7d7637", "an": {"p": [["Baik", "好的"], ["saya", "我"], ["akan", "将"], ["mengulanginya", "重复它"], ["lagi", "再"]], "b": "mengulanginya = meN- + ulang + -i + -nya（-nya = 它，指那段说明）", "g": "结构：Baik, 主语 + akan + 动词 + 宾语（-nya）+ lagi。-nya 作宾语，代替前面提到的 penjelasan。lagi = 再一次。"}}, {"sp": "考官", "role": "q", "id": "Kapan Anda mulai belajar bahasa Indonesia?", "zh": "你什么时候开始学印尼语的？", "a": "8a8515f3d096", "za": "6a09c2a76978", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya mulai belajar bahasa Indonesia dua bulan yang lalu.", "zh": "我两个月前开始学印尼语。", "a": "84dcdffb0f57", "za": "e34cdd9660fd"}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "ge1", "kind": "exam", "book": "武功秘籍", "title": "朋友 Teman", "lines": [{"sp": "考官", "role": "q", "id": "Apakah temanmu akan membantumu saat kamu kesulitan?", "zh": "遇到困难的时候，你的朋友会帮助你吗？", "a": "5ef7158e757b", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["akan", "会"], ["membantumu", "帮助你"], ["saat", "当……时"], ["kamu", "你"], ["kesulitan", "困难"]], "b": "temanmu = teman + -mu（你的）；membantumu = meN- + bantu + -mu（-mu = 你，作宾语）；kesulitan = ke- + sulit + -an（n. 困难）", "g": "结构：Apakah + 主语 + akan + 动词 + 宾语 + saat + 从句？-mu 是 kamu 的缩写后缀：名词后表“你的”，动词后表“你”。saat + 主语 + kesulitan = 在你遇到困难时。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ya, dia selalu bersedia membantu saya.", "zh": "会的，他总是愿意帮助我。", "a": "c027a1f6b63c", "an": {"p": [["Ya", "是的"], ["dia", "他"], ["selalu", "总是"], ["bersedia", "愿意"], ["membantu", "帮助"], ["saya", "我"]], "b": "bersedia = ber- + sedia（adj. 愿意）；membantu = meN- + bantu", "g": "结构：Ya, 主语 + selalu + bersedia + 动词 + 宾语。bersedia + 动词 = 愿意做某事。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu suka berkomunikasi dengan orang lain?", "zh": "你的朋友喜欢和别人交流吗？", "a": "511177347962", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["suka", "喜欢"], ["berkomunikasi", "交流"], ["dengan", "与"], ["orang lain", "别人"]], "b": "berkomunikasi = ber- + komunikasi（vi. 沟通）", "g": "结构：Apakah + 主语 + suka + 动词 + dengan + 对象？berkomunikasi dengan = 与……沟通。orang lain = 别人（其他的人）。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Dia ekstrovert, suka berbicara dengan semua orang.", "zh": "他很外向，喜欢和大家交流。", "a": "402560f9eb1c", "an": {"p": [["Dia", "他"], ["ekstrovert", "外向"], ["suka", "喜欢"], ["berbicara", "说话"], ["dengan", "和"], ["semua orang", "所有人"]], "b": "berbicara = ber- + bicara（vi. 说话）", "g": "结构：主语 + 形容词, suka + 动词 + dengan + 对象。逗号后面补充说明：外向的表现。ekstrovert 的反义词是 introvert 内向。"}}, {"sp": "考官", "role": "q", "id": "Apakah beban kerja temanmu berat?", "zh": "你的朋友工作压力大吗？", "a": "0f7430bc16a3", "an": {"p": [["Apakah", "是否"], ["beban kerja", "工作负担"], ["temanmu", "你的朋友"], ["berat", "重、大"]], "b": "beban = n. 负担；berat = adj. 重", "g": "结构：Apakah + 主语 + 形容词？beban kerja temanmu = 你朋友的工作负担。berat 本意“重”，这里引申为“压力大”。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Beban kerjanya agak berat, tapi dia tidak takut lelah.", "zh": "他的工作压力有点大，但是他不怕辛苦。", "a": "c43d4a82c310", "an": {"p": [["Beban kerjanya", "他的工作负担"], ["agak", "有点"], ["berat", "重"], ["tapi", "但是"], ["dia", "他"], ["tidak takut", "不怕"], ["lelah", "累"]], "b": "beban kerjanya = beban kerja + -nya", "g": "结构：主语 + agak + 形容词, tapi + 主语 + tidak + 动词 + 宾语。agak = 有点、稍微。tapi 是 tetapi 的口语形式。takut + 形容词 = 怕……（累）。"}}, {"sp": "考官", "role": "q", "id": "Apa yang paling kamu sukai dari temanmu?", "zh": "你最喜欢朋友身上哪一点？", "a": "86c28f135e71", "an": {"p": [["Apa", "什么"], ["yang", "……的"], ["paling", "最"], ["kamu", "你"], ["sukai", "喜欢"], ["dari", "从"], ["temanmu", "你的朋友"]], "b": "sukai = suka + -i（vt. 喜欢某物）", "g": "结构：Apa yang + paling + 主语 + 动词原形 + dari + 对象？“Apa yang + 主语 + 动词” = 什么是你……的。yang 从句里动词不加 meN-（kamu sukai）。dari temanmu = 在你朋友身上。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya paling suka dia jujur dan tepat waktu.", "zh": "我最喜欢他诚实、守时。", "a": "733f68033708", "an": {"p": [["Saya", "我"], ["paling", "最"], ["suka", "喜欢"], ["dia", "他"], ["jujur", "诚实"], ["dan", "和"], ["tepat waktu", "守时"]], "b": "tepat = adj. 准确；waktu = n. 时间", "g": "结构：主语 + paling suka + 从句（dia jujur dan tepat waktu）。suka 后面可以直接接一个小句：喜欢他诚实又守时。tepat waktu = 准时。"}}, {"sp": "考官", "role": "q", "id": "Bagaimana sifat temanmu?", "zh": "你的朋友性格怎么样？", "a": "6bbe8cf16a91", "an": {"p": [["Bagaimana", "怎么样"], ["sifat", "性格"], ["temanmu", "你的朋友"]], "b": "sifat = n. 性格", "g": "结构：Bagaimana + 名词？问“……怎么样”。sifat = 性格、特点。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Teman saya sabar dan suka membantu orang lain.", "zh": "我的朋友很耐心，乐于助人。", "a": "9730ec3e131a", "an": {"p": [["Teman saya", "我的朋友"], ["sabar", "有耐心"], ["dan", "和"], ["suka", "喜欢"], ["membantu", "帮助"], ["orang lain", "别人"]], "b": "membantu = meN- + bantu", "g": "结构：主语 + 形容词 + dan + suka + 动词 + 宾语。suka membantu = 乐于助人。形容词作谓语，不用 adalah。"}}, {"sp": "考官", "role": "q", "id": "Jam berapa temanmu biasanya mulai bekerja?", "zh": "你的朋友平时几点上班？", "a": "84b3ab3b8829", "an": {"p": [["Jam berapa", "几点"], ["temanmu", "你的朋友"], ["biasanya", "通常"], ["mulai", "开始"], ["bekerja", "工作"]], "b": "bekerja = ber- + kerja（vi. 工作）", "g": "结构：Jam berapa + 主语 + 副词 + mulai + 动词？问钟点用 Jam berapa / Pukul berapa。mulai + 动词 = 开始做某事。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Dia mulai bekerja jam delapan pagi setiap hari.", "zh": "他每天早上八点上班。", "a": "4461bd5d32c1", "an": {"p": [["Dia", "他"], ["mulai", "开始"], ["bekerja", "工作"], ["jam delapan", "八点"], ["pagi", "早上"], ["setiap hari", "每天"]], "b": "bekerja = ber- + kerja", "g": "结构：主语 + mulai + 动词 + jam + 数字 + 时段 + 频率。jam delapan pagi = 早上八点。setiap hari 放句尾表示每天。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu bekerja dengan teliti?", "zh": "你的朋友工作认真吗？", "a": "ba9e6f3aa1b0", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["bekerja", "工作"], ["dengan teliti", "认真地"]], "b": "teliti = adj. 仔细认真", "g": "结构：Apakah + 主语 + 动词 + dengan + 形容词？dengan + 形容词 = 副词，修饰方式：认真地。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ya, dia bekerja sangat teliti.", "zh": "是的，他做事非常认真。", "a": "8d9b2b7e8544", "an": {"p": [["Ya", "是的"], ["dia", "他"], ["bekerja", "工作"], ["sangat", "很"], ["teliti", "认真仔细"]], "b": "bekerja = ber- + kerja", "g": "结构：Ya, 主语 + 动词 + sangat + 形容词。bekerja teliti = 做事认真，副词可直接放在动词后。"}}, {"sp": "考官", "role": "q", "id": "Apa yang temanmu suka lakukan di waktu luang?", "zh": "你的朋友空闲的时候喜欢做什么？", "a": "112b6c16f9b3", "an": {"p": [["Apa", "什么"], ["yang", "……的"], ["temanmu", "你的朋友"], ["suka", "喜欢"], ["lakukan", "做"], ["di waktu luang", "在空闲时间"]], "b": "lakukan = laku + -kan（vt. 做、进行）", "g": "结构：Apa yang + 主语 + suka + 动词原形？“Apa yang + 主语 + suka lakukan” = 他喜欢做什么，yang 从句里动词不加 meN-。di waktu luang = 在空闲时间。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Di waktu luang dia suka membaca buku dan berolahraga.", "zh": "空闲时他喜欢看书和运动。", "a": "0e3edae4c68d", "an": {"p": [["Di waktu luang", "在空闲时间"], ["dia", "他"], ["suka", "喜欢"], ["membaca", "读"], ["buku", "书"], ["dan", "和"], ["berolahraga", "做运动"]], "b": "membaca = meN- + baca；berolahraga = ber- + olahraga（vi. 做运动）", "g": "结构：时间 + 主语 + suka + 动词 1 + 宾语 + dan + 动词 2。两个动作用 dan 并列。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu mudah marah?", "zh": "你的朋友容易生气吗？", "a": "32fe4e2f5ffd", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["mudah", "容易"], ["marah", "生气"]], "b": "", "g": "结构：Apakah + 主语 + mudah + 动词／形容词？mudah + 动词 = 容易做某事：mudah marah = 易怒。反义：sulit marah。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Tidak, sifatnya sangat lembut.", "zh": "不会，他性格很温和。", "a": "313d97bf28b4", "an": {"p": [["Tidak", "不"], ["sifatnya", "他的性格"], ["sangat", "很"], ["lembut", "温和"]], "b": "sifatnya = sifat + -nya", "g": "结构：Tidak, 主语（带 -nya）+ sangat + 形容词。lembut 可形容人温和，也可形容音乐柔和、布料柔软。"}}, {"sp": "考官", "role": "q", "id": "Apakah temanmu perlu bekerja di akhir pekan?", "zh": "你的朋友周末需要工作吗？", "a": "a9ff263ccef9", "an": {"p": [["Apakah", "是否"], ["temanmu", "你的朋友"], ["perlu", "需要"], ["bekerja", "工作"], ["di akhir pekan", "在周末"]], "b": "akhir pekan = 周的末尾", "g": "结构：Apakah + 主语 + perlu + 动词 + 时间？perlu + 动词 = 需要做某事。否定 tidak perlu = 不必。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Dia tidak perlu bekerja akhir pekan, bisa istirahat dengan baik.", "zh": "周末他不用上班，可以好好休息。", "a": "58fc3abe3b7b", "an": {"p": [["Dia", "他"], ["tidak perlu", "不必"], ["bekerja", "工作"], ["akhir pekan", "周末"], ["bisa", "可以"], ["istirahat", "休息"], ["dengan baik", "好好地"]], "b": "", "g": "结构：主语 + tidak perlu + 动词 + 时间, bisa + 动词 + dengan baik。akhir pekan 前可省略 di。dengan baik = 好好地。第二个分句省略主语 dia。"}}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "ge2", "kind": "exam", "book": "武功秘籍", "title": "家庭 Keluarga", "lines": [{"sp": "考官", "role": "q", "id": "Berapa umur ayah kamu?", "zh": "你爸爸多大年纪？", "a": "663af8b0533d", "za": "a272a05a1d6e", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Umur ayah saya lima puluh tahun.", "zh": "我爸爸五十岁。", "a": "ff7957947b53", "za": "3b8f185ea127"}, {"sp": "考官", " + -kan 变成及物：使出生，即“生孩子”。这是考官的玩笑题，答案要明确说不能。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Tidak, saya tidak bisa melahirkan.", "zh": "不，我不能生孩子。", "a": "b176de446e2d", "an": {"p": [["Tidak", "不"], ["saya", "我"], ["tidak bisa", "不能"], ["melahirkan", "生孩子"]], "b": "", "g": "结构：Tidak, 主语 + tidak bisa + 动词。回答里第一个 Tidak 是“不”，第二个 tidak 是否定助动词 bisa。"}}, {"sp": "考官", "role": "q", "id": "Biasanya di rumah kamu siapa yang masak?", "zh": "在家里一般是谁做饭？", "a": "7355cbbbfbec", "za": "6cf424b826b8", "an": {"p": [["Biasanya", "通常"], ["di rumah kamu", "在你家"], ["siapa", "谁"], ["yang masak", "做饭的"]], "b": "biasanya = biasa（adj. 通常）+ -nya", "g": "结构：Biasanya + 地点 + siapa yang + 动词？“siapa yang + 动词” = 谁……（问做动作的人），回答用 yang 强调：Ibu saya yang memasak。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Biasanya ibu saya yang memasak di rumah.", "zh": "一般是我妈妈在家做饭。", "a": "ec551636dafd", "an": {"p": [["Biasanya", "通常"], ["ibu saya", "我妈妈"], ["yang memasak", "是做饭的"], ["di rumah", "在家"]], "b": "memasak = meN- + masak", "g": "结构：Biasanya + 人 + yang + 动词 + 地点。“人 + yang + 动词” 是强调做动作的人：是妈妈在做饭（而不是别人）。"}}, {"sp": "考官", "role": "q", "id": "Berapa usia adik laki-laki Anda?", "zh": "你弟弟多大？", "a": "e4b523170e72", "an": {"p": [["Berapa", "多少"], ["usia", "年龄"], ["adik laki-laki", "弟弟"], ["Anda", "您的"]], "b": "adik laki-laki = 弟弟（adik 弟妹 + laki-laki 男）", "g": "结构：Berapa + usia + 人？问年龄。usia = 年龄（书面），也可说 umur。adik laki-laki = 弟弟，adik perempuan = 妹妹。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Adik laki-laki saya berusia dua puluh delapan tahun.", "zh": "我弟弟二十八岁。", "a": "d418e3550d58", "an": {"p": [["Adik laki-laki saya", "我的弟弟"], ["berusia", "年龄是"], ["dua puluh delapan", "二十八"], ["tahun", "岁"]], "b": "berusia = ber- + usia（vi. 有……年龄）", "g": "结构：主语 + berusia + 数字 + tahun。berusia + 数字 + tahun = ……岁。dua puluh delapan = 20 + 8。"}}, {"sp": "考官", "role": "q", "id": "Selanjutnya, apakah Anda punya saudara?", "zh": "接下来，你有兄弟姐妹吗？", "a": "694704f78837", "an": {"p": [["Selanjutnya", "接下来"], ["apakah", "是否"], ["Anda", "您"], ["punya", "有"], ["saudara", "兄弟姐妹"]], "b": "selanjutnya = se- + lanjut + -nya；saudara = n. 兄弟姐妹、亲属", "g": "结构：连接词 + apakah + 主语 + punya + 宾语？punya = 有（口语常用）。saudara 指兄弟姐妹。回答：Ya, saya punya…… / Tidak, saya anak tunggal。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Tidak, saya anak tunggal.", "zh": "没有，我是独生子女。", "a": "94bc342271fd", "an": {"p": [["Tidak", "不"], ["saya", "我"], ["anak", "孩子"], ["tunggal", "唯一的"]], "b": "", "g": "结构：Tidak, + 主语 + 名词短语。anak tunggal = 独生子（女）。tunggal = 单一、唯一。名词谓语不需要 adalah。"}}, {"sp": "考官", "role": "q", "id": "Kamu punya berapa saudara? / Kamu ada berapa saudara?", "zh": "你有几个兄弟姐妹？", "a": "399818ce32bc", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya punya dua saudara, satu adik perempuan dan satu adik laki-laki.", "zh": "我有两个兄弟姐妹，一个妹妹和一个弟弟。", "a": "67c223b371c7", "za": "6e7d1c210123"}, {"sp": "考官", "role": "q", "id": "Di mana keluarga kamu tinggal sekarang?", "zh": "你的家人现在住在哪里？", "a": "c28d84486367", "za": "48ef649dc01f", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Sekarang keluarga saya tinggal di 【……】, Tiongkok.", "zh": "我家人现在住在中国【……】。", "a": "3a2396ea632c"}, {"sp": "考官", "role": "q", "id": "Apa pekerjaan ibu kamu?", "zh": "你妈妈做什么工作？", "a": "2461b5e30615", "za": "405a3e7faec2", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Ibu saya seorang guru.", "zh": "我妈妈是老师。", "a": "db1eebda717d", "za": "5485ffa8bd9a"}, {"sp": "考官", "role": "q", "id": "Di mana ayah kamu bekerja?", "zh": "你爸爸在哪里工作？", "a": "bf042e32ee7a", "za": "194a924115de", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Ayah saya bekerja di sebuah pabrik di 【……】.", "zh": "我爸爸在【……】的一家工厂工作。", "a": "2b9601fe0291"}, {"sp": "考官", "role": "q", "id": "Apakah Anda sudah menikah?", "zh": "你结婚了吗？", "a": "682bacdb4ebe", "za": "8ea384afa0f6", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Belum, saya belum menikah. / Sudah, saya sudah menikah.", "zh": "还没有。/ 已经结婚了。", "a": "5b0feba4ce8f"}, {"sp": "考官", "role": "q", "id": "Siapa nama ayah kamu?", "zh": "你爸爸叫什么名字？", "a": "d27ef6e56be1", "za": " , ["favorit", "最爱"], ["saya", "我"], ["adalah", "是"], ["nasi goreng", "炒饭"]], "b": "makanan = makan + -an", "g": "结构：主语（Makanan favorit saya）+ adalah + 名词。adalah 连接两个名词。其他答案可换成 mi goreng 炒面、bakso 肉丸、tahu goreng 炸豆腐。"}}, {"sp": "考官", "role": "q", "id": "Anda lebih suka makan di rumah atau di restoran?", "zh": "你更喜欢在家吃还是在餐厅吃？", "a": "2601a87ac397", "za": "b426ae8dce01", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka makan di rumah karena lebih sehat dan murah.", "zh": "我更喜欢在家吃，因为更健康也更便宜。", "a": "db7b870a1a6a", "za": "4b06f15e3c25"}, {"sp": "考官", "role": "q", "id": "Anda biasanya minum teh atau kopi di pagi hari?", "zh": "你早上通常喝茶还是咖啡？", "a": "3143cd253302", "za": "c3767d0076b6", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya minum kopi di pagi hari.", "zh": "我早上通常喝咖啡。", "a": "805c8b9b9c5d", "za": "e67ce61d1829"}, {"sp": "考官", "role": "q", "id": "Apakah anda bisa memasak?", "zh": "你会做饭吗？", "a": "82212ebf2cbd", "an": {"p": [["Apakah", "是否（疑问词）"], ["anda", "您"], ["bisa", "会、能"], ["memasak", "做饭"]], "b": "memasak = meN- + masak（vi. 煮、做饭）", "g": "结构：Apakah + 主语 + bisa + 动词？Apakah 放句首把陈述句变成是非问句，答“Ya / Tidak”。bisa = 能、会（有能力）。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ya, saya bisa memasak. Tidak, saya tidak bisa memasak.", "zh": "是的，我会做饭。/ 不，我不会做饭。", "a": "d41e5be747fb", "an": {"p": [["Ya", "是"], ["saya", "我"], ["bisa", "会"], ["memasak", "做饭"], ["Tidak", "不"], ["tidak bisa", "不会"]], "b": "memasak = meN- + masak", "g": "结构：两种答法：肯定 Ya, 主语 + bisa + 动词；否定 Tidak, 主语 + tidak bisa + 动词。否定动词、助动词用 tidak。"}}, {"sp": "考官", "role": "q", "id": "Apa makanan kesukaan atau favorit anda?", "zh": "你最喜欢什么食物？（炒饭、炒面、肉丸、炸豆腐）", "a": "340b549c901b", "an": {"p": [["Apa", "什么"], ["makanan", "食物"], ["kesukaan", "喜好"], ["atau", "或"], ["favorit", "最爱"], ["anda", "您"]], "b": "makanan = makan + -an（n. 食物）；kesukaan = ke- + suka + -an（n. 喜好）", "g": "结构：Apa + 名词 + 修饰词 + anda？kesukaan 和 favorit 同义，二选一说明。makanan kesukaan = 喜爱的食物。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Makanan favorit saya adalah nasi goreng.", "zh": "我最喜欢的食物是炒饭。", "a": "ade6c3c3055a", "za": "896fd2ba8348", "an": {"p": [["Makanan", "食物"], ["favorit", "最爱"], ["saya", "我"], ["adalah", "是"], ["nasi goreng", "炒饭"]], "b": "makanan = makan + -an", "g": "结构：主语（Makanan favorit saya）+ adalah + 名词。adalah 连接两个名词。其他答案可换成 mi goreng 炒面、bakso 肉丸、tahu goreng 炸豆腐。"}}, {"sp": "考官", "role": "q", "id": "Anda lebih suka makan di restoran atau di kantin?", "zh": "你更喜欢在餐厅吃饭还是食堂？", "a": "00351084407a", "an": {"p": [["Anda", "您"], ["lebih", "更"], ["suka", "喜欢"], ["makan", "吃"], ["di restoran", "在餐厅"], ["atau", "还是"], ["di kantin", "在食堂"]], "b": "", "g": "结构：主语 + lebih + 动词 + A atau B？lebih suka = 更喜欢（比较），atau 在问句里表示“还是”，让对方二选一。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya lebih suka makan di kantin, harganya lebih murah.", "zh": "我更喜欢在食堂吃，价格更便宜。", "a": "aeb821233518", "an": {"p": [["Saya", "我"], ["lebih suka", "更喜欢"], ["makan", "吃"], ["di kantin", "在食堂"], ["harganya", "它的价格"], ["lebih murah", "更便宜"]], "b": "harganya = harga（n. 价格）+ -nya", "g": "结构：主语 + lebih suka + 动词 + 地点, 原因（harganya lebih murah）。第二个分句直接说明理由，不用 karena。-nya 指“食堂的”。"}}, {"sp": "考官", "role": "q", "id": "Anda biasanya minum teh atau kopi?", "zh": "你平时喝茶还是咖啡？", "a": "a9760c70a792", "an": {"p": [["Anda", "您"], ["biasanya", "通常"], ["minum", "喝"], ["teh", "茶"], ["atau", "还是"], ["kopi", "咖啡"]], "b": "", "g": "结构：主语 + biasanya + 动词 + A atau B？二选一问句，也可以不加 Apakah，靠语调表示疑问。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya minum teh.", "zh": "我平时喝茶。", "a": "8945f66dd75f", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["minum", "喝"], ["teh", "茶"]], "b": "", "g": "结构：主语 + biasanya + 动词 + 宾语。选一个回答即可。"}}, {"sp": "考官", "role": "q", "id": "Makanan kesukaan kamu apa?", "zh": "你最喜欢的食物是什么？", "a": "879597755ead", "za": "23ef6273b2dd", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Makanan kesukaan saya nasi goreng.", "zh": "我最喜欢的食物是炒饭。", "a": "9203f37d6e7b", "za": "896fd2ba8348"}, {"sp": "考官", "role": "q", "id": "Apa makanan f "zh": "我家的墙是白色的。", "a": "eba46d037549", "za": "c426f66d54c5"}, {"sp": "考官", "role": "q", "id": "Apakah ada taman di dekat rumah Anda?", "zh": "你家附近有公园/花园吗？", "a": "e6d999df1bc0", "za": "87373ab6cec9", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Ada, ada taman kecil di dekat rumah saya.", "zh": "有，我家附近有一个小公园。", "a": "7328d0856dd0", "za": "ca39bdadcd78"}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "ge6", "kind": "exam", "book": "武功秘籍", "title": "爱好与休闲 Hobi & Waktu Luang", "lines": [{"sp": "考官", "role": "q", "id": "Kamu bilang hobi kamu main bulu tangkis. Biasanya kamu main di mana?", "zh": "你说你的爱好是打羽毛球，你通常在哪里打？", "a": "f5c964d1b768", "za": "34ae5f87c88b", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya main bulu tangkis di lapangan dekat mes.", "zh": "我通常在宿舍附近的球场打。", "a": "aca7ab9609d4", "za": "4ef6477a7cf7"}, {"sp": "考官", "role": "q", "id": "Jika cuaca bagus, apa yang ingin Anda lakukan?", "zh": "如果天气好，你想做什么？", "a": "d60ff985d832", "za": "0b1e3f76019f", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Jika cuaca bagus, saya ingin jalan-jalan ke pantai.", "zh": "如果天气好，我想去海边走走。", "a": "2534e1df2da1", "za": "492117c0b18a"}, {"sp": "考官", "role": "q", "id": "Apa yang biasanya Anda bicarakan dengan teman?", "zh": "你平时和朋友聊什么？", "a": "189db99ca7bf", "za": "8d7d7228769d", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya bicara tentang pekerjaan dan makanan dengan teman.", "zh": "我平时和朋友聊工作和吃的。", "a": "5eaf2776b22e", "za": "3999e11af55a"}, {"sp": "考官", "role": "q", "id": "Apakah kamu punya hobi lain?", "zh": "你还有别的爱好吗？", "a": "423462ffc935", "za": "4ba1b8912d6a", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ada. Selain itu, saya juga suka mendengarkan musik.", "zh": "有。除此之外，我还喜欢听音乐。", "a": "16f88c0cea96", "za": "86106e5a3ac2"}, {"sp": "考官", "role": "q", "id": "Bisakah Anda menyebutkan satu hobi Anda?", "zh": "你能说一个你的爱好吗？", "a": "aa738473e629", "za": "04843a03b6ec", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Salah satu hobi saya adalah main bulu tangkis.", "zh": "我的爱好之一是打羽毛球。", "a": "06617ec11f91", "za": "a782f25c33ae"}, {"sp": "考官", "role": "q", "id": "Apakah Anda suka menonton televisi? Acara apa yang Anda suka?", "zh": "你喜欢看电视吗？喜欢什么节目？", "a": "7471d804d111", "za": "41b0977e6cf8", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka menonton televisi. Saya suka menonton berita dan film.", "zh": "喜欢，我喜欢看新闻和电影。", "a": "6c7143fcb25b", "za": "b0e671b3b724"}, {"sp": "考官", "role": "q", "id": "Dengan siapa biasanya anda menghabiskan waktu luang?", "zh": "你空闲时间通常和谁一起度过？", "a": "725577f9618c", "an": {"p": [["Dengan siapa", "和谁"], ["biasanya", "通常"], ["anda", "您"], ["menghabiskan", "度过、花掉"], ["waktu luang", "空闲时间"]], "b": "menghabiskan = meN- + habis + -kan（vt. 使用完 → 度过）；luang = adj. 空闲", "g": "结构：Dengan siapa + 副词 + 主语 + 动词 + 宾语？疑问短语 dengan siapa 提到句首。waktu luang = 空闲时间。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya menghabiskan waktu luang bersama teman saya.", "zh": "我空闲时间一般和我的朋友一起度过。", "a": "cdd1fcf7ffa0", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["menghabiskan", "度过"], ["waktu luang", "空闲时间"], ["bersama", "一起"], ["teman saya", "我的朋友"]], "b": "bersama = ber- + sama（adv. 一起）", "g": "结构：主语 + 副词 + 动词 + 宾语 + bersama + 人。bersama + 人 = 和某人一起，与 dengan 同义但更书面。"}}, {"sp": "考官", "role": "q", "id": "Apakah anda suka mendengarkan musik? Musik Tiongkok apa?", "zh": "你喜欢听音乐吗？喜欢什么中文音乐？", "a": "9918f642b18c", "an": {"p": [["Apakah", "是否"], ["anda", "您"], ["suka", "喜欢"], ["mendengarkan", "听"], ["musik", "音乐"], ["Tiongkok", "中国"], ["apa", "什么"]], "b": "mendengarkan = meN- + dengar + -kan（vt. 认真听）", "g": "结构：两个问题。第一问：Apakah + 主语 + suka + 动词 + 宾语？第二问：Musik + 国家 + apa? = 什么（国家的）音乐，apa 放在被问名词后。mendengarkan 指“听某物”，dengar 只是“听见”。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka mendengarkan musik. Saya suka lagu Mandarin yang lembut.", "zh": "是的，我喜欢听音乐。我喜欢柔和的中文歌。", "a": "7490839572ce", "an": {"p": [["Ya", "是"], ["saya", "我"], ["suka", "喜欢"], ["mendengarkan", "听"], ["musik", "音乐"], ["lagu", "歌"], ["Mandarin", "普通话"], ["yang lembut", "柔和的"]], "b": "mendengarkan = meN- + dengar + -kan；lembut = adj. 柔和", "g": "结构：Ya, 主语 + suka + 动词 + 宾语。第二句：主语 + suka + 名词 + yang + 形容词。yang lembut 修饰 lagu Mandarin，意为“柔和的中文歌”。"}}, {"sp": "考官", "role": "q", "id": "Kapan biasanya kamu bermain bulu tangkis?", "zh": "你通常什么时候打羽毛球？", "a": "b82605dc558c", "an": {"p": [["Kapan", "什么时候"], ["biasanya", "通常"], ["kamu", "你"], ["bermain", "玩、打"], ["bulu tangkis", "羽毛球"]], "b": "bermain = ber- + main（vi. 玩 → 打球）；biasanya = biasa + -nya", "g": "结构：疑问词 + 副词 + 主语 + 动词 + 宾语？Kapan 问时间点，要答具体时间（pada akhir pekan 周末、pada malam hari 晚上）。bermain + 球类 = 打某种球。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya bermain bulu tangkis pada akhir pekan.", "zh": "我通常周末打羽毛球。", "a": "a2224337c3f8", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["bermain", "打"], ["bulu tangkis", "羽毛球"], ["pada", "在"], ["akhir pekan", "周末"]], "b": "", "g": "结构：主语 + 频率副词 + 动词 + 宾语 + pada + 时间。pada + 时间词 = 在……（时候）。biasanya 放主语后，表示习惯。"}}, {"sp": "考官", "role": "q", "id": "Bersama siapa kamu bermain bulu tangkis?", "zh": "你和谁一起打羽毛球？", "a": "a9a2da7319cb", "an": {"p": [["Bersama siapa", "和谁一起"], ["kamu", "你"], ["bermain", "打"], ["bulu tangkis", "羽毛球"]], "b": "bersama = ber- + sama（adv. 一起）", "g": "结构：Bersama siapa + 主语 + 动词 + 宾语？bersama siapa 提到句首，是“和谁一起”。回答：bersama + 人 或 dengan + 人。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya bermain bersama teman-teman saya.", "zh": "我和朋友们一起打。", "a": "5baac5bfeb77", "an": {"p": [["Saya", "我"], ["bermain", "打（球）"], ["bersama", "一起"], ["teman-teman saya", "我的朋友们"]], "b": "", "g": "结构：主语 + 动词 + bersama + 人。teman-teman 是重叠，表示复数“朋友们”。bermain bersama = 一起玩／一起打球。"}}, {"sp": "考官", "role": "q", "id": "Sudah berapa lama kamu bermain bulu tangkis?", "zh": "你打羽毛球多久了？", "a": "177d0446b3e1", "an": {"p": [["Sudah", "已经"], ["berapa lama", "多久"], ["kamu", "你"], ["bermain", "打"], ["bulu tangkis", "羽毛球"]], "b": "", "g": "结构：Sudah berapa lama + 主语 + 动词？问“已经做了多久”。回答：Sudah + 动词 + selama + 时长。berapa lama = 多长时间。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya sudah bermain bulu tangkis selama dua tahun.", "zh": "我打羽毛球两年了。", "a": "baaaa7de7912", "an": {"p": [["Saya", "我"], ["sudah", "已经"], ["bermain", "打"], ["bulu tangkis", "羽毛球"], ["selama", "持续"], ["dua tahun", "两年"]], "b": "", "g": "结构：主语 + sudah + 动词 + 宾语 + selama + 时长。selama + 时间段 = 持续……（多久）。"}}, {"sp": "考官", "role": "q", "id": "Buku apa yang biasanya Anda baca?", "zh": "你通常看什么书？", "a": "938b3aa15e8b", "an": {"p": [["Buku apa", "什么书"], ["yang", "……的"], ["biasanya", "通常"], ["Anda", "您"], ["baca", "读"]], "b": "baca = 动词原形（在 yang 从句里，主语是第二人称时动词原形不加 meN-）", "g": "结构：名词 + apa + yang + 副词 + 主语 + 动词原形？“Buku apa yang……” = 您通常看的是什么书。yang 从句里的动词原形（baca），不是 membaca。"}, "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya membaca buku cerita.", "zh": "我通常看故事书。", "a": "429467e3d044", "an": {"p": [["Saya", "我"], ["biasanya", "通常"], ["membaca", "读"], ["buku cerita", "故事书"]], "b": "membaca = meN- + baca（vt. 读）；cerita = n. 故事", "g": "结构：主语 + 副词 + 动词 + 宾语。buku cerita = 故事书；其他：buku sejarah 历史书、majalah 杂志、novel 小说。"}}, {"sp": "考官", "role": "q", "id": "Buku apa yang sering kamu baca? / Hobi kamu membaca? Kamu suka membaca buku apa?", "zh": "你常看什么书？/ 你爱读书吗？喜欢读什么书？", "a": "cd8c2856da66", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya sering membaca buku cerita, misalnya 《小王子》.", "zh": "我常读故事书，比如《小王子》（书名可以直接说中文）。", "a": "1591ac0181e0", "za": "1de265334301"}, {"sp": "考官", "role": "q", "id": "Selain nge-gym / tidur, kamu ada hobi yang lain?", "zh": "除了健身/睡觉，你还有别的爱好吗？", "a": "b75e254342ba", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Ada. Selain itu, saya juga suka memasak dan mendengarkan musik.", "zh": "有。除此之外，我还喜欢做饭和听音乐。", "a": "7929004afb2b", "za": "64a9f76d59a9"}, {"sp": "考官", "role": "q", "id": "Biasa di mana kamu main bulutangkis? / Kamu melakukan hobi kamu di mana?", "zh": "你通常在哪里打羽毛球 / 做你的爱好？", "a": "596d8c6a01ec", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya main bulutangkis di lapangan dekat kantor.", "zh": "我通常在公司附近的球场打。", "a": "2138b12618f0", "za": "c5576c2bb35d"}, {"sp": "考官", "role": "q", "id": "Apakah kamu suka pergi ke konser musik?", "zh": "你喜欢去音乐会吗？", "a": "e38351196602", "za": "800af2600305", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Suka, tapi saya jarang pergi karena sibuk.", "zh": "喜欢，但因为忙很少去。", "a": "204fcf020088", "za": "2ab05d5d27e2"}, {"sp": "考官", "role": "q", "id": "Kapan kamu biasanya membaca buku?", "zh": "你通常什么时候读书？", "a": "2d9759f3fce4", "za": "75d807e7586f", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya membaca buku pada malam hari sebelum tidur.", "zh": "我通常晚上睡前读书。", "a": "c23e0cece549", "za": "43599850ddc1"}, {"sp": "考官", "role": "q", "id": "Kamu main bulutangkis sudah berapa lama?", "zh": "你打羽毛球多久了？", "a": "fb3eb0875070", "za": "60265588ad66", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya sudah main bulutangkis selama lima tahun.", "zh": "我打羽毛球五年了。", "a": "34713bab8725", "za": "d744860bcaaf"}, {"sp": "考官", "role": "q", "id": "Sebutkan salah satu hobi kamu!", "zh": "说出你的一个爱好！", "a": "815a1febcc32", "za": "3f3f3b2d3170", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Salah satu hobi saya adalah berenang.", "zh": "我的爱好之一是游泳。", "a": "cb8bb4d915c2", "za": "0be849f6aa2d"}, {"sp": "考官", "role": "q", "id": "Apakah kamu suka menonton televisi? Kamu biasanya menonton acara apa?", "zh": "你喜欢看电视吗？通常看什么节目？", "a": "de77a89e48bd", "za": "2ec742c09e98", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Suka, saya biasanya menonton berita dan film.", "zh": "喜欢，我通常看新闻和电影。", "a": "c2adbdd531cf", "za": "f22b2dce3514"}, {"sp": "考官", "role": "q", "id": "Apa hobi Anda?", "zh": "你的爱好是什么？", "a": "f4a8b1f70c4a", "za": "1d48b35bb7ac", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Hobi saya membaca buku dan berenang.", "zh": "我的爱好是看书和游泳。", "a": "bd53c52c6b3e", "za": "f19f40a4f941"}, {"sp": "考官", "role": "q", "id": "Di mana biasanya Anda melakukan hobi Anda?", "zh": "你通常在哪里做你的爱好？", "a": "bc4d2230db65", "za": "9eec105c3723", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Biasanya saya membaca di kamar dan berenang di kolam renang.", "zh": "我通常在房间看书，在游泳池游泳。", "a": "c8806f1053e6", "za": "4a06d35727ea"}, {"sp": "考官", "role": "q", "id": "Hobi Anda membaca? Anda suka membaca buku apa?", "zh": "你爱读书吗？喜欢读什么书？", "a": "e5d878da8359", "za": "9b665ecf7cf2", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Ya, saya suka membaca buku cerita.", "zh": "是的，我喜欢读故事书。", "a": "27455d7adbb2", "za": "c2ce7e243387"}, {"sp": "考官", "role": "q", "id": "Dengan siapa Anda biasanya menghabiskan waktu luang?", "zh": "你通常和谁一起度过空闲时间？", "a": "0b0e51ec1a7f", "za": "8ac087bbd129", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Saya biasanya menghabiskan waktu luang bersama teman-teman.", "zh": "我通常和朋友们一起度过空闲时间。", "a": "fcdccaea95a8", "za": "a839f5795fad"}, {"sp": "考官", "role": "q", "id": "Apakah Anda suka mendengarkan musik?", "zh": "你喜欢听音乐吗？", "a": "2bf91d37786e", "za": "b245014f448a", "zt": 0}, {"sp": "参考回答", "role": "a", "id": "Suka, saya suka mendengarkan musik pop.", "zh": "喜欢，我喜欢听流行音乐。", "a": "f8041aaeb87c", "za": "c854ae601d6a"}], "zh": "", "note": "", "qa": [], "topic": 1}, {"id": "ge7", "kind": "exam", "book": "武功秘籍", "title": "作息与计划 Rutinitas & Rencana", "lines": [{"sp": "考官", "role": "q", "id": "Apa rencana Anda untuk akhir pekan ini?", "zh": "你这周末有什么计划？", "a": "c34eace7ed0f", "za": "159457cac69f", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Akhir pekan ini saya mau istirahat di mes dan mencuci baju.", "zh": "这周末我想在宿舍休息、洗衣服。", "a": "00338231d99e", "za": "927c25375ec5"}, {"sp": "考官", "role": "q", "id": "Apakah Anda akan pergi liburan bulan depan?", "zh": "你下个月要去度假吗？", "a": "3079bb4709ab", "za": "97e65dd266cc", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ya, saya akan pulang ke Tiongkok bulan depan.", "zh": "会，我下个月回中国。", "a": "7732ae22a082", "za": "d83c6d4467b0"}, {"sp": "考官", "role": "q", "id": "Kapan ulang tahun Anda?", "zh": "你的生日是什么时候？", "a": "618b615d41b5", "za": "add481705718", "zt": 1}, {"sp": "参考回答", "role": "a", "id": "Ulang tahun saya
