？", "a": "32a6e0d4270b", "za": "0ae656161d48", "an": {"p": [["Apakah", "是否"], ["naik kereta", "坐火车"], ["lebih cepat", "更快"], ["daripada", "比"], ["naik bus", "坐公交"]], "b": "daripada = prep. 比", "g": "结构：A + lebih + 形容词 + daripada + B = A 比 B 更……。比较句：daripada 引出比较对象。"}}, {"sp": "Putu", "role": "d", "id": "Iya. Dari stasiun kereta aku berjalan kaki ke tempat konsernya.", "zh": "快。我从火车站走到音乐会现场。", "a": "078b281e7498", "za": "7cd786010515", "an": {"p": [["Iya", "是的"], ["Dari", "从"], ["stasiun kereta", "火车站"], ["aku", "我"], ["berjalan kaki", "步行"], ["ke", "到"], ["tempat konsernya", "音乐会场地"]], "b": "berjalan = ber- + jalan（vi. 走路）", "g": "结构：Dari + 起点 + 主语 + 动词 + ke + 终点。berjalan kaki = 走路（用脚走）。tempat konsernya = 音乐会的地点。"}}, {"sp": "Lala", "role": "d", "id": "Hem, semoga lain kali aku bisa ikut menonton.", "zh": "嗯，希望下次我也能去看。", "a": "940a305e2bd8", "za": "180024c7abb1", "an": {"p": [["Hem", "嗯"], ["semoga", "希望"], ["lain kali", "下次"], ["aku", "我"], ["bisa", "能"], ["ikut", "一起"], ["menonton", "观看"]], "b": "semoga = se- + moga（愿）", "g": "结构：Semoga + 主语 + 动词。lain kali = 下一次。ikut + 动词 = 一同做……。"}}], "zh": "", "note": "", "qa": [], "u": 8}, {"id": "d39", "kind": "dlg", "book": "BIPA 2", "title": "坐地铁（对话 8.1）", "lines": [{"sp": "Agung", "role": "d", "id": "Pagi, Ti. Kemarin kamu berjalan-jalan ke Istora Senayan, ya?", "zh": "早，Risti。你昨天去塞纳扬体育馆了吧？", "a": "b110a1b303bd", "za": "c1f73eea234a", "an": {"p": [["Pagi", "早"], ["Ti", "蒂"], ["Kemarin", "昨天"], ["kamu", "你"], ["berjalan-jalan", "去逛"], ["ke", "到"], ["Istora Senayan", "塞纳扬体育场"], ["ya", "对吧"]], "b": "", "g": "结构：问候 + 时间 + 主语 + 动词 + 地点, ya? berjalan-jalan = 逛、游玩（重叠）。"}}, {"sp": "Risti", "role": "d", "id": "Selamat pagi, Gung. Iya, kemarin aku nonton pertandingan tenis di sana.", "zh": "早上好，Agung。对，昨天我在那儿看网球比赛。", "a": "3601020d6235", "za": "fea532c4e33c", "an": {"p": [["Selamat pagi", "早上好"], ["Gung", "贡"], ["Iya", "是的"], ["kemarin", "昨天"], ["aku", "我"], ["nonton", "看"], ["pertandingan tenis", "网球比赛"], ["di sana", "在那里"]], "b": "nonton = menonton 的口语；pertandingan = per- + tanding + -an（n. 比赛）", "g": "结构：时间 + 主语 + 动词 + 宾语 + 地点。nonton 是口语形式，书面为 menonton。"}}, {"sp": "Agung", "role": "d", "id": "Wah, bagaimana cara kamu pergi ke sana?", "zh": "哇，你怎么去的？", "a": "f565d879f8ed", "za": "d34797068f56", "an": {"p": [["Wah", "哇"], ["bagaimana", "怎样"], ["cara", "方式"], ["kamu", "你"], ["pergi", "去"], ["ke sana", "到那里"]], "b": "", "g": "结构：Bagaimana cara + 主语 + 动词？= 你是怎么去的？cara = 方法。"}}, {"sp": "Risti", "role": "d", "id": "Aku naik MRT ke sana.", "zh": "我坐地铁去的。", "a": "14c63d9af5ae", "za": "7ba6e43dfcbc", "an": {"p": [["Aku", "我"], ["naik", "乘"], ["MRT", "地铁"], ["ke sana", "到那里"]], "b": "", "g": "结构：主语 + naik + 交通工具 + ke + 地点。"}}, {"sp": "Agung", "role": "d", "id": "MRT? Aku belum pernah naik itu. Caranya bagaimana, Ti?", "zh": "地铁？我还没坐过。怎么坐？", "a": "5e033ec54831", "za": "d35b71e9443d", "an": {"p": [["MRT", "地铁"], ["Aku", "我"], ["belum pernah", "从未"], ["naik", "乘"], ["itu", "那个"], ["Caranya", "方法"], ["bagaimana", "怎样"], ["Ti", "蒂"]], "b": "", "g": "结构：belum pernah + 动词 = 还从来没做过……。Caranya bagaimana? = 怎么乘？-nya 指 MRT 的乘坐方式。"}}, {"sp": "Risti", "role": "d", "id": "Kamu harus punya kartu uang elektronik dulu, Gung. Petugas akan mengecek barang bawaan kita sebelum masuk dan keluar stasiun. Setelah itu masuk lewat gerbang dengan cara menempelkan kartu.", "zh": "你得先有一张电子钱包卡。进出站前工作人员会检查随身物品，然后刷卡过闸机进站。", "a": "beb07d36aadd", "za": "5327c452f92b", "an": {"p": [["Kamu", "你"], ["harus", "必须"], ["punya", "有"], ["kartu uang elektronik", "电子货币卡"], ["dulu", "先"], ["Petugas", "工作人员"], ["akan", "将会"], ["mengecek", "检查"], ["barang bawaan", "随身行李"], ["sebelum", "在……之前"], ["masuk", "进"], ["keluar", "出"], ["stasiun", "车站"], ["Setelah itu", "之后"], ["lewat", "经过"], ["gerbang", "闸机"], ["dengan cara", "用……方法"], ["menempelkan", "贴（刷）"], ["kartu", "卡"]], "b": "mengecek = meN- + cek（vt. 检查）；menempelkan = meN- + tempel + -kan", "g": "结构：多个分句。Petugas akan + 动词 + 宾语 + sebelum + 动作。dengan cara + 动词短语 = 以……的方式。barang bawaan = 携带的东西。"}}, {"sp": "Agung", "role": "d", "id": "Hem, menarik. Nanti aku juga mau coba naik MRT.", "zh": "嗯，有意思，回头我也要试试坐地铁。", "a": "db5367864cd0", "za": "f24ec2d61537", "an": {"p": [["Hem", "嗯"], ["menarik", "有意思"], ["Nanti", "以后"], ["aku", "我"], ["juga", "也"], ["mau", "想"], ["coba", "试"], ["naik MRT", "乘地铁"]], "b": "menarik = meN- + tarik（adj. 有趣）", "g": "结构：评价 + 时间 + 主语 + juga + mau + 动词。mau coba + 动词 = 想试试。"}}, {"sp": "Risti", "role": "d", "id": "Ayo coba, Gung. Aku yakin kamu akan suka.", "zh": "去试试吧，我相信你会喜欢的。", "a": "9cc910ea8a93", "za": "b37118f64228", "an": {"p": [["Ayo", "来吧"], ["coba", "试"], ["Gung", "贡"], ["Aku", "我"], ["yakin", "确信"], ["kamu", "你"], ["akan", "会"], ["suka", "喜欢"]], "b": "", "g": "结构：Ayo + 动词。Aku yakin + 从句 = 我相信……。akan 表示将来。"}}], "zh": "", "note": "", "qa": [], "u": 8}, {"id": "d40", "kind": "dlg", "book": "BIPA 2", "title": "假期计划（音频 9）", "lines": [{"sp": "Ira", "role": "d", "id": "Liburan hampir tiba, ya. Kamu mau berlibur ke mana, Azka?", "zh": "快放假了。Azka，你想去哪儿度假？", "a": "ed9e2c7f138b", "za": "6b152deb01d4", "an": {"p": [["Liburan", "假期"], ["hampir", "快要"], ["tiba", "到来"], ["ya", "对吧"], ["Kamu", "你"], ["mau", "想"], ["berlibur", "度假"], ["ke mana", "去哪里"], ["Azka", "阿兹卡"]], "b": "liburan = libur + -an（n. 假期）；berlibur = ber- + libur（vi. 度假）", "g": "结构：主语 + hampir + 动词, ya. hampir tiba = 快到了。mau berlibur ke mana = 想去哪里度假？"}}, {"sp": "Azka", "role": "d", "id": "Aku belum ada rencana. Bagaimana denganmu, Ira?", "zh": "我还没计划。你呢，Ira？", "a": "77c724951e26", "za": "9694a63ab7be", "an": {"p": [["Aku", "我"], ["belum ada", "还没有"], ["rencana", "计划"], ["Bagaimana", "怎么样"], ["denganmu", "你呢"], ["Ira", "伊拉"]], "b": "denganmu = dengan + -mu", "g": "结构：belum + ada = 还没有。Bagaimana dengan + 人？= 那……呢？反问。"}}, {"sp": "Ira", "role": "d", "id": "Aku ingin pergi ke Toraja.", "zh": "我想去托拉查。", "a": "61f8a9136cab", "za": "e12753d49b9c", "an": {"p": [["Aku", "我"], ["ingin", "想"], ["pergi", "去"], ["ke Toraja", "到托拉贾（苏拉威西）"]], "b": "", "g": "结构：主语 + ingin + 动词 + ke + 地点。"}}, {"sp": "Azka", "role": "d", "id": "Rencana yang bagus. Kapan kamu akan pergi?", "zh": "好计划！什么时候去？", "a": "6bd4a78cf680", "za": "0ebfb841931e", "an": {"p": [["Rencana", "计划"], ["yang bagus", "好的"], ["Kapan", "什么时候"], ["kamu", "你"], ["akan", "将"], ["pergi", "去"]], "b": "", "g": "结构：名词 + yang + 形容词（评价）。Kapan + 主语 + akan + 动词？问时间。"}}, {"sp": "Ira", "role": "d", "id": "Minggu depan. Apa kamu mau ikut?", "zh": "下周。你要一起去吗？", "a": "81b5b62f50d3", "za": "a5bedf1f0ffe", "an": {"p": [["Minggu depan", "下周"], ["Apa", "是否"], ["kamu", "你"], ["mau", "想"], ["ikut", "一起去"]], "b": "", "g": "结构：时间回答 + Apa + 主语 + mau + ikut？邀请对方同去。"}}, {"sp": "Azka", "role": "d", "id": "Tidak, terima kasih. Sepertinya aku di rumah saja.", "zh": "不了，谢谢。我还是待在家吧。", "a": "e34e3cba7e4e", "za": "70b0142eafa1", "an": {"p": [["Tidak", "不"], ["terima kasih", "谢谢"], ["Sepertinya", "好像"], ["aku", "我"], ["di rumah", "在家"], ["saja", "就"]], "b": "sepertinya = seperti + -nya", "g": "结构：婉拒：Tidak, terima kasih。Sepertinya + 主语 + 地点 + saja = 看来我就待在家里了。"}}, {"sp": "Ira", "role": "d", "id": "Baiklah. Nanti akan kubawakan oleh-oleh dari sana.", "zh": "好吧，我会给你带那边的特产。", "a": "4b91294b239a", "za": "0b8c7c81ab0b", "an": {"p": [["Baiklah", "好吧"], ["Nanti", "以后"], ["akan", "会"], ["kubawakan", "我替你带"], ["oleh-oleh", "伴手礼"], ["dari sana", "从那里"]], "b": "kubawakan = ku- + bawa + -kan（我 + 为……带）", "g": "结构：akan + ku-动词 + -kan：第一人称被动式，ku- = 我，-kan = 替某人做。akan kubawakan oleh-oleh = 我会给你带特产。"}}, {"sp": "Azka", "role": "d", "id": "Asyik. Kutunggu, ya!", "zh": "太好了，我等着哦！", "a": "d3d87787c9b2", "za": "bc50a103bdbd", "an": {"p": [["Asyik", "太好了"], ["Kutunggu", "我等你"], ["ya", "哦"]], "b": "kutunggu = ku- + tunggu（我等）", "g": "结构：ku + 动词原形 = 我（做某事）。Kutunggu = 我等你（口语、亲近）。asyik = 开心、棒。"}}], "zh": "", "note": "", "qa": [], "u": 9}, {"id": "d41", "kind": "dlg", "book": "BIPA 2", "title": "上个假期去了哪（对话 9）", "lines": [{"sp": "Aria", "role": "d", "id": "Hai, Fi. Ke mana kamu pergi ketika libur semester?", "zh": "嗨，Lutfi，学期假你去哪儿了？", "a": "955f93249327", "za": "842885106812", "an": {"p": [["Hai", "嗨"], ["Fi", "菲"], ["Ke mana", "去哪里"], ["kamu", "你"], ["pergi", "去"], ["ketika", "当……时"], ["libur semester", "学期假"]], "b": "", "g": "结构：疑问短语前置：Ke mana + 主语 + pergi。ketika + 名词 = 在……的时候。"}}, {"sp": "Lutfi", "role": "d", "id": "Halo, Aria. Liburan kemarin aku pergi ke Pulau Lombok.", "zh": "你好，Aria。上个假期我去了龙目岛。", "a": "b40835c1fd59", "za": "a2b6bbcc44a9", "an": {"p": [["Halo", "你好"], ["Aria", "阿里亚"], ["Liburan kemarin", "上次假期"], ["aku", "我"], ["pergi", "去"], ["ke Pulau Lombok", "到龙目岛"]], "b": "", "g": "结构：时间 + 主语 + pergi ke + 地点。kemarin 放在名词后表示“上次的”。"}}, {"sp": "Aria", "role": "d", "id": "Wow! Transportasi apa yang kamu gunakan?", "zh": "哇！你坐什么去的？", "a": "e0b8d7252e42", "za": "91fa36d43b8b", "an": {"p": [["Wow", "哇"], ["Transportasi", "交通工具"], ["apa", "什么"], ["yang", "……的"], ["kamu", "你"], ["gunakan", "使用"]], "b": "gunakan = guna + -kan（动词原形）", "g": "结构：名词 + apa + yang + 主语 + 动词原形？yang 从句里动词不加 meN-（kamu gunakan）。transportasi apa = 什么交通方式。"}}, {"sp": "Lutfi", "role": "d", "id": "Aku dan keluargaku naik pesawat ke sana.", "zh": "我和家人坐飞机去的。", "a": "aa04b1aa7788", "za": "2039aefb8712", "an": {"p": [["Aku", "我"], ["dan", "和"], ["keluargaku", "我的家人"], ["naik", "乘"], ["pesawat", "飞机"], ["ke sana", "到那里"]], "b": "keluargaku = keluarga + -ku", "g": "结构：主语（并列）+ naik + 交通工具 + ke + 地点。-ku = 我的。"}}, {"sp": "Aria", "role": "d", "id": "Apa saja yang kamu lakukan di sana?", "zh": "你们在那儿做了什么？", "a": "c61285c938dd", "za": "51022f005e97", "an": {"p": [["Apa saja", "都有什么"], ["yang", "……的"], ["kamu", "你"], ["lakukan", "做"], ["di sana", "在那里"]], "b": "apa saja = 任何什么，表示“有哪些”", "g": "结构：Apa saja yang + 主语 + 动词原形 + 地点？= 你在那里都做了什么？"}}, {"sp": "Lutfi", "role": "d", "id": "Sebagian besar waktu kami habiskan untuk jalan-jalan. Pantai di Pulau Lombok sungguh sangat indah. Sehari sebelum kami pulang kami juga melihat pasar malam.", "zh": "大部分时间都在游玩。龙目岛的海滩真的很美。回家前一天我们还逛了夜市。", "a": "4297918d92b7", "za": "0111c5493134", "an": {"p": [["Sebagian besar", "大部分"], ["waktu", "时间"], ["kami", "我们"], ["habiskan", "花费"], ["untuk", "用于"], ["jalan-jalan", "逛"], ["Pantai", "海滩"], ["di Pulau Lombok", "在龙目岛"], ["sungguh", "的确"], ["sangat", "很"], ["indah", "美"], ["Sehari sebelum", "前一天"], ["pulang", "回家"], ["juga", "也"], ["melihat", "看"], ["pasar malam", "夜市"]], "b": "habiskan = habis + -kan（用完）；sebagian = se- + bagian", "g": "结构：宾语前置被动式：Sebagian besar waktu + kami + habiskan（动词原形）。意思：我们把大部分时间花在逛上。Sehari sebelum + 从句 = ……的前一天。sungguh sangat 连用加强。"}}, {"sp": "Aria", "role": "d", "id": "Pasti menyenangkan sekali. Semoga aku bisa ke sana nanti.", "zh": "一定很开心。希望以后我也能去。", "a": "157c3cd04cfd", "za": "4ab4ba6a8879", "an": {"p": [["Pasti", "一定"], ["menyenangkan", "愉快"], ["sekali", "非常"], ["Semoga", "希望"], ["aku", "我"], ["bisa", "能"], ["ke sana", "去那里"], ["nanti", "以后"]], "b": "", "g": "结构：Pasti + 形容词 + sekali；Semoga + 主语 + bisa + 动词。"}}, {"sp": "Lutfi", "role": "d", "id": "Kalau nanti kamu ke sana, aku juga mau ikut!", "zh": "要是你以后去，我也要一起！", "a": "44c987545c51", "za": "830ca9fc5b65", "an": {"p": [["Kalau", "如果"], ["nanti", "以后"], ["kamu", "你"], ["ke sana", "去那里"], ["aku", "我"], ["juga", "也"], ["mau", "想"], ["ikut", "一起去"]], "b": "", "g": "结构：Kalau + 条件, 主句。ke sana 省略了动词 pergi。"}}], "zh": "", "note": "", "qa": [], "u": 9}, {"id": "d42", "kind": "dlg", "book": "BIPA 2", "title": "淋雨头晕（音频 10）", "lines": [{"sp": "Adit", "role": "d", "id": "Aduh, kepalaku pusing sekali.", "zh": "哎呀，我头好晕。", "a": "96d7cf46a3a4", "za": "993f51c9548e", "an": {"p": [["Aduh", "哎呀"], ["kepalaku", "我的头"], ["pusing", "晕、头痛"], ["sekali", "非常"]], "b": "kepalaku = kepala + -ku", "g": "结构：Aduh + 主语 + 形容词 + sekali。pusing = 头晕。"}}, {"sp": "Indri", "role": "d", "id": "Kenapa, Dit? Apa kamu sakit?", "zh": "怎么了，Adit？你生病了吗？", "a": "632dd5ba99af", "za": "09c900584040", "an": {"p": [["Kenapa", "怎么了"], ["Dit", "迪（Adit 的简称）"], ["Apa", "是否"], ["kamu", "你"], ["sakit", "生病"]], "b": "", "g": "结构：Kenapa? = 怎么了？Apa + 主语 + 形容词？是非问。"}}, {"sp": "Adit", "role": "d", "id": "Iya, Indri. Kemarin hujan deras. Aku kehujanan.", "zh": "是啊，Indri。昨天下大雨，我被淋了。", "a": "4d65e395b10a", "za": "56082c82adc4", "an": {"p": [["Iya", "是的"], ["Indri", "因德里"], ["Kemarin", "昨天"], ["hujan", "下雨"], ["deras", "大"], ["Aku", "我"], ["kehujanan", "淋雨"]], "b": "kehujanan = ke- + hujan + -an（遭受下雨 → 淋雨）", "g": "结构：时间 + hujan deras。ke-……-an 表示“遭受某种自然现象”：kehujanan 淋了雨，kepanasan 受热。"}}, {"sp": "Indri", "role": "d", "id": "Apakah kamu sudah berobat ke dokter?", "zh": "你去看医生了吗？", "a": "f7aa632fb14c", "za": "bf2310ba94c1", "an": {"p": [["Apakah", "是否"], ["kamu", "你"], ["sudah", "已经"], ["berobat", "看病"], ["ke dokter", "去看医生"]], "b": "berobat = ber- + obat（vi. 求医用药）", "g": "结构：Apakah + 主语 + sudah + 动词 + ke + 地点？sudah 问“已经……了吗”。"}}, {"sp": "Adit", "role": "d", "id": "Belum.", "zh": "还没。", "a": "7cb4158bcaa7", "za": "76d62b9fc81a", "an": {"p": [["Belum", "还没"]], "b": "", "g": "回答 sudah 问句的否定：Belum = 还没有。"}}, {"sp": "Indri", "role": "d", "id": "Aku buatkan teh panas, ya.", "zh": "我给你泡杯热茶吧。", "a": "9cdf9c928c9a", "za": "7c196605d4f9", "an": {"p": [["Aku", "我"], ["buatkan", "为你做"], ["teh panas", "热茶"], ["ya", "好吗"]], "b": "buatkan = buat + -kan（为某人做）", "g": "结构：主语 + 动词原形-kan + 宾语。-kan 表示为他人做。口语中 aku + 动词原形，不加 meN-。"}}, {"sp": "Adit", "role": "d", "id": "Terima kasih, Indri. Maaf, ya, merepotkan kamu.", "zh": "谢谢你，Indri，不好意思麻烦你了。", "a": "2614595f5522", "za": "132d9f30bc41", "an": {"p": [["Terima kasih", "谢谢"], ["Indri", "因德里"], ["Maaf", "抱歉"], ["ya", "啊"], ["merepotkan", "给……添麻烦"], ["kamu", "你"]], "b": "merepotkan = meN- + repot + -kan（vt. 使人麻烦）", "g": "结构：道谢 + 道歉 + 动词 + 宾语。merepotkan + 人 = 麻烦某人。"}}, {"sp": "Indri", "role": "d", "id": "Tidak merepotkan, Adit. Setelah ini, aku antar ke dokter.", "zh": "不麻烦。等会儿我送你去看医生。", "a": "ffc1a9770b1e", "za": "f982f501e429", "an": {"p": [["Tidak", "不"], ["merepotkan", "麻烦"], ["Adit", "阿迪"], ["Setelah ini", "这之后"], ["aku", "我"], ["antar", "送"], ["ke dokter", "去看医生"]], "b": "antar = vt. 送（动词原形）", "g": "结构：Tidak + 动词。Setelah ini, 主语 + 动词原形 + ke + 地点。aku antar = 我来送你（口语省略 meN-）。"}}, {"sp": "Adit", "role": "d", "id": "Baiklah. Sekali lagi terima kasih, ya.", "zh": "好的，再次谢谢你。", "a": "f2939cdbe94f", "za": "f5756cf5f0af", "an": {"p": [["Baiklah", "好吧"], ["Sekali lagi", "再一次"], ["terima kasih", "谢谢"], ["ya", "啊"]], "b": "", "g": "结构：Sekali lagi + 动词短语 = 再一次……。sekali = 一次，lagi = 再。"}}, {"sp": "Indri", "role": "d", "id": "Sama-sama.", "zh": "不客气。", "a": "7b3c51cf4835", "za": "e9ef14785136", "an": {"p": [["Sama-sama", "不客气"]], "b": "", "g": "回应感谢。"}}], "zh": "", "note": "中文版练习题里写成“复述 Sarah 的症状”，原文人物其实是 Adit。", "qa": [], "u": 10}, {"id": "d43", "kind": "dlg", "book": "BIPA 2", "title": "拉肚子吃药（对话 10）", "lines": [{"sp": "Pras", "role": "d", "id": "Datil, kenapa kemarin kamu tidak masuk sekolah?", "zh": "Datil，你昨天怎么没来上学？", "a": "f9c8455fe03b", "za": "249d9727bc6c", "an": {"p": [["Datil", "达蒂尔"], ["kenapa", "为什么"], ["kemarin", "昨天"], ["kamu", "你"], ["tidak masuk", "没来"], ["sekolah", "学校"]], "b": "", "g": "结构：称呼 + Kenapa + 时间 + 主语 + tidak masuk + 地点？masuk sekolah = 去上学（进校）。"}}, {"sp": "Datil", "role": "d", "id": "Kemarin aku diare, Pras.", "zh": "我昨天拉肚子了。", "a": "541508743231", "za": "deeedb5adc62", "an": {"p": [["Kemarin", "昨天"], ["aku", "我"], ["diare", "腹泻"], ["Pras", "普拉斯"]], "b": "", "g": "结构：时间 + 主语 + 名词（病名）。diare 作谓语，意为“拉肚子”。"}}, {"sp": "Pras", "role": "d", "id": "Hmm, apa kamu sudah sembuh?", "zh": "嗯，现在好了吗？", "a": "1fc877437ff1", "za": "e7b86b8d27d4", "an": {"p": [["Hmm", "嗯"], ["apa", "是否"], ["kamu", "你"], ["sudah", "已经"], ["sembuh", "痊愈"]], "b": "", "g": "结构：Apa + 主语 + sudah + 动词？sembuh（vi. 痊愈）。"}}, {"sp": "Datil", "role": "d", "id": "Sudah. Aku minum oralit.", "zh": "好了，我喝了补液盐。", "a": "ab4958a289e6", "za": "c846fa2a1129", "an": {"p": [["Sudah", "好了"], ["Aku", "我"], ["minum", "服"], ["oralit", "口服补液盐"]], "b": "", "g": "结构：Sudah = 已经（好了）。minum + 药 = 吃药（印尼语“喝药”）。"}}, {"sp": "Pras", "role": "d", "id": "Bagaimana aturan pakainya?", "zh": "怎么喝？", "a": "aae097de54fa", "za": "967b2de47954", "an": {"p": [["Bagaimana", "怎样"], ["aturan pakai", "用法"], ["-nya", "它的"]], "b": "aturan = atur + -an（n. 规则）；pakainya = pakai + -nya", "g": "结构：Bagaimana + 名词？aturan pakai = 使用方法（药品说明常用语）。"}}, {"sp": "Datil", "role": "d", "id": "Seduh larutan oralit dengan air hangat. Minum tiga kali sehari.", "zh": "用温水冲开，一天喝三次。", "a": "bd394a17f66f", "za": "b52cab12a220", "an": {"p": [["Seduh", "冲泡"], ["larutan", "溶液"], ["oralit", "口服补液盐"], ["dengan", "用"], ["air hangat", "温水"], ["Minum", "喝"], ["tiga kali sehari", "一天三次"]], "b": "larutan = larut + -an（n. 溶液）", "g": "结构：祈使句：动词 + 宾语 + dengan + 材料。tiga kali sehari = 一天三次。药物用法常用祈使句。"}}, {"sp": "Pras", "role": "d", "id": "Syukurlah kamu sudah sembuh.", "zh": "幸好你已经好了。", "a": "71bea2c4d765", "za": "fb2b382e98fd", "an": {"p": [["Syukurlah", "谢天谢地"], ["kamu", "你"], ["sudah", "已经"], ["sembuh", "痊愈"]], "b": "syukurlah = syukur + -lah", "g": "结构：Syukurlah + 从句 = 谢天谢地……。表示庆幸。"}}, {"sp": "Datil", "role": "d", "id": "Terima kasih, Pras.", "zh": "谢谢你，Pras。", "a": "050a927d679a", "za": "2678faf64615", "an": {"p": [["Terima kasih", "谢谢"], ["Pras", "普拉斯"]], "b": "", "g": "道谢。"}}], "zh": "", "note": "", "qa": [], "u": 10}, {"id": "t44", "kind": "text", "book": "武功秘籍", "title": "宅家的一周 Minggu Ini di Rumah", "lines": [{"sp": "", "role": "r", "id": "Minggu ini saya memutuskan untuk tidak pergi ke mal atau tempat wisata.", "zh": "这周我决定不去商场，也不去景点。", "a": "89e3aa902594", "za": "720073772987", "an": {"p": [["Minggu ini", "这周"], ["saya", "我"], ["memutuskan", "决定"], ["untuk", "（引出所决定的内容）"], ["tidak pergi", "不去"], ["ke mal", "去商场"], ["atau", "或者"], ["tempat wisata", "旅游景点"]], "b": "memutuskan = putus 断 + meN-…-kan；wisata = 旅游", "g": "结构：时间状语 + 主语 + 谓语（memutuskan）+ untuk + 否定动词短语。memutuskan untuk + 动词 = 决定做……，否定放在 untuk 之后：memutuskan untuk tidak pergi = 决定不去。atau 连接两个并列的地点。"}}, {"sp": "", "role": "r", "id": "Setiap pagi saya bangun jam tujuh, langsung mandi dan memakai baju.", "zh": "每天早上我七点起床，马上洗澡穿衣服。", "a": "bcc9ba0a6953", "za": "bd61f66abada", "an": {"p": [["Setiap pagi", "每天早上"], ["saya", "我"], ["bangun", "起床"], ["jam tujuh", "七点"], ["langsung", "马上"], ["mandi", "洗澡"], ["memakai baju", "穿衣服"]], "b": "memakai = pakai + meN-", "g": "结构：时间状语 + 主语 + 动作 1，（省略主语）动作 2 和动作 3。同一主语的连续动作，逗号后不再重复 saya。langsung 放在动词前，表示“紧接着”。"}}, {"sp": "", "role": "r", "id": "Setelah itu, saya sarapan nasi goreng yang dimasak oleh ibu saya, dan saya membantu membersihkan rumah.", "zh": "之后，我吃妈妈做的炒饭当早餐，然后帮忙打扫房子。", "a": "2550d3eee01e", "za": "54cdfc68226f", "an": {"p": [["Setelah itu", "在那之后"], ["sarapan", "吃早饭"], ["nasi goreng", "炒饭"], ["yang dimasak", "被做出来的"], ["oleh ibu saya", "由我妈妈"], ["dan", "并且"], ["membantu membersihkan", "帮忙打扫"], ["rumah", "房子"]], "b": "dimasak = di- + masak；membersihkan = bersih + meN-…-kan", "g": "结构：yang + di- 被动 + oleh + 施事 = “由……做的”，是修饰 nasi goreng 的关系从句。oleh 引出被动句的动作者。membantu + 动词 = 帮忙做……。两个分句用 dan 连接。"}}, {"sp": "", "role": "r", "id": "Sore hari saya menonton film dokumenter tentang hewan di televisi.", "zh": "下午我在电视上看一部关于动物的纪录片。", "a": "25042779556d", "za": "26a039d4d484", "an": {"p": [["Sore hari", "下午"], ["menonton", "观看"], ["film dokumenter", "纪录片"], ["tentang hewan", "关于动物的"], ["di televisi", "在电视上"]], "b": "hewan = 动物；dokumenter = 纪录的", "g": "结构：时间 + 主语 + 谓语 + 宾语（名词 + tentang 短语）+ 地点。tentang + 名词 = 关于……，放在被修饰的名词后面。"}}, {"sp": "", "role": "r", "id": "Saya harus menyelesaikan tugas kuliah sebelum besok pagi.", "zh": "我得在明天早上之前完成大学作业。", "a": "cb49a5f2c101", "za": "5349e61edcc9", "an": {"p": [["harus", "必须"], ["menyelesaikan", "完成"], ["tugas kuliah", "大学作业"], ["sebelum", "在……之前"], ["besok pagi", "明天早上"]], "b": "menyelesaikan = selesai + meN-…-kan", "g": "结构：主语 + harus + 动词 + 宾语 + sebelum + 时间。sebelum + 时间名词 = 在……之前。tugas kuliah = 任务 + 大学课程。"}}, {"sp": "", "role": "r", "id": "Meskipun hanya di rumah, hari saya terasa penuh dan menyenangkan.", "zh": "虽然只待在家里，我的一天却过得充实又愉快。", "a": "1adf8dad5c10", "za": "c3efca7844fd", "an": {"p": [["Meskipun", "虽然"], ["hanya di rumah", "只是在家"], ["hari saya", "我的一天"], ["terasa", "感觉起来"], ["penuh", "充实"], ["dan", "而且"], ["menyenangkan", "令人愉快"]], "b": "terasa = ter- + rasa 感觉；menyenangkan = senang + meN-…-kan", "g": "结构：Meskipun + 让步从句，主句（meskipun 之后不再用“但是”）。terasa + 形容词 = 感觉起来……。menyenangkan = 使人高兴的。"}}], "zh": "这周我决定不去商场，也不去旅游景点。每天早上我七点起床，马上洗澡、穿衣服。之后我吃妈妈做的炒饭当早餐，然后帮忙打扫家里。下午我在电视上看关于动物的纪录片。我必须在明天早上之前完成大学作业。虽然只待在家里，但我这一天过得很充实、很愉快。", "note": "", "qa": []}, {"id": "t45", "kind": "text", "book": "武功秘籍", "title": "宅家的一周 Minggu Ini di Rumah（版本 B）", "lines": [{"sp": "", "role": "r", "id": "Pada akhir pekan, saya tidak pergi ke mal atau tempat wisata.", "zh": "周末我没有去商场或景点。", "a": "ce7e9644126c", "za": "8b944571069e", "an": {"p": [["Pada akhir pekan", "在周末"], ["saya tidak pergi", "我不去"], ["ke mal", "去商场"], ["atau", "或者"], ["tempat wisata", "旅游景点"]], "b": "", "g": "pada + 时间 = 在……的时候。tidak 否定 pergi；atau 并列两个地点，否定对两个都有效（既不去 A 也不去 B）。"}}, {"sp": "", "role": "r", "id": "Saya bangun pukul tujuh pagi.", "zh": "我早上七点起床。", "a": "9dcc19e44b9c", "za": "88b1578e63b2", "an": {"p": [["Saya", "我"], ["bangun", "起床"], ["pukul tujuh", "七点"], ["pagi", "早上"]], "b": "", "g": "pukul + 数字 = 几点；时段词 pagi 放在数字后面。bangun 是不及物动词，不加 meN-。"}}, {"sp": "", "role": "r", "id": "Setelah bangun, saya memakai pakaian.", "zh": "起床后，我穿好衣服。", "a": "425370775e3e", "za": "3edffacd9045", "an": {"p": [["Setelah bangun", "起床之后"], ["saya memakai", "我穿"], ["pakaian", "衣服"]], "b": "pakaian = pakai + -an", "g": "Setelah + 动词 = ……之后（省略主语）。memakai = 穿（动词），pakaian = 穿的东西（衣服，名词）。"}}, {"sp": "", "role": "r", "id": "Kemudian, saya membantu ibu membuat nasi goreng untuk sarapan.", "zh": "然后，我帮妈妈做炒饭当早餐。", "a": "72bc18c635f2", "za": "e39b8ac9fe84", "an": {"p": [["Kemudian", "然后"], ["membantu ibu", "帮妈妈"], ["membuat", "做"], ["nasi goreng", "炒饭"], ["untuk sarapan", "当早餐"]], "b": "", "g": "membantu + 人 + 动词 = 帮某人做某事。untuk sarapan = 作为早餐、用于早餐。Kemudian 连接先后动作。"}}, {"sp": "", "role": "r", "id": "Setelah itu, saya membantu ibu membersihkan rumah.", "zh": "之后，我帮妈妈打扫房子。", "a": "20980576938f", "za": "735a01ab4400", "an": {"p": [["Setelah itu", "在那之后"], ["membantu ibu", "帮妈妈"], ["membersihkan", "打扫"], ["rumah", "房子"]], "b": "", "g": "Setelah itu = 在那之后（itu 指前面发生的事）。结构同上一句：membantu + 人 + 动词。"}}, {"sp": "", "role": "r", "id": "Kemudian, saya menonton film dokumenter di televisi.", "zh": "然后，我在电视上看纪录片。", "a": "d266a6c0895a", "za": "72f446399ccc", "an": {"p": [["Kemudian", "然后"], ["menonton", "观看"], ["film dokumenter", "纪录片"], ["di televisi", "在电视上"]], "b": "", "g": "顺序连接词 Kemudian / Setelah itu / Lalu 都表示“然后”。menonton + 内容 + di + 媒介。"}}, {"sp": "", "role": "r", "id": "Saya merasa kegiatan saya pada hari Minggu sangat sederhana, tetapi sangat berarti bagi saya.", "zh": "我觉得我星期天的活动很简单，但对我来说很有意义。", "a": "e92a932d6462", "za": "d2c91594ec31", "an": {"p": [["Saya merasa", "我觉得"], ["kegiatan saya", "我的活动"], ["pada hari Minggu", "在星期天"], ["sangat sederhana", "非常简单"], ["tetapi", "但是"], ["sangat berarti", "非常有意义"], ["bagi saya", "对我来说"]], "b": "kegiatan = giat + ke-…-an；berarti = ber- + arti", "g": "结构：merasa + 完整小句，tetapi 转折。merasa + 句子 = 觉得……（省略 bahwa）。sangat A, tetapi sangat B = 很 A，但很 B。bagi saya = 对我来说。"}}], "zh": "周末我不去商场或旅游景点。我早上七点起床。起床后我穿好衣服，然后帮妈妈做炒饭当早餐。之后我帮妈妈打扫房子，然后在电视上看纪录片。我觉得我周日的活动很简单，但对我来说很有意义。", "note": "", "qa": []}, {"id": "t46", "kind": "text", "book": "武功秘籍", "title": "周日做饭 Memasak Bersama Ibu", "lines": [{"sp": "", "role": "r", "id": "Pada pagi hari Minggu, Amy membantu ibunya memasak di dapur.", "zh": "星期天早上，Amy 在厨房帮妈妈做饭。", "a": "cce492ef764f", "za": "a519d37c8653", "an": {"p": [["Pada pagi hari Minggu", "在星期天早上"], ["Amy", "人名"], ["membantu", "帮助"], ["ibunya", "她的妈妈"], ["memasak", "做饭"], ["di dapur", "在厨房"]], "b": "ibunya = ibu + -nya", "g": "-nya 接在名词后 = 他/她的：ibunya = 她（Amy）的妈妈。membantu + 人 + 动词。时间状语放句首，用逗号隔开。"}}, {"sp": "", "role": "r", "id": "Mereka ingin membuat nasi goreng dan sup sayuran sebagai makan siang.", "zh": "她们想做炒饭和蔬菜汤当午饭。", "a": "21359e413fa3", "za": "0921ed8b0ec6", "an": {"p": [["Mereka", "她们"], ["ingin", "想"], ["membuat", "做"], ["nasi goreng", "炒饭"], ["dan", "和"], ["sup sayuran", "蔬菜汤"], ["sebagai", "作为"], ["makan siang", "午饭"]], "b": "", "g": "ingin + 动词 = 想做……。sebagai + 名词 = 作为……。sup sayuran = 汤 + 蔬菜（名词 + 名词）。"}}, {"sp": "", "role": "r", "id": "Amy mencuci sayuran.", "zh": "Amy 洗蔬菜。", "a": "e530abc5d2fe", "za": "983c78321f10", "an": {"p": [["Amy", "人名"], ["mencuci", "洗"], ["sayuran", "蔬菜"]], "b": "mencuci = cuci + meN-；sayuran = sayur + -an", "g": "简单主谓宾：主语 + 动词 + 宾语。sayur 是蔬菜，sayuran 指各种蔬菜（-an 表示集合）。"}}, {"sp": "", "role": "r", "id": "Kemudian ibu memotong bawang bombay dan menyiapkan bumbu.", "zh": "然后妈妈切洋葱、准备调料。", "a": "93fb9b28443b", "za": "0361931b83a6", "an": {"p": [["Kemudian", "然后"], ["ibu", "妈妈"], ["memotong", "切"], ["bawang bombay", "洋葱"], ["menyiapkan", "准备"], ["bumbu", "调料"]], "b": "memotong = potong + meN-；menyiapkan = siap + meN-…-kan", "g": "结构：主语 + 动词 1 + 宾语 1 + dan + 动词 2 + 宾语 2。两个动作共用主语 ibu。menyiapkan = 使……准备好。"}}, {"sp": "", "role": "r", "id": "Setelah semua bahan makanan siap, mereka mulai memasak bersama.", "zh": "所有食材准备好后，她们开始一起做饭。", "a": "7a02cabd4be5", "za": "84d41eef7b7d", "an": {"p": [["Setelah", "之后"], ["semua bahan makanan", "所有食材"], ["siap", "准备好"], ["mereka", "她们"], ["mulai memasak", "开始做饭"], ["bersama", "一起"]], "b": "bahan = 材料", "g": "结构：Setelah + 完整小句（semua bahan makanan siap），主句。setelah 后面可以接“主语 + 形容词”的完整句。mulai + 动词 = 开始。"}}, {"sp": "", "role": "r", "id": "Makanan yang disiapkan sangat sedap.", "zh": "准备好的饭菜非常香。", "a": "600afb1d3107", "za": "b9a470b97806", "an": {"p": [["Makanan", "食物"], ["yang disiapkan", "被准备好的"], ["sangat sedap", "非常美味"]], "b": "disiapkan = di- + siap + -kan", "g": "结构：名词 + yang + 被动动词 = “被……的（东西）”，整个短语做主语。sedap = 美味，和 enak 同义。"}}, {"sp": "", "role": "r", "id": "Seluruh anggota keluarga berkumpul di meja makan.", "zh": "全家人围坐在餐桌旁。", "a": "ef44728e374c", "za": "9e5c024cc3c9", "an": {"p": [["Seluruh", "整个"], ["anggota keluarga", "家庭成员"], ["berkumpul", "聚集"], ["di meja makan", "在餐桌旁"]], "b": "berkumpul = ber- + kumpul", "g": "seluruh = semua（全部）。anggota = 成员。ber- + 词根 = 不及物动词。meja makan = 桌子 + 吃饭 = 餐桌。"}}, {"sp": "", "role": "r", "id": "Sambil makan, mereka saling berbagi kenangan kehidupan.", "zh": "他们一边吃饭，一边分享生活中的回忆。", "a": "765afa4fb62b", "za": "299c4d1517fb", "an": {"p": [["Sambil makan", "一边吃"], ["mereka", "他们"], ["saling", "互相"], ["berbagi", "分享"], ["kenangan", "回忆"], ["kehidupan", "生活"]], "b": "kenangan = kenang + -an；kehidupan = hidup + ke-…-an", "g": "sambil + 动词 = 一边……（同时进行）。saling + 动词 = 互相……。berbagi = ber- + bagi 分。"}}], "zh": "星期天早上，Amy 在厨房帮妈妈做饭。她们想做炒饭和蔬菜汤当午饭。Amy 洗菜，接着妈妈切洋葱、准备调料。所有食材准备好后，她们开始一起做饭。做好的饭菜非常美味。全家人围坐在餐桌旁，一边吃一边分享生活中的回忆。", "note": "", "qa": []}, {"id": "t47", "kind": "text", "book": "武功秘籍", "title": "理想中的家 Rumah Impian Saya", "lines": [{"sp": "", "role": "r", "id": "Saya membayangkan rumah saya seperti ini.", "zh": "我想象中的房子是这样的。", "a": "0e786669463a", "za": "79438837dab3", "an": {"p": [["Saya", "我"], ["membayangkan", "想象"], ["rumah saya", "我的房子"], ["seperti ini", "像这样"]], "b": "membayangkan = bayang 影子 + meN-…-kan", "g": "membayangkan + 宾语 = 想象……。seperti + 名词/代词 = 像……。seperti ini = 像这样，引出后面的具体描述。"}}, {"sp": "", "role": "r", "id": "Rumah saya ukurannya tidak perlu terlalu besar, tapi nyaman.", "zh": "我的房子不需要太大，但要舒适。", "a": "fbff95066b40", "za": "903f7aea3c8b", "an": {"p": [["Rumah saya", "我的房子"], ["ukurannya", "它的大小"], ["tidak perlu", "不需要"], ["terlalu", "太"], ["besar", "大"], ["tapi", "但是"], ["nyaman", "舒适"]], "b": "ukuran = ukur + -an；tapi = tetapi 的口语", "g": "结构：主题（Rumah saya）+ 评论（ukurannya tidak perlu terlalu besar）。印尼语常先说主题，再用“它的……”来评论：房子，它的大小不用太大。tidak perlu + 形容词 = 不必……。terlalu = 太（过度）。"}}, {"sp": "", "role": "r", "id": "Saya ingin ada taman dengan bunga berwarna-warni di dekat rumah.", "zh": "我希望房子附近有一个开满五颜六色鲜花的花园。", "a": "4f96b4fa6139", "za": "9296537bf9f2", "an": {"p": [["Saya ingin", "我想"], ["ada", "有"], ["taman", "花园"], ["dengan", "带有"], ["bunga", "花"], ["berwarna-warni", "五颜六色的"], ["di dekat rumah", "在房子附近"]], "b": "berwarna-warni = ber- + warna 颜色（重叠）", "g": "结构：ingin + ada + 名词 = 想要有……。dengan + 名词 = 带有……。berwarna + 颜色 = 是某种颜色，重叠 berwarna-warni = 五彩缤纷。di dekat = 在……附近。"}}, {"sp": "", "role": "r", "id": "Saya suka rumah yang luas tetapi tidak kosong.", "zh": "我喜欢宽敞但不空荡的房子。", "a": "8347c2729c44", "za": "52a1db70f95b", "an": {"p": [["Saya suka", "我喜欢"], ["rumah", "房子"], ["yang luas", "宽敞的"], ["tetapi", "但是"], ["tidak kosong", "不空"]], "b": "", "g": "结构：suka + 名词 + yang + 形容词 = 喜欢……的……。yang 引出形容词做修饰。luas = 宽敞，kosong = 空的。"}}, {"sp": "", "role": "r", "id": "Rumah saya punya tiga kamar tidur.", "zh": "我的房子有三间卧室。", "a": "f664a7f784dd", "za": "94f66d067436", "an": {"p": [["Rumah saya", "我的房子"], ["punya", "有"], ["tiga", "三"], ["kamar tidur", "卧室"]], "b": "", "g": "punya + 名词 = 拥有……（口语常用）。数字直接放在名词前，不需要量词：tiga kamar。kamar tidur = 房间 + 睡觉 = 卧室。"}}, {"sp": "", "role": "r", "id": "Di luar ada tempat untuk bersantai.", "zh": "外面有一个休闲的地方。", "a": "645345f15de6", "za": "ac47c5a37edf", "an": {"p": [["Di luar", "在外面"], ["ada", "有"], ["tempat", "地方"], ["untuk bersantai", "用来休闲"]], "b": "bersantai = ber- + santai 悠闲", "g": "结构：地点 + ada + 事物（存在句）。tempat untuk + 动词 = 用来……的地方。bersantai = 放松休闲。"}}, {"sp": "", "role": "r", "id": "Saya suka lingkungan yang ramah dan rumah dengan banyak jendela.", "zh": "我喜欢友善的邻里环境和窗户多的房子。", "a": "a6e8b5b38ea0", "za": "c67e2b2cc1a9", "an": {"p": [["Saya suka", "我喜欢"], ["lingkungan", "环境"], ["yang ramah", "友好的"], ["dan", "和"], ["rumah dengan banyak jendela", "窗户很多的房子"]], "b": "lingkungan = lingkung + -an", "g": "结构：suka + 名词 1（+ yang + 形容词）+ dan + 名词 2（+ dengan + 名词）。dengan banyak jendela = “带有很多窗户的”，用 dengan 表示拥有。"}}, {"sp": "", "role": "r", "id": "Banyak jendela bertujuan agar cahaya matahari masuk dengan baik.", "zh": "窗户多是为了让阳光好好照进来。", "a": "c0c18c841bd7", "za": "983d6707aa3f", "an": {"p": [["Banyak jendela", "很多窗户"], ["bertujuan", "目的是"], ["agar", "为了让"], ["cahaya matahari", "阳光"], ["masuk", "进来"], ["dengan baik", "好好地"]], "b": "bertujuan = ber- + tujuan 目的；matahari = 太阳", "g": "结构：A bertujuan agar + 主语 + 动词 = A 的目的是为了让……。agar 后面接完整小句（cahaya matahari masuk）。dengan baik = 好好地。"}}, {"sp": "", "role": "r", "id": "Dinding rumah saya berwarna biru muda dan hijau muda.", "zh": "我家的墙是浅蓝色和浅绿色的。", "a": "1eff528783ef", "za": "dbad38c160ff", "an": {"p": [["Dinding", "墙"], ["rumah saya", "我的房子"], ["berwarna", "是……颜色"], ["biru muda", "浅蓝"], ["dan", "和"], ["hijau muda", "浅绿"]], "b": "", "g": "结构：Dinding + rumah saya（名词 + 名词，所属放后）。berwarna + 颜色。颜色 + muda = 浅，+ tua = 深：biru muda 浅蓝，cokelat tua 深棕。"}}, {"sp": "", "role": "r", "id": "Itulah gambaran rumah dalam bayangan saya.", "zh": "这就是我想象中房子的样子。", "a": "078f84b1fb58", "za": "68867caa32db", "an": {"p": [["Itulah", "这就是"], ["gambaran", "描绘、样子"], ["rumah", "房子"], ["dalam bayangan saya", "在我的想象中"]], "b": "gambaran = gambar 图 + -an；bayangan = bayang + -an", "g": "-lah 加在 itu 后表示强调：Itulah = 这正是。dalam + 名词 = 在……之中。bayangan 是名词“想象”，membayangkan 是动词“想象”。"}}], "zh": "我想象中的家是这样的：房子不需要太大，但要舒适。我希望房子附近有一个开满五颜六色花朵的花园。我喜欢宽敞但不空荡的房子。我的家有三间卧室，外面有一个可以休闲放松的地方。我喜欢友好的环境和窗户很多的房子，窗户多是为了让阳光充分照进来。我家的墙是淡蓝色和浅绿色的。这就是我想象中家的样子。", "note": "", "qa": []}, {"id": "t48", "kind": "text", "book": "武功秘籍", "title": "（教材同主题）Mila 的家 Rumah Mila", "lines": [{"sp": "", "role": "r", "id": "Meli pergi ke rumah Mila di Bekasi.", "zh": "Meli 去了 Mila 在勿加泗的家。", "a": "2b3b266d5df5", "za": "9b9e373d06c2", "an": {"p": [["Meli", "人名"], ["pergi ke", "去"], ["rumah Mila", "Mila 的家"], ["di Bekasi", "在勿加泗（地名）"]], "b": "", "g": "名词 + 人名 = 某人的……：rumah Mila。di + 地名 说明地点。"}}, {"sp": "", "role": "r", "id": "Dia bercerita tentang rumah Mila kepada temannya, Ben.", "zh": "她跟朋友 Ben 讲了 Mila 家的情况。", "a": "bcf468436f6e", "za": "05e06de22d13", "an": {"p": [["Dia", "她"], ["bercerita", "讲述"], ["tentang rumah Mila", "关于 Mila 的家"], ["kepada temannya", "对她的朋友"], ["Ben", "人名"]], "b": "bercerita = ber- + cerita 故事", "g": "结构：bercerita tentang + 内容 + kepada + 听的人。kepada 接人。temannya, Ben = 她的朋友，（即）Ben（同位语，逗号后补充名字）。"}}, {"sp": "", "role": "r", "id": "Rumah Mila sangat bagus.", "zh": "Mila 的家非常漂亮。", "a": "fa8836a93856", "za": "747e5f1b5ad8", "an": {"p": [["Rumah Mila", "Mila 的家"], ["sangat", "非常"], ["bagus", "好、漂亮"]], "b": "", "g": "sangat + 形容词。形容词直接做谓语，不需要 adalah。"}}, {"sp": "", "role": "r", "id": "Ukurannya tidak terlalu besar.", "zh": "房子不算太大。", "a": "02f1fe4edd55", "za": "142efc9789ad", "an": {"p": [["Ukurannya", "它的大小"], ["tidak terlalu", "不太"], ["besar", "大"]], "b": "", "g": "-nya 指代前一句的 rumah Mila。tidak terlalu + 形容词 = 不太……。"}}, {"sp": "", "role": "r", "id": "Di depan rumah ada tempat parkir mobil.", "zh": "房子前面有停车位。", "a": "35f7bd512931", "za": "561f51deacf7", "an": {"p": [["Di depan rumah", "在房子前面"], ["ada", "有"], ["tempat parkir mobil", "停车处"]], "b": "parkir = 停车；tempat = 地方", "g": "结构：地点 + ada + 事物（存在句）。tempat parkir mobil = 地方 + 停车 + 汽车，核心词 tempat 在前，后面逐层修饰：停汽车的地方。"}}, {"sp": "", "role": "r", "id": "Rumahnya bercat hijau dan putih.", "zh": "房子刷成绿色和白色。", "a": "4a9d73150e1d", "za": "9a366dafa110", "an": {"p": [["Rumahnya", "她家的房子"], ["bercat", "刷着漆"], ["hijau", "绿"], ["dan", "和"], ["putih", "白"]], "b": "bercat = ber- + cat 油漆", "g": "ber- + 名词 = 有、带着……：bercat = 刷了漆。bercat hijau dan putih = 漆成绿白两色。"}}, {"sp": "", "role": "r", "id": "Genting rumahnya berwarna abu-abu.", "zh": "屋顶的瓦是灰色的。", "a": "c9512689062e", "za": "63d669651a58", "an": {"p": [["Genting", "瓦片、屋顶"], ["rumahnya", "她家的"], ["berwarna", "是……色"], ["abu-abu", "灰色"]], "b": "", "g": "Genting rumahnya = 名词 + 名词-nya（她家房子的屋顶）。abu-abu 重叠表示“灰色（的）”。"}}, {"sp": "", "role": "r", "id": "Rumahnya ber-AC.", "zh": "房子里有空调。", "a": "893d41d885c6", "za": "675f824a96a6", "an": {"p": [["Rumahnya", "她家的房子"], ["ber-AC", "有空调"]], "b": "AC = 空调（读 a-ce）", "g": "ber- + 缩写 = 带有……：ber-AC = 装有空调。缩写前加连字符。"}}, {"sp": "", "role": "r", "id": "Di depan rumah ada lahan untuk menanam tanaman.", "zh": "房子前面有一块种植物的空地。", "a": "9c35908f1932", "za": "0dc59b5b2638", "an": {"p": [["Di depan rumah", "在房子前面"], ["ada", "有"], ["lahan", "空地"], ["untuk menanam", "用来种"], ["tanaman", "植物"]], "b": "menanam = tanam + meN-；tanaman = tanam + -an", "g": "结构：地点 + ada + 名词 + untuk + 动词。lahan untuk menanam tanaman = 用来种植物的空地。tanam 种，tanaman = 种出来的东西（植物）。"}}, {"sp": "", "role": "r", "id": "Pintunya berwarna cokelat tua.", "zh": "门是深棕色的。", "a": "cbe6748719ab", "za": "0eb2f2b07eed", "an": {"p": [["Pintunya", "它的门"], ["berwarna", "是……色"], ["cokelat tua", "深棕色"]], "b": "", "g": "-nya 指代前面说的房子。cokelat = 巧克力色（棕），tua 本义“老”，放在颜色后表示深。"}}], "zh": "Meli 去了 Mila 在勿加泗（Bekasi）的家，她跟朋友 Ben 讲了 Mila 家的样子。Mila 的家很漂亮，不太大。房子前面有停车位。房子刷成绿白两色，屋顶瓦片是灰色的。房子里有空调。房子前面有一块种植物的空地。门是深棕色的。", "note": "", "qa": []}, {"id": "t49", "kind": "text", "book": "武功秘籍", "title": "海边度假 Liburan ke Pantai", "lines": [{"sp": "", "role": "r", "id": "Setiap liburan, Siti dan keluarganya pergi ke pantai.", "zh": "每逢假期，Siti 和家人都去海边。", "a": "3eca98d211da", "za": "bb51fae31361", "an": {"p": [["Setiap liburan", "每次假期"], ["Siti dan keluarganya", "Siti 和她的家人"], ["pergi ke pantai", "去海边"]], "b": "liburan = libur + -an", "g": "结构：时间 + 主语（A dan keluarganya）+ 谓语。keluarganya = 她的家人（-nya 指前面的 Siti）。"}}, {"sp": "", "role": "r", "id": "Mereka berangkat pagi-pagi dengan mobil.", "zh": "", "a": "13bdfa4044e0", "an": {"p": [["Mereka", "他们"], ["berangkat", "出发"], ["pagi-pagi", "一大早"], ["dengan mobil", "乘汽车"]], "b": "berangkat = ber- + angkat", "g": "pagi-pagi 重叠 = 大清早。dengan + 交通工具 = 乘……（也可用 naik）。berangkat = 出发。"}}, {"sp": "", "role": "r", "id": "Di pantai, mereka bermain pasir, berenang, dan bermain bola.", "zh": "在海边，他们玩沙子、游泳、踢球。", "a": "e2e642fa566d", "za": "8504cb3832c3", "an": {"p": [["Di pantai", "在海边"], ["mereka", "他们"], ["bermain pasir", "玩沙"], ["berenang", "游泳"], ["dan", "和"], ["bermain bola", "玩球"]], "b": "renang = 游泳；bola = 球", "g": "并列三个动作：A, B, dan C，最后一个前加 dan。bermain + 名词 = 玩/打……。berenang = ber- + renang，不及物动词。"}}, {"sp": "", "role": "r", "id": "Siti sangat senang melihat laut dan mendengar suara ombak.", "zh": "", "a": "f2209b81e958", "an": {"p": [["Siti", "人名"], ["sangat senang", "非常开心"], ["melihat laut", "看海"], ["dan", "和"], ["mendengar suara ombak", "听海浪声"]], "b": "laut = 海；ombak = 浪", "g": "结构：senang + 动词短语 = 因为做某事而开心（melihat… dan mendengar…）。suara ombak = 声音 + 浪。"}}, {"sp": "", "role": "r", "id": "Mereka juga membawa bekal untuk makan siang di tepi pantai.", "zh": "他们还带了便当，在海边吃午饭。", "a": "9064873730ba", "za": "8d561d882830", "an": {"p": [["Mereka", "他们"], ["juga", "也"], ["membawa", "带"], ["bekal", "干粮、便当"], ["untuk makan siang", "用于午餐"], ["di tepi pantai", "在海边"]], "b": "membawa = bawa + meN-；tepi = 边", "g": "juga 放在动词前：也……。untuk + 名词 = 用于……。di tepi pantai = 在海滩边（tepi = 边缘）。"}}, {"sp": "", "role": "r", "id": "Pada sore hari, Siti dan keluarganya duduk di bawah pohon sambil menikmati minuman dingin.", "zh": "", "a": "923fbd074aa3", "an": {"p": [["Pada sore hari", "在下午"], ["Siti dan keluarganya", "Siti 和家人"], ["duduk", "坐"], ["di bawah pohon", "在树下"], ["sambil", "一边"], ["menikmati", "享受"], ["minuman dingin", "冷饮"]], "b": "menikmati = nikmat + meN-…-i；minuman = minum + -an", "g": "sambil + 动词 = 一边……（同时进行）。di bawah = 在……下面。minuman = 喝的东西（饮料），-an 把动词变名词。dingin = 冷。"}}, {"sp": "", "role": "r", "id": "Siti merasa liburan di pantai sangat berkesan dan menyenangkan.", "zh": "", "a": "9312bb730f5d", "an": {"p": [["Siti merasa", "Siti 觉得"], ["liburan di pantai", "海边的假期"], ["sangat berkesan", "印象很深"], ["dan", "而且"], ["menyenangkan", "令人愉快"]], "b": "berkesan = ber- + kesan 印象", "g": "结构：merasa + 完整小句（liburan di pantai sangat berkesan…）。berkesan = 有印象的、难忘的。menyenangkan = 令人愉快的。"}}, {"sp": "", "role": "r", "id": "Mereka berharap bisa pergi ke pantai lagi minggu depan.", "zh": "", "a": "de2d61ade434", "an": {"p": [["Mereka", "他们"], ["berharap", "希望"], ["bisa pergi", "能去"], ["ke pantai", "去海边"], ["lagi", "再"], ["minggu depan", "下周"]], "b": "berharap = ber- + harap", "g": "berharap + (bisa +) 动词 = 希望（能）做……。lagi 放在动词后 = 再一次。"}}], "zh": "每到假期，Siti 和她的家人都会去海边。他们一大早就开车出发。在海边，他们玩沙子、游泳、玩球。Siti 看着大海、听着海浪声，非常开心。他们还带了自己做的便当，在海边吃午饭。下午，Siti 和家人坐在树下，一边享用冷饮。Siti 觉得在海边度假很难忘、很开心。他们希望下周还能再去海边。", "note": "", "qa": []}, {"id": "t50", "kind": "text", "book": "武功秘籍", "title": "逛传统市场 Pasar Tradisional", "lines": [{"sp": "", "role": "r", "id": "Kemarin pagi ibu mengajak saya ke pasar tradisional dekat rumah kami.", "zh": "昨天早上，妈妈带我去了我们家附近的传统市场。", "a": "64ba17c8cf6b", "za": "62df04f97852", "an": {"p": [["Kemarin pagi", "昨天早上"], ["ibu", "妈妈"], ["mengajak", "带、邀请"], ["saya", "我"], ["ke pasar tradisional", "到传统市场"], ["dekat rumah kami", "靠近我们家"]], "b": "mengajak = ajak + meN-", "g": "结构：时间 + 主语 + mengajak + 人 + ke + 地点。dekat rumah kami = 靠近我们家，修饰前面的 pasar。"}}, {"sp": "", "role": "r", "id": "Pasar itu sangat ramai seperti biasa, terutama di hari Minggu.", "zh": "市场像往常一样很热闹，尤其是星期天。", "a": "a544cb31960a", "za": "0d17727b06f9", "an": {"p": [["Pasar itu", "那个市场"], ["sangat ramai", "非常热闹"], ["seperti biasa", "和平常一样"], ["terutama", "尤其"], ["di hari Minggu", "在星期天"]], "b": "", "g": "itu 放名词后 = 那个。seperti biasa = 像平常一样。terutama + 时间/名词 = 尤其是……。ramai = 热闹、人多。"}}, {"sp": "", "role": "r", "id": "Ibu membeli banyak kebutuhan mingguan, termasuk beras, minyak goreng, dan bumbu dapur.", "zh": "妈妈买了很多一周要用的东西，包括大米、食用油和厨房调料。", "a": "8fd690ae010d", "za": "40646c67f360", "an": {"p": [["Ibu", "妈妈"], ["membeli", "买"], ["banyak", "很多"], ["kebutuhan mingguan", "每周的所需品"], ["termasuk", "包括"], ["beras", "大米"], ["minyak goreng", "食用油"], ["bumbu dapur", "厨房调料"]], "b": "kebutuhan = butuh + ke-…-an；mingguan = minggu + -an", "g": "结构：主谓宾 + termasuk + 并列举例（A, B, dan C）。termasuk = 包括。kebutuhan = 需要的东西。mingguan = 每周的。"}}, {"sp": "", "role": "r", "id": "Kami juga membeli berbagai macam buah segar seperti apel, jeruk, dan pisang.", "zh": "我们还买了各种新鲜水果，比如苹果、橘子和香蕉。", "a": "186e2ffc5216", "za": "a5f19366a232", "an": {"p": [["Kami", "我们"], ["juga", "也"], ["membeli", "买"], ["berbagai macam", "各种各样"], ["buah segar", "新鲜水果"], ["seperti", "例如"], ["apel", "苹果"], ["jeruk", "橙子"], ["pisang", "香蕉"]], "b": "", "g": "berbagai macam + 名词 = 各种……。seperti 在这里 = 比如（举例），后面列举。segar = 新鲜。"}}, {"sp": "", "role": "r", "id": "Saya membantu ibu membawa belanjaan yang cukup berat itu.", "zh": "我帮妈妈提那些挺重的东西。", "a": "fc7262d6ead5", "za": "39b5d9476f26", "an": {"p": [["Saya", "我"], ["membantu ibu", "帮妈妈"], ["membawa", "拿"], ["belanjaan", "买的东西"], ["yang cukup berat", "相当重的"], ["itu", "那些"]], "b": "belanjaan = belanja 购物 + -an", "g": "结构：membantu + 人 + 动词 + 宾语 + yang + 形容词 + itu。yang cukup berat 修饰 belanjaan，句尾 itu 指代“那些”。cukup + 形容词 = 相当……。"}}, {"sp": "", "role": "r", "id": "Sesampainya di rumah, kami menyimpan semua belanjaan di dapur.", "zh": "到家后，我们把买的东西都放进厨房。", "a": "de789a2f8461", "za": "ec854086fce3", "an": {"p": [["Sesampainya di rumah", "一到家"], ["kami", "我们"], ["menyimpan", "收好"], ["semua belanjaan", "所有买的东西"], ["di dapur", "在厨房"]], "b": "sesampainya = se- + sampai 到达 + -nya", "g": "Sesampainya di + 地点 = 一到达……（就）。se-…-nya 加在 sampai 上表示“刚一到”。menyimpan = 收起来放好。"}}, {"sp": "", "role": "r", "id": "Meskipun capek, saya senang bisa membantu ibu.", "zh": "虽然很累，但我很高兴能帮上妈妈。", "a": "5fc551a6904c", "za": "54317318d96b", "an": {"p": [["Meskipun", "虽然"], ["capek", "累"], ["saya senang", "我高兴"], ["bisa membantu", "能帮助"], ["ibu", "妈妈"]], "b": "capek = 累（口语，正式说 lelah）", "g": "结构：Meskipun + 形容词（省略主语），主句。senang + bisa + 动词 = 高兴能……。"}}], "zh": "昨天早上，妈妈带我去我们家附近的传统市场。和往常一样，市场非常热闹，尤其是星期天。妈妈买了很多一周要用的东西，包括大米、食用油和厨房调料。我们还买了各种新鲜水果，比如苹果、橘子和香蕉。我帮妈妈拎那些挺重的东西。一到家，我们就把买的东西都放进了厨房。虽然很累，但能帮到妈妈我很开心。", "note": "", "qa": []}, {"id": "t51", "kind": "text", "book": "武功秘籍", "title": "开学第一天 Hari Pertama Dina di Kampus", "lines": [{"sp": "", "role": "r", "id": "Hari ini adalah hari pertama Dina kuliah.", "zh": "", "a": "22dce7aa88b1", "an": {"p": [["Hari ini", "今天"], ["adalah", "是"], ["hari pertama", "第一天"], ["Dina kuliah", "Dina 上大学"]], "b": "pertama = 第一", "g": "结构：主语 + adalah + 名词短语。hari pertama Dina kuliah = Dina 上大学的第一天（名词 + 人 + 动词，一起修饰 hari）。"}}, {"sp": "", "role": "r", "id": "Dina bangun pagi-pagi karena dia tidak mau terlambat.", "zh": "", "a": "df56b80a7eff", "an": {"p": [["Dina", "人名"], ["bangun pagi-pagi", "一大早起床"], ["karena", "因为"], ["dia tidak mau", "她不想"], ["terlambat", "迟到"]], "b": "", "g": "结构：主句 + karena + 原因从句。tidak mau + 动词 = 不想（不愿意）。"}}, {"sp": "", "role": "r", "id": "Setelah sarapan, Dina berangkat ke kampus naik bus.", "zh": "", "a": "7e5808139904", "an": {"p": [["Setelah sarapan", "吃完早饭后"], ["Dina", "人名"], ["berangkat", "出发"], ["ke kampus", "去校园"], ["naik bus", "乘公交"]], "b": "kampus = 校园", "g": "Setelah + 名词/动词 = ……之后。naik + 交通工具 = 乘……。berangkat ke + 地点 = 出发去……。"}}, {"sp": "", "role": "r", "id": "Sesampainya di kampus, dia bertemu banyak mahasiswa baru.", "zh": "", "a": "3a5d2e9d462e", "an": {"p": [["Sesampainya di kampus", "一到校园"], ["dia", "她"], ["bertemu", "遇见"], ["banyak", "很多"], ["mahasiswa baru", "新生"]], "b": "bertemu = ber- + temu；mahasiswa = 大学生", "g": "Sesampainya di + 地点 = 一到……。bertemu + 人 = 遇到某人。banyak + 名词 = 很多，不加量词。"}}, {"sp": "", "role": "r", "id": "Mereka mengikuti kegiatan perkenalan dan mendengarkan penjelasan dari dosen.", "zh": "", "a": "9d1924458028", "an": {"p": [["Mereka", "他们"], ["mengikuti", "参加"], ["kegiatan perkenalan", "介绍（迎新）活动"], ["dan", "并"], ["mendengarkan", "听"], ["penjelasan", "讲解"], ["dari dosen", "来自讲师"]], "b": "kegiatan = giat + ke-…-an；perkenalan = kenal + per-…-an；penjelasan = jelas + pe-…-an", "g": "结构：主语 + 动词 1 + 宾语 1 + dan + 动词 2 + 宾语 2。mengikuti = 参加（跟着做）；mendengarkan = 专心听。penjelasan dari dosen = 老师的讲解。"}}, {"sp": "", "role": "r", "id": "Dina merasa sedikit gugup, tetapi juga bersemangat.", "zh": "", "a": "1159ff0b7975", "an": {"p": [["Dina merasa", "Dina 觉得"], ["sedikit", "有点"], ["gugup", "紧张"], ["tetapi", "但是"], ["juga", "也"], ["bersemangat", "有热情"]], "b": "semangat = 精神、热情；ber- = 有", "g": "结构：merasa + 形容词 1，tetapi juga + 形容词 2。sedikit + 形容词 = 有点……。tetapi juga = 但同时也。bersemangat = 充满干劲。"}}, {"sp": "", "role": "r", "id": "Pada waktu istirahat, dia berkenalan dengan beberapa teman baru.", "zh": "休息时，她认识了几个新朋友。", "a": "68de20aba3f0", "za": "313aa6e6e26d", "an": {"p": [["Pada waktu istirahat", "在休息时间"], ["dia", "她"], ["berkenalan", "相识"], ["dengan", "和"], ["beberapa", "几个"], ["teman baru", "新朋友"]], "b": "berkenalan = ber- + kenal + -an", "g": "berkenalan dengan + 人 = 和某人互相认识。beberapa + 名词 = 几个……。pada waktu + 名词 = 在……的时候。"}}, {"sp": "", "role": "r", "id": "Setelah acara selesai, Dina pulang dengan gembira dan tidak sabar untuk belajar minggu depan.", "zh": "", "a": "26c9f86d2b00", "an": {"p": [["Setelah", "之后"], ["acara", "活动"], ["selesai", "结束"], ["Dina", "人名"], ["pulang", "回家"], ["dengan gembira", "高兴地"], ["tidak sabar", "迫不及待"], ["untuk belajar", "去学习"], ["minggu depan", "下周"]], "b": "gembira = 高兴；sabar = 耐心", "g": "结构：Setelah + 主语 + selesai，主句：pulang dengan gembira dan tidak sabar untuk…。dengan + 形容词 = ……地。tidak sabar untuk + 动词 = 迫不及待想……（字面：没耐心去……）。"}}], "zh": "今天是 Dina 上大学的第一天。Dina 起得很早，因为她不想迟到。吃完早饭，Dina 坐公交车出发去学校。到了学校，她遇到了很多新同学。他们参加了互相认识的活动，听老师讲解。Dina 感到有点紧张，但也很兴奋。休息的时候，她认识了几个新朋友。活动结束后，Dina 高高兴兴地回家，很期待下周的学习。", "note": "", "qa": []}, {"id": "t52", "kind": "text", "book": "武功秘籍", "title": "我的家庭 Keluarga Saya", "lines": [{"sp": "", "role": "r", "id": "Keluarga saya terdiri dari enam orang.", "zh": "我家有六口人。", "a": "ccb6d189a7f0", "za": "9d395f741a57", "an": {"p": [["Keluarga saya", "我的家庭"], ["terdiri dari", "由……组成"], ["enam orang", "六个人"]], "b": "terdiri = ter- + diri", "g": "terdiri dari + 成员/数量 = 由……组成。数字 + orang = 几个人（orang 做“人”的量词）。"}}, {"sp": "", "role": "r", "id": "Ada ayah yang bekerja sebagai guru dan ada ibu yang mengurus rumah tangga.", "zh": "爸爸是老师，妈妈在家操持家务。", "a": "29339753f161", "za": "1f0f00a78d06", "an": {"p": [["Ada", "有"], ["ayah", "爸爸"], ["yang bekerja", "在工作的"], ["sebagai guru", "担任老师"], ["dan", "和"], ["ibu", "妈妈"], ["yang mengurus", "料理着"], ["rumah tangga", "家务、家庭"]], "b": "mengurus = urus + meN-", "g": "结构：Ada + 人 + yang + 谓语，dan ada + 人 + yang + 谓语。yang 在这里引出对前面名词的说明：有一位当老师的爸爸，有一位料理家务的妈妈。sebagai + 职业 = 担任。mengurus rumah tangga = 料理家务（家庭主妇）。"}}, {"sp": "", "role": "r", "id": "Saya memiliki dua kakak perempuan dan satu adik laki-laki.", "zh": "我有两个姐姐和一个弟弟。", "a": "dd9a7ce9d281", "za": "ff474256523c", "an": {"p": [["Saya", "我"], ["memiliki", "拥有"], ["dua kakak perempuan", "两个姐姐"], ["dan", "和"], ["satu adik laki-laki", "一个弟弟"]], "b": "memiliki = milik 所有 + meN-…-i", "g": "memiliki = punya 的正式说法。kakak = 哥哥/姐姐，adik = 弟弟/妹妹，后面加 perempuan（女）/ laki-laki（男）区分性别。"}}, {"sp": "", "role": "r", "id": "Ayah bekerja di sekolah di sekitar rumah kami.", "zh": "爸爸在我们家附近的学校工作。", "a": "1443bbfddb81", "za": "e2c4b05825bc", "an": {"p": [["Ayah", "爸爸"], ["bekerja", "工作"], ["di sekolah", "在学校"], ["di sekitar", "在……周围"], ["rumah kami", "我们家"]], "b": "sekitar = 周围", "g": "di sekitar + 地点 = 在……附近。两个 di 连用：di sekolah di sekitar rumah kami = 在我们家附近的学校（后一个 di 短语修饰前面的 sekolah）。"}}, {"sp": "", "role": "r", "id": "Ibu selalu memasak makanan enak untuk kami.", "zh": "妈妈总是给我们做好吃的。", "a": "7c2ce7c57340", "za": "3035a16de9d0", "an": {"p": [["Ibu", "妈妈"], ["selalu", "总是"], ["memasak", "做"], ["makanan enak", "好吃的食物"], ["untuk kami", "给我们"]], "b": "", "g": "selalu 放在动词前。untuk + 人 = 为了、给某人。makanan enak = 食物 + 好吃（名词 + 形容词）。"}}, {"sp": "", "role": "r", "id": "Kakak saya sudah punya dua anak yang lucu.", "zh": "我姐姐已经有两个可爱的孩子了。", "a": "b13565638da2", "za": "a12bba4b609f", "an": {"p": [["Kakak saya", "我的姐姐（哥哥）"], ["sudah", "已经"], ["punya", "有"], ["dua anak", "两个孩子"], ["yang lucu", "可爱的"]], "b": "lucu = 可爱、有趣", "g": "sudah + 动词 = 已经……。yang lucu 修饰 dua anak，意为“可爱的两个孩子”。"}}, {"sp": "", "role": "r", "id": "Setiap minggu kami berkumpul bersama untuk makan malam dan bercerita tentang aktivitas masing-masing.", "zh": "每周我们都聚在一起吃晚饭，聊聊各自的生活。", "a": "7ebe9b530343", "za": "89067be81e18", "an": {"p": [["Setiap minggu", "每周"], ["kami", "我们"], ["berkumpul bersama", "聚在一起"], ["untuk", "为了"], ["makan malam", "吃晚饭"], ["dan", "和"], ["bercerita", "讲述"], ["tentang aktivitas", "关于活动"], ["masing-masing", "各自"]], "b": "", "g": "结构：时间 + 主语 + 动词 + untuk + 动词 1 + dan + 动词 2 + tentang + 内容。untuk 后并列两个动作（吃晚饭、讲述）。masing-masing = 各自，放在名词后：aktivitas masing-masing = 各自的活动。"}}, {"sp": "", "role": "r", "id": "Kebersamaan dalam keluarga sangat berarti bagi kami.", "zh": "家人团聚对我们来说很重要。", "a": "aa6a5841761c", "za": "bfc22fe6c4bf", "an": {"p": [["Kebersamaan", "相处在一起"], ["dalam keluarga", "在家庭中"], ["sangat berarti", "非常有意义"], ["bagi kami", "对我们来说"]], "b": "kebersamaan = bersama 一起 + ke-…-an", "g": "结构：主语（名词 + dalam + 名词）+ sangat + 形容词性谓语 + bagi + 人。dalam keluarga 说明范围：家庭中的。bagi kami = 对我们来说。"}}], "zh": "我家一共六口人。爸爸是老师，妈妈操持家务。我有两个姐姐和一个弟弟。爸爸在我家附近的学校工作。妈妈总是给我们做好吃的饭菜。我姐姐已经有两个可爱的孩子了。每个星期我们都会聚在一起吃晚饭，聊聊各自的生活。家人在一起的时光对我们来说非常有意义。", "note": "", "qa": []}, {"id": "t53", "kind": "text", "book": "武功秘籍", "title": "我的新朋友 Putu Teman Baru Saya", "lines": [{"sp": "", "role": "r", "id": "Saya ingin memperkenalkan teman baru saya.", "zh": "我想介绍一下我的新朋友。", "a": "9136057e64a6", "za": "818a74b3a178", "an": {"p": [["Saya ingin", "我想"], ["memperkenalkan", "介绍"], ["teman baru saya", "我的新朋友"]], "b": "memperkenalkan = per- + kenal + meN-…-kan", "g": "memperkenalkan = 使……被认识，即介绍某人。teman baru saya = 名词 + 形容词 + 所属（核心词在前）。"}}, {"sp": "", "role": "r", "id": "Namanya Putu dan dia berasal dari Bali.", "zh": "他叫 Putu，来自巴厘岛。", "a": "93a10da7d0a2", "za": "1517ea175c51", "an": {"p": [["Namanya", "他的名字"], ["Putu", "人名"], ["dan", "而"], ["dia", "他"], ["berasal dari", "来自"], ["Bali", "巴厘岛"]], "b": "berasal = ber- + asal 来源", "g": "Namanya + 名字 = 他/她的名字叫……（-nya = 他的）。berasal dari + 地方 = 来自某地（比 dari 更正式）。"}}, {"sp": "", "role": "r", "id": "Sekarang Putu tinggal di Jakarta untuk kuliah.", "zh": "Putu 现在在雅加达上大学。", "a": "f3c6808b41e7", "za": "5b8091d682da", "an": {"p": [["Sekarang", "现在"], ["Putu", "人名"], ["tinggal", "住"], ["di Jakarta", "在雅加达"], ["untuk kuliah", "为了上大学"]], "b": "", "g": "untuk + 动词 = 为了……（目的）。tinggal 不及物，后接 di + 地点。"}}, {"sp": "", "role": "r", "id": "Usianya dua puluh satu tahun dan dia adalah mahasiswa di Universitas Indonesia.", "zh": "他二十一岁，是印度尼西亚大学的学生。", "a": "91cdac27a248", "za": "5cf6acd83a03", "an": {"p": [["Usianya", "他的年龄"], ["dua puluh satu", "二十一"], ["tahun", "岁"], ["dan", "而且"], ["dia adalah", "他是"], ["mahasiswa", "大学生"], ["di Universitas Indonesia", "在印度尼西亚大学"]], "b": "usia = 年龄", "g": "Usianya + 数字 + tahun = 他的年龄是……岁（usia 是较正式的“年龄”）。数字：dua puluh satu = 21（二 + 十 + 一）。mahasiswa di + 学校 = 某校的大学生。"}}, {"sp": "", "role": "r", "id": "Putu sangat suka memasak makanan tradisional Bali di waktu luang.", "zh": "Putu 空闲时很喜欢做巴厘岛的传统菜。", "a": "4b7792827a41", "za": "35381511a627", "an": {"p": [["Putu", "人名"], ["sangat suka", "非常喜欢"], ["memasak", "烹饪"], ["makanan tradisional Bali", "巴厘传统食物"], ["di waktu luang", "在空闲时间"]], "b": "", "g": "结构：suka + 动词 + 宾语（名词短语）+ 时间。makanan tradisional Bali = 食物 + 传统 + 巴厘（核心词在前）。waktu luang = 空闲时间。"}}, {"sp": "", "role": "r", "id": "Dia sering mengajari saya membuat makanan daerahnya.", "zh": "他常常教我做他家乡的菜。", "a": "89efdfda1f35", "za": "38e9e62d2805", "an": {"p": [["Dia", "他"], ["sering", "经常"], ["mengajari", "教（某人）"], ["saya", "我"], ["membuat", "做"], ["makanan daerahnya", "他家乡的食物"]], "b": "mengajari = ajar + meN-…-i；daerah = 地区", "g": "mengajari + 人 + 动词 = 教某人做某事。-i 后面接被教的人，mengajar 后面接教的内容。makanan daerahnya = 他家乡的美食。"}}, {"sp": "", "role": "r", "id": "Putu juga pandai menari dan sangat ramah kepada semua orang.", "zh": "Putu 还很会跳舞，对谁都很友善。", "a": "d0b159e81dd7", "za": "727c745d903c", "an": {"p": [["Putu", "人名"], ["juga", "也"], ["pandai", "擅长"], ["menari", "跳舞"], ["dan", "而且"], ["sangat ramah", "非常友好"], ["kepada", "对"], ["semua orang", "所有人"]], "b": "menari = tari + meN-", "g": "pandai + 动词 = 擅长做……。ramah kepada + 人 = 对某人友好。semua orang = 所有人。"}}, {"sp": "", "role": "r", "id": "Saya senang sekali punya teman baru seperti dia.", "zh": "我很高兴有他这样的新朋友。", "a": "c8787737885e", "za": "afe63b7e1544", "an": {"p": [["Saya", "我"], ["senang sekali", "非常开心"], ["punya", "有"], ["teman baru", "新朋友"], ["seperti dia", "像他这样的"]], "b": "", "g": "形容词 + sekali = 非常……（sekali 放在形容词后）。seperti + 人 = 像……这样的。"}}], "zh": "我想介绍一下我的新朋友。他叫 Putu，来自巴厘岛。现在 Putu 住在雅加达读大学。他今年二十一岁，是印度尼西亚大学的学生。Putu 空闲时非常喜欢做巴厘岛的传统菜，他经常教我做他家乡的菜。Putu 还很会跳舞，对所有人都很友善。有这样一位新朋友，我非常开心。", "note": "", "qa": []}, {"id": "t54", "kind": "text", "book": "武功秘籍", "title": "我的新朋友 Sarah Teman Baru Saya", "lines": [{"sp": "", "role": "r", "id": "Saya punya teman baru.", "zh": "我有一个新朋友。", "a": "0e4dd4107038", "za": "119a76d3497a", "an": {"p": [["Saya", "我"], ["punya", "有"], ["teman baru", "新朋友"]], "b": "", "g": "punya + 名词 = 有……。teman baru = 新朋友（形容词放在名词后面）。"}}, {"sp": "", "role": "r", "id": "Namanya Sarah.", "zh": "她叫 Sarah。", "a": "323498da4799", "za": "d308a629da89", "an": {"p": [["Namanya", "她的名字"], ["Sarah", "人名"]], "b": "", "g": "Namanya + 名字 = 她的名字叫……（-nya = 她的）。"}}, {"sp": "", "role": "r", "id": "Sarah berasal dari Inggris.", "zh": "Sarah 来自英国。", "a": "1c11cd0a4abd", "za": "d55b6bc16b70", "an": {"p": [["Sarah", "人名"], ["berasal dari", "来自"], ["Inggris", "英国"]], "b": "", "g": "berasal dari + 国家 = 来自某国。"}}, {"sp": "", "role": "r", "id": "Dia baik, ramah, dan suka menolong.", "zh": "她人很好，很友善，也乐于助人。", "a": "90371bcfa0cf", "za": "e7afe08283da", "an": {"p": [["Dia", "她"], ["baik", "善良"], ["ramah", "友好"], ["dan", "并且"], ["suka menolong", "乐于助人"]], "b": "menolong = tolong + meN-", "g": "并列：形容词, 形容词, dan 动词短语。suka + 动词 = 喜欢（乐于）做……。"}}, {"sp": "", "role": "r", "id": "Dia selalu menyapa kami.", "zh": "她总是跟我们打招呼。", "a": "331900eb05a7", "za": "88e32f898749", "an": {"p": [["Dia", "她"], ["selalu", "总是"], ["menyapa", "打招呼"], ["kami", "我们"]], "b": "menyapa = sapa + meN-", "g": "selalu 放在动词前。menyapa + 人 = 向某人打招呼。"}}, {"sp": "", "role": "r", "id": "Di kelas dia juga suka membantu temannya belajar.", "zh": "在课堂上她也喜欢帮同学学习。", "a": "451dc614ff5d", "za": "603bc84431e2", "an": {"p": [["Di kelas", "在课堂上"], ["dia", "她"], ["juga", "也"], ["suka membantu", "乐于帮助"], ["temannya", "她的同学"], ["belajar", "学习"]], "b": "", "g": "结构：membantu + 人 + 动词 = 帮某人做某事。temannya = 她的朋友（同学）。"}}, {"sp": "", "role": "r", "id": "Namun, Sarah agak cerewet.", "zh": "不过，Sarah 有点唠叨。", "a": "1bd1fcb25174", "za": "ce53900c09b8", "an": {"p": [["Namun", "然而"], ["Sarah", "人名"], ["agak", "有点"], ["cerewet", "唠叨、爱管事"]], "b": "", "g": "Namun 放句首引出转折（比 tetapi 更书面）。agak + 形容词 = 有点……。"}}, {"sp": "", "role": "r", "id": "Di pesta ulang tahunnya, Sarah menelepon semua orang agar datang tepat waktu.", "zh": "在她的生日派对上，Sarah 给每个人打电话，让大家准时到。", "a": "ada2eee76b37", "za": "b2d4b610c1f6", "an": {"p": [["Di pesta ulang tahunnya", "在她的生日派对上"], ["Sarah", "人名"], ["menelepon", "打电话给"], ["semua orang", "所有人"], ["agar", "为了让"], ["datang", "来"], ["tepat waktu", "准时"]], "b": "pesta = 派对；ulang tahun = 生日；menelepon = telepon + meN-", "g": "结构：场合状语 + 主语 + 动词 + 宾语 + agar + 动词短语。agar + 动词 = 为了让（他们）……。tepat waktu = 准时（tepat 准确）。ulang tahunnya：-nya = 她的。"}}, {"sp": "", "role": "r", "id": "Dia juga perfeksionis.", "zh": "她还是个完美主义者。", "a": "8d8fe2d5c531", "za": "7531a884e3c5", "an": {"p": [["Dia", "她"], ["juga", "也"], ["perfeksionis", "完美主义者"]], "b": "", "g": "juga + 名词谓语：她也是完美主义者。来自英语 perfectionist，-is 表示“……主义者”。"}}, {"sp": "", "role": "r", "id": "Dia mengatur sendiri dekorasi, makanan, dan minuman.", "zh": "她亲自安排装饰、食物和饮料。", "a": "080af4ac5528", "za": "7d03c3f72791", "an": {"p": [["Dia", "她"], ["mengatur", "安排"], ["sendiri", "亲自"], ["dekorasi", "装饰"], ["makanan", "食物"], ["dan", "和"], ["minuman", "饮料"]], "b": "mengatur = atur + meN-", "g": "sendiri 放在动词后表示“亲自、自己”。三个宾语并列：A, B, dan C。"}}, {"sp": "", "role": "r", "id": "Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "她希望派对完美，一点差错都没有。", "a": "5a3597d61046", "za": "cb5980dd8252", "an": {"p": [["Dia", "她"], ["ingin", "想"], ["acaranya", "她的活动"], ["sempurna", "完美"], ["dan", "而且"], ["tidak ada yang salah", "没有任何出错的"]], "b": "acara = 活动；salah = 错", "g": "结构：ingin + 完整小句（acaranya sempurna）。tidak ada yang + 形容词/动词 = 没有什么是……的：tidak ada yang salah = 没有任何错误。"}}], "zh": "我有一个新朋友，她叫 Sarah，来自英国。她人很好、很友善，也乐于助人。她总是主动跟我们打招呼。在课堂上她也喜欢帮同学学习。不过，Sarah 有点爱操心。在她的生日派对上，她给所有人打电话，让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排。她希望活动完美，不出任何差错。", "note": "", "qa": []}, {"id": "t55", "kind": "text", "book": "武功秘籍", "title": "周六去市图书馆 Ke Perpustakaan Kota", "lines": [{"sp": "", "role": "r", "id": "Pada hari Sabtu, Rudi pergi ke perpustakaan kota bersama temannya.", "zh": "星期六，Rudi 和朋友一起去了市图书馆。", "a": "37bae1327ebb", "za": "4d7b44dd09ee", "an": {"p": [["Pada hari Sabtu", "在星期六"], ["Rudi", "人名"], ["pergi ke", "去"], ["perpustakaan kota", "市图书馆"], ["bersama temannya", "和他的朋友一起"]], "b": "", "g": "perpustakaan kota = 图书馆 + 城市（市图书馆）。bersama + 人 = 和……一起。temannya = 他的朋友。"}}, {"sp": "", "role": "r", "id": "Mereka datang pada pukul sembilan pagi.", "zh": "", "a": "49f8b499b7f3", "an": {"p": [["Mereka", "他们"], ["datang", "来、到"], ["pada pukul sembilan pagi", "在早上九点"]], "b": "", "g": "pada + 时间点 = 在……（几点）。pukul sembilan = 九点。"}}, {"sp": "", "role": "r", "id": "Di perpustakaan, Rudi mencari buku tentang sejarah Indonesia.", "zh": "在图书馆里，Rudi 找关于印尼历史的书。", "a": "4195538cfe25", "za": "d0c8ed3be548", "an": {"p": [["Di perpustakaan", "在图书馆"], ["Rudi", "人名"], ["mencari", "寻找"], ["buku tentang sejarah", "关于历史的书"], ["Indonesia", "印尼"]], "b": "mencari = cari + meN-；sejarah = 历史", "g": "buku tentang + 主题 = 关于……的书。sejarah Indonesia = 历史 + 印尼 = 印尼的历史。"}}, {"sp": "", "role": "r", "id": "Temannya mencari buku cerita dan majalah.", "zh": "他的朋友找故事书和杂志。", "a": "65bcf434356a", "za": "c442d05e837f", "an": {"p": [["Temannya", "他的朋友"], ["mencari", "寻找"], ["buku cerita", "故事书"], ["dan", "和"], ["majalah", "杂志"]], "b": "", "g": "并列两个宾语：buku cerita dan majalah。buku cerita = 书 + 故事 = 故事书。"}}, {"sp": "", "role": "r", "id": "Suasana perpustakaan sangat tenang sehingga mereka bisa membaca dengan nyaman.", "zh": "图书馆里非常安静，所以他们可以舒舒服服地看书。", "a": "f005c0f9179d", "za": "c2865d99a3af", "an": {"p": [["Suasana perpustakaan", "图书馆的气氛"], ["sangat tenang", "非常安静"], ["sehingga", "所以、以至于"], ["mereka", "他们"], ["bisa membaca", "能阅读"], ["dengan nyaman", "舒适地"]], "b": "suasana = 气氛", "g": "结构：原因（Suasana… sangat tenang）+ sehingga + 结果（mereka bisa membaca…）。sehingga 连接结果，= 所以、以至于。dengan nyaman = 舒适地。"}}, {"sp": "", "role": "r", "id": "Setelah membaca selama dua jam, mereka meminjam beberapa buku untuk dibawa pulang.", "zh": "看了两个小时后，他们借了几本书带回家。", "a": "263c0fc8a60c", "za": "6610784f79f3", "an": {"p": [["Setelah membaca", "读完之后"], ["selama dua jam", "持续两小时"], ["mereka", "他们"], ["meminjam", "借"], ["beberapa buku", "几本书"], ["untuk dibawa pulang", "为了带回家"]], "b": "dibawa = di- + bawa；meminjam = pinjam + meN-", "g": "selama + 时间长度 = 持续……。untuk dibawa pulang = 为了被带回家（untuk + 被动），即“带回家去”。beberapa + 名词 = 几个……。"}}, {"sp": "", "role": "r", "id": "Sebelum pulang, mereka membeli minuman di toko dekat perpustakaan.", "zh": "", "a": "dd7388ef77fb", "an": {"p": [["Sebelum pulang", "回家之前"], ["mereka", "他们"], ["membeli", "买"], ["minuman", "饮料"], ["di toko", "在商店"], ["dekat perpustakaan", "靠近图书馆"]], "b": "", "g": "Sebelum + 动词 = ……之前。di toko dekat perpustakaan = 在图书馆附近的商店（dekat 短语修饰 toko）。"}}], "zh": "星期六，Rudi 和朋友一起去了市图书馆。他们早上九点到。在图书馆里，Rudi 找关于印尼历史的书，他的朋友找故事书和杂志。图书馆里很安静，所以他们可以舒舒服服地看书。看了两个小时后，他们借了几本书带回家。回家之前，他们在图书馆附近的商店买了饮料。", "note": "", "qa": []}, {"id": "t56", "kind": "text", "book": "BIPA 1", "title": "Ni Luh 的自我介绍（音频 2.1）", "lines": [{"sp": "", "role": "r", "id": "Kenalkan, nama saya Ni Luh Putu Riyandewi.", "zh": "你好，我叫 Ni Luh Putu Riyandewi。", "a": "eda531cdd12f", "za": "ba9660472063", "an": {"p": [["Kenalkan", "请认识一下（介绍用语）"], ["nama", "名字"], ["saya", "我"], ["Ni Luh Putu Riyandewi", "尼·卢·普图·里扬德薇（巴厘人名）"]], "b": "Kenalkan = kenal 认识 + -kan（祈使，让人认识）", "g": "结构：Kenalkan + 子句。Kenalkan 是自我介绍开场白，相当于“请允许我介绍”。Ni Luh 是巴厘女性名字前缀，Putu 表示排行第一。"}}, {"sp": "", "role": "r", "id": "Usia saya dua puluh empat tahun.", "zh": "我二十四岁。", "a": "8aa2d4fc4236", "za": "0b6efcd291eb", "an": {"p": [["Usia", "年龄"], ["saya", "我"], ["dua puluh empat", "二十四"], ["tahun", "岁、年"]], "b": "", "g": "结构：Usia + 人 + 数字 + tahun。说年龄用 Usia saya…… 或 Saya berusia……。dua puluh = 20。"}}, {"sp": "", "role": "r", "id": "Saya berasal dari Bali.", "zh": "我来自巴厘岛。", "a": "db6d14551293", "za": "3d6d175432f2", "an": {"p": [["Saya", "我"], ["berasal", "来自"], ["dari", "从"], ["Bali", "巴厘岛"]], "b": "berasal = ber- + asal 起源", "g": "结构：主语 + berasal dari + 地名。berasal dari = 来自、出身于。"}}, {"sp": "", "role": "r", "id": "Saya tinggal di Tabanan.", "zh": "我住在塔巴南。", "a": "d0e78cec1cc6", "za": "73a1f4998ee7", "an": {"p": [["Saya", "我"], ["tinggal", "居住"], ["di", "在"], ["Tabanan", "塔巴南（巴厘的县）"]], "b": "", "g": "结构：主语 + tinggal + di + 地点。tinggal 本意“留下”，常表示居住。"}}, {"sp": "", "role": "r", "id": "Saya mahasiswa.", "zh": "我是大学生。", "a": "4ca665463771", "za": "c9cdee5a3e64", "an": {"p": [["Saya", "我"], ["mahasiswa", "大学生"]], "b": "", "g": "结构：名词谓语，没有 adalah。mahasiswa = 大学生，siswa 是中小学生。"}}], "zh": "认识一下，我叫 Ni Luh Putu Riyandewi。我今年二十四岁，来自巴厘岛，住在塔巴南。我是大学生。", "note": "", "qa": [{"q": "Siapa nama lengkap Ni Luh?", "a": "Ni Luh Putu Riyandewi.", "qa": "4fb9a10cbea6", "aa": "b4c9027d3f79", "qz": "Ni Luh 的全名叫什么？", "az": "Ni Luh Putu Riyandewi。"}, {"q": "Ni Luh berasal dari mana?", "a": "Dari Bali.", "qa": "d93f8b0b5914", "aa": "f70042359462", "qz": "Ni Luh 来自哪里？", "az": "来自巴厘岛。"}, {"q": "Berapa usia Ni Luh?", "a": "Dua puluh empat tahun.", "qa": "65c245cf4d66", "aa": "fa141a14e933", "qz": "Ni Luh 多大了？", "az": "二十四岁。"}], "u": 2}, {"id": "t57", "kind": "text", "book": "BIPA 1", "title": "Ni Luh 的身份证（KTP）", "lines": [{"sp": "", "role": "r", "id": "KARTU TANDA PENDUDUK — Provinsi Bali, Kabupaten Tabanan.", "zh": "居民身份证——巴厘省，塔巴南县。", "a": "5b7b4201aaf8", "za": "362ff0dd7552", "an": {"p": [["KARTU", "卡"], ["TANDA", "标志"], ["PENDUDUK", "居民"], ["Provinsi", "省"], ["Bali", "巴厘"], ["Kabupaten", "县"], ["Tabanan", "塔巴南"]], "b": "penduduk = duduk 坐 + pen-（居住者）", "g": "结构：Kartu Tanda Penduduk（KTP）= 居民身份证，直译“居民标志卡”。Provinsi 省 > Kabupaten 县。"}}, {"sp": "", "role": "r", "id": "NIK: 3216064205950001.", "zh": "身份证号：3216064205950001。", "a": "68c27e79e425", "za": "be6de91db197", "an": {"p": [["NIK", "居民身份证号码（Nomor Induk Kependudukan）"], ["3216064205950001", "十六位号码"]], "b": "", "g": "NIK 是 16 位身份证号。前 6 位是地区码，接着 6 位是出生日期（女性日期加 40），所以 42 表示 2 日。"}}, {"sp": "", "role": "r", "id": "Nama: Ni Luh Putu Riyandewi.", "zh": "姓名：Ni Luh Putu Riyandewi。", "a": "c559bc5e2c79", "za": "df474d733aef", "an": {"p": [["Nama", "姓名"], ["Ni Luh Putu Riyandewi", "人名"]], "b": "", "g": "证件栏目：Nama = 姓名。"}}, {"sp": "", "role": "r", "id": "Tempat/Tgl Lahir: Tabanan, 02-05-1995.", "zh": "出生地/日期：塔巴南，1995年5月2日。", "a": "03b57216b862", "za": "fbda20a97990", "an": {"p": [["Tempat", "地点"], ["Tgl", "日期（tanggal 的缩写）"], ["Lahir", "出生"], ["Tabanan", "塔巴南"], ["02-05-1995", "1995年5月2日"]], "b": "lahir 出生", "g": "证件栏目：出生地点／日期。印尼日期顺序是 日-月-年，所以 02-05-1995 是 5 月 2 日。"}}, {"sp": "", "role": "r", "id": "Jenis Kelamin: Perempuan.", "zh": "性别：女。", "a": "6bc303f52d7c", "za": "af66170e60e3", "an": {"p": [["Jenis", "种类"], ["Kelamin", "性别"], ["Perempuan", "女性"]], "b": "kelamin = kawin 相关的性别词", "g": "栏目：性别。Laki-laki 男，Perempuan 女。"}}, {"sp": "", "role": "r", "id": "Gol.", "zh": "血型", "a": "57e640ddf0ab", "za": "304bba0473f6", "an": {"p": [["Gol.", "血型（Golongan 的缩写，“类别”）"]], "b": "", "g": "证件栏目缩写。Golongan Darah 血型，本句只念到 Gol.（和下一行连读）。"}}, {"sp": "", "role": "r", "id": "Darah: B.", "zh": "血型：B。", "a": "44489b0a4013", "za": "86deba84421d", "an": {"p": [["Darah", "血"], ["B", "B型"]], "b": "", "g": "接上一栏：Gol. Darah = 血型。B 念 /be/。"}}, {"sp": "", "role": "r", "id": "Alamat: Jalan Pulau Menjangan, RT/RW 003/010, Kel/Desa Dauh Peken, Kecamatan Tabanan.", "zh": "地址：Pulau Menjangan 路，RT/RW 003/010，Dauh Peken 村，塔巴南区。", "a": "32a33e5aa8d1", "za": "602128546421", "an": {"p": [["Alamat", "地址"], ["Jalan", "路"], ["Pulau Menjangan", "门贾冈岛（路名）"], ["RT/RW", "居民小组／居民区"], ["Kel/Desa", "街道／村"], ["Dauh Peken", "道·佩肯"], ["Kecamatan", "区"]], "b": "", "g": "结构：地址由小到大排列：路 > RT/RW（基层居民组织）> Kelurahan（城镇街道）／Desa（农村）> Kecamatan 区。RT = Rukun Tetangga，RW = Rukun Warga。"}}, {"sp": "", "role": "r", "id": "Agama: Hindu.", "zh": "宗教：印度教。", "a": "f61b0def5222", "za": "0f7dbf56567c", "an": {"p": [["Agama", "宗教"], ["Hindu", "印度教"]], "b": "", "g": "栏目：宗教。巴厘多数人信印度教。"}}, {"sp": "", "role": "r", "id": "Status Perkawinan: Belum Kawin.", "zh": "婚姻状况：未婚。", "a": "54a9352ac766", "za": "1411557e6f07", "an": {"p": [["Status", "状态"], ["Perkawinan", "婚姻"], ["Belum", "尚未"], ["Kawin", "结婚"]], "b": "perkawinan = per- + kawin + -an（名词化）", "g": "栏目：婚姻状况。belum + 动词 = 尚未……；Belum Kawin = 未婚，Kawin = 已婚。"}}, {"sp": "", "role": "r", "id": "Pekerjaan: Mahasiswa.", "zh": "职业：大学生。", "a": "ae0fcd909c89", "za": "99f64425662a", "an": {"p": [["Pekerjaan", "职业"], ["Mahasiswa", "大学生"]], "b": "pekerjaan = pe- + kerja + -an", "g": "栏目：职业。kerja 工作 → pekerjaan（工作、职业）。"}}, {"sp": "", "role": "r", "id": "Kewarganegaraan: WNI.", "zh": "国籍：印度尼西亚公民。", "a": "98ff8fc80231", "za": "f50dbc6aa1f3", "an": {"p": [["Kewarganegaraan", "国籍"], ["WNI", "印尼公民（Warga Negara Indonesia）"]], "b": "kewarganegaraan = ke- + warga 公民 + negara 国家 + -an", "g": "栏目：国籍。WNI 印尼公民，WNA（Warga Negara Asing）外国公民。"}}, {"sp": "", "role": "r", "id": "Berlaku Hingga: Seumur Hidup.", "zh": "有效期：终身。", "a": "acd472c5d1d6", "za": "24388e188a8b", "an": {"p": [["Berlaku", "有效"], ["Hingga", "直到"], ["Seumur Hidup", "终身"]], "b": "berlaku = ber- + laku；seumur = se- + umur 年龄", "g": "栏目：有效期。seumur hidup = 终身（一辈子），KTP 现在是长期有效。"}}], "zh": "居民身份证——巴厘省塔巴南县。身份证号：3216064205950001。姓名：Ni Luh Putu Riyandewi。出生地/日期：塔巴南，1995 年 5 月 2 日。性别：女。血型：B。地址：Pulau Menjangan 路，RT/RW 003/010，Dauh Peken 村，塔巴南区。宗教：印度教。婚姻状况：未婚。职业：大学生。国籍：印尼公民（WNI）。有效期：终身。", "note": "原书为身份证图片，已转成文字。生词：Jenis kelamin 性别；Kawin 结婚；WNI = Warga Negara Indonesia 印尼公民；Berlaku hingga 有效期至；Seumur hidup 终身。", "qa": [{"q": "Di mana alamat rumah Ni Luh?", "a": "Di Jalan Pulau Menjangan, Dauh Peken, Tabanan.", "qa": "f0148b6396d1", "aa": "c7892ee66a3b", "qz": "Ni Luh 家的地址在哪里？", "az": "在塔巴南 Dauh Peken 的 Pulau Menjangan 路。"}, {"q": "Apa agama Ni Luh?", "a": "Hindu.", "qa": "057e4e6e815b", "aa": "16d18bddf3c7", "qz": "Ni Luh 信什么宗教？", "az": "印度教。"}, {"q": "Apa pekerjaan Ni Luh?", "a": "Mahasiswa.", "qa": "78d37c9cce2c", "aa": "5f1ee25a8ba9", "qz": "Ni Luh 是做什么的？", "az": "大学生。"}, {"q": "Apa kewarganegaraan Ni Luh?", "a": "WNI (Indonesia).", "qa": "fdaf132bd651", "aa": "76c43d153abe", "qz": "Ni Luh 是哪国人？", "az": "印度尼西亚公民。"}, {"q": "Apa golongan darah Ni Luh?", "a": "B.", "qa": "4f33663e1070", "aa": "6185bfd0a51f", "qz": "Ni Luh 是什么血型？", "az": "B 型。"}], "u": 2}, {"id": "t58", "kind": "text", "book": "Daring", "title": "认识印尼名人", "lines": [{"sp": "", "role": "r", "id": "Kenalkan, ini Agnes Monica.", "zh": "介绍一下，这是 Agnes Monica。", "a": "462ea972f44b", "za": "9f7dd8b3b354", "an": {"p": [["Kenalkan", "请认识一下"], ["ini", "这位"], ["Agnes Monica", "艾格尼丝·莫妮卡（印尼歌手）"]], "b": "Kenalkan = kenal + -kan", "g": "结构：Kenalkan + ini + 人名。介绍别人用 ini = 这位是。"}}, {"sp": "", "role": "r", "id": "Dia penyanyi.", "zh": "她是歌手。", "a": "550813a1e059", "za": "edbd45c54589", "an": {"p": [["Dia", "她／他"], ["penyanyi", "歌手"]], "b": "penyanyi = nyanyi 唱歌 + pe-（……者）", "g": "结构：名词谓语，主语 + 职业，不需要 adalah。pe- 表示做某事的人。"}}, {"sp": "", "role": "r", "id": "Dia berasal dari Jakarta.", "zh": "她来自雅加达。", "a": "a1551e3d01c0", "za": "3777ecbfda4c", "an": {"p": [["Dia", "她"], ["berasal dari", "来自"], ["Jakarta", "雅加达"]], "b": "berasal = ber- + asal", "g": "结构：主语 + berasal dari + 地名。"}}, {"sp": "", "role": "r", "id": "Dia lahir tanggal 1 Juli 1986.", "zh": "她出生于1986年7月1日。", "a": "c81ccae378a2", "za": "a20d93c514b9", "an": {"p": [["Dia", "她"], ["lahir", "出生"], ["tanggal", "日（日期）"], ["1 Juli 1986", "1986年7月1日"]], "b": "", "g": "结构：主语 + lahir + tanggal + 日 月 年。印尼语日期顺序：日 + 月 + 年。"}}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Bapak Joko Widodo.", "zh": "介绍一下，这是佐科·维多多先生。", "a": "814321d93058", "za": "78f572c22dae", "an": {"p": [["Kenalkan", "请认识一下"], ["ini", "这位"], ["Bapak", "先生"], ["Joko Widodo", "佐科·维多多（前印尼总统）"]], "b": "", "g": "Bapak 是对男性的尊称，放在名字前。结构同前：Kenalkan, ini + 人名。"}}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Rudy Hartono.", "zh": "介绍一下，这是 Rudy Hartono。", "a": "c95823f0ed8b", "za": "26f70f5e827c", "an": {"p": [["Kenalkan", "请认识一下"], ["ini", "这位"], ["Rudy Hartono", "鲁迪·哈托诺（印尼羽毛球名将）"]], "b": "", "g": "结构同前：Kenalkan, ini + 人名。"}}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Nadiem Anwar Makarim.", "zh": "介绍一下，这是 Nadiem Anwar Makarim。", "a": "952d220da15b", "za": "d63c2cc3ac52", "an": {"p": [["Kenalkan", "请认识一下"], ["ini", "这位"], ["Nadiem Anwar Makarim", "纳迪姆·马卡里姆（Gojek 创始人，曾任教育部长）"]], "b": "", "g": "结构同前。"}}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Sri Mulyani Indrawati.", "zh": "介绍一下，这是 Sri Mulyani Indrawati。", "a": "015b50b704ac", "za": "7ac622a50a92", "an": {"p": [["Kenalkan", "请认识一下"], ["ini", "这位"], ["Sri Mulyani Indrawati", "斯里·穆尔亚尼（印尼财政部长）"]], "b": "", "g": "结构同前。"}}], "zh": "介绍一下，这是 Agnes Monica，她是歌手，来自雅加达，1986 年 7 月 1 日出生。/ 这是 Joko Widodo 先生（印尼前总统）。/ 这是 Rudy Hartono（羽毛球名将）。/ 这是 Nadiem Anwar Makarim（前教育部长）。/ 这是 Sri Mulyani Indrawati（财政部长）。", "note": "练习：仿照第一句，用“Dia …… Dia berasal dari …… Dia lahir tanggal ……”介绍其他人。", "qa": []}, {"id": "t59", "kind": "text", "book": "BIPA 1", "title": "Raden 的家（课文 3.1）", "lines": [{"sp": "", "role": "r", "id": "Ini keluarga Raden.", "zh": "这是 Raden 的家。", "a": "30fa8bcf7663", "za": "198a9b8b5dd4", "an": {"p": [["Ini", "这是"], ["keluarga", "家庭"], ["Raden", "拉登（人名）"]], "b": "keluarga = ke- + luarga", "g": "结构：Ini + 名词。“keluarga + 人名”表示某人的家。"}}, {"sp": "", "role": "r", "id": "Ada ayah, ibu, kakak perempuan, dan Raden.", "zh": "有爸爸、妈妈、姐姐和 Raden。", "a": "1109c2680984", "za": "30f6f93549cb", "an": {"p": [["Ada", "有"], ["ayah", "爸爸"], ["ibu", "妈妈"], ["kakak perempuan", "姐姐"], ["dan", "和"], ["Raden", "拉登"]], "b": "", "g": "结构：Ada + 并列名词。kakak = 哥哥／姐姐，加 perempuan 指明是女性。"}}, {"sp": "", "role": "r", "id": "Orang tua Raden namanya Dedi dan Heni.", "zh": "Raden 的父母叫 Dedi 和 Heni。", "a": "c8509495bd3d", "za": "e37613f10fc6", "an": {"p": [["Orang tua", "父母"], ["Raden", "拉登"], ["namanya", "（他们的）名字"], ["Dedi", "德迪"], ["Heni", "赫尼"], ["dan", "和"]], "b": "namanya = nama + -nya", "g": "结构：Orang tua Raden（拉登的父母）+ namanya + 名字。名词 + 人名表示所属，不用 punya；-nya 指代前面的人。"}}, {"sp": "", "role": "r", "id": "Raden punya kakak perempuan.", "zh": "Raden 有一个姐姐。", "a": "51ce3c3d15e6", "za": "ca65c8defe13", "an": {"p": [["Raden", "拉登"], ["punya", "有"], ["kakak perempuan", "姐姐"]], "b": "", "g": "结构：主语 + punya + 宾语。punya 是口语“有”，也可说 mempunyai。"}}, {"sp": "", "role": "r", "id": "Namanya Rara.", "zh": "她叫 Rara。", "a": "1a3e15728180", "za": "b502754e46e6", "an": {"p": [["Namanya", "她的名字"], ["Rara", "拉拉"]], "b": "namanya = nama + -nya", "g": "结构：-nya 指前一句的那个人。"}}, {"sp": "", "role": "r", "id": "Rara menikah dengan Bayu.", "zh": "Rara 嫁给了 Bayu。", "a": "cdda21f90b69", "za": "3c662643bee5", "an": {"p": [["Rara", "拉拉"], ["menikah", "结婚"], ["dengan", "和"], ["Bayu", "巴尤"]], "b": "menikah = meN- + nikah", "g": "结构：主语 + menikah dengan + 人。menikah 是不及物，“和某人结婚”用 dengan。"}}, {"sp": "", "role": "r", "id": "Bayu menjadi kakak ipar Raden.", "zh": "Bayu 成了 Raden 的姐夫。", "a": "3999d5d5d2e8", "za": "24e50a533074", "an": {"p": [["Bayu", "巴尤"], ["menjadi", "成为"], ["kakak ipar", "姐夫"], ["Raden", "拉登"]], "b": "menjadi = meN- + jadi", "g": "结构：主语 + menjadi + 名词。ipar = 配偶的兄弟姐妹或姐妹的丈夫，kakak ipar 对拉登而言是姐夫。"}}, {"sp": "", "role": "r", "id": "Raden punya keponakan.", "zh": "Raden 有一个外甥女。", "a": "902be41ede14", "za": "0e69e3b78553", "an": {"p": [["Raden", "拉登"], ["punya", "有"], ["keponakan", "侄子／外甥"]], "b": "", "g": "结构：主语 + punya + 名词。keponakan 不分性别，指兄弟姐妹的孩子。"}}, {"sp": "", "role": "r", "id": "Namanya Tika.", "zh": "她叫 Tika。", "a": "5c5cd18d6196", "za": "7ed5f1285324", "an": {"p": [["Namanya", "她的名字"], ["Tika", "蒂卡"]], "b": "namanya = nama + -nya", "g": "结构：-nya 指代前一句的人。"}}, {"sp": "", "role": "r", "id": "Tika memanggil orang tua Raden dengan sebutan kakek dan nenek.", "zh": "Tika 称呼 Raden 的父母为外公和外婆。", "a": "adb64c1dc355", "za": "e983a039c63e", "an": {"p": [["Tika", "蒂卡"], ["memanggil", "称呼"], ["orang tua Raden", "拉登的父母"], ["dengan sebutan", "以……的称呼"], ["kakek", "爷爷"], ["nenek", "奶奶"]], "b": "memanggil = meN- + panggil；sebutan = sebut 称 + -an", "g": "结构：主语 + memanggil + 宾语 + dengan sebutan + 称谓。dengan sebutan = 用……这个称谓。"}}], "zh": "这是 Raden 的家。有爸爸、妈妈、姐姐和 Raden。Raden 的父母叫 Dedi 和 Heni。Raden 有一个姐姐，叫 Rara。Rara 嫁给了 Bayu，Bayu 就成了 Raden 的姐夫。Raden 有一个外甥女，叫 Tika。Tika 称呼 Raden 的父母为爷爷和奶奶（外公外婆）。", "note": "", "qa": [{"q": "Ada berapa orang dalam foto keluarga Raden?", "a": "Ada empat orang.", "qa": "3d236eaaaa31", "aa": "48539276f6ab", "qz": "Raden 的全家福里有几个人？", "az": "有四个人。"}, {"q": "Siapa saja nama anggota keluarga Raden?", "a": "Dedi, Heni, Rara, dan Raden (juga Bayu dan Tika).", "qa": "bf67d2a64c4a", "aa": "b02974f487b2", "qz": "Raden 家里人都叫什么名字？", "az": "Dedi、Heni、Rara 和 Raden（还有 Bayu 和 Tika）。"}, {"q": "Dedi menikah dengan siapa?", "a": "Dengan Heni.", "qa": "d143205b93b2", "aa": "f0c739e16688", "qz": "Dedi 和谁结婚了？", "az": "和 Heni。"}, {"q": "Apa hubungan Dedi dan Heni dengan Tika?", "a": "Mereka kakek dan nenek Tika.", "qa": "34f823e45a0e", "aa": "1d40def0d027", "qz": "Dedi 和 Heni 跟 Tika 是什么关系？", "az": "他们是 Tika 的外公外婆。"}, {"q": "Apakah Raden sudah menikah?", "a": "Belum.", "qa": "a18f3128261b", "aa": "7cb4158bcaa7", "qz": "Raden 结婚了吗？", "az": "还没有。"}], "u": 3}, {"id": "t60", "kind": "text", "book": "BIPA 1", "title": "生日礼物（课文 4.1）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Mega.", "zh": "我叫 Mega。", "a": "5fe26f1a8f1c", "za": "7e13b6555007", "an": {"p": [["Nama", "名字"], ["saya", "我"], ["Mega", "梅嘉"]], "b": "", "g": "结构：Nama saya + 名字，最基本的自我介绍。"}}, {"sp": "", "role": "r", "id": "Saya anak kedua dari tiga bersaudara.", "zh": "我是三个兄弟姐妹中的老二。", "a": "026f8589dba2", "za": "03634f5111d9", "an": {"p": [["Saya", "我"], ["anak", "孩子"], ["kedua", "第二"], ["dari", "（三个）当中"], ["tiga", "三"], ["bersaudara", "兄弟姐妹"]], "b": "kedua = ke- + dua；bersaudara = ber- + saudara", "g": "结构：主语 + anak + ke-序数 + dari + 数字 + bersaudara。ke-dua = 第二；tiga bersaudara = 兄弟姐妹三人。"}}, {"sp": "", "role": "r", "id": "Saya lahir pada tanggal 2 Mei 1996.", "zh": "我出生于1996年5月2日。", "a": "179b97a2c6bc", "za": "fa00d894813c", "an": {"p": [["Saya", "我"], ["lahir", "出生"], ["pada tanggal", "在……日"], ["2 Mei 1996", "1996年5月2日"]], "b": "", "g": "结构：主语 + lahir + pada tanggal + 日 月 年。pada 用于时间点。"}}, {"sp": "", "role": "r", "id": "Tahun ini saya merayakan ulang tahun yang ke-23 di restoran.", "zh": "今年我在餐厅过了23岁生日。", "a": "8c05488b86fb", "za": "0c9f446afc69", "an": {"p": [["Tahun ini", "今年"], ["saya", "我"], ["merayakan", "庆祝"], ["ulang tahun", "生日"], ["yang ke-23", "第23个"], ["di restoran", "在餐厅"]], "b": "merayakan = meN- + rayakan(raya 节日 + -kan)；ulang tahun = 重复一年", "g": "结构：时间 + 主语 + merayakan + 宾语 + yang ke-23（修饰 ulang tahun）+ 地点。yang ke-23 = 第23个的，即 23 岁生日。"}}, {"sp": "", "role": "r", "id": "Teman-teman saya memberi hadiah sebuah jam tangan.", "zh": "朋友们送了我一块手表。", "a": "7f5f3932df02", "za": "4a635af18201", "an": {"p": [["Teman-teman", "朋友们"], ["saya", "我的"], ["memberi", "给"], ["hadiah", "礼物"], ["sebuah", "一个"], ["jam tangan", "手表"]], "b": "memberi = meN- + beri；teman-teman 重叠表复数", "g": "结构：主语 + memberi + 宾语（hadiah）+ 具体物品。sebuah = 一件（量词 buah）。jam tangan = 手上的钟。"}}, {"sp": "", "role": "r", "id": "Keluarga saya memberi hadiah peralatan melukis.", "zh": "家人送了我一套画画工具。", "a": "511d64a9d153", "za": "915c34d8a3c3", "an": {"p": [["Keluarga saya", "我的家人"], ["memberi", "给"], ["hadiah", "礼物"], ["peralatan", "用具"], ["melukis", "画画"]], "b": "peralatan = per- + alat + -an（成套器具）；melukis = meN- + lukis", "g": "结构：主语 + memberi hadiah + 物品。peralatan melukis = 绘画用具。"}}, {"sp": "", "role": "r", "id": "Saat ini saya berkuliah di Jurusan Seni Lukis.", "zh": "我现在在读绘画专业。", "a": "63fc3e2afe0b", "za": "47c1422c80ee", "an": {"p": [["Saat ini", "目前"], ["saya", "我"], ["berkuliah", "上大学"], ["di", "在"], ["Jurusan", "专业"], ["Seni Lukis", "绘画艺术"]], "b": "berkuliah = ber- + kuliah；seni lukis = 艺术 + 画", "g": "结构：时间 + 主语 + berkuliah + di + 专业。berkuliah 比 kuliah 更常用于“正在上大学”。"}}, {"sp": "", "role": "r", "id": "Seandainya lulus kuliah nanti, saya ingin menjadi pelukis.", "zh": "等大学毕业以后，我想当一名画家。", "a": "5d6c29bb4b39", "za": "9c2bc10e2522", "an": {"p": [["Seandainya", "假如"], ["lulus", "毕业"], ["kuliah", "大学"], ["nanti", "以后"], ["saya", "我"], ["ingin", "想"], ["menjadi", "成为"], ["pelukis", "画家"]], "b": "seandainya = se- + andai；pelukis = pe- + lukis", "g": "结构：Seandainya + 条件（lulus kuliah nanti）, 主句（saya ingin menjadi pelukis）。seandainya 表示假设，语气较委婉；pe- 表示“……的人”。"}}], "zh": "我叫 Mega，是家里三个孩子中的老二。我出生于 1996 年 5 月 2 日。今年我在餐厅庆祝了 23 岁生日。朋友们送了我一块手表，家人送了我一套绘画工具。我现在在读绘画专业。假如将来毕业了，我想当一名画家。", "note": "", "qa": [{"q": "Berapa jumlah saudara Mega?", "a": "Dua orang.", "qa": "c366266875f9", "aa": "a3c05bf72388", "qz": "Mega 有几个兄弟姐妹？", "az": "两个。"}, {"q": "Tanggal berapa Mega lahir?", "a": "Tanggal 2 Mei 1996.", "qa": "806800117cf0", "aa": "53d1f8f391ef", "qz": "Mega 是几号出生的？", "az": "1996年5月2日。"}, {"q": "Bagaimana Mega merayakan ulang tahunnya tahun ini?", "a": "Di restoran, ulang tahun yang ke-23.", "qa": "2cb9b5d464f5", "aa": "6887234cf3ef", "qz": "Mega 今年怎么过生日的？", "az": "在餐厅过的，23岁生日。"}, {"q": "Apa hadiah dari keluarga Mega?", "a": "Peralatan melukis.", "qa": "681583023128", "aa": "6e7b242f8537", "qz": "Mega 家人送了什么礼物？", "az": "画画工具。"}, {"q": "Apa hadiah dari teman-temannya?", "a": "Sebuah jam tangan.", "qa": "67f0cfa72a6d", "aa": "8ae81170d2d2", "qz": "她的朋友们送了什么礼物？", "az": "一块手表。"}, {"q": "Apa harapan Mega?", "a": "Menjadi pelukis.", "qa": "773b1f9c7288", "aa": "1112bdbe5819", "qz": "Mega 的愿望是什么？", "az": "当画家。"}], "u": 4}, {"id": "t61", "kind": "text", "book": "BIPA 1", "title": "Lia 的生日准备（课文 4.2）", "lines": [{"sp": "", "role": "r", "id": "Lia lahir pada tanggal 10 Oktober 1994.", "zh": "Lia 出生于1994年10月10日。", "a": "a660ae5ef5b8", "za": "875c3e43c591", "an": {"p": [["Lia", "莉娅"], ["lahir", "出生"], ["pada tanggal", "在……日"], ["10 Oktober 1994", "1994年10月10日"]], "b": "", "g": "结构：主语 + lahir + pada tanggal + 日期。"}}, {"sp": "", "role": "r", "id": "Tahun ini Lia berulang tahun yang ke-25.", "zh": "今年 Lia 满25岁。", "a": "31902e16e68c", "za": "e5a5ae1e96b4", "an": {"p": [["Tahun ini", "今年"], ["Lia", "莉娅"], ["berulang tahun", "过生日"], ["yang ke-25", "第25个"]], "b": "berulang tahun = ber- + ulang tahun", "g": "结构：时间 + 主语 + berulang tahun + yang ke-N。berulang tahun 是动词“过生日”，yang ke-25 = 25 岁。"}}, {"sp": "", "role": "r", "id": "Bulan depan hari ulang tahun Lia.", "zh": "下个月是 Lia 的生日。", "a": "4b21966965cf", "za": "b39d6ac8a9a4", "an": {"p": [["Bulan depan", "下个月"], ["hari", "日"], ["ulang tahun", "生日"], ["Lia", "莉娅"]], "b": "", "g": "结构：时间 + 名词谓语。hari ulang tahun Lia = 莉娅的生日（名词 + 所属者）。"}}, {"sp": "", "role": "r", "id": "Lia menyiapkan pesta ulang tahunnya minggu ini.", "zh": "Lia 这周在准备她的生日派对。", "a": "69168f89c5e9", "za": "ad4f89c6b6e0", "an": {"p": [["Lia", "莉娅"], ["menyiapkan", "筹备"], ["pesta", "派对"], ["ulang tahunnya", "她的生日"], ["minggu ini", "本周"]], "b": "menyiapkan = meN- + siap + -kan；ulang tahunnya = ulang tahun + -nya", "g": "结构：主语 + menyiapkan + 宾语 + 时间。-kan 构成使役：使……准备好。-nya 指 Lia 本人。"}}, {"sp": "", "role": "r", "id": "Kemarin Lia mengirim undangan ulang tahun.", "zh": "昨天 Lia 发出了生日邀请。", "a": "437cec14e59e", "za": "a6ff21ddc8ca", "an": {"p": [["Kemarin", "昨天"], ["Lia", "莉娅"], ["mengirim", "寄、发送"], ["undangan", "请柬"], ["ulang tahun", "生日"]], "b": "mengirim = meN- + kirim；undangan = undang 邀请 + -an", "g": "结构：时间 + 主语 + mengirim + 宾语。印尼语动词不变时态，靠时间词（kemarin）表示过去。"}}, {"sp": "", "role": "r", "id": "Besok Lia akan membeli baju ulang tahun.", "zh": "明天 Lia 要去买生日穿的衣服。", "a": "732df4dc4bbd", "za": "8c87c608e175", "an": {"p": [["Besok", "明天"], ["Lia", "莉娅"], ["akan", "将要"], ["membeli", "买"], ["baju", "衣服"], ["ulang tahun", "生日"]], "b": "membeli = meN- + beli", "g": "结构：时间 + 主语 + akan + 动词 + 宾语。akan 表示将来。baju ulang tahun = 生日穿的衣服。"}}, {"sp": "", "role": "r", "id": "Lusa Lia akan pergi ke toko kue.", "zh": "后天 Lia 要去蛋糕店。", "a": "b0c357cf9836", "za": "a90774fa10e0", "an": {"p": [["Lusa", "后天"], ["Lia", "莉娅"], ["akan", "将要"], ["pergi", "去"], ["ke", "到"], ["toko kue", "蛋糕店"]], "b": "", "g": "结构：时间 + 主语 + akan pergi ke + 地点。注意：kemarin 昨天，besok 明天，lusa 后天。"}}], "zh": "Lia 出生于 1994 年 10 月 10 日，今年过 25 岁生日。下个月就是她的生日。Lia 这周在准备她的生日派对。昨天她寄出了生日请柬，明天要去买生日穿的衣服，后天要去蛋糕店。", "note": "", "qa": [{"q": "Kapan Lia lahir?", "a": "Tanggal 10 Oktober 1994.", "qa": "34902f49b327", "aa": "8a8b143306a4", "qz": "Lia 什么时候出生的？", "az": "1994年10月10日。"}, {"q": "Tahun ini Lia berulang tahun yang ke berapa?", "a": "Yang ke-25.", "qa": "416349ead8d0", "aa": "ab46b1d806aa", "qz": "Lia 今年过几岁生日？", "az": "25岁。"}, {"q": "Apa yang Lia lakukan kemarin?", "a": "Mengirim undangan ulang tahun.", "qa": "7eb6f04
