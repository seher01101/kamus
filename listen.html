<style>[hidden]{display:none!important}
:root{--prac:#5856d6;--prac-soft:#ecebfc;--learn:#0071e3;--learn-soft:#e4f0fd;--navh:62px}

:root[data-theme="dark"]{--prac:#7d7aff;--prac-soft:#24234d;--learn:#0a84ff;--learn-soft:#0a2e4d}

}
.player{bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))!important;padding-bottom:8px!important}@media (min-width:900px){.player{left:210px!important;bottom:0!important;padding-bottom:12px!important}}
:root{
  --ground:#f2f2f7; --surface:#ffffff; --surface-2:#e5e5ea;
  --ink:#1c1c1e; --ink-soft:#3a3a3c; --muted:#8e8e93; --line:#d1d1d6;
  --accent:#0071e3; --accent-soft:#e4f0fd; --on-accent:#ffffff;
  --good:#248a3d; --good-soft:#e3f5e8; --gold:#5856d6; --gold-soft:#ecebfc;
  --purple:#8944ab; --purple-soft:#f1e5f8;
  --font-display:"Newsreader","Microsoft YaHei","PingFang SC",Georgia,serif;
  --font-body:"IBM Plex Sans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --cjk:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --glass:color-mix(in srgb,var(--surface) 72%,transparent);
  --glass-border:color-mix(in srgb,var(--ink) 11%,transparent);
  --glass-hi:color-mix(in srgb,white 30%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --accent:#0a84ff;--accent-soft:#0a2e4d;--good:#30d158;--good-soft:#123320;--gold:#7d7aff;--gold-soft:#24234d;--purple:#bf5af2;--purple-soft:#33143d;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --accent:#0a84ff;--accent-soft:#0a2e4d;--good:#30d158;--good-soft:#123320;--gold:#7d7aff;--gold-soft:#24234d;--purple:#bf5af2;--purple-soft:#33143d;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(620px 500px at 6% -6%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%),
  radial-gradient(700px 600px at 106% 12%,color-mix(in srgb,var(--purple) 18%,transparent),transparent 60%),
  radial-gradient(560px 520px at 46% 118%,color-mix(in srgb,var(--good) 14%,transparent),transparent 62%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px 0}
.bar{border-radius:20px;padding:14px 16px 12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--font-body);font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.brand a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500}
.seg{display:flex;gap:4px;margin-top:10px;padding:3px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--ink-soft);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:14px 4px 0}
.hint b{color:var(--ink-soft)}
#list{display:grid;gap:10px;padding-block:6px 120px}
.grp{font-family:var(--cjk);font-size:15px;font-weight:700;margin:14px 4px 0;display:flex;align-items:baseline;gap:8px}
.grp small{font-size:12px;font-weight:400;color:var(--muted)}
.card{display:flex;align-items:center;gap:12px;border-radius:16px;padding:13px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.card .t{font-weight:600;font-size:15.5px;font-family:var(--cjk)}
.card .m{font-size:12px;color:var(--muted);margin-top:1px}
.card .go{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.book{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.book.wg{background:var(--gold-soft);color:var(--gold)}
.book.b2{background:var(--good-soft);color:var(--good)}
.book.dr{background:var(--purple-soft);color:var(--purple)}
.done{font-size:12px;color:var(--good);font-weight:600}
.pbtn{width:38px;height:38px;border-radius:99px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:0;flex-shrink:0}
.pbtn svg{width:16px;height:16px}
/* detail */
#detail{padding-block:14px 150px}
.back{font:inherit;font-size:14px;color:var(--accent);background:none;border:0;padding:4px 2px;cursor:pointer;font-weight:500}
.dh{margin:6px 4px 12px}
.dh h2{font-family:var(--cjk);font-size:21px;margin:4px 0 2px}
.dh .m{font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.tog{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--glass-border);background:var(--glass);color:var(--ink-soft);border-radius:99px;padding:5px 12px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lines{display:grid;gap:8px}
#detail .ln{cursor:pointer;-webkit-tap-highlight-color:transparent}
#detail .ln:active{transform:scale(.995)}
.ln{border-radius:14px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;transition:box-shadow .2s,border-color .2s}
.ln.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.ln .lp{width:32px;height:32px;border-radius:99px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;grid-row:span 3}
.ln .lp svg{width:14px;height:14px}
.sp{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.sp.q{color:var(--gold)} .sp.a{color:var(--good)}
.id{font-family:var(--font-display);font-size:17.5px;line-height:1.45;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.zh{font-family:var(--cjk);font-size:13.5px;color:var(--ink-soft);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.hid{filter:blur(6px);user-select:none;opacity:.75}
.hid::after{content:""}
.id a{color:inherit;text-decoration:none;border-radius:3px}
.id a:hover{background:var(--accent-soft);color:var(--accent)}
.para{margin-top:12px;border-radius:14px;padding:12px 14px;font-family:var(--cjk);font-size:14px;color:var(--ink-soft)}
.para b{color:var(--ink)}
.note{font-size:12.5px;color:var(--gold);margin:8px 4px}
.qa h3{font-size:15px;margin:18px 4px 8px;font-family:var(--cjk)}
.count{display:inline-block;min-width:26px;text-align:center;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
/* player — liquid glass */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.player>*{pointer-events:auto}
.lg{position:relative;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.34));
  backdrop-filter:blur(30px) saturate(190%) brightness(1.04);-webkit-backdrop-filter:blur(30px) saturate(190%) brightness(1.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.55),0 1px 2px rgba(30,40,110,.06),0 14px 40px rgba(40,50,140,.16)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:-1;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,255,255,.12) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg{background:linear-gradient(160deg,rgba(70,72,86,.52),rgba(28,28,34,.46));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.10),0 14px 44px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .lg::before{background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 40%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.18))}}
:root[data-theme="dark"] .lg{background:linear-gradient(160deg,rgba(70,72,86,.52),rgba(28,28,34,.46));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.10),0 14px 44px rgba(0,0,0,.5)}
:root[data-theme="dark"] .lg::before{background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 40%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.18))}
.player .in{max-width:400px;margin:0 auto;border-radius:30px;padding:6px 10px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;overflow:hidden}
.prog{position:absolute;left:36px;right:36px;top:3px;height:2px;border-radius:2px;background:transparent;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.ctl{width:42px;height:42px;border-radius:99px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s}
.ctl:active{transform:scale(.84);transition-duration:.12s}
.ctl svg{width:18px;height:18px}
.ctl.main{width:48px;height:48px;color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:none}
.ctl.main svg{width:19px;height:19px}
.ctl.side{width:52px;height:38px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;font-family:var(--cjk);background:transparent;color:var(--ink-soft)}
.ctl.side[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.ctl .pop{display:grid;place-items:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
/* mode menu */
.scrim{position:fixed;inset:0;z-index:-1;background:transparent}
.menu{position:absolute;bottom:calc(100% - 2px);left:max(16px,calc(50% - 200px));width:236px;border-radius:22px;padding:6px;
  opacity:0;transform:translateY(14px) scale(.55);transform-origin:18% 100%;pointer-events:none;filter:blur(4px);
  transition:transform .42s cubic-bezier(.32,1.4,.6,1),opacity .22s,filter .3s}
.menu.open{opacity:1;transform:none;pointer-events:auto;filter:none}
.menu .h{font-size:11.5px;color:var(--muted);padding:6px 12px 4px;font-family:var(--cjk)}
.mi{display:grid;grid-template-columns:28px 1fr 18px;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;
  padding:9px 10px;border-radius:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.mi:active{transform:scale(.97);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.mi svg{width:20px;height:20px}
.mi b{display:block;font-size:14.5px;font-weight:600;font-family:var(--cjk)}
.mi small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--cjk);line-height:1.3}
.mi .ck{opacity:0;color:var(--accent);transform:scale(.3);transition:opacity .2s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.mi[aria-checked="true"]{background:color-mix(in srgb,var(--accent) 11%,transparent)}
.mi[aria-checked="true"] .ic{color:var(--accent)}
.mi[aria-checked="true"] .ck{opacity:1;transform:none}
.menu.open .mi{animation:miIn .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 40ms + 60ms)}
@keyframes miIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:absolute;bottom:calc(100% + 4px);left:50%;max-width:min(320px,calc(100% - 32px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:13px;font-weight:600;font-family:var(--cjk);padding:8px 16px;border-radius:99px;color:var(--ink);
  opacity:0;transform:translate(-50%,10px) scale(.9);transition:opacity .25s,transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#detail.in-r{animation:inR .45s cubic-bezier(.22,1,.36,1)} #detail.in-l{animation:inL .45s cubic-bezier(.22,1,.36,1)}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* 播放条：无色透明玻璃，透出背景颜色 */
.in.lg,.wbar.lg{background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.04))!important;
  backdrop-filter:blur(12px) saturate(180%)!important;-webkit-backdrop-filter:blur(12px) saturate(180%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 0 0 .5px rgba(255,255,255,.45),0 8px 28px rgba(40,50,140,.10)!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .in.lg,:root:not([data-theme="light"]) .wbar.lg{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.10),0 10px 32px rgba(0,0,0,.35)!important}}
:root[data-theme="dark"] .in.lg,:root[data-theme="dark"] .wbar.lg{background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02))!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

gamu?", "zh": "Raden，那是你的全家福吗？", "a": "fb692d38d540"}, {"sp": "Raden", "role": "d", "id": "Iya, Ajeng.", "zh": "是的，Ajeng。", "a": "4dc3e660cee9"}, {"sp": "Ajeng", "role": "d", "id": "Siapa saja mereka?", "zh": "他们都是谁？", "a": "73e1931545b2"}, {"sp": "Raden", "role": "d", "id": "Ini ayah, ibu, aku, dan kakak perempuanku.", "zh": "这是爸爸、妈妈、我和我姐姐。", "a": "6bfb43fc8e85"}, {"sp": "Ajeng", "role": "d", "id": "O, kamu anak kedua?", "zh": "哦，你是老二？", "a": "466e9733eb10"}, {"sp": "Raden", "role": "d", "id": "Iya. Bagaimana denganmu?", "zh": "是的。你呢？", "a": "598ab550487c"}, {"sp": "Ajeng", "role": "d", "id": "Aku anak tunggal.", "zh": "我是独生女。", "a": "5d0dfe876a46"}], "zh": "", "note": "", "qa": []}, {"id": "d17", "kind": "dlg", "book": "BIPA 1", "title": "你的生日是哪天", "lines": [{"sp": "Raden", "role": "d", "id": "Ajeng, kapan tanggal ulang tahunmu?", "zh": "Ajeng，你的生日是几号？", "a": "e0b7298d7735"}, {"sp": "Ajeng", "role": "d", "id": "Ulang tahunku tanggal 16 September.", "zh": "我的生日是 9 月 16 日。", "a": "50a73256d5e9"}, {"sp": "Raden", "role": "d", "id": "Apa kamu ingin merayakan ulang tahunmu nanti?", "zh": "到时候你想庆祝生日吗？", "a": "f2f585fd87eb"}, {"sp": "Ajeng", "role": "d", "id": "Ya, tentu saja.", "zh": "当然想。", "a": "e0c8b4011d75"}], "zh": "", "note": "", "qa": []}, {"id": "d18", "kind": "dlg", "book": "BIPA 1", "title": "你什么时候出生（音频 4.1）", "lines": [{"sp": "Raden", "role": "d", "id": "Kapan kamu lahir, Ajeng?", "zh": "Ajeng，你是什么时候出生的？", "a": "9cd410cc0a4c"}, {"sp": "Ajeng", "role": "d", "id": "Aku lahir 16 September 1996.", "zh": "我出生于 1996 年 9 月 16 日。", "a": "9526cc92d86b"}, {"sp": "Raden", "role": "d", "id": "Kalau begitu, bulan depan ulang tahunmu?", "zh": "那么，下个月是你的生日？", "a": "a47d790e076e"}, {"sp": "Ajeng", "role": "d", "id": "Iya, benar. Apa kamu bisa datang ke pesta ulang tahunku?", "zh": "对。你能来我的生日派对吗？", "a": "f85bcd626034"}, {"sp": "Raden", "role": "d", "id": "Ya, tentu saja.", "zh": "当然能。", "a": "cda1e81c376b"}], "zh": "", "note": "", "qa": []}, {"id": "d19", "kind": "dlg", "book": "BIPA 1", "title": "生日邀请（音频 4.2）", "lines": [{"sp": "Nina", "role": "d", "id": "Raga, apa kamu bisa datang ke pesta ulang tahunku pada Minggu, 17 November?", "zh": "Raga，11 月 17 日星期天你能来我的生日派对吗？", "a": "8b7549ddcd21"}, {"sp": "Raga", "role": "d", "id": "Ya, tentu saja. Pukul berapa pestanya?", "zh": "当然可以。派对几点？", "a": "7e4a04256430"}, {"sp": "Nina", "role": "d", "id": "Pukul 4 sore.", "zh": "下午四点。", "a": "a6324797e944"}, {"sp": "Raga", "role": "d", "id": "Di mana tempatnya?", "zh": "在哪里？", "a": "0bef6e2c0db0"}, {"sp": "Nina", "role": "d", "id": "Di Perumahan Batakan Asri Nomor 6.", "zh": "在 Batakan Asri 住宅区 6 号。", "a": "bf3a2cc616f9"}], "zh": "", "note": "", "qa": []}, {"id": "d20", "kind": "dlg", "book": "BIPA 1", "title": "假期去哪儿（音频 5.1）", "lines": [{"sp": "Raden", "role": "d", "id": "Ajeng, bulan depan mau liburan ke mana?", "zh": "Ajeng，下个月假期想去哪儿？", "a": "86d09138db18"}, {"sp": "Ajeng", "role": "d", "id": "Aku mau berwisata ke Labuan Bajo.", "zh": "我想去纳闽巴霍旅游。", "a": "13fc044393ef"}, {"sp": "Raden", "role": "d", "id": "Di mana itu?", "zh": "那是哪里？", "a": "6a0b8111b8b2"}, {"sp": "Ajeng", "role": "d", "id": "Labuan Bajo ada di Nusa Tenggara Timur.", "zh": "纳闽巴霍在东努沙登加拉。", "a": "63920b56a9c2"}, {"sp": "Raden", "role": "d", "id": "Apa saja tempat wisata menarik di sana?", "zh": "那里有什么好玩的景点？", "a": "48cedcd3d52e"}, {"sp": "Ajeng", "role": "d", "id": "Ada Pulau Kanawa, Air Terjun Cunca Wulang, Wae Rebo, dan Gua Rangko.", "zh": "有卡纳瓦岛、昆卡武朗瀑布、瓦埃雷博村和让科洞。", "a": "40046ec6710f"}], "zh": "", "note": "", "qa": []}, {"id": "d21", "kind": "dlg", "book": "BIPA 1", "title": "买东西（音频 5.2）", "lines": [{"sp": "Ajeng", "role": "d", "id": "Permisi, Pak.", "zh": "打扰一下，先生。", "a": "d786c7f98e9d"}, {"sp": "Pedagang", "role": "d", "id": "Ya, silakan.", "zh": "您请说。", "a": "62059b3e6c22"}, {"sp": "Ajeng", "role": "d", "id": "Saya mau beli roti kompiang.", "zh": "我想买馄饨饼。", "a": "639aea5cc454"}, {"sp": "Pedagang", "role": "d", "id": "Berapa bungkus?", "zh": "要几包？", "a": "5366a1044da7"}, {"sp": "Ajeng", "role": "d", "id": "Empat bungkus saja. Berapa harganya, Pak?", "zh": "就四包。多少钱，先生？", "a": "70603e4af9d4"}, {"sp": "Pedagang", "role": "d", "id": "Lima puluh ribu rupiah.", "zh": "五万印尼盾。", "a": "fdabd2b6a4f9"}, {"sp": "Ajeng", "role": "d", "id": "Ini uangnya, Pak. Terima kasih.", "zh": "给您钱，先生。谢谢。", "a": "ebe3c78dfabf"}, {"sp": "Pedagang", "role": "d", "id": "Sama-sama.", "zh": "不客气。", "a": "012d2fba3fe7"}], "zh": "", "note": "", "qa": []}, {"id": "d22", "kind": "dlg", "book": "BIPA 1", "title": "假期过得怎么样（对话 5.1）", "lines": [{"sp": "Putri", "role": "d", "id": "Bagaimana liburanmu di Labuan Bajo, Ajeng?", "zh": "Ajeng，你在纳闽巴霍的假期怎么样？", "a": "d33416575d4a"}, {"sp": "Ajeng", "role": "d", "id": "Liburanku menyenangkan.", "zh": "我的假期很愉快。", "a": "dca2d445de79"}, {"sp": "Putri", "role": "d", "id": "Apa kamu mengunjungi Gua Rangko?", "zh": "你去让科洞了吗？", "a": "974d4e516340"}, {"sp": "Ajeng", "role": "d", "id": "Ya, tentu saja.", "zh": "当然去了。", "a": "e0c8b4011d75"}, {"sp": "Putri", "role": "d", "id": "Bagaimana tempatnya?", "zh": "那地方怎么样？", "a": "5f4846660dc1"}, {"sp": "Ajeng", "role": "d", "id": "Tempatnya berkolam jernih. Airnya berwarna biru.", "zh": "那里有清澈的水池，水是蓝色的。", "a": "2f70a954a940"}], "zh": "", "note": "", "qa": []}, {"id": "d23", "kind": "dlg", "book": "BIPA 1", "title": "去钓鱼吗（音频 7.1）", "lines": [{"sp": "Raden", "role": "d", "id": "Ajeng, besok kamu mau ikut?", "zh": "Ajeng，明天你要一起去吗？", "a": "6a21591d9834"}, {"sp": "Ajeng", "role": "d", "id": "Ke mana?", "zh": "去哪儿？", "a": "aec811893687"}, {"sp": "Raden", "role": "d", "id": "Aku, Maria, dan Doni akan pergi memancing.", "zh": "我、Maria 和 Doni 要去钓鱼。", "a": "51900c19b361"}, {"sp": "Ajeng", "role": "d", "id": "Sebenarnya, aku kurang suka memancing.", "zh": "其实我不太喜欢钓鱼。", "a": "462c6169afe9"}, {"sp": "Raden", "role": "d", "id": "Oh, ya? Mengapa?", "zh": "哦，是吗？为什么？", "a": "02a5ab0bcdc6"}, {"sp": "Ajeng", "role": "d", "id": "Memancing itu membosankan.", "zh": "钓鱼很无聊。", "a": "317a03101d50"}, {"sp": "Raden", "role": "d", "id": "Lalu, apa hobimu?", "zh": "那你的爱好是什么？", "a": "ea42144429cc"}, {"sp": "Ajeng", "role": "d", "id": "Hobiku bermain musik.", "zh": "我的爱好是玩音乐。", "a": "8363fc3181ed"}, {"sp": "Raden", "role": "d", "id": "Ha ha ha, hobi kita memang beda, ya?", "zh": "哈哈，我们的爱好真不一样啊。", "a": "a9fd9afd30b8"}, {"sp": "Ajeng", "role": "d", "id": "Iya, benar!", "zh": "是啊，没错！", "a": "4480779f19fe"}], "zh": "", "note": "", "qa": []}, {"id": "d24", "kind": "dlg", "book": "BIPA 1", "title": "校园问路（课文 8.3）", "lines": [{"sp": "Sondang", "role": "d", "id": "Permisi, Mbak, saya mau tanya.", "zh": "打扰一下，姐，我想问一下。", "a": "919b526f30af"}, {"sp": "Rara", "role": "d", "id": "Ya, ada yang bisa saya bantu?", "zh": "你好，有什么可以帮你的？", "a": "9c8d3b0aec70"}, {"sp": "Sondang", "role": "d", "id": "Kantin ada di mana, ya?", "zh": "食堂在哪里呀？", "a": "de36eb20d3f7"}, {"sp": "Rara", "role": "d", "id": "Kantin ada di sebelah utara masjid, Mbak.", "zh": "食堂在清真寺的北边。", "a": "30a9bd8d42ed"}, {"sp": "Sondang", "role": "d", "id": "Masjidnya di mana?", "zh": "清真寺在哪儿？", "a": "6d0d1288fa1c"}, {"sp": "Rara", "role": "d", "id": "Ikuti jalan ini sampai pertigaan. Setelah itu belok kanan. Masjid ada di sebelah kiri jalan, seberang koperasi.", "zh": "沿着这条路走到三岔路口，然后右转。清真寺在路的左边，合作社对面。", "a": "d944f9f31bbd"}, {"sp": "Sondang", "role": "d", "id": "Oh, ya, terima kasih, Mbak!", "zh": "好的，谢谢你！", "a": "ac6bca2bae62"}, {"sp": "Rara", "role": "d", "id": "Sama-sama.", "zh": "不客气。", "a": "7b3c51cf4835"}, {"sp": "Sondang", "role": "d", "id": "Oh, ya, kalau toilet umum di mana, ya?", "zh": "对了，公共厕所在哪儿呢？", "a": "46a251c6ed92"}, {"sp": "Rara", "role": "d", "id": "Toilet umum ada di sebelah kiri koperasi.", "zh": "公共厕所在合作社左边。", "a": "7e37ab538857"}, {"sp": "Sondang", "role": "d", "id": "Maaf, bisa tolong ulangi?", "zh": "不好意思，能再说一遍吗？", "a": "64dd4f88bee2"}, {"sp": "Rara", "role": "d", "id": "Mari, saya antar saja.", "zh": "来吧，我直接带你去。", "a": "a0d85ceeff15"}, {"sp": "Sondang", "role": "d", "id": "Baik, terima kasih, Mbak.", "zh": "好的，谢谢你。", "a": "25eabef8cac4"}], "zh": "", "note": "背景：今天来了一个新生 Sondang，她还不熟悉校园里的各个地方。", "qa": []}, {"id": "d25", "kind": "dlg", "book": "BIPA 1", "title": "你像妈妈吗（音频 10.3）", "lines": [{"sp": "Raden", "role": "d", "id": "Meli, apa kamu mirip ibumu?", "zh": "Meli，你长得像你妈妈吗？", "a": "dfdaf96d5cc5"}, {"sp": "Meli", "role": "d", "id": "Tidak. Ibuku berbadan ramping, berkulit sawo matang, dan berambut ikal. Ibuku bertubuh tinggi dan bermata kecokelatan.", "zh": "不像。我妈妈身材苗条，小麦色皮肤，卷发。她个子高，眼睛偏棕色。", "a": "56e67160723d"}, {"sp": "Raden", "role": "d", "id": "Bagaimana dengan ayahmu?", "zh": "你爸爸呢？", "a": "51edc4175c12"}, {"sp": "Meli", "role": "d", "id": "Ayahku berbadan gemuk, berkulit cokelat, berambut hitam lurus, dan memakai kacamata. Ayah berkumis tebal. Ia senang menggunakan celana pendek berwarna cokelat.", "zh": "我爸爸身材胖，棕色皮肤，黑色直发，戴眼镜。爸爸留着浓密的胡子，喜欢穿棕色短裤。", "a": "bfe532245407"}, {"sp": "Raden", "role": "d", "id": "Lalu, bagaimana ciri-ciri kakakmu? Apa dia mirip denganmu?", "zh": "那你姐姐长什么样？她像你吗？", "a": "f25a86c855b7"}, {"sp": "Meli", "role": "d", "id": "Kakakku cantik, tinggi, dan semampai. Dia berbeda denganku. Dia berkulit putih.", "zh": "我姐姐很漂亮，个子高，身材修长。她和我不一样，她皮肤白。", "a": "0eec9becd3aa"}], "zh": "", "note": "", "qa": []}, {"id": "d26", "kind": "dlg", "book": "BIPA 1", "title": "喜欢什么样的房子", "lines": [{"sp": "Raden", "role": "d", "id": "Jeng, kamu suka rumah seperti apa?", "zh": "Ajeng，你喜欢什么样的房子？", "a": "e057419d73cb"}, {"sp": "Ajeng", "role": "d", "id": "Aku suka rumah yang besar dan luas.", "zh": "我喜欢又大又宽敞的房子。", "a": "1f6c785bf240"}], "zh": "", "note": "", "qa": []}, {"id": "d27", "kind": "dlg", "book": "BIPA 2", "title": "音乐班见面（音频 1）", "lines": [{"sp": "Ari", "role": "d", "id": "Hai, Ela, kamu ikut kursus musik juga, ya?", "zh": "嗨，Ela，你也上音乐课吗？", "a": "2e0a8b4c825f"}, {"sp": "Ela", "role": "d", "id": "Iya, Ari. Kamu juga?", "zh": "是的，Ari。你也是？", "a": "5d671ff4ecca"}, {"sp": "Ari", "role": "d", "id": "Iya.", "zh": "对。", "a": "3161690909da"}, {"sp": "Ela", "role": "d", "id": "Kamu belajar alat musik apa?", "zh": "你学什么乐器？", "a": "6a43779d706f"}, {"sp": "Ari", "role": "d", "id": "Gitar. Kamu?", "zh": "吉他。你呢？", "a": "ef04929d27c8"}, {"sp": "Ela", "role": "d", "id": "Aku belajar bermain piano. Aku ke kelas dulu, ya. Kelas piano sudah mau mulai. Sampai jumpa, Ari.", "zh": "我学弹钢琴。我先去上课了，钢琴课快开始了。再见，Ari。", "a": "22bfa0b27ea7"}, {"sp": "Ari", "role": "d", "id": "Sampai jumpa, Ela.", "zh": "再见，Ela。", "a": "7c191052a10a"}], "zh": "", "note": "", "qa": []}, {"id": "d28", "kind": "dlg", "book": "BIPA 2", "title": "喜欢什么乐器", "lines": [{"sp": "A", "role": "d", "id": "Kamu suka bermain alat musik apa?", "zh": "你喜欢玩什么乐器？", "a": "f5279702c082"}, {"sp": "B", "role": "d", "id": "Saya suka bermain gitar. Kalau kamu?", "zh": "我喜欢弹吉他。你呢？", "a": "1e995bff6bbb"}, {"sp": "A", "role": "d", "id": "Saya suka bermain saksofon. Saya suka musik pop.", "zh": "我喜欢吹萨克斯，我喜欢流行音乐。", "a": "c8ac46d796e1"}], "zh": "", "note": "", "qa": []}, {"id": "d29", "kind": "dlg", "book": "BIPA 2", "title": "采访老师（音频 2）", "lines": [{"sp": "Wartawan", "role": "d", "id": "Selamat pagi, Bu Dian. Saya dari majalah Edu. Saya ingin mewawancarai Ibu.", "zh": "早上好，Dian 老师。我是《Edu》杂志的，想采访您。", "a": "9bce449d4ce3"}, {"sp": "Bu Dian", "role": "d", "id": "Selamat pagi. Oh, silakan.", "zh": "早上好。哦，请吧。", "a": "d4dccdcff030"}, {"sp": "Wartawan", "role": "d", "id": "Terima kasih, Bu. Kalau boleh tahu, apa pekerjaan Ibu?", "zh": "谢谢。请问您是做什么工作的？", "a": "17546ad862ec"}, {"sp": "Bu Dian", "role": "d", "id": "Saya guru.", "zh": "我是老师。", "a": "13b2fdc21b17"}, {"sp": "Wartawan", "role": "d", "id": "Menurut Ibu, apa tugas seorang guru?", "zh": "您认为老师的职责是什么？", "a": "464244af46d3"}, {"sp": "Bu Dian", "role": "d", "id": "Tugas guru adalah mengajar siswa di sekolah.", "zh": "老师的职责是在学校教学生。", "a": "3f6ac906b15c"}, {"sp": "Wartawan", "role": "d", "id": "Mengapa Anda menjadi seorang guru?", "zh": "您为什么当老师？", "a": "06178990351f"}, {"sp": "Bu Dian", "role": "d", "id": "Guru adalah pekerjaan yang luar biasa dan bermanfaat.", "zh": "老师是了不起又有意义的职业。", "a": "c7e9b5afe1cc"}, {"sp": "Wartawan", "role": "d", "id": "Bagaimana kesan Anda selama menjadi guru?", "zh": "当老师这些年您感觉怎么样？", "a": "68f50cb604ea"}, {"sp": "Bu Dian", "role": "d", "id": "Hem, sangat menyenangkan.", "zh": "嗯，很开心。", "a": "f2d8aa6a9245"}, {"sp": "Wartawan", "role": "d", "id": "Bisakah Anda ceritakan hal yang menyenangkan itu?", "zh": "能讲讲开心在哪里吗？", "a": "8a8ef2b5974b"}, {"sp": "Bu Dian", "role": "d", "id": "Kita bisa memberi ilmu yang berguna untuk siswa.", "zh": "我们可以给学生传授有用的知识。", "a": "36f138fc79a8"}], "zh": "", "note": "", "qa": []}, {"id": "d30", "kind": "dlg", "book": "BIPA 2", "title": "你做什么工作", "lines": [{"sp": "A", "role": "d", "id": "Apa pekerjaanmu?", "zh": "你做什么工作？", "a": "2af05e636332"}, {"sp": "B", "role": "d", "id": "Saya seorang wartawan.", "zh": "我是记者。", "a": "0bf2bc2fbae1"}, {"sp": "A", "role": "d", "id": "Saya seorang pegawai negeri. Kalau kamu?", "zh": "我是公务员。你呢？", "a": "e96af7105381"}, {"sp": "C", "role": "d", "id": "Saya adalah seorang guru. Tugas saya adalah mengajar siswa di sekolah.", "zh": "我是老师，我的职责是在学校教学生。", "a": "666559c912f0"}], "zh": "", "note": "", "qa": []}, {"id": "d31", "kind": "dlg", "book": "BIPA 2", "title": "在服装店（音频 4）", "lines": [{"sp": "Penjual", "role": "d", "id": "Cari apa, Bu? Silakan, lihat-lihat dulu.", "zh": "您找什么，女士？请先随便看看。", "a": "0a1e738b4cc7"}, {"sp": "Pembeli", "role": "d", "id": "Saya ingin membeli satu blus dan satu rok panjang.", "zh": "我想买一件女衬衫和一条长裙。", "a": "4c79f20dd9b1"}, {"sp": "Penjual", "role": "d", "id": "Oh, ada, Bu. Silakan. Ini banyak barangnya. Satu blus harganya Rp90.000,00. Satu rok harganya Rp80.000,00.", "zh": "有的，您请看，这里货很多。一件女衬衫九万盾，一条裙子八万盾。", "a": "993a0ab0a181"}, {"sp": "Pembeli", "role": "d", "id": "Oh, bagus. Murah juga. Saya ambil, ya. Ini uangnya.", "zh": "哦，不错，也挺便宜，我要了。给您钱。", "a": "c39e172ec325"}, {"sp": "Penjual", "role": "d", "id": "Ini barangnya, Bu, dan ini kembaliannya Rp30.000. Ada lagi, Bu?", "zh": "这是您的东西，这是找您的三万盾。还要别的吗？", "a": "b019219a7b73"}, {"sp": "Pembeli", "role": "d", "id": "Ini saja. Terima kasih.", "zh": "就这些，谢谢。", "a": "43a921e47710"}, {"sp": "Penjual", "role": "d", "id": "Baik, sama-sama, Bu. Terima kasih sudah berbelanja di Toko Anisa.", "zh": "好的，不客气。谢谢您光临 Anisa 商店。", "a": "91f4c1245093"}], "zh": "", "note": "中文版把卖家（Penjual）和买家（Pembeli）都译成了“顾客/买家”，已按原文更正。", "qa": []}, {"id": "d32", "kind": "dlg", "book": "BIPA 2", "title": "线上点餐（音频 5）", "lines": [{"sp": "Ela", "role": "d", "id": "Ari, saya mau pesan makanan melalui aplikasi daring. Kamu mau pesan apa?", "zh": "Ari，我要用线上应用点餐，你要点什么？", "a": "4fe7f88109e9"}, {"sp": "Ari", "role": "d", "id": "Hem, saya pesan mi goreng saja.", "zh": "嗯，我就点炒面吧。", "a": "1416f39cb141"}, {"sp": "Ela", "role": "d", "id": "Minumannya?", "zh": "饮料呢？", "a": "5a10881eb27c"}, {"sp": "Ari", "role": "d", "id": "Jus jeruk saja, Ela.", "zh": "橙汁就行，Ela。", "a": "23e3445dcc3f"}, {"sp": "Ela", "role": "d", "id": "Baiklah. Saya pesan, hem …, sate ayam saja. Minumannya … jus mangga. Pesan sekarang, ya?", "zh": "好。我点……鸡肉串吧，饮料……芒果汁。现在下单了哦？", "a": "dc85c59eb763"}, {"sp": "Ari", "role": "d", "id": "Sip.", "zh": "好嘞。", "a": "cc536c30a749"}], "zh": "", "note": "", "qa": []}, {"id": "d33", "kind": "dlg", "book": "BIPA 2", "title": "最喜欢的食物", "lines": [{"sp": "A", "role": "d", "id": "Apa makanan kesukaanmu?", "zh": "你最喜欢吃什么？", "a": "6f500268ebb1"}, {"sp": "B", "role": "d", "id": "Kalau saya paling suka nasi goreng.", "zh": "我最喜欢炒饭。", "a": "6b578b83e1dd"}, {"sp": "A", "role": "d", "id": "Apa makanan khas dari negara Anda?", "zh": "你们国家的特色菜是什么？", "a": "896fdb43217c"}, {"sp": "B", "role": "d", "id": "Makanan khas negara saya adalah gado-gado.", "zh": "我们国家的特色菜是加多加多。", "a": "d3951a686acb"}], "zh": "", "note": "", "qa": []}, {"id": "d34", "kind": "dlg", "book": "BIPA 2", "title": "乔迁请客（对话 6.1）", "lines": [{"sp": "Pras", "role": "d", "id": "Halo, Dinda. Apakah kamu ada acara besok?", "zh": "喂，Dinda，你明天有安排吗？", "a": "a0bb554eff52"}, {"sp": "Dinda", "role": "d", "id": "Hem, tidak ada. Ada apa?", "zh": "嗯，没有。怎么了？", "a": "d9760a014902"}, {"sp": "Pras", "role": "d", "id": "Aku ingin mengundang teman-teman makan bersama. Aku baru pindah rumah baru.", "zh": "我想请朋友们一起吃饭，我刚搬了新家。", "a": "cb4c4462f40c"}, {"sp": "Dinda", "role": "d", "id": "Wah, selamat, ya. Di mana rumah barumu?", "zh": "哇，恭喜！你的新家在哪？", "a": "52fe940b5196"}, {"sp": "Pras", "role": "d", "id": "Di Jalan Mawar Nomor 10. Di sebelah kantor pos.", "zh": "在玫瑰路 10 号，邮局旁边。", "a": "04a174ecb52a"}, {"sp": "Dinda", "role": "d", "id": "Oh, di sana. Aku tahu tempatnya. Acaranya mulai pukul berapa?", "zh": "哦，那里啊，我知道。几点开始？", "a": "3731b7e46f90"}, {"sp": "Pras", "role": "d", "id": "Acaranya mulai pukul 10 pagi.", "zh": "上午十点。", "a": "aceef1be8735"}, {"sp": "Dinda", "role": "d", "id": "Oke, aku pasti datang. Terima kasih, Pras.", "zh": "好，我一定来。谢谢你，Pras。", "a": "3e9832924db2"}], "zh": "", "note": "", "qa": []}, {"id": "d35", "kind": "dlg", "book": "BIPA 2", "title": "婉拒邀请（对话 6.2）", "lines": [{"sp": "Wandi", "role": "d", "id": "Wulan, aku ingin mengundang kamu main basket minggu depan.", "zh": "Wulan，我想请你下周一起打篮球。", "a": "3f24d4049837"}, {"sp": "Wulan", "role": "d", "id": "Main basket? Di mana, Han?", "zh": "打篮球？在哪儿？", "a": "fcf7b042dbd2"}, {"sp": "Wandi", "role": "d", "id": "Di lapangan universitas kita saja.", "zh": "就在我们大学的球场。", "a": "fc5bc30f0009"}, {"sp": "Wulan", "role": "d", "id": "Lapangan sebelah gedung rektorat? Di seberang kantin?", "zh": "校长楼旁边、食堂对面那个球场？", "a": "9b08dc57f76f"}, {"sp": "Wandi", "role": "d", "id": "Iya, di sana.", "zh": "对，就那里。", "a": "0983dd7c2bb7"}, {"sp": "Wulan", "role": "d", "id": "Aduh, maaf sekali. Minggu depan aku sudah ada rencana.", "zh": "哎呀，真不好意思，下周我已经有安排了。", "a": "2f87ffa89fc2"}, {"sp": "Wandi", "role": "d", "id": "Oh, begitu. Ya sudah, tidak apa-apa.", "zh": "哦，这样啊。那没关系。", "a": "db5e953765a4"}, {"sp": "Wulan", "role": "d", "id": "Mudah-mudahan aku bisa ikut lain waktu, ya.", "zh": "希望下次我能去。", "a": "75153e107f6f"}], "zh": "", "note": "", "qa": []}, {"id": "d36", "kind": "dlg", "book": "BIPA 2", "title": "一起做放松运动（对话 7）", "lines": [{"sp": "Eki", "role": "d", "id": "Ayu, kamu sudah selesai berolahraga?", "zh": "Ayu，你运动完了吗？", "a": "b45a53b19ce1"}, {"sp": "Ayu", "role": "d", "id": "Sudah, aku sekarang sedang pendinginan.", "zh": "完了，我现在在做放松运动。", "a": "bbe4e9b0d8d2"}, {"sp": "Eki", "role": "d", "id": "Bagaimana kalau kita lakukan bersama?", "zh": "我们一起做怎么样？", "a": "2d6c9591c71e"}, {"sp": "Ayu", "role": "d", "id": "Ayo. Pertama regangkan tangan. Setelah itu, regangkan kaki.", "zh": "好啊。先伸展手臂，然后伸展腿。", "a": "392e6ae1e0e6"}, {"sp": "Eki", "role": "d", "id": "Gerakan selanjutnya?", "zh": "下一个动作呢？", "a": "1ed13c6270da"}, {"sp": "Ayu", "role": "d", "id": "Tarik nafas dalam-dalam lalu keluarkan.", "zh": "深吸一口气，再呼出来。", "a": "7369f41115b6"}, {"sp": "Eki", "role": "d", "id": "Wah, segarnya. Terima kasih, Ayu.", "zh": "哇，真舒服。谢谢你，Ayu。", "a": "50f750611374"}, {"sp": "Ayu", "role": "d", "id": "Sama-sama, Eki.", "zh": "不客气，Eki。", "a": "6fadd23277f5"}], "zh": "", "note": "", "qa": []}, {"id": "d37", "kind": "dlg", "book": "BIPA 2", "title": "电话约打球", "lines": [{"sp": "Putu", "role": "d", "id": "Halo, ini Putu. Apa saya bisa bicara dengan Dian?", "zh": "喂，我是 Putu，可以请 Dian 接电话吗？", "a": "c6e2fc12da58"}, {"sp": "Dian", "role": "d", "id": "Hai, Putu. Ini aku. Ada apa kamu menelepon?", "zh": "嗨，Putu，是我。打电话有什么事？", "a": "288a17fa7a1b"}, {"sp": "Putu", "role": "d", "id": "Nanti sore kita main badminton, yuk!", "zh": "下午我们去打羽毛球吧！", "a": "49f68159f294"}, {"sp": "Dian", "role": "d", "id": "Hem, ayo! Main di mana?", "zh": "嗯，好啊！在哪打？", "a": "26ed99f907b6"}, {"sp": "Putu", "role": "d", "id": "Di lapangan samping masjid saja. Sampai ketemu nanti, ya.", "zh": "就在清真寺旁边的场地。回头见！", "a": "8b79892c6e38"}, {"sp": "Dian", "role": "d", "id": "Oke kalau begitu. Sampai ketemu.", "zh": "好，那就这样，回头见。", "a": "2a0881223a7a"}], "zh": "", "note": "打电话三步：① 打招呼并自报姓名；② 说明来意；③ 结束通话。", "qa": []}, {"id": "d38", "kind": "dlg", "book": "BIPA 2", "title": "去看音乐会（音频 8）", "lines": [{"sp": "Putu", "role": "d", "id": "Hai, Lala.", "zh": "嗨，Lala。", "a": "b01bcd4343f1"}, {"sp": "Lala", "role": "d", "id": "Halo, Putu. Apakah kamu menonton konser kemarin?", "zh": "你好，Putu。你昨天去看音乐会了吗？", "a": "6a7296402cc1"}, {"sp": "Putu", "role": "d", "id": "Iya, La. Acaranya ramai sekali.", "zh": "去了，人特别多。", "a": "fab6c38e0575"}, {"sp": "Lala", "role": "d", "id": "Wah, pasti seru. Kamu pergi naik apa?", "zh": "哇，肯定很精彩。你坐什么去的？", "a": "e7b291adcbf3"}, {"sp": "Putu", "role": "d", "id": "Aku naik kereta.", "zh": "我坐火车去的。", "a": "22620219d5a4"}, {"sp": "Lala", "role": "d", "id": "Apakah naik kereta lebih cepat daripada naik bus?", "zh": "坐火车比坐公交快吗？", "a": "32a6e0d4270b"}, {"sp": "Putu", "role": "d", "id": "Iya. Dari stasiun kereta aku berjalan kaki ke tempat konsernya.", "zh": "快。我从火车站走到音乐会现场。", "a": "078b281e7498"}, {"sp": "Lala", "role": "d", "id": "Hem, semoga lain kali aku bisa ikut menonton.", "zh": "嗯，希望下次我也能去看。", "a": "940a305e2bd8"}], "zh": "", "note": "", "qa": []}, {"id": "d39", "kind": "dlg", "book": "BIPA 2", "title": "坐地铁（对话 8.1）", "lines": [{"sp": "Agung", "role": "d", "id": "Pagi, Ti. Kemarin kamu berjalan-jalan ke Istora Senayan, ya?", "zh": "早，Risti。你昨天去塞纳扬体育馆了吧？", "a": "b110a1b303bd"}, {"sp": "Risti", "role": "d", "id": "Selamat pagi, Gung. Iya, kemarin aku nonton pertandingan tenis di sana.", "zh": "早上好，Agung。对，昨天我在那儿看网球比赛。", "a": "3601020d6235"}, {"sp": "Agung", "role": "d", "id": "Wah, bagaimana cara kamu pergi ke sana?", "zh": "哇，你怎么去的？", "a": "f565d879f8ed"}, {"sp": "Risti", "role": "d", "id": "Aku naik MRT ke sana.", "zh": "我坐地铁去的。", "a": "14c63d9af5ae"}, {"sp": "Agung", "role": "d", "id": "MRT? Aku belum pernah naik itu. Caranya bagaimana, Ti?", "zh": "地铁？我还没坐过。怎么坐？", "a": "5e033ec54831"}, {"sp": "Risti", "role": "d", "id": "Kamu harus punya kartu uang elektronik dulu, Gung. Petugas akan mengecek barang bawaan kita sebelum masuk dan keluar stasiun. Setelah itu masuk lewat gerbang dengan cara menempelkan kartu.", "zh": "你得先有一张电子钱包卡。进出站前工作人员会检查随身物品，然后刷卡过闸机进站。", "a": "beb07d36aadd"}, {"sp": "Agung", "role": "d", "id": "Hem, menarik. Nanti aku juga mau coba naik MRT.", "zh": "嗯，有意思，回头我也要试试坐地铁。", "a": "db5367864cd0"}, {"sp": "Risti", "role": "d", "id": "Ayo coba, Gung. Aku yakin kamu akan suka.", "zh": "去试试吧，我相信你会喜欢的。", "a": "9cc910ea8a93"}], "zh": "", "note": "", "qa": []}, {"id": "d40", "kind": "dlg", "book": "BIPA 2", "title": "假期计划（音频 9）", "lines": [{"sp": "Ira", "role": "d", "id": "Liburan hampir tiba, ya. Kamu mau berlibur ke mana, Azka?", "zh": "快放假了。Azka，你想去哪儿度假？", "a": "ed9e2c7f138b"}, {"sp": "Azka", "role": "d", "id": "Aku belum ada rencana. Bagaimana denganmu, Ira?", "zh": "我还没计划。你呢，Ira？", "a": "77c724951e26"}, {"sp": "Ira", "role": "d", "id": "Aku ingin pergi ke Toraja.", "zh": "我想去托拉查。", "a": "61f8a9136cab"}, {"sp": "Azka", "role": "d", "id": "Rencana yang bagus. Kapan kamu akan pergi?", "zh": "好计划！什么时候去？", "a": "6bd4a78cf680"}, {"sp": "Ira", "role": "d", "id": "Minggu depan. Apa kamu mau ikut?", "zh": "下周。你要一起去吗？", "a": "81b5b62f50d3"}, {"sp": "Azka", "role": "d", "id": "Tidak, terima kasih. Sepertinya aku di rumah saja.", "zh": "不了，谢谢。我还是待在家吧。", "a": "e34e3cba7e4e"}, {"sp": "Ira", "role": "d", "id": "Baiklah. Nanti akan kubawakan oleh-oleh dari sana.", "zh": "好吧，我会给你带那边的特产。", "a": "4b91294b239a"}, {"sp": "Azka", "role": "d", "id": "Asyik. Kutunggu, ya!", "zh": "太好了，我等着哦！", "a": "d3d87787c9b2"}], "zh": "", "note": "", "qa": []}, {"id": "d41", "kind": "dlg", "book": "BIPA 2", "title": "上个假期去了哪（对话 9）", "lines": [{"sp": "Aria", "role": "d", "id": "Hai, Fi. Ke mana kamu pergi ketika libur semester?", "zh": "嗨，Lutfi，学期假你去哪儿了？", "a": "955f93249327"}, {"sp": "Lutfi", "role": "d", "id": "Halo, Aria. Liburan kemarin aku pergi ke Pulau Lombok.", "zh": "你好，Aria。上个假期我去了龙目岛。", "a": "b40835c1fd59"}, {"sp": "Aria", "role": "d", "id": "Wow! Transportasi apa yang kamu gunakan?", "zh": "哇！你坐什么去的？", "a": "e0b8d7252e42"}, {"sp": "Lutfi", "role": "d", "id": "Aku dan keluargaku naik pesawat ke sana.", "zh": "我和家人坐飞机去的。", "a": "aa04b1aa7788"}, {"sp": "Aria", "role": "d", "id": "Apa saja yang kamu lakukan di sana?", "zh": "你们在那儿做了什么？", "a": "c61285c938dd"}, {"sp": "Lutfi", "role": "d", "id": "Sebagian besar waktu kami habiskan untuk jalan-jalan. Pantai di Pulau Lombok sungguh sangat indah. Sehari sebelum kami pulang kami juga melihat pasar malam.", "zh": "大部分时间都在游玩。龙目岛的海滩真的很美。回家前一天我们还逛了夜市。", "a": "4297918d92b7"}, {"sp": "Aria", "role": "d", "id": "Pasti menyenangkan sekali. Semoga aku bisa ke sana nanti.", "zh": "一定很开心。希望以后我也能去。", "a": "157c3cd04cfd"}, {"sp": "Lutfi", "role": "d", "id": "Kalau nanti kamu ke sana, aku juga mau ikut!", "zh": "要是你以后去，我也要一起！", "a": "44c987545c51"}], "zh": "", "note": "", "qa": []}, {"id": "d42", "kind": "dlg", "book": "BIPA 2", "title": "淋雨头晕（音频 10）", "lines": [{"sp": "Adit", "role": "d", "id": "Aduh, kepalaku pusing sekali.", "zh": "哎呀，我头好晕。", "a": "96d7cf46a3a4"}, {"sp": "Indri", "role": "d", "id": "Kenapa, Dit? Apa kamu sakit?", "zh": "怎么了，Adit？你生病了吗？", "a": "632dd5ba99af"}, {"sp": "Adit", "role": "d", "id": "Iya, Indri. Kemarin hujan deras. Aku kehujanan.", "zh": "是啊，Indri。昨天下大雨，我被淋了。", "a": "4d65e395b10a"}, {"sp": "Indri", "role": "d", "id": "Apakah kamu sudah berobat ke dokter?", "zh": "你去看医生了吗？", "a": "f7aa632fb14c"}, {"sp": "Adit", "role": "d", "id": "Belum.", "zh": "还没。", "a": "7cb4158bcaa7"}, {"sp": "Indri", "role": "d", "id": "Aku buatkan teh panas, ya.", "zh": "我给你泡杯热茶吧。", "a": "9cdf9c928c9a"}, {"sp": "Adit", "role": "d", "id": "Terima kasih, Indri. Maaf, ya, merepotkan kamu.", "zh": "谢谢你，Indri，不好意思麻烦你了。", "a": "2614595f5522"}, {"sp": "Indri", "role": "d", "id": "Tidak merepotkan, Adit. Setelah ini, aku antar ke dokter.", "zh": "不麻烦。等会儿我送你去看医生。", "a": "ffc1a9770b1e"}, {"sp": "Adit", "role": "d", "id": "Baiklah. Sekali lagi terima kasih, ya.", "zh": "好的，再次谢谢你。", "a": "f2939cdbe94f"}, {"sp": "Indri", "role": "d", "id": "Sama-sama.", "zh": "不客气。", "a": "7b3c51cf4835"}], "zh": "", "note": "中文版练习题里写成“复述 Sarah 的症状”，原文人物其实是 Adit。", "qa": []}, {"id": "d43", "kind": "dlg", "book": "BIPA 2", "title": "拉肚子吃药（对话 10）", "lines": [{"sp": "Pras", "role": "d", "id": "Datil, kenapa kemarin kamu tidak masuk sekolah?", "zh": "Datil，你昨天怎么没来上学？", "a": "f9c8455fe03b"}, {"sp": "Datil", "role": "d", "id": "Kemarin aku diare, Pras.", "zh": "我昨天拉肚子了。", "a": "541508743231"}, {"sp": "Pras", "role": "d", "id": "Hmm, apa kamu sudah sembuh?", "zh": "嗯，现在好了吗？", "a": "1fc877437ff1"}, {"sp": "Datil", "role": "d", "id": "Sudah. Aku minum oralit.", "zh": "好了，我喝了补液盐。", "a": "ab4958a289e6"}, {"sp": "Pras", "role": "d", "id": "Bagaimana aturan pakainya?", "zh": "怎么喝？", "a": "aae097de54fa"}, {"sp": "Datil", "role": "d", "id": "Seduh larutan oralit dengan air hangat. Minum tiga kali sehari.", "zh": "用温水冲开，一天喝三次。", "a": "bd394a17f66f"}, {"sp": "Pras", "role": "d", "id": "Syukurlah kamu sudah sembuh.", "zh": "幸好你已经好了。", "a": "71bea2c4d765"}, {"sp": "Datil", "role": "d", "id": "Terima kasih, Pras.", "zh": "谢谢你，Pras。", "a": "050a927d679a"}], "zh": "", "note": "", "qa": []}, {"id": "t44", "kind": "text", "book": "武功秘籍", "title": "宅家的一周 Minggu Ini di Rumah", "lines": [{"sp": "", "role": "r", "id": "Minggu ini saya memutuskan untuk tidak pergi ke mal atau tempat wisata.", "zh": "这周我决定不去商场，也不去景点。", "a": "89e3aa902594"}, {"sp": "", "role": "r", "id": "Setiap pagi saya bangun jam tujuh, langsung mandi dan memakai baju.", "zh": "每天早上我七点起床，马上洗澡穿衣服。", "a": "bcc9ba0a6953"}, {"sp": "", "role": "r", "id": "Setelah itu, saya sarapan nasi goreng yang dimasak oleh ibu saya, dan saya membantu membersihkan rumah.", "zh": "之后，我吃妈妈做的炒饭当早餐，然后帮忙打扫房子。", "a": "2550d3eee01e"}, {"sp": "", "role": "r", "id": "Sore hari saya menonton film dokumenter tentang hewan di televisi.", "zh": "下午我在电视上看一部关于动物的纪录片。", "a": "25042779556d"}, {"sp": "", "role": "r", "id": "Saya harus menyelesaikan tugas kuliah sebelum besok pagi.", "zh": "我得在明天早上之前完成大学作业。", "a": "cb49a5f2c101"}, {"sp": "", "role": "r", "id": "Meskipun hanya di rumah, hari saya terasa penuh dan menyenangkan.", "zh": "虽然只待在家里，我的一天却过得充实又愉快。", "a": "1adf8dad5c10"}], "zh": "这周我决定不去商场，也不去旅游景点。每天早上我七点起床，马上洗澡、穿衣服。之后我吃妈妈做的炒饭当早餐，然后帮忙打扫家里。下午我在电视上看关于动物的纪录片。我必须在明天早上之前完成大学作业。虽然只待在家里，但我这一天过得很充实、很愉快。", "note": "", "qa": []}, {"id": "t45", "kind": "text", "book": "武功秘籍", "title": "宅家的一周 Minggu Ini di Rumah（版本 B）", "lines": [{"sp": "", "role": "r", "id": "Pada akhir pekan, saya tidak pergi ke mal atau tempat wisata.", "zh": "周末我没有去商场或景点。", "a": "ce7e9644126c"}, {"sp": "", "role": "r", "id": "Saya bangun pukul tujuh pagi.", "zh": "我早上七点起床。", "a": "9dcc19e44b9c"}, {"sp": "", "role": "r", "id": "Setelah bangun, saya memakai pakaian.", "zh": "起床后，我穿好衣服。", "a": "425370775e3e"}, {"sp": "", "role": "r", "id": "Kemudian, saya membantu ibu membuat nasi goreng untuk sarapan.", "zh": "然后，我帮妈妈做炒饭当早餐。", "a": "72bc18c635f2"}, {"sp": "", "role": "r", "id": "Setelah itu, saya membantu ibu membersihkan rumah.", "zh": "之后，我帮妈妈打扫房子。", "a": "20980576938f"}, {"sp": "", "role": "r", "id": "Kemudian, saya menonton film dokumenter di televisi.", "zh": "然后，我在电视上看纪录片。", "a": "d266a6c0895a"}, {"sp": "", "role": "r", "id": "Saya merasa kegiatan saya pada hari Minggu sangat sederhana, tetapi sangat berarti bagi saya.", "zh": "我觉得我星期天的活动很简单，但对我来说很有意义。", "a": "e92a932d6462"}], "zh": "周末我不去商场或旅游景点。我早上七点起床。起床后我穿好衣服，然后帮妈妈做炒饭当早餐。之后我帮妈妈打扫房子，然后在电视上看纪录片。我觉得我周日的活动很简单，但对我来说很有意义。", "note": "", "qa": []}, {"id": "t46", "kind": "text", "book": "武功秘籍", "title": "周日做饭 Memasak Bersama Ibu", "lines": [{"sp": "", "role": "r", "id": "Pada pagi hari Minggu, Amy membantu ibunya memasak di dapur.", "zh": "星期天早上，Amy 在厨房帮妈妈做饭。", "a": "cce492ef764f"}, {"sp": "", "role": "r", "id": "Mereka ingin membuat nasi goreng dan sup sayuran sebagai makan siang.", "zh": "她们想做炒饭和蔬菜汤当午饭。", "a": "21359e413fa3"}, {"sp": "", "role": "r", "id": "Amy mencuci sayuran.", "zh": "Amy 洗蔬菜。", "a": "e530abc5d2fe"}, {"sp": "", "role": "r", "id": "Kemudian ibu memotong bawang bombay dan menyiapkan bumbu.", "zh": "然后妈妈切洋葱、准备调料。", "a": "93fb9b28443b"}, {"sp": "", "role": "r", "id": "Setelah semua bahan makanan siap, mereka mulai memasak bersama.", "zh": "所有食材准备好后，她们开始一起做饭。", "a": "7a02cabd4be5"}, {"sp": "", "role": "r", "id": "Makanan yang disiapkan sangat sedap.", "zh": "准备好的饭菜非常香。", "a": "600afb1d3107"}, {"sp": "", "role": "r", "id": "Seluruh anggota keluarga berkumpul di meja makan.", "zh": "全家人围坐在餐桌旁。", "a": "ef44728e374c"}, {"sp": "", "role": "r", "id": "Sambil makan, mereka saling berbagi kenangan kehidupan.", "zh": "他们一边吃饭，一边分享生活中的回忆。", "a": "765afa4fb62b"}], "zh": "星期天早上，Amy 在厨房帮妈妈做饭。她们想做炒饭和蔬菜汤当午饭。Amy 洗菜，接着妈妈切洋葱、准备调料。所有食材准备好后，她们开始一起做饭。做好的饭菜非常美味。全家人围坐在餐桌旁，一边吃一边分享生活中的回忆。", "note": "", "qa": []}, {"id": "t47", "kind": "text", "book": "武功秘籍", "title": "理想中的家 Rumah Impian Saya", "lines": [{"sp": "", "role": "r", "id": "Saya membayangkan rumah saya seperti ini.", "zh": "我想象中的房子是这样的。", "a": "0e786669463a"}, {"sp": "", "role": "r", "id": "Rumah saya ukurannya tidak perlu terlalu besar, tapi nyaman.", "zh": "我的房子不需要太大，但要舒适。", "a": "fbff95066b40"}, {"sp": "", "role": "r", "id": "Saya ingin ada taman dengan bunga berwarna-warni di dekat rumah.", "zh": "我希望房子附近有一个开满五颜六色鲜花的花园。", "a": "4f96b4fa6139"}, {"sp": "", "role": "r", "id": "Saya suka rumah yang luas tetapi tidak kosong.", "zh": "我喜欢宽敞但不空荡的房子。", "a": "8347c2729c44"}, {"sp": "", "role": "r", "id": "Rumah saya punya tiga kamar tidur.", "zh": "我的房子有三间卧室。", "a": "f664a7f784dd"}, {"sp": "", "role": "r", "id": "Di luar ada tempat untuk bersantai.", "zh": "外面有一个休闲的地方。", "a": "645345f15de6"}, {"sp": "", "role": "r", "id": "Saya suka lingkungan yang ramah dan rumah dengan banyak jendela.", "zh": "我喜欢友善的邻里环境和窗户多的房子。", "a": "a6e8b5b38ea0"}, {"sp": "", "role": "r", "id": "Banyak jendela bertujuan agar cahaya matahari masuk dengan baik.", "zh": "窗户多是为了让阳光好好照进来。", "a": "c0c18c841bd7"}, {"sp": "", "role": "r", "id": "Dinding rumah saya berwarna biru muda dan hijau muda.", "zh": "我家的墙是浅蓝色和浅绿色的。", "a": "1eff528783ef"}, {"sp": "", "role": "r", "id": "Itulah gambaran rumah dalam bayangan saya.", "zh": "这就是我想象中房子的样子。", "a": "078f84b1fb58"}], "zh": "我想象中的家是这样的：房子不需要太大，但要舒适。我希望房子附近有一个开满五颜六色花朵的花园。我喜欢宽敞但不空荡的房子。我的家有三间卧室，外面有一个可以休闲放松的地方。我喜欢友好的环境和窗户很多的房子，窗户多是为了让阳光充分照进来。我家的墙是淡蓝色和浅绿色的。这就是我想象中家的样子。", "note": "", "qa": []}, {"id": "t48", "kind": "text", "book": "武功秘籍", "title": "（教材同主题）Mila 的家 Rumah Mila", "lines": [{"sp": "", "role": "r", "id": "Meli pergi ke rumah Mila di Bekasi.", "zh": "Meli 去了 Mila 在勿加泗的家。", "a": "2b3b266d5df5"}, {"sp": "", "role": "r", "id": "Dia bercerita tentang rumah Mila kepada temannya, Ben.", "zh": "她跟朋友 Ben 讲了 Mila 家的情况。", "a": "bcf468436f6e"}, {"sp": "", "role": "r", "id": "Rumah Mila sangat bagus.", "zh": "Mila 的家非常漂亮。", "a": "fa8836a93856"}, {"sp": "", "role": "r", "id": "Ukurannya tidak terlalu besar.", "zh": "房子不算太大。", "a": "02f1fe4edd55"}, {"sp": "", "role": "r", "id": "Di depan rumah ada tempat parkir mobil.", "zh": "房子前面有停车位。", "a": "35f7bd512931"}, {"sp": "", "role": "r", "id": "Rumahnya bercat hijau dan putih.", "zh": "房子刷成绿色和白色。", "a": "4a9d73150e1d"}, {"sp": "", "role": "r", "id": "Genting rumahnya berwarna abu-abu.", "zh": "屋顶的瓦是灰色的。", "a": "c9512689062e"}, {"sp": "", "role": "r", "id": "Rumahnya ber-AC.", "zh": "房子里有空调。", "a": "893d41d885c6"}, {"sp": "", "role": "r", "id": "Di depan rumah ada lahan untuk menanam tanaman.", "zh": "房子前面有一块种植物的空地。", "a": "9c35908f1932"}, {"sp": "", "role": "r", "id": "Pintunya berwarna cokelat tua.", "zh": "门是深棕色的。", "a": "cbe6748719ab"}], "zh": "Meli 去了 Mila 在勿加泗（Bekasi）的家，她跟朋友 Ben 讲了 Mila 家的样子。Mila 的家很漂亮，不太大。房子前面有停车位。房子刷成绿白两色，屋顶瓦片是灰色的。房子里有空调。房子前面有一块种植物的空地。门是深棕色的。", "note": "", "qa": []}, {"id": "t49", "kind": "text", "book": "武功秘籍", "title": "海边度假 Liburan ke Pantai", "lines": [{"sp": "", "role": "r", "id": "Setiap liburan, Siti dan keluarganya pergi ke pantai.", "zh": "每逢假期，Siti 和家人都去海边。", "a": "3eca98d211da"}, {"sp": "", "role": "r", "id": "Mereka berangkat pagi-pagi dengan mobil.", "zh": "", "a": "13bdfa4044e0"}, {"sp": "", "role": "r", "id": "Di pantai, mereka bermain pasir, berenang, dan bermain bola.", "zh": "在海边，他们玩沙子、游泳、踢球。", "a": "e2e642fa566d"}, {"sp": "", "role": "r", "id": "Siti sangat senang melihat laut dan mendengar suara ombak.", "zh": "", "a": "f2209b81e958"}, {"sp": "", "role": "r", "id": "Mereka juga membawa bekal untuk makan siang di tepi pantai.", "zh": "他们还带了便当，在海边吃午饭。", "a": "9064873730ba"}, {"sp": "", "role": "r", "id": "Pada sore hari, Siti dan keluarganya duduk di bawah pohon sambil menikmati minuman dingin.", "zh": "", "a": "923fbd074aa3"}, {"sp": "", "role": "r", "id": "Siti merasa liburan di pantai sangat berkesan dan menyenangkan.", "zh": "", "a": "9312bb730f5d"}, {"sp": "", "role": "r", "id": "Mereka berharap bisa pergi ke pantai lagi minggu depan.", "zh": "", "a": "de2d61ade434"}], "zh": "每到假期，Siti 和她的家人都会去海边。他们一大早就开车出发。在海边，他们玩沙子、游泳、玩球。Siti 看着大海、听着海浪声，非常开心。他们还带了自己做的便当，在海边吃午饭。下午，Siti 和家人坐在树下，一边享用冷饮。Siti 觉得在海边度假很难忘、很开心。他们希望下周还能再去海边。", "note": "", "qa": []}, {"id": "t50", "kind": "text", "book": "武功秘籍", "title": "逛传统市场 Pasar Tradisional", "lines": [{"sp": "", "role": "r", "id": "Kemarin pagi ibu mengajak saya ke pasar tradisional dekat rumah kami.", "zh": "昨天早上，妈妈带我去了我们家附近的传统市场。", "a": "64ba17c8cf6b"}, {"sp": "", "role": "r", "id": "Pasar itu sangat ramai seperti biasa, terutama di hari Minggu.", "zh": "市场像往常一样很热闹，尤其是星期天。", "a": "a544cb31960a"}, {"sp": "", "role": "r", "id": "Ibu membeli banyak kebutuhan mingguan, termasuk beras, minyak goreng, dan bumbu dapur.", "zh": "妈妈买了很多一周要用的东西，包括大米、食用油和厨房调料。", "a": "8fd690ae010d"}, {"sp": "", "role": "r", "id": "Kami juga membeli berbagai macam buah segar seperti apel, jeruk, dan pisang.", "zh": "我们还买了各种新鲜水果，比如苹果、橘子和香蕉。", "a": "186e2ffc5216"}, {"sp": "", "role": "r", "id": "Saya membantu ibu membawa belanjaan yang cukup berat itu.", "zh": "我帮妈妈提那些挺重的东西。", "a": "fc7262d6ead5"}, {"sp": "", "role": "r", "id": "Sesampainya di rumah, kami menyimpan semua belanjaan di dapur.", "zh": "到家后，我们把买的东西都放进厨房。", "a": "de789a2f8461"}, {"sp": "", "role": "r", "id": "Meskipun capek, saya senang bisa membantu ibu.", "zh": "虽然很累，但我很高兴能帮上妈妈。", "a": "5fc551a6904c"}], "zh": "昨天早上，妈妈带我去我们家附近的传统市场。和往常一样，市场非常热闹，尤其是星期天。妈妈买了很多一周要用的东西，包括大米、食用油和厨房调料。我们还买了各种新鲜水果，比如苹果、橘子和香蕉。我帮妈妈拎那些挺重的东西。一到家，我们就把买的东西都放进了厨房。虽然很累，但能帮到妈妈我很开心。", "note": "", "qa": []}, {"id": "t51", "kind": "text", "book": "武功秘籍", "title": "开学第一天 Hari Pertama Dina di Kampus", "lines": [{"sp": "", "role": "r", "id": "Hari ini adalah hari pertama Dina kuliah.", "zh": "", "a": "22dce7aa88b1"}, {"sp": "", "role": "r", "id": "Dina bangun pagi-pagi karena dia tidak mau terlambat.", "zh": "", "a": "df56b80a7eff"}, {"sp": "", "role": "r", "id": "Setelah sarapan, Dina berangkat ke kampus naik bus.", "zh": "", "a": "7e5808139904"}, {"sp": "", "role": "r", "id": "Sesampainya di kampus, dia bertemu banyak mahasiswa baru.", "zh": "", "a": "3a5d2e9d462e"}, {"sp": "", "role": "r", "id": "Mereka mengikuti kegiatan perkenalan dan mendengarkan penjelasan dari dosen.", "zh": "", "a": "9d1924458028"}, {"sp": "", "role": "r", "id": "Dina merasa sedikit gugup, tetapi juga bersemangat.", "zh": "", "a": "1159ff0b7975"}, {"sp": "", "role": "r", "id": "Pada waktu istirahat, dia berkenalan dengan beberapa teman baru.", "zh": "休息时，她认识了几个新朋友。", "a": "68de20aba3f0"}, {"sp": "", "role": "r", "id": "Setelah acara selesai, Dina pulang dengan gembira dan tidak sabar untuk belajar minggu depan.", "zh": "", "a": "26c9f86d2b00"}], "zh": "今天是 Dina 上大学的第一天。Dina 起得很早，因为她不想迟到。吃完早饭，Dina 坐公交车出发去学校。到了学校，她遇到了很多新同学。他们参加了互相认识的活动，听老师讲解。Dina 感到有点紧张，但也很兴奋。休息的时候，她认识了几个新朋友。活动结束后，Dina 高高兴兴地回家，很期待下周的学习。", "note": "", "qa": []}, {"id": "t52", "kind": "text", "book": "武功秘籍", "title": "我的家庭 Keluarga Saya", "lines": [{"sp": "", "role": "r", "id": "Keluarga saya terdiri dari enam orang.", "zh": "我家有六口人。", "a": "ccb6d189a7f0"}, {"sp": "", "role": "r", "id": "Ada ayah yang bekerja sebagai guru dan ada ibu yang mengurus rumah tangga.", "zh": "爸爸是老师，妈妈在家操持家务。", "a": "29339753f161"}, {"sp": "", "role": "r", "id": "Saya memiliki dua kakak perempuan dan satu adik laki-laki.", "zh": "我有两个姐姐和一个弟弟。", "a": "dd9a7ce9d281"}, {"sp": "", "role": "r", "id": "Ayah bekerja di sekolah di sekitar rumah kami.", "zh": "爸爸在我们家附近的学校工作。", "a": "1443bbfddb81"}, {"sp": "", "role": "r", "id": "Ibu selalu memasak makanan enak untuk kami.", "zh": "妈妈总是给我们做好吃的。", "a": "7c2ce7c57340"}, {"sp": "", "role": "r", "id": "Kakak saya sudah punya dua anak yang lucu.", "zh": "我姐姐已经有两个可爱的孩子了。", "a": "b13565638da2"}, {"sp": "", "role": "r", "id": "Setiap minggu kami berkumpul bersama untuk makan malam dan bercerita tentang aktivitas masing-masing.", "zh": "每周我们都聚在一起吃晚饭，聊聊各自的生活。", "a": "7ebe9b530343"}, {"sp": "", "role": "r", "id": "Kebersamaan dalam keluarga sangat berarti bagi kami.", "zh": "家人团聚对我们来说很重要。", "a": "aa6a5841761c"}], "zh": "我家一共六口人。爸爸是老师，妈妈操持家务。我有两个姐姐和一个弟弟。爸爸在我家附近的学校工作。妈妈总是给我们做好吃的饭菜。我姐姐已经有两个可爱的孩子了。每个星期我们都会聚在一起吃晚饭，聊聊各自的生活。家人在一起的时光对我们来说非常有意义。", "note": "", "qa": []}, {"id": "t53", "kind": "text", "book": "武功秘籍", "title": "我的新朋友 Putu Teman Baru Saya", "lines": [{"sp": "", "role": "r", "id": "Saya ingin memperkenalkan teman baru saya.", "zh": "我想介绍一下我的新朋友。", "a": "9136057e64a6"}, {"sp": "", "role": "r", "id": "Namanya Putu dan dia berasal dari Bali.", "zh": "他叫 Putu，来自巴厘岛。", "a": "93a10da7d0a2"}, {"sp": "", "role": "r", "id": "Sekarang Putu tinggal di Jakarta untuk kuliah.", "zh": "Putu 现在在雅加达上大学。", "a": "f3c6808b41e7"}, {"sp": "", "role": "r", "id": "Usianya dua puluh satu tahun dan dia adalah mahasiswa di Universitas Indonesia.", "zh": "他二十一岁，是印度尼西亚大学的学生。", "a": "91cdac27a248"}, {"sp": "", "role": "r", "id": "Putu sangat suka memasak makanan tradisional Bali di waktu luang.", "zh": "Putu 空闲时很喜欢做巴厘岛的传统菜。", "a": "4b7792827a41"}, {"sp": "", "role": "r", "id": "Dia sering mengajari saya membuat makanan daerahnya.", "zh": "他常常教我做他家乡的菜。", "a": "89efdfda1f35"}, {"sp": "", "role": "r", "id": "Putu juga pandai menari dan sangat ramah kepada semua orang.", "zh": "Putu 还很会跳舞，对谁都很友善。", "a": "d0b159e81dd7"}, {"sp": "", "role": "r", "id": "Saya senang sekali punya teman baru seperti dia.", "zh": "我很高兴有他这样的新朋友。", "a": "c8787737885e"}], "zh": "我想介绍一下我的新朋友。他叫 Putu，来自巴厘岛。现在 Putu 住在雅加达读大学。他今年二十一岁，是印度尼西亚大学的学生。Putu 空闲时非常喜欢做巴厘岛的传统菜，他经常教我做他家乡的菜。Putu 还很会跳舞，对所有人都很友善。有这样一位新朋友，我非常开心。", "note": "", "qa": []}, {"id": "t54", "kind": "text", "book": "武功秘籍", "title": "我的新朋友 Sarah Teman Baru Saya", "lines": [{"sp": "", "role": "r", "id": "Saya punya teman baru.", "zh": "我有一个新朋友。", "a": "0e4dd4107038"}, {"sp": "", "role": "r", "id": "Namanya Sarah.", "zh": "她叫 Sarah。", "a": "323498da4799"}, {"sp": "", "role": "r", "id": "Sarah berasal dari Inggris.", "zh": "Sarah 来自英国。", "a": "1c11cd0a4abd"}, {"sp": "", "role": "r", "id": "Dia baik, ramah, dan suka menolong.", "zh": "她人很好，很友善，也乐于助人。", "a": "90371bcfa0cf"}, {"sp": "", "role": "r", "id": "Dia selalu menyapa kami.", "zh": "她总是跟我们打招呼。", "a": "331900eb05a7"}, {"sp": "", "role": "r", "id": "Di kelas dia juga suka membantu temannya belajar.", "zh": "在课堂上她也喜欢帮同学学习。", "a": "451dc614ff5d"}, {"sp": "", "role": "r", "id": "Namun, Sarah agak cerewet.", "zh": "不过，Sarah 有点唠叨。", "a": "1bd1fcb25174"}, {"sp": "", "role": "r", "id": "Di pesta ulang tahunnya, Sarah menelepon semua orang agar datang tepat waktu.", "zh": "在她的生日派对上，Sarah 给每个人打电话，让大家准时到。", "a": "ada2eee76b37"}, {"sp": "", "role": "r", "id": "Dia juga perfeksionis.", "zh": "她还是个完美主义者。", "a": "8d8fe2d5c531"}, {"sp": "", "role": "r", "id": "Dia mengatur sendiri dekorasi, makanan, dan minuman.", "zh": "她亲自安排装饰、食物和饮料。", "a": "080af4ac5528"}, {"sp": "", "role": "r", "id": "Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "她希望派对完美，一点差错都没有。", "a": "5a3597d61046"}], "zh": "我有一个新朋友，她叫 Sarah，来自英国。她人很好、很友善，也乐于助人。她总是主动跟我们打招呼。在课堂上她也喜欢帮同学学习。不过，Sarah 有点爱操心。在她的生日派对上，她给所有人打电话，让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排。她希望活动完美，不出任何差错。", "note": "", "qa": []}, {"id": "t55", "kind": "text", "book": "武功秘籍", "title": "周六去市图书馆 Ke Perpustakaan Kota", "lines": [{"sp": "", "role": "r", "id": "Pada hari Sabtu, Rudi pergi ke perpustakaan kota bersama temannya.", "zh": "", "a": "37bae1327ebb"}, {"sp": "", "role": "r", "id": "Mereka datang pada pukul sembilan pagi.", "zh": "", "a": "49f8b499b7f3"}, {"sp": "", "role": "r", "id": "Di perpustakaan, Rudi mencari buku tentang sejarah Indonesia.", "zh": "", "a": "4195538cfe25"}, {"sp": "", "role": "r", "id": "Temannya mencari buku cerita dan majalah.", "zh": "", "a": "65bcf434356a"}, {"sp": "", "role": "r", "id": "Suasana perpustakaan sangat tenang sehingga mereka bisa membaca dengan nyaman.", "zh": "", "a": "f005c0f9179d"}, {"sp": "", "role": "r", "id": "Setelah membaca selama dua jam, mereka meminjam beberapa buku untuk dibawa pulang.", "zh": "", "a": "263c0fc8a60c"}, {"sp": "", "role": "r", "id": "Sebelum pulang, mereka membeli minuman di toko dekat perpustakaan.", "zh": "", "a": "dd7388ef77fb"}], "zh": "星期六，Rudi 和朋友一起去了市图书馆。他们早上九点到。在图书馆里，Rudi 找关于印尼历史的书，他的朋友找故事书和杂志。图书馆里很安静，所以他们可以舒舒服服地看书。看了两个小时后，他们借了几本书带回家。回家之前，他们在图书馆附近的商店买了饮料。", "note": "", "qa": []}, {"id": "t56", "kind": "text", "book": "BIPA 1", "title": "Ni Luh 的自我介绍（音频 2.1）", "lines": [{"sp": "", "role": "r", "id": "Kenalkan, nama saya Ni Luh Putu Riyandewi.", "zh": "你好，我叫 Ni Luh Putu Riyandewi。", "a": "eda531cdd12f"}, {"sp": "", "role": "r", "id": "Usia saya dua puluh empat tahun.", "zh": "我二十四岁。", "a": "8aa2d4fc4236"}, {"sp": "", "role": "r", "id": "Saya berasal dari Bali.", "zh": "我来自巴厘岛。", "a": "db6d14551293"}, {"sp": "", "role": "r", "id": "Saya tinggal di Tabanan.", "zh": "我住在塔巴南。", "a": "d0e78cec1cc6"}, {"sp": "", "role": "r", "id": "Saya mahasiswa.", "zh": "我是大学生。", "a": "4ca665463771"}], "zh": "认识一下，我叫 Ni Luh Putu Riyandewi。我今年二十四岁，来自巴厘岛，住在塔巴南。我是大学生。", "note": "", "qa": [{"q": "Siapa nama lengkap Ni Luh?", "a": "Ni Luh Putu Riyandewi.", "qa": "4fb9a10cbea6", "aa": "b4c9027d3f79", "qz": "Ni Luh 的全名叫什么？", "az": "Ni Luh Putu Riyandewi。"}, {"q": "Ni Luh berasal dari mana?", "a": "Dari Bali.", "qa": "d93f8b0b5914", "aa": "f70042359462", "qz": "Ni Luh 来自哪里？", "az": "来自巴厘岛。"}, {"q": "Berapa usia Ni Luh?", "a": "Dua puluh empat tahun.", "qa": "65c245cf4d66", "aa": "fa141a14e933", "qz": "Ni Luh 多大了？", "az": "二十四岁。"}]}, {"id": "t57", "kind": "text", "book": "BIPA 1", "title": "Ni Luh 的身份证（KTP）", "lines": [{"sp": "", "role": "r", "id": "KARTU TANDA PENDUDUK — Provinsi Bali, Kabupaten Tabanan.", "zh": "居民身份证——巴厘省，塔巴南县。", "a": "5b7b4201aaf8"}, {"sp": "", "role": "r", "id": "NIK: 3216064205950001.", "zh": "身份证号：3216064205950001。", "a": "68c27e79e425"}, {"sp": "", "role": "r", "id": "Nama: Ni Luh Putu Riyandewi.", "zh": "姓名：Ni Luh Putu Riyandewi。", "a": "c559bc5e2c79"}, {"sp": "", "role": "r", "id": "Tempat/Tgl Lahir: Tabanan, 02-05-1995.", "zh": "出生地/日期：塔巴南，1995年5月2日。", "a": "03b57216b862"}, {"sp": "", "role": "r", "id": "Jenis Kelamin: Perempuan.", "zh": "性别：女。", "a": "6bc303f52d7c"}, {"sp": "", "role": "r", "id": "Gol.", "zh": "血型", "a": "57e640ddf0ab"}, {"sp": "", "role": "r", "id": "Darah: B.", "zh": "血型：B。", "a": "44489b0a4013"}, {"sp": "", "role": "r", "id": "Alamat: Jalan Pulau Menjangan, RT/RW 003/010, Kel/Desa Dauh Peken, Kecamatan Tabanan.", "zh": "地址：Pulau Menjangan 路，RT/RW 003/010，Dauh Peken 村，塔巴南区。", "a": "32a33e5aa8d1"}, {"sp": "", "role": "r", "id": "Agama: Hindu.", "zh": "宗教：印度教。", "a": "f61b0def5222"}, {"sp": "", "role": "r", "id": "Status Perkawinan: Belum Kawin.", "zh": "婚姻状况：未婚。", "a": "54a9352ac766"}, {"sp": "", "role": "r", "id": "Pekerjaan: Mahasiswa.", "zh": "职业：大学生。", "a": "ae0fcd909c89"}, {"sp": "", "role": "r", "id": "Kewarganegaraan: WNI.", "zh": "国籍：印度尼西亚公民。", "a": "98ff8fc80231"}, {"sp": "", "role": "r", "id": "Berlaku Hingga: Seumur Hidup.", "zh": "有效期：终身。", "a": "acd472c5d1d6"}], "zh": "居民身份证——巴厘省塔巴南县。身份证号：3216064205950001。姓名：Ni Luh Putu Riyandewi。出生地/日期：塔巴南，1995 年 5 月 2 日。性别：女。血型：B。地址：Pulau Menjangan 路，RT/RW 003/010，Dauh Peken 村，塔巴南区。宗教：印度教。婚姻状况：未婚。职业：大学生。国籍：印尼公民（WNI）。有效期：终身。", "note": "原书为身份证图片，已转成文字。生词：Jenis kelamin 性别；Kawin 结婚；WNI = Warga Negara Indonesia 印尼公民；Berlaku hingga 有效期至；Seumur hidup 终身。", "qa": [{"q": "Di mana alamat rumah Ni Luh?", "a": "Di Jalan Pulau Menjangan, Dauh Peken, Tabanan.", "qa": "f0148b6396d1", "aa": "c7892ee66a3b", "qz": "Ni Luh 家的地址在哪里？", "az": "在塔巴南 Dauh Peken 的 Pulau Menjangan 路。"}, {"q": "Apa agama Ni Luh?", "a": "Hindu.", "qa": "057e4e6e815b", "aa": "16d18bddf3c7", "qz": "Ni Luh 信什么宗教？", "az": "印度教。"}, {"q": "Apa pekerjaan Ni Luh?", "a": "Mahasiswa.", "qa": "78d37c9cce2c", "aa": "5f1ee25a8ba9", "qz": "Ni Luh 是做什么的？", "az": "大学生。"}, {"q": "Apa kewarganegaraan Ni Luh?", "a": "WNI (Indonesia).", "qa": "fdaf132bd651", "aa": "76c43d153abe", "qz": "Ni Luh 是哪国人？", "az": "印度尼西亚公民。"}, {"q": "Apa golongan darah Ni Luh?", "a": "B.", "qa": "4f33663e1070", "aa": "6185bfd0a51f", "qz": "Ni Luh 是什么血型？", "az": "B 型。"}]}, {"id": "t58", "kind": "text", "book": "Daring", "title": "认识印尼名人", "lines": [{"sp": "", "role": "r", "id": "Kenalkan, ini Agnes Monica.", "zh": "介绍一下，这是 Agnes Monica。", "a": "462ea972f44b"}, {"sp": "", "role": "r", "id": "Dia penyanyi.", "zh": "她是歌手。", "a": "550813a1e059"}, {"sp": "", "role": "r", "id": "Dia berasal dari Jakarta.", "zh": "她来自雅加达。", "a": "a1551e3d01c0"}, {"sp": "", "role": "r", "id": "Dia lahir tanggal 1 Juli 1986.", "zh": "她出生于1986年7月1日。", "a": "c81ccae378a2"}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Bapak Joko Widodo.", "zh": "介绍一下，这是佐科·维多多先生。", "a": "814321d93058"}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Rudy Hartono.", "zh": "介绍一下，这是 Rudy Hartono。", "a": "c95823f0ed8b"}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Nadiem Anwar Makarim.", "zh": "介绍一下，这是 Nadiem Anwar Makarim。", "a": "952d220da15b"}, {"sp": "", "role": "r", "id": "/ Kenalkan, ini Sri Mulyani Indrawati.", "zh": "介绍一下，这是 Sri Mulyani Indrawati。", "a": "015b50b704ac"}], "zh": "介绍一下，这是 Agnes Monica，她是歌手，来自雅加达，1986 年 7 月 1 日出生。/ 这是 Joko Widodo 先生（印尼前总统）。/ 这是 Rudy Hartono（羽毛球名将）。/ 这是 Nadiem Anwar Makarim（前教育部长）。/ 这是 Sri Mulyani Indrawati（财政部长）。", "note": "练习：仿照第一句，用“Dia …… Dia berasal dari …… Dia lahir tanggal ……”介绍其他人。", "qa": []}, {"id": "t59", "kind": "text", "book": "BIPA 1", "title": "Raden 的家（课文 3.1）", "lines": [{"sp": "", "role": "r", "id": "Ini keluarga Raden.", "zh": "这是 Raden 的家。", "a": "30fa8bcf7663"}, {"sp": "", "role": "r", "id": "Ada ayah, ibu, kakak perempuan, dan Raden.", "zh": "有爸爸、妈妈、姐姐和 Raden。", "a": "1109c2680984"}, {"sp": "", "role": "r", "id": "Orang tua Raden namanya Dedi dan Heni.", "zh": "Raden 的父母叫 Dedi 和 Heni。", "a": "c8509495bd3d"}, {"sp": "", "role": "r", "id": "Raden punya kakak perempuan.", "zh": "Raden 有一个姐姐。", "a": "51ce3c3d15e6"}, {"sp": "", "role": "r", "id": "Namanya Rara.", "zh": "她叫 Rara。", "a": "1a3e15728180"}, {"sp": "", "role": "r", "id": "Rara menikah dengan Bayu.", "zh": "Rara 嫁给了 Bayu。", "a": "cdda21f90b69"}, {"sp": "", "role": "r", "id": "Bayu menjadi kakak ipar Raden.", "zh": "Bayu 成了 Raden 的姐夫。", "a": "3999d5d5d2e8"}, {"sp": "", "role": "r", "id": "Raden punya keponakan.", "zh": "Raden 有一个外甥女。", "a": "902be41ede14"}, {"sp": "", "role": "r", "id": "Namanya Tika.", "zh": "她叫 Tika。", "a": "5c5cd18d6196"}, {"sp": "", "role": "r", "id": "Tika memanggil orang tua Raden dengan sebutan kakek dan nenek.", "zh": "Tika 称呼 Raden 的父母为外公和外婆。", "a": "adb64c1dc355"}], "zh": "这是 Raden 的家。有爸爸、妈妈、姐姐和 Raden。Raden 的父母叫 Dedi 和 Heni。Raden 有一个姐姐，叫 Rara。Rara 嫁给了 Bayu，Bayu 就成了 Raden 的姐夫。Raden 有一个外甥女，叫 Tika。Tika 称呼 Raden 的父母为爷爷和奶奶（外公外婆）。", "note": "", "qa": [{"q": "Ada berapa orang dalam foto keluarga Raden?", "a": "Ada empat orang.", "qa": "3d236eaaaa31", "aa": "48539276f6ab", "qz": "Raden 的全家福里有几个人？", "az": "有四个人。"}, {"q": "Siapa saja nama anggota keluarga Raden?", "a": "Dedi, Heni, Rara, dan Raden (juga Bayu dan Tika).", "qa": "bf67d2a64c4a", "aa": "b02974f487b2", "qz": "Raden 家里人都叫什么名字？", "az": "Dedi、Heni、Rara 和 Raden（还有 Bayu 和 Tika）。"}, {"q": "Dedi menikah dengan siapa?", "a": "Dengan Heni.", "qa": "d143205b93b2", "aa": "f0c739e16688", "qz": "Dedi 和谁结婚了？", "az": "和 Heni。"}, {"q": "Apa hubungan Dedi dan Heni dengan Tika?", "a": "Mereka kakek dan nenek Tika.", "qa": "34f823e45a0e", "aa": "1d40def0d027", "qz": "Dedi 和 Heni 跟 Tika 是什么关系？", "az": "他们是 Tika 的外公外婆。"}, {"q": "Apakah Raden sudah menikah?", "a": "Belum.", "qa": "a18f3128261b", "aa": "7cb4158bcaa7", "qz": "Raden 结婚了吗？", "az": "还没有。"}]}, {"id": "t60", "kind": "text", "book": "BIPA 1", "title": "生日礼物（课文 4.1）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Mega.", "zh": "我叫 Mega。", "a": "5fe26f1a8f1c"}, {"sp": "", "role": "r", "id": "Saya anak kedua dari tiga bersaudara.", "zh": "我是三个兄弟姐妹中的老二。", "a": "026f8589dba2"}, {"sp": "", "role": "r", "id": "Saya lahir pada tanggal 2 Mei 1996.", "zh": "我出生于1996年5月2日。", "a": "179b97a2c6bc"}, {"sp": "", "role": "r", "id": "Tahun ini saya merayakan ulang tahun yang ke-23 di restoran.", "zh": "今年我在餐厅过了23岁生日。", "a": "8c05488b86fb"}, {"sp": "", "role": "r", "id": "Teman-teman saya memberi hadiah sebuah jam tangan.", "zh": "朋友们送了我一块手表。", "a": "7f5f3932df02"}, {"sp": "", "role": "r", "id": "Keluarga saya memberi hadiah peralatan melukis.", "zh": "家人送了我一套画画工具。", "a": "511d64a9d153"}, {"sp": "", "role": "r", "id": "Saat ini saya berkuliah di Jurusan Seni Lukis.", "zh": "我现在在读绘画专业。", "a": "63fc3e2afe0b"}, {"sp": "", "role": "r", "id": "Seandainya lulus kuliah nanti, saya ingin menjadi pelukis.", "zh": "等大学毕业以后，我想当一名画家。", "a": "5d6c29bb4b39"}], "zh": "我叫 Mega，是家里三个孩子中的老二。我出生于 1996 年 5 月 2 日。今年我在餐厅庆祝了 23 岁生日。朋友们送了我一块手表，家人送了我一套绘画工具。我现在在读绘画专业。假如将来毕业了，我想当一名画家。", "note": "", "qa": [{"q": "Berapa jumlah saudara Mega?", "a": "Dua orang.", "qa": "c366266875f9", "aa": "a3c05bf72388", "qz": "Mega 有几个兄弟姐妹？", "az": "两个。"}, {"q": "Tanggal berapa Mega lahir?", "a": "Tanggal 2 Mei 1996.", "qa": "806800117cf0", "aa": "53d1f8f391ef", "qz": "Mega 是几号出生的？", "az": "1996年5月2日。"}, {"q": "Bagaimana Mega merayakan ulang tahunnya tahun ini?", "a": "Di restoran, ulang tahun yang ke-23.", "qa": "2cb9b5d464f5", "aa": "6887234cf3ef", "qz": "Mega 今年怎么过生日的？", "az": "在餐厅过的，23岁生日。"}, {"q": "Apa hadiah dari keluarga Mega?", "a": "Peralatan melukis.", "qa": "681583023128", "aa": "6e7b242f8537", "qz": "Mega 家人送了什么礼物？", "az": "画画工具。"}, {"q": "Apa hadiah dari teman-temannya?", "a": "Sebuah jam tangan.", "qa": "67f0cfa72a6d", "aa": "8ae81170d2d2", "qz": "她的朋友们送了什么礼物？", "az": "一块手表。"}, {"q": "Apa harapan Mega?", "a": "Menjadi pelukis.", "qa": "773b1f9c7288", "aa": "1112bdbe5819", "qz": "Mega 的愿望是什么？", "az": "当画家。"}]}, {"id": "t61", "kind": "text", "book": "BIPA 1", "title": "Lia 的生日准备（课文 4.2）", "lines": [{"sp": "", "role": "r", "id": "Lia lahir pada tanggal 10 Oktober 1994.", "zh": "Lia 出生于1994年10月10日。", "a": "a660ae5ef5b8"}, {"sp": "", "role": "r", "id": "Tahun ini Lia berulang tahun yang ke-25.", "zh": "今年 Lia 满25岁。", "a": "31902e16e68c"}, {"sp": "", "role": "r", "id": "Bulan depan hari ulang tahun Lia.", "zh": "下个月是 Lia 的生日。", "a": "4b21966965cf"}, {"sp": "", "role": "r", "id": "Lia menyiapkan pesta ulang tahunnya minggu ini.", "zh": "Lia 这周在准备她的生日派对。", "a": "69168f89c5e9"}, {"sp": "", "role": "r", "id": "Kemarin Lia mengirim undangan ulang tahun.", "zh": "昨天 Lia 发出了生日邀请。", "a": "437cec14e59e"}, {"sp": "", "role": "r", "id": "Besok Lia akan membeli baju ulang tahun.", "zh": "明天 Lia 要去买生日穿的衣服。", "a": "732df4dc4bbd"}, {"sp": "", "role": "r", "id": "Lusa Lia akan pergi ke toko kue.", "zh": "后天 Lia 要去蛋糕店。", "a": "b0c357cf9836"}], "zh": "Lia 出生于 1994 年 10 月 10 日，今年过 25 岁生日。下个月就是她的生日。Lia 这周在准备她的生日派对。昨天她寄出了生日请柬，明天要去买生日穿的衣服，后天要去蛋糕店。", "note": "", "qa": [{"q": "Kapan Lia lahir?", "a": "Tanggal 10 Oktober 1994.", "qa": "34902f49b327", "aa": "8a8b143306a4", "qz": "Lia 什么时候出生的？", "az": "1994年10月10日。"}, {"q": "Tahun ini Lia berulang tahun yang ke berapa?", "a": "Yang ke-25.", "qa": "416349ead8d0", "aa": "ab46b1d806aa", "qz": "Lia 今年过几岁生日？", "az": "25岁。"}, {"q": "Apa yang Lia lakukan kemarin?", "a": "Mengirim undangan ulang tahun.", "qa": "7eb6f04eca0c", "aa": "d5eeb790a759", "qz": "Lia 昨天做了什么？", "az": "发生日邀请。"}, {"q": "Apa yang akan Lia lakukan besok?", "a": "Membeli baju ulang tahun.", "qa": "2a79e159e783", "aa": "94b79ea97ba2", "qz": "Lia 明天要做什么？", "az": "买生日穿的衣服。"}, {"q": "Lusa Lia akan pergi ke mana?", "a": "Ke toko kue.", "qa": "aa87f5f1d269", "aa": "dd9f562c77d9", "qz": "Lia 后天要去哪里？", "az": "去蛋糕店。"}]}, {"id": "t62", "kind": "text", "book": "BIPA 1", "title": "去瓦埃雷博村旅游（课文 5.1）", "lines": [{"sp": "", "role": "r", "id": "Bulan lalu, saya dan Anjani berwisata ke Wae Rebo, Nusa Tenggara Timur.", "zh": "上个月，我和 Anjani 去东努沙登加拉的 Wae Rebo 旅游。", "a": "fd8fce4d3ad6"}, {"sp": "", "role": "r", "id": "Kami berdua tiba di Nusa Tenggara Timur pada malam hari.", "zh": "我们俩晚上到达东努沙登加拉。", "a": "e504b015a481"}, {"sp": "", "role": "r", "id": "Esoknya, kami berjalan kaki menuju desa Wae Rebo selama empat jam.", "zh": "第二天，我们步行四个小时去 Wae Rebo 村。", "a": "5a56dd9b1d12"}, {"sp": "", "role": "r", "id": "Di sana ada tujuh rumah adat berbentuk kerucut.", "zh": "那里有七座圆锥形的传统房屋。", "a": "222bd3348c6b"}, {"sp": "", "role": "r", "id": "Kami menginap di rumah adat itu.", "zh": "我们住在那种传统房屋里。", "a": "ffb7a4b4b420"}, {"sp": "", "role": "r", "id": "Hari berikutnya, kami berkeliling di desa Wae Rebo.", "zh": "第三天，我们在 Wae Rebo 村里四处逛。", "a": "528af45dbf0a"}, {"sp": "", "role": "r", "id": "Desa ini bercuaca dingin.", "zh": "这个村子天气很冷。", "a": "82a6689919be"}, {"sp": "", "role": "r", "id": "Kami berbaju tebal.", "zh": "我们穿着厚衣服。", "a": "ac970f35d5b5"}, {"sp": "", "role": "r", "id": "Kami juga berfoto dengan penduduk desa Wae Rebo.", "zh": "我们还和 Wae Rebo 村的村民合了影。", "a": "b1e69522bbd9"}, {"sp": "", "role": "r", "id": "Sebelum pulang, kami berbelanja oleh-oleh.", "zh": "回去之前，我们买了伴手礼。", "a": "e0d2e04c8c7d"}, {"sp": "", "role": "r", "id": "Kami membeli roti kompiang dan kopi Flores.", "zh": "我们买了 kompiang 面包和弗洛勒斯咖啡。", "a": "40cdf8555bb4"}, {"sp": "", "role": "r", "id": "Roti kompiang bertabur wijen dan berasa gurih.", "zh": "kompiang 面包撒着芝麻，味道咸香。", "a": "bdf66b0ec85c"}, {"sp": "", "role": "r", "id": "Sementara itu, kopi Flores beraroma sedap dan wangi.", "zh": "而弗洛勒斯咖啡闻起来又香又浓。", "a": "b1ccb82fe66a"}, {"sp": "", "role": "r", "id": "Malam harinya, kami pulang ke Jakarta.", "zh": "当天晚上，我们回到了雅加达。", "a": "1cf498822e59"}], "zh": "上个月，我和 Anjani 去东努沙登加拉的瓦埃雷博村旅游。我们俩晚上到达东努沙登加拉。第二天，我们步行四个小时前往瓦埃雷博村。那里有七座圆锥形的传统房屋，我们就住在里面。再下一天，我们在村里四处转了转。这个村子天气很冷，我们穿着厚衣服，还和村民合了影。回家前我们买了特产：馄饨饼和弗洛勒斯咖啡。馄饨饼上撒着芝麻，味道香脆；弗洛勒斯咖啡则香气浓郁。当天晚上，我们回到了雅加达。", "note": "", "qa": [{"q": "Kapan mereka pergi ke desa Wae Rebo?", "a": "Bulan lalu.", "qa": "d80b78fc08c7", "aa": "1d4866050258", "qz": "他们什么时候去的 Wae Rebo 村？", "az": "上个月。"}, {"q": "Bagaimana mereka sampai ke desa Wae Rebo?", "a": "Berjalan kaki selama empat jam.", "qa": "76d6a782db96", "aa": "abf1e73323fd", "qz": "他们是怎么到 Wae Rebo 村的？", "az": "步行了四个小时。"}, {"q": "Ada berapa rumah adat di desa Wae Rebo?", "a": "Tujuh rumah adat.", "qa": "85bc00dfe352", "aa": "a1b75458a57d", "qz": "Wae Rebo 村有几座传统房屋？", "az": "七座。"}, {"q": "Bagaimana cuaca di desa Wae Rebo?", "a": "Dingin.", "qa": "7f6af5fce409", "aa": "dfa1e7815317", "qz": "Wae Rebo 村天气怎么样？", "az": "很冷。"}, {"q": "Apa yang mereka lakukan sebelum pulang?", "a": "Berbelanja oleh-oleh: roti kompiang dan kopi Flores.", "qa": "3abfaf73aa65", "aa": "7de5b3c0a52c", "qz": "他们回去前做了什么？", "az": "买伴手礼：kompiang 面包和弗洛勒斯咖啡。"}]}, {"id": "t63", "kind": "text", "book": "BIPA 1", "title": "Rani 的星期天（音频 6）", "lines": [{"sp": "", "role": "r", "id": "Setiap hari Minggu saya bangun siang.", "zh": "每个星期天我都睡到中午才起。", "a": "9ec621d55df1"}, {"sp": "", "role": "r", "id": "Setelah itu, saya mandi.", "zh": "然后我洗澡。", "a": "2beb156dd853"}, {"sp": "", "role": "r", "id": "Saya lalu membaca buku.", "zh": "接着我看书。", "a": "57df5231ab5c"}, {"sp": "", "role": "r", "id": "Saya juga makan camilan.", "zh": "我还吃零食。", "a": "0900b0ddb6cf"}, {"sp": "", "role": "r", "id": "Saya mencuci baju.", "zh": "我洗衣服。", "a": "af3f27353e19"}, {"sp": "", "role": "r", "id": "Sebelum itu, saya berbelanja di pasar.", "zh": "在那之前，我去市场买东西。", "a": "98b28e2f6d54"}, {"sp": "", "role": "r", "id": "Setelah itu, saya masak.", "zh": "之后，我做饭。", "a": "3ded1789a16c"}, {"sp": "", "role": "r", "id": "Kemudian, saya makan siang.", "zh": "然后，我吃午饭。", "a": "83b1180ea4a7"}, {"sp": "", "role": "r", "id": "Saya juga tidur siang.", "zh": "我还睡午觉。", "a": "334a00d0ecd6"}, {"sp": "", "role": "r", "id": "Sore hari saya bersepeda berkeliling kampung.", "zh": "傍晚我骑自行车在村子里转一圈。", "a": "9cb733266dc8"}], "zh": "每个星期天我都起得很晚。之后我洗澡，接着看书，还吃点零食。我洗衣服，在那之前我先去市场买东西。之后我做饭，然后吃午饭，还睡午觉。下午我骑自行车在村子里转一圈。", "note": "", "qa": [{"q": "Rani bangun pagi atau siang?", "a": "Rani bangun siang.", "qa": "90a966ad5e67", "aa": "84baf06a86dd", "qz": "Rani 是早上起床还是中午起床？", "az": "Rani 中午才起床。"}, {"q": "Apakah Rani makan malam?", "a": "Tidak disebutkan; Rani makan siang.", "qa": "5d006538a89a", "aa": "35cc753c287f", "qz": "Rani 吃晚饭了吗？", "az": "文中没说；Rani 吃了午饭。"}, {"q": "Sore hari Rani melakukan apa?", "a": "Bersepeda berkeliling kampung.", "qa": "a6f570cf496e", "aa": "4cead6e615bf", "qz": "Rani 下午做什么？", "az": "骑自行车在村子里转一圈。"}]}, {"id": "t64", "kind": "text", "book": "BIPA 1", "title": "Dina 的一天（课文 6.1）", "lines": [{"sp": "", "role": "r", "id": "Hai, saya Dina.", "zh": "嗨，我是 Dina。", "a": "29b130df579e"}, {"sp": "", "role": "r", "id": "Saya akan bercerita tentang kegiatan harian saya.", "zh": "我来讲讲我每天的活动。", "a": "c6d5c943b73c"}, {"sp": "", "role": "r", "id": "Pada pagi hari biasanya saya bangun pukul 05.00.", "zh": "早上我一般五点起床。", "a": "afd86a6d47d0"}, {"sp": "", "role": "r", "id": "Setelah salat subuh, saya mandi dan berpakaian kerja.", "zh": "做完晨礼后，我洗澡、换上上班的衣服。", "a": "ea957dfdd3f9"}, {"sp": "", "role": "r", "id": "Saya tidak pernah lupa untuk salat.", "zh": "我从来不会忘记做礼拜。", "a": "f34fbf020d63"}, {"sp": "", "role": "r", "id": "Saya sarapan sekitar pukul 06.00.", "zh": "我大约六点吃早饭。", "a": "075245a8fbe5"}, {"sp": "", "role": "r", "id": "Saya bekerja pada pukul 08.00—16.00.", "zh": "我的工作时间是八点到十六点。", "a": "5488bf067d40"}, {"sp": "", "role": "r", "id": "Saya selalu makan siang di kantin pukul 12.00—13.00.", "zh": "我总是十二点到十三点在食堂吃午饭。", "a": "9785f31566f5"}, {"sp": "", "role": "r", "id": "Selesai bekerja, saya langsung pulang ke rumah.", "zh": "下班后，我直接回家。", "a": "1ef4fc67eef9"}, {"sp": "", "role": "r", "id": "Saya biasanya sampai rumah pukul 17.00.", "zh": "我一般十七点到家。", "a": "ff8a322c7eba"}, {"sp": "", "role": "r", "id": "Jika jalanan macet, kadang-kadang saya sampai di rumah pukul 18.00.", "zh": "如果路上堵车，有时候十八点才到家。", "a": "88a96ea9f500"}, {"sp": "", "role": "r", "id": "Saya agak malas makan malam.", "zh": "我不太想吃晚饭。", "a": "10d0709c5afc"}, {"sp": "", "role": "r", "id": "Jadi, saya menonton televisi atau membaca buku.", "zh": "所以，我看电视或者看书。", "a": "a2d6f5dc3907"}, {"sp": "", "role": "r", "id": "Lalu, saya tidur sekitar pukul 22.00.", "zh": "然后，我大约二十二点睡觉。", "a": "3324668f9b56"}, {"sp": "", "role": "r", "id": "Pada akhir pekan saya sering pergi menonton film di bioskop dengan teman-teman.", "zh": "周末我常和朋友去电影院看电影。", "a": "9b1a3c2fcdc1"}, {"sp": "", "role": "r", "id": "Saya jarang ada di rumah.", "zh": "我很少待在家里。", "a": "7ad08b28ac9a"}], "zh": "你好，我是 Dina，我来讲讲我的日常。早上我通常五点起床，做完晨礼后洗澡、换上工作服。我从不忘记礼拜。我大约六点吃早饭。我的工作时间是八点到十六点，总是在十二点到十三点之间在食堂吃午饭。下班后我直接回家，通常十七点到家；如果路上堵车，有时十八点才到。我有点懒得吃晚饭，所以就看电视或看书，然后大约二十二点睡觉。周末我常和朋友们去电影院看电影，很少待在家里。", "note": "", "qa": [{"q": "Pukul berapa biasanya Dina tidur?", "a": "Sekitar pukul 22.00.", "qa": "8550bdfa7426", "aa": "c9121bd2ca31", "qz": "Dina 一般几点睡觉？", "az": "大约二十二点。"}, {"q": "Pukul berapa Dina bekerja?", "a": "Pukul 08.00—16.00.", "qa": "3ad354c5d96b", "aa": "57d6918e6328", "qz": "Dina 几点上班？", "az": "八点到十六点。"}, {"q": "Di mana Dina makan siang?", "a": "Di kantin.", "qa": "5a4dcad785c2", "aa": "ee5202f4e8a3", "qz": "Dina 在哪里吃午饭？", "az": "在食堂。"}, {"q": "Apa yang biasa dilakukan Dina setelah pulang kerja?", "a": "Menonton televisi atau membaca buku.", "qa": "b794bafbd163", "aa": "20f0cbea08bf", "qz": "Dina 下班后通常做什么？", "az": "看电视或者看书。"}, {"q": "Apa yang Dina lakukan pada akhir pekan?", "a": "Menonton film di bioskop dengan teman-teman.", "qa": "22922705dc3b", "aa": "067c0debe311", "qz": "Dina 周末做什么？", "az": "和朋友去电影院看电影。"}]}, {"id": "t65", "kind": "text", "book": "BIPA 1", "title": "勤奋的 Lisa（课文 6.2）", "lines": [{"sp": "", "role": "r", "id": "Adik Santi sangat rajin.", "zh": "Santi 的妹妹很勤快。", "a": "9b94b362fbe3"}, {"sp": "", "role": "r", "id": "Namanya Lisa.", "zh": "她叫 Lisa。", "a": "6dddbd40aa94"}, {"sp": "", "role": "r", "id": "Ia sudah bangun pada pukul 04.00.", "zh": "她四点就起床了。", "a": "60b36c72b10e"}, {"sp": "", "role": "r", "id": "Setiap pukul 04.30 pagi dia akan membangunkan Santi.", "zh": "每天早上四点半她都会叫醒 Santi。", "a": "e818faef48e7"}, {"sp": "", "role": "r", "id": "Pada pukul 06.30 Lisa sudah sampai di kampus.", "zh": "六点半 Lisa 已经到学校了。", "a": "a1dadc7782e2"}, {"sp": "", "role": "r", "id": "Semua tugas sudah dikerjakan Lisa setiap hari pada pukul 19.00—21.00.", "zh": "Lisa 每天晚上七点到九点就把所有作业都做完。", "a": "ba51b787d010"}, {"sp": "", "role": "r", "id": "Ketika dosen sedang menerangkan pelajaran, Lisa akan mendengarkan dengan cermat.", "zh": "老师讲课的时候，Lisa 会认真听。", "a": "e7ca0d82e8fc"}, {"sp": "", "role": "r", "id": "Begitulah aktivitas Lisa setiap hari.", "zh": "这就是 Lisa 每天的生活。", "a": "fd4d6b0b77e7"}], "zh": "Santi 的妹妹很勤奋，她叫 Lisa。她四点就起床了，每天早上四点半叫醒 Santi。六点半 Lisa 已经到了学校。每天晚上七点到九点，她把所有作业都做完。老师讲课时，Lisa 会认真听讲。这就是 Lisa 每天的生活。", "note": "语法练习：用 belum / akan / sudah / sedang 填空，见语法部分。", "qa": []}, {"id": "t66", "kind": "text", "book": "BIPA 1", "title": "在市场购物（音频 7.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Yoyo.", "zh": "嗨，我叫 Yoyo。", "a": "8fba95704f76"}, {"sp": "", "role": "r", "id": "Saya koki.", "zh": "我是厨师。", "a": "96df968890d7"}, {"sp": "", "role": "r", "id": "Saya hobi berbelanja ke pasar.", "zh": "我的爱好是去市场买东西。", "a": "04d0433b90ec"}, {"sp": "", "role": "r", "id": "Hari ini saya dan teman saya pergi ke pasar.", "zh": "今天我和朋友去了市场。", "a": "5c485eb6c73c"}, {"sp": "", "role": "r", "id": "Biasanya kami membeli banyak bahan makanan.", "zh": "我们通常会买很多食材。", "a": "ae437b058afe"}, {"sp": "", "role": "r", "id": "Di pasar ada gula, jeruk, garam, kopi, dan lombok.", "zh": "市场上有糖、橘子、盐、咖啡和辣椒。", "a": "529aec3b41a9"}, {"sp": "", "role": "r", "id": "Gula rasanya manis.", "zh": "糖是甜的。", "a": "afcfb645d32c"}, {"sp": "", "role": "r", "id": "Jeruk rasanya asam.", "zh": "橘子是酸的。", "a": "8d91c394eac1"}, {"sp": "", "role": "r", "id": "Garam rasanya asin.", "zh": "盐是咸的。",
