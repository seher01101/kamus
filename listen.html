<style>[hidden]{display:none!important}

:root{
  --ground:#f2f2f7; --surface:#ffffff; --surface-2:#e5e5ea;
  --ink:#1c1c1e; --ink-soft:#3a3a3c; --muted:#8e8e93; --line:#d1d1d6;
  --accent:#0071e3; --accent-soft:#e4f0fd; --on-accent:#ffffff;
  --good:#248a3d; --good-soft:#e3f5e8; --gold:#5856d6; --gold-soft:#ecebfc;
  --purple:#8944ab; --purple-soft:#f1e5f8;
  --font-display:"Newsreader","Microsoft YaHei","PingFang SC",Georgia,serif;
  --font-body:"IBM Plex Sans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --cjk:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --glass:color-mix(in srgb,var(--surface) 72%,transparent);
  --glass-border:color-mix(in srgb,var(--ink) 11%,transparent);
  --glass-hi:color-mix(in srgb,white 30%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --accent:#0a84ff;--accent-soft:#0a2e4d;--good:#30d158;--good-soft:#123320;--gold:#7d7aff;--gold-soft:#24234d;--purple:#bf5af2;--purple-soft:#33143d;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --accent:#0a84ff;--accent-soft:#0a2e4d;--good:#30d158;--good-soft:#123320;--gold:#7d7aff;--gold-soft:#24234d;--purple:#bf5af2;--purple-soft:#33143d;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(620px 500px at 6% -6%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 62%),
  radial-gradient(700px 600px at 106% 12%,color-mix(in srgb,var(--purple) 18%,transparent),transparent 60%),
  radial-gradient(560px 520px at 46% 118%,color-mix(in srgb,var(--good) 14%,transparent),transparent 62%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px 0}
.bar{border-radius:20px;padding:14px 16px 12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 small{font-family:var(--font-body);font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.brand > a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500}
.seg{display:flex;gap:4px;margin-top:10px;padding:3px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--ink-soft);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:14px 4px 0}
.hint b{color:var(--ink-soft)}
#list{display:grid;gap:10px;padding-block:6px 120px}
.grp{font-family:var(--cjk);font-size:15px;font-weight:700;margin:14px 4px 0;display:flex;align-items:baseline;gap:8px}
.grp small{font-size:12px;font-weight:400;color:var(--muted)}
.usub{font-family:var(--cjk);font-size:11px;font-weight:500;color:var(--muted);margin:6px 8px -2px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.usub::after{content:"";flex:1;height:1px;background:var(--line)}
.card{display:flex;align-items:center;gap:12px;border-radius:16px;padding:13px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}

.gplay{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);border:0;border-radius:99px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.gplay svg{width:11px;height:11px}
.ztag{display:inline-block;font-size:10px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px;line-height:16px}
.pset{border-radius:14px;padding:4px 14px 8px;margin:0 0 14px}
.pset .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line, rgba(60,60,67,.12));font-size:13.5px;color:var(--ink-soft)}
.pset .r > span:first-child{min-width:84px}
.pset .ch{display:inline-flex;gap:2px;padding:2px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:9px}
.pset .ch button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--ink-soft);padding:4px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.pset .ch button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:520px){.grp small{display:none}}
.pset.zo .rrep{display:none}
@media (max-width:520px){.pset .ch[data-pset="zhm"]{display:grid;grid-template-columns:1fr 1fr;width:100%}}
.pnote{font-size:12px;color:var(--muted);margin:8px 0 0}
.card .cmain{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:520px){.brand h1 small{display:none}}
.card .t{font-weight:600;font-size:15.5px;font-family:var(--cjk)}
.card .m{font-size:12px;color:var(--muted);margin-top:1px}
.card .go{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.book{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.book.wg{background:var(--gold-soft);color:var(--gold)}
.book.b2{background:var(--good-soft);color:var(--good)}
.nw{margin-left:6px;font-size:10px;font-weight:700;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;vertical-align:2px}
.book.dr{background:var(--purple-soft);color:var(--purple)}
.done{font-size:12px;color:var(--good);font-weight:600}
.pbtn{width:38px;height:38px;border-radius:99px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:0;flex-shrink:0}
.pbtn svg{width:16px;height:16px}
/* detail */
#detail{padding-block:14px 150px}
.back{font:inherit;font-size:14px;color:var(--accent);background:none;border:0;padding:4px 2px;cursor:pointer;font-weight:500}
.dh{margin:6px 4px 12px}
.dh h2{font-family:var(--cjk);font-size:21px;margin:4px 0 2px}
.dh .m{font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
/* 详情页头：一行标题 + 一排设置药丸 */
.dh2{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.dh2 .back{font-size:26px;line-height:1;padding:0 10px 3px 2px;font-weight:400}
.dh2 h2{flex:1;min-width:0;margin:0;font-family:var(--cjk);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:500;font-family:var(--cjk);white-space:nowrap;cursor:pointer;
  color:var(--ink-soft);background:var(--glass);border:1px solid var(--glass-border);border-radius:99px;padding:6px 9px;-webkit-tap-highlight-color:transparent;
  transition:background .25s,color .25s,transform .3s cubic-bezier(.34,1.56,.64,1),border-color .25s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"],.chip[aria-expanded="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:transparent;font-weight:600}
.chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.chip.dd::after{content:"";width:6px;height:6px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 1px;transition:transform .3s}
.chip.dd[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px}
.pscrim{position:fixed;inset:0;z-index:60;background:transparent}
.pmenu{position:fixed;z-index:61;border-radius:22px;padding:6px;opacity:0;transform:translateY(-10px) scale(.55);pointer-events:none;filter:blur(4px);
  transition:transform .42s cubic-bezier(.32,1.4,.6,1),opacity .22s,filter .3s}
.pmenu.open{opacity:1;transform:none;pointer-events:auto;filter:none}
.pmenu .h{font-size:11.5px;color:var(--muted);padding:6px 12px 4px;font-family:var(--cjk)}
.pmenu .mi{grid-template-columns:1fr 18px}
.pmenu.open .mi{animation:miIn .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i) * 40ms + 60ms)}
.tog{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--glass-border);background:var(--glass);color:var(--ink-soft);border-radius:99px;padding:5px 12px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lines{display:grid;gap:8px}
#detail .ln{cursor:pointer;-webkit-tap-highlight-color:transparent}
#detail .ln:active{transform:scale(.995)}
.ln{border-radius:14px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;transition:box-shadow .2s,border-color .2s}
.ln.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.ln .lp{width:32px;height:32px;border-radius:99px;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;grid-row:span 3}
.ln .lp svg{width:14px;height:14px}
.ln .lc{grid-row:span 3;display:flex;flex-direction:column;align-items:center;gap:4px}
.ln .lc .lp{grid-row:auto}
.fstar{width:32px;height:28px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:99px;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .2s}
.fstar svg{width:19px;height:19px;fill:none;stroke:currentColor;transition:fill .2s}
.fstar:active{transform:scale(.8)}
.fstar[aria-pressed="true"]{color:var(--gold)}
.fstar[aria-pressed="true"] svg{fill:currentColor;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.srs{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);cursor:default;border-radius:10px;transition:background .3s}
.srs.flash{background:var(--gold-soft)}
.srs .st{flex:1;min-width:0;font-family:var(--cjk);font-size:12px;color:var(--muted)}
.srs .st.hard{color:var(--bad,#c4264a);font-weight:600}
.gbtn{font:inherit;font-family:var(--cjk);font-size:12.5px;font-weight:600;border:0;border-radius:99px;padding:5px 14px;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.gbtn:active{transform:scale(.92)}
.gbtn.ok{color:var(--good);background:var(--good-soft)}
.gbtn.no{color:#c4264a;background:color-mix(in srgb,#c4264a 12%,transparent)}
.empty-fav{text-align:center;color:var(--muted);padding:56px 24px;line-height:1.9;font-family:var(--cjk)}
.empty-fav b{color:var(--ink-soft);font-size:15px}
.ln{position:relative}
.ln.has-an{padding-right:64px}
.anb{position:absolute;top:9px;right:10px;font:inherit;font-size:12px;font-weight:600;border:0;border-radius:99px;padding:3px 10px;cursor:pointer;color:var(--gold);background:var(--gold-soft);white-space:nowrap}
.anb::after{content:"";display:inline-block;width:5px;height:5px;margin:0 0 2px 5px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg);transition:transform .2s}
.anb[aria-expanded="true"]{color:var(--on-accent);background:var(--gold)}
.anb[aria-expanded="true"]::after{transform:rotate(-135deg);margin-bottom:-2px}
.ana-box{grid-column:1/-1;margin-top:6px;border-top:1px solid var(--line);padding-top:8px;cursor:default}
.ana-box[hidden]{display:none}
.awords{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.aw{border-radius:10px;padding:5px 9px;background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.aw b{display:block;font-family:var(--font-display);font-size:14.5px;font-weight:500;color:var(--ink)}
.aw span{display:block;font-family:var(--cjk);font-size:12.5px;color:var(--ink-soft)}
.abld{margin-top:8px;font-size:12.5px;color:var(--muted)}
.abld b,.agram b{color:var(--gold);font-weight:600}
.agram{margin-top:8px;border-radius:11px;padding:9px 11px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);background:var(--gold-soft);font-family:var(--cjk)}
.sp{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.sp.q{color:var(--gold)} .sp.a{color:var(--good)}
.id{font-family:var(--font-display);font-size:17.5px;line-height:1.45;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.zh{font-family:var(--cjk);font-size:13.5px;color:var(--ink-soft);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.hid{filter:blur(6px);user-select:none;opacity:.75}
.hid::after{content:""}
.id a{color:inherit;text-decoration:none;border-radius:3px}
.id a:hover{background:var(--accent-soft);color:var(--accent)}
.para{margin-top:12px;border-radius:14px;padding:12px 14px;font-family:var(--cjk);font-size:14px;color:var(--ink-soft)}
.para b{color:var(--ink)}
.note{font-size:12.5px;color:var(--gold);margin:8px 4px}
.qa h3{font-size:15px;margin:18px 4px 8px;font-family:var(--cjk)}
.count{display:inline-block;min-width:26px;text-align:center;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
/* player — liquid glass */
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.player>*{pointer-events:auto}
.lg{position:relative;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.34));

  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.55),0 1px 2px rgba(30,40,110,.06),0 14px 40px rgba(40,50,140,.16)}

  background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,255,255,.12) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg{background:linear-gradient(160deg,rgba(70,72,86,.52),rgba(28,28,34,.46));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.10),0 14px 44px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .lg::before{background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 40%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.18))}}
:root[data-theme="dark"] .lg{background:linear-gradient(160deg,rgba(70,72,86,.52),rgba(28,28,34,.46));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.10),0 14px 44px rgba(0,0,0,.5)}
:root[data-theme="dark"] .lg::before{background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.04) 40%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.18))}
.player .in{max-width:400px;margin:0 auto;border-radius:30px;padding:6px 10px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center;overflow:hidden}
.prog{position:absolute;left:36px;right:36px;top:3px;height:2px;border-radius:2px;background:transparent;overflow:hidden}

@keyframes miIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:absolute;bottom:calc(100% + 4px);left:50%;max-width:min(320px,calc(100% - 32px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;

句 · 职场办公室", "lines": [{"sp": "", "role": "t", "id": "Tolong kirim email ini kepada semua manajer di perusahaan.", "zh": "请把这封邮件发给公司所有的经理。", "a": "1faddb9828f1", "za": "c7e6849b7ef9", "an": {"p": [["Tolong", "请（请求帮忙）"], ["kirim", "发送、寄"], ["email ini", "这封邮件"], ["kepada", "给（接人）"], ["semua manajer", "所有经理"], ["di perusahaan", "在公司里"]], "b": "perusahaan = per- + usaha（事业）+ -an", "g": "Tolong + 动词词根 = 礼貌的请求，动词不加 meN-（kirim 不写成 mengirim）。ini 放在名词后：email ini。kirim A kepada B = 把 A 发给 B。semua + 名词 = 所有的……。"}}, {"sp": "", "role": "t", "id": "Saya butuh bantuan Anda untuk menyelesaikan laporan ini.", "zh": "我需要你的帮助来完成这份报告。", "a": "045f0bf30dd2", "za": "253ce3026810", "an": {"p": [["Saya", "我"], ["butuh", "需要（= perlu）"], ["bantuan Anda", "您的帮助"], ["untuk", "为了、来（表目的）"], ["menyelesaikan", "完成"], ["laporan ini", "这份报告"]], "b": "bantuan = bantu 帮 + -an；menyelesaikan = selesai 完 + meN-…-kan；laporan = lapor + -an", "g": "名词 + 人称 = “谁的……”：bantuan Anda = 您的帮助（所属者放后面）。untuk + 动词 = “来做……”，表目的。meN-…-kan 常表“使……完成”。"}}, {"sp": "", "role": "t", "id": "Di mana saya bisa menemukan kamar mandi dan kantin?", "zh": "我在哪里可以找到洗手间和食堂？", "a": "fb3f12e9d5ad", "za": "acb78e51054b"}, {"sp": "", "role": "t", "id": "Di mana saya bisa menemukan toilet dan kantin?", "zh": "我在哪里可以找到洗手间和食堂？", "a": "f79e3bb05b84", "za": "acb78e51054b"}, {"sp": "", "role": "t", "id": "Saya mulai bekerja pukul delapan pagi dan pulang kerja pukul lima sore.", "zh": "我早上八点开始上班，下午五点下班。", "a": "7a10d7d71cb4", "za": "94d8fdca0858", "an": {"p": [["mulai", "开始"], ["bekerja", "工作"], ["pukul delapan", "八点"], ["pagi", "早上"], ["pulang kerja", "下班"], ["pukul lima", "五点"], ["sore", "下午"]], "b": "bekerja = ber- + kerja", "g": "pukul（或 jam）+ 数字 = 几点。时段词 pagi/siang/sore/malam 放在数字后面。mulai + 动词 = 开始做某事。pulang = 回去，pulang kerja = 下班回家。"}}, {"sp": "", "role": "t", "id": "Nama saya Deni, saya adalah karyawan baru di perusahaan ini.", "zh": "我叫 Deni，我是这家公司的新员工。", "a": "9d30ae787693", "za": "1652fbed5297", "an": {"p": [["Nama saya", "我的名字"], ["saya", "我"], ["adalah", "是"], ["karyawan", "员工"], ["baru", "新的"], ["di perusahaan ini", "在这家公司"]], "b": "karyawan = karya 作品、工作 + -wan（……的人）", "g": "名词 + saya = “我的……”。形容词放在名词后：karyawan baru = 新员工。adalah 连接主语和名词（“是”），口语里常省略；形容词前不用 adalah。"}}, {"sp": "", "role": "t", "id": "Telepon di meja Anda berbunyi, silakan diangkat.", "zh": "你桌上的电话在响，请接一下。", "a": "3c7843b6b5ac", "za": "a26079922e0a", "an": {"p": [["Telepon", "电话"], ["di meja Anda", "在您的桌上"], ["berbunyi", "响"], ["silakan", "请"], ["diangkat", "被接起"]], "b": "berbunyi = ber- + bunyi 声音；diangkat = di- + angkat 抬、拿起", "g": "di- + 动词词根 = 被动（省略动作者）：diangkat = 被拿起（接电话）。silakan = “请便”，请对方做某事；tolong 则是请对方帮忙。di meja Anda 修饰 telepon。"}}, {"sp": "", "role": "t", "id": "Tolong fotokopi dokumen ini sebanyak 5 rangkap.", "zh": "请把这份文件复印 5 份。", "a": "4f33473a716f", "za": "1f5a90abd876", "an": {"p": [["Tolong", "请"], ["fotokopi", "复印"], ["dokumen ini", "这份文件"], ["sebanyak", "共计"], ["5 rangkap", "5 份"]], "b": "sebanyak = se- + banyak 多", "g": "fotokopi 可以直接当动词用（祈使句）。sebanyak + 数字 = “共……”（数量）。rangkap = 份（复本），不是“双面”。"}}, {"sp": "", "role": "t", "id": "Saya masih belum paham, bisakah Anda mengulangi penjelasannya?", "zh": "我还不明白，您能再解释一遍吗？", "a": "f18695e7f72d", "za": "df25e5cdbdca", "an": {"p": [["masih belum", "还是没有"], ["paham", "明白"], ["bisakah", "能否"], ["Anda", "您"], ["mengulangi", "重复"], ["penjelasannya", "它的解释"]], "b": "mengulangi = ulang + meN-…-i；penjelasan = jelas 清楚 + pe-…-an；-nya = 它的", "g": "masih belum = 仍然还没（强调一直没懂）。-kah 加在句首助动词后，构成较正式的疑问：bisakah …? = 能不能……？-nya 指代前面说过的那件事。"}}, {"sp": "", "role": "t", "id": "Bos saya sangat baik, dia sering membantu karyawan baru di perusahaan.", "zh": "我的老板很好，经常帮助公司的新员工。", "a": "33f8d9f462f1", "za": "ec3730aec228", "an": {"p": [["Bos saya", "我的老板"], ["sangat baik", "非常好"], ["dia", "他/她"], ["sering", "经常"], ["membantu", "帮助"], ["karyawan baru", "新员工"], ["di perusahaan", "在公司"]], "b": "membantu = bantu + meN-", "g": "sangat + 形容词 = 非常……。频率副词 sering 放在动词前。dia 不分男女。逗号后面接第二个分句，不需要连词。"}}, {"sp": "", "role": "t", "id": "Selamat pagi, Pak Budi, apa kabar Anda hari ini?", "zh": "早上好，Budi 先生，您今天好吗？", "a": "7d1b3505ff11", "za": "51a272ff4967", "an": {"p": [["Selamat pagi", "早上好"], ["Pak", "先生"], ["Budi", "人名"], ["apa kabar", "近况如何"], ["Anda", "您"], ["hari ini", "今天"]], "b": "Pak（Bapak）对男士，Ibu 对女士", "g": "问候：Selamat pagi/siang/sore/malam。apa kabar 直译“什么消息”，即“你好吗”。Anda 放在 kabar 后，指“您的近况”。"}}, {"sp": "", "role": "t", "id": "Ini meja kerja saya, dekat dengan jendela.", "zh": "这是我的办公桌，离窗户很近。", "a": "905af4c2f773", "za": "fe747d5acfb1", "an": {"p": [["Ini", "这是"], ["meja kerja", "办公桌"], ["saya", "我的"], ["dekat dengan", "靠近"], ["jendela", "窗户"], ["tempat kerja", "工位"]], "b": "meja = 桌子，kerja = 工作", "g": "名词 + 名词，核心词在前：meja kerja = 工作用的桌子。Ini 开头的判断句不需要 adalah。dekat dengan + 名词 = 靠近……。"}}, {"sp": "", "role": "t", "id": "Tempat kerja saya sangat dekat dengan jendela.", "zh": "我的工位离窗户很近。", "a": "f19a484bc645", "za": "fe747d5acfb1", "an": {"p": [["Ini", "这是"], ["meja kerja", "办公桌"], ["saya", "我的"], ["dekat dengan", "靠近"], ["jendela", "窗户"], ["tempat kerja", "工位"]], "b": "meja = 桌子，kerja = 工作", "g": "名词 + 名词，核心词在前：meja kerja = 工作用的桌子。Ini 开头的判断句不需要 adalah。dekat dengan + 名词 = 靠近……。"}}, {"sp": "", "role": "t", "id": "Besok saya akan pergi ke pabrik bersama tim produksi.", "zh": "我明天将和生产团队一起去工厂。", "a": "eb3a48eb4a85", "za": "aa2c7450144e"}, {"sp": "", "role": "t", "id": "Besok saya akan pergi ke lokasi bersama tim produksi.", "zh": "我明天将和生产团队一起去现场。", "a": "dcc4ffeff24c", "za": "a8275f46cc2b"}, {"sp": "", "role": "t", "id": "Komputer saya rusak, tolong panggilkan teknisi ke sini.", "zh": "我的电脑坏了，请叫技术员过来。", "a": "131934a7812d", "za": "279ea2064f77", "an": {"p": [["Komputer saya", "我的电脑"], ["rusak", "坏了"], ["tolong", "请"], ["panggilkan", "帮忙叫"], ["teknisi", "技术员"], ["ke sini", "到这里来"]], "b": "panggilkan = panggil 叫 + -kan（为某人做）", "g": "-kan 可表示“替别人做”：panggilkan = 帮（我）叫。祈使句动词用词根或词根+kan。ke sini = 到这里（方向），di sini = 在这里（位置）。"}}, {"sp": "", "role": "t", "id": "Ini adalah jadwal rapat untuk minggu depan.", "zh": "这是下周的会议时间表。", "a": "69827c891896", "za": "9b12044f5d9a", "an": {"p": [["Ini adalah", "这是"], ["jadwal", "时间表"], ["rapat", "会议"], ["untuk", "用于、为了"], ["minggu depan", "下周"]], "b": "jadwal 时间表", "g": "jadwal rapat = 会议的时间表（名词 + 名词）。depan 放在时间词后表示“下一个”：minggu depan 下周，bulan depan 下个月。"}}, {"sp": "", "role": "t", "id": "Ini hasil kerja saya, apakah sudah sesuai dengan permintaan?", "zh": "这是我的工作成果，是否已经符合要求？", "a": "603b943a589c", "za": "08eb839f22d9", "an": {"p": [["Ini", "这是"], ["hasil kerja", "工作成果"], ["apakah", "是否"], ["sudah", "已经"], ["sesuai dengan", "符合"], ["permintaan", "要求"]], "b": "permintaan = per- + minta 要 + -an", "g": "apakah 引导是非问句，较书面。sudah = 已经（完成）。sesuai dengan + 名词 = 符合……。"}}, {"sp": "", "role": "t", "id": "Kami ada acara perusahaan Jumat sore ini.", "zh": "我们这周五下午有公司活动。", "a": "9453709f7009", "za": "8b7ef3ae3ff2", "an": {"p": [["Kami", "我们"], ["ada", "有"], ["acara perusahaan", "公司活动"], ["Jumat", "星期五"], ["sore ini", "今天下午"]], "b": "kami 不含听话人，kita 含听话人", "g": "ada + 名词 = 有（某安排/某物）。时间顺序：星期 + 时段 + ini。注意 kami（我们）≠ kamu（你）。"}}, {"sp": "", "role": "t", "id": "Saya butuh tanda tangan Anda di kontrak ini.", "zh": "我需要您在这份合同上签字。", "a": "cd39deaad102", "za": "b06db94e2a4c", "an": {"p": [["Saya butuh", "我需要"], ["tanda tangan Anda", "您的签名"], ["di kontrak ini", "在这份合同上"]], "b": "tanda tangan = 记号 + 手；动词是 menandatangani", "g": "butuh 后可直接接名词。di + 名词 = 在……上面（这里指文件上）。tanda tangan 是名词“签名”。"}}, {"sp": "", "role": "t", "id": "Saya bekerja di bagian pemasaran sebagai staf administrasi.", "zh": "我在市场部工作，职位是行政专员（文员）。", "a": "89e3efdb206f", "za": "5c127fa29553", "an": {"p": [["bekerja", "工作"], ["di bagian", "在……部门"], ["pemasaran", "市场营销"], ["sebagai", "作为"], ["staf administrasi", "行政职员"]], "b": "pemasaran = pe-…-an + pasar 市场；sebagai = se- + bagai", "g": "sebagai + 职位 = “作为/担任”。di bagian + 部门名 = 在某部门。"}}, {"sp": "", "role": "t", "id": "Saya akan cuti tiga hari minggu depan.", "zh": "我下周将休假三天。", "a": "3681e356c1f4", "za": "e307c8b3773c", "an": {"p": [["akan", "将要"], ["cuti", "休假"], ["tiga hari", "三天"], ["minggu depan", "下周"]], "b": "cuti 休假（借自荷兰语）", "g": "数字 + hari = 几天：tiga hari。cuti 可直接当动词。时间词可放句尾。"}}, {"sp": "", "role": "t", "id": "Silakan pergi ke lobi pukul sepuluh untuk menemui tamu dari Singapura.", "zh": "请十点去大堂接见来自新加坡的客人。", "a": "266e7787e4d8", "za": "f937d173383b", "an": {"p": [["Silakan", "请"], ["pergi ke lobi", "去大堂"], ["pukul sepuluh", "十点"], ["untuk", "为了"], ["menemui", "会见"], ["tamu", "客人"], ["dari Singapura", "来自新加坡"]], "b": "menemui = temu 遇见 + meN-…-i", "g": "untuk + 动词 = “为了（去）做……”。menemui 后面直接接人（会见某人）。dari + 地名 = 来自某地。"}}, {"sp": "", "role": "t", "id": "Maaf saya terlambat, karena di jalan terjadi kemacetan.", "zh": "抱歉我迟到了，因为路上堵车。", "a": "ab27f48858ac", "za": "b340f5da74b7", "an": {"p": [["Maaf", "抱歉"], ["terlambat", "迟到"], ["karena", "因为"], ["di jalan", "在路上"], ["terjadi", "发生"], ["kemacetan", "堵车"]], "b": "terlambat = ter- + lambat 慢；kemacetan = ke-…-an + macet 堵", "g": "ter- + 形容词 = 到了某种状态（terlambat 来得太晚）。karena 引出原因。terjadi + 名词 = 发生了……。"}}, {"sp": "", "role": "t", "id": "Kapan batas waktu akhir proyek ini? Saya membutuhkan informasinya.", "zh": "这个项目的截止日期是什么时候？我需要这个信息。", "a": "145ab732390e", "za": "d2ddcbf2dd8c", "an": {"p": [["Kapan", "什么时候"], ["batas waktu akhir", "截止期限"], ["proyek ini", "这个项目"], ["membutuhkan", "需要"], ["informasinya", "那个信息"]], "b": "batas 界限 + waktu 时间 + akhir 最后；-nya = 那个", "g": "Kapan 疑问词放句首。membutuhkan 是 butuh 的正式说法。-nya 指代前面提到的项目的信息。"}}, {"sp": "", "role": "t", "id": "Saya akan mengantar tamu bisnis ini ke hotel.", "zh": "我会把这位商务客人送到酒店。", "a": "cbd0d434d16a", "za": "f9b9a03a8f1c", "an": {"p": [["akan", "将要"], ["mengantar", "送（陪同送到）"], ["tamu bisnis", "商务客人"], ["ke hotel", "到酒店"]], "b": "mengantar = antar + meN-", "g": "mengantar 是把人送到某处，ke + 地点表示目的地。tamu bisnis = 客人 + 商务（名词 + 名词）。"}}, {"sp": "", "role": "t", "id": "Kantor kami perlu lebih banyak kertas dan pulpen.", "zh": "我们办公室需要更多的纸和笔。", "a": "092641913277", "za": "e3466cac57c3", "an": {"p": [["Kantor kami", "我们的办公室"], ["perlu", "需要"], ["lebih banyak", "更多"], ["kertas", "纸"], ["pulpen", "笔"]], "b": "pulpen = 钢笔/圆珠笔", "g": "lebih + 形容词 = 更……：lebih banyak = 更多。perlu 后可接名词，也可接动词。"}}, {"sp": "", "role": "t", "id": "Mika memakai kemeja putih dan jam tangan hitam, sangat tampan.", "zh": "Mika 穿着白衬衫、戴着黑色手表，非常帅。", "a": "56a71a343175", "za": "acd536469c0b", "an": {"p": [["Mika", "人名"], ["memakai", "穿、戴"], ["kemeja putih", "白衬衫"], ["jam tangan", "手表"], ["hitam", "黑色"], ["sangat tampan", "非常帅"]], "b": "memakai = pakai + meN-；jam tangan = 钟 + 手", "g": "颜色放在名词后：kemeja putih。memakai 对衣服、手表、帽子都可用。tampan 形容男士帅，口语也说 ganteng。"}}, {"sp": "", "role": "t", "id": "Saya suka bekerja di sini karena lingkungan kerjanya sangat ramah.", "zh": "我喜欢在这里工作，因为工作环境很友好。", "a": "6b7e4ab0ca4e", "za": "6f4d6129b875", "an": {"p": [["suka", "喜欢"], ["bekerja", "工作"], ["di sini", "在这里"], ["karena", "因为"], ["lingkungan kerja", "工作环境"], ["ramah", "友好"]], "b": "lingkungan = lingkung + -an", "g": "suka + 动词 = 喜欢做……。-nya 这里表示“这里的”。lingkungan kerja = 环境 + 工作。"}}, {"sp": "", "role": "t", "id": "Terima kasih atas bantuan dan kerja sama Anda hari ini.", "zh": "感谢您今天的帮助和合作。", "a": "97a7a8398538", "za": "d151ca652370", "an": {"p": [["Terima kasih", "谢谢"], ["atas", "为了、对于"], ["bantuan", "帮助"], ["kerja sama", "合作"], ["Anda", "您"], ["hari ini", "今天"]], "b": "terima = 接受，kasih = 爱、情分", "g": "terima kasih atas + 名词 = 为……而感谢。kerja sama 是两个词（合作）。"}}, {"sp": "", "role": "t", "id": "Sekarang saya harus pergi ke ruang rapat di lantai tiga untuk rapat.", "zh": "我现在必须去三楼的会议室开会。", "a": "b84ad6cb5b56", "za": "475b719fe1e0", "an": {"p": [["Sekarang", "现在"], ["harus", "必须"], ["ruang rapat", "会议室"], ["di lantai tiga", "在三楼"], ["untuk rapat", "去开会"]], "b": "ruang = 房间；lantai = 楼层", "g": "harus + 动词 = 必须。lantai + 数字 = 第几层（数字放后）。untuk rapat = 为了开会。"}}], "zh": "", "note": "", "qa": [], "hide": 1}, {"id": "t10", "kind": "trans", "book": "武功秘籍", "title": "翻译句 · 校园生活", "lines": [{"sp": "", "role": "t", "id": "Kami makan malam bersama keluarga setiap hari.", "zh": "我们每天和家人一起吃晚饭。", "a": "0a467ccd98b4", "za": "8117f661d0b7", "an": {"p": [["Kami", "我们"], ["makan malam", "吃晚饭"], ["bersama keluarga", "和家人一起"], ["setiap hari", "每天"]], "b": "makan malam = 吃 + 夜晚", "g": "makan malam 既是动词“吃晚饭”，也是名词“晚饭”。setiap + 名词 = 每一个……。"}}, {"sp": "", "role": "t", "id": "Guru menjelaskan pelajaran dengan sangat jelas.", "zh": "老师讲课讲得非常清楚。", "a": "08f76eb1ca8a", "za": "04c2a4d0a246", "an": {"p": [["Guru", "老师"], ["menjelaskan", "讲解"], ["pelajaran", "课程"], ["dengan sangat jelas", "非常清楚地"]], "b": "menjelaskan = jelas + meN-…-kan；pelajaran = ajar + pe-…-an", "g": "dengan + 形容词 = ……地（把形容词变成副词）。meN-…-kan = 使……清楚，即“讲解”。"}}, {"sp": "", "role": "t", "id": "Karena sakit, saya tidak pergi ke sekolah.", "zh": "因为生病，我没有去学校。", "a": "bf5f4ae2719e", "za": "2ac5d82a5c7e", "an": {"p": [["Karena", "因为"], ["sakit", "生病"], ["saya", "我"], ["tidak", "不、没"], ["pergi", "去"], ["ke sekolah", "到学校"]], "b": "", "g": "Karena 引导原因，放句首，后面逗号再接结果。tidak 否定动词和形容词（否定名词用 bukan）。"}}, {"sp": "", "role": "t", "id": "Saya suka makan nasi goreng karena sangat enak.", "zh": "我喜欢吃炒饭，因为很好吃。", "a": "106ad930d3cf", "za": "3fd6e3bf53c3", "an": {"p": [["suka makan", "喜欢吃"], ["nasi goreng", "炒饭"], ["karena", "因为"], ["sangat enak", "非常好吃"]], "b": "nasi 饭，goreng 炒、炸", "g": "食物名：nasi goreng（炒饭）、mie goreng（炒面）、ayam goreng（炸鸡）。enak 指味道好。"}}, {"sp": "", "role": "t", "id": "Saya suka makan nasi goreng karena enak dan tidak mahal.", "zh": "我喜欢吃炒饭，因为好吃又便宜。", "a": "14e9415c510c", "za": "b3ced88569bd", "an": {"p": [["nasi goreng", "炒饭"], ["enak", "好吃"], ["dan", "又"], ["tidak mahal", "不贵"], ["mahal", "贵"], ["murah", "便宜"]], "b": "", "g": "tidak + 形容词 = 不……。“好吃又便宜”可以说 enak dan murah，也可以说 enak dan tidak mahal。"}}, {"sp": "", "role": "t", "id": "Saya biasanya bermain basket bersama teman-teman di akhir pekan.", "zh": "我通常和朋友在周末一起打篮球。", "a": "bbb59b59fd0d", "za": "097f56085ef4", "an": {"p": [["biasanya", "通常"], ["bermain basket", "打篮球"], ["bersama", "和……一起"], ["teman-teman", "朋友们"], ["di akhir pekan", "在周末"]], "b": "biasanya = biasa 习惯 + -nya；bermain = ber- + main", "g": "重叠表示复数：teman-teman = 朋友们。打球类用 bermain + 球名。akhir pekan = 周末（结尾 + 周）。"}}, {"sp": "", "role": "t", "id": "Saya tinggal di tempat yang sangat tenang dan nyaman (dan tidak jauh dari sekolah).", "zh": "我住在一个非常安静舒适的地方（离学校不远）。", "a": "34017e7faa4a", "za": "257112eb9221", "an": {"p": [["tinggal", "住"], ["di tempat", "在地方"], ["yang", "……的"], ["sangat", "非常"], ["tenang", "安静"], ["nyaman", "舒适"], ["tidak jauh dari", "离……不远"]], "b": "tempat 地方；jauh 远", "g": "yang 引出修饰成分：tempat yang tenang = 安静的地方。tidak jauh dari + 地点 = 离……不远。tinggal = 居住。"}}, {"sp": "", "role": "t", "id": "Pagi ini saya membuat sarapan di dapur, lalu pergi ke sekolah.", "zh": "我今天早上在厨房做早餐，然后去学校。", "a": "990111dbe5bd", "za": "19569032fe8a", "an": {"p": [["Pagi ini", "今天早上"], ["membuat", "做、制作"], ["sarapan", "早餐"], ["di dapur", "在厨房"], ["lalu", "然后"], ["pergi ke sekolah", "去学校"]], "b": "membuat = buat + meN-", "g": "时间词放句首。lalu 连接先后发生的两个动作。membuat sarapan = 做早餐（也可说 memasak）。"}}, {"sp": "", "role": "t", "id": "Kami berencana berlibur ke Indonesia bulan depan.", "zh": "我们计划下个月去印尼旅游。", "a": "c1c02c8362d2", "za": "1978164732db", "an": {"p": [["berencana", "计划"], ["berlibur", "度假"], ["ke Indonesia", "去印度尼西亚"], ["bulan depan", "下个月"]], "b": "berencana = ber- + rencana 计划；berlibur = ber- + libur 假期", "g": "ber- + 名词 = 做与该名词相关的事。berencana + 动词 = 计划做……。"}}, {"sp": "", "role": "t", "id": "Kami sering belajar bersama di kelas dan sering saling membantu.", "zh": "我们经常在教室一起学习，经常互相帮助。", "a": "167e82102d52", "za": "c510b9ae5ae7", "an": {"p": [["sering", "经常"], ["belajar bersama", "一起学习"], ["di kelas", "在教室"], ["saling", "互相"], ["membantu", "帮助"]], "b": "saling 互相", "g": "saling + 动词 = 互相……：saling membantu 互相帮助。sering 在两个谓语前各用一次，更清楚。"}}, {"sp": "", "role": "t", "id": "Kadang-kadang saya membersihkan kamar agar nyaman untuk belajar.", "zh": "有时候我打扫房间，让学习的环境舒适。", "a": "c4e850f4f202", "za": "744b9e73b27f", "an": {"p": [["Kadang-kadang", "有时"], ["membersihkan", "打扫"], ["kamar", "房间"], ["agar", "为了让"], ["nyaman", "舒适"], ["untuk belajar", "用来学习"]], "b": "membersihkan = bersih 干净 + meN-…-kan", "g": "agar + 形容词/从句 = 为了让……。kadang-kadang 是重叠词，意为“有时”。"}}, {"sp": "", "role": "t", "id": "Dia belajar di perpustakaan karena perpustakaan sangat tenang.", "zh": "他在图书馆学习，因为图书馆很安静。", "a": "498fa53810eb", "za": "88920e252528", "an": {"p": [["Dia", "他"], ["belajar", "学习"], ["di perpustakaan", "在图书馆"], ["karena", "因为"], ["sangat tenang", "非常安静"]], "b": "", "g": "原因从句里重复名词 perpustakaan，印尼语不爱用代词回指（也可用 -nya）。"}}, {"sp": "", "role": "t", "id": "Pada malam hari saya duduk bersama keluarga menonton televisi.", "zh": "晚上我和家人坐在一起看电视。", "a": "1ff209f2dbd5", "za": "55f0a3de0680", "an": {"p": [["Pada malam hari", "在晚上"], ["duduk", "坐"], ["bersama keluarga", "和家人一起"], ["menonton", "观看"], ["televisi", "电视"]], "b": "menonton = tonton + meN-", "g": "两个动作可连用：duduk … menonton（坐着看）。menonton 用于看电视、电影、比赛；melihat 是“看见”。"}}, {"sp": "", "role": "t", "id": "Saya langsung minum kopi setelah bangun pagi.", "zh": "我早上起床后立即喝咖啡。", "a": "ca66633c8745", "za": "60075f894222", "an": {"p": [["langsung", "立即"], ["minum kopi", "喝咖啡"], ["setelah", "之后"], ["bangun pagi", "早上起床"]], "b": "bangun 起床、醒来", "g": "setelah 从句可放后面。bangun pagi = 早上起床（也有“早起”之意）。"}}, {"sp": "", "role": "t", "id": "Sore ini kami belajar bahasa Indonesia di perpustakaan.", "zh": "今天下午我们在图书馆学习印尼语。", "a": "553cdef32567", "za": "46a54211a9b0", "an": {"p": [["Sore ini", "今天下午"], ["kami", "我们"], ["belajar", "学习"], ["bahasa Indonesia", "印尼语"], ["di perpustakaan", "在图书馆"]], "b": "bahasa = 语言", "g": "bahasa + 国名 = 某国语言：bahasa Inggris 英语，bahasa Mandarin 汉语。"}}, {"sp": "", "role": "t", "id": "Besok saya pergi ke sekolah naik sepeda.", "zh": "我明天骑自行车去学校。", "a": "b9e0afee6876", "za": "2c5480307b1c", "an": {"p": [["Besok", "明天"], ["naik", "乘、骑"], ["sepeda", "自行车"], ["bersepeda", "骑自行车"], ["setiap hari", "每天"]], "b": "bersepeda = ber- + sepeda", "g": "naik + 交通工具 = 乘/骑：naik bus、naik motor、naik sepeda。ber- + 名词 = 做与它有关的事：bersepeda。"}}, {"sp": "", "role": "t", "id": "Saya bersepeda ke sekolah setiap hari.", "zh": "我每天骑自行车去上学。", "a": "6aad103116f7", "za": "2c5480307b1c", "an": {"p": [["Besok", "明天"], ["naik", "乘、骑"], ["sepeda", "自行车"], ["bersepeda", "骑自行车"], ["setiap hari", "每天"]], "b": "bersepeda = ber- + sepeda", "g": "naik + 交通工具 = 乘/骑：naik bus、naik motor、naik sepeda。ber- + 名词 = 做与它有关的事：bersepeda。"}}, {"sp": "", "role": "t", "id": "Saya bangun jam enam setiap pagi untuk pergi ke sekolah.", "zh": "我每天早上六点起床，为了去上学。", "a": "162b8b316a07", "za": "fa15c1a91d94", "an": {"p": [["bangun", "起床"], ["jam enam", "六点"], ["setiap pagi", "每天早上"], ["untuk", "为了"], ["pergi ke sekolah", "去学校"]], "b": "", "g": "jam + 数字 = 几点（和 pukul 同义）。untuk + 动词 = 为了……。"}}, {"sp": "", "role": "t", "id": "Saya minum air setiap kali selesai berolahraga demi kesehatan tubuh.", "zh": "我每次运动后喝水，是为了身体健康。", "a": "322e8a9fd26b", "za": "dd36013792e7", "an": {"p": [["minum air", "喝水"], ["setiap kali", "每次"], ["selesai", "结束、完成"], ["berolahraga", "做运动"], ["demi", "为了"], ["kesehatan", "健康"], ["tubuh", "身体"]], "b": "kesehatan = ke-…-an + sehat；berolahraga = ber- + olahraga", "g": "selesai + 动词 = 做完……。demi + 名词 = 为了（重要的目的）。setiap kali = 每次。"}}, {"sp": "", "role": "t", "id": "Setiap minggu saya pergi ke kafe bersama teman pada sore hari untuk minum kopi dan mengobrol.", "zh": "我每周下午和朋友去咖啡馆喝咖啡聊天。", "a": "101de27f5b24", "za": "e2d0018bfac4", "an": {"p": [["Setiap minggu", "每周"], ["pergi ke kafe", "去咖啡馆"], ["bersama teman", "和朋友"], ["pada sore hari", "在下午"], ["untuk", "为了"], ["minum kopi", "喝咖啡"], ["mengobrol", "聊天"]], "b": "mengobrol = obrol + meN-", "g": "一个句子里可以连续写：谁、何时、去哪、和谁、做什么，顺序灵活。untuk 后面并列两个动作用 dan 连接。"}}, {"sp": "", "role": "t", "id": "Ayah saya adalah guru sekolah menengah.", "zh": "我的父亲是一名中学老师。", "a": "1d1ab83f9aef", "za": "7cb7698b943b", "an": {"p": [["Ayah saya", "我的父亲"], ["adalah", "是"], ["guru", "老师"], ["sekolah menengah", "中学"]], "b": "menengah = 中等的", "g": "adalah 连接主语和职业名词。sekolah menengah pertama (SMP) 初中，sekolah menengah atas (SMA) 高中。"}}, {"sp": "", "role": "t", "id": "Setiap minggu saya pergi ke perpustakaan untuk membaca buku.", "zh": "我每周都去图书馆看书。", "a": "4454cbf20100", "za": "53bef4123bdb", "an": {"p": [["Setiap minggu", "每周"], ["pergi ke perpustakaan", "去图书馆"], ["untuk membaca buku", "为了看书"]], "b": "membaca = baca + meN-", "g": "membaca buku = 看书、读书。注意 menulis（写）和 membaca（读）都是 meN- 动词。"}}, {"sp": "", "role": "t", "id": "Setelah masuk universitas, saya kenal banyak teman baru.", "zh": "我上大学后认识了很多新朋友。", "a": "3cd5a3d3a9e1", "za": "ee2bfce3c1dd", "an": {"p": [["Setelah", "之后"], ["masuk universitas", "进入大学"], ["kenal", "认识"], ["banyak", "很多"], ["teman baru", "新朋友"]], "b": "masuk 进入；kenal 熟识（人）", "g": "kenal = 认识某人（熟悉），tahu = 知道（事实）。banyak + 名词 = 很多……，不需要量词。"}}, {"sp": "", "role": "t", "id": "Kadang-kadang saya mendengarkan musik untuk menghilangkan stres.", "zh": "我有时听音乐来消除烦恼。", "a": "d3f01ccc9647", "za": "2013563b1219", "an": {"p": [["Kadang-kadang", "有时"], ["mendengarkan musik", "听音乐"], ["untuk", "为了"], ["menghilangkan", "消除"], ["stres", "压力、烦恼"]], "b": "menghilangkan = hilang 消失 + meN-…-kan", "g": "mendengarkan = 专心听。menghilangkan = 使……消失。stres 借自英语。"}}, {"sp": "", "role": "t", "id": "Saya selalu membawa kamera untuk memotret pemandangan yang indah.", "zh": "我总是带着相机拍摄美丽的风景。", "a": "3c009669b7cf", "za": "28571218c5ec", "an": {"p": [["selalu", "总是"], ["membawa", "带"], ["kamera", "相机"], ["memotret", "拍摄"], ["pemandangan", "风景"], ["yang indah", "美丽的"]], "b": "memotret = potret + meN-；pemandangan = pandang 看 + pe-…-an", "g": "selalu 放在动词前。yang indah 修饰前面的名词。memotret = 拍照。"}}, {"sp": "", "role": "t", "id": "Saat liburan, saya suka pergi ke pantai dan bermain pasir di pantai.", "zh": "旅游时我喜欢去沙滩，在沙滩上玩。", "a": "d08cd3709438", "za": "584876a32d84", "an": {"p": [["Saat", "当……的时候"], ["liburan", "假期"], ["suka pergi ke pantai", "喜欢去海边"], ["bermain pasir", "玩沙子"], ["pasir", "沙子"]], "b": "liburan = libur + -an", "g": "Saat + 名词/从句 = 当……时。bermain + 名词 = 玩某物。"}}, {"sp": "", ook": "BIPA 1", "title": "全家福（音频 3.1）", "lines": [{"sp": "Ajeng", "role": "d", "id": "Raden, itu foto keluargamu?", "zh": "Raden，那是你的全家福吗？", "a": "fb692d38d540", "za": "91a74745d264"}, {"sp": "Raden", "role": "d", "id": "Iya, Ajeng.", "zh": "是的，Ajeng。", "a": "4dc3e660cee9", "za": "47620dff6513"}, {"sp": "Ajeng", "role": "d", "id": "Siapa saja mereka?", "zh": "他们都是谁？", "a": "73e1931545b2", "za": "9b5ca96f62ef"}, {"sp": "Raden", "role": "d", "id": "Ini ayah, ibu, aku, dan kakak perempuanku.", "zh": "这是爸爸、妈妈、我和我姐姐。", "a": "6bfb43fc8e85", "za": "64e073f7f59e"}, {"sp": "Ajeng", "role": "d", "id": "O, kamu anak kedua?", "zh": "哦，你是老二？", "a": "466e9733eb10", "za": "2040de9ad24c"}, {"sp": "Raden", "role": "d", "id": "Iya. Bagaimana denganmu?", "zh": "是的。你呢？", "a": "598ab550487c", "za": "d3181be6ec71"}, {"sp": "Ajeng", "role": "d", "id": "Aku anak tunggal.", "zh": "我是独生女。", "a": "5d0dfe876a46", "za": "5ce3233ef67a"}], "zh": "", "note": "", "qa": [], "u": 3}, {"id": "d17", "kind": "dlg", "book": "BIPA 1", "title": "你的生日是哪天", "lines": [{"sp": "Raden", "role": "d", "id": "Ajeng, kapan tanggal ulang tahunmu?", "zh": "Ajeng，你的生日是几号？", "a": "e0b7298d7735", "za": "a460f77a2feb"}, {"sp": "Ajeng", "role": "d", "id": "Ulang tahunku tanggal 16 September.", "zh": "我的生日是 9 月 16 日。", "a": "50a73256d5e9", "za": "b647834a4150"}, {"sp": "Raden", "role": "d", "id": "Apa kamu ingin merayakan ulang tahunmu nanti?", "zh": "到时候你想庆祝生日吗？", "a": "f2f585fd87eb", "za": "f1a252bb2669"}, {"sp": "Ajeng", "role": "d", "id": "Ya, tentu saja.", "zh": "当然想。", "a": "e0c8b4011d75", "za": "4007d1cab148"}], "zh": "", "note": "", "qa": [], "u": 4}, {"id": "d18", "kind": "dlg", "book": "BIPA 1", "title": "你什么时候出生（音频 4.1）", "lines": [{"sp": "Raden", "role": "d", "id": "Kapan kamu lahir, Ajeng?", "zh": "Ajeng，你是什么时候出生的？", "a": "9cd410cc0a4c", "za": "51e65420d95a"}, {"sp": "Ajeng", "role": "d", "id": "Aku lahir 16 September 1996.", "zh": "我出生于 1996 年 9 月 16 日。", "a": "9526cc92d86b", "za": "5c91ea013c0b"}, {"sp": "Raden", "role": "d", "id": "Kalau begitu, bulan depan ulang tahunmu?", "zh": "那么，下个月是你的生日？", "a": "a47d790e076e", "za": "9bafbb768ebe"}, {"sp": "Ajeng", "role": "d", "id": "Iya, benar. Apa kamu bisa datang ke pesta ulang tahunku?", "zh": "对。你能来我的生日派对吗？", "a": "f85bcd626034", "za": "b74e89298d26"}, {"sp": "Raden", "role": "d", "id": "Ya, tentu saja.", "zh": "当然能。", "a": "cda1e81c376b", "za": "661d48f30691"}], "zh": "", "note": "", "qa": [], "u": 4}, {"id": "d19", "kind": "dlg", "book": "BIPA 1", "title": "生日邀请（音频 4.2）", "lines": [{"sp": "Nina", "role": "d", "id": "Raga, apa kamu bisa datang ke pesta ulang tahunku pada Minggu, 17 November?", "zh": "Raga，11 月 17 日星期天你能来我的生日派对吗？", "a": "8b7549ddcd21", "za": "cfd8621aa49c"}, {"sp": "Raga", "role": "d", "id": "Ya, tentu saja. Pukul berapa pestanya?", "zh": "当然可以。派对几点？", "a": "7e4a04256430", "za": "7288637b944d"}, {"sp": "Nina", "role": "d", "id": "Pukul 4 sore.", "zh": "下午四点。", "a": "a6324797e944", "za": "5f6a1d7ba3d3"}, {"sp": "Raga", "role": "d", "id": "Di mana tempatnya?", "zh": "在哪里？", "a": "0bef6e2c0db0", "za": "86aab41ca9f2"}, {"sp": "Nina", "role": "d", "id": "Di Perumahan Batakan Asri Nomor 6.", "zh": "在 Batakan Asri 住宅区 6 号。", "a": "bf3a2cc616f9", "za": "d3ee8e219f79"}], "zh": "", "note": "", "qa": [], "u": 4}, {"id": "d20", "kind": "dlg", "book": "BIPA 1", "title": "假期去哪儿（音频 5.1）", "lines": [{"sp": "Raden", "role": "d", "id": "Ajeng, bulan depan mau liburan ke mana?", "zh": "Ajeng，下个月假期想去哪儿？", "a": "86d09138db18", "za": "3294513b461e"}, {"sp": "Ajeng", "role": "d", "id": "Aku mau berwisata ke Labuan Bajo.", "zh": "我想去纳闽巴霍旅游。", "a": "13fc044393ef", "za": "6592d48f8ce3"}, {"sp": "Raden", "role": "d", "id": "Di mana itu?", "zh": "那是哪里？", "a": "6a0b8111b8b2", "za": "e71e93ce2a6f"}, {"sp": "Ajeng", "role": "d", "id": "Labuan Bajo ada di Nusa Tenggara Timur.", "zh": "纳闽巴霍在东努沙登加拉。", "a": "63920b56a9c2", "za": "76a9ab108650"}, {"sp": "Raden", "role": "d", "id": "Apa saja tempat wisata menarik di sana?", "zh": "那里有什么好玩的景点？", "a": "48cedcd3d52e", "za": "dea5b0068bce"}, {"sp": "Ajeng", "role": "d", "id": "Ada Pulau Kanawa, Air Terjun Cunca Wulang, Wae Rebo, dan Gua Rangko.", "zh": "有卡纳瓦岛、昆卡武朗瀑布、瓦埃雷博村和让科洞。", "a": "40046ec6710f", "za": "0bbc67216473"}], "zh": "", "note": "", "qa": [], "u": 5}, {"id": "d21", "kind": "dlg", "book": "BIPA 1", "title": "买东西（音频 5.2）", "lines": [{"sp": "Ajeng", "role": "d", "id": "Permisi, Pak.", "zh": "打扰一下，先生。", "a": "d786c7f98e9d", "za": "ff4d88221fab"}, {"sp": "Pedagang", "role": "d", "id": "Ya, silakan.", "zh": "您请说。", "a": "62059b3e6c22", "za": "53c2dea2647c"}, {"sp": "Ajeng", "role": "d", "id": "Saya mau beli roti kompiang.", "zh": "我想买馄饨饼。", "a": "639aea5cc454", "za": "c2435e94a5f7"}, {"sp": "Pedagang", "role": "d", "id": "Berapa bungkus?", "zh": "要几包？", "a": "5366a1044da7", "za": "d516e327180c"}, {"sp": "Ajeng", "role": "d", "id": "Empat bungkus saja. Berapa harganya, Pak?", "zh": "就四包。多少钱，先生？", "a": "70603e4af9d4", "za": "a71dc3dc4f10"}, {"sp": "Pedagang", "role": "d", "id": "Lima puluh ribu rupiah.", "zh": "五万印尼盾。", "a": "fdabd2b6a4f9", "za": "d567f90513ab"}, {"sp": "Ajeng", "role": "d", "id": "Ini uangnya, Pak. Terima kasih.", "zh": "给您钱，先生。谢谢。", "a": "ebe3c78dfabf", "za": "210af252ad0d"}, {"sp": "Pedagang", "role": "d", "id": "Sama-sama.", "zh": "不客气。", "a": "012d2fba3fe7", "za": "e9ef14785136", "an": {"p": [["Sama-sama", "不客气"]], "b": "", "g": "回应感谢。"}}], "zh": "", "note": "", "qa": [], "u": 5}, {"id": "d22", "kind": "dlg", "book": "BIPA 1", "title": "假期过得怎么样（对话 5.1）", "lines": [{"sp": "Putri", "role": "d", "id": "Bagaimana liburanmu di Labuan Bajo, Ajeng?", "zh": "Ajeng，你在纳闽巴霍的假期怎么样？", "a": "d33416575d4a", "za": "a1811ad7cc9e"}, {"sp": "Ajeng", "role": "d", "id": "Liburanku menyenangkan.", "zh": "我的假期很愉快。", "a": "dca2d445de79", "za": "e718b6f061d3"}, {"sp": "Putri", "role": "d", "id": "Apa kamu mengunjungi Gua Rangko?", "zh": "你去让科洞了吗？", "a": "974d4e516340", "za": "16f60c0f7e12"}, {"sp": "Ajeng", "role": "d", "id": "Ya, tentu saja.", "zh": "当然去了。", "a": "e0c8b4011d75", "za": "4007d1cab148"}, {"sp": "Putri", "role": "d", "id": "Bagaimana tempatnya?", "zh": "那地方怎么样？", "a": "5f4846660dc1", "za": "00c76e8d6bd7"}, {"sp": "Ajeng", "role": "d", "id": "Tempatnya berkolam jernih. Airnya berwarna biru.", "zh": "那里有清澈的水池，水是蓝色的。", "a": "2f70a954a940", "za": "9104c4fc1628"}], "zh": "", "note": "", "qa": [], "u": 5}, {"id": "d23", "kind": "dlg", "book": "BIPA 1", "title": "去钓鱼吗（音频 7.1）", "lines": [{"sp": "Raden", "role": "d", "id": "Ajeng, besok kamu mau ikut?", "zh": "Ajeng，明天你要一起去吗？", "a": "6a21591d9834", "za": "84b30d9c03d6"}, {"sp": "Ajeng", "role": "d", "id": "Ke mana?", "zh": "去哪儿？", "a": "aec811893687", "za": "191950ba83b7"}, {"sp": "Raden", "role": "d", "id": "Aku, Maria, dan Doni akan pergi memancing.", "zh": "我、Maria 和 Doni 要去钓鱼。", "a": "51900c19b361", "za": "d5e89d70c5f0"}, {"sp": "Ajeng", "role": "d", "id": "Sebenarnya, aku kurang suka memancing.", "zh": "其实我不太喜欢钓鱼。", "a": "462c6169afe9", "za": "2d9eb0598019"}, {"sp": "Raden", "role": "d", "id": "Oh, ya? Mengapa?", "zh": "哦，是吗？为什么？", "a": "02a5ab0bcdc6", "za": "d1a1122d24ea"}, {"sp": "Ajeng", "role": "d", "id": "Memancing itu membosankan.", "zh": "钓鱼很无聊。", "a": "317a03101d50", "za": "dbedc74a991e"}, {"sp": "Raden", "role": "d", "id": "Lalu, apa hobimu?", "zh": "那你的爱好是什么？", "a": "ea42144429cc", "za": "30e01dd75721"}, {"sp": "Ajeng", "role": "d", "id": "Hobiku bermain musik.", "zh": "我的爱好是玩音乐。", "a": "8363fc3181ed", "za": "15fcd5951149"}, {"sp": "Raden", "role": "d", "id": "Ha ha ha, hobi kita memang beda, ya?", "zh": "哈哈，我们的爱好真不一样啊。", "a": "a9fd9afd30b8", "za": "60a57fd43ebf"}, {"sp": "Ajeng", "role": "d", "id": "Iya, benar!", "zh": "是啊，没错！", "a": "4480779f19fe", "za": "1a44719b4278"}], "zh": "", "note": "", "qa": [], "u": 7}, {"id": "d24", "kind": "dlg", "book": "BIPA 1", "title": "校园问路（课文 8.3）", "lines": [{"sp": "Sondang", "role": "d", "id": "Permisi, Mbak, saya mau tanya.", "zh": "打扰一下，姐，我想问一下。", "a": "919b526f30af", "za": "33cccf32f29f"}, {"sp": "Rara", "role": "d", "id": "Ya, ada yang bisa saya bantu?", "zh": "你好，有什么可以帮你的？", "a": "9c8d3b0aec70", "za": "202f6bcf2a9c"}, {"sp": "Sondang", "role": "d", "id": "Kantin ada di mana, ya?", "zh": "食堂在哪里呀？", "a": "de36eb20d3f7", "za": "a0cc948262f4"}, {"sp": "Rara", "role": "d", "id": "Kantin ada di sebelah utara masjid, Mbak.", "zh": "食堂在清真寺的北边。", "a": "30a9bd8d42ed", "za": "e1fcd3f6a323"}, {"sp": "Sondang", "role": "d", "id": "Masjidnya di mana?", "zh": "清真寺在哪儿？", "a": "6d0d1288fa1c", "za": "8582fa36c774"}, {"sp": "Rara", "role": "d", "id": "Ikuti jalan ini sampai pertigaan. Setelah itu belok kanan. Masjid ada di sebelah kiri jalan, seberang koperasi.", "zh": "沿着这条路走到三岔路口，然后右转。清真寺在路的左边，合作社对面。", "a": "d944f9f31bbd", "za": "36bc44c3c909"}, {"sp": "Sondang", "role": "d", "id": "Oh, ya, terima kasih, Mbak!", "zh": "好的，谢谢你！", "a": "ac6bca2bae62", "za": "9ac6fccde38c"}, {"sp": "Rara", "role": "d", "id": "Sama-sama.", "zh": "不客气。", "a": "7b3c51cf4835", "za": "e9ef14785136", "an": {"p": [["Sama-sama", "不客气"]], "b": "", "g": "回应感谢。"}}, {"sp": "Sondang", "role": "d", "id": "Oh, ya, kalau toilet umum di mana, ya?", "zh": "对了，公共厕所在哪儿呢？", "a": "46a251c6ed92", "za": "da1d12c067c5"}, {"sp": "Rara", "role": "d", "id": "Toilet umum ada di sebelah kiri koperasi.", "zh": "公共厕所在合作社左边。", "a": "7e37ab538857", "za": "d62419b1f1c4"}, {"sp": "Sondang", "role": "d", "id": "Maaf, bisa tolong ulangi?", "zh": "不好意思，能再说一遍吗？", "a": "64dd4f88bee2", "za": "e0ed059662ca"}, {"sp": "Rara", "role": "d", "id": "Mari, saya antar saja.", "zh": "来吧，我直接带你去。", "a": "a0d85ceeff15", "za": "c05e5ad01974"}, {"sp": "Sondang", "role": "d", "id": "Baik, terima kasih, Mbak.", "zh": "好的，谢谢你。", "a": "25eabef8cac4", "za": "18361999d147"}], "zh": "", "note": "背景：今天来了一个新生 Sondang，她还不熟悉校园里的各个地方。", "qa": [], "u": 9}, {"id": "d25", "kind": "dlg", "book": "BIPA 1", "title": "你像妈妈吗（音频 10.3）", "lines": [{"sp": "Raden", "role": "d", "id": "Meli, apa kamu mirip ibumu?", "zh": "Meli，你长得像你妈妈吗？", "a": "dfdaf96d5cc5", "za": "4ddde2237fff"}, {"sp": "Meli", "role": "d", "id": "Tidak. Ibuku berbadan ramping, berkulit sawo matang, dan berambut ikal. Ibuku bertubuh tinggi dan bermata kecokelatan.", "zh": "不像。我妈妈身材苗条，小麦色皮肤，卷发。她个子高，眼睛偏棕色。", "a": "56e67160723d", "za": "4be2380a569c"}, {"sp": "Raden", "role": "d", "id": "Bagaimana dengan ayahmu?", "zh": "你爸爸呢？", "a": "51edc4175c12", "za": "62dd05e56837"}, {"sp": "Meli", "role": "d", "id": "Ayahku berbadan gemuk, berkulit cokelat, berambut hitam lurus, dan memakai kacamata. Ayah berkumis tebal. Ia senang menggunakan celana pendek berwarna cokelat.", "zh": "我爸爸身材胖，棕色皮肤，黑色直发，戴眼镜。爸爸留着浓密的胡子，喜欢穿棕色短裤。", "a": "bfe532245407", "za": "e401a9e0b510"}, {"sp": "Raden", "role": "d", "id": "Lalu, bagaimana ciri-ciri kakakmu? Apa dia mirip denganmu?", "zh": "那你姐姐长什么样？她像你吗？", "a": "f25a86c855b7", "za": "266d73dc8405"}, {"sp": "Meli", "role": "d", "id": "Kakakku cantik, tinggi, dan semampai. Dia berbeda denganku. Dia berkulit putih.", "zh": "我姐姐很漂亮，个子高，身材修长。她和我不一样，她皮肤白。", "a": "0eec9becd3aa", "za": "72c3e3264864"}], "zh": "", "note": "", "qa": [], "u": 10}, {"id": "d26", "kind": "dlg", "book": "BIPA 1", "title": "喜欢什么样的房子", "lines": [{"sp": "Raden", "role": "d", "id": "Jeng, kamu suka rumah seperti apa?", "zh": "Ajeng，你喜欢什么样的房子？", "a": "e057419d73cb", "za": "198877cc8256"}, {"sp": "Ajeng", "role": "d", "id": "Aku suka rumah yang besar dan luas.", "zh": "我喜欢又大又宽敞的房子。", "a": "1f6c785bf240", "za": "9e4d3cbd11c5"}], "zh": "", "note": "", "qa": [], "u": 10}, {"id": "d27", "kind": "dlg", "book": "BIPA 2", "title": "音乐班见面（音频 1）", "lines": [{"sp": "Ari", "role": "d", "id": "Hai, Ela, kamu ikut kursus musik juga, ya?", "zh": "嗨，Ela，你也上音乐课吗？", "a": "2e0a8b4c825f", "za": "75a355065556", "an": {"p": [["Hai", "嗨"], ["Ela", "埃拉"], ["kamu", "你"], ["ikut", "参加"], ["kursus", "课程、培训班"], ["musik", "音乐"], ["juga", "也"], ["ya", "对吧"]], "b": "ikut = vi. 跟随、参加", "g": "结构：问候 + 称呼 + 主语 + ikut + 名词 + juga, ya? 句尾 ya 是口语里“对吧”，求确认。ikut kursus = 报班学习。"}}, {"sp": "Ela", "role": "d", "id": "Iya, Ari. Kamu juga?", "zh": "是的，Ari。你也是？", "a": "5d671ff4ecca", "za": "41ee66af1225", "an": {"p": [["Iya", "是的"], ["Ari", "阿里"], ["Kamu", "你"], ["juga", "也"]], "b": "", "g": "结构：Iya + 称呼。Kamu juga? = 你也是吗？省略动词，口语常用。"}}, {"sp": "Ari", "role": "d", "id": "Iya.", "zh": "对。", "a": "3161690909da", "za": "649bbc4934b3", "an": {"p": [["Iya", "是的"]], "b": "", "g": "简短应答。Iya 比 ya 更完整，表示“是的”。"}}, {"sp": "Ela", "role": "d", "id": "Kamu belajar alat musik apa?", "zh": "你学什么乐器？", "a": "6a43779d706f", "za": "7a9a467027cd", "an": {"p": [["Kamu", "你"], ["belajar", "学"], ["alat musik", "乐器"], ["apa", "什么"]], "b": "belajar = ber- + ajar（vt. 学习）", "g": "结构：主语 + belajar + 宾语 + apa？apa 放在被问名词后：alat musik apa = 什么乐器。"}}, {"sp": "Ari", "role": "d", "id": "Gitar. Kamu?", "zh": "吉他。你呢？", "a": "ef04929d27c8", "za": "c71b6fb8796e", "an": {"p": [["Gitar", "吉他"], ["Kamu", "你呢"]], "b": "", "g": "省略式回答。Kamu? = 你呢？用来把问题抛回给对方。"}}, {"sp": "Ela", "role": "d", "id": "Aku belajar bermain piano. Aku ke kelas dulu, ya. Kelas piano sudah mau mulai. Sampai jumpa, Ari.", "zh": "我学弹钢琴。我先去上课了，钢琴课快开始了。再见，Ari。", "a": "22bfa0b27ea7", "za": "3778389259e7", "an": {"p": [["Aku", "我"], ["belajar", "学"], ["bermain piano", "弹钢琴"], ["ke kelas", "去教室"], ["dulu", "先"], ["ya", "好吗"], ["Kelas piano", "钢琴课"], ["sudah mau mulai", "就要开始了"], ["Sampai jumpa", "再见"]], "b": "bermain = ber- + main；mulai = vi. 开始", "g": "结构：多个短句。aku 是口语“我”，比 saya 亲近。belajar bermain piano = 学弹钢琴。sudah mau + 动词 = 马上就要……；Sampai jumpa = 再见。"}}, {"sp": "Ari", "role": "d", "id": "Sampai jumpa, Ela.", "zh": "再见，Ela。", "a": "7c191052a10a", "za": "85ea553ca1c4", "an": {"p": [["Sampai jumpa", "再见"], ["Ela", "埃拉"]], "b": "", "g": "告别用语。sampai = 到……为止，jumpa = 见面，字面“直到再见”。"}}], "zh": "", "note": "", "qa": [], "u": 1}, {"id": "d28", "kind": "dlg", "book": "BIPA 2", "title": "喜欢什么乐器", "lines": [{"sp": "A", "role": "d", "id": "Kamu suka bermain alat musik apa?", "zh": "你喜欢玩什么乐器？", "a": "f5279702c082", "za": "acaa664c3de0", "an": {"p": [["Kamu", "你"], ["suka", "喜欢"], ["bermain", "演奏"], ["alat musik", "乐器"], ["apa", "什么"]], "b": "bermain = ber- + main", "g": "结构：主语 + suka + 动词 + 宾语 + apa？bermain + 乐器 = 演奏某种乐器。"}}, {"sp": "B", "role": "d", "id": "Saya suka bermain gitar. Kalau kamu?", "zh": "我喜欢弹吉他。你呢？", "a": "1e995bff6bbb", "za": "99bcfaa265e3", "an": {"p": [["Saya", "我"], ["suka", "喜欢"], ["bermain gitar", "弹吉他"], ["Kalau kamu", "那你呢"]], "b": "", "g": "结构：主语 + suka + 动词 + 宾语。Kalau + 人？= 那……呢？用来反问。"}}, {"sp": "A", "role": "d", "id": "Saya suka bermain saksofon. Saya suka musik pop.", "zh": "我喜欢吹萨克斯，我喜欢流行音乐。", "a": "c8ac46d796e1", "za": "2e50ac472216", "an": {"p": [["Saya", "我"], ["suka", "喜欢"], ["bermain saksofon", "吹萨克斯"], ["musik pop", "流行音乐"]], "b": "", "g": "结构：主语 + suka + 动词 + 宾语；主语 + suka + 名词。suka 后可接动词，也可直接接名词。"}}], "zh": "", "note": "", "qa": [], "u": 1}, {"id": "d29", "kind": "dlg", "book": "BIPA 2", "title": "采访老师（音频 2）", "lines": [{"sp": "Wartawan", "role": "d", "id": "Selamat pagi, Bu Dian. Saya dari majalah Edu. Saya ingin mewawancarai Ibu.", "zh": "早上好，Dian 老师。我是《Edu》杂志的，想采访您。", "a": "9bce449d4ce3", "za": "276eb8215179", "an": {"p": [["Selamat pagi", "早上好"], ["Bu Dian", "迪安女士"], ["Saya dari majalah Edu", "我来自 Edu 杂志"], ["ingin", "想"], ["mewawancarai", "采访"], ["Ibu", "您（对女性长辈）"]], "b": "mewawancarai = meN- + wawancara + -i（vt. 采访）", "g": "结构：问候 + 自我介绍 + ingin + 动词 + 宾语。Saya dari + 单位 = 我来自……。Ibu 在礼貌对话中可指“您”。mewawancarai 带 -i，后面直接接被采访的人。"}}, {"sp": "Bu Dian", "role": "d", "id": "Selamat pagi. Oh, silakan.", "zh": "早上好。哦，请吧。", "a": "d4dccdcff030", "za": "92a7a61dbe6c", "an": {"p": [["Selamat pagi", "早上好"], ["Oh", "哦"], ["silakan", "请"]], "b": "", "g": "结构：问候 + silakan。silakan 单独使用表示“请（说/请进/请便）”。"}}, {"sp": "Wartawan", "role": "d", "id": "Terima kasih, Bu. Kalau boleh tahu, apa pekerjaan Ibu?", "zh": "谢谢。请问您是做什么工作的？", "a": "17546ad862ec", "za": "1f71a8445f7f", "an": {"p": [["Terima kasih", "谢谢"], ["Bu", "女士"], ["Kalau boleh tahu", "如果可以知道的话"], ["apa", "什么"], ["pekerjaan", "工作"], ["Ibu", "您"]], "b": "pekerjaan = pe- + kerja + -an（n. 工作）", "g": "结构：客套 + Kalau boleh tahu（礼貌插入语）+ 问句。Kalau boleh tahu = 方便的话请问，用来委婉提问。"}}, {"sp": "Bu Dian", "role": "d", "id": "Saya guru.", "zh": "我是老师。", "a": "13b2fdc21b17", "za": "7fc55c99e823", "an": {"p": [["Saya", "我"], ["guru", "老师"]], "b": "", "g": "结构：名词谓语，不需要 adalah。"}}, {"sp": "Wartawan", "role": "d", "id": "Menurut Ibu, apa tugas seorang guru?", "zh": "您认为老师的职责是什么？", "a": "464244af46d3", "za": "159659a28805", "an": {"p": [["Menurut", "根据、依……看"], ["Ibu", "您"], ["apa", "什么"], ["tugas", "任务、职责"], ["seorang guru", "一位老师"]], "b": "menurut = n. 依照（介词）", "g": "结构：Menurut + 人, 问句。Menurut Ibu = 依您看。seorang = 一位（指人）。tugas = 职责。"}}, {"sp": "Bu Dian", "role": "d", "id": "Tugas guru adalah mengajar siswa di sekolah.", "zh": "老师的职责是在学校教学生。", "a": "3f6ac906b15c", "za": "64881d35802c", "an": {"p": [["Tugas guru", "老师的职责"], ["adalah", "是"], ["mengajar", "教"], ["siswa", "学生"], ["di sekolah", "在学校"]], "b": "mengajar = meN- + ajar（vt. 教）", "g": "结构：主语 + adalah + 动词短语。adalah 后接名词或动词短语，说明职责是什么。mengajar siswa = 教学生。"}}, {"sp": "Wartawan", "role": "d", "id": "Mengapa Anda menjadi seorang guru?", "zh": "您为什么当老师？", "a": "06178990351f", "za": "2fc80c5d1788", "an": {"p": [["Mengapa", "为什么"], ["Anda", "您"], ["menjadi", "成为"], ["seorang guru", "一位老师"]], "b": "menjadi = meN- + jadi（vi. 成为）；mengapa = meN- + apa", "g": "结构：Mengapa + 主语 + menjadi + 名词？menjadi + 职业 = 成为……。"}}, {"sp": "Bu Dian", "role": "d", "id": "Guru adalah pekerjaan yang luar biasa dan bermanfaat.", "zh": "老师是了不起又有意义的职业。", "a": "c7e9b5afe1cc", "za": "55a69cf94cce", "an": {"p": [["Guru", "老师"], ["adalah", "是"], ["pekerjaan", "工作"], ["yang luar biasa", "了不起的"], ["dan", "并且"], ["bermanfaat", "有益的"]], "b": "bermanfaat = ber- + manfaat（adj. 有益）；luar biasa = 非凡", "g": "结构：主语 + adalah + 名词 + yang + 形容词 + dan + 形容词。yang 从句修饰 pekerjaan；luar biasa = 超出寻常 = 了不起。"}}, {"sp": "Wartawan", "role": "d", "id": "Bagaimana kesan Anda selama menjadi guru?", "zh": "当老师这些年您感觉怎么样？", "a": "68f50cb604ea", "za": "983863e07ad0", "an": {"p": [["Bagaimana", "怎样"], ["kesan", "印象、感受"], ["Anda", "您"], ["selama", "在……期间"], ["menjadi", "成为"], ["guru", "老师"]], "b": "kesan = n. 印象", "g": "结构：Bagaimana + 名词 + 主语 + selama + 动词短语？selama + 动作 = 在做……的期间。kesan = 感想、印象。"}}, {"sp": "Bu Dian", "role": "d", "id": "Hem, sangat menyenangkan.", "zh": "嗯，很开心。", "a": "f2d8aa6a9245", "za": "73b3e3de1111", "an": {"p": [["Hem", "嗯"], ["sangat", "很"], ["menyenangkan", "令人愉快"]], "b": "menyenangkan = meN- + senang + -kan（adj. 令人愉快的）", "g": "结构：语气词 + sangat + 形容词。Hem 是思考时的“嗯”。menyenangkan 的 ny 读 /ɲ/。"}}, {"sp": "Wartawan", "role": "d", "id": "Bisakah Anda ceritakan hal yang menyenangkan itu?", "zh": "能讲讲开心在哪里吗？", "a": "8a8ef2b5974b", "za": "5430565317f9", "an": {"p": [["Bisakah", "能不能"], ["Anda", "您"], ["ceritakan", "讲述"], ["hal", "事情"], ["yang menyenangkan", "令人愉快的"], ["itu", "那个"]], "b": "bisakah = bisa + -kah；ceritakan = cerita + -kan（vt. 讲述）", "g": "结构：Bisakah + 主语 + 动词原形（-kan）+ 宾语？礼貌的请求；动词用 -kan 的原形，不加 meN-。hal yang menyenangkan = 那件愉快的事。"}}, {"sp": "Bu Dian", "role": "d", "id": "Kita bisa memberi ilmu yang berguna untuk siswa.", "zh": "我们可以给学生传授有用的知识。", "a": "36f138fc79a8", "za": "6ec66a390ed5", "an": {"p": [["Kita", "我们"], ["bisa", "能"], ["memberi", "给予"], ["ilmu", "知识"], ["yang berguna", "有用的"], ["untuk siswa", "给学生"]], "b": "memberi = meN- + beri（vt. 给）；berguna = ber- + guna（adj. 有用）", "g": "结构：主语 + bisa + 动词 + 宾语 + yang 从句 + untuk + 对象。kita 包含对方，这里指“我们（老师）”。"}}], "zh": "", "note": "", "qa": [], "u": 2}, {"id": "d30", "kind": "dlg", "book": "BIPA 2", "title": "你做什么工作", "lines": [{"sp": "A", "role": "d", "id": "Apa pekerjaanmu?", "zh": "你做什么工作？", "a": "2af05e636332", "za": "47cf713666f8", "an": {"p": [["Apa", "什么"], ["pekerjaanmu", "你的工作"]], "b": "pekerjaanmu = pekerjaan + -mu（你的）", "g": "结构：Apa + 名词 + -mu？问对方的职业，口语化，比 Apa pekerjaan Anda? 亲近。"}}, {"sp": "B", "role": "d", "id": "Saya seorang wartawan.", "zh": "我是记者。", "a": "0bf2bc2fbae1", "za": "1bc4ad4550eb", "an": {"p": [["Saya", "我"], ["seorang", "一位"], ["wartawan", "记者"]], "b": "wartawan = n. 记者", "g": "结构：主语 + seorang + 职业。seorang 是指人的量词。"}}, {"sp": "A", "role": "d", "id": "Saya seorang pegawai negeri. Kalau kamu?", "zh": "我是公务员。你呢？", "a": "e96af7105381", "za": "e6e9f2fc7078", "an": {"p": [["Saya", "我"], ["seorang", "一位"], ["pegawai negeri", "公务员"], ["Kalau kamu", "那你呢"]], "b": "pegawai = n. 职员；negeri = 国家的", "g": "结构：主语 + seorang + 职业；Kalau kamu? 反问。pegawai negeri = 国家的职员 = 公务员。"}}, {"sp": "C", "role": "d", "id": "Saya adalah seorang guru. Tugas saya adalah mengajar siswa di sekolah.", "zh": "我是老师，我的职责是在学校教学生。", "a": "666559c912f0", "za": "a335ce98d01c", "an": {"p": [["Saya", "我"], ["adalah", "是"], ["seorang guru", "一位老师"], ["Tugas saya", "我的职责"], ["mengajar siswa", "教学生"], ["di sekolah", "在学校"]], "b": "", "g": "结构：主语 + adalah + seorang + 职业。Tugas saya adalah + 动词短语 = 我的职责是……。adalah 在正式回答里使用。"}}], "zh": "", "note": "", "qa": [], "u": 2}, {"id": "d31", "kind": "dlg", "book": "BIPA 2", "title": "在服装店（音频 4）", "lines": [{"sp": "Penjual", "role": "d", "id": "Cari apa, Bu? Silakan, lihat-lihat dulu.", "zh": "您找什么，女士？请先随便看看。", "a": "0a1e738b4cc7", "za": "05da5b294886", "an": {"p": [["Cari", "找"], ["apa", "什么"], ["Bu", "女士"], ["Silakan", "请"], ["lihat-lihat", "随便看看"], ["dulu", "先"]], "b": "lihat-lihat = lihat 重叠", "g": "结构：省略主语的询问。店员常说：Cari apa? = 您找什么？lihat-lihat = 随意看看，重叠表示轻松、不急。"}}, {"sp": "Pembeli", "role": "d", "id": "Saya ingin membeli satu blus dan satu rok panjang.", "zh": "我想买一件女衬衫和一条长裙。", "a": "4c79f20dd9b1", "za": "597fb7027dd2", "an": {"p": [["Saya", "我"], ["ingin", "想"], ["membeli", "买"], ["satu blus", "一件女衬衫"], ["dan", "和"], ["satu rok panjang", "一条长裙"]], "b": "membeli = meN- + beli（vt. 买）", "g": "结构：主语 + ingin + 动词 + 宾语。satu + 名词：一件／一条。rok panjang = 长裙。"}}, {"sp": "Penjual", "role": "d", "id": "Oh, ada, Bu. Silakan. Ini banyak barangnya. Satu blus harganya Rp90.000,00. Satu rok harganya Rp80.000,00.", "zh": "有的，您请看，这里货很多。一件女衬衫九万盾，一条裙子八万盾。", "a": "993a0ab0a181", "za": "451fbef6ef4d", "an": {"p": [["Oh", "哦"], ["ada", "有"], ["Bu", "女士"], ["Silakan", "请"], ["Ini", "这里"], ["banyak", "很多"], ["barangnya", "这些东西"], ["Satu blus", "一件衬衫"], ["harganya", "它的价格"], ["Rp90.000,00", "九万盾"]], "b": "barangnya = barang + -nya；harganya = harga + -nya", "g": "结构：多个短句。Satu blus harganya + 价格 = 一件衬衫的价格是……（主谓倒装式：主题 + 价格）。Rp90.000,00 读作 sembilan puluh ribu rupiah。"}}, {"sp": "Pembeli", "role": "d", "id": "Oh, bagus. Murah juga. Saya ambil, ya. Ini uangnya.", "zh": "哦，不错，也挺便宜，我要了。给您钱。", "a": "c39e172ec325", "za": "765377c5c6be", "an": {"p": [["Oh", "哦"], ["bagus", "好"], ["Murah", "便宜"], ["juga", "也"], ["Saya ambil", "我拿了"], ["ya", "好吗"], ["Ini", "这是"], ["uangnya", "钱"]], "b": "ambil = vt. 拿、买下", "g": "结构：评价 + 决定。Saya ambil, ya = 我就拿这个了（买下）。uangnya = uang + -nya（这笔钱）。"}}, {"sp": "Penjual", "role": "d", "id": "Ini barangnya, Bu, dan ini kembaliannya Rp30.000. Ada lagi, Bu?", "zh": "这是您的东西，这是找您的三万盾。还要别的吗？", "a": "b019219a7b73", "za": "7729f7d2e3c6", "an": {"p": [["Ini", "这是"], ["barangnya", "您的东西"], ["Bu", "女士"], ["dan", "和"], ["kembaliannya", "找您的钱"], ["Rp30.000", "三万盾"], ["Ada lagi", "还有吗"]], "b": "kembaliannya = kembali + -an + -nya（n. 找零）", "g": "结构：Ini + 名词 + dan + ini + 名词。kembalian = 找零钱。Ada lagi? = 还要别的吗？店员常用。"}}, {"sp": "Pembeli", "role": "d", "id": "Ini saja. Terima kasih.", "zh": "就这些，谢谢。", "a": "43a921e47710", "za": "803c9bd5495d", "an": {"p": [["Ini", "这个"], ["saja", "就"], ["Terima kasih", "谢谢"]], "b": "", "g": "结构：Ini saja = 就这些。saja 表示“仅此”。"}}, {"sp": "Penjual", "role": "d", "id": "Baik, sama-sama, Bu. Terima kasih sudah berbelanja di Toko Anisa.", "zh": "好的，不客气。谢谢您光临 Anisa 商店。", "a": "91f4c1245093", "za": "35176f7e0811", "an": {"p": [["Baik", "好的"], ["sama-sama", "不客气"], ["Bu", "女士"], ["Terima kasih", "谢谢"], ["sudah", "已经"], ["berbelanja", "购物"], ["di Toko Anisa", "在阿尼萨商店"]], "b": "berbelanja = ber- + belanja（vi. 购物）", "g": "结构：应答 + Terima kasih + sudah + 动词 + 地点。Terima kasih sudah + 动词 = 感谢您（已经）……，店员告别语。"}}], "zh": "", "note": "中文版把卖家（Penjual）和买家（Pembeli）都译成了“顾客/买家”，已按原文更正。", "qa": [], "u": 4}, {"id": "d32", "kind": "dlg", "book": "BIPA 2", "title": "线上点餐（音频 5）", "lines": [{"sp": "Ela", "role": "d", "id": "Ari, saya mau pesan makanan melalui aplikasi daring. Kamu mau pesan apa?", "zh": "Ari，我要用线上应用点餐，你要点什么？", "a": "4fe7f88109e9", "za": "a63ee2079ad6", "an": {"p": [["Ari", "阿里"], ["saya", "我"], ["mau", "想要"], ["pesan", "订购"], ["makanan", "食物"], ["melalui", "通过"], ["aplikasi daring", "在线应用"], ["Kamu", "你"], ["apa", "什么"]], "b": "melalui = meN- + lalu + -i（prep. 经由）；daring = 在线", "g": "结构：称呼 + 主语 + mau + 动词 + 宾语 + melalui + 方式。melalui = 通过。daring（dalam jaringan）= 在线。"}}, {"sp": "Ari", "role": "d", "id": "Hem, saya pesan mi goreng saja.", "zh": "嗯，我就点炒面吧。", "a": "1416f39cb141", "za": "2048a04dd5a3", "an": {"p": [["Hem", "嗯"], ["saya", "我"], ["pesan", "点"], ["mi goreng", "炒面"], ["saja", "就"]], "b": "", "g": "结构：主语 + pesan + 食物 + saja。pesan = 订、点（餐）。saja = 就（只要）。"}}, {"sp": "Ela", "role": "d", "id": "Minumannya?", "zh": "饮料呢？", "a": "5a10881eb27c", "za": "40d1ff8a93e4", "an": {"p": [["Minumannya", "饮料呢"]], "b": "minumannya = minuman + -nya", "g": "结构：省略式问句，“饮料呢？”-nya 指前面提到的这份餐。minuman = minum + -an（n. 饮料）。"}}, {"sp": "Ari", "role": "d", "id": "Jus jeruk saja, Ela.", "zh": "橙汁就行，Ela。", "a": "23e3445dcc3f", "za": "acc6b8e9123d", "an": {"p": [["Jus jeruk", "橙汁"], ["saja", "就"], ["Ela", "埃拉"]], "b": "", "g": "结构：名词 + saja = 就要……。省略主语和动词。"}}, {"sp": "Ela", "role": "d", "id": "Baiklah. Saya pesan, hem …, sate ayam saja. Minumannya … jus mangga. Pesan sekarang, ya?", "zh": "好。我点……鸡肉串吧，饮料……芒果汁。现在下单了哦？", "a": "dc85c59eb763", "za": "d29f56a3b40f", "an": {"p": [["Baiklah", "好吧"], ["Saya pesan", "我点"], ["sate ayam", "鸡肉沙爹"], ["saja", "就"], ["Minumannya", "饮料"], ["jus mangga", "芒果汁"], ["Pesan sekarang", "现在下单"], ["ya", "好吗"]], "b": "baiklah = baik + -lah", "g": "结构：应答 + 主语 + pesan + 食物 + saja；省略式。Pesan sekarang, ya? = 现在就下单，好吗？"}}, {"sp": "Ari", "role": "d", "id": "Sip.", "zh": "好嘞。", "a": "cc536c30a749", "za": "f26af0f4fc97", "an": {"p": [["Sip", "好、行（口语）"]], "b": "", "g": "口语应答，来自英语 “ship-shape” 的缩略，意为“好的、没问题”。"}}], "zh": "", "note": "", "qa": [], "u": 5}, {"id": "d33", "kind": "dlg", "book": "BIPA 2", "title": "最喜欢的食物", "lines": [{"sp": "A", "role": "d", "id": "Apa makanan kesukaanmu?", "zh": "你最喜欢吃什么？", "a": "6f500268ebb1", "za": "e7d704d3d4c6", "an": {"p": [["Apa", "什么"], ["makanan", "食物"], ["kesukaanmu", "你喜欢的"]], "b": "makanan = makan + -an；kesukaanmu = ke- + suka + -an + -mu", "g": "结构：Apa + 名词（kesukaan）+ -mu？makanan kesukaanmu = 你最爱的食物。-mu 是 kamu 的后缀形式。"}}, {"sp": "B", "role": "d", "id": "Kalau saya paling suka nasi goreng.", "zh": "我最喜欢炒饭。", "a": "6b578b83e1dd", "za": "a83ae74aad55", "an": {"p": [["Kalau saya", "至于我"], ["paling", "最"], ["suka", "喜欢"], ["nasi goreng", "炒饭"]], "b": "", "g": "结构：Kalau + 主语 引出话题；paling + 动词 = 最……。paling suka = 最喜欢。"}}, {"sp": "A", "role": "d", "id": "Apa makanan khas dari negara Anda?", "zh": "你们国家的特色菜是什么？", "a": "896fdb43217c", "za": "c2c3f2aac7ab", "an": {"p": [["Apa", "什么"], ["makanan khas", "特色食物"], ["dari", "来自"], ["negara", "国家"], ["Anda", "您的"]], "b": "khas = adj. 特有的", "g": "结构：Apa + 名词短语 + dari + 地点？makanan khas = 特色美食；dari negara Anda = 您国家的。"}}, {"sp": "B", "role": "d", "id": "Makanan khas negara saya adalah gado-gado.", "zh": "我们国家的特色菜是加多加多。", "a": "d3951a686acb", "za": "cba5d0da05e1", "an": {"p": [["Makanan khas", "特色食物"], ["negara saya", "我的国家"], ["adalah", "是"], ["gado-gado", "加多加多（花生酱沙拉）"]], "b": "", "g": "结构：主语 + adalah + 名词。名词短语：核心名词在前，所属者在后（makanan khas negara saya）。"}}], "zh": "", "note": "", "qa": [], "u": 5}, {"id": "d34", "kind": "dlg", "book": "BIPA 2", "title": "乔迁请客（对话 6.1）", "lines": [{"sp": "Pras", "role": "d", "id": "Halo, Dinda. Apakah kamu ada acara besok?", "zh": "喂，Dinda，你明天有安排吗？", "a": "a0bb554eff52", "za": "a00688c05f51", "an": {"p": [["Halo", "喂"], ["Dinda", "丁达"], ["Apakah", "是否"], ["kamu", "你"], ["ada acara", "有安排"], ["besok", "明天"]], "b": "acara = n. 活动、安排", "g": "结构：问候 + Apakah + 主语 + ada + 名词 + 时间？ada acara = 有事（有安排）。besok 放句尾。"}}, {"sp": "Dinda", "role": "d", "id": "Hem, tidak ada. Ada apa?", "zh": "嗯，没有。怎么了？", "a": "d9760a014902", "za": "e371a63d76ef", "an": {"p": [["Hem", "嗯"], ["tidak ada", "没有"], ["Ada apa", "怎么了"]], "b": "", "g": "结构：Tidak ada = 没有。Ada apa? = 有什么事吗？常用回应。"}}, {"sp": "Pras", "role": "d", "id": "Aku ingin mengundang teman-teman makan bersama. Aku baru pindah rumah baru.", "zh": "我想请朋友们一起吃饭，我刚搬了新家。", "a": "cb4c4462f40c", "za": "316daf2294f8", "an": {"p": [["Aku", "我"], ["ingin", "想"], ["mengundang", "邀请"], ["teman-teman", "朋友们"], ["makan bersama", "一起吃饭"], ["baru", "刚"], ["pindah", "搬"], ["rumah baru", "新家"]], "b": "mengundang = meN- + undang（vt. 邀请）；pindah = vi. 搬家", "g": "结构：主语 + ingin + 动词 + 宾语 + 动词短语；baru + 动词 = 刚刚……。pindah rumah = 搬家。"}}, {"sp": "Dinda", "role": "d", "id": "Wah, selamat, ya. Di mana rumah barumu?", "zh": "哇，恭喜！你的新家在哪？", "a": "52fe940b5196", "za": "df8ec4b4b2da", "an": {"p": [["Wah", "哇"], ["selamat", "恭喜"], ["ya", "啊"], ["Di mana", "在哪里"], ["rumah barumu", "你的新家"]], "b": "barumu = baru + -mu", "g": "结构：感叹 + selamat（恭喜）+ 问句。rumah barumu = 你的新房子（名词 + 形容词 + -mu）。"}}, {"sp": "Pras", "role": "d", "id": "Di Jalan Mawar Nomor 10. Di sebelah kantor pos.", "zh": "在玫瑰路 10 号，邮局旁边。", "a": "04a174ecb52a", "za": "5f1fba62cc2a", "an": {"p": [["Di", "在"], ["Jalan Mawar", "玫瑰路"], ["Nomor 10", "10 号"], ["Di sebelah", "在……旁边"], ["kantor pos", "邮局"]], "b": "", "g": "结构：地点回答，省略主语和动词。Jalan + 路名 + Nomor + 号码 = 某某路几号。di sebelah = 在……旁边。"}}, {"sp": "Dinda", "role": "d", "id": "Oh, di sana. Aku tahu tempatnya. Acaranya mulai pukul berapa?", "zh": "哦，那里啊，我知道。几点开始？", "a": "3731b7e46f90", "za": "284274df2409", "an": {"p": [["Oh", "哦"], ["di sana", "在那里"], ["Aku tahu", "我知道"], ["tempatnya", "那个地方"], ["Acaranya", "活动"], ["mulai", "开始"], ["pukul berapa", "几点"]], "b": "tempatnya = tempat + -nya", "g": "结构：Aku tahu + 宾语。Acaranya mulai pukul berapa? = 活动几点开始？-nya 指前面所说的那场聚会。"}}, {"sp": "Pras", "role": "d", "id": "Acaranya mulai pukul 10 pagi.", "zh": "上午十点。", "a": "aceef1be8735", "za": "2f051ce1af3c", "an": {"p": [["Acaranya", "活动"], ["mulai", "开始"], ["pukul 10 pagi", "早上十点"]], "b": "", "g": "结构：主语 + mulai + pukul + 钟点 + 时段。pukul 10 读 pukul sepuluh。"}}, {"sp": "Dinda", "role": "d", "id": "Oke, aku pasti datang. Terima kasih, Pras.", "zh": "好，我一定来。谢谢你，Pras。", "a": "3e9832924db2", "za": "48dc52d78643", "an": {"p": [["Oke", "好的"], ["aku", "我"], ["pasti", "一定"], ["datang", "来"], ["Terima kasih", "谢谢"], ["Pras", "普拉斯"]], "b": "", "g": "结构：主语 + pasti + 动词。pasti 放主语后，表示肯定。"}}], "zh": "", "note": "", "qa": [], "u": 6}, {"id": "d35", "kind": "dlg", "book": "BIPA 2", "title": "婉拒邀请（对话 6.2）", "lines": [{"sp": "Wandi", "role": "d", "id": "Wulan, aku ingin mengundang kamu main basket minggu depan.", "zh": "Wulan，我想请你下周一起打篮球。", "a": "3f24d4049837", "za": "cb6aff8ba2e3", "an": {"p": [["Wulan", "乌兰"], ["aku", "我"], ["ingin", "想"], ["mengundang", "邀请"], ["kamu", "你"], ["main basket", "打篮球"], ["minggu depan", "下周"]], "b": "", "g": "结构：称呼 + 主语 + ingin + mengundang + 人 + 动词短语 + 时间。mengundang + 人 + 做某事 = 邀请某人做……。main basket = 打篮球。"}}, {"sp": "Wulan", "role": "d", "id": "Main basket? Di mana, Han?", "zh": "打篮球？在哪儿？", "a": "fcf7b042dbd2", "za": "a51f84936579", "an": {"p": [["Main basket", "打篮球"], ["Di mana", "在哪里"], ["Han", "汉"]], "b": "", "g": "结构：重复对方的话来确认，再问地点。Di mana = 在哪里。"}}, {"sp": "Wandi", "role": "d", "id": "Di lapangan universitas kita saja.", "zh": "就在我们大学的球场。", "a": "fc5bc30f0009", "za": "d3b494057a34", "an": {"p": [["Di", "在"], ["lapangan", "场地"], ["universitas kita", "我们的大学"], ["saja", "就"]], "b": "", "g": "结构：地点 + saja = 就在……（不用远去）。kita 这里是包含对方的“我们”。"}}, {"sp": "Wulan", "role": "d", "id": "Lapangan sebelah gedung rektorat? Di seberang kantin?", "zh": "校长楼旁边、食堂对面那个球场？", "a": "9b08dc57f76f", "za": "ee1872374666", "an": {"p": [["Lapangan", "场地"], ["sebelah", "旁边"], ["gedung rektorat", "校长办公楼"], ["Di seberang", "在……对面"], ["kantin", "食堂"]], "b": "", "g": "结构：两个确认问句。Lapangan sebelah gedung… = 在……旁边的那块场地。seberang = 对面。"}}, {"sp": "Wandi", "role": "d", "id": "Iya, di sana.", "zh": "对，就那里。", "a": "0983dd7c2bb7", "za": "b9b09dfd588d", "an": {"p": [["Iya", "是的"], ["di sana", "在那里"]], "b": "", "g": "简短肯定回答。"}}, {"sp": "Wulan", "role": "d", "id": "Aduh, maaf sekali. Minggu depan aku sudah ada rencana.", "zh": "哎呀，真不好意思，下周我已经有安排了。", "a": "2f87ffa89fc2", "za": "b1034223e535", "an": {"p": [["Aduh", "哎呀"], ["maaf", "抱歉"], ["sekali", "非常"], ["Minggu depan", "下周"], ["aku", "我"], ["sudah", "已经"], ["ada rencana", "有计划"]], "b": "rencana = n. 计划", "g": "结构：感叹 + 道歉 + 理由。sudah ada rencana = 已经有安排了，用来委婉拒绝。maaf sekali = 非常抱歉。"}}, {"sp": "Wandi", "role": "d", "id": "Oh, begitu. Ya sudah, tidak apa-apa.", "zh": "哦，这样啊。那没关系。", "a": "db5e953765a4", "za": "2b07b1becffe", "an": {"p": [["Oh", "哦"], ["begitu", "原来这样"], ["Ya sudah", "那就算了"], ["tidak apa-apa", "没关系"]], "b": "", "g": "结构：Oh, begitu = 原来如此。Ya sudah = 好吧，那就这样（接受结果）。tidak apa-apa = 没关系。"}}, {"sp": "Wulan", "role": "d", "id": "Mudah-mudahan aku bisa ikut lain waktu, ya.", "zh": "希望下次我能去。", "a": "75153e107f6f", "za": "88f89549387c", "an": {"p": [["Mudah-mudahan", "但愿"], ["aku", "我"], ["bisa", "能"], ["ikut", "参加"], ["lain waktu", "下次"], ["ya", "好吗"]], "b": "mudah-mudahan = mudah 重叠（希望）", "g": "结构：Mudah-mudahan + 主语 + 动词。表示希望：但愿……。lain waktu = 改天、下次。"}}], "zh": "", "note": "", "qa": [], "u": 6}, {"id": "d36", "kind": "dlg", "book": "BIPA 2", "title": "一起做放松运动（对话 7）", "lines": [{"sp": "Eki", "role": "d", "id": "Ayu, kamu sudah selesai berolahraga?", "zh": "Ayu，你运动完了吗？", "a": "b45a53b19ce1", "za": "61ca68adcee5", "an": {"p": [["Ayu", "阿尤"], ["kamu", "你"], ["sudah", "已经"], ["selesai", "结束"], ["berolahraga", "做运动"]], "b": "berolahraga = ber- + olahraga（vi. 做运动）", "g": "结构：称呼 + 主语 + sudah selesai + 动词？sudah selesai + 动词 = 已经做完……。"}}, {"sp": "Ayu", "role": "d", "id": "Sudah, aku sekarang sedang pendinginan.", "zh": "完了，我现在在做放松运动。", "a": "bbe4e9b0d8d2", "za": "8995d1a01baf", "an": {"p": [["Sudah", "已经"], ["aku", "我"], ["sekarang", "现在"], ["sedang", "正在"], ["pendinginan", "放松（冷身）"]], "b": "pendinginan = pen- + dingin + -an（n. 放松运动）", "g": "结构：Sudah, 主语 + 时间 + sedang + 名词/动词。sedang 表正在进行。pendinginan = 运动后的整理放松。"}}, {"sp": "Eki", "role": "d", "id": "Bagaimana kalau kita lakukan bersama?", "zh": "我们一起做怎么样？", "a": "2d6c9591c71e", "za": "c4dfb393c54b", "an": {"p": [["Bagaimana kalau", "……怎么样"], ["kita", "我们"], ["lakukan", "做"], ["bersama", "一起"]], "b": "lakukan = laku + -kan（动词原形，宾语已提前）", "g": "结构：Bagaimana kalau + 主语 + 动词？= 要不要……？提建议的固定说法。lakukan 用原形，因为宾语（放松运动）已在前面提到。"}}, {"sp": "Ayu", "role": "d", "id": "Ayo. Pertama regangkan tangan. Setelah itu, regangkan kaki.", "zh": "好啊。先伸展手臂，然后伸展腿。", "a": "392e6ae1e0e6", "za": "e303e793a034", "an": {"p": [["Ayo", "来吧"], ["Pertama", "首先"], ["regangkan", "伸展"], ["tangan", "手臂"], ["Setelah itu", "然后"], ["kaki", "腿"]], "b": "regangkan = regang + -kan（祈使）", "g": "结构：祈使句：动词原形 + -kan + 宾语。Pertama / Setelah itu 给动作排顺序。regang = 拉伸。"}}, {"sp": "Eki", "role": "d", "id": "Gerakan selanjutnya?", "zh": "下一个动作呢？", "a": "1ed13c6270da", "za": "3aaafcd4bd31", "an": {"p": [["Gerakan", "动作"], ["selanjutnya", "下一个"]], "b": "gerakan = gerak + -an（n. 动作）；selanjutnya = se- + lanjut + -nya", "g": "结构：名词 + selanjutnya？问下一步。selanjutnya = 接下来的。"}}, {"sp": "Ayu", "role": "d", "id": "Tarik nafas dalam-dalam lalu keluarkan.", "zh": "深吸一口气，再呼出来。", "a": "7369f41115b6", "za": "e4b380e1257b", "an": {"p": [["Tarik", "拉、吸"], ["nafas", "呼吸"], ["dalam-dalam", "深深地"], ["lalu", "然后"], ["keluarkan", "呼出"]], "b": "dalam-dalam = dalam 重叠；keluarkan = keluar + -kan", "g": "结构：祈使句：动词 + 宾语 + 副词 + lalu + 动词。dalam-dalam = 深深地。keluarkan = 使出来，这里指呼气。nafas 标准拼写 napas。"}}, {"sp": "Eki", "role": "d", "id": "Wah, segarnya. Terima kasih, Ayu.", "zh": "哇，真舒服。谢谢你，Ayu。", "a": "50f750611374", "za": "53acb35522fe", "an": {"p": [["Wah", "哇"], ["segarnya", "好清爽"], ["Terima kasih", "谢谢"], ["Ayu", "阿尤"]], "b": "segarnya = segar + -nya（感叹）", "g": "结构：形容词 + -nya = 感叹：多么……啊。segar = 清爽。"}}, {"sp": "Ayu", "role": "d", "id": "Sama-sama, Eki.", "zh": "不客气，Eki。", "a": "6fadd23277f5", "za": "5d7391220501", "an": {"p": [["Sama-sama", "不客气"], ["Eki", "埃基"]], "b": "", "g": "回应感谢：Sama-sama = 彼此彼此，不客气。"}}], "zh": "", "note": "", "qa": [], "u": 7}, {"id": "d37", "kind": "dlg", "book": "BIPA 2", "title": "电话约打球", "lines": [{"sp": "Putu", "role": "d", "id": "Halo, ini Putu. Apa saya bisa bicara dengan Dian?", "zh": "喂，我是 Putu，可以请 Dian 接电话吗？", "a": "c6e2fc12da58", "za": "3d9d16cf1126", "an": {"p": [["Halo", "喂"], ["ini", "这里是"], ["Putu", "普图"], ["Apa", "是否"], ["saya", "我"], ["bisa", "能"], ["bicara", "说话"], ["dengan", "和"], ["Dian", "迪安"]], "b": "bicara = vi. 说话", "g": "结构：电话开场：Halo, ini + 名字。Apa saya bisa bicara dengan + 人？= 我能和……通话吗？是电话里找人的固定说法。"}}, {"sp": "Dian", "role": "d", "id": "Hai, Putu. Ini aku. Ada apa kamu menelepon?", "zh": "嗨，Putu，是我。打电话有什么事？", "a": "288a17fa7a1b", "za": "14a6fb8d57a9", "an": {"p": [["Hai", "嗨"], ["Putu", "普图"], ["Ini aku", "是我"], ["Ada apa", "有什么事"], ["kamu", "你"], ["menelepon", "打电话"]], "b": "menelepon = meN- + telepon（vi. 打电话）", "g": "结构：Ini aku = 我就是（接电话时）。Ada apa + 主语 + 动词？= 你打电话有什么事？"}}, {"sp": "Putu", "role": "d", "id": "Nanti sore kita main badminton, yuk!", "zh": "下午我们去打羽毛球吧！", "a": "49f68159f294", "za": "eca94552068f", "an": {"p": [["Nanti sore", "今天下午晚些时候"], ["kita", "我们"], ["main badminton", "打羽毛球"], ["yuk", "走吧"]], "b": "", "g": "结构：时间 + 主语 + 动词短语, yuk! yuk 是口语邀请词，等于 ayo。nanti sore = 今天稍后的下午。"}}, {"sp": "Dian", "role": "d", "id": "Hem, ayo! Main di mana?", "zh": "嗯，好啊！在哪打？", "a": "26ed99f907b6", "za": "9bec65665e73", "an": {"p": [["Hem", "嗯"], ["ayo", "好啊"], ["Main", "打"], ["di mana", "在哪里"]], "b": "", "g": "结构：Ayo = 来吧／好啊。Main di mana? 省略主语：在哪里打？"}}, {"sp": "Putu", "role": "d", "id": "Di lapangan samping masjid saja. Sampai ketemu nanti, ya.", "zh": "就在清真寺旁边的场地。回头见！", "a": "8b79892c6e38", "za": "72304b64f65f", "an": {"p": [["Di lapangan", "在场地"], ["samping", "旁边"], ["masjid", "清真寺"], ["saja", "就"], ["Sampai ketemu", "回头见"], ["nanti", "待会"], ["ya", "好吗"]], "b": "ketemu = 口语“见面”（= bertemu）", "g": "结构：地点 + saja；告别语 Sampai ketemu nanti = 待会儿见。lapangan samping masjid = 清真寺旁边的场地。"}}, {"sp": "Dian", "role": "d", "id": "Oke kalau begitu. Sampai ketemu.", "zh": "好，那就这样，回头见。", "a": "2a0881223a7a", "za": "7e4b0f5cae4c", "an": {"p": [["Oke", "好"], ["kalau begitu", "那样的话"], ["Sampai ketemu", "回头见"]], "b": "", "g": "结构：Oke kalau begitu = 那就这样吧。Sampai ketemu = 再见（口语）。"}}], "zh": "", "note": "打电话三步：① 打招呼并自报姓名；② 说明来意；③ 结束通话。", "qa": [], "u": 7}, {"id": "d38", "kind": "dlg", "book": "BIPA 2", "title": "去看音乐会（音频 8）", "lines": [{"sp": "Putu", "role": "d", "id": "Hai, Lala.", "zh": "嗨，Lala。", "a": "b01bcd4343f1", "za": "7c3bec0c36f0", "an": {"p": [["Hai", "嗨"], ["Lala", "拉拉"]], "b": "", "g": "打招呼。"}}, {"sp": "Lala", "role": "d", "id": "Halo, Putu. Apakah kamu menonton konser kemarin?", "zh": "你好，Putu。你昨天去看音乐会了吗？", "a": "6a7296402cc1", "za": "03f21bfaa57c", "an": {"p": [["Halo", "喂、你好"], ["Putu", "普图"], ["Apakah", "是否"], ["kamu", "你"], ["menonton", "观看"], ["konser", "音乐会"], ["kemarin", "昨天"]], "b": "menonton = meN- + tonton（vt. 观看）", "g": "结构：Apakah + 主语 + 动词 + 宾语 + 时间？kemarin 放句尾。"}}, {"sp": "Putu", "role": "d", "id": "Iya, La. Acaranya ramai sekali.", "zh": "去了，人特别多。", "a": "fab6c38e0575", "za": "d89fff130d5b", "an": {"p": [["Iya", "是的"], ["La", "拉（Lala 的简称）"], ["Acaranya", "那场活动"], ["ramai", "热闹"], ["sekali", "非常"]], "b": "", "g": "结构：回应 + 主语 + 形容词 + sekali。ramai = 热闹、人多。"}}, {"sp": "Lala", "role": "d", "id": "Wah, pasti seru. Kamu pergi naik apa?", "zh": "哇，肯定很精彩。你坐什么去的？", "a": "e7b291adcbf3", "za": "5cbcbd002d84", "an": {"p": [["Wah", "哇"], ["pasti", "一定"], ["seru", "精彩"], ["Kamu", "你"], ["pergi", "去"], ["naik apa", "乘什么"]], "b": "seru = adj. 刺激、热闹（口语）", "g": "结构：Kamu pergi naik apa? = 你坐什么去的？naik + 交通工具 = 乘……；apa 问交通工具。"}}, {"sp": "Putu", "role": "d", "id": "Aku naik kereta.", "zh": "我坐火车去的。", "a": "22620219d5a4", "za": "8c08a14a0421", "an": {"p": [["Aku", "我"], ["naik", "乘"], ["kereta", "火车"]], "b": "", "g": "结构：主语 + naik + 交通工具。"}}, {"sp": "Lala", "role": "d", "id": "Apakah naik kereta lebih cepat daripada naik bus?", "zh": "坐火车比坐公交快吗
