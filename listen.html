 "a": "4341f32a4d72"}, {"sp": "", "role": "r", "id": "Kopi rasanya pahit.", "zh": "咖啡是苦的。", "a": "e771a4613624"}, {"sp": "", "role": "r", "id": "Lombok rasanya pedas.", "zh": "辣椒是辣的。", "a": "ee50fc4ca67b"}, {"sp": "", "role": "r", "id": "Kami juga pergi ke pujasera (pusat jajanan serba ada).", "zh": "我们还去了美食广场（各种小吃都有的地方）。", "a": "41c6b5a5c742"}, {"sp": "", "role": "r", "id": "Di situ ada banyak makanan.", "zh": "那里有很多吃的。", "a": "f85b29519816"}, {"sp": "", "role": "r", "id": "Ada soto, bakso, mi ayam, rendang, opor ayam, gado-gado, satai, dan ayam goreng.", "zh": "有 soto 汤、肉丸、鸡肉面、仁当、椰汁鸡、加多加多沙拉、沙爹和炸鸡。", "a": "35cf44df36d0"}, {"sp": "", "role": "r", "id": "Kamu suka bakso?", "zh": "你喜欢肉丸吗？", "a": "20ca253ab70f"}, {"sp": "", "role": "r", "id": "Bakso dari daging sapi, ayam, atau ikan.", "zh": "肉丸是用牛肉、鸡肉或鱼肉做的。", "a": "1e16a6ecda03"}, {"sp": "", "role": "r", "id": "Teksturnya kenyal dan berserat.", "zh": "口感弹牙有嚼劲。", "a": "ace10ca9739a"}, {"sp": "", "role": "r", "id": "Kami juga pesan minuman.", "zh": "我们还点了饮料。", "a": "889149b49893"}, {"sp": "", "role": "r", "id": "Ada es teh, kopi, es jeruk di pujasera.", "zh": "美食广场有冰茶、咖啡和冰橘子水。", "a": "a442fb0e74b7"}, {"sp": "", "role": "r", "id": "Es teh rasanya manis.", "zh": "冰茶是甜的。", "a": "32c468a01255"}, {"sp": "", "role": "r", "id": "Kopi rasanya pahit.", "zh": "咖啡是苦的。", "a": "e771a4613624"}, {"sp": "", "role": "r", "id": "Es jeruk rasanya masam.", "zh": "冰橘子水是酸的。", "a": "114acf594164"}], "zh": "嗨，我叫 Yoyo，是个厨师。我的爱好是去市场买东西。今天我和朋友去了市场，我们通常会买很多食材。市场里有糖、橘子、盐、咖啡和辣椒。糖是甜的，橘子是酸的，盐是咸的，咖啡是苦的，辣椒是辣的。我们还去了美食广场，那里有很多吃的：索托汤、肉丸、鸡肉面、仁当、椰奶炖鸡、加多加多、沙爹和炸鸡。你喜欢肉丸吗？肉丸是用牛肉、鸡肉或鱼肉做的，口感有嚼劲、有纤维感。我们还点了饮料，美食广场有冰茶、咖啡和冰橙汁。冰茶是甜的，咖啡是苦的，冰橙汁是酸的。", "note": "", "qa": [{"q": "Apa hobi Yoyo?", "a": "Berbelanja ke pasar.", "qa": "7c56c461f00b", "aa": "d280fc7ab499", "qz": "Yoyo 的爱好是什么？", "az": "去市场买东西。"}, {"q": "Apa yang Yoyo beli di pasar?", "a": "Gula, jeruk, garam, kopi, dan lombok.", "qa": "8992543b5643", "aa": "d653786f765f", "qz": "Yoyo 在市场买了什么？", "az": "糖、橘子、盐、咖啡和辣椒。"}, {"q": "Bagaimana tekstur bakso?", "a": "Kenyal dan berserat.", "qa": "b865e1afb333", "aa": "45eea4f50967", "qz": "肉丸的口感怎么样？", "az": "弹牙有嚼劲。"}]}, {"id": "t67", "kind": "text", "book": "BIPA 1", "title": "我的周末（音频 7.3）", "lines": [{"sp": "", "role": "r", "id": "Hai, saya Sarah.", "zh": "嗨，我是 Sarah。", "a": "7499f1c1620a"}, {"sp": "", "role": "r", "id": "Saya sangat suka berenang.", "zh": "我非常喜欢游泳。", "a": "cce3f7f2e6da"}, {"sp": "", "role": "r", "id": "Saya biasanya berenang di akhir pekan.", "zh": "我通常周末去游泳。", "a": "86743ce34b84"}, {"sp": "", "role": "r", "id": "Kadang-kadang selain berenang, saya joging.", "zh": "有时候除了游泳，我还会慢跑。", "a": "5891e90464fc"}, {"sp": "", "role": "r", "id": "Namun, saya kurang suka joging.", "zh": "不过，我不太喜欢慢跑。", "a": "bc10f1692648"}, {"sp": "", "role": "r", "id": "Selain joging, saya kadang-kadang bermain badminton.", "zh": "除了慢跑，我有时候也打羽毛球。", "a": "3eb549541c14"}, {"sp": "", "role": "r", "id": "Saya suka bermain badminton.", "zh": "我喜欢打羽毛球。", "a": "544ed83ebb75"}, {"sp": "", "role": "r", "id": "Namun, bermain badminton tidak bisa sendiri.", "zh": "不过，羽毛球没法一个人打。", "a": "c65d2891bd32"}, {"sp": "", "role": "r", "id": "Pokoknya saya sangat suka berolahraga.", "zh": "总之我非常喜欢运动。", "a": "ad4335caebed"}, {"sp": "", "role": "r", "id": "Saya tidak suka tidur atau diam di rumah pada akhir pekan.", "zh": "我不喜欢周末在家睡觉或者待着不动。", "a": "ab22f81769c2"}, {"sp": "", "role": "r", "id": "Saya juga sangat suka memasak di akhir pekan.", "zh": "我周末也很喜欢做饭。", "a": "c9a01dfa6e5e"}, {"sp": "", "role": "r", "id": "Saya senang mencoba resep baru.", "zh": "我喜欢尝试新菜谱。", "a": "6f893eefc38d"}, {"sp": "", "role": "r", "id": "Selain memasak, kadang-kadang saya pergi ke mal dengan teman.", "zh": "除了做饭，有时候我和朋友去商场。", "a": "c7f8e1653745"}, {"sp": "", "role": "r", "id": "Kami ke mal untuk berjalan-jalan atau menonton film di bioskop.", "zh": "我们去商场逛逛或者在电影院看电影。", "a": "b1f35cf2414e"}, {"sp": "", "role": "r", "id": "Namun, saya lebih suka berolahraga dan memasak.", "zh": "不过，我更喜欢运动和做饭。", "a": "e645c0c7654a"}], "zh": "嗨，我是 Sarah。我非常喜欢游泳，通常周末去游泳。除了游泳，有时我也慢跑，不过我不太喜欢慢跑。除了慢跑，我有时打羽毛球，我喜欢打羽毛球，但羽毛球一个人打不了。总之我非常喜欢运动，周末不喜欢睡觉或待在家里。周末我也很喜欢做饭，喜欢尝试新菜谱。除了做饭，有时我和朋友去商场逛逛或去电影院看电影。不过，我还是更喜欢运动和做饭。", "note": "", "qa": [{"q": "Kegiatan apa yang sangat disukai Sarah?", "a": "Berenang, berolahraga, dan memasak.", "qa": "763d9a5e9979", "aa": "55d349f7f244", "qz": "Sarah 非常喜欢什么活动？", "az": "游泳、运动和做饭。"}, {"q": "Kegiatan apa yang disukai Sarah?", "a": "Bermain badminton.", "qa": "3129ac18de9f", "aa": "5e488b8f86ea", "qz": "Sarah 喜欢什么活动？", "az": "打羽毛球。"}, {"q": "Kegiatan apa yang kurang disukai Sarah?", "a": "Joging.", "qa": "0fe1685a3046", "aa": "7f0b27f8aaa5", "qz": "Sarah 不太喜欢什么活动？", "az": "慢跑。"}, {"q": "Kegiatan apa yang tidak disukai Sarah?", "a": "Tidur atau diam di rumah pada akhir pekan.", "qa": "79dccdedb1fd", "aa": "fc1914c68141", "qz": "Sarah 不喜欢什么活动？", "az": "周末在家睡觉或者待着不动。"}, {"q": "Kegiatan apa yang lebih disukai Sarah?", "a": "Berolahraga dan memasak.", "qa": "44c16e679091", "aa": "b491f0e23a5b", "qz": "Sarah 更喜欢什么活动？", "az": "运动和做饭。"}]}, {"id": "t68", "kind": "text", "book": "BIPA 1", "title": "我的爱好（课文 7）", "lines": [{"sp": "", "role": "r", "id": "Hobi saya memasak.", "zh": "我的爱好是做饭。", "a": "be52d6da38b3"}, {"sp": "", "role": "r", "id": "Saya sangat suka memasak aneka hidangan.", "zh": "我非常喜欢做各种各样的菜。", "a": "b3f9456ba0d9"}, {"sp": "", "role": "r", "id": "Setiap hari saya menghabiskan banyak waktu di dapur.", "zh": "我每天花很多时间待在厨房里。", "a": "3cc60ff37149"}, {"sp": "", "role": "r", "id": "Masakan kesukaan saya adalah rendang.", "zh": "我最喜欢的菜是仁当。", "a": "57a025a5fdca"}, {"sp": "", "role": "r", "id": "Saya juga suka memasak gorengan dan panggangan.", "zh": "我也喜欢做油炸和烧烤类的菜。", "a": "2e0274179c18"}, {"sp": "", "role": "r", "id": "Selain hobi masak, saya juga hobi mengoleksi peralatan masak.", "zh": "除了做饭，我还喜欢收集厨具。", "a": "793eca899fd5"}, {"sp": "", "role": "r", "id": "Saya senang jika peralatan masak saya lengkap.", "zh": "我的厨具齐全的话我就很开心。", "a": "0ac741ad8115"}, {"sp": "", "role": "r", "id": "Saya punya kompor, wajan, dan panci.", "zh": "我有炉子、炒锅和汤锅。", "a": "26ca21199549"}, {"sp": "", "role": "r", "id": "Saya juga punya spatula, pisau, dan talenan.", "zh": "我还有锅铲、刀和砧板。", "a": "174b716df46d"}, {"sp": "", "role": "r", "id": "Jadi, saya bisa masak apa saja dengan alat lengkap.", "zh": "所以，工具齐全，我什么都能做。", "a": "dfbdafe5828b"}], "zh": "我的爱好是做饭，我非常喜欢做各种菜，每天都在厨房待很久。我最爱的菜是仁当，也喜欢做油炸和烤制的食物。除了做饭，我还喜欢收集厨具，厨具齐全我就很开心。我有炉灶、炒锅和汤锅，还有锅铲、刀和切菜板。所以，有了齐全的工具，我什么菜都能做。", "note": "", "qa": [{"q": "Apa kegemaran Septi?", "a": "Memasak dan mengoleksi peralatan masak.", "qa": "14227b4db42e", "aa": "8fe99d2da06e", "qz": "Septi 的爱好是什么？", "az": "做饭和收集厨具。"}, {"q": "Septi sangat suka memasak apa?", "a": "Rendang.", "qa": "810117e2c141", "aa": "da6066d061a6", "qz": "Septi 特别喜欢做什么菜？", "az": "仁当。"}, {"q": "Apa saja perlengkapan memasaknya?", "a": "Kompor, wajan, panci, spatula, pisau, dan talenan.", "qa": "160692ea0367", "aa": "ed99c160530d", "qz": "她的厨具有哪些？", "az": "炉子、炒锅、汤锅、锅铲、刀和砧板。"}, {"q": "Mengapa peralatan memasaknya lengkap?", "a": "Supaya dia bisa masak apa saja.", "qa": "afcfc8748d75", "aa": "0ac02d4269a4", "qz": "为什么她的厨具这么齐全？", "az": "这样她什么都能做。"}]}, {"id": "t69", "kind": "text", "book": "BIPA 1", "title": "我的新朋友 Sarah（音频 8.1）", "lines": [{"sp": "", "role": "r", "id": "Saya punya teman baru.", "zh": "我有一个新朋友。", "a": "f8f60be05097"}, {"sp": "", "role": "r", "id": "Namanya Sarah.", "zh": "她叫 Sarah。", "a": "e7e530778d89"}, {"sp": "", "role": "r", "id": "Sarah berasal dari Inggris.", "zh": "Sarah 来自英国。", "a": "b6a5b9e7a1fe"}, {"sp": "", "role": "r", "id": "Dia baik, ramah, dan suka menolong.", "zh": "她人很好，很友善，也乐于助人。", "a": "757ad3eacb56"}, {"sp": "", "role": "r", "id": "Dia selalu menyapa kami.", "zh": "她总是跟我们打招呼。", "a": "24bfb375d4eb"}, {"sp": "", "role": "r", "id": "Di kelas dia juga suka membantu temannya belajar.", "zh": "在课堂上她也喜欢帮同学学习。", "a": "68f6331eb390"}, {"sp": "", "role": "r", "id": "Namun, Sarah agak cerewet.", "zh": "不过，Sarah 有点唠叨。", "a": "d6548fe40e13"}, {"sp": "", "role": "r", "id": "Di pesta ulang tahunnya Sarah menelepon semua orang agar datang tepat waktu.", "zh": "在她的生日派对上，Sarah 给每个人打电话，让大家准时到。", "a": "9b80cc1c8a68"}, {"sp": "", "role": "r", "id": "Dia juga perfeksionis.", "zh": "她还是个完美主义者。", "a": "8e32f22ddd32"}, {"sp": "", "role": "r", "id": "Dia mengatur sendiri dekorasi, makanan, dan minuman.", "zh": "她亲自安排装饰、食物和饮料。", "a": "47f5a3137c56"}, {"sp": "", "role": "r", "id": "Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "她希望派对完美，一点差错都没有。", "a": "25fb6b989a7c"}], "zh": "我有一个新朋友，叫 Sarah，来自英国。她人很好，友善又乐于助人，总是主动跟我们打招呼，在课堂上也喜欢帮同学学习。不过 Sarah 有点爱操心：她的生日派对，她给每个人打电话让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排，希望活动完美、不出任何差错。", "note": "", "qa": [{"q": "Sarah berasal dari mana?", "a": "Dari Inggris.", "qa": "df1210a9937d", "aa": "5f58e3c933a8", "qz": "Sarah 来自哪里？", "az": "来自英国。"}, {"q": "Bagaimana sifat Sarah?", "a": "Baik, ramah, suka menolong, agak cerewet, dan perfeksionis.", "qa": "794b03353972", "aa": "6e1e979ecefd", "qz": "Sarah 的性格怎么样？", "az": "善良、友好、乐于助人，有点唠叨，还是个完美主义者。"}]}, {"id": "t70", "kind": "text", "book": "BIPA 1", "title": "Beni 和 Toni（音频 8.2）", "lines": [{"sp": "", "role": "r", "id": "Beni adalah temanku.", "zh": "Beni 是我的朋友。", "a": "59913a1f54d0"}, {"sp": "", "role": "r", "id": "Dia sangat pendiam.", "zh": "他非常安静。", "a": "3d21b8fb4e4e"}, {"sp": "", "role": "r", "id": "Dia suka menyendiri di kantor.", "zh": "他在办公室喜欢独处。", "a": "8d1882829232"}, {"sp": "", "role": "r", "id": "Dia jarang menyapa orang lain.", "zh": "他很少跟别人打招呼。", "a": "e423dbc9acd1"}, {"sp": "", "role": "r", "id": "Dia juga jarang berkumpul dengan teman-teman lain.", "zh": "他也很少和其他朋友聚在一起。", "a": "ff1295162c0a"}, {"sp": "", "role": "r", "id": "Dia punya teman dekat.", "zh": "他有一个好朋友。", "a": "1c58311ac4de"}, {"sp": "", "role": "r", "id": "Namanya Toni.", "zh": "他叫 Toni。", "a": "e1f97964bbc9"}, {"sp": "", "role": "r", "id": "Toni berbeda dengan Beni.", "zh": "Toni 和 Beni 不一样。", "a": "3a2835042e17"}, {"sp": "", "role": "r", "id": "Toni sangat periang.", "zh": "Toni 非常开朗。", "a": "f09f2ee207ca"}, {"sp": "", "role": "r", "id": "Toni selalu ramah kepada siapa pun.", "zh": "Toni 对谁都很友善。", "a": "458b17fee935"}, {"sp": "", "role": "r", "id": "Toni sangat sabar menghadapi Beni.", "zh": "Toni 对 Beni 很有耐心。", "a": "19cc15711699"}, {"sp": "", "role": "r", "id": "Namun, Toni agak pemarah.", "zh": "不过，Toni 脾气有点急。", "a": "1dba0eed9d27"}, {"sp": "", "role": "r", "id": "Dia sangat perfeksionis.", "zh": "他是个完美主义者。", "a": "156c64f8b207"}, {"sp": "", "role": "r", "id": "Dia akan marah melihat orang malas.", "zh": "他看到别人偷懒就会生气。", "a": "a51e484ce082"}], "zh": "Beni 是我的朋友。他非常沉默，在办公室喜欢独处，很少跟别人打招呼，也很少和其他朋友聚在一起。他有一个好朋友叫 Toni。Toni 和 Beni 不一样，Toni 很开朗，对谁都很友好，对 Beni 也很有耐心。不过 Toni 有点爱发火，他是个完美主义者，看到别人偷懒就会生气。", "note": "", "qa": [{"q": "Bagaimana sifat Beni?", "a": "Sangat pendiam dan suka menyendiri.", "qa": "541a105b673d", "aa": "2af365e3648d", "qz": "Beni 的性格怎么样？", "az": "非常安静，喜欢独处。"}, {"q": "Apa contoh sifat buruk Beni?", "a": "Jarang menyapa orang lain dan jarang berkumpul dengan teman.", "qa": "74d1a5486b74", "aa": "870b02bcce78", "qz": "Beni 有什么缺点？", "az": "很少跟别人打招呼，也很少和朋友聚。"}, {"q": "Bagaimana sifat Toni?", "a": "Periang, ramah, sabar, tetapi agak pemarah dan perfeksionis.", "qa": "59a2d79a0bf7", "aa": "c3da5ecefc39", "qz": "Toni 的性格怎么样？", "az": "开朗、友善、有耐心，但脾气有点急，是个完美主义者。"}, {"q": "Apa contoh sifat baik Toni?", "a": "Selalu ramah kepada siapa pun dan sabar menghadapi Beni.", "qa": "e8511e3e2f4f", "aa": "eb8e76cdafa2", "qz": "Toni 有什么优点？", "az": "对谁都很友善，对 Beni 很有耐心。"}, {"q": "Kira-kira di mana mereka saling mengenal?", "a": "Di kantor.", "qa": "ee8a21c3887a", "aa": "abe3099bb3fd", "qz": "他们大概是在哪里认识的？", "az": "在办公室。"}]}, {"id": "t71", "kind": "text", "book": "BIPA 1", "title": "Fauzi 的性格（课文 8.1）", "lines": [{"sp": "", "role": "r", "id": "Fauzi adalah orang yang teratur.", "zh": "Fauzi 是个做事有条理的人。", "a": "03e9da21649e"}, {"sp": "", "role": "r", "id": "Dia tidak pintar, tetapi tekun.", "zh": "他不聪明，但很勤奋。", "a": "3b9de7ef70a6"}, {"sp": "", "role": "r", "id": "Dia bukan pemalas.", "zh": "他不是懒人。", "a": "0418c81b7158"}, {"sp": "", "role": "r", "id": "Dia juga rajin merapikan lemari pakaiannya.", "zh": "他还经常整理自己的衣柜。", "a": "7cf26ef2c2d5"}, {"sp": "", "role": "r", "id": "Dia tidak tidur jika tugas belum selesai.", "zh": "任务没做完他就不睡觉。", "a": "1f60f46174a9"}, {"sp": "", "role": "r", "id": "Semua orang tahu hal itu.", "zh": "大家都知道这一点。", "a": "aabc5fc526ed"}, {"sp": "", "role": "r", "id": "Di kantor dia sangat rajin.", "zh": "在办公室他非常勤快。", "a": "30ca62a16e89"}, {"sp": "", "role": "r", "id": "Setiap bekerja bersama Fauzi, ia akan mengerjakan semua pekerjaan sendirian.", "zh": "每次和 Fauzi 一起工作，他都会一个人把所有活儿干完。", "a": "e4dee6242102"}, {"sp": "", "role": "r", "id": "Namun, ia bermaksud baik.", "zh": "不过，他是出于好意。", "a": "2c6f77823ce2"}, {"sp": "", "role": "r", "id": "Dia ingin membantu temannya.", "zh": "他想帮朋友。", "a": "2fda9664cd9a"}, {"sp": "", "role": "r", "id": "Rekan kantornya senang berteman dengan Fauzi.", "zh": "同事们都喜欢和 Fauzi 交朋友。", "a": "e1300c1db2af"}], "zh": "Fauzi 是个有条理的人。他不聪明，但很勤勉，他不是懒人。他也经常整理自己的衣柜。作业没做完他就不睡觉。大家都知道这一点。在办公室他非常勤奋，每次和 Fauzi 一起工作，他都会一个人把所有活儿干完。不过他是出于好意，他想帮助朋友。办公室的同事都很乐意和 Fauzi 交朋友。", "note": "", "qa": []}, {"id": "t72", "kind": "text", "book": "BIPA 1", "title": "我的同事们（课文 8.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Yoyo.", "zh": "嗨，我叫 Yoyo。", "a": "4f2eba8aa2c8"}, {"sp": "", "role": "r", "id": "Saya sedang berada di kantor.", "zh": "我现在在办公室。", "a": "f1d226c8e853"}, {"sp": "", "role": "r", "id": "Saat ini di kantor ada Datil, Doni, Didik, dan Fadil.", "zh": "现在办公室里有 Datil、Doni、Didik 和 Fadil。", "a": "e658894f5506"}, {"sp": "", "role": "r", "id": "Datil baik hati dan tenang.", "zh": "Datil 心地善良，性格沉稳。", "a": "8aa96ffe8ba0"}, {"sp": "", "role": "r", "id": "Doni rajin dan cekatan.", "zh": "Doni 勤快又麻利。", "a": "8d6ff1ab7c91"}, {"sp": "", "role": "r", "id": "Didik pendiam, tetapi ramah.", "zh": "Didik 话不多，但很友善。", "a": "eca220fca42f"}, {"sp": "", "role": "r", "id": "Fadil periang dan lucu.", "zh": "Fadil 开朗又风趣。", "a": "1c12f9994da7"}, {"sp": "", "role": "r", "id": "Beberapa teman lain tidak ada di kantor.", "zh": "其他几个同事不在办公室。", "a": "11f0acdb8ded"}, {"sp": "", "role": "r", "id": "Sebenarnya, ada Laras, Ayu, Putri, dan Roslia.", "zh": "其实还有 Laras、Ayu、Putri 和 Roslia。", "a": "6de804521489"}, {"sp": "", "role": "r", "id": "Laras cerdas dan perfeksionis.", "zh": "Laras 聪明，是个完美主义者。", "a": "3f879e5455b0"}, {"sp": "", "role": "r", "id": "Ayu sabar dan pintar.", "zh": "Ayu 有耐心又聪明。", "a": "ab4b10b660d6"}, {"sp": "", "role": "r", "id": "Putri perhatian dan cekatan.", "zh": "Putri 体贴又麻利。", "a": "7c3f9f4b0a05"}, {"sp": "", "role": "r", "id": "Roslia tekun dan tegas.", "zh": "Roslia 勤奋又果断。", "a": "67b965d6897b"}], "zh": "嗨，我叫 Yoyo，我现在在办公室。现在办公室里有 Datil、Doni、Didik 和 Fadil。Datil 心地好又沉稳，Doni 勤奋又麻利，Didik 话少但友好，Fadil 开朗又风趣。还有几位同事不在办公室，她们是 Laras、Ayu、Putri 和 Roslia。Laras 聪明，是完美主义者；Ayu 耐心又聪明；Putri 体贴又麻利；Roslia 勤勉又果断。", "note": "", "qa": [{"q": "Apa ide utama paragraf 1?", "a": "Teman-teman Yoyo yang ada di kantor dan sifat mereka.", "qa": "57cdcb3d085d", "aa": "6ab95b69e33b", "qz": "第一段的主要内容是什么？", "az": "Yoyo 在办公室的同事和他们的性格。"}, {"q": "Apa ide utama paragraf 2?", "a": "Teman-teman Yoyo yang tidak ada di kantor dan sifat mereka.", "qa": "26f4ec97759c", "aa": "38a26cfe6d64", "qz": "第二段的主要内容是什么？", "az": "Yoyo 不在办公室的同事和他们的性格。"}, {"q": "Ada berapa orang teman Yoyo di kantor?", "a": "Ada empat orang: Datil, Doni, Didik, dan Fadil.", "qa": "52b11c108b2a", "aa": "9eac4764b5a2", "qz": "Yoyo 在办公室的同事有几个？", "az": "四个：Datil、Doni、Didik 和 Fadil。"}, {"q": "Bagaimana sifat Laras dan Roslia?", "a": "Laras cerdas dan perfeksionis; Roslia tekun dan tegas.", "qa": "61f0fcbcbdae", "aa": "6c75da5cd31d", "qz": "Laras 和 Roslia 的性格怎么样？", "az": "Laras 聪明、完美主义；Roslia 勤奋、果断。"}, {"q": "Bagaimana sifat Fadil dan Didik?", "a": "Fadil periang dan lucu; Didik pendiam tetapi ramah.", "qa": "af546e8bced1", "aa": "e5ac226d619a", "qz": "Fadil 和 Didik 的性格怎么样？", "az": "Fadil 开朗风趣；Didik 话不多但很友善。"}]}, {"id": "t73", "kind": "text", "book": "BIPA 1", "title": "Santi 的卧室（音频 9.1）", "lines": [{"sp": "", "role": "r", "id": "Ini gambar kamar tidur saya.", "zh": "这是我卧室的图。", "a": "ac73c582ebe5"}, {"sp": "", "role": "r", "id": "Di kamar saya ada banyak benda.", "zh": "我的房间里有很多东西。", "a": "3747fcb6654f"}, {"sp": "", "role": "r", "id": "Di samping pintu kamar ada lampu.", "zh": "房门旁边有一盏灯。", "a": "50688b5c85e9"}, {"sp": "", "role": "r", "id": "Di dekat lampu ada televisi.", "zh": "灯旁边有一台电视。", "a": "c1bac7b3c494"}, {"sp": "", "role": "r", "id": "Di seberang televisi ada tempat tidur.", "zh": "电视对面是床。", "a": "8c3f3a7051cb"}, {"sp": "", "role": "r", "id": "Tempat tidur saya berada di tengah kamar.", "zh": "我的床在房间中间。", "a": "0d9f1d6183d7"}, {"sp": "", "role": "r", "id": "Karpet ada di antara kasur dan televisi.", "zh": "地毯在床和电视之间。", "a": "abd816c10105"}, {"sp": "", "role": "r", "id": "Lemari ada di pojok kamar.", "zh": "衣柜在房间角落。", "a": "02f7d8887e7f"}, {"sp": "", "role": "r", "id": "Di dalam lemari ada baju saya.", "zh": "衣柜里有我的衣服。", "a": "d29d6a44b8d6"}, {"sp": "", "role": "r", "id": "Di samping kanan dan kiri tempat tidur saya ada meja kecil.", "zh": "我的床左右两边各有一张小桌子。", "a": "e493439d8ac7"}, {"sp": "", "role": "r", "id": "Radio ada di atas meja kecil.", "zh": "收音机在小桌子上。", "a": "b9dfe9af5234"}, {"sp": "", "role": "r", "id": "Ada sofa kecil di bawah AC.", "zh": "空调下面有一张小沙发。", "a": "cc6b83000893"}], "zh": "这是我卧室的图。我的房间里有很多东西。房门旁边有一盏灯，灯旁边有一台电视，电视对面是床。我的床在房间中央。地毯在床和电视之间。衣柜在房间的角落，衣柜里是我的衣服。床的左右两边各有一张小桌子，收音机放在小桌子上。空调下面有一张小沙发。", "note": "", "qa": [{"q": "Di mana letak lemari?", "a": "Di pojok kamar.", "qa": "09d26c66918f", "aa": "97581e45e68a", "qz": "衣柜在哪里？", "az": "在房间角落。"}, {"q": "Ada benda apa di sebelah kiri dan kanan tempat tidur?", "a": "Meja kecil.", "qa": "56ed1f3519e0", "aa": "171db4b0d240", "qz": "床的左右两边有什么？", "az": "小桌子。"}, {"q": "Ada benda apa di atas meja kecil?", "a": "Radio.", "qa": "6f262e220d47", "aa": "df2b38d528de", "qz": "小桌子上有什么？", "az": "收音机。"}, {"q": "Di mana letak karpet?", "a": "Di antara kasur dan televisi.", "qa": "f6cdde24b421", "aa": "1f7bbca0072e", "qz": "地毯在哪里？", "az": "在床和电视之间。"}, {"q": "Lampu ada di sebelah mana?", "a": "Di samping pintu kamar.", "qa": "e5ac08bfec05", "aa": "16e6104772aa", "qz": "灯在哪边？", "az": "在房门旁边。"}]}, {"id": "t74", "kind": "text", "book": "BIPA 1", "title": "去参加婚礼（音频 9.2）", "lines": [{"sp": "", "role": "r", "id": "Teman saya, Wina, menikah hari Sabtu lalu.", "zh": "我的朋友 Wina 上星期六结婚了。", "a": "27e1db50fd05"}, {"sp": "", "role": "r", "id": "Saya pergi ke gedung pernikahannya.", "zh": "我去了她的婚礼礼堂。", "a": "dfdf34bdc17a"}, {"sp": "", "role": "r", "id": "Saya berangkat dari Gerung.", "zh": "我从 Gerung 出发。", "a": "19757e38d2bc"}, {"sp": "", "role": "r", "id": "Dari Gerung saya ke Barat sampai bertemu pertigaan.", "zh": "从 Gerung 我往西走，一直走到三岔路口。", "a": "4968951112f4"}, {"sp": "", "role": "r", "id": "Di ujung pertigaan ada Balai Desa Sekotong.", "zh": "三岔路口尽头是 Sekotong 村公所。", "a": "255e18ffc804"}, {"sp": "", "role": "r", "id": "Dari Balai Desa Sekotong, saya ke arah Selatan.", "zh": "从 Sekotong 村公所，我往南走。", "a": "d5125f05fc67"}, {"sp": "", "role": "r", "id": "Saya melewati SD Sekotong II di kanan jalan.", "zh": "我经过路右边的 Sekotong 第二小学。", "a": "496419ea486b"}, {"sp": "", "role": "r", "id": "Saya belok kanan masuk ke gang yang ada di antara SD Sekotong II dan sawah.", "zh": "我右转进了 Sekotong 第二小学和稻田之间的小巷。", "a": "42d53e020471"}, {"sp": "", "role": "r", "id": "Di pertigaan kedua saya belok kanan.", "zh": "在第二个三岔路口我右转。", "a": "777c0265ea1c"}, {"sp": "", "role": "r", "id": "Gedung pernikahan tepat berada di ujung jalan, menghadap ke Selatan.", "zh": "婚礼礼堂就在路的尽头，朝南。", "a": "06e8f973575d"}], "zh": "我的朋友 Wina 上周六结婚了，我去了她的婚礼礼堂。我从 Gerung 出发，往西走到一个三岔路口，路口尽头是 Sekotong 村委会。从村委会我往南走，经过路右边的 Sekotong 第二小学。我右转进入 Sekotong 第二小学和稻田之间的小巷，在第二个三岔路口再右转。婚礼礼堂就在路的尽头，朝南。", "note": "", "qa": []}, {"id": "t75", "kind": "text", "book": "BIPA 1", "title": "楠榜游记（课文 9.1）", "lines": [{"sp": "", "role": "r", "id": "Pada akhir tahun lalu saya berkunjung ke Lampung.", "zh": "去年年底我去了楠榜。", "a": "cdb7250dbf01"}, {"sp": "", "role": "r", "id": "Kami berjalan-jalan ke beberapa tempat di Lampung.", "zh": "我们在楠榜逛了几个地方。", "a": "15957e34c0a7"}, {"sp": "", "role": "r", "id": "Di sana ada mal, universitas, dan tempat makan.", "zh": "那里有商场、大学和餐馆。", "a": "393b01044fcf"}, {"sp": "", "role": "r", "id": "Kami memulai perjalanan dari pompa bensin.", "zh": "我们从加油站出发。", "a": "bfce17147ede"}, {"sp": "", "role": "r", "id": "Di sebelah kiri pompa bensin ada sebuah universitas.", "zh": "加油站左边有一所大学。", "a": "868d540641fe"}, {"sp": "", "role": "r", "id": "Kampusnya besar sekali.", "zh": "校园非常大。", "a": "2018ee1f0a9a"}, {"sp": "", "role": "r", "id": "Di seberang pompa bensin ada beberapa universitas lain.", "zh": "加油站对面还有几所大学。", "a": "07f75ba6b402"}, {"sp": "", "role": "r", "id": "Ada IBI Darmajaya, Universitas Bandar Lampung, dan IAIN Lampung.", "zh": "有 IBI Darmajaya、楠榜大学和楠榜国立伊斯兰学院。", "a": "9ea370d4c4f4"}, {"sp": "", "role": "r", "id": "Setelah mengisi bensin, saya dan keluarga pergi makan di Restoran Padang.", "zh": "加完油后，我和家人去巴东餐馆吃饭。", "a": "31902fbf903f"}, {"sp": "", "role": "r", "id": "Restoran itu ada di antara Warung Gudeg Jogja dan Warung Penyet Idola.", "zh": "那家餐馆在日惹 Gudeg 小店和 Idola Penyet 小店之间。", "a": "dba0f5641948"}, {"sp": "", "role": "r", "id": "Di seberang restoran ada toko kelontong.", "zh": "餐馆对面有一家杂货店。", "a": "81a9852d5f84"}, {"sp": "", "role": "r", "id": "Selesai makan, kami pergi ke mal.", "zh": "吃完饭，我们去了商场。", "a": "f43c8627c137"}, {"sp": "", "role": "r", "id": "Mal itu terletak di persimpangan jalan ke arah Way Halim.", "zh": "那家商场位于去 Way Halim 方向的十字路口。", "a": "529a0f1b6110"}, {"sp": "", "role": "r", "id": "Dari mal kami pergi ke rumah saudara.", "zh": "从商场出来，我们去了亲戚家。", "a": "eda6acaa90a4"}, {"sp": "", "role": "r", "id": "Rumahnya ada di belakang Warung Gudeg Jogja.", "zh": "他家在日惹 Gudeg 小店后面。", "a": "c8685f327df6"}], "zh": "去年年底我去了楠榜，我们在楠榜逛了几个地方，那里有商场、大学和餐馆。我们从加油站出发。加油站左边有一所大学，校园非常大；加油站对面还有几所大学：IBI Darmajaya、楠榜港大学和楠榜国立伊斯兰学院。加完油后，我和家人去巴东餐馆吃饭，那家餐馆在日惹菠萝蜜炖菜馆和 Idola 压扁炸鸡馆之间，餐馆对面有一家杂货店。吃完饭我们去了商场，商场位于通往 Way Halim 方向的路口。离开商场后我们去了亲戚家，他们家在日惹菠萝蜜炖菜馆后面。", "note": "", "qa": [{"q": "Apa topik Teks 9.1?", "a": "Jalan-jalan di Bandar Lampung.", "qa": "edd4463334e5", "aa": "9983b02633fa", "qz": "课文 9.1 的主题是什么？", "az": "在楠榜市游玩。"}, {"q": "Ada tempat apa saja di Kota Bandar Lampung?", "a": "Mal, universitas, dan tempat makan.", "qa": "be94e534312b", "aa": "f091bd5b1ec5", "qz": "楠榜市有哪些地方？", "az": "商场、大学和餐馆。"}, {"q": "Di mana letak universitas yang besar?", "a": "Di sebelah kiri pompa bensin.", "qa": "0647a48dc829", "aa": "dd0706976150", "qz": "那所大大学在哪里？", "az": "在加油站左边。"}, {"q": "Restoran Padang berada di antara apa?", "a": "Di antara Warung Gudeg Jogja dan Warung Penyet Idola.", "qa": "946b89910ece", "aa": "6d7bdf777f2f", "qz": "巴东餐馆在哪两个地方之间？", "az": "在日惹 Gudeg 小店和 Idola Penyet 小店之间。"}]}, {"id": "t76", "kind": "text", "book": "BIPA 1", "title": "Sari 的新教室（课文 9.2）", "lines": [{"sp": "", "role": "r", "id": "Hai, nama saya Sari.", "zh": "嗨，我叫 Sari。", "a": "e373352c6383"}, {"sp": "", "role": "r", "id": "Hari ini saya masuk kelas baru.", "zh": "今天我进了新班级。", "a": "b076de40d1a6"}, {"sp": "", "role": "r", "id": "Ada papan tulis besar di dalam kelas.", "zh": "教室里有一块大黑板。", "a": "54312b5aa970"}, {"sp": "", "role": "r", "id": "Spidol dan penghapus ada di bawah papan tulis.", "zh": "记号笔和板擦在黑板下面。", "a": "5357510bdb09"}, {"sp": "", "role": "r", "id": "Di sebelah kiri papan tulis ada lemari.", "zh": "黑板左边有一个柜子。", "a": "40860f74f86a"}, {"sp": "", "role": "r", "id": "Di dalam lemari ada banyak buku.", "zh": "柜子里有很多书。", "a": "018bf2512df4"}, {"sp": "", "role": "r", "id": "Meja dan kursi Bu Sinta ada di depan lemari.", "zh": "Sinta 老师的桌椅在柜子前面。", "a": "d538f92d3853"}, {"sp": "", "role": "r", "id": "Di seberang meja Bu Sinta ada meja dan kursi saya.", "zh": "Sinta 老师的桌子对面是我的桌椅。", "a": "c001bcfdb455"}, {"sp": "", "role": "r", "id": "Tempat duduk saya berhadapan dengan tempat duduk Bu Sinta.", "zh": "我的座位和 Sinta 老师的座位面对面。", "a": "d763dd848c15"}, {"sp": "", "role": "r", "id": "Di sebelah kanan saya ada banyak bangku dan meja.", "zh": "我右边有很多凳子和桌子。", "a": "7926e3e6cd60"}, {"sp": "", "role": "r", "id": "Pintu ada di sisi kanan ruang kelas.", "zh": "门在教室右侧。", "a": "58b3c21de13d"}, {"sp": "", "role": "r", "id": "Peta ada di antara gambar pahlawan dan jam dinding.", "zh": "地图在英雄画像和挂钟之间。", "a": "d9a41b71d1f1"}, {"sp": "", "role": "r", "id": "Siswa di sebelahku bernama Anton.", "zh": "坐在我旁边的同学叫 Anton。", "a": "0468b69d6e7c"}, {"sp": "", "role": "r", "id": "Di belakang Anton ada Novi dan Putri.", "zh": "Anton 后面是 Novi 和 Putri。", "a": "d7167f3c3b77"}], "zh": "大家好，我叫 Sari，今天我进了新班级。教室里有一块大黑板，马克笔和板擦在黑板下面。黑板左边有一个柜子，柜子里有很多书。Sinta 老师的桌椅在柜子前面，老师桌子对面是我的桌椅，我的座位正对着老师的座位。我右边有很多长凳和桌子。门在教室右侧。地图挂在英雄像和挂钟之间。坐我旁边的同学叫 Anton，Anton 后面是 Novi 和 Putri。", "note": "", "qa": []}, {"id": "t77", "kind": "text", "book": "BIPA 1", "title": "Mila 的家（音频 10.1）", "lines": [{"sp": "", "role": "r", "id": "Rumah Mila sangat bagus.", "zh": "Mila 的家非常漂亮。", "a": "f2153c7e8b60"}, {"sp": "", "role": "r", "id": "Ukurannya tidak terlalu besar.", "zh": "房子不算太大。", "a": "f76bc2da7deb"}, {"sp": "", "role": "r", "id": "Di depan rumah ada tempat parkir mobil.", "zh": "房子前面有停车位。", "a": "481fec63f1b8"}, {"sp": "", "role": "r", "id": "Rumahnya bercat hijau dan putih.", "zh": "房子刷成绿色和白色。", "a": "3e1f2b26cbdc"}, {"sp": "", "role": "r", "id": "Genting rumahnya berwarna abu-abu.", "zh": "屋顶的瓦是灰色的。", "a": "446e6ed3a6a3"}, {"sp": "", "role": "r", "id": "Rumahnya ber-AC.", "zh": "房子里有空调。", "a": "ce175d696cb8"}, {"sp": "", "role": "r", "id": "Di depan rumah ada lahan untuk menanam tanaman.", "zh": "房子前面有一块种植物的空地。", "a": "bef589458ae8"}, {"sp": "", "role": "r", "id": "Pintunya berwarna cokelat tua.", "zh": "门是深棕色的。", "a": "d59da16e6183"}], "zh": "Mila 的家很漂亮，不算太大。房子前面有停车位，房子刷成绿白两色，屋顶瓦片是灰色的，屋里有空调。房子前面有一块种植物的空地，门是深棕色的。", "note": "背景：Meli 去了 Mila 在勿加泗（Bekasi）的家，然后讲给朋友 Ben 听。", "qa": []}, {"id": "t78", "kind": "text", "book": "BIPA 1", "title": "Meli 要带的东西（音频 10.2）", "lines": [{"sp": "", "role": "r", "id": "Besok saya akan merantau ke Jakarta untuk bekerja.", "zh": "明天我要去雅加达外出打工。", "a": "8f044bb06b6a"}, {"sp": "", "role": "r", "id": "Saya akan membawa banyak barang.", "zh": "我要带很多东西。", "a": "b342f4f9fcc9"}, {"sp": "", "role": "r", "id": "Namun, beberapa barang tidak saya bawa.", "zh": "不过，有些东西我不带。", "a": "9444d8746dc5"}, {"sp": "", "role": "r", "id": "Saya akan membawa sepatu pantofel hitam, kaus kaki cokelat, rok berwarna hitam, dan kemeja putih.", "zh": "我要带黑色皮鞋、棕色袜子、黑色裙子和白衬衫。", "a": "7b06d2d0fedf"}, {"sp": "", "role": "r", "id": "Saya juga perlu membawa blazer ungu dan jaket merah.", "zh": "我还需要带紫色西装外套和红色夹克。", "a": "9c7620e13792"}, {"sp": "", "role": "r", "id": "Saya juga membawa jam tangan berwarna biru dan gelang berwarna merah.", "zh": "我还带一块蓝色手表和一条红色手链。", "a": "fa70e980e750"}, {"sp": "", "role": "r", "id": "Saya tidak membawa topi, baju olahraga, celana panjang, dan syal.", "zh": "我不带帽子、运动服、长裤和围巾。", "a": "0ca3335e51e4"}, {"sp": "", "role": "r", "id": "Saya juga tidak membawa boneka kesayangan saya.", "zh": "我也不带我最心爱的玩偶。", "a": "842003066f76"}, {"sp": "", "role": "r", "id": "Saya tidak membawa semua barang.", "zh": "我不会把所有东西都带上。", "a": "fe5e73699965"}], "zh": "明天我要去雅加达打拼工作，我会带很多东西，不过有些东西我不带。我会带黑色皮鞋、棕色袜子、黑色裙子和白衬衫，还要带紫色西装外套和红色夹克，还有蓝色手表和红色手链。我不带帽子、运动服、长裤和围巾，也不带我心爱的玩偶。我不会把所有东西都带上。", "note": "", "qa": [{"q": "Barang apa saja yang dibawa Meli?", "a": "Sepatu pantofel, kaus kaki, rok, kemeja putih, blazer, jaket, jam tangan, dan gelang.", "qa": "c6526a730c7a", "aa": "f5ea2b523d05", "qz": "Meli 带了哪些东西？", "az": "皮鞋、袜子、裙子、白衬衫、西装外套、夹克、手表和手链。"}, {"q": "Barang apa yang tidak dibawa Meli?", "a": "Topi, baju olahraga, celana panjang, syal, dan boneka.", "qa": "ed4ebb06e1f2", "aa": "815938509134", "qz": "Meli 没带哪些东西？", "az": "帽子、运动服、长裤、围巾和玩偶。"}]}, {"id": "t79", "kind": "text", "book": "BIPA 1", "title": "出租屋广告（课文 10.1）", "lines": [{"sp": "", "role": "r", "id": "Hunian Sewa Eksklusif di Jakarta Selatan.", "zh": "南雅加达高档出租公寓。", "a": "df8ffffbfb0a"}, {"sp": "", "role": "r", "id": "Lingkungan nyaman dengan fasilitas lengkap.", "zh": "环境舒适，设施齐全。", "a": "009fe48fb7e5"}, {"sp": "", "role": "r", "id": "Dekat dengan Kawasan Bisnis TB Simatupang.", "zh": "靠近 TB Simatupang 商务区。", "a": "5572f92209b0"}, {"sp": "", "role": "r", "id": "Cocok untuk corporate housing dan keluarga muda.", "zh": "适合企业员工宿舍和年轻家庭。", "a": "9caa298d6d82"}, {"sp": "", "role": "r", "id": "— Hunian 2 lantai dengan ruang makan + duduk, kamar tidur, dapur, dan kamar mandi.", "zh": "两层住宅，带餐厅兼客厅、卧室、厨房和卫生间。", "a": "b0d0f1f1d218"}, {"sp": "", "role": "r", "id": "Fully furnished; termasuk AC, double bed, 1 set meja makan kayu, kompor, dispenser, dll.", "zh": "家具齐全：包括空调、双人床、一套木餐桌、炉灶、饮水机等。", "a": "d12fde89da6f"}, {"sp": "", "role": "r", "id": "Akses internet.", "zh": "有网络。", "a": "fe67dd9efc09"}, {"sp": "", "role": "r", "id": "Laundry service.", "zh": "洗衣服务。", "a": "38c17bcaf24e"}, {"sp": "", "role": "r", "id": "Cleaning service.", "zh": "保洁服务。", "a": "f846cfd87c5d"}, {"sp": "", "role": "r", "id": "Penjaga keamanan 24 jam.", "zh": "24小时保安。", "a": "0c887306f38c"}, {"sp": "", "role": "r", "id": "Parkir motor dan mobil.", "zh": "摩托车和汽车停车位。", "a": "7cad256149ff"}, {"sp": "", "role": "r", "id": "— Ketentuan harga: 1 kamar (45 m², 12 unit): Rp1.750.000/bulan.", "zh": "价格：一室（45平方米，12套）每月175万印尼盾。", "a": "f17bf6420660"}, {"sp": "", "role": "r", "id": "2 kamar (56 m², 2 unit): Rp2.200.000/bulan.", "zh": "两室（56平方米，2套）每月220万印尼盾。", "a": "dfb8f3c8832a"}, {"sp": "", "role": "r", "id": "Minimal sewa 3 bulan (deposit 1 bulan).", "zh": "最少租3个月（押一个月）。", "a": "89b053354a70"}, {"sp": "", "role": "r", "id": "— GRIYA SELARAS BENDA.", "zh": "GRIYA SELARAS BENDA 公寓。", "a": "b81f10bb0852"}, {"sp": "", "role": "r", "id": "Lokasi: Jl.", "zh": "地址：", "a": "d03099c170a5"}, {"sp": "", "role": "r", "id": "Makmur Ceria RT 03/RW 010, Ciganjur, Jagakarsa, Jakarta 12630.", "zh": "雅加达 Jagakarsa 区 Ciganjur，Makmur Ceria 路 RT 03/RW 010，邮编 12630。", "a": "273f0f318a49"}], "zh": "南雅加达高档出租公寓。环境舒适，设施齐全，靠近 TB Simatupang 商务区，适合企业员工宿舍和年轻家庭。——两层住宅，含餐厅兼客厅、卧室、厨房和浴室。全套家具：空调、双人床、一套木制餐桌、炉灶、饮水机等。有网络、洗衣服务、保洁服务、24 小时保安，可停摩托车和汽车。——价格：一室（45 平方米，共 12 套）每月 175 万盾；两室（56 平方米，共 2 套）每月 220 万盾。最短租期 3 个月（押金 1 个月）。——Griya Selaras Benda，地址：Jagakarsa 区 Ciganjur，Makmur Ceria 路 RT 03/RW 010，雅加达 12630。", "note": "原书为广告图片，已转成文字。", "qa": [{"q": "Kos itu bernama apa?", "a": "Griya Selaras.", "qa": "6261c943389a", "aa": "db18c4d98897", "qz": "那个公寓叫什么名字？", "az": "Griya Selaras。"}, {"q": "Kos itu dekat dengan apa?", "a": "Dekat dengan Kawasan Bisnis TB Simatupang.", "qa": "0efcab857b10", "aa": "5572f92209b0", "qz": "那个公寓靠近哪里？", "az": "靠近 TB Simatupang 商务区。"}, {"q": "Kos itu berlokasi di jalan apa?", "a": "Jalan Makmur Ceria.", "qa": "73f59b675e10", "aa": "6d49adc95c38", "qz": "那个公寓在哪条路上？", "az": "Makmur Ceria 路。"}, {"q": "Berapa lama minimal sewa di sana?", "a": "Tiga bulan.", "qa": "c204e156152b", "aa": "581661e3fd32", "qz": "那里最少要租多久？", "az": "三个月。"}, {"q": "Berapa biaya sewa dua kamar per tahun?", "a": "Rp26.400.000,00 (Rp2.200.000 × 12).", "qa": "a9f5aac96e39", "aa": "fdce31ac7960", "qz": "两室的房子一年租金多少？", "az": "2640万印尼盾（220万 × 12）。"}]}, {"id": "t80", "kind": "text", "book": "BIPA 1", "title": "Meli 的出租屋（课文 10.2）", "lines": [{"sp": "", "role": "r", "id": "Rumah indekos Meli besar dan cantik.", "zh": "Meli 的寄宿屋又大又漂亮。", "a": "4ea94f288a62"}, {"sp": "", "role": "r", "id": "Di sana ada sepuluh kamar tidur.", "zh": "那里有十间卧室。", "a": "c75ecfedddbd"}, {"sp": "", "role": "r", "id": "Satu kamar tidur berkamar mandi satu.", "zh": "每间卧室带一个卫生间。", "a": "3ec715df39dd"}, {"sp": "", "role": "r", "id": "Rumah indekosnya bercat warna-warni.", "zh": "她的寄宿屋刷得五颜六色。", "a": "93a51d1f9de2"}, {"sp": "", "role": "r", "id": "Ada warna putih, biru, hitam, merah, dan abu-abu.", "zh": "有白色、蓝色、黑色、红色和灰色。", "a": "76a6e783af87"}, {"sp": "", "role": "r", "id": "Rumahnya berbentuk persegi panjang.", "zh": "房子是长方形的。", "a": "06fd5a074753"}, {"sp": "", "role": "r", "id": "Di sisi kiri dan kanan rumahnya ada pohon tinggi berdaun hijau.", "zh": "房子左右两边有绿叶高树。", "a": "dcdec5e9ae5b"}, {"sp": "", "role": "r", "id": "Ada juga bunga berwarna merah muda dan ungu.", "zh": "还有粉色和紫色的花。", "a": "7235eb79a1d4"}, {"sp": "", "role": "r", "id": "Di belakang rumah indekos Meli ada taman.", "zh": "Meli 的寄宿屋后面有一个花园。", "a": "da455e47124f"}, {"sp": "", "role": "r", "id": "Taman itu ada kolam ikannya.", "zh": "花园里有一个鱼池。", "a": "d6e5fc2ff37e"}, {"sp": "", "role": "r", "id": "Ada ikan yang berwarna hitam dan emas.", "zh": "有黑色和金色的鱼。", "a": "e78b2e8204a4"}, {"sp": "", "role": "r", "id": "Di taman juga ada bangku panjang berwarna hitam.", "zh": "花园里还有一张黑色长椅。", "a": "3f07882886f7"}, {"sp": "", "role": "r", "id": "Di depan bangku ada meja berbentuk bulat dan berwarna cokelat.", "zh": "长椅前面有一张棕色的圆桌。", "a": "c35163de6881"}, {"sp": "", "role": "r", "id": "Di taman juga ada banyak batu besar berwarna abu-abu.", "zh": "花园里还有很多灰色的大石头。", "a": "d81b28a4a1f1"}], "zh": "Meli 住的出租屋又大又漂亮，有十间卧室，每间卧室带一个浴室。出租屋刷得五颜六色：白、蓝、黑、红和灰。房子是长方形的，左右两边种着绿叶高树，还有粉色和紫色的花。出租屋后面有一个花园，花园里有个鱼池，池里有黑色和金色的鱼。花园里还有一张黑色长椅，长椅前面有一张棕色圆桌。花园里还有很多灰色的大石头。", "note": "", "qa": [{"q": "Ada berapa kamar tidur di sana?", "a": "Ada sepuluh kamar tidur.", "qa": "4981e0115bab", "aa": "5450bd5bcfc8", "qz": "那里有几间卧室？", "az": "有十间卧室。"}, {"q": "Apa bentuk rumahnya?", "a": "Persegi panjang.", "qa": "df06d8f26fa4", "aa": "a852089c698d", "qz": "房子是什么形状的？", "az": "长方形。"}, {"q": "Ada apa di depan bangku?", "a": "Meja berbentuk bulat berwarna cokelat.", "qa": "4765bd389af0", "aa": "ab3db2cfb9c3", "qz": "长椅前面有什么？", "az": "一张棕色的圆桌。"}, {"q": "Ada apa di taman?", "a": "Kolam ikan, bangku panjang, meja bulat, dan batu besar.", "qa": "25641a537bae", "aa": "958f5d56baa0", "qz": "花园里有什么？", "az": "鱼池、长椅、圆桌和大石头。"}, {"q": "Ada apa di sisi kiri dan kanan rumahnya?", "a": "Pohon tinggi berdaun hijau.", "qa": "810657f547d9", "aa": "c19c4f6188f5", "qz": "房子左右两边有什么？", "az": "绿叶高树。"}]}, {"id": "t81", "kind": "text", "book": "BIPA 2", "title": "吉他为什么最受欢迎（课文 1）", "lines": [{"sp": "", "role": "r", "id": "Gitar menjadi alat musik terfavorit di dunia, termasuk di Indonesia.", "zh": "吉他是世界上最受欢迎的乐器，在印度尼西亚也一样。", "a": "de09b52bc9c9"}, {"sp": "", "role": "r", "id": "Mengapa gitar menjadi favorit?", "zh": "为什么吉他最受欢迎？", "a": "4758375b3d5b"}, {"sp": "", "role": "r", "id": "Alasannya adalah belajar gitar itu cukup mudah.", "zh": "原因是学吉他比较容易。", "a": "dab72c9ad1cd"}, {"sp": "", "role": "r", "id": "Hanya dengan mengenal kunci-kunci dasar seperti C, D, Dm, E, Em, F, A, dan Am, kita bisa memainkan beberapa lagu.", "zh": "只要认识几个基本和弦，比如 C、D、Dm、E、Em、F、A 和 Am，就能弹几首歌了。", "a": "573c64b76033"}, {"sp": "", "role": "r", "id": "Kita juga bisa belajar gitar sendiri tanpa guru (otodidak).", "zh": "我们也可以不找老师自学吉他。", "a": "626c6d36378f"}, {"sp": "", "role": "r", "id": "Belajar gitar secara otodidak dapat dilakukan melalui buku atau internet.", "zh": "自学吉他可以通过书本或网络。", "a": "880b071f0642"}, {"sp": "", "role": "r", "id": "Kita juga dapat dengan mudah membeli gitar karena ada banyak penjual gitar di berbagai tempat.", "zh": "买吉他也很方便，因为很多地方都有卖吉他的。", "a": "e583501c5e56"}, {"sp": "", "role": "r", "id": "Saat kita mengunjungi toko musik, gitar adalah alat musik yang paling banyak dijual.", "zh": "我们去乐器店时，吉他是卖得最多的乐器。", "a": "7cd5bb98bd5d"}, {"sp": "", "role": "r", "id": "Biasanya toko musik menjual berbagai jenis gitar.", "zh": "乐器店通常卖各种各样的吉他。", "a": "06d055589bb4"}], "zh": "吉他是全世界最受欢迎的乐器，在印尼也一样。为什么吉他这么受欢迎？原因是学吉他比较容易。只要认识 C、D、Dm、E、Em、F、A、Am 这些基本和弦，就能弹好几首歌。我们还可以不用老师，自己学（自学）。自学吉他可以通过书或网络。买吉他也很容易，因为很多地方都有卖。去乐器店时，吉他是卖得最多的乐器，乐器店通常卖各种各样的吉他。", "note": "", "qa": [{"q": "Mengapa gitar bisa menjadi alat musik terfavorit?", "a": "Karena belajar gitar itu cukup mudah.", "qa": "bb76fc11fad9", "aa": "8b75f56395bc", "qz": "为什么吉他能成为最受欢迎的乐器？", "az": "因为学吉他比较容易。"}, {"q": "Apa saja kunci-kunci dasar untuk bermain gitar?", "a": "C, D, Dm, E, Em, F, A, dan Am.", "qa": "c806777a108c", "aa": "144072a63cb2", "qz": "弹吉他的基本和弦有哪些？", "az": "C、D、Dm、E、Em、F、A 和 Am。"}, {"q": "Apa itu otodidak?", "a": "Belajar sendiri tanpa diajarkan orang lain.", "qa": "2dc1daeb3fef", "aa": "de1b4ad1e5c2", "qz": "什么是自学？", "az": "不靠别人教，自己学。"}, {"q": "Bagaimana cara belajar gitar secara otodidak?", "a": "Melalui buku atau internet.", "qa": "58e6819dc563", "aa": "f3a5cbf095be", "qz": "怎样自学吉他？", "az": "通过书本或网络。"}, {"q": "Mengapa kita bisa mudah membeli gitar?", "a": "Karena ada banyak penjual gitar di berbagai tempat.", "qa": "39cabfea47e9", "aa": "5ff2b669ec13", "qz": "为什么买吉他很方便？", "az": "因为很多地方都有卖吉他的。"}]}, {"id": "t82", "kind": "text", "book": "BIPA 2", "title": "酒店前台 Siu（课文 2）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Siu.", "zh": "我叫 Siu。", "a": "072c34da0222"}, {"sp": "", "role": "r", "id": "Saya seorang resepsionis di sebuah hotel.", "zh": "我是一家酒店的前台。", "a": "7e8204f62865"}, {"sp": "", "role": "r", "id": "Saya sudah 2 tahun bekerja di sini.", "zh": "我在这里工作两年了。", "a": "5957cdd1719c"}, {"sp": "", "role": "r", "id": "Saya bekerja 8 jam sehari.", "zh": "我每天工作8小时。", "a": "eb3a1583c694"}, {"sp": "", "role": "r", "id": "Salah satu tugas saya adalah memeriksa pesanan kamar dari tamu hotel.", "zh": "我的工作之一是核对酒店客人的订房。", "a": "3948f23986cf"}, {"sp": "", "role": "r", "id": "Setelah pesanan kamar benar, saya memberikan kunci kamar kepada tamu hotel.", "zh": "订房确认无误后，我把房卡交给客人。", "a": "6b6bbf4cf5e5"}, {"sp": "", "role": "r", "id": "Setelah tamu hotel selesai menginap, saya menerima kembali kunci kamar dari tamu hotel.", "zh": "客人住完后，我从客人那里收回房卡。", "a": "ac2ca10a0640"}, {"sp": "", "role": "r", "id": "Pekerjaan saya cukup menyenangkan.", "zh": "我的工作挺开心的。", "a": "785953d78cba"}, {"sp": "", "role": "r", "id": "Saya bisa bertemu banyak orang baru.", "zh": "我能认识很多新朋友。", "a": "1cc9ef0a5841"}], "zh": "我叫 Siu，是一家酒店的前台接待员，在这里工作两年了，每天工作八小时。我的一项职责是核对客人的订房。确认无误后，我把房间钥匙交给客人；客人退房后，我再把钥匙收回来。我的工作挺愉快的，可以认识很多新朋友。", "note": "", "qa": [{"q": "Sudah berapa lama Siu bekerja?", "a": "Siu sudah bekerja selama dua tahun.", "qa": "c7d6d29340c6", "aa": "8ef5ae423ece", "qz": "Siu 工作多久了？", "az": "Siu 已经工作两年了。"}, {"q": "Apa pekerjaan Siu?", "a": "Resepsionis di sebuah hotel.", "qa": "20ade7980369", "aa": "3b294e8a5a4e", "qz": "Siu 是做什么工作的？", "az": "酒店前台。"}, {"q": "Berapa lama Siu bekerja dalam sehari?", "a": "Delapan jam.", "qa": "df8fc4a23686", "aa": "40a8d3468064", "qz": "Siu 一天工作多长时间？", "az": "八个小时。"}, {"q": "Apa yang Siu lakukan dalam pekerjaannya?", "a": "Memeriksa pesanan kamar, memberikan dan menerima kembali kunci kamar.", "qa": "1abb4b265b27", "aa": "e712ab14b40d", "qz": "Siu 的工作内容是什么？", "az": "核对订房，发放和收回房卡。"}, {"q": "Mengapa pekerjaan Siu menyenangkan?", "a": "Karena dia bisa bertemu banyak orang baru.", "qa": "66081d1891d4", "aa": "012cf4c987b3", "qz": "为什么 Siu 的工作很开心？", "az": "因为她能认识很多新朋友。"}]}, {"id": "t83", "kind": "text", "book": "BIPA 2", "title": "市场打折广播（音频 3）", "lines": [{"sp": "", "role": "r", "id": "Bapak dan Ibu yang kami hormati: Sekarang Pasar Raya Sentosa memberi potongan harga untuk beberapa bahan pokok.", "zh": "尊敬的各位先生女士：Sentosa 大市场现在对部分基本食材打折。", "a": "92b92c033506"}, {"sp": "", "role": "r", "id": "Potongan harga sering kami berikan pada setiap akhir bulan.", "zh": "我们每个月底经常打折。", "a": "39cc0175a35c"}, {"sp": "", "role": "r", "id": "Potongan harga yang ada antara lain: satu kilogram cabai sekarang seharga Rp18.000.", "zh": "这次的折扣包括：辣椒现在每公斤18000印尼盾。", "a": "418e3bc57e5b"}, {"sp": "", "role": "r", "id": "Satu kilogram bawang sekarang seharga Rp16.000.", "zh": "洋葱现在每公斤16000印尼盾。", "a": "0e2948b77bb1"}, {"sp": "", "role": "r", "id": "Terakhir, harga 1 kilogram tomat adalah Rp6.000.", "zh": "最后，西红柿每公斤6000印尼盾。", "a": "069e2a985bc7"}, {"sp": "", "role": "r", "id": "Demikian pengumuman ini kami sampaikan.", "zh": "以上是本次通知。", "a": "be8c3f2993d8"}, {"sp": "", "role": "r", "id": "Kami tunggu kehadiran Bapak dan Ibu di pasar kami.", "zh": "欢迎各位光临我们的市场。", "a": "1f31fc064c20"}], "zh": "尊敬的先生们、女士们：现在 Sentosa 大市场对部分基本生活物资打折。我们通常在每个月底推出优惠。本次优惠包括：辣椒每公斤一万八千盾，洋葱每公斤一万六千盾，最后，西红柿每公斤六千盾。以上就是本次公告，欢迎各位光临我们的市场。", "note": "", "qa": [{"q": "Dari mana pengumuman itu terdengar?", "a": "Dari radio.", "qa": "1cc32f5e9458", "aa": "3009ceeabb33", "qz": "这个通知是从哪里听到的？", "az": "从收音机里。"}, {"q": "Di mana tempat yang ada potongan harga itu?", "a": "Di Pasar Raya Sentosa.", "qa": "5d59c32e18a4", "aa": "7011ecfa592f", "qz": "打折的地方在哪里？", "az": "在 Sentosa 大市场。"}, {"q": "Kapan tempat tersebut sering membuat potongan harga?", "a": "Setiap akhir bulan.", "qa": "6f47a6995d42", "aa": "5c0a88f9888c", "qz": "那里经常什么时候打折？", "az": "每个月底。"}, {"q": "Berapa harga satu kilogram tomat?", "a": "Rp6.000.", "qa": "137570a3ef16", "aa": "8301e0ea3c7a", "qz": "西红柿一公斤多少钱？", "az": "6000印尼盾。"}, {"q": "Berapa harga satu kilogram cabai?", "a": "Rp18.000.", "qa": "fcf44055aa03", "aa": "f23dad960040", "qz": "辣椒一公斤多少钱？", "az": "18000印尼盾。"}, {"q": "Berapa harga satu kilogram bawang?", "a": "Rp16.000.", "qa": "2dd78335eb48", "aa": "d7eb4610cd0d", "qz": "洋葱一公斤多少钱？", "az": "16000印尼盾。"}]}, {"id": "t84", "kind": "text", "book": "BIPA 2", "title": "交作业通知（课文 3）", "lines": [{"sp": "", "role": "r", "id": "PENGUMUMAN PENTING.", "zh": "重要通知。", "a": "dbc4bab949a2"}, {"sp": "", "role": "r", "id": "Tolong kumpulkan tugas menulis teks bahasa Indonesia kepada Ibu Reni.", "zh": "请把印尼语写作作业交给 Reni 老师。", "a": "ef2b096ddd2b"}, {"sp": "", "role": "r", "id": "Tugas tersebut harus dikumpulkan pada hari Selasa sebelum pukul 12.00 di ruang kelas.", "zh": "作业必须在星期二中午12点前交到教室。", "a": "2e2530f64b6c"}, {"sp": "", "role": "r", "id": "Atas perhatian Anda, kami ucapkan terima kasih.", "zh": "感谢您的关注。", "a": "04c662c4ac45"}], "zh": "重要通知：请把印尼语写作作业交给 Reni 老师。作业必须在星期二中午 12 点前交到教室。感谢您的配合。", "note": "另一个例子：“Hari ini Toko Ronald tidak buka. Terima kasih.” Ronald 店今天不营业，谢谢。", "qa": [{"q": "Apa judul pengumuman itu?", "a": "Pengumuman penting.", "qa": "a5621c9e0ee9", "aa": "cab36d41ab13", "qz": "这个通知的标题是什么？", "az": "重要通知。"}, {"q": "Kepada siapa pengumuman itu ditujukan?", "a": "Kepada para pelajar/siswa.", "qa": "8df72fc80191", "aa": "ba888ff0abf4", "qz": "这个通知是发给谁的？", "az": "发给学生们。"}, {"q": "Tugas apa yang harus dikumpulkan?", "a": "Tugas menulis teks bahasa Indonesia.", "qa": "49077f4334c8", "aa": "0e4467a7fb38", "qz": "要交什么作业？", "az": "印尼语写作作业。"}, {"q": "Kepada siapa tugas itu dikumpulkan?", "a": "Kepada Ibu Reni.", "qa": "5f221568af29", "aa": "95cbb672a67f", "qz": "作业交给谁？", "az": "交给 Reni 老师。"}, {"q": "Kapan dan di mana tugas itu harus dikumpulkan?", "a": "Hari Selasa sebelum pukul 12.00, di ruang kelas.", "qa": "78e460d4aa7f", "aa": "a15ddc0a5bcf", "qz": "作业什么时候、在哪里交？", "az": "星期二中午12点前，交到教室。"}]}, {"id": "t85", "kind": "text", "book": "BIPA 2", "title": "传统市场（课文 4）", "lines": [{"sp": "", "role": "r", "id": "Pasar tradisional sekarang tidak lagi seperti yang dahulu.", "zh": "传统市场现在已经跟以前不一样了。", "a": "82777dd1727c"}, {"sp": "", "role": "r", "id": "Dahulu pasar tradisional sangat tidak tertata rapi dan kotor.", "zh": "以前的传统市场又乱又脏。", "a": "413af3f9b6fd"}, {"sp": "", "role": "r", "id": "Saat ini pemerintah daerah di banyak wilayah Indonesia sudah menata pasar tradisional dengan lebih baik.", "zh": "现在印度尼西亚很多地区的地方政府已经把传统市场整顿得更好了。", "a": "ed6e58149fc0"}, {"sp": "", "role": "r", "id": "Sekarang bangunan pasar tradisional sudah banyak yang permanen.", "zh": "现在很多传统市场都已经是固定建筑了。", "a": "b582eaeb63a7"}, {"sp": "", "role": "r", "id": "Pasar tradisional sekarang juga lebih bersih.", "zh": "传统市场现在也更干净了。", "a": "1626b0997ba7"}, {"sp": "", "role": "r", "id": "Penjual dan pembeli sudah sangat mengerti tentang kebersihan pasar.", "zh": "卖家和买家都很懂得保持市场卫生。", "a": "1b87b1c39b1c"}, {"sp": "", "role": "r", "id": "Banyak pasar tradisional membuat aturan jangan buang sampah sembarangan.", "zh": "很多传统市场规定不准乱扔垃圾。", "a": "d65b6959e00f"}, {"sp": "", "role": "r", "id": "Semua itu dilakukan agar pembeli merasa nyaman saat berbelanja di pasar tradisional.", "zh": "这一切都是为了让买家在传统市场买东西时感到舒适。", "a": "e55b5c753367"}], "zh": "现在的传统市场已经和以前不一样了。以前传统市场很乱、很脏。现在印尼许多地区的地方政府把传统市场整顿得更好了。如今很多传统市场的建筑都是永久性的，也更干净了。卖家和买家都很重视市场卫生，很多市场规定不准乱扔垃圾。这一切都是为了让顾客在传统市场购物时感到舒适。", "note": "", "qa": [{"q": "Bagaimana pasar tradisional dahulu?", "a": "Tidak tertata rapi dan kotor.", "qa": "746ab473b56c", "aa": "7ff35e38bbf6", "qz": "以前的传统市场是什么样的？", "az": "又乱又脏。"}, {"q": "Siapa yang menata pasar tradisional?", "a": "Pemerintah daerah.", "qa": "736b24e19b7f", "aa": "9d24940b87d5", "qz": "是谁整顿了传统市场？", "az": "地方政府。"}, {"q": "Aturan apa yang dibuat banyak pasar tradisional?", "a": "Jangan buang sampah sembarangan.", "qa": "a4f54a6e3127", "aa": "53f2dc780858", "qz": "很多传统市场定了什么规矩？", "az": "不准乱扔垃圾。"}, {"q": "Untuk apa semua itu dilakukan?", "a": "Agar pembeli merasa nyaman saat berbelanja.", "qa": "06331f5a9306", "aa": "fb55c3204375", "qz": "这些都是为了什么？", "az": "为了让买家买东西时感到舒适。"}]}, {"id": "t86", "kind": "text", "book": "BIPA 2", "title": "简单炒饭（课文 5）", "lines": [{"sp": "", "role": "r", "id": "Bahan: sosis ayam satu buah; bawang putih 3 siung, iris halus; garam; nasi 600 gram; penyedap rasa; kecap ikan; merica; telur ayam 1 butir; daun bawang 1 batang, iris halus; daging ayam 125 gram, cincang halus.", "zh": "材料：鸡肉肠一根；蒜三瓣，切碎；盐；米饭600克；调味料；鱼露；胡椒；鸡蛋一个；葱一根，切碎；鸡肉125克，剁碎。", "a": "5e2b10a042cb"}, {"sp": "", "role": "r", "id": "Cara membuat: 1.", "zh": "做法：第一步。", "a": "32c7117b6695"}, {"sp": "", "role": "r", "id": "Tumis bawang putih hingga harum.", "zh": "把蒜炒香。", "a": "2422b70a9cc1"}, {"sp": "", "role": "r", "id": "Tambahkan telur lalu orak-arik.", "zh": "加入鸡蛋炒散。", "a": "a99548a80616"}, {"sp": "", "role": "r", "id": "2.", "zh": "第二步。", "a": null}, {"sp": "", "role": "r", "id": "Tambahkan ayam yang telah dicincang halus.", "zh": "加入剁碎的鸡肉。", "a": "fb0eb5748907"}, {"sp": "", "role": "r", "id": "3.", "zh": "第三步。", "a": null}, {"sp": "", "role": "r", "id": "Tambahkan sosis.", "zh": "加入香肠。", "a": "f6131aa6b266"}, {"sp": "", "role": "r", "id": "4.", "zh": "第四步。", "a": null}, {"sp": "", "role": "r", "id": "Masukkan daun bawang, kemudian tumis lagi.", "zh": "放入葱花，再翻炒一下。", "a": "208a6c24995e"}, {"sp": "", "role": "r", "id": "5.", "zh": "第五步。", "a": null}, {"sp": "", "role": "r", "id": "Masukkan nasi, kemudian aduk hingga rata.", "zh": "放入米饭，翻炒均匀。", "a": "d90caa8234ef"}, {"sp": "", "role": "r", "id": "6.", "zh": "第六步。", "a": null}, {"sp": "", "role": "r", "id": "Tambahkan kecap ikan, garam, merica, dan penyedap rasa secara bersamaan.", "zh": "同时加入鱼露、盐、胡椒和调味料。", "a": "b8a0402bfa04"}, {"sp": "", "role": "r", "id": "Aduk rata hingga aroma sedap atau harum tercium.", "zh": "翻炒均匀，直到闻到香味。", "a": "ddc6c1dfc1ad"}, {"sp": "", "role": "r", "id": "7.", "zh": "第七步。", "a": null}, {"sp": "", "role": "r", "id": "Pindahkan nasi goreng pada piring.", "zh": "把炒饭盛到盘子里。", "a": "dc8ec23b3441"}, {"sp": "", "role": "r", "id": "Anda bisa menaburkan bawang merah goreng sebagai tambahan.", "zh": "还可以撒些炸红葱头。", "a": "1ee415c3d0f9"}], "zh": "材料：鸡肉香肠一根；大蒜三瓣，切薄片；盐；米饭 600 克；味精；鱼露；胡椒；鸡蛋一个；葱一根，切细；鸡肉 125 克，剁碎。做法：1. 把蒜炒香，加入鸡蛋炒散。2. 加入剁碎的鸡肉。3. 加入香肠。4. 放入葱，再炒一下。5. 放入米饭，翻炒均匀。6. 同时加入鱼露、盐、胡椒和味精，翻炒均匀直到闻到香味。7. 把炒饭盛到盘子里，可以撒些炸红葱头作配料。", "note": "", "qa": [{"q": "Berapa banyak sosis yang dibutuhkan?", "a": "Satu buah.", "qa": "f6c1435d5e16", "aa": "b9d9788134b1", "qz": "需要几根香肠？", "az": "一根。"}, {"q": "Berapa gram nasi yang dibutuhkan?", "a": "600 gram.", "qa": "ce808a9271a3", "aa": "15a8e51e8abb", "qz": "需要多少克米饭？", "az": "600克。"}, {"q": "Berapa butir telur ayam yang dibutuhkan?", "a": "Satu butir.", "qa": "b50bd917f29d", "aa": "6f38789eefb1", "qz": "需要几个鸡蛋？", "az": "一个。"}, {"q": "Apa saja bahan yang diaduk rata hingga aroma sedap muncul?", "a": "Kecap ikan, garam, merica, dan penyedap rasa.", "qa": "9268372e717c", "aa": "66c7fc1038b0", "qz": "哪些材料要翻炒均匀直到出香味？", "az": "鱼露、盐、胡椒和调味料。"}, {"q": "Apa bahan yang dicincang halus?", "a": "Daging ayam.", "qa": "b6c9fcf8c318", "aa": "4bccdf406b49", "qz": "哪种材料要剁碎？", "az": "鸡肉。"}, {"q": "Apa yang bisa ditabur sebagai tambahan?", "a": "Bawang merah goreng.", "qa": "5f760b12e6a1", "aa": "d4e242302430", "qz": "可以额外撒点什么？", "az": "炸红葱头。"}]}, {"id": "t87", "kind": "text", "book": "BIPA 2", "title": "Budi 家周围（音频 6）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Budi.", "zh": "我叫 Budi。", "a": "dff39b3c900f"}, {"sp": "", "role": "r", "id": "Saya tinggal di Jalan Supratman.", "zh": "我住在 Supratman 路。", "a": "bb6c736ac792"}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada masjid.", "zh": "我家对面有一座清真寺。", "a": "11831a44d9bf"}, {"sp": "", "role": "r", "id": "Di sebelah kiri masjid ada taman kanak-kanak.", "zh": "清真寺左边有一所幼儿园。", "a": "21706298e98c"}, {"sp": "", "role": "r", "id": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Salim.", "zh": "我家右边是邻居 Salim 先生的家。", "a": "6923a255d1c5"}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada kantor pos.", "zh": "我家左边是邮局。", "a": "4127467dbeb8"}, {"sp": "", "role": "r", "id": "Di belakang rumah saya ada toko kelontong.", "zh": "我家后面有一家杂货店。", "a": "089f31e80145"}], "zh": "我叫 Budi，住在 Supratman 路。我家对面有一座清真寺，清真寺左边是一所幼儿园。我家右边是邻居 Salim 先生家，左边是邮局，后面是一家杂货店。", "note": "", "qa": [{"q": "Siapa Pak Salim?", "a": "Tetangga Budi.", "qa": "13e8eb901719", "aa": "6bc41c83fd7b", "qz": "Salim 先生是谁？", "az": "Budi 的邻居。"}, {"q": "Ada apa di seberang rumah Budi?", "a": "Masjid.", "qa": "76a20da20048", "aa": "2f07071ed18b", "qz": "Budi 家对面有什么？", "az": "清真寺。"}, {"q": "Ada apa di sebelah kiri rumah Budi?", "a": "Kantor pos.", "qa": "0c86b63763eb", "aa": "dba7a93761eb", "qz": "Budi 家左边有什么？", "az": "邮局。"}, {"q": "Ada apa di belakang rumah Budi?", "a": "Toko kelontong.", "qa": "44edac7e6867", "aa": "ccc87e2beb07", "qz": "Budi 家后面有什么？", "az": "杂货店。"}]}, {"id": "t88", "kind": "text", "book": "BIPA 2", "title": "Raisa 的家（课文 6）", "lines": [{"sp": "", "role": "r", "id": "Nama saya Raisa.", "zh": "我叫 Raisa。", "a": "93a3100953bf"}, {"sp": "", "role": "r", "id": "Saya tinggal di Jalan Sukasenang.", "zh": "我住在 Sukasenang 路。", "a": "4b8d9fdd3e24"}, {"sp": "", "role": "r", "id": "Rumah saya adalah rumah dua lantai.", "zh": "我家是两层楼的房子。", "a": "14c7615c345d"}, {"sp": "", "role": "r", "id": "Rumah saya berwarna putih.", "zh": "我家是白色的。", "a": "43aea247dc57"}, {"sp": "", "role": "r", "id": "Di depan rumah saya ada halaman.", "zh": "我家前面有个院子。", "a": "8f44fedfb6cb"}, {"sp": "", "role": "r", "id": "Di sana ada pohon mangga.", "zh": "那里有一棵芒果树。", "a": "d1b189c1171b"}, {"sp": "", "role": "r", "id": "Di belakang rumah saya ada warung Ibu Yayan.", "zh": "我家后面是 Yayan 阿姨的小店。", "a": "309f634e85f2"}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada toko kelontong.", "zh": "我家左边有一家杂货店。", "a": "5499abc80cab"}, {"sp": "", "role": "r", "id": "Di samping kanan rumah saya ada rumah seorang tetangga saya, Pak Bandi.", "zh": "我家右边是邻居 Bandi 先生的家。", "a": "d497f81d567c"}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada taman bermain.", "zh": "我家对面有一个游乐场。", "a": "0a4a6103d460"}], "zh": "我叫 Raisa，住在 Sukasenang 路。我家是两层楼，白色的。房前有个院子，院子里有棵芒果树。房后是 Yayan 阿姨的小店，左边是一家杂货店，右边是邻居 Bandi 先生家，对面是一个游乐场。", "note": "", "qa": [{"q": "Di mana Raisa tinggal?", "a": "Di Jalan Sukasenang.", "qa": "88350aef70da", "aa": "97412599fd02", "qz": "Raisa 住在哪里？", "az": "在 Sukasenang 路。"}, {"q": "Apa warna rumah Raisa?", "a": "Putih.", "qa": "75ba4ec6bbff", "aa": "6c31feb40754", "qz": "Raisa 家是什么颜色？", "az": "白色。"}, {"q": "Ada pohon apa di halaman rumah Raisa?", "a": "Pohon mangga.", "qa": "31c353e1b6c5", "aa": "2cefc7270c73", "qz": "Raisa 家院子里有什么树？", "az": "芒果树。"}, {"q": "Siapa pemilik warung di belakang rumah Raisa?", "a": "Ibu Yayan.", "qa": "d681ab253c05", "aa": "c3dd98bf02f1", "qz": "Raisa 家后面的小店是谁开的？", "az": "Yayan 阿姨。"}, {"q": "Di mana letak taman bermain?", "a": "Di seberang rumah Raisa.", "qa": "d783f3db2716", "aa": "fe9b69506d5d", "qz": "游乐场在哪里？", "az": "在 Raisa 家对面。"}, {"q": "Siapakah Pak Bandi?", "a": "Tetangga Raisa.", "qa": "3d02a7bb6999", "aa": "1693d2ea30b3", "qz": "Bandi 先生是谁？", "az": "Raisa 的邻居。"}]}, {"id": "t89", "kind": "text", "book": "BIPA 2", "title": "画平面图练习", "lines": [{"sp": "", "role": "r", "id": "Rumah saya ada di Jalan Bambu.", "zh": "我家在 Bambu 路。", "a": "bc23ed5b507b"}, {"sp": "", "role": "r", "id": "Rumah saya ada di belakang Masjid Al-Furqon.", "zh": "我家在 Al-Furqon 清真寺后面。", "a": "9836e645a3fd"}, {"sp": "", "role": "r", "id": "Di sebelah kanan masjid ada kebun cabai.", "zh": "清真寺右边有一片辣椒园。", "a": "c0b93fabfc1b"}, {"sp": "", "role": "r", "id": "Di sebelah kiri rumah saya ada toko yang menjual gas dan minyak tanah.", "zh": "我家左边有一家卖煤气和煤油的店。", "a": "98bcd495ca1c"}, {"sp": "", "role": "r", "id": "Di seberang toko gas ada toko air minum.", "zh": "煤气店对面有一家饮用水店。", "a": "4925737b81f5"}, {"sp": "", "role": "r", "id": "Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Resa.", "zh": "我家右边是邻居 Resa 先生的家。", "a": "032006be3294"}, {"sp": "", "role": "r", "id": "Di seberang rumah Pak Resa ada supermarket.", "zh": "Resa 先生家对面有一家超市。", "a": "5f70e9a452f7"}, {"sp": "", "role": "r", "id": "Di sebelah kiri supermarket ada tempat pangkas rambut.", "zh": "超市左边有一家理发店。", "a": "5efbe3630d15"}, {"sp": "", "role": "r", "id": "Di seberang rumah saya ada taman bermain anak.", "zh": "我家对面有一个儿童游乐场。", "a": "5a3e02da4681"}, {"sp": "", "role": "r", "id": "Di belakang taman bermain anak ada sekolah, yaitu SDN Ajitunggal.", "zh": "儿童游乐场后面有一所学校，叫 Ajitunggal 国立小学。", "a": "f072cddbc1fa"}], "zh": "我家在竹子路，在 Al-Furqon 清真寺后面。清真寺右边有一块辣椒地。我家左边是一家卖煤气和煤油的店，煤气店对面是一家饮用水店。我家右边是邻居 Resa 先生家，他家对面是一家超市，超市左边是理发店。我家对面是儿童游乐场，游乐场后面是一所学校——Ajitunggal 国立小学。", "note": "练习：根据这段描述画出平面图。", "qa": []}, {"id": "t90", "kind": "text", "book": "BIPA 2", "title": "热身运动（音频 7）", "lines": [{"sp": "", "role": "r", "id": "Sebelum berolahraga, kita harus melakukan pemanasan.", "zh": "运动前，我们必须先热身。", "a": "89b9eec63d84"}, {"sp": "", "role": "r", "id": "Contoh pemanasan adalah sebagai berikut.", "zh": "热身动作举例如下。", "a": "7393b827a0a1"}, {"sp": "", "role": "r", "id": "Langkah pertama, gerakkan kepala ke kanan dan ke kiri.", "zh": "第一步，头向右、向左转动。", "a": "437c6e934d77"}, {"sp": "", "role": "r", "id": "Setelah itu, regangkan tangan ke atas dan ke bawah.", "zh": "然后，双手向上、向下伸展。", "a": "28713acea5de"}, {"sp": "", "role": "r", "id": "Terakhir, angkat kaki secara bergantian.", "zh": "最后，两腿轮流抬起。", "a": "90655aced2c5"}, {"sp": "", "role": "r", "id": "Lakukan tiap gerakan selama delapan detik.", "zh": "每个动作做八秒。", "a": "523283b23704"}], "zh": "运动前我们要先热身。热身的例子如下：第一步，把头向右、向左转动；然后，把手向上、向下伸展；最后，轮流抬腿。每个动作做八秒。", "note": "", "qa": [{"q": "Apa yang harus kita lakukan sebelum berolahraga?", "a": "Pemanasan.", "qa": "c26fbccd1e2d", "aa": "884682e8d5cc", "qz": "运动前我们必须做什么？", "az": "热身。"}, {"q": "Apa langkah pertama ketika melakukan pemanasan?", "a": "Menggerakkan kepala ke kanan dan ke kiri.", "qa": "c292ee66ea17", "aa": "8bb4aa1a36c9", "qz": "热身的第一步是什么？", "az": "头向右、向左转动。"}, {"q": "Ke arah mana kita harus meregangkan tangan?", "a": "Ke atas dan ke bawah.", "qa": "b1e1310bdf5d", "aa": "5a92541fbefa", "qz": "手要往哪个方向伸展？", "az": "向上和向下。"}, {"q": "Berapa lama waktu untuk tiap gerakan?", "a": "Delapan detik.", "qa": "d13bf8f16990", "aa": "5f273fa78b58", "qz": "每个动作做多长时间？", "az": "八秒。"}, {"q": "Apa langkah ketiga dalam pemanasan?", "a": "Mengangkat kaki secara bergantian.", "qa": "14d955f3b69c", "aa": "3b49e6a7b457", "qz": "热身的第三步是什么？", "az": "两腿轮流抬起。"}]}, {"id": "t91", "kind": "text", "book": "BIPA 2", "title": "放松运动的做法（课文 7）", "lines": [{"sp": "", "role": "r", "id": "Olahraga adalah aktivitas yang baik bagi tubuh.", "zh": "运动对身体有好处。", "a": "1c919f7b4fd7"}, {"sp": "", "role": "r", "id": "Setelah melakukan kegiatan inti Anda harus melakukan pendinginan.", "zh": "做完主要运动后，你必须做放松运动。", "a": "d2df4e132608"}, {"sp": "", "role": "r", "id": "Ada banyak cara untuk melakukan pendinginan.", "zh": "放松运动有很多种做法。", "a": "aef35b6aafd1"}, {"sp": "", "role": "r", "id": "Berikut adalah salah satu caranya.", "zh": "下面是其中一种。", "a": "c75d6a968a4b"}, {"sp": "", "role": "r", "id": "Pertama, buka kaki selebar bahu.", "zh": "第一，两脚分开与肩同宽。", "a": "f9f2f733de38"}, {"sp": "", "role": "r", "id": "Kedua, pegang pinggang dengan tangan kiri.", "zh": "第二，左手叉腰。", "a": "b3a2351cc607"}, {"sp": "", "role": "r", "id": "Setelah itu gerakkan tangan kanan ke atas dan ke bawah.", "zh": "然后右手向上、向下摆动。", "a": "d1995b1e61dd"}, {"sp": "", "role": "r", "id": "Lakukan hal yang sama dengan tangan kiri.", "zh": "左手也做同样的动作。", "a": "4a69cd03a2c5"}, {"sp": "", "role": "r", "id": "Lalu, condongkan badan ke arah kiri bawah sampai hampir jongkok kemudian regangkan kaki ke kanan.", "zh": "接着，身体向左下方倾斜，几乎蹲下，然后把右腿伸直。", "a": "fb80827ce861"}, {"sp": "", "role": "r", "id": "Lakukan hal yang sama dengan kaki kiri.", "zh": "左腿也做同样的动作。", "a": "1d050603045f"}, {"sp": "", "role": "r", "id": "Tahan tiap gerakan selama 8 detik.", "zh": "每个动作保持8秒。", "a": "086cc936cdc7"}, {"sp": "", "role": "r", "id": "Setelah selesai pendinginan hindari meminum minuman bersoda.", "zh": "放松运动做完后，避免喝碳酸饮料。", "a": "2211a2a5fbe4"}, {"sp": "", "role": "r", "id": "Minuman bersoda dapat membuat perut menjadi kembung.", "zh": "碳酸饮料会让肚子胀气。", "a": "5ccc70968c95"}], "zh": "运动对身体有益。做完主要运动后，要做放松运动。放松的方法很多，下面是其中一种：第一，双脚分开与肩同宽；第二，左手扶腰；然后右手上下摆动，左手也做同样的动作。接着，身体向左下方倾斜，几乎蹲下，然后把右腿伸直，左腿也同样做。每个动作保持 8 秒。放松结束后，避免喝汽水，因为汽水会让肚子胀。", "note": "", "qa": [{"q": "Apa tema teks di atas?", "a": "Cara melakukan pendinginan.", "qa": "4278f23b0947", "aa": "ab1ee7211526", "qz": "上面这篇文章的主题是什么？", "az": "怎样做放松运动。"}, {"q": "Apa yang harus Anda lakukan setelah kegiatan inti?", "a": "Pendinginan.", "qa": "bb2d66c9dad4", "aa": "a11ddb8859a8", "qz": "做完主要运动后你应该做什么？", "az": "放松运动。"}, {"q": "Mengapa setelah berolahraga tidak boleh meminum minuman bersoda?", "a": "Karena dapat membuat perut kembung.", "qa": "dc102e08d76a", "aa": "2381013d2a83", "qz": "为什么运动后不能喝碳酸饮料？", "az": "因为会让肚子胀气。"}, {"q": "Apa langkah pertama dalam pendinginan?", "a": "Membuka kaki selebar bahu.", "qa": "3d70b19afa40", "aa": "0ed9a1c56a01", "qz": "放松运动的第一步是什么？", "az": "两脚分开与肩同宽。"}, {"q": "Berapa lama tiap gerakan dilakukan?", "a": "Delapan detik.", "qa": "228df3d8f895", "aa": "5f273fa78b58", "qz": "每个动作做多长时间？", "az": "八秒。"}]}, {"id": "t92", "kind": "text", "book": "BIPA 2", "title": "坐通勤列车（课文 8）", "lines": [{"sp": "", "role": "r", "id": "Saya mencoba naik kereta rel listrik (KRL) minggu lalu.", "zh": "上周我试着坐了电气列车（KRL）。", "a": "5bb2373cf0a5"}, {"sp": "", "role": "r", "id": "Saya berangkat dari Bogor ke Jakarta.", "zh": "我从茂物出发去雅加达。", "a": "cf821f779a9a"}, {"sp": "", "role": "r", "id": "Banyak hal yang baru saya temui ketika mencoba naik KRL.", "zh": "第一次坐 KRL，我遇到了很多新鲜事。", "a": "babde601ee7c"}, {"sp": "", "role": "r", "id": "Pertama saya memesan tiket di loket yang ada.", "zh": "首先，我在售票窗口买票。", "a": "1a4dfeb5fc37"}, {"sp": "", "role": "r", "id": "Saya harus menyebutkan stasiun yang ingin saya tuju.", "zh": "我得说出要去的车站。", "a": "11147e66e2c4"}, {"sp": "", "role": "r", "id": "Harganya cukup murah, hanya 10.000 rupiah.", "zh": "票价挺便宜的，只要一万印尼盾。", "a": "2fd854fe66f5"}, {"sp": "", "role": "r", "id": "Setelah itu, saya menempelkan tiket di gerbang dan berjalan ke peron untuk menunggu kereta.", "zh": "然后，我在闸机上刷票，走到站台等车。", "a": "2bac56f29379"}, {"sp": "", "role": "r", "id": "Ketika kereta tiba, saya langsung naik.", "zh": "列车一到，我马上上车。", "a": "b244513943af"}, {"sp": "", "role": "r", "id": "Keadaan di dalam kereta cukup sesak.", "zh": "车厢里挺挤的。", "a": "2debad9ffbb7"}, {"sp": "", "role": "r", "id": "Kereta pun tiba di Jakarta.", "zh": "列车到了雅加达。", "a": "c32f0d2e309f"}, {"sp": "", "role": "r", "id": "Saya turun, lalu berjalan keluar stasiun.", "zh": "我下车后走出车站。", "a": "297ca52516ed"}, {"sp": "", "role": "r", "id": "Saya harus menempelkan kembali tiket di gerbang yang telah disediakan.", "zh": "我得在指定的闸机上再刷一次票。", "a": "2e7e57cc21cd"}, {"sp": "", "role": "r", "id": "Pengalaman naik KRL cukup mengasyikkan.", "zh": "坐 KRL 的经历挺有意思的。", "a": "2c05a1adb0f4"}, {"sp": "", "role": "r", "id": "Penumpang memang harus bersabar ketika berada dalam kereta.", "zh": "乘客在车上确实要有耐心。", "a": "02195c06d099"}, {"sp": "", "role": "r", "id": "Namun, tempat tujuan bisa dicapai tepat waktu.", "zh": "不过，能准时到达目的地。", "a": "d2e1d40e98e4"}], "zh": "上周我第一次试着坐通勤列车，从茂物去雅加达，遇到了很多新鲜事。首先我在售票窗口买票，要说出想去的车站，票价挺便宜，只要一万盾。然后我在闸机刷票，走到站台等车。车一到我就上去了，车厢里相当挤。列车到了雅加达，我下车走出车站，出站时还要在闸机再刷一次票。坐通勤列车的经历挺有意思，在车上确实要有耐心，不过能准时到达目的地。", "note": "", "qa": [{"q": "Kapan penulis mencoba naik KRL?", "a": "Minggu lalu.", "qa": "07ad3a9d4dd1", "aa": "a56fe91cc4e4", "qz": "作者什么时候试着坐 KRL？", "az": "上周。"}, {"q": "Apa tujuan teks tersebut?", "a": "Menceritakan pengalaman naik KRL.", "qa": "77d2a2be0043", "aa": "1654083b03c4", "qz": "这篇文章的目的是什么？", "az": "讲述坐 KRL 的经历。"}, {"q": "Seperti apa suasana di dalam kereta?", "a": "Cukup sesak.", "qa": "ba6bae8d531d", "aa": "f0c6a579cc90", "qz": "车厢里是什么情况？", "az": "挺挤的。"}, {"q": "Apa yang harus dilakukan agar penumpang bisa keluar dari stasiun?", "a": "Menempelkan kembali tiket di gerbang.", "qa": "7954d599e3b5", "aa": "3ac6aa925570", "qz": "乘客要怎么做才能出站？", "az": "在闸机上再刷一次票。"}, {"q": "Apa yang dirasakan penulis setelah naik KRL?", "a": "Cukup mengasyikkan.", "qa": "09dd77cabe37", "aa": "3b57cc7df5fe", "qz": "作者坐完 KRL 后感觉怎么样？", "az": "挺有意思的。"}]}, {"id": "t93", "kind": "text", "book": "BIPA 2", "title": "四王群岛的假期（课文 9）", "lines": [{"sp": "", "role": "r", "id": "Tahun lalu, saya dan keluarga pergi ke Raja Ampat.", "zh": "去年，我和家人去了四王群岛。", "a": "7595eea47caa"}, {"sp": "", "role": "r", "id": "Kami pergi ke sana dengan pesawat.", "zh": "我们坐飞机去的。", "a": "a4353ee8b006"}, {"sp": "", "role": "r", "id": "Sesampainya di sana kami langsung masuk ke hotel.", "zh": "到了那里，我们直接入住酒店。", "a": "1a2a2e55fdd6"}, {"sp": "", "role": "r", "id": "Setelah menyimpan barang-barang, kami memulai beragam aktivitas.", "zh": "放好行李后，我们开始了各种活动。", "a": "553f5e385821"}, {"sp": "", "role": "r", "id": "Pada hari pertama, kami bermain di pantai.", "zh": "第一天，我们在海滩玩。", "a": "3389eff94700"}, {"sp": "", "role": "r", "id": "Pantai di Raja Ampat sangat indah.", "zh": "四王群岛的海滩非常美。", "a": "4808128823f7"}, {"sp": "", "role": "r", "id": "Lautnya jernih dan bersih.", "zh": "海水清澈干净。", "a": "476247ffd179"}, {"sp": "", "role": "r", "id": "Kami juga tidak lupa untuk snorkeling.", "zh": "我们当然也去浮潜了。", "a": "eb281418ab14"}, {"sp": "", "role": "r", "id": "Saya melihat banyak ikan yang berwarna-warni.", "zh": "我看到很多五颜六色的鱼。", "a": "5ffa3d840beb"}, {"sp": "", "role": "r", "id": "Setelah itu kami mengunjungi pantai yang berpasir putih.", "zh": "之后我们去了白沙滩。", "a": "9b1e97b4b79d"}, {"sp": "", "role": "r", "id": "Saya dan keluarga tidak lupa untuk berfoto bersama.", "zh": "我和家人还一起拍了合照。", "a": "13ef814812b2"}, {"sp": "", "role": "r", "id": "Pada hari kedua kami pergi ke Air Terjun Batanta.", "zh": "第二天我们去了 Batanta 瀑布。", "a": "903a78d7dbc9"}, {"sp": "", "role": "r", "id": "Airnya bersih dan jernih seperti di pantai.", "zh": "瀑布的水像海水一样干净清澈。", "a": "d645214159f9"}, {"sp": "", "role": "r", "id": "Pada hari ketiga kami pulang ke rumah.", "zh": "第三天我们回家了。", "a": "cb9c74d6fe9a"}, {"sp": "", "role": "r", "id": "Liburan kami terasa amat singkat.", "zh": "我们的假期感觉太短了。", "a": "cbb8df51a94d"}, {"sp": "", "role": "r", "id": "Akan tetapi, saya dan keluarga merasa sangat bahagia.", "zh": "不过，我和家人都非常开心。", "a": "6a85134686da"}, {"sp": "", "role": "r", "id": "Saya ingin kembali ke sana pada lain waktu.", "zh": "我想以后再去那里。", "a": "a26d01ab5b46"}], "zh": "去年我和家人去了四王群岛，是坐飞机去的。一到那里我们就直接进了酒店，放好行李后开始了各种活动。第一天我们在海滩玩，四王群岛的海滩非常美，海水清澈干净。我们还去浮潜，我看到很多五颜六色的鱼。之后我们去了白沙滩，全家一起拍照。第二天我们去了巴坦塔瀑布，那里的水和海水一样干净清澈。第三天我们回家了。假期感觉太短了，不过我和家人都非常开心，我希望以后还能再去。", "note": "", "qa": [{"q": "Ke mana penulis berlibur?", "a": "Ke Raja Ampat.", "qa": "2c5288d98c52", "aa": "8c4f10f950ac", "qz": "作者去哪里度假？", "az": "去四王群岛。"}, {"q": "Transportasi apa yang digunakan penulis dan keluarganya?", "a": "Pesawat.", "qa": "2404d58d85f7", "aa": "31550135a5de", "qz": "作者和家人坐什么交通工具？", "az": "飞机。"}, {"q": "Berapa lama mereka berlibur di Raja Ampat?", "a": "Tiga hari.", "qa": "01316f377dc4", "aa": "c02b7095ddb5", "qz": "他们在四王群岛玩了多久？", "az": "三天。"}, {"q": "Apa kesamaan antara pantai dan air terjun di Raja Ampat?", "a": "Airnya sama-sama bersih dan jernih.", "qa": "6c9246c676bb", "aa": "be02c6e393bb", "qz": "四王群岛的海滩和瀑布有什么共同点？", "az": "水都很干净清澈。"}, {"q": "Apa yang dirasakan penulis setelah berlibur?", "a": "Sangat bahagia.", "qa": "8164f548533c", "aa": "8de1ee33b5f1", "qz": "作者度假后感觉怎么样？", "az": "非常开心。"}]}, {"id": "t94", "kind": "text", "book": "BIPA 2", "title": "得了登革热（课文 10）", "lines": [{"sp": "", "role": "r", "id": "Pada suatu hari saya tiba-tiba merasa sangat mual.", "zh": "有一天，我突然觉得非常恶心。", "a": "cfb5b3972022"}, {"sp": "", "role": "r", "id": "Badan saya terasa demam.", "zh": "我身体发烧。", "a": "55c27dbf15d3"}, {"sp": "", "role": "r", "id": "Otot saya sangat sakit.", "zh": "我的肌肉很疼。", "a": "4b53563ed59a"}, {"sp": "", "role": "r", "id": "Muka saya menjadi sangat pucat.", "zh": "我的脸变得非常苍白。", "a": "32f4539448b2"}, {"sp": "", "role": "r", "id": "Wali kelas mengantar saya ke rumah sakit.", "zh": "班主任送我去了医院。", "a": "04ecc029e6dd"}, {"sp": "", "role": "r", "id": "Setelah diperiksa, saya mengalami gejala demam berdarah.", "zh": "检查后，发现我有登革热的症状。", "a": "09f89520f6ac"}, {"sp": "", "role": "r", "id": "Penyakit ini disebabkan virus yang dibawa oleh nyamuk Aedes aegypti.", "zh": "这种病是由埃及伊蚊携带的病毒引起的。", "a": "4aca6bf0e80a"}, {"sp": "", "role": "r", "id": "Saya langsung dimasukkan ke ruang rawat inap.", "zh": "我马上被送进了住院病房。", "a": "6feba15cd5e8"}, {"sp": "", "role": "r", "id": "Perawat memasang infus di lengan saya.", "zh": "护士在我胳膊上打了点滴。", "a": "929cfb971557"}, {"sp": "", "role": "r", "id": "Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat.", "zh": "住院期间我不能吃医院外面的食物。", "a": "7bf8776737ce"}, {"sp": "", "role": "r", "id": "Saya pun dianjurkan untuk sering meminum air.", "zh": "医生还建议我多喝水。", "a": "0165139fc14a"}, {"sp": "", "role": "r", "id": "Selain itu, saya diminta untuk memakan buah-buahan yang mengandung vitamin C.", "zh": "另外，医生让我多吃含维生素C的水果。", "a": "ffdea84b4de3"}, {"sp": "", "role": "r", "id": "Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit.", "zh": "住院期间我只能躺在床上。", "a": "3161d5d43020"}, {"sp": "", "role": "r", "id": "Akhirnya, saya boleh pulang setelah dirawat selama 5 hari.", "zh": "住了5天院以后，我终于可以回家了。", "a": "26a3d3e3d31e"}, {"sp": "", "role": "r", "id": "Mulai saat itu, saya menjaga kebersihan rumah saya.", "zh": "从那时起，我注意保持家里的卫生。", "a": "90e719e24d7b"}, {"sp": "", "role": "r", "id": "Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "zh": "我这样做是为了不再有蚊子。", "a": "1f4fb864e0e0"}], "zh": "有一天我突然觉得非常恶心，身体发烧，肌肉很疼，脸色变得非常苍白。班主任送我去了医院。检查后发现我有登革热的症状，这种病是由埃及伊蚊携带的病毒引起的。我马上被送进住院病房，护士在我手臂上打了点滴。住院期间我不能吃医院外面的食物，医生建议我多喝水，还要多吃含维生素 C 的水果。住院时我只能躺在床上。住了五天后我终于可以回家了。从那以后我注意保持家里清洁，这样就不会再有蚊子了。", "note": "", "qa": [{"q": "Di mana penulis dirawat di rumah sakit?", "a": "Di ruang rawat inap.", "qa": "ac0e41b12ca7", "aa": "c6de1fb58929", "qz": "作者住在医院的哪里？", "az": "在住院病房。"}, {"q": "Apa gejala yang dialami oleh penulis?", "a": "Mual, demam, otot sakit, dan muka pucat.", "qa": "1fd5121ab97e", "aa": "6b53ddba8f97", "qz": "作者有哪些症状？", "az": "恶心、发烧、肌肉疼、脸色苍白。"}, {"q": "Nyamuk apa yang membawa virus demam berdarah?", "a": "Nyamuk Aedes aegypti.", "qa": "3c2ff2635a93", "aa": "e60b515fd080", "qz": "哪种蚊子携带登革热病毒？", "az": "埃及伊蚊。"}, {"q": "Apa yang dianjurkan kepada penulis agar cepat sembuh?", "a": "Sering minum air dan makan buah-buahan yang mengandung vitamin C.", "qa": "c6f3c9ca89cd", "aa": "6cb7e12d3ba9", "qz": "医生建议作者怎样才能快点好？", "az": "多喝水，多吃含维生素C的水果。"}, {"q": "Berapa lama penulis dirawat di rumah sakit?", "a": "Lima hari.", "qa": "a64ecf40368a", "aa": "3b6a2149a16c", "qz": "作者住了多久的院？", "az": "五天。"}, {"q": "Apa yang dilakukan penulis agar tidak sakit demam berdarah lagi?", "a": "Menjaga kebersihan rumah supaya tidak ada nyamuk.", "qa": "924b7cafa725", "aa": "985a712a419b", "qz": "作者做了什么来避免再得登革热？", "az": "保持家里干净，不让蚊子滋生。"}]}, {"id": "t95", "kind": "text", "book": "BIPA 2", "title": "止泻药说明书", "lines": [{"sp": "", "role": "r", "id": "Obat Diare.", "zh": "止泻药。", "a": "07b647bd63d1"}, {"sp": "", "role": "r", "id": "Khasiat: 1.", "zh": "功效：第一。", "a": "de1ce389f10d"}, {"sp": "", "role": "r", "id": "Mengurangi frekuensi buang air besar.", "zh": "减少排便次数。", "a": "1151414bddd9"}, {"sp": "", "role": "r", "id": "2.", "zh": "第二步。", "a": null}, {"sp": "", "role": "r", "id": "Menyerap racun penyebab diare.", "zh": "吸附引起腹泻的毒素。", "a": "3e22c5551836"}, {"sp": "", "role": "r", "id": "Komposisi: Tiap tablet (325 mg) mengandung activated charcoal (125 mg).", "zh": "成分：每片（325毫克）含活性炭（125毫克）。", "a": "2d76f80b4f28"}, {"sp": "", "role": "r", "id": "Aturan pakai: 5—7 tablet per dosis.", "zh": "用法：每次5—7片。", "a": "29217e97f010"}, {"sp": "", "role": "r", "id": "Maksimum 20 tablet/hari.", "zh": "每天最多20片。", "a": "9d86f67b8b66"}, {"sp": "", "role": "r", "id": "Produksi: P.T.", "zh": "生产厂家：", "a": "1ac4d49ab1a4"}, {"sp": "", "role": "r", "id": "Eagle Indo Pharma.", "zh": "Eagle Indo Pharma 公司。", "a": "f0705cb2900c"}], "zh": "止泻药。功效：1. 减少排便次数；2. 吸附引起腹泻的毒素。成分：每片（325 毫克）含活性炭 125 毫克。用法：每次 5—7 片，每天最多 20 片。生产商：P.T. Eagle Indo Pharma。", "note": "药品说明常用词：khasiat 功效 · komposisi 成分 · aturan pakai 用法 · dosis 剂量 · maksimum 最多。", "qa": []}, {"id": "c96", "kind": "culture", "book": "BIPA 1", "title": "认识印度尼西亚", "lines": [{"sp": "", "role": "r", "id": "Indonesia adalah negara kepulauan yang besar di Asia Tenggara.", "zh": "印度尼西亚是东南亚的一个大型群岛国家。", "a": "b82c961cdb06"}, {"sp": "", "role": "r", "id": "Indonesia memiliki banyak pulau dan penduduk yang berasal dari berbagai suku dan budaya.", "zh": "印度尼西亚有很多岛屿，居民来自不同的民族和文化。", "a": "aaeee105fa67"}, {"sp": "", "role": "r", "id": "Masyarakat Indonesia dikenal ramah dan terbuka.", "zh": "印度尼西亚人以友善、开放著称。", "a": "b9e9944113fe"}, {"sp": "", "role": "r", "id": "Mengenal Indonesia akan membantu kita lebih mudah beradaptasi dalam kehidupan dan pekerjaan sehari-hari.", "zh": "了解印度尼西亚，能帮助我们更容易适应日常生活和工作。", "a": "6edf3df5ac32"}, {"sp": "", "role": "r", "id": "Bahasa Indonesia adalah bahasa resmi di Indonesia.", "zh": "印尼语是印度尼西亚的官方语言。", "a": "e7a3ef1813bd"}, {"sp": "", "role": "r", "id": "Bahasa ini digunakan di tempat kerja, sekolah, dan dalam kehidupan sehari-hari.", "zh": "这种语言用于工作场所、学校和日常生活。", "a": "1c62a8ea6799"}, {"sp": "", "role": "r", "id": "Bahasa Indonesia tidak memiliki nada dan tata bahasanya relatif sederhana.", "zh": "印尼语没有声调，语法也比较简单。", "a": "0e2590532abf"}, {"sp": "", "role": "r", "id": "Oleh karena itu, bahasa Indonesia mudah dipelajari oleh orang asing.", "zh": "因此，外国人学印尼语很容易。", "a": "c6cbc5a6f5c8"}], "zh": "印度尼西亚是东南亚的群岛大国，有众多岛屿，居民来自不同的民族和文化，当地人以友好、开放著称。了解印尼能帮助我们更快适应生活和工作。印尼语是印尼的官方语言，用于工作、学校和日常生活。印尼语没有声调，语法相对简单，所以外国人比较容易学。", "note": "", "qa": []}, {"id": "c97", "kind": "culture", "book": "BIPA 1", "title": "城市、饮食与景点", "lines": [{"sp": "", "role": "r", "id": "Kota-kota di Indonesia, seperti di negara lain, sebagian besar didominasi oleh bangunan modern, sementara di daerah pedesaan banyak terdapat bangunan dengan ciri khas etnis.", "zh": "和其他国家一样，印尼的城市大多是现代建筑，而农村地区有很多带民族特色的建筑。", "a": "8718c3337b4c"}, {"sp": "", "role": "r", "id": "Karena cuaca yang panas, masyarakat biasanya mandi setidaknya dua hingga tiga kali sehari.", "zh": "因为天气炎热，人们通常每天至少洗两到三次澡。", "a": "f30d804fe165"}, {"sp": "", "role": "r", "id": "Penduduk lokal Indonesia terbiasa makan dengan tangan dan mahir dalam memasak.", "zh": "印尼本地人习惯用手吃饭，而且很擅长做饭。", "a": "0e8447ee01b2"}, {"sp": "", "role": "r", "id": "Setiap daerah memiliki beragam jajanan khas, seperti pisang goreng, bola ketan, kue ketan, dan bakpia.", "zh": "每个地区都有各种特色小吃，比如炸香蕉、糯米球、糯米糕和馅饼。", "a": "400fdcd69726"}, {"sp": "", "role": "r", "id": "Masyarakat pada umumnya menyukai makanan pedas; cabai dan sambal merupakan bumbu yang umum dijumpai di meja makan.", "zh": "人们普遍喜欢吃辣，辣椒和参巴酱是餐桌上常见的调料。", "a": "02bf9e7730cd"}], "zh": "印尼的城市和其他国家一样以现代建筑为主，农村则有许多带民族特色的建筑。因为天气炎热，人们每天通常洗两到三次澡。印尼人习惯用手吃饭，也很会做饭，各地都有丰富的特色小吃，比如炸香蕉、糯米团、糯米糕和馅饼。人们普遍爱吃辣，辣椒和辣椒酱是餐桌上常见的调料。著名景点：四王群岛（巴布亚）、托拉查的 Kete Kesu、粉红沙滩和科莫多岛（东努沙登加拉）、多巴湖（北苏门答腊）、婆罗浮屠（中爪哇）、布罗莫火山（东爪哇）、巴厘岛、布纳肯（北苏拉威西）、山口洋（西加里曼丹）。", "note": "", "qa": []}, {"id": "c98", "kind": "culture", "book": "BIPA 1", "title": "印尼的宗教问候语", "lines": [{"sp": "", "role": "r", "id": "Ada beberapa ujaran salam keagamaan saat berpidato atau berbicara di forum umum.", "zh": "在演讲或在公开场合讲话时，有几种宗教问候语。", "a": "85ac53319c2a"}, {"sp": "", "role": "r", "id": "Ujaran salam itu adalah assalamualaikum, salam sejahtera, om swastiastu, dan namo buddhaya.", "zh": "这些问候语是 assalamualaikum、salam sejahtera、om swastiastu 和 namo buddhaya。", "a": "449a284336ae"}, {"sp": "", "role": "r", "id": "Ujaran salam itu diucapkan untuk menyapa orang Indonesia dari berbagai latar belakang agama.", "zh": "说这些问候语是为了问候不同宗教背景的印尼人。", "a": "5af6e3af3525"}], "zh": "在演讲或公开场合发言时，有几种宗教问候语：assalamualaikum（伊斯兰）、salam sejahtera（基督教等）、om swastiastu（巴厘印度教）和 namo buddhaya（佛教）。说这些问候语是为了向不同宗教背景的印尼人问好。", "note": "", "qa": []}, {"id": "c99", "kind": "culture", "book": "BIPA 1", "title": "印尼人的相识礼节", "lines": [{"sp": "", "role": "r", "id": "Orang Indonesia biasanya berkenalan dengan berjabat tangan.", "zh": "印尼人通常握手认识对方。", "a": "3578de46fdd5"}, {"sp": "", "role": "r", "id": "Umumnya jabat tangan dilakukan dengan tangan kanan.", "zh": "一般用右手握手。", "a": "1d6bf9338f48"}, {"sp": "", "role": "r", "id": "Ada beberapa orang berjabat tangan dengan dua tangan.", "zh": "有些人用两只手握手。", "a": "1b8123353fe2"}, {"sp": "", "role": "r", "id": "Perbedaan jabat tangan itu ada pada ujung jari yang bersentuhan dan tidak bersentuhan.", "zh": "握手的区别在于指尖是否相碰。", "a": "a989227c48cb"}, {"sp": "", "role": "r", "id": "Ada juga budaya cium tangan (salim).", "zh": "还有吻手礼（salim）的文化。", "a": "bff238196822"}, {"sp": "", "role": "r", "id": "Budaya cium tangan biasanya untuk menghormati orang yang lebih tua, misalnya murid kepada guru atau anak kepada orang tua.", "zh": "吻手礼通常是为了尊敬长辈，比如学生对老师、孩子对父母。", "a": "a964bc299b14"}], "zh": "印尼人认识时通常握手，一般用右手。也有人用双手握手，区别在于指尖是否相碰。还有一种吻手礼（salim），通常用来表示对长辈的尊敬，比如学生对老师、孩子对父母。", "note": "", "qa": []}, {"id": "c100", "kind": "culture", "book": "BIPA 1", "title": "礼貌的称呼", "lines": [{"sp": "", "role": "r", "id": "Orang Indonesia biasa memanggil orang yang lebih tua dengan bapak (Pak) dan ibu (Bu).", "zh": "印尼人通常称呼年长的人为 bapak（Pak）和 ibu（Bu）。", "a": "e6cd43e17829"}, {"sp": "", "role": "r", "id": "Sapaan bapak untuk laki-laki dan sapaan ibu untuk perempuan.", "zh": "bapak 用来称呼男性，ibu 用来称呼女性。", "a": "6a706046e201"}, {"sp": "", "role": "r", "id": "Di Pulau Jawa, orang biasa menggunakan sapaan mas untuk laki-laki yang lebih tua dan mbak untuk perempuan yang lebih tua.", "zh": "在爪哇岛，人们常用 mas 称呼年长的男性，用 mbak 称呼年长的女性。", "a": "e75065da2a5e"}, {"sp": "", "role": "r", "id": "Berbeda daerah bisa berbeda sapaan.", "zh": "不同地区的称呼可能不同。", "a": "c51fae49e135"}, {"sp": "", "role": "r", "id": "Orang Batak di Sumatra biasa menggunakan sapaan ito, kakak, dan abang.", "zh": "苏门答腊的巴塔克人常用 ito、kakak 和 abang 来称呼。", "a": "1b1879ce75b1"}, {"sp": "", "role": "r", "id": "Orang Minang biasa menggunakan sapaan uda dan uni.", "zh": "米南人常用 uda 和 uni 来称呼。", "a": "edbd3ace9854"}, {"sp": "", "role": "r", "id": "Orang Sunda biasa menggunakan sapaan teteh dan aa.", "zh": "巽他人常用 teteh 和 aa 来称呼。", "a": "c25963d3b201"}, {"sp": "", "role": "r", "id": "Orang Bali biasa menggunakan sapaan bli dan mbok.", "zh": "巴厘人常用 bli 和 mbok 来称呼。", "a": "fb9ce1125b05"}], "zh": "印尼人通常称呼年长的男性为 bapak（Pak），女性为 ibu（Bu）。在爪哇岛，人们称呼年长男性为 mas、年长女性为 mbak。不同地区称呼不同：苏门答腊的巴塔克人用 ito、kakak、abang；米南人用 uda（哥）和 uni（姐）；巽他人用 aa（哥）和 teteh（姐）；巴厘人用 bli（哥）和 mbok（姐）。", "note": "", "qa": []}, {"id": "c101", "kind": "culture", "book": "BIPA 1", "title": "为什么印尼人会问年龄", "lines": [{"sp": "", "role": "r", "id": "Dalam etika berkenalan di Indonesia, orang kadang-kadang bertanya usia untuk mengenal lebih dekat.", "zh": "在印尼的社交礼仪中，人们有时会问年龄来拉近关系。", "a": "9234e18c9edc"}, {"sp": "", "role": "r", "id": "Di lingkungan kantor, atasan atau senior kerja biasanya akan bertanya usia jika mereka ingin mengetahui pengalaman kerja seseorang.", "zh": "在办公室里，上司或资深同事想了解某人的工作经验时，通常会问年龄。", "a": "1dd34e30eaed"}, {"sp": "", "role": "r", "id": "Terkadang kerabat keluarga yang jarang bertemu juga bertanya usia, misalnya kakek kepada cucunya, paman kepada keponakannya.", "zh": "有时候不常见面的亲戚也会问年龄，比如爷爷问孙子、叔叔问侄子。", "a": "80e36175607f"}, {"sp": "", "role": "r", "id": "Dalam pertemanan, seseorang akan bertanya usia sebagai cara untuk lebih akrab dengan teman yang dikenalnya.", "zh": "交朋友时，人们会问年龄，以此和新认识的朋友更亲近。", "a": "15a27f629e73"}], "zh": "在印尼的交往礼节中，人们有时会问年龄，以便更了解对方。在办公室，上司或前辈想了解一个人的工作经验时常会问年龄；不常见面的亲戚也会问，比如爷爷问孙子、叔叔问侄子。朋友之间问年龄，是拉近关系的一种方式。", "note": "", "qa": []}, {"id": "c102", "kind": "culture", "book": "BIPA 1", "title": "印尼的旅游类型", "lines": [{"sp": "", "role": "r", "id": "Ada beberapa jenis wisata yang digemari masyarakat Indonesia, antara lain wisata alam, wisata religi dan budaya, wisata belanja, dan wisata edukasi.", "zh": "印尼人喜欢的旅游有好几种，包括自然游、宗教文化游、购物游和教育游。", "a": "e6cbc088c634"}, {"sp": "", "role": "r", "id": "Beberapa tempat wisata alam yang menarik antara lain Kepulauan Raja Ampat (Papua), Gunung Rinjani (Pulau Lombok), Kepulauan Belitung, Gunung Bromo (Jawa Timur), Taman Laut Bunaken (Sulawesi Utara), dan Danau Toba (Sumatra Utara).", "zh": "一些有吸引力的自然景点有：四王群岛（巴布亚）、林贾尼火山（龙目岛）、勿里洞群岛、布罗莫火山（东爪哇）、布纳肯海洋公园（北苏拉威西）和多巴湖（北苏门答腊）。", "a": "f4a455a04b61"}, {"sp": "", "role": "r", "id": "Tempat wisata religi antara lain Masjid Istiqlal (Jakarta), Pura Tanah Lot (Bali), Candi Borobudur (Jawa Tengah), Candi Prambanan (Yogyakarta), Gereja Blenduk (Jawa Tengah), dan Patung Yesus (Toraja).", "zh": "宗教景点有：伊斯蒂克拉尔清真寺（雅加达）、海神庙（巴厘岛）、婆罗浮屠（中爪哇）、普兰巴南神庙（日惹）、Blenduk 教堂（中爪哇）和耶稣像（托拉查）。", "a": "78d0d91e2a75"}, {"sp": "", "role": "r", "id": "Untuk wisata belanja ada Pasar Tanah Abang (Jakarta), Pasar Cibaduyut (Bandung), Pasar Seni Sukawati (Bali), dan Pasar Beringharjo (Yogyakarta).", "zh": "购物游有：丹那阿邦市场（雅加达）、Cibaduyut 市场（万隆）、苏卡瓦蒂艺术市场（巴厘岛）和 Beringharjo 市场（日惹）。", "a": "f7217205bb39"}, {"sp": "", "role": "r", "id": "Untuk wisata edukasi ada Taman Mini Indonesia Indah (Jakarta), Taman Pintar (Yogyakarta), Jatim Park 2 (Jawa Timur), dan Kota Tua (Jakarta).", "zh": "教育游有：缩影公园（雅加达）、智慧公园（日惹）、东爪哇公园2号（东爪哇）和老城区（雅加达）。", "a": "b0cb6e3748c9"}], "zh": "印尼人喜爱的旅游类型有：自然游、宗教文化游、购物游和教育游。自然景点：四王群岛（巴布亚）、林贾尼火山（龙目岛）、勿里洞群岛、布罗莫火山（东爪哇）、布纳肯海洋公园（北苏拉威西）、多巴湖（北苏门答腊）。宗教景点：独立清真寺（雅加达）、海神庙（巴厘）、婆罗浮屠（中爪哇）、普兰巴南（日惹）、布伦杜克教堂（中爪哇）、耶稣像（托拉查）。购物：丹那阿邦市场（雅加达）、奇巴杜尤特市场（万隆）、苏卡瓦蒂艺术市场（巴厘）、贝林哈佐市场（日惹）。教育休闲：迷你印尼公园（雅加达）、智慧公园（日惹）、东爪哇公园 2 号、雅加达老城。", "note": "", "qa": []}, {"id": "c103", "kind": "culture", "book": "BIPA 1", "title": "万丹的巴杜伊传统村落", "lines": [{"sp": "", "role": "r", "id": "Suku Baduy di Kabupaten Lebak, Banten, terkenal dengan kearifan lokalnya.", "zh": "万丹省 Lebak 县的巴杜伊族以其本土智慧闻名。", "a": "21651629e67d"}, {"sp": "", "role": "r", "id": "Penduduk laki-laki Suku Baduy bermatapencaharian sebagai petani.", "zh": "巴杜伊族的男人以务农为生。", "a": "981a26c507fb"}, {"sp": "", "role": "r", "id": "Sementara itu, penduduk perempuan berada di rumah untuk menenun kain dan memasak.", "zh": "而女人在家织布、做饭。", "a": "c099bc1976ff"}, {"sp": "", "role": "r", "id": "Aktivitas harian tersebut dilakukan tanpa teknologi sedikit pun, semuanya bergantung pada alam.", "zh": "这些日常活动完全不用任何科技，一切都依靠大自然。", "a": "07d8e54c7f39"}, {"sp": "", "role": "r", "id": "Penduduk perempuan sejak pagi sudah mandi, mencuci pakaian, dan mencuci piring.", "zh": "女人们一早就洗澡、洗衣服、洗碗。", "a": "4e677a73c0b4"}, {"sp": "", "role": "r", "id": "Setelah mandi mereka bersiap untuk memasak.", "zh": "洗完澡后她们准备做饭。", "a": "f4d7452f913f"}, {"sp": "", "role": "r", "id": "Alat masak yang digunakan masih sangat tradisional, yakni menggunakan kayu bakar dan gerabah.", "zh": "用的厨具还非常传统，就是柴火和陶器。", "a": "e3c217a2eb96"}, {"sp": "", "role": "r", "id": "Usai memasak beberapa perempuan melanjutkan kegiatan dengan menenun kain atau menganyam tas dari rotan.", "zh": "做完饭后，有些女人接着织布或用藤编包。", "a": "7bc7dc846f4f"}, {"sp": "", "role": "r", "id": "Anak-anak Baduy Luar bermain seperti anak-anak pada umumnya.", "zh": "外巴杜伊的孩子们和普通孩子一样玩耍。", "a": "54ec8f4b8f36"}, {"sp": "", "role": "r", "id": "Sementara itu, penduduk laki-laki menuju ladang untuk bertani.", "zh": "而男人们去田里干农活。", "a": "993d39bf6402"}, {"sp": "", "role": "r", "id": "Terkadang penduduk Baduy Dalam dengan kostum serbaputih juga turun ke Baduy Luar.", "zh": "有时候穿一身白衣的内巴杜伊人也会下山到外巴杜伊来。", "a": "7dc9c6a45113"}, {"sp": "", "role": "r", "id": "Jika berkunjung ke Indonesia, jangan lupa singgah di desa adat itu, ya!", "zh": "如果来印尼，别忘了去这个传统村落看看哦！", "a": "fb87c6a9a7f7"}], "zh": "万丹省勒巴克县的巴杜伊族以本土智慧闻名。男人以务农为生，女人在家织布、做饭，日常生活完全不用科技，一切依靠大自然。妇女们一早就洗澡、洗衣、洗碗，然后准备做饭，用的仍是柴火和陶器这些传统炊具。做完饭，有些妇女接着织布或用藤条编包。外巴杜伊的孩子们像普通
