<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>印尼语学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>[hidden]{display:none!important}
:root{--prac:#5856d6;--prac-soft:#ecebfc;--learn:#0071e3;--learn-soft:#e4f0fd;--navh:62px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--prac:#7d7aff;--prac-soft:#24234d;--learn:#0a84ff;--learn-soft:#0a2e4d}}
:root[data-theme="dark"]{--prac:#7d7aff;--prac-soft:#24234d;--learn:#0a84ff;--learn-soft:#0a2e4d}
body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:stretch;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-top:1px solid var(--glass-border)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:12px;padding:5px 0;min-height:52px}
.nav a svg{width:23px;height:23px}
.nav a.p.on{color:var(--prac)} .nav a.l.on{color:var(--learn)}
.nav .sep{width:1px;background:var(--line);margin:10px 3px}
.nav .lbl,.nav .nb{display:none}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:210px}
  .nav{top:0;right:auto;width:210px;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;padding:22px 14px;border-top:0;border-right:1px solid var(--glass-border)}
  .nav .nb{display:block;font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 10px 10px}
  .nav .nb small{display:block;font-family:var(--font-body);font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .nav .lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:16px 10px 4px}
  .nav .sep{display:none}
  .nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:11px;font-size:14.5px;padding:9px 12px;min-height:0;color:var(--ink-soft)}
  .nav a svg{width:20px;height:20px}
  .nav a:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
  .nav a.p.on{background:var(--prac-soft)} .nav a.l.on{background:var(--learn-soft)}
}

:root{
  --ground:#f2f2f7; --surface:#ffffff; --surface-2:#e5e5ea;
  --ink:#1c1c1e; --ink-soft:#3a3a3c; --muted:#8e8e93; --line:#d1d1d6;
  --good:#248a3d; --good-soft:#e3f5e8; --bad:#d70015; --bad-soft:#fde4e6;
  --blue:#0071e3; --blue-soft:#e4f0fd; --purple:#8944ab;
  --font-display:"Newsreader","Microsoft YaHei","PingFang SC",Georgia,serif;
  --font-body:"IBM Plex Sans","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --cjk:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --glass:color-mix(in srgb,var(--surface) 74%,transparent);
  --glass-border:color-mix(in srgb,var(--ink) 11%,transparent);
  --glass-hi:color-mix(in srgb,white 30%,transparent);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --good:#30d158;--good-soft:#123320;--bad:#ff453a;--bad-soft:#3d1414;--blue:#0a84ff;--blue-soft:#0a2e4d;--purple:#bf5af2;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#000;--surface:#1c1c1e;--surface-2:#2c2c2e;--ink:#f2f2f7;--ink-soft:#c7c7cc;--muted:#8e8e93;--line:#38383a;
  --good:#30d158;--good-soft:#123320;--bad:#ff453a;--bad-soft:#3d1414;--blue:#0a84ff;--blue-soft:#0a2e4d;--purple:#bf5af2;
  --glass-hi:color-mix(in srgb,white 6%,transparent);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(620px 500px at 8% -6%,color-mix(in srgb,var(--prac) 20%,transparent),transparent 62%),
  radial-gradient(700px 600px at 106% 12%,color-mix(in srgb,var(--purple) 14%,transparent),transparent 60%),
  radial-gradient(560px 520px at 46% 118%,color-mix(in srgb,var(--good) 12%,transparent),transparent 62%)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 30px}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow)}
h1{font-family:var(--font-display);font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-family:var(--cjk);font-size:17px;margin:22px 4px 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;gap:3px;padding:3px;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:10px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink-soft);padding:5px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--prac);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--prac);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{border-radius:16px;padding:12px 10px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--prac);border-radius:9px}
.tasks{display:grid;gap:10px}
.task{display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit;cursor:pointer;font:inherit;text-align:left;width:100%}
.task .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--prac-soft);color:var(--prac);flex-shrink:0;font-size:20px}
.task .ic svg{width:22px;height:22px}
.task b{display:block;font-family:var(--cjk);font-size:16px}
.task small{color:var(--muted);font-size:12.5px}
.task .go{margin-left:auto;font-weight:600;color:var(--prac);white-space:nowrap}
.task.done .go{color:var(--good)}
.set{border-radius:18px;padding:6px 16px}
.set .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set .row:last-child{border-bottom:0}
.set label{font-family:var(--cjk);font-size:14.5px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chips button{font:inherit;font-size:13.5px;font-weight:600;min-width:38px;border:1px solid var(--glass-border);background:var(--surface);color:var(--ink-soft);border-radius:99px;padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{background:var(--prac);border-color:var(--prac);color:#fff}
.set .row{flex-wrap:wrap}
.set > .row > span > button{font:inherit;font-size:14px;border:1px solid var(--glass-border);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer}
.login{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.login{grid-template-columns:1fr}}
.login input{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);min-width:0}
.login input:focus{outline:2px solid var(--prac);outline-offset:1px}
textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);min-height:80px}
.btn{font:inherit;font-size:15.5px;font-weight:600;border:0;background:var(--prac);color:#fff;border-radius:14px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--prac) 30%,transparent)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-border);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* study card */
.card{border-radius:24px;padding:22px 20px;margin-top:14px}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.prog .bar{flex:1;margin:0}
.word{font-family:var(--font-display);font-size:40px;font-weight:700;text-align:center;margin:18px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.ipa{text-align:center;color:var(--purple);font-family:"Segoe UI","Lucida Sans Unicode",var(--font-body);font-size:15px}
.say{display:flex;justify-content:center;margin:10px 0 4px}
.sayb{width:52px;height:52px;border-radius:99px;border:0;background:var(--prac);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--prac) 30%,transparent)}
.sayb svg{width:22px;height:22px}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{font:inherit;font-family:var(--cjk);font-size:15.5px;text-align:left;border:1.5px solid var(--glass-border);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 15px;cursor:pointer}
.opt:hover{border-color:color-mix(in srgb,var(--prac) 45%,transparent)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.detail{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.detail .m{font-family:var(--cjk);font-size:18px;font-weight:600}
.detail .n{font-size:13.5px;color:var(--ink-soft)}
.detail .ex{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.detail .ex .i{font-family:var(--font-display);font-size:16.5px}
.detail .ex .z{font-family:var(--cjk);font-size:13.5px;color:var(--muted)}
.skip{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;transition:border-color .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.opt .om{flex:1;min-width:0}
.oid{font-family:var(--font-display);font-size:16.5px;font-weight:600;color:var(--muted);white-space:nowrap;opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .45s cubic-bezier(.22,1,.36,1);transition-delay:var(--d)}
.opts.rev .oid{opacity:1;transform:none}
.opt.ok .oid{color:var(--good)} .opt.no .oid{color:var(--bad)}
.opts.rev .opt{cursor:pointer}
.opt.ping{animation:ping .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes ping{0%{transform:scale(.97)}100%{transform:none}}
.detail .ex{position:relative;padding-right:48px}
.exs{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:99px;border:0;background:var(--prac-soft);color:var(--prac);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.exs svg{width:15px;height:15px}
.exs.ping{animation:ping .45s cubic-bezier(.34,1.56,.64,1)}
/* dictation */
.din{width:100%;font-family:var(--font-display);font-size:22px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);color:var(--ink);margin-top:14px}
.din:focus{outline:none;border-color:var(--prac);box-shadow:0 0 0 3px var(--prac-soft)}
textarea.din{min-height:96px;font-size:19px;resize:vertical}
.res{margin-top:14px;border-radius:14px;padding:12px 14px}
.res.ok{background:var(--good-soft)} .res.no{background:var(--bad-soft)}
.res .h{font-weight:700;font-family:var(--cjk)}
.res.ok .h{color:var(--good)} .res.no .h{color:var(--bad)}
.diff{font-family:var(--font-display);font-size:19px;line-height:1.6;overflow-wrap:anywhere}
.diff .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.diff .miss{color:var(--bad);border-bottom:2px dotted var(--bad)}
.diff .y{color:var(--good)}
.ans{font-family:var(--font-display);font-size:19px;margin-top:6px}
.zh{font-family:var(--cjk);font-size:14px;color:var(--ink-soft)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.mode{border-radius:18px;padding:14px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mode[aria-pressed="true"]{border-color:var(--prac);box-shadow:0 0 0 3px var(--prac-soft),var(--shadow)}
.mode b{display:block;font-family:var(--cjk);font-size:15.5px}
.mode small{color:var(--muted);font-size:12px;line-height:1.35;display:block;margin-top:2px}
.list{display:grid;gap:8px;margin-top:10px}
.pick{display:flex;align-items:center;gap:10px;border-radius:14px;padding:11px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.pick b{font-family:var(--cjk);font-size:14.5px;font-weight:600}
.pick small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.cloze{font-family:var(--font-display);font-size:18.5px;line-height:2.1;overflow-wrap:anywhere}
.cloze input{font:inherit;font-size:17px;width:7.5em;max-width:60vw;border:0;border-bottom:2px solid var(--prac);background:var(--prac-soft);color:var(--ink);border-radius:6px 6px 0 0;padding:0 6px;text-align:center}
.cloze input.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.cloze input.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.cloze .fix{font-size:14px;color:var(--good);font-weight:600;margin-left:3px}
.zhbox{border-radius:14px;padding:12px 14px;margin-top:12px;font-family:var(--cjk);font-size:14.5px;color:var(--ink-soft)}
.zhbox b{color:var(--ink)}
.center{text-align:center}
.big{font-family:var(--font-display);font-size:48px;font-weight:700;color:var(--prac)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.thead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.date{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--prac);text-transform:uppercase}
.greet{font-size:34px;margin:2px 0 0;line-height:1.1}
.tools{display:flex;align-items:center;gap:8px}
.gear{width:38px;height:38px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer}
.gear svg{width:19px;height:19px}
.hero{border-radius:28px;padding:22px;margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center;}
.rwrap{position:relative;width:132px;height:132px}
.ring{width:132px;height:132px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .rt{stroke:color-mix(in srgb,var(--prac) 14%,transparent)}
.ring .rp{stroke:var(--prac);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rtxt b{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.rtxt b small{font-size:16px;color:var(--muted)}
.rtxt span{font-size:11.5px;color:var(--muted);margin-top:3px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps li{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:12px}
.steps li.cur{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.steps .num{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:12.5px;font-weight:700;border:1.5px solid color-mix(in srgb,var(--prac) 35%,transparent);color:var(--prac);flex-shrink:0}
.steps li.done .num{background:var(--prac);border-color:var(--prac);color:#fff}
.steps li.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.steps b{display:block;font-family:var(--cjk);font-size:15px;line-height:1.3}
.steps small{color:var(--muted);font-size:12px}
.btn.go{grid-column:1 / -1;justify-self:stretch;width:100%;margin-top:12px;font-size:16.5px;padding:15px}
.steps li.skip{opacity:.55}
.steps li.skip .num{border-style:dashed}
.week{border-radius:22px;padding:16px 18px;margin-top:12px}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.wh b{font-family:var(--cjk);font-size:15.5px}
.wh span{font-size:12.5px;color:var(--muted)}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.wd i{font-style:normal;width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--surface-2) 60%,transparent);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.wd.on i{background:var(--prac);color:#fff}
.wd.now i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--prac) 45%,transparent)}
.foot{margin-top:14px;text-align:center}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 4px 8px}
.h2row h2{margin:0}
.btn.flowb{font-size:14px;padding:9px 16px;border-radius:99px}
.syncrow{margin-top:12px}
.syncb{display:flex;align-items:center;gap:12px;width:100%;border-radius:18px;padding:12px 16px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.syncb svg{width:20px;height:20px;color:var(--prac);flex-shrink:0}
.syncb b{display:block;font-family:var(--cjk);font-size:14.5px}
.syncb small{color:var(--muted);font-size:12px}
.syncb .go{margin-left:auto;color:var(--muted);font-size:20px}
.inter{display:block;padding:34px 22px}
.okc{width:64px;height:64px;border-radius:99px;margin:0 auto 6px;background:var(--prac);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;box-shadow:0 8px 22px color-mix(in srgb,var(--prac) 35%,transparent)}
.finish{display:block;padding:30px 22px}
.finish .ring{margin:0 auto;display:block}
.bigt{font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--prac);margin-top:6px}
#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:900px){.panel{bottom:auto;top:50%;transform:translateY(-50%);border-radius:26px;animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 6px}
.panel .chips button:not([aria-pressed]){font-weight:500}
@media (max-width:520px){.hero{grid-template-columns:1fr;justify-items:center;padding:20px 16px}.steps{width:100%}.greet{font-size:30px}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.ring .rp{transition:none}}

/* 收藏星 */

", 0], ["Olahraga adalah aktivitas yang baik bagi tubuh.", "运动对身体有好处。", "1c919f7b4fd7", 0], ["Setelah melakukan kegiatan inti Anda harus melakukan pendinginan.", "做完主要运动后，你必须做放松运动。", "d2df4e132608", 0], ["Ada banyak cara untuk melakukan pendinginan.", "放松运动有很多种做法。", "aef35b6aafd1", 0], ["Berikut adalah salah satu caranya.", "下面是其中一种。", "c75d6a968a4b", 0], ["Pertama, buka kaki selebar bahu.", "第一，两脚分开与肩同宽。", "f9f2f733de38", 0], ["Kedua, pegang pinggang dengan tangan kiri.", "第二，左手叉腰。", "b3a2351cc607", 0], ["Setelah itu gerakkan tangan kanan ke atas dan ke bawah.", "然后右手向上、向下摆动。", "d1995b1e61dd", 0], ["Lakukan hal yang sama dengan tangan kiri.", "左手也做同样的动作。", "4a69cd03a2c5", 0], ["Lakukan hal yang sama dengan kaki kiri.", "左腿也做同样的动作。", "1d050603045f", 0], ["Tahan tiap gerakan selama 8 detik.", "每个动作保持8秒。", "086cc936cdc7", 0], ["Setelah selesai pendinginan hindari meminum minuman bersoda.", "放松运动做完后，避免喝碳酸饮料。", "2211a2a5fbe4", 0], ["Minuman bersoda dapat membuat perut menjadi kembung.", "碳酸饮料会让肚子胀气。", "5ccc70968c95", 0], ["Saya mencoba naik kereta rel listrik (KRL) minggu lalu.", "上周我试着坐了电气列车（KRL）。", "5bb2373cf0a5", 0], ["Saya berangkat dari Bogor ke Jakarta.", "我从茂物出发去雅加达。", "cf821f779a9a", 0], ["Banyak hal yang baru saya temui ketika mencoba naik KRL.", "第一次坐 KRL，我遇到了很多新鲜事。", "babde601ee7c", 0], ["Pertama saya memesan tiket di loket yang ada.", "首先，我在售票窗口买票。", "1a4dfeb5fc37", 0], ["Saya harus menyebutkan stasiun yang ingin saya tuju.", "我得说出要去的车站。", "11147e66e2c4", 0], ["Setelah itu, saya menempelkan tiket di gerbang dan berjalan ke peron untuk menunggu kereta.", "然后，我在闸机上刷票，走到站台等车。", "2bac56f29379", 0], ["Ketika kereta tiba, saya langsung naik.", "列车一到，我马上上车。", "b244513943af", 0], ["Keadaan di dalam kereta cukup sesak.", "车厢里挺挤的。", "2debad9ffbb7", 0], ["Kereta pun tiba di Jakarta.", "列车到了雅加达。", "c32f0d2e309f", 0], ["Saya turun, lalu berjalan keluar stasiun.", "我下车后走出车站。", "297ca52516ed", 0], ["Saya harus menempelkan kembali tiket di gerbang yang telah disediakan.", "我得在指定的闸机上再刷一次票。", "2e7e57cc21cd", 0], ["Pengalaman naik KRL cukup mengasyikkan.", "坐 KRL 的经历挺有意思的。", "2c05a1adb0f4", 0], ["Penumpang memang harus bersabar ketika berada dalam kereta.", "乘客在车上确实要有耐心。", "02195c06d099", 0], ["Namun, tempat tujuan bisa dicapai tepat waktu.", "不过，能准时到达目的地。", "d2e1d40e98e4", 0], ["Tahun lalu, saya dan keluarga pergi ke Raja Ampat.", "去年，我和家人去了四王群岛。", "7595eea47caa", 0], ["Kami pergi ke sana dengan pesawat.", "我们坐飞机去的。", "a4353ee8b006", 0], ["Sesampainya di sana kami langsung masuk ke hotel.", "到了那里，我们直接入住酒店。", "1a2a2e55fdd6", 0], ["Setelah menyimpan barang-barang, kami memulai beragam aktivitas.", "放好行李后，我们开始了各种活动。", "553f5e385821", 0], ["Pada hari pertama, kami bermain di pantai.", "第一天，我们在海滩玩。", "3389eff94700", 0], ["Pantai di Raja Ampat sangat indah.", "四王群岛的海滩非常美。", "4808128823f7", 0], ["Lautnya jernih dan bersih.", "海水清澈干净。", "476247ffd179", 0], ["Kami juga tidak lupa untuk snorkeling.", "我们当然也去浮潜了。", "eb281418ab14", 0], ["Saya melihat banyak ikan yang berwarna-warni.", "我看到很多五颜六色的鱼。", "5ffa3d840beb", 0], ["Setelah itu kami mengunjungi pantai yang berpasir putih.", "之后我们去了白沙滩。", "9b1e97b4b79d", 0], ["Saya dan keluarga tidak lupa untuk berfoto bersama.", "我和家人还一起拍了合照。", "13ef814812b2", 0], ["Pada hari kedua kami pergi ke Air Terjun Batanta.", "第二天我们去了 Batanta 瀑布。", "903a78d7dbc9", 0], ["Airnya bersih dan jernih seperti di pantai.", "瀑布的水像海水一样干净清澈。", "d645214159f9", 0], ["Pada hari ketiga kami pulang ke rumah.", "第三天我们回家了。", "cb9c74d6fe9a", 0], ["Liburan kami terasa amat singkat.", "我们的假期感觉太短了。", "cbb8df51a94d", 0], ["Akan tetapi, saya dan keluarga merasa sangat bahagia.", "不过，我和家人都非常开心。", "6a85134686da", 0], ["Saya ingin kembali ke sana pada lain waktu.", "我想以后再去那里。", "a26d01ab5b46", 0], ["Pada suatu hari saya tiba-tiba merasa sangat mual.", "有一天，我突然觉得非常恶心。", "cfb5b3972022", 0], ["Badan saya terasa demam.", "我身体发烧。", "55c27dbf15d3", 0], ["Otot saya sangat sakit.", "我的肌肉很疼。", "4b53563ed59a", 0], ["Muka saya menjadi sangat pucat.", "我的脸变得非常苍白。", "32f4539448b2", 0], ["Wali kelas mengantar saya ke rumah sakit.", "班主任送我去了医院。", "04ecc029e6dd", 0], ["Setelah diperiksa, saya mengalami gejala demam berdarah.", "检查后，发现我有登革热的症状。", "09f89520f6ac", 0], ["Penyakit ini disebabkan virus yang dibawa oleh nyamuk Aedes aegypti.", "这种病是由埃及伊蚊携带的病毒引起的。", "4aca6bf0e80a", 0], ["Saya langsung dimasukkan ke ruang rawat inap.", "我马上被送进了住院病房。", "6feba15cd5e8", 0], ["Perawat memasang infus di lengan saya.", "护士在我胳膊上打了点滴。", "929cfb971557", 0], ["Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat.", "住院期间我不能吃医院外面的食物。", "7bf8776737ce", 0], ["Saya pun dianjurkan untuk sering meminum air.", "医生还建议我多喝水。", "0165139fc14a", 0], ["Selain itu, saya diminta untuk memakan buah-buahan yang mengandung vitamin C.", "另外，医生让我多吃含维生素C的水果。", "ffdea84b4de3", 0], ["Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit.", "住院期间我只能躺在床上。", "3161d5d43020", 0], ["Akhirnya, saya boleh pulang setelah dirawat selama 5 hari.", "住了5天院以后，我终于可以回家了。", "26a3d3e3d31e", 0], ["Mulai saat itu, saya menjaga kebersihan rumah saya.", "从那时起，我注意保持家里的卫生。", "90e719e24d7b", 0], ["Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "我这样做是为了不再有蚊子。", "1f4fb864e0e0", 0], ["Mengurangi frekuensi buang air besar.", "减少排便次数。", "1151414bddd9", 0], ["Menyerap racun penyebab diare.", "吸附引起腹泻的毒素。", "3e22c5551836", 0], ["Aturan pakai: 5—7 tablet per dosis.", "用法：每次5—7片。", "29217e97f010", 0], ["Eagle Indo Pharma.", "Eagle Indo Pharma 公司。", "f0705cb2900c", 0], ["Tohpati merupakan salah satu gitaris jazz yang terkenal.", "Tohpati 是著名的爵士吉他手之一。", "b387b8a6e6d6", 0], ["Banyak karyanya memadukan elemen kebudayaan tradisional.", "他的很多作品融合了传统文化元素。", "bf9b8a2df915", 0], ["Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "这和他努力在音乐中融合现代与传统元素是一致的。", "a5ac7094c566", 0], ["Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari.", "工作是每个人满足日常生活需要的必需。", "293cfc5078f4", 0], ["Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan.", "以前，在宣读通知之前，印尼人会先敲木梆。", "e4db8afac134", 0], ["Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul.", "木梆的作用是吸引大家的注意，让人们聚过来。", "5fdc8e0d0006", 0], ["Setelah orang-orang berkumpul, pengumuman disampaikan.", "大家聚齐后，再宣布通知。", "1488763912fb", 0], ["Saat ini, kentongan masih dipakai di beberapa daerah di Indonesia.", "现在，印尼一些地区还在用木梆。", "d13f61e0f624", 0], ["Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring).", "现在很多人喜欢用网购 App 买东西。", "e95fd37e4ee6", 0], ["Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah.", "他们觉得用网购 App 买东西更方便。", "935299d84d04", 0], ["Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar.", "有了这种 App，买家不用去商店或市场。", "f6e8b7592905", 0], ["Mereka hanya menunggu barang datang melalui jasa kurir.", "他们只要等快递把东西送来就行。", "ee8b6f3429ba", 0], ["Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama.", "结果，西苏门答腊的仁当再次排名第一。", "601c7c23dfc8", 0], ["Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "有意思的是，CNN 公布的不只有仁当，炒饭也排在了第二名。", "3ba0ce3aa190", 0], ["Salah satu budaya masyarakat Indonesia adalah gotong royong.", "印尼人的文化之一是互助合作（gotong royong）。", "244f3fb3511d", 0], ["Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu.", "gotong royong 的意思是一起干活、互相帮助。", "4945e5397f78", 0], ["Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu.", "互助活动通常在周末进行。", "8813b40cfef1", 0], ["Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "人们通常一起打扫环境、修建公共设施。", "6b1aad8165f4", 0], ["Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day).", "印尼有无车日（Car Free Day）。", "27e71171f0c7", 0], ["Acara itu biasanya dilaksanakan setiap hari Minggu pagi.", "这个活动通常在每个星期天早上举行。", "d7f6ffd0fd29", 0], ["Di beberapa jalan tertentu kendaraan bermotor dilarang melintas.", "在某些路段禁止机动车通行。", "d2605b418c91", 0], ["Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga.", "在那里，有人聊天、摆摊、散步或者运动。", "2c883c5e3b96", 0], ["Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda.", "这个活动上大家最喜欢的事之一是骑自行车。", "06e344605f72", 0], ["Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "因为没有机动车，他们可以悠闲地骑车。", "dba6a7b91e9f", 0], ["Becak adalah salah satu sarana transportasi unik di Indonesia.", "三轮车（becak）是印尼一种独特的交通工具。", "4478a128a4e7", 0], ["Becak adalah kendaraan roda tiga.", "becak 是三个轮子的车。", "654ab46560ff", 0], ["Pengayuh duduk di belakang, sedangkan penumpang duduk di depan.", "车夫坐在后面，乘客坐在前面。", "450ea1d6b508", 0], ["Becak biasanya ada di depan kompleks perumahan atau di depan pasar.", "becak 通常停在住宅区门口或市场门口。", "b23a4c3dc27c", 0], ["Ongkos naik becak berbeda-beda.", "坐三轮车的价钱不一样。", "10345a1d436e", 0], ["Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "所以，乘客和车夫要先讲好价。", "4e5653b9afdd", 0], ["Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida.", "在旅游景点常举办的活动之一是户外拓展训练（mancakrida）。", "ba132c43e6ed", 0], ["Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi.", "参加这种活动的通常是家庭，或者某个公司、机构的员工。", "136073c65777", 0], ["Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan.", "这个活动是为了训练各种技能。", "fc5e084cebda", 0], ["Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama.", "活动的重点是团队合作能力。", "9a308a80d7a7", 0], ["Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "在活动中，参加者可以边玩边练。", "315bb84f232d", 0], ["Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan.", "印尼的传统疗法之一是刮痧（kerokan）。", "f212b0955e16", 0], ["Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh.", "刮痧是一种用钝的东西在身上刮的治疗方法。", "cb362f0fc433", 0]]}, "cloze": {"1": [{"title": "宅家的一周 Minggu Ini di Rumah", "text": "Minggu ini saya memutuskan untuk tidak pergi ke mal atau tempat wisata. Setiap pagi saya bangun jam tujuh, langsung mandi dan memakai baju. Setelah itu, saya sarapan nasi goreng yang dimasak oleh ibu saya, dan saya membantu membersihkan rumah. Sore hari saya menonton film dokumenter tentang hewan di televisi. Saya harus menyelesaikan tugas kuliah sebelum besok pagi. Meskipun hanya di rumah, hari saya terasa penuh dan menyenangkan.", "zh": "这周我决定不去商场，也不去旅游景点。每天早上我七点起床，马上洗澡、穿衣服。之后我吃妈妈做的炒饭当早餐，然后帮忙打扫家里。下午我在电视上看关于动物的纪录片。我必须在明天早上之前完成大学作业。虽然只待在家里，但我这一天过得很充实、很愉快。", "blanks": ["dimasak", "dokumenter", "hewan", "memutuskan", "menyelesaikan", "meskipun", "penuh"], "a": ["89e3aa902594", "bcc9ba0a6953", "2550d3eee01e", "25042779556d", "cb49a5f2c101", "1adf8dad5c10"]}, {"title": "宅家的一周 Minggu Ini di Rumah（版本 B）", "text": "Pada akhir pekan, saya tidak pergi ke mal atau tempat wisata. Saya bangun pukul tujuh pagi. Setelah bangun, saya memakai pakaian. Kemudian, saya membantu ibu membuat nasi goreng untuk sarapan. Setelah itu, saya membantu ibu membersihkan rumah. Kemudian, saya menonton film dokumenter di televisi. Saya merasa kegiatan saya pada hari Minggu sangat sederhana, tetapi sangat berarti bagi saya.", "zh": "周末我不去商场或旅游景点。我早上七点起床。起床后我穿好衣服，然后帮妈妈做炒饭当早餐。之后我帮妈妈打扫房子，然后在电视上看纪录片。我觉得我周日的活动很简单，但对我来说很有意义。", "blanks": ["bagi", "berarti", "dokumenter", "memakai", "pakaian", "sederhana"], "a": ["ce7e9644126c", "9dcc19e44b9c", "425370775e3e", "72bc18c635f2", "20980576938f", "d266a6c0895a", "e92a932d6462"]}, {"title": "周日做饭 Memasak Bersama Ibu", "text": "Pada pagi hari Minggu, Amy membantu ibunya memasak di dapur. Mereka ingin membuat nasi goreng dan sup sayuran sebagai makan siang. Amy mencuci sayuran. Kemudian ibu memotong bawang bombay dan menyiapkan bumbu. Setelah semua bahan makanan siap, mereka mulai memasak bersama. Makanan yang disiapkan sangat sedap. Seluruh anggota keluarga berkumpul di meja makan. Sambil makan, mereka saling berbagi kenangan kehidupan.", "zh": "星期天早上，Amy 在厨房帮妈妈做饭。她们想做炒饭和蔬菜汤当午饭。Amy 洗菜，接着妈妈切洋葱、准备调料。所有食材准备好后，她们开始一起做饭。做好的饭菜非常美味。全家人围坐在餐桌旁，一边吃一边分享生活中的回忆。", "blanks": ["berbagi", "bombay", "disiapkan", "kenangan", "memotong", "seluruh"], "a": ["cce492ef764f", "21359e413fa3", "e530abc5d2fe", "93fb9b28443b", "7a02cabd4be5", "600afb1d3107", "ef44728e374c", "765afa4fb62b"]}, {"title": "理想中的家 Rumah Impian Saya", "text": "Saya membayangkan rumah saya seperti ini. Rumah saya ukurannya tidak perlu terlalu besar, tapi nyaman. Saya ingin ada taman dengan bunga berwarna-warni di dekat rumah. Saya suka rumah yang luas tetapi tidak kosong. Rumah saya punya tiga kamar tidur. Di luar ada tempat untuk bersantai. Saya suka lingkungan yang ramah dan rumah dengan banyak jendela. Banyak jendela bertujuan agar cahaya matahari masuk dengan baik. Dinding rumah saya berwarna biru muda dan hijau muda. Itulah gambaran rumah dalam bayangan saya.", "zh": "我想象中的家是这样的：房子不需要太大，但要舒适。我希望房子附近有一个开满五颜六色花朵的花园。我喜欢宽敞但不空荡的房子。我的家有三间卧室，外面有一个可以休闲放松的地方。我喜欢友好的环境和窗户很多的房子，窗户多是为了让阳光充分照进来。我家的墙是淡蓝色和浅绿色的。这就是我想象中家的样子。", "blanks": ["bersantai", "bertujuan", "cahaya", "gambaran", "itulah", "kosong", "matahari", "membayangkan"], "a": ["0e786669463a", "fbff95066b40", "4f96b4fa6139", "8347c2729c44", "f664a7f784dd", "645345f15de6", "a6e8b5b38ea0", "c0c18c841bd7", "1eff528783ef", "078f84b1fb58"]}, {"title": "（教材同主题）Mila 的家 Rumah Mila", "text": "Meli pergi ke rumah Mila di Bekasi. Dia bercerita tentang rumah Mila kepada temannya, Ben. Rumah Mila sangat bagus. Ukurannya tidak terlalu besar. Di depan rumah ada tempat parkir mobil. Rumahnya bercat hijau dan putih. Genting rumahnya berwarna abu-abu. Rumahnya ber-AC. Di depan rumah ada lahan untuk menanam tanaman. Pintunya berwarna cokelat tua.", "zh": "Meli 去了 Mila 在勿加泗（Bekasi）的家，她跟朋友 Ben 讲了 Mila 家的样子。Mila 的家很漂亮，不太大。房子前面有停车位。房子刷成绿白两色，屋顶瓦片是灰色的。房子里有空调。房子前面有一块种植物的空地。门是深棕色的。", "blanks": ["bekasi", "ber-ac", "genting", "lahan", "menanam"], "a": ["2b3b266d5df5", "bcf468436f6e", "fa8836a93856", "02f1fe4edd55", "35f7bd512931", "4a9d73150e1d", "c9512689062e", "893d41d885c6", "9c35908f1932", "cbe6748719ab"]}, {"title": "海边度假 Liburan ke Pantai", "text": "Setiap liburan, Siti dan keluarganya pergi ke pantai. Mereka berangkat pagi-pagi dengan mobil. Di pantai, mereka bermain pasir, berenang, dan bermain bola. Siti sangat senang melihat laut dan mendengar suara ombak. Mereka juga membawa bekal untuk makan siang di tepi pantai. Pada sore hari, Siti dan keluarganya duduk di bawah pohon sambil menikmati minuman dingin. Siti merasa liburan di pantai sangat berkesan dan menyenangkan. Mereka berharap bisa pergi ke pantai lagi minggu depan.", "zh": "每到假期，Siti 和她的家人都会去海边。他们一大早就开车出发。在海边，他们玩沙子、游泳、玩球。Siti 看着大海、听着海浪声，非常开心。他们还带了自己做的便当，在海边吃午饭。下午，Siti 和家人坐在树下，一边享用冷饮。Siti 觉得在海边度假很难忘、很开心。他们希望下周还能再去海边。", "blanks": ["bekal", "berharap", "berkesan", "menikmati", "ombak", "pagi-pagi", "suara", "tepi"], "a": ["3eca98d211da", "13bdfa4044e0", "e2e642fa566d", "f2209b81e958", "9064873730ba", "923fbd074aa3", "9312bb730f5d", "de2d61ade434"]}, {"title": "逛传统市场 Pasar Tradisional", "text": "Kemarin pagi ibu mengajak saya ke pasar tradisional dekat rumah kami. Pasar itu sangat ramai seperti biasa, terutama di hari Minggu. Ibu membeli banyak kebutuhan mingguan, termasuk beras, minyak goreng, dan bumbu dapur. Kami juga membeli berbagai macam buah segar seperti apel, jeruk, dan pisang. Saya membantu ibu membawa belanjaan yang cukup berat itu. Sesampainya di rumah, kami menyimpan semua belanjaan di dapur. Meskipun capek, saya senang bisa membantu ibu.", "zh": "昨天早上，妈妈带我去我们家附近的传统市场。和往常一样，市场非常热闹，尤其是星期天。妈妈买了很多一周要用的东西，包括大米、食用油和厨房调料。我们还买了各种新鲜水果，比如苹果、橘子和香蕉。我帮妈妈拎那些挺重的东西。一到家，我们就把买的东西都放进了厨房。虽然很累，但能帮到妈妈我很开心。", "blanks": ["apel", "beras", "berat", "capek", "mengajak", "mingguan", "terutama"], "a": ["64ba17c8cf6b", "a544cb31960a", "8fd690ae010d", "186e2ffc5216", "fc7262d6ead5", "de789a2f8461", "5fc551a6904c"]}, {"title": "开学第一天 Hari Pertama Dina di Kampus", "text": "Hari ini adalah hari pertama Dina kuliah. Dina bangun pagi-pagi karena dia tidak mau terlambat. Setelah sarapan, Dina berangkat ke kampus naik bus. Sesampainya di kampus, dia bertemu banyak mahasiswa baru. Mereka mengikuti kegiatan perkenalan dan mendengarkan penjelasan dari dosen. Dina merasa sedikit gugup, tetapi juga bersemangat. Pada waktu istirahat, dia berkenalan dengan beberapa teman baru. Setelah acara selesai, Dina pulang dengan gembira dan tidak sabar untuk belajar minggu depan.", "zh": "今天是 Dina 上大学的第一天。Dina 起得很早，因为她不想迟到。吃完早饭，Dina 坐公交车出发去学校。到了学校，她遇到了很多新同学。他们参加了互相认识的活动，听老师讲解。Dina 感到有点紧张，但也很兴奋。休息的时候，她认识了几个新朋友。活动结束后，Dina 高高兴兴地回家，很期待下周的学习。", "blanks": ["bersemangat", "gembira", "gugup", "mengikuti", "pagi-pagi", "penjelasan", "perkenalan"], "a": ["22dce7aa88b1", "df56b80a7eff", "7e5808139904", "3a5d2e9d462e", "9d1924458028", "1159ff0b7975", "68de20aba3f0", "26c9f86d2b00"]}, {"title": "我的家庭 Keluarga Saya", "text": "Keluarga saya terdiri dari enam orang. Ada ayah yang bekerja sebagai guru dan ada ibu yang mengurus rumah tangga. Saya memiliki dua kakak perempuan dan satu adik laki-laki. Ayah bekerja di sekolah di sekitar rumah kami. Ibu selalu memasak makanan enak untuk kami. Kakak saya sudah punya dua anak yang lucu. Setiap minggu kami berkumpul bersama untuk makan malam dan bercerita tentang aktivitas masing-masing. Kebersamaan dalam keluarga sangat berarti bagi kami.", "zh": "我家一共六口人。爸爸是老师，妈妈操持家务。我有两个姐姐和一个弟弟。爸爸在我家附近的学校工作。妈妈总是给我们做好吃的饭菜。我姐姐已经有两个可爱的孩子了。每个星期我们都会聚在一起吃晚饭，聊聊各自的生活。家人在一起的时光对我们来说非常有意义。", "blanks": ["bercerita", "kebersamaan", "lucu", "masing-masing", "mengurus", "tangga", "terdiri"], "a": ["ccb6d189a7f0", "29339753f161", "dd9a7ce9d281", "1443bbfddb81", "7c2ce7c57340", "b13565638da2", "7ebe9b530343", "aa6a5841761c"]}, {"title": "我的新朋友 Putu Teman Baru Saya", "text": "Saya ingin memperkenalkan teman baru saya. Namanya Putu dan dia berasal dari Bali. Sekarang Putu tinggal di Jakarta untuk kuliah. Usianya dua puluh satu tahun dan dia adalah mahasiswa di Universitas Indonesia. Putu sangat suka memasak makanan tradisional Bali di waktu luang. Dia sering mengajari saya membuat makanan daerahnya. Putu juga pandai menari dan sangat ramah kepada semua orang. Saya senang sekali punya teman baru seperti dia.", "zh": "我想介绍一下我的新朋友。他叫 Putu，来自巴厘岛。现在 Putu 住在雅加达读大学。他今年二十一岁，是印度尼西亚大学的学生。Putu 空闲时非常喜欢做巴厘岛的传统菜，他经常教我做他家乡的菜。Putu 还很会跳舞，对所有人都很友善。有这样一位新朋友，我非常开心。", "blanks": ["kuliah", "luang", "mahasiswa", "memperkenalkan", "menari", "mengajari", "pandai"], "a": ["9136057e64a6", "93a10da7d0a2", "f3c6808b41e7", "91cdac27a248", "4b7792827a41", "89efdfda1f35", "d0b159e81dd7", "c8787737885e"]}, {"title": "我的新朋友 Sarah Teman Baru Saya", "text": "Saya punya teman baru. Namanya Sarah. Sarah berasal dari Inggris. Dia baik, ramah, dan suka menolong. Dia selalu menyapa kami. Di kelas dia juga suka membantu temannya belajar. Namun, Sarah agak cerewet. Di pesta ulang tahunnya, Sarah menelepon semua orang agar datang tepat waktu. Dia juga perfeksionis. Dia mengatur sendiri dekorasi, makanan, dan minuman. Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "我有一个新朋友，她叫 Sarah，来自英国。她人很好、很友善，也乐于助人。她总是主动跟我们打招呼。在课堂上她也喜欢帮同学学习。不过，Sarah 有点爱操心。在她的生日派对上，她给所有人打电话，让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排。她希望活动完美，不出任何差错。", "blanks": ["cerewet", "dekorasi", "menelepon", "mengatur", "menolong", "sempurna", "tahunnya"], "a": ["0e4dd4107038", "323498da4799", "1c11cd0a4abd", "90371bcfa0cf", "331900eb05a7", "451dc614ff5d", "1bd1fcb25174", "ada2eee76b37", "8d8fe2d5c531", "080af4ac5528", "5a3597d61046"]}, {"title": "周六去市图书馆 Ke Perpustakaan Kota", "text": "Pada hari Sabtu, Rudi pergi ke perpustakaan kota bersama temannya. Mereka datang pada pukul sembilan pagi. Di perpustakaan, Rudi mencari buku tentang sejarah Indonesia. Temannya mencari buku cerita dan majalah. Suasana perpustakaan sangat tenang sehingga mereka bisa membaca dengan nyaman. Setelah membaca selama dua jam, mereka meminjam beberapa buku untuk dibawa pulang. Sebelum pulang, mereka membeli minuman di toko dekat perpustakaan.", "zh": "星期六，Rudi 和朋友一起去了市图书馆。他们早上九点到。在图书馆里，Rudi 找关于印尼历史的书，他的朋友找故事书和杂志。图书馆里很安静，所以他们可以舒舒服服地看书。看了两个小时后，他们借了几本书带回家。回家之前，他们在图书馆附近的商店买了饮料。", "blanks": ["majalah", "sabtu", "sehingga", "sejarah", "sembilan", "suasana"], "a": ["37bae1327ebb", "49f8b499b7f3", "4195538cfe25", "65bcf434356a", "f005c0f9179d", "263c0fc8a60c", "dd7388ef77fb"]}, {"title": "Ni Luh 的自我介绍（音频 2.1）", "text": "Kenalkan, nama saya Ni Luh Putu Riyandewi. Usia saya dua puluh empat tahun. Saya berasal dari Bali. Saya tinggal di Tabanan. Saya mahasiswa.", "zh": "认识一下，我叫 Ni Luh Putu Riyandewi。我今年二十四岁，来自巴厘岛，住在塔巴南。我是大学生。", "blanks": ["mahasiswa", "puluh", "usia"], "a": ["eda531cdd12f", "8aa2d4fc4236", "db6d14551293", "d0e78cec1cc6", "4ca665463771"]}, {"title": "Ni Luh 的身份证（KTP）", "text": "KARTU TANDA PENDUDUK — Provinsi Bali, Kabupaten Tabanan. NIK: 3216064205950001. Nama: Ni Luh Putu Riyandewi. Tempat/Tgl Lahir: Tabanan, 02-05-1995. Jenis Kelamin: Perempuan. Gol. Darah: B. Alamat: Jalan Pulau Menjangan, RT/RW 003/010, Kel/Desa Dauh Peken, Kecamatan Tabanan. Agama: Hindu. Status Perkawinan: Belum Kawin. Pekerjaan: Mahasiswa. Kewarganegaraan: WNI. Berlaku Hingga: Seumur Hidup.", "zh": "居民身份证——巴厘省塔巴南县。身份证号：3216064205950001。姓名：Ni Luh Putu Riyandewi。出生地/日期：塔巴南，1995 年 5 月 2 日。性别：女。血型：B。地址：Pulau Menjangan 路，RT/RW 003/010，Dauh Peken 村，塔巴南区。宗教：印度教。婚姻状况：未婚。职业：大学生。国籍：印尼公民（WNI）。有效期：终身。", "blanks": ["berlaku", "hidup", "kabupaten", "status", "tanda"], "a": ["5b7b4201aaf8", "68c27e79e425", "c559bc5e2c79", "03b57216b862", "6bc303f52d7c", "57e640ddf0ab", "44489b0a4013", "32a33e5aa8d1", "f61b0def5222", "54a9352ac766", "ae0fcd909c89", "98ff8fc80231", "acd472c5d1d6"]}, {"title": "认识印尼名人", "text": "Kenalkan, ini Agnes Monica. Dia penyanyi. Dia berasal dari Jakarta. Dia lahir tanggal 1 Juli 1986. / Kenalkan, ini Bapak Joko Widodo. / Kenalkan, ini Rudy Hartono. / Kenalkan, ini Nadiem Anwar Makarim. / Kenalkan, ini Sri Mulyani Indrawati.", "zh": "介绍一下，这是 Agnes Monica，她是歌手，来自雅加达，1986 年 7 月 1 日出生。/ 这是 Joko Widodo 先生（印尼前总统）。/ 这是 Rudy Hartono（羽毛球名将）。/ 这是 Nadiem Anwar Makarim（前教育部长）。/ 这是 Sri Mulyani Indrawati（财政部长）。", "blanks": ["bapak", "juli", "penyanyi"], "a": ["462ea972f44b", "550813a1e059", "a1551e3d01c0", "c81ccae378a2", "814321d93058", "c95823f0ed8b", "952d220da15b", "015b50b704ac"]}, {"title": "Raden 的家（课文 3.1）", "text": "Ini keluarga Raden. Ada ayah, ibu, kakak perempuan, dan Raden. Orang tua Raden namanya Dedi dan Heni. Raden punya kakak perempuan. Namanya Rara. Rara menikah dengan Bayu. Bayu menjadi kakak ipar Raden. Raden punya keponakan. Namanya Tika. Tika memanggil orang tua Raden dengan sebutan kakek dan nenek.", "zh": "这是 Raden 的家。有爸爸、妈妈、姐姐和 Raden。Raden 的父母叫 Dedi 和 Heni。Raden 有一个姐姐，叫 Rara。Rara 嫁给了 Bayu，Bayu 就成了 Raden 的姐夫。Raden 有一个外甥女，叫 Tika。Tika 称呼 Raden 的父母为爷爷和奶奶（外公外婆）。", "blanks": ["ipar", "keponakan", "memanggil", "nenek", "sebutan"], "a": ["30fa8bcf7663", "1109c2680984", "c8509495bd3d", "51ce3c3d15e6", "1a3e15728180", "cdda21f90b69", "3999d5d5d2e8", "902be41ede14", "5c5cd18d6196", "adb64c1dc355"]}, {"title": "生日礼物（课文 4.1）", "text": "Nama saya Mega. Saya anak kedua dari tiga bersaudara. Saya lahir pada tanggal 2 Mei 1996. Tahun ini saya merayakan ulang tahun yang ke-23 di restoran. Teman-teman saya memberi hadiah sebuah jam tangan. Keluarga saya memberi hadiah peralatan melukis. Saat ini saya berkuliah di Jurusan Seni Lukis. Seandainya lulus kuliah nanti, saya ingin menjadi pelukis.", "zh": "我叫 Mega，是家里三个孩子中的老二。我出生于 1996 年 5 月 2 日。今年我在餐厅庆祝了 23 岁生日。朋友们送了我一块手表，家人送了我一套绘画工具。我现在在读绘画专业。假如将来毕业了，我想当一名画家。", "blanks": ["berkuliah", "bersaudara", "jurusan", "lukis", "seandainya"], "a": ["5fe26f1a8f1c", "026f8589dba2", "179b97a2c6bc", "8c05488b86fb", "7f5f3932df02", "511d64a9d153", "63fc3e2afe0b", "5d6c29bb4b39"]}, {"title": "Lia 的生日准备（课文 4.2）", "text": "Lia lahir pada tanggal 10 Oktober 1994. Tahun ini Lia berulang tahun yang ke-25. Bulan depan hari ulang tahun Lia. Lia menyiapkan pesta ulang tahunnya minggu ini. Kemarin Lia mengirim undangan ulang tahun. Besok Lia akan membeli baju ulang tahun. Lusa Lia akan pergi ke toko kue.", "zh": "Lia 出生于 1994 年 10 月 10 日，今年过 25 岁生日。下个月就是她的生日。Lia 这周在准备她的生日派对。昨天她寄出了生日请柬，明天要去买生日穿的衣服，后天要去蛋糕店。", "blanks": ["berulang", "mengirim", "menyiapkan", "oktober", "undangan"], "a": ["a660ae5ef5b8", "31902e16e68c", "4b21966965cf", "69168f89c5e9", "437cec14e59e", "732df4dc4bbd", "b0c357cf9836"]}, {"title": "去瓦埃雷博村旅游（课文 5.1）", "text": "Bulan lalu, saya dan Anjani berwisata ke Wae Rebo, Nusa Tenggara Timur. Kami berdua tiba di Nusa Tenggara Timur pada malam hari. Esoknya, kami berjalan kaki menuju desa Wae Rebo selama empat jam. Di sana ada tujuh rumah adat berbentuk kerucut. Kami menginap di rumah adat itu. Hari berikutnya, kami berkeliling di desa Wae Rebo. Desa ini bercuaca dingin. Kami berbaju tebal. Kami juga berfoto dengan penduduk desa Wae Rebo. Sebelum pulang, kami berbelanja oleh-oleh. Kami membeli roti kompiang dan kopi Flores. Roti kompiang bertabur wijen dan berasa gurih. Sementara itu, kopi Flores beraroma sedap dan wangi. Malam harinya, kami pulang ke Jakarta.", "zh": "上个月，我和 Anjani 去东努沙登加拉的瓦埃雷博村旅游。我们俩晚上到达东努沙登加拉。第二天，我们步行四个小时前往瓦埃雷博村。那里有七座圆锥形的传统房屋，我们就住在里面。再下一天，我们在村里四处转了转。这个村子天气很冷，我们穿着厚衣服，还和村民合了影。回家前我们买了特产：馄饨饼和弗洛勒斯咖啡。馄饨饼上撒着芝麻，味道香脆；弗洛勒斯咖啡则香气浓郁。当天晚上，我们回到了雅加达。", "blanks": ["beraroma", "berasa", "berbaju", "bercuaca", "berdua", "bertabur", "gurih", "kerucut", "wangi", "wijen"], "a": ["fd8fce4d3ad6", "e504b015a481", "5a56dd9b1d12", "222bd3348c6b", "ffb7a4b4b420", "528af45dbf0a", "82a6689919be", "ac970f35d5b5", "b1e69522bbd9", "e0d2e04c8c7d", "40cdf8555bb4", "bdf66b0ec85c", "b1ccb82fe66a", "1cf498822e59"]}, {"title": "Rani 的星期天（音频 6）", "text": "Setiap hari Minggu saya bangun siang. Setelah itu, saya mandi. Saya lalu membaca buku. Saya juga makan camilan. Saya mencuci baju. Sebelum itu, saya berbelanja di pasar. Setelah itu, saya masak. Kemudian, saya makan siang. Saya juga tidur siang. Sore hari saya bersepeda berkeliling kampung.", "zh": "每个星期天我都起得很晚。之后我洗澡，接着看书，还吃点零食。我洗衣服，在那之前我先去市场买东西。之后我做饭，然后吃午饭，还睡午觉。下午我骑自行车在村子里转一圈。", "blanks": ["berkeliling", "bersepeda", "camilan", "kampung", "mencuci"], "a": ["9ec621d55df1", "2beb156dd853", "57df5231ab5c", "0900b0ddb6cf", "af3f27353e19", "98b28e2f6d54", "3ded1789a16c", "83b1180ea4a7", "334a00d0ecd6", "9cb733266dc8"]}, {"title": "Dina 的一天（课文 6.1）", "text": "Hai, saya Dina. Saya akan bercerita tentang kegiatan harian saya. Pada pagi hari biasanya saya bangun pukul 05.00. Setelah salat subuh, saya mandi dan berpakaian kerja. Saya tidak pernah lupa untuk salat. Saya sarapan sekitar pukul 06.00. Saya bekerja pada pukul 08.00—16.00. Saya selalu makan siang di kantin pukul 12.00—13.00. Selesai bekerja, saya langsung pulang ke rumah. Saya biasanya sampai rumah pukul 17.00. Jika jalanan macet, kadang-kadang saya sampai di rumah pukul 18.00. Saya agak malas makan malam. Jadi, saya menonton televisi atau membaca buku. Lalu, saya tidur sekitar pukul 22.00. Pada akhir pekan saya sering pergi menonton film di bioskop dengan teman-teman. Saya jarang ada di rumah.", "zh": "你好，我是 Dina，我来讲讲我的日常。早上我通常五点起床，做完晨礼后洗澡、换上工作服。我从不忘记礼拜。我大约六点吃早饭。我的工作时间是八点到十六点，总是在十二点到十三点之间在食堂吃午饭。下班后我直接回家，通常十七点到家；如果路上堵车，有时十八点才到。我有点懒得吃晚饭，所以就看电视或看书，然后大约二十二点睡觉。周末我常和朋友们去电影院看电影，很少待在家里。", "blanks": ["bercerita", "berpakaian", "harian", "jadi", "jalanan", "macet", "malas", "pernah", "salat", "subuh"], "a": ["29b130df579e", "c6d5c943b73c", "afd86a6d47d0", "ea957dfdd3f9", "f34fbf020d63", "075245a8fbe5", "5488bf067d40", "9785f31566f5", "1ef4fc67eef9", "ff8a322c7eba", "88a96ea9f500", "10d0709c5afc", "a2d6f5dc3907", "3324668f9b56", "9b1a3c2fcdc1", "7ad08b28ac9a"]}, {"title": "勤奋的 Lisa（课文 6.2）", "text": "Adik Santi sangat rajin. Namanya Lisa. Ia sudah bangun pada pukul 04.00. Setiap pukul 04.30 pagi dia akan membangunkan Santi. Pada pukul 06.30 Lisa sudah sampai di kampus. Semua tugas sudah dikerjakan Lisa setiap hari pada pukul 19.00—21.00. Ketika dosen sedang menerangkan pelajaran, Lisa akan mendengarkan dengan cermat. Begitulah aktivitas Lisa setiap hari.", "zh": "Santi 的妹妹很勤奋，她叫 Lisa。她四点就起床了，每天早上四点半叫醒 Santi。六点半 Lisa 已经到了学校。每天晚上七点到九点，她把所有作业都做完。老师讲课时，Lisa 会认真听讲。这就是 Lisa 每天的生活。", "blanks": ["begitulah", "cermat", "dikerjakan", "membangunkan", "menerangkan"], "a": ["9b94b362fbe3", "6dddbd40aa94", "60b36c72b10e", "e818faef48e7", "a1dadc7782e2", "ba51b787d010", "e7ca0d82e8fc", "fd4d6b0b77e7"]}, {"title": "在市场购物（音频 7.2）", "text": "Hai, nama saya Yoyo. Saya koki. Saya hobi berbelanja ke pasar. Hari ini saya dan teman saya pergi ke pasar. Biasanya kami membeli banyak bahan makanan. Di pasar ada gula, jeruk, garam, kopi, dan lombok. Gula rasanya manis. Jeruk rasanya asam. Garam rasanya asin. Kopi rasanya pahit. Lombok rasanya pedas. Kami juga pergi ke pujasera (pusat jajanan serba ada). Di situ ada banyak makanan. Ada soto, bakso, mi ayam, rendang, opor ayam, gado-gado, satai, dan ayam goreng. Kamu suka bakso? Bakso dari daging sapi, ayam, atau ikan. Teksturnya kenyal dan berserat. Kami juga pesan minuman. Ada es teh, kopi, es jeruk di pujasera. Es teh rasanya manis. Kopi rasanya pahit. Es jeruk rasanya masam.", "zh": "嗨，我叫 Yoyo，是个厨师。我的爱好是去市场买东西。今天我和朋友去了市场，我们通常会买很多食材。市场里有糖、橘子、盐、咖啡和辣椒。糖是甜的，橘子是酸的，盐是咸的，咖啡是苦的，辣椒是辣的。我们还去了美食广场，那里有很多吃的：索托汤、肉丸、鸡肉面、仁当、椰奶炖鸡、加多加多、沙爹和炸鸡。你喜欢肉丸吗？肉丸是用牛肉、鸡肉或鱼肉做的，口感有嚼劲、有纤维感。我们还点了饮料，美食广场有冰茶、咖啡和冰橙汁。冰茶是甜的，咖啡是苦的，冰橙汁是酸的。", "blanks": ["asam", "asin", "koki", "masam", "opor", "pusat", "sapi", "satai", "serba", "situ"], "a": ["8fba95704f76", "96df968890d7", "04d0433b90ec", "5c485eb6c73c", "ae437b058afe", "529aec3b41a9", "afcfb645d32c", "8d91c394eac1", "4341f32a4d72", "e771a4613624", "ee50fc4ca67b", "41c6b5a5c742", "f85b29519816", "35cf44df36d0", "20ca253ab70f", "1e16a6ecda03", "ace10ca9739a", "889149b49893", "a442fb0e74b7", "32c468a01255", "e771a4613624", "114acf594164"]}, {"title": "我的周末（音频 7.3）", "text": "Hai, saya Sarah. Saya sangat suka berenang. Saya biasanya berenang di akhir pekan. Kadang-kadang selain berenang, saya joging. Namun, saya kurang suka joging. Selain joging, saya kadang-kadang bermain badminton. Saya suka bermain badminton. Namun, bermain badminton tidak bisa sendiri. Pokoknya saya sangat suka berolahraga. Saya tidak suka tidur atau diam di rumah pada akhir pekan. Saya juga sangat suka memasak di akhir pekan. Saya senang mencoba resep baru. Selain memasak, kadang-kadang saya pergi ke mal dengan teman. Kami ke mal untuk berjalan-jalan atau menonton film di bioskop. Namun, saya lebih suka berolahraga dan memasak.", "zh": "嗨，我是 Sarah。我非常喜欢游泳，通常周末去游泳。除了游泳，有时我也慢跑，不过我不太喜欢慢跑。除了慢跑，我有时打羽毛球，我喜欢打羽毛球，但羽毛球一个人打不了。总之我非常喜欢运动，周末不喜欢睡觉或待在家里。周末我也很喜欢做饭，喜欢尝试新菜谱。除了做饭，有时我和朋友去商场逛逛或去电影院看电影。不过，我还是更喜欢运动和做饭。", "blanks": ["badminton", "berjalan-jalan", "bioskop", "diam", "joging", "kurang", "mencoba", "pokoknya", "resep", "sendiri"], "a": ["7499f1c1620a", "cce3f7f2e6da", "86743ce34b84", "5891e90464fc", "bc10f1692648", "3eb549541c14", "544ed83ebb75", "c65d2891bd32", "ad4335caebed", "ab22f81769c2", "c9a01dfa6e5e", "6f893eefc38d", "c7f8e1653745", "b1f35cf2414e", "e645c0c7654a"]}, {"title": "我的爱好（课文 7）", "text": "Hobi saya memasak. Saya sangat suka memasak aneka hidangan. Setiap hari saya menghabiskan banyak waktu di dapur. Masakan kesukaan saya adalah rendang. Saya juga suka memasak gorengan dan panggangan. Selain hobi masak, saya juga hobi mengoleksi peralatan masak. Saya senang jika peralatan masak saya lengkap. Saya punya kompor, wajan, dan panci. Saya juga punya spatula, pisau, dan talenan. Jadi, saya bisa masak apa saja dengan alat lengkap.", "zh": "我的爱好是做饭，我非常喜欢做各种菜，每天都在厨房待很久。我最爱的菜是仁当，也喜欢做油炸和烤制的食物。除了做饭，我还喜欢收集厨具，厨具齐全我就很开心。我有炉灶、炒锅和汤锅，还有锅铲、刀和切菜板。所以，有了齐全的工具，我什么菜都能做。", "blanks": ["aneka", "gorengan", "hidangan", "masakan", "panci", "panggangan", "wajan"], "a": ["be52d6da38b3", "b3f9456ba0d9", "3cc60ff37149", "57a025a5fdca", "2e0274179c18", "793eca899fd5", "0ac741ad8115", "26ca21199549", "174b716df46d", "dfbdafe5828b"]}, {"title": "我的新朋友 Sarah（音频 8.1）", "text": "Saya punya teman baru. Namanya Sarah. Sarah berasal dari Inggris. Dia baik, ramah, dan suka menolong. Dia selalu menyapa kami. Di kelas dia juga suka membantu temannya belajar. Namun, Sarah agak cerewet. Di pesta ulang tahunnya Sarah menelepon semua orang agar datang tepat waktu. Dia juga perfeksionis. Dia mengatur sendiri dekorasi, makanan, dan minuman. Dia ingin acaranya sempurna dan tidak ada yang salah.", "zh": "我有一个新朋友，叫 Sarah，来自英国。她人很好，友善又乐于助人，总是主动跟我们打招呼，在课堂上也喜欢帮同学学习。不过 Sarah 有点爱操心：她的生日派对，她给每个人打电话让大家准时到。她还是个完美主义者，装饰、食物和饮料都亲自安排，希望活动完美、不出任何差错。", "blanks": ["cerewet", "dekorasi", "menelepon", "mengatur", "menolong", "sempurna", "tahunnya"], "a": ["f8f60be05097", "e7e530778d89", "b6a5b9e7a1fe", "757ad3eacb56", "24bfb375d4eb", "68f6331eb390", "d6548fe40e13", "9b80cc1c8a68", "8e32f22ddd32", "47f5a3137c56", "25fb6b989a7c"]}, {"title": "Beni 和 Toni（音频 8.2）", "text": "Beni adalah temanku. Dia sangat pendiam. Dia suka menyendiri di kantor. Dia jarang menyapa orang lain. Dia juga jarang berkumpul dengan teman-teman lain. Dia punya teman dekat. Namanya Toni. Toni berbeda dengan Beni. Toni sangat periang. Toni selalu ramah kepada siapa pun. Toni sangat sabar menghadapi Beni. Namun, Toni agak pemarah. Dia sangat perfeksionis. Dia akan marah melihat orang malas.", "zh": "Beni 是我的朋友。他非常沉默，在办公室喜欢独处，很少跟别人打招呼，也很少和其他朋友聚在一起。他有一个好朋友叫 Toni。Toni 和 Beni 不一样，Toni 很开朗，对谁都很友好，对 Beni 也很有耐心。不过 Toni 有点爱发火，他是个完美主义者，看到别人偷懒就会生气。", "blanks": ["berbeda", "malas", "marah", "menghadapi", "menyendiri", "pemarah"], "a": ["59913a1f54d0", "3d21b8fb4e4e", "8d1882829232", "e423dbc9acd1", "ff1295162c0a", "1c58311ac4de", "e1f97964bbc9", "3a2835042e17", "f09f2ee207ca", "458b17fee935", "19cc15711699", "1dba0eed9d27", "156c64f8b207", "a51e484ce082"]}, {"title": "Fauzi 的性格（课文 8.1）", "text": "Fauzi adalah orang yang teratur. Dia tidak pintar, tetapi tekun. Dia bukan pemalas. Dia juga rajin merapikan lemari pakaiannya. Dia tidak tidur jika tugas belum selesai. Semua orang tahu hal itu. Di kantor dia sangat rajin. Setiap bekerja bersama Fauzi, ia akan mengerjakan semua pekerjaan sendirian. Namun, ia bermaksud baik. Dia ingin membantu temannya. Rekan kantornya senang berteman dengan Fauzi.", "zh": "Fauzi 是个有条理的人。他不聪明，但很勤勉，他不是懒人。他也经常整理自己的衣柜。作业没做完他就不睡觉。大家都知道这一点。在办公室他非常勤奋，每次和 Fauzi 一起工作，他都会一个人把所有活儿干完。不过他是出于好意，他想帮助朋友。办公室的同事都很乐意和 Fauzi 交朋友。", "blanks": ["bermaksud", "mengerjakan", "merapikan", "pemalas", "sendirian", "teratur"], "a": ["03e9da21649e", "3b9de7ef70a6", "0418c81b7158", "7cf26ef2c2d5", "1f60f46174a9", "aabc5fc526ed", "30ca62a16e89", "e4dee6242102", "2c6f77823ce2", "2fda9664cd9a", "e1300c1db2af"]}, {"title": "我的同事们（课文 8.2）", "text": "Hai, nama saya Yoyo. Saya sedang berada di kantor. Saat ini di kantor ada Datil, Doni, Didik, dan Fadil. Datil baik hati dan tenang. Doni rajin dan cekatan. Didik pendiam, tetapi ramah. Fadil periang dan lucu. Beberapa teman lain tidak ada di kantor. Sebenarnya, ada Laras, Ayu, Putri, dan Roslia. Laras cerdas dan perfeksionis. Ayu sabar dan pintar. Putri perhatian dan cekatan. Roslia tekun dan tegas.", "zh": "嗨，我叫 Yoyo，我现在在办公室。现在办公室里有 Datil、Doni、Didik 和 Fadil。Datil 心地好又沉稳，Doni 勤奋又麻利，Didik 话少但友好，Fadil 开朗又风趣。还有几位同事不在办公室，她们是 Laras、Ayu、Putri 和 Roslia。Laras 聪明，是完美主义者；Ayu 耐心又聪明；Putri 体贴又麻利；Roslia 勤勉又果断。", "blanks": ["cekatan", "cerdas", "hati", "lucu", "pintar", "sebenarnya", "tekun"], "a": ["4f2eba8aa2c8", "f1d226c8e853", "e658894f5506", "8aa96ffe8ba0", "8d6ff1ab7c91", "eca220fca42f", "1c12f9994da7", "11f0acdb8ded", "6de804521489", "3f879e5455b0", "ab4b10b660d6", "7c3f9f4b0a05", "67b965d6897b"]}, {"title": "Santi 的卧室（音频 9.1）", "text": "Ini gambar kamar tidur saya. Di kamar saya ada banyak benda. Di samping pintu kamar ada lampu. Di dekat lampu ada televisi. Di seberang televisi ada tempat tidur. Tempat tidur saya berada di tengah kamar. Karpet ada di antara kasur dan televisi. Lemari ada di pojok kamar. Di dalam lemari ada baju saya. Di samping kanan dan kiri tempat tidur saya ada meja kecil. Radio ada di atas meja kecil. Ada sofa kecil di bawah AC.", "zh": "这是我卧室的图。我的房间里有很多东西。房门旁边有一盏灯，灯旁边有一台电视，电视对面是床。我的床在房间中央。地毯在床和电视之间。衣柜在房间的角落，衣柜里是我的衣服。床的左右两边各有一张小桌子，收音机放在小桌子上。空调下面有一张小沙发。", "blanks": ["gambar", "karpet", "kasur", "pintu", "pojok", "radio", "sofa", "tengah"], "a": ["ac73c582ebe5", "3747fcb6654f", "50688b5c85e9", "c1bac7b3c494", "8c3f3a7051cb", "0d9f1d6183d7", "abd816c10105", "02f7d8887e7f", "d29d6a44b8d6", "e493439d8ac7", "b9dfe9af5234", "cc6b83000893"]}, {"title": "去参加婚礼（音频 9.2）", "text": "Teman saya, Wina, menikah hari Sabtu lalu. Saya pergi ke gedung pernikahannya. Saya berangkat dari Gerung. Dari Gerung saya ke Barat sampai bertemu pertigaan. Di ujung pertigaan ada Balai Desa Sekotong. Dari Balai Desa Sekotong, saya ke arah Selatan. Saya melewati SD Sekotong II di kanan jalan. Saya belok kanan masuk ke gang yang ada di antara SD Sekotong II dan sawah. Di pertigaan kedua saya belok kanan. Gedung pernikahan tepat berada di ujung jalan, menghadap ke Selatan.", "zh": "我的朋友 Wina 上周六结婚了，我去了她的婚礼礼堂。我从 Gerung 出发，往西走到一个三岔路口，路口尽头是 Sekotong 村委会。从村委会我往南走，经过路右边的 Sekotong 第二小学。我右转进入 Sekotong 第二小学和稻田之间的小巷，在第二个三岔路口再右转。婚礼礼堂就在路的尽头，朝南。", "blanks": ["balai", "barat", "gang", "melewati", "menghadap", "sabtu", "sawah", "selatan"], "a": ["27e1db50fd05", "dfdf34bdc17a", "19757e38d2bc", "4968951112f4", "255e18ffc804", "d5125f05fc67", "496419ea486b", "42d53e020471", "777c0265ea1c", "06e8f973575d"]}, {"title": "楠榜游记（课文 9.1）", "text": "Pada akhir tahun lalu saya berkunjung ke Lampung. Kami berjalan-jalan ke beberapa tempat di Lampung. Di sana ada mal, universitas, dan tempat makan. Kami memulai perjalanan dari pompa bensin. Di sebelah kiri pompa bensin ada sebuah universitas. Kampusnya besar sekali. Di seberang pompa bensin ada beberapa universitas lain. Ada IBI Darmajaya, Universitas Bandar Lampung, dan IAIN Lampung. Setelah mengisi bensin, saya dan keluarga pergi makan di Restoran Padang. Restoran itu ada di antara Warung Gudeg Jogja dan Warung Penyet Idola. Di seberang restoran ada toko kelontong. Selesai makan, kami pergi ke mal. Mal itu terletak di persimpangan jalan ke arah Way Halim. Dari mal kami pergi ke rumah saudara. Rumahnya ada di belakang Warung Gudeg Jogja.", "zh": "去年年底我去了楠榜，我们在楠榜逛了几个地方，那里有商场、大学和餐馆。我们从加油站出发。加油站左边有一所大学，校园非常大；加油站对面还有几所大学：IBI Darmajaya、楠榜港大学和楠榜国立伊斯兰学院。加完油后，我和家人去巴东餐馆吃饭，那家餐馆在日惹菠萝蜜炖菜馆和 Idola 压扁炸鸡馆之间，餐馆对面有一家杂货店。吃完饭我们去了商场，商场位于通往 Way Halim 方向的路口。离开商场后我们去了亲戚家，他们家在日惹菠萝蜜炖菜馆后面。", "blanks": ["darmajaya", "iain", "idola", "memulai", "mengisi", "padang", "penyet", "perjalanan", "persimpangan", "terletak"], "a": ["cdb7250dbf01", "15957e34c0a7", "393b01044fcf", "bfce17147ede", "868d540641fe", "2018ee1f0a9a", "07f75ba6b402", "9ea370d4c4f4", "31902fbf903f", "dba0f5641948", "81a9852d5f84", "f43c8627c137", "529a0f1b6110", "eda6acaa90a4", "c8685f327df6"]}, {"title": "Sari 的新教室（课文 9.2）", "text": "Hai, nama saya Sari. Hari ini saya masuk kelas baru. Ada papan tulis besar di dalam kelas. Spidol dan penghapus ada di bawah papan tulis. Di sebelah kiri papan tulis ada lemari. Di dalam lemari ada banyak buku. Meja dan kursi Bu Sinta ada di depan lemari. Di seberang meja Bu Sinta ada meja dan kursi saya. Tempat duduk saya berhadapan dengan tempat duduk Bu Sinta. Di sebelah kanan saya ada banyak bangku dan meja. Pintu ada di sisi kanan ruang kelas. Peta ada di antara gambar pahlawan dan jam dinding. Siswa di sebelahku bernama Anton. Di belakang Anton ada Novi dan Putri.", "zh": "大家好，我叫 Sari，今天我进了新班级。教室里有一块大黑板，马克笔和板擦在黑板下面。黑板左边有一个柜子，柜子里有很多书。Sinta 老师的桌椅在柜子前面，老师桌子对面是我的桌椅，我的座位正对着老师的座位。我右边有很多长凳和桌子。门在教室右侧。地图挂在英雄像和挂钟之间。坐我旁边的同学叫 Anton，Anton 后面是 Novi 和 Putri。", "blanks": ["berhadapan", "bernama", "gambar", "kursi", "pahlawan", "papan", "penghapus", "pintu", "sisi", "spidol"], "a": ["e373352c6383", "b076de40d1a6", "54312b5aa970", "5357510bdb09", "40860f74f86a", "018bf2512df4", "d538f92d3853", "c001bcfdb455", "d763dd848c15", "7926e3e6cd60", "58b3c21de13d", "d9a41b71d1f1", "0468b69d6e7c", "d7167f3c3b77"]}, {"title": "Mila 的家（音频 10.1）", "text": "Rumah Mila sangat bagus. Ukurannya tidak terlalu besar. Di depan rumah ada tempat parkir mobil. Rumahnya bercat hijau dan putih. Genting rumahnya berwarna abu-abu. Rumahnya ber-AC. Di depan rumah ada lahan untuk menanam tanaman. Pintunya berwarna cokelat tua.", "zh": "Mila 的家很漂亮，不算太大。房子前面有停车位，房子刷成绿白两色，屋顶瓦片是灰色的，屋里有空调。房子前面有一块种植物的空地，门是深棕色的。", "blanks": ["ber-ac", "genting", "lahan", "menanam"], "a": ["f2153c7e8b60", "f76bc2da7deb", "481fec63f1b8", "3e1f2b26cbdc", "446e6ed3a6a3", "ce175d696cb8", "bef589458ae8", "d59da16e6183"]}, {"title": "Meli 要带的东西（音频 10.2）", "text": "Besok saya akan merantau ke Jakarta untuk bekerja. Saya akan membawa banyak barang. Namun, beberapa barang tidak saya bawa. Saya akan membawa sepatu pantofel hitam, kaus kaki cokelat, rok berwarna hitam, dan kemeja putih. Saya juga perlu membawa blazer ungu dan jaket merah. Saya juga membawa jam tangan berwarna biru dan gelang berwarna merah. Saya tidak membawa topi, baju olahraga, celana panjang, dan syal. Saya juga tidak membawa boneka kesayangan saya. Saya tidak membawa semua barang.", "zh": "明天我要去雅加达打拼工作，我会带很多东西，不过有些东西我不带。我会带黑色皮鞋、棕色袜子、黑色裙子和白衬衫，还要带紫色西装外套和红色夹克，还有蓝色手表和红色手链。我不带帽子、运动服、长裤和围巾，也不带我心爱的玩偶。我不会把所有东西都带上。", "blanks": ["bawa", "blazer", "gelang", "kaus", "merantau", "syal", "topi", "ungu"], "a": ["8f044bb06b6a", "b342f4f9fcc9", "9444d8746dc5", "7b06d2d0fedf", "9c7620e13792", "fa70e980e750", "0ca3335e51e4", "842003066f76", "fe5e73699965"]}, {"title": "出租屋广告（课文 10.1）", "text": "Hunian Sewa Eksklusif di Jakarta Selatan. Lingkungan nyaman dengan fasilitas lengkap. Dekat dengan Kawasan Bisnis TB Simatupang. Cocok untuk corporate housing dan keluarga muda. — Hunian 2 lantai dengan ruang makan + duduk, kamar tidur, dapur, dan kamar mandi. Fully furnished; termasuk AC, double bed, 1 set meja makan kayu, kompor, dispenser, dll. Akses internet. Laundry service. Cleaning service. Penjaga keamanan 24 jam. Parkir motor dan mobil. — Ketentuan harga: 1 kamar (45 m², 12 unit): Rp1.750.000/bulan. 2 kamar (56 m², 2 unit): Rp2.200.000/bulan. Minimal sewa 3 bulan (deposit 1 bulan). — GRIYA SELARAS BENDA. Lokasi: Jl. Makmur Ceria RT 03/RW 010, Ciganjur, Jagakarsa, Jakarta 12630.", "zh": "南雅加达高档出租公寓。环境舒适，设施齐全，靠近 TB Simatupang 商务区，适合企业员工宿舍和年轻家庭。——两层住宅，含餐厅兼客厅、卧室、厨房和浴室。全套家具：空调、双人床、一套木制餐桌、炉灶、饮水机等。有网络、洗衣服务、保洁服务、24 小时保安，可停摩托车和汽车。——价格：一室（45 平方米，共 12 套）每月 175 万盾；两室（56 平方米，共 2 套）每月 220 万盾。最短租期 3 个月（押金 1 个月）。——Griya Selaras Benda，地址：Jagakarsa 区 Ciganjur，Makmur Ceria 路 RT 03/RW 010，雅加达 12630。", "blanks": ["cocok", "deposit", "dispenser", "hunian", "kayu", "keamanan", "ketentuan", "motor", "parkir", "simatupang"], "a": ["df8ffffbfb0a", "009fe48fb7e5", "5572f92209b0", "9caa298d6d82", "b0d0f1f1d218", "d12fde89da6f", "fe67dd9efc09", "38c17bcaf24e", "f846cfd87c5d", "0c887306f38c", "7cad256149ff", "f17bf6420660", "dfb8f3c8832a", "89b053354a70", "b81f10bb0852", "d03099c170a5", "273f0f318a49"]}, {"title": "Meli 的出租屋（课文 10.2）", "text": "Rumah indekos Meli besar dan cantik. Di sana ada sepuluh kamar tidur. Satu kamar tidur berkamar mandi satu. Rumah indekosnya bercat warna-warni. Ada warna putih, biru, hitam, merah, dan abu-abu. Rumahnya berbentuk persegi panjang. Di sisi kiri dan kanan rumahnya ada pohon tinggi berdaun hijau. Ada juga bunga berwarna merah muda dan ungu. Di belakang rumah indekos Meli ada taman. Taman itu ada kolam ikannya. Ada ikan yang berwarna hitam dan emas. Di taman juga ada bangku panjang berwarna hitam. Di depan bangku ada meja berbentuk bulat dan berwarna cokelat. Di taman juga ada banyak batu besar berwarna abu-abu.", "zh": "Meli 住的出租屋又大又漂亮，有十间卧室，每间卧室带一个浴室。出租屋刷得五颜六色：白、蓝、黑、红和灰。房子是长方形的，左右两边种着绿叶高树，还有粉色和紫色的花。出租屋后面有一个花园，花园里有个鱼池，池里有黑色和金色的鱼。花园里还有一张黑色长椅，长椅前面有一张棕色圆桌。花园里还有很多灰色的大石头。", "blanks": ["abu-abu", "batu", "bercat", "berdaun", "berkamar", "bunga", "emas", "indekos", "ungu", "warna-warni"], "a": ["4ea94f288a62", "c75ecfedddbd", "3ec715df39dd", "93a51d1f9de2", "76a6e783af87", "06fd5a074753", "dcdec5e9ae5b", "7235eb79a1d4", "da455e47124f", "d6e5fc2ff37e", "e78b2e8204a4", "3f07882886f7", "c35163de6881", "d81b28a4a1f1"]}, {"title": "认识印度尼西亚", "text": "Indonesia adalah negara kepulauan yang besar di Asia Tenggara. Indonesia memiliki banyak pulau dan penduduk yang berasal dari berbagai suku dan budaya. Masyarakat Indonesia dikenal ramah dan terbuka. Mengenal Indonesia akan membantu kita lebih mudah beradaptasi dalam kehidupan dan pekerjaan sehari-hari. Bahasa Indonesia adalah bahasa resmi di Indonesia. Bahasa ini digunakan di tempat kerja, sekolah, dan dalam kehidupan sehari-hari. Bahasa Indonesia tidak memiliki nada dan tata bahasanya relatif sederhana. Oleh karena itu, bahasa Indonesia mudah dipelajari oleh orang asing.", "zh": "印度尼西亚是东南亚的群岛大国，有众多岛屿，居民来自不同的民族和文化，当地人以友好、开放著称。了解印尼能帮助我们更快适应生活和工作。印尼语是印尼的官方语言，用于工作、学校和日常生活。印尼语没有声调，语法相对简单，所以外国人比较容易学。", "blanks": ["asia", "asing", "beradaptasi", "dikenal", "dipelajari", "kepulauan", "nada", "tata"], "a": ["b82c961cdb06", "aaeee105fa67", "b9e9944113fe", "6edf3df5ac32", "e7a3ef1813bd", "1c62a8ea6799", "0e2590532abf", "c6cbc5a6f5c8"]}, {"title": "城市、饮食与景点", "text": "Kota-kota di Indonesia, seperti di negara lain, sebagian besar didominasi oleh bangunan modern, sementara di daerah pedesaan banyak terdapat bangunan dengan ciri khas etnis. Karena cuaca yang panas, masyarakat biasanya mandi setidaknya dua hingga tiga kali sehari. Penduduk lokal Indonesia terbiasa makan dengan tangan dan mahir dalam memasak. Setiap daerah memiliki beragam jajanan khas, seperti pisang goreng, bola ketan, kue ketan, dan bakpia. Masyarakat pada umumnya menyukai makanan pedas; cabai dan sambal merupakan bumbu yang umum dijumpai di meja makan.", "zh": "印尼的城市和其他国家一样以现代建筑为主，农村则有许多带民族特色的建筑。因为天气炎热，人们每天通常洗两到三次澡。印尼人习惯用手吃饭，也很会做饭，各地都有丰富的特色小吃，比如炸香蕉、糯米团、糯米糕和馅饼。人们普遍爱吃辣，辣椒和辣椒酱是餐桌上常见的调料。著名景点：四王群岛（巴布亚）、托拉查的 Kete Kesu、粉红沙滩和科莫多岛（东努沙登加拉）、多巴湖（北苏门答腊）、婆罗浮屠（中爪哇）、布罗莫火山（东爪哇）、巴厘岛、布纳肯（北苏拉威西）、山口洋（西加里曼丹）。", "blanks": ["didominasi", "etnis", "ketan", "mahir", "pedesaan", "setidaknya", "terbiasa", "terdapat"], "a": ["8718c3337b4c", "f30d804fe165", "0e8447ee01b2", "400fdcd69726", "02bf9e7730cd"]}, {"title": "印尼的宗教问候语", "text": "Ada beberapa ujaran salam keagamaan saat berpidato atau berbicara di forum umum. Ujaran salam itu adalah assalamualaikum, salam sejahtera, om swastiastu, dan namo buddhaya. Ujaran salam itu diucapkan untuk menyapa orang Indonesia dari berbagai latar belakang agama.", "zh": "在演讲或公开场合发言时，有几种宗教问候语：assalamualaikum（伊斯兰）、salam sejahtera（基督教等）、om swastiastu（巴厘印度教）和 namo buddhaya（佛教）。说这些问候语是为了向不同宗教背景的印尼人问好。", "blanks": ["assalamualaikum", "berpidato", "forum", "keagamaan"], "a": ["85ac53319c2a", "449a284336ae", "5af6e3af3525"]}, {"title": "印尼人的相识礼节", "text": "Orang Indonesia biasanya berkenalan dengan berjabat tangan. Umumnya jabat tangan dilakukan dengan tangan kanan. Ada beberapa orang berjabat tangan dengan dua tangan. Perbedaan jabat tangan itu ada pada ujung jari yang bersentuhan dan tidak bersentuhan. Ada juga budaya cium tangan (salim). Budaya cium tangan biasanya untuk menghormati orang yang lebih tua, misalnya murid kepada guru atau anak kepada orang tua.", "zh": "印尼人认识时通常握手，一般用右手。也有人用双手握手，区别在于指尖是否相碰。还有一种吻手礼（salim），通常用来表示对长辈的尊敬，比如学生对老师、孩子对父母。", "blanks": ["bersentuhan", "jabat", "jari", "menghormati", "murid", "perbedaan"], "a": ["3578de46fdd5", "1d6bf9338f48", "1b8123353fe2", "a989227c48cb", "bff238196822", "a964bc299b14"]}, {"title": "礼貌的称呼", "text": "Orang Indonesia biasa memanggil orang yang lebih tua dengan bapak (Pak) dan ibu (Bu). Sapaan bapak untuk laki-laki dan sapaan ibu untuk perempuan. Di Pulau Jawa, orang biasa menggunakan sapaan mas untuk laki-laki yang lebih tua dan mbak untuk perempuan yang lebih tua. Berbeda daerah bisa berbeda sapaan. Orang Batak di Sumatra biasa menggunakan sapaan ito, kakak, dan abang. Orang Minang biasa menggunakan sapaan uda dan uni. Orang Sunda biasa menggunakan sapaan teteh dan aa. Orang Bali biasa menggunakan sapaan bli dan mbok.", "zh": "印尼人通常称呼年长的男性为 bapak（Pak），女性为 ibu（Bu）。在爪哇岛，人们称呼年长男性为 mas、年长女性为 mbak。不同地区称呼不同：苏门答腊的巴塔克人用 ito、kakak、abang；米南人用 uda（哥）和 uni（姐）；巽他人用 aa（哥）和 teteh（姐）；巴厘人用 bli（哥）和 mbok（姐）。", "blanks": ["abang", "batak", "berbeda", "mbok", "memanggil", "minang", "sumatra", "sunda", "teteh"], "a": ["e6cd43e17829", "6a706046e201", "e75065da2a5e", "c51fae49e135", "1b1879ce75b1", "edbd3ace9854", "c25963d3b201", "fb9ce1125b05"]}, {"title": "为什么印尼人会问年龄", "text": "Dalam etika berkenalan di Indonesia, orang kadang-kadang bertanya usia untuk mengenal lebih dekat. Di lingkungan kantor, atasan atau senior kerja biasanya akan bertanya usia jika mereka ingin mengetahui pengalaman kerja seseorang. Terkadang kerabat keluarga yang jarang bertemu juga bertanya usia, misalnya kakek kepada cucunya, paman kepada keponakannya. Dalam pertemanan, seseorang akan bertanya usia sebagai cara untuk lebih akrab dengan teman yang dikenalnya.", "zh": "在印尼的交往礼节中，人们有时会问年龄，以便更了解对方。在办公室，上司或前辈想了解一个人的工作经验时常会问年龄；不常见面的亲戚也会问，比如爷爷问孙子、叔叔问侄子。朋友之间问年龄，是拉近关系的一种方式。", "blanks": ["atasan", "etika", "kerabat", "mengetahui", "pertemanan", "senior"], "a": ["9234e18c9edc", "1dd34e30eaed", "80e36175607f", "15a27f629e73"]}, {"title": "印尼的旅游类型", "text": "Ada beberapa jenis wisata yang digemari masyarakat Indonesia, antara lain wisata alam, wisata religi dan budaya, wisata belanja, dan wisata edukasi. Beberapa tempat wisata alam yang menarik antara lain Kepulauan Raja Ampat (Papua), Gunung Rinjani (Pulau Lombok), Kepulauan Belitung, Gunung Bromo (Jawa Timur), Taman Laut Bunaken (Sulawesi Utara), dan Danau Toba (Sumatra Utara). Tempat wisata religi antara lain Masjid Istiqlal (Jakarta), Pura Tanah Lot (Bali), Candi Borobudur (Jawa Tengah), Candi Prambanan (Yogyakarta), Gereja Blenduk (Jawa Tengah), dan Patung Yesus (Toraja). Untuk wisata belanja ada Pasar Tanah Abang (Jakarta), Pasar Cibaduyut (Bandung), Pasar Seni Sukawati (Bali), dan Pasar Beringharjo (Yogyakarta). Untuk wisata edukasi ada Taman Mini Indonesia Indah (Jakarta), Taman Pintar (Yogyakarta), Jatim Park 2 (Jawa Timur), dan Kota Tua (Jakarta).", "zh": "印尼人喜爱的旅游类型有：自然游、宗教文化游、购物游和教育游。自然景点：四王群岛（巴布亚）、林贾尼火山（龙目岛）、勿里洞群岛、布罗莫火山（东爪哇）、布纳肯海洋公园（北苏拉威西）、多巴湖（北苏门答腊）。宗教景点：独立清真寺（雅加达）、海神庙（巴厘）、婆罗浮屠（中爪哇）、普兰巴南（日惹）、布伦杜克教堂（中爪哇）、耶稣像（托拉查）。购物：丹那阿邦市场（雅加达）、奇巴杜尤特市场（万隆）、苏卡瓦蒂艺术市场（巴厘）、贝林哈佐市场（日惹）。教育休闲：迷你印尼公园（雅加达）、智慧公园（日惹）、东爪哇公园 2 号、雅加达老城。", "blanks": ["borobudur", "bromo", "candi", "digemari", "istiqlal", "papua", "prambanan", "pura", "rinjani", "toba"], "a": ["e6cbc088c634", "f4a455a04b61", "78d0d91e2a75", "f7217205bb39", "b0cb6e3748c9"]}, {"title": "万丹的巴杜伊传统村落", "text": "Suku Baduy di Kabupaten Lebak, Banten, terkenal dengan kearifan lokalnya. Penduduk laki-laki Suku Baduy bermatapencaharian sebagai petani. Sementara itu, penduduk perempuan berada di rumah untuk menenun kain dan memasak. Aktivitas harian tersebut dilakukan tanpa teknologi sedikit pun, semuanya bergantung pada alam. Penduduk perempuan sejak pagi sudah mandi, mencuci pakaian, dan mencuci piring. Setelah mandi mereka bersiap untuk memasak. Alat masak yang digunakan masih sangat tradisional, yakni menggunakan kayu bakar dan gerabah. Usai memasak beberapa perempuan melanjutkan kegiatan dengan menenun kain atau menganyam tas dari rotan. Anak-anak Baduy Luar bermain seperti anak-anak pada umumnya. Sementara itu, penduduk laki-laki menuju ladang untuk bertani. Terkadang penduduk Baduy Dalam dengan kostum serbaputih juga turun ke Baduy Luar. Jika berkunjung ke Indonesia, jangan lupa singgah di desa adat itu, ya!", "zh": "万丹省勒巴克县的巴杜伊族以本土智慧闻名。男人以务农为生，女人在家织布、做饭，日常生活完全不用科技，一切依靠大自然。妇女们一早就洗澡、洗衣、洗碗，然后准备做饭，用的仍是柴火和陶器这些传统炊具。做完饭，有些妇女接着织布或用藤条编包。外巴杜伊的孩子们像普通孩子一样玩耍，男人们去田里耕作。有时穿着全白服装的内巴杜伊人也会来到外巴杜伊。来印尼的话，别忘了顺路去这个传统村落看看！", "blanks": ["bakar", "bergantung", "bermatapencaharian", "bersiap", "gerabah", "kearifan", "lebak", "lokalnya", "petani", "yakni"], "a": ["21651629e67d", "981a26c507fb", "c099bc1976ff", "07d8e54c7f39", "4e677a73c0b4", "f4d7452f913f", "e3c217a2eb96", "7bc7dc846f4f", "54ec8f4b8f36", "993d39bf6402", "7dc9c6a45113", "fb87c6a9a7f7"]}, {"title": "疯狂竹子——马鲁古的传统游戏", "text": "Zaman dahulu masyarakat Indonesia punya hobi berkumpul dan bermain bersama. Ada permainan tradisional unik di Maluku yang punya nuansa mistis. Namanya bambu gila (baramasuwel). Pada permainan ini para pemain hanya memeluk dan menahan laju bambu. Bambu ini bergerak melonjak sesuai kemauan sang pawang. Pawang bisa menggerakkan bambu dengan kekuatan gaib. Sang pawang membakar kemenyan sebelum permainan dimulai. Asapnya lalu 'dimasukkan' ke dalam bilah bambu. Lalu, secara gaib bambu akan bergerak sendiri. Sang pawang terus mengendalikan bambu dengan mantra, “Hei baramasuwel!” Permainan bambu gila merupakan bentuk kekayaan nusantara.", "zh": "过去的印尼人喜欢聚在一起玩。马鲁古有一种带神秘色彩的独特传统游戏，叫“疯狂竹子”（baramasuwel）。玩家只需抱住竹子、挡住它的冲劲，竹子会按巫师的意愿跳动，巫师能用神秘的力量驱动竹子。游戏开始前巫师点燃安息香，把烟“送进”竹片里，竹子就会神奇地自己动起来，玩家必须抱住它。巫师一直念着咒语“嘿，baramasuwel！”来控制竹子。疯狂竹子是印尼群岛丰富文化的一部分。", "blanks": ["kekuatan", "kemauan", "laju", "melonjak", "memeluk", "menahan", "mistis", "nuansa", "pemain"], "a": ["94d603b670f3", "17df98aa9412", "cef57223e707", "e1dbb232f24c", "8a18dd3d906d", "eb7429590d71", "180c55be28ca", "776c433cfd80", "5b0c612de51f", "eaf2c189bf7b"]}, {"title": "古邦人的碰鼻礼", "text": "Di berbagai belahan dunia tradisi penyambutan atau tata cara bersalaman ternyata tidak sama. Di Tibet orang-orang bersalaman dengan menjulurkan lidah. Di Eropa umumnya orang bersalaman sambil menyentuhkan pipi. Di Nusa Tenggara Timur (NTT) juga ada cara unik bersalaman, yaitu cium hidung. Cium hidung umumnya dilakukan oleh masyarakat Sabu. Cium hidung dapat dimaknai sebagai ungkapan kasih sayang. Tradisi ini konon sudah berlangsung sejak zaman dahulu dan masih terjaga hingga hari ini. Di luar negeri ada beberapa negara yang juga melakukan cium hidung, seperti Alaska, Arab Saudi, dan Selandia Baru.", "zh": "世界各地的迎客和问候方式各不相同：西藏人伸舌头问候，欧洲人通常贴脸问候。东努沙登加拉也有一种独特的问候方式——碰鼻礼，主要流行于萨武人。碰鼻表示亲爱之情，据说这一传统自古就有，至今仍保留着。国外也有地方行碰鼻礼，比如阿拉斯加、沙特阿拉伯和新西兰。", "blanks": ["belahan", "dimaknai", "lidah", "menjulurkan", "menyentuhkan", "penyambutan", "pipi", "sabu", "tibet"], "a": ["d954b9ddb4ea", "81598ddcb974", "5af5fb54724b", "c79832ebe353", "ce96e2bddaa7", "8780aebd917b", "de18bb2c9572", "bff9ecf6db2e"]}, {"title": "雅加达地铁 MRT", "text": "Moda raya terpadu (MRT) adalah sebuah kereta rel listrik. MRT ada di bawah tanah. Transportasi transit cepat ini menghubungkan tempat-tempat di Jakarta. Fasilitas di sini juga ramah bagi kaum disabilitas. Sebab, tempat ini dilengkapi eskalator dan lift. Petugas juga selalu siap sedia untuk membantu para penumpang. Hendak berkunjung ke Jakarta? Jangan lupa naik MRT, ya!", "zh": "综合捷运（MRT）是一种电动轨道列车，在地下运行，这种快速交通工具连接着雅加达各处。这里的设施对残障人士也很友好，配有自动扶梯和电梯，工作人员也随时准备帮助乘客。要去雅加达吗？别忘了坐 MRT 哦！", "blanks": ["disabilitas", "kaum", "menghubungkan", "moda", "terpadu", "transit"], "a": ["98026e1ccceb", "e4a1fa9a6863", "90c8e416d3c0", "ffc0b7fab62e", "247354a12807", "2da83f37ac19", "915ebbc3a997", "6627a44ebf27"]}, {"title": "蓝眼睛的印尼原住民", "text": "Ternyata ada penduduk asli Indonesia dengan mata biru. Mereka ada di Sulawesi Tenggara, Maluku Utara, dan Aceh Jaya. Di Pulau Siompu, Sulawesi Tenggara: pada abad ke-16 Portugis datang ke Indonesia untuk berdagang rempah. Bangsa Portugis menikah dengan keturunan bangsawan Wolio. Dari sana lahirlah keturunan bermata biru dan berambut agak pirang. Di Halmahera Timur, Maluku Utara: Suku Lingon adalah salah satu suku minoritas di pulau ini. Keberadaan Suku Lingon terancam akibat konflik dengan suku lain. Di Lamno, Aceh Jaya: keturunan bermata biru ini awalnya merupakan hasil pernikahan antara tentara Portugis dan warga setempat. Saat itu, banyak tentara Portugis yang menjadi tawanan Kerajaan Daya. Mereka tidak bisa kembali pulang ke Eropa, lalu menikah dengan warga lokal setempat.", "zh": "原来印尼也有蓝眼睛的原住民，分布在东南苏拉威西、北马鲁古和亚齐查亚。东南苏拉威西的西翁普岛：16 世纪葡萄牙人来印尼做香料贸易，与沃里奥贵族后代通婚，于是诞生了蓝眼睛、头发略带金色的后代。北马鲁古的东哈马黑拉：林贡族是岛上的少数民族之一，因与其他部族冲突，生存受到威胁。亚齐查亚的拉姆诺：这些蓝眼睛后代最初是葡萄牙士兵与当地人通婚的结果，当时许多葡萄牙士兵成了达亚王国的俘虏，回不了欧洲，就与当地人结了婚。", "blanks": ["abad", "asli", "bangsa", "bangsawan", "keberadaan", "minoritas", "pirang", "rempah", "siompu", "wolio"], "a": ["5314294024a0", "8668b5ab10e2", "de9c942156f8", "40ef5250ea54", "8cc1391a395a", "05e33ad9eced", "924420e211e4", "9565b1516799", "cdeb4f363cda", "e373bec8e31e"]}], "2": [{"title": "吉他为什么最受欢迎（课文 1）", "text": "Gitar menjadi alat musik terfavorit di dunia, termasuk di Indonesia. Mengapa gitar menjadi favorit? Alasannya adalah belajar gitar itu cukup mudah. Hanya dengan mengenal kunci-kunci dasar seperti C, D, Dm, E, Em, F, A, dan Am, kita bisa memainkan beberapa lagu. Kita juga bisa belajar gitar sendiri tanpa guru (otodidak). Belajar gitar secara otodidak dapat dilakukan melalui buku atau internet. Kita juga dapat dengan mudah membeli gitar karena ada banyak penjual gitar di berbagai tempat. Saat kita mengunjungi toko musik, gitar adalah alat musik yang paling banyak dijual. Biasanya toko musik menjual berbagai jenis gitar.", "zh": "吉他是全世界最受欢迎的乐器，在印尼也一样。为什么吉他这么受欢迎？原因是学吉他比较容易。只要认识 C、D、Dm、E、Em、F、A、Am 这些基本和弦，就能弹好几首歌。我们还可以不用老师，自己学（自学）。自学吉他可以通过书或网络。买吉他也很容易，因为很多地方都有卖。去乐器店时，吉他是卖得最多的乐器，乐器店通常卖各种各样的吉他。", "blanks": ["dasar", "dijual", "dunia", "internet", "jenis", "memainkan", "menjual", "penjual", "terfavorit", "termasuk"], "a": ["de09b52bc9c9", "4758375b3d5b", "dab72c9ad1cd", "573c64b76033", "626c6d36378f", "880b071f0642", "e583501c5e56", "7cd5bb98bd5d", "06d055589bb4"]}, {"title": "酒店前台 Siu（课文 2）", "text": "Nama saya Siu. Saya seorang resepsionis di sebuah hotel. Saya sudah 2 tahun bekerja di sini. Saya bekerja 8 jam sehari. Salah satu tugas saya adalah memeriksa pesanan kamar dari tamu hotel. Setelah pesanan kamar benar, saya memberikan kunci kamar kepada tamu hotel. Setelah tamu hotel selesai menginap, saya menerima kembali kunci kamar dari tamu hotel. Pekerjaan saya cukup menyenangkan. Saya bisa bertemu banyak orang baru.", "zh": "我叫 Siu，是一家酒店的前台接待员，在这里工作两年了，每天工作八小时。我的一项职责是核对客人的订房。确认无误后，我把房间钥匙交给客人；客人退房后，我再把钥匙收回来。我的工作挺愉快的，可以认识很多新朋友。", "blanks": ["benar", "memberikan", "memeriksa", "menerima", "menginap", "pesanan", "resepsionis"], "a": ["072c34da0222", "7e8204f62865", "5957cdd1719c", "eb3a1583c694", "3948f23986cf", "6b6bbf4cf5e5", "ac2ca10a0640", "785953d78cba", "1cc9ef0a5841"]}, {"title": "市场打折广播（音频 3）", "text": "Bapak dan Ibu yang kami hormati: Sekarang Pasar Raya Sentosa memberi potongan harga untuk beberapa bahan pokok. Potongan harga sering kami berikan pada setiap akhir bulan. Potongan harga yang ada antara lain: satu kilogram cabai sekarang seharga Rp18.000. Satu kilogram bawang sekarang seharga Rp16.000. Terakhir, harga 1 kilogram tomat adalah Rp6.000. Demikian pengumuman ini kami sampaikan. Kami tunggu kehadiran Bapak dan Ibu di pasar kami.", "zh": "尊敬的先生们、女士们：现在 Sentosa 大市场对部分基本生活物资打折。我们通常在每个月底推出优惠。本次优惠包括：辣椒每公斤一万八千盾，洋葱每公斤一万六千盾，最后，西红柿每公斤六千盾。以上就是本次公告，欢迎各位光临我们的市场。", "blanks": ["demikian", "hormati", "kehadiran", "pokok", "sampaikan", "sentosa", "tunggu"], "a": ["92b92c033506", "39cc0175a35c", "418e3bc57e5b", "0e2948b77bb1", "069e2a985bc7", "be8c3f2993d8", "1f31fc064c20"]}, {"title": "交作业通知（课文 3）", "text": "PENGUMUMAN PENTING. Tolong kumpulkan tugas menulis teks bahasa Indonesia kepada Ibu Reni. Tugas tersebut harus dikumpulkan pada hari Selasa sebelum pukul 12.00 di ruang kelas. Atas perhatian Anda, kami ucapkan terima kasih.", "zh": "重要通知：请把印尼语写作作业交给 Reni 老师。作业必须在星期二中午 12 点前交到教室。感谢您的配合。", "blanks": ["kumpulkan", "selasa", "ucapkan"], "a": ["dbc4bab949a2", "ef2b096ddd2b", "2e2530f64b6c", "04c662c4ac45"]}, {"title": "传统市场（课文 4）", "text": "Pasar tradisional sekarang tidak lagi seperti yang dahulu. Dahulu pasar tradisional sangat tidak tertata rapi dan kotor. Saat ini pemerintah daerah di banyak wilayah Indonesia sudah menata pasar tradisional dengan lebih baik. Sekarang bangunan pasar tradisional sudah banyak yang permanen. Pasar tradisional sekarang juga lebih bersih. Penjual dan pembeli sudah sangat mengerti tentang kebersihan pasar. Banyak pasar tradisional membuat aturan jangan buang sampah sembarangan. Semua itu dilakukan agar pembeli merasa nyaman saat berbelanja di pasar tradisional.", "zh": "现在的传统市场已经和以前不一样了。以前传统市场很乱、很脏。现在印尼许多地区的地方政府把传统市场整顿得更好了。如今很多传统市场的建筑都是永久性的，也更干净了。卖家和买家都很重视市场卫生，很多市场规定不准乱扔垃圾。这一切都是为了让顾客在传统市场购物时感到舒适。", "blanks": ["kotor", "menata", "mengerti", "pemerintah", "permanen", "sampah", "tertata", "wilayah"], "a": ["82777dd1727c", "413af3f9b6fd", "ed6e58149fc0", "b582eaeb63a7", "1626b0997ba7", "1b87b1c39b1c", "d65b6959e00f", "e55b5c753367"]}, {"title": "简单炒饭（课文 5）", "text": "Bahan: sosis ayam satu buah; baw
