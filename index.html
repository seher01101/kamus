ang putih 3 siung, iris halus; garam; nasi 600 gram; penyedap rasa; kecap ikan; merica; telur ayam 1 butir; daun bawang 1 batang, iris halus; daging ayam 125 gram, cincang halus. Cara membuat: 1. Tumis bawang putih hingga harum. Tambahkan telur lalu orak-arik. 2. Tambahkan ayam yang telah dicincang halus. 3. Tambahkan sosis. 4. Masukkan daun bawang, kemudian tumis lagi. 5. Masukkan nasi, kemudian aduk hingga rata. 6. Tambahkan kecap ikan, garam, merica, dan penyedap rasa secara bersamaan. Aduk rata hingga aroma sedap atau harum tercium. 7. Pindahkan nasi goreng pada piring. Anda bisa menaburkan bawang merah goreng sebagai tambahan.", "zh": "材料：鸡肉香肠一根；大蒜三瓣，切薄片；盐；米饭 600 克；味精；鱼露；胡椒；鸡蛋一个；葱一根，切细；鸡肉 125 克，剁碎。做法：1. 把蒜炒香，加入鸡蛋炒散。2. 加入剁碎的鸡肉。3. 加入香肠。4. 放入葱，再炒一下。5. 放入米饭，翻炒均匀。6. 同时加入鱼露、盐、胡椒和味精，翻炒均匀直到闻到香味。7. 把炒饭盛到盘子里，可以撒些炸红葱头作配料。", "blanks": ["batang", "bersamaan", "cincang", "daun", "iris", "menaburkan", "orak-arik", "pindahkan", "siung", "tercium"], "a": ["5e2b10a042cb", "32c7117b6695", "2422b70a9cc1", "a99548a80616", null, "fb0eb5748907", null, "f6131aa6b266", null, "208a6c24995e", null, "d90caa8234ef", null, "b8a0402bfa04", "ddc6c1dfc1ad", null, "dc8ec23b3441", "1ee415c3d0f9"]}, {"title": "Budi 家周围（音频 6）", "text": "Nama saya Budi. Saya tinggal di Jalan Supratman. Di seberang rumah saya ada masjid. Di sebelah kiri masjid ada taman kanak-kanak. Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Salim. Di sebelah kiri rumah saya ada kantor pos. Di belakang rumah saya ada toko kelontong.", "zh": "我叫 Budi，住在 Supratman 路。我家对面有一座清真寺，清真寺左边是一所幼儿园。我家右边是邻居 Salim 先生家，左边是邮局，后面是一家杂货店。", "blanks": ["kanak-kanak", "kelontong", "salim", "supratman", "tetangga"], "a": ["dff39b3c900f", "bb6c736ac792", "11831a44d9bf", "21706298e98c", "6923a255d1c5", "4127467dbeb8", "089f31e80145"]}, {"title": "Raisa 的家（课文 6）", "text": "Nama saya Raisa. Saya tinggal di Jalan Sukasenang. Rumah saya adalah rumah dua lantai. Rumah saya berwarna putih. Di depan rumah saya ada halaman. Di sana ada pohon mangga. Di belakang rumah saya ada warung Ibu Yayan. Di sebelah kiri rumah saya ada toko kelontong. Di samping kanan rumah saya ada rumah seorang tetangga saya, Pak Bandi. Di seberang rumah saya ada taman bermain.", "zh": "我叫 Raisa，住在 Sukasenang 路。我家是两层楼，白色的。房前有个院子，院子里有棵芒果树。房后是 Yayan 阿姨的小店，左边是一家杂货店，右边是邻居 Bandi 先生家，对面是一个游乐场。", "blanks": ["halaman", "kelontong", "lantai", "mangga", "pohon", "sukasenang", "warung"], "a": ["93a3100953bf", "4b8d9fdd3e24", "14c7615c345d", "43aea247dc57", "8f44fedfb6cb", "d1b189c1171b", "309f634e85f2", "5499abc80cab", "d497f81d567c", "0a4a6103d460"]}, {"title": "画平面图练习", "text": "Rumah saya ada di Jalan Bambu. Rumah saya ada di belakang Masjid Al-Furqon. Di sebelah kanan masjid ada kebun cabai. Di sebelah kiri rumah saya ada toko yang menjual gas dan minyak tanah. Di seberang toko gas ada toko air minum. Di sebelah kanan rumah saya ada rumah tetangga saya, Pak Resa. Di seberang rumah Pak Resa ada supermarket. Di sebelah kiri supermarket ada tempat pangkas rambut. Di seberang rumah saya ada taman bermain anak. Di belakang taman bermain anak ada sekolah, yaitu SDN Ajitunggal.", "zh": "我家在竹子路，在 Al-Furqon 清真寺后面。清真寺右边有一块辣椒地。我家左边是一家卖煤气和煤油的店，煤气店对面是一家饮用水店。我家右边是邻居 Resa 先生家，他家对面是一家超市，超市左边是理发店。我家对面是儿童游乐场，游乐场后面是一所学校——Ajitunggal 国立小学。", "blanks": ["ajitunggal", "al-furqon", "kebun", "menjual", "minyak", "pangkas", "rambut", "supermarket", "yaitu"], "a": ["bc23ed5b507b", "9836e645a3fd", "c0b93fabfc1b", "98bcd495ca1c", "4925737b81f5", "032006be3294", "5f70e9a452f7", "5efbe3630d15", "5a3e02da4681", "f072cddbc1fa"]}, {"title": "热身运动（音频 7）", "text": "Sebelum berolahraga, kita harus melakukan pemanasan. Contoh pemanasan adalah sebagai berikut. Langkah pertama, gerakkan kepala ke kanan dan ke kiri. Setelah itu, regangkan tangan ke atas dan ke bawah. Terakhir, angkat kaki secara bergantian. Lakukan tiap gerakan selama delapan detik.", "zh": "运动前我们要先热身。热身的例子如下：第一步，把头向右、向左转动；然后，把手向上、向下伸展；最后，轮流抬腿。每个动作做八秒。", "blanks": ["angkat", "contoh", "gerakkan", "terakhir"], "a": ["89b9eec63d84", "7393b827a0a1", "437c6e934d77", "28713acea5de", "90655aced2c5", "523283b23704"]}, {"title": "放松运动的做法（课文 7）", "text": "Olahraga adalah aktivitas yang baik bagi tubuh. Setelah melakukan kegiatan inti Anda harus melakukan pendinginan. Ada banyak cara untuk melakukan pendinginan. Berikut adalah salah satu caranya. Pertama, buka kaki selebar bahu. Kedua, pegang pinggang dengan tangan kiri. Setelah itu gerakkan tangan kanan ke atas dan ke bawah. Lakukan hal yang sama dengan tangan kiri. Lalu, condongkan badan ke arah kiri bawah sampai hampir jongkok kemudian regangkan kaki ke kanan. Lakukan hal yang sama dengan kaki kiri. Tahan tiap gerakan selama 8 detik. Setelah selesai pendinginan hindari meminum minuman bersoda. Minuman bersoda dapat membuat perut menjadi kembung.", "zh": "运动对身体有益。做完主要运动后，要做放松运动。放松的方法很多，下面是其中一种：第一，双脚分开与肩同宽；第二，左手扶腰；然后右手上下摆动，左手也做同样的动作。接着，身体向左下方倾斜，几乎蹲下，然后把右腿伸直，左腿也同样做。每个动作保持 8 秒。放松结束后，避免喝汽水，因为汽水会让肚子胀。", "blanks": ["bahu", "buka", "condongkan", "gerakkan", "inti", "jongkok", "pegang", "pinggang", "selebar", "tahan"], "a": ["1c919f7b4fd7", "d2df4e132608", "aef35b6aafd1", "c75d6a968a4b", "f9f2f733de38", "b3a2351cc607", "d1995b1e61dd", "4a69cd03a2c5", "fb80827ce861", "1d050603045f", "086cc936cdc7", "2211a2a5fbe4", "5ccc70968c95"]}, {"title": "坐通勤列车（课文 8）", "text": "Saya mencoba naik kereta rel listrik (KRL) minggu lalu. Saya berangkat dari Bogor ke Jakarta. Banyak hal yang baru saya temui ketika mencoba naik KRL. Pertama saya memesan tiket di loket yang ada. Saya harus menyebutkan stasiun yang ingin saya tuju. Harganya cukup murah, hanya 10.000 rupiah. Setelah itu, saya menempelkan tiket di gerbang dan berjalan ke peron untuk menunggu kereta. Ketika kereta tiba, saya langsung naik. Keadaan di dalam kereta cukup sesak. Kereta pun tiba di Jakarta. Saya turun, lalu berjalan keluar stasiun. Saya harus menempelkan kembali tiket di gerbang yang telah disediakan. Pengalaman naik KRL cukup mengasyikkan. Penumpang memang harus bersabar ketika berada dalam kereta. Namun, tempat tujuan bisa dicapai tepat waktu.", "zh": "上周我第一次试着坐通勤列车，从茂物去雅加达，遇到了很多新鲜事。首先我在售票窗口买票，要说出想去的车站，票价挺便宜，只要一万盾。然后我在闸机刷票，走到站台等车。车一到我就上去了，车厢里相当挤。列车到了雅加达，我下车走出车站，出站时还要在闸机再刷一次票。坐通勤列车的经历挺有意思，在车上确实要有耐心，不过能准时到达目的地。", "blanks": ["bersabar", "bogor", "dicapai", "disediakan", "keadaan", "listrik", "memesan", "peron", "temui", "tuju"], "a": ["5bb2373cf0a5", "cf821f779a9a", "babde601ee7c", "1a4dfeb5fc37", "11147e66e2c4", "2fd854fe66f5", "2bac56f29379", "b244513943af", "2debad9ffbb7", "c32f0d2e309f", "297ca52516ed", "2e7e57cc21cd", "2c05a1adb0f4", "02195c06d099", "d2e1d40e98e4"]}, {"title": "四王群岛的假期（课文 9）", "text": "Tahun lalu, saya dan keluarga pergi ke Raja Ampat. Kami pergi ke sana dengan pesawat. Sesampainya di sana kami langsung masuk ke hotel. Setelah menyimpan barang-barang, kami memulai beragam aktivitas. Pada hari pertama, kami bermain di pantai. Pantai di Raja Ampat sangat indah. Lautnya jernih dan bersih. Kami juga tidak lupa untuk snorkeling. Saya melihat banyak ikan yang berwarna-warni. Setelah itu kami mengunjungi pantai yang berpasir putih. Saya dan keluarga tidak lupa untuk berfoto bersama. Pada hari kedua kami pergi ke Air Terjun Batanta. Airnya bersih dan jernih seperti di pantai. Pada hari ketiga kami pulang ke rumah. Liburan kami terasa amat singkat. Akan tetapi, saya dan keluarga merasa sangat bahagia. Saya ingin kembali ke sana pada lain waktu.", "zh": "去年我和家人去了四王群岛，是坐飞机去的。一到那里我们就直接进了酒店，放好行李后开始了各种活动。第一天我们在海滩玩，四王群岛的海滩非常美，海水清澈干净。我们还去浮潜，我看到很多五颜六色的鱼。之后我们去了白沙滩，全家一起拍照。第二天我们去了巴坦塔瀑布，那里的水和海水一样干净清澈。第三天我们回家了。假期感觉太短了，不过我和家人都非常开心，我希望以后还能再去。", "blanks": ["amat", "batanta", "beragam", "berpasir", "berwarna-warni", "ketiga", "memulai", "menyimpan", "singkat", "snorkeling"], "a": ["7595eea47caa", "a4353ee8b006", "1a2a2e55fdd6", "553f5e385821", "3389eff94700", "4808128823f7", "476247ffd179", "eb281418ab14", "5ffa3d840beb", "9b1e97b4b79d", "13ef814812b2", "903a78d7dbc9", "d645214159f9", "cb9c74d6fe9a", "cbb8df51a94d", "6a85134686da", "a26d01ab5b46"]}, {"title": "得了登革热（课文 10）", "text": "Pada suatu hari saya tiba-tiba merasa sangat mual. Badan saya terasa demam. Otot saya sangat sakit. Muka saya menjadi sangat pucat. Wali kelas mengantar saya ke rumah sakit. Setelah diperiksa, saya mengalami gejala demam berdarah. Penyakit ini disebabkan virus yang dibawa oleh nyamuk Aedes aegypti. Saya langsung dimasukkan ke ruang rawat inap. Perawat memasang infus di lengan saya. Saya tidak boleh memakan makanan dari luar rumah sakit selama dirawat. Saya pun dianjurkan untuk sering meminum air. Selain itu, saya diminta untuk memakan buah-buahan yang mengandung vitamin C. Saya hanya bisa berbaring di tempat tidur selama dirawat di rumah sakit. Akhirnya, saya boleh pulang setelah dirawat selama 5 hari. Mulai saat itu, saya menjaga kebersihan rumah saya. Hal itu saya lakukan supaya tidak ada nyamuk lagi.", "zh": "有一天我突然觉得非常恶心，身体发烧，肌肉很疼，脸色变得非常苍白。班主任送我去了医院。检查后发现我有登革热的症状，这种病是由埃及伊蚊携带的病毒引起的。我马上被送进住院病房，护士在我手臂上打了点滴。住院期间我不能吃医院外面的食物，医生建议我多喝水，还要多吃含维生素 C 的水果。住院时我只能躺在床上。住了五天后我终于可以回家了。从那以后我注意保持家里清洁，这样就不会再有蚊子了。", "blanks": ["diminta", "diperiksa", "disebabkan", "infus", "lengan", "memasang", "mengalami", "penyakit", "tiba-tiba", "wali"], "a": ["cfb5b3972022", "55c27dbf15d3", "4b53563ed59a", "32f4539448b2", "04ecc029e6dd", "09f89520f6ac", "4aca6bf0e80a", "6feba15cd5e8", "929cfb971557", "7bf8776737ce", "0165139fc14a", "ffdea84b4de3", "3161d5d43020", "26a3d3e3d31e", "90e719e24d7b", "1f4fb864e0e0"]}, {"title": "止泻药说明书", "text": "Obat Diare. Khasiat: 1. Mengurangi frekuensi buang air besar. 2. Menyerap racun penyebab diare. Komposisi: Tiap tablet (325 mg) mengandung activated charcoal (125 mg). Aturan pakai: 5—7 tablet per dosis. Maksimum 20 tablet/hari. Produksi: P.T. Eagle Indo Pharma.", "zh": "止泻药。功效：1. 减少排便次数；2. 吸附引起腹泻的毒素。成分：每片（325 毫克）含活性炭 125 毫克。用法：每次 5—7 片，每天最多 20 片。生产商：P.T. Eagle Indo Pharma。", "blanks": ["frekuensi", "khasiat", "mengurangi"], "a": ["07b647bd63d1", "de1ce389f10d", "1151414bddd9", null, "3e22c5551836", "2d76f80b4f28", "29217e97f010", "9d86f67b8b66", "1ac4d49ab1a4", "f0705cb2900c"]}, {"title": "Tohpati——印尼著名爵士吉他手", "text": "Tohpati Ario Hutomo atau yang lebih dikenal dengan Tohpati adalah seorang gitaris dan penulis lagu Indonesia. Dia lahir di Jakarta, 25 Juli 1971. Tohpati merupakan salah satu gitaris jazz yang terkenal. Banyak karyanya memadukan elemen kebudayaan tradisional. Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "zh": "Tohpati Ario Hutomo，更为人熟知的名字是 Tohpati，是印尼吉他手和词曲作者，1971 年 7 月 25 日生于雅加达。他是著名的爵士吉他手之一，很多作品融合了传统文化元素，这和他在音乐中融合现代与传统的追求是一致的。", "blanks": ["dikenal", "elemen", "kebudayaan", "sejalan", "unsur"], "a": ["b304a590af2e", "c3113c87eb52", "b387b8a6e6d6", "bf9b8a2df915", "a5ac7094c566"]}, {"title": "印尼最热门的十种职业", "text": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari. Banyak orang mendapatkan pekerjaan sesuai dengan keinginannya, tetapi banyak juga yang memilih pekerjaan karena populer. Berikut sepuluh pekerjaan yang paling populer di Indonesia berdasarkan survei tahun 2018: guru, pegawai bank, pegawai negeri sipil (PNS), tenaga pemasaran (marketing), tenaga kerja Indonesia (TKI), tenaga di bidang teknologi informasi, tenaga di bidang kesehatan seperti dokter atau apoteker, wartawan, akuntan, dan karyawan Badan Usaha Milik Negara (BUMN).", "zh": "工作是每个人满足日常生活需要的方式。很多人找到了自己想做的工作，也有很多人因为某些职业热门而选择它。根据 2018 年的一项调查，印尼最热门的十种职业是：教师、银行职员、公务员、营销人员、海外劳工、信息技术人员、医疗人员（如医生、药剂师）、记者、会计师和国企员工。", "blanks": ["bank", "memenuhi", "memilih", "mendapatkan", "sipil", "survei", "tenaga"], "a": ["293cfc5078f4", "40d6f33a6b4c", "1cd0e1a76625"]}, {"title": "木梆 Kentongan", "text": "Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan. Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul. Setelah orang-orang berkumpul, pengumuman disampaikan. Saat ini, kentongan masih dipakai di beberapa daerah di Indonesia.", "zh": "古时候，印尼人宣读公告之前会先敲木梆，用来吸引大家注意、召集人们。人们聚齐后再宣布公告。现在印尼一些地区仍在使用木梆。", "blanks": ["disampaikan", "fungsi", "membacakan", "memukul"], "a": ["e4db8afac134", "5fdc8e0d0006", "1488763912fb", "d13f61e0f624"]}, {"title": "网上购物", "text": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring). Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah. Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar. Mereka hanya menunggu barang datang melalui jasa kurir.", "zh": "现在很多人喜欢用线上购物应用买东西，他们觉得网购更方便：买家不用去商店或市场，只要等快递把东西送来就行。", "blanks": ["bahwa", "jaringan", "jasa", "menilai"], "a": ["e95fd37e4ee6", "935299d84d04", "f6e8b7592905", "ee8b6f3429ba"]}, {"title": "仁当和炒饭", "text": "Cable News Network (CNN) telah merilis daftar lima puluh makanan terenak sedunia lewat 35.000 pilihan makanan di media sosial Facebook. Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama. Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "zh": "美国有线电视新闻网（CNN）根据脸书上 35,000 个美食投票，发布了全球 50 种最美味食物榜单。结果，西苏门答腊的仁当再次名列第一。有意思的是，除了仁当，炒饭也排在了第二名。", "blanks": ["cable", "daftar", "merilis", "terenak"], "a": ["730a07f64a18", "601c7c23dfc8", "3ba0ce3aa190"]}, {"title": "互助合作 Gotong Royong", "text": "Salah satu budaya masyarakat Indonesia adalah gotong royong. Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu. Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu. Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "zh": "互助合作是印尼社会的一种文化，意思是大家一起干活、互相帮助。这类活动通常在周末进行，人们一起清扫环境、修建公共设施。", "blanks": ["bersama-sama", "membangun", "tolong-menolong"], "a": ["244f3fb3511d", "4945e5397f78", "8813b40cfef1", "6b1aad8165f4"]}, {"title": "无车日", "text": "Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day). Acara itu biasanya dilaksanakan setiap hari Minggu pagi. Di beberapa jalan tertentu kendaraan bermotor dilarang melintas. Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga. Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda. Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "zh": "印尼有“无车日”（Car Free Day），通常在每个星期天上午。一些特定道路禁止机动车通行，人们在那里聊天、摆摊、散步或运动。最受欢迎的活动之一是骑自行车，因为没有机动车，大家可以悠闲地骑车。", "blanks": ["bebas", "berdagang", "dilarang", "melintas", "mengobrol", "tertentu"], "a": ["27e71171f0c7", "d7f6ffd0fd29", "d2605b418c91", "2c883c5e3b96", "06e344605f72", "dba6a7b91e9f"]}, {"title": "人力三轮车 Becak", "text": "Becak adalah salah satu sarana transportasi unik di Indonesia. Becak adalah kendaraan roda tiga. Pengayuh duduk di belakang, sedangkan penumpang duduk di depan. Becak biasanya ada di depan kompleks perumahan atau di depan pasar. Ongkos naik becak berbeda-beda. Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "zh": "Becak 是印尼一种独特的交通工具，是三轮车：车夫坐在后面蹬车，乘客坐在前面。Becak 通常停在住宅小区或市场门口。车费不固定，所以乘客和车夫要先讲好价钱。", "blanks": ["ongkos", "pengayuh", "roda", "sarana", "sedangkan"], "a": ["4478a128a4e7", "654ab46560ff", "450ea1d6b508", "b23a4c3dc27c", "10345a1d436e", "4e5653b9afdd"]}, {"title": "户外拓展 Mancakrida", "text": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida. Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi. Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan. Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama. Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "zh": "在旅游景点常举办的一种活动是户外拓展，参加者通常是家庭或某单位的员工，目的是锻炼各种能力，重点是团队合作能力。参加者可以边练边玩。", "blanks": ["diikuti", "fokus", "institusi", "mancakrida", "melatih"], "a": ["ba132c43e6ed", "136073c65777", "fc5e084cebda", "9a308a80d7a7", "315bb84f232d"]}, {"title": "刮痧 Kerokan", "text": "Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan. Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh. Cara itu dipercaya dapat menyembuhkan masuk angin, nyeri otot, perut kembung, mual, sakit kepala, dan meriang.", "zh": "刮痧是印尼的一种传统疗法，用钝器在身上刮擦。人们相信它能治着凉、肌肉酸痛、腹胀、恶心、头痛和发冷发热。", "blanks": ["dipercaya", "menggesekkan", "metode", "tumpul"], "a": ["f212b0955e16", "cb362f0fc433", "bdaad17ba981"]}]}, "exam": [{"t": "自我介绍后的追问", "b": "武功秘籍", "q": [["Kamu sudah berapa lama bekerja di sini?", "你在这里工作多久了？", "2a9cd1440921", "Saya sudah bekerja di sini selama tiga tahun.", "我在这里工作三年了。", "b0a845064715"], ["Buku apa yang sering kamu baca? / Hobi kamu membaca? Kamu suka membaca buku apa?", "你常看什么书？/ 你爱读书吗？喜欢读什么书？", "cd8c2856da66", "Saya sering membaca buku cerita, misalnya 《小王子》.", "我常读故事书，比如《小王子》（书名可以直接说中文）。", "1591ac0181e0"], ["Kamu punya berapa saudara? / Kamu ada berapa saudara?", "你有几个兄弟姐妹？", "399818ce32bc", "Saya punya dua saudara, satu adik perempuan dan satu adik laki-laki.", "我有两个兄弟姐妹，一个妹妹和一个弟弟。", "67c223b371c7"], ["Kamu bekerja di departemen mana? / Apa pekerjaan kamu?", "你在哪个部门工作？/ 你的岗位是什么？", "70c3baa14a8f", "Saya bekerja di departemen keuangan, saya staf akuntansi.", "我在财务部工作，是会计。", "52cd169fca8d"], ["Kapan kamu cuti?", "你什么时候休假？", "8817ed5b5682", "Saya akan cuti bulan depan.", "我下个月休假。", "e010e02db744"], ["Selain nge-gym / tidur, kamu ada hobi yang lain?", "除了健身/睡觉，你还有别的爱好吗？", "b75e254342ba", "Ada. Selain itu, saya juga suka memasak dan mendengarkan musik.", "有。除此之外，我还喜欢做饭和听音乐。", "7929004afb2b"], ["Biasa di mana kamu main bulutangkis? / Kamu melakukan hobi kamu di mana?", "你通常在哪里打羽毛球 / 做你的爱好？", "596d8c6a01ec", "Biasanya saya main bulutangkis di lapangan dekat kantor.", "我通常在公司附近的球场打。", "2138b12618f0"], ["Anda berasal dari mana?", "你来自哪里？", "e062b94fb0bb", "Saya berasal dari 【……】, Tiongkok.", "我来自中国【……】。", "a5ed3c4ba592"], ["Di mana keluarga kamu tinggal sekarang?", "你的家人现在住在哪里？", "c28d84486367", "Sekarang keluarga saya tinggal di 【……】, Tiongkok.", "我家人现在住在中国【……】。", "3a2396ea632c"], ["Berapa umur ayah Anda?", "你爸爸多大年纪了？", "5a3835f7bacb", "Umur ayah saya lima puluh tahun.", "我爸爸五十岁。", "ff7957947b53"], ["Apa pekerjaan ibu kamu?", "你妈妈做什么工作？", "2461b5e30615", "Ibu saya seorang guru.", "我妈妈是老师。", "db1eebda717d"], ["Di mana ayah kamu bekerja?", "你爸爸在哪里工作？", "bf042e32ee7a", "Ayah saya bekerja di sebuah pabrik di 【……】.", "我爸爸在【……】的一家工厂工作。", "2b9601fe0291"], ["Apa yang kamu suka lakukan saat hari libur?", "休息日你喜欢做什么？", "ca2cbed89710", "Saat hari libur, saya suka tidur dan jalan-jalan ke mal.", "休息日我喜欢睡觉和逛商场。", "734d1330dd1b"], ["Apa hal pertama yang kamu lakukan setelah bangun setiap pagi?", "你每天早上起床后第一件事做什么？", "8f9d0e882a60", "Hal pertama yang saya lakukan adalah minum air putih.", "我做的第一件事是喝白开水。", "4b1f8f914c14"], ["Apakah kamu suka pergi ke konser musik?", "你喜欢去音乐会吗？", "e38351196602", "Suka, tapi saya jarang pergi karena sibuk.", "喜欢，但因为忙很少去。", "204fcf020088"], ["Kapan kamu biasanya membaca buku?", "你通常什么时候读书？", "2d9759f3fce4", "Saya biasanya membaca buku pada malam hari sebelum tidur.", "我通常晚上睡前读书。", "c23e0cece549"], ["Kamu main bulutangkis sudah berapa lama?", "你打羽毛球多久了？", "fb3eb0875070", "Saya sudah main bulutangkis selama lima tahun.", "我打羽毛球五年了。", "34713bab8725"], ["Apakah Anda sudah menikah?", "你结婚了吗？", "682bacdb4ebe", "Belum, saya belum menikah. / Sudah, saya sudah menikah.", "还没有。/ 已经结婚了。", "5b0feba4ce8f"], ["Siapa nama ayah kamu?", "你爸爸叫什么名字？", "d27ef6e56be1", "Nama ayah saya 【……】.", "我爸爸叫【……】。", "57d79c7e64ab"], ["Sebutkan nama lengkap kamu!", "请说出你的全名。", "10a46180344a", "Nama lengkap saya 【……】.", "我的全名是【……】。", "d214789b5636"], ["Biasanya di rumah kamu siapa yang masak?", "你家里通常谁做饭？", "7355cbbbfbec", "Biasanya ibu saya yang masak.", "通常是我妈妈做饭。", "fc68662a0779"], ["Makanan kesukaan kamu apa?", "你最喜欢的食物是什么？", "879597755ead", "Makanan kesukaan saya nasi goreng.", "我最喜欢的食物是炒饭。", "9203f37d6e7b"], ["Kamu bilang hobi kamu main bulu tangkis. Biasanya kamu main di mana?", "你说你的爱好是打羽毛球，你通常在哪里打？", "f5c964d1b768", "Biasanya saya main bulu tangkis di lapangan dekat mes.", "我通常在宿舍附近的球场打。", "aca7ab9609d4"], ["Siapa nama istri kamu?", "你妻子叫什么名字？", "d68c51836a69", "Nama istri saya 【……】.", "我妻子叫【……】。", "e8b03241b475"], ["Berapa umur anak laki-laki kamu?", "你儿子几岁？", "63c6b5192704", "Umur anak laki-laki saya delapan tahun.", "我儿子八岁。", "9dd4f9f90e62"], ["Apakah kamu punya hobi lain?", "你还有别的爱好吗？", "423462ffc935", "Ada. Selain itu, saya juga suka mendengarkan musik.", "有。除此之外，我还喜欢听音乐。", "16f88c0cea96"], ["Berapa umur ibu kamu?", "你妈妈多大年纪？", "5b85e6ca55d5", "Umur ibu saya lima puluh satu tahun.", "我妈妈五十一岁。", "0a8a547cdb3a"], ["Apa pekerjaan kamu setiap hari?", "你每天的工作是什么？", "283de85af29b", "Setiap hari saya membuat laporan keuangan di kantor.", "我每天在办公室做财务报表。", "03d92c1e19fc"]]}, {"t": "饮食 Makanan", "b": "武功秘籍", "q": [["Apa makanan favorit / kesukaan Anda?", "你最喜欢的食物是什么？", "f5c31a33be69", "Makanan favorit saya nasi goreng dan sate ayam.", "我最喜欢的食物是炒饭和鸡肉沙爹。", "e5a5c332ca87"], ["Apakah Anda bisa memasak?", "你会做饭吗？", "351ebefee9bc", "Bisa, saya bisa memasak masakan Tiongkok yang sederhana.", "会，我会做简单的中国菜。", "3986d1e7d28c"], ["Anda lebih suka makan di rumah atau di restoran?", "你更喜欢在家吃还是在餐厅吃？", "2601a87ac397", "Saya lebih suka makan di rumah karena lebih sehat dan murah.", "我更喜欢在家吃，因为更健康也更便宜。", "db7b870a1a6a"], ["Apa buah kesukaan Anda?", "你最喜欢什么水果？", "e3222c451313", "Buah kesukaan saya mangga dan durian.", "我最喜欢的水果是芒果和榴莲。", "4b15c70721a3"], ["Anda biasanya minum teh atau kopi di pagi hari?", "你早上通常喝茶还是咖啡？", "3143cd253302", "Saya biasanya minum kopi di pagi hari.", "我早上通常喝咖啡。", "805c8b9b9c5d"]]}, {"t": "家庭 Keluarga", "b": "武功秘籍", "q": [["Bolehkah Anda memperkenalkan anggota keluarga Anda?", "可以介绍一下你的家庭成员吗？", "5d470edcfe97", "Boleh. Keluarga saya ada empat orang: ayah, ibu, adik laki-laki, dan saya.", "可以。我家有四口人：爸爸、妈妈、弟弟和我。", "cb6eaae4c2ed"], ["Apa pekerjaan ayah Anda?", "你爸爸做什么工作？", "2f40c7a84c01", "Ayah saya bekerja sebagai guru.", "我爸爸是老师。", "e1989584ca70"], ["Apakah Anda punya kakak atau adik?", "你有哥哥姐姐或弟弟妹妹吗？", "69f7bdae3620", "Ya, saya punya satu adik laki-laki. / Tidak, saya anak tunggal.", "有，我有一个弟弟。/ 没有，我是独生子女。", "f3f8b79ba939"], ["Di mana keluarga Anda tinggal?", "你的家人住在哪里？", "57a89fc9307e", "Keluarga saya tinggal di 【……】, Tiongkok.", "我的家人住在中国【……】。", "27fe3b198396"], ["Apa yang Anda lakukan bersama keluarga pada hari libur / hari Minggu?", "假期 / 周末你和家人一起做什么？", "03973aeccb69", "Saya makan bersama dan jalan-jalan ke taman bersama keluarga.", "我和家人一起吃饭，去公园散步。", "118372c498c0"]]}, {"t": "作息与计划 Rutinitas & Rencana", "b": "武功秘籍", "q": [["Pukul berapa biasanya Anda bangun tidur?", "你通常几点起床？", "a77ee9ee450f", "Saya biasanya bangun pukul enam pagi.", "我通常早上六点起床。", "2113575b0e08"], ["Apa aktivitas pertama Anda di pagi hari?", "你早上的第一件事是做什么？", "5acdafb477ae", "Aktivitas pertama saya di pagi hari adalah minum air putih.", "我早上第一件事是喝白开水。", "01f1ec3f070f"], ["Apakah Anda pergi ke kampus atau kantor setiap hari?", "你每天去学校或办公室吗？", "9ab3c0f11900", "Ya, saya pergi ke kantor setiap hari kecuali hari Minggu.", "是的，除了星期天我每天都去办公室。", "02e2722907db"], ["Apa yang sering Anda lakukan pada sore hari?", "你下午常做什么？", "5c4249f0aff4", "Pada sore hari saya sering bekerja di kantor.", "下午我通常在办公室工作。", "a91d77749dc5"], ["Kapan Anda mulai belajar bahasa Indonesia?", "你什么时候开始学印尼语的？", "8a8515f3d096", "Saya mulai belajar bahasa Indonesia dua bulan yang lalu.", "我两个月前开始学印尼语。", "84dcdffb0f57"], ["Apa rencana Anda untuk akhir pekan ini?", "你这周末有什么计划？", "c34eace7ed0f", "Akhir pekan ini saya mau istirahat di rumah.", "这周末我想在家休息。", "7d928cc9df2d"], ["Apakah Anda akan pergi liburan bulan depan?", "你下个月要去旅游吗？", "3079bb4709ab", "Tidak, bulan depan saya harus bekerja.", "不去，下个月我要工作。", "0edf0441894e"], ["Kapan ulang tahun Anda?", "你的生日是什么时候？", "618b615d41b5", "Ulang tahun saya tanggal 【lima Mei】.", "我的生日是【5月5日】。", "7770f19bee92"], ["Pukul berapa Anda biasanya tidur malam?", "你晚上通常几点睡？", "cbc2c28ae7c7", "Saya biasanya tidur pukul sepuluh malam.", "我通常晚上十点睡。", "926df29d372f"], ["Besok Anda mau melakukan apa?", "你明天要做什么？", "b48b4f122508", "Besok saya mau bekerja di kantor.", "明天我要去办公室上班。", "6402813465fd"], ["Apa yang Anda lakukan ketika merasa lelah?", "你感到累的时候会做什么？", "5dc1572f6f1b", "Ketika merasa lelah, saya akan tidur atau mendengarkan musik.", "累的时候我会睡觉或者听音乐。", "2e2f53ed1af5"], ["Apa yang Anda lakukan agar tetap sehat?", "你做什么来保持健康？", "50172edfe5d4", "Agar tetap sehat, saya berolahraga dan tidur cukup.", "为了保持健康，我运动、睡够觉。", "566a0103ff11"], ["Apa yang biasanya Anda lakukan pada pagi hari?", "你早上通常做什么？", "432fcb753b92", "Pada pagi hari saya biasanya mandi, sarapan, lalu pergi ke kantor.", "早上我通常洗澡、吃早饭，然后去办公室。", "ae5c94359c8e"]]}, {"t": "购物 Belanja", "b": "武功秘籍", "q": [["Di mana Anda biasanya berbelanja kebutuhan sehari-hari?", "你通常在哪里买日常用品？", "6cf4fd7b9748", "Saya biasanya berbelanja di supermarket atau Indomaret.", "我通常在超市或 Indomaret 便利店买。", "ee5a82135f04"], ["Kapan Anda biasanya pergi berbelanja?", "你通常什么时候去购物？", "bcc8b1b77dc1", "Saya biasanya pergi berbelanja pada akhir pekan.", "我通常周末去购物。", "39d6bdced883"], ["Apakah Anda suka pergi ke pasar tradisional?", "你喜欢去传统市场吗？", "6be0136d258a", "Suka, karena di sana harganya murah dan buahnya segar.", "喜欢，因为那里价格便宜、水果新鲜。", "3fbe4a0b3893"], ["Barang apa yang paling sering Anda beli?", "你最常买什么东西？", "9bca08982803", "Saya paling sering membeli susu, buah, dan air minum.", "我最常买牛奶、水果和饮用水。", "15434dc16b9e"], ["Apakah Anda suka membeli buah? Buah apa?", "你喜欢买水果吗？什么水果？", "39d16f5c9a3e", "Suka. Saya sering membeli pisang dan durian.", "喜欢。我常买香蕉和榴莲。", "19803b06d5a4"]]}, {"t": "个人情况 Tentang Diri", "b": "武功秘籍", "q": [["Kamu berasal dari mana?", "你来自哪里？", "d8ee13a1c46a", "Saya berasal dari 【……】, Tiongkok.", "我来自中国【……】。", "a5ed3c4ba592"], ["Sebutkan salah satu hobi kamu!", "说出你的一个爱好！", "815a1febcc32", "Salah satu hobi saya adalah berenang.", "我的爱好之一是游泳。", "cb8bb4d915c2"], ["Apa pekerjaan kamu?", "你的工作/岗位是什么？", "e803a66fd160", "Saya bekerja sebagai staf keuangan.", "我是财务人员。", "190dfb43d749"], ["Kamu punya berapa saudara?", "你有几个兄弟姐妹？", "09f36bc87700", "Saya punya satu kakak perempuan.", "我有一个姐姐。", "2da34c6724be"], ["Bagaimana kamu pergi ke tempat kerja?", "你怎么去上班？", "f2a4d4e8940e", "Saya pergi ke tempat kerja naik mobil kantor. / Saya jalan kaki.", "我坐公司的车去上班。/ 我走路去。", "ee13b7d2a4d3"], ["Apa yang pertama kamu lakukan setelah bangun tidur?", "你起床后第一件事做什么？", "7f870bd66df9", "Setelah bangun tidur, saya langsung mandi.", "起床后我马上洗澡。", "6ac5b067a59b"], ["Apakah kamu suka menonton televisi? Kamu biasanya menonton acara apa?", "你喜欢看电视吗？通常看什么节目？", "de77a89e48bd", "Suka, saya biasanya menonton berita dan film.", "喜欢，我通常看新闻和电影。", "c2adbdd531cf"], ["Apa yang Anda lakukan jika teman kerja Anda tidak mengerti perkataan Anda?", "如果同事听不懂你说的话，你会怎么做？", "09b6c9694e4b", "Saya akan menjelaskan lagi dengan pelan-pelan, atau memakai aplikasi terjemahan.", "我会慢慢再解释一遍，或者用翻译软件。", "3b7cdf39bf15"], ["Apa yang paling sulit ketika belajar bahasa Mandarin?", "学中文的时候什么最难？", "ce01eacb2c4a", "Yang paling sulit adalah menulis huruf Mandarin.", "最难的是写汉字。", "c8b6637d3c5d"], ["Apa yang biasanya Anda lakukan di tempat kerja?", "你在工作的地方通常做什么？", "3111bd152676", "Di tempat kerja, saya biasanya membuat laporan dan memeriksa dokumen.", "在单位我通常做报表、检查文件。", "bce3bf1a06e3"], ["Apa yang Anda lakukan untuk belajar bahasa Indonesia dengan lebih baik?", "为了把印尼语学得更好，你会做什么？", "b5ee14bbb944", "Saya sering berbicara dengan teman kerja orang Indonesia dan mendengarkan lagu Indonesia.", "我常和印尼同事说话，听印尼歌。", "2a2008e635ce"]]}, {"t": "住房 Rumah", "b": "武功秘籍", "q": [["Di mana Anda tinggal?", "你住在哪里？", "26d4fe472597", "Saya tinggal di mes (asrama) perusahaan.", "我住在公司宿舍。", "59ab518e9172"], ["Apakah rumah Anda besar atau kecil?", "你的房子大还是小？", "963f8ff68262", "Rumah saya tidak terlalu besar, tapi nyaman.", "我的房子不太大，但很舒适。", "82b3b93eee0a"], ["Ada berapa kamar tidur di rumah Anda?", "你家有几间卧室？", "922cc6064e76", "Di rumah saya ada tiga kamar tidur.", "我家有三间卧室。", "ac845282172e"], ["Apa warna dinding rumah Anda?", "你家墙壁是什么颜色？", "545591397f3c", "Dinding rumah saya berwarna putih.", "我家的墙是白色的。", "eba46d037549"], ["Apakah ada taman di dekat rumah Anda?", "你家附近有公园/花园吗？", "e6d999df1bc0", "Ada, ada taman kecil di dekat rumah saya.", "有，我家附近有一个小公园。", "7328d0856dd0"]]}, {"t": "爱好与休闲 Hobi & Waktu Luang", "b": "武功秘籍", "q": [["Apa hobi Anda?", "你的爱好是什么？", "f4a8b1f70c4a", "Hobi saya membaca buku dan berenang.", "我的爱好是看书和游泳。", "bd53c52c6b3e"], ["Di mana biasanya Anda melakukan hobi Anda?", "你通常在哪里做你的爱好？", "bc4d2230db65", "Biasanya saya membaca di kamar dan berenang di kolam renang.", "我通常在房间看书，在游泳池游泳。", "c8806f1053e6"], ["Hobi Anda membaca? Anda suka membaca buku apa?", "你爱读书吗？喜欢读什么书？", "e5d878da8359", "Ya, saya suka membaca buku cerita.", "是的，我喜欢读故事书。", "27455d7adbb2"], ["Dengan siapa Anda biasanya menghabiskan waktu luang?", "你通常和谁一起度过空闲时间？", "0b0e51ec1a7f", "Saya biasanya menghabiskan waktu luang bersama teman-teman.", "我通常和朋友们一起度过空闲时间。", "fcdccaea95a8"], ["Apakah Anda suka mendengarkan musik?", "你喜欢听音乐吗？", "2bf91d37786e", "Suka, saya suka mendengarkan musik pop.", "喜欢，我喜欢听流行音乐。", "f8041aaeb87c"], ["Jika cuaca bagus, apa yang ingin Anda lakukan?", "如果天气好，你想做什么？", "d60ff985d832", "Jika cuaca bagus, saya ingin jalan-jalan ke pantai.", "如果天气好，我想去海边走走。", "2534e1df2da1"], ["Apa yang biasanya Anda bicarakan dengan teman?", "你平时和朋友聊什么？", "189db99ca7bf", "Biasanya saya bicara tentang pekerjaan dan makanan dengan teman.", "我平时和朋友聊工作和吃的。", "5eaf2776b22e"], ["Bisakah Anda menyebutkan satu hobi Anda?", "你能说一个你的爱好吗？", "aa738473e629", "Salah satu hobi saya adalah main bulu tangkis.", "我的爱好之一是打羽毛球。", "06617ec11f91"]]}, {"t": "家庭日常 Kegiatan di Rumah", "b": "武功秘籍", "q": [["Apa yang biasanya Anda lakukan setelah bangun tidur?", "你起床后通常做什么？", "381d97a2a6e2", "Setelah bangun tidur, saya mandi lalu sarapan.", "起床后我洗澡，然后吃早餐。", "7b3699b878e1"], ["Apakah Anda suka menonton televisi? Acara apa yang Anda suka?", "你喜欢看电视吗？喜欢什么节目？", "7471d804d111", "Suka, saya suka menonton film dan berita.", "喜欢，我喜欢看电影和新闻。", "3d9eb3b86b9f"], ["Siapa yang biasanya memasak di rumah Anda?", "你家通常谁做饭？", "4205d6debcfa", "Biasanya ibu saya yang memasak.", "通常是我妈妈做饭。", "f40c90ed0419"], ["Apakah Anda sering membantu m 尼语不太难，但是词汇很多。", "b5c5551dc831"], ["Bagaimana cara Anda belajar bahasa Indonesia?", "你怎么学印尼语？", "0b14f6c012b2", "Saya menghafal kosakata setiap pagi dan mendengarkan percakapan.", "我每天早上背单词，还听对话。", "8ad2d1e6e71d"], ["Apakah Anda sering berbicara bahasa Indonesia?", "你经常说印尼语吗？", "8cc73ea227ff", "Ya, saya sering berbicara dengan teman kantor saya.", "是的，我经常和办公室的同事说。", "d743f9e96fd4"]]}, {"t": "在印尼生活 Tinggal di Indonesia", "b": "扩充题库", "q": [["Sudah berapa lama Anda tinggal di Indonesia?", "你在印尼住了多久了？", "978c27bf1e23", "Saya sudah tinggal di Indonesia selama satu tahun.", "我在印尼住了一年了。", "516f152a4aca"], ["Apakah Anda suka tinggal di Indonesia?", "你喜欢住在印尼吗？", "c1e02062b89f", "Ya, saya suka karena orang Indonesia ramah.", "喜欢，因为印尼人很友善。", "5741692f1cd1"], ["Apa perbedaan Indonesia dan Tiongkok?", "印尼和中国有什么不同？", "fb9b6bc7d062", "Cuaca di Indonesia lebih panas dan makanannya lebih pedas.", "印尼天气更热，食物更辣。", "8e8ecd85caae"], ["Apa yang paling Anda sukai di Indonesia?", "你在印尼最喜欢什么？", "8fd23a27d5d5", "Saya paling suka pantainya yang indah.", "我最喜欢这里美丽的海滩。", "acb5e8dc2421"], ["Apakah Anda sudah terbiasa dengan makanan Indonesia?", "你习惯印尼的食物了吗？", "927645a07398", "Sudah, tetapi saya masih belum bisa makan terlalu pedas.", "习惯了，但我还是不能吃太辣。", "7c26b987e08b"], ["Kota mana di Indonesia yang ingin Anda kunjungi?", "你想去印尼的哪个城市？", "735a3b2460fe", "Saya ingin mengunjungi Bali dan Yogyakarta.", "我想去巴厘岛和日惹。", "2a53c0a576f7"]]}, {"t": "天气 Cuaca", "b": "扩充题库", "q": [["Bagaimana cuaca hari ini?", "今天天气怎么样？", "ff9ee619d7d0", "Hari ini cuacanya cerah dan panas.", "今天天气晴朗，很热。", "54c4aac4bc38"], ["Anda lebih suka cuaca panas atau dingin?", "你更喜欢热天还是冷天？", "a41c5641ec5f", "Saya lebih suka cuaca dingin karena tidak berkeringat.", "我更喜欢冷天，因为不会出汗。", "25172284cb27"], ["Ada berapa musim di Indonesia?", "印尼有几个季节？", "db6f9ba9ec64", "Ada dua musim, yaitu musim hujan dan musim kemarau.", "有两个季节，就是雨季和旱季。", "953e89f74e36"], ["Apa yang Anda lakukan kalau hujan?", "下雨的时候你做什么？", "1c3380414c34", "Kalau hujan, saya tin function mergeProg(a, b) {           // a = 本机, b = 云端；按每个词的修改时间 t 取新的
  if (!b || !b.w) return a;
  const tw = s => (s.t || 0) * 1e3 + (s.r || 0) + (s.x || 0);
  for (const k in b.w) if (!a.w[k] || tw(b.w[k]) > tw(a.w[k])) a.w[k] = b.w[k];
  for (const d in b.days || {}) {
    const x = a.days[d], y = b.days[d];
    if (!x) { a.days[d] = y; continue; }
    for (const f in y) if (typeof y[f] === "number") x[f] = Math.max(x[f] || 0, y[f]);
    if (y.nk) x.nk = [...new Set([...(x.nk || []), ...y.nk])];
  }
  a.sentSeen = Object.assign({}, b.sentSeen, a.sentSeen);
  a.clozeDone = Object.assign({}, b.clozeDone, a.clozeDone);
  if ((b.st || 0) > (a.st || 0)) { a.book = b.book; a.newPerDay = b.newPerDay; a.dictPerDay = b.dictPerDay; a.examDate = b.examDate || ""; a.st = b.st; }

}

function options(k) {                 // 返回 4 个词：正确的 + 3 个释义不同的干扰词

  $("#optIz").textContent = tr ? "印译中" : "先印尼语 → 中文";
  $("#lblGap").textContent = ex ? "留给你回答的时间" : "停顿";
  document.querySelectorAll('[data-wset="gap"] button').forEach(b => b.textContent = ex ? { s: "3 秒", m: "6 秒", l: "9 秒" }[b.dataset.v] : { s: "短", m: "中", l: "长" }[b.dataset.v]);
}
function paintSet() {
  document.querySelectorAll("[data-wset]").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(S.walk[g.dataset.wset]) === b.dataset.v)));
}
function walkDraw(swap) {
  const it = W.items[W.i], box = $("#wnow"); if (!box) return;
  const st = W.steps[W.si], ph = st ? st.k : (S.walk.order === "iz" ? "id" : "zh");
  const heard = k => !W.on && !W.si ? false : S.walk.order === "iz" ? (k === "id" || ph === "zh") : (k === "zh" || ph === "id");
  if (it && it.qa) {
    const ansShown = ph === "a" && (W.on || W.si);
    const thinking = st && st.think && W.on;
    box.innerHTML = `<div class="wtop"><span>${W.i + 1} / ${W.items.length} · ${esc(it.g)}</span><span class="wphase"><button type="button" data-wph="q" class="${ph === "q" ? "on" : ""}" aria-label="再听一遍问题">问题</button><button type="button" data-wph="a" class="${ph === "a" ? "on" : ""}" aria-label="直接听参考回答">参考回答</button></span></div>
      <div class="wbody${swap ? " swap" : ""}"><div class="wid s">${esc(it.id)}</div><div class="wzh">${esc(it.zh)}</div>
      <div class="wthink">${thinking ? "轮到你回答了…" : ""}</div>
      <div class="wans ${ansShown ? "" : "blur"}" data-unblur><div class="wid s">${esc(it.ans)}</div><div class="wzh">${esc(it.az)}</div></div></div>`;
  } else if (!it) { box.innerHTML = `<div class="wbody"><p class="empty">${S.walk.src === "fav" ? "还没有收藏的词。去词典或背词时点 ☆ 收藏。" : "这里还没有内容，先去背几个词吧。"}</p></div>`; }
  else {
    const idHtml = it.r ? `<div class="wid s">${esc(it.id)}</div><div class="wtext">${esc(it.text)}</div>` : `<div class="wid${it.s ? " s" : ""}">${esc(it.id)}</div>${it.ipa ? `<div class="ipa">[${esc(it.ipa)}]</div>` : ""}`;
    const blurId = S.walk.order === "zi" && !heard("id"), blurZh = S.walk.order === "iz" && !heard("zh");
    box.innerHTML = `<div class="wtop"><span>${W.i + 1} / ${W.items.length}${it.g ? " · " + esc(it.g) : ""}</span><span class="wphase"><button type="button" data-wph="id" class="${ph === "id" ? "on" : ""}" aria-label="再听一遍印尼语">印尼语</button><button type="button" data-wph="zh" class="${ph === "zh" ? "on" : ""}" ${it.za ? "" : "disabled"} aria-label="直接听中文">中文</button></span></div>
      ${it.g ? "" : ""}<div class="wbody${swap ? " swap" : ""}"><div class="${blurId ? "blur" : ""}" data-unblur>${idHtml}</div><div class="wzh${it.r ? " p" : ""} ${blurZh ? "blur" : ""}" data-unblur>${esc(it.zh)}${it.za ? "" : ' <small style="color:var(--muted)">（没有中文音频）</small>'}</div></div>
      ${it.k ? favBtn(it.k) : ""}`;
  }
  $("#wplay").innerHTML = W.on ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  $("#wplay").setAttribute("aria-label", W.on ? "暂停" : "播放");
  $("#wprog").style.width = (W.items.length ? (W.i + 1) / W.items.length * 100 : 0) + "%";
  const q = $("#wq");
  if (q && (swap || !q.innerHTML)) {
    const n = Math.min(W.items.length, Math.max(W.shown, W.i + 10));
    q.innerHTML = W.items.slice(0, n).map((x, i) => `<button type="button" data-wi="${i}" class="${i === W.i ? "on" : ""}"><i>${i + 1}</i><b>${esc(x.id)}</b><small>${esc(x.qa ? x.ans : x.zh)}</small></button>`).join("") + (W.items.length > n ? `<button type="button" class="more" data-wmore>还有 ${W.items.length - n} 个，显示更多</button>` : "");
    q.hidden = !W.items.length;
  }
}
function walkPlay(i, si) {
  W.i = i; W.steps = stepsOf(W.items[i]); W.si = si || 0; W.on = true;
  walkDraw(!si); walkMeta(); walkStep();
}
function walkStep() {
  if (!W.on) return;
  const st = W.steps[W.si];
  if (!st) {
    return walkPlay(S.walk.loop === "one" ? W.i : (W.i + 1) % W.items.length);
  }
  au.onended = () => { W.si++; walkStep(); };
  au.onerror = () => { W.si++; walkStep(); };
  au.src = st.g ? silentUrl(st.g) : "audio/" + st.a + ".mp3";
  au.playbackRate = st.g ? 1 : st.r;
  au.play().catch(e => { if (e && e.name === "AbortError") return; W.on = false; walkDraw(); });   // 换下一段时被取消不算停止
  const prev = W.steps[W.si - 1];
  if (!prev || prev.k !== st.k || st.think || (prev && prev.think)) walkDraw(false);
}
function walkPause() { W.on = false; au.pause(); walkDraw(); if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; }
function walkStop() { W.on = false; au.pause(); }
function walkOff() { if (W.active) { W.active = false; W.on = false; } }
function walkMeta() {
  if (!("mediaSession" in navigator)) return;
  const it = W.items[W.i];
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: it.id, artist: (it.zh || "").slice(0, 60), album: "印尼语随身听 · " + (WSRC.find(x => x[0] === S.walk.src) || [0, ""])[1] });
    navigator.mediaSession.playbackState = "playing";
    navigator.mediaSession.setActionHandler("play", () => walkPlay(W.i, W.si));
    navigator.mediaSession.setActionHandler("pause", walkPause);
    navigator.mediaSession.setActionHandler("nexttrack", () => walkPlay((W.i + 1) % W.items.length));
    navigator.mediaSession.setActionHandler("previoustrack", () => walkPlay((W.i - 1 + W.items.length) % W.items.length));
  } catch (e) {}
}
document.addEventListener("click", e => {
  if (!W.active) return;
  const s = e.target.closest("[data-wsrc]"); if (s) { S.walk.src = s.dataset.wsrc; save(); document.querySelectorAll("[data-wsrc]").forEach(b => b.setAttribute("aria-pressed", b === s)); paintSrc(); return walkLoad(W.on); }
  const o = e.target.closest("[data-wset] button");
  if (o) { const g = o.parentElement.dataset.wset; S.walk[g] = g === "rep" ? +o.dataset.v : o.dataset.v; save(); paintSet(); if (W.items[W.i]) { W.steps = stepsOf(W.items[W.i]); W.si = Math.min(W.si, W.steps.length - 1); } walkDraw(); return; }
  const wc = e.target.closest("[data-wcat]");
  if (wc) { S.walk.cat[S.walk.src] = wc.dataset.wcat; save(); paintSrc(); return walkLoad(W.on); }
  const ph = e.target.closest("[data-wph]");
  if (ph && W.items[W.i]) {                 // 点「印尼语」重听印尼语，点「中文」直接跳到中文
    const steps = stepsOf(W.items[W.i]), j = steps.findIndex(s => s.k === ph.dataset.wph && s.a);
    if (j >= 0) { W.steps = steps; W.si = j; W.on = true; if (ph.dataset.wph === "zh") document.querySelectorAll("#wnow .blur").forEach(b => b.classList.remove("blur")); walkDraw(); walkMeta(); walkStep(); }
    return;
  }
  const qi2 = e.target.closest("[data-wi]"); if (qi2) return walkPlay(+qi2.dataset.wi);
  if (e.target.closest("[data-wmore]")) { W.shown += 100; $("#wq").innerHTML = ""; return walkDraw(); }
  const ub = e.target.closest("[data-unblur].blur"); if (ub) ub.classList.remove("blur");
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-book]");
  if (b) { S.book = b.dataset.book; S.st = Date.now(); save(); route(); }
  const f = e.target.closest("[data-favk]");
  if (f && window.KFav) {
    const k = f.dataset.favk, w = L.words[k] || {};
    const on = KFav.toggle(k, { w: w.w || k, m: w.m || "", ipa: w.ipa || "", a: w.a || "", za: L.walk.wz[k] || "" });
    document.querySelectorAll(`[data-favk="${CSS.escape(k)}"]`).forEach(x => { x.setAttribute("aria-pressed", on); x.querySelector("span").textContent = on ? "已收藏" : "收藏"; x.classList.remove("burst"); if (on) { void x.offsetWidth; x.classList.add("burst"); } });
  }
});
au.addEventListener("ended", () => {});
KSync.onStatus(() => acctBox());
route();
cloudSync(true);
</script>
