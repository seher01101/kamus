8b2", "04ecc029e6dd", "09f89520f6ac", "4aca6bf0e80a", "6feba15cd5e8", "929cfb971557", "7bf8776737ce", "0165139fc14a", "ffdea84b4de3", "3161d5d43020", "26a3d3e3d31e", "90e719e24d7b", "1f4fb864e0e0"]}, {"title": "止泻药说明书", "text": "Obat Diare. Khasiat: 1. Mengurangi frekuensi buang air besar. 2. Menyerap racun penyebab diare. Komposisi: Tiap tablet (325 mg) mengandung activated charcoal (125 mg). Aturan pakai: 5—7 tablet per dosis. Maksimum 20 tablet/hari. Produksi: P.T. Eagle Indo Pharma.", "zh": "止泻药。功效：1. 减少排便次数；2. 吸附引起腹泻的毒素。成分：每片（325 毫克）含活性炭 125 毫克。用法：每次 5—7 片，每天最多 20 片。生产商：P.T. Eagle Indo Pharma。", "blanks": ["frekuensi", "khasiat", "mengurangi"], "a": ["07b647bd63d1", "de1ce389f10d", "1151414bddd9", null, "3e22c5551836", "2d76f80b4f28", "29217e97f010", "9d86f67b8b66", "1ac4d49ab1a4", "f0705cb2900c"]}, {"title": "Tohpati——印尼著名爵士吉他手", "text": "Tohpati Ario Hutomo atau yang lebih dikenal dengan Tohpati adalah seorang gitaris dan penulis lagu Indonesia. Dia lahir di Jakarta, 25 Juli 1971. Tohpati merupakan salah satu gitaris jazz yang terkenal. Banyak karyanya memadukan elemen kebudayaan tradisional. Hal itu sejalan dengan usahanya untuk memadukan unsur modern dan unsur tradisional dalam musiknya.", "zh": "Tohpati Ario Hutomo，更为人熟知的名字是 Tohpati，是印尼吉他手和词曲作者，1971 年 7 月 25 日生于雅加达。他是著名的爵士吉他手之一，很多作品融合了传统文化元素，这和他在音乐中融合现代与传统的追求是一致的。", "blanks": ["dikenal", "elemen", "kebudayaan", "sejalan", "unsur"], "a": ["b304a590af2e", "c3113c87eb52", "b387b8a6e6d6", "bf9b8a2df915", "a5ac7094c566"]}, {"title": "印尼最热门的十种职业", "text": "Bekerja merupakan kebutuhan setiap orang untuk memenuhi kebutuhan sehari-hari. Banyak orang mendapatkan pekerjaan sesuai dengan keinginannya, tetapi banyak juga yang memilih pekerjaan karena populer. Berikut sepuluh pekerjaan yang paling populer di Indonesia berdasarkan survei tahun 2018: guru, pegawai bank, pegawai negeri sipil (PNS), tenaga pemasaran (marketing), tenaga kerja Indonesia (TKI), tenaga di bidang teknologi informasi, tenaga di bidang kesehatan seperti dokter atau apoteker, wartawan, akuntan, dan karyawan Badan Usaha Milik Negara (BUMN).", "zh": "工作是每个人满足日常生活需要的方式。很多人找到了自己想做的工作，也有很多人因为某些职业热门而选择它。根据 2018 年的一项调查，印尼最热门的十种职业是：教师、银行职员、公务员、营销人员、海外劳工、信息技术人员、医疗人员（如医生、药剂师）、记者、会计师和国企员工。", "blanks": ["bank", "memenuhi", "memilih", "mendapatkan", "sipil", "survei", "tenaga"], "a": ["293cfc5078f4", "40d6f33a6b4c", "1cd0e1a76625"]}, {"title": "木梆 Kentongan", "text": "Pada zaman dahulu, sebelum membacakan pengumuman, masyarakat Indonesia lebih dahulu memukul kentongan. Fungsi kentongan ini adalah untuk menarik perhatian orang-orang supaya berkumpul. Setelah orang-orang berkumpul, pengumuman disampaikan. Saat ini, kentongan masih dipakai di beberapa daerah di Indonesia.", "zh": "古时候，印尼人宣读公告之前会先敲木梆，用来吸引大家注意、召集人们。人们聚齐后再宣布公告。现在印尼一些地区仍在使用木梆。", "blanks": ["disampaikan", "fungsi", "membacakan", "memukul"], "a": ["7d0960354893", "d0604ac32707", "1488763912fb", "843accb79ddf"]}, {"title": "网上购物", "text": "Pada zaman sekarang banyak orang gemar berbelanja melalui aplikasi belanja dalam jaringan (daring). Mereka menilai bahwa berbelanja melalui aplikasi daring lebih mudah. Dengan aplikasi itu, para pembeli tidak perlu datang ke toko atau pasar. Mereka hanya menunggu barang datang melalui jasa kurir.", "zh": "现在很多人喜欢用线上购物应用买东西，他们觉得网购更方便：买家不用去商店或市场，只要等快递把东西送来就行。", "blanks": ["bahwa", "jaringan", "jasa", "menilai"], "a": ["e95fd37e4ee6", "935299d84d04", "f6e8b7592905", "ee8b6f3429ba"]}, {"title": "仁当和炒饭", "text": "Cable News Network (CNN) telah merilis daftar lima puluh makanan terenak sedunia lewat 35.000 pilihan makanan di media sosial Facebook. Hasilnya, rendang khas Sumatera Barat kembali menduduki peringkat pertama. Menariknya, CNN melansir bukan hanya rendang, tetapi juga nasi goreng menempati peringkat kedua.", "zh": "美国有线电视新闻网（CNN）根据脸书上 35,000 个美食投票，发布了全球 50 种最美味食物榜单。结果，西苏门答腊的仁当再次名列第一。有意思的是，除了仁当，炒饭也排在了第二名。", "blanks": ["cable", "daftar", "merilis", "terenak"], "a": ["ef240a3f70e2", "601c7c23dfc8", "3ba0ce3aa190"]}, {"title": "互助合作 Gotong Royong", "text": "Salah satu budaya masyarakat Indonesia adalah gotong royong. Gotong royong berarti bekerja bersama-sama, tolong-menolong, dan bantu-membantu. Kegiatan gotong royong biasanya dilaksanakan pada akhir minggu. Masyarakat biasanya bergotong royong untuk membersihkan lingkungan dan membangun fasilitas umum.", "zh": "互助合作是印尼社会的一种文化，意思是大家一起干活、互相帮助。这类活动通常在周末进行，人们一起清扫环境、修建公共设施。", "blanks": ["bersama-sama", "membangun", "tolong-menolong"], "a": ["244f3fb3511d", "4945e5397f78", "8813b40cfef1", "6b1aad8165f4"]}, {"title": "无车日", "text": "Di Indonesia ada hari bebas kendaraan bermotor (Car Free Day). Acara itu biasanya dilaksanakan setiap hari Minggu pagi. Di beberapa jalan tertentu kendaraan bermotor dilarang melintas. Di sana orang-orang ada yang mengobrol, berdagang, berjalan-jalan, atau berolahraga. Salah satu kegiatan favorit orang-orang pada acara itu adalah bersepeda. Mereka dapat bersepeda dengan santai karena tidak ada kendaraan bermotor.", "zh": "印尼有“无车日”（Car Free Day），通常在每个星期天上午。一些特定道路禁止机动车通行，人们在那里聊天、摆摊、散步或运动。最受欢迎的活动之一是骑自行车，因为没有机动车，大家可以悠闲地骑车。", "blanks": ["bebas", "berdagang", "dilarang", "melintas", "mengobrol", "tertentu"], "a": ["27e71171f0c7", "d7f6ffd0fd29", "d2605b418c91", "2c883c5e3b96", "06e344605f72", "dba6a7b91e9f"]}, {"title": "人力三轮车 Becak", "text": "Becak adalah salah satu sarana transportasi unik di Indonesia. Becak adalah kendaraan roda tiga. Pengayuh duduk di belakang, sedangkan penumpang duduk di depan. Becak biasanya ada di depan kompleks perumahan atau di depan pasar. Ongkos naik becak berbeda-beda. Oleh karena itu, penumpang dan tukang becak harus membuat kesepakatan.", "zh": "Becak 是印尼一种独特的交通工具，是三轮车：车夫坐在后面蹬车，乘客坐在前面。Becak 通常停在住宅小区或市场门口。车费不固定，所以乘客和车夫要先讲好价钱。", "blanks": ["berbeda-beda", "ongkos", "pengayuh", "roda", "sarana"], "a": ["4478a128a4e7", "654ab46560ff", "450ea1d6b508", "b23a4c3dc27c", "10345a1d436e", "4e5653b9afdd"]}, {"title": "户外拓展 Mancakrida", "text": "Salah satu acara yang biasanya dilaksanakan di tempat wisata adalah mancakrida. Acara itu biasanya diikuti oleh keluarga dan pegawai di suatu kantor atau institusi. Kegiatan itu dilakukan untuk melatih berbagai macam keterampilan. Keterampilan yang menjadi fokus kegiatan itu adalah keterampilan dalam bekerja sama. Dalam kegiatan itu, peserta dapat berlatih sambil bersenang-senang.", "zh": "在旅游景点常举办的一种活动是户外拓展，参加者通常是家庭或某单位的员工，目的是锻炼各种能力，重点是团队合作能力。参加者可以边练边玩。", "blanks": ["diikuti", "fokus", "institusi", "mancakrida", "melatih"], "a": ["ba132c43e6ed", "136073c65777", "fc5e084cebda", "9a308a80d7a7", "315bb84f232d"]}, {"title": "刮痧 Kerokan", "text": "Salah satu pengobatan tradisional yang ada di Indonesia adalah kerokan. Kerokan adalah suatu metode pengobatan dengan cara menggesekkan benda tumpul pada tubuh. Cara itu dipercaya dapat menyembuhkan masuk angin, nyeri otot, perut kembung, mual, sakit kepala, dan meriang.", "zh": "刮痧是印尼的一种传统疗法，用钝器在身上刮擦。人们相信它能治着凉、肌肉酸痛、腹胀、恶心、头痛和发冷发热。", "blanks": ["dipercaya", "menggesekkan", "metode", "tumpul"], "a": ["f212b0955e16", "cb362f0fc433", "bdaad17ba981"]}]}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SPK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const au = $("#au");
function play(h, rate) { if (!h) return; au.src = "audio/" + h + ".mp3"; au.playbackRate = rate || 0.9; au.play().catch(() => {}); }

// ---------------- storage
const KEY = "kamus-learn-v1";
let S;
try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
S = Object.assign({ book: "1", newPerDay: 10, dictPerDay: 10, w: {}, days: {}, sentSeen: {}, clozeDone: {} }, S || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const day = () => (S.days[today()] = S.days[today()] || { nw: 0, rv: 0, dt: 0 });
const INT = [0, 1, 2, 4, 7, 15, 30, 60];

const book = () => L.books[S.book];
const learned = () => book().filter(k => S.w[k]);
const dueList = () => book().filter(k => S.w[k] && S.w[k].box < 7 && S.w[k].due <= today());
const mastered = () => book().filter(k => S.w[k] && S.w[k].box >= 5).length;
function streak() {
  let n = 0; const d = new Date();
  for (;;) { const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const x = S.days[k]; if (x && (x.nw + x.rv + x.dt) > 0) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function grade(k, ok) {
  const s = S.w[k] || { box: 0, due: today(), r: 0, x: 0 };
  const isNew = !S.w[k];
  if (ok) { s.box = Math.min(7, s.box + (isNew ? 2 : 1)); s.r++; } else { s.box = 1; s.x++; }
  s.due = addDays(INT[s.box]);
  S.w[k] = s; save();
}

// ---------------- router
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function route() {
  const h = (location.hash || "#today").slice(1);
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === (h.split("/")[0] === "words" ? "words" : h.split("/")[0] === "dict" ? "dict" : h === "today" ? "today" : "")));
  au.pause(); au.onended = null;
  if (h.startsWith("words")) return wordsHome();
  if (h === "dict/word") return dictWord();
  if (h === "dict/sent") return dictSent();
  if (h.startsWith("dict/cloze")) return h === "dict/cloze" ? clozeList() : clozeDo(+h.split("/")[2]);
  if (h.startsWith("dict")) return dictHome();
  return todayPage();
}
window.addEventListener("hashchange", route);
const bookSeg = () => `<div class="seg" role="group" aria-label="词书"><button type="button" data-book="1" aria-pressed="${S.book === "1"}">一级</button><button type="button" data-book="2" aria-pressed="${S.book === "2"}">二级</button></div>`;

// ---------------- today
function todayPage() {
  const d = day(), b = book(), due = dueList().length, lr = learned().length;
  const newLeft = Math.max(0, S.newPerDay - d.nw), dictLeft = Math.max(0, S.dictPerDay - d.dt);
  const pct = Math.round(lr / b.length * 100);
  $("#app").innerHTML = `
  <div class="top"><div><h1>今日</h1><p class="sub">${S.book === "1" ? "一级词书 · BIPA 1 + Daring + 武功秘籍" : "二级词书 · BIPA 2"}</p></div>${bookSeg()}</div>
  <div class="stats">
    <div class="stat glass"><b>${streak()}</b><span>连续天数</span></div>
    <div class="stat glass"><b>${lr}</b><span>已学 / ${b.length}</span></div>
    <div class="stat glass"><b>${mastered()}</b><span>已掌握</span></div>
    <div class="stat glass"><b>${due}</b><span>待复习</span></div>
  </div>
  <div class="bar" title="词书进度 ${pct}%"><i style="width:${pct}%"></i></div>
  <h2>今天要做的</h2>
  <div class="tasks">
    <a class="task glass ${newLeft + due === 0 ? "done" : ""}" href="#words"><span class="ic">${ICON.words}</span><span><b>背单词</b><small>新学 ${newLeft} 个 · 复习 ${due} 个 · 四选一</small></span><span class="go">${newLeft + due === 0 ? "✓ 完成" : "开始 ›"}</span></a>
    <a class="task glass ${dictLeft === 0 ? "done" : ""}" href="#dict/word"><span class="ic">${ICON.ear}</span><span><b>单词听写</b><small>今天还剩 ${dictLeft} 个</small></span><span class="go">${dictLeft === 0 ? "✓ 完成" : "开始 ›"}</span></a>
    <a class="task glass" href="#dict/sent"><span class="ic">${ICON.chat}</span><span><b>句子听写</b><small>听一句，写出印尼语</small></span><span class="go">开始 ›</span></a>
    <a class="task glass" href="#dict/cloze"><span class="ic">${ICON.text}</span><span><b>阅读填词</b><small>看中文，填课文里的考点词</small></span><span class="go">开始 ›</span></a>
  </div>
  <h2>设置</h2>
  <div class="set glass">
    <div class="row"><label for="np">每天新学单词</label><select id="np">${[5, 10, 15, 20, 30, 50].map(n => `<option ${n === S.newPerDay ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="row"><label for="dp">每天听写单词</label><select id="dp">${[5, 10, 15, 20, 30].map(n => `<option ${n === S.dictPerDay ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="row"><label>换手机 / 电脑时同步进度</label><span><button type="button" id="exp">导出进度</button> <button type="button" id="imp">导入进度</button></span></div>
  </div>
  <div id="sync"></div>
  <p class="sub" style="margin-top:14px">进度只存在这台设备的浏览器里。换设备时：旧设备点「导出进度」复制进度码，新设备点「导入进度」粘贴。</p>`;
  $("#np").onchange = e => { S.newPerDay = +e.target.value; save(); todayPage(); };
  $("#dp").onchange = e => { S.dictPerDay = +e.target.value; save(); todayPage(); };
  $("#exp").onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $("#sync").innerHTML = `<p class="sub" style="margin-top:12px">这是你的进度码，已尝试自动复制。没复制上的话，长按全选再复制：</p><textarea readonly id="code">${code}</textarea>`;
    const ta = $("#code"); ta.select();
    try { navigator.clipboard.writeText(code).catch(() => {}); } catch (e) {}
  };
  $("#imp").onclick = () => {
    $("#sync").innerHTML = `<p class="sub" style="margin-top:12px">把另一台设备导出的进度码粘贴到这里（会覆盖这台设备的进度）：</p><textarea id="code"></textarea><div class="row2"><button class="btn" type="button" id="doimp">确认导入</button></div>`;
    $("#doimp").onclick = () => {
      try { const x = JSON.parse(decodeURIComponent(escape(atob($("#code").value.trim())))); if (!x.w) throw 0; S = Object.assign(S, x); save(); todayPage(); }
      catch (e) { $("#sync").insertAdjacentHTML("beforeend", '<p class="sub" style="color:var(--bad)">进度码不对，请确认复制完整了。</p>'); }
    };
  };
}
const ICON = {
  words: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="13" height="16" rx="2.5"/><path d="M8 2h10.5A2.5 2.5 0 0 1 21 4.5V17"/></svg>',
  ear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8.5a6 6 0 1 1 12 0c0 3.5-3 4.5-3 7.5a3 3 0 0 1-5.5 1.7"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h7M15 12h5M4 18h16"/><rect x="11" y="10" width="4" height="4" rx="1"/></svg>'
};

// ---------------- words (四选一 + 遗忘曲线)
let Q = [], qi = 0, sessStat = { ok: 0, no: 0 };
function wordsHome() {
  const d = day();
  const due = shuffle(dueList());
  const newLeft = Math.max(0, S.newPerDay - d.nw);
  const fresh = book().filter(k => !S.w[k]).slice(0, newLeft);
  Q = [...due.map(k => ({ k, isNew: false })), ...fresh.map(k => ({ k, isNew: true }))];
  qi = 0; sessStat = { ok: 0, no: 0 };
  if (!Q.length) {
    $("#app").innerHTML = `<div class="top"><h1>背词</h1>${bookSeg()}</div><div class="card glass center"><div class="big">✓</div><p>今天的新词和复习都完成了。</p>
    <div class="row2" style="justify-content:center"><button class="btn" type="button" id="more">再学 ${S.newPerDay} 个新词</button><a class="btn ghost" href="#dict/word" style="text-decoration:none">去听写</a></div></div>`;
    $("#more").onclick = () => { day().nw -= S.newPerDay; save(); wordsHome(); };
    return;
  }
  showWord();
}
function options(k) {
  const pool = book().filter(x => x !== k);
  const picks = new Set();
  while (picks.size < 3 && pool.length) picks.add(L.words[pool[Math.floor(Math.random() * Math.min(pool.length, 900))]].m);
  const right = L.words[k].m;
  picks.delete(right);
  while (picks.size < 3) picks.add(L.words[pool[Math.floor(Math.random() * pool.length)]].m);
  return shuffle([right, ...[...picks].slice(0, 3)]);
}
function showWord() {
  if (qi >= Q.length) return wordsDone();
  const it = Q[qi], w = L.words[it.k];
  const opts = options(it.k);
  $("#app").innerHTML = `<div class="top"><h1>背词</h1>${bookSeg()}</div>
  <div class="card glass">
    <div class="prog"><span>${qi + 1} / ${Q.length}</span><div class="bar"><i style="width:${qi / Q.length * 100}%"></i></div><span>${it.isNew ? "新词" : "复习"}</span></div>
    <div class="word">${esc(w.w)}</div><div class="ipa">[${esc(w.ipa)}]</div>
    <div class="say"><button class="sayb" type="button" id="sy" aria-label="发音">${SPK}</button></div>
    <div class="opts">${opts.map((o, i) => `<button class="opt" type="button" data-o="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="det"></div>
    <button class="skip" type="button" id="kill">太简单了，标记为已掌握</button>
  </div>`;
  play(w.a);
  $("#sy").onclick = () => play(w.a);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = opts[+b.dataset.o] === w.m;
    document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (opts[+x.dataset.o] === w.m) x.classList.add("ok"); });
    if (!ok) b.classList.add("no");
    answer(it, ok);
  });
  $("#kill").onclick = () => { S.w[it.k] = { box: 7, due: addDays(365), r: 1, x: 0 }; if (it.isNew) day().nw++; else day().rv++; save(); qi++; showWord(); };
}
function answer(it, ok) {
  const w = L.words[it.k];
  const first = !it.retry;
  if (first) { grade(it.k, ok); if (it.isNew) day().nw++; else day().rv++; save(); }
  ok ? sessStat.ok++ : sessStat.no++;
  if (!ok) Q.push({ k: it.k, isNew: it.isNew, retry: true });
  $("#kill").remove();
  $("#det").innerHTML = `<div class="detail"><div class="m">${esc(w.m)}</div>${w.note ? `<div class="n">${esc(w.note)}</div>` : ""}
    ${w.ex ? `<div class="ex"><div class="i">${esc(w.ex[0])}</div>${w.ex[1] ? `<div class="z">${esc(w.ex[1])}</div>` : ""}</div>` : ""}
    <div class="row2"><button class="btn" type="button" id="nx">下一个 ›</button><a class="btn ghost" href="dict.html#${encodeURIComponent(it.k)}" style="text-decoration:none">查词典</a></div></div>`;
  $("#nx").onclick = () => { qi++; showWord(); };
  $("#nx").focus();
}
function wordsDone() {
  $("#app").innerHTML = `<div class="top"><h1>背词</h1>${bookSeg()}</div><div class="card glass center"><div class="big">${sessStat.ok}/${sessStat.ok + sessStat.no}</div>
  <p>本轮答对 ${sessStat.ok} 次。答错的词会在近几天更早再出现。</p><div class="row2" style="justify-content:center"><a class="btn" href="#dict/word" style="text-decoration:none">去听写</a><a class="btn ghost" href="#today" style="text-decoration:none">回今日</a></div></div>`;
}

// ---------------- dictation
function dictHome() {
  $("#app").innerHTML = `<div class="top"><div><h1>听写</h1><p class="sub">听音频写印尼语，或看中文填课文里的词</p></div>${bookSeg()}</div>
  <div class="modes">
    <a class="mode glass" href="#dict/word" style="text-decoration:none"><b>单词听写</b><small>今天 ${Math.max(0, S.dictPerDay - day().dt)} 个，优先考你学过的词</small></a>
    <a class="mode glass" href="#dict/sent" style="text-decoration:none"><b>句子听写</b><small>对话、问答里的句子，写出印尼语</small></a>
    <a class="mode glass" href="#dict/cloze" style="text-decoration:none"><b>阅读填词</b><small>课文考点词挖空，看中文填回去</small></a>
  </div>`;
}
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[.,!?;:"“”‘’'()—–]/g, " ").replace(/\s+/g, " ").trim();
function charDiff(a, b) { // a = user, b = answer ; returns html marking user's wrong chars
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { out += esc(a[i]); i++; j++; }
    else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { out += `<span class="miss">${esc(b[j])}</span>`; j++; }
    else { out += `<span class="x">${esc(a[i])}</span>`; i++; }
  }
  return out;
}
function wordDiff(a, b) {
  const A = a.split(" ").filter(Boolean), B = b.split(" ").filter(Boolean);
  const n = A.length, m = B.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = [];
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { out.push(`<span class="y">${esc(A[i])}</span>`); i++; j++; }
    else if (i < n && j < m && dp[i + 1][j + 1] >= Math.max(dp[i + 1][j], dp[i][j + 1])) { out.push(charDiff(A[i], B[j])); i++; j++; }
    else if (j < m && (i >= n || dp[i][j + 1] >= dp[i + 1][j])) { out.push(`<span class="miss">${esc(B[j])}</span>`); j++; }
    else { out.push(`<span class="x">${esc(A[i])}</span>`); i++; }
  }
  return out.join(" ");
}
let DQ = [], di = 0, dstat = { ok: 0, no: 0 };
function dictWord() {
  const n = Math.max(S.dictPerDay - day().dt, 0) || S.dictPerDay;
  const lr = shuffle(learned().filter(k => !L.words[k].w.includes(" ")));
  const pool = lr.length >= n ? lr : [...lr, ...book().filter(k => !S.w[k]).slice(0, n - lr.length)];
  DQ = pool.slice(0, n).map(k => ({ t: "w", k })); di = 0; dstat = { ok: 0, no: 0 };
  dictStep();
}
function dictSent() {
  const all = L.sents[S.book];
  const unseen = all.filter(s => !S.sentSeen[s[2]]);
  const pool = shuffle(unseen.length >= 10 ? unseen : all.slice());
  DQ = pool.slice(0, 10).map(s => ({ t: "s", s })); di = 0; dstat = { ok: 0, no: 0 };
  dictStep();
}
function dictStep() {
  if (di >= DQ.length) {
    $("#app").innerHTML = `<div class="top"><h1>听写</h1>${bookSeg()}</div><div class="card glass center"><div class="big">${dstat.ok}/${DQ.length}</div><p>本轮完成。</p>
    <div class="row2" style="justify-content:center"><button class="btn" type="button" id="again">再来一轮</button><a class="btn ghost" href="#dict" style="text-decoration:none">换一种</a></div></div>`;
    $("#again").onclick = () => DQ[0] && DQ[0].t === "s" ? dictSent() : dictWord();
    return;
  }
  const it = DQ[di];
  const aud = it.t === "w" ? L.words[it.k].a : it.s[2];
  const isS = it.t === "s";
  $("#app").innerHTML = `<div class="top"><h1>${isS ? "句子听写" : "单词听写"}</h1>${bookSeg()}</div>
  <div class="card glass">
    <div class="prog"><span>${di + 1} / ${DQ.length}</span><div class="bar"><i style="width:${di / DQ.length * 100}%"></i></div></div>
    <div class="say" style="margin-top:18px;gap:12px"><button class="sayb" type="button" id="sy" aria-label="再听一遍">${SPK}</button><button class="btn ghost" type="button" id="slow" style="padding:8px 14px;font-size:14px">慢速</button></div>
    ${isS ? `<textarea class="din" id="inp" placeholder="写下你听到的印尼语" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>` : `<input class="din" id="inp" placeholder="写下你听到的单词" autocapitalize="off" autocomplete="off" spellcheck="false">`}
    <div class="row2"><button class="btn" type="button" id="chk">检查</button><button class="btn ghost" type="button" id="giveup">不会，看答案</button></div>
    <div id="res"></div>
  </div>`;
  play(aud, isS ? 0.85 : 0.9);
  $("#sy").onclick = () => play(aud, isS ? 0.85 : 0.9);
  $("#slow").onclick = () => play(aud, 0.65);
  const inp = $("#inp"); inp.focus();
  inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ($("#nx") || $("#chk")).click(); } });
  const check = give => {
    const ans = isS ? it.s[0] : L.words[it.k].w;
    const u = norm(inp.value), a = norm(ans);
    const ok = !give && u === a;
    ok ? dstat.ok++ : dstat.no++;
    if (!isS) { day().dt++; if (!ok && S.w[it.k]) { S.w[it.k].box = Math.min(S.w[it.k].box, 1); S.w[it.k].due = addDays(1); } }
    else S.sentSeen[it.s[2]] = 1;
    save();
    const zh = isS ? it.s[1] : L.words[it.k].m;
    $("#res").innerHTML = `<div class="res ${ok ? "ok" : "no"}"><div class="h">${ok ? "✓ 完全正确" : give ? "正确答案" : "✗ 有错"}</div>
      ${!ok && u ? `<div class="diff">${isS ? wordDiff(u, a) : charDiff(u, a)}</div>` : ""}
      <div class="ans">${esc(ans)}</div><div class="zh">${esc(zh)}</div></div>
      <div class="row2"><button class="btn" type="button" id="nx">下一个 ›</button></div>`;
    $("#chk").remove(); $("#giveup").remove();
    $("#nx").onclick = () => { di++; dictStep(); };
    if (!isS) play(L.words[it.k].a);
  };
  $("#chk").onclick = () => check(false);
  $("#giveup").onclick = () => check(true);
}

// cloze
function clozeList() {
  const P = L.cloze[S.book];
  $("#app").innerHTML = `<div class="top"><div><h1>阅读填词</h1><p class="sub">选一篇课文，看中文把空着的考点词填回去</p></div>${bookSeg()}</div>
  <div class="list">${P.map((p, i) => `<a class="pick glass" href="#dict/cloze/${i}" style="text-decoration:none"><b>${esc(p.title)}</b><small>${S.clozeDone[S.book + i] ? "✓ " + S.clozeDone[S.book + i] : p.blanks.length + " 个空"}</small></a>`).join("")}</div>`;
}
function clozeDo(i) {
  const p = L.cloze[S.book][i]; if (!p) return clozeList();
  const blanks = new Set(p.blanks); let n = 0; const ans = [];
  const html = esc(p.text).replace(/[A-Za-z]+(?:-[A-Za-z]+)*/g, w => {
    if (blanks.has(w.toLowerCase())) { ans.push(w); return `<input data-i="${n++}" aria-label="第 ${n} 个空" autocapitalize="off" autocomplete="off" spellcheck="false">`; }
    return w;
  });
  $("#app").innerHTML = `<div class="top"><div><h1>阅读填词</h1><p class="sub">${esc(p.title)}</p></div><a class="btn ghost" href="#dict/cloze" style="text-decoration:none;padding:7px 14px;font-size:14px">‹ 列表</a></div>
  <div class="zhbox glass"><b>中文：</b>${esc(p.zh)}</div>
  <div class="card glass"><div class="cloze">${html}</div>
  <div class="row2"><button class="btn" type="button" id="chk">检查</button><button class="btn ghost" type="button" id="lis">听原文</button></div><div id="res"></div></div>`;
  let k = 0;
  $("#lis").onclick = () => { k = 0; const nxt = () => { if (k < p.a.length) { play(p.a[k++], 0.85); au.onended = nxt; } else au.onended = null; }; nxt(); };
  $("#chk").onclick = () => {
    let ok = 0;
    document.querySelectorAll(".cloze input").forEach(inp => {
      const a = ans[+inp.dataset.i], good = norm(inp.value) === norm(a);
      inp.classList.toggle("ok", good); inp.classList.toggle("no", !good);
      inp.nextElementSibling?.classList?.contains("fix") && inp.nextElementSibling.remove();
      if (good) ok++; else inp.insertAdjacentHTML("afterend", `<span class="fix">${esc(a)}</span>`);
    });
    S.clozeDone[S.book + i] = ok + "/" + ans.length; day().dt += 0; save();
    $("#res").innerHTML = `<div class="res ${ok === ans.length ? "ok" : "no"}"><div class="h">${ok === ans.length ? "✓ 全对" : `对了 ${ok} / ${ans.length} 个`}</div><div class="zh">绿色是对的；红色后面是正确答案，点「听原文」再听一遍。</div></div>`;
  };
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-book]");
  if (b) { S.book = b.dataset.book; save(); route(); }
});
au.addEventListener("ended", () => {});
route();
</script>
</html>
